# Supabase CLI config for apps/api. Minimal on purpose; the CLI fills in defaults.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "rep-api"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
# must match the hosted project's postgres major version. new hosted projects are 17.
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "capacitor://localhost", "http://localhost"]
# F13: long-lived sessions; never interrupt a study session to authenticate.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

# per-batch json built from the content bucket (SPEC §5.4). private; served via signed urls.
[storage.buckets.batches]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["application/json"]

[edge_runtime]
enabled = true
policy = "per_worker"

# ---------------------------------------------------------------------------
# functions. user-facing functions require a supabase jwt; provider webhooks cannot carry one
# and verify their own signatures instead (see supabase/functions/webhook-*/index.ts).
# ---------------------------------------------------------------------------
[functions.issue-batch]
verify_jwt = true

[functions.sync-progress]
verify_jwt = true

[functions.register-device]
verify_jwt = true

[functions.remove-device]
verify_jwt = true

[functions.webhook-paddle]
verify_jwt = false

[functions.webhook-lemonsqueezy]
verify_jwt = false

[functions.webhook-revenuecat]
verify_jwt = false
