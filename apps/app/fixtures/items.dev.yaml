- id: NAT-PV-V-9001
  jurisdiction: NAT
  bank: national_pearsonvue
  blueprint_node: V.C
  vendor: pearsonvue
  cognitive_level: application
  stem: A landlord tells a licensee that she will rent units in her twelve-unit apartment building only to tenants without children because the stairwells are steep. Under the federal Fair Housing Act, how should the licensee treat this instruction?
  options:
  - Decline it, because familial status is a protected class
  - Follow it, because small landlords are exempt from the Act
  - Follow it, because safety concerns are a permitted basis
  - Decline it after an applicant complains in writing
  key: A
  explanation: The Fair Housing Act makes it unlawful to refuse to rent a dwelling because of familial status, which covers households with children under 18, and a licensee who carries out the instruction takes part in the violation. The Act's exemption for an owner-occupied dwelling of four or fewer units cannot apply to a twelve-unit building, and even where it applies it never permits discriminatory statements or advertising. Safety is not a listed basis for excluding families.
  citation:
    source: 42 U.S.C. § 3604(a)
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title42/html/USCODE-2023-title42-chap45-subchapI.htm
    quoted_text: To refuse to sell or rent after the making of a bona fide offer, or to refuse to negotiate for the sale or rental of, or otherwise make unavailable or deny, a dwelling to any person because of race, color, religion, sex, familial status, or national origin.
  terms:
  - familial status
  - protected class
  tags:
  - fixture
  status: verified
  verified_on: 2026-09-08
  version: 2
- id: NAT-PV-V-9002
  jurisdiction: NAT
  bank: national_pearsonvue
  blueprint_node: V.C
  vendor: pearsonvue
  cognitive_level: knowledge
  stem: Which of the following is a protected class under the federal Fair Housing Act?
  options:
  - Disability
  - Occupation
  - Source of income
  - Marital status
  key: A
  explanation: The federal Fair Housing Act protects race, color, religion, sex, familial status, national origin, and handicap (disability). Occupation, source of income and marital status are protected only where a state or local law adds them.
  citation:
    source: 42 U.S.C. § 3604(f)
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title42/html/USCODE-2023-title42-chap45-subchapI.htm
    quoted_text: To discriminate in the sale or rental, or to otherwise make unavailable or deny, a dwelling to any buyer or renter because of a handicap
  terms:
  - protected class
  - handicap
  tags:
  - fixture
  status: verified
  verified_on: 2026-09-08
  version: 1
- id: NAT-PV-VII-9003
  jurisdiction: NAT
  bank: national_pearsonvue
  blueprint_node: VII.C
  vendor: pearsonvue
  cognitive_level: application
  stem: A title company gives a real estate brokerage a paid vacation for every ten closings the brokerage sends it. Under RESPA, this arrangement is best described as which of the following?
  options:
  - A prohibited kickback for referring settlement business
  - A permitted volume discount between businesses
  - A permitted payment if disclosed on the Closing Disclosure
  - A prohibited practice when the buyer pays for title insurance
  key: A
  explanation: RESPA section 8 prohibits giving or accepting any fee, kickback, or thing of value in exchange for referring settlement service business involving a federally related mortgage loan. A vacation earned by referral volume is a thing of value given for referrals. Disclosure does not cure it, and the prohibition does not depend on who pays for the title policy.
  citation:
    source: 12 U.S.C. § 2607(a)
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title12/html/USCODE-2023-title12-chap27.htm
    quoted_text: No person shall give and no person shall accept any fee, kickback, or thing of value pursuant to any agreement or understanding, oral or otherwise, that business incident to or a part of a real estate settlement service involving a federally related mortgage loan shall be referred to any person.
  terms:
  - kickback
  - settlement service
  - referral fee
  tags:
  - fixture
  status: verified
  verified_on: 2026-09-08
  version: 1
- id: NAT-PV-VII-9004
  jurisdiction: NAT
  bank: national_pearsonvue
  blueprint_node: VII.C
  vendor: pearsonvue
  cognitive_level: knowledge
  stem: A homeowner refinances her principal residence with a new lender. Under the Truth in Lending Act, for how long after consummation may she rescind the transaction if all required disclosures were properly given?
  options:
  - Three business days
  - Five business days
  - Ten calendar days
  - Thirty calendar days
  key: A
  explanation: The Truth in Lending Act gives a consumer the right to rescind a credit transaction secured by the principal dwelling until midnight of the third business day after consummation, delivery of the rescission notice, or delivery of all material disclosures, whichever is latest. If disclosures are defective the period extends to three years. Purchase-money loans are excluded from the right.
  citation:
    source: 15 U.S.C. § 1635(a)
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title15/html/USCODE-2023-title15-chap41-subchapI.htm
    quoted_text: the obligor shall have the right to rescind the transaction until midnight of the third business day following the consummation of the transaction or the delivery of the information and rescission forms required under this section
  terms:
  - rescission
  - consummation
  tags:
  - fixture
  status: verified
  verified_on: 2026-09-08
  version: 1
- id: NAT-PV-VII-9005
  jurisdiction: NAT
  bank: national_pearsonvue
  blueprint_node: VII.C
  vendor: pearsonvue
  cognitive_level: knowledge
  stem: Under the Equal Credit Opportunity Act, which of the following may a creditor **NOT** use as a basis for treating a mortgage applicant less favorably?
  options:
  - The applicant's marital status
  - The applicant's credit history
  - The applicant's verified income
  - The applicant's debt-to-income ratio
  key: A
  explanation: The Equal Credit Opportunity Act prohibits a creditor from discriminating in any aspect of a credit transaction on the basis of race, color, religion, national origin, sex or marital status, or age. Credit history, verified income and debt ratios are legitimate underwriting factors and may be used.
  citation:
    source: 15 U.S.C. § 1691(a)(1)
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title15/html/USCODE-2023-title15-chap41-subchapIV.htm
    quoted_text: on the basis of race, color, religion, national origin, sex or marital status, or age (provided the applicant has the capacity to contract)
  terms:
  - ECOA
  - marital status
  - protected basis
  tags:
  - fixture
  status: verified
  verified_on: 2026-09-08
  version: 2
- id: NAT-PV-VI-9006
  jurisdiction: NAT
  bank: national_pearsonvue
  blueprint_node: VI
  vendor: pearsonvue
  cognitive_level: application
  stem: A seller is listing a house built in 1972. Before the buyer becomes obligated under the contract, which of the following must the seller provide under the federal lead-based paint disclosure law?
  options:
  - A lead hazard information pamphlet and disclosure of known lead-based paint
  - A certified lead inspection report paid for by the seller
  - A written promise to abate any lead-based paint before closing
  - A copy of the local building permit history for the house
  key: A
  explanation: For target housing built before 1978, the seller must give the purchaser the EPA-approved lead hazard information pamphlet, disclose any known lead-based paint or hazards, and provide available records and reports. The law requires disclosure and a ten-day opportunity to inspect, not an inspection or abatement by the seller.
  citation:
    source: 42 U.S.C. § 4852d(a)(1)
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title42/html/USCODE-2023-title42-chap63A.htm
    quoted_text: provide the purchaser or lessee with a lead hazard information pamphlet
  terms:
  - target housing
  - lead-based paint
  tags:
  - fixture
  status: verified
  verified_on: 2026-09-08
  version: 1
- id: NAT-PV-V-9007
  jurisdiction: NAT
  bank: national_pearsonvue
  blueprint_node: V.D
  vendor: pearsonvue
  cognitive_level: analysis
  stem: At a local association meeting, several brokers agree that none of them will list a property for less than a six percent commission. Which federal law does this agreement most directly violate?
  options:
  - The Sherman Antitrust Act
  - The Settlement Procedures Act (RESPA)
  - The Truth in Lending Act (TILA)
  - The Fair Housing Act (Title VIII)
  key: A
  explanation: An agreement among competitors to fix the price of their services is a contract in restraint of trade under section 1 of the Sherman Act and is illegal per se. RESPA governs settlement referral fees, TILA governs credit disclosure, and the Fair Housing Act governs discrimination.
  citation:
    source: 15 U.S.C. § 1
    url: https://www.govinfo.gov/content/pkg/USCODE-2023-title15/html/USCODE-2023-title15-chap1.htm
    quoted_text: Every contract, combination in the form of trust or otherwise, or conspiracy, in restraint of trade or commerce among the several States, or with foreign nations, is declared to be illegal.
  terms:
  - price fixing
  - antitrust
  tags:
  - fixture
  status: verified
  verified_on: 2026-09-08
  version: 1
- id: NAT-PV-VIII-9008
  jurisdiction: NAT
  bank: national_pearsonvue
  blueprint_node: VIII.C
  vendor: pearsonvue
  cognitive_level: application
  stem: A property sells for $340,000 with a 5% commission. The listing brokerage and the selling brokerage split the commission equally, and the selling agent receives 60% of her brokerage's share. How much does the selling agent receive?
  options:
  - $5,100
  - $8,500
  - $3,400
  - $10,200
  key: A
  explanation: Total commission is $340,000 × 0.05 = $17,000. Each brokerage receives half, $8,500. The selling agent's 60% share of $8,500 is $5,100.
  citation:
    source: REP Ref. Real Estate Math § 4.2
    url: null
    quoted_text: 'Apply the splits in sequence: price × commission rate × brokerage''s share × agent''s split. The agent''s percentage applies to the brokerage''s share, not to the whole commission.'
  math:
    worked_solution: $340,000 × 0.05 = $17,000 total commission. $17,000 ÷ 2 = $8,500 per brokerage. $8,500 × 0.60 = $5,100 to the selling agent.
    formulas:
    - commission
    - split
    onscreen_calculator_only: false
  terms:
  - commission split
  tags:
  - fixture
  status: verified
  verified_on: 2026-09-08
  version: 2
