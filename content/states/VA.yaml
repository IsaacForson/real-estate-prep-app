notes: "Bulletin 'Last Revised 2/18/2026'. Both portions must be passed; portions are graded separately with raw-score minimums (salesperson 56 national / 30 state). Time is 105 min national + 45 min state (150 total); broker 105 + 55 = 160. Reciprocity applicants (licensed in another state) take only the state portion. Mandatory fingerprinting ($52) at PSI sites; background results valid 90 days. State-portion content outline is embedded in the bulletin (Licensing 8 items, Escrow 2, Disclosure 10, etc.)."
