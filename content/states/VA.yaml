code: VA
name: Virginia
regulator:
  name: "Virginia Real Estate Board, Department of Professional and Occupational Regulation (DPOR)"
  url: "https://www.dpor.virginia.gov/Boards/Real-Estate"
vendor: psi
vendor_notes: "PSI Services LLC administers both salesperson and broker exams (test-takers.psiexams.com/vare). Eligibility is transmitted to PSI by the approved education provider; reciprocity applicants register directly with PSI and take only the state portion."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: "1-10 unscored experimental items (approx. 10% of question count) may be added; they count against exam time"
  time_minutes: 150
  pass_score_national: "56/80 (70%)"
  pass_score_state: "30/40 (75%)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 60.00
  retake_policy: "Bulletin: 'It is not possible to make a new examination appointment on the same day you have taken an examination... unsuccessful candidates may be able to retest within two business days.' 'If you fail one portion of the examination (state or national), you must retake that portion and pass. Your completed application must be submitted within 1 year from the initial examination date when you ORIGINALLY took the examination. If all paperwork and fees are not received within 1 year from the original examination date, you must retake the expired portion or portions.' Registration fees are not refundable or transferable."
  calculator_policy: "Bulletin lists 'handheld calculators' among prohibited electronic devices at the test site. The bulletin does not explicitly describe an on-screen calculator (the exam is computer-based; 'Real Estate Calculations' is 7% of the salesperson national portion)."
broker_exam:
  national_items: 75
  state_items: 50
  total_items: 125
  pretest_items: "1-10 unscored experimental items (approx. 10%) may be added"
  time_minutes: 160
  pass_score_national: "60/80 points (75 items; some scenario items scored up to 2 points)"
  pass_score_state: "38/50 (76%)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 60.00
prelicense_hours_salesperson: 60
prelicense_hours_broker: 180
