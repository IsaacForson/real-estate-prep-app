notes: "Bulletin edition 'Updated 2/1/2026'. New Jersey does not report separate national and state scores: the salesperson exam is a single 110-item exam graded on one 70% cut score, but the bulletin's content outline gives per-topic item counts for the New Jersey-law blocks (salesperson 2+3+22+3 = 30; broker 3+4+30+3 = 40), so state_items records that block and national_items the remainder (80 of 110 salesperson questions; 75 of 115 broker questions, which carry 120 points because some national broker items score two points). Grading remains combined: one 70% cut score over the whole exam. The bulletin lists a single 'Examination Fee $38' line; it appears in the registration section applicable to all NJ real estate exams, so it is recorded for both salesperson and broker. Broker candidates need 3 years' full-time salesperson experience approved by the NJREC plus 150 hours (90-hour general course then two 30-hour courses) and a $25 experience-approval fee. Statute and N.J.A.C. links are those published by DOBI (the NJ Legislature's Folio gateway and the state's LexisNexis-hosted free NJAC)."
