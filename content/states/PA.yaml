vendor: pearsonvue
vendor_notes: "Pearson VUE administers the exams; salesperson exam eligibility is reviewed by Pearson VUE via the Clarus portal (https://pare.useclarus.com/), while broker eligibility is approved by the Commission. Pearson VUE publishes the Pennsylvania state content outlines as a separate document, #093901 (03/2026)."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: 15
  time_minutes: 210
  pass_score_national: "75% (scaled)"
  pass_score_state: "75% (scaled)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 52
  retake_policy: "Handbook: 'Candidates are permitted unlimited exam attempts within 5 years for salesperson exam and 10 years for broker exam, from the date the earliest required course was completed. A passing exam score is good for three years. Candidates may not retake a previously passed exam.' 'The salesperson and broker examination is divided into two parts: national and state law. Those who pass one part of the examination and fail the other, need to retake ONLY the failed part and must do so within the authorization period.' OnVUE: 'Candidate must wait seven (7) days between OnVUE attempts but the total number of attempts is NOT limited.'"
  calculator_policy: "The March 2026 handbook contains no explicit calculator statement. It says hand-held computers and other electronic devices are not allowed in the testing room, and that 'the test administrator will provide the candidate with materials to make notes or calculations and any other items specified by the exam sponsor.' Whether a personal or on-screen calculator is available is not stated."
