notes: "Handbook (#093900, March 2026) 'Available Exams and Time Allotted' table: Salesperson - National $52, 5 to 10 pretest, 80 questions, 150 min, 75%; Salesperson - PA State-specific $49, 5 to 10 pretest, 40 questions, 60 min, 75%; 'Salesperson - Combined $52'. Broker rows are identical. exam_fee_usd records the $52 'Combined' line; the two portions are otherwise $52 (national) and $49 (state) when scheduled separately. The 093901 outlines specify 5 pretest items on the national portion (effective April 1, 2025) and 10 pretest items on the PA state portion (effective March 16, 2026), hence pretest_items 15. Scores are scaled 0-100 and numeric scores are reported only to failing candidates. Pre-license: 75 hours (5 credits) for salesperson; 240 hours (16 credits) plus 3 years' experience for broker; cemetery broker 60 hours. The legislature's statute site (legis.state.pa.us / palegis.us) could not be fetched directly from this environment; the statute_url is the link published on the Commission's own page."
