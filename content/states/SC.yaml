notes: "Bulletin Examination Summary Table: Associate National 80 (80 points) 120 minutes; State 40 (40 points) 80 minutes; Both (120 points) 200 minutes. Broker National 75 items (80 points; some items scored up to two points) 120 minutes; State 50 (50 points) 80 minutes; Both 200 minutes. Score Reporting (number correct required): Associate National 56, State 28; Broker National 60, State 36. Experimental questions: 'A small number (i.e., 5 to 10)' unscored items may be administered and, per this bulletin, 'the time taken to answer them will not count against testing time' (pretest_items records the upper bound). Fees: Both Portions $67, One Portion $59, Property Manager $63. Pre-license (S.C. Code § 40-57-300): salesperson = 60 hours Unit I (fundamentals) + 30 hours Unit II (advanced) within 5 years of application, and 'an applicant may take the license examination before completing the required thirty hours of advanced instruction'; broker = 60 hours of commission-approved instruction (30-hour Unit III A Broker Management + 30-hour Unit III B Brokerage Principles) plus experience. llr.sc.gov refused automated connections from this environment, so exam facts come from the PSI bulletin and the statute from scstatehouse.gov."
