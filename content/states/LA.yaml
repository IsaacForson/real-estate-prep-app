notes: "Candidate Handbook #091900 dated July 2024. Exam is split into national and state parts, each scored separately on a 0-100 scaled score (70 salesperson / 75 broker). Time: national 150 min + state 90 min; combination exam 240 min. Exam fee is per attempt: $81 first combination attempt, $96 for repeat combination attempts. statute_url is the legis.la.gov link published on the LREC 'License Law' page (legis.la.gov blocks automated fetches, so the page itself was not loaded); the LREC page gives the range as R.S. 37:1430 through 37:1470. Broker applicants need 4 years active licensure (2 of last 4 immediately preceding) plus 150 hours. Salesperson state outline: 55 scored items + 5-10 pretest (effective April 1, 2025)."
