  retake_policy: "Authorization to test is good for one year with unlimited attempts; candidates do not return to LREC for retake authorizations. 'Those who pass one part of the examination and fail the other, need to retake ONLY the failed part and must do so within one full year.' If a candidate passes one part and the authorization year expires, the candidate must resubmit an initial application and be re-authorized for the part not passed, but has one year from the date of the passed portion to pass the other part. Candidates may not retake a previously passed part. Fees: combination exam $81 first attempt / $96 repeat attempts; national-only $42; state-only $39 (only the first attempt gets the discounted rate)."
  calculator_policy: "'For real estate exams, candidates will be given a hand-held calculator at the test center. There is also an on-screen calculator option embedded in the exam.' No personal items (including electronic devices) are allowed in the testing room."
