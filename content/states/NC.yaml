code: NC
name: North Carolina
regulator:
  name: "North Carolina Real Estate Commission (NCREC)"
  url: "https://www.ncrec.gov/"
vendor: pearsonvue
vendor_notes: "Pearson VUE administers the NC real estate license examination for the Commission (since March 1, 2024). Per the Commission's April 2026 bulletin: 'The National section is developed and provided by Pearson... The State section of the license examination is developed by the North Carolina Real Estate Commission and administered for the Commission by Pearson to only North Carolina license applicants.' Applicants must first file a license application ($105) with NCREC to receive a 180-day Notice of Exam Eligibility, then pay Pearson separately. NC issues a single 'broker' license (entry-level = provisional broker); there is no salesperson license, so salesperson_exam below is the NC broker license exam."
salesperson_exam:
  national_items: 80
  state_items: 60
  total_items: 140
  pretest_items: 10
  time_minutes: 270
  pass_score_national: "75 (computed separately for the National section)"
  pass_score_state: "75 (computed separately for the State section)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 63.00
  retake_policy: "'An applicant who fails both the National and State sections of the comprehensive examination must continue to take the 2-part comprehensive examination on any subsequent attempt until such time as the applicant passes at least one of the National or State sections.' 'Once an applicant has passed one of the two (2) examination sections, the applicant may apply to take only the remaining unpassed exam section.' 'Both exam sections must be passed during the same 180-day examination eligibility period... If an applicant only passes one examination section prior to the end of the 180-day examination eligibility period, then the applicant loses the benefit of having passed one section, must reapply to take the comprehensive examination, and pass both sections during the subsequent 180-day' period. The $105 application fee to the Commission plus the Pearson exam fee ($63 both sections / $53 single section) is collected each attempt. Each application/fee payment is valid for only one attempt."
  calculator_policy: "'Calculators are not required; however, they are recommended. Acceptable calculators include hand-held, battery, or solar-powered financial calculators used in real estate, finance, accounting, and business. The acceptable financial calculator may have storage capabilities but must not contain alpha characters.' 'Calculators are NOT provided by the test' center."
