notes: "Bulletin is NCREC's 'Real Estate Licensing in North Carolina' (April 2026 edition, hosted by Pearson). Sections are separately timed: National 2.5 hours (150 min), State 2.0 hours (120 min); 80 + 60 scored items plus 5 pretest items per section. The passing score of 75 is stated as a score per section (equal-value items). IMPORTANT: the brief's assumption that the national section is NCREC's own is contradicted by the current bulletin, which says Pearson develops the National section (a version used in all Pearson real estate states); NCREC develops only the State section. broker_exam and prelicense_hours_broker are null because NC has a single broker license tier: new licensees are 'provisional brokers' who must complete 90 hours of Postlicensing education (three 30-hour courses) within 18 months to remove provisional status; a Broker-in-Charge designation requires a separate 12-hour course, not an exam. Applicants licensed in other jurisdictions may qualify to take only the State section. The content outline is included in the bulletin (pp. 17-18) rather than published separately."
