  retake_policy: "'Candidates who fail an examination will need to make a new reservation to retake the exam' (and pay the fee again). 'Candidates who pass one (1) part of the examination and fail the other need to retake only the failed part.' 'The authorization period for salespersons is five (5) years after passing the first education course required to take the exams. For brokers, the authorization period is ten (10) years after passing the first course required to take their exams.' 'Exam results are good for three (3) years from the date of passing the exam.' (Board checklist: must have passed the exam within the past 12 months when applying.) No waiting period is stated."
  calculator_policy: "Handbook does not expressly address calculators. No personal items or electronic devices are allowed in the testing room; 'the test administrator will provide the candidate with materials to make notes or calculations and any other items specified by the exam sponsor.'"
