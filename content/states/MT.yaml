notes: "Candidate Handbook #092700 dated January 2026 (rev 01/2026). Each portion is a separate exam: National Salesperson $95 / 150 minutes / 80 scored + 5 pretest; State Salesperson $95 / 90 minutes / 40 scored + 10 pretest (state outline effective Jan 1, 2025 says 5-10 pretest); passing 75 scaled on each. Broker exams have identical structure and fees. exam_fee_usd is per portion — $190 to sit for both. Pre-license: 70 hours within the past 24 months per MCA 37-51-302 and ARM 24.210.611(8) (Board salesperson checklist, updated 11/2025); broker pre-license hours were not confirmed from a primary source (broker checklist not retrieved). leg.mt.gov redirects the MCA to archive.legmt.gov (MCA 2025)."
