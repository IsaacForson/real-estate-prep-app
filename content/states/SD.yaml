  name: "South Dakota Real Estate Commission, Department of Labor and Regulation"
  url: "https://dlr.sd.gov/realestate/"
vendor: psi
vendor_notes: "South Dakota's entry-level license is 'Broker Associate' (there is no salesperson license); that exam is mapped to salesperson_exam. PSI Services LLC administers it (https://test-takers.psiexams.com/sdre). The national portion is PSI's national Broker exam, which includes scenario-based items scored 0, 1, or 2 points (90 items = 100 points). No separate upgrade exam for the 'Broker' license is described in the bulletin, so broker_exam is null."
salesperson_exam:
  national_items: 90
  state_items: 52
  total_items: 142
  pretest_items: 10
  time_minutes: 270
  pass_score_national: "75% (of 100 points)"
  pass_score_state: "75%"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 105
  retake_policy: "Bulletin: 'The combined broker examination is divided into two (2) portions: general and state. Candidates who pass one (1) portion of the examination and fail the other need to retake only the section they failed. Candidates do not need to retake the entire combined exam.' 'It is not possible to make a new examination appointment on the same day you have taken an examination... A candidate who tests unsuccessfully on a Wednesday can call the next day, Thursday, and retest as soon as Friday.' Fee forfeited if not tested within 1 year of payment. License application must be submitted within 60 days of passing the last portion; Commission site adds that applications must be filed within two years of completing pre-licensing courses."
  calculator_policy: "Bulletin lists 'handheld calculators' among prohibited electronic devices; it does not mention an on-screen calculator."
