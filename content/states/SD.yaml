notes: "Bulletin (PSI, dated 10/1/2023) Examination Summary Table: Broker National 90 items (100 points), passing 75%, 150 minutes; State 52 items (52 points), passing 75%, 120 minutes. State outline: Duties and Powers of the Commission 4 items, Licensing Requirements 6 items, Statutory Requirements Governing Activities of Licensees 42 items (= 52). Experimental questions: 'a small number (5 to 10)' unscored items may be administered and count against exam time (pretest_items records the upper bound). FEE CONFLICT: the 10/2023 bulletin lists $98 (state or national, or combo), but the Commission's current Exam Information page says registration 'requires credit card payment of $105'; $105 is recorded as the current value. Pre-license: 116 classroom hours in a Commission-approved course of study (bulletin 'Requirements for Obtaining a South Dakota Real Estate Broker Associate License'). Education/experience hours for upgrading to the 'Broker' license were not found in the sources consulted. sdlegislature.gov pages are JavaScript-rendered; URLs follow the Legislature's standard statute/rule paths and the DLR license law book compiles SDCL 36-21A and ARSD 20:69."
