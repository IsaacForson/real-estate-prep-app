notes: "Handbook #091300 'July 2024' (rev 11/2025). Time is 4 hours total: General 150 min + State 90 min. Pretest items: 5 unscored items on the national/general portion plus 5-10 on the state portion (not a single published number). Scores are scaled 0-100; 70 passes salesperson, 75 passes broker. State outline effective July 15, 2017; national outlines effective April 1, 2025. Prelicense: salesperson 90 hours (Module 1 45 hrs + Module 2 45 hrs); associate broker minimum 90 hours (Brokerage Management 28 hrs, Real Estate Law 45 hrs, plus electives) per DOPL 'Education > Applicants' (read via Internet Archive copy because dopl.idaho.gov and legislature.idaho.gov refused connections from the research environment). rules_url points to DOPL's official License Law & Rules booklet (IDAPA 33.01.01) because the adminrules.idaho.gov PDF path could not be confirmed."
