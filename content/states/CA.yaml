notes: "Self-administered by DRE; there is no vendor candidate bulletin, so bulletin_url points to DRE's 'Taking the Exam' page. Exam is a single California exam (no separate national/state portions). Salesperson: '3 hours - 150 multiple choice questions', pass at 70%. Broker: '4 hours - 200 multiple choice questions', pass at 75% (DRE's Taking the Exam page; older materials described two 2.5-hour sessions). Fees (dre.ca.gov/licensees/fees.html): salesperson exam $100, re-exam $100, license $350 (combined exam+license $450 with RE 435); broker exam $150, re-exam $150, license $450. Pre-license: salesperson = 3 college-level courses (Principles, Practice, one elective), each a minimum of 45 hours (135 hrs total); broker = 8 statutorily required courses, each a minimum of 45 hours (360 hrs total), plus 2 years full-time salesperson experience or equivalent/degree. Fees are nonrefundable per B&P Code § 10207. DRE's own compilation 'Real Estate Law' (B&P Code §§ 10000-11288) and 'Regulations of the Real Estate Commissioner' (CCR Title 10) are published at dre.ca.gov/Publications/RealEstateLaw.html."
