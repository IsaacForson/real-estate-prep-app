notes: "Unusual structure: PSI administers only the NATIONAL exam; the Vermont state (jurisprudence) exam is self-administered by OPR inside the online license application (since Feb 27, 2021), so national and state are necessarily passed separately. OPR: 'OPR no longer accepts paper applications.' Broker exam format changed from simulation to multiple choice as of 10/1/2023 (OPR forms page). Pre-license: 26 V.S.A. § 2292 requires 'a course of instruction, approved by the Commission, of at least 40 hours' for salespersons and 'at least 40 hours' for brokers (plus 2 years' salesperson experience with at least 8 closed transactions); OPR FAQ confirms 40-hour courses. 26 V.S.A. § 2292a authorizes the Commission to use independent testing services. PSI's Vermont Candidate Information Bulletin is only reachable through the PSI test-taker portal (the /vtre landing page shows program notices but no public bulletin link; a search of PSI's public bulletin API did not surface a Vermont bulletin), and OPR's PDFs on outside.vermont.gov (administrative rules, exam notice, application instructions, salesperson state jurisprudence exam) returned WAF 403 errors from this network, so national-exam item counts, time, pass score, fee, and retake rules could not be confirmed from a primary source and are left null. The 'Code Vt. R. 04-030-290' rule number was seen only in secondary legal indexes (LII/Justia); the rules PDF itself (linked from the OPR statutes-rules page) could not be opened. legislature.vermont.gov presents a certificate that some fetchers reject, but the chapter loaded via curl."
