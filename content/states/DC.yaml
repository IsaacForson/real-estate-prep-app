notes: "Current PSI Candidate Information Bulletin is 'Updated 6/3/2026' (Copyright 2026) at test-takers.psiexams.com bulletin id 5587; an older 10/1/2018 copy still hosted at proctor2.psionline.com (812 DC RE.pdf) shows fee $61.50 and broker General 80 / Combo 120 items — superseded. 2026 bulletin: Salesperson General 80 items (80 points, 120 min) + State 30 items (30 points, 90 min), Combo 110 items / 210 min; Broker General 75 items (80 points; some national broker items scored up to two points) + State 40 items (40 points), Combo 115 items (120 points) / 210 min. Score of 75% correct required to pass; both portions must be passed, failed portion retaken alone within 6 months of first attempt. Fee $79 whether one or both portions. Endorsement (out-of-state) applicants may waive education, experience and the national portion but 'All applicants are required to take the DC law examination and obtain a minimum 75 percent passing score.' Pre-license: 60-hour salesperson course; 135-hour broker course plus two consecutive years' experience as a licensed salesperson. The Commission's 'Laws and Regulations' pamphlet is the only Commission-supplied study material for the DC law portion. Statute: real estate licensing is part of the Second Omnibus Regulatory Reform Amendment Act in D.C. Code Title 47, ch. 28, subch. I-B (Real Estate Brokers §§ 47-2853.161–.163; Salespersons §§ 47-2853.171–.173; Special Rules §§ 47-2853.181–.187; Duties §§ 47-2853.191–.198)."
