notes: "Bulletin edition 'Updated 10/30/2024' (PSI). Time per portion: National 120 min, State 60 min (both bulletin table and PSI test-detail page). PSI's score-reporting text says 'you must receive a score of at least 75%'; the summary table gives 60 correct (of 80 points) national and 38 correct (of 50) state; 16.61.3 NMAC says 'a minimum score of 75' on both portions. broker_exam is null because NM's Qualifying Broker license uses the same Broker examination plus 120 pre-licensing hours (adds a 30-hour Brokerage Office Administration course) and 2 of the last 5 years' experience as an associate broker; there is no separate higher-level exam. Statute is officially compiled on nmonesource.com (blocked to automated fetching); statute_url points to the Commission's official 2021 web-edition 'License Law and Commission Rules' book which reproduces Chapter 61, Article 29. NREC's licensing page also states applicants must apply for a license within 6 months of passing."
