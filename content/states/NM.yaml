code: NM
name: New Mexico
regulator:
  name: "New Mexico Real Estate Commission, Regulation and Licensing Department (RLD)"
  url: "https://www.rld.nm.gov/boards-and-commissions/individual-boards-and-commissions/real-estate-commission/"
vendor: psi
vendor_notes: "PSI Services LLC is the Commission's examination contractor; candidates apply for eligibility and pay PSI directly. New Mexico has no 'salesperson' license: the entry-level license is Associate Broker, and the exam is the 'NM Broker Exam' (National + State portions). Values under salesperson_exam are for that entry-level associate broker exam."
salesperson_exam:
  national_items: 75
  state_items: 50
  total_items: 125
  pretest_items: "5 to 10 experimental questions may be administered; unscored and the time taken to answer them does not count against testing time"
  time_minutes: 180
  pass_score_national: "60 correct (75 items scored to 80 points; 75%)"
  pass_score_state: "38 correct of 50"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 95.00
  retake_policy: "'You are required to pass both the state and national portions of the examination. If you fail one portion of the examination, you will only need to register to retake the failed portion. You must pass both the national and state-specific examinations within 90 days of passing the first examination. If you do not pass both examinations within 90 days, you must retake both examinations.' 'The fee is $95 for the 2 examination portions, regardless if you take 1 or both examination portions. Examination retakes are $95 for 1 or both examination portions.' Eligibility expires one year from the date PSI receives the original submission; the examination fee is valid for one year from the date of payment."
  calculator_policy: "'Only non-programmable calculators that are silent, battery-operated, do not have paper tape printing capabilities, and do not have a keyboard containing the alphabet will be allowed in the examination site.'"
