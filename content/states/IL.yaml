notes: "Illinois has no 'salesperson' license: the entry-level license is Broker, so salesperson_exam holds the Broker exam (National 100 items/150 min at 70%; State 40 items/90 min at 75%) and broker_exam holds the Managing Broker exam, which the bulletin's summary table lists as a State-only portion (50 items, 75%, 90 min). The bulletin notes the 70% national passing standard is equivalent to the previously reported scaled score of 75. 5-10 unscored experimental items may be added and count against time. Managing broker prelicense is 45 hours (for an active Illinois broker; 165 hours without one). Pre-license education is valid for two years. Managing Broker/Instructor national portions include scenario-based 0/1/2-point items. Bulletin dated 6/24/2026. ilga.gov refused connections from the research environment; the two URLs above were confirmed via Internet Archive captures (2025)."
