notes: "Candidate Handbook #090300 dated February 2026. Effective January 1, 2026 the salesperson exam was split into two separately scheduled and separately scored exams: 'Arizona Real Estate Sales - General' (80 scored + 5 pretest, 150 min, $70) and 'Arizona Real Estate Sales - State' (60 scored + 5 pretest, 90 min, $60); combo price $75 when scheduled back to back; ADRE requires two score reports (General and State) with the license application. Scores are reported as percent correct (not scaled); 75% needed on each. The BROKER exam is a single 180-question Arizona-specific exam (plus 15 pretest), 315 minutes, $125, 75%; it is not split into national/state. Pre-license: handbook says applicants must complete 'prelicensure education course(s) prescribed and approved by the Commissioner of at least 90 hours' (both salesperson and broker; statute A.R.S. § 32-2124); a separate 6-hour Contract Writing course is required for the salesperson LICENSE application, not for the exam. Out-of-State License Recognition candidates take only the state-specific exam (salesperson 60 items/90 min/$60; broker 110 items/165 min/$125). azre.gov and apps.azsos.gov returned HTTP 403 to automated fetches; rules_url is the Secretary of State's official A.A.C. Title 4 Ch. 28 PDF as indexed by search."
