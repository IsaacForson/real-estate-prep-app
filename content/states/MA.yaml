code: MA
name: Massachusetts
regulator:
  name: "Board of Registration of Real Estate Brokers and Salespersons, Division of Occupational Licensure"
  url: "https://www.mass.gov/orgs/board-of-registration-of-real-estate-brokers-and-salespersons"
vendor: psi
vendor_notes: "PSI both administers the exam and processes the license application; candidates pay the license fee at the test center upon passing and receive a digital license via eLIPSE 24 hours later."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: "5-10 experimental questions; not scored but count against exam time"
  time_minutes: 240
  pass_score_national: "70%"
  pass_score_state: "70%"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 56
  retake_policy: "'Candidates who pass one (1) portion of the examination and fail the other need to retake only the failed portion. The failed portion must be successfully completed within two (2) years from the completion date on the Educational Certificate form (or the authorized period by the Board). If the Educational Certificate expires, the partial pass also expires. Candidates who obtain a new Education Certificate must retake both portions of the examination.' No same-day rebooking; a candidate who fails on Wednesday can call Thursday and retest as soon as Friday. Re-take fee is $56 for all salesperson and broker candidates. Exam fee is valid for one year from date of payment."
  calculator_policy: "'An online calculator will be provided; personal calculators will not be permitted.' Scratch paper and pencil are provided and collected."
broker_exam:
  national_items: 75
  state_items: 40
  total_items: 120
  pretest_items: "5-10 experimental questions"
  time_minutes: 240
  pass_score_national: "70% (75 questions worth 80 points; some scored up to two points)"
  pass_score_state: "70%"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 56
