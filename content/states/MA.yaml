notes: "PSI Candidate Information Bulletin 'Updated 09/23/2025' (also posted at https://www.mass.gov/doc/psi-candidate-information-bulletin/download). Time: general 150 minutes + state 90 minutes = 240 minutes; the broker exam is the same length (75 general questions worth 80 points + 40 state). Passing is 'a minimum of 70%' per portion. Salesperson applicants need 40 hours education, three candidate endorsements, and a $31 application fee; broker applicants need 40 additional hours, 3 years as an affiliated MA salesperson (at least 25 hrs/week), a $5,000 surety bond and $52 application fee. Massachusetts must be applied for and passed within two years of completing salesperson education. Content outlines are inside the bulletin."
