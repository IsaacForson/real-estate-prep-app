notes: "Handbook is the April 2025 edition (#092800; content outlines effective April 1, 2025). Salesperson and broker exams share the same structure (80 national / 50 state, 2.5 h + 1.5 h). Each portion scored separately at 75%; broker candidates who fail must retake the entire exam, salesperson candidates only the failed portion. Exam fee is $150 per exam paid to NREC (Fee Schedule updated January 2026), plus a $175 license application fee. Pre-license: NREC lists '96 HOURS TOTAL' for salespersons = 90 clock hours (3 courses) + 6-hour Professional Practice Standards course; broker/associate broker = 60 additional clock hours (2 courses) beyond the salesperson hours. Rules are also hosted on rules.nebraska.gov (Secretary of State); the NREC-published Title 299 PDF is used here."
