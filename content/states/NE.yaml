  name: "Nebraska Real Estate Commission (NREC)"
  url: "https://nrec.nebraska.gov/"
vendor: pearsonvue
vendor_notes: "Pearson VUE administers the exam; candidates apply to and pay the exam fee to the NREC, which then authorizes Pearson VUE."
salesperson_exam:
  national_items: 80
  state_items: 50
  total_items: 130
  pretest_items: "5 to 10 per handbook (national content outline specifies 5 unscored pretest items on the national portion)"
  time_minutes: 240
  pass_score_national: "75%"
  pass_score_state: "75%"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 150.00
  retake_policy: "Candidates who fail one or both parts may retest within six (6) months or three (3) attempts during their authorization period. Salesperson candidates who pass one part but fail the other may retake only the portion they failed. 'Salesperson applicants may retain credit for passing scores on either portion for three (3) subsequent examination attempts or six (6) months, or until the time their application expires, whichever comes first.' Before scheduling a retake, candidates must return to the NREC to pay the fee ($150 retake fee within one year of application) and obtain a new authorization. A license application remains valid for 12 months."
  calculator_policy: "'Personal calculators are NOT permitted, an online calculator is available as part of the exam.'"
