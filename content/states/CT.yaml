  total_items: 115
  pretest_items: "5-10"       # 'experimental' questions, unscored; time to answer them does not count against exam time
  time_minutes: 165           # General 120 min + State 45 min
  pass_score_national: "70%"
  pass_score_state: "70%"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 59            # first time, covers one or both portions; retakes $51
  retake_policy: "'You may take the examination on an unlimited basis for up to one year from the date of eligibility.' 'You must pass both portions of the examination within one (1) year of eligibility.' If both portions are not passed within one year the candidate must reapply with DCP. A new appointment cannot be made the same day as a failed exam (call the next day; retest as soon as the day after). Retake fee $51 (one or both portions). License fee must be paid within two (2) years of passing the last portion or a new application is required."
  calculator_policy: "'Handheld calculators' are listed among prohibited electronic devices; the bulletin does not describe an on-screen calculator."
