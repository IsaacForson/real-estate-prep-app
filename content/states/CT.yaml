notes: "PSI Candidate Information Bulletin 'Updated 11/13/2025'. Salesperson: General 80 questions (80 points, 120 min) + State 35 questions (35 points, 45 min); both portions must be passed at 70% within one year of eligibility. Broker: General 75 questions (80 points; some national broker items are worth up to two points) + State 45 questions (40 points), 180 min total, 75%. Fee $59 whether taking one or both portions; retakes $51. Salesperson pre-license = 60-hour Real Estate Principles and Practices course. Broker pre-license per DCP = 60-hr Principles & Practices + 15-hr Real Estate Brokerage Principles & Practices + 15-hr Legal Compliance + either two 15-hr electives or one 30-hr elective (or 20 transactions in prior 5 years) = 120 hours when electives are taken, plus 1,500 hours / 4 transactions as a licensed salesperson within 3 years. CT real estate regulations are codified by enabling statute section (e.g., §§ 20-314-1 et seq. schools/courses; §§ 20-328-1a to -10a conduct); the rules root cites the § 20-328 conduct series."
