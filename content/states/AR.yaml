  retake_policy: "'The real estate salesperson exam is divided into two parts: general and state law. You may take the exam parts together or separately. If you pass one part of the exam and fail the other part, you only need to retake the failed part of the exam within six months. If you have not passed both parts of the exam after six months, you must retake the entire exam.' Must wait 24 hours before reserving a retake; reservations for reexamination may not be made at the test center. Candidates are authorized for unlimited attempts for one year from Commission approval. License application must be filed within 90 days of passing."
