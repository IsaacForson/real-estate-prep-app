notes: "Candidate Handbook #090400 dated June 2026 (rev 06/2026). The handbook gives no per-exam time table; it says only 'You will have two to four hours to complete your exam', so time_minutes is left null. The handbook's test-center policy section does not state a calculator rule (only math-reference info), so calculator_policy is null. Salesperson: General 80 scored (+5 pretest) and Arkansas law 30 scored (+10 pretest), each portion passed separately at scaled 70 ('70 (general & state)'); portions may be taken together or separately; AREC advertises a '2-for-1' price when both are scheduled in the same transaction ($75 total vs $75 each). Broker exam is a single 'Arkansas Unified Real Estate Broker' exam (120 scored + 10 pretest) effective Dec 1, 2025, scaled 70. Salesperson pre-license: 60 hours of which 30 in basic principles (ACA § 17-42-303, Rule 4.1); broker: 60 hours of which 45 is the Commission-developed Broker Pre-License Course, within 36 months. Post-license education due within 6 months of licensure. Official Arkansas Code is published via the Arkansas General Assembly/LexisNexis; statute_url points to AREC's own compiled License Law PDF (July 2024) on the agency site. Property Management Associate/Broker exams also exist ($75 each)."
