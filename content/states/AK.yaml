notes: "Candidate Handbook #092200 dated July 2026. Passing score is 75 (scaled) per portion; the handbook states a candidate who passes one section and fails the other must retake the ENTIRE exam (no partial credit carried). Time is stated as four (4) hours for the examination as a whole (both portions in one sitting); per-portion times are not published. Pre-license hours are stated in the handbook as the '40-hour Alaska prelicensing course' (salesperson) and the '30-hour Alaska broker training course' (broker) in the licensing-by-endorsement section; the commerce.alaska.gov exam page returned HTTP 403 to automated fetches so the hours were not re-confirmed there. Content outlines are embedded in the handbook (national effective April 1, 2025; Alaska law portion effective September 14, 2023). Exams offered weekly in Anchorage, less often in Fairbanks/Juneau/Bethel. Salesperson minimum age 19; broker 22 with 36 of the prior 60 months active."
