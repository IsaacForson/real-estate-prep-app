notes: "PSI bulletin 'Updated 7/6/2026'. Michigan uses ONE combined exam per license level graded on a single score (salesperson 115 questions, 70% / 80 raw, 180 minutes; broker 115 questions worth 120 points, 75% / 90 raw, 210 minutes). The national/state split is derived from the bulletin's content outline: the Michigan-specific outline totals 35 salesperson items (3+5+10+5+12) and 40 broker items (3+4+15+5+13); the national counts (80 / 75) are the remainder and match the standard PSI national exam. Confidence is medium because michigan.gov and legislature.mi.gov block automated retrieval: the 40-hour salesperson requirement and $79 fee were confirmed only via search-engine excerpts of LARA's own 'Real Estate Salesperson Licensing Guide' PDF, and the 90-clock-hour broker requirement via an excerpt of MCL 339.2504; the statute and rules URLs were not loaded directly. Salesperson education must include 4 hours of civil rights/fair housing (broker: 9 hours)."
