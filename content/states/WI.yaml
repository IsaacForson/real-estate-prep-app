notes: "Handbook rev06/2026 (Pearson VUE #095000). Wisconsin administers ONE exam per license level with a single scaled pass score of 75 set by DSPS; there is no separately graded national portion. The Pearson content outline is labeled 'The state portion of the salesperson examination consists of 140 scored items' but that outline covers all content (ownership/transfer, financing, agency, contracts/WB forms, fair housing, etc.). Salesperson time 4 hours; broker 3.25 hours. Some items include narratives or WB (Wisconsin-approved) forms displayed on screen. Handbook does not state a calculator policy. Pre-license 72 hours (Wis. Stat. § 452.09; Wis. Admin. Code § REEB 25.033 salesperson / § 25.023 broker), completed within 4 years before application; endorsement applicants from non-reciprocal states need 13 hours (salesperson) / 6 hours (broker). docs.legis.wisconsin.gov refused connections during verification, so statute_url/rules_url are the standard legislature URLs but were not loaded; citations were confirmed from DSPS pages."
