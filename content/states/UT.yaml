vendor_notes: "The Utah Real Estate Candidate Handbook (#094500, July 2024) states 'All applicants must pass the licensure examination administered by Pearson VUE.' Utah's entry-level license is 'Sales Agent'. The general and state portions are administered in a single 4-hour sitting but scored separately (scaled scores)."
salesperson_exam:
  national_items: 80
  state_items: 50
  total_items: 130
  pretest_items: 15
  time_minutes: 240
  pass_score_national: "70 (scaled score)"
  pass_score_state: "70 (scaled score)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 69
  retake_policy: "Handbook: 'The examination is divided into two parts: general and state law. Candidates who pass one section of the examination and fail the other need retake only the failed section within six (6) months. If, after six (6) months, both sections have not been passed, the candidate must retake the entire examination.' 'Reservations for reexamination may not be made at the test center, and candidates must wait twenty-four (24) hours after failing an examination before making a reservation to retake it.' 'All applicants must apply for a license within ninety (90) days of passing both examination components (general and state) and within twelve (12) months of the date on which the individual completes the prelicensing education.'"
  calculator_policy: "Handbook: 'Calculators are not required; however, they are recommended. Acceptable calculators include hand-held, battery, or solar-powered financial calculators used in real estate, finance, accounting, and business. The acceptable financial calculator may have storage capabilities but must not contain alpha characters... Calculator malfunctions are not grounds for challenging examination results or requesting additional examination time.'"
