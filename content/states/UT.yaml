notes: "Handbook: exam fee $69; 'Each candidate will have four (4) hours to complete the examination'; passing scaled scores: Salesperson 70 general / 70 state, Broker 75 general / 75 state (scaled 0-100; numeric scores reported only to failing candidates). Outlines (#094502): national/general 80 scored + 5 pretest (effective April 1, 2025); Utah State Salesperson outline '50 scored items, 5-10 pretest (unscored) items' (effective July 15, 2016); Utah State Broker outline '90 scored items, 5-10 pretest (unscored) items' (effective July 15, 2016). pretest_items records 5 national + 10 state (upper bound). Pre-license: 120 classroom hours for sales agent and 120 for broker (broker: 45 Broker Principles, 45 Broker Practices, 30 Utah Law); education is valid one year and the Candidate Education Certifying Document must be presented at each exam sitting. Fingerprinting is done at Pearson VUE ($12 fee to Pearson VUE per handbook) plus a Division fingerprint fee. le.utah.gov and realestate.utah.gov refused automated connections from this environment; the statute_url follows the Legislature's standard chapter URL and the rules_url is the Utah Office of Administrative Rules page for R162-2f (which redirects to the eRules portal)."
