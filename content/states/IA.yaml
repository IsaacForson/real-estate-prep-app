notes: "Salesperson: National 80 items/120 min (pass 56), State 40 items/60 min (pass 28), both 180 min. Broker national portion has 75 items worth 80 points (scenario-based items scored up to 2 points), pass 60; state 40 items pass 30. 5-10 unscored experimental items may be added and count against time. Salesperson prelicense: Commission-approved 60-hour course within 12 months before the exam; broker: 60 hours of broker prelicense education within 24 months plus 24 months' active salesperson experience. License application due by the last business day of the sixth month after passing. The Commission moved under DIAL (formerly Professional Licensing Bureau) — the bulletin still cites plb.iowa.gov. The Real Estate Commission rules formerly at 193E were editorially transferred to 481 IAC chapters 2001-2022 (IAC Supplement 6/10/26); the legis.iowa.gov 193E agency PDF is now only a transfer notice, so rules_url points to the agency 481 rules index."
