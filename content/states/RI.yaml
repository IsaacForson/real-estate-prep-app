  retake_policy: "Handbook: 'Candidates who fail either the General or State Law sections will need to retake the examination. Passing results are valid for ONE YEAR from the passing date. If you have not applied for your license within one year of passing both parts, you must retake the examination(s). Note: After ONE failed attempt (per part) via OnVUE online testing, candidates must register and test at a physical testing center for retaking the examination.' Also: 'Application for licensure MUST be filed within one year of the date on which the candidate passed the examination. If parts of the exam were passed on different dates, the one-year time period begins on the later date.'"
  calculator_policy: "Handbook: 'Calculators are permitted only if they are silent, hand-held, non-printing, and without an alphabetic key pad. Financial calculators are not permitted. Calculator malfunctions are not grounds for challenging examination results or requesting additional examination time. NOTE: Calculators are NOT provided by the test center staff.'"
