notes: "Handbook 'Available Exams' table: RI Sales - National Part $53, 5 pretest, 80 questions, 2.5 hours; RI Sales - State Part $50, 10 pretest, 50 questions, 1.5 hours (broker rows identical). exam_fee_usd = $53 + $50 = $103 for both parts; each part is priced and scheduled separately. 'Passing score for all exam levels is 70' on a 0-100 scaled score; numeric scores are reported only to failing candidates. Pre-license hours come from 230-RICR-30-20-2 (implementing R.I. Gen. Laws § 5-20.5-4(b)): 45 classroom hours for salesperson (completed within 2 years of application) and 90 classroom hours for broker; the 45 salesperson hours may not be counted toward the 90 broker hours. Candidates who completed pre-licensing education in Rhode Island must bring their Education Completion Certificate to the exam. Florida licensees may be eligible to take only the RI State Part under the FL-RI mutual recognition agreement. The DBR website and the rilegislature.gov statute server refused automated connections from this environment; the statute_url follows the legislature's standard chapter-index URL pattern and the regulator URL is the DBR real estate section page."
