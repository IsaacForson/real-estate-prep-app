notes: "Time: 2.5 hours for the general exam and 1.5 hours for the Kansas exam (4 hours if taken as a combo). Kansas state portion is 30 scored items for salespersons and 40 for brokers plus 10 unscored pretest items each (state outline effective 6/11/24); national portion 80 scored + 5 pretest (outline effective April 24, 2025), so pretest_items = 15 total. Fee is $70 per exam; a same-day combo (both portions) is a 'two-for-one' $70; digital fingerprinting $16. Prelicense salesperson: 30-hr Principles of Real Estate (within 1 year before passing both portions) + 30-hr Kansas Practice course (within 6 months before application) = 60 hrs; broker: 30-hr Kansas Real Estate Broker Fundamentals + 30-hr Kansas Real Estate Management = 60 hrs (out-of-state licensees substitute a 4-hr Kansas Law course for Fundamentals). License application and fee due within six months of the (earlier) exam date. krec.ks.gov returns 403 to automated clients; its statutes/regulations page was confirmed via an Internet Archive capture."
