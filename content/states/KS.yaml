  retake_policy: "Handbook (April 2025, rev 7/25): 'Candidates must wait twenty-four (24) hours before scheduling a re-exam.' 'If a candidate passes one exam and fails the other, only the failed exam needs to be retaken. However, the failed exam must be passed in time for the Kansas Real Estate Commission to receive the complete application within six months of the earlier exam date. Candidates who do not meet the six-month time limit must retake exams.' Candidates licensed in another state take only the Kansas exam."
