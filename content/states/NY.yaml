notes: "DOS publishes only that the salesperson written exam 'is multiple choice and based on the 77-hour pre-licensing curriculum' with 1 1/2 hours allowed, and the broker exam is based on the 152-hour curriculum with 2 1/2 hours allowed; DOS does not publish the number of questions or the passing percentage on its pages (results are pass/fail only), so those fields are null rather than taken from prep-school sources. Since Dec 2024 (post-Sept. 2024 law change) the salesperson course is 77 hours (was 75) and broker qualifying education is 152 hours; DOS FAQ also requires a school-administered proctored final exam in addition to the DOS exam. bulletin_url points to the DOS 'Become a Real Estate Salesperson' page (the closest official equivalent of a candidate bulletin). rules_url is DOS's March 2026 compiled 'Real Estate License Law' PDF containing Article 12-A and 19 NYCRR Parts 175-179."
