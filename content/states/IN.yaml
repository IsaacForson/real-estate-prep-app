notes: "Indiana has a single entry-level 'Broker' license (no salesperson tier), so salesperson_exam holds the Real Estate Broker exam (series ReIN-Broker): 240 min seat time, 145 total questions = 80 scored national + 50 scored state + 15 unscored pretest (5 national + 5-10 state per the content outlines), scaled passing score 75, fee $55. broker_exam is left null because Managing Broker candidates take the same ReIN-Broker exam; there is no separate higher-tier exam. Broker by Endorsement (out-of-state licensees) take the state portion only (60 questions, 90 min, $55). Prelicense course is 90 hours; both exam parts must be passed within 1 year of course completion. Handbook #091500 'March 2025' (rev 08/2025); national outlines effective March 1, 2025."
