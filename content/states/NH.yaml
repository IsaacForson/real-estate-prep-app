notes: "Bulletin is PSI's 'Updated 7/1/2025' edition; OPLC also hosts an older October 2024 handbook PDF (https://www.oplc.nh.gov/sites/g/files/ehbemt441/files/inline-documents/examination-candidate-handbook.pdf). Time per portion: National 150 min, State 90 min. Salesperson pre-license is 40 hours (min. 32 classroom, max 8 distance) completed within 6 months before the exam; broker 60 hours. Candidates who pass any portion without having met the education requirement must retake the exam in its entirety (Rea 301.03(r)). Content outlines are included within the bulletin rather than published separately. gc.nh.gov blocked automated fetches; URLs were taken from OPLC's Laws & Rules page links."
