code: NH
name: New Hampshire
regulator:
  name: "New Hampshire Real Estate Commission, Office of Professional Licensure and Certification (OPLC)"
  url: "https://www.oplc.nh.gov/find-board/nh-real-estate-commission"
vendor: psi
vendor_notes: "PSI Services LLC conducts the examination program under contract with the Commission; candidates register and pay PSI directly (OPLC no longer accepts exam registrations)."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: "5 to 10 experimental questions may be administered; unscored and time taken does not count against testing time"
  time_minutes: 240
  pass_score_national: "56/80 points"
  pass_score_state: "28/40 points"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 66.00
  retake_policy: "'You will pay the examination fee for each attempt and, you must re-apply.' Candidates must pass both the National and State portions to be eligible for a license. Per Rea 301.03(e) all candidates shall take the examination within 3 months from the date of receipt of the exam registration. 'Candidates who fail to attain a passing grade on both portions of the examination within a 6-month period from the date of the original examination or after eight (8) examination attempts shall be required to complete an accredited pre-licensing course in addition to any pre-licensing course previously submitted' (Rea 303.05). Examination fee is valid for one year from the date of payment. National $34 / State $32 / Combo $66 (a candidate who passed one portion re-registers for the failed portion only)."
  calculator_policy: "'An online calculator will be provided. Or you may bring a silent non-programmable calculator without alpha keys.'"
