regulator:
  name: "Texas Real Estate Commission (TREC)"
  url: "https://www.trec.texas.gov"
vendor: pearsonvue
vendor_notes: "TREC contracts with Pearson VUE; the Texas Real Estate Candidate Handbook (#094400, September 2026) and content outlines (#094401) are published by Pearson VUE. Texas's entry-level license is 'Sales Agent'. National and state portions are graded separately with raw-score cut points set by TREC; the national portion may be waived for active out-of-state licensees who passed an ARELLO-approved national exam."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: 15
  time_minutes: 240
  pass_score_national: "56/80"
  pass_score_state: "28/40"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 58
  retake_policy: "Handbook: 'Candidates who fail need to retake only the portion of the examination they failed, as long as they do so within one year from the date the application was filed with TREC.' 'Reservations for re-examination cannot be made at the test center, and candidates must wait twenty-four (24) hours before scheduling.' 'Candidates have three attempts to pass both portions of the examination prior to the application expiration date. If the examination is failed three times, the candidate is unable to retest or submit a new application until additional qualifying real estate education is completed as follows: Thirty (30) hours for an applicant who fails either the national or state part of the examination; and sixty (60) hours for an applicant who fails both parts of the examination.' Course completion documents and the third failed score report go to documents@trec.texas.gov."
  calculator_policy: "Handbook: 'Calculators are not required; however, they are recommended. Acceptable calculators include hand-held, battery, or solar-powered financial calculators used in real estate, finance, accounting, and business. The acceptable financial calculator may have storage capabilities but must not contain alpha characters... Calculator malfunctions are not grounds for challenging examination results or requesting additional examination time. NOTE: Calculators are NOT provided by the test center staff.'"
