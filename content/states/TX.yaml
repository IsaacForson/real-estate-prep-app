notes: "Handbook 'Available Exams and Time Allotted' (items = scored + pretest): Sales National 85 items 150 min $58; Sales State 50 items 90 min $58; Both 125 items 240 min $58. Broker National 85 / 150 min; State 60 / 90 min; Both 145 / 240 min; $58. Outlines: national 80 scored + 5 pretest (effective March 1, 2025); Texas Sales Agent state law 40 scored + 10 pretest (effective January 1, 2026); Texas Broker state law 50 scored + 5-10 pretest (effective April 15, 2020; includes 10 case-study items). 'Each candidate will be given 240 minutes or 4 hours (total includes State and National portion)'. Passing is a raw score: sales 56 national / 28 state; broker 60 national / 38 state. The exam fee is $58 whether one or both portions are scheduled. Fingerprinting via IDEMIA is required under Tex. Occ. Code § 1101.3521. Pre-license (qualifying education) hours are NOT recorded because the primary sources that state them (trec.texas.gov 'Become Licensed – Sales Agent', Tex. Occ. Code §§ 1101.356/1101.358, 22 TAC § 535.55) refused automated connections from this environment; the handbook does not state the base requirement. The statutes.capitol.texas.gov and trec.texas.gov URLs above are the official locations even though they could not be fetched here."
