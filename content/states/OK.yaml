code: OK
name: Oklahoma
regulator:
  name: "Oklahoma Real Estate Commission (OREC)"
  url: "https://oklahoma.gov/orec.html"
vendor: pearsonvue
vendor_notes: "OREC's Application & Exam FAQ page and the Pearson VUE Oklahoma Real Estate Candidate Handbook (#093800, July 2024) both name Pearson VUE as the exam administrator. Older PSI bulletins for Oklahoma still circulate online (PSI was the prior vendor) and should not be used. The entry-level exam is the 'OK Salesperson' exam, which qualifies for the Provisional Sales Associate license."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: 15
  time_minutes: 240
  pass_score_national: "70% scaled"
  pass_score_state: "70% scaled"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 75
  retake_policy: "Handbook: 'Candidates are allowed unlimited attempts to pass their necessary examination(s) within one (1) year of their approved application through the Commission... The salesperson and broker examination are divided into two parts: the national portion and the Oklahoma portion. Candidates will receive a score for each portion of the exam. If the candidate passes one part of the exam, the candidate will only need to retake the portion that was failed. Candidates are not permitted to retake an exam once they have passed that portion for one full year.' OREC FAQ: each portion may be taken via OnVUE remote proctoring up to three times during the one-year authorization; additional attempts must be at a Pearson VUE test center."
  calculator_policy: "Handbook: 'Personal calculators are NOT permitted, but an online calculator is available as part of the exam.'"
