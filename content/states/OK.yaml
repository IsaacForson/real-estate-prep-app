notes: "Handbook exam table: OK Salesperson State = 40 scored items + 10 pretest, 90 minutes; OK Salesperson National = 80 scored + 5 pretest, 150 minutes; passing 70% scaled per portion (numeric scores reported only to failing candidates). Broker: State 50 + 10 pretest (90 min), National 80 + 5 pretest (150 min), 75% scaled each. The 093801 outline (state outline effective April 2, 2024) states 5-10 pretest items per state exam; pretest_items here uses the handbook table (5 national + 10 state). Fees: $75 per salesperson portion and $90 per broker portion, but 'Any two exams scheduled at the same time on the same order will be discounted as two-for-one' (both salesperson portions on one order = $75 total). Pre-license: 59 O.S. § 858-302 requires 90 clock hours for provisional sales associate (plus 45 hours post-license); § 858-303 requires 90 clock hours of advanced instruction plus the Broker in Charge course (OREC FAQ describes it as a 15-hour course) and 2 years' active licensure for broker. The Code & Rules Book PDF (as of Nov 1, 2025) reprints Title 59 §§ 858-101 et seq. and OAC Title 605; the statutes are also on OSCN (oscn.net, Title 59) and rules at rules.ok.gov, which could not be fetched from this environment."
