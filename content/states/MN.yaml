notes: "PSI bulletin dated 10/1/2023 (still the bulletin served at test-takers.psiexams.com/mnre). Time: general 2.5 hours + state 1.5 hours = 4 hours. 'You must get 75% correct to pass' applies to each portion. Pre-license: 90 hours in three 30-hour courses; only Course I (30 hrs) is required BEFORE the salesperson exam, Courses II and III before licensure. Broker: 30-hour broker course plus salesperson education/exam. Note the revisor.mn.gov search excerpt of Minn. Stat. ch. 82 mentions a 60-hour salesperson course; the current bulletin (the operative Commerce requirement) states 90 hours — flag for review. Wisconsin licensees have a 13-hour reciprocity course path. Abstracter exam (50 items) is also administered under this bulletin."
