vendor_notes: "The Department of Commerce site directs real estate and appraiser exam candidates to PSI (866-395-1006); an older Commerce news release referenced Pearson VUE, but the current scheduling page and bulletin are PSI."
salesperson_exam:
  national_items: 80
  state_items: 50
  total_items: 130
  pretest_items: "5-10 experimental questions; not scored but count against exam time"
  time_minutes: 240
  pass_score_national: "75%"
  pass_score_state: "75%"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 68
  retake_policy: "'The combined salesperson and broker examination is divided into two (2) portions: general and state. Candidates who pass one (1) portion of the examination and fail the other need to retake only the section they failed. Candidates do not need to retake the entire combined exam.' No same-day rebooking; a candidate who fails on Wednesday can call Thursday and retest as soon as Friday. Fees: $45 for a single portion (state or national), $68 for the combo; fees are non-refundable and forfeited if not tested within 1 year of payment. Taking the exam before completing Course I invalidates the result."
  calculator_policy: "Handheld calculators are listed among prohibited electronic devices. The bulletin does not state whether an on-screen calculator is provided."
