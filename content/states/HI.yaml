notes: "Item counts/times come from the PSI Examination Summary Table excerpt of the Hawaii CIB hosted on the DCCA site (Salesperson: Uniform 80 items/150 min, State 50 items/90 min, Combo 130/240 min; Broker identical counts; 5-10 unscored pretest items). That DCCA-hosted excerpt is undated and omits fee/calculator pages; the full current PSI bulletin is only served inside PSI's logged-in test-taker app (candidate.psiexams.com testid 1665 salesperson / 1664 broker), so the exam fee and calculator policy are left null. Passing scores (70 salesperson / 75 broker on both the uniform and State portions) and the retake rule are from HAR §16-99-29; prelicense hours (60 salesperson / 80 broker class hours) from HAR §16-99-36. Broker candidates need a Broker Experience Certificate before testing. The capitol.hawaii.gov statute URL returns 403 to automated clients; DCCA also hosts an official PDF of HRS ch. 467 (listed in sources)."
