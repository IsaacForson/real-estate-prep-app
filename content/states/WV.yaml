notes: "Handbook rev01/2026 (Pearson VUE #094900); exam fee raised from $55 to $59 per part effective Feb 1. Fee is $59 per portion ($118 for both) plus WVREC $25 exam application fee. Time: 150 min national + 60 min state (salesperson); 150 + 90 (broker). State outline effective Jan 1, 2024; national outline effective Apr 1, 2025. Broker pre-license is 180 clock hours total; an existing WV salesperson needs 90 additional broker hours (30 Brokerage Operation & Management, 25 HR Management, 35 WV-specific). Course must be completed within 3 years before application. Handbook does not state a calculator policy (only that the administrator provides materials for notes/calculations). Statute page (code.wvlegislature.gov) is behind a JavaScript challenge; citation confirmed via WVREC's references to W. Va. Code § 30-40-11 and § 30-40-15. 174 CSR 1 current effective date April 7, 2026."
