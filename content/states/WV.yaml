  name: "West Virginia Real Estate Commission (WVREC)"
  url: "https://rec.wv.gov/"
vendor: pearsonvue
vendor_notes: "Pearson VUE administers the exams; candidates must first apply to WVREC ($25 exam application fee) and receive authorization to test by email from Pearson VUE. Test-center and OnVUE (online proctored) delivery available."
salesperson_exam:
  national_items: 80
  state_items: 50
  total_items: 130
  pretest_items: "5 per portion per fee table (state outline says 5-10); unscored"
  time_minutes: 210
  pass_score_national: "scaled score 70 (handbook: 'Passing score: Salesperson 70%'; scaled 0-100)"
  pass_score_state: "scaled score 70 (handbook: 'Passing score: Salesperson 70%'; scaled 0-100)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 59.00
  retake_policy: "Handbook: 'Authorization is good for ninety (90) days or two attempts after approval (whichever comes first). Exam results are good for 90 days from the date of passing... Candidates are not permitted to retake a part of the exam that has already been passed during the ninety (90) day authorization period. Candidates have 90 days from the date they pass one part of the exam to pass the other part.' 'Those who pass one part of the examination and fail the other, need to retake ONLY the failed part and must do so within the authorization period. If a candidate only passes one part of the exam in the first ninety (90) days, and the authorization period expires, the candidate must resubmit an initial application with the West Virginia Real Estate Commission, pay the reexamination fee, and be authorized again for the part they did not pass.' OnVUE: 'Candidates are allowed one attempt for life at each level, Sales or Broker.'"
  calculator_policy: null
