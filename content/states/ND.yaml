  name: "North Dakota Real Estate Commission (NDREC)"
  url: "https://www.realestatend.org/"
vendor: psi
vendor_notes: "PSI Services LLC conducts examination testing under contract with the NDREC; there are no eligibility requirements to sit for the exam and candidates register and pay PSI directly."
salesperson_exam:
  national_items: 100
  state_items: 40
  total_items: 140
  pretest_items: "A small number of experimental questions may be administered; unscored, but they count against examination time"
  time_minutes: 240
  pass_score_national: "70/100"
  pass_score_state: "30/40"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 134.00
  retake_policy: "'The combined broker examination is divided into two (2) portions: general and state. Candidates who pass one (1) portion of the examination and fail the other need to retake only the section they failed. Candidates do not need to retake the entire combined exam. The fee is $134 whether you are taking one portion or two portions.' 'There are no eligibility requirements for the examination. If you fail, you may test unlimited for a 12 month period.' 'Your examination fee will be forfeited if you do not test within 1 year of the date your examination fee is received by PSI.'"
  calculator_policy: "Handheld calculators are listed among prohibited electronic devices ('electronic watches, handheld calculators, headsets...'). The bulletin does not state whether an on-screen calculator is provided."
