notes: "Bulletin edition dated 10/1/2025 (PSI). Time per portion: National 150 min, State 90 min. Salesperson national portion is 100 items (unusual; most PSI states use 80). NDREC's 'How To Apply' page: 90-hour salesperson pre-licensure course; 60-hour broker pre-licensure course (broker applicants must also hold a salesperson license for the prior 2 years). The Commission also publishes a combined 'License Law and Rules' book (Sept 2022) at realestatend.org. The rules_url is the ndlegis.gov PDF of chapter 70-02-01; article 70-02 has multiple chapters (70-02-01 through 70-02-05) under the same ndlegis.gov acdata path."
