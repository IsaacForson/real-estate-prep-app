vendor: psi
vendor_notes: "Tennessee's entry-level license is 'Affiliate Broker' (no salesperson license); that exam is mapped to salesperson_exam. PSI Services LLC administers the Affiliate Broker, Broker, Timeshare Salesperson and Acquisition Agent exams (https://test-takers.psiexams.com/tnre). The education provider transmits affiliate broker eligibility to PSI electronically."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: 10
  time_minutes: 240
  pass_score_national: "56/80 (70%)"
  pass_score_state: "28/40 (70%)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 63
  retake_policy: "Bulletin: 'The affiliate broker and broker examinations are divided into two sections: national and state. Candidates who pass one section but fail the other need retake only the section they failed. The passing score for one section of an examination is valid for two (2) retakes of the failed section or one (1) year, whichever comes first.' 'Affiliate broker and broker examinations candidates who fail the first attempt at the examination may retake it as soon as they want (however you cannot schedule until the day after you took the examination). After the second attempt, an examination candidate must wait thirty (30) days between any subsequent failed exams to retake the examination.' Exam fee valid one year; license application must be filed within one year of passing."
  calculator_policy: "Bulletin lists 'handheld calculators' among prohibited electronic devices; it does not mention an on-screen calculator."
