notes: "Bulletin (PSI, Updated 7/1/2025) Examination Summary Table: Affiliate Broker National 80 items (80 points) 160 minutes; State 40 items (40 points) 80 minutes. Broker National 75 items (80 points; some items scored up to two points) 150 minutes; State 50 items (50 points) 90 minutes. Minimum passing: Affiliate Broker 56 (70%) national / 28 (70%) state; Broker 60 (75%) national / 38 (75%) state. Experimental questions: 'a small number' unscored items may be administered and count against exam time; PSI's standard range is 5-10 (pretest_items records 10). Fees: Affiliate Broker and Broker: Full $63.00, State Only $26.00, National Only $37.00. Pre-license: affiliate broker 'must complete a total of 90 hours of real estate education. Sixty (60) of those hours must cover the topic of real estate principles/fundamentals and must be completed in order to qualify to take the licensing exam with PSI. The remaining 30-hour Course for New Affiliates must be completed before a license will be issued. (T.C.A. § 62-13-303(b)(2); Rule 1260-05-.03)'. Broker: 120 classroom hours (30 of which 'Office/Broker Management') plus 36 months' active licensure, and 120 hours post-licensing within 3 years. Tennessee's official code is hosted on LexisNexis; the statute_url is TREC's Laws page, which links to Title 62, Chapter 13. TREC's Rules page redirects to the Secretary of State rules publication (rules_url)."
