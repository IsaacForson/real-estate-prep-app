notes: "Bulletin Examination Summary Table: Broker National 80 items (80 points) 150 minutes; State 50 items (50 points) 90 minutes. Principal Broker National 75 items (80 points; some questions scored up to two points) 150 minutes; State 50 items 90 minutes. 'A score of 75% is required to pass all real estate examinations. For examinations with state and national sections, you must score 75% or better on both sections.' Experimental questions: 'a small number (5 to 10)' unscored items may be administered and DO count against exam time (pretest_items records the upper bound). Exam fee $75 per attempt (covers a sitting of one or both sections). Principal broker: current Oregon brokers need the 40-hour Brokerage Administration and Sales Supervision (BASS) course plus three years' active experience; out-of-state applicants also need the 150-hour broker course. State content outlines are contained in the bulletin (no separate outline document). Fingerprinting ($56.25 at 1/1/2026 bulletin: $46.25 OSP + $15 PSI) is done at the PSI center after passing. The Agency's laws page links ORS 696 on oregonlegislature.gov and OAR 863 on the Secretary of State OARD site; those two sites could not be fetched directly from this environment."
