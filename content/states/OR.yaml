code: OR
name: Oregon
regulator:
  name: "Oregon Real Estate Agency (OREA)"
  url: "https://www.oregon.gov/rea"
vendor: psi
vendor_notes: "Oregon has no 'salesperson' license; the entry-level license is Real Estate Broker, so the Broker exam is mapped to salesperson_exam and the Principal Broker exam to broker_exam. PSI Services LLC administers all Oregon real estate exams (Broker, Principal Broker, Property Manager, Timeshare, Reactivation) per the PSI Candidate Information Bulletin (Updated 1/1/2026) and the Agency's Broker Licensing page."
salesperson_exam:
  national_items: 80
  state_items: 50
  total_items: 130
  pretest_items: 10
  time_minutes: 240
  pass_score_national: "75%"
  pass_score_state: "75%"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 75
  retake_policy: "Bulletin: 'The examination fee is valid for one exam attempt. If you fail, you may retake the examination after rescheduling and paying another fee to PSI. Broker and Principal Broker Applicants. If you pass only one section of the Broker or Principal Broker License examination, you are only required to retake the failed section. The score for the section passed is valid for 12 months; if the other section of the examination is not passed by then, both sections of the exam must be retaken.' No same-day rebooking: 'A candidate who fails an exam on a Wednesday can call the next day, Thursday, and can retest as soon as Friday.' 'Passing scores are valid for one year from the date of passing. You must activate your license within that time or you will need to retake the examination.'"
  calculator_policy: "Bulletin lists 'handheld calculators' among prohibited electronic devices; at a PSI test site 'you will be given a piece of scratch paper and a pencil.' The bulletin does not mention an on-screen calculator."
