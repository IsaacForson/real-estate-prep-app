notes: "Handbook rev04/2025 (Pearson VUE #095100). Fee is $80 per portion at a test center ($160 both) or $90 per portion via OnVUE. Time: 2.5 hours national + 1.5 hours state. National outline effective Apr 1, 2025; state outline effective Jan 1, 2021. PRE-LICENSE HOURS ARE NOT A SINGLE FIXED NUMBER: the Commission's 'Pre-Licensing Course Outlines and Provider Application Instructions' states 'State Law requires that the combined total of Salesperson Course I and Salesperson Course II be a minimum of 30 hours' while the Commission 'prefers' Course I be at least 40 hours and Course II at least 21 hours and 'recommends' the Wyoming Law module be at least 7 hours (hence the 68-hour figure commonly quoted by schools). The same 30-hour statutory minimum / 40+21 preference applies to Broker Course I and II; Responsible Broker applicants also need an 8-hour Wyoming Real Estate Management course within one year before applying. Course completion must be within one year before application (Rules ch. 1). Applicants actively licensed elsewhere complete Course I (state portion) and Course II only and take only the state exam. Apply within 90 days of the last exam date; $300 license fee; fingerprints ($39) and E&O insurance required. Commission rules are hosted by the Commission as Google Drive PDFs; the Secretary of State's rules.wyo.gov is the official register (LII/Justia index them as Wyo. Admin. Code agency 018)."
