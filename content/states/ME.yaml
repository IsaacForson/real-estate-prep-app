notes: "Candidate Handbook #092000 dated December 2025. No broker examination exists in Maine: the Associate Broker license (2 years as Sales Agent + 'The Associate Broker Course') and the Broker/Designated Broker license (2 years as Associate Broker + 'Broker/Designated Broker Course') are earned by education/experience only, so broker_exam is null by design. Course hours for the Associate Broker and Broker courses were not found in a primary source (Commission rules Ch. 360/390 do not state hours). Time: general 2.5 hours (150 min) + Maine Law 1.5 hours (90 min). The Maine Law content outline changes effective September 1, 2026 (old outline valid through August 31, 2026). Sales Agent license is issued for 2 years and cannot be renewed; licensee must advance to Associate Broker. Reciprocity candidates take only the 50-item Maine Law exam, which 'does not satisfy the law portion of the Sales Agent exam'."
