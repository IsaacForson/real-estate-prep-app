vendor_notes: "Maine's entry-level license is the 'Sales Agent'; the Pearson VUE 'Sales Agent Exam' has a general (national) portion and a Maine Law portion. A separate 50-item 'Maine Law' exam is used for reciprocity/reinstatement only."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: "10-20 (5 national + 5-15 Maine Law); not scored"
  time_minutes: 240
  pass_score_national: "75 (scaled score, 0-100)"
  pass_score_state: "75 (scaled score, 0-100)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 88
  retake_policy: "'Sales Agent candidates may retake the Sales Agent Exam multiple times as long as they do so before the expiration date of the Course Completion Certificate. Course Completion Certificates are valid for one year.' 'Sales Agent candidates must schedule to retake the Sales Agent Exam regardless of failing one or both portions of that exam. The candidate will automatically be administered the required portion(s) of the exam by Pearson VUE.' Candidates must wait 24 hours before making a reservation for reexamination. The $88 fee applies to each reservation."
  calculator_policy: "'Calculators are permitted only if they are silent, hand-held, nonprinting, and without an alphabetic key pad. Financial calculators are not permitted. Calculator malfunctions are not grounds for challenging examination results or requesting additional examination time.'"
