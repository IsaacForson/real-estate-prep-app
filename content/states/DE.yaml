notes: "Candidate Handbook #090800 dated January 2026. Salesperson: national 80 scored (+5 pretest) and Delaware state 40 scored (+10 pretest); broker: national 80 (+5) and state 50 (+10). 'Candidates will be given four (4) hours to complete the examination' (both portions in one sitting; no per-portion split published). Scaled passing score 70; portions passed separately and only the failed portion is retaken, within one year of completing pre-licensing education, with a maximum of 3 attempts before the course must be repeated. Fee $88. Handbook cites 24 Del. C. § 2907 and Commission Regulations 2.0 and 3.0 for qualification/examination. DPR licensure pages require 'the certificate that you received when you completed the 99-hour Delaware salesperson's pre-licensing course' and, for brokers, a '99-hour Delaware broker's pre-licensing course certificate' (broker applicants also need active licensure experience). Newly licensed salespersons must complete 12 hours of new-salesperson modules within 90 days. Out-of-state licensees take only the Delaware state portion after obtaining a Client Waiver from Pearson VUE. The regulations.delaware.gov pages render content via script, so the regulation text itself was not machine-read; the citation follows the handbook and DPR links."
