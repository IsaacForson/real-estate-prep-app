regulator:
  name: "Ohio Division of Real Estate & Professional Licensing, Department of Commerce"
  url: "https://com.ohio.gov/divisions-and-programs/real-estate-and-professional-licensing/real-estate-and-professional-licensing"
vendor: psi
vendor_notes: "PSI Services LLC conducts examination testing under contract with the Division. Candidates first apply to the Division ($81 salesperson / $135 broker exam application fee + background check); the Division transmits eligibility to PSI, who issues the Candidate Information Bulletin; candidates then pay PSI the exam fee."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: "5 to 10 experimental questions may be administered; unscored, but they count against examination time"
  time_minutes: 180
  pass_score_national: "70%"
  pass_score_state: "70%"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 66.00
  retake_policy: "'You must pass both portions of the examination within 12 months of the date on the label of the initial Candidate Information Bulletin from PSI.' 'You must take both portions of the exam in the same examination session unless you have previously passed a single portion.' 'Candidates who fail one or both portions of the examination must submit a retake application service request and appropriate fee to the Division.' 'You must re-apply, using the Retake Application service request, for the portion you failed, and retake the examination, within the 12-month period.' 'If you are over your 12-month eligibility period, you must start the process over using either the Sales Exam Application or the Broker Exam Application.' Fees: State & National together $66; National only $46; State only $43 (same for retakes). Exam fee forfeited if not tested within 1 year of PSI receiving it."
  calculator_policy: "Handheld calculators are listed among prohibited electronic devices ('electronic watches, handheld calculators, headsets...'). The bulletin does not state whether an on-screen calculator is provided."
