notes: "Bulletin edition dated 7/1/2026 (PSI, salesperson; the broker bulletin is https://test-takers.psiexams.com/api/content/bulletin/1002). Time per portion: National 120 min, State 60 min. Salesperson pre-license = 120 hours: Real Estate Principles and Practices 40, Ohio Real Estate Law 40, Real Estate Appraisal 10, Real Estate Finance 10 (HB 238 reduced appraisal/finance from 20 to 10 hours each for applicants on/after April 9, 2025). Broker applicants need the same 120 hours of real estate courses plus four additional college-level courses (Financial Management, Human Resources/Personnel Management, Applied Business Economics, Business Law, no hour count stated), an active salesperson license for 2 of the last 5 years, and 20 qualifying transactions; the 120 recorded here is the real-estate-course component only. Division exam application fees: $81 salesperson, $135 broker (separate from PSI's exam fee). codes.ohio.gov refused automated fetches during verification; URLs are the standard official Ohio Laws paths confirmed by search results."
