salesperson_exam:
  national_items: 80
  state_items: 30
  total_items: 110
  pretest_items: "1-10 experimental items (approx. 10%); not scored but count against exam time"
  time_minutes: 120
  pass_score_national: "56 of 80 (70%)"
  pass_score_state: "21 of 30 (70%)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 44
  retake_policy: "'If you do not pass, you must retake and pass the portion(s) which you failed before you can be licensed.' No same-day rebooking: 'A candidate who tests unsuccessfully on a Wednesday can call the next day, Thursday, and retest as soon as Friday.' 'There is no limit to the number of times that you can retake the entire examination for qualified candidates.' 'A passing score on a portion is valid until the deadline based on your course completion date' (applicants must pass both portions within 1 year of course completion); otherwise a new pre-licensing program is required and prior scores expire. The $44 fee is charged for each registration, whether taking one or both portions. Must apply for license within one year of passing or the score expires."
  calculator_policy: "'Only non-programmable calculators that are silent, battery-operated, do not have paper tape printing capabilities, and do not have a keyboard containing the alphabet will be allowed in the examination site.'"
