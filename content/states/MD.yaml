notes: "PSI bulletin 'Updated 8/15/2024'. Time allowed: national 90 minutes + state 30 minutes = 120 minutes. Passing scores are stated as raw scores (56 national, 21 state salesperson; 28 state broker), i.e. 70% of each portion. National broker exam has 75 questions worth 80 points (some scored up to two points). Effective 3/31/2025 PSI no longer processes license applications; salesperson eligibility is transmitted by the education provider and expires one year after issuance. The content outline is inside the bulletin (no separately published state outline)."
