notes: "PSI bulletin copyright 2024, dated 3/28/2024 (most recent version found; fee of $210 cross-checked against WAC 308-124A-775 'Application/examination $210.00' and 'Reexamination 210.00'). Time is 150 min national + 90 min state for both exams. Broker pre-license = 60-hour Real Estate Fundamentals + 30-hour Real Estate Practices (RCW 18.85.101: 90 hours), completed within 2 years before the exam. Managing Broker requires 90 clock hours (brokerage management, advanced real estate law, business management) plus 3 years' experience within the prior 5 years. Reciprocity/out-of-state licensees take only the state portion. Third-party prep sites quote $138.25 as the exam fee; that figure was not found in any primary source."
