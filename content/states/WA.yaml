regulator:
  name: "Washington State Department of Licensing (DOL), Real Estate Licensing; Washington Real Estate Commission"
  url: "https://dol.wa.gov/professional-licenses/real-estate-brokers"
vendor: psi
vendor_notes: "DOL: 'We partner with PSI Testing Excellence to offer real estate broker exams' (test-takers.psiexams.com/ware). Washington's entry-level license is 'Broker' (equivalent to salesperson elsewhere); the supervisory license is 'Managing Broker'. salesperson_exam below = Broker exam; broker_exam = Managing Broker exam."
salesperson_exam:
  national_items: 100
  state_items: 30
  total_items: 130
  pretest_items: "5-10 unscored experimental questions may be administered; they count against exam time"
  time_minutes: 240
  pass_score_national: "scaled score 70"
  pass_score_state: "scaled score 70"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 210.00
  retake_policy: "Bulletin: 'If you fail any portion of the broker or managing broker examination... You will only be required to repeat the portion(s) that you failed. Candidates who pass only one portion must pass the other portion within six (6) months of passing the first portion. Failure to do so will result in having to take the entire examination again.' Exam fee forfeited if you do not test within 1 year of PSI receiving the fee. DOL: 'Your exam results are valid for 1 year. If you don't apply for a license before your results expire, you'll have to reapply to take the exam.'"
  calculator_policy: "Bulletin: 'Physical calculators are allowed for Test Centers but not for Remote Proctored exams.' (listed under prohibited electronic devices exception)."
broker_exam:
  national_items: 90
  state_items: 44
  total_items: 134
  pretest_items: "5-10 unscored experimental questions may be administered"
  time_minutes: 240
  pass_score_national: "scaled score 75 (90 items worth 100 points; scenario items scored up to 2 points)"
  pass_score_state: "scaled score 75 (44 items worth 48 points)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 210.00
