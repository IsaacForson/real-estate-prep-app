notes: "PSI 'Missouri Real Estate Commission Real Estate Candidate Handbook' dated 7/18/2024 (same document served at test-takers.psiexams.com/more). Time: national 150 minutes + state 120 minutes = 270 minutes for both levels. Salesperson national portion is 100 items (larger than the usual 80). Pre-license: 48-hour pre-exam salesperson course (must be completed on/before the exam date) PLUS the 24-hour Missouri Real Estate Practice (MREP) course before licensure (may be taken before or after the exam) — prelicense_hours_salesperson = 72 total. Broker: 48-hour pre-exam broker course plus an active Missouri salesperson license for 24 of the last 30 months; licensed attorneys are exempt from education. statute_url and rules_url are the links published on MREC's own 'Rules and Statutes' page (revisor.mo.gov and sos.mo.gov block automated fetches); MREC also publishes a combined 'Statutes and Rules' book (RuleBook.pdf, June 2023)."
