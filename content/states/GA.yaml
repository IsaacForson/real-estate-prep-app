notes: "The 7/1/2026 GREC/PSI bulletin contains no examination summary table (no per-portion item counts, time limits or passing scores). The item counts above (National 100, Georgia 52, total 152) are taken from the sample score report reproduced in the bulletin (NATIONAL SUBTOTAL 100, GEORGIA SUBTOTAL 52, total 152). GREC Rule 520-1-.04(3) states the minimum passing score 'shall be published prior to the administration of the examination' rather than fixing it in rule. Bulletin says 1-10 experimental (unscored) items, roughly 10% of the exam, may be added and count against time. The National Broker exam contains scenario-based items weighted 0/1/2 points. Georgia has reciprocity (no exam) for licensees examined in other states, except Florida residents, who must pass the Georgia Supplement Exam. Licenses are issued by PSI at the test center. O.C.G.A. has no stable official deep link; GREC's License Law page is used for statute_url."
