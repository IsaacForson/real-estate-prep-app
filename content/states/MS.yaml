code: MS
name: Mississippi
regulator:
  name: "Mississippi Real Estate Commission (MREC)"
  url: "https://www.mrec.ms.gov/"
vendor: psi
vendor_notes: "Candidates apply to MREC first; MREC approval creates a 2-month exam eligibility window."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: "5-10 experimental questions; not scored and (per this bulletin) do not count against exam time"
  time_minutes: 240
  pass_score_national: "70% (56 points of 80)"
  pass_score_state: "75% (30 points of 40)"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 75
  retake_policy: "'To retake the examination, you only need to sit for the portion(s) you failed.' 'You may sit for the state portion of the examination only twice during the 2 months immediately following the approval of your application.' If you fail to schedule, fail to appear, or fail to pass both portions within that 2-month period you must re-apply to the Commission to establish eligibility. 'If you pass the state portion of the exam but fail the national portion, you may continue to take the national portion on an unlimited basis within the two (2) months following the date that your application was approved.' After two failures of the state portion, you may re-apply after a 3-month waiting period (salesperson) or 6 months (broker). 'BOTH state and national portions must be passed in the SAME 2-month eligibility period.' No same-day rebooking. Fee is $75 per registration whether taking one or both portions; retakes are $75; registration fees expire one year after registering."
  calculator_policy: "'You will have access to an online calculator.' Scratch paper and pencil are provided and returned to the proctor."
broker_exam:
  national_items: 75
  state_items: 40
  total_items: 115
  pretest_items: "5-10 experimental questions"
  time_minutes: 240
  pass_score_national: "75% (60 points of 80; 75 questions, some scored up to two points)"
  pass_score_state: "80% (32 points of 40)"
  pass_score_combined: null
