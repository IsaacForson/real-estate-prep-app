notes: "PSI bulletin 'Updated 10/1/2023' (the version linked from MREC's Applicants page; the bulletin at test-takers.psiexams.com/msre is the same document). Time: general 2.5 hours + state 1.5 hours = 4 hours. Passing percentages differ by portion and level: salesperson 70% general / 75% state; broker 75% general / 80% state. Salesperson applicants must be Mississippi residents (18+); broker applicants 21+ with 120 classroom hours AND an active sales license for the 12 months preceding application, or 150 college hours in a degree program without the experience. The official Mississippi Code is published by the Legislature through a third-party (Lexis) portal without stable URLs, so statute_url points to MREC's own compilation of the license law (Rev. 07-01-2026); rules_url is MREC's compilation of Title 30 Part 1601. MREC posted proposed amended regulations (08-04-2026) — check for updates."
