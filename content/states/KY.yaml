notes: "Sales Associate exam: General 80 items/150 min + State 50 items/90 min (240 min total); 'you must receive a score of at least 75% correct' on the exams. Broker general portion is 75 items worth 80 points (scenario-based items scored up to 2 points). 5-10 unscored experimental items may be added. The current PSI bulletin is dated 10/1/2023 (the 2015 edition showed 40 state items; now 50). KREC's page confirms the $100 fee, PSI as vendor and the calculator rule. Prelicense: sales associate 96 classroom hours from a Kentucky-approved school OR 6 academic credit hours in real estate; broker 336 classroom hours OR 21 academic credit hours (12 in real estate) OR a 12-credit/192-classroom-hour combination plus 9 elective college hours, plus 24 months' experience averaging 20 hrs/week (KREC notes a 48-hour broker management course is part of the broker education). apps.legislature.ky.gov refused connections from the research environment; both URLs were confirmed via Internet Archive captures."
