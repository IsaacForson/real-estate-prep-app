notes: "Candidate Handbook #093300 is dated August 2024 with 'fee updates effective August 1, 2025' (rev 02/2026). National outline effective April 1, 2025; Alabama state outline effective February 1, 2026. Scored as ONE overall scaled score (70 to pass) even though the exam has General and State sections; failing means retaking the whole exam. Reciprocal (out-of-state licensee) candidates take only the 40-item state exam ($53, 1 hr) after a 6-hour Alabama law course. Broker pre-license is also a 60-clock-hour course plus 24 of the prior 36 months actively licensed. Salesperson applicants have six months after course completion to pass; 30-hour post-license course required within 12 months of licensure. arec.alabama.gov refused automated connections on the verification date; URL taken from the handbook and search index."
