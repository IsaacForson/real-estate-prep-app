  name: "Nevada Real Estate Division (NRED), Department of Business and Industry"
  url: "https://red.nv.gov/"
vendor: pearsonvue
vendor_notes: "Pearson VUE administers the exam (test center or OnVUE online). Candidates must first register and pay the exam fee to the Real Estate Division at https://red.prod.secure.nv.gov; the Division transfers the record to Pearson VUE, which emails an Authorization to Test (2-3 business days) before scheduling."
salesperson_exam:
  national_items: 80
  state_items: 40
  total_items: 120
  pretest_items: "5 to 10 additional unscored pretest questions per portion, included in the time allotted (national content outline specifies 5 on the national portion; state outline says 5-10)"
  time_minutes: 240
  pass_score_national: "75%"
  pass_score_state: "75%"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 100.00
  retake_policy: "'The salesperson and broker examination is divided into two parts: general (national) and state. Those who pass one part of the examination and fail the other, need to retake only the failed part within twelve (12) months. Candidates who after twelve (12) months have not passed both parts must retake the entire examination.' 'The cost for each retake is the same as the initial examination' ($100 combination; $100 for a single portion). Passing exam results must be dated within 12 months when applying for the license."
  calculator_policy: "'Candidates are not permitted to bring or use their own calculator. However, a calculator is built into the following Real Estate examinations...: Broker, Business Broker, Community Association Manager, Property Manager, Salesperson, Timeshare Sales.' A tutorial on the in-exam calculator precedes the exam and does not reduce exam time."
