notes: "Handbook is the July 2025 edition (#092900, rev 09/2025); content outlines (#092901, 09/2025) effective April 1, 2025. Time per portion: General (National) 150 min, State 90 min. Exam fee is paid to the Division, not Pearson: Salesperson Combination $100, or $100 for either single portion (two-for-one combo pricing when both portions are scheduled together; online broker exams are not eligible for the combination discount). Salesperson pre-license is 120 hours (45 Principles, 45 Law incl. 18 hours Nevada law, 15 Contracts, 15 Agency incl. 3 hours foundation) per red.nv.gov (the handbook still prints the older 90-to-120 transition text). prelicense_hours_broker is null because Nevada's broker requirement is expressed as 64 semester college credits (real estate courses, broker management, business/economics credits, and/or licensed experience credit), not clock hours. Salesperson license application fee $140 (red.nv.gov; handbook prints $125). leg.state.nv.us blocked automated fetches; NRS/NAC 645 URLs are the Legislature's standard chapter paths."
