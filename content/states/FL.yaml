  retake_policy: "The exam is a single 100-item Florida exam (no separately passed national/state portions), so a failing candidate retakes the whole exam. Candidates who fail may review only the questions they answered incorrectly; the review request must be made within 21 days of the exam (CIB, Jan. 2025). Pearson VUE's Florida page adds that a retake within 21 days of an exam review requires a customer-service override. Pearson VUE's older Florida fact sheet (01/2017) states candidates who fail must wait 24 hours to schedule a re-examination."
