notes: "Florida's sales associate exam is NOT split into national/state portions: 100 items across 19 content areas (approx. 45% law, 45% principles/practices, 10% math per CIB percentages) graded as one score, 75 to pass. The current CIB (Sales Associate 'Effective January 2025'; Broker 'Effective March 2024') says exam fees increased Jan 3, 2023 and points to a DBPR fee schedule that could not be retrieved (the DBPR site sits behind a Cloudflare challenge; the CIBs were read via the Internet Archive copy of the official URLs). Pearson VUE's 2017 fact sheet lists $36.75 for sales and broker, but that predates the 2023 increase, so the fee is left null. Pilot/pretest items may be included, are unscored, and extra time is allotted; the count is not published. Prelicense hours (63 sales / 72 broker) come from Fla. Stat. s. 475.17(2)(a)."
