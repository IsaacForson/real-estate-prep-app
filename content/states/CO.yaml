vendor: psi
vendor_notes: "PSI Services LLC administers the Colorado Real Estate Broker Examination (test-takers.psiexams.com/core). Colorado has no salesperson license; the entry-level license is Associate Broker and all applicants take the single Broker exam. The salesperson_exam block below therefore describes the entry-level Broker exam."
salesperson_exam:
  national_items: 80
  state_items: 74
  total_items: 154
  pretest_items: null         # bulletin: unscored 'experimental' questions may be administered; count not stated
  time_minutes: 230           # National 120 min + State 110 min
  pass_score_national: "60 correct of 80"
  pass_score_state: "53 correct of 74"
  pass_score_combined: null
  grading: separate
  exam_fee_usd: 49            # first time; retake $48
  retake_policy: "'Applicants for licensure who must receive passing scores on both the general part and the state part of the examination need not receive them on the same administration date. If one part is failed, the applicant may retake it at a subsequent time. In no event will a passing score on either part of the exam be accepted beyond one year.' A new appointment cannot be made the same day as a failed exam (call next day; retest as soon as the following day). Exam fee is forfeited if the candidate does not test within 1 year of the date the fee is received. License application must be filed within one year of passing the entire exam or both portions must be retaken. Per Commission Rule 2.2.D the exam does not count if taken before pre-license education is complete."
  calculator_policy: "'Handheld calculators' are listed among prohibited electronic devices at the test center; the bulletin does not describe an on-screen calculator."
