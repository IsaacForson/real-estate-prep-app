notes: "Colorado licenses only brokers (Associate Broker is the entry level after 168 hours: Law & Practice 48, Colorado Contracts & Regulations 48, Trust Accounts & Record-Keeping 8, Current Legal Issues 8, Closings 24, Practical Applications 32). Both salesperson_exam and broker_exam blocks contain the same single Broker exam. Passing scores are raw counts (60/80 national, 53/74 state), not percentages. Two PSI-hosted copies of the Candidate Information Bulletin both carry 'Updated 10/1/2023': the current test-takers.psiexams.com copy (id 2598) lists fees $49.00 first-time / $48.00 retake, while the legacy proctor2.psionline.com copy (163.pdf) lists $44.95 / $42.50; the test-takers copy is used here. Confidence is medium because the bulletin is dated 2023 and the two copies disagree on fees. DRE says 'exam results are good for one year from the date of each portion's passing score.' Official C.R.S. text is published by the General Assembly via LexisNexis (leg.colorado.gov/laws/colorado-revised-statutes); DRE also reprints the license law in the Colorado Real Estate Manual, Chapter 1. Reciprocal and CE candidates take only the 74-question state portion."
