stem: A property manager threatens to raise rent for a tenant who filed a fair housing complaint.
  Under the Virginia Fair Housing Law, is the property manager’s action lawful?
options:
  - Yes, because rent increases are permitted under Virginia law
  - No, because threatening a tenant for exercising a fair housing right is unlawful
  - Yes, if the tenant’s lease permits rent increases under Virginia law
  - No, only if the threat is based on a protected class under Virginia law
key: B
explanation: Threatening a tenant for exercising a fair housing right constitutes coercion or
  intimidation, which is prohibited by Va. Code Ann. § 36-96.5. The distractor that focuses on rent
  increases being permitted misses the point that the threat itself is an unlawful retaliatory act
  regardless of the rent increase's legality.
