stem: A licensee publishes an advertisement stating 'Great home for a Catholic family.' Under the
  Virginia Fair Housing Law, is this advertisement lawful?
options:
  - The advertisement is lawful because it does not mention a protected class.
  - The advertisement is unlawful because it indicates a religious preference.
  - The advertisement is lawful if the licensee includes a general disclaimer.
  - The advertisement is unlawful only if the buyer is actually Catholic and the seller agrees.
key: B
explanation: The advertisement indicates a religious preference, which is prohibited under
  subsection A(3) as it constitutes prima facie evidence of an illegal preference that cannot be
  overcome by a general disclaimer. Therefore, the claim that a disclaimer makes it lawful is
  incorrect.
