stem: Which of the following is a protected class under the Virginia Fair Housing Law?
options:
  - Sexual orientation is a protected class under Virginia law
  - Education level is a protected class under Virginia law
  - Age is a protected class under Virginia law
  - Income level is a protected class under Virginia law
key: A
explanation: Sexual orientation is explicitly listed as a protected class in Va. Code Ann. § 36-96.4
  A, which prohibits discrimination based on that characteristic. Age alone is not a protected
  class; the law protects elderliness, not age in general, making the distractor about age
  incorrect.
