stem: Which of the following activities is considered a residential real estate-related transaction
  under the Virginia Fair Housing Law?
options:
  - Providing a loan to purchase a dwelling
  - Providing a loan to purchase a vehicle
  - Providing a loan to purchase securities
  - Providing a loan to purchase appliances
key: A
explanation: The Virginia Fair Housing Law defines a residential real estate-related transaction as
  the making or purchasing of loans or providing other financial assistance for purchasing,
  constructing, improving, repairing, or maintaining a dwelling. Providing a loan to purchase a
  dwelling falls under this definition. Providing a loan to purchase a car, stocks, or furniture
  does not involve a dwelling and therefore is not covered.
