stem: A Virginia homeowner who owns exactly two single-family houses and does not reside in the
  house being sold wants to sell it without using a real estate broker. Under the Virginia Fair
  Housing Law, which condition must also be met for the sale to be exempt from the law?
options:
  - The owner has not made another exempt sale of a non-owner-occupied single-family house within
    the previous 24 months.
  - The owner may use a broker's advertising services for the sale, provided the broker does not
    conduct any showings or negotiations.
  - The owner must reside in the house for at least six months prior to the sale to qualify for any
    exemption under this chapter.
  - The owner must obtain a written waiver from the Virginia Real Estate Board before listing the
    property, regardless of the exemption criteria.
key: A
explanation: Under Va. Code Ann. § 36-96.2(A), the exemption for a non‑owner‑occupied single‑family
  house is limited to one such sale within any 24‑month period when the owner does not use broker
  services. The statement that the owner may use a broker's advertising services for the sale,
  provided the broker does not conduct any showings or negotiations, is not supported by the
  statute.
