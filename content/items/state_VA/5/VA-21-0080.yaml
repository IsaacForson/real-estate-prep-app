stem: According to the Virginia Fair Housing Law, what must a charge issued by the Board include?
options:
  - A short and plain statement of the facts upon which the Board has found reasonable cause to
    believe that a discriminatory housing practice has occurred or is about to occur.
  - A detailed narrative of all alleged discriminatory acts mentioned in the original complaint,
    including dates, locations, and a requirement that the charge be filed within 30 days of the
    complaint.
  - A summary of the investigative report's conclusions regarding potential violations, recommended
    corrective actions, and a statement that the charge must include a copy of the complaint.
  - A list of all witnesses interviewed during the investigation, along with their contact
    information, statements, and an affidavit confirming each witness's credibility.
key: A
explanation: The statute requires that a charge consist of a short and plain statement of the facts
  on which the Board has found reasonable cause to believe a discriminatory housing practice has
  occurred or is about to occur. The other answer choices add requirements that the law does not
  impose, such as a detailed narrative of every alleged act, a summary of investigative conclusions
  with additional documents, or a list of witnesses with affidavits.
