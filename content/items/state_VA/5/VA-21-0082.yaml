stem: A buyer is presented with a deed that contains a restrictive covenant prohibiting ownership
  based on religion. What should the buyer do under the Virginia Fair Housing Law?
options:
  - The buyer should refuse to accept the deed until the covenant is removed.
  - The buyer should accept the deed but sue for damages after closing.
  - The buyer should ignore the covenant as it only applies to commercial property.
  - The buyer should accept the deed because restrictive covenants are enforceable if recorded.
key: A
explanation: Section 36-96.6(B) states that a person asked to accept a document affecting title may
  decline to accept it if it includes a prohibited covenant until the covenant is removed. Such
  covenants based on religion are void under subsection A. Accepting the deed with the covenant is
  not required, and the covenant does not apply only to commercial property.
citation:
  source: Va. Code Ann. § 36-96.1 et seq. — Code of Virginia Title 36, Chapter 5.1 — Virginia Fair
    Housing Law — § 36-96.6(B)
  url: null
  quoted_text: Any person who is asked to accept a document affecting title to real or leasehold
    property may decline to accept the same if it includes such a covenant or reversionary interest
    until the covenant or reversionary interest has been removed from the document.
