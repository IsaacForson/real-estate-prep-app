stem: A broker wants to pay a vendor for appraisal fees using money from an escrow account that
  holds funds for multiple clients. The escrow account's total balance is sufficient, but the amount
  allocated to the specific client whose closing is pending is insufficient. According to Virginia
  regulations, may the broker disburse the payment from the escrow account?
options:
  - The broker may disburse the payment because the total escrow balance is sufficient
  - The broker may disburse the payment after obtaining written consent from the client
  - The broker may not disburse the payment unless sufficient funds are on deposit for that specific
    client
  - The broker may disburse the payment by transferring funds from another client's escrow allocation
key: C
explanation: Under B.4, a licensee may not disburse funds from an escrow account unless sufficient
  money is on deposit for that individual client or property. The total account balance being
  sufficient does not override this requirement. The distractor that focuses on the total balance
  ignores the rule's focus on the specific client's credit.
citation:
  source: 18 VAC 135-20-10 et seq. — 18 VAC 135-20 — Virginia Real Estate Board Licensing Regulations
    — § 135-20-181
  url: null
  quoted_text: A licensee must not disburse or cause to be disbursed moneys from an escrow account
    unless sufficient money is on deposit in that account to the credit of the individual client or
    property involved.
