stem: A buyer and seller agree in writing that the earnest money deposit will be deposited into the
  broker's escrow account immediately upon receipt. According to Virginia law, when must the broker
  place the deposit in escrow?
options:
  - The broker must place the deposit by the end of the third business banking day following
    ratification.
  - The broker must place the deposit by the end of the fifth business banking day following
    ratification.
  - The broker must place the deposit immediately upon receipt of the deposit.
  - The broker must place the deposit within ten calendar days of ratification.
key: C
explanation: The parties’ written agreement to deposit the funds immediately overrides the statutory
  default of the fifth business banking day. The statute expressly allows the principals to agree
  otherwise in writing, making the immediate deposit the correct timing.
