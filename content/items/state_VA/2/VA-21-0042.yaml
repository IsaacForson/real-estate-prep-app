stem: According to Virginia real estate board regulations, what must be true of the name used for an
  escrow account maintained by a brokerage firm?
options:
  - It must be the name under which the firm is licensed
  - It must be the name of the firm's escrow account
  - It must be the name of the firm's principal broker
  - It must be the name of the financial institution
key: A
explanation: The regulation explicitly states that the escrow account must be in the name by which
  the firm or sole proprietorship is licensed. This ensures the account is clearly tied to the
  licensed entity. The distractor suggesting the account must be named after the firm's escrow
  account is incorrect because the rule requires the licensed name, not merely an escrow
  designation.
