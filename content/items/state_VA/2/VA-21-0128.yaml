stem: A property management licensee collects monthly rent from a tenant on Thursday, March 7. There
  is no written agreement with the landlord regarding the timing of escrow deposit. According to
  Virginia law, by what end of business day must the licensee place the rent into an escrow account?
options:
  - By the end of the business day on the following Tuesday.
  - By the end of the business day on the following Thursday.
  - By the end of the business day on the following Friday.
  - By the end of the business day on the following Monday.
key: B
explanation: Va. Code Ann. § 54.1-2108.1(B)(1) requires rent paid to a licensee on behalf of a
  landlord to be placed in an escrow account by the end of the fifth business banking day following
  receipt, unless otherwise agreed in writing. Counting five business days from Thursday, March 7
  (Friday, Monday, Tuesday, Wednesday, Thursday) leads to the following Thursday. The option stating
  the following Thursday matches this deadline; the other options reflect incorrect day counts.
citation:
  source: Va. Code Ann. § 54.1-2108.1(B)(1)
  url: null
  quoted_text: Any rent paid to a real estate licensee acting on behalf of a landlord client in
    connection with the lease shall be placed in an escrow account by the end of the fifth business
    banking day following receipt, regardless of when received, unless otherwise agreed to in
    writing by the principals to a lease transaction.
