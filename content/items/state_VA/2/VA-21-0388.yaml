stem: A licensee receives monthly property management fees that are deposited into the firm's escrow
  account and belong to the licensee. The licensee withdraws these fees from the escrow account
  every eight months. According to Virginia Real Estate Board regulations, what is the effect of
  this practice?
options:
  - The practice is permissible because the funds belong to the licensee under Virginia law.
  - The practice constitutes commingling because withdrawals exceed the six‑month interval limit.
  - The practice is allowed as long as the licensee maintains separate records for all escrow funds.
  - The practice is prohibited only if the escrow account balance falls below the required minimum.
key: B
explanation: The regulation states that withdrawals of funds belonging to the licensee must occur at
  intervals of not more than six months to avoid commingling. An eight‑month interval exceeds this
  limit, so the practice constitutes commingling. The distractor that claims permissibility because
  the funds belong to the licensee ignores the interval requirement.
