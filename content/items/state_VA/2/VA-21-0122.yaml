stem: A broker receives an earnest money deposit on Tuesday after a purchase contract is ratified on
  Monday. The parties have not agreed otherwise in writing. By what deadline must the broker place
  the deposit into the firm's escrow account?
options:
  - By the end of the first business banking day following ratification.
  - By the end of the third business banking day following ratification.
  - By the end of the fifth business banking day following ratification.
  - By the end of the seventh business banking day following ratification.
key: C
explanation: Under Virginia law, an earnest money deposit received by a broker must be placed in the
  firm's escrow account by the end of the fifth business banking day following ratification of the
  contract, unless the parties agree otherwise in writing. The other answer choices set a deadline
  of the first, third, or seventh business banking day, which do not match the statutory
  requirement.
citation:
  source: Va. Code Ann. § 54.1-2100 et seq. — Code of Virginia Title 54.1, Chapter 21 — Real Estate
    Brokers, Salespersons and Rental Location Agents — § 54.1-2108.2
  url: null
  quoted_text: Upon the ratification of a contract, an earnest money deposit received by the principal
    broker or supervising broker, or an agent of such principal broker or supervising broker, that
    is to be held in the firm's escrow account shall be placed in such escrow account by the end of
    the fifth business banking day following ratification, unless otherwise agreed to in writing by
    the principals to the transaction,
