stem: A broker purchases a certificate of deposit using funds from an escrow account and then
  pledges the certificate as collateral for a loan. According to Virginia regulations, what is the
  status of this action?
options:
  - The action is permitted provided the certificate is held in the broker's name
  - The action is prohibited because it constitutes commingling of escrow funds
  - The action is permitted if the broker obtains written consent from the client
  - The action is permitted because the escrow funds remain invested
key: B
explanation: D.2 expressly provides that using escrow funds to purchase a certificate of deposit and
  then pledging that certificate constitutes commingling, which is prohibited. The distractor
  suggesting the action is permitted if the funds remain invested overlooks the specific prohibition
  on pledging the certificate.
