stem: A licensee holds earnest money deposits in an escrow account for a buyer and seller. According
  to Virginia law, what action is prohibited regarding those funds?
options:
  - Diverting or misusing the escrow funds
  - Investing the escrow funds in interest-bearing accounts
  - Commingling the escrow funds with personal money
  - Failing to deposit escrow funds within five days
key: A
explanation: The statute explicitly prohibits a licensee from diverting or misusing escrow funds
  held for another. Investing, commingling, or failing to deposit timely are not prohibited by this
  specific provision.
citation:
  source: Va. Code Ann. § 54.1-2108
  url: null
  quoted_text: No licensee or any agent of the licensee shall divert or misuse any funds held in
    escrow or otherwise held by him for another.
