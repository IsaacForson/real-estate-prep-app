stem: If the Virginia Real Estate Board believes a licensee **cannot** adequately protect escrow
  funds and petitions the court for a receiver, within how many days must the Board decide whether
  to pay the receiver’s expenses from the Virginia Real Estate Transaction Recovery Fund or from
  Board funds after receiving the court‑approved invoices?
options:
  - Within thirty calendar days
  - Within forty-five calendar days
  - Within ten calendar days
  - Within fifteen calendar days
key: A
explanation: The law states that the Board’s determination whether to pay receiver expenses from the
  Recovery Fund or Board funds must be made within thirty days of receiving the court‑approved
  invoices. The fifteen‑day option confuses this with the protest period for earnest money releases.
