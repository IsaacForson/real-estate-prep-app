stem: According to Virginia law, by what deadline must a real estate licensee place an application
  deposit received from a prospective tenant into an escrow account, unless otherwise agreed in
  writing?
options:
  - By the end of the first business banking day following approval of the rental application by the
    landlord.
  - By the end of the third business banking day following approval of the rental application by the
    landlord.
  - By the end of the fifth business banking day following approval of the rental application by the
    landlord.
  - By the end of the seventh business banking day following approval of the rental application by
    the landlord.
key: C
explanation: The statute requires that an application deposit be placed in escrow by the end of the
  fifth business banking day after the landlord approves the rental application, unless the parties
  agree otherwise in writing. The answer choices that state the deposit must be placed by the end of
  the first business banking day, the end of the third business banking day, and the end of the
  seventh business banking day are incorrect because they do not match the statutory period.
citation:
  source: Va. Code Ann. § 54.1-2100 et seq. — Code of Virginia Title 54.1, Chapter 21 — Real Estate
    Brokers, Salespersons and Rental Location Agents — § 54.1-2108.1
  url: null
  quoted_text: Any application deposit as defined by § 55.1-1200 paid by a prospective tenant for the
    purpose of being considered as a tenant for a dwelling unit to a real estate licensee acting on
    behalf of a landlord client shall be placed in escrow by the end of the fifth business banking
    day following approval of the rental application by the landlord, unless otherwise agreed to in
    writing by the principals to a lease transaction.
