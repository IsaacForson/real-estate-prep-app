stem: Under the Virginia Property Owners' Association Act, how is a 'lot' defined?
options:
  - Any plot or parcel of land designated for separate ownership or occupancy shown on a recorded
    subdivision plat for a development or the boundaries of which are described in the declaration
    or in a recorded instrument referred to or expressly contemplated by the declaration, other than
    a common area, and a unit in a condominium association or a unit in a real estate cooperative if
    the condominium or cooperative is a part of a development
  - A unit in a condominium association or a unit in a real estate cooperative if the condominium or
    cooperative is part of a development, together with any limited common elements assigned to that
    unit, and excluding any common area or facilities owned by the association, but not including
    any plot or parcel of land described in a recorded subdivision plat or in the declaration
  - A plot or parcel of land designated for separate ownership or occupancy shown on a recorded
    subdivision plat for a development, excluding any common area or facilities owned by the
    association, and including any exclusive use areas assigned to the lot owner, and also
    mentioning any appurtenant easements and rights-of-way, but still omitting the declaration‑based
    boundary description and the condominium or cooperative unit
  - A plot or parcel of land designated for separate ownership or occupancy shown on a recorded
    subdivision plat for a development, including any appurtenant easements, rights-of-way, and
    located within the Commonwealth, and excluding any common area or facilities owned by the
    association, but not including any condominium or cooperative unit or any limited common
    elements assigned to such units
key: A
explanation: The Virginia Property Owners' Association Act defines a 'lot' as either (i) any plot or
  parcel of land shown on a recorded subdivision plat for a development, or whose boundaries are
  described in the development's declaration or a referenced instrument, provided it is not a common
  area, or (ii) a unit in a condominium association or a real estate cooperative when that
  condominium or cooperative is part of the development. The correct answer includes both of these
  alternatives. One answer only covers the plat‑based description and omits the declaration‑based
  boundary description and the condominium/cooperative unit. Another answer only covers the
  condominium/cooperative unit and omits the plat‑based and declaration‑based land descriptions. The
  remaining answer includes the plat‑based description with exclusions for common area but still
  leaves out the declaration‑based boundary description and the condominium/cooperative unit.
citation:
