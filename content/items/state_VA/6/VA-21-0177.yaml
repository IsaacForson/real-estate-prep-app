stem: Under the Virginia Residential Property Disclosure Act, what does the term 'ratification' mean?
options:
  - The buyer's acceptance of the seller's disclosure statement
  - The full execution of a real estate purchase contract by all parties
  - The moment the listing agreement is signed between the broker and seller
  - The date when the earnest money deposit is released to the seller
key: B
explanation: "Va. Code Ann. § 55.1-700 defines 'ratification' as the full execution of a real estate
  purchase contract by all parties. The other choices describe different events: the buyer's
  acceptance of a disclosure statement, the signing of a listing agreement, and the release of
  earnest money, none of which match the statutory definition."
