stem: A unit owners' association in a Virginia condominium requires all sellers to use the
  association's branded for sale sign. Under the Virginia Condominium Act, is this requirement
  permissible?
options:
  - Yes, because the association may adopt any reasonable rule regarding signage, including design
    and placement requirements.
  - No, because the association may not require a sign that is an association sign unless expressly
    authorized.
  - Yes, provided that at least one real estate sign is permitted on the property and the sign
    complies with Real Estate Board requirements.
  - No, because the association may regulate signage but cannot require a specific
    association-branded sign.
key: B
explanation: Under Va. Code Ann. § 55.1-1961, a unit owners' association may not require sellers to
  use a for‑sale sign that is an association sign unless the association is expressly authorized to
  do so by the chapter, the condominium instruments, or another law. Therefore the correct response
  is the one that states the requirement is not permissible because the association may not require
  an association‑branded sign without express authorization. The option that says the association
  may regulate signage but cannot require a specific association‑branded sign is incorrect because
  it misstates the limitation—the prohibition applies specifically to association signs, not to
  signage generally. The option that permits the requirement provided a real‑estate sign complies
  with Real Estate Board rules is incorrect because the statute bars requiring an association sign
  regardless of the sign’s compliance with board rules. The option that claims the association may
  adopt any reasonable rule regarding signage, including design and placement, is incorrect because
  the statute limits the association’s power when the sign is an association sign.
citation:
  source: Va. Code Ann. § 55.1-1900 et seq. § 55.1-1961
  url: null
  quoted_text: Except as expressly authorized in this chapter or in the condominium instruments or as
    otherwise provided by law, no unit owners' association shall require the use of any for sale
    sign that is (i) a unit owners' association sign or (ii) a real estate sign that does not comply
    with the requirements of the Real Estate Board.
