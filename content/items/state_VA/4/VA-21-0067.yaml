stem: A licensee engaged by a seller shows a different property to a prospective buyer who is
  touring the seller's listing. According to Va. Code Ann. § 54.1-2131(D), what is the effect on the
  licensee's duty to the seller?
options:
  - It requires the licensee to obtain written consent from the seller
  - It breaches the duty of loyalty owed to the seller
  - It does not breach any duty owed to the seller
  - It constitutes a breach of confidentiality with the seller
key: C
explanation: Under § 54.1-2131(D), a licensee engaged by a seller does not breach any duty or
  obligation owed to the seller by showing alternative properties to prospective buyers, whether as
  clients or customers. Therefore, showing a different property to a prospective buyer is
  permissible and does not violate the licensee's duties. The distractor claiming a breach of
  loyalty is incorrect because the statute explicitly states no breach occurs.
citation:
