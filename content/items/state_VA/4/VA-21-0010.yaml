stem: A nonresident licensee is sued in a Virginia court, and process is served on the Director of
  the Department of Professional and Occupational Regulation under the licensee's consent to
  service. What must the Director then do?
options:
  - Personally appear in court on behalf of the licensee
  - File the process and mail a copy to the licensee
  - Forward the process if the licensee requests it in writing
  - Hold the process until the licensee's next renewal cycle
key: B
explanation: Process or pleadings served on the Director must be filed by the Director in his
  office, with a copy immediately forwarded by registered mail to the licensee's main office at the
  last known address.
