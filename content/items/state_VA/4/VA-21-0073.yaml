stem: A licensee currently represents a landlord as an agent under a brokerage agreement and wishes
  to also represent a new tenant in the same residential transaction as a dual representative. What
  must the licensee do before commencing the dual representation?
options:
  - Obtain written consent after written disclosure of the consequences from only the new tenant
  - Obtain written consent after written disclosure of the consequences from either the existing
    landlord or the new tenant
  - Obtain written consent after written disclosure of the consequences from only the existing
    landlord
  - Obtain written consent after written disclosure of the consequences from both the existing
    landlord and the new tenant
key: D
explanation: Subsection C requires that before a licensee can represent a new client in a dual
  representation while already representing an existing client, the disclosure must be given to both
  the existing client and the new client. Therefore, written consent after disclosure is needed from
  both parties. Options that involve only one party or either party do not satisfy the statutory
  requirement.
citation:
  source: Va. Code Ann. § 54.1-2139(C)
  url: null
  quoted_text: If the licensee is currently representing a party as an agent or independent contractor
    representative and the licensee proposes to represent a new client in a dual representation, the
    licensee may only engage in such dual representation if prior to commencement thereof, the
    disclosure required by this section is given to the licensee's one existing client and one new
    client.
