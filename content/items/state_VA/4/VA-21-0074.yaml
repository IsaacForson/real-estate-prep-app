stem: A licensee currently represents a buyer as an independent contractor representative and the
  buyer wants to purchase a property from another existing client also represented by the licensee.
  What must the licensee do before commencing dual representation?
options:
  - Obtain written consent after written disclosure of the consequences from only the seller
  - Obtain written consent after written disclosure of the consequences from only the buyer
  - Obtain written consent after written disclosure of the consequences from either the buyer or the
    seller
  - Obtain written consent after written disclosure of the consequences from both existing clients
key: D
explanation: Subsection B provides that when a licensee represents a party who wishes to transact
  with another existing client also represented by the licensee, dual representation is permissible
  only after the required disclosure is given to both of the licensee's existing clients. Thus,
  written consent after disclosure must be obtained from both the buyer and the seller. Limiting
  disclosure to only one party or allowing either party fails to meet the statutory condition.
citation:
  source: Va. Code Ann. § 54.1-2139(B)
  url: null
  quoted_text: If the licensee is currently representing a party as an agent or independent contractor
    representative and that party desires to engage in a real estate transaction with another
    existing client represented by the licensee, the licensee may engage in dual representation
    provided that prior to commencement thereof the disclosure required by this section is given to
    both of the licensee's existing clients.
