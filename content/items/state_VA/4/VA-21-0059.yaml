stem: A licensee prepares a written brokerage agreement stating that she will act as a limited
  service agent and lists the specific services she will provide, but omits the list of standard
  agent duties she will not perform. Under Virginia law, is the disclosure compliant?
options:
  - Yes, because the agreement identifies the limited service role
  - No, because the omission of the list of duties not provided violates the disclosure requirement
  - Yes, as long as the services provided are disclosed in bold lettering
  - No, because the agreement must also include a dual agency disclosure
key: B
explanation: The statute requires a limited service agent to disclose (i) that the licensee is
  acting as a limited service agent, (ii) the specific services to be provided, and (iii) the
  specific duties of a standard agent that will not be provided. Omitting the third element fails
  the requirement, making the disclosure noncompliant. Merely stating the limited service role or
  formatting the disclosed services in bold does not satisfy the missing element, and a dual agency
  disclosure is only required when dual agency actually occurs.
