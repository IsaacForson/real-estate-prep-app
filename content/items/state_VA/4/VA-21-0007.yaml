stem: A seller's licensee answers a scheduling question for an unrepresented prospective buyer
  touring the listed home. The brokerage agreement does not prohibit such assistance. What is the
  effect on the licensee's relationship with the seller?
options:
  - The act automatically creates dual representation for both parties
  - The act breaches the seller's brokerage agreement by default
  - No brokerage relationship with the buyer results from the act
  - The act converts the buyer into a client of the same firm
key: C
explanation: A licensee engaged by a seller may, unless prohibited by law or the brokerage
  agreement, provide assistance to a buyer by performing ministerial acts without that assistance
  forming a brokerage relationship with the buyer.
citation:
  source: Va. Code Ann. § 54.1-2131
  url: null
  quoted_text: A licensee engaged by a seller in a real estate transaction may, unless prohibited by
    law or the brokerage agreement, provide assistance to a buyer or potential buyer by performing
    ministerial acts.
