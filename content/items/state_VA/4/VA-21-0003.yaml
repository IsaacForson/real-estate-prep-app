stem: A buyer pays a referral fee directly to a licensee who never signed a brokerage agreement with
  that buyer. What effect does this payment have under Virginia law?
options:
  - It automatically forms a brokerage relationship with the buyer
  - It converts the licensee into the buyer's designated agent
  - It does not by itself create a brokerage relationship
  - It obligates the licensee to disclose dual representation
key: C
explanation: The statute states that payment or promise of payment or compensation to a real estate
  broker does not create a brokerage relationship between the broker and any seller, landlord,
  buyer, or tenant.
