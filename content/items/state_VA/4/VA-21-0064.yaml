stem: When a licensee provides the brokerage relationship disclosure in combination with other
  disclosures in a Virginia residential real estate transaction, how must the disclosure be
  formatted?
options:
  - It must be printed in bold lettering, all capitals, underlined, or within a separate box.
  - It must be printed in italics and placed at the bottom of the contract.
  - It must be communicated orally before any written documents are signed.
  - It must be included only in the purchase agreement and not elsewhere in the transaction.
key: A
explanation: The statute requires that when the disclosure is combined with other information, it
  must be conspicuous, printed in bold lettering, all capitals, underlined, or within a separate
  box. Stating that the disclosure may appear only in the purchase agreement does not meet the
  requirement; the rule applies regardless of where the disclosure appears.
citation:
  source: Va. Code Ann. § 54.1-2138
  url: null
  quoted_text: Such disclosure may be given in combination with other disclosures or provided with
    other information, but if so, the disclosure must be conspicuous, printed in bold lettering, all
    capitals, underlined, or within a separate box.
