stem: A licensee is preparing a written brokerage agreement disclosing that she will act as a
  limited service agent. How must that disclosure be formatted to satisfy the statute?
options:
  - Typed in the same font size as the rest of the agreement
  - Recorded verbally and confirmed later by a follow-up email
  - Attached as a separate cover letter mailed after signing
  - Conspicuous, bold or capitals, underlined or boxed
key: D
explanation: The statute requires that the limited service agent disclosure be conspicuous and
  printed either in bold lettering or all capitals, and underlined or set apart in a separate box.
citation:
  source: Va. Code Ann. § 54.1-2138.1
  url: null
  quoted_text: Such disclosure shall be conspicuous and printed either in bold lettering or all
    capitals, and shall be underlined or in a separate box.
