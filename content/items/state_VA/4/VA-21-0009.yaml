stem: A buyer client refuses to consent to a proposed dual representation, so the licensee withdraws
  from representing that buyer. The licensee continues representing the seller in the same deal. Is
  this permitted?
options:
  - Yes, it does not prejudice representing the other client
  - No, withdrawal ends the licensee's authority to represent anyone
  - Yes, but if the seller also agrees to be released
  - No, the licensee also withdraws from the seller relationship
key: A
explanation: The statute provides that such a withdrawal does not prejudice the licensee's ability
  to continue representing the other client in the same transaction, nor does it bar representing
  the refusing client in unrelated transactions.
citation:
  source: Va. Code Ann. § 54.1-2139
  url: null
  quoted_text: Such withdrawal shall not prejudice the ability of the licensee to continue to
    represent the other client in the transaction nor to limit the licensee from representing the
    client who refused the dual agency or dual representation in other transactions not involving
    the dual agency or dual representation.
