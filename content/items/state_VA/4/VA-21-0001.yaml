stem: Under Virginia's definitions for brokerage relationships, which description fits a person for
  whom a licensee performs only ministerial acts, with no brokerage relationship formed?
options:
  - A customer receiving solely ministerial acts
  - A designated agent assigned to a dual representation
  - A client represented under a signed brokerage agreement
  - A principal broker supervising the transaction file
key: A
explanation: The statute defines a customer as a person who has not entered a brokerage relationship
  with a licensee but for whom the licensee performs ministerial acts, and such a person is presumed
  to be a customer rather than a client.
