stem: A licensee wishes to act as a dual agent for both the buyer and the seller in a commercial
  real estate transaction. What must the licensee do before beginning representation?
options:
  - Obtain written consent from the paying client only.
  - Obtain written consent from both the buyer and the seller.
  - Assume consent exists from the brokerage agreement.
  - Provide oral notice of dual agency to both parties.
key: B
explanation: The law requires written consent of all clients before a licensee may act as a dual
  agent in a commercial transaction. Thus, obtaining written consent from both buyer and seller is
  necessary. The distractor suggesting consent from only the paying client is incorrect because
  consent must be obtained from all clients, not just the one paying the commission.
citation:
  source: Va. Code Ann. § 54.1-2100 et seq. — Code of Virginia Title 54.1, Chapter 21 — Real Estate
    Brokers, Salespersons and Rental Location Agents — § 54.1-2139.01
  url: null
  quoted_text: A licensee may act as a dual agent or dual representative in a commercial real estate
    transaction only with the written consent of all clients to the transaction.
