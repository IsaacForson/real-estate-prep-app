stem: A licensee engaged by a seller discovers that the residential property listed for sale
  contains defective drywall as defined in § 36-156.1. The licensee has actual knowledge of this
  condition. What must the licensee do under Va. Code Ann. § 54.1-2131(B)?
options:
  - The licensee must repair the defective drywall before presenting any offers
  - The licensee may withhold the information unless the buyer asks about it
  - The licensee must provide a written disclosure of the defective drywall to the buyer
  - The licensee must inform the buyer orally about the defective drywall
key: C
explanation: Section 54.1-2131(B) requires that if a licensee has actual knowledge of defective
  drywall in a residential property, the licensee shall disclose the same to the prospective buyer,
  and such disclosure shall be made in writing. Therefore, a written disclosure is mandatory. The
  distractor suggesting oral disclosure is insufficient because the statute specifies written form.
citation:
  source: Va. Code Ann. § 54.1-2100 et seq. — Code of Virginia Title 54.1, Chapter 21 — Real Estate
    Brokers, Salespersons and Rental Location Agents — § 54.1-2131
  url: null
  quoted_text: If a licensee has actual knowledge of the existence of defective drywall in a
    residential property, the licensee shall disclose the same to the prospective buyer. For
    purposes of this section, "defective drywall" means all defective drywall as defined in §
    36-156.1 . As used in this section, the term "physical condition of the property" refers to the
    physical condition of the land and any improvements thereon, and does not refer to (i) matters
    outside the boundaries of the land or relating to adjacent or other properties in proximity
    thereto, (ii) matters relating to governmental land use regulations, or (iii) matters relating
    to highways or public streets. Such disclosure shall be made in writing.
