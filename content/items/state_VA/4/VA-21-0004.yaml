stem: A supervising broker lives 65 miles from a branch office where licensees regularly conduct
  business under her supervision. What must she do to satisfy her supervisory obligation for that
  office?
options:
  - Relocate her residence closer to the branch office
  - Appoint a resident licensee as the branch office owner
  - Suspend branch operations until she relocates nearby
  - File a quarterly written compliance certification
key: D
explanation: A supervising broker who resides more than 50 miles from a branch office with licensees
  regularly conducting business there must certify in writing quarterly on a Board form that she has
  complied with the supervision requirements.
citation:
