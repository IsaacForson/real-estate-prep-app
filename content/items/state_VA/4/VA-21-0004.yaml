  url: null
  quoted_text: Any supervising broker who resides more than 50 miles from a branch office under his
    supervision, having licensees who regularly conduct business assigned to such branch office,
    shall certify in writing quarterly on a form provided by the Board that the supervising broker
    has complied with the requirements of this section.
