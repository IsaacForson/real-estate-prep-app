stem: A licensee hosts an open house and answers scheduling questions for an unattended visitor who
  has not signed any agreement. According to Virginia law, what is the legal status of that visitor?
options:
  - A client of the licensee
  - A agent of the licensee
  - A customer of the licensee
  - A prospect of the licensee
key: C
explanation: The visitor received only ministerial acts and no brokerage agreement was formed, so
  under the definition of “customer,” the person is presumed to be a customer rather than a client.
  The visitor is not a client because no agreement exists, nor a designated agent or independent
  contractor.
citation:
  source: Va. Code Ann. § 54.1-2130
  url: null
  quoted_text: '"Customer" means a person who has not entered into a brokerage relationship with a
    licensee but for whom a licensee performs ministerial acts in a real estate transaction. Unless
    a licensee enters into a brokerage relationship with such person, it shall be presumed that such
    person is a customer of the licensee rather than a client.'
