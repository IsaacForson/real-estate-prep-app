stem: A supervising broker assigns two licensees from the same firm to represent the seller and the
  buyer separately in one transaction. What relationship must each assigned licensee have with that
  client?
options:
  - A dual agency relationship with both parties
  - An independent contractor relationship exclusively
  - A limited service agency relationship by default
  - A fiduciary agency relationship as a standard agent
key: B
explanation: A designated representative assigned by a principal or supervising broker to represent
  one client while a different client is represented in the same transaction shall only act as an
  independent contractor.
