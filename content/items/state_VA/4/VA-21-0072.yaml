stem: Under Virginia law, what type of relationship does a dual representative have under the
  brokerage agreements with the clients?
options:
  - An agency relationship under the brokerage agreements with the clients
  - An independent contractor relationship under the brokerage agreements with the clients
  - A fiduciary relationship under the brokerage agreements with the clients
  - A contractual relationship under the brokerage agreements with the clients
key: B
explanation: The statute explicitly states that a dual representative has an independent contractor
  relationship under the brokerage agreements with the clients. This distinguishes a dual
  representative from a dual agent, who has an agency relationship. The fiduciary and contractual
  options are not mentioned in the statute for this role.
