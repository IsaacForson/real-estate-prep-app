stem: A salesperson violates a Board regulation without the supervising broker's knowledge. The
  broker had no reason to suspect the violation. What is the likely result for the supervising
  broker under this regulation?
options:
  - Discipline follows automatically for any violation by staff
  - No discipline unless the broker knew or should have known
  - Discipline is limited to a written reprimand in every instance
  - Discipline applies if the salesperson is later terminated
key: B
explanation: A violation by a salesperson may not be cause for disciplinary action against the
  supervising broker unless it appears to the Board that the broker knew or should have known of the
  violation and failed to take reasonable action to remedy it.
citation:
  source: 18 VAC 135-20, § 135-20-330
  url: null
  quoted_text: Any unlawful act or violation of any of the provisions of Chapter 21 (§ 54.1-2100 et
    seq.) of Title 54.1 or of Chapter 5.1 (§ 36-96.1 et seq.) of Title 36 of the Code of Virginia or
    of the regulations of the board by any real estate salesperson, employee, partner or affiliate
    of a principal broker, supervising broker, or both, may not be cause for disciplinary action
    against the principal broker, supervising broker, or both, unless it appears to the satisfaction
    of the board that the principal broker, supervising broker, or both, knew or should have known
    of the unlawful act or violation and failed to take reasonable action under the circumstances to
    remedy the situation.
