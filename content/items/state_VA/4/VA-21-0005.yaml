stem: A listing agreement states the seller will receive a fixed net amount, and the licensee may
  keep any sale proceeds above that amount as compensation. How does this arrangement fit the
  improper dealings regulation?
options:
  - It is a prohibited net listing arrangement
  - It is an allowed limited service brokerage agreement term
  - It is a permitted dual representation compensation method
  - It is a lawful graduated commission structure for the firm
key: A
explanation: The regulation lists as an improper financial transaction making a listing contract
  that provides a net return to the seller, leaving the licensee free to sell the property at any
  price obtainable above that net price.
citation:
  source: 18 VAC 135-20, § 135-20-280
  url: null
  quoted_text: Making a listing contract or lease which provides for a "net" return to the seller or
    lessor, leaving the licensee free to sell or lease the property at any price the licensee can
    obtain in excess of the "net" price named by the seller or lessor.
