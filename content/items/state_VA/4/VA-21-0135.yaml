stem: Under Virginia law, what is the legal effect of a payment or promise of payment to a real
  estate broker for services rendered?
options:
  - It creates a brokerage relationship with the client.
  - It requires a written brokerage agreement today.
  - It does not create a brokerage relationship here.
  - It makes the broker an agent of the client.
key: C
explanation: The key is correct because § 54.1-2140 states that payment or promise of payment does
  not create a brokerage relationship. The most tempting distractor is "It creates a brokerage
  relationship with the client," which incorrectly assumes that any payment automatically forms an
  agency relationship, contrary to the statute.
citation:
  source: Va. Code Ann. § 54.1-2100 et seq. — Code of Virginia Title 54.1, Chapter 21 — Real Estate
    Brokers, Salespersons and Rental Location Agents — § 54.1-2140
  url: null
  quoted_text: The payment or promise of payment or compensation to a real estate broker does not
    create a brokerage relationship between any broker, seller, landlord, buyer or tenant.
