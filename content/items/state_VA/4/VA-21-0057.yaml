stem: Under Virginia law, which of the following best describes “showing property” as defined for
  real estate licensees?
options:
  - Taking a prospective buyer to a property, obtaining access, and guiding them through the
    property, including providing a live virtual tour for remote buyers.
  - Preparing a comparative market analysis for a seller based on recent sales data, market trends,
    and property characteristics, a research activity that assists in pricing but does not involve
    taking a buyer to the property.
  - Providing information about a property that is a matter of public record while physically
    present at the property, such as zoning, tax assessments, and prior sales, which is permissible
    but not part of the statutory definition of showing property.
  - Negotiating the purchase price on behalf of a client, including presenting offers,
    counteroffers, and drafting purchase agreements, which is a brokerage activity distinct from
    showing property.
key: A
explanation: The statute defines showing property as taking a prospective buyer or tenant to a
  property, obtaining access, and taking the individual through the property, including providing a
  live virtual tour for a prospective buyer or tenant who is not physically present (Va. Code Ann. §
  54.1-2130). The correct choice describes exactly that activity. The other choices describe
  negotiating price, providing public‑record information, or preparing a market analysis—activities
  that are not included in the definition of showing property.
