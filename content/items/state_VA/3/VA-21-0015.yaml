stem: A home is located within a designated accident potential zone near a military air
  installation. What must the owner disclose to a prospective purchaser?
options:
  - Whether the parcel lies in a noise or accident potential zone
  - The specific decibel readings recorded on the installation runway
  - The installation's projected flight schedule for the coming year
  - Whether the installation plans to expand its boundary lines
key: A
explanation: An owner of residential property near a military air installation must disclose whether
  the parcel is located in a noise zone or accident potential zone as designated on the official
  zoning map.
citation:
  source: Va. Code Ann. § 55.1-704
  url: null
  quoted_text: The owner of residential real property located in any locality in which a military air
    installation is located shall disclose to the purchaser whether the subject parcel is located in
    a noise zone or accident potential zone, or both, if so designated on the official zoning map by
    the locality in which the property is located.
