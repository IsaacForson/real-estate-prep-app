stem: A required disclosure statement is delivered to the purchaser three days after contract
  ratification. Under the chapter, what is the purchaser's sole remedy for this late delivery?
options:
  - Sue the owner for the full purchase price of the property
  - Demand a new inspection paid for entirely by the owner
  - Void the contract automatically without any further notice
  - Terminate before the earliest listed cutoff event
key: D
explanation: When disclosures are delivered after ratification, the statute makes the purchaser's
  sole remedy termination of the contract before the earliest of several listed cutoff events, such
  as settlement or occupancy.
citation:
  source: Va. Code Ann. § 55.1-709
  url: null
  quoted_text: the purchaser's sole remedy shall be to terminate the real estate purchase contract
    upon or prior to the earliest of (i) three days after delivery of the disclosure statement in
    person or by electronic delivery
