stem: A property is located in a locality that has adopted an ordinance implementing the Chesapeake
  Bay Preservation Act establishing resource protection areas. What does the required residential
  property disclosure statement say about such areas?
options:
  - The disclosure statement indicates that the owner must obtain a state permit for any development
    near resource protection areas and must disclose any associated costs to the purchaser before
    ratification.
  - The disclosure statement indicates that the owner warrants that no resource protection areas
    exist on the property and that the purchaser need not investigate further regarding such areas.
  - The disclosure statement indicates that the owner makes no representations regarding resource
    protection areas and advises the purchaser to exercise due diligence, including reviewing any
    official map depicting such areas, prior to settlement pursuant to the real estate purchase
    contract.
  - The disclosure statement indicates that the owner must provide a copy of the local ordinance
    establishing resource protection areas to the purchaser, along with a map showing the exact
    boundaries of those areas.
key: C
explanation: The statute states that the owner makes no representations regarding resource
  protection areas and advises the purchaser to exercise due diligence, including review of any
  official map depicting such areas. The other options incorrectly attribute warranties, provision
  of ordinance copies, or permit requirements that are not required by the disclosure statement.
citation:
  source: Va. Code Ann. § 55.1-703(B)(5)
  url: null
  quoted_text: The owner makes no representations with respect to whether the property contains any
    resource protection areas established in an ordinance implementing the Chesapeake Bay
    Preservation Act (§ 62.1-44.15:67 et seq.) adopted by the locality where the property is located
    pursuant to § 62.1-44.15:74 , and purchasers are advised to exercise whatever due diligence a
    particular purchaser deems necessary to determine whether the provisions of any such ordinance
    affect the property, including review of any official map adopted by the locality depicting
    resource protection areas, in accordance with terms and conditions as may be contained in the
    real estate purchase contract, but in any event prior to settlement pursuant to such contract;
