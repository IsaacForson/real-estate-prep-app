stem: An owner discloses an approximation of a property's age based on information from a public tax
  assessment record, later found to be slightly inaccurate. The owner was not grossly negligent in
  relying on it. What follows for the owner's liability?
options:
  - No liability for errors from public agency information
  - Liability if the buyer terminates before settlement
  - Liability limited to the buyer's inspection costs
  - Strict liability, regardless of the source of the information
key: A
explanation: The statute excuses an owner from liability for an error not within the owner's actual
  knowledge and based on information from public agencies or others, provided the owner was not
  grossly negligent in obtaining and transmitting it.
citation:
  source: Va. Code Ann. § 55.1-710
  url: null
  quoted_text: the owner shall not be liable for any error, inaccuracy, or omission of any information
    delivered pursuant to this chapter if (i) the error, inaccuracy, or omission was not within the
    actual knowledge of the owner or was based on information provided by public agencies or by
    other persons providing information that is required to be disclosed pursuant to this chapter,
    or the owner reasonably believed the information to be correct, and (ii) the owner was not
    grossly negligent in obtaining the information from a third party and transmitting it.
