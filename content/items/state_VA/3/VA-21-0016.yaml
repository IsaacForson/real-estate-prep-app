stem: An owner knows a lis pendens has been filed against her dwelling in connection with pending
  litigation. What must she do under the disclosure chapter?
options:
  - Withdraw the property from the market until the case ends
  - Give the purchaser a written disclosure of that fact
  - Notify the settlement agent handling the closing
  - Wait until settlement to mention the pending litigation
key: B
explanation: An owner with actual knowledge of a lis pendens filed against the dwelling unit must
  provide a prospective purchaser with a written disclosure stating that fact.
citation:
  source: Va. Code Ann. § 55.1-706.1
  url: null
  quoted_text: if the owner of a residential dwelling unit has actual knowledge of a lis pendens filed
    against such dwelling unit pursuant to § 8.01-268 , such owner shall provide to a prospective
    purchaser a written disclosure that so states.
