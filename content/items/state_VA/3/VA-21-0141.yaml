stem: Under Virginia's Residential Property Disclosure Act, what does the term 'electronic delivery'
  mean?
options:
  - Sending the required disclosures via regular mail, provided that the sender retains a
    certificate of mailing from the United States Postal Service as proof of delivery, which must be
    retained for the transaction.
  - Sending the required disclosures via the Internet, provided that the sender retains proof of
    electronic delivery, which may be an electronic receipt, a facsimile confirmation, or a
    sender‑prepared certificate of service.
  - Sending the required disclosures via email, provided that the sender retains a read receipt from
    the recipient's email server as proof of delivery, which must be retained for the transaction.
  - Sending the required disclosures via text message, provided that the sender retains a delivery
    confirmation from the wireless carrier as proof of delivery, which must be retained for the
    transaction.
key: B
explanation: Va. Code Ann. § 55.1-700 defines electronic delivery as sending the required
  disclosures via the Internet, provided that the sender retains sufficient proof of the electronic
  delivery, which may be an electronic receipt of delivery, a confirmation that the notice was sent
  by facsimile, or a certificate of service prepared by the sender confirming the electronic
  delivery. The other choices describe delivery methods or proof types that do not satisfy this
  statutory definition.
