stem: A buyer later learns that a homicide once occurred in the home and sues the seller for failing
  to disclose it. The event had no effect on the physical structure of the property. What is the
  likely outcome under the disclosure chapter?
options:
  - The seller is liable for fraud regardless of physical impact
  - No cause of action arises from that nondisclosure
  - The buyer may rescind the contract at any point after closing
  - The listing licensee alone bears liability for the nondisclosure
key: B
explanation: The statute bars any cause of action against an owner or licensee for failing to
  disclose that the property was the site of a homicide, felony, or suicide, or of an act with no
  effect on the physical structure.
