stem: A builder sells a newly completed dwelling for the first time, a transfer otherwise exempt
  from the disclosure chapter. What must the builder still disclose in writing before ratification?
options:
  - The builder's internal warranty claims history
  - The builder's projected resale value for the dwelling
  - Known material defects violating the building code
  - The identity of the subcontractors who built the dwelling
key: C
explanation: Even though a first sale of a dwelling is otherwise exempt, the builder must disclose
  in writing to the purchaser all known material defects that would violate any applicable building
  code.
citation:
  source: Va. Code Ann. § 55.1-702
  url: null
  quoted_text: Notwithstanding the provisions of subdivision A 9, the builder of a new dwelling shall
    disclose in writing to the purchaser all known material defects that would constitute a
    violation of any applicable building code.
