stem: Which transfer falls within the scope of Virginia's residential property disclosure chapter?
options:
  - A sale of a one-to-four unit residential dwelling
  - A transfer between spouses under a divorce decree
  - A transfer solely between two existing co-owners
  - A transfer ordered by a court in an estate proceeding
key: A
explanation: The chapter applies only to transfers by sale, exchange, installment land sales
  contract, or lease with option to buy of residential real property with one to four dwelling
  units.
citation:
  source: Va. Code Ann. § 55.1-701
  url: null
  quoted_text: The provisions of this chapter apply only with respect to transfers by sale, exchange,
    installment land sales contract, or lease with option to buy of residential real property
    consisting of not less than one nor more than four dwelling units, whether or not the
    transaction is with the assistance of a licensed real estate broker or salesperson.
