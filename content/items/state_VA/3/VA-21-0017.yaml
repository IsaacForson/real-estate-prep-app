stem: An owner knows the dwelling was once used to manufacture methamphetamine and it has not been
  cleaned up under the applicable guidelines. What disclosure obligation applies?
options:
  - A disclosure limited to buyers financing with a federal loan
  - A verbal warning given if the buyer specifically asks
  - A written disclosure stating the prior use
  - No disclosure obligation once the property changes ownership
