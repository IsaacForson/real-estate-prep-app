stem: After the Virginia Real Estate Board issues a cease and desist order against an unlicensed
  individual, how many days does that person have to file an appeal to prevent the order from
  becoming final?
options:
  - 10 days
  - 14 days
  - 21 days
  - 30 days
key: C
explanation: The statute provides that a cease and desist order becomes final unless the person
  files an appeal with the Board within 21 days of the order's entry. Therefore, the individual has
  21 days to appeal. Selecting 10 days confuses this deadline with other procedural timeframes not
  specified in this section.
citation:
