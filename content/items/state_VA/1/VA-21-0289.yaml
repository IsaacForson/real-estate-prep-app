stem: A licensee representing a seller learns that the property contains defective drywall as
  defined in § 36-156.1. According to Virginia law, what must the licensee do?
options:
  - Disclose the defect to prospective buyers in writing
  - Inform the seller only and let them decide on disclosure
  - Withhold disclosure, asserting the defect is immaterial
  - Delay disclosure until after the purchase contract is signed
key: A
explanation: Virginia law requires a licensee who actually knows that a residential property
  contains defective drywall to disclose that fact to any prospective buyer. The licensee must
  provide the disclosure in writing. Options that suggest informing only the seller, withholding the
  information, or delaying disclosure until after the contract is signed do not satisfy this
  mandatory duty.
citation:
  source: Va. Code Ann. § 54.1-2131(B)
  url: null
  quoted_text: If a licensee has actual knowledge of the existence of defective drywall in a
    residential property, the licensee shall disclose the same to the prospective buyer.
