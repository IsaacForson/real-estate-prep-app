stem: What is the maximum period allowed to complete a voluntary compliance plan after it is
  submitted to the Virginia Real Estate Board?
options:
  - 60 days
  - 90 days
  - 30 days
  - 120 days
key: B
explanation: The statute provides that completion of a voluntary compliance plan shall not exceed 90
  days from the date the plan is submitted to the Board. This gives the broker three months to
  remediate any noncompliance. The other options represent periods that are either shorter or longer
  than the time allowed by law.
