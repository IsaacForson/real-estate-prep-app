stem: According to Virginia law, within how many business banking days must a licensee place rent
  received on behalf of a landlord client into an escrow account?
options:
  - The licensee must place the rent in an escrow account by the end of the fifth business banking
    day following receipt.
  - The licensee must place the rent in an escrow account by the end of the seventh business banking
    day following receipt.
  - The licensee must place the rent in an escrow account by the end of the third business banking
    day following receipt.
  - The licensee must place the rent in an escrow account by the end of the tenth business banking
    day following receipt.
key: A
explanation: Virginia law requires that rent received on behalf of a landlord client be deposited
  into an escrow account by the end of the fifth business banking day after receipt. The correct
  option states this requirement. The other options specify different time frames that do not match
  the statutory requirement.
citation:
  source: Va. Code Ann. § 54.1-2100 et seq. — Code of Virginia Title 54.1, Chapter 21 — Real Estate
    Brokers, Salespersons and Rental Location Agents § 54.1-2108.1.B.1
  url: null
  quoted_text: Any rent paid to a real estate licensee acting on behalf of a landlord client in
    connection with the lease shall be placed in an escrow account by the end of the fifth business
    banking day following receipt, regardless of when received, unless otherwise agreed to in
    writing by the principals to a lease transaction.
