stem: Under Virginia law, which of the following acts is expressly prohibited for a licensee?
options:
  - Accepting a valuable gift from a client without disclosure
  - Knowingly giving false information to prospective buyers
  - Charging a referral fee without informing the client
  - Failing to disclose a brokerage relationship in writing
key: B
explanation: Virginia law expressly prohibits licensees from knowingly giving false information to
  prospective buyers (Va. Code Ann. § 54.1-2131(B)). Therefore, the option that describes knowingly
  giving false information to prospective buyers is the prohibited act.
