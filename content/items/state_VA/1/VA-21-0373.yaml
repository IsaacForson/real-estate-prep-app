stem: Under Virginia regulations, how many days prior to the expiration of a firm license must a
  principal broker or supervising broker conduct an audit of the firm’s practices, policies, and
  procedures?
options:
  - The audit must be conducted within 30 days prior to expiration.
  - The audit must be conducted within 60 days prior to expiration.
  - The audit must be conducted within 90 days prior to expiration.
  - The audit must be conducted within 120 days prior to expiration.
key: C
explanation: The rule explicitly requires the audit to be performed within 90 days before the firm
  license expires. An audit conducted earlier than that period does not meet the requirement, making
  the 90‑day option correct.
