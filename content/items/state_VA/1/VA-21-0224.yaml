stem: A closing occurs on April 10, 2024. How long must the principal broker retain the settlement
  statement and other transaction documents?
options:
  - Six years from the date of closing
  - Three years from the date of closing
  - Four years from the date of closing
  - Eight years from the date of closing
key: B
explanation: The regulation mandates that all documents pertaining to a transaction, including
  settlement statements, must be retained for three years from the date of closing (or from
  ratification if the transaction fails to close). Hence, the settlement statement must be kept for
  three years after closing. The distractor that the documents need only be kept for one year is
  incorrect because the rule specifies a three‑year retention period.
citation:
  source: 18 VAC 135-20-10 et seq. — 18 VAC 135-20 — Virginia Real Estate Board Licensing Regulations
    — § 135-20-185
  url: null
  quoted_text: All documents pertaining to a transaction, including a complete and legible copy of
    each executed contract of sale, any executed release from contract, any executed lease
    agreement, any executed property management agreement, each settlement statement related to a
    real estate transaction, and unrepresented party in disclosure in the broker's control or
    possession unless prohibited by law. Such records must be retained for three years from the date
    of closing or from ratification if the transaction fails to close.
