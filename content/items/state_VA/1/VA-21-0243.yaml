stem: A licensee receives a security deposit from a prospective tenant on Wednesday, March 6 and
  places the deposit into an escrow account later that same day. Assuming no written agreement to
  the contrary, which statement best describes the licensee's action under Virginia law?
options:
  - The licensee must return the deposit to the tenant because same-day placement is prohibited.
  - The licensee has complied with the requirement because the deposit was placed within the
    required five business banking days.
  - The licensee must place the deposit in an interest-bearing account regardless of timing.
  - The licensee has violated the requirement because deposits must be placed by the end of the
    third business banking day.
key: B
explanation: Virginia law requires that a security deposit received by a licensee be placed in an
  escrow account by the end of the fifth business banking day after receipt. Because the licensee
  placed the deposit in the escrow account on the same day it was received, the requirement is
  satisfied. The claim that the licensee must return the deposit because same‑day placement is
  prohibited is incorrect; the law does not impose such a prohibition. Likewise, the statements that
  the deposit must be placed in an interest‑bearing account or that it must be placed by the end of
  the third business banking day are not supported by the statute.
citation:
  source: Va. Code Ann. § 54.1-2100 et seq. — Code of Virginia Title 54.1, Chapter 21 — Real Estate
    Brokers, Salespersons and Rental Location Agents § 54.1-2108.1.B.2
  url: null
  quoted_text: Any security deposits paid to a real estate licensee acting on behalf of a landlord
    client in connection with the lease shall be placed in an escrow account by the end of the fifth
    business banking day following receipt, unless otherwise agreed to in writing by the principals
    to a lease transaction.
