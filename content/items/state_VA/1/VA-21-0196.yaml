stem: Under Virginia law, when may the Real Estate Board waive an educational requirement for
  initial licensure?
options:
  - When the applicant demonstrates education or experience equivalent to that required.
  - When the applicant has completed a comparable out-of-state course.
  - When the applicant submits a notarized affidavit of military service.
  - When the applicant has been continuously licensed since before July 1, 1975.
key: A
explanation: The Board may waive any requirement under the regulations relating to education or
  experience when the broker or salesperson is found to have education or experience equivalent to
  that required. The other options describe situations that do not trigger a waiver under this
  provision.
