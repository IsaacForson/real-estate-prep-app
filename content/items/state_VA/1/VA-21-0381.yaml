stem: A broker submits a notarized affidavit to the Virginia Real Estate Board certifying that they
  will not engage in residential real estate during the upcoming licensing term. According to
  Virginia law, what continuing‑education requirement applies to this broker for the
  residential‑representation course?
options:
  - The broker must complete the three‑hour residential‑representation course as usual.
  - The broker is exempt from the residential‑representation course and must instead take a course
    on commercial leasing.
  - The broker is not required to take the residential‑representation course.
  - The broker must complete the residential‑representation course but may substitute an ethics
    course.
key: C
explanation: Va. Code Ann. § 54.1-2105.03.A.3 provides that if a licensee submits a notarized
  affidavit certifying they will not practice residential real estate during the licensing term, the
  residential‑representation continuing‑education course is not required. Therefore, the broker
  described in the stem is exempt from that course, making the option that says the broker is not
  required to take the residential‑representation course correct. The option that says the broker
  must complete the three‑hour residential‑representation course as usual incorrectly imposes the
  requirement. The option that says the broker is exempt from the residential‑representation course
  and must instead take a course on commercial leasing introduces an unsupported substitution. The
  option that says the broker must complete the residential‑representation course but may substitute
  an ethics course wrongly retains the requirement while allowing an unauthorized substitution.
