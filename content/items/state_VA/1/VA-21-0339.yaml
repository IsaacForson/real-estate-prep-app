stem: How many months of active engagement as a real estate salesperson are required for an
  applicant seeking a Virginia real estate broker license?
options:
  - 48 months
  - 36 months
  - 30 months
  - 24 months
key: B
explanation: The regulation requires broker applicants to have been actively engaged as a
  salesperson for 36 of the 48 months immediately preceding application. Therefore, 36 months is the
  correct requirement. The distractor of 30 months reflects a common misunderstanding of the
  threshold, but the rule explicitly states 36 months.
