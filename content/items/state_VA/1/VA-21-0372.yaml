  - April 15, 2025
  - March 31, 2025
  - March 15, 2025
key: C
explanation: The rule requires completion within one year from the last day of the month in which
  the license was issued. The license was issued in March, so the last day is March 31, 2024; one
  year later is March 31, 2025 (§ 54.1-2105.01(A)).
