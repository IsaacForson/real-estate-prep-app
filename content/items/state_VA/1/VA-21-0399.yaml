stem: A Virginia real estate salesperson's license was issued on March 10, 2024. According to
  Virginia law, on what date does this license expire?
options:
  - March 31, 2026
  - March 10, 2026
  - March 31, 2025
  - April 10, 2026
key: A
explanation: The license expires two years from the last day of the month of issuance; March 10,
  2024 falls in March, last day is March 31, 2024, plus two years equals March 31, 2026.
citation:
  source: "### 18 VAC 135-20-10 et seq. — 18 VAC 135-20 — Virginia Real Estate Board Licensing
    Regulations — § 135-20-90"
  url: null
  quoted_text: Licenses issued under this chapter for salespersons, brokers, and firms will expire two
    years from the last day of the month in which the licenses were issued, as indicated on the
    license.
