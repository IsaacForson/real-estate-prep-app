math:
  worked_solution: |-
    Identify the month of issuance: March 2024.
    Determine the last day of that month: March 31, 2024.
    Add two years to that date: March 31, 2024 + 2 years = March 31, 2026.
  formulas:
    - Expiration Date = LastDayOfMonth(IssueDate) + 2 years
