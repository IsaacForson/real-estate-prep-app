stem: A principal broker's office is located in North Carolina, but the firm maintains a branch
  office in Virginia. Where must copies of the financial records required by 18VAC135-20-185 be
  readily accessible?
options:
  - Copies of the financial records must be readily accessible in the Virginia office.
  - Copies of the financial records must be readily accessible in the principal broker's
    out-of-state office.
  - Copies of the financial records must be readily accessible at the broker's place of business
    only.
  - Copies of the financial records must be readily accessible in the firm's headquarters regardless
    of location.
key: A
explanation: The regulation requires that when a principal broker's office is outside Virginia and
  the firm has a Virginia branch office, a copy of the financial records must be readily accessible
  in the Virginia office. This ensures Virginia-based access to required records. The other options
  misstate the location or omit the Virginia office requirement.
