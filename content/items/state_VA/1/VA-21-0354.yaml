stem: What is the minimum educational requirement for an applicant seeking an initial real estate
  salesperson license in Virginia?
options:
  - A high school diploma or equivalent and completion of a principles of real estate course of at
    least four semester hours but not less than 60 hours of classroom, correspondence, or other
    distance learning instruction.
  - A high school diploma or equivalent and completion of a principles of real estate course of at
    least two semester hours but not less than 30 hours of classroom, correspondence, or other
    distance learning instruction.
  - A high school diploma or equivalent and completion of a principles of real estate course of at
    least six semester hours but not less than 90 hours of classroom, correspondence, or other
    distance learning instruction.
  - A high school diploma or equivalent and completion of a principles of real estate course of at
    least eight semester hours but not less than 120 hours of classroom, correspondence, or other
    distance learning instruction.
key: A
explanation: Virginia law requires a high school diploma or equivalent and completion of a
  principles of real estate course of at least four semester hours, but not less than 60 hours of
  classroom, correspondence, or other distance learning instruction (Va. Code Ann. §
  54.1-2105(B)(1)). An option that requires only two semester hours and 30 hours of instruction
  falls below this minimum. An option that requires six semester hours and 90 hours exceeds the
  minimum. An option that requires eight semester hours and 120 hours also exceeds the minimum.
