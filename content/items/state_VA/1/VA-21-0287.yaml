stem: A licensee receives earnest money from a buyer and deposits it into an escrow account. The
  transaction closes on May 12, 2024. How long must the licensee retain the record of receipts and
  disbursements for that earnest money under Virginia regulations?
options:
  - Two years from the date of closing
  - Three years from the date of closing
  - One year from the date of closing
  - Five years from the date of closing
key: B
explanation: The regulation requires licensees to keep a complete and accurate record of receipts
  and disbursements for money received on behalf of others for three years from the date of closing
  or termination of the related transaction. Since the earnest money was received on behalf of the
  buyer and the transaction closed on May 12, 2024, the retention period runs three years from that
  closing date. A two‑year period would be insufficient because the rule explicitly specifies a
  three‑year term. The other options (one year and five years) do not match the prescribed period.
citation:
  source: 18 VAC 135-20-10 et seq. — 18 VAC 135-20 — Virginia Real Estate Board Licensing Regulations
    — § 135-20-185
  url: null
  quoted_text: A complete and accurate record of such receipts and their disbursements for moneys
    received on behalf of others. Such records must be retained for a period of three years from the
    date of the closing or termination of a sales transaction, or the termination of a lease or
    conclusion of the licensee's involvement in a lease.
