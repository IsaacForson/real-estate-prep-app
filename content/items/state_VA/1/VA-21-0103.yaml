stem: A salesperson receives their license on June 10. By what date must they complete the 30-hour
  post-license curriculum to avoid having their license placed on inactive status?
options:
  - June 30 of the following year
  - May 31 of the following year
  - July 31 of the following year
  - April 30 of the following year
key: A
explanation: The rule mandates completion within one year from the last day of the month the license
  was issued; a June 10 license gives a deadline of June 30 the following year. Choosing May 31
  mistakenly uses the last day of the prior month.
citation:
  source: Va. Code Ann. § 54.1-2105.01.A
  url: null
  quoted_text: Failure of a new licensee to complete the 30-hour post-licensure curriculum within one
    year from the last day of the month in which his license was issued shall result in the license
    being placed on inactive status by the Board until the curriculum has been completed.
