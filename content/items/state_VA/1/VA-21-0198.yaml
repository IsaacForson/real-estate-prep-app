stem: A Virginia-licensed real estate broker completes 20 hours of continuing education during a
  licensing term, including 2 hours of ethics, 2 hours of fair housing, 2 hours of legal updates, 2
  hours of real estate agency, 2 hours of real estate contracts, 6 hours of supervision and
  management courses, and 4 hours of general electives. According to Virginia law, does this broker
  satisfy the continuing education requirement for relicensure?
options:
  - The broker satisfies the continuing education requirement because they completed at least 20
    hours, which meets the minimum total requirement.
  - The broker satisfies the continuing education requirement because they completed the required
    hours of ethics, fair housing, legal updates, agency, and contracts.
  - The broker does not satisfy the continuing education requirement because they must complete at
    least 24 hours total and at least 11 required hours.
  - The broker does not satisfy the continuing education requirement because they must complete at
    least 16 hours total, which they have not met.
key: C
explanation: Brokers must complete not less than 24 hours of continuing education each term, with at
  least 11 required hours including three hours of ethics, two hours of fair housing, two hours of
  legal updates, two hours of agency, and two hours of contracts. The broker’s total of 20 hours
  falls short of the 24‑hour minimum, and their required‑hour total of 10 hours is below the 11‑hour
  minimum, so the requirement is not met.
