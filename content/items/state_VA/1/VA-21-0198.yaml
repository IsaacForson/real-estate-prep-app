  url: null
  quoted_text: "Brokers to whom active licenses have been issued by the Board shall be required to
    satisfactorily complete courses of not less than 24 hours of classroom or correspondence or
    other distance learning instruction during each licensing term. Of the total 24 hours, the
    curriculum shall consist of: a. A minimum of 11 required hours to include at least three hours
    of ethics and standards of conduct, two hours of fair housing, two hours of legal updates and
    emerging trends including flood hazard areas and the National Flood Insurance Program, two hours
    of real estate agency, and two hours of real estate contracts;"
