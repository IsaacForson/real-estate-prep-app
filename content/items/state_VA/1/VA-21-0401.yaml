stem: Under Virginia regulations, what happens to continuing education credits earned in excess of
  the required hours if they are completed within six months prior to license expiration?
options:
  - They are forfeited and cannot be used for renewal
  - They may be applied toward the next renewal period
  - They must be retaken to count toward the requirement
  - They are automatically converted to elective hours
key: B
explanation: The rule states that excess continuing education credits obtained in the six months
  immediately before license expiration will carry over into the next renewal period. Therefore, the
  excess hours may be applied toward the next renewal period. The distractor claiming the hours are
  forfeited is incorrect because the rule explicitly allows carryover for qualifying excess hours.
citation:
  source: 18 VAC 135-20-10 et seq. — 18 VAC 135-20 — Virginia Real Estate Board Licensing Regulations
    subsection H
  url: null
  quoted_text: Any continuing education credits completed by the licensee in excess of that required
    in the current license term that are obtained in the six months immediately prior to the license
    expiration date will carry over into the next two-year renewal period.
