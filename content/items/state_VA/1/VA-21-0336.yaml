stem: According to Virginia licensing regulations, what must a licensee do before using a
  professional name other than their legal name?
options:
  - File the professional name with the board prior to its use.
  - Obtain written approval from the employing broker.
  - Include a professional title such as 'Realtor' in the name.
  - Register the name with the county clerk's office.
key: A
explanation: The rule states that a licensee may use a professional name other than a legal name
  only if that professional name is filed with the board prior to its use. The distractor about
  obtaining written approval from the employing broker is incorrect because the regulation places
  the filing duty on the licensee, not the broker.
