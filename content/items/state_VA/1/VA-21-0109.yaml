explanation: Virginia law requires an initial broker license applicant to complete not less than 12
  semester hours of real estate instruction from an accredited institution, in addition to a high
  school diploma or equivalent. The six-semester-hour option reflects a common confusion with the
  salesperson’s semester-hour minimum, while 18 and 24 hours exceed the statutory minimum.
