stem: Under Virginia law, what is the maximum civil penalty the Real Estate Board may impose for
  unlicensed activity in a real estate transaction where the violator received no compensation?
options:
  - $500
  - $750
  - $1,000
  - $1,500
key: C
explanation: The statute states that the Board may impose a civil penalty not to exceed $1,000 for
  any real estate transaction or the compensation received, whichever is greater. When no
  compensation is received, the $1,000 cap applies. The $750 amount is a common misconception but is
  not the statutory limit.
citation:
  source: Va. Code Ann. § 54.1-2105.2(C)
  url: null
  quoted_text: Any person engaging in unlicensed activity shall be subject to further proceedings
    before the Board and the Board may impose a civil penalty not to exceed $1,000 for any real
    estate transaction or the compensation received from any such real estate transaction, whichever
    is greater.
