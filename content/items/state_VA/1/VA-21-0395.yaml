stem: Under Virginia law, does a sole proprietorship owned by a licensed real estate broker need to
  obtain a real estate firm license?
options:
  - Requirement to obtain a firm license before engaging in brokerage
  - Exemption from firm license with prohibition on fictitious name
  - Requirement to obtain a firm license only if employing others
  - Exemption from firm license but need a business entity salesperson license
key: B
explanation: Under Va. Code Ann. § 54.1-2106.1, a broker who owns a sole proprietorship may operate
  the brokerage without obtaining a separate firm license, but may not use a fictitious name.
citation:
  source: Va. Code Ann. § 54.1-2100 et seq. — Code of Virginia Title 54.1, Chapter 21 — Real Estate
    Brokers, Salespersons and Rental Location Agents — § 54.1-2106.1
  url: null
  quoted_text: An individual holding a broker's license may operate a real estate brokerage firm which
    he owns as a sole proprietorship without any further licensure by the Board, although such
    individual shall not operate the brokerage firm in a fictitious name.
