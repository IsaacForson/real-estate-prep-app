stem: "A salesperson submitted an activation application to Broker XYZ on April 1. The license has
  not yet been issued by the Board. On April 5, the salesperson shows a listing to a prospective
  buyer. Under Virginia law, this action is:"
options:
  - Considered permitted activity under Virginia law only
  - Considered unlicensed activity may lead to discipline
  - Considered allowed after completing continuing education
  - Considered permitted if the broker provides verbal approval
key: B
explanation: The key is correct because the regulation prohibits conducting licensed activity with
  the firm named in the application until the license is issued; showing a listing constitutes such
  activity and is therefore unlicensed, potentially leading to discipline. The option stating that
  the activity is allowed after completing continuing education is incorrect because completing
  continuing education does not satisfy the activation requirement; the license must be issued by
  the Board before any licensed activity may occur.
