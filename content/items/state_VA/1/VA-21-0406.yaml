stem: A licensee is discussing a property with a prospective buyer who is not the licensee's client
  and is not represented by another licensee. To whom must the licensee disclose any broker
  relationship the licensee has with another party to the transaction?
options:
  - The disclosure must be made to the licensee's client and no other party.
  - The disclosure must be made to the prospective buyer or seller who is not the client and lacks
    representation.
  - The disclosure must be made to any party present at the discussion, regardless of representation.
  - The disclosure must be made to the licensee's supervising broker only.
key: B
explanation: The rule requires disclosure to an actual or prospective buyer or seller who is not the
  licensee's client and is not represented by another licensee (§ 54.1-2138(A)). The correct option
  states that disclosure must be made to the prospective buyer or seller who is not the client and
  lacks representation, which matches the rule. The incorrect option that limits disclosure to the
  licensee's client is wrong because the rule applies to the non‑represented party. The option that
  requires disclosure to any party present is too broad, as the rule only applies to the
  non‑represented buyer or seller. The option that limits disclosure to the supervising broker is
  incorrect because the rule does not require informing the supervisor.
citation:
  source: Va. Code Ann. § 54.1-2100 et seq. § 54.1-2138
  url: null
  quoted_text: Upon having a substantive discussion about a specific property or properties in a
    residential real estate transaction with an actual or prospective buyer or seller who is not the
    client of the licensee and who is not represented by another licensee, a licensee shall disclose
    any broker relationship the licensee has with another party to the transaction.
