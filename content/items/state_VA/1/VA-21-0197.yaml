stem: A Virginia-licensed real estate broker who does not practice residential real estate submits a
  notarized affidavit certifying that they will not engage in residential real estate during the
  licensing term. According to Virginia law, what continuing education requirement applies to this
  broker for fair housing training?
options:
  - The broker must complete the standard two hours of fair housing training each renewal period.
  - The broker is exempt from fair housing training and must instead complete training in other
    federal and state discrimination laws.
  - The broker must complete four hours of fair housing training because they do not practice
    residential real estate.
  - The broker must complete no continuing education hours for fair housing during the licensing
    term.
key: B
explanation: If a licensee submits a notarized affidavit certifying they do not practice residential
  real estate and will not do so during the licensing term, training in fair housing shall not be
  required; instead, the licensee shall receive training in other applicable federal and state
  discrimination laws. The broker is therefore exempt from the standard fair housing hours and must
  complete alternative discrimination training.
