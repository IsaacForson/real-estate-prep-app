stem: "A broker’s license expired on March 1. On March 10, the broker shows a property to a
  prospective buyer and receives an earnest money deposit. Under Virginia law, this action is:"
options:
  - Considered unlicensed activity may lead to discipline
  - Considered allowed after completing continuing education
  - Considered permitted activity under Virginia law only
  - Considered permitted if the broker provides verbal approval
key: A
explanation: The key is correct because the regulation prohibits any real estate activity with an
  expired license, which may be deemed unlicensed activity and subject to prosecution. The claim
  that the activity is permitted if the broker provides verbal approval is incorrect because the
  prohibition applies regardless of whether the license is renewed within 30 days; the activity
  occurring after expiration is already unlawful.
