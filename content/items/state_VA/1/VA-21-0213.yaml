stem: If a principal broker's license is revoked by the Virginia Real Estate Board, what happens to
  the licenses of salespersons who are active with that firm?
options:
  - They stay active unless each is disciplined separately
  - They are automatically suspended for thirty days
  - They must be returned to the board pending reissuance
  - They are transferred to another broker right away
key: C
explanation: The rule states that when a principal broker's license is revoked, the licenses of all
  individuals active with the firm must be returned to the board until reissued upon written request
  of the sole proprietor or principal broker. Therefore, the salespersons' licenses are returned to
  the board pending reissuance. The distractor that they remain active unless individually
  disciplined is incorrect because the rule imposes an automatic return regardless of individual
  discipline.
citation:
  source: 18 VAC 135-20-10 et seq. — 18 VAC 135-20 — Virginia Real Estate Board Licensing Regulations
    — § 135-20-340
  url: null
  quoted_text: Action by the board resulting in the revocation, suspension, or denial of renewal of
    the license of any principal broker or sole proprietor will automatically result in an order
    that the licenses of any and all individuals active with the affected firm be returned to the
    board until such time as the licenses are reissued upon the written request of a sole proprietor
    or principal broker pursuant to 18VAC135-20-170 B.
