stem: A licensee called to active duty in the U.S. armed forces completes their service and is
  released on January 5. By what deadline must they finish their required continuing education for
  the current licensing term?
options:
  - within six months of their release from active duty
  - within three months of their release from active duty
  - within nine months of their release from active duty
  - within twelve months of their release from active duty
key: A
explanation: The law permits military personnel to finish their continuing education within six
  months of release from active duty. Options of three, nine, or twelve months either fall short of
  or exceed this allowance.
