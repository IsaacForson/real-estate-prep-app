stem: A group consisting of two licensed brokers and one licensed salesperson wishes to operate
  together as a real estate team in Virginia. According to Virginia law, what must they do before
  they can act as a team?
options:
  - Need to obtain a business entity salesperson license
  - Need to obtain a real estate firm license
  - Need to obtain a real estate branch office license
  - No additional license is needed
key: A
explanation: The statute provides that no group of individuals consisting of one or more real estate
  brokers or real estate salespersons, or a combination thereof, shall act as a real estate team
  without first obtaining a business entity salesperson's license from the Board. Therefore, the
  group must secure that license before operating as a team. The option suggesting a firm license is
  incorrect because the requirement for a team is specifically a business entity salesperson
  license, not a firm license.
