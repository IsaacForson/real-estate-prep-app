stem: A person who is not licensed by the Virginia Real Estate Board receives $1,200 in compensation
  for facilitating a lease transaction. According to Virginia law, what is the maximum civil penalty
  the Board may impose for this unlicensed activity?
options:
  - $1,000
  - $1,200
  - $1,500
  - $2,000
key: B
explanation: Under Va. Code Ann. § 54.1‑2105.2(C), the Board may impose a civil penalty not to
  exceed $1,000 for any real‑estate transaction or the compensation received from that transaction,
  whichever is greater. Because the compensation of $1,200 is greater than $1,000, the maximum
  penalty is $1,200.
citation:
  source: Va. Code Ann. § 54.1-2105.2(C)
  url: null
  quoted_text: Any person engaging in unlicensed activity shall be subject to further proceedings
    before the Board and the Board may impose a civil penalty not to exceed $1,000 for any real
    estate transaction or the compensation received from any such real estate transaction, whichever
    is greater.
