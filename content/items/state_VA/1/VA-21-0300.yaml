stem: An applicant for a Virginia broker license by reciprocity has been actively engaged as a
  salesperson for 34 of the last 48 months. According to Virginia regulations, what is missing for
  them to meet the experience requirement?
options:
  - Two additional months of active engagement as a salesperson
  - Passing the Virginia real estate broker examination
  - Proof of substantially equivalent education
  - Verification of experience by a principal broker
key: A
explanation: The rule requires 36 months of active engagement; the applicant has only 34, so they
  need two more months. The other options describe requirements that are either already satisfied
  (exam, education) or not the specific deficiency (verification).
