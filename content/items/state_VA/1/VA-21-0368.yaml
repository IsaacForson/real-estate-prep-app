stem: "Under Virginia law, a broker's noncompliance with chapter 21 regulations will **NOT** qualify
  for the voluntary compliance program if the noncompliance was:"
options:
  - The noncompliance was intentional or resulted from gross negligence.
  - The noncompliance was due to ordinary negligence only.
  - The noncompliance involved a failure to pay the required assessment fee.
  - The noncompliance occurred more than one year before discovery.
key: A
explanation: The voluntary compliance program is unavailable when the noncompliance is intentional
  or results from gross negligence, as explicitly stated in § 54.1-2111.1.C. Ordinary negligence,
  failure to pay an assessment, or the age of the noncompliance do not trigger this exemption.
