stem: A Virginia-licensed real estate salesperson who also serves as an approved instructor teaches
  a 3-hour continuing education course. According to Virginia regulations, how may the salesperson
  treat those 3 hours for continuing education credit?
options:
  - The salesperson may claim the 3 hours as continuing education credit for teaching the course
  - The salesperson must retake the course to receive any continuing education credit
  - The salesperson may only claim half of the hours as continuing education credit
  - The salesperson cannot claim any continuing education credit for teaching activities
key: A
explanation: The regulation explicitly allows instructors who are also licensees to earn continuing
  education credit for teaching continuing education courses. Therefore, the salesperson may claim
  the full 3 hours as credit. The distractor stating the salesperson cannot claim any credit
  contradicts the rule that permits such credit for teaching.
