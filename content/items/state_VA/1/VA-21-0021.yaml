stem: What is the minimum educational requirement for an initial real estate salesperson license in
  Virginia?
options:
  - A high school diploma or equivalent and completion of a principles of real estate course of at
    least four semester hours.
  - A high school diploma or equivalent and completion of a principles of real estate course of not
    less than 60 hours.
  - A high school diploma or equivalent and completion of a principles of real estate course of at
    least four semester hours and not less than 60 hours.
  - A high school diploma or equivalent and completion of 12 semester hours of real estate
    coursework.
key: C
explanation: Va. Code Ann. § 54.1-2105 requires a principles of real estate course that carries at
  least four semester hours of academic credit and is not less than 60 hours of classroom,
  correspondence, or other distance learning instruction, plus a high school diploma or equivalent.
  The option that includes both the four‑semester‑hour and the 60‑hour requirements meets this
  standard and is correct. The option that mentions only the semester‑hour requirement omits the
  60‑hour minimum and is therefore incorrect. The option that mentions only the 60‑hour requirement
  omits the semester‑hour minimum and is incorrect. The option requiring 12 semester hours of real
  estate coursework exceeds the minimum and does not match the statutory requirement, making it
  incorrect.
