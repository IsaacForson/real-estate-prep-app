stem: A licensee closes a residential sale and saves the signed settlement statement as a PDF file
  on a password-protected cloud storage service. The licensee does not retain any paper copy. Under
  Virginia law, is this permissible?
options:
  - Yes, because any document required to be maintained may be an electronic record if it complies
    with the Uniform Electronic Transactions Act.
  - No, because Virginia law requires transaction records to be kept in paper form for at least
    three years.
  - Yes, but the licensee must also notify the Virginia Real Estate Board of the electronic storage
    method.
  - No, because electronic records are not permitted for settlement statements under Virginia
    regulations.
key: A
explanation: The statute expressly permits any required document to be kept as an electronic record
  provided it complies with the Uniform Electronic Transactions Act. Storing the settlement
  statement as a PDF on a secure cloud service satisfies this condition if it meets UETA standards.
  The distractor claiming a paper‑form requirement is incorrect because the law does not mandate
  paper; it allows electronic records.
