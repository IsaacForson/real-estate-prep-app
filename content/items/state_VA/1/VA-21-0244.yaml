stem: A licensee mistakenly deposits personal funds into the escrow account holding a client’s
  earnest money. Which statement best describes the licensee’s action under Virginia law?
options:
  - The licensee may correct the error by transferring an equal amount from the escrow account to
    their personal account.
  - The licensee must pay interest on the commingled funds to the client at the statutory rate.
  - The licensee is permitted to commingle personal and escrow funds as long as the total is
    accounted for.
  - The licensee has diverted or misused funds held in escrow, which is prohibited.
key: D
explanation: Virginia law prohibits a licensee from diverting or misusing any funds held in escrow.
  Depositing personal funds into the escrow account constitutes such misuse, so the licensee has
  diverted or misused escrow funds, which is prohibited. The other statements describe actions that
  the statute does not permit—such as correcting the error by moving money, paying interest, or
  commingling funds as long as they are accounted for.
