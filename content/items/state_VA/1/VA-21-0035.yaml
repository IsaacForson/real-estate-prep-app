stem: A Virginia firm’s license expires on August 15. By what date must the principal broker
  complete the required audit to comply with board regulations?
options:
  - May 17
  - May 27
  - June 14
  - July 1
key: A
explanation: The rule mandates an audit within 90 days prior to the firm license expiration date.
  Counting back 90 days from August 15 yields May 17, so the audit must be finished by that date.
  June 14 is only 62 days prior and does not satisfy the 90‑day requirement.
