stem: According to the Virginia Real Estate Transaction Recovery Act, which statement correctly
  defines 'improper or dishonest conduct'?
options:
  - It includes only a violation of fair housing laws, regardless of intent, and applies to both
    residential and commercial transactions.
  - It includes only the wrongful and fraudulent taking or conversion of money, property, or other
    things of value or material misrepresentation or deceit.
  - It includes only breach of contract claims arising from real estate transactions, including
    failures to close on time.
  - It includes only negligent misrepresentation that does not involve fraud, such as inadvertent
    errors in property disclosures.
key: B
explanation: "The Virginia Real Estate Transaction Recovery Act defines improper or dishonest
  conduct as limited to the wrongful or fraudulent taking or conversion of money, property, or other
  things of value, or to material misrepresentation or deceit. The option stating that improper or
  dishonest conduct includes only the wrongful and fraudulent taking or conversion of money,
  property, or other things of value or material misrepresentation or deceit matches this
  definition. The other options are incorrect: one adds fair‑housing violations, another limits the
  definition to breach‑of‑contract claims, and a third limits it to negligent misrepresentation
  without fraud."
