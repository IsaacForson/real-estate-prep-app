stem: A person has been actively engaged as a licensed real estate broker for eight consecutive
  years. Does this person qualify to serve as one of the seven broker members of the Virginia Real
  Estate Board?
options:
  - The person does not qualify because they lack the required consecutive years of experience.
  - The person does not qualify because they exceed the required consecutive years of experience.
  - The person qualifies because they meet the required consecutive years of experience.
  - The person qualifies because they have less than the required consecutive years of experience.
key: C
explanation: The person has eight consecutive years of experience, which satisfies the minimum of
  seven consecutive years required for the seven broker seats on the Board. Hence, they qualify to
  serve as one of those members. The other options incorrectly state that they lack experience, have
  too little, or are disqualified by excess experience.
