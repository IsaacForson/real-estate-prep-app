stem: Under Virginia regulations, when does a real estate license expire?
options:
  - Two years from the last day of the month in which the license was issued
  - One year from the last day of the month in which the license was issued
  - Three years from the last day of the month in which the license was issued
  - Two years from the first day of the month in which the license was issued
key: A
explanation: Virginia regulations state that licenses expire two years from the last day of the
  month in which they were issued. This is the standard expiration period for salesperson, broker,
  and firm licenses. The other options describe different timeframes that are not supported by the
  regulation.
