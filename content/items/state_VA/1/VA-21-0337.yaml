stem: A principal broker employed by a Virginia real estate firm terminates active status with the
  firm on March 15. According to Virginia licensing regulations, which party is responsible for
  notifying the Board, and within how many calendar days must the notification be made?
options:
  - The principal broker must notify the Board within 10 calendar days.
  - The firm must notify the Board within 30 calendar days.
  - The firm must notify the Board within 10 calendar days.
  - The principal broker must notify the Board within 30 calendar days.
key: C
explanation: The regulation requires the firm to notify the board within 10 calendar days when a
  principal broker terminates active status. The distractor suggesting the principal broker must
  notify is incorrect because the duty falls on the firm, not the broker.
