stem: A principal broker terminates a salesperson's active status on June 12. By what date must the
  principal broker notify the Virginia Real Estate Board in writing?
options:
  - June 20, 2024
  - June 30, 2024
  - July 2, 2024
  - June 22, 2024
key: D
explanation: The regulation requires notice within 10 calendar days of a termination. Adding 10 days
  to June 12 results in June 22, 2024. June 20 is only 8 days later, while July 2 adds 20 days.
citation:
  source: 18 VAC 135-20-10 et seq. — 18 VAC 135-20 — Virginia Real Estate Board Licensing Regulations
    — § 135-20-170 B.1
  url: null
  quoted_text: When any salesperson or broker is discharged or in any way terminates active status
    with a sole proprietorship or firm, it is the duty of the sole proprietor or principal broker to
    notify the board with the licensee name, license number, and date of termination within 10
    calendar days of the date of termination or being notified of the status change.
