stem: "Under Virginia law, the Virginia Real Estate Board must pay a receiver's expenses and fees if:"
options:
  - the licensee lacks sufficient funds to pay the receiver
  - the court finds the licensee blameless and violation-free
  - the receiver is appointed by a court with equity jurisdiction
  - the escrow funds are insufficient to cover any outstanding debt
key: B
explanation: Under § 54.1‑2108, the Board is required to pay a receiver’s expenses and fees only
  when a court determines that the licensee was without fault and did not violate any provision of
  the chapter or Board regulations. The statement that the licensee lacks sufficient funds to pay
  the receiver is incorrect because the Board’s responsibility is not triggered by the licensee’s
  inability to pay; liability remains with the licensee unless the court finds no fault. Likewise,
  the assertion that the receiver is appointed by a court with equity jurisdiction and the claim
  that escrow funds are insufficient do not satisfy the statutory condition, so they are also
  incorrect.
citation:
