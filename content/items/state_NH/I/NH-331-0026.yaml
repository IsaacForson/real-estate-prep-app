stem: A principal broker dies, and the legal representative applies for a temporary license to
  continue the brokerage business. What is the maximum duration of such a temporary license under
  RSA 331-A:21?
options:
  - A period of six months.
  - A period of one year.
  - A period of two years.
  - A period of indefinite length.
key: B
explanation: RSA 331-A:21 states that a temporary license issued after the death or total incapacity
  of a principal broker authorizes activity for a period not to exceed one year from the date of
  death or incapacitation. Therefore, a six‑month period is not the maximum allowed by statute.
