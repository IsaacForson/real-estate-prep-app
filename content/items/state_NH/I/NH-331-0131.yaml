stem: Under RSA 331-A:25, the New Hampshire Real Estate Commission is required to adopt rules
  relative to which of the following?
options:
  - Setting maximum commission rates for residential transactions
  - Conduct of licensed brokers and salespeople
  - Approving subdivision plats filed with municipalities
  - Determining property tax assessments for commercial properties
key: B
explanation: The statute explicitly lists the subjects for which the commission must adopt rules,
  beginning with the conduct of licensed brokers and salespeople. The other options involve
  rate‑setting, tax assessment, and subdivision approval, which are not mentioned in RSA 331‑A:25.
