stem: Under RSA 331-A:26 VII, within how many days must a licensee return trust funds after the
  owner makes a demand for them?
options:
  - 20 days
  - 10 days
  - 60 days
  - 30 days
key: D
explanation: The statute states that failure to return money within 30 days after demand is prima
  facie evidence of conversion, establishing the 30‑day requirement. The 20‑day option is a common
  mis‑statement of the period.
citation:
