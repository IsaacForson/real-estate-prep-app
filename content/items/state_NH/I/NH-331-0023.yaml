stem: A licensee accepts a promissory note as earnest money from a buyer but does not inform the
  owner in writing before the owner accepts the offer and does not note the non‑cash earnest money
  on the receipt. Which prohibited conduct does this violate?
options:
  - Acting for more than one party in a transaction without obtaining written consent of all parties
    in a dual agency scenario
  - Failing to keep escrow and trust account records for a period of three years as required by
    state law
  - Accepting a commission or valuable consideration from a person other than the licensed principal
    broker without the principal broker's written consent
  - Accepting a promissory note as earnest money without prior written disclosure to the owner and
    without noting it on the earnest money receipt
key: D
explanation: RSA 331-A:26 XI mandates written disclosure to the owner and notation on the earnest
  money receipt when accepting non‑cash earnest money. The distractor about failing to keep escrow
  records is prohibited under subsection XVIII, not XI.
citation:
  source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act) — RSA Chapter 331-A
    — New Hampshire Real Estate Practice Act, official General Court page read via Internet Archive
    capture of 2025-07-09 because gc.nh.gov returns 403 to scripts — § 1 Section 331-A:26 XI
  url: null
  quoted_text: Accepting other than cash or its equivalent as earnest money, unless that fact is
    communicated in writing to the owner prior to the owner's acceptance of the offer to purchase,
    and such fact is shown in the earnest money receipt and acknowledged in writing by the owner.
