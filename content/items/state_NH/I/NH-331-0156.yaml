stem: "A salesperson receives a $5,000 earnest money check from a buyer and deposits it into their
  personal checking account, intending to transfer it to the broker's trust account after two weeks.
  Under RSA 331-A:26 VIII, this conduct is:"
options:
  - The conduct is permitted because the funds will eventually be placed in a trust account
  - The conduct is permitted if the salesperson reconciles the account monthly and keeps proper
    documentation
  - The conduct is prohibited because trust funds must be placed promptly in a proper trust account
  - The conduct is permitted only if the broker provides written consent and obtains the owner's
    approval
key: C
explanation: RSA 331-A:26 VIII makes it unlawful to fail to promptly place trust funds in a proper
  trust account. Because the earnest‑money check was kept in a personal account for two weeks before
  being transferred, the conduct violates that provision. A statement that the funds will eventually
  be deposited is insufficient, since the statute requires prompt placement.
