stem: A licensee with a prior disciplinary record for fraud is appearing before the commission for a
  new violation. Under Rea 206.01(f)(1), which factor is considered an aggravating circumstance?
options:
  - The licensee's prior disciplinary record on file
  - The licensee's willingness to cooperate with the commission
  - The absence of any prior disciplinary record on file
  - The lack of potential harm to the public from the act
key: A
explanation: Rea 206.01(f)(1) lists a prior disciplinary record as an aggravating circumstance.
  Willingness to cooperate with the commission is a mitigating circumstance under Rea 206.01(g)(3).
