stem: A licensee accepts a personal check as earnest money from a buyer but fails to inform the
  seller in writing before the seller accepts the offer. Which prohibited conduct under RSA 331-A:26
  does this violate?
options:
  - The licensee must disclose in writing to the owner before acceptance.
  - The licensee must disclose verbally to the owner before acceptance.
  - The licensee must disclose in writing to the owner after acceptance.
  - The licensee is not required to disclose to the owner.
key: A
explanation: RSA 331-A:26 XI requires that any earnest money other than cash be disclosed in writing
  to the owner prior to the owner's acceptance of the offer. Failing to provide written disclosure
  before acceptance violates this provision. Verbal disclosure or disclosure after acceptance does
  not satisfy the statutory requirement.
