stem: Which of the following is **NOT** an exception to the confidentiality duty owed by a seller's
  agent under RSA 331-A:25-b(c)?
options:
  - The seller gives written consent to disclose the information.
  - The information becomes public through a source other than the licensee.
  - Disclosure is necessary to defend the licensee against an accusation of wrongful conduct.
  - The licensee discloses the information to a friend for personal advice.
key: D
explanation: The key is correct because RSA 331-A:25-b(c) explicitly lists the circumstances under
  which confidentiality may be broken, and disclosing to a friend for personal advice is not among
  them. The most tempting distractor, 'Disclosure is necessary to defend the licensee against an
  accusation of wrongful conduct,' is actually a listed exception, so it does not satisfy the
  question's ask for a non‑exception.
citation:
  source: "### N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act) — RSA Chapter
    331-A — New Hampshire Real Estate Practice Act, official General Court page read via Internet
    Archive capture of 2025-07-09 because gc.nh.gov returns 403 to scripts Section 331-A:25-b(c)"
  url: null
  quoted_text: "Confidentiality shall be maintained unless: (1) The seller or landlord to whom the
    information pertains grants written consent to disclose the information; (2) The information is
    made public from a source other than the licensee; (3) Disclosure is necessary to defend the
    licensee against an accusation of wrongful conduct in a judicial proceeding before a court of
    competent jurisdiction, the commission, or before a professional committee; or (4) If otherwise
    required by law."
