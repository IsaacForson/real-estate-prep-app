stem: "A principal broker retains escrow account records for only two years after a transaction
  closes, then discards them. Under RSA 331-A:26 XVIII, this action is:"
options:
  - The conduct is permitted because the transaction is closed
  - The conduct is permitted if the broker maintains separate transaction files
  - The conduct is prohibited because escrow and trust account records must be kept for three years
  - The conduct is permitted if the records are stored electronically
key: C
explanation: Section XVIII requires keeping escrow and trust account records for a period of three
  years, showing dates of deposit, withdrawal, and payee; discarding after two years violates this
  requirement. The option citing closure of the transaction does not override the retention period.
