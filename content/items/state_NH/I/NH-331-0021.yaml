stem: Under RSA 331-A:26, which of the following acts is specifically prohibited as obtaining or
  attempting to obtain a license by fraudulent means?
options:
  - Obtaining a license by fraud, misrepresentation, or concealment
  - Failing to place trust funds in a proper trust account
  - Advertising without stating the name of the individual principal broker
  - Accepting a commission from someone other than the licensed principal broker
key: A
explanation: RSA 331-A:26 I expressly prohibits obtaining or attempting to obtain a license by means
  of fraud, misrepresentation, or concealment. The distractor about failing to place trust funds in
  a proper trust account is prohibited under subsection VIII, not I.
