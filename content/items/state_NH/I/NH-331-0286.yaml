stem: Under RSA 331-A:26, what must a licensee do when the New Hampshire Real Estate Commission
  investigates a real estate transaction?
options:
  - Return earnest money deposits within 30 days of demand
  - Notify the commission within 30 days of any conviction
  - Obtain written consent before acting as a disclosed dual agent
  - Produce any document, book or record concerning the transaction
key: D
explanation: RSA 331-A:26 XXXV prohibits the failure to produce any document, book or record
  concerning a transaction under investigation, which establishes the duty to produce such documents
  when requested. Therefore, the licensee must produce any document, book or record concerning the
  transaction. The distractor about notifying the commission within 30 days of a conviction pertains
  to a different provision (XXXVII) and is not required in this context.
citation:
