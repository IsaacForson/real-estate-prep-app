stem: A principal broker’s surety bond is cancelled by the surety company. Under RSA 331-A:14, what
  action may the New Hampshire Real Estate Commission take regarding the broker’s license?
options:
  - completion of additional continuing education hours
  - revocation of the principal or managing broker's license
  - a fine of five thousand dollars payable to the commission
  - suspension of the license for a period of six months
key: B
explanation: The statute states that the commission may revoke the license of any principal or
  managing broker whenever the bond filed by the broker ceases to be in full force and effect.
  Suspension, fines, or additional education are not mentioned as remedies for a lapsed bond in this
  section.
