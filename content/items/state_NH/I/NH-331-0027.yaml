  url: null
  quoted_text: Upon making application, such nonresidents shall file an irrevocable consent and power
    providing that legal actions may be commenced against them in the proper court of any county of
    this state in which a cause of action may arise or in which the plaintiff may reside by service
    of process or pleading authorized by the laws of this state on a member of the commission or its
    executive director
