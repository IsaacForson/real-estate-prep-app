stem: A nonresident of New Hampshire applies for a real estate salesperson license. What must the
  applicant file with the application under RSA 331-A:22?
options:
  - A surety bond in the amount of ten thousand dollars payable to the state.
  - An irrevocable consent and power for service of process on a commission member.
  - An affidavit of lawful presence accompanied by a valid passport.
  - A certificate showing completion of a sixty-hour pre-licensing course.
key: B
explanation: RSA 331-A:22 requires nonresident applicants to file an irrevocable consent and power
  that authorizes service of process on a member of the commission or its executive director. A
  surety bond, affidavit of lawful presence, or course completion certificate is not mandated by
  this provision.
citation:
  source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act) — RSA Chapter 331-A
