stem: Under RSA 331-A:11, an applicant who has passed the real estate salesperson or broker
  examination must become licensed within how many months of the examination date?
options:
  - Six months
  - Twelve months
  - Nine months
  - Three months
key: A
explanation: The statute states that anyone who passes the broker or salesperson exam must become
  licensed within 6 months of the examination date; otherwise they must retake the exam. Therefore
  six months is the correct period. Three months is incorrect because the law allows up to six
  months, not a shorter deadline.
