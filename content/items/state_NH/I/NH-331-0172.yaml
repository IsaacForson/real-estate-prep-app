stem: Under RSA 331-A:26 XII, when must a licensee obtain written consent from all parties to act as
  a disclosed dual agent?
options:
  - Before offer preparation
  - After offer preparation
  - After agreement signing
  - Before closing with consent
key: A
explanation: RSA 331-A:26 XII prohibits acting for more than one party without obtaining written
  consent at the time the dual agency relationship occurs, but no later than the preparation of a
  written offer. Therefore, consent must be secured before the written offer is prepared. Obtaining
  consent after offer preparation or after signing the agreement is untimely and violates the
  statute.
