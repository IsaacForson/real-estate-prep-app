stem: Which individual would be disqualified from serving as the public member of the New Hampshire
  Real Estate Commission?
options:
  - A spouse of a licensed real estate broker
  - A person who has not worked in real estate
  - A resident of New Hampshire for six years
  - A lawyer licensed in New Hampshire
key: A
explanation: RSA 331-A:5 IV states that the public member must be a person who is not, and never
  was, a member of the real estate profession or the spouse of any such person. Thus, a spouse of a
  licensed broker is disqualified. A person with no real estate background, a six‑year resident, or
  a lawyer are not barred by this provision.
