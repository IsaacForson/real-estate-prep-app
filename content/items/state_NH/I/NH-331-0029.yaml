stem: Under Rea 206.01(c), what must an order issued by the New Hampshire Real Estate Commission include?
options:
  - A recommendation for license suspension after review
  - A copy of the complaint filed with the commission
  - Findings of fact and conclusions of law based on evidence
  - A summary of the hearing proceedings based on testimony
key: C
explanation: Rea 206.01(c) requires an order to include findings of fact and conclusions of law and
  to be based on the preponderance of evidence presented at the disciplinary hearing or contained in
  the record. The option describing a summary of the hearing proceedings based on testimony does not
  satisfy this requirement.
