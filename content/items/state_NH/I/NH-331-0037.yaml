stem: A licensee receives a $5,000 earnest money deposit from a buyer and holds it in trust. After
  the purchase agreement is terminated, the seller demands return of the deposit. The licensee fails
  to return the money within 30 days. Which prohibited conduct under RSA 331-A:26 does this
  constitute?
options:
  - Obtaining a license by fraud, misrepresentation, or concealment.
  - Making false statements that reasonably induce a person to act.
  - Converting trust funds by failing to return money within 30 days after demand.
  - Failing to disclose an ownership interest in property offered for sale or lease.
key: C
explanation: The licensee’s failure to return the earnest money within 30 days after the seller’s
  demand meets the statutory definition of conversion under RSA 331-A:26(VII), which treats such a
  failure as prima facie evidence of converting entrusted funds. Therefore, the conduct violates the
  prohibition on conversion of trust funds. The distractor about failing to disclose an ownership
  interest in property offered for sale or lease is incorrect because that provision concerns
  revealing a licensee’s personal interest in property, not the handling of trust deposits. The
  distractor about making false statements that reasonably induce a person to act is also incorrect
  as it pertains to misleading descriptions or promises about property, not the return of funds.
