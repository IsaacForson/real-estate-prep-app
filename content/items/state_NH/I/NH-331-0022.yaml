stem: A licensee prepares a comparative market analysis for a property in which they hold an
  ownership interest but does not disclose that interest in the report. Which prohibited conduct
  does this violate?
options:
  - Advertising real estate services without stating the name of the individual principal broker
  - Issuing a comparative market analysis without disclosing the licensee's interest in the property
  - Accepting an undisclosed commission or rebate on expenditures made for the principal
  - Failing to reconcile trust account records on a monthly basis
key: B
explanation: RSA 331-A:26 XV requires that any interest the licensee has in the property be clearly
  stated when issuing a comparative market analysis. The distractor about accepting an undisclosed
  commission is prohibited under subsection XIII, not XV.
