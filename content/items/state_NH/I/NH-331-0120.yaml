stem: An out-of-state broker advertises commercial real estate for sale in New Hampshire under a
  cooperative agreement with a licensed New Hampshire broker. Under RSA 331-A:22-a III, what must
  the out-of-state broker include in any advertising material?
options:
  - The out-of-state broker's license number from the home state
  - The name and contact information of the cooperating New Hampshire broker
  - The disclaimer that the broker is not licensed in New Hampshire
  - The property's tax map number, legal description, and zoning classification
key: B
explanation: RSA 331-A:22-a III requires that any advertising material for commercial real estate
  include the name and contact information of the New Hampshire licensed broker with whom the
  out-of-state broker has a written agreement, displayed equally prominently. The out-of-state
  broker's own license number is not mandated in the advertisement. A disclaimer about lack of New
  Hampshire licensure is not required by this provision. The property's tax map number is unrelated
  to advertising rules for out-of-state brokers.
