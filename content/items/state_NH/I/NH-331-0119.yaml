stem: A principal broker dies, and the legal representative applies for a temporary license to
  continue the brokerage business. Under RSA 331-A:21, what is required for the office to issue a
  temporary license to the legal representative?
options:
  - Approval from the New Hampshire Bar Association for licensure
  - Proof of completing 30 hours of continuing education
  - Payment of the prescribed fee to the real estate commission
  - A written agreement with an out-of-state broker for cooperation
key: C
explanation: The statute states that the office may issue a temporary license 'and by the payment of
  the prescribed fee,' making fee payment a requirement. Continuing education completion is not a
  condition for obtaining a temporary license under RSA 331-A:21. Approval from the bar association
  is unrelated to the real estate commission's licensing process. A written agreement with an
  out-of-state broker pertains to cooperative brokerage, not temporary licensure.
