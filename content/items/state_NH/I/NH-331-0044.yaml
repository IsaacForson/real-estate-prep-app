stem: Under RSA 331-A:27, what is the consequence for a license obtained through the mistake or
  inadvertence of the executive director?
options:
  - Fine of one thousand dollars
  - Suspension for six months
  - Revocation of the license
  - Mandatory continuing education
key: C
explanation: The statute explicitly states that a license obtained through the mistake or
  inadvertence of the executive director shall be subject to revocation. Suspension for six months
  is not mentioned; the law provides revocation as the penalty.
