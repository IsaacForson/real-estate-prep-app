stem: Under the New Hampshire Real Estate Practice Act, what is the minimum period of state
  residency required for an individual to be appointed to the New Hampshire real estate commission?
options:
  - 2 years
  - 8 years
  - 4 years
  - 6 years
key: D
explanation: The statute explicitly states that each commission member must be a resident of the
  state for at least six years prior to appointment. The four‑year option incorrectly reflects the
  term length for commission members, which is five years, not four.
