stem: A licensee receives a written request from the New Hampshire Real Estate Commission to provide
  the closing statement for a transaction under investigation. The licensee refuses to produce the
  document. Which prohibited conduct under RSA 331-A:26 does this constitute?
options:
  - Failure to produce any document, book or record concerning the transaction
  - Return of earnest money deposits within 30 days of demand
  - Notification of the commission within 30 days of any conviction
  - Obtaining written consent before acting as a disclosed dual agent
key: A
explanation: Refusing to produce the requested closing statement constitutes a failure to produce a
  document, book or record concerning a transaction under investigation, which is expressly
  prohibited by RSA 331-A:26 XXXV. The correct answer is therefore the failure to produce any
  document, book or record concerning the transaction. The distractor about notifying the commission
  within 30 days of a conviction relates to a separate offense (XXXVII) and does not apply to the
  refusal to produce documents.
citation:
  source: N.H. Rev. Stat. Ann. ch. 331-A § 331-A:26 XXXV
  url: null
  quoted_text: Failure to produce any document, book or record, in the licensee's possession or under
    the licensee's control, concerning any real estate transaction under investigation by the
    commission for inspection and copying.
