stem: A seller's agent has a listing under contract; the seller asks the agent to continue marketing
  the property and seek backup offers. The agent refuses, citing that they are not obligated to seek
  additional offers while under contract. Is the agent's refusal permissible under RSA
  331-A:25-b(b)(1)?
options:
  - No, because the agent must seek offers unless the seller objects in writing.
  - Yes, but only if the seller agrees to pay an additional commission for the extra work.
  - No, because the agent must seek additional offers to protect the seller's interests.
  - Yes, because the licensee is not obligated unless the brokerage agreement provides otherwise.
key: D
explanation: The key is correct because RSA 331-A:25-b(b)(1) states that a licensee is not obligated
  to seek additional offers while the property is under contract unless the brokerage agreement
  provides otherwise. Since no such agreement term is mentioned, the agent’s refusal is permissible.
  The most tempting distractor, 'No, because the agent must seek additional offers to protect the
  seller's interests,' incorrectly ignores the statutory exception.
