stem: Which of the following individuals is eligible to serve as the licensed real estate
  salesperson member of the New Hampshire Real Estate Commission?
options:
  - Licensed real estate broker
  - Licensed real estate salesperson
  - Public member with no real estate
  - Attorney licensed in New Hampshire
key: B
explanation: RSA 331-A:5 II(b) specifies that the commission shall include one licensed real estate
  salesperson. Therefore, only an active salesperson qualifies for that seat. A broker, attorney, or
  public member with prior real estate experience does not meet the statutory requirement for the
  salesperson position.
