stem: A licensee learns that a prospective buyer previously received treatment for opioid addiction
  but has been sober for two years and is not currently using any illegal substances. Under the New
  Hampshire Law Against Discrimination, how should the licensee treat the buyer’s condition?
options:
  - The buyer is not protected because opioid addiction is not a recognized disability
  - The buyer is considered to have a disability due to a record of impairment
  - The buyer is only protected if they request a reasonable accommodation
  - The buyer is excluded because addiction to a controlled substance is not a disability
key: B
explanation: Under RSA 354‑A:2(IV), disability includes a record of a physical or mental impairment.
  Past opioid addiction therefore qualifies as a disability. The exclusion for current illegal use
  of a controlled substance does not apply to a past record, so the buyer is protected.
