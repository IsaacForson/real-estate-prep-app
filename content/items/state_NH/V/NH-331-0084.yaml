  quoted_text: >-
    Disability" means, with respect to a person:


    (a) A physical or mental impairment which substantially limits one or more of such person's
    major life activities;


    (b) A record of having such an impairment; or


    (c) Being regarded as having such an impairment.


    Provided, that "disability" does not include current, illegal use of or addiction to a
    controlled substance as defined in the Controlled Substances Act (21 U.S.C. 802 sec. 102
