  url: null
  quoted_text: Distribute or cause to be distributed, written material or statements designed to
    induce any owner of residential real estate in this state to sell or lease his or her property
    because of any present or prospective changes in the race, color, religion, national origin,
    ancestry, age, sex, sexual orientation, gender identity, marital status, familial status or
    disability of residents in the vicinity of the property involved.
