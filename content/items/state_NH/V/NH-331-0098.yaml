stem: "A licensee mails flyers to homeowners in a neighborhood stating that property values will
  likely decline if more families of a certain national origin move into the area. Under the New
  Hampshire Law Against Discrimination, this conduct is:"
options:
  - This conduct is a permissible marketing practice because it is based on market trends.
  - This conduct is a civil rights violation because it induces owners to sell based on prospective
    national origin changes.
  - This conduct is allowed if the licensee also includes a disclaimer about fair housing.
  - This conduct is exempt under the private sale exemption for single-family homes.
key: B
explanation: RSA 354-A:12(II) makes it a civil rights violation to distribute written material
  designed to induce an owner to sell because of prospective changes in the national origin of
  residents. The flyer’s message falls squarely within this prohibition. A claim that the
  communication is merely based on market trends does not excuse the inducement based on a protected
  class, and adding a fair‑housing disclaimer does not negate the violation. The private‑sale
  exemption does not apply because the conduct involves inducement, not a sale by an owner.
citation:
  source: N.H. Rev. Stat. Ann. ch. 354-A — RSA Chapter 354-A, official General Court page read via
