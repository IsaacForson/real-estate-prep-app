stem: A licensee publishes an advertisement for a rental unit stating 'No children allowed.' Under
  the New Hampshire Law Against Discrimination, which statement about this advertisement is correct?
options:
  - The advertisement is permissible because it protects the landlord’s property from potential
    damage.
  - The advertisement is a civil rights violation because it indicates a preference based on
    familial status.
  - The advertisement is allowed if the unit is designated for senior housing under federal
    exemptions.
  - The advertisement is permissible only if it includes a fair housing logo and disclaimer.
key: B
explanation: Under N.H. Rev. Stat. Ann. ch. 354‑A, § 354‑A:10, the law prohibits any advertisement
  that indicates a preference, limitation, or discrimination based on familial status. Stating 'No
  children allowed' clearly shows such a preference, making it a civil rights violation. The claim
  that the advertisement is allowed if the unit is designated for senior housing under federal
  exemptions is incorrect because the exemption applies only to housing specifically intended for
  older persons, not to a general rental advertisement. The claim that the advertisement is
  permissible because it protects the landlord’s property from potential damage is incorrect because
  property protection does not justify discrimination based on familial status. The claim that the
  advertisement is permissible only if it includes a fair housing logo and disclaimer is incorrect
  because adding a logo or disclaimer does not cure a discriminatory statement.
