stem: Under the New Hampshire Law Against Discrimination, which individual is **NOT** considered to
  have a disability?
options:
  - A person regarded as having a physical impairment that limits daily activities.
  - A person currently using illegal drugs despite knowing the health risks.
  - A person with a recorded history of mental illness residing in New Hampshire.
  - A person with a physical impairment that substantially limits a major life activity.
key: B
explanation: The statute expressly excludes current illegal use of or addiction to a controlled
  substance from the definition of disability. The other options describe a recorded impairment,
  being regarded as impaired, or a substantially limiting impairment, all of which are included in
  the disability definition.
