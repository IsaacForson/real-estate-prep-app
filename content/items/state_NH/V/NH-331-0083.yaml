stem: Under New Hampshire Law Against Discrimination, which of the following is included in the
  statutory definition of 'familial status'?
options:
  - A person who employs workers who have children under eighteen years of age
  - A person who receives government aid for housing families with children
  - A person who is pregnant or is seeking legal custody of a child under eighteen
  - A person who owns residential property rented to families with children
key: C
explanation: Under N.H. Rev. Stat. Ann. ch. 354‑A § 354‑A:2(IX), familial status includes any person
  who is pregnant or in the process of securing legal custody of a child under 18 years old. The
  definition does not cover employing workers with children, receiving housing assistance, or owning
  property rented to families with children.
