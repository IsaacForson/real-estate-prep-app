stem: Which of the following is included in the definition of protected classes under the New
  Hampshire Law Against Discrimination?
options:
  - Political affiliation as a protected class
  - Income as a protected class
  - Age as a protected class
  - Education level as a protected class
key: C
explanation: The statute expressly lists age among the characteristics that define protected classes
  in public schools, stating that no person shall be discriminated against because of their age,
  sex, gender identity, sexual orientation, race, color, marital status, familial status,
  disability, religion or national origin. Income is not mentioned as a protected characteristic,
  making that option incorrect.
