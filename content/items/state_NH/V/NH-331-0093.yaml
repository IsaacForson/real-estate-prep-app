stem: Under New Hampshire Law Against Discrimination, which of the following best describes an
  'aggrieved person'?
options:
  - Any person who files a complaint with the commission alleging injury from a discriminatory
    housing practice.
  - Any person who claims injury from a discriminatory housing practice or believes they will be
    injured by such a practice that is about to occur.
  - Any person who is a member of a protected class under the New Hampshire Law Against
    Discrimination.
  - Any person who has suffered actual monetary loss due to discrimination in a real estate
    transaction.
key: B
explanation: The statute defines an 'aggrieved person' as anyone who claims to have been injured by
  a discriminatory housing practice or believes they will be injured by such a practice that is
  about to occur (N.H. Rev. Stat. Ann. ch. 354‑A, § 9). This matches the option stating that any
  person who claims injury from a discriminatory housing practice or believes they will be injured
  by such a practice that is about to occur. The option that says any person who files a complaint
  with the commission alleging injury from a discriminatory housing practice is incorrect because
  merely filing a complaint does not satisfy the definition; the person must allege injury or
  imminent injury. The option that says any person who is a member of a protected class under the
  law is incorrect because membership in a protected class does not automatically make someone
  aggrieved. The option that says any person who has suffered actual monetary loss due to
  discrimination in a real estate transaction is incorrect because the definition does not require
  actual monetary loss.
