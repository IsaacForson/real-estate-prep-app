stem: A local restaurant employs five workers, including part‑time staff. Under the New Hampshire
  Law Against Discrimination, how is the restaurant classified for purposes of the act’s employment
  provisions?
options:
  - The restaurant is considered an employer only if it offers health benefits
  - The restaurant is not considered an employer because it is a food service establishment
  - The restaurant is considered an employer because it pays wages to workers
  - The restaurant is not considered an employer because it has fewer than six persons in its employ
key: D
explanation: The statute explicitly excludes any employer with fewer than six persons in its employ
  from the definition of “employer.” Since the restaurant has five workers, it falls below that
  threshold and is not considered an employer under the act. The other options incorrectly rely on
  wages, benefits, or industry type, which are not part of the exemption.
