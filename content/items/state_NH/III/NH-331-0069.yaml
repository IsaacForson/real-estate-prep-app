stem: A licensee changes affiliation from one principal broker to another and submits the
  appropriate amendment form. Under N.H. Code Admin. R. Rea 404.02(d), what must the new principal
  broker do regarding the applicant?
options:
  - submit an amendment fee along with the form and supporting documents
  - submit a $25,000 surety bond accompanied by the required amendment form
  - attest that the applicant is of good moral character and is trustworthy
  - wait five days before submitting the form to the commission
key: C
explanation: Under N.H. Code Admin. R. Rea 404.02(d), when a licensee changes affiliation and
  submits the appropriate amendment form, the new principal broker must attest that the applicant is
  of good moral character and is trustworthy.
