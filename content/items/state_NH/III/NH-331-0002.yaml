stem: Under N.H. Code Admin. R. Rea 404.03, when must a licensee deliver a copy of an executed
  instrument without delay?
options:
  - When the instrument relates to the employment of the licensee
  - When the instrument is requested by a neighboring property owner
  - When the instrument is older than three years from execution
  - When the instrument was drafted by an out-of-state attorney
key: A
explanation: Rea 404.03 requires prompt delivery of executed instruments when the instrument relates
  to the licensee's employment, along with the other triggers the rule lists, such as instruments
  prepared under a principal broker's supervision.
citation:
  source: N.H. Code Admin. R. Rea 404.03
  url: null
  quoted_text: "Licensees shall, after execution by all parties, deliver the original or photocopy or
    electronic transmission of any instruments to any party or parties executing the same without
    delay when: (1) Such instrument has been prepared by such licensee under the supervision of the
    principal broker; (2) Such instrument relates to the employment of the licensee;"
