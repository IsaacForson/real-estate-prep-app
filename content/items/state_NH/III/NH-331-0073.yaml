stem: A licensee receives a written request from the New Hampshire Real Estate Commission to provide
  a copy of a signed purchase and sale agreement for a transaction that closed six months ago. The
  licensee locates the file in their office but tells the investigator they cannot produce it
  because it is confidential. Under RSA 331-A:26 IX, how should the licensee's action be classified?
options:
  - The licensee's action is permitted if the licensee provides a written summary of the document
    instead
  - The licensee's action is a violation only if the document is less than three years old when
    requested by the commission
  - The licensee's action is permitted because the licensee may claim confidentiality over client
    documents
  - The licensee's action is a violation because the licensee failed to produce a document in
    possession upon demand
key: D
explanation: RSA 331-A:26 IX prohibits failing, upon demand, to produce any document, book, or
  record in the licensee's possession for inspection by the commission. Claiming confidentiality
  does not excuse this duty, and providing a summary does not satisfy the requirement to produce the
  actual document. The violation applies regardless of the document's age.
