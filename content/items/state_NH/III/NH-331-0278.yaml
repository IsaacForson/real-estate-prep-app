stem: A licensee changes her mailing address on March 10. Under N.H. Code Admin. R. Rea 404.02(b)(1)
  and (b), which form must she submit and by what date must it be submitted in writing to the
  commission?
options:
  - The broker must submit the “Activation of an Inactive License” form by March 20
  - The broker must submit the “Change of Address/Phone/E-Mail” form by March 30
  - The broker must submit the “Change of Managing Broker of Firm or Branch Office” form by March 20
  - The broker must submit the “Change of Address/Phone/E-Mail” form by March 20
key: D
explanation: Subsection (b) requires changes to be reported in writing no later than 10 days after
  the change, and subsection (b)(1) specifies the “Change of Address/Phone/E-Mail” form for address,
  phone, or e‑mail changes. Adding 10 days to March 10 gives March 20 as the deadline. The
  distractor with the same form but a March 30 deadline incorrectly adds 20 days instead of 10.
