stem: Under N.H. Code Admin. R. Rea 404.02(a), what must a licensee keep the commission informed of
  at all times?
options:
  - "The licensee must keep the commission informed of: the licensee’s or firm’s current resident
    address, mailing address, email address, contact phone number(s), work location address, legal
    name, firm officers or partners, trade names, and social security number"
  - "The licensee must keep the commission informed of: the licensee’s or firm’s current resident
    address, mailing address, email address, contact phone number(s), work location address, legal
    name, and trade names only"
  - "The licensee must keep the commission informed of: the licensee’s or firm’s current resident
    address, mailing address, email address, contact phone number(s), work location address, legal
    name, and firm officers only"
  - "The licensee must keep the commission informed of: the licensee’s or firm’s current resident
    address, mailing address, email address, contact phone number(s), work location address, legal
    name, firm officers or partners, or trade names"
key: D
explanation: The rule at N.H. Code Admin. R. Rea 404.02(a) requires licensees to keep the commission
  informed of the licensee’s or firm’s current resident address, mailing address, email address,
  contact phone number(s), work location address, legal name, firm officers or partners, or trade
  names. The correct choice matches this list exactly. An choice that adds a social security number
  includes information not required by the rule. An choice that mentions only trade names leaves out
  the requirement to report firm officers or partners. An choice that mentions only firm officers
  leaves out the requirement to report trade names.
