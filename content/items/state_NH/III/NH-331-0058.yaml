stem: Under N.H. Code Admin. R. Rea 404.02(b), how many days does a licensee have to report changes
  in writing after a change occurs?
options:
  - 20 days
  - 10 days
  - 5 days
  - 15 days
key: B
explanation: The rule states that any changes must be reported in writing no later than 10 days
  after the change. Therefore, the correct timeframe is 10 days. The distractor “5 days” applies to
  principal‑broker notification when a licensee changes affiliation, not to general change
  reporting.
