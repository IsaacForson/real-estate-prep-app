stem: A licensee receives a deed in trust from a seller and the seller later demands its return.
  Under RSA 331-A:26 VII, after how many days does failure to return the deed constitute prima facie
  evidence of conversion?
options:
  - In 15 days
  - In 30 days
  - In 90 days
  - In 60 days
key: B
explanation: The statute states that failure to return entrusted evidence within 30 days after the
  owner’s demand is prima facie evidence of conversion. The distractor citing 15 days incorrectly
  shortens the statutory period.
citation:
  source: N.H. Rev. Stat. Ann. ch. 331-A § 26 VII
  url: null
  quoted_text: Failure to return any money or contract, deed, note, mortgage, abstract or other
    evidence of title within 30 days after the owner is entitled to and makes demand for such
    evidence, shall be prima facie evidence of such conversion.
