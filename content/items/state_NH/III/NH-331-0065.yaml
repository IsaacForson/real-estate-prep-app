stem: A broker earns a commission on a sale and directs the principal broker to pay the commission
  to Maple Lane LLC, a limited liability company whose two members are both licensed real estate
  salespeople. Maple Lane LLC has not filed a certificate of formation with the New Hampshire
  Secretary of State and is not registered to do business in the state. Under RSA 331-A:16-b, why is
  this payment arrangement **NOT** permitted?
options:
  - Because the LLC is not registered to do business in New Hampshire
  - Because the commission amount is above the statutory threshold
  - Because the broker failed to obtain written consent from the seller
  - Because the LLC's members are not officers of the brokerage
key: A
explanation: RSA 331-A:16-b requires that any unlicensed business entity receiving commission
  payments be registered to do business in New Hampshire. Since Maple Lane LLC is not registered,
  the payment is prohibited. The commission amount is irrelevant to this rule, and buyer consent is
  not required by this section.
