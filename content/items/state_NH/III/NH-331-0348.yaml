stem: A broker earns a commission on a residential sale and instructs the principal broker to pay
  the commission to Cedar Ridge LLC, a limited liability company whose four members are all licensed
  real estate brokers, but the broker who earned the commission is not a member of Cedar Ridge LLC.
  Under RSA 331-A:16-b, why is this payment arrangement **NOT** permitted?
options:
  - Because the LLC is not registered to do business in New Hampshire
  - Because the broker who earned the commission is not a member of the LLC
  - Because the LLC engages in prohibited acts under RSA 331-A:26
  - Because the broker failed to keep records of the payment for three years
key: B
explanation: RSA 331-A:16-b requires that at least one member of the entity be the licensee who
  earned the commission. Since the earning broker is not a member of Cedar Ridge LLC, this condition
  is violated and the payment is impermissible. The record‑keeping distractor is irrelevant; even
  with proper records the payment would still be disallowed.
