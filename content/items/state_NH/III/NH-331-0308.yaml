stem: A broker agrees to prepare a comparative market analysis for a seller only if the analysis
  concludes the property is worth at least $350,000, with the broker's fee contingent on that
  outcome. Under RSA 331-A:26 XIV, is this arrangement permitted?
options:
  - No, unless the broker also obtains the buyer's written consent
  - Yes, because the broker is providing a professional opinion of value
  - Yes, provided the broker discloses the contingency to the seller in writing
  - No, because accepting compensation contingent on a predetermined value is prohibited
key: D
explanation: RSA 331-A:26 XIV prohibits accepting compensation for a comparative market analysis
  that is contingent on reporting a predetermined value. The broker's fee being tied to a specific
  value outcome violates this rule. Disclosure or buyer consent does not cure the prohibition.
