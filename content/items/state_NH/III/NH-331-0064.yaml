stem: Under RSA 331-A:16-a, when a managing broker vacancy occurs due to death, disability, or
  change of affiliation, who may the principal broker designate as a temporary manager of the branch
  office?
options:
  - A person currently licensed with the New Hampshire real estate commission
  - A licensed attorney not holding a real estate license
  - A licensed appraiser not holding a real estate license
  - A licensed mortgage loan originator not holding a real estate license
key: A
explanation: The statute explicitly states that the principal broker may designate as manager a
  person currently licensed with the New Hampshire real estate commission. The other options
  describe professionals who may hold other licenses but are not authorized under this provision
  unless they also hold an active real estate license.
citation:
