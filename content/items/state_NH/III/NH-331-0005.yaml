stem: A principal broker plans to open a new branch office next month. Under RSA 331-A:16, I, what
  must the principal broker do before the branch office opens?
options:
  - Hire at least three salespersons for the new location
  - Publish a notice of the opening in a local newspaper
  - Obtain written approval from every competing broker
  - File a branch office application with the office
key: D
explanation: RSA 331-A:16, I requires the principal broker to submit a branch office application
  form to the office prior to the opening of any branch office.
citation:
  source: N.H. Rev. Stat. Ann. § 331-A:16
  url: null
  quoted_text: Every real estate office or real estate branch office, whether operated as a
    corporation, partnership, or sole proprietorship, shall be directed, supervised, and managed by
    a licensed real estate broker. The principal broker shall submit to the office a branch office
    application form prior to the opening of any branch office.
