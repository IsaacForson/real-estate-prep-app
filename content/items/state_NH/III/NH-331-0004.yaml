stem: A salesperson places a newspaper advertisement for a seller's listing that shows only the
  salesperson's cell number, with no other identifying information. Under N.H. Code Admin. R. Rea
  404.05, what is missing from this advertisement?
options:
  - The seller's full mailing address and email
  - The expiration date listed on the seller's agreement
  - The name of the brokerage firm or principal broker
  - The square footage of the listed property
key: C
explanation: Rea 404.05(b) requires a salesperson advertising property for another to prominently
  include the name of the real estate brokerage firm or the licensee's principal broker in the
  advertisement.
citation:
  source: N.H. Code Admin. R. Rea 404.05
  url: null
  quoted_text: A salesperson or broker shall not advertise the sale, purchase, exchange or lease of
    real property for another or others without prominently including in the advertisement the name
    of the real estate brokerage firm with which he or she is associated, or the name of that
    licensee’s principal broker, pursuant to RSA 331-A:16, IV.
