stem: A brokerage firm appoints a new managing broker. Under N.H. Code Admin. R. Rea 404.02(b)(3),
  what documents must be submitted with the Change of Managing Broker form?
options:
  - The original firm wall license, along with any required explanation, to accompany the form
  - The original wall license and pocket card of the old managing broker, along with any required
    explanation, to accompany the form
  - The original firm wall license and the original wall license and pocket card of both the old and
    new managing broker to accompany the form
  - Proof of a $25,000 surety bond, along with any required explanation, to accompany the form
key: C
explanation: The rule specifies that the Change of Managing Broker form must be accompanied by the
  original firm wall license and the original wall license and pocket card of both the old and new
  managing broker. The other options either omit required documents or pertain to unrelated
  amendment types.
