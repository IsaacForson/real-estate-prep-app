stem: A seller is offering a condominium unit for sale. What must the seller provide to the buyer
  prior to or during preparation of an offer under RSA 477:4-f?
options:
  - The statement of the monthly fees paid by the seller
  - The copy of the condo association's insurance policy
  - The copy of the condo declaration, bylaws, and rules and regulations
  - The written notice of the buyer's right to obtain association info
key: D
explanation: RSA 477:4-f requires the seller to give written notice that the buyer has the right to
  obtain association documents such as the declaration, bylaws, and fee statements. Simply providing
  the declaration and bylaws, a fee statement, or an insurance policy does not meet this notice
  requirement.
