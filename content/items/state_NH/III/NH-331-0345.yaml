stem: A licensee whose license has been inactive for two years wishes to reactivate. Under N.H. Code
  Admin. R. Rea 404.02(b)(2), what must accompany the Activation of an Inactive License form?
options:
  - An attestation from the principal broker confirming good moral character and trustworthiness to
    accompany the form
  - The original wall license and pocket card of the applicant, along with any required explanation,
    to accompany the form
  - Proof of a $25,000 surety bond, along with any required explanation, to accompany the form
  - Legal proof of a name change, along with any required explanation, to accompany the form
key: A
explanation: The rule requires that the Activation of an Inactive License form include an
  attestation from the licensee’s principal broker that the applicant is of good moral character and
  is trustworthy. The other items pertain to different amendment forms, such as changes of managing
  broker or name change.
