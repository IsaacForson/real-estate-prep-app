stem: The managing broker of a branch office suddenly passes away. Under RSA 331-A:16-a, for how
  long may the principal broker designate a currently licensed person as manager before a permanent
  appointment is required?
options:
  - Not to exceed one renewal cycle of the branch license
  - Not to exceed five years from the date of the vacancy
  - Not to exceed one year from the date of the vacancy
  - Not to exceed thirty days from the date of the vacancy
key: C
explanation: RSA 331-A:16-a allows the principal broker to designate a currently licensed person as
  manager for a period not to exceed one year from the date of the vacancy.
citation:
  source: N.H. Rev. Stat. Ann. § 331-A:16-a
  url: null
  quoted_text: In the event of the death, disability or change of affiliation of the managing broker
    of a real estate branch office, the principal broker may designate as a manager a person
    currently licensed with the New Hampshire real estate commission for a period not to exceed one
    year from the date of such vacancy.
