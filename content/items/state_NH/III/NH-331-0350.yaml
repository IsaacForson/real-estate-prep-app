stem: Under RSA 331-A:26 IV, which of the following describes prohibited conduct?
options:
  - The act of making, printing, publishing, distributing, or causing false statements that could
    induce a person to act
  - The act of obtaining a license through fraudulent misrepresentation of one's qualifications or
    experience
  - The act of being convicted of a felony involving embezzlement or fraudulent conversion of client
    funds
  - The act of failing to deposit client trust funds into a designated segregated trust account as
    required by law
key: A
explanation: RSA 331-A:26 IV prohibits a licensee from making, printing, publishing, distributing,
  or causing false statements that could induce a person to act when the licensee knew or should
  have known the statements were false. This option describes that prohibited conduct. Obtaining a
  license by fraud or misrepresentation is prohibited under subsection I, not IV, so that option is
  incorrect. Being convicted of a felony involving embezzlement and failing to place trust funds in
  a proper trust account are also prohibited under other subsections, not IV.
