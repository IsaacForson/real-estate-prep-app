stem: A principal broker regularly receives earnest money deposits from buyers in the course of real
  estate transactions. Under N.H. Code Admin. R. Rea 702.01, where must the principal broker keep
  these funds?
options:
  - In a bonded safe located inside the branch office
  - In a separate escrow or trust account
  - In a personal savings account that earns interest
  - In the brokerage firm's general operating account
key: B
explanation: Rea 702.01(a) requires a principal broker who receives client monies to maintain a
  separate escrow or real estate trust account, distinct from the broker's own account, for those
  funds.
citation:
  source: N.H. Code Admin. R. Rea 702.01
  url: null
  quoted_text: Every resident and non-resident principal broker who in the course of her or his real
    estate business in the State of New Hampshire receives, accepts, and holds any monies on behalf
    of any principal, client, or other person shall at all times maintain a separate escrow or real
    estate trust account, distinct from her or his own account, in a financial institution of her or
    his choice located in this state, for the deposit of all such monies so received by the
    licensee, pursuant to RSA 331-A:13.
