stem: Under RSA 331-A:16, IV(c), what condition allows limited electronic media to satisfy
  advertising requirements?
options:
  - The advertisement must include only the licensee's personal phone number.
  - The advertisement must include a link showing required broker info.
  - The advertisement must include the licensee's email address only.
  - The advertisement must include the broker's legal name directly in the media.
key: B
explanation: Under RSA 331‑A:16, IV(c), limited electronic media meets the advertising requirement
  when it provides a link to an Internet display that contains the required broker information.
  Providing only a phone number or only an email address does not satisfy the rule, and the broker's
  legal name need not appear directly in the limited electronic media if a compliant link is
  present.
