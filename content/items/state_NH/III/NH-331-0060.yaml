stem: A licensee changes affiliation from Principal Broker X to Principal Broker Y on April 5. Under
  N.H. Code Admin. R. Rea 404.02(c), by what date must Principal Broker X notify the commission in
  writing of the change?
options:
  - April 9
  - April 12
  - April 15
  - April 10
key: D
explanation: The rule mandates that the principal broker notify the commission no later than 5 days
  after a licensee changes affiliation. Five days after April 5 is April 10, making that the correct
  deadline. The distractor “April 9” reflects only a 4‑day interval, which does not satisfy the
  5‑day requirement.
