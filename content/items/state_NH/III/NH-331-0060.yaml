    gencourt.state.nh.us returns 403) — re-fetch live when reachable — § 404.02(c)
  url: null
  quoted_text: Whenever a licensee changes his or her affiliation from one principal broker to
    another, or ceases to represent a principal broker, the principal broker shall notify the
    commission, in writing, no later than 5 days after the change along with the appropriate form
    described in (b) above.
