stem: A licensee lists a private-well-served home and asks the seller for the date of the most
  recent water test. The seller says that information is not available. Under N.H. Code Admin. R.
  Rea 701.03, what must the licensee do with that fact?
options:
  - Convey the unavailability to the buyer in writing
  - Estimate a testing date and disclose the estimate
  - Withdraw the listing until the test is completed
  - Omit any mention of the water supply from the offer
key: A
explanation: Rea 701.03(b) states that when private water supply information is not available, that
  fact must also be conveyed to the buyer in writing, just like the information itself.
