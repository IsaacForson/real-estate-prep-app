stem: A seller signs a purchase and sale contract and only afterward hands the buyer a written
  disclosure describing the private water supply and sewage disposal system. Under RSA 477:4-c, why
  does this sequence fail to satisfy the statute?
options:
  - The disclosure was due before the contract was executed
  - The disclosure was missing the buyer's acknowledgment signature
  - The disclosure was not notarized by a licensed attorney
  - The disclosure omitted the food service seating capacity
key: A
explanation: RSA 477:4-c requires the seller to disclose the water supply and sewage disposal
  information to the buyer prior to the execution of the purchase and sale contract, not afterward.
