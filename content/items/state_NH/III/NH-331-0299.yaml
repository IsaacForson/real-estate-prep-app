stem: A principal broker receives an earnest money deposit and places it in a trust account. Under
  RSA 331-A:26 XVIII, for how long must the broker retain records showing the date deposited, date
  of withdrawal, and to whom paid?
options:
  - The records must be kept for 3 years
  - The records must be kept for 1 year
  - The records must be kept for 5 years
  - The records must be kept for 10 years
key: A
explanation: The law requires a three‑year retention period for escrow and trust account records.
  The distractor suggesting a one‑year period fails to meet the statutory minimum.
