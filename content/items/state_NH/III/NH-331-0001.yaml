stem: Under N.H. Code Admin. R. Rea 404.01, what must be true before a broker displays a business
  sign identifying the real estate office?
options:
  - The sign must display the commission's license number
  - The sign must be pre-approved by the real estate commission
  - The sign must list the names of all associated licensees
  - The sign must be permitted by local zoning ordinances
key: D
explanation: Rea 404.01 conditions the display of an office identification sign on the sign being
  permitted by local zoning ordinances; it imposes no commission pre-approval or content-listing
  requirement.
citation:
  source: N.H. Code Admin. R. Rea 404.01
  url: null
  quoted_text: A broker’s business sign to identify her or his business office shall be displayed
    outside her or his real estate office, providing that such a sign is permitted by local zoning
    ordinances.
