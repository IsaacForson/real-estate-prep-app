stem: A broker earns a commission and wants to route the payment to Riverbend Holdings, LLC, an
  entity whose members include several unlicensed investors alongside the broker. Under RSA
  331-A:16-b, why is this payment arrangement **NOT** permitted?
options:
  - The LLC has not registered to do business in New Hampshire as required
  - The broker failed to notify the commission of the LLC's formation in writing
  - The commission earned exceeds the surety bond amount currently on file
  - Not every member of the LLC holds a valid, active real estate license
key: D
explanation: RSA 331-A:16-b allows a broker to route compensation to an entity only if all of its
  partners, members, officers, or shareholders hold a valid and active license, which is not the
  case when unlicensed investors are members.
citation:
  source: N.H. Rev. Stat. Ann. § 331-A:16-b
  url: null
  quoted_text: All of the partners, members, officers, or shareholders of any unlicensed business
    entity, including a partnership, association, limited liability company, limited liability
    partnership, or corporation, hold a valid and active license issued under this chapter.
