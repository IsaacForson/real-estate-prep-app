stem: A listing contract lacks a clause allowing extension. Under Rea 404.04(e), how can the parties
  extend the listing period?
options:
  - Mutual written agreement of all parties
  - Verbal agreement between parties
  - Automatic renewal after ninety days
  - Notice filed with the commission
key: A
explanation: Rea 404.04(e) states that any provisions to extend the contract for a specific period
  of time shall be agreed upon in writing by all parties to the contract. Therefore, extension
  requires a written agreement signed by all parties; verbal agreements, automatic renewal clauses,
  or commission notices are insufficient.
