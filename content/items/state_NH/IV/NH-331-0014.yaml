stem: A buyer tells her agent the maximum price she is willing to pay and asks the agent not to
  reveal that figure to the seller. Under RSA 331-A:25-a, I, which duty obligates the agent to honor
  this request?
options:
  - The duty to record the maximum price in the purchase contract
  - The duty to seek the lowest possible purchase price available
  - The duty of confidentiality owed under the brokerage agreement
  - The duty to disclose each offer to the seller's agent immediately
key: C
explanation: RSA 331-A:25-a, I binds a licensee providing brokerage services to duties including
  confidentiality, which covers protecting the client's maximum price from disclosure to the other
  side.
citation:
  source: N.H. Rev. Stat. Ann. § 331-A:25-a
  url: null
  quoted_text: A licensee who provides services through a brokerage agreement for a seller, landlord,
    buyer, or tenant is bound by the duties of loyalty, obedience, disclosure, confidentiality,
    reasonable care, diligence, and accounting.
