stem: Under RSA 331-A:25-a, I, a licensee who provides services through a brokerage agreement for a
  seller, landlord, buyer, or tenant is bound by which set of duties?
options:
  - "The licensee's duties include: loyalty, obedience, disclosure, confidentiality, reasonable
    care, diligence, and accounting."
  - "The licensee's duties include: loyalty, obedience, disclosure, confidentiality, reasonable
    care, and other responsibilities."
  - "The licensee's duties include: loyalty, obedience, disclosure, confidentiality, and other
    responsibilities."
  - "The licensee's duties include: loyalty, obedience, and other responsibilities as required by
    law."
key: A
explanation: Under RSA 331-A:25-a I, a licensee who provides services through a brokerage agreement
  for a seller, landlord, buyer, or tenant is bound by the duties of loyalty, obedience, disclosure,
  confidentiality, reasonable care, diligence, and accounting. The correct answer lists all seven
  duties. The distractor omitting diligence and accounting is incomplete because the statute
  requires those duties as well.
