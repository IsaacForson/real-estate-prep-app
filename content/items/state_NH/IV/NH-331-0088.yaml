stem: A licensee wants to show a property that is listed with another brokerage. According to N.H.
  Code Admin. R. Rea 701.01(b), what must the licensee do before showing the property?
options:
  - The licensee must obtain written consent from the seller before attempting to show the property
    to any prospective buyer
  - The licensee must provide a written brokerage relationship disclosure to the buyer prior to
    scheduling any showing
  - The licensee must submit the offer in writing to the listing broker after receiving verbal
    acceptance from the buyer
  - The licensee must disclose their brokerage relationship verbally or in writing to the other
    party’s agent
key: D
explanation: Rea 701.01(b) requires the licensee to disclose their brokerage relationship verbally
  or in writing to the other party’s agent prior to showing a property listed with another agency.
  Providing a written disclosure to the buyer is not required by this provision; the rule focuses on
  disclosure to the competing agent.
