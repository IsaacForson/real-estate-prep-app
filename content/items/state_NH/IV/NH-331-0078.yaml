stem: Under Rea 404.04(f), what is prohibited in New Hampshire real estate brokerage?
options:
  - Multiple listing agreements
  - Exclusive agency agreements
  - Open listing agreements
  - Net listing agreements
key: D
explanation: Rea 404.04(f) explicitly states that net listings shall be prohibited and defines a net
  listing as a listing where the commission is the difference between the selling price and a
  minimum price acceptable to the seller. Therefore, net listing agreements are prohibited.
  Exclusive agency agreements are permitted as long as they comply with other requirements.
