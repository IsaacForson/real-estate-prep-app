stem: An out-of-state broker wishes to earn a commission on a commercial real estate transaction in
  New Hampshire. Under RSA 331-A:22-a I(a), what must the out-of-state broker do?
options:
  - The out-of-state broker must work in cooperation with a licensed New Hampshire broker.
  - The out-of-state broker must pay a fee to the New Hampshire Real Estate Commission for each
    transaction.
  - The out-of-state broker must obtain a New Hampshire broker license before engaging in any
    activity.
  - The out-of-state broker may act independently as long as they disclose their out-of-state
    license.
key: A
explanation: Under RSA 331-A:22-a I(a), an out-of-state broker must work in cooperation with a
  licensed New Hampshire broker to perform acts requiring a license in this state. The correct
  answer reflects that cooperation requirement. The distractor claiming the broker must obtain a New
  Hampshire license is incorrect because the statute allows cooperation instead of licensure.
