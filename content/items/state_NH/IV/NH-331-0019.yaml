stem: A buyer signs a contract to purchase a specific property, and the brokerage agreement is
  silent on continued property searches. Under RSA 331-A:25-c, I(b)(1), is the buyer's agent still
  obligated to keep seeking other properties for that buyer?
options:
  - Yes, because agents are expected to keep searching for other properties
  - No, because buyer agents do not have a duty to seek properties
  - Yes, because the brokerage agreement requires continuous searching
  - No, because the buyer is now a party to a contract to purchase
key: D
explanation: RSA 331-A:25-c, I(b)(1) excuses a buyer's agent from continuing to seek other real
  estate once the buyer is party to a contract to purchase, unless the brokerage agreement provides
  otherwise.
citation:
  source: N.H. Rev. Stat. Ann. § 331-A:25-c
  url: null
  quoted_text: Seeking real estate at a price and terms specified by the buyer or tenant except that
    the licensee is not obligated to seek other real estate for the buyer or tenant while the buyer
    or tenant is a party to a contract to purchase, exchange, rent, or lease that real estate unless
    the brokerage agreement so provides.
