stem: A salesperson accepts an earnest money check from a buyer while working on behalf of her
  managing broker. Under N.H. Code Admin. R. Rea 702.02, what must the salesperson do with the
  check?
options:
  - Hold it until the purchase and sale contract is signed
  - Return it to the buyer pending mortgage approval
  - Deliver it immediately to her managing broker
  - Deposit it directly into her own personal checking account
key: C
explanation: Rea 702.02 requires that all monies a salesperson receives in connection with a real
  estate transaction be immediately delivered to her managing or principal broker.
citation:
  source: N.H. Code Admin. R. Rea 702.02
  url: null
  quoted_text: All monies received by a salesperson or an associate broker in connection with a real
    estate transaction in which she or he is engaged on behalf of her or his managing or principal
    broker, shall be immediately delivered to her or his managing or principal broker.
