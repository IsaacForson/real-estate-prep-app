stem: A seller's home is already subject to a signed purchase and sale contract when a second buyer
  submits a new offer. Under RSA 331-A:25-b, I(b)(2), what must the seller's agent do with the new
  offer?
options:
  - Reject it automatically without seller review
  - Forward it directly to the buyer under contract
  - Hold it until the first contract closes or fails
  - Present it to the seller in a timely manner
key: D
explanation: RSA 331-A:25-b, I(b)(2) requires a seller's agent to present all offers and agreements
  to the seller in a timely manner, even when the real estate is already subject to a contract of
  sale.
