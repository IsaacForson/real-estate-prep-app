stem: A broker begins marketing a landlord's rental unit and collecting rent based only on a verbal
  understanding, with no signed paperwork. Under N.H. Code Admin. R. Rea 404.04(a), what is this
  broker missing?
options:
  - A written contract signed by every party
  - A certificate of occupancy for the unit
  - A published rent schedule for the building
  - A recorded copy of the property deed
key: A
explanation: Rea 404.04(a) prohibits a broker or salesperson from acting for a seller or lessor to
  negotiate a lease or collect rent without a written contract signed by all parties.
citation:
  source: N.H. Code Admin. R. Rea 404.04
  url: null
  quoted_text: No broker or salesperson shall act on behalf of a seller or lessor with regard to
    negotiating the sale, purchase, exchange or lease of any real estate or of the improvements
    thereon, collect rents, or attempt to collect rents without a written contract signed by all
    parties.
