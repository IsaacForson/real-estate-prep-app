stem: A buyer's agent has a written brokerage agreement with Buyer A to find a home. While still
  under that agreement, the agent shows the same property to Buyer B, a prospective buyer, without
  disclosing Buyer A's maximum offer price. Under RSA 331-A:25-c, which statement is correct?
options:
  - The agent must terminate the brokerage agreement with Buyer A before showing the property to
    Buyer B.
  - The agent is permitted to show the property to Buyer B as long as no confidential information is
    disclosed.
  - The agent must obtain written consent from Buyer A before showing the property to Buyer B.
  - The agent breached the fiduciary duty of confidentiality by showing the property to Buyer B.
key: B
explanation: RSA 331-A:25-c I(d) permits a licensee to introduce the same real estate to other
  prospective buyers or tenants without breaching any fiduciary duty to the buyer or tenant. The
  fiduciary duty of confidentiality under I(c) is not breached merely by showing the property; it is
  breached only if confidential information is disclosed. Therefore, showing the property to Buyer B
  while keeping Buyer A's maximum price confidential is allowed. The distractor that claims a breach
  of confidentiality by showing the property is incorrect because the act of showing does not
  disclose confidential information.
