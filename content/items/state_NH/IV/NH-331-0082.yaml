stem: If a consumer refuses to sign the brokerage relationship disclosure form, how long must the
  licensee retain a copy of the form noting the refusal?
options:
  - Four years
  - Two years
  - Three years
  - Seven years
key: C
explanation: Under Rea 701.01(f), if a consumer will not sign the disclosure form, the licensee must
  note that fact on a copy and retain that copy for three years. The two‑year option is incorrect
  because the rule specifies a three‑year retention period, not two.
