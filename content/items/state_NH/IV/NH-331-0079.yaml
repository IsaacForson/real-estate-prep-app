stem: A licensee wishes to represent both the buyer and seller in the same transaction as a
  disclosed dual agent. According to Rea 404.04(l), what must the licensee obtain before proceeding?
options:
  - Written informed consent of all parties
  - Verbal agreement from the buyer only
  - Approval from the real estate commission
  - A signed purchase and sale agreement
key: A
explanation: Rea 404.04(l) provides that a licensee may act as a disclosed dual agent only with the
  written informed consent of all parties. Verbal agreement or commission approval does not satisfy
  this requirement, and a purchase and sale agreement is unrelated to the consent needed for dual
  agency.
