stem: A seller signs a listing agreement that contains an explanation of designated agency but never
  signs any separate designated-agency consent form. Under RSA 331-A:25-e, II, has the seller
  consented to designated agency?
options:
  - Yes, signing that agreement conclusively presumes consent
  - No, a separate signed consent form is still required
  - No, consent to designated agency cannot be presumed
  - Yes, but consent applies once the designated agent is appointed
key: A
explanation: RSA 331-A:25-e, II creates a conclusive presumption of consent to designated agency
  when a party signs a brokerage agreement containing an explanation of designated agency, so no
  further separate form is needed.
citation:
  source: N.H. Rev. Stat. Ann. § 331-A:25-e
  url: null
  quoted_text: There shall be a conclusive presumption that a seller or landlord or a buyer or tenant
    has consented to a designated agency relationship, if the party signed a brokerage agreement
    containing an explanation of designated agency.
