stem: Under RSA 331-A:16(XXXVIII), what action is prohibited regarding a property owner's name in an
  electronic database or multiple listing service?
options:
  - The act of submitting the owner's name without the owner's express written permission
  - The act of sharing the owner's name with the listing broker
  - The act of including the owner's name in a purchase agreement
  - The act of using the owner's name in promotional advertising
key: A
explanation: The rule explicitly prohibits submitting a property owner's name to any electronic
  database or multiple listing service that may be accessed by others without the owner's express
  written permission. The most tempting distractor, sharing the owner's name with the listing
  broker, is incorrect because the prohibition concerns database submission, not sharing with a
  broker.
