stem: A principal broker terminates the employment of a licensed salesperson on June 1 but does not
  notify the New Hampshire Real Estate Commission until June 10. According to Rea 301.01(b), what is
  true regarding the broker's compliance with the notification requirement?
options:
  - The broker must pay a $60 late fee for the delayed notification
  - The broker violated the requirement to notify within 5 days
  - The salesperson’s license is automatically suspended
  - The broker complied with the notification requirement
key: B
explanation: The rule requires the principal broker to notify the commission within 5 days when a
  salesperson leaves employ. Notifying on June 10, nine days after termination, violates this
  requirement. The rule does not specify a $60 late fee or automatic suspension for this violation.
