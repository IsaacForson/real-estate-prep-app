stem: A licensee placed their New Hampshire salesperson license on inactive status on January 1,
  2024. While inactive, they receive a referral fee from their former broker for a referral they
  made while the license was active in 2023. Is the licensee permitted to receive this compensation?
options:
  - The licensee may receive the referral fee because inactive status permits compensation for
    referrals made while the license was active.
  - The licensee may not receive the referral fee because inactive status prohibits any compensation
    related to real estate activities.
  - The licensee may receive the referral fee only if the payment comes directly from the client
    rather than the broker.
  - The licensee may not receive the referral fee unless the license is first reinstated to active
    status.
key: A
explanation: Under RSA 331-A:12‑b(I), a licensee on inactive status may be compensated by a previous
  responsible broker for brokerage activities or referrals for which the licensee participated while
  the license was active. Therefore the referral fee is permissible. The distractor claiming
  inactive status prohibits any compensation is incorrect because the statute explicitly allows
  compensation for prior activity.
