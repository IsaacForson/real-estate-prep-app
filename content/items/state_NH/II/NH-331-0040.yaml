stem: A licensee placed on inactive status under RSA 331-A:12-b wishes to renew the license for the
  next biennium. Which of the following is required for renewal?
options:
  - The physical place of business maintained in New Hampshire
  - The surety bond required for active principal brokers in New Hampshire
  - The proof of at least six completed real estate transactions
  - The continuing education requirements adopted by the commission
key: D
explanation: While on inactive status, the licensee must renew biennially by satisfying continuing
  education requirements; maintaining a surety bond or a place of business is not required for
  inactive license renewal.
citation:
  source: N.H. Rev. Stat. Ann. ch. 331-A § 331-A:12-b I
  url: null
  quoted_text: While on inactive status, the licensee shall renew the license biennially by satisfying
    any renewal requirements and continuing education requirements adopted by the commission, but
    shall not be required to maintain a place of business, or in the case of a licensed principal or
    managing broker, to maintain a surety bond pursuant to RSA 331-A:14.
