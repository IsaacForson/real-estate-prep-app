stem: Under RSA 331-A:27, what is the consequence for a license obtained through the mistake or
  inadvertence of the executive director?
options:
  - It may be revoked.
  - It is void automatically.
  - It must be surrendered.
  - It requires an administrative fine.
key: A
explanation: RSA 331-A:27 states that any license obtained through the mistake or inadvertence of
  the executive director shall be subject to revocation. Therefore, the license may be revoked. The
  distractor claiming automatic voidness is incorrect because the statute provides for revocation,
  not automatic voiding.
