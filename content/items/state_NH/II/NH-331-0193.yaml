stem: A licensee submits a written request for a continuance of a disciplinary hearing 8 days before
  the scheduled hearing date. According to Rea 205.02, what must accompany the request for it to be
  considered?
options:
  - An reproduction of the original hearing notice.
  - An affidavit showing good cause for late filing.
  - An explanation of why the request is late.
  - An indication that no extra paperwork is needed.
key: B
explanation: Requests made less than 10 days before the hearing must be accompanied by an affidavit
  demonstrating good cause for the late filing. A mere explanation does not meet this requirement.
