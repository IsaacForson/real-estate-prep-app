stem: A licensee receives a completed Complaint Form Response from the commission regarding a filed
  complaint. According to Rea 204.04(b), by when must the licensee file the response with the
  commission to remain compliant?
options:
  - Within 30 days of the complaint being submitted to the commission
  - Within 30 days of receipt of the Complaint Form Response
  - Within 30 days of the commission’s notice of the complaint
  - Within 15 days of receipt of the Complaint Form Response
key: B
explanation: Under Rea 204.04(b), the licensee must file the response within 30 days of receiving
  the Complaint Form Response. Stating that the deadline is based on when the complaint was
  submitted to the commission is incorrect.
