stem: A principal broker of a New Hampshire real estate firm dies. The broker's legal representative
  applies for a temporary license. According to RSA 331-A:21, what is the maximum duration the
  temporary license may authorize the holder to continue transacting real estate business?
options:
  - A period of six months.
  - A period of one year.
  - A period of two years.
  - A period until the estate is settled.
key: B
explanation: The statute authorizes a temporary licensee to continue transacting real estate
  business for a period not to exceed one year from the date of death or incapacitation. Therefore,
  the maximum duration is one year. The distractor suggesting two years exceeds the statutory limit
  and is not supported by the text.
