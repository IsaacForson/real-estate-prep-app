stem: A candidate submits a completed exam registration form and fee to the New Hampshire Real
  Estate Commission on April 10. Assuming the candidate files a written request for a waiver due to
  good cause on the last business day before the three‑month period expires and the commission
  grants the maximum allowable extension, what is the latest date the candidate may take the
  licensing examination?
options:
  - July 10
  - July 31
  - August 9
  - August 31
key: C
explanation: Rea 301.03(e) requires the exam to be taken within 3 months of registration; Rea
  301.03(g) allows up to an additional 30 calendar days for good cause. Three months after April 10
  is July 10, and adding the maximum 30‑day extension gives August 9.
