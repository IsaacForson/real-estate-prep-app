stem: What is the late fee for renewing a license up to six months after expiration under New
  Hampshire Administrative Rule Rea 301.02(h)?
options:
  - $60
  - $110
  - $25
  - $200
key: A
explanation: Rea 301.02(h) states that the broker, salesperson, firm, or firm branch shall pay a
  late fee of $60, in addition to the regular renewal fee, for renewal of a license up to 6 months
  after license expiration. The $25 figure applies to dishonored checks under Rea 301.02(g).
