stem: Under Rea 301.03(g), what is the maximum additional time a candidate may be granted to take
  the licensing examination due to good cause?
options:
  - The candidate may be granted up to 30 calendar days.
  - The candidate may be granted up to 15 calendar days.
  - The candidate may be granted up to 60 calendar days.
  - The candidate may be granted no additional time.
key: A
explanation: Under Rea 301.03(g), a candidate who cannot take the exam within the three‑month window
  due to good cause may request an extension of up to 30 additional calendar days. Therefore, the
  statement that the candidate may be granted up to 30 calendar days is correct. The claim that the
  extension is limited to 15 days is not supported by the rule. The claim that the extension may be
  as long as 60 days exceeds what the rule allows. The assertion that no additional time may be
  granted contradicts the rule, which expressly permits an extension for good cause.
