  source: N.H. Rev. Stat. Ann. ch. 331-A § 331-A:26(XVIII)
  url: null
  quoted_text: Failing to keep for a period of 3 years, records of escrow and trust accounts
    pertaining to funds entrusted with the principal broker relating to a real estate transaction
    showing date deposited, date of withdrawal, to whom paid, and such other pertinent information
