stem: According to RSA 331-A:26(XVIII), for how long must a licensee retain records of escrow and
  trust accounts pertaining to funds entrusted with the principal broker relating to a real estate
  transaction?
options:
  - 12 months
  - 24 months
  - 36 months
  - 60 months
key: C
explanation: The statute requires a three‑year retention period for escrow and trust account
  records; the 24‑month option reflects a common mistaken belief that the period is only two years.
