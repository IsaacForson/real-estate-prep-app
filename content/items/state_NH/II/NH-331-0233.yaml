stem: What is a 'designated agent'?
options:
  - A licensee who acts for more than one party in a transaction with the written consent of all
    parties
  - A licensee who has been appointed by an appointing agent to represent one party and owes
    fiduciary duties
  - A licensee who assists one or more parties during a transaction without being an agent for any
    party
  - A licensee who manages a branch office of a real estate brokerage firm and supervises associate
    brokers and salespersons
key: B
explanation: RSA 331-A:2 IV-b defines a designated agent as a licensee who has been appointed by an
  appointing agent to represent one party and owes fiduciary duties. A licensee who acts for more
  than one party in a transaction with the written consent of all parties describes a disclosed dual
  agent, which is defined elsewhere in RSA 331-A:2 IV-c.
