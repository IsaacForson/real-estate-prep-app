stem: What is the minimum amount of the surety bond required for a principal or managing broker's
  license in New Hampshire?
options:
  - $20,000
  - $30,000
  - $25,000
  - $35,000
key: C
explanation: RSA 331-A:14 requires a surety bond of not less than $25,000 for principal or managing
  broker licenses. The bond must be approved by the commission and executed by an authorized surety
  company. Amounts below $25,000 do not satisfy the statutory minimum.
citation:
