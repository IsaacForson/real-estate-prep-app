stem: Under Rea 301.04(b), who must remit the required original or renewal fee plus the fee for a
  dishonored check within 14 days after receiving notice from the commission?
options:
  - Any candidate who failed to achieve the minimum passing score of seventy percent on either the
    state or national portion of the licensing examination
  - Any applicant or licensee who paid a fee or fine to the commission with a check, draft, or money
    order that has subsequently been dishonored
  - Any salesperson who completed less than the required pre‑licensing education hours before
    applying for the exam
  - Any broker who changed their firm's mailing address without notifying the commission within the
    required timeframe
key: B
explanation: Rea 301.04(b) states that any applicant or licensee who has paid a fee or fine with a
  dishonored check must remit the required fee plus the dishonored‑check fee within 14 days after
  receiving notice. The other options describe situations not covered by this rule.
