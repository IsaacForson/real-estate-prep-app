stem: According to New Hampshire Administrative Rule Rea 101.01(k), what is the definition of
  'valuable consideration'?
options:
  - Anything of value exceeding one hundred dollars
  - Any commission, fee or other consideration
  - A person represented by a real estate licensee
  - A person without representation by a licensee
key: A
explanation: "Under N.H. Code Admin. R. Rea 101.01(k), 'valuable consideration' means anything of
  value exceeding $100. Therefore, the option stating 'Anything of value exceeding one hundred
  dollars' matches this definition. The other options describe different concepts: a commission or
  fee, a represented person, or an unrepresented person, which are not the definition of valuable
  consideration."
