  source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules) — N.H. Code of Administrative
    Rules, Rea 100–700 (Real Estate Commission), official General Court rules page read via Internet
    Archive capture of 2022-06-30 (the current rea100-1000.html has no archive capture and
    gencourt.state.nh.us returns 403) — re-fetch live when reachable Rea 404.02(c)
  url: null
  quoted_text: Whenever a licensee changes his or her affiliation from one principal broker to
    another, or ceases to represent a principal broker, the principal broker shall notify the
    commission, in writing, no later than 5 days after the change along with the appropriate form
    described in (b) above.
