stem: A salesperson leaves Broker A to join Broker B. According to Rea 404.02(c), within how many
  days must Broker A notify the New Hampshire Real Estate Commission of the affiliation change?
options:
  - Broker A must notify the commission within 3 days
  - Broker A must notify the commission within 5 days
  - Broker A must notify the commission within 7 days
  - Broker A must notify the commission within 10 days
key: B
explanation: Rea 404.02(c) requires the principal broker to notify the commission in writing no
  later than five days after a licensee changes affiliation from one principal broker to another.
  The five‑day period is distinct from the ten‑day reporting deadline for address or contact changes
  under Rea 404.02(b).
