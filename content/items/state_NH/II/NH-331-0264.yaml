stem: An applicant for a broker license resides in Massachusetts. According to New Hampshire
  Administrative Rule Rea 301.01, what additional document must the applicant submit with their
  application?
options:
  - A completed Criminal History Record Information Release Authorization Form
  - A statement from the employing broker listing hours per week
  - A set of signed affidavits from three character references
  - A signed irrevocable consent and power of attorney statement
key: D
explanation: Non-resident applicants must submit a signed irrevocable consent and power of attorney
  statement under Rea 301.01(a)(1)(d). The distractor about the criminal history release form is
  required of all applicants, not just non-residents.
