stem: Under Rea 301.03(e), what is the maximum time allowed between receipt of a candidate's exam
  registration and taking the examination?
options:
  - within 1 month of receipt
  - within 4 months of receipt
  - within 2 months of receipt
  - within 3 months of receipt
key: D
explanation: Rea 301.03(e) states that all candidates shall take the examination within 3 months
  from the date of receipt of the exam registration at the commission office. Therefore, the maximum
  allowable period is three months. A two‑month limit is too restrictive and does not reflect the
  rule.
