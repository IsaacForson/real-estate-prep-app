stem: A licensee receives a personal check as earnest money from a buyer and deposits it into the
  escrow account without first providing the seller with written notice that the earnest money will
  be in the form of a personal check. According to RSA 331-A:26, is this permissible?
options:
  - Yes, because the check was deposited promptly into the escrow account.
  - No, because the licensee failed to provide prior written notice to the seller.
  - Yes, as long as the earnest money receipt acknowledges the check.
  - No, because personal checks are not allowed as earnest money if the seller is notified in
    writing.
key: B
explanation: The rule permits non‑cash earnest money only if the fact is communicated in writing to
  the owner before the owner accepts the offer and is shown on the receipt and acknowledged in
  writing by the owner. Lacking prior written notice makes the acceptance impermissible. The
  distractor that claims permissibility based solely on the receipt overlooks the notice
  requirement.
citation:
