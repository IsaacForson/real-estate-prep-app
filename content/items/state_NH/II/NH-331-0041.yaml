stem: What does the term 'licensee' mean?
options:
  - A person who is a broker or salesperson licensed by the New Hampshire real estate commission
    under the provisions of this chapter.
  - A person who employs brokers to conduct real estate transactions and oversees office personnel,
    ensuring compliance with state advertising rules.
  - A person who holds a real estate license in any state and may practice under reciprocity
    agreements, and must notify the New Hampshire commission within ten days.
  - A person who provides administrative support to a brokerage firm and handles client paperwork,
    and schedules appointments for licensees taking continuing education.
key: A
explanation: The definition of 'licensee' in RSA 331-A:2 V-d is a broker or salesperson licensed by
  the New Hampshire real estate commission under the provisions of this chapter. Therefore the
  option describing a person who is a broker or salesperson licensed by the New Hampshire real
  estate commission under the provisions of this chapter is correct. The option describing a person
  who holds a real estate license in any state and may practice under reciprocity agreements, and
  must notify the New Hampshire commission within ten days, is incorrect because the definition
  requires licensing by the New Hampshire commission, not merely holding a license in any state.
