stem: A licensee is preparing to show a property to a prospective buyer. When must the licensee make
  the required written agency disclosure according to RSA 331-A:(b)?
options:
  - The disclosure must be made before showing the property to the buyer.
  - The disclosure must be made before the buyer makes an offer.
  - The disclosure must be made after the offer is accepted.
  - The disclosure must be made at the time of closing.
key: B
explanation: RSA 331-A:(b) requires that disclosures be made prior to an offer to purchase, sell, or
  lease and acknowledged in writing by all parties. Therefore, the disclosure must occur before the
  buyer makes an offer. The distractor linking disclosure to merely showing the property misstates
  the timing trigger.
