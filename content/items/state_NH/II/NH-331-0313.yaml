stem: According to Rea 403.02(e), what percentage of licensees must be randomly selected each year
  by the commission for compliance with continuing education requirements?
options:
  - The requirement is exactly 10% of licensees
  - The requirement is not less than 10% of licensees
  - The requirement is less than 5% of licensees
  - The requirement is up to 20% of licensees
key: B
explanation: Rea 403.02(e) states that not less than 10% of licensees shall be randomly selected
  each year for continuing education compliance, meaning the minimum is 10% but a higher percentage
  may be selected. The distractor "exactly 10%" is incorrect because the rule sets a floor, not a
  precise figure, allowing the commission to select more than 10% if desired.
