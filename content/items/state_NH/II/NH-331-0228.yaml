stem: Under RSA 331-A:26, how many days after the owner is entitled to and makes demand for the
  return of money or documents must a licensee return them to avoid prima facie evidence of
  conversion?
options:
  - 15 days
  - 60 days
  - 30 days
  - 10 days
key: C
explanation: The statute states that failure to return money or documents within 30 days after
  demand is prima facie evidence of conversion, so the licensee must return them within 30 days to
  avoid this presumption. Fifteen days is too short and exceeds the requirement, while sixty days
  exceeds the allowed period.
citation:
  source: N.H. Rev. Stat. Ann. ch. 331-A § 331-A:26(VII)
  url: null
  quoted_text: Failure to return any money or contract, deed, note, mortgage, abstract or other
    evidence of title within 30 days after the owner is entitled to and makes demand for such
    evidence, shall be prima facie evidence of such conversion.
