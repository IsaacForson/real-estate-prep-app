stem: A broker applicant residing in New Hampshire was convicted of a misdemeanor offense in Vermont
  two years ago. According to RSA 331-A:10-a, what must the applicant do before the commission can
  determine eligibility for licensure?
options:
  - Submit a fingerprint card to the Federal Bureau of Investigation
  - Submit a sworn affidavit attesting to good moral character
  - Submit only the New Hampshire criminal history record authorization form
  - Submit the New Hampshire form and a criminal record report from Vermont
key: D
explanation: The law requires applicants to submit both the New Hampshire criminal history
  authorization form and a criminal record report from any other jurisdiction where they have a
  misdemeanor or felony conviction. Submitting only the New Hampshire form omits the required
  out‑of‑state report.
