stem: A licensee receives proper notice of a disciplinary hearing scheduled for July 10 but does not
  attend. The licensee is the party who bears the burden of proof in the proceeding. According to
  Rea 205.11, what may the presiding officer do?
options:
  - Impose a fine of $1,000
  - Dismiss the case
  - Continue the hearing
  - Request a written explanation
key: B
explanation: If the party with the burden of proof fails to appear, the presiding officer may
  dismiss the case under Rea 205.11(b)(1). Imposing a fine is not authorized by this rule, and the
  hearing would not proceed absent the burden‑of‑proof party.
