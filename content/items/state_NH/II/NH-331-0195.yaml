stem: According to RSA 331-A:13(III), what action is prohibited regarding escrow account funds?
options:
  - The principal broker shall not draw a check against uncollected contract deposits.
  - The principal broker shall not deposit funds into an interest-bearing escrow account.
  - The principal broker shall not withdraw funds after contract performance.
  - The principal broker shall not provide the commission with an audit permit.
key: A
explanation: RSA 331-A:13(III) prohibits drawing a check against uncollected contract deposits held
  in the escrow account. Therefore, the principal broker may not issue such a check. Placing
  deposits in an interest‑bearing escrow account is permitted by the statute, so the other
  statements are incorrect.
