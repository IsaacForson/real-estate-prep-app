stem: Which of the following is **NOT** considered an 'advance fee' under RSA 331-A:2?
options:
  - A fee charged for offering a property for lease.
  - A fee charged for advertising a property on a television commercial.
  - A fee charged for listing a property for sale.
  - A fee charged for advertising a property in a newspaper.
key: D
explanation: The statute defines advance fees as any fees for services including listing,
  advertising, or offering for sale or lease, but explicitly excludes fees paid solely for
  advertisement in a newspaper or other publication of general circulation. Therefore, a newspaper
  advertising fee is not an advance fee, while the other options are included.
citation:
