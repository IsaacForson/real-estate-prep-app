stem: A principal broker terminates a licensed salesperson on June 1. Assuming the broker does
  **NOT** request a waiver, what is the latest date they may notify the New Hampshire Real Estate
  Commission to comply with the notification requirement?
options:
  - June 6
  - June 7
  - June 5
  - June 8
key: A
explanation: The requirement is to notify within five days of the termination. Counting five days
  from June 1 gives June 6 as the latest permissible date. June 5 is within the period but not the
  latest, while June 7 and June 8 exceed the five‑day limit.
