stem: Under Rea 305.04(a), if a licensee does **NOT** wish to display their license certificate on a
  wall, where may it be displayed instead?
options:
  - Saving the license certificate electronically on a personal device kept in a locked desk drawer
  - Posting the license certificate on a staff-only bulletin board inside the break room, away from
    client view
  - Keeping the license certificate in a locked filing cabinet located behind the reception desk
  - Displaying the license certificate prominently in a public area offering easy visibility and
    accessibility
key: D
explanation: The rule explicitly states that when wall display is not desired, the certificate may
  instead be prominently displayed in a public area offering easy visibility and accessibility to
  clients or the public. The most tempting distractor suggests storing the certificate in a locked
  desk drawer, but the rule requires public display, not private storage.
citation:
  source: "### N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules) — N.H. Code of
