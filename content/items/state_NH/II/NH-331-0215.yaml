    capture and gencourt.state.nh.us returns 403) — re-fetch live when reachable Rea 305.04(a)"
  url: null
  quoted_text: In situations where wall display of license certificates is not desired, the
    certificate of each licensed firm, principal broker and those of all licensed brokers and
    salespersons working through that principal broker may instead be prominently displayed in a
    public area in a manner offering easy visibility and accessibility to any client, customer, or a
    member of the public wishing to examine them.
