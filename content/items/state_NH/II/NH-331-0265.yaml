stem: An applicant seeks a broker license as a firm in New Hampshire. Besides the completed firm
  application form, what else must they submit according to Rea 301.01(d)?
options:
  - A set of signed affidavits from three character references as required by RSA 331-A:12, II
  - A signed irrevocable consent and power of attorney statement for non-resident applicants
  - A statement from the employing broker listing hours per week for salesperson applicants
  - A current certificate for the firm name from the New Hampshire secretary of state’s office
key: D
explanation: Firm applicants must provide a current certificate for the firm name from the New
  Hampshire secretary of state’s office per Rea 301.01(d)(2). The distractor about the irrevocable
  consent applies only to non-resident applicants, not to all firm applicants.
