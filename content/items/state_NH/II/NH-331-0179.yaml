stem: Under RSA 331-A:25-a, if a licensee intends to have a relationship with a client that is
  **NOT** seller agent, buyer agent, disclosed dual agent, or subagent, what must the licensee do?
options:
  - The licensee must describe the relationship in writing and have all parties sign it before
    services are rendered.
  - The licensee must obtain a temporary license from the commission.
  - The licensee must provide a verbal explanation of the relationship to the client at the first
    meeting.
  - The licensee must notify the real estate commission within ten days of the agreement.
key: A
explanation: The statute requires that any non‑standard relationship be described in writing and
  signed by all parties before services begin. Simply telling the client verbally or notifying the
  commission does not satisfy this requirement.
citation:
  source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act) — RSA Chapter 331-A
    — New Hampshire Real Estate Practice Act, official General Court page read via Internet Archive
    capture of 2025-07-09 because gc.nh.gov returns 403 to scripts Section 331-A:25-a
  url: null
  quoted_text: If another relationship between the licensee who performs the services and the seller,
    landlord, buyer, or tenant is intended, it must be described in writing and signed by all
    parties to the relationship prior to services being rendered.
