stem: A broker changes her firm's mailing address. According to Rea 404.02(b), within how many days
  must the change be reported in writing to the New Hampshire Real Estate Commission?
options:
  - 7 days
  - 15 days
  - 10 days
  - 5 days
key: C
explanation: The rule requires that any change in the information listed in Rea 404.02(a) be
  reported in writing to the commission no later than 10 days after the change. The 5‑day option
  mistakenly applies the shorter notice period for principal‑broker affiliation changes found
  elsewhere in the rule.
