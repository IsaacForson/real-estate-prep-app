stem: An applicant for a New Hampshire salesperson license has no criminal record in any other
  jurisdiction. According to RSA 331-A:10-a(I), what must the applicant do before submitting an
  application for licensure?
options:
  - Submit the criminal record report from any other jurisdiction to the Commission for review
  - Submit a surety bond with the application for broker licensure as required by RSA 331-A:10(II)(f)
  - Submit proof of completion of 40 hours of approved study prior to examination to the Commission
  - Submit the New Hampshire criminal history record information authorization form and fee to the
    Department of Safety
key: D
explanation: The statute requires all applicants to submit the NH criminal history record
  information authorization form and fee to the Department of Safety prior to applying. Submitting a
  criminal record report from another jurisdiction is only needed if the applicant has a conviction
  there.
