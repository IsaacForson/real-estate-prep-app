stem: An applicant passes the New Hampshire broker examination on June 1. According to RSA 331-A:11,
  by what date must the applicant become licensed to avoid being required to retake the examination?
options:
  - By June 1 of the following year
  - By December 1 of the same year
  - By December 31 of the same year
  - By November 30 of the same year
key: B
explanation: RSA 331-A:11 states that a person who passes the examination must become licensed
  within 6 months of the exam date or retake the exam. Six months after June 1 is December 1, so
  licensing must occur by that date. The June 1 of the following year is 12 months later, exceeding
  the allowed period.
