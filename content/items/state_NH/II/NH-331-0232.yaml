stem: A principal broker keeps a salesperson's license in a locked drawer rather than displaying it
  at the place of business. According to Rea 301.01(b), what is true regarding the broker's
  compliance with the display requirement?
options:
  - The broker stored the license in a secure locked drawer for safety
  - The broker paid the $5 duplicate license fee to avoid penalty daily
  - The broker failed to display the license prominently at the place of business
  - The broker displayed the license prominently at the place of business
key: C
explanation: The rule requires the principal broker to display the license prominently at the place
  of business. Keeping it in a locked drawer means the license is not displayed, violating this
  requirement. The other options describe actions that do not satisfy the display requirement.
