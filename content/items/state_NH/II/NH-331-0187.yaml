stem: A candidate submits a completed exam registration form and fee to the New Hampshire Real
  Estate Commission on February 5. Assuming the candidate does **NOT** request a waiver for good
  cause, what is the latest date they may take the licensing examination?
options:
  - May 5
  - May 4
  - April 5
  - May 6
key: A
explanation: Rea 301.03(e) requires the exam to be taken within 3 months of registration receipt.
  Adding three months to February 5 yields May 5 as the final permissible date. May 4 is one day
  early, May 6 exceeds the limit, and April 5 reflects only two months.
