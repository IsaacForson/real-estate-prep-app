stem: According to New Hampshire Administrative Rule Rea 301.01(a)(1), what action constitutes
  grounds for denial of a license application and, if discovered after licensure, for disciplinary
  action?
options:
  - Knowingly providing materially false information on the license application
  - Deliberately excluding prior disciplinary actions on the license application
  - Intentionally omitting material information from the license application
  - Carelessly misrepresenting years of experience in the license application
key: A
explanation: The rule states that knowingly providing materially false information on the
  application is a basis for denial and, if discovered after licensure, for disciplinary action. The
  other options describe missing required items, which may lead to denial but are not explicitly
  cited as grounds for disciplinary action.
