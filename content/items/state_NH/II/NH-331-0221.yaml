stem: Jane Doe, who is not a licensee, owns a rental property and regularly employs John Smith, who
  is also not a licensee, to handle leasing activities. Under RSA 331-A:4, which statement is
  correct regarding the need for a real estate license?
options:
  - Jane Doe must obtain a real estate license before she can lease her rental property.
  - John Smith must obtain a real estate license to perform leasing activities for the owner.
  - Neither Jane Doe nor John Smith needs a real estate license for these activities.
  - Only Jane Doe needs a real estate license because she is the property owner.
key: C
explanation: RSA 331-A:4 I exempts a non‑licensee owner and the regular employees of that owner who
  are also non‑licensees from needing a real estate license when they act with respect to the
  owner’s real property. Jane Doe is a non‑licensee owner and John Smith is her regular employee who
  is also not a licensee, so neither needs a license. The statement that John Smith must obtain a
  real estate license to perform leasing activities for the owner is incorrect because the exemption
  applies when the employee works for a non‑licensee owner.
