stem: A limited agent misrepresents a material fact to a customer without the client's knowledge.
  Under Neb. Rev. Stat. § 76-2426, when is the client liable for that misrepresentation?
options:
  - Whenever the misrepresentation causes financial harm
  - Whenever the agent acted within the scope of employment
  - If the client personally repeated the statement to the customer
  - If the client knew or should have known of it
key: D
explanation: Section 76-2426 provides that a client is not liable for a limited agent's
  misrepresentation unless the client knew or should have known of the misrepresentation.
citation:
  source: Neb. Rev. Stat. § 76-2426
  url: null
  quoted_text: A client shall not be liable for a misrepresentation of his or her limited agent
    arising out of the limited-agency agreement unless the client knew or should have known of the
    misrepresentation
