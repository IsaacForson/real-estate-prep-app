stem: Under Neb. Rev. Stat. § 76-2424, what is the legal effect of a third party simply paying a
  designated broker's compensation in a transaction?
options:
  - It does not by itself establish an agency relationship with that party
  - It converts the broker into a subagent of that party
  - It automatically creates an agency relationship with that party
  - It requires the broker to disclose confidential client information to that party
key: A
explanation: Section 76-2424 provides that payment of compensation by itself does not establish an
  agency relationship between the party who paid the compensation and the designated broker or any
  affiliated licensee.
citation:
  source: Neb. Rev. Stat. § 76-2424
  url: null
  quoted_text: Payment of compensation by itself shall not establish an agency relationship between
    the party who paid the compensation and the designated broker or any affiliated licensee.
