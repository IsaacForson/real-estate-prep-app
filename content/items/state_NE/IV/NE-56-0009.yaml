stem: Under Neb. Rev. Stat. § 76-2427, what is true of a designated broker who appoints affiliated
  licensees as limited agents of a client?
options:
  - The broker is not a dual agent solely due to the appointment
  - The broker automatically becomes a dual agent by statute
  - The broker is required to dissolve the original listing agreement
  - The broker loses supervisory authority over those licensees entirely
key: A
explanation: Section 76-2427 states that a designated broker is not considered a dual agent solely
  because he or she makes an appointment of limited agents under that section.
