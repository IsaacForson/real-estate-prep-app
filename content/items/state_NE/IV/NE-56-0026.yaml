stem: A designated broker intends to act as a single agent for a buyer who wants to purchase a
  duplex used primarily for residential purposes. Under Neb. Rev. Stat. § 76-2422, what must the
  designated broker do before engaging in brokerage activities for this buyer?
options:
  - Enter into a written agency agreement with the buyer
  - File a copy of the buyer's financial statement with the commission
  - Obtain the seller's consent to represent the buyer
  - Wait until an offer to purchase has already been signed
key: A
explanation: Section 76-2422 requires a designated broker acting as a single agent for a buyer of
  residential property with one to four dwelling units to enter into a written agency agreement with
  the party to be represented.
citation:
  source: Neb. Rev. Stat. § 76-2422
  url: null
  quoted_text: a designated broker acting as a single agent for a buyer for real property being used
    primarily for residential purposes where no fewer than one or more than four dwelling units are
    located shall enter into a written agency agreement with the party to be represented
