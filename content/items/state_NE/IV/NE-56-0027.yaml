stem: A licensee representing a seller who is an asset management company disposing of a foreclosed
  property is not required to present every written offer to that client. Under Neb. Rev. Stat. §
  76-2422.01, why is the licensee exempt from that requirement?
options:
  - The buyer making the offer is also a licensed real estate broker
  - The client receiving the offer is an asset management company
  - The offer was submitted after the listing agreement expired
  - The property has already been listed for more than one year
key: B
explanation: Section 76-2422.01 exempts a licensee from presenting all written offers when the
  client to whom the written offer is required to be presented is an asset management company.
