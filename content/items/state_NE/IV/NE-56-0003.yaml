stem: A buyer's agent is negotiating on behalf of her client with a seller who has no agent of his
  own, and discovers a known roof defect the seller has not mentioned. Under Neb. Rev. Stat. §
  76-2418, what must the buyer's agent do regarding the seller?
options:
  - Withhold the defect because the seller has no representation
  - Cancel the buyer's agency agreement over the discovery
  - Disclose in writing to the seller adverse material facts known
  - Wait for the seller's own professional inspector to find the same defect
key: C
explanation: Section 76-2418 requires a buyer's or tenant's agent to disclose in writing to any
  seller or prospective seller all adverse material facts actually known by the licensee.
