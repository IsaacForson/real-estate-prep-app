  source: Neb. Rev. Stat. § 76-2417
  url: null
  quoted_text: A seller's or landlord's agent may show alternative properties not owned by the client
    to prospective buyers or tenants and may list competing properties for sale or lease without
    breaching any duty or obligation to the client.
