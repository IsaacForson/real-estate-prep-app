stem: A seller's agent lists a client's home and also shows the client several other homes owned by
  different sellers to prospective buyers. Under Neb. Rev. Stat. § 76-2417, has the agent breached a
  duty to the listing client?
options:
  - Yes, showing any other property is a breach of loyalty to the client
  - No, showing properties the client does not own is permitted
  - Yes, unless the client is paid an extra fee for each showing
  - No, but if the other properties are located in a different county
key: B
explanation: Section 76-2417 states that a seller's or landlord's agent may show alternative
  properties not owned by the client to prospective buyers or tenants and may list competing
  properties without breaching any duty to the client.
