stem: A buyer's agent is working with a client who wants a particular home. Another prospective
  buyer, represented by the same agent, is also interested in that same home. Under Neb. Rev. Stat.
  § 76-2418, may the agent show the home to both buyers?
options:
  - No, showing the property to a competing buyer breaches the agency
  - No, unless a court grants prior approval for dual representation
  - Yes, showing the property to another buyer is permitted
  - Yes, but after the first buyer's offer has been rejected
key: C
explanation: Section 76-2418 provides that a buyer's or tenant's agent may show properties in which
  the client is interested to other prospective buyers or tenants without breaching any duty or
  obligation to the client.
