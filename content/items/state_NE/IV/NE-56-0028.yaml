stem: A listing agreement expires without the property having sold, and the parties have not agreed
  in writing to extend any duties. Under Neb. Rev. Stat. § 76-2423, which duties, if any, does the
  licensee continue to owe the former client after the expiration?
options:
  - The full set of original agency duties continues indefinitely
  - The duty to keep seeking offers on the property continues
  - The duties of accounting and confidentiality continue
  - No duties of any kind continue once the agreement expires
key: C
explanation: Section 76-2423 provides that, except as otherwise agreed in writing, a licensee owes
  no further duty after termination or expiration of the representation except the duties of
  accounting for money and property and keeping certain information confidential.
