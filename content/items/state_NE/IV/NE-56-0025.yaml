stem: A licensee's first substantial contact is with a limited liability company that is purchasing
  an apartment building containing eight residential dwelling units, and the LLC has no written
  brokerage agreement in place. Under Neb. Rev. Stat. § 76-2421, must the licensee give that entity
  the written brokerage relationship disclosures?
options:
  - Yes, every purchasing entity receives the disclosures regardless of size
  - No, individual buyers alone receive the required disclosures
  - Yes, but the disclosures may be given verbally instead of in writing
  - No, the entity is purchasing property with five or more dwelling units
key: D
explanation: Section 76-2421 excuses a licensee from giving the written disclosures to an entity
  such as a limited liability company when it is purchasing real property on which there are five or
  more residential dwelling units.
citation:
  source: Neb. Rev. Stat. § 76-2421
  url: null
  quoted_text: A licensee shall not be required to give the written disclosures required by this
    section to a corporation, limited liability company, partnership, limited liability partnership,
    or similar entity or to any entity which, if doing business in the State of Nebraska, would be
    required to be registered with the Secretary of State when such corporation, limited liability
    company, partnership, limited liability partnership, or entity is purchasing, leasing, or
    selling real property (a) on which there are five or more residential dwelling units
