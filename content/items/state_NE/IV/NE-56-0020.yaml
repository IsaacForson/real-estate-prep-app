stem: Under Neb. Rev. Stat. § 76-2420, what is required of a designated broker regarding the number
  of brokerage relationships offered to sellers, landlords, buyers, or tenants?
options:
  - The broker offers at least two of the enumerated relationships
  - The broker offers whichever relationship the customer prefers
  - The broker need not offer more than one relationship
  - The broker offers each relationship enumerated in the statute
key: C
explanation: Section 76-2420 provides that a designated broker shall not be required to offer or
  engage in more than one of the brokerage relationships enumerated in the statute, leaving the
  choice to the broker's written policy.
