stem: A broker whose principal business is property management (not real estate brokerage) employs a
  salesperson without first providing satisfactory evidence to overcome the presumption. Under Title
  299 Neb. Admin. Code ch.2 §001, what is the result?
options:
  - The broker may employ the salesperson but must supervise them personally.
  - The broker shall not be allowed to employ the salesperson or an associate broker.
  - The broker must pay a fine of up to five hundred dollars to the commission.
  - The broker must complete additional continuing education before hiring.
key: B
explanation: The rule creates a presumption that such a broker cannot supervise licensees and
  prohibits employing a salesperson or associate broker until the presumption is overcome by
  satisfactory evidence. Therefore employing the salesperson without overcoming the presumption is
  not allowed. The distractor suggesting the broker may employ if they supervise personally ignores
  the outright prohibition until the presumption is rebutted.
citation:
  source: Neb. Admin. Code tit. 299, ch. 2 § 001
  url: null
  quoted_text: It shall be presumed that a duly licensed broker whose principal business is other than
    that of a real estate broker is unable to supervise licensed employees, and said broker shall
    not be allowed to employ a real estate salesperson or an associate broker until such presumption
    is overcome by satisfactory evidence to the contrary.
