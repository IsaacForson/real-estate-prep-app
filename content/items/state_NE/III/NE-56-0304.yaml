stem: A designated broker stores all sales and property management records in a personal cloud
  account that the Nebraska Real Estate Commission cannot access for audit. Under Neb. Admin. Code
  tit. 299, ch. 3, § 003, how should this conduct be classified?
options:
  - The designated broker's action is considered a violation because the records are not subject to
    audit as required.
  - The designated broker's action is permitted because electronic storage satisfies the maintenance
    requirement.
  - The designated broker's action is allowed if the broker provides the commission with monthly
    summaries of the records.
  - The designated broker's action is required only when the records pertain to sales accounts, not
    property management.
key: A
explanation: The rule requires records to be subject to audit; storing them in a location the
  commission cannot access fails that requirement, making the conduct a violation. The other options
  incorrectly suggest that electronic storage, summaries, or a limitation to sales accounts satisfy
  the rule, which the text does not support.
