stem: An associate broker wants to accept a commission from a party other than her employing broker
  for helping arrange a lease. Under Neb. Admin. Code tit. 299, ch. 2, § 010, what must happen
  before she accepts that commission?
options:
  - The commission may be accepted so long as it is disclosed afterward
  - The State Real Estate Commission approves the arrangement
  - The other party first notifies the associate broker's clients
  - The employing broker gives written consent in advance
key: D
explanation: Rule 010 requires that the consent of the employing broker for an associate broker or
  salesperson to accept a commission from anyone other than the employing broker be given in writing
  in advance of accepting it.
citation:
  source: Neb. Admin. Code tit. 299, ch. 2, § 010
  url: null
  quoted_text: The consent required from the employing broker for an associate broker or salesperson
    to represent another real estate broker or to accept a commission or other valuable
    consideration from anyone other than the employing broker as set forth in Neb. Rev. Stat.
    81-885.24(7) and (8), respectively, shall be given in writing by the broker in advance of the
    licensee representing the other broker or the acceptance of the commission or other valuable
    consideration from the other party
