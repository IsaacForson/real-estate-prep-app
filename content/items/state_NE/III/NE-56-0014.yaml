stem: A broker receives an earnest money deposit for a pending purchase agreement. Under Neb. Rev.
  Stat. § 81-885.21, where must those funds remain until the transaction closes or is otherwise
  terminated?
options:
  - Deposited into the broker's general operating account
  - Held as cash in the broker's personal office safe
  - Transferred immediately to the buyer's designated closing attorney
  - Deposited and remaining in the designated trust account
key: D
explanation: Section 81-885.21 requires earnest money deposits to be deposited and remain in the
  trust account until the transaction is closed or terminated, absent a written agreement otherwise.
