stem: Under Neb. Admin. Code tit. 299, ch. 2, § 001, what is presumed about a duly licensed broker
  whose principal business is something other than real estate brokerage?
options:
  - That the broker is automatically barred from ever holding a license
  - That the broker is presumed to need no continuing education
  - That the broker is presumed unable to supervise licensed employees
  - That the broker is presumed exempt from trust account rules
key: C
explanation: Rule 001 presumes that a broker whose principal business is other than real estate
  brokerage is unable to supervise licensed employees, and bars employment of a salesperson or
  associate broker until that presumption is overcome.
citation:
