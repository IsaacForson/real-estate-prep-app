stem: Under Neb. Rev. Stat. § 81-885.01, who is responsible for supervising the real estate
  activities of associate brokers and salespersons within a real estate business?
options:
  - A licensed attorney retained by the brokerage
  - The designated broker for that real estate business
  - The State Real Estate Commission for every licensee statewide
  - Each associate broker supervises himself or herself
key: B
explanation: Section 81-885.01 defines the designated broker as the individual holding a broker's
  license with full authority to conduct the business's real estate activities, and states that this
  person is responsible for supervising the activities of associate brokers or salespersons.
citation:
  source: Neb. Rev. Stat. § 81-885.01
  url: null
  quoted_text: The designated broker shall also be responsible for supervising the real estate
    activities of any associate brokers or salespersons
