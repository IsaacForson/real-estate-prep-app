stem: A broker receives earnest money on behalf of a buyer and deposits it directly into the
  brokerage's general operating account rather than a separate account, and the parties never agreed
  otherwise in writing. Under Neb. Rev. Stat. § 81-885.24, how should this conduct be classified?
options:
  - An unfair trade practice for skipping the separate trust account
  - A permitted practice as long as the funds are later transferred
  - A permitted practice if the buyer specifically objects in writing
  - A permitted practice for brokers who handle few transactions
key: A
explanation: Section 81-885.24 identifies as an unfair trade practice the failure to maintain and
  deposit in a separate trust account all money received by a broker in a real estate transaction
  unless all interested parties have agreed otherwise in writing.
citation:
  source: Neb. Rev. Stat. § 81-885.24
  url: null
  quoted_text: Failing to maintain and deposit in a separate trust account all money received by a
    broker acting in such capacity, or as escrow agent or the temporary custodian of the funds of
    others, in a real estate transaction unless all parties having an interest in the funds have
    agreed otherwise in writing
