stem: Under Neb. Rev. Stat. § 81-885.01, which of the following is **NOT** included in the
  definition of an inactive broker?
options:
  - An associate broker whose license has been returned to the commission by the licensee's broker
  - A broker who has requested the commission to place the license on inactive status
  - A new licensee who has failed to designate an employing broker or have the license issued as an
    individual broker
  - A salesperson whose license has been placed on inactive status under statute, rule, or regulation
key: D
explanation: Neb. Rev. Stat. § 81-885.01 defines an inactive broker as an associate broker whose
  license was returned to the commission, a broker who requested inactive status, a new licensee who
  failed to designate an employing broker, or a broker whose license was placed on inactive status
  under statute, rule, or regulation. A salesperson placed on inactive status is not part of that
  definition, so the statement about a salesperson is the one that is NOT included.
