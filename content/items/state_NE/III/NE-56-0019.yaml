stem: A third-party home warranty company is paid directly for repairs performed on behalf of a
  seller client, and the broker keeps no profit or fee from that payment. Under Neb. Rev. Stat. §
  81-885.24, why does this payment fall outside the earnest-money compensation restriction?
options:
  - It includes no profit or payment for services by the broker
  - It was arranged before the listing agreement was signed
  - It was paid by an outside licensed contractor instead of a vendor
  - It occurred after the transaction had already closed
key: A
explanation: Section 81-885.24(35) excludes a third-party payment for goods or services from the
  compensation restriction when the payment includes no profit or payment for services rendered by
  the broker.
citation:
  source: Neb. Rev. Stat. § 81-885.24
  url: null
  quoted_text: a payment for goods or services rendered by a third party on behalf of the client shall
    not be considered compensation or consideration if such payment does not include any profit,
    compensation, or payment for services rendered by the broker
