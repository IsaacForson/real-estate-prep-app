stem: Under Neb. Rev. Stat. §81-885.06, who may bring an action in court to recover compensation for
  services performed that require a real estate license?
options:
  - An unlicensed broker, associate broker, or salesperson
  - A corporation, partnership, or LLC
  - An unlicensed individual, employee, or assistant
  - A licensed broker, associate broker, or salesperson
key: D
explanation: The statute bars any person from suing for compensation for acts that require a license
  unless the plaintiff is a licensed broker, associate broker, or salesperson. Therefore only those
  licensed individuals may recover compensation for such services. The distractor that any person
  may sue is incorrect because the law expressly prohibits recovery by unlicensed persons for
  prohibited acts.
citation:
  source: Neb. Rev. Stat. § 81-885.06
  url: null
  quoted_text: No action or suit shall be instituted, nor recovery be had, in any court of this state
    by any person for compensation for any act done or service rendered, the doing or rendering of
    which is prohibited under the Nebraska Real Estate License Act to other than licensed brokers,
    licensed associate brokers, or licensed salespersons.
