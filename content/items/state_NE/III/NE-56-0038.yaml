stem: A licensee is personally purchasing a home for himself and has not yet made any written
  disclosure of his own interest to the seller, but the seller has already signed the purchase
  agreement believing the licensee to be a regular buyer. Under Neb. Admin. Code tit. 299, ch. 5, §
  003, has the timing of this disclosure satisfied the rule?
options:
  - No, but because the licensee is buying through an entity
  - No, disclosure comes before the seller becomes obligated to sell
  - Yes, disclosure at any time before closing satisfies the rule
  - Yes, because the seller's signature alone excuses further disclosure
key: B
explanation: Rule 003.04 requires that when a licensee is purchasing property for himself, the
  written disclosure of the licensee's interest must take place prior to the seller becoming
  obligated to sell the property.
citation:
  source: Neb. Admin. Code tit. 299, ch. 5, § 003
  url: null
  quoted_text: In a situation where a licensee is purchasing property for themselves or for an entity
    in which they have any interest, said written disclosure by the licensee shall take place prior
    to the seller becoming obligated to sell such property
