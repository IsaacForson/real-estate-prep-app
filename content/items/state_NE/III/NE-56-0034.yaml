stem: A broker withdraws part of the earnest money held in trust and applies it toward the broker's
  commission before the sale has closed or terminated. Under Neb. Rev. Stat. § 81-885.24, how is
  this conduct treated?
options:
  - As permitted whenever the seller verbally approves the withdrawal
  - As an unfair trade practice since the sale is not consummated
  - As permitted because commissions may be drawn from earnest money
  - As an unfair trade practice if the buyer later cancels the sale
key: B
explanation: Section 81-885.24 lists as an unfair trade practice charging or collecting, as
  compensation, any part of the earnest money paid in a transaction until the transaction has been
  consummated or terminated.
citation:
  source: Neb. Rev. Stat. § 81-885.24
  url: null
  quoted_text: Charging or collecting, as part or all of his or her compensation or consideration, any
    part of the earnest money or other money paid to him or her or the entity under which he or she
    does business in connection with any real estate transaction until the transaction has been
    consummated or terminated
