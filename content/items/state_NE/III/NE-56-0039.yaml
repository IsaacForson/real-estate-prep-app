stem: A broker learns that a nearby property owner has an outstanding exclusive-right-to-sell
  listing with another broker. The first broker approaches the owner directly to negotiate a sale,
  intending to substitute a new listing contract in place of the existing one. Under Neb. Rev. Stat.
  § 81-885.24, how is this conduct classified?
options:
  - Acceptable because any broker may contact any owner about a sale
  - Acceptable as long as the first broker offers a lower commission rate
  - An unfair trade practice given the exclusive listing elsewhere
  - An unfair trade practice if the listing broker is notified in advance
key: C
explanation: Section 81-885.24 treats as an unfair trade practice negotiating a sale directly with
  an owner known to have a written outstanding exclusive listing contract with another broker for
  the purpose of substituting a new contract in its place.
citation:
  source: Neb. Rev. Stat. § 81-885.24
  url: null
  quoted_text: Negotiating a sale, exchange, listing, or lease of real estate directly with an owner
    or lessor if he or she knows that such owner has a written outstanding listing contract in
    connection with such property granting an exclusive agency or an exclusive right to sell to
    another broker or negotiating directly with an owner to withdraw from or break such a listing
    contract for the purpose of substituting, in lieu thereof, a new listing contract
