stem: A salesperson buys a rental house for personal investment and advertises it for sale in the
  newspaper under her own name without mentioning her license. Under Neb. Admin. Code tit. 299, ch.
  2, § 006, has the salesperson complied with the advertising rule?
options:
  - Yes, owners advertising their own property need not disclose anything
  - No, but because she used her own name in the advertisement
  - No, the advertising needs to disclose that she is a licensed salesperson
  - Yes, disclosure is required when the seller is a broker, not a salesperson
key: C
explanation: Rule 006 requires a licensee who advertises property he or she owns to disclose in the
  advertising that he or she is a licensed real estate salesperson, associate broker, or broker
  acting as a principal in the transaction.
citation:
  source: Neb. Admin. Code tit. 299, ch. 2, § 006
  url: null
  quoted_text: Every licensee, when advertising his or her own property for sale, purchase, or
    exchange, or soliciting as a buyer of real property on his or her own behalf including but not
    limited to any entity in which he or she has a direct or beneficial ownership interest, must
    disclose in such advertising that he or she is a licensed real estate salesperson, associate
    broker , or broker acting as a principal in the transaction
