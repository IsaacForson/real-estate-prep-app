stem: The State Real Estate Commission decides to examine a broker's trust account this year even
  though the broker was examined last year as well. Under Neb. Rev. Stat. § 81-885.21, is the
  commission permitted to conduct the examination again this year?
options:
  - Yes, the commission may examine it annually or as it directs
  - No, examinations are permitted after a written complaint is filed
  - Yes, but if the broker requests the additional examination
  - No, trust accounts may be examined once during a license period
key: A
explanation: Section 81-885.21 requires each broker to authorize the commission to examine the trust
  account, with such examination made annually or at such time as the commission may direct.
