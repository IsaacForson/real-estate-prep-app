stem: A licensee arranges for a title insurance company to pay a $200 referral fee to the licensee
  for directing a buyer to them. The licensee receives the fee after closing but does not inform the
  buyer before the buyer agrees to pay for the title insurance policy. Under Neb. Admin. Code tit.
  299, ch. 5, § 003, what is required of the licensee regarding this referral fee?
options:
  - The licensee must disclose the referral fee in writing to the buyer before the buyer agrees to
    pay for the title insurance
  - The licensee must retain the referral fee without any disclosure because it is less than five
    hundred dollars
  - The licensee must provide a verbal disclosure of the referral fee to the buyer at the closing
    meeting
  - The licensee must disclose the referral fee in writing to the buyer after the closing is
    completed
key: A
explanation: Under Neb. Admin. Code tit. 299, ch. 5, § 003, written disclosure of any commission,
  rebate, or direct profit must occur no later than when the principal agrees to the expenditure.
  Here the buyer is the principal agreeing to pay for title insurance, so disclosure must be in
  writing before that agreement. The option that says the licensee may retain the fee without
  disclosure because it is under five hundred dollars is wrong because disclosure is required
  regardless of amount. The option that suggests a verbal disclosure at closing is wrong because the
  disclosure must be written. The option that calls for written disclosure after closing is wrong
  because it would be too late—disclosure must happen before the buyer agrees to the expense.
