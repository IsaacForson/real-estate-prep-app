stem: A broker opens a new office location in a different city. Under Neb. Rev. Stat. § 81-885.20,
  what must the broker do regarding the commission?
options:
  - Notify the commission in writing of the change
  - Pay a transfer fee of up to fifty dollars to the commission
  - Submit the salesperson's license to the commission for cancellation
  - File a statement subordinating the designated broker's authority
key: A
explanation: The statute requires the broker to forthwith notify the commission in writing of any
  change in place of business. Paying a transfer fee to the commission is not required for a change
  of place of business. Submitting a salesperson's license for cancellation is unrelated to a
  broker's change of office location. Filing a statement subordinating the designated broker's
  authority pertains to other licensing matters, not a place-of-business change.
