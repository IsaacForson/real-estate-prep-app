stem: An 18‑year‑old high school graduate submits an application for a salesperson license.
  According to Neb. Rev. Stat. § 81-885.13(1)(a), what is the correct outcome?
options:
  - License will be denied because the applicant is under the required age of nineteen.
  - License will be denied unless the applicant completes a home school program.
  - License will be issued after the applicant completes six hours of professional practice study.
  - License will be issued because the applicant meets the education requirement.
key: A
explanation: The statute prohibits issuing a broker’s or salesperson’s license to anyone who has not
  attained nineteen years of age. Since the applicant is only eighteen, the license must be denied.
  The other options either ignore the age barrier or introduce irrelevant requirements.
