stem: How many days prior to the hearing must the commission notify the licensee in writing of the
  date and place of the hearing?
options:
  - Thirty days.
  - Ten days.
  - Twenty days.
  - Fifteen days.
key: C
explanation: The commission must provide written notice of the hearing date and place at least
  twenty days before the hearing under Neb. Rev. Stat. § 81-885.25(2). Therefore twenty days is the
  required minimum notice period. Options stating ten, fifteen, or thirty days do not match the
  statutory requirement.
