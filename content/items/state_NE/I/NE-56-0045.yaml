stem: Under the Nebraska Real Estate License Act, what happens if only three members of the State
  Real Estate Commission attend a scheduled meeting?
options:
  - The commission may take action only if the Secretary of State is present
  - The commission may take action after the director calls a special meeting
  - The commission may take action if a majority of the three members agree
  - The commission may not take action because fewer than four members are present
key: D
explanation: The statute requires that not less than four members be present at any official
  meeting; with only three members present, the commission lacks a quorum and cannot take official
  action. The other options incorrectly suggest alternative bases for action.
citation:
