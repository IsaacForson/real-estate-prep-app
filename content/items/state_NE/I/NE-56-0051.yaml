stem: If a petition for a declaratory order is filed on June 1 and the Commission grants a request
  for oral argument, what is the latest date the oral argument may be held?
options:
  - July 1
  - July 31
  - July 15
  - July 16
key: D
explanation: Under 007.01, oral argument must be scheduled not more than forty‑five days after the
  petition is filed. Adding forty‑five days to June 1 yields July 16 as the latest permissible date;
  July 15 is one day short and July 31 mistakenly uses the sixty‑day issuance period.
