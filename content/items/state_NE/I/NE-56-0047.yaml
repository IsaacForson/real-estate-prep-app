stem: A licensee is found guilty of a violation in a single transaction where the commission earned
  was $2,200. What is the maximum civil fine the commission may impose for that complaint under the
  Nebraska Real Estate License Act?
options:
  - $2,200
  - $5,000
  - $7,200
  - $10,000
key: B
explanation: Under § 81‑885.10(1), the civil fine for each complaint cannot exceed the greater of
  $5,000 or the commission earned in the transaction. Since the commission earned ($2,200) is less
  than $5,000, the maximum fine is $5,000. The distractor '$2,200' incorrectly uses the commission
  amount as the fine limit, ignoring the $5,000 floor.
citation:
  source: Neb. Rev. Stat. § 81-885.10(1)
  url: null
  quoted_text: The total civil fine for each complaint shall not exceed the greater of five thousand
    dollars or the total amount of commission earned by the licensee in each transaction that is
    subject to the complaint.
  secondary: []
math:
  worked_solution: |-
    1. Commission earned = $2,200.
    2. Statute sets fine limit = greater of $5,000 or commission earned.
    3. Compare $5,000 vs $2,200 → greater amount is $5,000.
    4. Maximum civil fine = $5,000.
  formulas:
    - Maximum = max(Commission, $5,000)
