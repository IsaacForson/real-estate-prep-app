stem: Under Neb. Rev. Stat. § 81-885(7), which individual is required to submit fingerprints for a
  criminal history record check?
options:
  - A broker renewing an existing license after completing continuing education
  - An applicant for an original broker's or salesperson's license
  - A salesperson completing post‑licensing education for renewal
  - A nonresident licensee moving to Nebraska seeking licensure
key: B
explanation: The statute expressly states that an applicant for an original broker's or
  salesperson's license shall be subject to fingerprinting and a criminal history check. Renewing
  brokers, salespersons taking education, and nonresident licensees changing status are not
  mentioned as needing fingerprints for original licensure. Therefore only the original applicant
  must submit fingerprints.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) § 81-885(7)
  url: null
  quoted_text: An applicant for an original broker's or salesperson's license shall be subject to
    fingerprinting and a check of his or her criminal history record information maintained by the
    Federal Bureau of Investigation through the Nebraska State Patrol.
