stem: A salesperson is the subject of a formal complaint that may lead to a hearing. In addition to
  the salesperson, who else must receive a copy of the hearing notice under the Nebraska Real Estate
  License Act?
options:
  - The employing broker.
  - The commission chair.
  - The county attorney.
  - The licensee's attorney.
key: A
explanation: Neb. Rev. Stat. § 81-885.25(2) requires the commission to send a copy of the hearing
  notice to the broker employing a salesperson or associate broker. Thus the employing broker must
  receive the notice. The commission chair, county attorney, and licensee’s attorney are not
  mandated recipients by this provision.
