stem: Within how many days after receiving the complaint and notice may a licensee file a sworn
  answer under the Nebraska Real Estate License Act?
options:
  - Ten days
  - Fifteen days
  - Twenty days
  - Thirty days
key: C
explanation: The statute provides that a licensee has twenty days from the time of service of the
  complaint and notice to file a sworn answer containing all defenses. This twenty‑day period is
  explicit in § 81‑885.26. The ten‑day and fifteen‑day options understate the allowed time, while
  thirty days exceeds it.
