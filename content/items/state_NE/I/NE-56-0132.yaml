stem: Under Neb. Rev. Stat. § 81-885.13(1)(b), which of the following describes an exception to the
  high school graduation requirement for a salesperson license?
options:
  - Having completed a high school equivalency diploma issued by the state department of education
  - Having completed a home school program from another jurisdiction recognized as exempt
  - Having completed ninety classroom hours of approved real estate prelicensing education
  - Having completed a GED certificate approved by the Nebraska Real Estate Commission
key: B
explanation: The key is correct because the statute explicitly exempts graduates of exempt schools
  or home school programs from another jurisdiction from the high school graduation requirement. The
  most tempting distractor, having a GED certificate, is incorrect because a GED satisfies the high
  school equivalency requirement but does not constitute an exemption from the requirement.
citation:
