stem: What is the definition of 'Party' under the Nebraska Real Estate License Act rules?
options:
  - The hearing officer who presides over the prehearing conference and rules on non-dispositive
    motions.
  - The agency employee responsible for serving pleadings and filing proof of service with the
    Agency.
  - The person by or against whom a contested case is brought, or a person allowed to intervene in a
    contested case.
  - The person who files the initial complaint against a licensee with the Nebraska Real Estate
    Commission.
key: C
explanation: The definition of 'Party' is explicitly stated in 001.02J as the person by or against
  whom a contested case is brought, or a person allowed to intervene in a contested case. The option
  that says 'The agency employee responsible for serving pleadings and filing proof of service with
  the Agency' is incorrect because it limits the party to only the complainant, omitting intervenors
  who also qualify as parties under the rule.
