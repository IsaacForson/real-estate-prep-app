stem: If the Nebraska Real Estate Commission determines a licensee is about to engage in a violating
  practice, who may maintain an action to enjoin the practice?
options:
  - The real estate board
  - The Attorney General
  - The county sheriff
  - The employing broker
key: B
explanation: The statute authorizes the Attorney General to maintain an action in the name of the
  State to abate and enjoin violations. The employing broker is not granted this authority under the
  Act.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.43
  url: null
  quoted_text: Except as provided in subsection (2) of section 81-885.31, whenever, in the judgment of
    the commission, any person has engaged or is about to engage in any acts or practices which
    constitute or will constitute a violation of the Nebraska Real Estate License Act, the Attorney
    General may maintain an action in the name of the State of Nebraska, in the district court of
    the county in which such violation or threatened violation occurred, to abate and temporarily
    and permanently enjoin such acts and practices and to enforce compliance with the act.
