stem: According to Nebraska Administrative Code Title 305, what is the purpose of a prehearing
  conference?
options:
  - A conference before a hearing officer held for the purpose of identifying issues, witnesses,
    evidence, and other matters deemed relevant to the evidentiary hearing before the Commission,
    including discussion of potential settlement of a contested case
  - A conference before a hearing officer held for the purpose of determining guilt or innocence of
    the respondent in a contested case, which is a function reserved for the hearing officer's
    decision after the evidentiary hearing, not a prehearing conference purpose.
  - A conference before a hearing officer held for the purpose of setting the date and location of
    the evidentiary hearing, including consideration of procedural timelines, availability of
    parties, and logistical arrangements, but it does not address the identification of issues,
    witnesses, or evidence.
  - A conference before a hearing officer held for the purpose of reviewing the Commission's budget
    and staffing needs, which is an administrative matter handled elsewhere and not part of the
    prehearing conference process.
key: A
explanation: The rule defines a prehearing conference as a meeting before a hearing officer to
  identify issues, witnesses, evidence, and other relevant matters, including potential settlement
  discussions. The other options describe functions that are not part of a prehearing conference
  under this rule.
