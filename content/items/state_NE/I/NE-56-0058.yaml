stem: Under the Nebraska Real Estate License Act, what must the State Real Estate Commission adopt
  to authenticate its acts?
options:
  - A certificate issued to licensees
  - A seal adopted by the commission
  - A logo approved by the Governor
  - A badge displayed at meetings
key: B
explanation: The statute requires the commission to adopt a seal, which may be an engraved or ink
  stamp seal, to authenticate its acts. A logo approved by the Governor is not mentioned in the
  statute and therefore incorrect.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.08
  url: null
  quoted_text: The commission shall adopt a seal, which may be either an engraved or ink stamp seal,
    with the words State Real Estate Commission, State of Nebraska and such other device as the
    commission may desire included thereon, by which the acts of the commission shall be
    authenticated.
