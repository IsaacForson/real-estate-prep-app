stem: A consumer submits a sworn written complaint alleging that a salesperson commingled the money
  of principals with his or her own. What must the Nebraska Real Estate Commission do upon receiving
  this complaint?
options:
  - Investigate the actions of the salesperson involved
  - Refer the complaint to the Attorney General
  - Automatically suspend the salesperson's license
  - Ignore the complaint because it involves a salesperson
key: A
explanation: According to §81-885.24, the commission shall, upon the sworn complaint in writing of
  any person, investigate the actions of any broker, associate broker, salesperson, or subdivider.
  Therefore, the commission must investigate the salesperson's actions. Referring the complaint to
  the Attorney General is not required; the Attorney General may maintain an action but only after
  the commission's investigation.
