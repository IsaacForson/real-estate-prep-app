stem: A broker has been inactive for four years and wishes to reactivate the license. What must the
  broker do to reinstate the license under the Nebraska Real Estate License Act?
options:
  - Obtain a nonresident broker license
  - Retake the original broker examination
  - Complete 12 hours of continuing education
  - Submit renewal app and pay fee
key: B
explanation: According to Neb. Rev. Stat. § 81-885.14(5), a license inactive for more than three
  years can be reinstated only if the licensee meets the examination requirement of an original
  applicant. The other options describe renewal or continuing education steps that are insufficient
  after such a prolonged inactive period.
