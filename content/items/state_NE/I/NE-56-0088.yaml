stem: A broker advertises that a subdivision has been inspected and approved by the Nebraska Real
  Estate Commission. What action may the director take under the Nebraska Real Estate License Act?
options:
  - Take action to issue a cease and desist order
  - Take action to impose a civil fine of $1,000
  - Take action to require continuing education
  - Take action to refer the matter to the Attorney General
key: A
explanation: The director, with the commission’s consent, may issue a cease and desist order when
  sections 81-885.33 through 81-885.38 are violated, which includes false representations about
  commission inspection under §81-885.38. Referring to the Attorney General is not the immediate
  statutory remedy for this violation.
