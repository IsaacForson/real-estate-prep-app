  url: null
  quoted_text: If the trust account is an interest-bearing account, as authorized under subsection (1)
    of this section, the interest from the interest-bearing account may be distributed or otherwise
    accrue only to nonprofit organizations that promote housing in Nebraska and that are exempt from
    the payment of federal income taxes.
