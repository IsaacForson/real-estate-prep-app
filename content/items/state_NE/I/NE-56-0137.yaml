stem: A broker maintains an interest-bearing trust account and wishes to distribute the interest to
  a Nebraska‑based nonprofit that builds affordable housing but does not have federal tax‑exempt
  status. Under Neb. Rev. Stat. § 81-885.21(6), may the broker distribute the interest to this
  organization?
options:
  - Yes, because the organization promotes housing in Nebraska
  - No, because the organization must also be exempt from federal income taxes
  - Yes, as long as all parties whose money is in the account approve
  - No, because interest may only be retained by the broker
key: B
explanation: Subsection (6) limits interest distribution to nonprofit organizations that promote
  housing in Nebraska and are exempt from federal income taxes; lacking tax‑exempt status prohibits
  distribution. The option "Yes, because the organization promotes housing in Nebraska" ignores the
  tax‑exempt requirement.
citation:
