stem: A licensee is assessed a $500 civil fine by the Nebraska Real Estate Commission for a
  violation. The licensee does not pay the fine for seventy days. What may the Attorney General do
  under the Nebraska Real Estate License Act?
options:
  - The Commission may automatically suspend the licensee's license for nonpayment of the fine under
    the Act.
  - The fine is forgiven and no further action may be taken after sixty days under the Nebraska Real
    Estate License Act.
  - The licensee must pay double the original fine amount as a penalty for late payment under the
    Act.
  - The Attorney General may recover the fine as a State debt, plus fees and costs, in district
    court.
key: D
explanation: Under Neb. Rev. Stat. § 81‑885.31(2), any civil fine that remains unpaid for more than
  sixty days becomes a debt to the State of Nebraska. The Attorney General may recover that debt,
  together with reasonable attorney’s fees and court costs, by filing a proper action in the
  district court of the county where the violator resides. The statute does not provide for
  automatic suspension of the license, forgiveness of the fine, or a doubled penalty for late
  payment; those statements are not supported by the law.
citation:
