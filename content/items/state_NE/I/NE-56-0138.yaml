  quoted_text: Any civil fine imposed pursuant to the act which remains unpaid for more than sixty
    days shall constitute a debt to the State of Nebraska which may be recovered by the Attorney
    General, along with reasonable attorney's fees and court costs, in a proper form of action in
    the name of the state in the district court of the county in which the violator resides.
