stem: An inactive real estate salesperson wishes to renew her license at the end of the current
  two-year period. She has not completed any continuing education or broker‑approved training during
  that period. May she renew her license under the Nebraska Real Estate License Act?
options:
  - She may renew after completing deficient hours and filing evidence with the commission
  - She may renew without having completed the required continuing education and training hours
  - She may renew after submitting proof of six hours of broker‑approved training
  - She may renew after completing the required continuing education and training hours
key: B
explanation: Section 81-885.53 states that inactive licensees may renew their licenses at the end of
  the two‑year period without having completed the required continuing education and training hours.
  Therefore, the salesperson may renew despite having completed none of the required hours. The
  other options incorrectly impose completion or proof requirements that apply only to active
  licensees.
