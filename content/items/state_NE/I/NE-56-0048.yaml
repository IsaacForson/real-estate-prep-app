stem: Two members of the Nebraska State Real Estate Commission submit a written request to the
  director asking that a meeting be called. According to the Act, what must the director do?
options:
  - Calling a meeting upon written request of two members
  - Calling a meeting only if the chairperson also agrees
  - Calling a meeting at the director's discretion
  - Calling a meeting when a majority of members request
key: A
explanation: Section 81-885.07(4) requires the director to call a meeting upon a written request of
  two or more members. Therefore, with two members' request, the director must call a meeting. The
  distractor 'Calling a meeting only if the chairperson also agrees' adds a condition not required
  by the statute.
citation:
  source: Neb. Rev. Stat. § 81-885.07(4)
  url: null
  quoted_text: The director shall call a meeting of the commission at the discretion of the director
    or upon the direction of the chairperson or upon a written request of two or more members of the
    commission.
