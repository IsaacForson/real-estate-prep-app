stem: The commission schedules a hearing for May 10. What is the latest date the commission may send
  the written notice of the hearing to the licensee?
options:
  - April 21
  - April 19
  - April 18
  - April 20
key: D
explanation: The statute requires the commission to notify the licensee at least twenty days prior
  to the date set for hearing. Counting back twenty days from May 10 gives April 20 as the latest
  permissible notice date. The distractor April 21 would provide only nineteen days notice,
  violating the requirement.
