stem: A complaint and notice of hearing were served on a licensee on April 1. What is the last day
  the licensee may file a sworn answer to the complaint?
options:
  - April 10.
  - April 15.
  - April 21.
  - April 30.
key: C
explanation: Under Neb. Rev. Stat. § 81-885.26, a licensee has twenty days from service of the
  complaint and notice to file a sworn answer. Service on April 1 gives a deadline of April 21
  (twenty days later). The other dates either fall short of or exceed the twenty‑day window.
