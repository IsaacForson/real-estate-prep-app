    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.26"
  url: null
  quoted_text: Within twenty days from the time of service of the complaint and notice the licensee
    may file his or her sworn answer thereto which shall contain all defenses which he or she
    intends to assert.
