stem: If the oral argument in a declaratory order proceeding is scheduled for June 15, what is the
  latest date the Agency may provide notice of the proceeding to the parties?
options:
  - June 7
  - June 9
  - June 8
  - June 10
key: C
explanation: The Agency must provide notice not less than seven (7) days in advance of the scheduled
  date. Seven days before June 15 is June 8, which is the latest permissible notice date. June 7 is
  earlier than required, while June 9 and June 10 would be less than seven days before the argument.
