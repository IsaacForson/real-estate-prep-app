stem: A licensee receives a complaint and notice of hearing on March 20. By what date must the
  licensee file a sworn answer to preserve all defenses?
options:
  - April 7
  - April 8
  - April 9
  - April 10
key: C
explanation: The statute allows the licensee to file a sworn answer within twenty days from the time
  of service of the complaint and notice. Counting twenty days from March 20 yields April 9 as the
  deadline. The distractor April 8 assumes only nineteen days, while April 10 would be twenty-two
  days after service.
