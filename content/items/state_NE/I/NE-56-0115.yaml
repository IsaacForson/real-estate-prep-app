stem: Under the Nebraska Real Estate License Act, how is a 'licensee' defined for purposes of
  continuing education requirements?
options:
  - A natural person who is licensed by the commission as a real estate broker or salesperson
  - A business entity that holds a real estate broker license issued by the commission
  - Any person who has completed the required continuing education hours
  - An individual who holds a subdivision certificate under the Act
key: A
explanation: The statute defines a licensee as a natural person licensed by the commission as a real
  estate broker or salesperson. This definition applies to the continuing education provisions in
  sections 81-885.49 through 81-885.54. The other options describe entities or conditions not
  matching the statutory definition.
