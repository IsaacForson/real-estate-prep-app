stem: A salesperson fails to pay the renewal fee by the November 30 deadline. What happens to the
  license on December 31 of that renewal year under the Nebraska Real Estate License Act?
options:
  - Automatic cancellation of the license
  - Placement on inactive status
  - Imposition of a monthly late fee
  - Permission to practice until June 30
key: A
explanation: Neb. Rev. Stat. § 81-885.14(3) states that failure to remit renewal fees when due
  automatically cancels the license on December 31 of the renewal year. Placement on inactive status
  or a late fee applies only if the licensee files a late renewal application before July 1, which
  is not the scenario described.
