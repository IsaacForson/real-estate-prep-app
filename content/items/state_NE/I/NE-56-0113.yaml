stem: If the Commission schedules an Order to Show Cause hearing for June 10, what is the latest
  date the notice may be sent?
options:
  - June 9
  - June 6
  - June 5
  - June 15
key: C
explanation: Notice must be given not less than five days before the hearing date. For a June 10
  hearing, the latest permissible notice date is five days prior, which is June 5. Sending notice on
  June 6 would be only four days before, violating the rule.
