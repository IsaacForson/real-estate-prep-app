stem: A developer obtained a subdivision certificate for a 150-lot subdivision but did not pay the
  annual fee due January 1. What is the effect under the Nebraska Real Estate License Act?
options:
  - The certificate is suspended until the fee is paid
  - The certificate remains valid pending commission investigation
  - The certificate is valid but subject to a late fee penalty
  - The certificate is automatically cancelled for nonpayment
key: D
explanation: The statute states that failure to remit annual fees when due shall automatically
  cancel the certificate. Therefore, nonpayment results in automatic cancellation, not mere
  suspension or continued validity pending investigation.
citation:
  source: Neb. Rev. Stat. § 81-885.36
  url: null
  quoted_text: Failure to remit annual fees when due shall automatically cancel such certificate, but
    otherwise such certificate shall remain in full force and effect if the commission determines
    from satisfactory investigation that such certificate should be renewed.
