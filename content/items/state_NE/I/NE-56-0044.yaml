stem: If a vacancy occurs on the Nebraska State Real Estate Commission, who is responsible for
  appointing a successor to serve the remainder of the term?
options:
  - Selected by the Governor
  - Selected by the Chair
  - Selected by the Director
  - Selected by the Counsel
key: A
explanation: The law states that the Governor shall fill any vacancy by appointing a member to serve
  during the unexpired term of the departing commissioner. The Chair, Director, or Counsel do not
  have this authority.
