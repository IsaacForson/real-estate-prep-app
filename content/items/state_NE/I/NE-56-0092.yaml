stem: A salesperson license applicant has finished two approved real estate courses totaling sixty
  class hours. What additional step must the applicant take to satisfy the education requirement
  under Neb. Rev. Stat. § 81-885.13(2)?
options:
  - Complete a third approved course of at least thirty class hours.
  - Submit proof of a high school equivalency certificate.
  - Pass the salesperson licensing examination.
  - Provide evidence of six hours of professional practice study.
key: A
explanation: The rule requires three approved courses totalling at least ninety class hours. Having
  only sixty hours leaves a deficit of thirty hours, so a third course of at least thirty class
  hours is needed. The other options address unrelated prerequisites.
