stem: Under Neb. Rev. Stat. § 81-885.06, which persons are permitted to institute an action or suit
  for recovery of compensation for acts that are prohibited under the Nebraska Real Estate License
  Act?
options:
  - Any licensed real estate broker acting alone.
  - Licensed brokers, associate brokers, or salespersons.
  - The State Real Estate Commission of Nebraska.
  - Any person who suffered damages due to the violation.
key: B
explanation: Under Neb. Rev. Stat. § 81-885.06, only licensed brokers, associate brokers, or
  salespersons may bring an action to recover compensation for acts prohibited by the Nebraska Real
  Estate License Act; all other persons are barred from recovery.
