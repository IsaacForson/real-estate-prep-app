stem: A person who, for a fee, helps a homeowner list their property for sale by advertising it and
  arranging showings, but does not hold a real estate license. Under the Nebraska Real Estate
  License Act, is this person considered a broker?
options:
  - Yes, only if they also collect rent from the property.
  - No, because they are not licensed under the Act.
  - No, because they did not negotiate a purchase contract.
  - Yes, because they are assisting in procuring prospects for compensation.
key: D
explanation: The definition of broker includes any person who, for compensation, assists in
  procuring prospects for the listing, sale, etc. Licensure status does not change whether the
  person meets the definition of broker. The other options are incorrect because they add conditions
  that are not required — such as needing a license, collecting rent, or negotiating a purchase
  contract — when the definition only requires assisting in procuring prospects for compensation.
citation:
  source: Neb. Rev. Stat. § 81-885.01(2)
  url: null
  quoted_text: any person who, for any form of compensation or consideration or with the intent or
    expectation of receiving the same from another, negotiates or attempts to negotiate the listing,
    sale, purchase, exchange, rent, lease, or option for any real estate or improvements thereon, or
    assists in procuring prospects or holds himself or herself out as a referral agent for the
    purpose of securing prospects for the listing, sale, purchase, exchange, renting, leasing, or
    optioning of any real estate
