stem: Which of the following brokers is **NOT** required to maintain a separate trust account under
  Neb. Rev. Stat. § 81-885.21(1)?
options:
  - An inactive broker with no trust account activity
  - An active broker holding earnest money deposits
  - An active broker who received a referral fee
  - An active broker with no trust account activity
key: A
explanation: Subsection (1) requires each broker other than an inactive broker to maintain a trust
  account, so inactive brokers are exempt. The option "An active broker holding earnest money
  deposits" is incorrect because such brokers must maintain a trust account for those funds.
