stem: "Under Neb. Rev. Stat. § 81-885.12(1), the requirement that a controlling interest holder bear
  a good reputation does **NOT** apply to an applicant who:"
options:
  - Will operate through a limited liability company with members
  - Will operate through a corporation with shareholders
  - Will operate through a partnership with shared liability
  - Will operate as a sole proprietor without partners
key: D
explanation: The key is correct because the controlling interest good reputation requirement only
  applies when the applicant will conduct business through a corporation, partnership, or limited
  liability company; a sole proprietorship is exempt from this requirement. The most tempting
  distractor, operating through a partnership, is incorrect because partnerships trigger the
  controlling interest reputation requirement.
citation:
