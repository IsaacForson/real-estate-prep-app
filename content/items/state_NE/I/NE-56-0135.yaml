stem: Under Neb. Rev. Stat. § 81-885.19(2), who may manage a branch office?
options:
  - The broker only manager
  - The associate broker only manager
  - The broker or an associate broker manager
  - Any licensed salesperson manager
key: C
explanation: The statute explicitly states that the broker or an associate broker shall be the
  manager of a branch office, so only those two roles qualify. The option "The broker only manager"
  is incorrect because an associate broker may also serve as manager.
