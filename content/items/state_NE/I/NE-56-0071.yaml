stem: A person wishes to intervene in a contested case hearing scheduled for May 10, 2025. What is
  the latest date they may file a petition for intervention with the Agency?
options:
  - May 3, 2025
  - May 5, 2025
  - May 4, 2025
  - May 6, 2025
key: B
explanation: The rule requires a petition for intervention to be filed at least five days before the
  hearing. Five days before May 10, 2025 is May 5, 2025, which is the latest permissible filing
  date. Filing on May 6 would be after the deadline, while May 4 and May 3 are earlier than required
  but not the latest allowable date.
