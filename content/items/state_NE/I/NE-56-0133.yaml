stem: Under Neb. Rev. Stat. § 81-885.06, which individual may bring an action to recover
  compensation for real estate services performed?
options:
  - The unlicensed administrative assistant who scheduled showings
  - The licensed salesperson who performed the services
  - The licensed broker's spouse who helped with paperwork
  - The customer who referred a client to the licensee
key: B
explanation: The key is correct because the statute allows recovery of compensation only by licensed
  brokers, associate brokers, or salespersons. The most tempting distractor, an unlicensed
  administrative assistant, is incorrect because the exception to the prohibition does not extend to
  unlicensed persons.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) 81-885.06
  url: null
  quoted_text: No action or suit shall be instituted, nor recovery be had, in any court of this state
    by any person for compensation for any act done or service rendered, the doing or rendering of
    which is prohibited under the Nebraska Real Estate License Act to other than licensed brokers,
    licensed associate brokers, or licensed salespersons.
