stem: A hearing officer receives an ex parte communication on Monday, May 5, 2025. By the end of
  which day must the hearing officer file the communication in the record with the Agency?
options:
  - Tuesday, May 6, 2025.
  - Wednesday, May 7, 2025.
  - Thursday, May 8, 2025.
  - Friday, May 9, 2025.
key: B
explanation: Under 002.03D, filing must be made within two working days of receipt. Counting two
  working days after Monday (excluding Monday) gives Tuesday as day one and Wednesday as day two, so
  the filing must be completed by the end of Wednesday. Choosing Tuesday, May 6, 2025, is incorrect
  because it only allows one working day.
