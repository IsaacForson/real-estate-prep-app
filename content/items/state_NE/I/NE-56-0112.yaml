stem: Under Nebraska Administrative Code Title 305, Chapter 4, what is the minimum notice period
  that must be given to a person before an Order to Show Cause hearing?
options:
  - At least ten (10) days
  - At least fifteen (15) days
  - At least five (5) days
  - At least twenty (20) days
key: C
explanation: The rule states that a person must be given not less than five (5) days' notice by
  approved mail methods before an Order to Show Cause hearing. Therefore, the minimum notice period
  is five days. The distractor of ten days is incorrect because it exceeds the required minimum.
