stem: What is the legal effect under the Nebraska Real Estate License Act if a person fails to
  comply with sections 81-885.33 through 81-885.39 when selling subdivision real estate?
options:
  - The commission may issue a cease and desist order, but the contract remains enforceable under
    the Nebraska Real Estate License Act
  - The subdivision certificate is automatically revoked without further proceedings if the annual
    fee is not paid by January 1
  - The licensee is subject to a civil fine of one hundred dollars per day for each day the
    violation continues under the Nebraska Real Estate License Act
  - The contract is void and unenforceable, and any money paid may be recovered with interest at six
    percent per annum
key: D
explanation: Under Neb. Rev. Stat. § 81-885.40, failure to comply with the subdivision sections
  renders the contract void and unenforceable, and any money paid may be recovered with six percent
  interest per annum. The distractor about a civil fine of $100 per day is incorrect because the Act
  does not specify such a daily fine for subdivision violations.
citation:
  source: Neb. Rev. Stat. § 81-885.40
  url: null
  quoted_text: Failure on the part of any person, partnership, limited liability company, or
    corporation to comply with sections 81-885.33 to 81-885.39 shall render any contract (1) entered
    into in this state or (2) arising out of contacts between the purchaser and subdivider within
    this state void and unenforceable, and any money paid under such contract to the subdivider,
    together with interest at the rate of six percent per annum from date of such payment, may be
    recovered in an action at law brought in the county where the cause of action or some part
    thereof arose.
