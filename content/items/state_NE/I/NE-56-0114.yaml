stem: A respondent receives a complaint on March 1 and fails to file an answer by the deadline. What
  may the Commission do?
options:
  - The Commission may accept the allegations as true and enter an order after a hearing
  - The Commission may dismiss the complaint immediately
  - The Commission may impose a civil fine of up to $1,000
  - The Commission may require the respondent to attend continuing education
key: A
explanation: If a respondent fails to timely file an answer, the Commission may accept the
  allegations of the complaint as true and, after notice and hearing, enter an order consistent with
  those allegations. The other options describe actions not authorized by this rule for a missed
  answer deadline.
