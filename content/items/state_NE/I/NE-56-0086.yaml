stem: Under the Nebraska Real Estate License Act, where must all civil fines collected pursuant to
  the Act be remitted?
options:
  - To the commission’s general operating fund account for license fees
  - To the Attorney General for enforcement actions statewide plus fees
  - To the State Treasurer for distribution under Article VII, section 5
  - To the county treasurer where the violation occurred plus interest and penalties
key: C
explanation: The statute requires that all civil fines collected under the Act be remitted to the
  State Treasurer for distribution according to Article VII, section 5 of the Nebraska Constitution.
  The distractor about the commission’s fund is incorrect because the law directs the money to the
  State Treasurer, not the commission’s operating account.
