stem: A salesperson applicant intends to operate through a limited liability company in which a
  single member holds 55% ownership and has a prior conviction for embezzlement. The applicant
  otherwise meets all qualification requirements. Based on Neb. Rev. Stat. § 81-885.12(1), what is
  the most likely outcome regarding the license?
options:
  - The license will be granted because the applicant’s personal reputation is satisfactory
  - The license will be granted pending a hearing to evaluate the member’s reputation
  - The license will be granted if the applicant signs a personal indemnity agreement
  - The license will be denied because the controlling member lacks a good reputation
key: D
explanation: The statute prohibits granting a license when the applicant conducts business through a
  corporation, partnership, or LLC unless any controlling stockholder, partner, or member bears a
  good reputation. The controlling member’s embezzlement conviction fails that requirement, so the
  license is denied. The other choices incorrectly assume the applicant’s own reputation or
  procedural remedies can overcome the controlling‑interest requirement.
citation:
  source: Neb. Rev. Stat. § 81-885.12(1)
  url: null
  quoted_text: No license shall be granted to an applicant who will be conducting business through a
    corporation, partnership, or limited liability company unless any stockholder, partner, or
    member having a controlling interest therein, if any, bears a good reputation for honesty,
    trustworthiness, and integrity.
