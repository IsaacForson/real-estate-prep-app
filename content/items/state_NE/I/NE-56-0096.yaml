stem: Under Neb. Rev. Stat. § 81-885.29, which of the following actions may the Nebraska Real Estate
  Commission take after determining a licensee has violated the Act or commission rules?
options:
  - Revoke or suspend the license, censure the licensee, or impose a civil fine
  - Issue a cease and desist order, assess a civil penalty, and require restitution
  - Require additional continuing education and place the licensee on probation
  - Refer the matter to the Attorney General for criminal prosecution
key: A
explanation: After finding a violation, the Nebraska Real Estate Commission may revoke or suspend
  the license, censure the licensee, or impose a civil fine under Neb. Rev. Stat. § 81-885.29.
  Actions such as issuing a cease and desist order, assessing a civil penalty, and requiring
  restitution are not authorized by this provision.
