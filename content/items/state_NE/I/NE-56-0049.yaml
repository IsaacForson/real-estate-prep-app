stem: Within how many days after filing a petition for a declaratory order must the Commission issue
  its declaratory order?
options:
  - 30 days
  - 45 days
  - 60 days
  - 90 days
key: C
explanation: The rule in 008.01 requires the Commission to issue the declaratory order within sixty
  days of filing the petition. The thirty‑day option reflects the timeframe for the Commission to
  take initial action on the petition under 005.02, not the issuance deadline.
