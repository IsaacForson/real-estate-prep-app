stem: After staying a suspension penalty and placing a licensee on probation for the suspension
  period, what occurs if the licensee satisfactorily completes the probation under Neb. Rev. Stat. §
  81-885.29?
options:
  - The license is revoked permanently
  - The licensee must pay an additional fine
  - The license is fully reinstated immediately
  - The licensee must retake the exam now
key: C
explanation: Under Neb. Rev. Stat. § 81-885.29, when a licensee successfully completes probation
  after a stayed suspension, the license is fully reinstated. The option stating that the license is
  fully reinstated immediately matches this rule. The other options add requirements such as
  permanent revocation, additional fines, or retaking the exam, which are not specified for
  satisfactory probation completion.
citation:
  source: Neb. Rev. Stat. § 81-885.29
  url: null
  quoted_text: The execution of a penalty of suspension may be stayed by the commission and the
    licensee may be placed on probation for the suspension period, after satisfactory completion of
    which his or her license shall be fully reinstated.
