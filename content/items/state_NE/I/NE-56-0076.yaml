stem: Under Neb. Rev. Stat. § 81-885.24, which of the following is expressly listed as an unfair
  trade practice?
options:
  - Advertising a property for sale or lease without the owner's written consent
  - Charging a referral fee to an out-of-state broker without disclosing it to the client
  - Failing to maintain a separate trust account for all money received by a broker
  - Providing a written closing statement to the buyer before the transaction closes
key: C
explanation: Under Neb. Rev. Stat. § 81-885.24(5), failing to maintain and deposit in a separate
  trust account all money received by a broker acting in such capacity is expressly listed as an
  unfair trade practice. Providing a written closing statement to the buyer before closing is not
  prohibited; it is a permissible practice. Charging a referral fee to an out‑of‑state broker
  without disclosure is addressed elsewhere and is allowed when proper conditions are met, not an
  unfair trade practice under this subsection. Advertising a property for sale or lease without the
  owner’s written consent is a required duty to obtain consent, not a prohibited act listed here.
citation:
