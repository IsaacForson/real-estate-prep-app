stem: A licensee is placed on probation after the commission stayed a suspension penalty. During the
  probation period, the licensee commits another violation of the Act. What is the consequence under
  Neb. Rev. Stat. § 81-885.29?
options:
  - The suspension penalty is immediately executed
  - License revocation is imposed immediately
  - The licensee receives only a warning
  - A new hearing is required before any penalty
key: A
explanation: Under Neb. Rev. Stat. § 81-885.29, a violation committed while on probation triggers
  the immediate execution of the previously stayed suspension penalty. The option claiming that
  license revocation is imposed immediately is incorrect because the statute does not provide for
  revocation in this circumstance; it only provides for the suspension penalty to take effect.
