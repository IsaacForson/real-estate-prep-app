stem: A licensee earned a commission of $3,200 on a transaction that is subject to a complaint
  alleging a violation of the Nebraska Real Estate License Act. What is the maximum civil fine the
  commission may impose for this complaint under the Act?
options:
  - $5,000
  - $3,200
  - $8,200
  - $1,000
key: A
explanation: The statute limits the civil fine to the greater of $5,000 or the commission earned on
  the transaction. Since $5,000 exceeds the $3,200 commission, the maximum fine is $5,000. The
  $3,200 option incorrectly ignores the $5,000 floor.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.10
  url: null
  quoted_text: The total civil fine for each complaint shall not exceed the greater of five thousand
    dollars or the total amount of commission earned by the licensee in each transaction that is
    subject to the complaint.
  secondary: []
math:
  worked_solution: |-
    Identify commission earned: $3,200.
    Statutory threshold: $5,000.
    Compare: $5,000 > $3,200.
    Maximum civil fine = $5,000.
  formulas:
    - max_fine = max($5,000, commission_earned)
