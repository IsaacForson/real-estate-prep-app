stem: A Nebraska licensee prepares a written broker's price opinion for a buyer but omits the
  required disclosure statement. According to the Nebraska Real Estate License Act, what is the
  effect on the licensee's ability to charge a fee for that opinion?
options:
  - The licensee may charge only a standard real estate commission and cannot collect a separate fee
    for the opinion.
  - The licensee may charge a fee if the opinion is provided to a lender for a federally related
    transaction.
  - The licensee may charge a separate fee as long as the opinion is signed and dated.
  - The licensee must refund any fee already collected and may not prepare further opinions.
key: A
explanation: The statute allows compensation other than a commission only when the opinion is in
  writing, signed, dated, and includes the required disclosure. Without the disclosure, the opinion
  does not meet the conditions for a separate fee, so the licensee may collect only the usual
  commission. The suggestion that a signature and date alone satisfy the fee rule is incorrect.
citation:
  source: "### Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.16"
  url: null
  quoted_text: No compensation, fee, or other consideration shall be charged for a broker's price
    opinion or comparative market analysis other than a real estate commission or brokerage fee
    charged or paid for brokerage services rendered in connection with the sale of the real estate
    involved unless the opinion or analysis is in writing, is signed by the preparer, includes the
    date on which it was prepared, and contains or has attached thereto the following disclosure
