stem: An applicant who is 18 years old and holds a high school diploma applies for a salesperson
  license. According to Neb. Rev. Stat. § 81-885.13(1)(a), what is the outcome?
options:
  - The license will be denied.
  - The license will be delayed.
  - The license will be issued.
  - The license will be revoked.
key: A
explanation: The statute states that no broker's or salesperson's license shall be issued to any
  person who has not attained the age of nineteen years. Since the applicant is only 18, the license
  must be denied. The distractor suggesting the license will be issued ignores the explicit age
  requirement.
