stem: Which licensee is exempt from maintaining Errors and Omissions insurance under Nebraska Admin.
  Code Title 299, Chapter 8?
options:
  - Active broker, no recent deals
  - Referral-only salesperson
  - An inactive broker
  - Active salesperson
key: C
explanation: Under Nebraska Admin. Code Title 299, Chapter 8, Section 001, every licensee must
  maintain Errors and Omissions insurance except an inactive broker or inactive salesperson.
  Therefore an inactive broker is exempt. An active broker who has not closed a transaction still
  holds an active license and must maintain coverage. An active salesperson, whether or not they
  also hold a property‑management license, must maintain coverage. A salesperson who works
  exclusively on referral basis remains an active licensee and is not exempt.
citation:
