stem: A licensee knowingly submits a false certificate of errors and omissions insurance coverage to
  the Nebraska Real Estate Commission. According to Neb. Admin. Code tit. 299, ch. 8, § 007, what
  sanction may the licensee face?
options:
  - The licensee faces automatic inactivation without notice
  - The licensee must pay a fine and complete education
  - The licensee receives a written warning and fine
  - The licensee is subject to suspension or revocation
key: D
explanation: Section 007 states that a willfully false certificate subjects the licensee to
  sanctions including suspension or revocation after a hearing. The distractor of automatic
  inactivation without notice misstates the provision, which requires notice and hearing.
citation:
  source: Neb. Admin. Code tit. 299, ch. 8, § 007
  url: null
  quoted_text: Any licensee who, acting alone or in concert with others, willfully or knowingly causes
    or allows a certificate of coverage to be filed with the Commission which is false, fraudulent,
    or misleading, shall be subject to sanctions, including but not limited to suspension or
    revocation of license, after complaint, notice, and hearing
