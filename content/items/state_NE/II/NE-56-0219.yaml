stem: An applicant for an active salesperson license has obtained written certification from the
  Group Plan Administrator confirming coverage under the Group Plan but has not yet filed a
  certificate of coverage with the Commission. According to Neb. Admin. Code tit. 299, ch. 8, § 005,
  what is the result?
options:
  - The applicant will be denied the license because no certificate was filed
  - The applicant must wait until the next renewal period to submit the certificate
  - The applicant must also file a certificate of equivalent coverage before the license can be
    issued
  - The applicant may be issued the active license because the written certification satisfies the
    requirement
key: D
explanation: Section 005 allows an active license to be issued if the applicant has been certified
  in writing by the Group Plan Administrator as being covered thereunder, without needing to file a
  certificate. Thus, the written certification alone satisfies the requirement. The distractors
  incorrectly impose additional filing or waiting requirements that are not mandated by the rule.
citation:
  source: Neb. Admin. Code tit. 299, ch. 8, § 005
  url: null
  quoted_text: Any applicant for issuance of an original license on active status or renewal of a
    license on active status shall not be issued such active license unless he or she has been
    certified in writing by the Group Plan Administrator as being covered thereunder, or unless he
    or she shall have first caused to be filed with the Commission the certificate of coverage
    required by Sections 001 and 002 of this Chapter.
