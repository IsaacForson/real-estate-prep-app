stem: A licensee began active duty in the armed forces on January 1, 2020 and was discharged on
  January 15, 2024. According to Neb. Admin. Code tit. 299, ch. 1, § 010, what must the licensee do
  to have the license reinstated?
options:
  - Submit proof of discharge within six months of discharge.
  - Retake and pass the current real estate examination before reinstatement.
  - Pay the renewal fee and complete continuing education.
  - Submit proof of discharge and wait for automatic reinstatement.
key: B
explanation: Because the discharge date (January 15, 2024) occurs after three years from the start
  of service (January 1, 2020), the licensee must satisfy all active-status requirements, including
  passing the current real estate exam, before reinstatement.
