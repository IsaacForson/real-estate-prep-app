stem: According to Neb. Admin. Code tit. 299, ch. 2, § 013.01, what must a broker disclose in
  writing prior to closing when providing only ministerial services?
options:
  - That the broker is only providing ministerial service and is not acting as an agent for either
    party.
  - That the broker will receive a commission upon successful closing of the transaction.
  - That the broker has obtained written consent from both parties to act as a dual agent.
  - That the broker will hold all earnest money in an escrow account until closing.
key: A
explanation: Under Neb. Admin. Code tit. 299, ch. 2, § 013.01, a broker who provides only
  ministerial services must disclose in writing that they are only providing that service and are
  not acting as an agent for either party.
