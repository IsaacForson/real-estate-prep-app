stem: According to Neb. Admin. Code tit. 299, ch. 8, § 003.03(a), what is the minimum combined
  single limit liability coverage for each occurrence that the Group Plan Errors and Omissions
  Insurance must provide?
options:
  - The coverage amount is $150,000 per occurrence
  - The coverage amount is $50,000 per occurrence
  - The coverage amount is $100,000 per occurrence
  - The coverage amount is $75,000 per occurrence
key: C
explanation: The rule states that the Group Plan must provide not less than $100,000.00 combined
  single limit liability coverage for each occurrence. Therefore, the correct amount is $100,000 per
  occurrence. The distractors of $50,000, $75,000, and $150,000 do not match the minimum specified
  in the regulation.
