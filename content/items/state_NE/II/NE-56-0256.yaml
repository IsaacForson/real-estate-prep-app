stem: A licensee’s salesperson license has been inactive for 14 months. The licensee wishes to renew
  the license without completing any continuing education. According to Neb. Rev. Stat. § 81-885.53,
  is this permissible?
options:
  - Yes, because inactive licensees are exempt from CE.
  - Yes, because the licensee has not exceeded the two-year limit.
  - No, because the commission requires CE only after three years.
  - No, because the licensee must complete CE before renewal.
key: D
explanation: The statute allows renewal without continuing education only at the end of the two‑year
  period. Since 14 months is less than 24 months, the licensee must fulfill the CE requirement
  before renewal. The distractor that claims exemption because the two‑year limit has not been
  exceeded misreads the provision.
