stem: If a licensee's Errors and Omissions Insurance policy is scheduled to expire on November 10,
  2024, what is the effective date of license inactivation under Neb. Admin. Code tit. 299, ch. 8, §
  006.01?
options:
  - November 10, 2024
  - October 10, 2024
  - November 9, 2024
  - November 11, 2024
key: A
explanation: Under Neb. Admin. Code tit. 299, ch. 8 § 006.01, the effective date of license
  inactivation is the date on which the Errors and Omissions Insurance policy is scheduled to
  expire. Therefore, if the policy expires on November 10, 2024, inactivation occurs on that date.
  The other dates are incorrect because inactivation does not shift a day earlier or later; the rule
  ties inactivation directly to the policy’s expiration date.
