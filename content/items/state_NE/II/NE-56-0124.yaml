stem: "A licensee entered active military service on March 1, 2021 and was discharged under
  honorable conditions on September 1, 2023. To be eligible for license reinstatement without
  retaking the exam, the licensee must submit the reinstatement application no later than:"
options:
  - March 1, 2024
  - September 1, 2023
  - March 1, 2025
  - September 1, 2024
key: A
explanation: The rule allows reinstatement without exam if the discharge occurs within three years
  of service start and the application is made within six months of discharge. Here, discharge is
  within three years of March 1, 2021, so the latest permissible application date is six months
  after September 1, 2023, which is March 1, 2024. The distractor “September 1, 2023” is incorrect
  because it is the discharge date, not the deadline for applying.
