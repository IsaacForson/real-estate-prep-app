stem: An individual, acting as attorney-in-fact under a duly executed power of attorney, sells a
  parcel of land on behalf of the owner who granted the power. According to the Nebraska Real Estate
  License Act, is this individual required to hold a real estate license?
options:
  - The individual is required to hold a real estate license.
  - The individual is exempt from licensing requirements.
  - The individual must renew an existing license.
  - The individual must obtain a temporary permit.
key: B
explanation: The statute expressly exempts an attorney in fact under a duly executed power of
  attorney to convey real estate from the licensing requirements. Consequently, the individual does
  not need a license to perform the sale. The distractor that asserts a license is required ignores
  this specific exemption.
