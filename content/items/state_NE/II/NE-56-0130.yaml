stem: An applicant submits a complete salesperson license application to the Nebraska Real Estate
  Commission on June 15, 2024. Assuming no further action, on what date will the application expire?
options:
  - The application will expire on July 15, 2025.
  - The application will expire on June 15, 2025.
  - The application will expire on May 15, 2025.
  - The application will expire on June 30, 2025.
key: B
explanation: Under the Nebraska Real Estate License Act, an application for a broker's or
  salesperson's license expires one year after the date of receipt in the commission office. Adding
  one year to June 15, 2024 yields June 15, 2025. The distractor offering May 15, 2025 incorrectly
  subtracts a month, while July 15, 2025 and June 30, 2025 incorrectly add a month or half‑month,
  respectively.
