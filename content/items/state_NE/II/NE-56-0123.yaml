stem: Under the Nebraska Real Estate License Act, how many days before a license renewal date must
  each licensee be notified of the minimum required errors and omissions insurance terms and
  conditions?
options:
  - 30 days
  - 45 days
  - 15 days
  - 60 days
key: A
explanation: The statute requires that each licensee be notified of the required errors and
  omissions insurance terms at least thirty days prior to the license renewal date. The distractor
  “15 days” is incorrect because it understates the required notice period.
