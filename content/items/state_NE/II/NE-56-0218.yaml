stem: A licensee covered under the Commission's Group Plan Errors and Omissions Insurance receives a
  notice from the insurance carrier stating that their policy will be cancelled effective next month
  due to a claim. According to Neb. Admin. Code tit. 299, ch. 8, § 003.02, what is the correct
  statement regarding the carrier's action?
options:
  - The carrier may cancel the policy after providing thirty days' notice
  - The carrier may cancel the policy only if the licensee fails to pay premiums
  - The carrier has no right to cancel the licensee's coverage
  - The carrier may cancel the policy if the licensee relocates to another state
key: C
explanation: The regulation provides that the group policy obtained by the Commission shall be
  available to all licensees with no right on the part of the carrier to cancel any licensee.
  Therefore, the carrier cannot cancel the licensee's coverage under any circumstance. The
  distractors suggesting cancellation rights are inconsistent with the rule.
