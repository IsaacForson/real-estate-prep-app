stem: What is the consequence if an applicant fails the required written examination for a broker or
  salesperson license under the Nebraska Real Estate License Act?
options:
  - Requirement to complete an additional thirty hours of continuing education
  - Grounds for denial of a license without further hearing
  - Automatic cancellation of the license on December 31 of the renewal year
  - Imposition of a fine not exceeding two hundred fifty dollars
key: B
explanation: Under Neb. Rev. Stat. § 81-885.13(6), failure to pass the required written examination
  is expressly grounds for denial of a license without further hearing. The most tempting
  distractor, automatic cancellation of the license, applies only to failure to remit renewal fees
  when due, not to exam failure.
