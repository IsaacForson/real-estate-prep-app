stem: On April 5, 2025, a broker changes her principal place of business from Omaha to Lincoln.
  According to Neb. Rev. Stat. § 81-885.20(1), by what date must the broker notify the commission in
  writing of this change?
options:
  - April 5, 2025
  - April 15, 2025
  - May 5, 2025
  - July 5, 2025
key: A
explanation: The statute requires the broker to forthwith notify the commission in writing of a
  change in place of business, which means notification must be made immediately, i.e., on the same
  day the change occurs. Therefore, the broker must notify the commission on April 5, 2025. The
  April 15, 2025 option is wrong because it delays notification beyond the forthwith requirement.
