stem: According to Neb. Rev. Stat. § 81-885.53, what is the maximum period of time an inactive
  licensee may go without completing continuing education before being eligible to renew the
  license?
options:
  - Six months
  - One year
  - Two years
  - Four years
key: C
explanation: The statute expressly states that inactive licensees may renew their licenses at the
  end of the two-year period without having completed the required continuing education hours.
  Therefore, the longest permissible gap is two years. The six‑month option is incorrect because the
  law sets a two‑year, not a six‑month, limit.
