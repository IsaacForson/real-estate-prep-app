stem: Within how many working days must the Nebraska Real Estate Commission send the inactivation
  notice to a licensee after the license is inactivated for failure to maintain errors and omissions
  insurance?
options:
  - 5 working days
  - 3 working days
  - 10 working days
  - 7 working days
key: A
explanation: Under Neb. Admin. Code tit. 299, ch. 8, § 006.02, the Commission must send the
  inactivation notice within five working days of the date of inactivation. The distractor of three
  working days understates the required period.
