stem: A licensee’s errors and omissions insurance policy is scheduled to expire on August 15, 2024.
  The licensee fails to renew the policy and does not file a new certificate. According to Neb.
  Admin. Code tit. 299, ch. 8, § 006.01, what is the effective date of the license’s inactivation?
options:
  - August 15, 2024
  - August 14, 2024
  - August 12, 2024
  - August 10, 2024
key: A
explanation: The rule provides that the effective date of inactivation is the date on which the
  errors and omissions insurance is scheduled to expire. Since the policy expires on August 15,
  2024, that is the inactivation date. The distractor of August 10 mistakenly subtracts five days,
  which is not required by the rule.
citation:
  source: Neb. Admin. Code tit. 299, ch. 8, § 006.01
  url: null
  quoted_text: For purposes of this Section, the effective date of inactivation shall be the date on
    which the Errors and Omissions Insurance of said active licensee is scheduled to expire, as
    reflected in the certification by the Group Plan Administrator or the certificate of equivalent
    coverage filed by, or on behalf of, the licensee.
