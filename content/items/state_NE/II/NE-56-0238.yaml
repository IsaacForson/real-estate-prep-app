stem: How is an associate broker defined under the Nebraska Real Estate License Act?
options:
  - A person who has a broker's license and is employed by another broker to participate in any
    activity described in subdivision (2) of this section
  - A person who holds a salesperson license and works independently to list and sell real estate
  - A person who has a broker's license and operates their own real estate business without
    supervision
  - A person who holds a salesperson license and is employed by a broker to participate in any
    activity described in subdivision (2) of this section
key: A
explanation: Under Neb. Rev. Stat. § 81-885.01(1), an associate broker is defined as a person who
  has a broker's license and is employed by another broker to participate in any activity described
  in subdivision (2) of this section. This matches the option stating that a person has a broker's
  license and is employed by another broker to participate in any activity described in subdivision
  (2) of this section. The option describing a salesperson who works independently to list and sell
  real estate is incorrect because it does not meet the statutory definition.
