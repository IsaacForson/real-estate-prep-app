stem: A licensee purchases an equivalent errors and omissions policy independent of the Commission's
  Group Plan. To satisfy the disclosure requirement under Neb. Admin. Code tit. 299, ch. 8, §
  004.01(b), what minimum combined single limit liability coverage must the policy specify for each
  occurrence?
options:
  - $300,000 annual aggregate
  - $50,000 per occurrence
  - $100,000 per occurrence
  - $150,000 per occurrence
key: C
explanation: Section 004.01(b) mandates that equivalent insurance specify not less than $100,000
  combined single limit liability coverage for each occurrence, making $100,000 the required
  minimum. The distractor "$300,000 annual aggregate" refers to the annual aggregate limit required
  by §004.01(c), not the per-occurrence limit.
