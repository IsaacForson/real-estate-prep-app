stem: An applicant for a Nebraska salesperson license states on the application that they have never
  been convicted of a crime, but they were convicted of misdemeanor theft two years ago. According
  to Neb. Rev. Stat. § 81-885.12(4), what is the likely outcome?
options:
  - The commission must approve the license because theft is not a felony
  - The commission may refuse the license based on the false statement
  - The commission must impose a fine but still issue the license
  - The commission must accept the application and issue the license
key: B
explanation: The statute provides that a false statement of material fact on an application may
  itself be sufficient ground for refusal of a license. Theft conviction is a material fact, and the
  false statement about it triggers this provision. The other options add consequences not stated in
  the statute.
