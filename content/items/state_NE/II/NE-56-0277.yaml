stem: An insurance carrier notifies a licensee that their Errors and Omissions policy will be
  non-renewed effective in five days, but does not send notice to the Director of the Nebraska Real
  Estate Commission. According to Neb. Admin. Code tit. 299, ch. 8, § 002, what is the correct
  statement regarding the carrier's action?
options:
  - The carrier is exempt from notice requirements if the non-renewal results from a filed claim.
  - The carrier must give the Director ten days prior written notice before non-renewal of the
    policy.
  - The carrier may proceed with the non-renewal because the licensee received notice.
  - The carrier can cancel the policy immediately if the licensee agrees in writing to the
    cancellation.
key: B
explanation: The rule states that coverage may not be terminated, cancelled, lapsed, or non-renewed
  without the insurer providing the Director with ten days prior written notice. Since the carrier
  gave only five days notice to the licensee and none to the Director, the non‑renewal is not
  effective until proper notice is given. The most tempting distractor, that the carrier may proceed
  because the licensee received notice, is incorrect because the notice must be directed to the
  Director, not the licensee.
