stem: A licensee renewing her active license has obtained equivalent Errors and Omissions insurance
  independently of the Group Plan. According to Neb. Admin. Code tit. 299, ch. 8, § 004.01(f), what
  must she do with the certificate of equivalent insurance to satisfy the renewal requirement?
options:
  - File it with the Nebraska Real Estate Commission
  - Submit it to her employing broker for approval
  - Keep it in her personal records for three years
  - Provide it to the Group Plan Administrator
key: A
explanation: The regulation requires that equivalent insurance be filed with the Commission to show
  compliance for license renewal. The other options describe actions not permitted by the rule for
  meeting the renewal requirement.
