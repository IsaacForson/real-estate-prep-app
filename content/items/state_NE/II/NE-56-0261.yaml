stem: A partnership applying for a Nebraska real estate broker license lists the name and address of
  each partner and the partnership's designated broker, but fails to provide the residence address
  of each partner. According to Neb. Rev. Stat. § 81-885.11(1)(a), what is the consequence?
options:
  - The application will require a fee to correct the omission
  - The application will be automatically granted a license
  - The application will be accepted because the designated broker is named
  - The application will be considered incomplete and may not be processed
key: D
explanation: The statute requires a partnership applicant to disclose the residence address of each
  member; omitting this information means the application lacks a required element and is therefore
  incomplete. The commission may not process an incomplete application. The other options either
  ignore the missing requirement or add penalties not specified.
