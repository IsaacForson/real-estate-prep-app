stem: A licensee obtains Errors and Omissions coverage through the Commission's Group Plan and
  receives written certification from the Group Plan Administrator. According to Neb. Admin. Code
  tit. 299, ch. 8, § 001, what must the licensee do to satisfy the certification requirement?
options:
  - Take no further action; the written certification satisfies the requirement
  - File a renewal application with the Nebraska Real Estate Commission
  - Notify the Nebraska Real Estate Commission via email of the coverage
  - Submit a certificate of coverage to the Nebraska Real Estate Commission
key: A
explanation: The rule provides that licensees covered under the Group Plan are deemed to have
  satisfied the certification requirement upon written certification from the Group Plan
  Administrator. Thus, no additional filing or action is needed. Submitting a certificate or
  notifying the Commission would be unnecessary.
