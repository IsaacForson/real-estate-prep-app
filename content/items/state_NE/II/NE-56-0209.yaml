  - 1 hour
  - 4 hours
  - 3 hours
key: D
explanation: The statute requires a nonresident applicant to provide proof of completion of a
  three-hour class approved by the commission specific to the Nebraska Real Estate License Act.
  Therefore, three hours is the correct requirement. The two‑hour option is incorrect because the
  law explicitly specifies three hours, not two.
