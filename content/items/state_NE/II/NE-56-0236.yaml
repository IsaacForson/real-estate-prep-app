stem: If the Group Plan Errors and Omissions Insurance provides a combined single limit liability
  coverage of $250,000 per occurrence, what is the maximum deductible allowed under Neb. Admin. Code
  tit. 299, ch. 8, § 003.03(c)?
options:
  - $5,000
  - $7,500
  - $6,500
  - $8,500
key: B
explanation: The maximum deductible is 3% of the combined single limit, so $250,000 × 0.03 = $7,500.
  The $6,500 distractor results from using 2.6% instead of the required 3%.
