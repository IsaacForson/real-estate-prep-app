stem: An applicant for a nonresident broker's license submits all required documents except the
  fingerprint card and criminal history check. According to Neb. Rev. Stat. § 81-885.17, what is the
  likely outcome?
options:
  - The commission will issue a temporary license pending the fingerprint results review
  - The commission will reject the application due to missing fingerprint check
  - The commission will issue the license after a background check waiver is granted
  - The commission will deny the license for failing to provide the fingerprint check
key: D
explanation: The statute mandates that every nonresident applicant undergo fingerprinting and a
  criminal history record check before a license can be issued. Failure to provide these documents
  means the statutory prerequisite is not met, so the commission must deny the license. The other
  options introduce waivers, temporary licenses, or processing without the check, none of which are
  authorized by the provision.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.17
  url: null
  quoted_text: An applicant for an original nonresident broker's or salesperson's license shall be
    subject to fingerprinting and a check of his or her criminal history record information
    maintained by the Federal Bureau of Investigation through the Nebraska State Patrol.
