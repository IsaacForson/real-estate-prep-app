stem: A licensee obtains an equivalent errors and omissions policy independently but does not submit
  the certificate of coverage to the Commission. What is the licensee required to do?
options:
  - The licensee must notify the Commission in writing only if a claim is filed
  - The licensee must pay the required fee to the Commission for the independent policy
  - The licensee must take no further action; the independent policy meets the requirement
  - The licensee must provide written certification of coverage to the Commission as prescribed in
    Section 002
key: D
explanation: The rule requires every licensee to have E&O insurance and to certify such coverage to
  the Commission in the prescribed manner. Assuming that merely having the policy satisfies the
  requirement without certification is incorrect.
citation:
  source: Neb. Admin. Code tit. 299, ch. 8, § 001
  url: null
  quoted_text: Every licensee under the Nebraska Real Estate License Act, except an inactive broker or
    inactive salesperson, shall have in effect a policy of Errors and Omissions Insurance to cover
    all activities contemplated under the Nebraska Real Estate License Act, and shall certify such
    coverage to the Commission in the form and manner prescribed in Section 002 of this Chapter.
