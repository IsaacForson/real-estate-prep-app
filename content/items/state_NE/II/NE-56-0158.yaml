stem: If a licensee's errors and omissions insurance is to be cancelled, how many days prior written
  notice must the insurance company provide to the Director of the Nebraska Real Estate Commission
  under Neb. Admin. Code tit. 299, ch. 8, § 002?
options:
  - 5 days
  - 15 days
  - 30 days
  - 10 days
key: D
explanation: Section 002 states that coverage may not be terminated without the insurer giving the
  Director ten (10) days prior written notice, so the required notice period is ten days. The
  distractor "5 days" incorrectly assumes a shorter notice period, which is not supported by the
  rule.
