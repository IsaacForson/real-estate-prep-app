stem: A licensee changes from associate broker to broker with the same employing broker. The
  commission charges a transfer fee of $52. According to Neb. Rev. Stat. § 81-885.20(3), is this fee
  permissible?
options:
  - No, because the fee exceeds the maximum allowed.
  - Yes, because transfer fees are waived for status changes.
  - Yes, because the fee is below the maximum allowed.
  - No, because transfer fees only apply to changes of employing broker.
key: A
explanation: Under Neb. Rev. Stat. § 81-885.20(3), a transfer fee may not exceed fifty dollars. The
  fee charged is $52, which is greater than the $50 limit, so the fee is not permissible.
