stem: A licensee begins active duty in the armed forces on January 1, 2023 and is discharged on June
  30, 2025. According to Neb. Admin. Code tit. 299, ch. 1, § 010, what is the latest date the
  licensee may submit an application for reinstatement of the license?
options:
  - June 30, 2026
  - December 30, 2024
  - December 30, 2025
  - January 30, 2026
key: C
explanation: The rule allows an application for reinstatement within six months of discharge; six
  months after June 30, 2025 is December 30, 2025. June 30, 2026 exceeds the six‑month window and is
  therefore incorrect.
