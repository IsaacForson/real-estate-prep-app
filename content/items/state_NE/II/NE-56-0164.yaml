stem: An applicant seeks a broker license through an LLC in which a member owning a controlling
  interest has a felony fraud conviction. Under Neb. Rev. Stat. § 81-885.12(1), what is the result?
options:
  - The license will be granted.
  - The license will be suspended.
  - The license will be denied.
  - The license will be revoked.
key: C
explanation: Under Neb. Rev. Stat. § 81-885.12(1), a license shall not be granted to an applicant
  conducting business through a corporation, partnership, or limited liability company unless any
  stockholder, partner, or member having a controlling interest bears a good reputation for honesty,
  trustworthiness, and integrity. Because the controlling‑interest member lacks that reputation due
  to the felony fraud conviction, the license must be denied. The distractor suggesting the license
  will be granted overlooks the controlling‑interest reputation requirement.
