stem: A licensee began active military service on January 1, 2020 and was discharged under honorable
  conditions on January 2, 2024. Assuming the licensee wants to have the license reinstated, what
  must the licensee do according to Neb. Admin. Code tit. 299, ch. 1, § 010?
options:
  - The licensee must submit a reinstatement application within six months of discharge.
  - The licensee must pay the renewal fee and complete continuing education.
  - The licensee must retake and pass the current real estate examination before the license can be
    reinstated.
  - The licensee must provide a photocopy of discharge papers showing honorable discharge.
key: C
explanation: Because the discharge date is after three years from the start of service, the licensee
  must meet all requirements for active status, including passing the current real estate exam,
  before reinstatement. The distractor about submitting an application within six months applies
  only if discharge is within three years.
