stem: What is the maximum annual fee the Nebraska Real Estate Commission may charge for a broker's
  branch office license?
options:
  - $25 per year.
  - $75 per year.
  - $50 per year.
  - $100 per year.
key: C
explanation: The statute authorizes the commission to set an annual fee for a branch office license
  that cannot exceed fifty dollars per license. Therefore the maximum permissible fee is $50 per
  year. Options suggesting $75 or $100 exceed this statutory limit and are incorrect.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.19
  url: null
  quoted_text: The commission shall issue a branch office license upon the payment of an annual fee to
    be established by the commission of not more than fifty dollars per license.
