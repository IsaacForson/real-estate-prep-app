stem: According to Neb. Rev. Stat. § 81-885.11(2), when does an application for a broker's or
  salesperson's license expire?
options:
  - One year after the date of receipt by the commission.
  - Six months after the date of receipt by the commission.
  - Two years after the date of receipt by the commission.
  - On the anniversary of the applicant's birth.
key: A
explanation: The statute states that an application for a broker's or salesperson's license shall
  expire one year after date of receipt in the commission office. Therefore, the correct expiration
  is one year after receipt. The other options propose incorrect time frames that are not supported
  by the text.
