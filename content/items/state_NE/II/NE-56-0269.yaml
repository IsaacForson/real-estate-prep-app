stem: A licensee's Group Plan Errors and Omissions Insurance policy has an annual aggregate limit of
  $400,000. According to Neb. Admin. Code tit. 299, ch. 8, § 003.03(b), how does this limit compare
  to the minimum required annual aggregate limit?
options:
  - Exactly meets the minimum required
  - Below the minimum required
  - Unrelated to the minimum requirement
  - Exceeds the minimum required
key: D
explanation: Neb. Admin. Code tit. 299, ch. 8 § 003.03(b) mandates that the annual aggregate limit
  be not less than $300,000. A policy limit of $400,000 is greater than this required minimum,
  making the choice that states the limit exceeds the minimum required correct. The choice stating
  the limit exactly meets the minimum is incorrect because the limit is higher than $300,000. The
  choice stating the limit is below the minimum is incorrect because $400,000 is above the required
  amount. The choice stating the limit is unrelated to the requirement is incorrect because the
  regulation directly sets a minimum for this limit.
