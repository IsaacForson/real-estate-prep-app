math:
  worked_solution: "Step 1: Identify the required minimum annual aggregate limit from Neb. Admin. Code
    tit. 299, ch. 8 § 003.03(b): $300,000. Step 2: Note the policy's actual limit: $400,000. Step 3:
    Calculate the difference: $400,000 - $300,000 = $100,000. Step 4: Since the actual limit
    ($400,000) is greater than the required minimum ($300,000), the limit exceeds the minimum."
