stem: A broker begins showing a property to a prospective buyer and discusses price and terms before
  any written purchase agreement is signed. According to Neb. Admin. Code tit. 299, ch. 2, § 013.02,
  what is the broker required to do?
options:
  - The broker must obtain a written agreement before taking any further actions
  - The broker must fulfill the applicable obligations of a broker to both parties as if already
    engaged
  - The broker must disclose in writing that they are only providing ministerial services
  - The broker must cease all activities until a written agreement is executed
key: B
explanation: The rule requires that when a broker participates in a transaction before a written
  agreement is entered into, the broker must fulfill the applicable obligations to both parties as
  if already engaged. The choice that the broker must obtain a written agreement before taking any
  further actions is incorrect because the rule does not mandate an agreement first.
citation:
  source: Neb. Admin. Code tit. 299, ch. 2, § 013.02
  url: null
  quoted_text: Whenever a broker participates in a real estate transaction before a written agreement
    has been entered into for the purchase, sale, or exchange of real estate, the broker must
    fulfill the applicable obligations of a broker to the seller and the buyer in accordance with
    the provisions of the Nebraska Real Estate License Act and the Rules of the Commission.
