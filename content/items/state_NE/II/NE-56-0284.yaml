stem: A licensee submits a renewal fee via check that is later returned unpaid by the bank.
  According to Neb. Rev. Stat. § 81-885.14(4), what is the consequence?
options:
  - Requirement to retake the licensing exam
  - Imposition of a $250 fine for submitting a returned check
  - Cause for revocation or denial of license
  - Placement on inactive status for a year
key: C
explanation: Section 81-885.14(4) states that a check returned unpaid or an electronic payment not
  accepted is cause for revocation or denial of license. The distractors describe consequences that
  apply to other violations, such as failure to maintain errors and omissions insurance (inactive
  status) or continuing education deficiencies.
citation:
  source: Neb. Rev. Stat. § 81-885.14(4)
  url: null
  quoted_text: Any check presented to the commission as a fee for either an original or renewal
    license or for examination for license which is returned to the State Treasurer unpaid or any
    electronic payment presented to the commission as a fee for either an original or renewal
    license or for examination for license that is not accepted against the commission shall be
    cause for revocation or denial of license.
