stem: An applicant for a salesperson license has been convicted of embezzlement in a state court.
  According to Neb. Rev. Stat. § 81-885.12(2), what is the likely outcome?
options:
  - The commission will grant the license because embezzlement is a minor offense.
  - The commission will refuse the license based on the conviction.
  - The commission will grant the license after the applicant completes additional education.
  - The commission will grant the license if the applicant pays a fine.
key: B
explanation: The statute provides that a conviction for embezzlement may in itself be sufficient
  ground for refusing a license. The other options incorrectly suggest the license would be granted
  despite the conviction.
