stem: A salesperson moves from Broker A to Broker B and pays a transfer fee of $45. According to
  Neb. Rev. Stat. § 81-885.20(3), what is the maximum amount the commission could have lawfully
  charged for this transfer?
options:
  - $40
  - $45
  - $55
  - $50
key: D
explanation: The law caps transfer fees at fifty dollars, so the highest permissible charge is $50.
  The $45 option reflects the amount actually paid, not the statutory maximum, while $55 exceeds the
  allowed limit. Therefore, $50 is the correct maximum lawful fee.
