stem: If a licensee does **NOT** have a certificate of errors and omissions insurance coverage on
  file with the commission, what action will the commission take?
options:
  - The commission will impose a fine of five hundred dollars for each day of noncompliance
  - The commission will require the licensee to complete additional continuing education hours
  - The commission will place the license on inactive status until the certificate is filed
  - The commission will automatically renew the license with a surcharge and require proof of
    coverage
key: C
explanation: The statute directs that when a licensee lacks the required certificate of coverage,
  the commission shall place the license on inactive status until the certificate is received. The
  distractor “The commission will require the licensee to retake the licensing exam” is incorrect
  because exam retesting is not the prescribed consequence for missing the certificate.
citation:
