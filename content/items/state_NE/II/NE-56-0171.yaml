stem: According to the Nebraska Real Estate License Act, what is the definition of an 'associate broker'?
options:
  - A person who has a salesperson license and is employed by a broker to participate in any
    activity described in subdivision (2) of this section.
  - A person who has a broker's license and supervises salespersons in performing any activity
    described in subdivision (2) of this section.
  - A person who has a broker's license and works independently to perform any activity described in
    subdivision (2) of this section.
  - A person who has a broker's license and is employed by another broker to participate in any
    activity described in subdivision (2) of this section.
key: D
explanation: The statute defines an associate broker as a person who holds a broker's license and is
  employed by another broker to participate in any activity described in subdivision (2) of the
  definition section. The distractor that mentions a salesperson license is incorrect because the
  definition requires a broker's license, not a salesperson license.
citation:
