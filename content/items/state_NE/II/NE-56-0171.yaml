    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.01
  url: null
  quoted_text: |-
    Associate broker means a person who has a broker's license and who is employed by
    another broker to participate in any activity described in subdivision (2) of this section
