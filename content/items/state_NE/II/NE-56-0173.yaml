stem: Which of the following is required for a group of licensees to be considered a 'team' under
  the Nebraska Real Estate License Act?
options:
  - They must be employed by the same broker.
  - They must work together on three transactions per year.
  - They must be designated by a team name.
  - They must share office space regularly.
key: C
explanation: Under Neb. Rev. Stat. § 81-885.01, a team consists of two or more licensees who work
  under the same broker's supervision, collaborate on real estate transactions, represent themselves
  to the public as a team, and are designated by a team name. Simply being employed by the same
  broker does not satisfy the team requirement because the rule requires supervision, not
  employment.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.01
  url: null
  quoted_text: Team means two or more persons licensed by the commission who (a) work under the
    supervision of the same broker, (b) work together on real estate transactions to provide real
    estate brokerage services, (c) represent themselves to the public as being part of a team, and
    (d) are designated by a team name;
