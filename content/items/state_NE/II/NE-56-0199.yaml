stem: According to Neb. Admin. Code tit. 299, ch. 2, § 012, which of the following would **NOT**
  cause a location to be considered a branch office of a real estate business?
options:
  - A licensee advertises only their home phone number and address in the white pages of the
    telephone directory.
  - A licensee leases a storefront, spends substantial time there showing listings, advertises a
    phone number where they can be reached, and keeps a desk, phone, and filing system at the
    location.
  - A licensee uses a model home as an office on a permanent basis, spends substantial time there
    transacting business, and advertises a contact number.
  - A licensee works from a home office, spends substantial time transacting business, and
    advertises a telephone number where they can be contacted for real estate business.
key: A
explanation: The rule states that advertising a home phone number and address in the white pages of
  the telephone directory does not count toward the branch office definition. Leasing a storefront,
  spending substantial time there showing listings, advertising a phone number where they can be
  reached, and keeping a desk, phone, and filing system at the location satisfies the criteria for a
  branch office. Using a model home as a permanent office, spending substantial time transacting
  business there, and advertising a contact number also meets the branch office criteria. Working
  from a home office, spending substantial time transacting business, and advertising a telephone
  number where they can be contacted for real estate business likewise fulfills the branch office
  requirements.
