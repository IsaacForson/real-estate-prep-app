  - Age of twenty-one years
  - Age of eighteen years
  - Age of nineteen years
key: D
explanation: The statute explicitly states that no broker's or salesperson's license shall be issued
  to anyone who has not attained the age of nineteen years. Therefore, nineteen years is the minimum
  age. The distractor stating eighteen years is incorrect because the law sets the threshold at
  nineteen, not eighteen.
