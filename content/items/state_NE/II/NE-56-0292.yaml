stem: A licensee sets up a desk in a model home to meet prospective buyers during a weekend open
  house. The model home is used as an office for two days. According to Neb. Admin. Code tit. 299,
  ch. 2, § 012, is this location considered a branch office of the licensee's real estate business?
options:
  - It is considered a main office
  - It is considered a satellite office
  - It is considered a branch office
  - It is not considered a branch office
key: D
explanation: Section 012 explicitly states that a model home utilized as an office on a temporary
  basis would not be considered a branch office. The scenario describes such a temporary use, so the
  location is not a branch office. The most tempting distractor is "It is considered a branch
  office" but the temporary model home exception excludes it from the branch office definition.
