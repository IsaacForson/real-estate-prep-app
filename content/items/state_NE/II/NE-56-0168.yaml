stem: According to the definition of 'broker' in Neb. Rev. Stat. §81-885.01(2), which of the
  following actions does **NOT** require a real estate license?
options:
  - Engaging in selling one's own residence without compensation or expectation of compensation
  - Engaging in selling one's own residence for a fixed commission fee on real property
  - Engaging in assisting a friend to sell their home in exchange for a gift card or other
    consideration
  - Engaging in providing a comparative market analysis for a fee to a prospective seller or buyer
key: A
explanation: The definition of broker requires compensation or the expectation of compensation.
  Selling one's own home without any compensation or expectation of compensation does not meet this
  definition, so no license is needed. The other options involve compensation or expectation
  thereof, thus constituting broker activity requiring a license.
