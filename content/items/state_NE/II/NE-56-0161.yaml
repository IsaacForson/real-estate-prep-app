stem: Which individual qualifies for the resident manager exemption under the Nebraska Real Estate
  License Act?
options:
  - A person who lives off‑site but manages rentals for the owner as an employee of a licensed
    broker.
  - A person who does not reside on the property but shows units to prospective tenants.
  - A person who resides on the property but only performs maintenance duties.
  - A person who lives on the apartment property and handles leasing activities as part of their job.
key: D
explanation: The resident manager exemption under the Nebraska Real Estate License Act applies only
  to a person who lives on the apartment property and performs leasing duties as part of their job.
  Neb. Rev. Stat. § 81-885.04 limits the exemption to resident managers who reside on the premises
  and are engaged in leasing activities in connection with their employment.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.04
  url: null
  quoted_text: Any person acting as the resident manager of an apartment building, duplex, apartment
    complex, or court, when such resident manager resides on the premises and is engaged in the
    leasing of property in connection with his or her employment
