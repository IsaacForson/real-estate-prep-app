stem: If the Group Plan Errors and Omissions Insurance provides a combined single limit liability
  coverage of $200,000 per occurrence, what is the maximum deductible allowed under Neb. Admin. Code
  tit. 299, ch. 8, § 003.03(c)?
options:
  - $2,000
  - $3,000
  - $4,000
  - $6,000
key: D
explanation: Under Neb. Admin. Code tit. 299, ch. 8, § 003.03(c), the deductible may not exceed 3%
  of the combined single limit. For a $200,000 limit, 3% equals $6,000, so the maximum allowable
  deductible is $6,000. The options listing $2,000, $3,000, and $4,000 are incorrect because they
  are below this maximum; the option listing $6,000 is correct.
