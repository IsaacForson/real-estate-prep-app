stem: An active-duty member of the U.S. Air Force is assigned to a permanent duty station in
  Nebraska and holds a valid real estate license from Colorado. When applying for a Nebraska broker
  license, what is the correct statement about the license fee?
options:
  - The applicant is exempt from paying the license fee.
  - The applicant must pay the full license fee.
  - The applicant must pay half the license fee.
  - The applicant may pay the license fee in installments.
key: A
explanation: The statute exempts from the license fee any active-duty service member assigned to a
  permanent duty station in Nebraska who is already duly licensed in another regulatory
  jurisdiction. Because the applicant meets both conditions, the fee is waived. The distractors
  requiring payment of the full or half fee, or allowing installment payments, are not supported by
  the exemption provision.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.14
  url: null
  quoted_text: Any applicant who is an active duty member of the armed forces of the United States or
    the spouse of such servicemember shall be exempt from payment of the license fee described in
    subsection (1) of this section if (a) such servicemember is assigned to a permanent duty station
    in Nebraska and (b) (i) the applicant is already duly licensed in another regulatory
    jurisdiction or (ii) the applicant was previously licensed in Nebraska within three years prior
