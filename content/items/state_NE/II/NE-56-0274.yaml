stem: A team’s group leader’s license is suspended. What must the team do?
options:
  - The team must designate a new leader and provide the name of the new group leader to the team's
    designated broker.
  - The team must dissolve and cease all real estate activities until the leader’s license is
    reinstated.
  - The team may continue using the same name if the leader is on probation suspension.
  - The team must pay a fine to the Nebraska Real Estate Commission before appointing a new leader.
key: A
explanation: Under Neb. Admin. Code tit. 299, ch. 2, § 014, the team must designate a new leader and
  provide that name to the designated broker. The option stating that the team may continue using
  the same name if the leader is on probation suspension is incorrect because the probation
  exception applies only to a team member whose name is used by the team, not to the leader.
