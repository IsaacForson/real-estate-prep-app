stem: An applicant for an original broker's license submits fingerprints to the Nebraska State
  Patrol for a national criminal history record check. Who is responsible for paying the actual cost
  of the fingerprinting and check?
options:
  - The Real Estate Commission
  - The applicant
  - The Federal Bureau of Investigation
  - The Nebraska State Patrol
key: B
explanation: The statute explicitly states that the applicant shall pay the actual cost, if any, of
  the fingerprinting and check of his or her criminal history record information. The Nebraska State
  Patrol processes the prints but does not bear the expense.
