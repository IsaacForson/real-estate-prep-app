stem: An individual helps a friend find a buyer for a residential property and receives a gift card
  as compensation for the introduction. Under the Nebraska Real Estate License Act, what is the
  legal status of this individual?
options:
  - An individual who is not required to be licensed because only a single act was performed
  - An individual who is exempt from licensing because the compensation was non-monetary
  - An individual who must obtain a broker, associate broker, or salesperson license before
    performing the act
  - An individual who may act as a referral agent without a license
key: C
explanation: Under the Nebraska Real Estate License Act, any person who performs a single act
  described in subdivision (2) of section 81-885.01 with the intention or promise of receiving any
  form of compensation is deemed a broker, associate broker, or salesperson and must be licensed.
  Receiving a gift card constitutes compensation, so the individual must be licensed. The claim that
  non‑monetary compensation exempts the individual from licensing is incorrect; any compensation
  triggers the requirement.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.03(1)
  url: null
  quoted_text: Any person who, directly or indirectly for another, with the intention or upon the
    promise of receiving any form of compensation or consideration, offers, attempts, or agrees to
    perform or performs any single act described in subdivision (2) of section 81-885.01, whether as
    a part of a transaction, or as an entire transaction, shall be deemed a broker, associate
    broker, or salesperson within the meaning of the Nebraska Real Estate License Act
