stem: Under the Nebraska Real Estate License Act, an application for a broker's or salesperson's
  license expires how many years after date of receipt?
options:
  - Two years
  - Six months
  - Thirty days
  - One year
key: D
explanation: The statute provides that an application for a broker's or salesperson's license shall
  expire one year after date of receipt in the commission office. Therefore, the correct period is
  one year. The distractor of six months incorrectly assumes a shorter expiration period not
  supported by the text.
