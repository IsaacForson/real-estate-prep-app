stem: A broker who opens a second office in another Nebraska city must obtain a branch office
  license. What is the fee characteristic for this branch office license?
options:
  - An annual fee set by the commission that cannot exceed fifty dollars.
  - A one‑time fee not exceeding fifty dollars paid when the license is issued.
  - A biennial fee of exactly fifty dollars determined by the legislature.
  - A monthly fee of up to five dollars collected by the employing broker.
key: A
explanation: Under Neb. Rev. Stat. § 81-885.19, the commission issues a branch office license after
  collecting an annual fee set by the commission that may not exceed fifty dollars. A one‑time fee
  not exceeding fifty dollars paid when the license is issued applies to transfer fees under
  §81-885.20(3), not to branch office licenses.
citation:
  source: Neb. Rev. Stat. § 81-885 et seq. — Nebraska Real Estate License Act, Neb. Rev. Stat. §§
    81-885 to 81-885.56 — NREC License Manual, Aug. 2026 ed. (OCR of scanned PDF) — § 81-885.19
  url: null
  quoted_text: The commission shall issue a branch office license upon the payment of an annual fee to
    be established by the commission of not more than fifty dollars per license.
