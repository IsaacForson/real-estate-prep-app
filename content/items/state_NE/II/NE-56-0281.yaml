stem: A licensee enters active duty in the armed forces after obtaining her salesperson license and
  serves for two years. Upon discharge, what must she do to be eligible for reinstatement of her
  license according to Neb. Admin. Code tit. 299, ch. 1, § 010?
options:
  - Maintain errors and omissions insurance during service
  - Complete continuing education during active service
  - Pay the renewal fee before the discharge date
  - Submit proof of discharge within six months of discharge
key: D
explanation: Section 010 states that to be eligible for reinstatement after military service, the
  licensee must apply for reinstatement within six months of discharge and provide proof of
  discharge. The correct option reflects this requirement. The most tempting distractor is "Complete
  continuing education during active service" but §010 exempts licensees from continuing education
  during the period of service, so it is not required for reinstatement.
