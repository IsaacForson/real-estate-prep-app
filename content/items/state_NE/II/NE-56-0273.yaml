stem: For a corporation applying for a Nebraska real estate broker license, which of the following
  must be disclosed on the application according to Neb. Rev. Stat. § 81-885.11(1)(a)?
options:
  - The name and address of each principal officer, the name of the corporation's designated broker,
    and the name under which the business will be conducted
  - The name and address of each shareholder, the corporation's designated broker, and the
    business's tax identification number
  - The name and address of each officer, the corporation's designated broker, and the date of
    incorporation
  - The name and address of each director, the corporation's designated broker, and the
    corporation's annual revenue
key: A
explanation: The statute requires a corporation applicant to disclose the name and address of each
  principal officer, the corporation's designated broker, and the name under which business will be
  conducted. The option that lists shareholders instead of principal officers is incorrect because
  the rule requires principal officers, not shareholders.
