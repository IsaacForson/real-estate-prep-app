stem: Under the Nebraska Real Estate License Act, what is the licensing status of a resident manager
  of an apartment building who resides on the premises and is engaged in leasing property in
  connection with his or her employment?
options:
  - The resident manager is required to hold a salesperson license.
  - The resident manager is subject to continuing education requirements.
  - The resident manager is required to hold a broker license.
  - The resident manager is exempt from licensing requirements.
key: D
explanation: The statute exempts any person acting as a resident manager of an apartment building
  who resides on the premises and is engaged in leasing property in connection with employment from
  the licensing requirements. Therefore, such a resident manager does not need a real estate
  license. The distractors incorrectly impose licensing or continuing education obligations that the
  statute does not apply to this exemption.
citation:
