stem: A licensee holds an inactive salesperson license. According to Neb. Admin. Code tit. 299, ch.
  8, § 001, what is the licensee’s status regarding Errors and Omissions Insurance?
options:
  - The licensee must file a certificate of coverage
  - The licensee must maintain an active policy
  - The licensee must obtain equivalent insurance
  - The licensee is exempt from the requirement
key: D
explanation: Under Neb. Admin. Code tit. 299, ch. 8, § 001, inactive salespersons are exempt from
  the Errors and Omissions Insurance requirement, so they do not need to maintain a policy or file a
  certificate. Therefore, the option stating that the licensee is exempt from the requirement is
  correct. The other options incorrectly impose a requirement.
citation:
  source: Neb. Admin. Code tit. 299, ch. 8, § 001
  url: null
  quoted_text: Every licensee under the Nebraska Real Estate License Act, except an inactive broker or
    inactive salesperson, shall have in effect a policy of Errors and Omissions Insurance to cover
    all activities contemplated under the Nebraska Real Estate License Act, and shall certify such
    coverage to the Commission in the form and manner prescribed in Section 002 of this Chapter.
