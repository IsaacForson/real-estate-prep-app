stem: A licensee’s active license was inactivated on March 1, 2024 for failure to maintain errors
  and omissions insurance. Assuming no state holidays, what is the last date the licensee may file a
  certificate of coverage to have the license reactivated retroactive to the inactivation date?
options:
  - April 1, 2024
  - March 31, 2024
  - February 29, 2024
  - March 30, 2024
key: B
explanation: Regulations allow reactivation relating back to the inactivation date if a certificate
  is filed within thirty days of inactivation. March 1 plus thirty days is March 31, 2024. The March
  30 distractor reflects filing one day early, which would still be valid but is not the last
  permissible date.
