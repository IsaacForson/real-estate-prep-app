stem: A licensee’s active salesperson license was inactivated on April 10, 2024 for failure to file
  an Errors and Omissions insurance certificate. The licensee files a certificate showing equivalent
  coverage in effect on and from the date of inactivation, together with required fees, on May 5,
  2024. According to Neb. Admin. Code tit. 299, ch. 8, § 006.03, what is the effective date of the
  license’s reactivation?
options:
  - Effective May 5, 2024 (date of license inactivation)
  - Effective April 10, 2024 (date the certificate was filed)
  - Effective May 5, 2024 (date the certificate was filed)
  - Effective April 10, 2024 (date of license inactivation)
key: D
explanation: Section 006.03 provides that if a certificate shows coverage in effect on and from the
  date of inactivation and is filed within thirty days, the license is reactivated relating back to
  the date of inactivation. Thus the effective date is April 10, 2024. Filing on May 5, 2024 alone
  does not determine the reactivation date.
citation:
  source: Neb. Admin. Code tit. 299, ch. 8, § 006.03
  url: null
  quoted_text: Any licensee whose license has been subject to inactivation pursuant to this Section
    shall be entitled to activation of said license, relating back to and including the date of
    inactivation, provided that, within thirty days of the date of inactivation, the licensee or
    Group Plan Administrator files with the Commission a certificate of coverage showing that such
    coverage has been and is currently in effect on and from the date of inactivation
