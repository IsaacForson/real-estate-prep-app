stem: An applicant was convicted of a felony six years ago, completed the sentence, and was released
  from confinement five years ago. The applicant has not been convicted of any offense since.
  According to Sec. 5-25(b)(2) of the Illinois Real Estate License Act of 2000, is the applicant
  eligible for a license?
options:
  - Yes, because more than five years have passed since the conviction and no subsequent conviction
    has occurred.
  - No, because the applicant must wait five years after release from confinement before applying.
  - No, because fewer than five years have elapsed since the conviction and a subsequent conviction
    would be required.
  - Yes, because more than three years have passed since release from confinement and the conviction
    is non‑violent.
key: A
explanation: The rule requires that either five years since the felony conviction or three years
  since release, whichever is later, have passed without a subsequent conviction. Here six years
  have passed since conviction (later than five years since release) with no subsequent conviction,
  so the applicant is eligible.
