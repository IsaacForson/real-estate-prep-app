stem: An applicant was convicted of a felony four years ago, has not been convicted since, and has
  completed all sentence requirements. Under Sec.5-25(b)(2), what is the effect on the applicant's
  eligibility for a license?
options:
  - The applicant remains ineligible regardless of rehabilitation, restitution, or any mitigating
    factors.
  - The applicant is eligible only if the offense is unrelated to the duties of a real estate
    licensee.
  - The applicant is not automatically eligible because the five‑year threshold has not been met
    without a subsequent conviction.
  - The applicant is automatically eligible for a license because more than three years have passed
    since the felony conviction.
key: C
explanation: The rule requires that either five years since a felony conviction or three years since
  release, whichever is later, must have passed without a subsequent conviction for automatic
  eligibility. Four years is insufficient, so the applicant is not automatically eligible.
