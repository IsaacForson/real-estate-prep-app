stem: A broker receives their first broker license on October 1, 2024, and the next broker renewal
  deadline is March 31, 2025. Assuming the license was received within 180 days of that renewal
  deadline, by what date must the broker complete the required 45 hours of post-license education
  and pass all three course examinations?
options:
  - March 31, 2025
  - March 31, 2026
  - September 30, 2025
  - October 1, 2026
key: B
explanation: Those who receive a first broker license within 180 days preceding the next renewal
  deadline must complete the post‑license education and pass the exams prior to the second broker
  renewal deadline that follows receipt of the license (see subsection 5-50(b)). The second renewal
  deadline after an October 1, 2024 license is March 31, 2026. The distractor September 30, 2025
  incorrectly assumes a six‑month grace period rather than the statutory second‑deadline rule.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) § 5-50(b)
  url: null
  quoted_text: Individuals whose first license is that of a broker received on or after the effective
    date of this amendatory Act of the 101st General Assembly, must complete all three 15-hour
    courses and successfully pass a course final examination for each course prior to the date of
    the next broker renewal deadline, except for those individuals who receive their first license
    within the 180 days preceding the next broker renewal deadline, who must complete all three
    15-hour courses and successfully pass a course final examination for each course prior to the
    second broker renewal deadline that follows the receipt of their license.
