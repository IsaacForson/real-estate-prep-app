stem: Under Section 5-70(b) of the Illinois Real Estate License Act of 2000, what is the minimum
  number of continuing education hours a managing broker or broker must complete for license
  renewal?
options:
  - 6 hours
  - 24 hours
  - 12 hours
  - 18 hours
key: C
explanation: The statute explicitly states that each person applying for renewal must successfully
  complete 12 hours of real estate continuing education courses. This is the baseline requirement
  unless an exemption applies. The distractor of 6 hours likely confuses the core curriculum’s
  fair‑hour minimum with the total requirement.
