stem: A limited liability company seeks a broker license. One member actively participates in real
  estate activities and holds a broker license. The other member does not participate in real estate
  activities but had their broker license suspended by the Department six months ago and is
  currently barred from practice. According to the Act, what is the result for the LLC’s license
  application?
options:
  - The LLC’s license application will be denied due to the nonparticipating member’s prior
    discipline
  - The LLC’s license application will be granted after the nonparticipating member files an
    affidavit of nonparticipation
  - The LLC’s license application will be granted because the participating member holds a broker
    license
  - The LLC’s license application will be denied only if neither member holds a broker license
key: A
explanation: Under 5‑15(d), an LLC cannot be licensed if any nonparticipating member has been
  publicly disciplined and is currently barred from practice, regardless of affidavits. The
  distractor about filing an affidavit is wrong because discipline overrides that requirement.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) — § 5-15(d)
  url: null
  quoted_text: No limited liability company shall be granted a license if any nonparticipating member
    or manager has previously been publicly disciplined by the Department resulting in that licensee
    being currently barred from real estate practice because of a suspension or revocation.
