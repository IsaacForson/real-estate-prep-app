stem: A licensee tells a prospective buyer that they will represent the buyer in purchasing a home
  and will receive a commission if the transaction closes. No written agreement is signed. Under the
  Illinois Real Estate License Act of 2000, what is the status of this arrangement?
options:
  - The arrangement is a valid brokerage agreement because compensation is promised
  - The arrangement is valid as an oral agreement under the statute of frauds exception
  - The arrangement is invalid because brokerage agreements must be in writing
  - The arrangement is valid only if the buyer later signs a written agreement
key: C
explanation: The arrangement is invalid because the Illinois Real Estate License Act requires all
  brokerage agreements to be in writing (225 ILCS 454/1-10). Since no written agreement exists, the
  promise of a commission does not create a valid brokerage agreement. The claim that promising
  compensation alone makes the arrangement valid is incorrect because the writing requirement is not
  satisfied.
