stem: Under the Illinois Real Estate License Act of 2000, what must a licensee do regarding their
  license while engaging in real estate activity?
options:
  - Carry the license or an electronic version on their person
  - Submit a copy of the license to the Department annually
  - Keep the license in a secure, locked file at home
  - Display the license prominently at their place of business
key: A
explanation: The Act explicitly requires each licensee to carry the license or an electronic version
  on their person (see subsection 5-50(e)). The most tempting distractor, displaying the license at
  the place of business, is not mandated by the Act for individual licensees.
