stem: What is the purpose of the residential leasing agent license under the Illinois Real Estate
  License Act of 2000?
options:
  - To allow holders to engage in property management only.
  - To allow holders to engage only in residential leasing activities.
  - To allow holders to engage in any real estate activity.
  - To allow holders to engage in commercial leasing only.
key: B
explanation: The purpose of the residential leasing agent license is to permit holders to engage
  only in residential leasing activities (225 ILCS 454/5-5(a)). The option stating that holders may
  engage in property management only is incorrect because the license does not cover property
  management. The option stating that holders may engage in any real estate activity is incorrect
  because the license is limited to residential leasing, not all real estate activities. The option
  stating that holders may engage in commercial leasing only is incorrect because the license
  pertains to residential leasing, not commercial leasing.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) — § 5-5
  url: null
  quoted_text: The purpose of this Section is to provide for a limited scope license to enable persons
    who wish to engage in activities limited to the leasing of residential real property for which a
    license is required under this Act, and only those activities, to do so by obtaining a license
    under this Section.
