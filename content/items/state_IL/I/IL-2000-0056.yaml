stem: A corporation seeks a broker license. Two of its officers actively participate in real estate
  activities but only one holds a managing broker license. According to the Act, what must the
  corporation do to be eligible for the license?
options:
  - The corporation must dissolve and reapply as a partnership under department supervision
  - The corporation must ensure both officers hold managing broker or broker licenses
  - The corporation must have the unlicensed officer submit an affidavit of nonparticipation
  - The corporation must replace the unlicensed officer with a licensed broker
key: B
explanation: Section 5-15(b) requires every officer who actively participates in the corporation's
  real estate activities to hold a managing broker or broker license. Having the unlicensed officer
  submit an affidavit of nonparticipation is only permissible for nonparticipating officers, not
  those who actively participate.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) — § 5-15
  url: null
  quoted_text: No corporation shall be granted a license or engage in the business or capacity, either
    directly or indirectly, of a broker, unless every officer of the corporation who actively
    participates in the real estate activities of the corporation holds a license as a managing
    broker or broker
