stem: Under Section 5-15(b) of the Illinois Real Estate License Act of 2000, what must every officer
  of a corporation who actively participates in the corporation's real estate activities hold?
options:
  - A managing broker or broker license
  - A residential leasing agent license
  - A managing broker license only as required
  - A broker license only as required
key: A
explanation: The Illinois Real Estate License Act of 2000 requires that any officer of a corporation
  who actively participates in the corporation's real estate activities hold either a managing
  broker license or a broker license. The law does not limit the officer to only a managing broker
  license; a broker license also satisfies the requirement. Therefore, the answer that states the
  officer must hold a managing broker or broker license is correct. The answer that says the officer
  must hold only a managing broker license is incorrect because it excludes the broker license
  option. The answers that mention a residential leasing agent license or that limit the license to
  only as required are incorrect because they do not match the statutory requirement.
