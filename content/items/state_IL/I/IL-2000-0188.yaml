stem: "A sponsoring broker enters into a written agreement with a buyer client, naming one of its
  affiliated licensees as the agent for that client. According to the Act, this arrangement is best
  described as:"
options:
  - A designated agency relationship
  - A dual agency relationship
  - An exclusive brokerage agreement
  - A non-exclusive brokerage agreement
key: A
explanation: "The Real Estate License Act of 2000 defines designated agency in Section 1-10 as a
  contractual relationship between a sponsoring broker and a client where one or more licensees
  associated with the broker are designated as the client’s agent. In the scenario, the sponsoring
  broker has a written agreement with the buyer client and names an affiliated licensee as the
  agent, which matches this definition. The other choices do not fit: a dual agency relationship
  would involve the same licensee representing both buyer and seller in the same transaction; an
  exclusive brokerage agreement refers to the type of contract between broker and client, not the
  designation of a specific licensee as agent; and a non-exclusive brokerage agreement similarly
  describes the breadth of the broker‑client contract, not the appointment of a particular licensee
  as the client’s agent."
citation:
