stem: A broker licensed in another state has been actively practicing real estate brokerage for 18
  months in that state. They apply for an Illinois broker license under the endorsement provisions.
  According to the Act, what additional requirement must they satisfy?
options:
  - Complete 45 hours of post-license broker education
  - Have been actively practicing for at least 2 years
  - Pass a test on Illinois specific real estate brokerage laws
  - Provide an official statement from the licensing authority
key: A
explanation: The endorsement rule requires brokers with less than two years of practice in the other
  state to complete the 45‑hour post‑license broker education. The other options are either always
  required or describe the condition that triggers the requirement.
