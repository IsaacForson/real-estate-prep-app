stem: A civilian employee of the General Services Administration sells a federally owned building
  while performing official duties. According to the Illinois Real Estate License Act of 2000, does
  the employee need a broker license to conduct this sale?
options:
  - The employee must obtain a broker license before the sale.
  - The employee is exempt from the broker license requirement for this sale.
  - The employee must hold a managing broker license to conduct the sale.
  - The employee may act only if sponsored by an Illinois broker.
key: B
explanation: The statute exempts any officer or employee of a federal agency acting in the conduct
  of official duties from the broker license requirement. Therefore, the GSA employee is exempt and
  does not need a license. The option stating that the employee must obtain a broker license before
  the sale is incorrect because it imposes a license requirement that the exemption explicitly
  removes.
