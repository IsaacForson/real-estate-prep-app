stem: "Under the Real Estate License Act of 2000, a managing broker whose license expired while on
  active duty with the U.S. Armed Forces may renew the license without paying lapsed renewal fees or
  completing continuing education if:"
options:
  - The licensee must pay all outstanding lapsed renewal fees before the Department will consider
    the renewal request for processing.
  - The licensee must complete the required continuing education coursework before submitting the
    renewal application to the Department.
  - The licensee must wait until the next regular renewal period to submit a renewal application and
    pay any required fees.
  - The licensee must furnish satisfactory evidence of service and termination under honorable
    conditions within 2 years after service ends.
key: D
explanation: The statute allows renewal without fees or continuing education if the licensee
  provides satisfactory evidence of service and honorable termination within two years after the
  service ends. The option about completing continuing education is incorrect because the exemption
  expressly waives that requirement.
