stem: What is the purpose of the residential leasing agent license under Section 5-5 of the Illinois
  Real Estate License Act of 2000?
options:
  - To provide a limited scope license for persons engaging only in residential leasing activities
    requiring a license under the Act.
  - To authorize holders to conduct residential leasing and sales activities for compensation, as
    defined by the Act.
  - To exempt individuals from licensing requirements when managing their own property, unless
    acting for a third party.
  - To allow unlicensed persons to lease residential property under broker supervision, provided the
    broker sponsors them.
key: A
explanation: Section 5‑5(a) of the Illinois Real Estate License Act states that the purpose of the
  section is to provide a limited‑scope license for persons who wish to engage only in residential
  leasing activities that require a license. Therefore, the license is limited to leasing
  residential real property and does not permit sales activities, does not allow unlicensed persons
  to act under broker supervision, and does not exempt owners who manage their own property from
  licensing when they act for a third party. The only option that reflects this limited‑scope
  purpose is the statement that the license is for persons engaging only in residential leasing
  activities requiring a license.
citation:
