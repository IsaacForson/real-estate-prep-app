stem: A licensee holds escrow funds for a residential sale and, prior to closing, disburses the
  funds to the seller following written instructions signed by both the buyer and seller. Under the
  Illinois Real Estate License Act of 2000, is this disbursement permissible?
options:
  - The disbursement is permissible because disbursement followed written principals' direction
  - The disbursement is impermissible because the licensee must obtain verbal approval from the
    principals
  - The disbursement is impermissible because escrow funds must remain on deposit until termination
  - The disbursement is impermissible because only a court order may authorize early disbursement
key: A
explanation: The disbursement is allowed because it follows the written direction of the principals,
  which is an express exception to the rule that escrow must remain on deposit until termination or
  court order. The other options incorrectly require verbal approval, a court order, or indefinite
  retention.
citation:
  source: "### 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of
