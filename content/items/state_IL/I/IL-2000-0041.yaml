stem: Under the Real Estate License Act of 2000, which statement correctly defines a blind advertisement?
options:
  - An advertisement that includes the sponsoring broker's complete business name and lists the
    broker's license number.
  - An advertisement that does not include the sponsoring broker's complete business name or, for
    electronic ads, lacks a direct link to all required disclosures.
  - An advertisement that is used only for hiring licensees and must display the broker's phone
    number and must also show the broker's office address.
  - An advertisement that must be approved by the Real Estate Administration and Disciplinary Board
    before publication and must be filed with the state licensing division.
key: B
explanation: A blind advertisement is any real estate advertisement used by a licensee for the sale,
  lease, licensed activity, or hiring that fails to include the sponsoring broker's full business
  name, and for electronic ads must provide a direct link to a display containing all required
  disclosures. The correct statement reflects this definition, while the other statements add
  requirements that are not part of the statutory definition.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) § 1-10
  url: null
  quoted_text: "\"Blind advertisement\" means any real estate advertisement that is used by a licensee
    regarding the sale or lease of real estate, licensed activities, or the hiring of any licensee
    under this Act that does not include the sponsoring broker's complete business name or, in the
    case of electronic advertisements, does not provide a direct link to a display with all the
    required disclosures."
