stem: An education provider renews its license but fails to submit the required list of courses to
  be offered. Under 225 ILCS 454/30-15(f) and (h), what action may the Department take?
options:
  - The Department must automatically suspend the education provider's license
  - The Department may refuse renewal or discipline the provider for good cause
  - The Department is required to impose a fine of $500 per missing course
  - The Department must require the provider to submit the course list
key: B
explanation: Subsection (f) requires submission of a course list at renewal, and subsection (h)
  provides that failure to comply with any requirement is good cause, allowing the Department to
  refuse renewal or impose discipline. The statute does not mandate automatic suspension or a
  specific fine amount.
