stem: What is the definition of a "Blind advertisement" under the Illinois Real Estate License Act
  of 2000?
options:
  - An advertisement that includes the sponsoring broker's complete business name
  - An advertisement that does not include the sponsoring broker's complete business name
  - An advertisement that is only used for hiring licensees
  - An advertisement that must be printed in a newspaper
key: B
explanation: The Illinois Real Estate License Act defines a blind advertisement as any real estate
  advertisement used by a licensee that does not include the sponsoring broker’s complete business
  name (or, for electronic ads, a direct link to the required disclosures) (225 ILCS 454/1‑10).
  Consequently, the option stating that the advertisement does not include the sponsoring broker’s
  complete business name matches the statutory definition. The option stating that the advertisement
  includes the broker’s complete business name describes the opposite situation and is therefore
  incorrect. The options that require a newspaper format or that limit the ad to hiring licensees
  add conditions that are not part of the definition, so they are also incorrect.
citation:
