stem: An applicant passes the broker examination and receives a license from the Department but
  begins showing properties to prospective buyers before submitting a sponsorship registration.
  According to the Act, is this permissible?
options:
  - The applicant’s actions are permissible because the license is already issued
  - The applicant’s actions are permissible if the applicant informs the sponsoring broker verbally
  - The applicant’s actions are impermissible because a valid sponsorship must be registered before
    engaging in licensed activities
  - The applicant’s actions are impermissible only if the applicant receives compensation for the
    showings
key: C
explanation: The Act prohibits any applicant from engaging in licensed activities until a valid
  sponsorship is registered with the Department, as stated in 5‑27(c). The distractor suggesting the
  license alone suffices ignores this sponsorship prerequisite.
