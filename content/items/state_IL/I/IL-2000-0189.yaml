stem: "A licensee represents both the buyer and the seller in the same residential transaction, with
  no designated agency involved. According to the Act, this is:"
options:
  - A dual agency relationship
  - A designated agency relationship
  - An exclusive brokerage agreement
  - A non-exclusive brokerage agreement
key: A
explanation: The definition of dual agency in Sec 1-10 is an agency relationship in which a licensee
  represents both buyer and seller or both landlord and tenant in the same transaction. The scenario
  matches this definition. A designated agency relationship requires a contractual designation by
  the sponsoring broker, which is absent in the scenario.
