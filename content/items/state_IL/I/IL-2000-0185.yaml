stem: A residential leasing assistant begins showing apartments for rent on March 1 under the
  supervision of a sponsoring broker who has notified the Department. The assistant enrolls in the
  required pre-license education course on April 20. Assuming all other requirements are satisfied,
  on what date must the assistant obtain a residential leasing agent license to continue leasing
  activities?
options:
  - June 28
  - June 30
  - July 1
  - May 31
key: A
explanation: The 120‑day period begins March 1 and ends on June 28; after that date the assistant
  must be licensed to continue leasing activities. June 30 and July 1 exceed the 120‑day limit, and
  May 31 falls short of the full period.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) — § 5-5(d)
  url: null
  quoted_text: a person may engage in residential leasing activities for which a license is required
    under this Act, for a period of 120 consecutive days without being licensed, so long as the
    person is acting under the supervision of a sponsoring broker, the sponsoring broker has
    notified the Department that the person is pursuing licensure under this Section, and the person
    has enrolled in the residential leasing agent pre-license education course no later than 60 days
    after beginning to engage in residential leasing activities.
