stem: A pre-license instructor completes their two-year licensure period without teaching any core
  curriculum course. Under 225 ILCS 454/30-25(c), what is the effect on the instructor's license
  renewal?
options:
  - The instructor cannot renew the license until the requirement is satisfied
  - The instructor may renew the license after completing a refresher course
  - The instructor must retake the initial licensing examination
  - The instructor is automatically granted a one-year extension
key: A
explanation: Subsection (c) mandates that pre-license instructors teach at least one core curriculum
  course during the licensure period as a requirement for renewal; failure to do so means the
  instructor cannot renew the license. The statute does not allow renewal via a refresher course,
  retest, or automatic extension.
