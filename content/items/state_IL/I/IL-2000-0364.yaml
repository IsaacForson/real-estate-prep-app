stem: "A licensee places an online advertisement for a residential property that includes only the
  licensee's name and phone number, with no mention of the sponsoring broker's business name or a
  link to required disclosures. Under the Illinois Real Estate License Act of 2000, this
  advertisement is:"
options:
  - It is permissible because the licensee disclosed the property details to the public.
  - It is a blind advertisement because it omits the sponsoring broker's name and disclosure link.
  - It is permissible if the licensee is acting as a residential leasing agent for the owner.
  - It is not an advertisement because it lacks the sponsoring broker's identification.
key: B
explanation: The Act defines a blind advertisement as any electronic advertisement that does not
  include the sponsoring broker's complete business name or does not provide a direct link to a
  display with all required disclosures. The described online ad lacks both, making it a blind
  advertisement. The other options incorrectly assert permissibility or mischaracterize the nature
  of the communication.
