stem: A licensee decides to end their sponsorship with their current sponsoring broker. Under 68
  Ill. Adm. Code §1450.115(b), within how many hours must the licensee notify the Division of this
  termination?
options:
  - 48 hours
  - 72 hours
  - 24 hours
  - 14 days
key: C
explanation: When a licensee initiates termination, they must notify the Division within 24 hours of
  the termination. The 14‑day option is incorrect because that period applies to name change
  notifications, not termination notifications.
