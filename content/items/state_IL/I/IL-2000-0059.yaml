stem: A sponsored licensee who owns a condominium wishes to place a newspaper advertisement offering
  the unit for sale, using only her own name in the ad. She has provided the required written
  disclosure of her ownership interest to prospective buyers. Under the Illinois Real Estate License
  Act of 2000, is this advertisement permissible?
options:
  - The advertisement is permissible because the licensee owns the property and has disclosed
    ownership interest
  - The advertisement is not permissible because sponsored licensees are prohibited from advertising
    under their own name
  - The advertisement is permissible only if the advertisement also includes the sponsoring broker's
    business name
  - The advertisement is not permissible because the sponsoring broker's business name must be used
    regardless of ownership
key: A
explanation: Under Sec. 10-30(d)(2), a sponsored licensee may advertise under their own name when
  selling or leasing real estate owned by the licensee after providing appropriate written
  disclosure of ownership interest. Therefore the advertisement is permissible. The option claiming
  a blanket prohibition is incorrect because the statute provides an exception for owner‑licensees
  who have disclosed their interest.
