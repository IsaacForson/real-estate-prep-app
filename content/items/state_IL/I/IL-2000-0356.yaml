stem: "Under the Illinois Real Estate License Act of 2000, a licensee may disclose confidential
  information obtained from a client without violating the Act if:"
options:
  - When the licensee considers the information over one year old.
  - When the client permits disclosure of the information by word or conduct.
  - When the licensee has obtained a written waiver from the client.
  - When the licensee believes the information is no longer sensitive.
key: B
explanation: The Act permits disclosure of confidential information only when the client authorizes
  it by word or conduct, when disclosure is required by law, or when the information becomes public
  from another source. The other options describe situations not authorized by the statute.
