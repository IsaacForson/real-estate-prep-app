stem: "A licensee receives a referral fee from another broker for directing a client to that
  broker's listing. According to the Act, this referral fee is considered:"
options:
  - Compensation, as it is valuable consideration given for the performance of a service.
  - A salary supplement that may only be paid by the licensee's sponsoring broker.
  - A gift that must be reported to the Department within 30 days.
  - A prohibited kickback because it is not tied to a closed transaction.
key: A
explanation: The statute defines compensation to include referral fees as valuable consideration
  given for the performance of some activity or service. Therefore, a referral fee received for
  directing a client is compensation under the Act. The other options mischaracterize the nature of
  referral fees or impose restrictions not found in the definition.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) § 1-10
  url: null
  quoted_text: '"Compensation" means the valuable consideration given by one person or entity to
    another person or entity in exchange for the performance of some activity or service.
    Compensation shall include the transfer of valuable consideration, including without limitation
    the following: (1) commissions; (2) referral fees; (3) bonuses; (4) prizes; (5) merchandise; (6)
    finder fees; (7) performance of services; (8) coupons or gift certificates; (9) discounts; (10)
    rebates; (11) a chance to win a raffle, drawing, lottery, or similar game of chance not
    prohibited by any other law or statute; (12) retainer fee; or (13) salary.'
