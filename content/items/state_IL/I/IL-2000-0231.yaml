stem: A licensee whose sponsoring broker's license has been suspended by the Department continues to
  conduct showings for prospective buyers. Under the Illinois Real Estate License Act of 2000, what
  is the licensee's status and ability to engage in licensed activities?
options:
  - The licensee is inactive but may continue with written consent
  - The licensee is active but must obtain a new sponsor within 30 days
  - The licensee is inactive and must cease licensed activities
  - The licensee is active and may continue showing properties
key: C
explanation: The licensee becomes inactive when the sponsoring broker’s license is suspended, which
  means the licensee holds a current license but is prohibited from engaging in any licensed
  activity. Therefore the licensee must stop conducting showings. There is no grace period; the
  inactive status takes effect immediately. (See 225 ILCS 454/§ 1-10).
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) — § 1-10
  url: null
  quoted_text: '"Inactive" means a status of licensure where the licensee holds a current license
    under this Act, but the licensee is prohibited from engaging in licensed activities because the
    licensee is unsponsored or the license of the sponsoring broker with whom the licensee is
    associated or by whom the licensee is employed is currently expired, revoked, suspended, or
    otherwise rendered invalid under this Act.'
