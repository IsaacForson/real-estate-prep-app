stem: Under the Illinois Real Estate License Act of 2000, when may a licensee lawfully disburse
  escrow moneys prior to the consummation or termination of a transaction?
options:
  - The licensee may disburse escrow moneys when the principals' written direction is followed
  - The licensee may disburse escrow moneys when verbal approval obtained from the principals
  - The licensee may disburse escrow moneys when escrow account has been inactive for 30 days
  - The licensee may disburse escrow moneys when licensee personally approves the disbursement
key: A
explanation: The Act permits disbursement of escrow funds before closing only when done in
  accordance with the written direction of the principals or their duly authorized agents. Verbal
  approval, account inactivity, or the licensee’s personal approval do not satisfy this statutory
  exception.
