stem: Which condition must a resident lessee meet to qualify for the exemption under Sec.5-20(10)?
options:
  - Discussing lease terms or conditions of the rental with prospective lessees.
  - Receiving compensation up to five thousand dollars or two months' rent in any 12‑month period.
  - Referring no more than three prospective lessees to the owner or agent in any 12‑month period.
  - Showing the residential dwelling unit to prospective lessees without the owner's consent.
key: C
explanation: The statute exempts a resident lessee who refers no more than three prospective lessees
  in any 12‑month period, among other requirements. The other options either describe prohibited
  acts or misstate the compensation limit.
