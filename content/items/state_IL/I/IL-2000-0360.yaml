  url: null
  quoted_text: The Department shall provide to the sponsoring broker a notice of renewal for all
    sponsored licensees by mailing the notice to the sponsoring broker's address of record, or, at
    the Department's discretion, emailing the notice to the sponsoring broker's email address of
    record.
