stem: A licensee receives a referral fee from a mortgage lender after referring a buyer client to
  that lender for financing. Under Section 10-10(b) of the Illinois Real Estate License Act, what
  must the licensee disclose to the client regarding this fee?
options:
  - Disclose that the licensee received a referral fee from the mortgage lender as a source of
    compensation from a third party.
  - Disclose the exact amount of the referral fee received from the mortgage lender and any other
    fees charged to the client.
  - Disclose the mortgage lender's name, the loan terms offered to the client, and any associated
    closing costs.
  - Disclose that the licensee has no ownership interest in the mortgage lender and receives no
    other compensation.
key: A
explanation: Section 10-10(b) mandates disclosure of all sources of compensation related to the
  transaction received from a third party, such as a referral fee from a mortgage lender. Disclosing
  only the exact amount of the referral fee received from the mortgage lender and any other fees
  charged to the client does not satisfy the requirement to reveal the source of compensation.
