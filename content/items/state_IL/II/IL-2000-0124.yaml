stem: A licensee receives an earnest money deposit from a buyer while acting as a broker. Under Sec.
  20-20(a)(17) of the Illinois Real Estate License Act, where must the licensee deposit the earnest
  money?
options:
  - The licensee must deposit the earnest money in the broker's general business operating account.
  - The licensee must deposit the earnest money in the licensee's personal checking account.
  - The licensee must deposit the earnest money in a savings account earning interest for the
    licensee.
  - The licensee must deposit the earnest money in a special account separate from personal and
    other business accounts.
key: D
explanation: Subsection (a)(17) requires licensees to maintain and deposit all escrow moneys in a
  special account separate from personal and other business accounts, unless interest is required by
  law or specifically requested in writing by the principals. The other options describe prohibited
  commingling or interest-bearing accounts not meeting the requirement.
