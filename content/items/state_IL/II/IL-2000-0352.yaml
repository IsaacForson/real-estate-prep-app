stem: A licensee instructs an unlicensed assistant to deposit an earnest money check but does not
  obtain approval from the designated managing broker before the assistant makes the deposit. Under
  68 Ill. Adm. Code 1450.740, what is the consequence?
options:
  - The licensee violated the Act by allowing an unlicensed assistant to deposit earnest money
    without managing broker approval
  - The licensee is not in violation because the rules permit unlicensed assistants to deposit
    earnest money
  - The licensee must return the earnest money to the buyer and notify the managing broker of the
    deposit
  - The unlicensed assistant may face disciplinary action for depositing earnest money without
    managing broker approval
key: A
explanation: The rule requires managing broker approval for depositing earnest money; lacking
  approval means the licensee has violated the Act by permitting the unlicensed assistant to perform
  the activity. The other options either wrongly assert no violation, impose unrelated duties, or
  incorrectly assign liability to the assistant.
