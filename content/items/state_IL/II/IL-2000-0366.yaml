stem: Under the Act, a licensee whose broker license expired while on active duty with the Armed
  Forces may renew without paying lapsed renewal fees and without completing continuing education if
  they furnish satisfactory evidence of service and termination within what time frame after
  termination?
options:
  - Six months after termination
  - One year after termination
  - Two years after termination
  - Five years after termination
key: C
explanation: Under 225 ILCS 454 § 5-50(d), a licensee whose license expired while on active duty may
  renew without paying lapsed fees or completing continuing education if they furnish satisfactory
  evidence of service and termination within two years after the service ends. The two‑year window
  is expressly stated in the statute. The one‑year distractor is incorrect because the law specifies
  two years, not one.
