stem: The Division plans to inspect the non-public areas of a sponsoring broker's office. How much
  advance notice must the Division provide to the broker before conducting such an inspection under
  Illinois administrative rule?
options:
  - No notice is required
  - At least 24 hours' notice
  - At least 48 hours' notice
  - At least 12 hours' notice
key: B
explanation: The rule states that the Division, with at least 24 hours' notice, may conduct a visual
  and physical inspection of non-public areas. Therefore, 24 hours' notice is required.
citation:
  source: 68 Ill. Adm. Code 1450 — 68 Ill. Adm. Code Part 1450 — Real Estate License Act of 2000 rules
    (entire part; official ilga.gov JCAR page read via Internet Archive capture of 2025-08-20
    because ilga.gov refuses connections from this environment) — § 1450.920
  url: null
  quoted_text: The Division, with at least 24 hours' notice, may conduct a visual and physical
    inspection of the non-public areas of a sponsoring broker's office and interview any person,
    including any licensee or non-licensee, who may have knowledge or information about the
    licensee's real estate practice, with or without the consent of either the sponsoring broker or
    designated managing broker.
