stem: A managing broker who is also a licensed real estate appraiser prepares a broker price opinion
  for a seller. According to Illinois administrative rule, what must the managing broker include on
  the initial page of the broker price opinion?
options:
  - The appraiser's license number and the broker's name.
  - The managing broker's name and license number as required.
  - The appraiser's and managing broker's license numbers.
  - The managing broker need not include a license number.
key: B
explanation: "Under 68 Ill. Adm. Code §1450.790(a), a managing broker who is also a licensed
  appraiser must include the managing broker's name and license number on the initial page of a
  broker price opinion. The option stating 'The managing broker's name and license number as
  required.' matches this requirement. The other options are incorrect: one adds the appraiser's
  license number, another omits the managing broker's license number, and the third claims no
  license number is needed."
citation:
  source: 68 Ill. Adm. Code 1450 — 68 Ill. Adm. Code Part 1450 — Real Estate License Act of 2000 rules
    (entire part; official ilga.gov JCAR page read via Internet Archive capture of 2025-08-20
    because ilga.gov refuses connections from this environment) — § 1450.790
  url: null
  quoted_text: An individual who is a licensed managing broker or broker and also a licensed appraiser
    as set forth in the Real Estate Appraiser Licensing Act of 2002 [ 225 ILCS 458] must include the
    broker's or managing broker's name and license number, not the appraiser's license number, on
    the initial page of the broker price opinion or comparative market analysis.
