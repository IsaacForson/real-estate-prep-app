stem: A partnership applying for a broker license has a nonparticipating partner who has not
  submitted the required affidavit. What must the partnership do to comply with the Act?
options:
  - Replace the partner with a licensed broker
  - Submit an affidavit of nonparticipation for that partner
  - Provide a written statement of intent not to participate
  - Proceed without the affidavit if the partner does not engage
key: B
explanation: Under 5-15(c), all nonparticipating partners must submit affidavits of nonparticipation
  to the Department. The partnership cannot satisfy the requirement with a mere statement of intent
  or by proceeding without the affidavit. Submitting the proper affidavit brings the partnership
  into compliance.
