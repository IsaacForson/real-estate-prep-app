stem: A licensee fails to complete the required continuing education hours before the renewal
  deadline and receives a citation. The licensee does not request a hearing within 30 days after the
  citation is served. What happens next regarding the fine?
options:
  - The licensee's license is suspended and a hearing is scheduled.
  - A non-disciplinary order is entered and the fine is due within 30 days.
  - The Department must refund the fine if the licensee later completes education.
  - The fine is automatically waived by the Department after review.
key: B
explanation: If a cited licensee does not request a hearing within 30 days after the citation is
  served, a final non-disciplinary order is entered and any fine imposed is due and payable within
  30 days after the entry of that order. Thus the fine becomes due within 30 days after the order is
  entered. The distractor claiming the fine is waived is incorrect because the rule provides for
  payment, not waiver.
