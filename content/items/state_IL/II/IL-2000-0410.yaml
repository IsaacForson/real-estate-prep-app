stem: According to 68 Ill. Adm. Code 1450.740(a), what type of activities may a licensee utilize
  unlicensed assistants for?
options:
  - Administrative, clerical, or personal activities
  - Negotiating commission splits or referral fees
  - Preparing legal documents for court proceedings
  - Showing property to prospective buyers
key: A
explanation: The rule explicitly permits licensees to use unlicensed assistants for administrative,
  clerical, or personal activities that do not require a license. Showing property, negotiating
  commissions, and preparing legal documents are licensed activities that unlicensed assistants may
  not perform.
