stem: A licensee receives a referral fee from an unlicensed acquaintance who introduced a buyer
  client to the licensee. Under 68 Ill. Adm. Code 1450.780(a), is the licensee permitted to accept
  the fee?
options:
  - Yes, because the acquaintance made an actual introduction
  - Yes, as long as the licensee discloses the fee to the client
  - No, because the person receiving the fee must be duly licensed
  - No, unless the acquaintance is a principal to the transaction
key: C
explanation: The rule requires that anyone receiving a referral fee be duly licensed; an unlicensed
  acquaintance does not meet this requirement, so the fee cannot be accepted. The suggestion that
  acceptance is permissible because the acquaintance made an actual introduction is incorrect
  because an introduction alone does not override the licensing requirement. The idea that
  acceptance is allowed if the licensee discloses the fee to the client is incorrect because
  disclosure does not cure the lack of licensure. The claim that acceptance is prohibited unless the
  acquaintance is a principal to the transaction is incorrect because the rule does not contain a
  principal exception.
citation:
