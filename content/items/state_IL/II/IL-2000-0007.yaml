stem: A broker sponsored by Firm A wants to pay part of a commission directly to a licensee
  sponsored by Firm B for helping close a sale. Under the Act, is that payment allowed?
options:
  - Yes, so long as both licensees agree to the split amount before closing occurs
  - No, a licensee may not pay another broker's licensee directly for the work
  - Yes, provided the payment is reported to the Division within ten business days
  - No, unless the buyer signs a written waiver permitting the direct commission split
key: B
explanation: The statute forbids a licensee from paying compensation directly to a licensee
  sponsored by another sponsoring broker for the performance of licensed activities.
