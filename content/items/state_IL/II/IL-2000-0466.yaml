stem: A property manager receives monthly rent from a tenant and forwards it to the property owner
  under a written management agreement. According to 68 Ill. Adm. Code 1450.750(a)(2), how should
  these rent moneys be classified?
options:
  - As escrow moneys requiring deposit in an escrow account.
  - As non-escrow moneys exempt from escrow account requirements.
  - As personal funds held by the sponsoring broker.
  - As security deposits held under the management agreement.
key: B
explanation: The rule explicitly states that rent moneys paid to a licensee for transmittal to the
  licensee's client under a written agreement are not considered escrow moneys. Thus, they are
  exempt from escrow account requirements. The option stating that rent moneys are escrow moneys
  requiring deposit in an escrow account is incorrect because the rule classifies such rent moneys
  as non‑escrow moneys exempt from escrow account requirements.
