stem: A sponsoring broker fails to keep copies of disclosures after a transaction closes. Which
  requirement of 68 Ill. Adm. Code 1450.755(c) is violated?
options:
  - The requirement to retain copies of all disclosures
  - The requirement to use electronic signatures in disclosures
  - The requirement to obtain consent for electronic delivery
  - The requirement to provide disclosures in writing
key: A
explanation: The rule mandates that copies of all disclosures must be retained by the sponsoring
  broker; failing to keep such copies directly violates this retention duty. The obligation to use
  electronic signatures is unrelated to the retention requirement.
