stem: A licensee directs an unlicensed assistant to conduct property showings for prospective
  buyers. Under 68 Ill. Adm. Code 1450.740, what is the consequence?
options:
  - The licensee is in violation of the Act
  - The assistant may receive a commission for showings
  - The activity is permissible under supervision
  - The assistant must obtain a license before showing
key: A
explanation: The rule states that any licensee who permits an unlicensed assistant to perform
  licensed activities such as showing property is in violation of the Act. Showing property is
  expressly prohibited for unlicensed assistants.
