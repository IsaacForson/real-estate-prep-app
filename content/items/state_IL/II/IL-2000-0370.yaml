stem: A sponsoring broker discovers that escrow records for the previous three years were destroyed
  in a flood. According to Illinois administrative rule, what action must the broker take within 48
  hours of discovering the loss?
options:
  - Replace the lost records with new electronic copies
  - Notify the Division's enforcement division of the loss
  - Submit a written request to the Division for an extension
  - File a police report and notify local authorities for the incident
key: B
explanation: The rule requires the broker to report the loss to the Division's enforcement division
  within 48 hours. Replacing records or filing a police report are not the mandated first step.
