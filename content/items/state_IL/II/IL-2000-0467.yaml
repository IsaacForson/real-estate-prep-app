stem: A sponsoring broker deposits personal funds into an escrow account to avoid service charges,
  documents the amount as for service charges, and ensures the deposit does not exceed the minimum
  balance required by the bank to avoid fees. Under 68 Ill. Adm. Code 1450.750(b)(5), is this
  permissible?
options:
  - The deposit is not permissible unless the principals to the transaction request it in writing.
  - The deposit is permissible because it is documented and does not exceed the minimum required.
  - The deposit is permissible as long as the broker earns interest on the deposit and the amount is
    documented.
  - The deposit is not permissible because personal funds may be deposited only to earn interest.
key: B
explanation: Under 68 Ill. Adm. Code 1450.750(b)(5), a sponsoring broker may deposit personal funds
  into an escrow account to avoid service charges, provided the amount is documented as being for
  service charges and does not exceed the minimum balance required by the bank to avoid fees.
  Therefore, the deposit described is permissible.
citation:
  source: 68 Ill. Adm. Code 1450 — 68 Ill. Adm. Code Part 1450 — Real Estate License Act of 2000 rules
    (entire part; official ilga.gov JCAR page read via Internet Archive capture of 2025-08-20
    because ilga.gov refuses connections from this environment) — § 1450.750 (b)(5)
  url: null
  quoted_text: The sponsoring broker may deposit from the sponsoring broker's own personal funds, and
    keep in any escrow account, an amount sufficient to avoid incurring service charges relating to
    the escrow account. The sum shall be specifically documented as being for service charges and
    the sponsoring broker shall have proof available that the amount of the sponsoring broker's own
    funds in the escrow account does not exceed the minimum amount required by the depository to
    maintain the account without incurring service charges.
