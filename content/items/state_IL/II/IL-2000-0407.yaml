stem: A licensee receives notice of an investigation and is directed to file a written answer to the
  charges within 20 days. The licensee fails to file the answer. Under Section 20-60 of the Illinois
  Real Estate License Act, what action may the Department take?
options:
  - The Department may issue a citation
  - The Department may automatically revoke the license
  - The Department may schedule a hearing
  - The Department may suspend or revoke
key: D
explanation: Under Section 20-60, if a licensee fails to file a written answer within 20 days, the
  Department may suspend, revoke, place on probation, or impose a fine without a hearing. This makes
  suspending or revoking the license a permissible action. The distractor claiming automatic
  revocation is wrong because the Department’s action is discretionary, not mandatory. The other
  distractors describe actions not authorized for this specific failure.
