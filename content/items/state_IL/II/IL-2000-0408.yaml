  url: null
  quoted_text: The Secretary may temporarily suspend a license without a hearing, simultaneously with
    the institution of proceedings for a hearing provided for in Section 20-60 of the Act, if the
    Secretary finds evidence indicating that the public interest, safety, or welfare imperatively
    requires emergency action.
