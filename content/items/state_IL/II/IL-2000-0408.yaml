stem: A licensee commingles escrow funds with personal funds. Under 68 Ill. Adm. Code 1450.905, what
  action may the Secretary take?
options:
  - The Secretary may issue a citation for continuing education
  - The Secretary may automatically revoke the license
  - The Secretary may require additional continuing education
  - The Secretary may temporarily suspend the license
key: D
explanation: The rule allows the Secretary to temporarily suspend a license without a hearing when
  evidence shows an emergency threatening public interest, safety, or welfare, which includes
  commingling escrow funds with personal funds. Thus, temporary suspension is an authorized action.
  The distractor proposing automatic revocation is incorrect because the Secretary’s power is
  discretionary and does not mandate revocation. The remaining distractors describe actions not
  provided for in this rule.
