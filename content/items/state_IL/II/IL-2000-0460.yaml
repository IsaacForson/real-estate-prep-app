stem: A licensee obtains confidential information from a client about the client's negotiating
  position, and the client has not given written permission to disclose. The licensee is considering
  sharing this information with a fellow licensee to help close a deal. Under the definition of
  confidential information, is the licensee permitted to disclose this information?
options:
  - Generally not; confidential information may not be disclosed
  - If client permits, law requires, or info is public
  - Only with the client's written permission
  - Whenever the licensee believes it will help the transaction
key: B
explanation: The definition permits disclosure of confidential information only when the client
  permits the disclosure, disclosure is required by law, or the information becomes public from a
  source other than the licensee. The distractor that allows disclosure whenever the licensee
  believes it will help the transaction is incorrect because the rule does not include the
  licensee's belief as a permitted basis for disclosure.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) — § 1-10
  url: null
  quoted_text: '"Confidential information" means information obtained by a licensee from a client
    during the term of a brokerage agreement that (i) was made confidential by the written request
    or written instruction of the client, (ii) deals with the negotiating position of the client, or
    (iii) is information the disclosure of which could materially harm the negotiating position of
    the client, unless at any time: (1) the client permits the disclosure of information given by
    that client by word or conduct; (2) the disclosure is required by law; or (3) the information
    becomes public from a source other than the licensee.'
