stem: Under 68 Ill. Adm. Code 1450.750(l), how must a sponsoring broker handle security deposits
  received from a tenant for property management activities, unless the tenant waives the
  requirement in writing?
options:
  - They must be maintained in an escrow account for the duration of the lease.
  - They must be deposited into the sponsoring broker's operating account.
  - They must be returned to the tenant within 30 days.
  - They must be invested in a money-market fund.
key: A
explanation: The rule states that security deposits remitted to a sponsoring broker shall be
  maintained in an escrow account for the duration of the lease unless the tenant waives this
  requirement in writing. Therefore, the correct action is to keep the deposits in an escrow account
  for the lease term. The distractor suggesting deposit into the operating account is incorrect
  because the rule explicitly requires an escrow account, not the broker's operating funds.
