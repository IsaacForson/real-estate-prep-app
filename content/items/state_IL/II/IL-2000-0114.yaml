stem: According to Section 15-5(a) of the Illinois Real Estate License Act, what does the General
  Assembly find regarding the application of the common law of agency to relationships among
  licensees and consumers?
options:
  - The General Assembly finds that application of the common law of agency to the relationships
    among licensees under this Act and consumers of real estate brokerage services has resulted in
    misunderstandings and consequences that have been contrary to the best interests of the public.
  - The General Assembly finds that application of the common law of agency to the relationships
    among licensees under this Act and consumers of real estate brokerage services has resulted in
    increased profits for brokerage firms.
  - The General Assembly finds that application of the common law of agency to the relationships
    among licensees under this Act and consumers of real estate brokerage services has significantly
    reduced disputes between parties.
  - The General Assembly finds that application of the common law of agency to the relationships
    among licensees under this Act and consumers of real estate brokerage services is required by
    federal law.
key: A
explanation: Section 15‑5(a) of the Illinois Real Estate License Act states that the General
  Assembly finds that applying the common‑law agency doctrine to the relationships between licensees
  and consumers has produced misunderstandings and consequences that are contrary to the public’s
  best interests. Consequently, the statement describing those misunderstandings and adverse
  consequences is the correct answer. The other statements are incorrect because the statute does
  not mention increased broker profits, a reduction in disputes, or any federal requirement.
