stem: A licensee represents both the buyer and the seller in the same residential transaction. The
  licensee is a sponsored licensee designated as agent for both parties under a designated agency
  arrangement. According to the definition of dual agency, how is the question of whether there is a
  dual agency determined?
options:
  - By the sponsoring broker's agency relationships
  - By the agency relationships of the designated agent of the parties
  - By whether the licensee has a written brokerage agreement with both parties
  - By the client's express consent to dual agency
key: B
explanation: The definition specifies that when the agency relationship is a designated agency, the
  question of whether there is a dual agency shall be determined by the agency relationships of the
  designated agent of the parties and not of the sponsoring broker. The distractor that relies on
  the sponsoring broker's agency relationships is incorrect because the rule explicitly excludes the
  sponsoring broker in this determination.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) — § 1-10
  url: null
  quoted_text: '"Dual agency" means an agency relationship in which a licensee is representing both
    buyer and seller or both landlord and tenant in the same transaction. When the agency
    relationship is a designated agency, the question of whether there is a dual agency shall be
    determined by the agency relationships of the designated agent of the parties and not of the
    sponsoring broker.'
