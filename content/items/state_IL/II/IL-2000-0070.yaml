stem: Which of the following is specifically listed as unprofessional conduct under 68 Ill. Adm.
  Code 1450.900?
options:
  - Failing to disclose a known material defect to the client
  - Deliberately misleading a client as to the market value of property
  - Charging a fee for referral services to a licensee
  - Advertising a property without including the broker's name
key: B
explanation: The rule explicitly lists deliberately misleading a client as to the market value of
  property as unprofessional conduct. Failing to disclose a known material defect, while potentially
  problematic, is not enumerated in this section.
