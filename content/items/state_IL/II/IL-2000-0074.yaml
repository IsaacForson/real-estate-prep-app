stem: A branch office of a sponsoring broker does not keep its own escrow account but instead
  forwards all earnest money received to the principal office. According to 68 Ill. Adm. Code
  1450.750(2), by when must that office transmit the escrow money to the principal office?
options:
  - The escrow money must be transmitted to the principal office no later than the next business day
    following the transaction.
  - The escrow money must be transmitted to the principal office within two business days of
    receiving the money.
  - The escrow money must be transmitted to the principal office by the end of the week in which the
    transaction occurs.
  - The escrow money must be transmitted to the principal office immediately upon receipt of the
    money.
key: A
explanation: The rule requires that escrow moneys be transmitted to the principal office no later
  than the next business day following the transaction. Therefore, the correct timing is the next
  business day. The distractor suggesting transmission within two business days is incorrect because
  the rule specifies the next business day, not a two‑day window.
