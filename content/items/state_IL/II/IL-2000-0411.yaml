stem: A licensee agrees to work as an unlicensed assistant for a broker who is sponsored by a
  different sponsoring broker. Under 68 Ill. Adm. Code 1450.740(e), is this permissible?
options:
  - Not permitted, because the licensee is assisting a broker sponsored by a different sponsoring
    broker
  - Not permitted, unless the licensee obtains written consent from both sponsoring brokers
  - Permitted, because the licensee is not performing licensed activities
  - Permitted, as long as the assistant receives no compensation
key: A
explanation: The rule prohibits a licensee from acting as an assistant for any licensee other than
  their own sponsoring broker or a licensee sponsored by the same sponsoring broker, regardless of
  compensation or whether licensed activities are performed. Therefore the arrangement is not
  permitted.
