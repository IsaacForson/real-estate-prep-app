stem: A licensee representing a buyer client receives a written purchase offer from another agent
  for the buyer's consideration. Under Section 15-15, when must the licensee present that offer to
  the client?
options:
  - As soon as thirty days have passed since the offer was made
  - As soon as the buyer has secured firm mortgage financing
  - As soon as the offer arrives, unless the client waived that duty
  - As soon as the seller's broker confirms the property is still available
key: C
explanation: Section 15-15 requires a licensee representing a client to timely present all offers to
  and from the client unless the client has waived that duty.
