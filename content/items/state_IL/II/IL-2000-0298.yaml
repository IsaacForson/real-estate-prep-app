stem: A licensee's broker license expired while they were on active duty with the Armed Forces. They
  terminated service 18 months ago and now wish to renew. According to Sec. 5-50(d), what is the
  result?
options:
  - They must complete continuing education for that licensure period but are exempt from paying
    lapsed renewal fees
  - They must pay lapsed renewal fees but are exempt from completing continuing education for that
    licensure period
  - They must both pay lapsed renewal fees and complete continuing education for that licensure
    period
  - They may renew without paying lapsed renewal fees and without completing continuing education
    for that licensure period
key: D
explanation: The key is correct because Sec. 5-50(d) allows renewal without lapsed fees or
  continuing education if the license expired during active duty and the licensee provides evidence
  within two years after termination; the scenario meets both conditions. The distractor that
  requires payment of lapsed fees is incorrect because the subsection provides a fee waiver for
  qualifying military service.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) Sec. 5-50(d)
  url: null
  quoted_text: Notwithstanding any other provisions of this Act to the contrary, any managing broker,
    broker, or residential leasing agent whose license expired while the licensee was (i) on active
    duty with the Armed Forces of the United States or called into service or training by the state
    militia, (ii) engaged in training or education under the supervision of the United States
    preliminary to induction into military service, or (iii) serving as the Coordinator of Real
    Estate in the State of Illinois or as an employee of the Department may have the license
    renewed, reinstated or restored without paying any lapsed renewal fees, and without completing
    the continuing education requirements for that licensure period if within 2 years after the
    termination of the service, training or education the licensee furnishes the Department with
    satisfactory evidence of service, training, or education and termination under honorable
    conditions.
