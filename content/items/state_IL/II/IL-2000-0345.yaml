stem: Under the Illinois Real Estate License Act, which of the following persons may recover from
  the Real Estate Recovery Fund?
options:
  - Any person who files a complaint with the Department regarding a licensee's conduct.
  - Any person who suffers a loss in market value due to a licensee's misrepresentation.
  - Any unlicensed employee of a licensee who commits fraud against a client.
  - Any person aggrieved by a licensee's act that results in loss of actual cash money.
key: D
explanation: Under 225 ILCS 454/20-85, the Real Estate Recovery Fund compensates only for a loss of
  actual cash money, not for mere changes in market value. The option stating that any person who
  suffers a loss in market value due to a licensee's misrepresentation may recover is incorrect
  because the fund does not cover market‑value losses. The option stating that any person who files
  a complaint with the Department regarding a licensee's conduct may recover is incorrect because
  merely filing a complaint does not establish a loss of actual cash money. The option stating that
  any unlicensed employee of a licensee who commits fraud against a client may recover is incorrect
  because the fund provides compensation to the aggrieved person, not to the employee who committed
  the fraudulent act.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) — § 20-85
  url: null
  quoted_text: any person aggrieved by an act, representation, transaction, or conduct of a licensee
    or unlicensed employee of a licensee that is in violation of this Act or the rules promulgated
    pursuant thereto, constitutes embezzlement of money or property, or results in money or property
    being unlawfully obtained from any person by false pretenses, artifice, trickery, or forgery or
    by reason of any fraud, misrepresentation, discrimination, or deceit by or on the part of any
    such licensee or the unlicensed employee of a licensee and that results in a loss of actual cash
    money, as opposed to losses in market value, may recover.
