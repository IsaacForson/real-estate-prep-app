stem: "Under 68 Ill. Adm. Code 1450.750(b)(5), a sponsoring broker may deposit personal funds into
  an escrow account only to:"
options:
  - To pay marketing expenses for the property listing.
  - To advance commissions owed to the sponsoring broker.
  - To earn interest on the escrow account balance.
  - To cover service charges for the escrow account.
key: D
explanation: Under 68 Ill. Adm. Code 1450.750(b)(5), a sponsoring broker may deposit personal funds
  into an escrow account only to avoid incurring service charges on that account, provided the
  amount is documented and does not exceed the minimum required by the depository. Therefore, the
  correct answer is the one stating that the purpose is to cover service charges for the escrow
  account. The other options are wrong because paying marketing expenses, advancing commissions, or
  earning interest are not allowed reasons for depositing personal funds under this rule.
