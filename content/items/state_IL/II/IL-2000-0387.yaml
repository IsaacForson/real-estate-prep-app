stem: A limited liability company seeks a broker license, but one of its nonparticipating managers
  has been previously disciplined and is currently barred from practice. What is the result under
  the Act?
options:
  - The LLC may be licensed if the manager files an affidavit
  - The LLC must remove the manager to qualify
  - The LLC shall not be granted a license
  - The LLC may be licensed after paying a fine
key: C
explanation: Section 5-15(d) prohibits licensing an LLC if any nonparticipating member or manager
  has been publicly disciplined and remains barred from real estate practice. The disqualification
  is based on the prior discipline, not on whether an affidavit is submitted. Therefore, the LLC
  cannot be licensed regardless of affidavit submission or payment of a fine.
