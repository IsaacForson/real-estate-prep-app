stem: If a sponsoring broker keeps records electronically, what is the minimum frequency at which
  the broker must back up those records to protect the data?
options:
  - Every week
  - Every year
  - Every month
  - Every quarter
key: C
explanation: The rule requires electronic records to be backed up at reasonable intervals but no
  less than once a month to safeguard the data. Therefore, the minimum frequency is monthly. The
  option stating weekly is more frequent than required, while quarterly and yearly intervals would
  fail to meet the monthly minimum.
