stem: A seller's designated agent learns of a latent defect affecting the physical condition of the
  listed home that a buyer-customer could not discover through a reasonably diligent inspection.
  What does Section 15-25 require?
options:
  - Timely disclosure of the known latent defect to the buyer
  - Referral of the buyer-customer to an independent home inspector
  - Notification to the local zoning board before closing occurs
  - Withdrawal of the listing until the seller completes needed repairs
key: A
explanation: Section 15-25 requires a licensee engaged by a seller client to timely disclose to
  prospective buyer-customers latent material adverse facts about the property's physical condition
  that are actually known and not reasonably discoverable.
citation:
  source: 225 ILCS 454, Section 15-25
  url: null
  quoted_text: A licensee engaged by a seller client shall timely disclose to customers who are
    prospective buyers all latent material adverse facts pertaining to the physical condition of the
    property that are actually known by the licensee and that could not be discovered by a
    reasonably diligent inspection of the property by the customer.
