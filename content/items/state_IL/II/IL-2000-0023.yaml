stem: A licensee is preparing contemporaneous offers to purchase the same property on behalf of two
  different buyer clients. What must the licensee do to comply with Section 15-15?
options:
  - Cancel one of the two brokerage agreements right away
  - Wait until the seller accepts one offer to proceed
  - Obtain oral consent from the client offering first
  - Provide written disclosure to every client affected
key: D
explanation: Section 15-15 requires a licensee to provide written disclosure to all clients for whom
  the licensee is preparing contemporaneous offers to purchase or lease the same property.
