stem: A sponsored licensee violates the Act without the sponsoring broker's knowledge. Based on
  Illinois rule, why does that violation alone **NOT** justify discipline against the sponsoring
  broker?
options:
  - Discipline of the sponsoring broker requires the broker's own knowledge
  - Discipline of a sponsoring broker requires a prior citation against the same office
  - Discipline of a sponsoring broker requires a criminal conviction of the licensee
  - Discipline of a sponsoring broker requires the client to file a signed complaint
key: A
explanation: The rule states that a licensee's violation is not cause for suspension or revocation
  of the sponsoring broker's license unless the sponsoring broker had knowledge of the violation.
citation:
  source: 68 Ill. Adm. Code 1450 § 1450.700
  url: null
  quoted_text: |-
    Any
    violation of the Act by any licensees employed by or associated with a
    sponsoring broker, or by any unlicensed assistant or other unlicensed employee
    of a sponsoring broker, shall not be cause for suspension or revocation of a
    sponsoring broker's license, unless a sponsoring broker had knowledge of a
    violation of the Act.
