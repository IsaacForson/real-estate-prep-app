stem: An advertisement for a listed property is technically accurate but, viewed as a whole, would
  likely leave an ordinary consumer with a false impression. How does Section 10-30 treat this
  advertisement?
options:
  - As acceptable, because every individual statement in it is accurate
  - As misleading once a consumer files a written complaint
  - As acceptable, because intentional falsehoods alone are regulated
  - As misleading, because deceiving an ordinary consumer is possible
key: D
explanation: Section 10-30 provides that advertising is considered misleading if, taken as a whole,
  there is a distinct and reasonable possibility it will be misunderstood or will deceive the
  ordinary consumer, regardless of technical accuracy.
