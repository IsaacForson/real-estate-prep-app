stem: A listing agreement includes a clause that the broker's commission will be paid from the
  buyer's earnest money deposit if the buyer defaults, with any remainder to the seller. The clause
  is printed in the same font size as the rest of the agreement. According to 68 Ill. Adm. Code
  1450.770(j), is this permissible?
options:
  - The clause must be printed in boldface type to be enforceable under this rule
  - The clause must be presented in letters larger than those generally used in the agreement under
    this rule
  - The clause must be initialed by both parties to be valid under this rule
  - The clause may be placed anywhere in the agreement as long as it is readable under this rule
key: B
explanation: The rule requires any provision that pays the broker's commission from the buyer's
  earnest money deposit upon default to appear in letters larger than those generally used in the
  agreement. Using the same font size fails to meet this requirement, making the clause
  noncompliant. The other options introduce conditions not mentioned in the rule.
