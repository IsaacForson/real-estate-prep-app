stem: Under Section 20-25 of the Illinois Real Estate License Act, what fee must a person pay to the
  Department for a returned check or dishonored credit card charge?
options:
  - $100.00
  - $25.00
  - $75.00
  - $50.00
key: D
explanation: The statute explicitly states that a person who delivers a returned check or presents
  an invalid or dishonored credit card must pay a fee of $50 in addition to any amount already owed.
  This makes $50.00 the correct amount. The $25.00 distractor incorrectly assumes half the statutory
  fee, while the $75.00 and $100.00 distractors overstate the penalty. Only the $50.00 option
  matches the language of Section 20-25.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
    ilga.gov refuses connections from this environment) — § 20-25
  url: null
  quoted_text: Any person who (1) delivers a check or other payment to the Department that is returned
    to the Department unpaid by the financial institution upon which it is drawn shall pay to the
    Department; or (2) presents a credit or debit card for payment that is invalid or expired or
    against which charges by the Department are declined or dishonored, in addition to the amount
    already owed to the Department, a fee of $50.
