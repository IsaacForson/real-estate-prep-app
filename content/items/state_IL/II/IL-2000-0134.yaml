stem: What information must a sponsoring broker include in the original application for licensure
  regarding each escrow account?
options:
  - The total balance of each escrow account, the date it was opened, and the name of the managing
    broker
  - The name of the bank or depository where each escrow account is maintained
  - The name of the bank, the name of each account, and the names of persons authorized to withdraw
    funds
  - The name of each escrow account and the names of persons authorized to withdraw funds
key: C
explanation: The rule requires the sponsoring broker to list, at the time of the original
  application for licensure, the name of the bank or depository where each escrow account is
  maintained, the name of each account, and the names of the persons authorized to withdraw funds
  from those accounts. The option that states the name of the bank, the name of each account, and
  the names of persons authorized to withdraw funds includes all three required elements. The option
  that states the total balance of each escrow account, the date it was opened, and the name of the
  managing broker omits the account name and authorized persons, making it incomplete.
