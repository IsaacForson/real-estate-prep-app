  url: null
  quoted_text: Each sponsoring broker shall, at the time of the original application for licensure, in
    a format provided by the Division, include the name of the banks or other recognized
    depositories in which each escrow account is maintained, the name of each account, and the names
    of the persons authorized to withdraw funds from those accounts
