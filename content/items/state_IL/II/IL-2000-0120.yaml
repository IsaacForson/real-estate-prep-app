stem: A sponsoring broker terminates a licensee's sponsorship at 2:00 PM on Thursday. By what time
  must the broker notify the Division to comply with Illinois rule?
options:
  - By 2:00 PM Friday
  - By 2:00 PM Thursday
  - By 2:00 PM Saturday
  - By 5:00 PM Friday
key: A
explanation: The rule requires the sponsoring broker to notify the Division within 24 hours after
  termination. Therefore, notification must occur by 2:00 PM Friday. Notifying by 2:00 PM Thursday
  would be insufficient because it is not within the 24‑hour window.
