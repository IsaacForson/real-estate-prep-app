stem: A broker currently sponsored by Firm A wants to also perform licensed activities on behalf of
  Firm B while keeping the sponsorship at Firm A active. What does Section 10-20 permit?
options:
  - This arrangement, provided the broker discloses it to both firms' clients
  - Nothing, because a licensee may have just one sponsoring broker
  - This arrangement, provided both firms consent to it in writing
  - This arrangement, provided the second firm pays no direct compensation
key: B
explanation: Section 10-20 provides that a licensee may perform activities as a licensee only for
  the licensee's sponsoring broker and must have only one sponsoring broker at any one time.
