stem: What must a nonparticipating officer of a corporation submit to the Department to comply with
  the Real Estate License Act?
options:
  - Background check authorization
  - Continuing education certificate
  - Proof of errors and omissions insurance
  - Affidavit of nonparticipation
key: D
explanation: The statute requires every nonparticipating owner or officer to submit an affidavit of
  nonparticipation as a condition for corporate licensure. This affidavit confirms the individual
  does not engage in the corporation's real estate activities. Proof of errors and omissions
  insurance is not mandated by this provision for nonparticipating officers.
