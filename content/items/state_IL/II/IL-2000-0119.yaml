stem: According to Illinois administrative rule, what must every sponsoring broker have with each
  sponsored licensee?
options:
  - A current managing broker license issued by the Division
  - A completed post-licensing education certificate
  - A written employment or independent contractor agreement
  - A written policy outlining supervision and duties
key: C
explanation: The rule explicitly states that every sponsoring broker shall have a written employment
  or independent contractor agreement with each sponsored licensee. A verbal agreement does not
  satisfy this written requirement.
