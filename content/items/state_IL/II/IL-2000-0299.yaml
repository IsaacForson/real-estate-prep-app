stem: How must the Department provide notice of renewal for sponsored licensees to the sponsoring
  broker under Sec. 5-50(f)?
options:
  - By requiring the sponsoring broker to retrieve the notice from an online portal each renewal
    period
  - By delivering the notice in person to the sponsoring broker's office during business hours
  - By sending the notice via certified mail only to the sponsoring broker's last known address
  - By mailing the notice to the sponsoring broker's address of record or emailing it at the
    Department's discretion
key: D
explanation: The key is correct because Sec. 5-50(f) mandates that the Department provide renewal
  notices to sponsoring brokers by mailing to the address of record or, at the Department's
  discretion, emailing to the email address of record. The distractor about requiring brokers to
  retrieve notices from an online portal is incorrect because the Act does not mention an online
  portal as the method of delivery.
