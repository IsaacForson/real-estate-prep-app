stem: A seller requires a minimum bid before any property is sold at auction. The licensee's flyer
  still calls the sale an absolute auction. Under Illinois rule, why is that flyer deceptive?
options:
  - It calls the sale an auction without reserve though a minimum bid applies
  - It fails to list the auctioneer's license number anywhere on the printed flyer
  - It uses a font size for the team name larger than the sponsoring broker's name
  - It omits the sponsoring broker's mailing address from the auction announcement
key: A
explanation: The rule identifies advertising property at auction as an absolute auction, or auction
  without reserve, as deceptive when a minimum or opening bid is actually required.
citation:
  source: 68 Ill. Adm. Code 1450 § 1450.715
  url: null
  quoted_text: |-
    Advertising property at auction as an absolute auction or
    auction without reserve, when a minimum bid or opening bid is
    required
