stem: A licensee sends a required property condition disclosure to a buyer via email, but the buyer
  has not agreed to receive disclosures electronically. Under 68 Ill. Adm. Code 1450.755(c), is this
  permissible?
options:
  - No, because both parties must agree to electronic format
  - Yes, because electronic delivery is permissible under the rule
  - No, unless the licensee also mails a paper copy
  - Yes, as long as the email includes an electronic signature
key: A
explanation: The regulation allows a disclosure to be provided electronically only when the buyer
  and the licensee have mutually agreed to that format. Without the buyer’s consent, the licensee
  must use a physical form. Adding an electronic signature does not satisfy the mutual‑agreement
  requirement.
