stem: A licensee's sponsorship with a broker ends and the licensee has not yet lined up a new
  sponsor. Under Illinois rule, what happens to the license status?
options:
  - It converts to a residential leasing agent permit until sponsorship resumes
  - It stays active as long as the former sponsoring broker files no objection
  - It remains active for ninety days while the licensee searches for a new sponsor
  - It automatically becomes inactive until a new sponsorship is established
key: D
explanation: The rule provides that once sponsorship is terminated, the license is automatically
  changed to inactive status and the licensee cannot engage in licensed activities until a new
  sponsorship is established.
citation:
  source: 68 Ill. Adm. Code 1450 § 1450.115
  url: null
  quoted_text: |-
    Once
    the sponsorship has been terminated, the license is automatically changed to
    inactive status and the licensee is prohibited from engaging in licensed
    activities until the licensee has established a valid sponsorship with a new
    sponsoring broker.
