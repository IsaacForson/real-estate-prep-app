stem: A home sold six weeks ago, and the listing broker's online advertisement for it is still live
  with no steps taken toward removal. Under 68 Ill. Adm. Code 1450.715, how is this most likely
  characterized?
options:
  - Deceptive advertising for failing to remove it within a reasonable time
  - Acceptable advertising because closed sales may stay posted indefinitely
  - Acceptable advertising because pending sales alone require prompt removal
  - Deceptive advertising if the seller specifically requested its removal
key: A
explanation: Section 1450.715 identifies failing to remove advertising of a listed property within a
  reasonable time after the closing of a sale as deceptive and misleading advertising.
citation:
  source: 68 Ill. Adm. Code, Section 1450.715
  url: null
  quoted_text: Failing to remove advertising of a listed property within a reasonable time,
    considering the nature of the advertising, the licensee's control over the removal of the
    advertising, the ease of removing the advertising, knowledge that the advertising was
    continuing, and any other pertinent criteria, after the closing of a sale on the listed property
    or the expiration or termination of the listing agreement, whichever occurs first
