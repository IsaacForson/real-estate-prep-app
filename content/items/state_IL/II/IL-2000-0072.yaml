stem: Which activity may an unlicensed assistant perform under the supervision of a licensee
  according to 68 Ill. Adm. Code 1450.740?
options:
  - Interpret contract terms for clients and explain legal implications
  - Negotiate commission splits with other licensees on behalf of the broker
  - Prepare and distribute promotional materials under direction and approval of a licensee
