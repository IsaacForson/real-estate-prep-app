stem: A prospective buyer asks whether a listed house was ever the site of a murder. Based on 68
  Ill. Adm. Code 1450.810, how should this inquiry be treated?
options:
  - As a material fact required to appear in the listing description
  - As information a licensee has no duty to disclose under the rule
  - As grounds for the buyer to rescind any resulting purchase contract
  - As a latent defect requiring immediate written seller disclosure
key: B
explanation: Section 1450.810 provides that a licensee has no duty to disclose that real estate was
  the site of an occurrence with no effect on physical condition, expressly including murder or
  suicide.
citation:
  source: 68 Ill. Adm. Code, Section 1450.810
  url: null
  quoted_text: That the real estate was the site of an act or occurrence that had no effect on the
    physical condition of the property or its environment or the structures located on that real
    estate, as set forth in Section 15-20 of the Act. These acts shall include, but are not limited
    to, murder or suicide
