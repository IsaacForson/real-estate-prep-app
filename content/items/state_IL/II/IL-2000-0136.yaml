stem: A licensee uses a third‑party service to collect and disburse earnest money in a transaction.
  Who remains responsible for complying with escrow requirements under Illinois rule?
options:
  - The principal office of the broker
  - The licensee serving as escrow agent
  - The sponsoring broker only
  - The third‑party service provider
key: B
explanation: Under 68 Ill. Adm. Code §1450.750(n), a licensee who acts as an escrow agent remains
  responsible for meeting all escrow requirements even when a third‑party service is used to collect
  and disburse earnest money. Assigning responsibility to the principal office of the broker, to the
  sponsoring broker only, or to the third‑party service provider contradicts this rule, which holds
  the licensee serving as escrow agent accountable.
