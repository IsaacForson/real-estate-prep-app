stem: What must a licensee carry on their person according to the Illinois Real Estate License Act?
options:
  - A photo ID issued by the Department
  - A letter of sponsorship from their broker
  - The license or an electronic version thereof
  - A copy of their continuing education certificate
key: C
explanation: The key is correct because Sec. 5-50(e) explicitly states that each licensee shall
  carry on one's person the license or an electronic version thereof. The distractor about a
  continuing education certificate is incorrect because the Act does not require licensees to carry
  that document on their person.
