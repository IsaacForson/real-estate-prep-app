stem: A seller's licensee is dealing with a buyer who is a customer, not a client. Under the Act,
  how must the licensee treat that customer?
options:
  - Treat the customer the same as any other licensee treats their own client
  - Treat the customer as a client once the customer signs a purchase offer
  - Treat the customer honestly and not knowingly give false information
  - Treat the customer as favorably as the seller's client instructs in writing
key: C
explanation: The statute directs licensees to treat all customers honestly and not negligently or
  knowingly give them false information, even though a customer is not represented.
