stem: A broker who has been actively practicing as a broker in another state for only 18 months
  prior to applying for an Illinois license under the endorsement provisions of the Act must satisfy
  which additional requirement?
options:
  - The broker must complete the 45 hours of post-license broker education prescribed in this Act
    and by rule.
  - The broker must pass a test on Illinois-specific real estate brokerage laws.
  - The broker must file a written designation appointing the Secretary as agent for service of
    process.
  - The broker must submit a statement under seal from the licensing authority showing active
    license and good standing.
key: A
explanation: According to 225 ILCS 454 § 5-60.5(b)(5), a broker who has been actively practicing in
  another state for less than two years prior to application must complete the 45 hours of
  post‑license broker education prescribed by the Act. This education requirement is in addition to
  the standard endorsement conditions. The distractor referencing the Illinois‑specific law test is
  incorrect because that test is required for all endorsement applicants, but the extra education
  applies only when the practice period is under two years.
