stem: A licensee acts as agent for both the buyer and the seller in the same residential sale. Under
  the Act, what type of agency relationship does this create?
options:
  - A dual agency relationship
  - An exclusive agency relationship
  - A designated agency relationship
  - A buyer's agent relationship
key: A
explanation: The Act defines dual agency as an agency relationship where a licensee represents both
  buyer and seller in the same transaction, which matches the scenario. The distractor 'A designated
  agency relationship' is incorrect because it refers to a relationship where a sponsoring broker
  designates licensees as agents of a client, not representation of both parties.
