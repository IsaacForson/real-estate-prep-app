  url: null
  quoted_text: (a) Any person who practices, offers to practice, attempts to practice, or holds
    oneself out to practice as a managing broker, broker, or residential leasing agent without being
    licensed under this Act shall, in addition to any other penalty provided by law, pay a civil
    penalty to the Department in an amount not to exceed $25,000 for each offense as determined by
    the Department.
