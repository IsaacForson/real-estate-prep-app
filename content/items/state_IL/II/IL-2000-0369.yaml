stem: What is the maximum civil penalty per offense that the Illinois Department of Financial and
  Professional Regulation may impose on a person who practices real estate brokerage without a
  license under the Illinois Real Estate License Act?
options:
  - $10,000
  - $50,000
  - $25,000
  - $5,000
key: C
explanation: The Act states that a person who practices without a license shall pay a civil penalty
  not to exceed $25,000 for each offense. The $50,000 option exceeds the statutory cap.
citation:
  source: 225 ILCS 454 — Illinois Compiled Statutes 225 ILCS 454 — Real Estate License Act of 2000
    (full act text; official ilga.gov page read via Internet Archive capture of March 2025 because
