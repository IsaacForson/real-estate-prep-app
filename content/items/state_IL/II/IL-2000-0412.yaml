stem: A licensee supervises an unlicensed assistant who makes an error in preparing closing
  documents. Under 68 Ill. Adm. Code 1450.740(d), what is the licensee's responsibility?
options:
  - The licensee is responsible for the assistant's acts or omissions
  - The licensee is responsible only if the assistant acted with intent to deceive
  - The licensee bears no responsibility as long as the assistant is unlicensed
  - The licensee must report the assistant to the Department within 24 hours
key: A
explanation: The rule states that any licensee who supervises an unlicensed assistant shall be
  responsible for the assistant's acts or omissions, imposing strict liability regardless of intent
  or licensure status. The other options incorrectly limit responsibility to intent, licensure, or
  reporting requirements.
