stem: Under Illinois law, what must a licensee disclose to a client regarding compensation received
  from a third party in a real estate transaction?
options:
  - The licensee must disclose only amounts offered to cooperating brokers who represent other
    parties in the transaction.
  - The licensee must disclose only the sponsoring broker's compensation policy as described in the
    employment agreement.
  - The licensee must disclose only compensation received from the buyer and seller in the
    transaction.
  - The licensee must disclose all sources of compensation related to the transaction received from
    a third party.
key: D
explanation: Section 10-10(b) requires a licensee to disclose to a client all sources of
  compensation related to the transaction received from a third party. The option stating that the
  licensee must disclose only the sponsoring broker's compensation policy is incorrect because it
  limits disclosure to only the sponsoring broker's compensation policy, omitting third-party
  compensation.
