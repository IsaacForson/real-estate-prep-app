stem: Under Section 10-45(a)(3), a broker price opinion may be prepared for which of the following?
options:
  - A third party performing due diligence related to the potential listing price of real estate
  - A property owner seeking to refinance their existing mortgage with a new loan from a bank
  - A tenant negotiating a lease renewal for commercial space with a new landlord and updated rent
    terms
  - A financial institution using the opinion as the primary basis for mortgage loan origination
key: A
explanation: Section 10-45(a)(3) explicitly permits a broker price opinion for a third party making
  decisions or performing due diligence related to the potential listing, offering, sale, option,
  lease, or acquisition price of an interest in real estate. The correct option describes a third
  party performing due diligence related to the potential listing price of real estate, which
  matches this provision. The option describing a property owner seeking to refinance their existing
  mortgage with a new loan from a bank is incorrect because subsection (a)(4) prohibits using a
  broker price opinion as the primary basis for mortgage loan valuation. The option about a tenant
  negotiating a lease renewal for commercial space with a new landlord and updated rent terms, and
  the option about a financial institution using the opinion as the primary basis for mortgage loan
  origination, describe parties covered under other subsections but not the specific due‑diligent
  third‑party scenario in (a)(3).
