stem: A managing broker who supervises licensees in two different offices and has been appointed as
  such by the sponsoring broker registered with the Department. Under the Act, how is this licensee
  classified?
options:
  - A designated agent who is a sponsored licensee named by a sponsoring broker as the legal agent
    of a client
  - A managing broker who may be authorized to assume responsibilities as a designated managing
    broker for licensees in one or more offices
  - A designated managing broker who has supervisory responsibilities for licensees in more than one
    office and has been appointed by the sponsoring broker
  - A broker who, whether in person or through any media or technology, for another and for
    compensation, engages in licensed activities
key: C
explanation: The definition of designated managing broker applies to a managing broker who has
  supervisory responsibilities for licensees in more than one office and has been appointed by the
  sponsoring broker registered with the Department. The option that describes a designated agent who
  is a sponsored licensee named by a sponsoring broker as the legal agent of a client does not
  capture the supervisory role. The option that describes a managing broker who may be authorized to
  assume responsibilities as a designated managing broker for licensees in one or more offices lacks
  the requirement of supervising licensees in more than one office. The option that describes a
  broker who, whether in person or through any media or technology, for another and for
  compensation, engages in licensed activities is a broader definition that does not specify the
  supervisory and appointment aspects.
