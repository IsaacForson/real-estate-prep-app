stem: A property owner asks a licensee to write a listing agreement clause refusing to sell to
  buyers of a particular national origin. Under 68 Ill. Adm. Code 1450.710, what should the licensee
  do?
options:
  - Refuse, because entering such a listing agreement is prohibited
  - Comply, because owners may restrict buyers under their listing terms
  - Refuse, if the property is a residential property of four units or less
  - Comply, after the sponsoring broker approves the clause
key: A
explanation: Section 1450.710 prohibits a licensee from entering into a listing agreement that
  prohibits the sale or rental of real estate to any person because of national origin or other
  protected class.
citation:
  source: 68 Ill. Adm. Code, Section 1450.710
  url: null
  quoted_text: No licensee shall enter into a listing agreement that prohibits the sale or rental of
    real estate to any person because of race, color, religion, national origin, sex, ancestry, age,
