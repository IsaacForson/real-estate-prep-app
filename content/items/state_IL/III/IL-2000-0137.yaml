  url: null
  quoted_text: "\"Team\" means any 2 or more licensees who work together to provide real estate
    brokerage services, represent themselves to the public as being part of a team or group, are
    identified by a team name that is different than their sponsoring broker's name, and together
    are supervised by the same managing broker and sponsored by the same sponsoring broker."
