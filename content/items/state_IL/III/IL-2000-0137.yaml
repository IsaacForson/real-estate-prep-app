stem: Three licensees work under the same managing broker and sponsoring broker, advertise
  themselves as the 'Capital City Team', and jointly provide brokerage services to clients. Under
  Section 1-10, how are these licensees classified?
options:
  - They are classified as a team because they meet all statutory criteria for a team
  - They are considered a team only if they share office space with their sponsoring broker
  - They are not considered a team because they are supervised by a managing broker rather than the
    sponsoring broker
  - They are not considered a team because they have not filed a team name with the Department
key: A
explanation: The definition of 'team' requires two or more licensees who work together to provide
  brokerage services, represent themselves as a team with a name different from the sponsoring
  broker's, and are supervised by the same managing broker and sponsored by the same sponsoring
  broker. The scenario satisfies all these criteria, so they are a team. The distractors introduce
  conditions not required by the statute.
citation:
