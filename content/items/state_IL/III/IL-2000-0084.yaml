  url: null
  quoted_text: "\"Blind advertisement\" means any real estate advertisement that is used by a licensee
    regarding the sale or lease of real estate, licensed activities, or the hiring of any licensee
    under this Act that does not include the sponsoring broker's complete business name or, in the
    case of electronic advertisements, does not provide a direct link to a display with all the
    required disclosures."
