stem: A licensee posts an online advertisement for a property that includes their own name and phone
  number but does not include the sponsoring broker's complete business name. Under the Act, how is
  this advertisement classified?
options:
  - A blind advertisement because it omits the sponsoring broker's complete business name
  - A blind advertisement only if it is a print advertisement
  - A permissible electronic advertisement if it provides a direct link to required disclosures
  - A permissible advertisement because it includes the licensee's contact information
key: A
explanation: A blind advertisement is any real‑estate advertisement that does not include the
  sponsoring broker’s complete business name, or, for electronic ads, does not provide a direct link
  to a display containing all required disclosures. Because the online ad omits the broker’s name,
  it meets that definition and is classified as a blind advertisement. The suggestion that a blind
  advertisement applies only to print ads is incorrect; the definition covers all media. The idea
  that the ad is permissible because it provides a direct link to required disclosures is wrong, as
  no such link is present. Likewise, merely including the licensee’s contact information does not
  satisfy the broker‑name requirement, so the ad is not permissible on that basis.
  (225 ILCS 454 § 1‑10)
