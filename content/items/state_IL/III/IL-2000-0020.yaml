stem: A consumer's property is exclusively listed with Broker X. Another licensee wants to discuss a
  possible future brokerage agreement with that consumer. Based on Illinois rule, when may that
  contact occur?
options:
  - When the consumer's mortgage lender approves a new loan estimate
  - When the consumer initiates the contact with the other licensee
  - When the other licensee has more listings than Broker X currently holds
  - When ninety days remain before the exclusive agreement expires
key: B
explanation: The rule allows a licensee to discuss a possible future brokerage agreement with a
  consumer under another broker's exclusive agreement only if the consumer initiates the contact,
  absent the separate written-request procedure.
