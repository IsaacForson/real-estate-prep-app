stem: A licensee begins actively marketing a seller's home to prospective buyers before any
  brokerage agreement has been signed. Under 68 Ill. Adm. Code 1450.770, has the licensee complied
  with the timing requirement for written brokerage agreements?
options:
  - Yes, because marketing may lawfully precede a written agreement
  - No, an agreement needs to exist before marketing begins
  - Yes, provided the agreement is signed before the closing date
  - No, but if the property is under an exclusive listing
key: B
explanation: Section 1450.770 requires licensees to enter into a written brokerage agreement with a
  client no later than showing or marketing the property of a seller or owner.
citation:
  source: 68 Ill. Adm. Code, Section 1450.770
  url: null
  quoted_text: "Licensees shall enter into a written brokerage agreement with a client as soon as
    reasonably practical but no later than: 1) showing or marketing the property of a seller or
    owner; or 2) prior to initiating the purchase or lease of a property for a buyer or tenant."
