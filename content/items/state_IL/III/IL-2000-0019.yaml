stem: A licensee begins helping a buyer look for homes and plans to prepare an offer soon. Under
  Illinois rule, by when must the licensee enter into a written brokerage agreement with that buyer?
options:
  - No later than before the buyer's purchase of property is initiated
  - No later than thirty days after the buyer signs a purchase contract
  - No later than the day the transaction closes and the title transfers
  - No later than the date the buyer's loan application gets submitted
key: A
explanation: The rule requires licensees to enter into a written brokerage agreement with a client
  no later than prior to initiating the purchase or lease of a property for a buyer or tenant.
