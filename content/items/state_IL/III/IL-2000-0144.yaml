stem: A broker prepares a broker price opinion for a lienholder who intends to use it as the primary
  basis for determining the market value of a property for a mortgage loan. Is this permitted under
  Section 10-45?
options:
  - The broker's action is permitted if the broker includes the required statement that it is not an
    appraisal
  - The broker's action is not permitted because only licensed appraisers may provide valuations for
    mortgage loan purposes
  - The broker's action is permitted because lienholders are expressly authorized to request broker
    price opinions under subsection (a)(4)
  - The broker's action is not permitted because subsection (a)(4) prohibits using a broker price
    opinion as the primary basis for mortgage loan valuation
key: D
explanation: >-
  Subsection 10-45(a)(4) permits a broker price opinion for a lienholder only when it is not used as
  the primary basis for determining market value for a mortgage loan. Therefore, using the opinion
  as the primary basis for mortgage loan valuation is prohibited. The correct answer states that the
  broker's action is not permitted because subsection (a)(4) prohibits using a broker price opinion
  as the primary basis for mortgage loan valuation.


  The first incorrect option claims the action is permitted if the broker adds a disclosure that it
  is not an appraisal; however, the disclosure does not override the prohibition on using the
  opinion as the primary basis for mortgage loan valuation.


  The second incorrect option asserts that only licensed appraisers may provide valuations for
  mortgage loan purposes; subsection 10-45 does not impose such a requirement, so this reason is not
  supported by the cited rule.


  The third incorrect option says lienholders are expressly authorized to request broker price
  opinions under subsection (a)(4); while lienholders may request opinions, the subsection limits
  that authorization to purposes other than as the primary basis for mortgage loan valuation, making
  this statement inaccurate.
