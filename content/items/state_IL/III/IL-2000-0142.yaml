stem: A sponsoring broker and a consumer sign a written brokerage agreement that states the
  sponsoring broker has the non-exclusive right, through one or more sponsored licensees, to act as
  an agent or representative of the consumer for the performance of licensed activities. Under the
  Act, what type of brokerage agreement is this?
options:
  - A non-exclusive brokerage agreement that provides that the sponsoring broker has the
    non-exclusive right, through one or more sponsored licensees, to act as an agent or
    representative of the client for the performance of licensed activities
  - An exclusive brokerage agreement that provides that the sponsoring broker has the sole right,
    through one or more sponsored licensees, to act as the exclusive agent or representative of the
    client and that meets the requirements of Section 15-75 of this Act
  - A brokerage agreement between a sponsoring broker and a consumer for licensed activities, or the
    performance of future licensed activities, to be provided to a consumer in return for
    compensation or the right to receive compensation from another
  - A contractual relationship between a sponsoring broker and a client under Section 15-50 of this
    Act in which one or more licensees associated with or employed by the broker are designated as
    agent of the client
key: A
explanation: "The scenario matches the definition of a non-exclusive brokerage agreement under 225
  ILCS 454 § 1-10: a written agreement giving the sponsoring broker the non‑exclusive right, through
  sponsored licensees, to act as agent or representative of the client for licensed activities. The
  exclusive brokerage agreement option describes a sole right to act as the exclusive agent, which
  is not present. The generic brokerage agreement option does not specify any exclusivity right. The
  designated agency option involves the broker designating specific licensees as agents of the
  client, rather than granting the broker a non‑exclusive right."
