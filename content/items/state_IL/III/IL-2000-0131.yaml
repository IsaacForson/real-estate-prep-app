stem: Under Section 1-10 of the Real Estate License Act of 2000, what does the term 'credit hour' mean?
options:
  - Fifty minutes of instruction in any real estate pre‑license course completed online
  - Fifty minutes of instruction in course work that meets the requirements set forth in rules
    adopted by the Department
  - Fifty minutes of instruction that applies only to continuing education required for renewal
  - Fifty minutes of instruction that must be documented on a form provided by the Department
key: B
explanation: The definition of 'credit hour' in the Act is exactly fifty minutes of instruction in
  course work that meets the requirements set forth in rules adopted by the Department. The other
  options either change the time, add unrelated conditions, or limit the applicability incorrectly.
