stem: A licensee who is also a licensed attorney acted as the managing broker in a home sale. After
  closing, a dispute arises and the licensee wants to represent the seller as the seller's attorney
  in that same transaction. Under Section 20-20, this is grounds for discipline because of what?
options:
  - Charging the seller a legal fee in addition to the broker's commission
  - Failing to notify the Department before accepting the legal engagement
  - Practicing law without first obtaining a separate real estate license
  - Acting as the transaction's attorney after also acting as its broker
key: D
explanation: Section 20-20 lists as a disciplinary ground a licensee who is also an attorney acting
  as attorney for either party in the same transaction in which the licensee is acting or has acted
  as a managing broker or broker.
citation:
  source: 225 ILCS 454, Section 20-20
  url: null
  quoted_text: When a licensee is also an attorney, acting as the attorney for either the buyer or the
    seller in the same transaction in which the licensee is acting or has acted as a managing broker
    or broker.
