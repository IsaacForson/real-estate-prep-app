stem: A broker is preparing a comparative market analysis for a seller client. What statement must
  the Act require the broker to include in that written analysis?
options:
  - A statement listing every comparable sale within the past ten years nearby
  - A statement naming the appraiser who will later review the broker's analysis
  - A statement that it is not an appraisal and names the preparing broker
  - A statement guaranteeing the accuracy of the final estimated selling price
key: C
explanation: The statute requires the analysis to state that it is not an appraisal of market value
  and was prepared by a licensed broker or managing broker who was not acting as a certified
  appraiser.
citation:
  source: 225 ILCS 454 § 10-45
  url: null
  quoted_text: >-
    This is a broker price opinion/comparative market

    analysis, not an appraisal of the market value of the real estate, and was prepared by a
    licensed real estate broker or managing broker who was not acting as a State certified real
    estate appraiser.
