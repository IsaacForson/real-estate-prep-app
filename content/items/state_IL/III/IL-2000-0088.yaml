stem: A sponsoring broker writes a memo naming one of its sponsored licensees as the legal agent for
  a buyer client. Under the Act, how is this licensee classified?
options:
  - The licensee is considered a customer because they are not representing the licensee.
  - The licensee is considered a broker because they perform licensed activities for compensation.
  - The licensee is considered a designated agent because they are named by the sponsoring broker as
    the legal agent of a client.
  - The licensee is considered an employee because they work for the sponsoring broker.
key: C
explanation: Section 1-10 of the Real Estate License Act of 2000 defines a 'designated agent' as a
  sponsored licensee named by a sponsoring broker as the legal agent of a client, as provided for in
  Section 15-50. The scenario matches this definition exactly. The option describing the licensee as
  a broker is incorrect because, while performing licensed activities for compensation generally
  characterizes a broker, the specific legal relationship created by the memo is that of a
  designated agent. The other options are incorrect because the licensee is not a customer, nor is
  the classification based solely on employment status.
