stem: A sponsoring broker is holding escrow moneys for a pending transaction. Absent a legal
  requirement or the principals' written agreement otherwise, Section 20-20 requires the escrow
  account to be held in what manner?
options:
  - The escrow account must be reviewed quarterly by a CPA firm
  - The escrow account must be held as noninterest bearing
  - The escrow account must automatically earn interest for principals
  - The escrow account must be titled in the broker's own name
key: B
explanation: Section 20-20 provides that the escrow account shall be noninterest bearing unless
  interest is otherwise required by law or the principals specifically require in writing that it be
  interest-bearing.
citation:
  source: 225 ILCS 454, Section 20-20
  url: null
  quoted_text: The account shall be noninterest bearing, unless the character of the deposit is such
    that payment of interest thereon is otherwise required by law or unless the principals to the
    transaction specifically require, in writing, that the deposit be placed in an interest-bearing
    account.
