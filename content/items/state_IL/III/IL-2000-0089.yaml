stem: A licensee refuses to show a rental property to a prospective tenant because the tenant is
  transgender. Under 68 Ill. Adm. Code 1450.710(a), what is the licensee's obligation?
options:
  - The licensee must refuse to show the property because transgender status is not a protected
    class.
  - The licensee must show the property and treat the tenant equally regardless of gender identity.
  - The licensee must inform the tenant that the property is not available to avoid discrimination
    claims.
  - The licensee must report the tenant's gender identity to the Department of Human Rights.
key: B
explanation: The rule prohibits discrimination based on sexual orientation, including gender
  identity, so the licensee must not refuse to show the property and must treat the tenant equally.
  The statement that the licensee must refuse to show the property because transgender status is not
  a protected class is incorrect because transgender status is protected under the gender identity
  provision.
