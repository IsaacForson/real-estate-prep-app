stem: Under the Act, how is 'agency' defined?
options:
  - A relationship in which a broker or licensee, whether directly or through an affiliated
    licensee, represents a consumer by the consumer's consent, whether express or implied, in a real
    property transaction.
  - A relationship in which a broker or licensee, whether directly or through an affiliated
    licensee, represents a consumer by the consumer's consent, whether express or implied, in a
    personal property transaction.
  - A relationship in which a broker or licensee, whether directly or through an affiliated
    licensee, represents a consumer by the broker's consent, whether express or implied, in a real
    property transaction.
  - A relationship in which a broker or licensee, whether directly or through an affiliated
    licensee, represents a consumer by the consumer's consent, whether express or implied, in a real
    property transaction, but only if the consumer is a corporation.
key: A
explanation: The definition of ‘agency’ in §1-10 explicitly states that it is a relationship where a
  broker or licensee represents a consumer by the consumer’s consent, whether express or implied, in
  a real property transaction. The distractor about personal property is incorrect because the
  definition limits agency to real property transactions.
