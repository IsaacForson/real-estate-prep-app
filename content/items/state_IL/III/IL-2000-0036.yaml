stem: A licensee is quietly negotiating a sale on behalf of both the buyer and the seller in the
  same transaction and never tells either party about the dual role. Under Section 20-20, this
  conduct is grounds for discipline because the licensee failed to do what?
options:
  - Charge both parties an identical commission percentage
  - Refer one of the two parties to an independent broker
  - Give written notice to every party represented
  - Record the dual representation with the county recorder
key: C
explanation: Section 20-20 lists acting for more than one party in a transaction without providing
  written notice to all parties for whom the licensee acts as a ground for discipline.
