stem: Under the Real Estate License Act of 2000, what does the term "address of record" mean?
options:
  - The address where the licensee conducts most of their business
  - The address recorded by the Department in the licensee's application or license file
  - The licensee's personal email address on file with the Department
  - The mailing address of the licensee's sponsoring broker's office
key: B
explanation: 'The statute defines "address of record" as the designated address that the Department
  records in the applicant’s or licensee’s application file or license file. Consequently, the
  choice that describes the address recorded by the Department in the licensee’s application or
  license file is correct. The other choices are incorrect because they refer to locations that are
  not the Department‑recorded address: the place where the licensee conducts most of their business,
  a personal email address, and the sponsoring broker’s mailing address are not covered by the
  definition.'
