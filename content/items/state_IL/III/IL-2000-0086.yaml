stem: Under the Real Estate License Act of 2000, how is a 'customer' defined?
options:
  - A consumer who is not being represented by the licensee.
  - A consumer who is seeking to obtain a real estate license.
  - A consumer who is being represented by the licensee.
  - A consumer who employs a licensee to perform licensed activities.
key: A
explanation: Section 1-10 of the Real Estate License Act of 2000 defines a customer as a consumer
  who is not being represented by the licensee. The option describing a consumer who is being
  represented by the licensee corresponds to the definition of a client. The other options, which
  describe a consumer seeking a license or employing a licensee for licensed activities, are not
  part of the statutory definition of a customer.
