stem: A licensee posts an online advertisement for a property that includes the licensee's name but
  omits the sponsoring broker's name and does not provide a link to required disclosures. Under the
  Act, how is this advertisement classified?
options:
  - It is classified as a blind advertisement because it lacks the sponsoring broker's complete
    business name.
  - It is classified as a permissible advertisement because it includes the licensee's name.
  - It is classified as a permissible advertisement because electronic ads are exempt from
    disclosure requirements.
  - It is classified as a blind advertisement only if the advertisement is in print media.
key: A
explanation: Section 1-10 of the Real Estate License Act of 2000 defines a 'blind advertisement' as
  any real estate advertisement that does not include the sponsoring broker's complete business name
  or, in the case of electronic advertisements, does not provide a direct link to a display with all
  the required disclosures. The described online ad lacks the broker's name and the required link,
  so it is blind. The option claiming the ad is permissible because it includes the licensee's name
  is incorrect because including the licensee's name does not satisfy the requirement to disclose
  the sponsoring broker's information.
