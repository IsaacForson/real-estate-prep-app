stem: A licensee represents both the buyer and the seller in the same transaction without informing
  either party. Under the Act, how is this relationship classified?
options:
  - This is classified as single agency.
  - This is classified as designated agency.
  - This is classified as dual agency.
  - This is classified as no agency.
key: C
explanation: Under §1-10, ‘dual agency’ is defined as an agency relationship in which a licensee
  represents both buyer and seller (or both landlord and tenant) in the same transaction. The
  scenario matches this definition, so it is dual agency. Designated agency is incorrect because it
  involves a sponsoring broker designating a licensee as the agent of a client, not representing
  both parties.
