stem: A lender wants a broker price opinion to serve as the primary basis for valuing a home for a
  mortgage loan origination. Under the Act, is that a permitted use of a broker price opinion?
options:
  - Yes, provided the borrower signs a written acknowledgment before closing
  - No, a broker price opinion may not be a mortgage valuation's primary basis
  - Yes, provided the broker discloses the fee charged for preparing the opinion
  - No, unless the lender is also the sponsoring broker of the licensee involved
key: B
explanation: The statute permits a broker price opinion for a lienholder or other third party for
  any purpose other than as the primary basis to determine market value for a mortgage loan
  origination.
