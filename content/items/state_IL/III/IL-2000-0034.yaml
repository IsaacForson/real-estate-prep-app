stem: A managing broker prepares a comparative market analysis for a client. Section 10-45 requires
  the document to include a statement clarifying what?
options:
  - That it is not an appraisal of the market value
  - That the client waives any right to challenge the stated value
  - That a State certified appraiser reviewed the analysis beforehand
  - That the analysis is binding on both parties to the transaction
key: A
explanation: Section 10-45 requires a broker price opinion or comparative market analysis to include
  a statement that it is not an appraisal and was prepared by a broker who was not acting as a State
  certified appraiser.
citation:
  source: 225 ILCS 454, Section 10-45
  url: null
  quoted_text: This is a broker price opinion/comparative market analysis, not an appraisal of the
    market value of the real estate, and was prepared by a licensed real estate broker or managing
    broker who was not acting as a State certified real estate appraiser.
