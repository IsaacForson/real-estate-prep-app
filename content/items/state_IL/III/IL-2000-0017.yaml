stem: A managing broker who is also a licensed attorney represented the seller in a transaction.
  Under the Act, why is it grounds for discipline for that person to then act as the buyer's
  attorney in the same deal?
options:
  - The Act bars any attorney from representing a buyer unless the seller waives the conflict in
    writing
  - The Act bars a managing broker from ever holding a law license at the same time
  - The Act bars an attorney from closing a sale without a separate title company present
  - The Act bars a licensee-attorney from acting as either party's attorney in that same deal
key: D
explanation: The statute makes it grounds for discipline when a licensee who is also an attorney
  acts as the attorney for either the buyer or seller in the same transaction in which the licensee
  acted as broker.
