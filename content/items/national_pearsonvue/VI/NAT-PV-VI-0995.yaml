stem: Under 42 U.S.C. § 4012a(c)(2), which type of loan is exempt from the flood insurance purchase
  requirement?
options:
  - Loans where the borrower is a government entity and the property is owned by a public agency or
    municipality
  - Loans made after September 23, 1994, for the purchase or refinancing of residential or
    commercial property
  - Loans secured by residential improved real estate in a special flood hazard area
  - Loans with an original principal balance of $5,000 or less and a repayment term of one year or
    less
key: D
explanation: The statute states that subsections (a) and (b) do not apply to any loan with an
  original outstanding principal balance of $5,000 or less and a repayment term of one year or less.
  Therefore, such loans are exempt from the mandatory flood insurance purchase requirement. The
  distractor about loans secured by residential improved real estate describes loans that are
  subject to the requirement, not exempt.
