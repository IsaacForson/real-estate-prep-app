stem: A licensee complies with an EPA order to abate a hazardous substance release. How many days
  after completing the required action may the licensee petition the President for reimbursement
  from the Superfund?
options:
  - The licensee may petition within 120 days after completion of the required action
  - The licensee may petition within 60 days after completion of the required action
  - The licensee may petition within 90 days after completion of the required action
  - The licensee may petition within 30 days after completion of the required action
key: B
explanation: Under 42 U.S.C. § 9606(b)(2)(A), a person who complies with an EPA order may petition
  the President for reimbursement within 60 days after completing the required action. If
  reimbursement is denied, the person has 30 days to file a court action. The statute does not
  specify 90‑ or 120‑day periods.
