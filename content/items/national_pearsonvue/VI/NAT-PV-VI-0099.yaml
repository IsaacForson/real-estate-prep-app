stem: A buyer purchased a commercial warehouse after hazardous substances had been disposed of on
  the site. To establish the innocent landowner defense under CERCLA, the buyer shows that before
  closing she carried out all appropriate inquiries into the property's previous ownership and uses,
  including an environmental professional's inquiry, and took reasonable steps to stop any
  continuing release after learning of it. Which additional showing must she make?
options:
  - That she obtained a written certification of compliance from the state environmental agency
  - That the property was acquired before the facility was placed on the National Priorities List
  - That at acquisition she did not know and had no reason to know of the disposal
  - That the previous owner has been identified and currently maintains liability insurance
key: C
explanation: Under section 9601(35)(A)(i), the defendant must establish that at the time of
  acquisition she "did not know and had no reason to know" the hazardous substance was disposed of
  at the facility, with "all appropriate inquiries" being the means of proving no reason to know.
  CERCLA does not condition the defense on the prior owner's solvency or on any government release
  of liability.
