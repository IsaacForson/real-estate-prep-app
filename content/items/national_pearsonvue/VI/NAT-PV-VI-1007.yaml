stem: Under 42 U.S.C. § 4012a(e)(2)(B), what must a lender do if it purchases flood insurance on
  behalf of a borrower and the borrower already has effective flood insurance coverage?
options:
  - Extend the loan maturity date to accommodate the insurance cost
  - Require the borrower to obtain a separate flood insurance policy
  - Charge the borrower for the full cost of the lender-purchased insurance
  - Refund the borrower's premiums and fees for the overlapping coverage period
key: D
explanation: The statute requires the lender to refund to the borrower all premiums paid and any
  related fees for any period during which both the borrower's coverage and the lender-purchased
  coverage were in effect. Charging the borrower or requiring a separate policy would violate this
  refund obligation. Extending the loan maturity is not mentioned in the provision.
citation:
  source: 42 U.S.C. § 4012a(e)(2)(B)
  url: null
  quoted_text: (B) refund to the borrower all premiums paid by the borrower for any insurance
    purchased by the lender or servicer under paragraph (2) during any period during which the
    borrower's flood insurance coverage and the insurance coverage purchased by the lender or
    servicer were each in effect, and any related fees charged to the borrower with respect to the
    insurance purchased by the lender or servicer during such period.
