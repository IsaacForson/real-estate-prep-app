stem: Under CERCLA, which of the following is included in the definition of 'ground water'?
options:
  - Water used for irrigation drawn from an aquifer
  - Water stored in a reservoir above the water table
  - Water flowing in a river channel beneath the ground
  - Water in a saturated zone beneath the surface of land
key: D
explanation: The definition of ground water is water in a saturated zone or stratum beneath the
  surface of land or water. Water flowing in a river is surface water, not ground water.
