stem: Under CERCLA, which activity is expressly excluded from the definition of a "release"?
options:
  - The normal application of fertilizer
  - The abandonment of barrels containing hazardous substances
  - The leaching of contaminants from a disposal site
  - The dumping of pollutants into a waterway
key: A
explanation: CERCLA's definition of "release" covers spilling, leaking, dumping, and abandoning
  containers of hazardous substances, but expressly excludes "the normal application of fertilizer,"
  along with workplace-only exposures, engine exhaust, and certain nuclear releases. Abandoning
  barrels containing hazardous substances is specifically included in the definition, so that
  distractor fails.
