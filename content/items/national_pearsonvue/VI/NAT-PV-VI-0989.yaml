stem: Under CERCLA, which entities may recover costs of removal or remedial action that are **NOT**
  inconsistent with the National Contingency Plan?
options:
  - A private citizen who suffered property damage
  - A real estate broker who facilitated the sale
  - The United States Government, a State, or an Indian tribe
  - A mortgage lender holding a lien on the property
key: C
explanation: The statute makes the United States Government, a State, or an Indian tribe liable for
  removal costs not inconsistent with the National Contingency Plan, allowing them to recover those
  costs. The distractor about a private citizen is incorrect because CERCLA does not grant private
  parties a direct right to recover removal costs under this provision.
