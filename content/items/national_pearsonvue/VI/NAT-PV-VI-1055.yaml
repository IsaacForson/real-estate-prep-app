stem: A small business with 90 full-time employees disposes of all its municipal solid waste at a
  facility on the National Priorities List. Assuming the business has **NOT** impeded any response
  action and has complied with all information requests, does the business qualify for the municipal
  solid waste exemption under CERCLA subsection (p)(1)(B)?
options:
  - Yes, because the business employs no more than 100 full-time workers and qualifies as a small
    business concern.
  - No, because the exemption applies only to owners of residential property, not to businesses.
  - No, because the municipal solid waste exemption does not include volume thresholds for liquids.
  - Yes, but only if the waste is classified as non-hazardous municipal solid waste.
key: A
explanation: Subsection (p)(1)(B) exempts a business entity that employs on average not more than
  100 full-time individuals and is a small business concern, provided all of its municipal solid
  waste is generated by the entity. The scenario meets these criteria.
citation:
  source: 42 U.S.C. § 9607(p)(1)(B)
  url: null
  quoted_text: a business entity (including a parent, subsidiary, or affiliate of the entity) that,
    during its 3 taxable years preceding the date of transmittal of written notification from the
    President of its potential liability under this section, employed on average not more than 100
    full-time individuals, or the equivalent thereof, and that is a small business concern (within
    the meaning of the Small Business Act (15 U.S.C. 631 et seq.)) from which was generated all of
    the municipal solid waste attributable to the entity with respect to the facility;
