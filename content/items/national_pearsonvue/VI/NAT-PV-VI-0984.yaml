stem: Under CERCLA, which of the following is included in the definition of 'operational function'?
options:
  - Credit manager role
  - Accounts payable role
  - Plant manager role
  - Personnel manager role
key: C
explanation: The operational function definition includes a facility or plant manager as an example.
  Thus, a plant manager role qualifies. A credit manager role is part of the financial or
  administrative function, not operational.
