stem: Under CERCLA, which of the following activities constitutes a 'release' of a hazardous substance?
options:
  - Spilling gasoline onto soil
  - Nuclear source release
  - Normal fertilizer application
  - Engine exhaust emissions
key: A
explanation: The definition of release includes spilling, leaking, dumping, and similar disposals
  into the environment. Spilling gasoline onto soil is a spilling activity, thus a release. Normal
  fertilizer application, engine exhaust emissions, and nuclear source releases are expressly
  excluded from the definition of release.
