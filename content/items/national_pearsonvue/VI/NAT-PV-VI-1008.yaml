stem: Under CERCLA, which of the following is included in the definition of 'person'?
options:
  - A nonprofit association
  - A private trust fund
  - A municipal agency
  - A foreign government
key: C
explanation: The definition of 'person' in CERCLA expressly includes a municipality among the listed
  entities. Therefore, a municipal agency qualifies as a person under the statute. The distractor
  describing a foreign government is incorrect because foreign governments are not enumerated in the
  definition of 'person'.
