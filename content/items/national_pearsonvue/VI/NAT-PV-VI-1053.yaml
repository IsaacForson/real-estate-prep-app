stem: Under CERCLA, what is the threshold amount of liquid hazardous substance material for the
  small quantity generator exemption under subsection (o)(1)(A)?
options:
  - Yes, because the business employs no more than 100 full-time workers and qualifies as a small
    business concern.
  - No, because the exemption applies only to owners of residential property, not to businesses.
  - No, because the municipal solid waste exemption does not include volume thresholds for liquids.
  - Yes, but only if the waste is classified as non-hazardous municipal solid waste.
key: A
explanation: The statute states that a person is not liable if the total amount of liquid hazardous
  substance material is less than 110 gallons, or such amount as the Administrator may determine.
  This establishes the 110‑gallon threshold for liquids.
citation:
