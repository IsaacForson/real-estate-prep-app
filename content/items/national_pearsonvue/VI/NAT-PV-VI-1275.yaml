stem: Under CERCLA, which State expenses are eligible for credit against the State's share of costs
  for remedial action at a facility listed on the National Priorities List?
options:
  - Reasonable, documented, direct out-of-pocket expenditures of non-Federal funds
  - Expenses incurred only after the facility is listed on the National Priorities List
  - Administrative overhead costs associated with State environmental agencies
  - Expenses that have been reimbursed by Federal grant programs
key: A
explanation: The statute limits the credit to reasonable, documented, direct out-of-pocket
  expenditures of non‑Federal funds made by the State for remedial action. The distractor that only
  post‑listing expenses qualify is incorrect because the credit also covers certain pre‑listing
  expenses under paragraph (5)(B).
citation:
  source: 42 U.S.C. §§ 9601–9628(5)(A)
  url: null
  quoted_text: The credit under this paragraph shall be limited to those State expenses which the
    President determines to be reasonable, documented, direct out-of-pocket expenditures of
    non-Federal funds.
