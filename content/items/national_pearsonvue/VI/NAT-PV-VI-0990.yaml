stem: Under CERCLA, which of the following is recoverable as damages for injury to natural resources
  resulting from a hazardous substance release?
options:
  - Lost profits from business interruption caused by the release
  - Attorney's fees in litigation against the responsible party
  - Punitive damages awarded for willful misconduct under federal law
  - The reasonable costs of assessing injury to natural resources
key: D
explanation: Subsection (a)(1)(C) expressly includes the reasonable costs of assessing injury to
  natural resources as part of recoverable damages. The distractor about lost profits is incorrect
  because CERCLA does not provide for recovery of business losses under this subsection.
