stem: According to CERCLA, which of the following is included in the definition of 'municipal solid
  waste'?
options:
  - Manufacturing waste not household-like
  - Hazardous waste above household levels
  - Typical food and yard waste material
  - Combustion ash from incinerators
key: C
explanation: CERCLA § 9607(p)(4)(B) expressly lists food and yard waste as examples of municipal
  solid waste. Combustion ash from incinerators is excluded by subsection (p)(4)(C)(i), and
  manufacturing waste that is not household‑like is excluded by subsection (p)(4)(C)(ii). Hazardous
  waste exceeding typical household levels also fails the definition’s hazardous‑substance limit.
  Thus only typical food and yard waste material is included.
