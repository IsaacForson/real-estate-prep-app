stem: Under CERCLA, which of the following is included in the definition of 'financial or
  administrative function'?
options:
  - Facility manager role
  - Credit manager role
  - Operations manager role
  - Plant manager role
key: B
explanation: The definition of financial or administrative function explicitly lists a credit
  manager as an example. Therefore, a credit manager role qualifies. A facility manager role belongs
  to operational function, not financial or administrative function.
