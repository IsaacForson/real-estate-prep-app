stem: Under CERCLA, what does the term 'bona fide prospective purchaser' mean?
options:
  - It is a person who acquires ownership of a facility after January 11, 2002 and establishes by a
    preponderance of the evidence each of the criteria described in clauses (i) through (viii) of
    subparagraph (B).
  - It is a person who acquires a leasehold interest in a facility after January 11, 2002 and
    establishes by a preponderance of the evidence that the leasehold interest is not designed to
    avoid liability under this chapter.
  - It is a person who acquires ownership of a facility before January 11, 2002 and establishes by a
    preponderance of the evidence each of the criteria described in clauses (i) through (viii) of
    subparagraph (B).
  - It is a person who acquires ownership of a facility and is potentially liable for response costs
    through a direct or indirect familial relationship or a contractual, corporate, or financial
    relationship other than one created by the instruments conveying title.
key: A
explanation: The statute defines a bona fide prospective purchaser as a person who acquires
  ownership of a facility after January 11, 2002 and establishes by a preponderance of the evidence
  each of the criteria listed in subparagraph (B)(i)–(viii) (42 U.S.C. § 9601(40)(A)). The other
  options either describe leasehold interests, incorrect timing, or potential liability, which do
  not satisfy the definition.
