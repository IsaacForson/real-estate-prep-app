stem: Under CERCLA, which substance is expressly excluded from the definition of 'hazardous substance'?
options:
  - Petroleum products
  - Lead-based paint
  - Mercury thermometers
  - Asbestos insulation
key: A
explanation: The definition of hazardous substance explicitly states that the term does not include
  petroleum, including crude oil or any fraction thereof. Lead-based paint, mercury thermometers,
  and asbestos insulation are considered hazardous substances under other provisions of the statute.
citation:
  source: 42 U.S.C. § 9601(14)
  url: null
  quoted_text: The term does not include petroleum, including crude oil or any fraction thereof which
    is not otherwise specifically listed or designated as a hazardous substance under subparagraphs
    (A) through (F) of this paragraph, and the term does not include natural gas, natural gas
    liquids, liquefied natural gas, or synthetic gas usable for fuel (or mixtures of natural gas and
    such synthetic gas).
