stem: A lender notifies a borrower that the property lacks sufficient flood insurance coverage. If
  the borrower fails to purchase the required coverage within 45 days, what action may the lender
  take under 42 U.S.C. § 4012a(e)(2)?
options:
  - The lender may terminate the loan agreement immediately and demand repayment of the outstanding
    balance.
  - The lender may purchase the insurance on behalf of the borrower and may charge the borrower for
    the premiums and fees.
  - The lender may increase the loan interest rate by 2% to cover the risk and notify the borrower
    in writing.
  - The lender may report the borrower to a national credit bureau as delinquent and advise future
    lenders of the default.
key: B
explanation: Under the statute, if the borrower fails to purchase the required flood insurance
  within 45 days after notification, the lender or servicer shall purchase the insurance on behalf
  of the borrower and may charge the borrower for the cost of premiums and fees incurred. The other
  actions—terminating the loan, increasing the interest rate, or reporting to a credit bureau—are
  not authorized by this provision.
