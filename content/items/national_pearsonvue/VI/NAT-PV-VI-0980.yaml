stem: A licensee discovers a leaking underground storage tank on a property. Under CERCLA, which
  statement is correct regarding whether the tank qualifies as a 'facility'?
options:
  - The tank is a facility because it is a storage container
  - The tank is not a facility because it is underground
  - The tank is a facility only if it contains hazardous substances
  - The tank is not a facility because it is not a building
key: A
explanation: The definition of facility includes any storage container, so the tank qualifies as a
  facility. The facility definition does not require the container to hold hazardous substances.
