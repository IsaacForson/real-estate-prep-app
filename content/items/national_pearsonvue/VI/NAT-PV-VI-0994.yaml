stem: A county receives a grant to assist 12 rental units under 42 U.S.C. § 4852(a)(1). How many of
  those units must be occupied by families with incomes at or below 50 percent of the area median
  income to satisfy the grant requirement?
options:
  - 4 units
  - 8 units
  - 6 units
  - 10 units
key: C
explanation: To satisfy the grant condition, half of the 12 rental units must be reserved for
  families with incomes at or below 50 percent of area median income. Multiplying 12 by 0.50 yields
  six units. The other options correspond to incorrect fractions of the total.
citation:
  source: 42 U.S.C. §§ 4851–4856 (Lead paint — Residential Lead-Based Paint Hazard Reduction Act) —
    Residential Lead-Based Paint Hazard Reduction Act (incl. § 4852d disclosure) § 4852(a)(1)
  url: null
