stem: If the Secretary transmitted the first biennial report 24 months after October 28, 1992, as
  required by 42 U.S.C. § 4856(b)(1), when is the next biennial report due?
options:
  - October 28, 1994
  - October 28, 1996
  - October 28, 1998
  - October 28, 2000
key: B
explanation: The first biennial report is due 24 months after October 28, 1992, which is October 28,
  1994. The statute requires a report at the end of every 24-month period thereafter, so the next
  report is due another 24 months later, on October 28, 1996. The option October 28, 1994
  corresponds to the first report, not the subsequent one.
