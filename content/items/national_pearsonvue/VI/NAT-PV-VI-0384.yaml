stem: According to the property condition disclosure fundamentals, how is a latent defect defined?
options:
  - A latent defect is a defect that the seller does not know exists at the time of sale.
  - A latent defect is a defect that becomes apparent only after the buyer takes possession.
  - A latent defect is hidden and would not be found by a reasonably diligent inspection.
  - A latent defect is visible or discoverable through an ordinary, reasonable inspection of the
    property.
key: C
explanation: A latent defect is defined as a hidden defect that would not be found by a reasonably
  diligent inspection, per §1.2. The distractor describing a visible or discoverable defect is
  incorrect because that describes a patent defect, not a latent one.
