stem: Under CERCLA, in a contribution action concerning municipal solid waste disposed of after
  April 1, 2001, which party bears the burden of proof to show that the municipal solid waste
  exemption does **NOT** apply?
options:
  - The party bringing the action
  - The President of the United States
  - The party defending the action
  - The Environmental Protection Agency
key: A
explanation: The burden of proof falls on the party bringing the action under CERCLA § 9607(p)(5),
  which states that the party bringing the action must demonstrate that the exemption conditions are
  not met. The defending party, the EPA, or the President do not bear this burden in such a
  contribution action. Therefore, the party bringing the action is correct.
