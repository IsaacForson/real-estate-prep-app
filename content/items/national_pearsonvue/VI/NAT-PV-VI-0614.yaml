stem: Under the Residential Lead-Based Paint Hazard Reduction Act, what is the definition of "abatement"?
options:
  - A temporary reduction of human exposure to lead-based paint hazards
  - A set of measures to permanently eliminate lead-based paint hazards
  - A surface-by-surface investigation to determine the presence of lead-based paint
  - Bare soil on residential real property containing lead at hazardous levels
key: B
explanation: The statute defines abatement as any set of measures designed to permanently eliminate
  lead‑based paint hazards in accordance with federal standards (42 U.S.C. §§ 4851–4856 § 4851b(1)).
  A temporary reduction of human exposure to lead‑based paint hazards describes interim controls,
  which are not abatement.
citation:
  source: 42 U.S.C. §§ 4851–4856 § 4851b(1)
  url: null
  quoted_text: The term "abatement" means any set of measures designed to permanently eliminate
    lead-based paint hazards in accordance with standards established by appropriate Federal
    agencies.
