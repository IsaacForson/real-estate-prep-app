stem: According to the EPA's radon guidance, what is the standard fix for reducing radon levels?
options:
  - Using increased ventilation with exhaust fans
  - Using installation of air purifiers
  - Using sealing of foundation cracks
  - Using active soil (sub-slab) depressurization
key: D
explanation: The EPA guidance states that the standard fix for radon is active soil (sub-slab)
  depressurization. The distractor about sealing foundation cracks is a common misconception;
  sealing alone does not address radon entry from beneath the slab.
