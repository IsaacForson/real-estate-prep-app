stem: Under CERCLA, which of the following persons is liable for response costs resulting from a
  release of a hazardous substance?
options:
  - A state government that provided emergency response without gross negligence
  - A transporter who merely carried non-hazardous goods
  - A person who merely rents a facility but does not own or operate it
  - A person who arranged for disposal of hazardous substances they owned
key: D
explanation: Under CERCLA subsection (a)(3), any person who arranged for disposal or treatment of
  hazardous substances they owned or possessed is liable for response costs. The other options
  describe parties not covered by the liability provisions.
citation:
  source: 42 U.S.C. §§ 9601–9628 (CERCLA) — CERCLA — Hazardous Substances Releases, Liability,
    Compensation — § 9607(a)(3)
  url: null
