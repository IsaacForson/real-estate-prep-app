stem: Under the Residential Lead-Based Paint Hazard Reduction Act, how many days must a purchaser be
  permitted to conduct a risk assessment or inspection for lead-based paint hazards before becoming
  obligated under a purchase contract for target housing, unless the parties agree otherwise?
options:
  - 5 days
  - 10 days
  - 20 days
  - 15 days
key: B
explanation: The statute requires a 10-day period for the purchaser to conduct a risk assessment or
  inspection before obligation, unless the parties mutually agree to a different period. The 5‑day
  option confuses the period with other disclosure timelines, while 15 and 20 days are not
  mentioned.
