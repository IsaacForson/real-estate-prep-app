stem: A buyer is evaluating several properties. Which of the following properties qualifies as
  target housing under the Residential Lead-Based Paint Hazard Reduction Act?
options:
  - A single-family home built in 1975, not restricted to elderly or disabled persons, with three
    bedrooms
  - A duplex built in 1980 with two units, not restricted to elderly or disabled persons
  - A studio apartment built in 1975, with no child under 6 residing or expected
  - A senior living facility built in 1970, restricted to persons aged 62 and older
key: A
explanation: Under §4851b(27), target housing is any pre‑1978 dwelling that is not exclusively for
  the elderly or persons with disabilities and is not a zero‑bedroom unit unless a child under six
  lives or is expected to live there. The single‑family home built in 1975 meets all criteria,
  making it target housing. The studio apartment is a zero‑bedroom unit with no young child, so it
  is excluded; the senior facility is housing for the elderly; and the duplex built after 1978 fails
  the age requirement.
citation:
