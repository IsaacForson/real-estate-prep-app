stem: Which of the following underground storage tanks qualifies for the federal exemption under
  Subtitle I of the Resource Conservation and Recovery Act?
options:
  - A 1,500-gallon tank storing diesel for farm tractor use
  - A 2,000-gallon tank storing used oil for recycling
  - A 1,000-gallon tank storing heating oil for use on the premises
  - A 500-gallon tank storing gasoline for a commercial gas station
key: C
explanation: The federal exemptions most relevant to residential practice are tanks storing heating
  oil for use on the premises and farm or residential tanks of 1,100 gallons or less storing motor
  fuel for noncommercial use. Therefore, a 1,000-gallon heating oil tank on the premises qualifies.
  The other options either exceed the 1,100‑gallon limit for motor‑fuel tanks or involve commercial
  use, which removes the exemption.
