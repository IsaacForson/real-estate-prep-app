stem: A title insurance company acquires a vessel while handling a claim settlement. Under CERCLA,
  does this entity qualify as a lender?
options:
  - The entity does not qualify as a lender because only insured depository institutions are lenders.
  - The entity does not qualify as a lender because it must also make a bona fide extension of
    credit.
  - The entity does not qualify as a lender because only entities that guarantee against default are
    lenders.
  - The entity qualifies as a lender because it provides title insurance and acquires a vessel in
    underwriting claims.
key: D
explanation: Under CERCLA, a lender includes a person that provides title insurance and acquires a
  vessel or facility as a result of assignment or conveyance in the course of underwriting claims
  and claims settlement. Therefore, the title insurance company qualifies. The claim that only
  insured depository institutions are lenders ignores other categories listed in the definition.
