stem: For owner‑occupied housing receiving a grant under 42 U.S.C. § 4852(a)(2), what is the minimum
  proportion of units that must be occupied by a child under six years old or where such a child
  spends significant time?
options:
  - At least 80 percent
  - At least 90 percent
  - At least 70 percent
  - At least 95 percent
key: B
explanation: The rule states that not less than 90 percent of the units assisted shall be occupied
  by a child under six or where such a child spends significant time, which means at least 90
  percent. Lower percentages would fail to meet the statutory requirement. The higher option exceeds
  the minimum but is not the correct minimum.
