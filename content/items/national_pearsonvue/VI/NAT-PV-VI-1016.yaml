stem: A property owner incurs cleanup costs on March 10, and the EPA sends written notice of
  potential liability via certified mail on April 2. Under CERCLA §9607(l)(2), when does the federal
  lien arise?
options:
  - 03/10
  - 04/02
  - 03/31
  - 05/02
key: B
explanation: The lien arises at the later of the time costs are first incurred or the time written
  notice of potential liability is provided. Since notice arrived April 2, which is later than March
  10, the lien arises on April 2. The March 10 distractor reflects the cost-incurrence date, while
  March 31 and May 2 are incorrect calculations.
citation:
  source: 42 U.S.C. §§ 9601–9628 (CERCLA) — CERCLA — Hazardous Substances Releases, Liability,
    Compensation — § 9607(l)(2)
  url: null
  quoted_text: "The lien imposed by this subsection shall arise at the later of the following: (A) The
    time costs are first incurred by the United States with respect to a response action under this
    chapter. (B) The time that the person referred to in paragraph (1) is provided (by certified or
    registered mail) written notice of potential liability."
