stem: Under CERCLA §9607(2), how many days after notifying the EPA Administrator does the transfer
  of liability to the Post-closure Liability Fund become effective?
options:
  - 30 days
  - 120 days
  - 60 days
  - 90 days
key: D
explanation: The statute states that transfer of liability shall be effective ninety days after the
  owner or operator notifies the Administrator that conditions have been satisfied. Therefore, the
  correct period is ninety days. The thirty- and sixty-day distractors confuse other CERCLA
  timelines, while one hundred twenty days incorrectly adds a month.
