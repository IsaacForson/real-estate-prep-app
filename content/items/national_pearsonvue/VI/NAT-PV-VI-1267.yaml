stem: Under CERCLA, which of the following is included in the definition of 'environment'?
options:
  - A navigable water body
  - A privately owned vehicle
  - A consumer product in use
  - A vessel in international waters
key: A
explanation: The definition of 'environment' includes navigable waters, among other components. A
  navigable water body is therefore part of the environment. A privately owned vehicle and a
  consumer product in use are not included, and a vessel in international waters is excluded unless
  under U.S. jurisdiction.
citation:
  source: 42 U.S.C. §§ 9601–9628 (CERCLA) — CERCLA — Hazardous Substances Releases, Liability,
    Compensation §9601(8)
  url: null
  quoted_text: The term 'environment' means (A) the navigable waters, the waters of the contiguous
    zone, and the ocean waters of which the natural resources are under the exclusive management
    authority of the United States under the Magnuson-Stevens Fishery Conservation and Management
    Act [16 U.S.C. 1801 et seq.], and (B) any other surface water, ground water, drinking water
    supply, land surface or subsurface strata, or ambient air within the United States or under the
    jurisdiction of the United States.
