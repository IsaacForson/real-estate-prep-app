stem: According to 42 U.S.C. § 4012a(d)(4), how is the term 'residential improved real estate' defined?
options:
  - Improved real estate for which the improvement is a residential building
  - Improved real estate for which the improvement is a Federal agency lender
  - Improved real estate for which the improvement is a condominium association
  - Improved real estate for which the improvement is a special flood hazard area
key: A
explanation: The subsection defines residential improved real estate as improved real estate for
  which the improvement is a residential building. This matches the correct option. The distractor
  describing property located in a special flood hazard area adds a location condition not present
  in the definition.
