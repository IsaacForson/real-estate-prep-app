stem: According to the property condition disclosure fundamentals, what is a material fact?
options:
  - A material fact is any fact a reasonable person would consider important in deciding whether to
    buy, sell, or lease a property, or on what terms.
  - A material fact is any legal matter affecting title to the property that a reasonable person
    would deem relevant when deciding whether to complete the transaction.
  - A material fact is any fact the seller or the listing licensee subjectively believes is
    important enough to influence a buyer's decision on price or terms.
  - A material fact is any physical defect in the property's structure or systems that a reasonable
    buyer would consider significant before agreeing to purchase.
key: A
explanation: The correct answer reflects the definition of a material fact as any fact a reasonable
  person would consider important in deciding whether to buy, sell, or lease a property, or on what
  terms, as stated in §1.1. The distractor that limits material facts to physical conditions only is
  incorrect because the definition also includes legal matters and transaction-related matters.
