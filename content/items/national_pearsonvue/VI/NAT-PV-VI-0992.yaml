stem: Under 42 U.S.C. § 4852(a)(1), what is the minimum percentage of rental housing units that must
  be occupied by families with incomes at or below 50 percent of the area median income to qualify
  for a lead-based paint hazard reduction grant?
options:
  - At least 50 percent
  - At least 70 percent
  - At least 60 percent
  - At least 80 percent
key: A
explanation: The statute requires that at least 50 percent of the units in rental‑housing grants be
  occupied by or made available to families earning no more than 50 percent of the area median
  income. This threshold ensures the grant targets low‑income households. The other percentages
  listed are not mentioned in the rule and therefore incorrect.
