stem: What is a common state requirement for listing and buyer agreements regarding their term?
options:
  - They must be oral agreements to be enforceable
  - They must have a definite termination date
  - They must automatically renew annually unless cancelled
  - They must be notarized and recorded with the county
key: B
explanation: Most states require listing and buyer agreements to have a definite termination date;
  automatic renewal clauses are prohibited in many states. The option stating they must have a
  definite termination date matches this requirement, making it correct. The option stating they
  must automatically renew annually unless cancelled contradicts the rule, so it is incorrect.
