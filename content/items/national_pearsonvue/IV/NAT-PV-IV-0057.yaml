stem: "A tenant transfers the entire remaining term of a lease to another person. Under general
  leasing principles, this transfer is:"
options:
  - a surrender, which terminates the original tenant's liability
  - a novation, which releases the original tenant from the lease
  - a sublease, because the original tenant remains liable to the landlord
  - an assignment, making the transferee the landlord's tenant
key: D
explanation: Transferring the entire remaining term is an assignment; the assignee becomes the
  landlord's tenant, though the original tenant stays liable absent a release. A sublease transfers
  less than the entire interest, so calling this a sublease is the tempting error.
