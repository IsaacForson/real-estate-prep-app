stem: Which statement correctly describes a void contract under general contract principles?
options:
  - A contract that always transfers rights but leaves the original party secondarily liable
  - A contract that a court will always enforce despite being otherwise invalid
  - A contract that never had legal effect from the outset
  - A contract that always remains valid until one party chooses to cancel it
key: C
explanation: A void contract has no legal effect from the beginning; it is not enforceable at all. A
  voidable contract, by contrast, is enforceable until the protected party elects to avoid it.
citation:
  source: REP Ref. Contracts § 13.1
  url: null
  quoted_text: "*Void vs. voidable*: void never had effect; voidable is valid until the protected
    party cancels."
