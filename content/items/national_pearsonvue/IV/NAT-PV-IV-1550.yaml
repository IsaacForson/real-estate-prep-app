stem: What is required for a brokerage to engage in dual agency in a state that permits it?
options:
  - The requirement for dual agency is approval from the broker's supervising manager.
  - The requirement for dual agency is disclosure of the arrangement to the parties after closing.
  - The requirement for dual agency is verbal agreement from both parties.
  - The requirement for dual agency is informed written consent of both parties.
key: D
explanation: Dual agency is permitted only with the informed written consent of both parties in
  states that allow it. The option stating that dual agency requires approval from the broker's
  supervising manager is incorrect because that approval does not satisfy the legal requirement for
  informed written consent from the parties. The option stating that dual agency requires disclosure
  of the arrangement to the parties after closing is incorrect because consent must be obtained
  before the parties are represented, not after closing. The option stating that dual agency
  requires verbal agreement from both parties is incorrect because the consent must be written, not
  merely verbal.
