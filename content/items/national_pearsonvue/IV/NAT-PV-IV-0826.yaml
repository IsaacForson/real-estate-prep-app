stem: Which event terminates an agency relationship by operation of law under general agency law?
options:
  - Mutual agreement to end the relationship
  - Expiration of the agreed term
  - Revocation by the principal
  - Death of the principal
key: D
explanation: Death or incapacity of either the principal or the agent terminates the agency by
  operation of law. Expiration of the term, mutual agreement, and revocation are acts of the
  parties, not operation of law.
citation:
  source: "REP Ref. Agency — Reference note: agency relationships, creation/termination, fiduciary
