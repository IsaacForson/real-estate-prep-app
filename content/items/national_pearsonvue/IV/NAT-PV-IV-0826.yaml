    terminated § 4.2 Operation of law"
  url: null
  quoted_text: Death or incapacity of either the principal or the agent (broker). Because the
    relationship is personal, the death of a sole-proprietor broker terminates the firm's listings;
    the death of a salesperson does not, because the salesperson is not the seller's agent in the
    primary sense — the broker is.
