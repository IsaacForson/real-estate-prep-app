stem: According to general contract principles, what constitutes consideration in a real estate
  purchase agreement?
options:
  - The buyer's promise to pay the purchase price
  - The earnest money deposited with the broker
  - The love and affection between the parties
  - The promise to pay a broker's commission
key: A
explanation: The buyer's promise to pay the price serves as consideration for the seller's promise
  to convey under §2.4. Earnest money is not consideration, as clarified in §5.1. Love and affection
  and a broker's commission promise do not satisfy the consideration requirement for the purchase
  agreement.
