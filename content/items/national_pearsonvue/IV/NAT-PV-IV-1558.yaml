stem: If a contract for the sale of real property has an illegal object, what is its legal status?
options:
  - "Please select the correct answer: Voidable contract"
  - "Please select the correct answer: Void contract"
  - "Please select the correct answer: Valid contract"
  - "Please select the correct answer: Unenforceable contract"
key: B
explanation: Under §2.5, a contract whose object is illegal is void, meaning it has no legal effect
  from the outset. The Voidable contract option is incorrect because voidability applies to
  contracts affected by incapacity or fraud, not illegality.
citation:
  source: REP Ref. Contracts § 2.5
  url: null
  quoted_text: A contract whose object is illegal — for example, an agreement between competing
    brokers to fix commission rates, which the cached Sherman Act prohibits, or an agreement to
    violate zoning law — is void.
