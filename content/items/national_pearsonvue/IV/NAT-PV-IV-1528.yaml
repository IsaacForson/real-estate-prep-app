stem: A broker abandons a listing after three months of a six‑month exclusive listing agreement,
  without the seller’s consent. What is the likely result under general agency law?
options:
  - The broker may owe the seller damages for abandoning the listing
  - The broker retains any commission earned to date
  - The listing agreement is automatically extended to twelve months
  - The seller must pay the broker the full commission as if the listing had continued
key: A
explanation: Under general agency law, a party who terminates a contract without cause before the
  agreed term may be liable for damages. Therefore, a broker who abandons a listing before the end
  of an exclusive listing agreement may owe the seller damages for breach of contract.
