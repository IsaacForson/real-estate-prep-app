stem: According to §6.5, which activity performed for a customer does **NOT** create an agency
  relationship?
options:
  - Advising the customer on what offer to make and terms
  - Negotiating on the customer's behalf presenting offers
  - Providing forms, scheduling showings without advising
  - Telling the customer 'I'll take care of you', advising
key: C
explanation: Section 6.5 states that performing ministerial acts such as providing forms, scheduling
  showings, transmitting offers, or explaining what a form says without advising what to do does not
  create an agency relationship. Advising the customer on what to offer or negotiate goes beyond
  ministerial acts and can create an implied agency.
