stem: Under general contract principles, what is the likely legal effect of an oral lease agreement
  for a term of two years?
options:
  - The lease is valid and enforceable
  - The lease is voidable by the tenant
  - The lease is void and unenforceable
  - The lease is unenforceable but not void
key: D
explanation: The Statute of Frauds requires leases longer than one year to be in writing; an oral
  lease for two years is therefore unenforceable, but not void, because the parties may still choose
  to perform. It is not automatically void, nor is it voidable solely by the tenant.
