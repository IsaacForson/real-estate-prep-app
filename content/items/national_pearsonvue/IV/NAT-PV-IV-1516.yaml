stem: According to the text, what is required for an amendment to a real estate contract to be
  enforceable?
options:
  - Oral agreement witnessed by a third party.
  - Written notice given to the escrow agent.
  - Recorded document filed with the county.
  - Written agreement signed by both parties.
key: D
explanation: § 11.2 Amendment specifies that an amendment requires the same mutual assent as the
  original contract and, under the Statute of Frauds, should be in writing and signed by both
  parties. An oral agreement alone does not satisfy this requirement.
