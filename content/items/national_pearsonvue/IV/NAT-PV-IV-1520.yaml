stem: A licensee represents a buyer for a timeshare property and also owns a title insurance company
  that is being recommended to the buyer. According to §7.3, what must the licensee do?
options:
  - Disclosing the ownership interest to the buyer before the buyer acts on the recommendation
  - Informing the buyer only after the title company is chosen
  - Seeking consent from the buyer before the closing of the transaction
  - Withholding the disclosure because the property is a timeshare and not informing the buyer
key: A
explanation: Section 7.3 requires a licensee to disclose any ownership interest in a title,
  mortgage, or inspection company being recommended before the client acts on the matter, and to
  obtain consent where waivable. Failing to disclose until after selection or withholding the
  information violates this duty.
