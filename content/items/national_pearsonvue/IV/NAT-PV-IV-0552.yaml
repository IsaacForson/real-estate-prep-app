  quoted_text: A licensee who advises an unrepresented buyer on what to offer, negotiates on the
    buyer's behalf, and tells the buyer 'I'll take care of you' may have become the buyer's implied
    agent — and if the licensee is also the listing agent, an undisclosed dual agent.
