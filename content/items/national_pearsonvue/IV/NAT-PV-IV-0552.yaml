stem: A licensee advises an unrepresented buyer on what to offer, negotiates on the buyer's behalf,
  and tells the buyer 'I’ll take care of you.' If the licensee is also the listing agent for the
  seller, what is the risk?
options:
  - The licensee may become an undisclosed dual agent.
  - The licensee must terminate the listing agreement.
  - The licensee must disclose the buyer's financing to the seller.
  - The licensee may collect a referral fee from the seller.
key: A
explanation: Advising an unrepresented buyer and negotiating on the buyer’s behalf creates an
  implied agency relationship with the buyer. When the same licensee is also the seller’s listing
  agent, the licensee would be acting as a dual agent and must disclose that dual agency; failure to
  do so results in an undisclosed dual agency, which is prohibited. The statement that the licensee
  must disclose the buyer’s financing is incorrect because the required disclosure concerns the
  agency relationship, not financing details. The statement that the licensee must terminate the
  listing agreement is incorrect because termination is not required; the proper action is
  disclosure. The statement that the licensee may collect a referral fee from the seller is
  incorrect because a referral fee is not permissible in this context.
citation:
  source: "REP Ref. Agency — Reference note: agency relationships, creation/termination, fiduciary
