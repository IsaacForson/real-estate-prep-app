stem: According to general contract principles, what is the legal effect of a novation?
options:
  - A novation substitutes a new party and discharges the original party from liability
  - A novation transfers only the benefits of the contract without affecting obligations
  - A novation creates a separate contract that runs alongside the original
  - A novation transfers rights and leaves the original party secondarily liable
key: A
explanation: A novation substitutes a new party and releases the original party from liability,
  which matches the rule that novation substitutes a party and releases the original. The distractor
  describing transfer of rights with secondary liability describes an assignment, not a novation.
