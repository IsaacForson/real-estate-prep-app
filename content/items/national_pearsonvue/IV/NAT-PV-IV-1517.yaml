stem: A licensee represents a buyer and seller under a purchase agreement that sets the closing date
  for June 30. Two weeks before closing, the buyer requests to move the closing to July 15. What
  must the licensee do to make this change enforceable according to the text?
options:
  - Notify the escrow company and await their confirmation.
  - Submit a new purchase agreement to the lender for approval.
  - Prepare a written amendment signed by both buyer and seller.
  - Inform the parties verbally and note the change in the file.
key: C
explanation: An amendment to change the closing date must be in writing and signed by both parties,
  as required by § 11.2 Amendment. A verbal agreement is insufficient under the Statute of Frauds.
