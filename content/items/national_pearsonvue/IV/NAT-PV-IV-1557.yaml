stem: A broker receives an earnest money deposit and, instead of placing it in a trust account,
  deposits the funds into his personal checking account and later uses the money to purchase a
  personal vehicle. Under §5.2, which violation(s) has the broker committed?
options:
  - Both commingling and conversion
  - No violation of escrow rules
  - Commingling violation only
  - Conversion violation only
key: A
explanation: Depositing the earnest money into a personal account mixes client funds with the
  broker's own funds, which is commingling. Using the money to buy a personal vehicle is an
  unauthorized use of the funds, which is conversion. Therefore both violations occurred. The option
  stating that there is no violation of escrow rules is incorrect because the broker both commingled
  the funds and converted them to personal use.
citation:
  source: REP Ref. Contracts § 5.2
  url: null
  quoted_text: A broker who holds earnest money must deposit it in a trust (escrow) account within the
    time state law prescribes, may not mix it with the brokerage's own operating funds
    (commingling), and may not use it for any purpose other than as the contract and the parties
    direct (using it otherwise is conversion).
