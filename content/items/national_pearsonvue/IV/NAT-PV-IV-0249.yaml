stem: "After signing a purchase agreement, the parties agree to include a clause specifying who will
  pay for repairs. This addition is:"
options:
  - It is an addendum because it was prepared before the contract was signed
  - It is an amendment because it modifies the contract after execution
  - It is an addendum because it adds new terms without changing existing ones
  - It is an amendment because it requires a new consideration to be valid
key: B
explanation: An amendment modifies a contract after it has been formed, whereas an addendum is added
  at the time of formation. Since the clause is added after signing, it is an amendment. The
  distractor labeling it an addendum is wrong because addenda are only used at formation, not after
  execution.
