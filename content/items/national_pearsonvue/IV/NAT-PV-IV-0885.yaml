stem: Which fiduciary duty generally survives the termination of an agency relationship?
options:
  - The duty of reasonable care to the principal
  - The duty of undivided loyalty to the principal
  - The duty of confidentiality to the principal
  - The duty of strict obedience to the principal
key: C
explanation: The duty of confidentiality generally survives the end of the agency relationship,
  while duties of loyalty, obedience, and disclosure end when the agency terminates. The distractor
  that lists the duty of loyalty is incorrect because loyalty does not survive termination.
