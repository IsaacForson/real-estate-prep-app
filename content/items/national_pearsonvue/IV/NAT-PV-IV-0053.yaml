stem: Which statement correctly describes earnest money in a real estate purchase agreement?
options:
  - It is a deposit showing good faith, credited to the buyer at closing
  - It is automatically forfeited whenever the buyer terminates the contract
  - It is required to form a valid contract between the parties
  - It is the consideration that supports the seller's promise
key: A
explanation: Earnest money is a good-faith deposit showing serious intent; it is not required to
  form a contract and is not the consideration (the mutual promises are). If the sale closes it is
  credited to the buyer's funds, and if the buyer properly terminates under a contingency it is
  returned. Forfeiture occurs only if the buyer defaults and the contract so provides.
