stem: A licensee represents both the buyer and seller in the same transaction without obtaining
  informed written consent from either party. Which violation does this most directly constitute?
options:
  - Commingling earnest money with brokerage funds
  - Making a negligent misrepresentation about property condition
  - Breaching the duty of confidentiality to the client
  - Engaging in undisclosed dual agency
key: D
explanation: "Representing both the buyer and seller in the same transaction without obtaining each
  party's informed written consent is undisclosed dual agency, which is prohibited. The other
  options describe different violations: commingling earnest money with brokerage funds, making a
  negligent misrepresentation about property condition, and breaching the duty of confidentiality to
  the client; none of these match the conduct described."
