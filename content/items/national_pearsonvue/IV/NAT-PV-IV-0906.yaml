stem: What is an appraisal contingency?
options:
  - A clause that allows the buyer to terminate or renegotiate if the lender's appraisal comes in
    below the purchase price.
  - A clause that obligates the seller to reduce the sale price to match the appraised value or
    terminate the contract.
  - A clause that automatically extends the contingency period and allows renegotiation when the
    appraisal is low.
  - A clause that requires the buyer to increase the earnest money deposit if the appraisal exceeds
    the purchase price.
key: A
explanation: The rule states that an appraisal contingency allows the buyer to terminate or
  renegotiate if the lender's appraisal comes in below the purchase price, because the lender bases
  the loan on the lower of price or appraised value. The distractor about increasing the earnest
  money deposit is incorrect because the appraisal contingency does not impose any earnest‑money
  requirement; it only gives the buyer options when the appraisal is low.
citation:
