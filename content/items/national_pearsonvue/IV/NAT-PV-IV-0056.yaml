stem: Under general contract principles, which statement correctly distinguishes an addendum from an
  amendment?
options:
  - An addendum is used after closing; an amendment is used only before any offer.
  - An addendum requires both signatures; an amendment may be made unilaterally.
  - An addendum is attached at formation; an amendment modifies an existing contract.
  - An addendum modifies an existing contract; an amendment is attached at formation.
key: C
explanation: An addendum is part of the original bargain, attached when the contract is formed,
  while an amendment is a change agreed to by both parties after the contract exists. The distractor
  reverses the two definitions, which is the common confusion.
