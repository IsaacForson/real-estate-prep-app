stem: Under general agency law, what is the likely consequence if a seller cancels an exclusive
  listing agreement before the expiration date without cause?
options:
  - The listing agreement automatically renews for another term
  - The broker loses the right to receive any future referral fees
  - The broker must refund any earnest money received
  - The seller may be liable to pay the broker commission or expenses
key: D
explanation: "Under agency law, a party who terminates a contract without cause before the agreed
  term may be liable for damages. Therefore, if a seller cancels an exclusive listing agreement
  early without cause, the seller may owe the broker the commission or expenses that would have been
  earned. The other statements are incorrect: the listing agreement does not automatically renew
  when terminated early; the broker’s right to referral fees is not affected by the seller’s early
  cancellation; and earnest money refunds relate to purchase contracts, not to the termination of a
  listing agreement."
citation:
