stem: According to § 5.4 Disclosure (full disclosure to the principal), which of the following must
  a listing agent disclose to the seller-client?
options:
  - The agent's commission rate
  - The buyer's ability to perform
  - The property's zoning classification
  - The seller's motivation for selling
key: B
explanation: Section 5.4 explicitly lists the buyer's ability to perform as information a listing
  agent must disclose to a seller-client. The agent's commission rate is not mentioned in that duty,
  so it is not required under this provision.
