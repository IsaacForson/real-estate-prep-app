stem: A seller lists a property and receives an offer from a buyer. Before the buyer communicates
  acceptance, the seller informs the buyer that the offer is withdrawn. Under general contract
  principles, what is the effect of the seller's action?
options:
  - A revocation that terminates the offer if communicated before acceptance
  - A rejection that prevents the buyer from accepting the offer
  - A counteroffer that modifies the original offer's terms
  - An acceptance that creates a binding contract despite the withdrawal
key: A
explanation: The offeror’s withdrawal of an offer before acceptance is a revocation that ends the
  offer if the offeree receives it. The distractor describing a rejection mischaracterizes the
  actor, as only the offeree can reject an offer.
citation:
  source: REP Ref. Contracts § 13.1
  url: null
  quoted_text: "*Revocation vs. rejection*: the offeror revokes; the offeree rejects."
