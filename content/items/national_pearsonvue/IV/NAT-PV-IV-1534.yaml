stem: A broker receives earnest money from a buyer and deposits it into the brokerage's operating
  account to pay office rent. Which prohibited act(s) has the broker committed?
options:
  - Conversion only
  - Commingling only
  - Neither commingling nor conversion
  - Both commingling and conversion
key: D
explanation: Depositing earnest money into the operating account mixes it with the brokerage's own
  funds (commingling) and uses it for a purpose not directed by the contract (paying office rent),
  which is conversion. Therefore both violations occur.
