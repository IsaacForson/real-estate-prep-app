stem: According to the duty of reasonable care and diligence, what must an agent do when they
  recognize that a client needs a service outside their expertise?
options:
  - Recommend the client hire a qualified professional promptly
  - Wait for the client to ask for a referral before acting promptly
  - Perform the service themselves rather than refer out promptly
  - Subcontract the work without telling the client promptly
key: A
explanation: The duty of reasonable care and diligence requires an agent to recognize when a client
  needs a service beyond their expertise and to recommend obtaining that service from a qualified
  professional. Telling the client to hire a qualified professional promptly satisfies this duty.
  Performing the service themselves or subcontracting without informing the client would violate the
  duty because the agent would be acting outside their competence without proper disclosure.
citation:
