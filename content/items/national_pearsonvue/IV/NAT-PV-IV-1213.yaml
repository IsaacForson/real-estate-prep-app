stem: According to general contract principles, what is a contingency (condition) in a real estate
  contract?
options:
  - A promise that must be performed regardless of events under the contract
  - A term making one party's duty to perform depend on the occurrence of a stated event
  - A clause that automatically extends the closing date as agreed by the parties
  - A provision that allows either party to terminate without notice under the agreement
key: B
explanation: According to §6.1 Concept, a contingency is defined as a term that makes one party's
  duty to perform depend on the occurrence of a stated event. This matches the correct answer
  choice. The distractor describing a promise that must be performed regardless of events is
  incorrect because it describes an absolute obligation, not a conditional one.
