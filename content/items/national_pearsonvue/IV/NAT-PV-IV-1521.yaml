stem: According to the text, how is a death on the premises treated regarding disclosure as a
  material fact?
options:
  - Assuming it is generally not material because it is not a physical defect
  - Treating it as a material fact only if the buyer asks directly
  - Considering it a material fact that must be disclosed in all states
  - Recognizing that disclosure requirements vary by state and many states exclude it
key: D
explanation: Facts that are not about the physical property, such as a death on the premises, are
  treated as material only according to state law; many states expressly exclude them from
  disclosure requirements. Therefore, the correct approach is to recognize that disclosure
  obligations vary by state.
