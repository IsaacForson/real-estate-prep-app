stem: Under general contract principles, what is a right of first refusal?
options:
  - The holder's right to purchase the property at a fixed price within a set period
  - The owner's obligation to offer the property to the holder on the same terms before selling to a
    third party
  - The holder's ability to force a sale regardless of the owner's willingness to sell
  - The owner's right to reject any offer from the holder and sell to anyone else
key: B
explanation: A right of first refusal obligates the owner to offer the property to the holder on the
  same terms before selling to a third party, and it does not fix a price or compel a sale. The
  distractor describing a fixed-price purchase right is incorrect because that describes an option,
  not a right of first refusal.
citation:
  source: REP Ref. Contracts § 9.2
  url: null
  quoted_text: A right of first refusal (preemptive right) obligates the owner, before selling to a
    third party, to offer the property to the holder on the same terms the third party has offered.
