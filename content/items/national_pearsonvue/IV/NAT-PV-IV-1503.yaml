stem: According to general contract principles, what is the default treatment of an option fee paid
  by the optionee unless the contract states otherwise?
options:
  - It is applied to the purchase price when the optionee decides to buy the property.
  - It is retained by the optionor regardless of whether the option is exercised.
  - It is deposited in an escrow account until the option period ends.
  - It is returned to the optionee if the option lapses without exercise.
key: B
explanation: An option fee is generally kept by the optionor whether or not the option is exercised,
  unless the contract says it applies to the purchase price.
