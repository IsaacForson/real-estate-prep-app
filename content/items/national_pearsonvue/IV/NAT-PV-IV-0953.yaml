stem: A buyer agrees to purchase a property for $400,000 with an 80% loan‑to‑value mortgage. If the
  lender's appraisal comes in at $380,000 and the contract includes an appraisal contingency, what
  is the maximum loan amount the lender will provide?
options:
  - $320,000
  - $380,000
  - $400,000
  - $304,000
key: D
explanation: "With an appraisal contingency, the lender bases the loan on the appraised value. The
  text shows the lender will lend the agreed percentage of the appraised value: 80% × $380,000 =
  $304,000. The $320,000 distractor applies the 80% to the contract price instead of the appraisal."
citation:
  source: REP Ref. Contracts § 6.4
  url: null
  quoted_text: The lender will lend 80% × $340,000 = $272,000, not $280,000.
