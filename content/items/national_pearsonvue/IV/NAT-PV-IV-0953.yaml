math:
  worked_solution: |-
    Step 1: Identify loan‑to‑value ratio: 80%
    Step 2: Identify appraised value: $380,000
    Step 3: Multiply ratio by appraised value: 0.80 × 380,000 = 304,000
    Step 4: Result is the maximum loan amount: $304,000
  formulas:
    - Loan Amount = LTV Ratio × Appraised Value
