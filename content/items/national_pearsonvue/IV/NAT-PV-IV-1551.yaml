stem: A licensee works with a buyer but is authorized by the seller's listing broker to assist in
  finding a buyer for the seller's property. To whom does the licensee owe fiduciary duties?
options:
  - The licensee owes fiduciary duties to the buyer only.
  - The licensee owes fiduciary duties to the seller only.
  - The licensee owes fiduciary duties to both the buyer and the seller.
  - The licensee owes fiduciary duties to neither party.
key: B
explanation: Under subagency, a licensee authorized by the listing broker to assist the seller owes
  fiduciary duties to the seller, even when working with a buyer. Therefore, the licensee owes
  fiduciary duties to the seller only. The licensee does not owe fiduciary duties to the buyer; the
  duty runs to the principal (seller).
citation:
  source: REP Ref. Agency § 2.7
  url: null
  quoted_text: "A **subagent** is an agent of an agent: a licensee who, with the principal's
    authorization, assists the listing broker in serving the seller and thereby owes the seller
    fiduciary duties even though the subagent may be the only licensee the buyer is working with."
