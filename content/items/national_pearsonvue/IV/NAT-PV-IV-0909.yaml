stem: A purchase agreement for a residential property includes a 'time is of the essence' clause
  specifying that closing must occur on July 15. The buyer fails to deliver the purchase funds by
  that date. Under general contract principles, what is the likely result?
options:
  - The buyer may request a reasonable extension of the closing date
  - The contract stays enforceable and closing must occur within a reasonable time
  - The seller may treat the contract as terminated and pursue remedies
  - The seller must accept late performance and waive all penalty claims
key: C
explanation: A 'time is of the essence' clause makes contractual deadlines strict; missing the
  deadline constitutes a breach allowing the other party to treat the contract as terminated and
  pursue remedies. Without such clause, courts might allow performance within a reasonable time, but
  the clause overrides that leniency. Therefore, the seller is not obligated to accept late
  performance.
