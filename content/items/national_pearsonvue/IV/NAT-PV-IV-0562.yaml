stem: According to general contract principles, how is an implied contract formed?
options:
  - A contract that is automatically void if not written
  - A contract whose terms are stated orally or in writing
  - A contract that arises from the conduct of the parties
  - A contract that requires a notarized signature
key: C
explanation: An implied‑in‑fact contract is created when the parties’ conduct shows a mutual
  agreement, even though no express words are used. A contract whose terms are expressed orally or
  in writing is an express contract, and a contract that must be notarized or that is automatically
  void if not written does not describe an implied contract.
