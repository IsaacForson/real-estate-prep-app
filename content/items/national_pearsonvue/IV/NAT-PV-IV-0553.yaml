stem: What is commingling?
options:
  - The act of providing puffing statements about a property
  - The act of mixing client funds with the brokerage's operating funds
  - The act of disclosing material facts to a customer
  - The act of keeping client funds in a separate trust account
key: B
explanation: Commingling is defined as mixing money belonging to others, such as earnest money,
  rents, or security deposits, with the licensee's or brokerage's own funds. This includes
  depositing a buyer's deposit into the firm's operating account. Keeping client funds in a separate
  trust account is the required practice to prevent commingling, not an example of it.
citation:
  source: REP Ref. Agency § 8.1
  url: null
  quoted_text: Commingling is mixing money belonging to others (earnest money, rents, security
    deposits, tenant funds) with the licensee's or brokerage's own funds — depositing a buyer's
    deposit into the firm's operating account, or leaving brokerage money in the trust account
    beyond the small amount many states allow for bank charges.
