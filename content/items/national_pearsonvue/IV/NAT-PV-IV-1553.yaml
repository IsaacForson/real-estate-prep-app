stem: Under §6.2, what occurs if a buyer applies for a loan type different from that specified in
  the financing contingency?
options:
  - The buyer may terminate and recover the deposit despite applying for a different loan type
  - The buyer has not satisfied the good‑faith requirement and may lose the deposit
  - The buyer must submit a new loan application within the original deadline
  - The buyer automatically extends the financing contingency deadline by 30 days
key: B
explanation: The rule provides that a buyer who applies for a different loan than described has
  generally not satisfied the good‑faith requirement and may lose the deposit. The distractor that
  says the buyer may still terminate and recover the deposit ignores the good‑faith failure.
