stem: Which of the following best describes the legal concept of consideration in a contract?
options:
  - The mutual exchange of promises where each party agrees to perform their specific contractual
    obligations.
  - The written agreement that outlines the specific terms, conditions, and signatures of the
    contracting parties.
  - Money, property, a promise, a service, or forbearance from doing something one has a right to do.
  - The earnest money deposit that serves as a sign of good faith and secures the buyer's offer.
key: C
explanation: Consideration consists of whatever each party gives up—money, property, a promise, a
  service, or forbearance—as stated in §2.4. While the buyer's promise to pay and the seller's
  promise to convey are examples of consideration, they do not encompass the full definition.
  Earnest money is not consideration, and a writing satisfies the Statute of Frauds, not
  consideration.
