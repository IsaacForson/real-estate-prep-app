stem: Which act is defined as commingling under §8.1?
options:
  - Failing to disclose a known material defect that affects the property's value
  - Mixing client funds with brokerage operating funds
  - Receiving a referral fee without client consent from the lender
  - Advising a client on tax consequences without expertise in real estate
key: B
explanation: "Commingling occurs when a licensee mixes client funds with the brokerage's own
  operating funds. The option that describes mixing client funds with brokerage operating funds
  correctly states this definition. The other options describe different violations: failing to
  disclose a material defect, receiving a referral fee without client consent, and advising on tax
  consequences without expertise."
citation:
  source: REP Ref. Agency § 8.1
  url: null
  quoted_text: "**Commingling** is mixing money belonging to others (earnest money, rents, security
    deposits, tenant funds) with the licensee's or brokerage's own funds — depositing a buyer's
    deposit into the firm's operating account, or leaving brokerage money in the trust account
    beyond the small amount many states allow for bank charges."
