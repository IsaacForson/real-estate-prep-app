stem: A brokerage lists Sam's house and also represents Tia as a buyer-client. Tia wants to write an
  offer on Sam's house. What must the brokerage do before Tia can submit an offer?
options:
  - The brokerage must disclose the dual agency to Tia only.
  - The brokerage must terminate Tia's buyer representation agreement.
  - The brokerage must continue to advocate for the seller's best price.
  - The brokerage must obtain written consent from both Sam and Tia.
key: D
explanation: Dual agency requires informed written consent from both parties before proceeding;
  without it, the dual agency is undisclosed and violates fiduciary duty. The option suggesting
  disclosure to only the buyer is incorrect because consent is needed from both parties, not just
  one.
citation:
  source: "REP Ref. Agency — Reference note: agency relationships, creation/termination, fiduciary
