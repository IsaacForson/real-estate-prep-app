stem: Which information must a licensee keep confidential under the duty of confidentiality?
options:
  - The known roof leak that requires immediate repair
  - The buyer's preferred closing date for the transaction
  - The seller's willingness to accept less than list price
  - The seller's asking price as shown in the MLS listing
key: C
explanation: Confidentiality protects information such as the seller's willingness to accept less
  than list price, the reason for selling, the buyer's maximum price or urgency, and either party's
  financial condition. A known roof leak is a material fact that must be disclosed, not kept
  confidential.
