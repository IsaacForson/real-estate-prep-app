stem: What is the mirror-image rule in contract law?
options:
  - Acceptance may be silent if the offeror previously indicated silence means acceptance
  - Acceptance must match the offer exactly without any changes
  - Acceptance can vary minor terms and still form a contract
  - Acceptance is effective when mailed, regardless of offer terms
key: B
explanation: Under the mirror-image rule, an acceptance must match the offer exactly; any change to
  terms such as price, closing date, or contingencies makes it a counteroffer rather than an
  acceptance. This principle is fundamental to contract formation. The rule ensures mutual assent is
  genuine and unambiguous.
