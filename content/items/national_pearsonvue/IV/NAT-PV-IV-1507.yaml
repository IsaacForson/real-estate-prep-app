stem: A listing agent learns that the buyer, whose offer is pending, has just been laid off.
  According to § 5.4 Disclosure (full disclosure to the principal), what must the agent do?
options:
  - Inform the seller immediately
  - Wait until closing to mention
  - Keep the information confidential
  - Disclose with buyer's consent
key: A
explanation: The example in § 5.4 states that when a listing agent learns the buyer's offer is
  pending and the buyer has just been laid off, the agent must tell the seller. Keeping the
  information confidential or waiting until closing violates the duty of full disclosure to the
  principal, and disclosing with buyer's consent is not sufficient because the duty runs to the
  principal.
