stem: "According to the duty of loyalty, a licensee who wishes to purchase a client's listed
  property must:"
options:
  - Offer the client a commission reduction before proceeding.
  - Notify the client in writing of the purchase before proceeding.
  - Obtain the client's informed written consent before proceeding.
  - Inform the broker of the purchase before proceeding.
key: C
explanation: The duty of loyalty forbids self‑dealing without full disclosure and consent, so the
  licensee must obtain the client's informed written consent before buying the listing. The
  distractor about informing only the broker after purchase fails because consent must be obtained
  from the client beforehand.
