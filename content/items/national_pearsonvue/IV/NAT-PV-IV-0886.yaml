stem: A licensee who is the listing agent for a seller advises an unrepresented buyer on what offer
  to make, negotiates on the buyer's behalf, and tells the buyer 'I'll take care of you.' Under
  general agency law, what is the likely result regarding the licensee's agency relationship?
options:
  - The licensee remains solely the seller's agent because no written agreement exists in this
    transaction
  - The licensee's actions constitute a universal agent because they advised both parties in this
    transaction
  - The licensee has terminated the agency relationship by renunciation and must notify the parties
  - The licensee has become buyer's implied agent and, if also the listing agent, an undisclosed
    dual agent
key: D
explanation: When a licensee advises an unrepresented buyer on what to offer, negotiates on the
  buyer's behalf, and tells the buyer 'I'll take care of you,' the licensee may have become the
  buyer's implied agent; if the licensee is also the listing agent, this creates an undisclosed dual
  agency. The distractor that says the licensee remains solely the seller's agent ignores the
  possibility of implied agency arising from the licensee's conduct.
