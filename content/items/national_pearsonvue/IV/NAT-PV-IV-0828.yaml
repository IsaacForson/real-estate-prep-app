stem: Which of the following actions violates the duty of loyalty?
options:
  - Receiving a referral fee from a vendor without client knowledge
  - Disclosing a known material defect to the buyer client
  - Providing a comparative market analysis to the seller
  - Recommending a licensed inspector for the property
key: A
explanation: The duty of loyalty forbids secret profits such as an undisclosed referral fee or
  kickback. Receiving a referral fee from a vendor without the client's knowledge is a secret profit
  and therefore disallowed. Disclosing a known material defect is required under honesty and fair
  dealing, not a loyalty violation.
