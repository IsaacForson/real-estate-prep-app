stem: Under § 6.3 Disclosure of material facts, which of the following must a licensee disclose to
  all parties in a transaction?
options:
  - Buyer's maximum price
  - Licensee's referral fee
  - Known structural defects
  - Seller's reason for selling
key: C
explanation: Section 6.3 requires licensees to disclose known material facts about the property,
  such as structural defects, to all parties. The seller's reason for selling and the buyer's
  maximum price are confidential information, not property facts, and thus are not required
  disclosures under this section.
