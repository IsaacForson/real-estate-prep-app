stem: Which statement correctly describes an option in a real estate contract under general contract
  principles?
options:
  - A right that transfers the remaining lease term to another party
  - A right that requires the holder to match any third-party offer before the seller can accept
  - A right that substitutes a new party and releases the original obligor
  - A right that fixes a purchase price and can compel the seller to sell
key: D
explanation: An option fixes a price and can force a sale, which matches the definition provided.
  The distractor describing a right that requires matching a third-party offer defines a right of
  first refusal, not an option.
