stem: A licensee receives a referral fee from a home warranty company for referring a buyer-client.
  According to the duty of disclosure of compensation, what must the licensee do?
options:
  - Inform the buyer and seller in writing of the referral fee
  - Inform no one of the referral fee as it is a secret profit
  - Inform only the buyer and the seller of the referral fee
  - Inform the broker and the licensee's supervisor of the referral fee
key: A
explanation: The duty of disclosure of compensation requires that all parties be informed in writing
  of how and by whom the licensee will be compensated. Informing the buyer and seller in writing of
  the referral fee satisfies this requirement. Informing only the broker or supervisor, or telling
  no one, fails to inform all parties as required.
citation:
  source: REP Ref. Agency § 7.4
  url: null
  quoted_text: All parties should be informed, in writing, of how and by whom the licensee will be
    compensated, particularly where a buyer's agent is paid through the listing broker or where a
    licensee receives compensation from more than one source.
