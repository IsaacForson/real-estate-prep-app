stem: Under the duty to disclose material facts, what must a licensee disclose to all parties in a
  transaction?
options:
  - Keep the seller's motivation confidential from the buyer
  - Disclose any known structural defects to all parties
  - Provide the buyer with the licensee's personal financial statement
  - Inform only the client about the property's zoning classification
key: B
explanation: The duty to disclose material facts obligates licensees to reveal known property
  defects that a reasonable person would consider important, such as structural defects, to all
  parties. Keeping the seller's motivation confidential or providing personal financial information
  does not fulfill this disclosure obligation. Informing only the client about zoning fails to
  disclose to all parties as required.
citation:
