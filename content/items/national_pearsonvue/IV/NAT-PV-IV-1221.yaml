stem: In a brokerage that operates in a state permitting designated agency, the broker has a
  seller-client and a buyer-client who both want to proceed with the same listed property. To avoid
  dual agency, what should the broker do?
options:
  - The broker should obtain written consent from both clients to act as a dual agent
  - The broker should refer one client to another brokerage to avoid any conflict
  - The broker should designate one licensee for the seller and another for the buyer
  - The broker should act as a transaction broker and not represent either party
key: C
explanation: Under designated agency, the broker assigns one licensee to represent the seller and a
  different licensee to represent the buyer in the same transaction, allowing each licensee to owe
  full fiduciary duties to their respective client while avoiding dual agency. The other options
  either create dual agency, unnecessarily refer clients away, or change the role to non‑agency,
  which is not required when designated agency is available.
