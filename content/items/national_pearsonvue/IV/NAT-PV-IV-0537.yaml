stem: Under the Electronic Signatures in Global and National Commerce Act (E-SIGN), what is the
  definition of an "electronic signature"?
options:
  - An electronic sound, symbol, or process, attached to or logically associated with a contract or
    other record and executed or adopted by a person with the intent to approve the record.
  - An electronic sound, symbol, or process, attached to or logically associated with a contract or
    other record and executed or adopted by a person with the intent to sign the record.
  - An electronic sound, symbol, or process, attached to or logically associated with a contract or
    other record and executed or adopted by a person with the intent to transmit the record.
  - An electronic sound, symbol, or process, attached to or logically associated with a contract or
    other record and executed or adopted by a person with the intent to create the record.
key: B
explanation: 15 U.S.C. § 7006(5) defines an electronic signature as an electronic sound, symbol, or
  process attached to or logically associated with a contract or other record and executed or
  adopted by a person with the intent to sign the record. The choice that states the intent is to
  sign the record matches this definition. The other choices use different intents—approve,
  transmit, or create the record—which are not part of the statutory definition.
