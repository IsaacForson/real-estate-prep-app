stem: Under general agency law, what is the authority of a listing broker acting as a special agent?
options:
  - The broker has full authority to bind the seller to a contract
  - The broker may only transmit offers and cannot bind the seller
  - The broker may accept an offer on behalf of the seller
  - The broker may sign a purchase agreement for the seller
key: B
explanation: A listing broker acts as a special agent whose role is to find a ready, willing, and
  able buyer. Unless given separate authority, the broker cannot sign a purchase agreement for the
  seller or accept an offer on the seller’s behalf; the broker’s authority is limited to
  transmitting offers and therefore cannot bind the seller to a contract.
citation:
  source: "REP Ref. Agency — Reference note: agency relationships, creation/termination, fiduciary
