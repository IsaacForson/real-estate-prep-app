stem: An investor signs a contract to buy a fourplex and, with the contract silent on the point,
  assigns it to another investor for a fee. The assignee fails to close. Under general contract
  principles, what is the seller's position?
options:
  - The seller may treat the assignment as a novation releasing the original investor
  - The seller may pursue the original investor, who remains secondarily liable
  - The seller has no remedy because the contract was assigned
  - The seller may only keep the earnest money and must release everyone
key: B
explanation: Unless the contract prohibits it, a party may assign its rights, but the assignor
  typically remains secondarily liable for performance unless released. A novation — a new contract
  substituted with all parties' consent that releases the original party — did not occur here, so
  the seller can still look to the original investor.
