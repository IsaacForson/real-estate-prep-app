stem: Which duty survives the termination of an agency relationship?
options:
  - The duty of strict obedience.
  - The duty of confidentiality.
  - The duty of unwavering loyalty.
  - The duty of full disclosure.
key: B
explanation: The duty of confidentiality generally survives the end of an agency relationship; a
  former agent may not reveal confidential information learned during the engagement. The duty of
  loyalty ends with the relationship and does not survive termination.
citation:
  source: "REP Ref. Agency — Reference note: agency relationships, creation/termination, fiduciary
    duties, disclosure (authored, status: draft — needs licensed review) § 4.3 Duties that survive
    termination"
  url: null
  quoted_text: "The duty of confidentiality generally survives the end of the agency: a former listing
    agent may not later tell a buyer what the former seller-client's bottom line was, and a former
    buyer's agent may not disclose the former client's finances or motivations."
