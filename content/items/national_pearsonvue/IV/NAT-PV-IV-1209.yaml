stem: Which statement best describes an express contract in real estate?
options:
  - A contract that lacks legal effect because one party is a minor.
  - A contract whose terms are stated by the parties, either orally or in writing.
  - A contract that is enforceable only after both parties have fully performed.
  - A contract formed by the parties' conduct without any spoken or written agreement.
key: B
explanation: An express contract arises when the parties explicitly state their agreement, either
  orally or in writing. This contrasts with an implied contract, which is formed by the parties'
  conduct without any spoken or written words. The other options describe a contract that lacks
  legal effect because one party is a minor, a contract that is enforceable only after both parties
  have fully performed, and a contract formed by the parties' conduct without any spoken or written
  agreement.
