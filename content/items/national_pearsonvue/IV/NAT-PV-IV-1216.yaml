stem: According to general contract principles, which type of contract must be in writing to be
  enforceable under the Statute of Frauds?
options:
  - A contract for the sale of real property must be in writing.
  - A contract for the sale of personal property under $500.
  - An oral agreement to lease a property for six months.
  - A contract where both parties have already fully performed.
key: A
explanation: The Statute of Frauds requires contracts for the sale of real property to be in
  writing. A lease for six months is not longer than one year, so it is not covered by the Statute
  of Frauds.
