stem: Annual property taxes of $2,555 are paid in arrears. Closing is May 10, the 365-day method
  applies, and the seller is responsible for the day of closing. The tax bill will be paid by the
  buyer after closing. What is the tax proration, and how is it entered?
options:
  - $903.00, debit seller and credit buyer
  - $1,645.00, debit buyer and credit seller
  - $910.00, debit seller and credit buyer
  - $922.64, debit seller and credit buyer
key: C
explanation: "Taxes paid in arrears are charged to the seller for the seller's days of ownership:
  debit seller, credit buyer. The daily rate is 2,555 ÷ 365 = $7.00, and the seller's days run
  January 1 through May 10 (31 + 28 + 31 + 30 + 10 = 130), giving 130 × 7.00 = $910.00. The $903.00
  option wrongly uses 129 days, which would apply only if the buyer owned the closing day, and
  $922.64 results from mixing in the 360-day method."
citation:
  source: REP Ref. Real Estate Math § 11.3
  url: null
  quoted_text: "the seller owes the buyer the seller's share: debit seller, credit buyer. Steps:
    annual amount ÷ days in year = daily rate; count the seller's days from January 1 through the
    closing date"
  secondary: []
math:
  worked_solution: Daily rate = 2,555 ÷ 365 = $7.00. Seller's days = 31 (Jan) + 28 (Feb) + 31 (Mar) +
    30 (Apr) + 10 (May 1–10) = 130. Proration = 130 × 7.00 = $910.00, debit seller / credit buyer.
  formulas:
    - daily rate = annual tax ÷ 365
    - proration = daily rate × seller's days
