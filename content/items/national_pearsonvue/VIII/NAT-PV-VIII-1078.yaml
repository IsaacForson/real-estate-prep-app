stem: A borrower obtains a $200,000 loan at 4.5% interest for 30 years, with a monthly principal and
  interest payment of $1,013.37. Annual property taxes are $2,400 and annual homeowners insurance is
  $600. What is the borrower's monthly PITI?
options:
  - $1,213.37
  - $1,263.37
  - $4,013.37
  - $1,063.37
key: A
explanation: PITI equals the monthly principal and interest payment plus one‑twelfth of the annual
  taxes and one‑twelfth of the annual insurance. Taxes monthly are $2,400 ÷ 12 = $200; insurance
  monthly is $600 ÷ 12 = $50. Adding these to $1,013.37 gives $1,263.37. The distractor $1,213.37
  omits the insurance component.
citation:
  source: REP Ref. Real Estate Math § 5.8
  url: null
  quoted_text: PITI = monthly principal and interest + annual taxes ÷ 12 + annual insurance ÷ 12 (+
    monthly mortgage insurance and association dues when the problem includes them)
  secondary: []
math:
  worked_solution: |-
    $2,400 ÷ 12 = $200
    $600 ÷ 12 = $50
    $1,013.37 + $200 + $50 = $1,263.37
  formulas:
    - PITI = P&I + (annual taxes/12) + (annual insurance/12)
