stem: A buyer's agent received $8,120, which represented 70% of the selling brokerage's share, and
  the selling brokerage had been offered 2.8% of the sale price. What was the sale price?
options:
  - $406,000.00
  - $414,285.71
  - $290,000.00
  - $580,000.00
key: B
explanation: "Work backward in two steps: the brokerage's share = 8,120 ÷ 0.70 = $11,600, and the
  price = 11,600 ÷ 0.028 = $414,285.71. Dividing the agent's $8,120 directly by 2.8% ($290,000)
  ignores the 70% split and understates the price."
citation:
  source: REP Ref. Real Estate Math § 4.4
  url: null
  quoted_text: An agent received $9,450, which was 70% of the brokerage's 3% share. Brokerage share =
    9,450 ÷ 0.70 = $13,500. Price = 13,500 ÷ 0.03 = $450,000.
  secondary: []
math:
  worked_solution: "Brokerage share = 8,120 ÷ 0.70 = 11,600. Price = 11,600 ÷ 0.028 = $414,285.71.
    Check: 414,285.71 × 0.028 = 11,600.00; 11,600 × 0.70 = $8,120."
  formulas:
    - brokerage share = agent amount ÷ agent split
    - price = brokerage share ÷ brokerage rate
  onscreen_calculator_only: false
