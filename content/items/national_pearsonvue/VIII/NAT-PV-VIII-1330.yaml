stem: An investor purchases a parcel of land for $250,000. The land is expected to appreciate at 4%
  per year, compounded annually. What will be the value of the land after 3 years?
options:
  - $275,000
  - $280,000
  - $281,216
  - $285,000
key: C
explanation: Compound appreciation applies the yearly percentage to the prior year's value. The
  future value equals the principal multiplied by (1 + rate) raised to the number of years.
citation:
  source: REP Ref. Real Estate Math § 6.3
  url: null
  quoted_text: "Compound (each year's percentage applies to the prior year's value): value × (1 +
    rate) repeated once per year."
  secondary: []
math:
  worked_solution: |-
    Convert rate to decimal: 4% = 0.04
    Growth factor per year = 1 + 0.04 = 1.04
    Compound factor for 3 years = 1.04^3 = 1.124864
    Future value = $250,000 × 1.124864 = $281,216
  formulas:
    - Future value = principal × (1 + rate)^years
