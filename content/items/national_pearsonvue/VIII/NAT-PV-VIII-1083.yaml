stem: A building has 20 units renting for $950 per month each. The vacancy and collection loss rate
  is 4%. Laundry and parking generate $3,600 per year. What is the property's effective gross income
  per year?
options:
  - $218,880 per year
  - $222,336 per year
  - $222,480 per year
  - $231,600 per year
key: D
explanation: Effective gross income equals scheduled gross rent minus vacancy loss plus other
  income. Scheduled gross rent is 20 × $950 × 12 = $228,000. Vacancy loss at 4% is $9,120, leaving
  $218,880. Adding $3,600 other income yields $222,480. The distractor $231,600 results from adding
  other income before subtracting vacancy loss.
citation:
  source: REP Ref. Real Estate Math § 1.3
  url: null
  quoted_text: "Almost every percentage problem is one of three rearrangements of a single
    relationship: Part = Whole × Rate. Therefore Whole = Part ÷ Rate and Rate = Part ÷ Whole.
    Identify which of the three quantities the question gives and which it asks for."
  secondary: []
math:
  worked_solution: |-
    Scheduled gross rent = 20 units × $950/month × 12 months = $228,000
    Vacancy loss = $228,000 × 0.04 = $9,120
    Effective gross rent = $228,000 - $9,120 = $218,880
    Effective gross income = $218,880 + $3,600 = $222,480
  formulas:
    - EGI = (Scheduled Gross Rent × (1 - Vacancy Rate)) + Other Income
