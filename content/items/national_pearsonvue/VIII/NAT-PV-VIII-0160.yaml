math:
  worked_solution: Monthly interest = 210,000 × 0.05 ÷ 12 = 875. Daily = 875 ÷ 30 = 29.1667. Seller's
    days = 12. Proration = 12 × 29.1667 = 350.00.
  formulas:
    - monthly interest = balance × annual rate ÷ 12
    - proration = daily interest × seller's days
