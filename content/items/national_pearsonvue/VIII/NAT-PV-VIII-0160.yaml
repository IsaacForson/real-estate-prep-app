stem: A buyer assumes the seller's mortgage with a balance of $210,000 at 5% interest. Closing
  occurs on the 12th of a 30-day month, and the seller owns the day of closing. How is the interest
  proration handled on the closing statement?
options:
  - $350 debit to the seller and credit to the buyer
  - $875 debit to the buyer and credit to the seller
  - $350 debit to the buyer and credit to the seller
  - $875 debit to the seller and credit to the buyer
key: A
explanation: "Monthly interest is 210,000 × 0.05 ÷ 12 = $875, and the daily rate is 875 ÷ 30 =
  $29.1667. The seller owes interest for 12 days: 12 × 29.1667 = $350. Because mortgage interest is
  paid in arrears, on an assumed loan the seller owes the buyer interest from the last payment date
  through closing, so it is a debit to the seller and a credit to the buyer."
citation:
  source: REP Ref. Real Estate Math § 11.6
  url: null
  quoted_text: "On an assumed loan the seller owes the buyer interest from the last payment date
    through closing: debit seller, credit buyer."
