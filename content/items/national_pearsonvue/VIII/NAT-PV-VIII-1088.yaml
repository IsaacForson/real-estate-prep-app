stem: Two properties each have 8 units renting for $1,000 per month. Property X has a 5% vacancy and
  collection loss rate, $4,000 of other income per year, and $40,000 of annual operating expenses.
  Property Y has a 10% vacancy and collection loss rate, the same $4,000 of other income per year,
  and $35,000 of annual operating expenses. Which property has the higher net operating income?
options:
  - The higher NOI belongs to Property X.
  - The higher NOI belongs to Property Y.
  - The NOI is equal for both properties.
  - The NOI cannot be determined.
key: B
explanation: Net operating income equals effective gross income minus operating expenses. Effective
  gross income equals potential gross income minus vacancy loss plus other income. For Property X,
  PGI = 8 × $1,000 × 12 = $96,000; vacancy loss = $96,000 × 0.05 = $4,800; EGI = $96,000 − $4,800 +
  $4,000 = $95,200; NOI = $95,200 − $40,000 = $55,200. For Property Y, vacancy loss = $96,000 × 0.10
  = $9,600; EGI = $96,000 − $9,600 + $4,000 = $90,400; NOI = $90,400 − $35,000 = $55,400. Property
  Y’s NOI is higher by $200.
citation:
  source: REP Ref. Real Estate Math § 7.1
  url: null
  quoted_text: Potential gross income (PGI) = all units × rent × 12 (full occupancy). Effective gross
    income (EGI) = PGI − vacancy and collection loss + other income. Net operating income (NOI) =
    EGI − operating expenses.
  secondary: []
math:
  worked_solution: |-
    PGI = 8 × $1,000 × 12 = $96,000
    Property X vacancy loss = $96,000 × 0.05 = $4,800
    Property X EGI = $96,000 − $4,800 + $4,000 = $95,200
    Property X NOI = $95,200 − $40,000 = $55,200
    Property Y vacancy loss = $96,000 × 0.10 = $9,600
    Property Y EGI = $96,000 − $9,600 + $4,000 = $90,400
    Property Y NOI = $90,400 − $35,000 = $55,400
  formulas:
    - PGI = units × rent × 12
    - Vacancy loss = PGI × vacancy rate
    - EGI = PGI − vacancy loss + other income
    - NOI = EGI − operating expenses
