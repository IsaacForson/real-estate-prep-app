stem: A $480,000 sale carries a total commission of 5.5%. Under Proposal X, the listing brokerage is
  offered 3.2% and the selling brokerage 2.3%. Under Proposal Y, the listing brokerage is offered
  2.8% and the selling brokerage 2.7%. How much more does the selling brokerage earn under Proposal
  Y than under Proposal X?
options:
  - $0,960.00
  - $1,440.00
  - $1,920.00
  - $2,400.00
key: C
explanation: The selling brokerage’s earnings equal the sale price multiplied by its offered
  percentage, since the total commission is split according to the listing agreement or MLS offer.
  Under Proposal X the selling brokerage earns $480,000 × 2.3% = $11,040; under Proposal Y it earns
  $480,000 × 2.7% = $12,960. The difference is $1,920. The distractor $1,440 results from using a
  0.3% difference instead of the correct 0.4% difference.
citation:
  source: REP Ref. Real Estate Math § 4.1
  url: null
  quoted_text: Commission = sale price × rate. When two brokerages cooperate, the total is split as
    the listing agreement or MLS offer provides, often but not always 50/50.
  secondary: []
math:
  worked_solution: |-
    X: 480,000 × 0.023 = 11,040
    Y: 480,000 × 0.027 = 12,960
    12,960 − 11,040 = 1,920
  formulas:
