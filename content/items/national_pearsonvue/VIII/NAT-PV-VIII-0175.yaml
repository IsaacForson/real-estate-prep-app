stem: A commercial lot is currently worth $276,000 after appreciating a total of 15% since purchase.
  A licensee wants to determine the original purchase price. Which calculation gives the correct
  original price?
options:
  - $276,000 × 0.85 = $234,600
  - $276,000 × 1.15 = $317,400
  - $276,000 − ($276,000 × 0.15) = $234,600
  - $276,000 ÷ 1.15 = $240,000
key: D
explanation: "When the current value is the original plus a percentage of the original, original =
  current ÷ (1 + rate): $276,000 ÷ 1.15 = $240,000. Multiplying the current value by 15% and
  subtracting understates the original because the 15% gain was measured on the smaller original
  price, not on $276,000."
citation:
  source: REP Ref. Real Estate Math § 6.5
  url: null
  quoted_text: Original = current ÷ (1 + total appreciation) or current ÷ (1 − total depreciation).
  secondary: []
math:
  worked_solution: "Original = 276,000 ÷ 1.15 = 240,000. Check: 240,000 × 0.15 = 36,000; 240,000 +
    36,000 = 276,000."
  formulas:
    - Original = current ÷ (1 + total appreciation)
