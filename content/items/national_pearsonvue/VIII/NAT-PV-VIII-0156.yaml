stem: A buyer purchases a home for $260,000, appraised at $260,000, with a 75% loan-to-value
  mortgage. The lender charges 3 discount points. How much does the buyer pay in points at closing?
options:
  - $7,800.00
  - $5,850.00
  - $5,200.00
  - $1,950.00
key: B
explanation: Points are calculated on the loan amount, not the price. The loan is $260,000 × 0.75 =
  $195,000, and 3 points = $195,000 × 0.03 = $5,850. The $7,800 distractor incorrectly applies 3% to
  the full purchase price.
citation:
  source: REP Ref. Real Estate Math § 5.4
  url: null
  quoted_text: One point = 1% of the loan amount, never of the price. Dollar cost = loan × points ÷ 100.
  secondary: []
math:
  worked_solution: Loan = $260,000 × 0.75 = $195,000. Points = $195,000 × 3 ÷ 100 = $195,000 × 0.03 = $5,850.00.
  formulas:
    - Loan = price × LTV
    - Dollar cost of points = loan × points ÷ 100
