stem: A landlord raised the monthly rent on a unit from $1,450 to $1,537. What was the percentage
  increase?
options:
  - 5.66%
  - 6.50%
  - 8.70%
  - 6.00%
key: D
explanation: "Percent change = (new − old) ÷ old, with the original rent as the denominator: (1,537
  − 1,450) ÷ 1,450 = 87 ÷ 1,450 = 0.06 = 6%. The 5.66% option wrongly divides the increase by the
  new rent (87 ÷ 1,537), violating the rule that the denominator is always the original value."
citation:
  source: REP Ref. Real Estate Math § 3.2
  url: null
  quoted_text: Percent change = (new − old) ÷ old. The denominator is always the original value.
  secondary: []
math:
  worked_solution: Increase = 1,537 − 1,450 = 87. Percent change = 87 ÷ 1,450 = 0.06 = 6.00%.
