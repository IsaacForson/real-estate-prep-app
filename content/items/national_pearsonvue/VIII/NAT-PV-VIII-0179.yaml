stem: A property management agreement pays the manager 8% of collected rents. A building has
  scheduled gross rent of $10,000 per month and a 5% vacancy and collection loss. What is the
  manager's monthly fee?
options:
  - $760.00
  - $800.00
  - $720.00
  - $400.00
key: A
explanation: "The fee base is collected rent, not scheduled rent: collected rent = 10,000 × (1 −
  0.05) = $9,500, and the fee = 9,500 × 0.08 = $760. The $800 option applies the 8% rate to the
  scheduled gross rent, ignoring the vacancy loss; this is the part-whole-rate relationship, part =
  whole × rate, where the whole must be the amount actually collected."
citation:
  source: REP Ref. Real Estate Math § 1.3
  url: null
  quoted_text: Part = Whole × Rate. Therefore Whole = Part ÷ Rate and Rate = Part ÷ Whole. Identify
    which of the three quantities the question gives and which it asks for.
  secondary: []
math:
  worked_solution: Collected rent = 10,000 × (1 − 0.05) = 10,000 × 0.95 = 9,500. Management fee =
    9,500 × 0.08 = $760.00.
  formulas:
    - Part = Whole × Rate
    - Collected rent = scheduled rent × (1 − vacancy rate)
