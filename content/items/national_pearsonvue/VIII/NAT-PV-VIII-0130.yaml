stem: A tenant is choosing between two spaces quoted on an annual per-square-foot basis. Space 1 has
  1,600 square feet at $24 per square foot per year. Space 2 has 2,400 square feet at $18 per square
  foot per year. Which statement about the total monthly rents is correct?
options:
  - Space 1 costs $4,800 per month and Space 2 costs $4,320 per month
  - Space 1 costs $3,600 per month and Space 2 costs $3,200 per month
  - Space 1 costs $2,880 per month and Space 2 costs $3,840 per month
  - Space 1 costs $3,200 per month and Space 2 costs $3,600 per month
key: D
explanation: "Space 1: 1,600 × 24 = $38,400 per year, ÷ 12 = $3,200 per month. Space 2: 2,400 × 18 =
  $43,200 per year, ÷ 12 = $3,600 per month. Although Space 2 has the lower rate per square foot,
  its larger area makes its total monthly rent higher, which is why comparing only the quoted rates
  leads to the wrong conclusion."
citation:
  source: REP Ref. Real Estate Math § 13.1
  url: null
  quoted_text: Annual rent = area × rate; monthly = annual ÷ 12.
  secondary: []
math:
  worked_solution: "Space 1: 1,600 × 24 = $38,400 per year; 38,400 ÷ 12 = $3,200 per month. Space 2:
    2,400 × 18 = $43,200 per year; 43,200 ÷ 12 = $3,600 per month."
  formulas:
    - annual rent = area × rate per square foot per year
    - monthly rent = annual rent ÷ 12
