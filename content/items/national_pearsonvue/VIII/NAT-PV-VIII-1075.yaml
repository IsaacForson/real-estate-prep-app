stem: A borrower takes out a $250,000 mortgage for 30 years at 6.5% interest. The amortization
  factor for this rate and term is 6.3207 per $1,000 borrowed. What is the monthly principal and
  interest payment?
options:
  - $1,580.18
  - $1,579.18
  - $1,580.17
  - $1,580.20
key: A
explanation: Under the amortization factor method, monthly payment equals (loan amount ÷ 1,000) ×
  factor. Multiplying 250 × 6.3207 yields 1,580.175, which rounds to $1,580.18. The distractor
  $1,580.17 results from rounding down before completing the multiplication.
citation:
  source: REP Ref. Real Estate Math § 5.5
  url: null
  quoted_text: Payment = (loan ÷ 1,000) × factor.
  secondary: []
math:
  worked_solution: |-
    Loan amount = $250,000
    Divide by 1,000: 250,000 ÷ 1,000 = 250
    Multiply by factor 6.3207: 250 × 6.3207 = 1,580.175
    Round to nearest cent: $1,580.18
