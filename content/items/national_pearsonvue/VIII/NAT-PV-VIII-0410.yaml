stem: A seller must net $210,000 after paying a $120,000 loan payoff, $2,800 in closing costs, and a
  5% commission. What minimum sale price is required?
options:
  - $332,800.00
  - $350,315.79
  - $316,160.00
  - $368,421.05
key: B
explanation: "For net-to-seller pricing, add the desired net and all fixed seller costs, then divide
  by one minus the commission rate: ($210,000 + $120,000 + $2,800) ÷ 0.95 = $350,315.79. The
  $332,800.00 figure only adds the costs and never grosses up for the commission."
citation:
  source: REP Ref. Real Estate Math § 4.3
  url: null
  quoted_text: price = (desired net + other seller costs) ÷ (1 − commission rate)
  secondary: []
math:
  worked_solution: Fixed amount needed before commission = $210,000 + $120,000 + $2,800 = $332,800.
    Commission rate = 5%, so seller keeps 95% of price. Price = $332,800 ÷ 0.95 = $350,315.789... →
    $350,315.79.
  formulas:
    - price = (desired net + other seller costs) ÷ (1 − commission rate)
