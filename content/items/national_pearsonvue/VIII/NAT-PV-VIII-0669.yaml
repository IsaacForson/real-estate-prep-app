stem: A seller wants to net $215,000 after paying a 7% commission on the sale price. What must the
  sale price be to achieve that net?
options:
  - $230,050.00
  - $199,950.00
  - $3,071,428.57
  - $231,182.80
key: D
explanation: Under the net‑to‑seller shortcut, the sale price equals the desired net divided by
  (1 − commission rate) because the commission is taken from the gross price. Multiplying the net by
  (1 + rate) would understate the price, giving $230,050.00, which is too low. Dividing the net by
  the commission rate itself ($3,071,428.57) mistakenly treats the commission as the entire price.
  The correct calculation yields $231,182.80.
citation:
  source: REP Ref. Real Estate Math § 15.2
  url: null
  quoted_text: Multiplying the desired net by (1 + rate) understates the price; divide by (1 − rate)
    instead (§ 4.3).
  secondary: []
math:
  worked_solution: |-
    Desired net = $215,000
    Commission rate = 7% = 0.07
    Price = Desired net ÷ (1 - commission rate)
    Price = $215,000 ÷ (1 - 0.07)
    Price = $215,000 ÷ 0.93
    Price = $231,182.7956989...
    Rounded to nearest cent = $231,182.80
  formulas:
    - Price = Net ÷ (1 - Rate)
  onscreen_calculator_only: false
