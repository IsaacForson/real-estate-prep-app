stem: A rectangular parcel has 220 feet of frontage and a depth of 150 feet. How many acres does the
  parcel contain? (Round to two decimal places.)
options:
  - 0.75 acre
  - 0.76 acre
  - 0.74 acre
  - 0.77 acre
key: B
explanation: The area of a rectangle is frontage multiplied by depth (220 ft × 150 ft = 33,000 sq
  ft). Converting to acres requires dividing by 43,560 sq ft per acre (33,000 ÷ 43,560 = 0.7576),
  which rounds to 0.76 acre. The distractor 0.75 acre results from rounding down prematurely or
  using an incorrect divisor.
