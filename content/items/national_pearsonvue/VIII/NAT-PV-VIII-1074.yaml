stem: A licensee can choose between receiving 65% of the brokerage's 4% commission share or a flat
  $4,200 fee on a $300,000 sale. Which option yields more for the licensee, and by how much?
options:
  - The difference is $3,600 more for the flat fee.
  - The difference is $3,600 more for the percentage option.
  - The difference is $2,400 more for the flat fee.
  - The difference is $2,400 more for the percentage option.
key: B
explanation: The key is correct because the brokerage’s commission is sale price times rate, and the
  licensee’s share is that commission times the agreed split (§ 4.2). Comparing the $7,800
  percentage share to the $4,200 flat fee shows the percentage option yields $3,600 more. The most
  tempting distractor, $2,400 more for the percentage option, arises from using an incorrect split
  of 40% instead of 65%.
citation:
  source: REP Ref. Real Estate Math § 4.2
  url: null
  quoted_text: "Apply the splits in sequence: price × commission rate × brokerage's share × agent's split."
  secondary: []
math:
  worked_solution: |-
    Step 1: Total commission = 300,000 × 0.04 = 12,000
    Step 2: Brokerage share = 12,000 (assuming 100% retained)
    Step 3: Licensee share via percentage = 12,000 × 0.65 = 7,800
    Step 4: Flat fee = 4,200
    Step 5: Difference = 7,800 - 4,200 = 3,600
    Step 6: Since difference > 0, the percentage option yields $3,600 more.
  formulas:
    - Commission = sale price × rate
    - Licensee share = commission × brokerage share × agent split
    - Difference = licensee share - flat fee
