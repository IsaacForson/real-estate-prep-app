stem: A managed property's annual operating expenses rose from $48,000 last year to $51,600 this
  year. What was the percentage increase in operating expenses?
options:
  - 6.98%
  - 7.50%
  - 8.00%
  - 3.60%
key: B
explanation: "Percent change uses the original value as the denominator: ($51,600 − $48,000) ÷
  $48,000 = $3,600 ÷ $48,000 = 0.075 = 7.50%. The 6.98% figure results from dividing the increase by
  the new amount ($51,600), but the denominator must be the original value."
citation:
  source: REP Ref. Real Estate Math § 3.2
  url: null
  quoted_text: Percent change = (new − old) ÷ old. The denominator is always the original value.
  secondary: []
math:
  worked_solution: Change = $51,600 − $48,000 = $3,600. Percent change = $3,600 ÷ $48,000 = 0.075 = 7.50%.
  formulas:
    - Percent change = (new − old) ÷ old
