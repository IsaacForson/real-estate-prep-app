stem: A brokerage reports a $17,850 commission earned on a $297,500 sale. What commission rate was
  charged?
options:
  - 6.50%
  - 7.00%
  - 6.00%
  - 5.50%
key: C
explanation: "Rate is found by dividing the commission part by the sale-price whole: $17,850 ÷
  $297,500 = 0.06, or 6.00%. The 6.50% result comes from dividing by a smaller assumed price rather
  than the actual $297,500 sale price."
citation:
  source: REP Ref. Real Estate Math § 4.4
  url: null
  quoted_text: "A $19,500 commission on a $325,000 sale: 19,500 ÷ 325,000 = 0.06 = 6%."
  secondary: []
math:
  worked_solution: "Rate = commission ÷ sale price = $17,850 ÷ $297,500 = 0.06. Convert to percent:
    0.06 × 100 = 6.00%."
