stem: An appraiser uses the cost approach on a small retail building. The reproduction cost of the
  improvements is $240,000, the total economic life is estimated at 40 years, and the effective age
  is 10 years. Using straight-line depreciation, what is the depreciated value of the improvements?
options:
  - $180,000
  - $200,000
  - $176,000
  - $60,000
key: A
explanation: Annual depreciation is $240,000 ÷ 40 = $6,000. Accrued depreciation is $6,000 × 10 =
  $60,000, so depreciated value is $240,000 − $60,000 = $180,000. The $60,000 option is only the
  accrued depreciation, not the remaining value.
citation:
  source: REP Ref. Real Estate Math § 6.1
  url: null
  quoted_text: Annual depreciation = improvement cost ÷ total economic life (land is never
    depreciated). Accrued depreciation = annual depreciation × effective age. Depreciated value =
    cost − accrued depreciation.
  secondary: []
math:
  worked_solution: Annual depreciation = 240,000 ÷ 40 = 6,000. Accrued depreciation = 6,000 × 10 =
    60,000. Depreciated value = 240,000 − 60,000 = 180,000.
  formulas:
    - Annual depreciation = cost ÷ economic life
    - Accrued depreciation = annual depreciation × effective age
    - Depreciated value = cost − accrued depreciation
