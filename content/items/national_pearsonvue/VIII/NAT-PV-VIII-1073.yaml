stem: An agent received a commission check of $10,500, which represents 60% of the brokerage's share
  of the total commission. What was the brokerage's share?
options:
  - $17,500
  - $15,750
  - $19,250
  - $21,000
key: C
explanation: The key is correct because the brokerage’s share equals the agent’s check divided by
  the agent’s split percentage (§ 4.2). The most tempting distractor, $15,750, comes from
  multiplying the agent’s check by the split instead of dividing, which reverses the operation.
citation:
  source: REP Ref. Real Estate Math § 4.2
  url: null
  quoted_text: "Apply the splits in sequence: price × commission rate × brokerage's share × agent's split."
  secondary: []
math:
  worked_solution: Brokerage share = 10,500 ÷ 0.60 = 17,500
  formulas:
    - Brokerage share = agent earnings ÷ agent split
