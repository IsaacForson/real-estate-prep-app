stem: An office suite containing 2,000 square feet rents for $4,500 per month. What is the rental
  rate per square foot per year?
options:
  - $31.50 per square foot per year
  - $2.25 per square foot per year
  - $27.00 per square foot per year
  - $22.50 per square foot per year
key: C
explanation: Annual rent = $4,500 × 12 = $54,000; rate = annual rent ÷ area = 54,000 ÷ 2,000 = $27
  per square foot per year. The $2.25 figure comes from dividing the monthly rent by the area
  without first converting to an annual figure.
