stem: A four-unit building rents for $1,200 per unit per month. Rent collected on the 1st of the
  month. Closing is on the 18th of a 30-day month. The seller owns the closing day. Using the
  actual-day method, what is the rent proration, and how is it entered?
options:
  - $1,920, credit seller / debit buyer
  - $1,440, debit seller / credit buyer
  - $1,440, credit seller / debit buyer
  - $1,920, debit seller / credit buyer
key: D
explanation: Rent collected in advance belongs to the buyer for days after closing, so the seller is
  debited and the buyer credited. Daily rent = (4 × $1,200) ÷ 30 = $160; buyer’s days = 30 − 18 =
  12; proration = 12 × $160 = $1,920. The option stating $1,440, credit seller / debit buyer
  incorrectly reverses the debit/credit entry.
citation:
  source: REP Ref. Real Estate Math § 11.5
  url: null
  quoted_text: "Rent is paid in advance, so rent the seller collected for days after closing belongs
    to the buyer: debit seller, credit buyer."
  secondary: []
math:
  worked_solution: units = 4; rent per unit = $1,200; total monthly rent = 4 × 1,200 = $4,800; days in
    month = 30; daily rent = $4,800 ÷ 30 = $160; buyer's days = 30 − 18 = 12; proration = 12 × $160
    = $1,920.
  formulas:
    - daily rent = (units × rent per unit) ÷ days in month; proration = buyer's days × daily rent
