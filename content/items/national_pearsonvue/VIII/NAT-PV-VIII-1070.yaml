stem: A licensee is helping an investor determine the monthly rent needed to achieve a target net
  operating income. The investor wants a target NOI of $48,000 per year, expects annual operating
  expenses of $27,000, anticipates a vacancy rate of 6%, and the building has 8 rental units. What
  is the required rent per unit per month to meet the target NOI?
options:
  - $828.13 per unit per month
  - $831.12 per unit per month
  - $531.91 per unit per month
  - $232.71 per unit per month
key: B
explanation: The correct rent is found by first adding operating expenses to the target NOI to get
  effective gross income, then dividing by (1 minus vacancy rate) to obtain potential gross income,
  and finally dividing by the number of units and 12 months. The distractor $531.91 per unit per
  month results from omitting operating expenses, which understates required income.
citation:
  source: REP Ref. Real Estate Math § 13.3
  url: null
  quoted_text: "Work upward from the target: required EGI = target NOI + operating expenses; required
    PGI = EGI ÷ (1 − vacancy rate); rent per unit per month = PGI ÷ units ÷ 12."
  secondary: []
math:
  worked_solution: "Step 1: EGI = $48,000 + $27,000 = $75,000. Step 2: PGI = $75,000 ÷ (1 - 0.06) =
    $75,000 ÷ 0.94 = $79,787.23. Step 3: Rent per unit per month = $79,787.23 ÷ 8 ÷ 12 = $831.12."
  formulas:
    - EGI = target NOI + operating expenses; PGI = EGI / (1 - vacancy rate); rent per unit per month
      = PGI / units / 12
