stem: A seller wants to net $225,000 after paying a $5,000 loan payoff and $2,500 in closing costs,
  and agrees to pay a 7% commission. What is the minimum sale price required?
options:
  - $258,064.52
  - $241,935.48
  - $250,000.00
  - $248,775.00
key: C
explanation: To net a desired amount after commission, add fixed seller costs to the net and divide
  by one minus the commission rate, as the rule directs. Adding the $5,000 loan payoff and $2,500
  closing costs to the $225,000 net gives $232,500; dividing by 0.93 (1 − 0.07) yields $250,000. The
  distractor $248,775 arises from incorrectly adding costs then multiplying by (1 + rate) instead of
  dividing by (1 − rate).
citation:
  source: REP Ref. Real Estate Math § 4.3
  url: null
  quoted_text: "price = (desired net + other seller costs) ÷ (1 − commission rate). Steps: add every
    seller cost that is a fixed dollar amount (loan payoff, closing costs) to the desired net;
    divide by one minus the rate."
  secondary: []
math:
  worked_solution: |-
    Other seller costs = 5,000 + 2,500 = 7,500
    Desired net + costs = 225,000 + 7,500 = 232,500
    1 − 0.07 = 0.93
    232,500 ÷ 0.93 = 250,000
  formulas:
    - Price = (Desired net + Other seller costs) ÷ (1 − Commission rate)
