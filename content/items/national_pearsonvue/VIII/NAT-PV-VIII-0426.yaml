stem: An investor buys a residential rental house for $300,000 and allocates $60,000 of the price to
  land. For federal income tax purposes, what is the accrued straight-line depreciation after 8
  years?
options:
  - $69,818.18
  - $87,272.73
  - $49,230.77
  - $71,111.11
key: A
explanation: Only the building portion is depreciated, so the depreciable basis is $300,000 −
  $60,000 = $240,000. Residential rental property uses a 27.5-year straight-line period, giving
  $240,000 ÷ 27.5 × 8 = $69,818.18. The $87,272.73 figure wrongly depreciates the entire purchase
  price including land.
citation:
  source: REP Ref. Real Estate Math § 6.2
  url: null
  quoted_text: For federal income tax the building portion of the basis (not land) is depreciated
    straight-line over 27.5 years for residential rental property
  secondary: []
math:
  worked_solution: Depreciable building basis = $300,000 − $60,000 = $240,000. Annual depreciation =
    $240,000 ÷ 27.5 = $8,727.2727. Accrued depreciation after 8 years = $8,727.2727 × 8 =
    $69,818.1818, rounded to $69,818.18.
  formulas:
    - Annual depreciation = building basis ÷ 27.5
    - Accrued depreciation = annual depreciation × years
