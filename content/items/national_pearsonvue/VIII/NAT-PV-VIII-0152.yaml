stem: A seller wants to net $180,000 after paying a 6% commission, a $210,000 loan payoff, and
  $5,000 in closing costs. What is the minimum sale price that achieves this?
options:
  - $372,340.43
  - $416,666.67
  - $395,000.00
  - $420,212.77
key: D
explanation: "Net-to-seller pricing adds every fixed dollar cost to the desired net, then divides by
  one minus the commission rate: (180,000 + 210,000 + 5,000) ÷ 0.94 = 395,000 ÷ 0.94 = $420,212.77.
  Dividing by 0.94 instead of subtracting 6% of the net is the key step; simply adding 6% to the
  costs understates the price because the commission is computed on the unknown sale price."
citation:
  source: REP Ref. Real Estate Math § 4.3
  url: null
  quoted_text: price = (desired net + other seller costs) ÷ (1 − commission rate)
  secondary: []
math:
  worked_solution: "Total fixed dollars needed = 180,000 + 210,000 + 5,000 = 395,000. Price = 395,000
    ÷ (1 − 0.06) = 395,000 ÷ 0.94 = 420,212.7659... → $420,212.77. Check: 420,212.77 × 0.06 =
    25,212.77; 420,212.77 − 25,212.77 − 210,000 − 5,000 = 180,000.00."
  formulas:
    - price = (desired net + other seller costs) ÷ (1 − commission rate)
