stem: A seller sells a property for $350,000 and pays a 6% commission. After commission, the seller
  nets $300,000. What were the seller's closing costs?
options:
  - $50,000.00
  - $32,500.00
  - $29,000.00
  - $71,000.00
key: C
explanation: "The correct answer uses the net‑to‑seller relationship: closing costs = price −
  commission − net. The most tempting distractor is $50,000.00, which omits subtracting the
  commission before comparing price to net."
citation:
  source: REP Ref. Real Estate Math § 4.3
  url: null
  quoted_text: "When a seller wants to net a stated amount after commission, the commission is a
    percentage of the unknown price, so: price = (desired net + other seller costs) ÷ (1 −
    commission rate). Steps: add every seller cost that is a fixed dollar amount (loan payoff,
    closing costs) to the desired net; divide by one minus the rate."
  secondary: []
math:
  worked_solution: |-
    Step 1: Commission = $350,000 × 0.06 = $21,000
    Step 2: Amount after commission = $350,000 − $21,000 = $329,000
    Step 3: Closing costs = $329,000 − $300,000 = $29,000
  formulas:
    - Commission = price × rate
    - Closing costs = price − commission − net
