stem: A property management agreement pays the manager 6% of collected rents. A building has
  scheduled gross rent of $15,000 per month, a vacancy and collection loss of 4%, and other income
  of $2,000 per month. What is the manager's monthly fee?
options:
  - $984 per month
  - $900 per month
  - $864 per month
  - $1,020 per month
key: A
explanation: "First calculate potential gross income (PGI) = $15,000 × 12 = $180,000 per year, or
  keep monthly: PGI per month = $15,000. Vacancy loss = $15,000 × 0.04 = $600 per month. Effective
  gross income (EGI) = PGI − vacancy loss + other income = $15,000 − $600 + $2,000 = $16,400 per
  month. The manager’s fee is 6% of EGI: $16,400 × 0.06 = $984 per month."
citation:
  source: REP Ref. Real Estate Math § 13.2
  url: null
  quoted_text: Management fees are usually a percentage of rent actually collected (EGI).
  secondary: []
math:
  worked_solution: |-
    PGI per month = $15,000
    Vacancy loss = $15,000 × 0.04 = $600
    EGI = $15,000 − $600 + $2,000 = $16,400
    Manager fee = $16,400 × 0.06 = $984
  formulas:
    - PGI = units × rent × 12 (or monthly rent × 1 for monthly)
    - Vacancy loss = PGI × vacancy rate
    - EGI = PGI − vacancy loss + other income
    - Management fee = EGI × fee rate
