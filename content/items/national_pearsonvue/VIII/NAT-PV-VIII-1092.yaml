stem: A seller wants to net $300,000 after paying a 5% commission and has $7,200 in loan payoff and
  $1,800 in closing costs. What must the sale price be to achieve that net?
options:
  - $324,000.00
  - $327,800.00
  - $326,500.00
  - $325,263.16
key: D
explanation: According to §4.3, price = (desired net + other seller costs) ÷ (1 − commission rate).
  Desired net plus costs = $300,000 + $7,200 + $1,800 = $309,000. Dividing by 0.95 yields
  $325,263.16. The distractor $324,000.00 arises from omitting the added costs before division.
