stem: A property manager collects scheduled monthly rent of $12,000 from a building. The expected
  vacancy and collection loss rate is 4%. The building also generates $150 per month from laundry
  facilities. What is the property's monthly effective gross income?
options:
  - $11,670 per month
  - $12,150 per month
  - $11,520 per month
  - $12,630 per month
key: A
explanation: "Using the part‑whole‑rate triangle, vacancy loss equals scheduled rent times the
  vacancy rate: $12,000 × 0.04 = $480. Effective gross income is scheduled rent minus vacancy loss
  plus other income: $12,000 − $480 + $150 = $11,670. The distractor $12,150 results from adding
  other income to scheduled rent without subtracting the vacancy loss."
citation:
  source: REP Ref. Real Estate Math § 1.3
  url: null
  quoted_text: "Almost every percentage problem is one of three rearrangements of a single
    relationship: Part = Whole × Rate."
  secondary: []
math:
  worked_solution: Scheduled monthly rent = $12,000. Vacancy rate = 4% = 0.04. Vacancy loss = $12,000
    × 0.04 = $480. Occupied rent = $12,000 − $480 = $11,520. Add laundry income $150 → $11,520 +
    $150 = $11,670 per month.
  formulas:
    - Loss = Scheduled Rent × Vacancy Rate; Effective Gross Income = Scheduled Rent − Loss + Other
      Income
