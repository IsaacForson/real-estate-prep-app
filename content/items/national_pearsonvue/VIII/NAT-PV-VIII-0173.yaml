stem: An investor buys a rental duplex for $410,000, of which $82,000 is allocated to the land. For
  federal income tax purposes, what is the annual straight-line depreciation deduction?
options:
  - $8,410.26
  - $11,927.27
  - $12,000.00
  - $14,909.09
key: B
explanation: "Only the building is depreciated: $410,000 − $82,000 = $328,000 building basis.
  Residential rental property is depreciated over 27.5 years, so $328,000 ÷ 27.5 = $11,927.27 per
  year. Using the full $410,000 price wrongly depreciates the land, which is never depreciated."
citation:
  source: REP Ref. Real Estate Math § 6.2
  url: null
  quoted_text: the building portion of the basis (not land) is depreciated straight-line over 27.5
    years for residential rental property and 39 years for nonresidential property
  secondary: []
math:
  worked_solution: Building basis = 410,000 − 82,000 = 328,000. Annual depreciation = 328,000 ÷ 27.5 =
    11,927.2727... ≈ $11,927.27.
  formulas:
    - Annual tax depreciation = building basis ÷ 27.5 (residential rental)
