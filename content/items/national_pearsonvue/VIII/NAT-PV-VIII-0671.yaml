stem: A seller wants to net $250,000 after paying a 6% commission and $3,000 in closing costs. What
  should be the sale price?
options:
  - $269,148.94
  - $265,957.45
  - $268,180.00
  - $272,043.01
key: A
explanation: To find the sale price, add the desired net amount and the seller’s closing costs, then
  divide by one minus the commission rate. Adding the costs gives $250,000 + $3,000 = $253,000.
  Dividing $253,000 by 0.94 (1 – 0.06) yields $269,148.94. The distractor $265,957.45 results from
  omitting the closing costs before dividing, and $268,180.00 results from incorrectly adding the
  commission instead of dividing.
citation:
  source: REP Ref. Real Estate Math § 4.3
  url: null
  quoted_text: price = (desired net + other seller costs) ÷ (1 − commission rate).
  secondary: []
math:
  worked_solution: |-
    Net + costs = $250,000 + $3,000 = $253,000.
    Divisor = 1 – 0.06 = 0.94.
    Price = $253,000 ÷ 0.94 = $269,148.94.
  formulas:
    - price = (desired net + seller costs) / (1 - commission rate)
