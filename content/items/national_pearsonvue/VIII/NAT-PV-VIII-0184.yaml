stem: A 10-unit apartment building rents each unit for $1,400 per month. The market vacancy and
  collection loss rate is 6%, laundry and parking bring in $4,800 per year, and annual operating
  expenses are $72,000. What is the property's net operating income?
options:
  - $95,520
  - $90,720
  - $162,720
  - $100,800
key: B
explanation: PGI = 10 × $1,400 × 12 = $168,000. Vacancy loss = $168,000 × 0.06 = $10,080, so EGI =
  $168,000 − $10,080 + $4,800 = $162,720. NOI = $162,720 − $72,000 = $90,720. The $162,720 option is
  the effective gross income, which is the figure before operating expenses are subtracted.
citation:
  source: REP Ref. Real Estate Math § 7.1
  url: null
  quoted_text: Effective gross income (EGI) = PGI − vacancy and collection loss + other income. Net
    operating income (NOI) = EGI − operating expenses.
