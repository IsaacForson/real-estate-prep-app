stem: A borrower takes out a $216,000 mortgage at an annual interest rate of 7.2%. How much interest
  is due for the first month?
options:
  - $1,555.20
  - $1,080.00
  - $1,440.00
  - $1,296.00
key: D
explanation: "Monthly interest equals the outstanding balance times the annual rate divided by 12:
  $216,000 × 0.072 ÷ 12 = $1,296.00. The $1,440 figure divides the annual interest by 10.8 rather
  than 12, a misapplication of the formula, and $1,080 results from using a 6% rate instead of
  7.2%."
citation:
  source: REP Ref. Real Estate Math § 5.1
  url: null
  quoted_text: Monthly interest = principal × annual rate ÷ 12. Loan interest is computed on the
    outstanding balance, so a month's interest on an amortizing loan uses the balance at the start
    of that month.
  secondary: []
math:
  worked_solution: Annual interest = $216,000 × 0.072 = $15,552. Monthly interest = $15,552 ÷ 12 = $1,296.00.
  formulas:
    - Monthly interest = principal × annual rate ÷ 12
