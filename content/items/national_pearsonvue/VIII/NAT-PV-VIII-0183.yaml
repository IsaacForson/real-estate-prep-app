stem: An investor analyzing a duplex multiplies the property's annual net operating income by a
  gross rent multiplier of 150 to estimate its value. Why is this estimate unreliable?
options:
  - A gross rent multiplier is used only for properties with more than four units
  - A gross rent multiplier must be applied to annual gross income rather than monthly rent
  - A gross rent multiplier is applied to monthly gross rent, not to net operating income
  - A gross rent multiplier should be divided into the price rather than multiplied by rent
key: C
explanation: GRM is price ÷ monthly gross rent, so value is estimated as monthly gross rent times
  the multiplier; multipliers use gross income, not NOI. Applying the multiplier to NOI mixes two
  different income concepts and distorts the result. The option about annual gross income describes
  a gross income multiplier, not a GRM.
citation:
