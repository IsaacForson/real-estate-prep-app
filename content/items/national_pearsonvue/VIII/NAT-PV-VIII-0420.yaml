stem: A property owner is comparing two buildings to decide which is being operated more
  efficiently. Building One has effective gross income of $120,000 and operating expenses of
  $48,000. Building Two has effective gross income of $90,000 and operating expenses of $33,300.
  Based on the operating expense ratio, which statement is correct?
options:
  - Building One is more efficient because its operating expense ratio is 40% versus 37% for
    Building Two
  - Building Two is more efficient because its operating expense ratio is 37% versus 40% for
    Building One
  - The buildings are equally efficient because Building Two's expenses are exactly three-fourths of
    Building One's
  - Building One is more efficient because its net operating income of $72,000 exceeds Building
    Two's $56,700
key: B
explanation: "The operating expense ratio is operating expenses divided by effective gross income.
  Building One: 48,000 ÷ 120,000 = 40%. Building Two: 33,300 ÷ 90,000 = 37%. A lower ratio means a
  smaller share of income is consumed by expenses, so Building Two operates more efficiently. The
  higher-NOI argument confuses absolute dollars with efficiency; a larger building can have higher
  NOI while still spending a bigger fraction of each income dollar on operations."
citation:
