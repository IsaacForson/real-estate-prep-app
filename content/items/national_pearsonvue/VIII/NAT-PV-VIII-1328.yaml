stem: A borrower has a gross monthly income of $5,000, monthly debt obligations of $600, and is
  seeking a loan with a housing ratio of 28% and a total debt ratio of 36%. What is the maximum
  monthly PITI payment the borrower can qualify for?
options:
  - $1,200
  - $1,400
  - $1,000
  - $1,800
key: A
explanation: The correct answer is $1,200 because the front‑end limit is $5,000 × 0.28 = $1,400,
  while the back‑end limit is ($5,000 × 0.36) − $600 = $1,800 − $600 = $1,200; the borrower
  qualifies for the lower of the two, $1,200. A frequent error is to consider only the front‑end
  ratio, which would give $1,400.
citation:
  source: "REP Ref. Real Estate Math — Reference note: exam math methods with worked examples
    (authored, status: draft — needs licensed review) § 5.9"
  url: null
  quoted_text: "Front-end: maximum housing payment = gross monthly income × housing ratio. Back-end:
    maximum total obligations = gross monthly income × total ratio; subtract other monthly debts to
    get the housing payment that ratio allows. The borrower qualifies for the lower of the two
    housing figures."
  secondary: []
math:
  worked_solution: |-
    Front-end: $5,000 × 0.28 = $1,400.
    Back-end: $5,000 × 0.36 = $1,800; subtract debts: $1,800 − $600 = $1,200.
    Lower of the two: min($1,400, $1,200) = $1,200.
  formulas:
    - Front-end = Income × HousingRatio
    - Back-end = (Income × TotalRatio) − Debt
    - MaxPITI = min(Front-end, Back-end)
