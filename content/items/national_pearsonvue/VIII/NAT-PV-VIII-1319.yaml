stem: A comparable property sold for $340,000 and has 2,000 square feet of living area. The subject
  property has 2,500 square feet. Using the price-per-square-foot method, what is the indicated
  value of the subject property?
options:
  - $340,000
  - $272,000
  - $374,000
  - $425,000
key: D
explanation: The price per square foot is found by dividing the sale price by the comparable's area.
  Multiplying that rate by the subject's area yields the indicated value. The correct calculation
  gives $425,000.
citation:
  source: REP Ref. Real Estate Math § 2.5
  url: null
  quoted_text: Price per square foot = price ÷ area; price = area × price per square foot.
  secondary: []
math:
  worked_solution: "Step 1: Price per square foot = $340,000 ÷ 2,000 sq ft = $170 per sq ft. Step 2:
    Value = $170 per sq ft × 2,500 sq ft = $425,000."
