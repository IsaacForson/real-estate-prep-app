stem: A borrower has gross monthly income of $5,500. The lender uses a housing ratio of 28% and a
  total debt ratio of 36%. Monthly non‑housing debts are $650. What is the maximum PITI the borrower
  can qualify for?
options:
  - $1,540
  - $1,200
  - $1,330
  - $1,980
key: C
explanation: "The housing ratio limits the monthly housing payment to 28% of gross income, which is
  $5,500 × 0.28 = $1,540. The total debt ratio limits all monthly debt payments to 36% of gross
  income, or $5,500 × 0.36 = $1,980. Subtract the existing non‑housing debts of $650 from this
  total‑debt limit to get the maximum housing payment allowed by the back‑end ratio: $1,980 – $650 =
  $1,330. The borrower must satisfy both ratios, so the qualifying PITI is the lower of the two
  amounts, $1,330."
citation:
  source: REP Ref. Real Estate Math § 5.9
  url: null
  quoted_text: "Front-end: maximum housing payment = gross monthly income × housing ratio. Back-end:
    maximum total obligations = gross monthly income × total ratio; subtract other monthly debts to
    get the housing payment that ratio allows. The borrower qualifies for the lower of the two
    housing figures."
  secondary: []
math:
  worked_solution: |-
    Front-end = $5,500 × 0.28 = $1,540.
    Back-end = $5,500 × 0.36 = $1,980.
    Back-end after debts = $1,980 − $650 = $1,330.
    Qualifying PITI = lower of $1,540 and $1,330 = $1,330.
  formulas:
    - front = income × housing ratio
    - back = income × total ratio - monthly debts
    - qualifying = min(front, back)
