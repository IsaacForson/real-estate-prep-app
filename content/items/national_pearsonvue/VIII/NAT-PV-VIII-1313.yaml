math:
  worked_solution: |-
    Step 1: Average width = (80 ft + 100 ft) ÷ 2 = 90 ft.
    Step 2: Area = 90 ft × 150 ft = 13,500 sq ft.
    Step 3: Acres = 13,500 ÷ 43,560 = 0.3099... acre.
    Step 4: Round to two decimal places: 0.31 acre.
