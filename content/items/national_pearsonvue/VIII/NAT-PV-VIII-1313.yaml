stem: A trapezoidal lot has 80 feet of frontage on the street, 100 feet along the rear line, and a
  depth of 150 feet. What is the area of the lot in acres? (Round to two decimal places.)
options:
  - 0.32 acre
  - 0.30 acre
  - 0.29 acre
  - 0.31 acre
key: D
explanation: According to § 2.3, the area of a trapezoid equals the average of the two parallel
  sides multiplied by the depth. Average width = (80 + 100) ÷ 2 = 90 ft; area = 90 × 150 = 13,500 sq
  ft. Dividing by 43,560 gives 0.3099 acre, which rounds to 0.31 acre. The distractor 0.30 acre
  arises from rounding down instead of rounding up at the second decimal place.
citation:
