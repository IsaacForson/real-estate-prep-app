stem: An L-shaped lot consists of a 70-foot by 90-foot rectangle attached to a 40-foot by 50-foot
  rectangle. What is the total area of the lot in square feet?
options:
  - 8,200 square feet
  - 8,300 square feet
  - 8,400 square feet
  - 8,100 square feet
key: B
explanation: Each rectangle’s area is length × width; summing the two gives 70×90 + 40×50 = 6,300 +
  2,000 = 8,300 ft². The distractor 8,200 ft² most often comes from miscalculating the first
  rectangle as 70×90 = 6,200 ft² or omitting the second rectangle’s area.
citation:
  source: REP Ref. Real Estate Math § 2.2
  url: null
  quoted_text: Area = frontage (width along the street) × depth. Acres = square feet ÷ 43,560.
  secondary: []
math:
  worked_solution: |-
    First rectangle: 70 ft × 90 ft = 6,300 ft²
    Second rectangle: 40 ft × 50 ft = 2,000 ft²
    Total area = 6,300 ft² + 2,000 ft² = 8,300 ft²
  formulas:
    - Area = length × width
    - Total area = area₁ + area₂
