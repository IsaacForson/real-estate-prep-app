stem: A buyer is purchasing a home for $300,000 with a $240,000 loan and $15,000 in earnest money
  already deposited. The lender charges a 1% origination fee, and the seller owes the buyer a $900
  tax proration. Which combination correctly states the buyer's origination fee and the treatment of
  the tax proration on the closing statement?
options:
  - $3,000 buyer debit; $900 seller credit
  - $2,400 buyer debit; $900 buyer credit
  - $2,400 buyer credit; $900 buyer debit
  - $3,000 buyer credit; $900 seller debit
key: B
explanation: "The origination fee is 1% of the loan, not the price: 240,000 × 0.01 = $2,400, and it
  is one of the buyer's own closing costs, a buyer debit. Taxes paid in arrears create a proration
  owed by the seller, which is a debit to the seller and a credit to the buyer. Basing the fee on
  the $300,000 price ($3,000) is the common error."
