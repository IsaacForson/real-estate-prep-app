stem: A licensee is appraising a small office building. The reproduction cost of the improvements is
  $350,000, the total economic life is estimated at 25 years, and the effective age is 5 years.
  Using straight-line depreciation, what is the depreciated value of the improvements?
options:
  - $270,000
  - $290,000
  - $280,000
  - $260,000
key: C
explanation: Annual depreciation is calculated by dividing the improvement cost by the total
  economic life. Multiplying the annual depreciation by the effective age gives the accrued
  depreciation. Subtracting the accrued depreciation from the cost yields the depreciated value.
citation:
  source: REP Ref. Real Estate Math § 6.1
  url: null
  quoted_text: Annual depreciation = improvement cost ÷ total economic life (land is never
    depreciated). Accrued depreciation = annual depreciation × effective age. Depreciated value =
    cost − accrued depreciation.
  secondary: []
math:
  worked_solution: |-
    Annual depreciation = $350,000 ÷ 25 = $14,000
    Accrued depreciation = $14,000 × 5 = $70,000
    Depreciated value = $350,000 − $70,000 = $280,000
  formulas:
    - Annual depreciation = improvement cost / total economic life
    - Accrued depreciation = annual depreciation × effective age
    - Depreciated value = improvement cost - accrued depreciation
