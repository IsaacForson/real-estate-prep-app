stem: A tenant leases 1,800 square feet of retail space at $26 per square foot per year. What is the
  monthly rent?
options:
  - $4,320 per month
  - $3,900 per month
  - $3,250 per month
  - $4,680 per month
key: B
explanation: Annual rent = area × rate = 1,800 × $26 = $46,800 per year, and monthly rent = $46,800
  ÷ 12 = $3,900. The $4,680 figure results from multiplying the area by the rate and dividing by 10
  instead of 12.
