stem: A borrower is choosing between two ways lenders quoted the cost of a $240,000 loan. Lender One
  charges 2 discount points. Lender Two charges a 1% origination fee plus 1 discount point. Which
  statement correctly compares the two quotes?
options:
  - Both lenders charge $4,800, because an origination fee expressed as a percent of the loan and a
    discount point are each 1% of the loan amount
  - Lender One charges $4,800 while Lender Two charges $3,600, because the origination fee is
    figured on the price rather than the loan
  - Lender One charges $2,400 while Lender Two charges $4,800, because discount points are computed
    only on the interest portion
  - Lender Two charges $4,800 while Lender One charges $2,400, because two discount points equal 2%
    of the purchase price
key: A
explanation: One point equals 1% of the loan amount, so 2 points on $240,000 cost $4,800; a 1%
  origination fee plus 1 point is likewise 2% of the loan, or $4,800. The claim that the origination
  fee is figured on the price contradicts the rule that points and percentage fees are computed on
  the loan, never on the price, and no purchase price is even given here.
citation:
  source: REP Ref. Real Estate Math § 5.4
  url: null
  quoted_text: One point = 1% of the loan amount, never of the price. Dollar cost = loan × points ÷ 100.
  secondary: []
math:
  worked_solution: "Lender One: $240,000 × 0.02 = $4,800. Lender Two: origination fee $240,000 × 0.01
    = $2,400; 1 point $240,000 × 0.01 = $2,400; total $2,400 + $2,400 = $4,800. The quotes are
    equal."
  formulas:
    - Dollar cost of points = loan × points ÷ 100
