stem: A 3,000-square-foot office is leased at $20 per square foot per year. The owner pays a
  management fee of 5% of rent actually collected. Assuming the space is fully occupied and all rent
  is collected, what is the annual management fee?
options:
  - $3,000
  - $250
  - $2,500
  - $3,600
key: A
explanation: Annual collected rent = 3,000 × $20 = $60,000. Management fees are a percentage of rent
  actually collected, so the fee = 60,000 × 0.05 = $3,000. The $250 figure applies the 5% to a
  single month's rent ($5,000) rather than to the annual collected rent.
citation:
  source: REP Ref. Real Estate Math § 13.2
  url: null
  quoted_text: Management fees are usually a percentage of rent actually collected (EGI).
  secondary: []
math:
  worked_solution: Annual rent = 3,000 × 20 = $60,000 collected. Management fee = 60,000 × 0.05 = $3,000 per year.
  formulas:
    - annual rent = area × rate per square foot per year
    - management fee = collected rent × fee percentage
