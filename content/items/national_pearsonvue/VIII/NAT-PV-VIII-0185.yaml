stem: An investor buys a small retail strip with a cash investment of $150,000 (down payment plus
  closing costs). The property produces NOI of $61,200 per year, and the monthly mortgage payment is
  $4,100. What is the investor's cash-on-cash return?
options:
  - 8.00%
  - 40.80%
  - 12.00%
  - 9.68%
key: A
explanation: Annual debt service = $4,100 × 12 = $49,200. Before-tax cash flow = $61,200 − $49,200 =
  $12,000. Cash-on-cash return = $12,000 ÷ $150,000 = 8.00%. The 40.80% option results from dividing
  NOI by cash invested without subtracting debt service, which ignores that cash-on-cash return uses
  before-tax cash flow.
citation:
  source: REP Ref. Real Estate Math § 7.4
  url: null
  quoted_text: Before-tax cash flow (BTCF) = NOI − annual debt service. Cash-on-cash return = BTCF ÷
    cash invested (down payment plus closing costs).
  secondary: []
math:
  worked_solution: Annual debt service = 4,100 × 12 = 49,200. BTCF = 61,200 − 49,200 = 12,000. Return
    = 12,000 ÷ 150,000 = 0.08 = 8.00%.
  formulas:
    - BTCF = NOI − annual debt service
    - Cash-on-cash return = BTCF ÷ cash invested
