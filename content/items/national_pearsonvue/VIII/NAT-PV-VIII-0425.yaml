stem: An investor purchases a parcel of land for $180,000. The land is expected to appreciate at 5%
  per year, compounded annually. What will be the value of the land after 4 years?
options:
  - $216,000.00
  - $208,372.50
  - $227,245.85
  - $218,791.13
key: D
explanation: Compound appreciation applies each year's rate to the prior year's value, so the
  calculation is $180,000 × 1.05 four times, or $218,791.13. The $216,000.00 figure uses simple
  appreciation, applying 5% only to the original value for 4 years.
citation:
  source: REP Ref. Real Estate Math § 6.3
  url: null
  quoted_text: "Compound (each year's percentage applies to the prior year's value): value × (1 +
    rate) repeated once per year."
  secondary: []
math:
  worked_solution: "Growth factor per year = 1 + 0.05 = 1.05. Year 1: $180,000 × 1.05 = $189,000. Year
    2: $189,000 × 1.05 = $198,450. Year 3: $198,450 × 1.05 = $208,372.50. Year 4: $208,372.50 × 1.05
    = $218,791.125, rounded to $218,791.13."
  formulas:
    - Future value = present value × (1 + rate)^years
