stem: On a $600,000 sale with a 5% total commission, Plan A gives the listing brokerage 55% of the
  commission and the listing agent 70% of that brokerage share. Plan B gives the listing brokerage
  50% of the commission and the listing agent 80% of that brokerage share. Which plan pays the
  listing agent more, and by how much?
options:
  - Plan B pays the listing agent $1,050 more
  - Plan A pays the listing agent $450 more
  - Both plans pay the listing agent equally
  - Plan B pays the listing agent $450 more
key: D
explanation: Apply the splits in sequence for each plan. Plan A pays $600,000 × 0.05 × 0.55 × 0.70 =
  $11,550, while Plan B pays $600,000 × 0.05 × 0.50 × 0.80 = $12,000, so Plan B pays $450 more. The
  $1,050 difference compares the brokerage shares before applying the agents' different splits.
citation:
  source: REP Ref. Real Estate Math § 4.2
  url: null
  quoted_text: "Apply the splits in sequence: price × commission rate × brokerage's share × agent's split."
  secondary: []
math:
  worked_solution: "Total commission = $600,000 × 0.05 = $30,000. Plan A: brokerage share = $30,000 ×
    0.55 = $16,500; agent = $16,500 × 0.70 = $11,550. Plan B: brokerage share = $30,000 × 0.50 =
    $15,000; agent = $15,000 × 0.80 = $12,000. Difference = $12,000 − $11,550 = $450."
  formulas:
    - agent pay = price × commission rate × brokerage share × agent split
    - difference = Plan B agent pay − Plan A agent pay
