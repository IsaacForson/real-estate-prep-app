stem: An L-shaped lot consists of a 100-foot by 150-foot rectangle attached to a 60-foot by 80-foot
  rectangle. What is the total area of the lot in square feet? (Round to the nearest whole number.)
options:
  - 18,800 square feet
  - 20,800 square feet
  - 19,800 square feet
  - 19,000 square feet
key: C
explanation: "The area of each rectangle is length × width: 100 ft × 150 ft = 15,000 sq ft and 60 ft
  × 80 ft = 4,800 sq ft. Summing gives 15,000 + 4,800 = 19,800 sq ft. The distractor 18,800 square
  feet results from omitting the 60 × 80 rectangle or miscalculating its area."
