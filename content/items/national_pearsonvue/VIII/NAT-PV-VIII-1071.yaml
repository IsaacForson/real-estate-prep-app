stem: According to the text’s description of common mistakes when using multipliers and
  capitalization rates, which of the following calculations is cited as a wrong-answer pattern?
options:
  - Using net operating income divided by the capitalization rate
  - Using monthly gross rent divided by the capitalization rate
  - Using net operating income multiplied by the gross rent multiplier
  - Using annual gross income multiplied by the gross income multiplier
key: B
explanation: The text explicitly states that dividing monthly gross rent by a cap rate is a common
  wrong-answer pattern. Dividing NOI by the cap rate is the correct use of the capitalization rate,
  while the other two options are not mentioned as errors.
