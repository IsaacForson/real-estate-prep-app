stem: A property sells for $375,000. The seller incurs $4,500 in closing costs and agrees to pay a
  6% commission on the sale price. What is the seller's net proceeds after paying the commission and
  closing costs?
options:
  - $363,000
  - $370,500
  - $352,500
  - $348,000
key: D
explanation: The key is correct because commission is calculated as sale price times rate, then
  subtracted from the sale price along with closing costs to find net proceeds (§ 4.1). The most
  tempting distractor, $352,500, results from forgetting to subtract closing costs, which omits the
  seller’s expense.
citation:
  source: REP Ref. Brokerage Practice § 4.1
  url: null
  quoted_text: Commission = sale price × rate.
  secondary: []
math:
  worked_solution: |-
    Step 1: Commission = 375,000 × 0.06 = 22,500
    Step 2: Net proceeds = 375,000 - 22,500 - 4,500 = 348,000
  formulas:
    - Commission = sale price × rate
    - Net proceeds = sale price - commission - closing costs
