stem: A rectangular lot has 90 feet of frontage and a depth of 145 feet. How many acres does the lot
  contain?
options:
  - 0.33 acre
  - 0.30 acre
  - 0.40 acre
  - 0.36 acre
key: B
explanation: Area = frontage × depth = 90 × 145 = 13,050 square feet. Acres = 13,050 ÷ 43,560 =
  0.2996, which rounds to 0.30 acre. The 0.33-acre option results from dividing by 39,600 or similar
  arithmetic slips; the conversion factor is fixed at 43,560 square feet per acre.
