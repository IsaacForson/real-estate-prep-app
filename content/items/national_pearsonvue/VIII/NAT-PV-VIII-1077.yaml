stem: A seller wants to net $180,000 after paying a 5% commission and $2,500 in closing costs. What
  must the sale price be to achieve that net?
options:
  - $192,105.26
  - $189,473.68
  - $191,625.00
  - $191,500.00
key: A
explanation: Under the net-to-seller formula, price equals (desired net plus closing costs) divided
  by one minus the commission rate. Adding $180,000 and $2,500 gives $182,500; dividing by 0.95
  yields $192,105.26. The distractor $189,473.68 results from dividing the net alone by 0.95,
  omitting the closing costs.
