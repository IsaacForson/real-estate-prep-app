stem: Under the Truth in Lending Act, which of the following charges is included in the finance charge?
options:
  - The interest charged on the loan amount of the
  - The title insurance premium paid at closing
  - The appraisal fee charged by the lender for the
  - The attorney fee for preparing closing documents
key: A
explanation: The finance charge includes interest, time price differential, and amounts payable
  under points or similar charges, as stated in §1605(a). The other options are either third‑party
  closing agent fees not required by the creditor or fees expressly excluded for
  real‑property‑secured loans.
