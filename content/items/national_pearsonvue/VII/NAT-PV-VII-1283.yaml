stem: Which party holds bare legal title for the lender in a deed of trust?
options:
  - The borrower (trustor)
  - The trustee (third party)
  - The beneficiary (lender)
  - The lender (beneficiary)
key: B
explanation: In a deed of trust, the borrower conveys bare legal title to a neutral third party
  (trustee) who holds it for the lender (beneficiary). Therefore the trustee holds the title. The
  lender is the beneficiary, not the title holder.
