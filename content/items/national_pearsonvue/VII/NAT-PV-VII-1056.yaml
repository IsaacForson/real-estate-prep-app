stem: What must the lender do under the defeasance clause when the debt is fully paid?
options:
  - Foreclose property
  - Release the lien
  - Notify the borrower
  - Collect the penalty
key: B
explanation: The defeasance clause requires the lender to release the lien or cause the trustee to
  reconvey title upon full payment, so 'Release the lien' is correct. The distractor 'Foreclose
  property' is incorrect because foreclosure occurs upon default, not when the debt is paid.
