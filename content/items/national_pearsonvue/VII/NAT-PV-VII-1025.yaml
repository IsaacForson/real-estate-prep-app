stem: A borrower transfers title of the mortgaged property to a friend without obtaining the
  lender's consent. The loan contains an alienation (due-on-sale) clause. According to the Garn–St
  Germain Act of 1982, what is the lender's right?
options:
  - The lender may not accelerate because transfers to friends are exempt
  - The lender may accelerate the loan because the transfer is not exempt
  - The lender must first offer the loan to the friend before accelerating
  - The lender may accelerate only if the friend assumes the loan
key: B
explanation: Under the Garn–St Germain Act, alienation clauses are enforceable except for specific
  exempt transfers; a transfer to a friend is not exempt, so the lender may accelerate, per §2.2.
  The distractor claiming that transfers to friends are exempt misstates the statute, which only
  exempts transfers to a spouse, child, joint tenant on death, or into a living trust.
