stem: A licensee is assisting a buyer who has an FHA-insured loan and wants to pay off the loan
  balance early. What is the correct statement regarding a prepayment penalty?
options:
  - No prepayment penalty may be charged on the loan
  - A prepayment penalty of six months' interest may be charged
  - A prepayment penalty of one percent of the balance may apply
  - The lender may charge a penalty only if the loan defaults
key: A
explanation: FHA, VA, and USDA loans do not allow prepayment penalties, so no penalty may be charged
  when the borrower pays off the loan early.
