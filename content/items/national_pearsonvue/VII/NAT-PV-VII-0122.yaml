stem: "A consumer obtains a $180,000 first mortgage on her principal dwelling. At consummation, the
  loan's annual percentage rate is 11.9%, while the average prime offer rate for a comparable
  transaction is 5.2%. Under TILA's high-cost mortgage definition, this loan is:"
options:
  - A high-cost mortgage, because its APR exceeds the average prime offer rate by more than 6.5
    percentage points
  - Not a high-cost mortgage, because first mortgages are exempt from the APR trigger
  - A high-cost mortgage, because its APR exceeds the average prime offer rate by more than 8.5
    percentage points
  - Not a high-cost mortgage, because the loan amount exceeds $50,000
key: A
explanation: The spread is 11.9% − 5.2% = 6.7 percentage points. Under § 1602(bb)(1)(A)(i)(I), a
  first mortgage on the principal dwelling is a high-cost mortgage if the APR exceeds the average
  prime offer rate by more than 6.5 percentage points; 6.7 points exceeds that threshold. The
  8.5-point trigger applies to subordinate or junior mortgages, not first mortgages.
