stem: Borrower Jane transfers title of the mortgaged home to her adult daughter without the lender's
  consent. Under the alienation clause rules, can the lender accelerate the loan?
options:
  - No, because a transfer to a child is exempt from the due-on-sale clause.
  - No, because FHA loans are automatically assumable regardless of transfer.
  - Yes, because any transfer without lender consent triggers acceleration.
  - Yes, because the Garn–St Germain Act requires enforcement of all alienation clauses.
key: A
explanation: The Garn–St Germain Act exempts transfers to a spouse or child, so the due-on-sale
  clause cannot be enforced in this case. The other choices ignore the specific exemption or
  misapply FHA loan rules.
