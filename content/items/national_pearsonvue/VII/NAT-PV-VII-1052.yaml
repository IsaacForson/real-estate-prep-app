stem: A loan servicer provides a monthly periodic statement for an adjustable-rate mortgage that
  includes the principal balance and current interest rate but omits the date on which the interest
  rate may next reset. Under TILA §1638(f)(1)(C), is the statement compliant?
options:
  - Yes, because the principal balance and interest rate are the only required items.
  - No, because the statement must also include the date on which the interest rate may next reset.
  - Yes, because adjustable-rate mortgages are exempt from periodic statement requirements.
  - No, because the statement must also include a telephone number for counseling agencies.
key: B
explanation: TILA §1638(f)(1)(C) mandates that periodic statements for residential mortgage loans
  include the date on which the interest rate may next reset or adjust. Because the statement omits
  that date, it fails to meet the requirement. The telephone number for counseling agencies is
  required under subsection (f)(1)(F) but does not cure the missing reset date. No exemption for
  adjustable-rate mortgages from periodic statements exists in the statute.
