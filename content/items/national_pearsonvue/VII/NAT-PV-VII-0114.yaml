stem: A veteran with full entitlement wants to buy a home priced well above the conforming loan
  limit with no money down. Her lender asks how the VA guaranty applies. Which statement is correct?
options:
  - She may borrow up to two times her basic entitlement of $36,000, which is $72,000, with no down
    payment required by the VA, but any amount above that must be covered by her own funds at
    closing
  - She must pay a monthly mortgage insurance premium on the portion of the loan that exceeds the
    county conforming loan limit, similar to the FHA structure for high-balance mortgages
  - She must make a down payment equal to 25% of any amount above the lender's approved loan amount,
    since the VA guaranty cannot extend beyond what the lender is willing to underwrite for her
  - She may borrow with no down payment for as much as the lender approves, because borrowers with
    full entitlement face no VA loan limit
key: D
explanation: Since 2020, borrowers with full entitlement face no VA loan limit and may borrow with
  no down payment for as much as the lender approves. The county-limit down payment requirement
  applies only to borrowers with partially used entitlement, and VA loans carry no monthly mortgage
  insurance.
