stem: What does an alienation (due-on-sale) clause in a mortgage or deed of trust allow the lender to do?
options:
  - The lender may require the borrower to pay off the loan immediately after any late payment.
  - The lender may accelerate the loan if the borrower transfers title without consent.
  - The lender may permit the borrower to assume the loan without obtaining lender approval.
  - The lender may automatically release the lien when the property is sold to a new owner.
key: B
explanation: The alienation clause permits the lender to accelerate the loan when the borrower
  transfers title without the lender's consent, preventing assumption of a below‑market loan without
  re‑underwriting. The distractor about requiring immediate payoff after any late payment describes
  a default remedy, not the alienation clause, which is triggered only by unauthorized transfer.
