stem: A borrower sells the property and transfers title to the buyer without obtaining the lender's
  consent. The loan contains an alienation clause. What action may the lender take?
options:
  - Accelerate the loan
  - Declare the balance due
  - Require loan payoff
  - Demand immediate payment
key: A
explanation: The alienation clause permits the lender to accelerate the loan if the borrower
  transfers title without consent, making 'Accelerate the loan' correct. The distractor 'Demand
  immediate payment' is inaccurate because acceleration must occur first; the lender cannot demand
  payment without invoking the acceleration clause.
