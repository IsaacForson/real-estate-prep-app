stem: A buyer obtains a USDA Rural Development guaranteed loan for $180,000. The program charges an
  upfront guarantee fee of 1.00% of the loan amount. What is the upfront guarantee fee?
options:
  - $630.00
  - $3,600.00
  - $900.00
  - $1,800.00
key: D
explanation: The upfront guarantee fee equals the loan amount multiplied by 1.00%; $180,000 × 0.01 =
  $1,800. The $630.00 distractor results from using the annual fee rate of 0.35% instead of the
  upfront fee.
