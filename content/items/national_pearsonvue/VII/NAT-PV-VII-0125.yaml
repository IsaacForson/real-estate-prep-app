stem: Under RESPA, during what period after the effective date of a servicing transfer may a
  borrower **NOT** be charged a late fee for a payment mistakenly sent to the transferor servicer
  before its due date?
options:
  - A 30-day period beginning on the effective date of transfer
  - A 15-day period beginning on the effective date of transfer
  - A 90-day period beginning on the effective date of transfer
  - A 60-day period beginning on the effective date of transfer
key: D
explanation: "Section 2605(d) protects borrowers for a 60-day period beginning on the effective date
  of transfer: no late fee may be imposed and no payment may be treated as late if the payment is
  received by the transferor servicer before its due date. The 30- and 15-day figures relate to
  notice deadlines elsewhere in the section, not this protection."
citation:
  source: 12 U.S.C. § 2605(d)
  url: null
  quoted_text: During the 60-day period beginning on the effective date of transfer of the servicing
    of any federally related mortgage loan, a late fee may not be imposed on the borrower
