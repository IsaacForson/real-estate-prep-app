stem: To be eligible for an FHA-insured Home Equity Conversion Mortgage (HECM), a borrower must meet
  which minimum age requirement?
options:
  - 59½ years of age
  - 62 years of age
  - 65 years of age
  - 55 years of age
key: B
explanation: The HECM program requires borrowers to be 62 or older, to own the home outright or
  nearly so, to occupy it, and to complete HUD-approved counseling. The other ages are
  plausible-sounding thresholds drawn from retirement-plan rules, not the HECM standard.
