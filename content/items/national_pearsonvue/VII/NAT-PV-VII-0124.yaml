stem: Under RESPA, when the servicing of a federally related mortgage loan is transferred, within
  what period must the transferor servicer generally notify the borrower in writing of the transfer?
options:
  - Not less than 30 days before the effective date of transfer
  - Not more than 30 days after the effective date of transfer
  - Not less than 15 days before the effective date of transfer
  - Not more than 15 days after the effective date of transfer
key: C
explanation: Section 2605(b)(2)(A) requires the transferor servicer's notice to be made not less
  than 15 days before the effective date of transfer. The 15-days-after deadline applies to the
  transferee servicer's notice under subsection (c), not the transferor's.
