stem: What does a subordination clause allow a lien holder to do?
options:
  - The lien holder may voluntarily accept a lower priority than a later lien.
  - The lien holder may immediately take possession of the property upon default.
  - The lien holder may accelerate the loan after a missed tax payment.
  - The lien holder may declare the entire unpaid balance due upon missed payment.
key: A
explanation: A subordination clause lets a lien holder voluntarily accept a lower priority than a
  later lien, per the text. The distractor about declaring the entire balance due confuses
  subordination with an acceleration clause.
