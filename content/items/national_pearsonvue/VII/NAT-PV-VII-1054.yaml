stem: A consumer’s hybrid adjustable rate mortgage is scheduled to reset from a fixed rate to a
  variable rate on March 15, 2025. According to TILA §1638a(b), during which period must the
  creditor provide the reset notice?
options:
  - From February 15 to March 15, 2025.
  - From September 15 to October 15, 2024.
  - From August 15 to September 15, 2024.
  - From January 15 to February 15, 2025.
key: C
explanation: The rule requires notice during the one‑month period that ends six months before the
  reset date. Six months before March 15, 2025 is September 15, 2024; the one‑month period ending on
  that date runs from August 15 to September 15, 2024. Therefore, the creditor must provide the
  notice in that window.
