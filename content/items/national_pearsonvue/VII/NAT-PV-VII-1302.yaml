stem: Under TILA §1638(f)(1), which item must be included in a periodic statement for a residential
  mortgage loan?
options:
  - The borrower's credit score
  - The loan's origination date
  - The property's market value
  - The principal amount owed
key: D
explanation: The statute requires the statement to set forth the amount of the principal obligation
  under the mortgage. The borrower's credit score is not listed among the required disclosures.
