stem: Under the Truth in Lending Act, a person is a 'creditor' only if the person regularly extends
  consumer credit that meets which condition?
options:
  - Is secured by a mortgage or other lien on the borrower's principal residence
  - Is extended to a natural person primarily for business, commercial, or agricultural purposes
  - Is payable by agreement in more than four installments or subject to a finance charge
  - Is payable by agreement in four or fewer installments with no finance charge required
key: C
explanation: Section 1602(g) defines 'creditor' as a person who regularly extends consumer credit
  'payable by agreement in more than four installments or for which the payment of a finance charge
  is or may be required,' and to whom the debt is initially payable. A security interest in a
  dwelling is not part of the general creditor definition, so the mortgage option is wrong.
