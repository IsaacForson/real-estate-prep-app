stem: In a contract for deed (land contract) arrangement, what is true regarding legal title?
options:
  - The seller retains legal title until the purchase price is fully paid.
  - The seller transfers legal title at closing and retains only a lien.
  - The seller and buyer share legal title equally from day one.
  - The seller must convey legal title within six months of possession.
key: A
explanation: In a contract for deed, the seller keeps legal title until the buyer has paid the full
  purchase price; the buyer receives possession and equitable title immediately.
