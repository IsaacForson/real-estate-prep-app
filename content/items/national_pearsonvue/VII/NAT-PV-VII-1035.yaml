stem: A borrower transfers title of the mortgaged property to her sibling without obtaining the
  lender's consent. The loan contains an alienation (due-on-sale) clause. According to the Garn–St
  Germain Act of 1982, what is the lender's right?
options:
  - The lender may accelerate the loan and demand immediate payment.
  - The lender may not accelerate; sibling transfer is not exempt.
  - The lender must sue only for missed payments and cannot accelerate.
  - The lender must release the lien and cannot pursue foreclosure.
key: A
explanation: The Garn–St Germain Act exempts transfers to a spouse or child, but not to a sibling,
  so the lender may accelerate the loan. The distractor claiming exemption for a sibling is
  incorrect because the statute does not list siblings as exempt.
