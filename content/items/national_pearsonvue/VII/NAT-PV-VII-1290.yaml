stem: What does the defeasance clause in a mortgage or deed of trust require the lender to do when
  the debt is fully paid?
options:
  - The lender must release the lien or cause the trustee to reconvey title
  - The lender must accelerate the unpaid balance upon default
  - The lender must collect a prepayment penalty for early payoff
  - The lender must foreclose judicially before taking possession
key: A
explanation: The defeasance clause requires the lender to release the lien or cause the trustee to
  reconvey title upon full payment, ensuring the borrower receives clear title. The acceleration
  clause, which allows the lender to demand the full balance upon default, is unrelated to payoff.
