stem: Under a deed of trust that includes a power-of-sale clause and where state law permits
  non-judicial foreclosure, what document does the trustee deliver to the winning bidder at the
  auction?
options:
  - The trustee delivers a trustee's deed to the high bidder
  - The trustee delivers a satisfaction of mortgage to the high bidder
  - The trustee delivers a reconveyance deed to the high bidder
  - The trustee delivers a quitclaim deed to the high bidder
key: A
explanation: When a power-of-sale foreclosure is conducted, the trustee conveys the property to the
  purchaser via a trustee's deed. A satisfaction of mortgage or reconveyance deed occurs upon loan
  payoff, and a quitclaim deed is not used in foreclosure sales.
