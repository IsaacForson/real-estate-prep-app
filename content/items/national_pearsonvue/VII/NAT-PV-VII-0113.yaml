stem: Under the Homeowners Protection Act, when must a lender automatically terminate borrower-paid
  private mortgage insurance on a single-family principal residence?
options:
  - When the balance is scheduled to reach 75% of original value regardless of payment history
  - When the borrower has paid the loan for at least half of the original loan term
  - When the balance is scheduled to reach 78% of original value and the loan is current
  - When the balance is scheduled to reach 80% of original value and the borrower requests it
key: C
explanation: Automatic termination occurs when the balance is scheduled to reach 78% of original
  value if the loan is current. The 80% threshold applies to borrower-requested cancellation, which
  also requires a good payment history and no junior liens.
