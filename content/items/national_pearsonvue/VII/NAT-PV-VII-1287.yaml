stem: Under the Homeowners Protection Act, a borrower may request cancellation of borrower-paid
  private mortgage insurance when the loan balance reaches what percentage of the original property
  value?
options:
  - 85% of the original value
  - 80% of the original value
  - 78% of the original value
  - 70% of the original value
key: B
explanation: Under the Homeowners Protection Act, a borrower may request cancellation of
  borrower‑paid private mortgage insurance when the loan balance reaches 80% of the original
  property value. Automatic termination occurs at 78% if the loan remains current. Therefore the
  option stating 80% of the original value describes the request threshold, while the option stating
  78% describes the automatic termination point.
