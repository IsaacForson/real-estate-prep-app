stem: A buyer purchases a home and takes title 'subject to' the existing mortgage. According to the
  alienation clause provisions, which statement is correct regarding liability for the mortgage
  debt?
options:
  - The buyer is personally liable and the seller is released from liability
  - Both the buyer and seller are jointly liable for the mortgage debt
  - The buyer is not personally liable and the seller remains liable for the debt
  - Neither the buyer nor the seller is liable; the loan is automatically discharged
key: C
explanation: Under the alienation clause, a buyer who takes title subject to the loan makes payments
  but is not personally liable on the note, leaving the seller liable unless released. The
  distractor claiming the buyer is personally liable confuses subject-to with loan assumption.
