stem: Which statement about title insurance policies issued at closing is correct?
options:
  - The lender's policy is required by virtually every lender and its amount declines as the loan
    balance is paid.
  - The owner's policy is required by virtually every lender and its amount declines as the loan
    balance is paid.
  - Both policies are in the amount of the purchase price and protect the buyer and heirs.
  - The lender's policy protects the buyer and heirs for as long as they hold title.
key: A
explanation: The lender's policy is required by virtually every lender, is issued for the loan
  amount, and decreases as the loan balance is paid. The statement that the owner's policy is
  required by virtually every lender and its amount declines as the loan balance is paid incorrectly
  describes the owner's policy.
