stem: What does the defeasance clause require the lender to do when the debt is fully paid?
options:
  - Maintain the lien until the borrower asks for a release
  - Demand the borrower pay a fee for releasing the lien
  - Release the lien or cause the trustee to reconvey title
  - Cancel the debt but keep the lien on the property
key: C
explanation: The defeasance clause requires the lender to release the lien or have the trustee
  reconvey title upon full payment, as stated in §2.4. The distractor that says the lender keeps the
  lien until the borrower requests reconveyance is incorrect because the clause imposes an automatic
  duty on the lender, not a conditional one.
