stem: What does the defeasance clause in a mortgage or deed of trust require the lender to do when
  the debt is fully paid?
options:
  - The lender must release the lien or cause the trustee to reconvey title.
  - The lender must extend the loan term for another five years.
  - The lender must increase the interest rate to market or higher.
  - The lender must require the borrower to pay a prepayment penalty.
key: A
explanation: The defeasance clause requires the lender to release the lien or, under a deed of
  trust, have the trustee reconvey title once the debt is paid, thereby giving the borrower clear
  title. The distractor about extending the loan term is incorrect because the defeasance clause
  does not alter the loan term; it only addresses lien release after payment.
