stem: Under TILA §1606(c), what is the maximum allowable tolerance for a disclosed annual percentage
  rate?
options:
  - One-eighth of 1 percent
  - One-quarter of 1 percent
  - One-half of 1 percent
  - One percent per year
key: A
explanation: Section 1606(c) states that an APR disclosure is accurate if the rate disclosed is
  within a tolerance not greater than one‑eighth of 1 percent more or less than the actual rate. The
  one‑quarter percent figure refers to rounding, not the tolerance limit.
citation:
  source: 15 U.S.C. §§ 1601–1667f (TILA) — Truth in Lending Act — § 1606(c)
  url: null
  quoted_text: The disclosure of an annual percentage rate is accurate for the purpose of this
    subchapter if the rate disclosed is within a tolerance not greater than one-eighth of 1 per
    centum more or less than the actual rate or rounded to the nearest one-fourth of 1 per centum.
