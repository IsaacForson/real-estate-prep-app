stem: Under FHA rules, what is the minimum required investment for a borrower whose decision credit
  score is 580 or above?
options:
  - 3.5% of the lesser of appraised value or price
  - 5% of the lesser of appraised value or price
  - 20% of the lesser of appraised value or price
  - 10% of the lesser of appraised value or price
key: A
explanation: FHA requires a minimum investment of 3.5% of the lesser of appraised value or price
  when the decision credit score is 580 or above. The 10% figure applies only to borrowers with
  scores from 500 to 579, making it the most tempting distractor.
