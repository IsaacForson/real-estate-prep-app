stem: What is a blanket mortgage?
options:
  - A loan that finances only the purchase of personal property
  - A loan that requires the borrower to make interest-only payments
  - A loan that is subordinate to all other liens on the property
  - A loan that covers more than one parcel under one loan
key: D
explanation: A blanket mortgage is defined as a loan covering multiple parcels under a single
  instrument, often with a partial release clause, per §5.2. The distractor describing a loan that
  finances only personal property is wrong because a blanket mortgage is secured by real property,
  not personalty.
