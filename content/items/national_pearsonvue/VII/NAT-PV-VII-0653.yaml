stem: Borrower A is 64 years old, owns the home outright, occupies it, has completed counseling, but
  has **not** paid property taxes for the past year. Borrower B is 60 years old, owns the home
  outright, occupies it, has completed counseling, and pays taxes and insurance on time. Based on
  HECM eligibility rules, which statement is correct?
options:
  - Both borrowers are eligible
  - Only Borrower B is eligible
  - Only Borrower A is eligible
  - Neither borrower is eligible
key: D
explanation: Borrowers must be 62 or older, own the home outright or nearly so, occupy it, keep
  taxes and insurance current, and complete HUD-approved counseling. Borrower A does not keep taxes
  current, and Borrower B is under 62, so neither satisfies all requirements.
