stem: When an obligor exercises the right to rescind under TILA §1635(b), what is the effect on
  finance charges and the security interest?
options:
  - The obligor remains liable for finance charges but the security interest becomes void.
  - The obligor is not liable for finance or other charges and the security interest becomes void.
  - The obligor must pay all finance charges and the security interest remains enforceable and
    subject to foreclosure.
  - The obligor is not liable for finance charges but must still pay any other charges.
key: B
explanation: Under TILA §1635(b), when an obligor exercises the right to rescind, he is not liable
  for any finance or other charge and any security interest given by the obligor becomes void.
  Therefore, the correct answer states that the obligor is not liable for finance or other charges
  and the security interest becomes void. The distractor that the obligor remains liable for finance
  charges misstates the rule because the statute explicitly removes liability for finance charges
  upon rescission.
citation:
