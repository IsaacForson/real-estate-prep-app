stem: What is the primary purpose of a subordination clause in a mortgage or deed of trust?
options:
  - The subordination clause allows a lien holder to voluntarily accept lower priority than a later
    lien
  - The subordination clause allows the lender to declare the entire unpaid balance due upon missed
    payments
  - The subordination clause allows the lender to charge a fee for paying off the loan before
    maturity
  - The subordination clause allows the lender to require the borrower to pay property taxes and
    insurance
key: A
explanation: A subordination clause lets a lien holder agree to be junior to a subsequent lien,
  altering the usual first-in-time priority. The other options describe acceleration, prepayment
  penalties, and tax covenants, which are unrelated to subordination.
