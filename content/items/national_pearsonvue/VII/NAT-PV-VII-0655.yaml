stem: Under RESPA, which of the following actions is prohibited for a lender in connection with a
  federally related mortgage loan?
options:
  - Charging a fee for preparing the title insurance commitment
  - Charging a fee for preparing the Truth-in-Lending statement
  - Charging a fee for preparing the loan application
  - Charging a fee for preparing the appraisal report
key: B
explanation: Under RESPA §2610, a lender may not impose a fee for preparing the Truth-in-Lending
  statement required by that section or the Truth in Lending Act. The correct answer reflects this
  prohibition. The distractor about charging a fee for preparing the loan application is incorrect
  because RESPA does not prohibit fees for loan application preparation; it only bans fees for
  specific statements such as the Truth-in-Lending, uniform settlement, and escrow account
  statements.
citation:
  source: 12 U.S.C. §§ 2601–2617 (RESPA) — Real Estate Settlement Procedures Act §2610
  url: null
  quoted_text: No fee shall be imposed or charge made upon any other person (as a part of settlement
    costs or otherwise) by a lender in connection with a federally related mortgage loan made by it
    (or a loan for the purchase of a mobile home), or by a servicer (as the term is defined under
    section 2605(i) of this title), for or on account of the preparation and submission by such
    lender or servicer of the statement or statements required (in connection with such loan) by
    sections 2603 and 2609(c) of this title or by the Truth in Lending Act [15 U.S.C. 1601 et seq].
