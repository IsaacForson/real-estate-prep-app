stem: Under RESPA, which of the following is included in the definition of "settlement services"?
options:
  - A pest and fungus inspection performed before closing
  - A general home warranty purchased after closing
  - A moving company's fee for relocating the buyer
  - A contractor's estimate for post-closing renovations
key: A
explanation: Section 2602(3) defines settlement services to include, among other things, pest and
  fungus inspections, title services, appraisals, and loan origination. Moving services,
  post-closing warranties, and renovation estimates are not services provided in connection with the
  settlement itself.
citation:
  source: 12 U.S.C. § 2602(3)
  url: null
  quoted_text: 'the term "Settlement services" includes any service provided in connection with a real
    estate settlement including, but not limited to, the following: title searches, title
    examinations, the provision of title certificates, title insurance'
