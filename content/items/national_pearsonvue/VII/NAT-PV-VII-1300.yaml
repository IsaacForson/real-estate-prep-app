stem: If the purchase agreement states that the buyer will pay for the lender's title policy, is
  this permissible under the rule described in the text?
options:
  - Yes, because who pays for each varies by state and contract.
  - No, because the seller is responsible for paying the lender's title policy.
  - Yes, but this is permitted for FHA-insured loans.
  - No, because the lender pays for its own title policy.
key: A
explanation: Who pays for each policy varies by state and contract, so a purchase agreement
  assigning the cost to the buyer is permissible. The distractor claiming the seller must always pay
  is incorrect because payment responsibility is not fixed and can be allocated by agreement.
