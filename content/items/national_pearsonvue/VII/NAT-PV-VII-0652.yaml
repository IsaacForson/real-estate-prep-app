stem: A 65-year-old homeowner wishes to obtain an FHA-insured Home Equity Conversion Mortgage
  (HECM). The homeowner owns the property outright, lives in it as a principal residence, and has
  completed HUD-approved counseling. However, the homeowner has let the homeowner's insurance lapse
  for the past three months. Based on HECM eligibility rules, which statement is correct?
options:
  - The homeowner is ineligible because they must have a mortgage balance
  - The homeowner is eligible because age and counseling are satisfied
  - The homeowner is eligible because insurance lapse does not affect HECM eligibility
  - The homeowner is ineligible because taxes and insurance must be current
key: D
explanation: HECM borrowers must keep taxes and insurance current; a lapse in insurance makes the
  borrower ineligible even if age, ownership, and counseling requirements are met.
