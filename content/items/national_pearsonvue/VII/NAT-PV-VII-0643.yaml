stem: Compared to a lien-theory mortgage, what procedural advantage does a title-theory deed of
  trust typically offer?
options:
  - The procedure allows faster non-judicial foreclosure
  - The procedure requires judicial foreclosure
  - The procedure permits deficiency judgments against the borrower
  - The procedure extends the statutory redemption period
key: A
explanation: In a title‑theory or deed‑of‑trust arrangement, the lender can foreclose without going
  to court, which is usually quicker than the judicial foreclosure required for a lien‑theory
  mortgage. This speed is the procedural advantage; the other statements are incorrect.
