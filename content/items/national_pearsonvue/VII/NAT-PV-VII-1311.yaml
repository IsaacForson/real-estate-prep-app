stem: A borrower fails to pay property taxes for two consecutive quarters. According to the
  acceleration clause in the mortgage, what action may the lender take?
options:
  - The lender may automatically extend the loan term by five years.
  - The lender may impose a prepayment penalty for early payoff.
  - The lender may declare the entire unpaid balance due immediately.
  - The lender may require the borrower to refinance the loan within 30 days.
key: C
explanation: The acceleration clause allows the lender to declare the entire balance due when the
  borrower defaults on obligations such as unpaid property taxes. The distractor about imposing a
  prepayment penalty is incorrect because a prepayment penalty applies to early payoff by the
  borrower, not to a lender’s remedy for tax default.
citation:
