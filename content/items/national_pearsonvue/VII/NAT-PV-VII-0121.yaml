stem: Under the Truth in Lending Act, which transaction is a 'residential mortgage transaction'?
options:
  - A loan secured by the consumer's dwelling to consolidate existing unsecured debts
  - A home equity line of credit secured by a dwelling the consumer already owns
  - A loan to purchase a five-unit apartment building as an investment
  - A loan secured by the consumer's dwelling to finance its acquisition or initial construction
key: D
explanation: Section 1602(x) defines a residential mortgage transaction as one in which a security
  interest is created or retained against the consumer's dwelling 'to finance the acquisition or
  initial construction of such dwelling.' Debt consolidation and equity-line loans do not finance
  acquisition or initial construction, and 'dwelling' is limited to one-to-four family structures.
