stem: A developer finances a subdivision with a blanket loan that includes a partial release clause.
  After selling one lot and receiving the stipulated payment, what is the status of that lot?
options:
  - The lot remains encumbered by the blanket loan
  - The lot is released while the rest stays encumbered
  - The lot becomes subject to a new separate loan
  - The lot is automatically transferred to the lender
key: B
explanation: Under a blanket loan with a partial release clause, paying the stipulated amount for a
  sold lot releases that lot from the lien while the remaining parcels stay encumbered. The
  distractor claiming the lot remains encumbered ignores the effect of the partial release clause
  upon payment.
