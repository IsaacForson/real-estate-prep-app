stem: Under the TCPA, what information must a telephone facsimile machine manufactured after one
  year after December 20, 1991 clearly mark on each transmitted page or on the first page of each
  transmission?
options:
  - The date and time sent, the sender's identification, and the telephone number of the sending
    machine
  - The date and time sent, the sender's business name, and the telephone number of the receiving
    machine
  - The date and time sent, the sender's identification, and the telephone number of the receiving
    machine
  - The date and time sent, the sender's business name, and the telephone number of the sending
    machine
key: A
explanation: The TCPA requires that facsimile machines manufactured after the specified date clearly
  mark the date and time sent, the sender's identification, and the telephone number of the sending
  machine on each page. The alternative that lists the receiving machine's telephone number instead
  of the sender's is incorrect because the rule does not require that.
