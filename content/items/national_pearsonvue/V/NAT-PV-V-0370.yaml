stem: A property manager notices a strong gas smell in a residential building. According to risk
  management guidelines, how should the manager classify this situation?
options:
  - As corrective (routine) maintenance that can be scheduled for the next business day.
  - As preventive maintenance requiring scheduled servicing.
  - As cosmetic or make-ready maintenance to be performed between tenants.
  - As emergency maintenance that must be addressed immediately due to danger.
key: D
explanation: Emergency maintenance includes repairs that cannot wait due to danger or ongoing
  damage, exemplified by a gas smell. The distractor labeling the situation as preventive
  maintenance is incorrect because preventive maintenance is scheduled servicing to avoid
  breakdowns, not an immediate hazard.
