stem: A broker receives a complaint that a licensee's advertisement includes the phrase 'ideal for
  young families.' According to supervision duties, what should the broker do first?
options:
  - The broker reviews the advertisement for fair housing compliance
  - The broker terminates the licensee's affiliation immediately
  - The broker advises the licensee to keep the advertisement
  - The broker dismisses the complaint as unrelated to supervision
key: A
explanation: Supervision duties include reviewing advertising to ensure compliance with fair housing
  law, so the broker must first examine the disputed advertisement. Ignoring the complaint is
  incorrect because supervision applies regardless of the licensee’s tax status, and terminating the
  licensee or advising continuation would be premature without review.
