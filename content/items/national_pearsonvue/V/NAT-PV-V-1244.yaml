stem: "A seller refuses to sell a house to a Black buyer because of the buyer's race. Under 42
  U.S.C. § 1982, the seller's refusal is:"
options:
  - The seller's refusal based on race is impermissible because the statute guarantees all citizens
    the right to purchase real property
  - The seller's refusal based on race is impermissible because the statute requires sellers to
    offer discounts to minority buyers
  - The seller's refusal based on race is permissible because the statute only applies to federal
    housing programs in housing transactions
  - The seller's refusal based on race is permissible because the statute protects only white
    citizens in housing transactions
key: A
explanation: The statute guarantees all citizens the same right as white citizens to purchase real
  property, so a refusal to sell based on race violates that guarantee. The claim that the statute
  only applies to federal housing programs is incorrect; it protects the property rights of all
  citizens regardless of federal involvement.
