stem: A broker receives an earnest money deposit from a buyer. Where must these funds be held?
options:
  - In the firm's operating account if the funds are withdrawn at closing
  - In the buyer's attorney's investment account until the closing statement is prepared
  - In a designated trust or escrow account separate from the firm's operating funds
  - In the broker's personal account until the transaction closes
key: C
explanation: Money a brokerage receives that belongs to others, including earnest money, is trust
  money and must be held in a designated trust or escrow account separate from the firm's operating
  funds. Depositing it into the operating account would be commingling, which is grounds for
  discipline.
