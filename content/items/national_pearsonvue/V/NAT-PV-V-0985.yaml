stem: "A loan officer at a bank denies a mortgage application from an applicant because the
  applicant is of a particular national origin. The loan in question is insured by the Federal
  Housing Administration. Under Executive Order 11063, the loan officer's action is:"
options:
  - The action is permissible because the decision is based on creditworthiness
  - The action is permissible because the applicant can seek other financing
  - The action is prohibited only if the loan is for a multifamily property
  - The action is prohibited because it discriminates based on national origin
key: D
explanation: Because the loan is federally insured, the order prohibits discrimination in lending
  based on national origin. Denying the loan for that reason is therefore prohibited. The action is
  not permissible merely because the applicant could seek other financing.
