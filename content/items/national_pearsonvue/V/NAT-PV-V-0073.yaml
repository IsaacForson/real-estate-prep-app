stem: Which type of listing agreement allows the seller to sell the property personally without
  owing a commission, while still owing a commission if any broker produces the buyer?
options:
  - Exclusive agency listing
  - Open listing
  - Net listing
  - Exclusive right to sell listing
key: A
explanation: Under an exclusive agency listing the seller owes a commission if the broker or any
  other broker sells the property, but retains the right to sell personally without paying. An
  exclusive right to sell is the tempting distractor, but under it the seller owes the commission
  regardless of who procures the buyer, including the seller.
