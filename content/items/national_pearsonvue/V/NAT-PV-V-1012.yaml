stem: Under the Sherman Act, which of the following describes a per se illegal price‑fixing
  agreement between brokers from different firms?
options:
  - Sharing marketing costs for a joint open house
  - Agreeing not to accept listings below a certain commission percentage
  - Referring clients to each other without discussing fees
  - Setting the same commission rate independently after reviewing market data
key: B
explanation: The Sherman Act prohibits competitors from agreeing on commission rates; an agreement
  not to accept listings below a set percentage is a per se illegal price‑fixing arrangement.
  Independent rate setting is lawful.
citation:
  source: REP Ref. Brokerage Practice § 5.2
  url: null
  quoted_text: An agreement among competitors to set, raise, or stabilize the price of their services.
    In brokerage this means any agreement among brokers from *different* firms about commission
    rates, minimum fees, or the amount offered to cooperating brokers.
