stem: Under 42 U.S.C. § 1982, which of the following rights is guaranteed to all citizens?
options:
  - To inherit real property rights
  - To receive federal aid for housing
  - To be exempt from property taxes
  - To obtain a real estate license
key: A
explanation: The statute guarantees all citizens the same right as white citizens to inherit,
  purchase, lease, sell, hold, and convey real and personal property, so inheriting real property is
  a protected right. Receiving federal aid for housing is not mentioned in the statute and therefore
  is not a guaranteed right under this provision.
