stem: According to the Sherman Act distinction between price fixing and a firm's own policy, which
  statement is correct?
options:
  - An agreement among competing brokers to set the same commission rate is permissible under
    antitrust law.
  - A single brokerage may establish its own commission rates without violating antitrust law.
  - Both agreements among competitors and unilateral rate-setting are prohibited by the Sherman Act.
  - Written agreements between competitors are illegal, while verbal agreements are permitted.
key: B
explanation: An agreement among competing firms to fix prices is illegal, while a single firm may
  set its own rates without violating antitrust law. Therefore, a brokerage may establish its own
  commission rates lawfully. The statement that competing brokers may agree on the same commission
  rate is incorrect because such an agreement constitutes illegal price fixing.
