stem: Which action would constitute the unauthorized practice of law for a licensed real estate agent?
options:
  - Drafting a custom clause for a purchase contract
  - Explaining the general steps of the closing process
  - Sharing a list of local schools with a buyer
  - Filling in the blanks on a standard purchase agreement
key: A
explanation: Licensees may not draft original contract language; drafting a custom clause for a
  purchase contract is prohibited. Filling in the blanks on a standard form is permitted as
  incidental to brokerage service. Explaining closing steps and sharing school lists are permissible
  informational activities.
citation:
  source: "REP Ref. Brokerage Practice — Reference note: brokerage practice, listings, compensation,
    supervision, risk, property management (authored, status: draft — needs licensed review) § 1.2"
  url: null
  quoted_text: Licensees may **not** draft original contract language, create deeds, mortgages, or
    leases from scratch (except where a standard lease form is expressly permitted), give legal
    advice about the meaning or effect of a document, advise how to take title, or interpret how a
    law applies to a client's situation.
