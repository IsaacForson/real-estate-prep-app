stem: A broker has an oral agreement with licensees stating they are independent contractors for tax
  purposes, pays them only commission splits, and they are licensed. Under the federal statutory
  safe harbor for licensed real estate agents, can the broker treat the licensees as independent
  contractors for federal tax purposes?
options:
  - Yes, as long as the broker does not withhold income tax from the commissions.
  - No, because the licensees must also receive a hourly wage to qualify.
  - Yes, because the licensees are paid only on commission and hold a real estate license.
  - No, because the oral agreement fails the written contract requirement of the safe harbor.
key: D
explanation: The safe harbor requires three conditions, including that services be performed under a
  written contract stating the individual will not be treated as an employee for federal tax
  purposes. An oral agreement does not satisfy this condition, so the broker cannot treat the
  licensees as independent contractors under the federal safe harbor. The other options incorrectly
  focus on compensation or tax withholding alone, which are insufficient without the written
  contract.
