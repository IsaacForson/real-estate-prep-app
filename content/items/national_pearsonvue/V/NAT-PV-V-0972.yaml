stem: Which courts have exclusive jurisdiction over civil actions brought under the TCPA?
options:
  - The international tribunals
  - The state trial courts
  - The federal district courts
  - The local municipal courts
key: C
explanation: The TCPA provides that district courts of the United States, territorial courts, and
  the District Court for the District of Columbia have exclusive jurisdiction over TCPA civil
  actions, so the federal district courts are correct. State trial courts lack this exclusive
  jurisdiction under the statute.
