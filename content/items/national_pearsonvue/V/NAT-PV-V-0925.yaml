stem: Which of the following is typically included in the scope of authority under a property
  management agreement?
options:
  - Determining the property's market value for sale
  - Setting the owner's personal investment strategy
  - Choosing the interior paint color for tenant units
  - Establishing spending limits for repairs and maintenance
key: D
explanation: The scope of authority in a property management agreement emphasizes spending limits,
  leasing parameters, and authority to evict, as the owner is bound by the manager's acts within
  those limits. Establishing spending limits for repairs is a typical component.
