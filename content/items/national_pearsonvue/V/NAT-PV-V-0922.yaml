stem: Under the federal statutory safe harbor for licensed real estate agents, what must be true
  about a licensee's compensation to qualify as a statutory non-employee?
options:
  - It must be based on commissions or other sales output
  - It must be based on a fixed salary or hourly wage
  - It must be based on reimbursement for expenses
  - It must be based on weekly payment regardless of production
key: A
explanation: The safe harbor requires that substantially all of the agent's compensation be directly
  related to sales or other output, not to hours worked. This ensures the agent is treated as a
  non-employee for tax purposes. The distractor suggesting salary or hourly pay is wrong because
  such compensation ties payment to hours, violating the safe harbor.
