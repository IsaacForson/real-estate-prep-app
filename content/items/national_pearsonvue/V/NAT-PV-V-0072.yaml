stem: "A seller signs a listing agreement with a brokerage. The salesperson who obtained the listing
  later leaves the firm to join a competing brokerage. Under the general rules governing listing
  agreements, the listing:"
options:
  - Stays with the original broker as a contract with the firm
  - Converts to an open listing for its remaining term
  - Transfers to the salesperson's new brokerage automatically
  - Terminates because the salesperson changed employers
key: A
explanation: A listing is a personal service contract with the broker, not the individual
  salesperson, so it remains with the firm when the salesperson departs. Termination on a
  salesperson's departure is a tempting distractor, but a salesperson's move is not among the
  recognized ways a listing ends.
citation:
  source: REP Ref. Brokerage Practice § 2.1
  url: null
  quoted_text: It is a personal service contract with the *broker*, not the individual salesperson; if
    the salesperson leaves the firm, the listing stays with the broker.
