stem: Under the federal statutory safe harbor, a licensed real estate agent is treated as a
  statutory non-employee for federal tax purposes when which set of conditions is met?
options:
  - Licensed, paid substantially all compensation based on sales output, and working under a written
    contract stating the agent is not an employee
  - Licensed, paid a base salary plus commissions on sales, and working under a written contract
    stating the agent is not an employee
  - Licensed, reimbursed for business expenses and paid commission splits, and working under a
    written contract stating the agent is not an employee
  - Licensed, paid hourly wages plus a small bonus per closing, and working under a written contract
    stating the agent is not an employee
key: A
explanation: "The safe harbor requires all three conditions: a licensed agent, substantially all
  compensation directly related to sales or other output rather than hours worked, and a written
  contract providing the individual will not be treated as an employee for federal tax purposes.
  Salaries, hourly wages, and reimbursed expenses are conduct inconsistent with independent
  contractor status."
citation:
