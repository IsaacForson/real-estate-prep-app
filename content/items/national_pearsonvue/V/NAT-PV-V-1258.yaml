stem: Under federal tax rules, what effect does classifying a salesperson as an independent
  contractor have on the broker's duty to supervise?
options:
  - It transfers the supervisory duty from the broker to the salesperson.
  - It reduces but does not remove the broker's obligation to supervise the salesperson.
  - It eliminates the broker's responsibility to oversee the salesperson's activities.
  - It has no effect; the broker remains responsible for supervising the salesperson.
key: D
explanation: Tax status never relieves the broker of the duty to supervise, so classifying a
  salesperson as an independent contractor does not change that responsibility. The statement that
  the broker's duty is reduced is incorrect.
