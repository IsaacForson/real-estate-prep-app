stem: Under the Sherman Antitrust Act, which of the following statements correctly describes the
  term 'commerce'?
options:
  - The term 'commerce' means conduct that is limited to the District of Columbia alone, with no
    connection to any state, territory, foreign nation, or other jurisdiction under United States
    authority.
  - The term 'commerce' means trade or commerce among the several States and with foreign nations,
    or between the District of Columbia or any Territory and any State
  - The term 'commerce' means trade or commerce that occurs only within a single state's boundaries,
    with no involvement of interstate movement, foreign nations, the District of Columbia, or any
    Territory.
  - The term 'commerce' means activities confined to the buying and selling of real estate,
    excluding any transactions involving personal property, services, or intangible assets.
key: B
explanation: The definition provided in the statute says that ‘commerce’ means trade or commerce
  among the several States and with foreign nations, among other interstate forms. Limiting commerce
  to intrastate transactions contradicts this language, so that option is incorrect.
