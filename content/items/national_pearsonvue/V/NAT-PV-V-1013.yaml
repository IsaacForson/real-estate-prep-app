stem: Which statement about referral fees between licensed brokers is correct under RESPA?
options:
  - Referral fees must flow from broker to broker and cannot be paid to an unlicensed person.
  - Referral fees may be paid directly to an unlicensed assistant who brings the client.
  - Referral fees are allowed only when the referring broker is also the lender.
  - Referral fees are prohibited unless disclosed on the HUD‑1 settlement statement.
key: A
explanation: RESPA permits referral fees only between licensed brokers and prohibits paying anything
  of value to an unlicensed person for referrals. The fee must flow broker to broker.
citation:
  source: REP Ref. Brokerage Practice § 4.4
  url: null
