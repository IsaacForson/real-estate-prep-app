stem: What is the primary purpose of a protection (extender) clause in a listing agreement?
options:
  - The purpose of preventing a seller and buyer from waiting out the listing to avoid the commission
  - The purpose of requiring the broker to refund the earnest money if the sale fails to close
  - The purpose of automatically extending the listing agreement unless terminated by either party
  - The purpose of permitting the broker to charge an additional marketing fee beyond the agreed
    commission
key: A
explanation: A protection (extender) clause gives the broker a right to commission when the seller
  sells to a buyer the broker introduced during the listing term or within a specified period after
  the listing ends, and its purpose is to stop the seller and buyer from waiting out the listing to
  avoid paying the commission.
