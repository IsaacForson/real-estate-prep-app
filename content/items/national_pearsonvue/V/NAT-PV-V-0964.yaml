stem: If a licensee continues to violate a final cease and desist order issued under the Sherman
  Antitrust Act for three consecutive days, how many separate offenses are considered under §21(l)?
options:
  - Two offenses
  - One offense
  - Four violations
  - Three offenses
key: D
explanation: Section 21(l) states that each day of continuance of failure to obey a final order is
  deemed a separate offense. Thus three days of continuing violation constitute three separate
  offenses.
