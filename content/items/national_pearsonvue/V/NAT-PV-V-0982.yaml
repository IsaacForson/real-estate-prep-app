stem: Under Executive Order 11063, which type of residential property is subject to the
  nondiscrimination requirement?
options:
  - Property situated outside the United States territories and possessions
  - Property provided in whole or in part with the aid of a Federal grant
  - Property used exclusively for commercial business activities
  - Property owned by a private individual with no Federal assistance
key: B
explanation: The order applies to residential property provided in whole or in part with the aid of
  Federal loans, advances, grants, or contributions. Therefore, property receiving a Federal grant
  is covered. Property owned by a private individual with no Federal assistance is not covered
  because the order only reaches property with Federal involvement.
