stem: A 24-unit apartment building rents for $950 per unit per month. Vacancy and collection loss is
  5% of potential gross income, and other income is $3,000 per year. If the management fee is 6% of
  collected rent, what is the annual management fee?
options:
  - $12,996.00
  - $15,595.20
  - $15,775.20
  - $16,416.00
key: B
explanation: "First calculate potential gross income: 24 × $950 × 12 = $273,600. Vacancy loss at 5%
  equals $13,680, so collected rent is $259,920. The management fee is 6% of collected rent: 0.06 ×
  $259,920 = $15,595.20. The distractors result from using the wrong base (potential gross income,
  effective gross income) or an incorrect percentage."
