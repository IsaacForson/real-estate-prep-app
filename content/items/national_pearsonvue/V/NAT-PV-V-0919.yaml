math:
  worked_solution: |-
    Potential gross income = 24 units × $950/month × 12 months = $273,600
    Vacancy and collection loss = 5% × $273,600 = $13,680
    Collected rent = $273,600 − $13,680 = $259,920
    Management fee = 6% × $259,920 = $15,595.20
