stem: Under Executive Order 11063, each executive department and agency is primarily responsible for
  obtaining compliance with the purposes of the order as it applies to which of the following?
options:
  - Programs for all federal housing nationwide
  - Programs receiving Federal aid only
  - Programs administered by it
  - Programs related to urban renewal projects
key: C
explanation: Section 202 states that each department and agency shall be primarily responsible for
  obtaining compliance as the order applies to programs administered by it. The distractor about
  programs receiving Federal aid only is incorrect because responsibility extends to all programs
  the agency administers, not just those aided.
