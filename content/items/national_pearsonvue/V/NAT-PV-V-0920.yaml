stem: When a licensed real estate agent qualifies as a statutory non-employee under the federal
  statutory safe harbor, who is responsible for paying the agent's self-employment tax?
options:
  - The broker
  - The client
  - The agent
  - The state
key: C
explanation: Under the federal statutory safe harbor, when all three conditions are met, the broker
  does not withhold income tax or pay the employer share of employment taxes, and the agent is
  responsible for self-employment tax and quarterly estimated payments. Therefore, the agent must
  pay the self-employment tax. The distractor 'The broker' is incorrect because the broker is
  relieved of paying the employer share of employment taxes under the safe harbor.
