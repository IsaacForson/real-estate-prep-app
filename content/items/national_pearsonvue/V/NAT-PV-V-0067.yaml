stem: A broker who takes his commission out of the trust account before the closing at which it is
  earned has committed which violation?
options:
  - Lawful commingling of funds
  - Permitted advance against earnings
  - Negligent record keeping
  - Conversion of trust funds
key: D
explanation: The commission portion of a closing disbursement becomes the broker's money only when
  it is earned and disbursed under the closing statement; advancing the commission to himself from
  the trust account before closing is conversion, which is theft. Commingling is mixing trust money
  with the broker's own funds, a different violation.
