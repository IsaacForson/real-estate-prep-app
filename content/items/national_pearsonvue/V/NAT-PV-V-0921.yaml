stem: What responsibility does a broker retain toward salespersons even if they are classified as
  independent contractors for federal tax purposes?
options:
  - To pay unemployment insurance on their wages
  - To provide health insurance benefits
  - To withhold federal income tax from their pay
  - To supervise their brokerage activities
key: D
explanation: Under the federal tax safe harbor, classifying a salesperson as an independent
  contractor does not relieve the broker of the duty to supervise brokerage activities under state
  license law. The broker remains responsible for oversight regardless of tax status. The distractor
  about withholding federal income tax is incorrect because brokers do not withhold taxes for
  independent contractors; that responsibility falls on the agent.
citation:
  source: REP Ref. Brokerage Practice § 6.1
  url: null
  quoted_text: "It does **not** affect the broker's duty under state license law to supervise the
    salesperson (§ 7): a broker cannot avoid supervisory responsibility by calling a licensee an
    independent contractor."
