stem: A broker deposits earnest money received from a buyer into the firm's operating account to
  cover office expenses. Which violation does this represent under trust account rules?
options:
  - The action constitutes commingling of trust funds
  - The action constitutes conversion of trust funds
  - The action constitutes both commingling and conversion
  - The action constitutes neither commingling nor conversion
key: A
explanation: Commingling occurs when trust money is mixed with the broker's own funds, such as
  depositing earnest money into the operating account. Conversion involves using trust money for an
  unauthorized purpose; here the money is merely deposited incorrectly, not yet used for another
  purpose, so it is commingling only.
