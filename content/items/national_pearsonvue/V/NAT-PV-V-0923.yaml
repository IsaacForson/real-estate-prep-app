stem: A broker reimburses licensees for advertising expenses they incur while working on listings.
  Under the federal statutory safe harbor for licensed real estate agents, can the broker treat the
  licensees as independent contractors for federal tax purposes?
options:
  - The broker can treat the licensees as independent contractors because reimbursing expenses is
    permitted
  - The broker cannot treat the licensees as independent contractors because reimbursing expenses is
    inconsistent with the safe harbor
  - The broker can treat the licensees as independent contractors if the reimbursement is less than
    10% of commissions
  - The broker cannot treat the licensees as independent contractors unless a written contract
    states otherwise
key: B
explanation: The safe harbor explicitly states that brokers who wish to preserve independent
  contractor status should avoid reimbursing expenses, as such conduct is inconsistent with the
  status. Reimbursing expenses therefore jeopardizes the broker’s ability to treat licensees as
  independent contractors. The distractor claiming reimbursement is permitted is incorrect because
  the rule prohibits it to maintain the safe harbor.
citation:
