stem: "A tenant who uses a wheelchair asks her landlord for permission to install, entirely at her
  own expense, a ramp and widened doorway inside her rented unit. The landlord refuses permission
  outright. Under the Fair Housing Act, the landlord's refusal is:"
options:
  - Unlawful, because refusing to permit reasonable modifications at the tenant's expense is
    discrimination
  - Lawful, because modification rules apply only to newly constructed multifamily dwellings
  - Unlawful, because the landlord must pay for modifications needed by a handicapped tenant
  - Lawful, because landlords may control all alterations to the interior of their rental units
key: A
explanation: Section 3604(f)(3)(A) provides that discrimination includes refusing to permit, at the
  handicapped person's expense, reasonable modifications of existing premises necessary for full
  enjoyment; a landlord may only condition permission on the tenant agreeing to restore the interior
  where reasonable. The landlord may not refuse outright, and the statute places the cost on the
  tenant, not the landlord.
