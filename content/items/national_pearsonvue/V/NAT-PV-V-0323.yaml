stem: A broker pays a salesperson a fixed hourly wage for office work in addition to commission on
  sales. Under the federal statutory safe harbor for licensed real estate agents, can the broker
  treat the salesperson as an independent contractor for federal tax purposes?
options:
  - The broker may not treat the salesperson as an independent contractor unless the worker also
    receives reimbursed expenses
  - The broker may treat the salesperson as an independent contractor because the worker holds a
    license
  - The broker may treat the salesperson as an independent contractor if the worker signs a written
    independent contractor agreement
  - The broker may not treat the salesperson as an independent contractor because compensation must
    be tied to sales, not hours worked
key: D
explanation: The safe harbor requires that substantially all compensation be directly related to
  sales or other output, not to hours worked. Paying an hourly wage violates this condition, so the
  broker cannot rely on the safe harbor. The other options either misstate the conditions or add
  irrelevant factors.
