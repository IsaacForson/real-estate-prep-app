stem: Under the Fair Housing Act, a housing community qualifies as "housing for older persons" under
  the 55-or-older category when it meets which occupancy condition?
options:
  - Every occupied unit is occupied exclusively by persons who are 62 years of age or older
  - At least 80 percent of all units, occupied or vacant, are reserved for persons 62 years of age
    or older
  - At least 50 percent of occupied units have at least one occupant who is 55 years of age or older
  - At least 80 percent of occupied units have at least one occupant who is 55 years of age or older
key: D
explanation: Section 3607(b)(2)(C)(i) requires that at least 80 percent of the occupied units be
  occupied by at least one person who is 55 or older, along with published policies and verification
  compliance. The 62-or-older category is a separate basis under subparagraph (B), and the 80
  percent test applies to occupied units, not all units.
