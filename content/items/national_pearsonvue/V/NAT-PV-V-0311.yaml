stem: When a client asks a licensee for legal advice about the effect of a contract clause, what is
  the appropriate action?
options:
  - Explaining the general purpose of the clause
  - Recommending that the client consult an attorney
  - Drafting a revised clause to address the concern
  - Providing an interpretation based on common practice
key: B
explanation: When a client asks for legal advice about a contract clause, the licensee should not
  interpret the clause or draft new language; instead, the licensee must recommend that the client
  consult an attorney. Explaining the general purpose of the clause is permissible as general
  information, but it does not satisfy the request for legal advice about the clause's effect.
