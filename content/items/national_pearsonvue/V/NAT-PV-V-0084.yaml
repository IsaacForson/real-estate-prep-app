stem: Under the Fair Housing Act, which condition is expressly excluded from the definition of
  "handicap"?
options:
  - Current, illegal use of or addiction to a controlled substance
  - Being regarded by others as having a mental impairment
  - A record of having a physical impairment that limits a major life activity
  - A physical impairment that substantially limits a major life activity
key: A
explanation: Section 3602(h) defines handicap to include a physical or mental impairment
  substantially limiting a major life activity, a record of such impairment, or being regarded as
  having one, but expressly states the term does not include current, illegal use of or addiction to
  a controlled substance. The other three options are the three prongs of the statutory definition.
