stem: A state attorney general files a TCPA civil action against a telemarketer. What right does the
  Commission have under the TCPA regarding this action?
options:
  - To intervene in the state action
  - To issue a cease‑and‑desist order
  - To dismiss the case in federal court
  - To award damages to the plaintiffs
key: A
explanation: Under the TCPA, the Commission shall have the right to intervene in any state‑brought
  civil action, to be heard on all matters upon intervening, and to file petitions for appeal.
  Therefore, the Commission may intervene in the state action. Awarding damages, issuing orders, or
  dismissing the case are not rights granted to the Commission by this provision.
