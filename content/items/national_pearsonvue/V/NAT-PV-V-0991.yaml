stem: Under the Sherman Antitrust Act enforcement provisions, which entity is authorized to enforce
  compliance with sections 13, 14, 18, and 19 for all other character of commerce?
options:
  - Secretary of Transportation
  - Federal Communications Commission
  - Surface Transportation Board
  - Federal Trade Commission
key: D
explanation: The statute vests enforcement authority in the Federal Trade Commission for all other
  character of commerce. Therefore, the FTC is the correct entity. The Surface Transportation Board
  only handles common carriers under subtitle IV of title 49, not all other commerce.
