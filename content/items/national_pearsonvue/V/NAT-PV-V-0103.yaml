stem: Under the Fair Housing Act, after a complaint is filed, the Secretary of Housing and Urban
  Development must complete the investigation of the alleged discriminatory housing practice within
  what time frame, unless it is impracticable to do so?
options:
  - Within 30 days after the filing of the complaint
  - Within 100 days after the filing of the complaint
  - Within 60 days after the filing of the complaint
  - Within 180 days after the filing of the complaint
key: B
explanation: Section 3610(a)(1)(B)(iv) requires the Secretary to complete the investigation within
  100 days after the filing of the complaint, unless it is impracticable to do so, in which case the
  Secretary must notify the parties in writing of the reasons. The 10-day period in the same
  subsection concerns serving notice on the respondent, not completing the investigation.
citation:
