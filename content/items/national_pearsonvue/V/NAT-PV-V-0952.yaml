stem: Under Executive Order 11063, Section 101(b) applies to lending practices related to which type
  of loans?
options:
  - Loans originated or serviced by the Federal Government
  - Loans insured or guaranteed by the Federal Government
  - Loans made or purchased by the Federal Government
  - Loans refinanced or modified by the Federal Government
key: B
explanation: Section 101(b) explicitly covers lending practices related to loans insured or
  guaranteed by the Federal Government. The distractor about loans made exclusively by private
  lenders is incorrect because the provision applies only when federal backing is involved.
