stem: Under the federal statutory safe harbor for licensed real estate agents, which of the
  following is a required condition for the agent to be treated as a statutory non-employee for
  federal tax purposes?
options:
  - The agent must hold a valid real estate license.
  - The agent must be paid a salary or hourly wage for services rendered.
  - The agent must work a set number of hours each week as specified by the broker.
  - The agent must receive reimbursement for all business expenses incurred.
key: A
explanation: The safe harbor requires the individual to be a licensed real estate agent. An option
  stating the agent is paid a salary or hourly wage is incorrect because the safe harbor requires
  that substantially all compensation be directly related to sales or output, not to a salary or
  hourly wage.
