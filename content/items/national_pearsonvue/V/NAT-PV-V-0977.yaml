stem: Which of the following is a requirement for the federal statutory safe harbor that treats a
  licensed real estate agent as a statutory non-employee for federal tax purposes?
options:
  - The agent must receive expense reimbursements
  - The agent must work set hours
  - The agent must be a licensed real estate agent
  - The agent must be paid a salary
key: C
explanation: The safe harbor applies only when the individual is a licensed real estate agent, among
  other conditions. Being paid a salary, working set hours, or receiving expense reimbursements
  would indicate employee status and disqualify the agent from the safe harbor.
