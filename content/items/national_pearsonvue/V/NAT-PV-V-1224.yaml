stem: Which statement correctly describes the authority of a salesperson?
options:
  - A salesperson may independently operate a brokerage and employ other licensees.
  - A salesperson may perform brokerage acts only under a sponsoring broker and may be compensated
    only by that broker.
  - A salesperson may draft original contract language for a purchase agreement.
  - A salesperson may receive compensation directly from a client for a completed transaction.
key: B
explanation: The rule requires that a salesperson can only perform brokerage activities while
  affiliated with a sponsoring broker and can receive compensation solely from that broker.
  Therefore, the statement that a salesperson may perform brokerage acts only under a sponsoring
  broker and may be compensated only by that broker is correct. The other statements are incorrect
  because a salesperson cannot independently operate a brokerage or employ other licensees, cannot
  draft original contract language for a purchase agreement, and cannot receive compensation
  directly from a client.
