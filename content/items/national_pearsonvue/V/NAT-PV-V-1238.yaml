stem: Which of the following acts is within the scope of activities that a real estate license
  authorizes the holder to perform for compensation on behalf of others?
options:
  - Negotiating a lease agreement
  - Preparing a purchase agreement
  - Conducting a property showing
  - Drafting a client contract
key: A
explanation: The statute lists negotiating as an authorized brokerage act that a license holder may
  perform for compensation. Preparing a purchase agreement is not listed as an authorized act;
  providing such services could constitute the unauthorized practice of law if it involves drafting
  original contract language.
citation:
  source: REP Ref. Brokerage Practice § 1.1
  url: null
  quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
    to perform the acts state law defines as brokerage: listing, selling, buying, exchanging,
    leasing, renting, managing, negotiating, advertising, and offering to do any of these with
    respect to real property."
