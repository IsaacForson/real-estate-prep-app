stem: Under an exclusive buyer representation agreement, if the buyer purchases a property without
  the broker's involvement, is compensation owed?
options:
  - Compensation is owed only if the broker found the property
  - Compensation is owed only if the buyer signed a separate agreement
  - Compensation is owed because the buyer purchased a covered property during the term
  - Compensation is not owed unless the property is within the geographic area
key: C
explanation: An exclusive buyer agreement obligates the buyer to pay compensation if they purchase
  any covered property during the term, regardless of who found the property. The distractor that
  compensation is owed only if the broker found the property misstates the rule, as the agreement
  does not require the broker's involvement.
citation:
