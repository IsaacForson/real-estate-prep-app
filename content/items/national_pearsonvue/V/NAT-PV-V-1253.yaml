stem: Under the TCPA, what is the maximum civil forfeiture penalty a person may be liable for each
  violation of the prohibition on transmitting misleading caller identification information?
options:
  - A civil forfeiture penalty of $10,000 per violation
  - A civil forfeiture penalty of $500 per violation
  - A civil forfeiture penalty of $1,000 per violation
  - A civil forfeiture penalty of $100,000 per violation
key: A
explanation: The TCPA limits civil forfeiture penalties to $10,000 per violation under subsection
  (e)(5)(A)(i). The $500 amount refers to the private right of action damages, not the civil
  forfeiture penalty.
