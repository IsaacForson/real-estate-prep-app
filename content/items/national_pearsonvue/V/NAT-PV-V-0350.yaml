stem: A real estate school offers its licensing exam preparation course only in a second-floor
  classroom with no elevator. The school also provides the same course via live webinar with
  captioning. Is the school in compliance with ADA Title III regarding examinations and courses?
options:
  - Yes, but only if the webinar is also offered in a physically accessible location
  - No, because the course must be offered in a physically accessible location
  - Yes, because providing an alternative accessible arrangement satisfies the requirement
  - No, because alternative arrangements are not permitted for examination courses
key: C
explanation: The statute requires that examinations or courses be offered in an accessible manner or
  that alternative accessible arrangements be provided. Providing a live webinar with captioning
  constitutes an alternative accessible arrangement, thus meeting the requirement.
citation:
  source: 42 U.S.C. §§ 12181–12189 (ADA Title III) — Americans with Disabilities Act — public
    accommodations §12189
  url: null
  quoted_text: Any person that offers examinations or courses related to applications, licensing,
    certification, or credentialing for secondary or postsecondary education, professional, or trade
    purposes shall offer such examinations or courses in a place and manner accessible to persons
    with disabilities or offer alternative accessible arrangements for such individuals.
