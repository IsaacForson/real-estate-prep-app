stem: A licensee receives a final cease and desist order under the Sherman Antitrust Act for
  price‑fixing and fails to comply for four consecutive days. What is the maximum total civil
  penalty the licensee could face?
options:
  - $20,000
  - $5,000
  - $15,000
  - $10,000
key: A
explanation: Each day of continuing failure to obey a final order constitutes a separate offense,
  and each offense carries a penalty of up to $5,000. Four days of noncompliance therefore yield a
  maximum of 4 × $5,000 = $20,000. The lower amounts ignore the per‑day accrual, and $15,000
  undercounts the number of days.
citation:
  source: 15 U.S.C. §§ 1–7 (Sherman Act) § 21
  url: null
  quoted_text: shall forfeit and pay to the United States a civil penalty of not more than $5,000 for
    each violation, which shall accrue to the United States and may be recovered in a civil action
    brought by the United States. Each separate violation of any such order shall be a separate
    offense, except that in the case of a violation through continuing failure or neglect to obey a
    final order of the commission, board, or Secretary each day of continuance of such failure or
    neglect shall be deemed a separate offense.
