stem: Which of the following is a typical requirement for broker supervision under state license law?
options:
  - Maintaining written office policies
  - Setting mandatory sales quotas for licensees
  - Sharing commission splits with competitors
  - Providing legal advice to clients
key: A
explanation: State license laws require brokers to supervise licensees, which includes maintaining
  written office policies as part of typical supervisory duties. The distractor about setting
  mandatory sales quotas is not a supervisory requirement and could violate antitrust safeguards.
citation:
  source: REP Ref. Brokerage Practice § 7.1
  url: null
  quoted_text: "Supervision typically requires: written office policies; review of contracts,
    listings, and advertising; oversight of trust accounts; training on license law, fair housing,
    and agency; availability to answer questions; and timely handling of complaints."
