stem: Under Executive Order 11063, which of the following is expressly listed as a protected class
  in Section 101(a)?
options:
  - Income scope
  - Age division
  - Marital item
  - Creed factor
key: D
explanation: Section 101(a) requires federal departments to prevent discrimination because of race,
  color, religion (creed), sex, disability, familial status, or national origin; therefore creed is
  a protected class. Age, income, and marital status are not mentioned in the order as protected
  classes.
