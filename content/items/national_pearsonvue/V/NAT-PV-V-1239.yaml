stem: Which statement about referral fees between brokers is correct?
options:
  - Referral fees kept by the salesperson
  - Referral fees to an unlicensed person
  - Referral fees prohibited by law
  - Referral fees between licensed brokers
key: D
explanation: Referral fees between licensed brokers are lawful and must flow broker to broker.
  Paying a referral fee to an unlicensed person is prohibited. Stating that referral fees are kept
  by the salesperson is incorrect; stating that referral fees go to an unlicensed person is
  incorrect; stating that referral fees are prohibited by law is incorrect.
