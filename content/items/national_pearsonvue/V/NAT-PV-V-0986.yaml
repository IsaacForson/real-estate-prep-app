stem: According to the nondiscrimination provisions in the Executive Order referenced in the text,
  which characteristic is explicitly protected in housing transactions involving federal assistance?
options:
  - Religion
  - Age
  - Marital status
  - Sexual orientation
key: A
explanation: The order prohibits discrimination because of race, color, religion (creed), sex,
  disability, familial status, or national origin in housing related to federal assistance. Religion
  is listed as a protected characteristic; age, sexual orientation, and marital status are not
  mentioned.
