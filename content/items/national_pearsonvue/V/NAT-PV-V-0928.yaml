stem: Under which type of listing agreement must the seller pay a commission if the property sells
  during the term, regardless of who finds the buyer?
options:
  - The net amount based listing agreement
  - The exclusive right to sell listing agreement
  - The exclusive agency listing agreement
  - The open non-exclusive listing agreement
key: B
explanation: Under an exclusive right to sell listing, the seller agrees to pay the commission if
  the property sells during the term irrespective of who procures the buyer, including the seller
  themselves. This is distinct from exclusive agency or open listings where the seller may avoid a
  commission by selling personally. The net amount based listing is prohibited in many states and
  not defined by this rule.
