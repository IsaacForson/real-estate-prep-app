stem: Under the Fair Housing Act, an aggrieved person must file an administrative complaint with the
  Secretary of Housing and Urban Development within what period after an alleged discriminatory
  housing practice occurred or terminated?
options:
  - Not later than 180 days after the practice occurred or terminated
  - Not later than two years after the practice occurred or terminated
  - Not later than 90 days after the practice occurred or terminated
  - Not later than one year after the practice occurred or terminated
key: D
explanation: Section 3610(a)(1)(A)(i) sets the filing deadline at not later than one year after the
  alleged discriminatory housing practice occurred or terminated. The other periods are common
  confusion points drawn from other limitation periods, but the statute specifies one year.
citation:
