stem: Under Executive Order 11063, what action may a federal department take against a lending
  institution that violates the nondiscrimination provisions?
options:
  - May refer the matter to the State real estate commission
  - May require the institution to post a performance bond
  - May cancel or terminate any agreement with the institution
  - May impose a civil penalty on the institution
