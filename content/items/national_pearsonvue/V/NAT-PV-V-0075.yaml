stem: "Under the general rules of brokerage compensation, a salesperson who sells a property may
  lawfully accept compensation for that sale from:"
options:
  - The seller directly if the seller offers a bonus
  - The cooperating broker who shared the commission
  - The buyer's lender as a referral reward
  - The salesperson's sponsoring broker only
key: D
explanation: A salesperson may accept compensation for licensed activity only from his or her
  sponsoring broker; bonuses from sellers or builders must be paid through the broker. Direct
  payment from a seller is the tempting distractor, but even a seller-offered bonus must flow
  through the sponsoring broker.
citation:
  source: REP Ref. Brokerage Practice § 4.7
  url: null
  quoted_text: A salesperson may accept compensation for licensed activity only from his or her
    sponsoring broker — never directly from a client, another broker, a lender, or a vendor.
