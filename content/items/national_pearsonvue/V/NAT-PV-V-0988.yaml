stem: According to Executive Order 11063, which of the following is **NOT** a protected
  characteristic in housing transactions involving federal assistance?
options:
  - It is protected because of race
  - It is protected because of age
  - It is protected because of color
  - It is protected because of religion
key: B
explanation: Executive Order 11063 prohibits discrimination based on race, color, religion (creed),
  sex, disability, familial status, or national origin in housing transactions involving federal
  assistance. Age is not listed among the protected characteristics. Therefore, the statement that
  age is protected is incorrect. The other options describe characteristics that are explicitly
  protected.
