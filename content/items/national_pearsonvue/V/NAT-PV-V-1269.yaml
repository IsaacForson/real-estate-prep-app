stem: Under the TCPA, which of the following best describes the term 'telephone solicitation'?
options:
  - The transmission of an unsolicited advertisement via facsimile machine to a residential
    subscriber without the recipient's prior express permission
  - The use of an artificial or prerecorded voice to deliver a message to a telephone number
    assigned to a paging service without the caller's prior express consent
  - The initiation of a telephone call or message for the purpose of encouraging the purchase or
    rental of, or investment in, property, goods, or services, which is transmitted to any person
  - The initiation of a telephone call made for emergency purposes using an automatic telephone
    dialing system to any person
key: C
explanation: Under 47 U.S.C. § 227(a)(4), telephone solicitation is defined as the initiation of a
  call or message to encourage the purchase, rental, or investment in property, goods, or services,
  transmitted to any person. The description of an emergency call using an automatic dialing system
  does not meet this definition, nor do the descriptions of unsolicited fax advertisements or
  prerecorded voice messages to paging services.
