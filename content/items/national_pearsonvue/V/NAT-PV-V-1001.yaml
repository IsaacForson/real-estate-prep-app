stem: A federal department discovers that a developer has discriminated against prospective buyers
  based on race in a housing project funded by a federal grant. Under Executive Order 11063, what
  action may the department take regarding the grant agreement?
options:
  - Cancel or terminate the grant agreement in whole or in part
  - Impose a fine on the developer equal to twice the grant amount
  - Require the developer to provide additional housing units
  - Refer the matter to the developer’s state licensing board
key: A
explanation: Section 302(a) authorizes a department to cancel or terminate any agreement or contract
  providing Federal aid when a violation of the order’s nondiscrimination provisions is found. The
  other options describe actions not permitted under the order.
