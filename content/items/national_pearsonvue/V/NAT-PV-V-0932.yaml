stem: Under an exclusive agency listing, which statement is correct?
options:
  - The seller must pay a commission even if they find the buyer themselves
  - The broker is paid a commission only if they personally find the buyer
  - The broker is paid a commission regardless of who finds the buyer
  - The seller may sell the property personally without owing a commission
key: D
explanation: Under an exclusive agency listing the seller may sell the property personally without
  owing a commission, as stated in the distinction between exclusive agency and exclusive right to
  sell. The broker is paid a commission only if they personally find the buyer is incorrect because
  any broker who finds the buyer earns a commission, not just the listing broker personally.
citation:
  source: REP Ref. Brokerage Practice § 13.1
  url: null
  quoted_text: "*Exclusive agency vs. exclusive right to sell*: under exclusive agency the seller may
    sell personally without commission; under exclusive right to sell the broker is paid regardless
    of who finds the buyer."
