stem: When a complaint alleges a discriminatory housing practice within the jurisdiction of a state
  or local agency certified by the Secretary under the Fair Housing Act, what must the Secretary do
  before taking any action on the complaint?
options:
  - Notify the Attorney General of the alleged violation
  - Refer the complaint to the certified state or local agency
  - Issue a formal charge against the respondent
  - Dismiss the complaint without further investigation
key: B
explanation: The Act mandates that the Secretary refer the complaint to any certified state or local
  agency before taking any action, unless the agency fails to act within statutory periods. Issuing
  a charge prematurely violates this referral requirement.
citation:
  source: 42 U.S.C. §§ 3601–3619 (Fair Housing Act) — Fair Housing Act — Title VIII of the Civil
    Rights Act of 1968 § 3610(f)(1)
  url: null
  quoted_text: (1) Whenever a complaint alleges a discriminatory housing practice— (A) within the
    jurisdiction of a State or local public agency; and (B) as to which such agency has been
    certified by the Secretary under this subsection; the Secretary shall refer such complaint to
    that certified agency before taking any action with respect to such complaint.
