stem: A real estate licensee makes 12 unsolicited telemarketing calls to prospective buyers, each
  call violating the TCPA. If the court determines the violations were willful, what is the maximum
  total statutory damages the licensee could be ordered to pay?
options:
  - $6,000
  - $12,000
  - $24,000
  - $18,000
key: D
explanation: Each TCPA violation carries a base statutory damages of $500, which can be trebled to
  $1,500 for willful conduct. Multiplying $1,500 by 12 calls yields $18,000. The $6,000 amount
  results from applying only the base $500 per violation and ignoring the trebling provision for
  willful violations.
citation:
  source: 47 U.S.C. § 227
  url: null
  quoted_text: Whenever the attorney general of a State, or an official or agency designated by a
    State, has reason to believe that any person has engaged or is engaging in a pattern or practice
    of telephone calls or other transmissions to residents of that State in violation of this
    section or the regulations prescribed under this section, the State may bring a civil action on
    behalf of its residents to enjoin such calls, an action to recover for actual monetary loss or
    receive $500 in damages for each violation, or both such actions. If the court finds the
    defendant willfully or knowingly violated such regulations, the court may, in its discretion,
    increase the amount of the award to an amount equal to not more than 3 times the amount
    available under the preceding sentence.
  secondary: []
math:
  worked_solution: |-
    Step 1: Determine base statutory damages per violation = $500.
    Step 2: Apply willful violation multiplier of 3: $500 × 3 = $1,500 per violation.
    Step 3: Multiply by number of violations: $1,500 × 12 = $18,000.
  formulas:
    - Total damages = number of violations × base damages × multiplier
