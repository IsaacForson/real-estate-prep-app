stem: Under 42 U.S.C. § 1982, the right to purchase real property is guaranteed to all citizens on
  the same basis as which group?
options:
  - Veterans
  - Native American tribes
  - Federal employees
  - White citizens
key: D
explanation: The statute states that all citizens shall have the same right to purchase property as
  is enjoyed by white citizens. Therefore, the guaranteed basis is equality with white citizens.
  Options referring to Native American tribes, federal employees, or veterans are not mentioned in
  the statute.
citation:
  source: "### 42 U.S.C. § 1982 (Civil Rights Act of 1866, property rights) — Civil Rights Act of 1866
    — property rights of citizens § 1982"
  url: null
  quoted_text: All citizens of the United States shall have the same right, in every State and
    Territory, as is enjoyed by white citizens thereof to inherit, purchase, lease, sell, hold, and
    convey real and personal property.
