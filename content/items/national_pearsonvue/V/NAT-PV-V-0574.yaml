stem: Which of the following actions constitutes conversion of trust money under trust account rules?
options:
  - Maintaining a separate ledger for each transaction
  - Using trust money to pay the broker's personal credit card bill
  - Depositing earnest money into the broker's operating account
  - Leaving earned commissions in the trust account past the permitted time
key: B
explanation: Conversion is defined as using trust money for any unauthorized purpose, such as paying
  the broker's personal credit card bill. Depositing earnest money into the operating account or
  leaving earned commissions in the trust account past the permitted time are examples of
  commingling, not conversion. Maintaining a separate ledger is a proper trust account practice and
  does not involve misuse of funds.
