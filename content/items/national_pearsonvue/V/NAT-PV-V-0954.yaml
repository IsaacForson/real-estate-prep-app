stem: "A developer receives a federally insured loan to construct rental units and then refuses to
  rent to an applicant because of the applicant's national origin. Under Executive Order 11063, this
  action is:"
options:
  - Permitted because the loan is only for construction
  - Allowed if the developer is a private entity
  - Permitted only if the loan is for home purchases
  - A violation because the housing receives Federal loan assistance
