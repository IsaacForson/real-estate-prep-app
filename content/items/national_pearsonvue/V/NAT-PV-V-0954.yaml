explanation: Section 101(a)(iii) covers housing provided in whole or in part by loans insured or
  guaranteed by the Federal Government, making discrimination based on national origin prohibited.
  The distractor claiming permission because the loan is only for construction is wrong because the
  federal loan triggers coverage regardless of the loan's purpose.
