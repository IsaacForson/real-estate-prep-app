stem: What does the TCPA prohibit regarding charges to residential subscribers for giving or
  revoking a notification of objection to telephone solicitations?
options:
  - Prohibiting any residential subscriber from being charged for giving or revoking such
    notification
  - Allowing carriers to charge a nominal fee for processing the notification
  - Permitting states to impose a surcharge on each notification
  - Requiring subscribers to pay a monthly fee to remain on the do-not-call list
key: A
explanation: The key is correct because subsection (3)(E) prohibits any residential subscriber from
  being charged for giving or revoking a notification of objection. The most tempting distractor is
  "Allowing carriers to charge a nominal fee for processing the notification," which directly
  contradicts the prohibition in subsection (3)(E) and is therefore wrong.
