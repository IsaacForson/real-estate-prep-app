stem: Which of the following is **NOT** a requirement for a licensed real estate agent to be treated
  as a statutory non‑employee (independent contractor) under the federal tax safe harbor?
options:
  - The agent works under a written contractor agreement
  - The agent's pay is based solely on sales commissions
  - The agent holds a valid state real estate license
  - The agent receives a regular hourly wage or salary
key: D
explanation: "The federal safe harbor requires that substantially all compensation be tied to sales
  output, not hours worked, so receiving an hourly wage disqualifies the agent. The other options
  describe actual requirements: holding a license, commission‑based pay, and a written
  independent‑contractor agreement."
