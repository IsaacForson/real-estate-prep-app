stem: "A landlord refuses to rent an apartment to a family with two children because the landlord
  prefers adult tenants. The apartment building is financed with a federally insured loan. Under
  Executive Order 11063, the landlord's refusal is:"
options:
  - Lawful because familial status is not protected
  - Unlawful because familial status is a protected characteristic
  - Permissible if the landlord offers a different unit
  - Allowed if the landlord provides a reasonable accommodation
key: B
explanation: Executive Order 11063 includes familial status as a protected characteristic in housing
  transactions involving federal assistance. Refusing to rent to a family with children constitutes
  discrimination based on familial status, which is unlawful. Offering a different unit or providing
  a reasonable accommodation does not justify the refusal under the order.
