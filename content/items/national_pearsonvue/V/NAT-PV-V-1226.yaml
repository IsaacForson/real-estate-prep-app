stem: Which of the following describes an illegal tie-in arrangement under federal antitrust law?
options:
  - C. A brokerage provides a discount to buyers who use its affiliated insurance provider.
  - D. A brokerage shares market data with competitors to set uniform commission rates.
  - A. A brokerage will take a listing only if the seller uses its affiliated title company.
  - B. A brokerage offers its affiliated mortgage company as an option but does not require its use.
key: C
explanation: Under federal antitrust law, conditioning the receipt of a real estate service on the
  use of an affiliated service is an illegal tie‑in when the party imposing the condition has
  sufficient market power. The correct option describes a brokerage that will accept a listing only
  if the seller uses its affiliated title company, which meets that definition. Offering the
  affiliated service as an option but not requiring its use is permissible with proper disclosure
  and therefore not a tie‑in. Providing a discount for using an affiliated service or sharing market
  data to set uniform commission rates does not create the required conditioning of one product on
  another.
