stem: A buyer asks a licensee to include a clause making the sale contingent on the buyer's
  partner's approval 'in her sole discretion.' What is the licensee's appropriate course of action?
options:
  - Drafting the clause as requested and having the buyer sign it
  - Using an approved contingency addendum or referring the buyer to an attorney
  - Explaining that such contingencies are not allowed in real estate contracts
  - Preparing a standard purchase agreement and leaving the clause blank for the buyer to fill in
    later
key: B
explanation: Writing a contract clause from scratch is considered drafting, which is the
  unauthorized practice of law for a real estate licensee. The licensee should either use an
  approved contingency addendum that addresses the situation or refer the buyer to an attorney to
  draft the language. Telling the buyer that such contingencies are not allowed is incorrect; they
  may be permissible if properly drafted. Leaving the clause blank does not fulfill the buyer's
  request and may leave the term unresolved.
