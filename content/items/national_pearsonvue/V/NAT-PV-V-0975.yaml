stem: A real estate brokerage firm operates exclusively in State X, but its website advertises
  properties to potential buyers in other states and receives inquiries from out‑of‑state parties.
  Under the Sherman Antitrust Act, is the firm's activity considered 'commerce'?
options:
  - The firm's activity is considered commerce only if it maintains an office in another state
  - The firm's activity is considered commerce because its advertising reaches persons in other
    states
  - The firm's activity is considered not to be commerce unless it completes a transaction with an
    out‑of‑state buyer
  - The firm's activity is considered not to be commerce because its physical operations are
    confined to one state
key: B
explanation: The statute defines commerce to include trade or commerce among the several States,
  which encompasses advertising that draws interest from out‑of‑state parties. An actual sale or a
  physical office in another state is not required for the activity to qualify as commerce under the
  Act.
