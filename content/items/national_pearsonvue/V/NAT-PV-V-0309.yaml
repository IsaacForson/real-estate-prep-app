stem: Which of the following acts is authorized for a licensed real estate agent to perform for
  compensation on behalf of others?
options:
  - Performing a property appraisal
  - Preparing a client's tax return
  - Negotiating a lease agreement
  - Providing legal advice on a contract
key: C
explanation: A licensed real estate agent may negotiate lease agreements as part of brokerage
  activities authorized by the license. Providing legal advice about a contract is not permitted
  because licensees cannot give legal advice on the meaning or effect of documents. Preparing tax
  returns and performing property appraisals are not brokerage acts covered by the real estate
  license.
