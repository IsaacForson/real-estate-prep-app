stem: Under the federal statutory safe harbor for licensed real estate agents, which action would
  jeopardize a broker's ability to treat a licensee as an independent contractor for federal tax
  purposes?
options:
  - The broker pays the licensee solely on commission splits with no hourly wage
  - The broker requires the licensee to attend training on trust-account rules
  - The broker sets mandatory hours for the licensee and supervises daily tasks
  - The broker provides a written contract stating the licensee is not an employee
key: C
explanation: The safe harbor requires brokers to avoid conduct inconsistent with independent
  contractor status, such as setting mandatory hours, paying salaries, or reimbursing expenses
  beyond supervision requirements. Setting mandatory hours is expressly prohibited, while the other
  actions are permissible or required.
