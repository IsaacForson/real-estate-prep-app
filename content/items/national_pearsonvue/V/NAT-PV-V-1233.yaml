stem: According to the text, which of the following is included in the scope of authority of a
  property management agreement?
options:
  - The scope of authority includes setting the rental price for all units.
  - The scope of authority includes spending limits, leasing parameters, and authority to evict.
  - The scope of authority includes providing legal advice to tenants.
  - The scope of authority includes preparing the owner's personal tax returns.
key: B
explanation: The scope of authority in a property management agreement includes spending limits,
  leasing parameters, and authority to evict. Setting rental price is not part of that scope.
