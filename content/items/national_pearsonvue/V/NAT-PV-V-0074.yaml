stem: "A seller signs an exclusive right to sell listing with Broker Kim. During the term, the
  seller's coworker buys the property directly from the seller with no involvement from any broker.
  Under the listing, the seller:"
options:
  - Owes a commission only if Kim objects in writing
  - Owes Broker Kim the full agreed commission
  - Owes no commission because no broker was involved
  - Owes only half the commission to Broker Kim
key: B
explanation: Under an exclusive right to sell, the seller agrees to pay the commission if the
  property sells during the term regardless of who procures the buyer, including the seller. The
  no-commission outcome is the tempting distractor, but that result applies only under an exclusive
  agency or open listing.
