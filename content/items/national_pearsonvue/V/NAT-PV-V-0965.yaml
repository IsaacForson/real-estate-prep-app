stem: The FTC needs to serve a complaint on a corporation. Which of the following actions would be a
  valid method of service under §21(f)?
options:
  - Leaving a copy at the corporation's principal office
  - Handing a copy to any junior employee of the corporation
  - Posting a notice on the corporation's website
  - Emailing the complaint to the corporation's general counsel
key: A
explanation: Under §21(f), leaving a copy at the principal office or place of business is an
  authorized method of service. Emailing, handing to a junior employee, or posting on a website are
  not permitted methods.
