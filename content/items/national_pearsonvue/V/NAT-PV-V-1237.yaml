stem: An unlicensed assistant employed by a brokerage shows a property to a prospective buyer and
  discusses the asking price. Who is responsible for the assistant's conduct?
options:
  - The unlicensed assistant alone.
  - The broker who employs the assistant.
  - The prospective buyer who requested the showing.
  - The licensee who supervised the showing.
key: B
explanation: The broker is responsible for the conduct of unlicensed assistants employed by the
  brokerage. Although a licensee may supervise the showing, ultimate responsibility rests with the
  broker, not the licensee. The unlicensed assistant alone is not liable for the brokerage's
  responsibilities, and the prospective buyer has no responsibility for the assistant's actions.
