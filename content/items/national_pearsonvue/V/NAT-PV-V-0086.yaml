stem: Under the Fair Housing Act, the prohibition against discriminatory advertising in section
  3604(c) applies to notices, statements, or advertisements indicating a preference, limitation, or
  discrimination based on which grounds?
options:
  - Race, color, religion, sex, familial status, national origin, or income source
  - Race, color, religion, sex, handicap, familial status, or national origin
  - Race, color, ancestry, sex, handicap, familial status, or citizenship
  - Race, color, religion, sex, marital status, age, or national origin
key: B
explanation: Section 3604(c) lists race, color, religion, sex, handicap, familial status, and
  national origin as the prohibited bases for discriminatory notices, statements, or advertisements.
  Marital status, age, income source, ancestry, and citizenship do not appear in this provision.
