stem: Under Executive Order 11063, what must each executive department and agency do within thirty
  days from the date of the order to effectuate the purposes of the order?
options:
  - Submit a report to the President's Committee on Equal Opportunity in Housing.
  - Issue rules and regulations to effectuate the purposes of the order.
  - Refer any violations to the Attorney General for criminal prosecution.
  - Cancel all existing federal aid contracts with noncompliant entities.
key: B
explanation: Section 203 of Executive Order 11063 requires each agency to issue rules and
  regulations, adopt procedures, and make exemptions necessary to effectuate the order's purposes
  within thirty days. Submitting a report is required under Section 201 but is not directed toward
  effectuating the order's purposes.
