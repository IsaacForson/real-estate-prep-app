stem: Under trust account rules, when does the commission portion of a closing disbursement become
  the broker's money?
options:
  - The commission is considered earned once the closing statement is prepared
  - The commission becomes the broker's money when the earnest money is released
  - The commission is earned and disbursed to the broker under the closing statement
  - The commission is deposited into the trust account and remains there until closing
key: C
explanation: The commission portion of a closing disbursement becomes the broker's money only when
  it is earned and disbursed to the broker under the closing statement. Advancing the commission
  before closing constitutes conversion of trust funds. The other options describe timing that does
  not satisfy the rule.
