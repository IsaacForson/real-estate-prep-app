stem: A property management fee based on collected rent primarily rewards which of the following?
options:
  - Expense control and reporting
  - Lease renewal and turnover
  - Occupancy and rent collections
  - Maintenance response and speed
key: C
explanation: A property management fee calculated as a percentage of collected rent directly
  incentivizes the manager to keep units occupied and ensure rent is collected, as the fee amount
  increases with these metrics. This structure does not inherently reward expense control, which is
  why reporting and budgeting obligations are specified separately to ensure financial oversight
  independent of the fee calculation.
