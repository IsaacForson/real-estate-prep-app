stem: A licensee prepares a deed that transfers whatever interest the grantor has, if any, without
  any warranties or implication that the grantor holds any interest. Which deed type describes this
  instrument?
options:
  - Warranty deed
  - Special warranty deed
  - Bargain and sale deed
  - Quitclaim deed
key: D
explanation: A quitclaim deed conveys only the interest the grantor actually possesses, if any, and
  makes no warranties or implications about the quality of that interest. This aligns exactly with
  the description in the stem. The other deed types either include warranties or imply ownership.
