stem: Under a race-notice recording statute, a later purchaser prevails over an earlier grantee only
  if the later purchaser did which of the following?
options:
  - Recorded the deed, regardless of any notice of the earlier interest
  - Lacked notice of the earlier interest, regardless of who recorded first
  - Lacked notice of the earlier interest and recorded before the earlier grantee
  - Paid value and took the deed before the earlier grantee took theirs
key: C
explanation: Under a race-notice statute the later purchaser wins only by both lacking notice and
  recording first. Lacking notice alone describes a pure notice statute, and recording alone
  regardless of knowledge describes a race statute.
