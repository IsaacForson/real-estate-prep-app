stem: What is the purpose of the consideration clause in a deed?
options:
  - To show the grantor's intent to transfer title upon delivery and acceptance.
  - To satisfy the statute of frauds requirement for consideration in a deed.
  - To indicate the amount of money actually paid for the property.
  - To provide a nominal value that satisfies the deed validity requirement.
key: D
explanation: A deed must contain a statement of consideration. The clause usually recites a nominal
  amount—e.g., “ten dollars and other good and valuable consideration”—or, for a gift deed, language
  such as “love and affection.” This nominal statement satisfies the requirement that the deed
  include consideration, even though it does not reflect the actual purchase price (Ownership, Title
  & Transfer).
