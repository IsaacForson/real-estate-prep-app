stem: A grantor conveys property 'to A for the life of B.' If A dies before B, who holds the estate
  after A's death?
options:
  - Life tenant B
  - The heirs of A
  - The grantor's heirs
  - The remainderman
key: B
explanation: When a life estate is measured by another's life (pur autre vie), if the life tenant
  dies before the measuring life, the life tenant's heirs hold the estate until the measuring life
  ends.
