stem: What does the covenant of seisin guarantee in a warranty deed?
options:
  - The grantor guarantees that the grantee will not be disturbed by a superior claim
  - The grantor guarantees that there are no undisclosed encumbrances on the estate
  - The grantor guarantees that the grantor has the right to transfer the estate
  - The grantor guarantees that the grantor owns the estate being conveyed
key: D
explanation: The covenant of seisin is a present covenant in which the grantor guarantees that he or
  she actually owns the estate being conveyed (Ownership, Title & Transfer). The covenant of right
  to convey guarantees the grantor has authority to transfer the estate, the covenant against
  encumbrances guarantees there are no undisclosed liens, and the covenant of quiet enjoyment
  guarantees the grantee will not be disturbed by a superior claim.
