stem: What is constructive notice according to the recording system?
options:
  - Knowledge that arises only after a court judgment quieting title and is recorded in the public
    records
  - Knowledge that the law charges a person with when the information is available through public
    records or open possession
  - Knowledge that a person actually possesses after reviewing the title abstract and related
    documents
  - Knowledge that is required for a deed to be valid between the parties in a transaction
key: B
explanation: Constructive notice is defined as the legal charge of knowledge to a person when
  information is available through public records or open possession, regardless of actual
  awareness. This matches the definition in the recording system section. The distractor about
  actual possession after reviewing an abstract describes actual notice, not constructive notice,
  because constructive notice does not require the person to actually know the information.
citation:
  source: REP Ref. Ownership, Title & Transfer § 9.2
  url: null
  quoted_text: "Constructive notice is knowledge the law charges a person with, whether or not the
    person actually knows, because the information was available: everything properly recorded gives
    constructive notice, and so does open possession of the property by someone other than the
    record owner."
