stem: When a tax certificate is sold at a tax sale and the property owner redeems within the
  statutory period, what does the investor who purchased the certificate receive?
options:
  - The investor receives immediate title to the property upon redemption
  - The investor receives a tax deed after the redemption period ends
  - The investor receives repayment of the purchase price plus interest
  - The investor receives a portion of the property's sale proceeds
key: C
explanation: If the property owner redeems the tax certificate within the statutory period, the
  investor who bought the certificate is repaid the amount paid plus interest. The investor only
  obtains a tax deed if the owner fails to redeem.
