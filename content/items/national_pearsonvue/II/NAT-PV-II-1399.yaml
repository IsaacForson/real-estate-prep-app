stem: A grantor prepares a deed that includes the grantor's signature, words of conveyance, and an
  adequate legal description, but omits any statement of consideration. The grantor delivers the
  deed to the grantee, who accepts it. What is the effect of the missing consideration?
options:
  - The deed is void due to lack of consideration
  - The deed remains valid despite missing consideration
  - The deed is valid only if grantee provides consideration
  - The deed is valid but unenforceable to others
key: A
explanation: A deed must contain a statement of consideration; if that statement is omitted the deed
  is void. The other options are incorrect because consideration is not required to be supplied by
  the grantee, the deed’s validity does not depend on the grantee providing consideration, and a
  deed lacking consideration is not merely unenforceable to others—it is void.
citation:
