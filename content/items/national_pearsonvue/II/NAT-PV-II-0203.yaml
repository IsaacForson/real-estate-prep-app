stem: A buyer receives a quitclaim deed from a seller who actually owns the property in fee simple.
  Later, a third party asserts a superior claim based on an unrecorded easement. Can the buyer rely
  on the seller's covenant of warranty to defend against the claim?
options:
  - The buyer can enforce the warranty against the third party
  - The buyer cannot enforce any warranty against the third party
  - The buyer can enforce the warranty only if the easement is recorded
  - The buyer cannot enforce the warranty unless title insurance is purchased
key: B
explanation: A quitclaim deed conveys whatever interest the grantor has with no warranties, as
  stated in § 6.6. Therefore the buyer has no warranty to enforce against the third party’s claim.
  The distractor suggesting enforcement if the easement is recorded is incorrect because the deed
  lacks any warranty regardless of record status.
