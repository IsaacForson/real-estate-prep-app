stem: Which of the following is required for a deed to be valid between the grantor and grantee?
options:
  - The grantor must sign deed
  - The grantee must sign deed
  - The deed must be recorded
  - The deed must be dated
key: A
explanation: A valid deed requires a legally competent grantor who signs the deed; the grantee's
  signature is not necessary for validity between the parties. The deed being dated or recorded is
  prudent but not required for the deed's validity.
