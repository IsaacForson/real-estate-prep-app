stem: Which statement best describes marketable title?
options:
  - Title that is perfect and free of any physical defects such as a leaky roof
  - Title that is required to have the seller pay for all liens before closing
  - Title that is only valid if the property has been recorded for at least ten years
  - Title that is free from reasonable doubt and acceptable to a reasonably prudent, well-informed
    buyer
key: D
explanation: Marketable title is defined as title free from reasonable doubt that a reasonably
  prudent, well-informed buyer would accept, not subject to undisclosed liens or encumbrances, and
  not exposing the buyer to litigation; it need not be perfect. This aligns with the marketable
  title section. The distractor describing a perfect title free of physical defects is incorrect
  because marketable title does not require perfection or freedom from physical defects such as a
  leaky roof.
citation:
