stem: Which of the following is a future covenant in a warranty deed?
options:
  - Seisin is a future covenant.
  - Right to convey is a future covenant.
  - Against encumbrances is a future covenant.
  - Quiet enjoyment is a future covenant.
key: D
explanation: The first three covenants in a warranty deed—seisin, right to convey, and against
  encumbrances—are present covenants, which are breached at the time of delivery if they are false.
  The last three covenants—quiet enjoyment, warranty, and further assurances—are future covenants,
  which are breached only when a superior claim arises after the deed is delivered. Therefore, quiet
  enjoyment is a future covenant, while the other options describe present covenants and are
  incorrect.
