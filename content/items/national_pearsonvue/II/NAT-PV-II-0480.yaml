stem: Which element of a deed shows present intent to transfer title from grantor to grantee?
options:
  - The words of conveyance such as 'grants and conveys.'
  - The legal description of the property boundaries.
  - The consideration clause stating nominal payment.
  - The habendum clause defining the estate granted.
key: A
explanation: Words of conveyance (the granting clause), such as 'grants and conveys,' show present
  intent to transfer title from grantor to grantee. The habendum clause defines the estate granted,
  the consideration clause states the payment, and the legal description identifies the property.
