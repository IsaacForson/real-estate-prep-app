stem: What type of deed is typically used by an executor or administrator to convey real property
  after a probate proceeding?
options:
  - Executor's deed without any warranties, limited to the representative's acts
  - Special warranty deed that covers only defects arising during the grantor's ownership
  - Standard quitclaim deed that conveys only the interest the grantor actually holds
  - General warranty deed that guarantees title against all prior defects
key: A
explanation: The statute states that real property is conveyed by an executor's or administrator's
  deed, usually without warranties beyond the representative's own acts, making the executor's deed
  the correct choice. The special warranty, general warranty, and quitclaim deeds each provide
  warranties or conveyances not described for probate conveyances.
