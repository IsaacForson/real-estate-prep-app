stem: What is the defining characteristic of a fee simple determinable estate?
options:
  - It ends automatically when the stated use ends
  - It requires the grantor to take action to retake the property
  - It lasts for the life of a designated third party
  - It is transferable only by will or descent
key: A
explanation: A fee simple determinable ends automatically when the stated use or condition ends; no
  action by the grantor is needed to regain possession. The option describing a life estate measured
  by a third party’s life is incorrect because a fee simple determinable is not tied to a person's
  lifespan. The option stating that the grantor must act to retake the property describes a fee
  simple subject to a condition subsequent, which requires the grantor to take steps to reclaim the
  estate. The option claiming transfer is limited to will or descent is incorrect because a fee
  simple determinable is freely transferable during the holder’s lifetime, subject to the automatic
  termination condition.
citation:
  source: "REP Ref. Ownership, Title & Transfer — Reference note: estates, ownership forms, deeds,
