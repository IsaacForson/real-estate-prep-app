stem: Under probate proceedings, what warranty is typically provided by an executor's or
  administrator's deed?
options:
  - Full warranty against all title defects
  - Warranty for defects during executor's ownership
  - No warranties beyond the representative's own acts
  - Warranty against undisclosed heirs only
key: C
explanation: An executor's or administrator's deed typically provides no warranties beyond the
  representative's own acts. Therefore the option stating that the deed offers no warranties beyond
  the representative's own acts is correct. The option claiming a warranty limited to defects during
  the executor's ownership incorrectly suggests some warranty beyond the representative's acts. The
  option asserting a warranty against undisclosed heirs only is also incorrect because the deed does
  not provide that limited warranty. The option stating a full warranty against all title defects is
  incorrect because the deed does not give a full warranty.
