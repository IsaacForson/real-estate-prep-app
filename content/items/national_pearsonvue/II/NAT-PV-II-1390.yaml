stem: In a jurisdiction where a tax certificate is sold for unpaid property taxes, what must occur
  for the certificate holder to be entitled to repayment with interest?
options:
  - The owner files for bankruptcy protection
  - The property is sold at a tax deed sale
  - The taxing authority initiates a foreclosure lawsuit
  - The owner redeems within the statutory period
key: D
explanation: Under §12.2 Tax sales, an investor who purchases a tax certificate is repaid with
  interest if the owner redeems within the statutory period. Therefore, repayment hinges on the
  owner exercising the right of redemption during that period. The distractor that the property is
  sold at a tax deed sale describes a different outcome that occurs only if the owner fails to
  redeem.
