stem: A deed conveys land "to the city so long as it is used for a public park." If the city leases
  the land to a private restaurant, what happens to the estate?
options:
  - The estate ends automatically and title reverts
  - The grantor must take action to retake the property
  - The estate continues because the condition is not broken
  - The city must pay damages to the grantor
key: A
explanation: The language "so long as" creates a fee simple determinable that ends automatically
  when the stated use stops, with title reverting to the grantor without any action. Leasing to a
  private restaurant breaks the public‑park use, triggering the automatic reversion. The grantor
  does not need to act, and the estate does not continue merely because the city remains in
  possession.
citation:
  source: REP Ref. Ownership, Title & Transfer § 1.3
  url: null
  quoted_text: Fee simple determinable. The estate lasts only 'so long as,' 'while,' or 'during' a
    stated use continues, and it ends automatically when the use stops. The grantor keeps a
    possibility of reverter, and title returns to the grantor or the grantor's heirs without any
    action.
