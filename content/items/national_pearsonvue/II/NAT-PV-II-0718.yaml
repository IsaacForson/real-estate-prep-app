stem: Which statement accurately describes the limitation of a special warranty deed?
options:
  - It warrants only against claims 'by, through, or under' the grantor.
  - It warrants against defects arising at any time in the chain of title.
  - It provides no warranties of any kind regarding title or encumbrances.
  - It warrants against all encumbrances, whether known or unknown.
key: A
explanation: A special warranty deed limits the grantor's warranty to claims that arise by, through,
  or under the grantor; it does not warrant against claims from prior owners or other sources.
