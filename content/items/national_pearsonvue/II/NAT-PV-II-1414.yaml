key: A
explanation: The grantor retains the possibility of reverter in a fee simple determinable, which
  allows automatic return of title if the stated use ends. The grantee does not hold this interest.
citation:
  source: REP Ref. Ownership, Title & Transfer § 1.3
  url: null
  quoted_text: Fee simple determinable. The estate lasts only 'so long as,' 'while,' or 'during' a
    stated use continues, and it ends automatically when the use stops. The grantor keeps a
    possibility of reverter, and title returns to the grantor or the grantor's heirs without any
    action.
