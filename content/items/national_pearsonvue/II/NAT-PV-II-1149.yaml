stem: What is voluntary alienation in real property?
options:
  - The transfer of title when the owner chooses to sell, give, dedicate, or place in trust
  - The transfer of title that occurs when the owner dies without a valid will
  - The transfer of title taken by government for public use with compensation
  - The transfer of title from occupying land without permission for the statutory period
key: A
explanation: Voluntary alienation is a transfer of title that occurs when the owner chooses to sell,
  give, dedicate, or place the property in trust, accomplished by a deed during the owner's
  lifetime. The option describing a transfer when the owner chooses to sell, give, dedicate, or
  place in trust matches this definition. The option describing transfer when the owner dies without
  a will describes intestate succession, which is an involuntary transfer.
citation:
  source: REP Ref. Ownership, Title & Transfer § 7.1
  url: null
  quoted_text: Alienation is the transfer of title. Voluntary alienation occurs when the owner chooses
    to transfer by sale, gift, dedication to public use, or conveyance into trust, each accomplished
    by a deed delivered during the owner's lifetime.
