stem: Which phrase in a deed creates a fee simple determinable estate?
options:
  - The phrase "so long as" or similar durational language
  - The phrase "but if" or similar conditional language
  - The phrase "on condition that" or similar conditional language
  - The phrase "provided that" or similar conditional language
key: A
explanation: A fee simple determinable is created by durational words such as 'so long as,' 'while,'
  or 'during' that cause the estate to end automatically when the stated use stops. Conditional
  phrases such as 'but if,' 'on condition that,' and 'provided that' create a fee simple subject to
  a condition subsequent, which requires the grantor to act to retake the property. Therefore, the
  option that mentions 'so long as' or similar durational language correctly identifies the language
  for a determinable fee.
citation:
  source: REP Ref. Ownership, Title & Transfer § 1.3
  url: null
  quoted_text: Fee simple determinable. The estate lasts only 'so long as,' 'while,' or 'during' a
    stated use continues, and it ends automatically when the use stops.
