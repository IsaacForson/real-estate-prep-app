stem: In a fee simple determinable, what future interest does the grantor retain?
options:
  - Signing and delivering the deed
  - Recording and delivering the deed
  - Delivery and acceptance by the grantee
  - Payment and consideration of funds
key: C
explanation: The grantor of a fee simple determinable retains a possibility of reverter, which
  allows title to return automatically if the stated condition fails. A right of re-entry applies to
  a fee simple subject to a condition subsequent, requiring the grantor to act to retake the
  property. A remainder and a reversion are interests that follow a life estate, not a defeasible
  fee.
