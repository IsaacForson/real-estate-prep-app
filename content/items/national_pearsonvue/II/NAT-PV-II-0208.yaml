stem: A grantor conveys land 'to A for life, then to B.' What interest does B hold?
options:
  - It is a remainder that becomes possessory after A's death
  - It is a reversion that returns to the grantor upon A's death
  - It is an executory interest that cuts short A's estate
  - It is a life estate measured by B's life
key: A
explanation: When a deed names a third party after a life estate ('to A for life, then to C'), that
  third party holds a remainder. Therefore B holds a remainder, making the statement 'It is a
  remainder that becomes possessory after A's death' correct. The statement 'It is a reversion that
  returns to the grantor upon A's death' describes a reversion, which occurs when the property
  returns to the grantor, not a third party.
