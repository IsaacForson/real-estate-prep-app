stem: Which of the following is required for a deed to be valid under the REP Ref. Ownership, Title
  & Transfer guidelines?
options:
  - The grantor must be of age and sound mind.
  - The deed must include a dated signature line.
  - The deed must be recorded in the public records.
  - The grantee must sign the deed before transfer.
key: A
explanation: A valid deed requires a legally competent grantor (of age and sound mind) who signs the
  deed. The grantee’s signature, a date, and recording are not required for validity between the
  parties.
