stem: Which type of deed provides the grantee with the greatest protection, warranting against
  defects arising at any time in the chain of title, before or during the grantor's ownership?
options:
  - Quitclaim deed, no warranty
  - Special warranty deed
  - Bargain and sale deed
  - General warranty deed
key: D
explanation: A general warranty deed includes the full set of covenants of title, guaranteeing that
  the grantor will defend the grantee against any title defects that existed before the grantor
  acquired the property or that arise during the grantor’s ownership. Because the grantor is liable
  for the entire chain of title, this deed gives the grantee the greatest protection. By contrast, a
  special warranty deed limits the guarantee to defects that occurred only during the grantor’s
  period of ownership.
citation:
  source: REP Ref. Ownership, Title & Transfer § 6.3
  url: null
  quoted_text: "A general warranty deed gives the grantee the greatest protection: the grantor makes
    all the covenants of title and warrants against defects arising at any time in the chain of
    title, before or during the grantor's ownership."
