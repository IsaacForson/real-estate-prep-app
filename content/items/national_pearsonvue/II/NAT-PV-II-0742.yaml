stem: A seller signs a deed and gives it to an escrow agent with instructions to release it upon the
  buyer's loan approval. The loan is approved three days later, the agent releases the deed to the
  buyer, and the deed is recorded the next day. When does title pass?
options:
  - The deed being signed, delivered, and accepted
  - The escrow agent receiving the deed
  - The escrow agent releasing the deed
  - The deed being recorded publicly
key: C
explanation: Title passes when the deed is delivered by the grantor and accepted by the grantee, not
  when signed or recorded. Delivery to an escrow agent with conditions results in title passing when
  those conditions are satisfied and the agent releases the deed. Thus, title passes when the escrow
  agent releases the deed. The other options describe events that do not effect transfer of title.
