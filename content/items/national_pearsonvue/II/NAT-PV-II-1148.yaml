stem: A 17‑year‑old signs a deed transferring his inherited property to a friend. Based on the
  requirements for a valid deed, is the deed valid?
options:
  - Yes, because the grantee is identifiable.
  - Yes, because the deed includes words of conveyance.
  - No, because the grantor lacks legal capacity.
  - No, because the deed lacks acknowledgment.
key: C
explanation: A valid deed requires a legally competent grantor (of age and sound mind). A
  17‑year‑old lacks the legal capacity to be a competent grantor, rendering the deed void. The other
  options describe elements that are either present or not required for validity between the
  parties.
