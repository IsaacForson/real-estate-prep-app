stem: In a state that uses tax certificates for unpaid taxes, the property owner fails to redeem
  within the statutory period. What may the investor who holds the tax certificate obtain?
options:
  - The investor may receive a quitclaim deed
  - The investor may receive a warranty deed
  - The investor may receive a tax deed
  - The investor may receive a leasehold interest
key: C
explanation: According to §12.2 Tax sales, an investor who holds a tax certificate may obtain a tax
  deed if the owner does not redeem within the statutory period. Thus, failure to redeem allows the
  investor to proceed to a tax deed. The distractor that the investor receives a quitclaim deed is
  incorrect because the tax sale process does not automatically convey a quitclaim deed; the
  specific instrument is a tax deed.
