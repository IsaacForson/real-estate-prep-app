stem: Which of the following is **NOT** required for a deed to be valid under the REP Ref.
  Ownership, Title & Transfer guidelines?
options:
  - A legally competent grantor
  - An identifiable grantee
  - Words of conveyance
  - The grantee's signature
key: D
explanation: A valid deed requires a legally competent grantor, an identifiable grantee, words of
  conveyance, consideration, an adequate legal description, and delivery and acceptance. The
  grantee’s signature is not required. Therefore, the grantee’s signature is the item that is not
  required.
citation:
  source: REP Ref. Ownership, Title & Transfer § 6.1
  url: null
  quoted_text: "- An identifiable grantee capable of taking title; a deed to a fictitious or deceased
    person is void. The grantee need not sign."
