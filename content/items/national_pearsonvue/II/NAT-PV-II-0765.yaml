stem: An investor purchases a tax certificate at a tax sale. Six months later, the property owner
  pays the overdue taxes plus interest and redeems the property. What is the investor entitled to
  receive?
options:
  - The investor losing the entire investment
  - The repayment of the purchase price plus interest
  - The investor receiving full ownership of the property
  - The issuance of a tax deed to the investor
key: B
explanation: The tax sale provision states that an investor who buys a tax certificate is repaid
  with interest if the owner redeems within the statutory period. Therefore the investor receives
  repayment plus interest. The distractor about receiving a tax deed applies only if the owner does
  not redeem.
