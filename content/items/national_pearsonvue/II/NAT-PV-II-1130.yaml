stem: A seller signs a deed and hands it directly to the buyer at the closing table. The buyer
  immediately puts the deed in his pocket and later records it two weeks later. When does title
  pass?
options:
  - When the seller signs the deed at the table
  - When the buyer verbally accepts the deed
  - When the seller hands the deed to the buyer
  - When the buyer records the deed in the county
key: C
explanation: Title passes when the deed is delivered by the grantor and accepted by the grantee, not
  when it is signed or recorded. Handing the deed to the buyer constitutes delivery, and acceptance
  is presumed because the conveyance benefits the buyer. Recording merely provides constructive
  notice and does not affect the timing of transfer.
