stem: What is the definition of fee simple absolute?
options:
  - Ownership that terminates automatically when a specified use ceases
  - Ownership of unlimited duration with the full bundle of rights
  - Ownership that may be forfeited if a stated condition is violated
  - Ownership that lasts for the duration of a person's lifetime
key: B
explanation: Fee simple absolute is the largest estate recognized by law, providing ownership of
  unlimited duration with the full bundle of rights, transferable during life, passing by will or
  descent, and subject only to government powers and existing encumbrances. The option describing
  ownership that ends automatically when a stated use stops refers to a fee simple determinable. The
  option describing ownership that lasts for the duration of a person's life refers to a life
  estate. The option describing ownership that can be lost if a stated condition is broken refers to
  a fee simple subject to a condition subsequent.
