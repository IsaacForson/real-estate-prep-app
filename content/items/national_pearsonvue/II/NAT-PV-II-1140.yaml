stem: A grantor signs a deed and hands it to the grantee, who states they do not want the property.
  The grantor later records the deed. When does title pass to the grantee?
options:
  - When the deed is recorded in the public records office.
  - When the grantor hands the deed to the grantee with intent to deliver.
  - When the grantor signs the deed and intends to transfer title.
  - When the grantee accepts the deed and thereby takes possession.
key: D
explanation: A valid deed requires delivery by the grantor and acceptance by the grantee during the
  grantor's lifetime. Mere signing and handing over the deed does not transfer title if the grantee
  refuses acceptance. Recording the deed does not cure the lack of acceptance. Therefore, title
  passes only upon acceptance.
