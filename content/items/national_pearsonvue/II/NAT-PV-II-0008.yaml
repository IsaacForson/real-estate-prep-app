stem: A deed conveys land "to the city so long as the land is used as a public park." The city later
  stops using the land as a park. Under the common-law rules of defeasible fees, what happens to
  title?
options:
  - Title returns to the grantor automatically without any action
  - The land escheats to the state after one year of nonuse as a park
  - Title remains with the city until a court orders forfeiture of the estate
  - The grantor must re-enter the land by physical possession to reclaim title
key: A
explanation: The phrase "so long as" creates a fee simple determinable, which ends automatically
  when the stated use stops; the grantor's possibility of reverter takes effect without any action.
  A right of re-entry that must be exercised arises only from conditional words like "but if," which
  create a fee simple subject to a condition subsequent.
citation:
  source: REP Ref. Ownership, Title & Transfer § 1.3
  url: null
  quoted_text: The estate lasts only "so long as," "while," or "during" a stated use continues, and it
    ends automatically when the use stops.
