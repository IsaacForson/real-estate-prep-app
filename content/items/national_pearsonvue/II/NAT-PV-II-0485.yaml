stem: A buyer purchases property and obtains an owner's title insurance policy. After closing, an
  undisclosed heir of a prior owner appears and claims ownership. What does the owner's title
  insurance policy cover in this situation?
options:
  - The policy covers losses from unpaid property taxes by buyer
  - The policy covers losses from zoning changes after policy date
  - The policy covers losses from undisclosed heirs
  - The policy covers losses from known liens not disclosed
key: C
explanation: A standard owner's title insurance policy covers losses from undisclosed heirs, as they
  are listed among the defects in the recorded chain that are covered. The option describing a known
  lien not disclosed is incorrect because the insured knew of it. The option referring to zoning
  changes after the policy date is incorrect because defects created after the policy date are
  excluded. The option concerning unpaid property taxes is incorrect because taxes not yet due or
  post-policy liabilities are excluded.
