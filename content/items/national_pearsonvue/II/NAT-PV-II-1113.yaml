stem: When a life estate is created with the language 'to A for life, then to C,' what interest does
  C hold?
options:
  - The interest known as a reversion.
  - The interest known as a right of re-entry.
  - The interest known as a remainder.
  - The interest known as a possibility of reverter.
key: C
explanation: Ownership, Title & Transfer states that when a deed names a third party ('to A for
  life, then to C'), C holds a remainder because a remainder is the future interest that follows a
  life estate and is created for a third‑party transferee. A reversion is the interest that remains
  with the grantor, not a third party. A right of re‑entry and a possibility of reverter are
  associated with fee simple determinable or fee simple subject to condition subsequent, not with a
  life estate.
citation:
  source: REP Ref. Ownership, Title & Transfer § 1.4
  url: null
  quoted_text: If the deed names a third party ('to A for life, then to C'), C holds a remainder and
    is the remainderman.
