stem: "A grantor signs a deed conveying land to a grantee, places it in a desk drawer, and dies a
  month later without ever handing it over or telling anyone. The grantee later finds the deed and
  claims the land. Under the requirements for a valid deed, the grantee's claim is:"
options:
  - Effective, because a deed need not be recorded or acknowledged to be valid
  - Not effective, because the deed was not acknowledged before a notary public
  - Not effective, because delivery and acceptance did not occur during the grantor's lifetime
  - Effective, because the grantor's signature shows present intent to transfer the land
key: C
explanation: A valid deed requires delivery by the grantor and acceptance by the grantee during the
  grantor's lifetime; a deed kept in the grantor's drawer was never delivered, so no title passed.
  The signature shows intent but cannot substitute for delivery, and the lack of acknowledgment is
  irrelevant to validity between the parties.
