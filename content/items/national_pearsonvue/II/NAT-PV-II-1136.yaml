stem: When a tax deed is issued after a tax sale, what warranties does it provide to the buyer?
options:
  - No warranties at all; the buyer receives the deed without any guarantee
  - Special warranty providing protection against defects occurring during the seller's ownership
  - General warranty offering full protection against all title defects
  - Bargain and sale deed with limited warranty against prior claims
key: A
explanation: The text explicitly says a tax deed carries no warranties, so the buyer receives no
  guarantee of title. The other options incorrectly attribute special, general, or limited
  warranties to a tax deed.
citation:
  source: REP Ref. Ownership, Title & Transfer § 12.2
