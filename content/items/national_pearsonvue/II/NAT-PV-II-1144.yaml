stem: When a lender sells real estate owned (REO) property that it acquired at its own foreclosure
  sale, which type of deed is commonly used for the conveyance?
options:
  - A general warranty deed
  - An officer's deed
  - A special warranty deed
  - A quitclaim deed
key: C
explanation: A lender that acquired the property through foreclosure conveys the property as an
  ordinary owner and typically provides only the limited warranty that covers title defects that
  arose during the lender’s ownership. Therefore, a special warranty deed is the usual instrument. A
  general warranty deed would cover defects that existed before the lender’s ownership, which is not
  standard for REO sales. A quit‑claim deed conveys no warranty, and an officer’s deed is not used
  in this context.
