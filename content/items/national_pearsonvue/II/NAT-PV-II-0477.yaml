stem: Under a notice statute, who prevails when a grantor conveys the same lot to Buyer A, who does
  **NOT** record, and then to Buyer B, who pays value, has no notice of A’s deed, and records later?
options:
  - The prevailing party is Buyer B, because a later bona fide purchaser for value without notice
    wins under a notice statute
  - The prevailing party is Buyer A, because the first deed creates the superior interest regardless
    of recording
  - The prevailing party is both buyers, because the grantor remains liable to each for breach of
    warranty
  - The prevailing party is neither buyer, because the grantor’s deed is void for double conveyance
key: A
explanation: Under a notice statute, a later bona fide purchaser for value without notice of the
  earlier interest wins even before recording. Buyer B paid value, had no notice, and recorded
  later, thus prevailing. The distractor that Buyer A prevails incorrectly assumes the first deed
  always wins, which is true only under a race statute, not a notice statute.
