stem: In states that recognize tenancy by the entirety, which statement is true?
options:
  - Each spouse owns an undivided one-half interest in the property
  - Each spouse owns the whole property and needs the other's signature to convey
  - Each spouse may devise their interest by will to a third party
  - Each spouse may encumber the property without the other's signature
key: B
explanation: In a tenancy by the entirety, each spouse holds the entire property, not a divided
  share, and neither spouse can transfer or encumber the property without the other's consent.
  Because of the right of survivorship, a spouse cannot leave their interest to a third party by
  will, and ownership is not split into halves.
