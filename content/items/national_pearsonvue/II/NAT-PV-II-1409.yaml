stem: A river suddenly changes course during a flood, moving the waterline onto what was previously
  dry land owned by a private owner. According to the rules described in the text, what is the
  effect on the property boundary?
options:
  - The boundary remains unchanged
  - The boundary shifts to the new river line
  - The boundary moves halfway to the new river
  - The boundary is altered by the flood
key: A
explanation: Under the avulsion rule, a sudden shift of land by flood or change of a stream's course
  generally does not move the boundary, so the original boundary stays where it was. The option
  claiming the boundary shifts to the new river line incorrectly assumes the boundary moves with
  avulsion, which the rule excludes.
