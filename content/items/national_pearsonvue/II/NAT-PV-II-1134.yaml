stem: A grantor executes a quitclaim deed to convey a parcel to a buyer, but the grantor never
  actually owned the parcel. What is the result?
options:
  - The grantee receives full title with warranties
  - The grantee receives only the grantor's future interest
  - The grantee receives nothing and has no recourse
  - The grantee must sue to perfect title
key: C
explanation: Under the quitclaim deed rule, if the grantor owns nothing, the grantee receives
  nothing and has no recourse. This directly applies to the scenario where the grantor lacks
  ownership. The option suggesting the grantee receives future interest is incorrect because a
  quitclaim deed conveys only whatever interest the grantor presently holds, not future interests.
