stem: On Monday, Owner conveys Lot to Buyer A, who does not record the deed. On Wednesday, Owner
  conveys the same Lot to Buyer B, who pays fair market value, has no actual or constructive
  knowledge of A's deed, and records the deed on Thursday. In a state that follows a notice statute,
  who owns the Lot?
options:
  - Buyer A, because recording gives constructive notice to subsequent purchasers
  - Buyer A, because they received the first deed and did not record it
  - Buyer B, because they are a bona fide purchaser for value without notice
  - Buyer B, only if they recorded before Buyer A and A remained unrecorded
key: C
explanation: Under a notice statute, a later bona fide purchaser for value without notice wins even
  before recording, so Buyer B prevails. The statement that recording gives constructive notice to a
  purchaser who lacks actual or constructive notice of the prior unrecorded deed is incorrect.
