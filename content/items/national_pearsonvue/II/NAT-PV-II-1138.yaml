stem: Under the REP Ref. Ownership, Title & Transfer guidelines, which statement is correct
  regarding the acknowledgment of a deed?
options:
  - It is required for the deed to be valid between grantor and grantee.
  - It must be witnessed by two disinterested parties before it is valid.
  - It is only necessary when the deed conveys a life estate interest.
  - It is required before the deed can be recorded in the public records.
key: D
explanation: Ownership, Title & Transfer guidelines state that acknowledgment is generally required
  to record a deed but is not required for the deed’s validity between the grantor and grantee.
