stem: When a tax deed is issued after a tax sale, what warranties does it provide to the buyer?
options:
  - No warranties are provided with the tax deed
  - Full general warranty covering all defects
  - Special warranty covering only seller's period
  - Warranty of title against prior liens
key: A
explanation: The tax‑sale section states that "A tax deed carries no warranties," so the buyer
  receives no warranties at all. The other choices incorrectly attribute various warranties that the
  tax deed does not contain.
