stem: Which of the following is **NOT** required for a deed to be valid between the grantor and grantee?
options:
  - The requirement of a legally competent grantor
  - The requirement of acknowledgment before a notary
  - The requirement of an adequate legal description
  - The requirement of words of conveyance
key: B
explanation: A valid deed requires a legally competent grantor, an identifiable grantee, words of
  conveyance, statement of consideration, adequate legal description, and delivery and acceptance.
  Acknowledgment is needed only for recording, not for validity between the parties. Therefore,
  acknowledgment before a notary is not required for validity.
