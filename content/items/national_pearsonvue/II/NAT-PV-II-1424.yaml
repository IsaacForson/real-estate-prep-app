stem: Under the provisions described, which type of deed carries no warranties whatsoever?
options:
  - Tax deed issued after sale
  - Executor or administrator deed
  - Special warranty deed
  - REO property deed issued
key: A
explanation: A tax deed carries no warranties; an executor's or administrator's deed provides
  warranties limited to the representative's own acts; a special warranty deed warrants only against
  defects arising during the grantor's ownership; and an REO property deed is not a distinct deed
  type that carries warranties. Therefore, only the tax deed carries no warranties at all.
citation:
