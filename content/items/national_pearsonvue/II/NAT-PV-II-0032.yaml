stem: Which type of deed warrants only against claims arising during the grantor's own period of
  ownership and gives no protection against defects created before the grantor took title?
options:
  - A quitclaim deed
  - A special warranty deed
  - A bargain and sale deed
  - A general warranty deed
key: B
explanation: A special warranty deed limits the covenants to the grantor's own period of ownership,
  warranting only against claims 'by, through, or under' the grantor. A general warranty deed is the
  tempting distractor, but it covers defects arising at any time in the chain of title, including
  before the grantor's ownership.
