stem: Which statement correctly describes a land trust?
options:
  - In a land trust, the trustee holds title while the beneficiary controls the beneficial interest
    treated as personal property.
  - In a land trust, the beneficiary holds title while the trustee manages the property and oversees
    administration for the beneficiary's benefit.
  - In a land trust, the trustee and beneficiary jointly hold title and share responsibility for
    managing the property.
  - In a land trust, the beneficial interest is personal property and the trustee has no ownership
    rights.
key: A
explanation: In a land trust, the trustee holds legal title while the beneficiary retains control
  and the beneficial interest is treated as personal property. The statement that the beneficiary
  holds title is incorrect because title remains with the trustee. The statement that trustee and
  beneficiary jointly hold title is incorrect because only the trustee holds title. The statement
  that the trustee has no ownership rights is incorrect because the trustee holds legal title.
