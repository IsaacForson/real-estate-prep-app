stem: In a real estate transaction, a seller conveys property using a deed that limits warranties to
  defects arising during the seller's own period of ownership. Which deed type is being used?
options:
  - General warranty deed
  - Special warranty deed
  - Bargain and sale deed
  - Quitclaim deed
key: B
explanation: The special warranty deed limits the grantor's warranties to claims arising during the
  grantor's own period of ownership, providing no protection for defects that existed before the
  grantor took title. This matches the description in the stem. The general warranty deed would
  warrant against defects at any time in the chain of title, which is broader than described.
citation:
