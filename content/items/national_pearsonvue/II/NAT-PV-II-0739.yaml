math:
  worked_solution: Sale price = $180,000; Shortfall = $20,000; Outstanding mortgage = Sale price +
    Shortfall = $180,000 + $20,000 = $200,000.
  formulas:
    - Outstanding mortgage = Sale price + Shortfall
