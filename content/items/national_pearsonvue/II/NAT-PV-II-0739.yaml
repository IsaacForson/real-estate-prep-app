stem: A distressed owner sells their home for $180,000, which is $20,000 less than the outstanding
  mortgage. The lender consents to the sale and will release its lien for the reduced payoff.
  According to the text, what disclosure is commonly required in this type of transaction?
options:
  - The seller must disclose that the sale requires lender approval
  - The seller must disclose that the buyer must pay the difference to the lender after closing
  - The seller must disclose that the buyer must obtain private mortgage insurance
  - The seller must disclose that the property is being sold 'as is' with no warranties
key: A
explanation: Disclosure that the sale requires lender approval is commonly required in short sales.
  The option stating that the buyer must pay the difference to the lender after closing is not a
  required disclosure. The option stating that the property is being sold 'as is' with no warranties
  is not a required disclosure. The option stating that the buyer must obtain private mortgage
  insurance is not a required disclosure.
citation:
  source: REP Ref. Ownership, Title & Transfer § 12.3
  url: null
  quoted_text: Disclosure that the sale requires lender approval is commonly required.
