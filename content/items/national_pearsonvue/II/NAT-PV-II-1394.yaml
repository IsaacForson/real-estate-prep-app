stem: A deed conveys property without any limiting language. Assuming no statutory modifications,
  what estate does the grantee receive?
options:
  - "Estate type: Fee simple absolute"
  - "Estate type: Fee simple determinable"
  - "Estate type: Fee simple subject to condition"
  - "Estate type: Life estate pur autre vie"
key: A
explanation: "Fee simple absolute is the largest estate recognized: ownership of unlimited duration
  with the full bundle of rights, transferable during life, passing by will or descent at death, and
  subject only to government powers and existing encumbrances. Unless a deed states otherwise, a
  conveyance is presumed to pass fee simple absolute."
