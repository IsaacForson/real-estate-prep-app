stem: A distressed owner sells a property for less than the mortgage balance with the lender's
  consent to release its lien. What type of sale is this?
options:
  - A foreclosure
  - A probate transfer
  - A short sale
  - A tax sale
key: C
explanation: A short sale is defined as a sale by a distressed owner for less than the mortgage
  balance, with the lender's consent to release its lien for the reduced payoff. It is a voluntary
  sale, not a foreclosure. A tax sale is enforced by a taxing authority, and a probate transfer is a
  court process.
