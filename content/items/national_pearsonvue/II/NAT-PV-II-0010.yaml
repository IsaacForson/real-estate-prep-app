stem: Marta's one-year lease ended on March 31. She remained in the apartment without the landlord's
  permission through April 10, when the landlord accepted her rent check for April. How is Marta's
  occupancy best classified after the landlord accepts the check?
options:
  - A tenancy at sufferance persisting until the landlord initiates formal eviction proceedings
  - A tenancy at will allowing the landlord to terminate the arrangement upon any notice
  - A periodic tenancy requiring proper notice to terminate
  - A tenancy for years automatically renewing for another full twelve-month period
key: C
explanation: A holdover tenant without consent is initially a tenant at sufferance, but when the
  landlord accepts rent, a periodic tenancy is created—here month to month—which continues until
  proper notice is given. The tenancy at sufferance ended once the landlord accepted the rent
  payment.
citation:
  source: REP Ref. Ownership, Title & Transfer § 2.2
  url: null
  quoted_text: A holdover tenant who stays after the lease ends without consent has possession but no
    right to it; the landlord may evict or, by accepting rent, create a periodic tenancy.
