stem: A buyer wants to close on a short sale property within 10 days. Based on the governing text,
  what is the most likely outcome?
options:
  - The closing will proceed on schedule as planned unless issues arise
  - The closing will occur after the lender approves the sale within the statutory period
  - The closing will occur after the buyer waives the lender approval contingency
  - The closing will likely be delayed due to lender review and documentation
key: D
explanation: Because lender approval can take weeks, a closing within 10 days is unlikely and will
  likely be delayed pending lender review. The distractor suggesting the closing will proceed on
  schedule ignores the weeks needed for lender approval.
