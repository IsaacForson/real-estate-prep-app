stem: If a river gradually deposits soil onto a landowner's bank, increasing the parcel's size, who
  owns the newly formed land?
options:
  - The owner of the opposite bank of the waterbody
  - The upland owner whose land borders the waterbody
  - The state holding title to all submerged lands
  - The federal government under navigational servitude
key: B
explanation: Accretion and reliction cause the adjoining landowner to gain title to the newly formed
  land. Therefore, the upland owner whose property borders the waterbody acquires the added soil.
  Assigning ownership to the opposite bank owner is incorrect because the rule gives the land to the
  owner on the side where the deposit occurs. Giving the land to the state or to the federal
  government is incorrect because the rule does not vest title in the state or federal government
  for accreted lands.
