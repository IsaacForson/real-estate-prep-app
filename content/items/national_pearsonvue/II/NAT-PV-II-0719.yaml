stem: On Day 1, Grantor G conveys Lot 1 to Buyer B1, who does not record the deed. On Day 2, G
  conveys the same Lot 1 to Buyer B2, who records the deed immediately. Assuming the jurisdiction
  follows a race recording act, who holds title to Lot 1?
options:
  - Title belongs to B1, who received the deed first.
  - Title belongs to B2, who recorded the deed first.
  - Title belongs to B1 and B2 as tenants in common.
  - Title belongs to G, who recorded the deed first.
key: B
explanation: Under a race statute, the first to record wins regardless of knowledge, so B2 holds
  title. The option stating that title belongs to G, who recorded the deed first, incorrectly
  focuses on who received the deed first, ignoring the recording requirement that determines
  priority under a race statute.
