stem: What is true about most special-purpose deeds?
options:
  - Inclusion of quitclaim language in the instrument
  - Requirement of recording for validity in state law
  - Presence of full warranty covenants in the deed
  - Lack of warranties beyond grantor's acts
key: D
explanation: Most special-purpose deeds carry no warranties beyond the grantor's own acts.
  Therefore, a statement that they lack warranties beyond the grantor's acts is correct. A statement
  that they contain full warranty covenants is incorrect because special-purpose deeds generally do
  not include those warranties. The other statements describe features that are not characteristic
  of most special-purpose deeds.
