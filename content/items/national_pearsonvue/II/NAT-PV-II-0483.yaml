stem: What does a special warranty deed limit the grantor's covenants to?
options:
  - The grantor warrants only against claims arising during the grantor's own ownership period
  - The grantor warrants only against claims arising before the grantor took title
  - The grantor warrants only against claims arising from any prior owner in the chain
  - The grantor warrants only against claims arising from the grantee's own actions
key: A
explanation: A special warranty deed limits the grantor's warranties to claims that arise during the
  grantor's own period of ownership, providing no protection for defects that existed before the
  grantor took title. The other options incorrectly describe warranties that are not limited to the
  grantor's period or describe the opposite of the rule.
