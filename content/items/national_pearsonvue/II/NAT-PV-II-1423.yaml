stem: In a notice jurisdiction, a seller conveys a lot to Buyer A, who does not record the deed.
  Later, the seller conveys the same lot to Buyer B, who pays fair market value, has no actual or
  constructive notice of A's deed, and records the deed promptly. Who owns the lot under the notice
  statute?
options:
  - Buyer A
  - Buyer B
  - The seller
  - Co-ownership
key: B
explanation: Under a notice statute, a later bona fide purchaser for value without notice (actual or
  constructive) of the earlier interest wins even before recording, so Buyer B prevails. The
  tempting distractor Buyer A incorrectly assumes the first deed always wins, ignoring the notice
  statute's protection for a subsequent BFP without notice.
