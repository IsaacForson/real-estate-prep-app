stem: Which of the following is **NOT** required for a deed to be valid between the grantor and grantee?
options:
  - The grantor must be legally competent.
  - The grantee must be identifiable.
  - The deed must include acknowledgment before a notary.
  - The deed must contain words of conveyance.
key: C
explanation: Acknowledgment is generally required to record a deed but is not necessary for the deed
  to be valid between the grantor and grantee. A legally competent grantor, an identifiable grantee,
  and words of conveyance are all required for validity.
