stem: Which of the following is **NOT** required for a deed to be valid between the grantor and grantee?
options:
  - It requires a legally competent grantor who signs the deed
  - It requires an adequate legal description
  - It requires words of conveyance showing present intent to transfer
  - It requires acknowledgment before a notary
key: D
explanation: Acknowledgment before a notary is needed to record a deed but is not required for the
  deed to be valid between the grantor and grantee. For validity between the parties, a deed must
  have a legally competent grantor who signs it, words that show present intent to transfer the
  property, and an adequate legal description.
