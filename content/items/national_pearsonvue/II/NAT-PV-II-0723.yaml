stem: Which type of deed includes an implied representation that the grantor holds title and
  possession but does **NOT** contain express warranties against encumbrances or defects?
options:
  - D. A quitclaim deed
  - B. A special warranty deed
  - A. A general warranty deed
  - C. A bargain and sale deed
key: D
explanation: A bargain and sale deed conveys title with an implied representation that the grantor
  holds title and possession, but without express warranties against encumbrances or defects, as
  stated in §6.5. A special warranty deed only warrants against claims arising during the grantor’s
  ownership and does not include the implied representation of holding title.
