stem: The habendum clause of a deed serves which purpose?
options:
  - It defines the estate granted and must agree with the granting clause
  - It reserves easements and mineral rights for the grantor's benefit
  - It declares before a notary that the grantor's signature is voluntary
  - It states the consideration paid by the grantee to the grantor
key: A
explanation: The habendum clause ('to have and to hold') defines the estate granted and must agree
  with the granting clause. Consideration appears in its own statement, the notary declaration is
  the acknowledgment, and easements and mineral rights are handled through exceptions and
  reservations.
