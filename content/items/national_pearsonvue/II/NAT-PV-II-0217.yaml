stem: A buyer is considering purchasing REO property from a lender. According to the text, which
  action should the buyer take to protect against undisclosed junior liens?
options:
  - To obtain a special warranty deed from the lender to ensure title
  - To request a quitclaim deed from the lender to avoid warranties
  - To rely on the lender's addenda to guarantee clear title status
  - To verify redemption period expired and junior liens cleared
key: D
explanation: The buyer should verify that any redemption period has run and junior liens were
  extinguished, as the text advises. The distractor about relying on the lender's addenda is
  incorrect because addenda do not guarantee clearance of junior liens.
