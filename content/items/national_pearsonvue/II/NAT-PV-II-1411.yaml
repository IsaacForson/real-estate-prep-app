stem: A buyer obtains a lender's title insurance policy on a mortgage loan of $210,000. What is the
  maximum amount the lender's policy will cover for a covered defect?
options:
  - $120,000
  - $210,000
  - $180,000
  - $60,000
key: B
explanation: A lender's title insurance policy protects the lender only up to the amount of the
  loan. The coverage limit is the original loan amount and decreases as the loan balance is paid
  down, ending when the loan is repaid. Therefore, for a loan of $210,000, the maximum amount the
  lender's policy will cover for a covered defect is $210,000.
