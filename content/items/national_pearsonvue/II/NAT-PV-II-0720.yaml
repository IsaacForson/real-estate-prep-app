stem: Under probate proceedings, what type of deed is typically used to convey real property from an
  estate?
options:
  - A general warranty deed
  - A special warranty deed
  - An administrator's deed
  - A simple quitclaim deed
key: C
explanation: During probate, real property is transferred by an executor's or administrator's deed,
  which typically provides no warranties beyond the representative's own acts. An administrator's
  deed matches this description. A special warranty deed is incorrect because it warrants against
  defects that arose during the grantor's ownership, which is not provided in probate conveyances.
