stem: What is a consequence of obtaining a tax deed when the property owner does **NOT** redeem the
  tax lien?
options:
  - The deed provides full warranty protection against all known and unknown title defects
  - The deed carries no warranties and title may require a quiet title action before it can be
    insured
  - The deed automatically conveys ownership that is free of any existing liens or encumbrances
  - The deed obligates the buyer to repay the overdue taxes to the taxing authority
key: B
explanation: A tax deed gives the buyer no warranties; the title may have defects and might need a
  quiet title action before it can be insured. Therefore, obtaining such a deed leaves the buyer
  with limited protection and possible title issues. The option stating that the deed provides full
  warranty protection is incorrect because the deed does not include any warranties.
