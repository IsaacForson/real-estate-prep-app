explanation: A deed of reconveyance is the instrument a trustee uses to return title when a
  deed‑of‑trust loan is repaid. The other deeds are used in foreclosure sales, sheriff sales, or tax
  sales and do not serve that purpose. (Ownership, Title & Transfer)
