stem: A grantor conveys property 'to my brother for life, then to my niece.' What interest does the
  niece hold?
options:
  - A right of re-entry
  - A remainder interest
  - A reversion interest
  - An executory interest
key: B
explanation: When a deed creates a life estate followed by a gift to a third party, that third party
  holds a remainder interest. A remainder is a future interest that becomes possessory after the
  natural termination of the preceding estate. A reversion, by contrast, returns the property to the
  grantor or the grantor’s heirs, not to a named third party.
