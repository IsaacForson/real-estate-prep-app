stem: On Monday, Owner conveys Lot X to Buyer A, who does not record the deed. On Wednesday, Owner
  conveys the same Lot X to Buyer B, who pays fair value, has no actual or constructive notice of
  A's deed, and records the deed on Thursday. In a state that follows a notice statute, who owns Lot
  X after recording?
options:
  - The owner of Lot X is Buyer A.
  - The owner of Lot X is Buyer B.
  - The owner of Lot X is both Buyer A and Buyer B.
  - The owner of Lot X is the original Owner.
key: B
explanation: Under a notice statute, a later bona fide purchaser for value without notice wins even
  before recording, so Buyer B owns the lot. The option stating that the owner is Buyer A
  incorrectly applies the race rule, which awards ownership to the first to record.
