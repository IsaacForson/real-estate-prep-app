stem: What is constructive notice in the context of real estate recording?
options:
  - Knowledge that arises only from recording a deed in the public records
  - Knowledge a person gains after investigating suspicious facts and circumstances
  - Knowledge a person in fact has from personal observation of the property
  - Knowledge that the law charges a person with because the information was available
key: D
explanation: Constructive notice is the legal presumption that a person is deemed to have knowledge
  of facts that are available to the public, such as a deed that has been properly recorded or open
  possession of the property. The law charges the person with that knowledge even though the person
  may not actually know it. This differs from actual notice, which requires personal knowledge of
  the fact. (Ownership, Title & Transfer reference)
citation:
  source: REP Ref. Ownership, Title & Transfer § 9.2
  url: null
  quoted_text: "Constructive notice is knowledge the law charges a person with, whether or not the
    person actually knows, because the information was available: everything properly recorded gives
    constructive notice, and so does open possession of the property by someone other than the
    record owner."
