stem: In a state that recognizes tenancy by the entirety, what happens to the property when one
  spouse dies?
options:
  - The property is held in trust for the deceased spouse's estate
  - The property automatically reverts to the original grantor
  - The surviving spouse becomes the sole owner
  - The deceased spouse's heirs inherit an equal share
key: C
explanation: Tenancy by the entirety includes a right of survivorship, meaning the surviving spouse
  becomes the sole owner upon the other's death. The other choices incorrectly describe inheritance
  by heirs, a trust arrangement, or reversion to the grantor, which do not apply to this form of
  ownership.
citation:
  source: REP Ref. Ownership, Title & Transfer § 4.4
  url: null
  quoted_text: Each spouse owns the whole; there is a right of survivorship; neither can convey or
    encumber the property without the other's signature
