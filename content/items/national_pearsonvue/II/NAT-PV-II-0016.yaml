stem: Which element is required for a deed to be valid between the grantor and grantee?
options:
  - Delivery and acceptance during the grantor's lifetime
  - A date and signature affixed by the grantor at execution
  - An acknowledgment by the grantor before a notary public
  - Recording of the deed in the county where the land is located
key: A
explanation: A valid deed requires delivery by the grantor and acceptance by the grantee during the
  grantor's lifetime. Acknowledgment is generally required only to record the deed, not for validity
  between the parties, and a deed need not be dated or recorded to be valid.
