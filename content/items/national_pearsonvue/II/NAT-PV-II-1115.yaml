stem: A homeowner fails to pay property taxes, and the taxing authority sells a tax certificate to
  an investor. The homeowner redeems the property within the statutory period. What does the
  investor receive?
options:
  - A tax deed conveying the property
  - The purchase price plus interest
  - A special warranty deed
  - The property subject to a quiet title action
key: B
explanation: Under the rules for tax sales, if the owner redeems within the statutory period, the
  investor is repaid with interest. The investor receives a tax deed only if the owner does not
  redeem. A tax deed carries no warranties, and a quiet title action is needed if the title is not
  yet insurable, but redemption results in repayment, not conveyance.
citation:
  source: REP Ref. Ownership, Title & Transfer § 12.2
  url: null
  quoted_text: In some states a tax certificate is sold to an investor who is repaid with interest if
    the owner redeems within the statutory period and who may obtain a tax deed if the owner does
