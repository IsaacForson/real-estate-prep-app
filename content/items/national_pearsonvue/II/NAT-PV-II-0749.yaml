stem: In a probate proceeding, what type of deed is typically used to transfer real property from
  the estate to the devisees or heirs?
options:
  - The executor's or administrator's deed
  - The warranty deed with full covenants
  - The quitclaim deed releasing all interest
  - The bargain and sale deed (no warranties)
key: A
explanation: In probate, real property is transferred by an executor's or administrator's deed,
  usually without warranties beyond the representative's own acts. A warranty deed with full
  covenants is not typical because probate deeds generally do not warrant against defects arising
  before the representative's tenure.
