stem: A buyer is considering purchasing a property that the lender acquired through foreclosure and
  now holds as REO. What should the buyer verify before closing?
options:
  - That redemption period has run and junior liens were extinguished
  - That the seller has a valid driver's license and liability insurance
  - That the property is zoned for residential use under local ordinance
  - That the property includes mineral rights, water access, and easements
key: A
explanation: A buyer purchasing REO property must verify that any redemption period has expired and
  that any junior liens have been extinguished; obtaining an owner's title policy is also advised.
  Verifying zoning is not a required step for REO purchases.
