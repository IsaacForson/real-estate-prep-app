stem: Which type of deed limits the grantor's warranties to claims arising 'by, through, or under'
  the grantor and provides no protection against defects created before the grantor took title?
options:
  - General warranty deed
  - Special warranty deed
  - Bargain and sale deed
  - Quitclaim deed, no warranty
key: B
explanation: Section 6.4 states that a special warranty deed limits covenants to the grantor's own
  period of ownership, warranting only against claims 'by, through, or under' the grantor and giving
  no protection against pre‑ownership defects. The general warranty deed is incorrect because it
  covers the entire chain of title.
