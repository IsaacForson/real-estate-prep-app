stem: What is a typical characteristic of the lender approval contingency in a short sale transaction?
options:
  - The lender approval can take several weeks to obtain
  - The lender approval requires a court order before proceeding
  - The lender approval is instantaneous and occurs at closing
  - The lender approval is waived by the buyer’s agent
key: A
explanation: Section 12.3 Short sales states that lender approval is a contingency that can take
  weeks. This reflects the typical delay in obtaining the lender’s consent to release its lien for a
  reduced payoff. The distractor claiming instantaneous approval contradicts the text, which notes
  the process can take weeks.
