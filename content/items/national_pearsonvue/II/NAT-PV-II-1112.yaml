stem: Which phrase creates a fee simple determinable under common-law rules?
options:
  - The phrase "provided that" creates a fee simple determinable.
  - The phrase "on condition that" creates a fee simple determinable.
  - The phrase "so long as" creates a fee simple determinable.
  - The phrase "but if" creates a fee simple determinable.
key: C
explanation: A fee simple determinable lasts only 'so long as,' 'while,' or 'during' a stated use
  continues and ends automatically when the use stops. Therefore, the phrase 'so long as' creates a
  determinable fee. The phrase 'but if' creates a fee simple subject to a condition subsequent,
  which requires the grantor to take action to retake the property.
citation:
  source: REP Ref. Ownership, Title & Transfer § 1.3
  url: null
  quoted_text: Fee simple determinable. The estate lasts only 'so long as,' 'while,' or 'during' a
    stated use continues, and it ends automatically when the use stops.
