stem: Before issuing a title insurance policy, what document must the insurer provide to the parties
  that lists the exceptions it will take and gives them an opportunity to cure problems?
options:
  - Title insurance commitment (binder)
  - Settlement statement
  - Affidavit of title
  - Deed of reconveyance
key: A
explanation: The title insurer must issue a commitment (binder) that lists the exceptions it will
  take, giving the parties a chance to cure problems before closing. The affidavit of title is a
  seller's sworn statement about marital status and absence of new liens, not the insurer's
  commitment.
