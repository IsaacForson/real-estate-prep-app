stem: What is marketable title?
options:
  - Title free from reasonable doubt
  - Title subject to undisclosed liens
  - Title exposing the buyer to litigation
  - Title perfect and free of any defects
key: A
explanation: Marketable title is defined as title free from reasonable doubt that a reasonably
  prudent buyer would accept, without undisclosed liens or encumbrances and without exposing the
  buyer to litigation. It need not be perfect. Therefore, the correct choice is title free from
  reasonable doubt. The other options either introduce defects or perfection, which contradict the
  definition.
