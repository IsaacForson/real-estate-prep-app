stem: "A seller owes $240,000 on a mortgage and has a $9,000 recorded judgment lien. The property
  sells for $360,000. To deliver title free of these liens, the settlement agent should:"
options:
  - Pay only the judgment lien because the mortgage is a voluntary lien
  - Pay both lienholders from the seller's proceeds and record the releases
  - Record a lis pendens so the buyer is protected against both creditors
  - Require the buyer to assume the mortgage and satisfy the judgment later
key: B
explanation: To deliver clear title, the settlement agent must satisfy all existing liens unless the
  buyer agrees to assume them. The agent obtains payoff statements for the mortgage and judgment
  lien, pays each from the sale proceeds, and records the releases. Assuming the mortgage would
  leave the lien on the property, and a lis pendens only gives notice of a lawsuit, it does not pay
  off the debt.
citation:
