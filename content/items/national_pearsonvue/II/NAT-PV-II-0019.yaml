math:
  worked_solution: "Step 1: Calculate total amount needed to satisfy liens: $240,000 (mortgage) +
    $9,000 (judgment lien) = $249,000.\\nStep 2: Compare to sale proceeds: $360,000 (sale price) -
    $249,000 (total liens) = $111,000 remaining for seller.\\nStep 3: Since proceeds exceed total
    liens, the settlement agent can pay both lienholders in full from the proceeds and record
    releases."
  formulas:
    - Total liens = Mortgage amount + Judgment lien amount
    - Net proceeds for seller = Sale price - Total liens
