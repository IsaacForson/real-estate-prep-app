stem: A lender acquires a property at its own foreclosure sale and holds it for resale. What is this
  property commonly called?
options:
  - A short sale
  - Real estate owned
  - A tax deed property
  - A probate transfer
key: B
explanation: Real estate owned (REO) is defined as property a lender acquired at its own foreclosure
  sale or by deed in lieu and now holds for resale. A short sale is a voluntary sale by a distressed
  owner, a probate transfer involves a court process, and a tax deed property results from a tax
  sale.
