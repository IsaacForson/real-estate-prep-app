stem: A grantor signs a deed and hands it to the grantee, but the grantee refuses to accept it. When
  does title pass?
options:
  - Delivery and acceptance by the grantee
  - Recording and delivering the deed
  - Payment and consideration of funds
  - Signing and delivering the deed
key: A
explanation: A deed is valid only when delivered by the grantor and accepted by the grantee during
  the grantor's lifetime. If the grantee refuses acceptance, there is no effective transfer of
  title, regardless of signing, recording, or consideration. Thus title passes only upon delivery
  and acceptance.
