stem: What type of deed does an executor or administrator typically use to convey real property
  after a probate proceeding?
options:
  - General warranty deed
  - Bargain and sale deed
  - Special warranty deed
  - Simple quitclaim deed
key: C
explanation: The statute explains that an executor’s deed is "usually without warranties beyond the
  representative's own acts," which matches a special warranty deed that only warrants the grantor’s
  own period of ownership. A bargain and sale deed provides no warranties, a general warranty deed
  covers all defects, and a quitclaim deed conveys no warranties at all, so they are incorrect.
