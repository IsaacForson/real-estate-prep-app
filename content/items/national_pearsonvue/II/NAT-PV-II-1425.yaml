stem: Which deed type is typically used to convey property in a short sale?
options:
  - Ordinary deed used in the transaction
  - Special warranty deed used in the transaction
  - Bargain and sale deed used in the transaction
  - Executor's or administrator's deed used in the transaction
key: A
explanation: In a short sale, the owner conveys the property by an ordinary deed. Special warranty,
  bargain and sale, and executor's or administrator's deeds are used in REO or probate transactions,
  not short sales.
