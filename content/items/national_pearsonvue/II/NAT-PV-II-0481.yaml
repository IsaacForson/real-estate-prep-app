stem: A grantor signs and delivers a deed to a grantee but does not acknowledge it before a notary.
  Which statement is true regarding the deed?
options:
  - The deed is invalid between the parties involved.
  - The deed cannot be recorded in the public records.
  - The deed must be re-signed by the grantor.
  - The deed is valid if acknowledged later.
key: B
explanation: Acknowledgment is generally required to record a deed but not for validity between the
  parties. Therefore, without acknowledgment the deed cannot be recorded, though it remains valid
  between grantor and grantee.
