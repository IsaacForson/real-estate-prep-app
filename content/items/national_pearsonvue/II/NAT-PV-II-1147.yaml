stem: What is required for a deed to be eligible for recording?
options:
  - The deed must include acknowledgment.
  - The deed must include a notary seal.
  - The deed must contain a legal description.
  - The deed must bear the grantor's signature.
key: A
explanation: Acknowledgment is generally required to record a deed, but it is not required for the
  deed to be valid between the parties. A deed need not be dated or recorded to be valid between the
  parties.
