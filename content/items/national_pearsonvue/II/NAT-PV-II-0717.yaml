stem: Under a quitclaim deed, which of the following statements is true?
options:
  - It does not pass title the grantor acquires later.
  - It guarantees the grantor owns the estate being conveyed.
  - It protects against defects before the grantor's ownership.
  - It includes a covenant that there are no encumbrances.
key: A
explanation: A quitclaim deed transfers only the interest the grantor currently holds in the
  property and does not include any warranties or guarantees about title. Consequently, it does not
  convey any title the grantor may acquire after the deed is delivered.
citation:
