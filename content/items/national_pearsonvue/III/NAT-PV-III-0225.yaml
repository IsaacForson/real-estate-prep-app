stem: Which of the following is **NOT** one of the four essential characteristics of economic value
  remembered as DUST?
options:
  - The utility characteristic of the property
  - The demand characteristic of the property
  - The liquidity characteristic
  - The scarcity characteristic of the property
key: C
explanation: The DUST framework for economic value consists of demand, utility, scarcity, and
  transferability. Liquidity is not part of this framework, so the option describing liquidity is
  not one of the four characteristics.
