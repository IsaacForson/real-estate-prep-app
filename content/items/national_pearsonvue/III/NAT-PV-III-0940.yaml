stem: A property has a market value of $500,000 and an assessed value of $275,000. What is the
  assessment ratio?
options:
  - 55 percent
  - 45 percent
  - 60 percent
  - 50 percent
key: A
explanation: The assessment ratio equals assessed value divided by market value times 100. 275,000 ÷
  500,000 = 0.55, or 55 percent. The other options result from incorrect division or subtraction.
citation:
  source: REP Ref. Valuation & Appraisal § 3.3
  url: null
  quoted_text: Assessed value is determined by a local assessor and is often a percentage of market
    value called the assessment ratio
