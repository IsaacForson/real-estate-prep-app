stem: When reconciling value indications from the sales comparison and cost approaches for a
  single-family residence, what does the appraiser do to arrive at a single opinion of value
  according to USPAP guidance?
options:
  - The appraiser averages the indications from both approaches
  - The appraiser selects the highest indication as the final value
  - The appraiser places the most weight on the most reliable approach
  - The appraiser chooses the sales comparison indication only
key: C
explanation: Reconciliation does not involve averaging the indications from the sales comparison and
  cost approaches. Instead, the appraiser evaluates the quantity and quality of the data supporting
  each approach, considers how well each approach fits the property type and the appraisal purpose,
  and checks for consistency among the indications. After this evaluation, the appraiser gives the
  greatest weight to the approach that is deemed most reliable and uses that weighted indication to
  form a single opinion of value.
