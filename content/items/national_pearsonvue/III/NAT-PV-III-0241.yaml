stem: When must a creditor provide the applicant with a copy of the appraisal for a first-lien loan
  secured by a dwelling?
options:
  - The creditor must provide the appraisal copy only after receiving a written request from the
    applicant for the appraisal document.
  - The creditor must provide the appraisal copy at the time of loan closing, and must also notify
    the applicant of this right within three business days of application.
  - The creditor must provide the appraisal copy three business days after the loan application,
    irrespective of appraisal timing.
  - The creditor must provide the appraisal copy promptly upon completion of the appraisal or three
    business days before consummation, whichever occurs earlier.
key: D
explanation: Regulation B (ECOA) requires the creditor to give the applicant a copy of any appraisal
  or written valuation for a first-lien loan secured by a dwelling promptly upon completion or three
  business days before consummation, whichever is earlier, and to notify the applicant of that right
  within three business days of application.
citation:
