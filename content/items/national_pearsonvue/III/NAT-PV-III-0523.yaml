stem: A comparable rental property has a gross rent multiplier of 118. If the subject property rents
  for $1,650 per month, what is the indicated value using the GRM?
options:
  - $195,300
  - $197,100
  - $196,500
  - $194,700
key: D
explanation: Value is calculated by multiplying the subject’s gross monthly rent by the gross rent
  multiplier. $1,650 × 118 = $194,700. Any other answer results from using an incorrect multiplier.
citation:
  source: REP Ref. Valuation & Appraisal § 9.6
  url: null
  quoted_text: Once a multiplier is extracted from comparable sales, value = subject's gross rent × multiplier.
  secondary: []
math:
  worked_solution: "Multiply monthly rent by GRM: $1,650 × 118 = $194,700."
