stem: A developer evaluates a vacant lot that is zoned for single‑family homes, is level with road
  access, and would produce a negative cash flow if built as homes. If the same lot could legally
  host a small office building, be physically suitable, generate a positive return, and provide the
  greatest land value among feasible uses, what is the lot’s highest and best use?
options:
  - The small office building commercial use
  - The single‑family residential dwelling use
  - The agricultural farming land use
  - The parking lot vehicle storage use
key: A
explanation: "Highest and best use must pass the four tests in order: legally permissible,
  physically possible, financially feasible, and maximally productive. The residential use fails the
  financial feasibility test, while the office building satisfies all four and yields the highest
  land value, making it the highest and best use."
citation:
  source: "REP Ref. Valuation & Appraisal — Reference note: value concepts, appraisal process, three
    approaches, CMA/BPO (authored, status: draft — needs licensed review) § 4.1"
  url: null
  quoted_text: "Highest and best use is the reasonably probable use of vacant land or an improved
    property that is legally permissible, physically possible, financially feasible, and maximally
    productive. The four tests are applied in that order: (1) legally permissible under zoning,
    private restrictions, and environmental law; (2) physically possible given size, shape, soil,
    topography, and access; (3) financially feasible, producing a positive return; (4) maximally
    productive, yielding the highest land value among feasible uses."
