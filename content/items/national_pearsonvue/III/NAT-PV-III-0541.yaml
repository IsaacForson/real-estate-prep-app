stem: A property has a market value of $480,000. The assessment ratio in the jurisdiction is 55
  percent. What is the assessed value?
options:
  - $264,000
  - $48,000
  - $216,000
  - $288,000
key: A
explanation: Assessed value is calculated by multiplying the market value by the assessment ratio
  expressed as a decimal. Here, 55% equals 0.55, and $480,000 × 0.55 = $264,000. The distractor
  $216,000 results from mistakenly using 45% instead of 55%.
citation:
  source: REP Ref. Valuation & Appraisal § 3.4
  url: null
  quoted_text: "A home has a market value of $320,000 and the county assesses at 40 percent: assessed
    value = 320,000 × 0.40 = $128,000."
  secondary: []
math:
  worked_solution: |-
    Convert assessment ratio to decimal: 55% ÷ 100 = 0.55
    Multiply market value by decimal: $480,000 × 0.55 = $264,000
  formulas:
    - assessed value = market value × assessment ratio
