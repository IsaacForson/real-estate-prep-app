stem: A luxury home is surrounded by older, smaller houses. Over time, the market value of the
  luxury home tends to decrease due to the influence of neighboring properties. Which principle
  explains this phenomenon?
options:
  - Progression
  - Contribution
  - Anticipation
  - Regression
key: D
explanation: Regression states that the value of a superior property is pulled down by inferior
  properties around it. The luxury home (superior) loses value because of the older, smaller houses
  (inferior) nearby. Progression would describe the opposite effect, while contribution and
  anticipation address different valuation concepts.
