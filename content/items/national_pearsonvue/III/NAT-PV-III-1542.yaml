stem: According to the worked example, what wording must a licensee include on a comparative market
  analysis to satisfy the disclosure requirement?
options:
  - The document must be labeled as an appraisal that meets USPAP.
  - The document must be labeled as a broker price opinion.
  - The document must be labeled as a CMA that is not an appraisal.
  - The document must be labeled as a market analysis without any disclaimer.
key: C
explanation: The worked example shows the licensee labels the document a CMA that is not an
  appraisal, indicating that this statement satisfies the disclosure requirement. Omitting it would
  fail to disclose that the CMA is not an appraisal. The other options either mislabel the document
  or omit the required statement.
