stem: What is a necessary condition for a valuation to be considered an appraisal?
options:
  - It must be prepared for a federally related transaction.
  - It must be developed by a state-licensed or state-certified appraiser.
  - It must be prepared without charge to the client.
  - It must include a written disclaimer that it is not an appraisal.
key: B
explanation: An appraisal must be developed by a state-licensed or state-certified appraiser; the
  other options describe conditions that are not required for an appraisal.
