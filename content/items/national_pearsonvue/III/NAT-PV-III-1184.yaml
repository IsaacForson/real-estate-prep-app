stem: For a single-family residence, which approach is typically given the most weight in reconciliation?
options:
  - The cost approach is typically given the most weight.
  - The income approach is typically given the most weight.
  - The sales comparison approach is typically given the most weight.
  - The gross rent multiplier method is typically given the most weight.
key: C
explanation: For houses and condominiums, the sales comparison approach is given the most weight,
  while the cost approach serves only as support. Therefore, in reconciliation the sales comparison
  approach carries the most weight. The claim that the cost approach is given the most weight is
  incorrect because the cost approach is only supportive.
