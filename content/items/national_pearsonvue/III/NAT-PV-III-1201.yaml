stem: An assessed value of $300,000 is reduced by a $20,000 exemption. The local tax rate is 30
  mills. What is the annual property tax?
options:
  - $8,400
  - $9,600
  - $10,500
  - $7,200
key: A
explanation: Using the formula Tax = (assessed value − exemptions) × mill rate ÷ 1,000, we compute
  (300,000‑20,000)=280,000; 280,000 × 30 ÷ 1,000 = $8,400. The other figures result from incorrect
  arithmetic or using the wrong rate.
citation:
  source: REP Ref. Valuation & Appraisal § 12.1
  url: null
  quoted_text: Tax = (assessed value − exemptions) × mill rate ÷ 1,000; one mill = $0.001 = $1 per $1,000.
  secondary: []
math:
  worked_solution: |-
    1. Assessed value minus exemptions: 300,000‑20,000 = 280,000
    2. Multiply by mill rate: 280,000 × 30 = 8,400,000
    3. Divide by 1,000: 8,400,000 ÷ 1,000 = 8,400
    4. Tax = $8,400
