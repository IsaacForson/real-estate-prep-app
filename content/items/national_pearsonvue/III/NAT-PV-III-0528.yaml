stem: According to the contribution principle, how is the value of a component determined?
options:
  - By the cost of comparable upgrades nearby
  - By the original purchase price plus closing fees
  - By its reproduction cost, disregarding market demand
  - By the amount it adds to or subtracts from value
key: D
explanation: The contribution principle states that a component's value is measured by how much it
  adds to or subtracts from the whole's value, not by its cost. Therefore, the correct answer
  describes the component's contribution as the amount it adds to or subtracts from total value. The
  distractor that focuses on replacement cost is incorrect because contribution is not based on what
  was spent.
