stem: A parcel is zoned for residential use, but it has no road access. According to the highest and
  best use tests, why is residential use **NOT** considered the highest and best use?
options:
  - The use fails the legal permissibility test
  - The use fails the physical possibility test
  - The use fails the financial feasibility test
  - The use fails the maximal productivity test
key: B
explanation: The correct answer is that residential use fails the physical possibility test due to
  lack of road access, which stops the highest and best use analysis at the physical possibility
  step. The distractor claiming it fails the legal permissibility test is incorrect because the
  parcel is zoned for residential use, making it legally permissible.
citation:
  source: "REP Ref. Valuation & Appraisal — Reference note: value concepts, appraisal process, three
    approaches, CMA/BPO (authored, status: draft — needs licensed review) § 4.1"
  url: null
  quoted_text: "Highest and best use is the reasonably probable use of vacant land or an improved
    property that is legally permissible, physically possible, financially feasible, and maximally
    productive. The four tests are applied in that order: (1) legally permissible under zoning,
    private restrictions, and environmental law; (2) physically possible given size, shape, soil,
    topography, and access; (3) financially feasible, producing a positive return; (4) maximally
    productive, yielding the highest land value among feasible uses."
