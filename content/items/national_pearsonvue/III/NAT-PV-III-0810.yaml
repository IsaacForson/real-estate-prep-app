stem: Two adjacent lots are valued at $80,000 and $90,000 respectively. After assemblage, the
  combined parcel is valued at $200,000. What is the plottage value resulting from the assemblage?
options:
  - $170,000
  - $200,000
  - $30,000
  - $10,000
key: C
explanation: "Plottage equals the assembled value minus the sum of the individual lot values:
  $200,000 - ($80,000 + $90,000) = $30,000. The $170,000 distractor incorrectly adds the two lot
  values instead of subtracting them from the assembled value."
citation:
  source: REP Ref. Valuation & Appraisal § 4.10
  url: null
  quoted_text: Plottage is the increase in total value when the combined parcel is worth more than the
    sum of its parts, usually because the larger tract supports a more productive use.
  secondary: []
math:
  worked_solution: |-
    Lot1 value = $80,000
    Lot2 value = $90,000
    Sum of lot values = $80,000 + $90,000 = $170,000
    Assembled parcel value = $200,000
    Plottage = Assembled value - Sum of lot values = $200,000 - $170,000 = $30,000
  formulas:
    - Plottage = Assembled value - (Lot1 value + Lot2 value)
