stem: How is accrued depreciation defined?
options:
  - The total loss in value from all causes as of the effective date, measured against cost new (per
    USPAP)
  - The annual depreciation expense allowed for income‑tax purposes (for tax reporting)
  - The cost to replace the improvements with modern materials and standards (replacement cost)
  - The difference between the property’s sale price and its assessed value (market vs assessed)
key: A
explanation: Accrued depreciation is the total loss in value from all causes as of the effective
  date, measured against cost new. It is an appraisal concept that is separate from the depreciation
  deduction used for income‑tax purposes. The option describing annual depreciation expense for
  income‑tax purposes is therefore incorrect. The option describing the cost to replace improvements
  with modern materials and standards refers to replacement cost, not accrued depreciation. The
  option describing the difference between sale price and assessed value relates to market versus
  assessed value, which is not the definition of accrued depreciation.
