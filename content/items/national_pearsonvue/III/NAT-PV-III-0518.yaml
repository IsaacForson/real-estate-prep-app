stem: According to the straight-line (economic age-life) method, what is the formula for accrued
  depreciation?
options:
  - Accrued depreciation = (total economic life ÷ effective age) × cost new
  - Accrued depreciation = (effective age ÷ total economic life) × cost new
  - Accrued depreciation = effective age × total economic life ÷ cost new
  - Accrued depreciation = cost new ÷ (effective age + total economic life)
key: B
explanation: Under the straight‑line (economic age‑life) method, accrued depreciation equals the
  effective age divided by the total economic life, multiplied by the cost when new. The valuation
  and appraisal reference provides this formula. The other choices are incorrect because they place
  the variables in the wrong order or use division incorrectly.
citation:
