explanation: The income approach is grounded in the principle of anticipation, meaning that expected
  future income is converted to a present‑value estimate. Substitution underlies the cost and
  sales‑comparison approaches, while contribution and competition are not identified as foundations
  of the income approach. (Valuation & Appraisal)
