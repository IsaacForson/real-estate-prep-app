stem: A parcel is zoned for multifamily housing (legally permissible), is flat with adequate soil
  (physically possible), and the projected rental income would cover construction costs (financially
  feasible), but constructing a single-family home would yield a higher land value than multifamily.
  According to the highest and best use tests, which test fails first?
options:
  - A. The legally permissible test
  - C. The physically possible test
  - B. The maximally productive test
  - D. The financially feasible test
key: C
explanation: "The highest and best use tests are applied in the order: legally permissible,
  physically possible, financially feasible, and maximally productive. Since the first three tests
  pass, the maximally productive test is the first that fails because a single-family home would
  yield higher land value."
citation:
  source: "REP Ref. Valuation & Appraisal — Reference note: value concepts, appraisal process, three
    approaches, CMA/BPO (authored, status: draft — needs licensed review) § 4.1"
  url: null
  quoted_text: "The four tests are applied in that order: (1) legally permissible under zoning,
    private restrictions, and environmental law; (2) physically possible given size, shape, soil,
    topography, and access; (3) financially feasible, producing a positive return; (4) maximally
    productive, yielding the highest land value among feasible uses."
