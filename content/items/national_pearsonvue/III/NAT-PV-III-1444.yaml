stem: A licensee emails an appraiser three recent sales and a list of the seller's upgrades, and
  also tells the appraiser that the deal will fall through unless the appraisal meets the contract
  price. Which part of the licensee's communication is prohibited under federal appraisal
  independence rules?
options:
  - Providing the appraiser with three recent sales.
  - Requesting the appraiser to verify the property's square footage.
  - Sharing the list of the seller's upgrades with the appraiser.
  - Informing the appraiser that funding depends on a high appraisal.
key: D
explanation: Providing recent sales and a list of upgrades is allowed, but telling the appraiser
  that the deal will fall through unless the appraisal meets the contract price is an attempt to
  influence the appraiser's value opinion, which is prohibited under federal appraisal independence
  rules.
