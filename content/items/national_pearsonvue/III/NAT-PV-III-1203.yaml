stem: According to the cost approach, what is the formula for estimating property value?
options:
  - Cost new of the improvements plus accrued depreciation minus land (site) value
  - Cost new of the improvements minus land (site) value plus accrued depreciation
  - Cost new of the improvements minus accrued depreciation plus land (site) value
  - Cost new of the improvements divided by accrued depreciation plus land (site) value
key: C
explanation: The cost approach estimates value by taking the cost new of the improvements,
  subtracting accrued depreciation, and then adding the land (site) value. An option that adds
  accrued depreciation instead of subtracting it would overstate the property's value.
