stem: Which entity is responsible for setting the minimum education, experience, and examination
  criteria for appraisers under the federal FIRREA framework?
options:
  - The Appraisal Subcommittee (ASC) sets the minimum education, experience, and examination
    criteria for appraisers.
  - The Appraisal Standards Board (ASB) sets the minimum education, experience, and examination
    criteria for appraisers.
  - The Appraiser Qualifications Board (AQB) sets the minimum education, experience, and examination
    criteria for appraisers.
  - The Federal Financial Institutions Examination Council (FFIEC) sets the minimum education,
    experience, and examination criteria for appraisers.
key: C
explanation: The AQB, part of The Appraisal Foundation, establishes the minimum education,
  experience, and examination criteria for appraisers under FIRREA. The ASC oversees state programs
  and the National Registry, the ASB writes USPAP, and the FFIEC is the parent council of the ASC.
