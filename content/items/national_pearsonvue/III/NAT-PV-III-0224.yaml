stem: Which of the following best defines 'value' as used in real estate appraisal?
options:
  - The most probable price a property should bring in a competitive open market
  - The present worth of the future benefits ownership is expected to deliver
  - The amount actually paid in a completed transaction for the property
  - The amount spent to create or acquire the improvements of the property
key: B
explanation: The correct answer defines value as the present worth of future benefits ownership is
  expected to deliver, which matches the definition in §1.1. The distractor describing the amount
  actually paid in a completed transaction defines price, not value. The distractor describing the
  amount spent to create or acquire improvements defines cost. The distractor describing the most
  probable price a property should bring defines market value, a specific type of value, not the
  general concept.
citation:
  source: "REP Ref. Valuation & Appraisal — Reference note: value concepts, appraisal process, three
