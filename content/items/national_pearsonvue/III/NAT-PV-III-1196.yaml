stem: A buyer's lender requires a valuation for a loan. The seller's broker provides a BPO prepared
  by a licensee using only active listings, while the lender also obtains an appraisal prepared by a
  licensed appraiser using closed sales. Which valuation satisfies the lender's regulatory
  requirement?
options:
  - The BPO prepared by the licensee using active listings
  - The AVM generated by a computer model using public records
  - The CMA prepared by the licensee using sold and active listings
  - The appraisal prepared by the licensed appraiser
key: D
explanation: The worked example notes that "only the appraisal satisfies the lender's regulatory
  requirement," indicating that an appraisal, not a BPO, meets the lender’s need. Hence the
  appraisal prepared by the licensed appraiser is the correct choice. The BPO alone does not satisfy
  the requirement.
