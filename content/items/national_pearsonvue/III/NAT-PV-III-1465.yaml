stem: A licensee is asked by a lender to prepare a broker price opinion (BPO) for a fee that will be
  used as the primary basis for determining the value of a residential mortgage on the consumer's
  principal dwelling. Under federal law, what is the correct statement regarding this situation?
options:
  - The licensee may prepare the BPO for a fee because state law governs BPO preparation and
    overrides federal restrictions
  - The licensee may not prepare the BPO for any purpose because federal law prohibits BPOs in
    residential mortgage transactions
  - The licensee may prepare the BPO for a fee, but the lender may not use it as the primary basis
    for determining value
  - The licensee may not use the BPO as the primary basis, but may prepare it for a fee only if the
    lender also obtains a full appraisal
key: C
explanation: Federal law prohibits using a BPO as the primary basis for determining value in
  residential mortgage transactions, but it leaves the preparation of a BPO for a fee to state law.
  Therefore the licensee may prepare it for a fee, while the lender may not rely on it as the
  primary basis.
citation:
  source: REP Ref. Valuation & Appraisal § 11.3
  url: null
  quoted_text: Federal law (12 U.S.C. § 3355, added by Dodd-Frank) provides that a BPO may not be used
    as the primary basis for determining value when originating a residential mortgage secured by
    the consumer's principal dwelling. Whether a licensee may prepare a BPO for a fee, and with what
    disclosures, varies by state; some states reserve paid BPOs to licensed appraisers.
