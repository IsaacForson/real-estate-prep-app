stem: A building has a replacement cost new of $320,000, an effective age of 12 years, a total
  economic life of 80 years, and a land value of $110,000. What is the indicated value using the
  cost approach (straight-line method)?
options:
  - $382,000.00
  - $430,000.00
  - $478,000.00
  - $158,000.00
key: A
explanation: Accrued depreciation is (12/80) × $320,000 = $48,000. Depreciated cost of improvements
  is $320,000 − $48,000 = $272,000. Adding land value gives $272,000 + $110,000 = $382,000.
citation:
  source: REP Ref. Valuation & Appraisal § 8.5
  url: null
  quoted_text: Accrued depreciation = (effective age ÷ total economic life) × cost new
  secondary: []
math:
  worked_solution: >-
    Step 1: Accrued depreciation = (effective age / total economic life) × cost new = (12 / 80) ×
    $320,000 = 0.15 × $320,000 = $48,000.

    Step 2: Depreciated cost of improvements = cost new − accrued depreciation = $320,000 − $48,000
    = $272,000.

    Step 3: Value indication = depreciated cost + land value = $272,000 + $110,000 = $382,000.
