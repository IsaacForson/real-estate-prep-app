stem: What is the definition of one mill in the property tax calculation formula?
options:
  - One mill equals $0.0001 per dollar of assessed value.
  - One mill equals $0.01 per dollar of assessed value.
  - One mill equals $0.001 per dollar of assessed value.
  - One mill equals $1 per $100 of assessed value.
key: C
explanation: One mill equals $0.001 per dollar of assessed value, which is equivalent to $1 for each
  $1,000 of assessed value. The claim that one mill equals $0.0001 per dollar of assessed value is
  incorrect because it is ten times too small. The claim that one mill equals $0.01 per dollar of
  assessed value is incorrect because it is ten times too large. The claim that one mill equals $1
  per $100 of assessed value is incorrect because it represents a rate of $10 per $1,000, which is
  ten times the correct mill rate.
