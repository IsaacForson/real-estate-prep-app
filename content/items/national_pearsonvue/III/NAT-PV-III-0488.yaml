stem: Which statement best reflects the principle of substitution in real estate valuation?
options:
  - The principle of substitution states that a buyer will not pay more for an existing property
    than it would cost to buy a similar site and build an equivalent structure without undue delay.
  - The principle of substitution states that a buyer's willingness to pay is unrelated to the cost
    of constructing a similar property.
  - The principle of substitution states that a buyer will pay less for an existing property than it
    would cost to buy a similar site and build an equivalent structure without undue delay.
  - The principle of substitution states that a buyer will pay more for an existing property than it
    would cost to buy a similar site and build an equivalent structure without undue delay.
key: A
explanation: The principle of substitution holds that a buyer will not pay more for an existing
  property than it would cost to acquire a comparable site and construct an equivalent building
  without undue delay. The option claiming that willingness to pay is unrelated to construction cost
  misstates the principle because value is tied to the cost of a substitute. The option stating that
  a buyer will pay less than the cost of a substitute incorrectly limits willingness to pay; the
  principle only sets an upper bound, not a lower one. The option asserting that a buyer will pay
  more than the cost of a substitute contradicts the principle, as it would exceed the value of a
  comparable substitute.
