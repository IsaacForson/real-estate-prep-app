stem: Which approach is considered the most reliable for houses, condominiums, and vacant land when
  adequate sales exist?
options:
  - Sales comparison approach
  - Cost approach to value
  - Gross rent multiplier approach
  - Income approach to value
key: A
explanation: The sales comparison (market data) approach is described as the most reliable approach
  for houses, condominiums, and vacant land when adequate sales exist. This makes it the correct
  choice. The cost approach, while useful for new or special-purpose properties, is not identified
  as the most reliable for those property types.
citation:
  source: REP Ref. Valuation & Appraisal § 7.1
  url: null
  quoted_text: The sales comparison (market data) approach estimates value by comparing the subject to
    similar properties that recently sold, adjusting the comparables' prices for differences, and
    reconciling the adjusted prices into a value indication. It rests on substitution and is the
    most reliable approach for houses, condominiums, and vacant land when adequate sales exist.
