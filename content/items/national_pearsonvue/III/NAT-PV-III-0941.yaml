stem: A builder constructs a single‑family home that is twice as large as neighboring houses in a
  uniform subdivision. Which principle explains why the home may **NOT** achieve value proportional
  to its cost?
options:
  - The contribution principle
  - The conformity principle
  - The anticipation principle
  - The substitution principle
key: B
explanation: The conformity principle states that value is maximized when a property is similar to
  surrounding properties; an oversized home may not gain value proportional to its cost. The other
  principles relate to value added by components, expected future benefits, or substitution with
  alternatives.
