stem: How is 'cost' defined in real estate appraisal?
options:
  - The amount spent to create or acquire improvements; it describes production rather than exchange
  - The most probable price a property should bring in a competitive open market under normal
    conditions
  - The present worth of the future benefits ownership is expected to deliver as of a specific date
  - The amount actually paid in a completed transaction for the property being appraised today
key: A
explanation: The definition of cost is the amount spent to create or acquire the improvements
  (materials, labor, overhead, profit); it describes production rather than exchange, as stated in
  §1.1. The other options describe value, price, and market value, which are distinct concepts.
