stem: A mortgage lender is originating a residential mortgage secured by the consumer's principal
  dwelling and is considering using a broker price opinion (BPO) as the primary basis for
  determining the property's value. Which statement is correct under federal law?
options:
  - The lender may use the BPO as the primary basis if the borrower consents in writing.
  - The lender may use the BPO as the primary basis for loans under $250,000.
  - The lender may not use the BPO as the primary basis for determining value.
  - The lender must supplement the BPO with a full appraisal before proceeding.
key: C
explanation: Federal law (12 U.S.C. § 3355, added by Dodd‑Frank) expressly prohibits using a BPO as
  the primary basis for value when originating a residential mortgage secured by the consumer's
  principal dwelling. The other options incorrectly permit or condition the use.
