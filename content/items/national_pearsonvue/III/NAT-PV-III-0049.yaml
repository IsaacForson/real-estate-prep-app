stem: A home has a market value of $250,000. The county assesses property at 50 percent of market
  value, and the owner qualifies for a $15,000 homestead exemption. The combined tax rate is 40
  mills. What is the annual property tax?
options:
  - $3,400
  - $4,600
  - $4,400
  - $5,000
key: C
explanation: Assessed value is $250,000 × 0.50 = $125,000; subtracting the $15,000 exemption leaves
  taxable value of $110,000. Tax equals $110,000 × 0.040 = $4,400. The $5,000 option results from
  forgetting to subtract the homestead exemption before applying the rate.
citation:
  source: REP Ref. Valuation & Appraisal § 3.3
  url: null
  quoted_text: Tax equals assessed value, less exemptions such as a homestead exemption, multiplied by
    the tax rate.
  secondary: []
math:
  worked_solution: Assessed value = 250,000 × 0.50 = 125,000. Taxable value = 125,000 − 15,000 =
    110,000. Rate = 40 mills = 0.040. Tax = 110,000 × 0.040 = 4,400.
  formulas:
    - assessed value = market value × assessment ratio
    - taxable value = assessed value − exemptions
    - tax = taxable value × tax rate
