stem: A licensee is appraising a newly constructed special-purpose property, such as a church.
  According to the guidance on which appraisal approach dominates, which approach should be given
  the most weight?
options:
  - The sales comparison approach
  - The cost approach (including land)
  - The income approach (for investments)
  - The gross rent multiplier method
key: B
explanation: For new construction and special-purpose properties, the cost approach (including land)
  is considered the most reliable and should be given the most weight. The sales comparison approach
  is less reliable for such properties because comparable sales are often unavailable.
