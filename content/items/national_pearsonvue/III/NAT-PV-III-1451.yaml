stem: Under the residential exemption from the appraisal requirement, what is the maximum property
  value for which a federally regulated bank is **NOT** required to obtain an appraisal from a
  state-licensed or state-certified appraiser?
options:
  - $400,000
  - $500,000
  - $250,000
  - $300,000
key: A
explanation: The residential exemption applies when the property value does not exceed $400,000; if
  the value is greater than $400,000, the exemption does not apply and the bank must obtain an
  appraisal from a state-licensed or state-certified appraiser.
