stem: A lender discovers that an appraiser accepted a fee from the lender without disclosing it.
  What must the lender do under federal appraisal independence rules?
options:
  - Reporting the appraiser to the state licensing agency
  - Negotiating a lower fee directly with the appraiser
  - Using the appraisal despite an undisclosed fee
  - Seeking a second opinion from another licensed appraiser
key: A
explanation: The key is correct because the lender must report an appraiser who has committed a
  material violation, such as failing to disclose a fee received from the lender (§ 6.4). The
  distractor “Using the appraisal despite an undisclosed fee” is incorrect because continuing to
  rely on the appraisal does not satisfy the lender’s duty to report the violation.
