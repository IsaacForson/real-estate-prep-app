stem: A buyer is considering purchasing a vacant lot near a planned light‑rail station. The buyer
  expects the station to increase foot traffic and thus raise the lot’s future rental income. The
  buyer is willing to pay more than the current market price for similar lots without the station.
  Which principle explains the buyer’s willingness to pay a premium based on expected future
  benefits?
options:
  - Anticipation
  - Substitution
  - Contribution
  - Regression
key: A
explanation: Anticipation holds that value is created by the expectation of future benefits such as
  income or amenities, which matches the buyer’s willingness to pay more for the lot due to the
  expected light‑rail station. Substitution is incorrect because it limits a buyer’s payment to the
  cost of acquiring an equally desirable substitute, not to expected future benefits.
