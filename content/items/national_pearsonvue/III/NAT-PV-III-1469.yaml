stem: Under federal law added by Dodd-Frank, a broker price opinion (BPO) may **NOT** be used as the
  primary basis for determining value when originating which type of loan?
options:
  - A loan for construction of a new residential property
  - A loan for commercial real estate investment
  - A loan secured by the consumer's principal dwelling
  - A loan for land acquisition only
key: C
explanation: The federal law explicitly states that a BPO may not be the primary basis for valuing a
  residential mortgage secured by the consumer's principal dwelling. This restriction does not apply
  to commercial loans or land-only loans. Therefore, the correct answer is the residential mortgage
  secured by the consumer's principal dwelling.
