stem: An investor spends $25,000 on a kitchen remodel that increases property value by $22,000.
  Later, they spend an additional $15,000 on luxury finishes that increase value by only $3,000.
  Which principle explains why the second investment yielded a smaller increase in value per dollar
  spent?
options:
  - The principle of substitution in market valuation.
  - The principle of anticipation in market value.
  - The principle of conformity in residential real estate.
  - The principle of increasing and decreasing returns.
key: D
explanation: Added investment raises value only up to a point, after which each added dollar returns
  less than a dollar, which is the principle of increasing and decreasing returns. This principle
  accounts for the diminishing return on the second investment. The distractor invoking substitution
  incorrectly refers to a buyer’s limit based on comparable substitutes, not to diminishing returns.
