math:
  worked_solution: "First investment: $22,000 increase ÷ $25,000 spent = 0.88 (88% return). Second
    investment: $3,000 increase ÷ $15,000 spent = 0.20 (20% return). The second investment yields a
    lower return per dollar spent."
  formulas:
