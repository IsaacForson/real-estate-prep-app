stem: Under the federal framework created by FIRREA, which body writes the Uniform Standards of
  Professional Appraisal Practice (USPAP)?
options:
  - The Appraisal Standards Board of The Appraisal Foundation
  - The Appraiser Qualifications Board of The Appraisal Foundation
  - The Appraisal Subcommittee of the FFIEC
  - The licensing agency of each individual state
key: A
explanation: Title XI of FIRREA recognized The Appraisal Foundation, whose Appraisal Standards Board
  (ASB) writes USPAP, while the Appraiser Qualifications Board sets education, experience, and
  examination criteria. The Appraisal Subcommittee oversees state programs and maintains the
  National Registry; it does not write USPAP.
