stem: A building has replacement cost new of $600,000. The appraiser estimates an effective age of 8
  years and a total economic life of 40 years. Land value is $150,000. Using the straight-line
  method, what is the indicated value?
options:
  - $750,000
  - $630,000
  - $480,000
  - $870,000
key: B
explanation: Under the straight-line method, accrued depreciation equals (effective age ÷ total
  economic life) × cost new. Subtracting depreciation from cost new and adding land value yields the
  indicated value. The distractor $750,000 omits depreciation, while $480,000 fails to add land
  value.
citation:
  source: REP Ref. Valuation & Appraisal § 8.1
  url: null
  quoted_text: Cost approach value = cost new of the improvements − accrued depreciation + land (site) value.
  secondary: []
math:
  worked_solution: >-
    Step 1: Annual depreciation = cost new ÷ total economic life = $600,000 ÷ 40 = $15,000 per year.

    Step 2: Accrued depreciation = effective age × annual depreciation = 8 × $15,000 = $120,000.

    Step 3: Depreciated cost of improvements = cost new − accrued depreciation = $600,000 − $120,000
    = $480,000.

    Step 4: Indicated value = depreciated cost + land value = $480,000 + $150,000 = $630,000.
  formulas:
    - Cost approach value = cost new − accrued depreciation + land value
    - Accrued depreciation = (effective age ÷ total economic life) × cost new
