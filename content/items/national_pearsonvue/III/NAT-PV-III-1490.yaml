stem: Under the appraisal independence rules added to the Truth in Lending Act by the Dodd‑Frank
  Act, what must a lender do if an appraiser materially violates applicable standards?
options:
  - Reporting the appraiser to the state licensing agency
  - Adjusting the appraisal value to match the loan amount
  - Informing the borrower that the appraisal will be revised
  - Requesting a second appraisal from a different appraiser
key: A
explanation: The key is correct because the Dodd‑Frank amendment to TILA requires lenders to report
  appraisers who materially violate applicable standards to the state licensing agency (§ 6.4). The
  most tempting distractor, “Providing the borrower with a copy of the appraisal,” relates to
  Regulation B (ECOA) disclosure duties, not the independence‑violation reporting requirement.
