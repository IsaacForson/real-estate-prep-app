stem: Under federal regulations, what is the maximum value of a commercial federally related
  transaction for which a federally regulated bank is **NOT** required to obtain an appraisal from a
  state-licensed or state-certified appraiser?
options:
  - $400,000
  - $500,000
  - $250,000
  - $750,000
key: B
explanation: The federal appraisal threshold for commercial federally related transactions is
  $500,000 or less, meaning banks need not obtain a licensed or certified appraisal for transactions
  at or below this amount. The $400,000 figure applies to residential transactions, not commercial.
  The $250,000 and $750,000 amounts are not the current thresholds.
