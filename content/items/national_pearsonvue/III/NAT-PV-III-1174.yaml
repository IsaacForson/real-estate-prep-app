stem: A parcel is zoned for multifamily housing, physically suitable for construction, and legally
  permissible, but the projected rental income would not cover construction costs. According to the
  highest and best use tests, which test fails first?
options:
  - Legally permissible
  - Physically possible
  - Maximally productive
  - Financially feasible
key: D
explanation: "The highest and best use tests are applied in the order: legally permissible,
  physically possible, financially feasible, then maximally productive. The parcel meets the legally
  permissible and physically possible tests, but the projected rental income would not cover
  construction costs, so it fails the financial feasibility test. Because it fails at that point,
  the maximally productive test is not reached."
