stem: An appraiser is using the straight-line method to estimate accrued depreciation. The
  improvements have a cost new of $260,000, effective age of 12 years, and total economic life of 40
  years. What is the accrued depreciation?
options:
  - $78,000
  - $52,000
  - $104,000
  - $65,000
key: A
explanation: Accrued depreciation = (effective age ÷ total economic life) × cost new = (12/40) ×
  $260,000 = 0.3 × $260,000 = $78,000. The distractors result from using incorrect fractions or
  misapplying the formula.
citation:
  source: REP Ref. Valuation & Appraisal § 8.5
  url: null
  quoted_text: Accrued depreciation = (effective age ÷ total economic life) × cost new; equivalently,
    annual depreciation = cost new ÷ total economic life.
  secondary: []
math:
  worked_solution: "Effective age / total economic life = 12 / 40 = 0.3. Multiply by cost new: 0.3 ×
    $260,000 = $78,000."
