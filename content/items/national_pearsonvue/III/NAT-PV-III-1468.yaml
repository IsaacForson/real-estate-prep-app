stem: Under Regulation B (ECOA), a creditor must both (1) provide the applicant a copy of the
  appraisal and (2) notify the applicant of the right to receive that copy. Which statement
  accurately describes how the timing of these two obligations is determined?
options:
  - The timing of both obligations is tied to the consummation date, with the copy due three
    business days before and notice due three business days after under Regulation B (ECOA).
  - The copy must be provided promptly upon completion or three business days before consummation,
    whichever is earlier; notice must be given within three business days of application under
    Regulation B (ECOA).
  - The copy must be provided three business days before consummation, while notice is fixed at
    three business days after application under Regulation B (ECOA).
  - The timing of both obligations is fixed at three business days after the application date under
    Regulation B (ECOA).
key: B
explanation: Under Regulation B (ECOA), the creditor must give the applicant a copy of the appraisal
  either as soon as it is completed or three business days before the loan is consummated, whichever
  occurs first. The creditor must also inform the applicant of the right to receive that copy within
  three business days after the application is submitted. The correct answer reflects both of these
  timing requirements.
