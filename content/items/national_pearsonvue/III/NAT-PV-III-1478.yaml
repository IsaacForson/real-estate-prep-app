stem: A licensee prepares a CMA for a seller and gives it to the seller's lender but forgets to
  include the required statement. What must the licensee have added to comply?
options:
  - The licensee should have included a statement that the CMA is not an appraisal.
  - The licensee should have included a statement that the CMA relies on recent sales.
  - The licensee should have included a statement that the CMA meets USPAP standards.
  - The licensee should have included a statement that the CMA replaces a formal appraisal.
key: A
explanation: The scenario describes an omitted disclosure; the worked example shows that the
  required statement is that the CMA is not an appraisal. The distractor about USPAP standards
  incorrectly attributes appraisal standards to a CMA.
