stem: Why does cost depart from value?
options:
  - The market does not reimburse spending it does not want in appraisal analysis today.
  - Cost often exceeds value due to labor, materials, and overhead in construction projects.
  - Value is determined solely by the price paid in the last transaction per lay opinion.
  - Cost reflects the present worth of future benefits ownership expects to deliver.
key: A
explanation: Cost departs from value because the market does not reimburse spending it does not
  want; for example, an expensive feature may add far less to value than its cost. The option
  stating that the market does not reimburse spending it does not want in appraisal analysis today
  correctly captures this idea. The option claiming cost often exceeds value due to labor,
  materials, and overhead misstates the reason; the rule is about market reimbursement, not about
  cost exceeding value. The option saying value is determined solely by the price paid in the last
  transaction per lay opinion misrepresents value, which is based on the present worth of future
  benefits, not just past price. The option stating cost reflects the present worth of future
  benefits ownership expects to deliver confuses cost with value; that description defines value,
  not cost.
