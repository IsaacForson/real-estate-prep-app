stem: A comparable office building sold for $2,400,000 with annual gross income of $240,000. If the
  subject property has annual gross income of $192,000, what is the indicated value using the gross
  income multiplier (GIM)?
options:
  - The indicated value is $1,920,000,000.
  - The indicated value is $192,000.
  - The indicated value is $1,920,000.
  - The indicated value is $19,200.
key: C
explanation: The GIM is sale price divided by gross annual income ($2,400,000 ÷ $240,000 = 10).
  Multiplying the GIM by the subject’s annual gross income (10 × $192,000) yields $1,920,000. The
  distractor that results from dividing income by the GIM confuses the formula.
citation:
  source: REP Ref. Valuation & Appraisal § 9.6
  url: null
  quoted_text: The gross income multiplier (GIM), used for larger commercial or multifamily
    properties, is sale price ÷ gross annual income.
  secondary: []
math:
  worked_solution: |-
    GIM = $2,400,000 ÷ $240,000 = 10.0
    Indicated value = 10.0 × $192,000 = $1,920,000
  formulas:
    - GIM = Sale Price / Gross Annual Income
    - Indicated Value = GIM × Subject Gross Annual Income
