stem: Under federal appraisal independence rules, which of the following actions by a licensee is
  permitted when communicating with an appraiser?
options:
  - Telling the appraiser that the loan will not fund unless the appraisal meets the contract price
  - Requesting the appraiser to use a specific comparable that the licensee prefers
  - Emailing the appraiser three recent sales and a list of the seller's upgrades
  - Advising the appraiser to adjust the valuation upward to secure a higher loan amount
key: C
explanation: The text explicitly states that emailing the appraiser three recent sales and a list of
  the seller's upgrades is permitted. The other options describe attempts to influence the
  appraiser's value opinion, which are prohibited under the same rules.
