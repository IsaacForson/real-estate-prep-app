math:
  worked_solution: >-
    Step 1: Determine bath difference: Subject baths = 2, Comparable baths = 2.5 → Difference = 2 –
    2.5 = –0.5 baths. Convert to half‑baths: –0.5 baths × 2 half‑baths per bath = –1 half‑bath.
    Adjustment = –1 × $3,000 per half‑bath = –$3,000.

    Step 2: Determine garage difference: Subject garage bays = 2, Comparable garage bays = 1 →
    Difference = 2 – 1 = +1 bay. Adjustment = +1 × $8,000 per bay = +$8,000.

    Step 3: Net adjustment = –$3,000 + $8,000 = +$5,000.
  formulas:
    - Adjustment per feature = (Subject quantity – Comparable quantity) × Unit adjustment value
    - Net adjustment = Σ Adjustments
