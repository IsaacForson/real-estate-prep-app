stem: A subject property has two baths and a two-car garage. A comparable property sold for $300,000
  and has two and one-half baths and a one-car garage. Using market-derived adjustments of $3,000
  per half bath and $8,000 per garage bay, what is the net adjustment to the comparable's price?
options:
  - Add $8,000
  - Subtract $3,000
  - Add $5,000
  - Subtract $5,000
key: C
explanation: When a comparable has a feature the subject lacks (the comparable is superior), its
  price is adjusted downward; when it lacks a feature the subject has (the comparable is inferior),
  its price is adjusted upward. The subject has two full baths while the comparable has two and
  one‑half baths, making the comparable superior by one half bath (‑$3,000). The subject has a
  two‑car garage while the comparable has a one‑car garage, making the comparable inferior by one
  garage bay (+$8,000). Adding the adjustments gives a net adjustment of +$5,000.
citation:
  source: REP Ref. Valuation & Appraisal § 7.3
  url: null
  quoted_text: If a comparable has a feature the subject lacks (comparable superior), its price is
    adjusted downward; if it lacks a feature the subject has (comparable inferior), its price is
    adjusted upward.
