stem: In the context of real estate valuation, how is plottage value calculated?
options:
  - Add the value of the assembled parcel to the sum of the separate parcel values
  - Multiply the sum of the separate parcel values by the value of the assembled parcel
  - Subtract the value of the assembled parcel from the sum of the separate parcel values
  - Subtract the sum of the separate parcel values from the value of the assembled parcel
key: D
explanation: Under the standard valuation formulas, plottage value is defined as the value of the
  assembled parcel minus the sum of the values of the separate parcels. This calculation isolates
  the value added by combining the sites. The other options incorrectly invert the subtraction or
  use addition and multiplication, which do not yield the incremental value of assemblage.
