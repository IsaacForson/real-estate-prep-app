stem: A vacant parcel is physically suitable for a factory, but local zoning prohibits industrial
  use. According to the highest and best use tests, which test fails first?
options:
  - Physically possible
  - Financially feasible
  - Maximally productive
  - Legally permissible
key: D
explanation: "The highest and best use analysis applies tests in order: first legally permissible,
  then physically possible, financially feasible, and maximally productive. Because zoning prohibits
  industrial use, the legally permissible test fails first, preventing further evaluation."
citation:
  source: "REP Ref. Valuation & Appraisal — Reference note: value concepts, appraisal process, three
    approaches, CMA/BPO (authored, status: draft — needs licensed review) § 4.1 Highest and best
    use"
  url: null
  quoted_text: "The four tests are applied in that order: (1) legally permissible under zoning,
    private restrictions, and environmental law; (2) physically possible given size, shape, soil,
    topography, and access; (3) financially feasible, producing a positive return; (4) maximally
    productive, yielding the highest land value among feasible uses."
