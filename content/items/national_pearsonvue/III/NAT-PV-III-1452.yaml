stem: A lender is originating a residential mortgage secured by a consumer's principal dwelling and
  wants to use a broker price opinion (BPO) as the primary basis for determining the property's
  value. Which statement is correct under federal law?
options:
  - The BPO may be used as the primary basis for determining value because it is less costly than an
    appraisal.
  - The BPO may not be used as the primary basis for determining value under federal law.
  - The BPO may be used as the primary basis for determining value with the borrower's written
    consent.
  - The BPO may be used as the primary basis for determining value only for loan modifications.
key: B
explanation: Federal law prohibits using a BPO as the primary basis for determining value when
  originating a residential mortgage secured by the consumer's principal dwelling.
