stem: "According to the federal banking agencies' appraisal regulations, market value is best
  defined as:"
options:
  - The total expenditures incurred to construct the improvements on a parcel, including materials,
    labor, overhead, and profit, without regard to whether the market reimburses those costs, and
    excluding land value.
  - The highest price a property could bring in a competitive market assuming the buyer and seller
    are acting prudently and knowledgeably, with no undue stimulus affecting the price, and
    reflecting typical motivation of the parties.
  - The historical amount actually paid for a property in a completed transaction, regardless of the
    buyer’s motivation, seller’s urgency, or market conditions at the time of sale, and not intended
    to indicate future market trends.
  - The most probable price a property should bring in a competitive and open market under all
    conditions requisite to a fair sale, the buyer and seller each acting prudently and
    knowledgeably, and assuming the price is not affected by undue stimulus.
key: D
explanation: The definition of market value from the federal banking agencies' appraisal regulations
  emphasizes the most probable price in a competitive market with prudent, knowledgeable parties and
  no undue stimulus. The other options describe highest price, historical price, or cost, which do
  not match the regulatory definition.
