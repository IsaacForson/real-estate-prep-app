stem: Under federal law, which individual meets the requirement to perform an appraisal for a
  federally related transaction exceeding $400,000?
options:
  - A real estate salesperson holding an active license
  - A state-licensed or state-certified appraiser
  - A mortgage loan officer employed by the bank
  - A property tax assessor for the local jurisdiction
key: B
explanation: When a federally related transaction exceeds $400,000, the residential exemption does
  not apply and federal law requires the bank to obtain an appraisal from a state-licensed or
  state-certified appraiser. Therefore, only an individual with that credential meets the
  requirement. The other individuals—a real estate salesperson holding an active license, a mortgage
  loan officer employed by the bank, and a property tax assessor for the local jurisdiction—do not
  have the required appraisal credential.
