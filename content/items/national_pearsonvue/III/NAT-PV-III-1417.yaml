stem: What distinguishes replacement cost from reproduction cost?
options:
  - The cost to build a structure of equivalent utility using current materials, design, and
    standards.
  - The cost to build an exact duplicate with the same materials, design, and workmanship.
  - The cost to build a structure using historical materials, original workmanship, and outdated
    design.
  - The cost to build a structure excluding land value, entrepreneurial profit, and indirect costs.
key: A
explanation: Replacement cost is the cost to build a structure of equivalent utility using current
  materials, design, and standards. The option describing the cost to build an exact duplicate with
  the same materials, design, and workmanship describes reproduction cost, which is not replacement
  cost.
