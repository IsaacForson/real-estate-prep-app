stem: A comparable rental property sold for $300,000 with a monthly rent of $2,000. A comparable
  office building sold for $1,800,000 with an annual gross income of $150,000. The subject property
  rents for $2,200 per month and has an annual gross income of $130,000. Which valuation method
  yields the higher indicated value for the subject property?
options:
  - The GRM method results in a higher value estimate.
  - Both methods result in the same value estimate.
  - Neither method can be used for this property.
  - The GIM method results in a higher value estimate.
key: D
explanation: GRM = $300,000 ÷ $2,000 = 150; GRM value = $2,200 × 150 = $330,000. GIM = $1,800,000 ÷
  $150,000 = 12; GIM value = $130,000 × 12 = $1,560,000. Since $1,560,000 > $330,000, the GIM method
  gives the higher estimate. The GRM option is incorrect because it undervalues the subject relative
  to the income approach.
