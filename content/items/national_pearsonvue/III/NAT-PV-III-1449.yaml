stem: A buyer contracts to purchase a home for $436,000 with a conventional loan from a federally
  regulated bank. The appraisal comes in at $425,000. What must the bank do under Regulation B?
options:
  - The bank must provide both parties a copy of the appraisal
  - The bank must take no action because the appraisal is below the contract price
  - The bank must provide the borrower a copy of the appraisal
  - The bank must provide the seller a copy of the appraisal
key: C
explanation: The worked example explains that if the appraisal comes in at $425,000, the bank must
  give the borrower a copy under Regulation B, allowing the parties to renegotiate, increase the
  down payment, or invoke an appraisal contingency. Providing the copy to the borrower is the
  required action; giving it to the seller or taking no action is not correct under the rule.
