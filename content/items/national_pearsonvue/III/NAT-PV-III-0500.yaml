stem: In real estate appraisal, how is "price" defined?
options:
  - The amount actually paid in a completed transaction
  - The present worth of future benefits ownership is expected
  - The amount spent to create or acquire the improvements
  - An opinion of value stated as of a specific date in appraisal
key: A
explanation: Price is defined as the amount actually paid in a completed transaction, which is a
  historical fact. The option describing the present worth of future benefits defines value, not
  price.
