stem: A licensee prepares a Broker Price Opinion (BPO) for a loan secured by a non‑owner‑occupied
  rental property. The lender intends to use the BPO as the primary basis for determining the
  property's value. Under federal law added by Dodd‑Frank, is this permissible?
options:
  - The use of the BPO as the primary basis is impermissible because federal law prohibits any use
    of a BPO as the primary basis for determining value.
  - The use of the BPO as the primary basis is impermissible because the lender must obtain an
    appraisal for federally related transactions.
  - The use of the BPO as the primary basis is permissible because the licensee may prepare a BPO
    for any type of property.
  - The use of the BPO as the primary basis is permissible because the federal restriction applies
    to loans secured by the consumer's principal dwelling.
key: D
explanation: The text limits the BPO prohibition to residential mortgages secured by the consumer's
  principal dwelling; for a non‑owner‑occupied rental property the restriction does not apply, so
  the BPO may be used as the primary basis. The distractor mistakenly states a blanket prohibition.
