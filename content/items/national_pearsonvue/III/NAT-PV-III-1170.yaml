stem: According to the straight-line (economic age-life) method, what is 'effective age'?
options:
  - The total period during which the improvements contribute to value
  - The remaining economic life after deducting effective age from total economic life
  - The age the building appears to be given its condition and utility
  - The number of years since the building was originally constructed
key: C
explanation: Effective age is the age the building appears to be given its condition and utility; it
  differs from actual (chronological) age. A well‑maintained or remodeled building will have an
  effective age that is less than its actual age, while a neglected building will have an effective
  age greater than its actual age. The option stating the number of years since the building was
  originally constructed describes actual age, not effective age, so it is incorrect.
