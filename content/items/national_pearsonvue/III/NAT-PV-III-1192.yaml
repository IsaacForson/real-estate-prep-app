stem: An appraiser estimates the cost new of a house's improvements at $350,000, determines accrued
  depreciation to be $70,000, and values the land at $100,000. What is the indicated value using the
  cost approach?
options:
  - $520,000
  - $380,000
  - $280,000
  - $180,000
key: B
explanation: The cost approach formula is cost new minus accrued depreciation plus land value.
  Subtracting $70,000 from $350,000 yields $280,000, and adding the $100,000 land value gives
  $380,000. The $280,000 distractor omits the land addition, while the $520,000 distractor
  incorrectly adds depreciation instead of subtracting it.
citation:
  source: REP Ref. Valuation & Appraisal § 8.1
  url: null
  quoted_text: Cost approach value = cost new of the improvements − accrued depreciation + land (site) value.
