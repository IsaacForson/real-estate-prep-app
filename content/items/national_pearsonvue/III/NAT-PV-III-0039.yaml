stem: A real estate licensee is frustrated that an appraisal on a listing came in below the contract
  price. Which action by the licensee is permitted under the appraisal independence rules added to
  TILA?
options:
  - Telling the appraiser the value needed to make the deal close
  - Asking the lender to withhold the appraiser's fee until value rises
  - Giving the appraiser additional comparable sales to consider
  - Threatening to steer future lender business away from the appraiser
key: C
explanation: Parties may ask an appraiser to consider additional information, explain the
  conclusion, or correct factual errors; a licensee may give comparable sales and point out property
  features. Naming the number needed, threatening to steer future business, or conditioning payment
  on hitting the contract price are prohibited attempts to influence the appraisal.
