stem: A parcel of land is subject to a deed restriction that prohibits any sale or transfer of
  ownership. According to the DUST characteristics, what is the effect on its market value?
options:
  - It results in market value determined by demand.
  - It results in market value based on cost.
  - It results in reduced market value.
  - It results in no market value.
key: D
explanation: Transferability is one of the DUST characteristics; a restriction preventing any sale
  eliminates transferability. Since the absence of any DUST characteristic results in no market
  value, the parcel has no market value. The distractor claiming reduced market value mistakenly
  thinks value can remain when transferability is lost.
