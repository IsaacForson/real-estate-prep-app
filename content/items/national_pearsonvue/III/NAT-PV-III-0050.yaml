stem: Under the federal banking agencies' appraisal regulations, which transaction is exempt from
  the requirement that a state-licensed or state-certified appraiser perform an appraisal for a
  federally related transaction?
options:
  - A commercial real estate transaction of $1,000,000 or less
  - A residential real estate transaction of $600,000 or less
  - A commercial real estate transaction of $750,000 or less
  - A residential real estate transaction of $400,000 or less
key: D
explanation: The agencies exempt residential real estate transactions of $400,000 or less and
  commercial transactions of $500,000 or less; below the threshold a written evaluation, which need
  not be prepared by a licensed appraiser, is still required. The $600,000, $750,000, and $1,000,000
  figures exceed the stated thresholds.
