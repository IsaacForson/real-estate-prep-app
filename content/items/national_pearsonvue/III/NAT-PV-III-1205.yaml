stem: After adjusting the prices of three comparable sales in the sales comparison approach, what
  should the appraiser do next to arrive at a final value indication?
options:
  - The appraiser should select the comparable with the smallest adjustment and use its adjusted
    price as the final value
  - The appraiser should average the adjusted prices and use that as the final value indication
  - The appraiser should use the highest adjusted price as the final value indication
  - The appraiser should reconcile the adjusted prices by considering the quantity and quality of
    data behind each comparable
key: D
explanation: Reconciliation is the process of weighing the adjusted price indications from the
  comparable sales by considering how much and how reliable the data are behind each one, rather
  than simply averaging the numbers or picking a single comparable. The option that suggests
  averaging the adjusted prices does not follow this process, and the option that suggests using
  only the comparable with the smallest adjustment also fails to reconcile all indications.
citation:
