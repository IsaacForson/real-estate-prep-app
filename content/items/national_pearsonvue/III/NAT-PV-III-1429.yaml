stem: A licensee prepares a comparative market analysis (CMA) for a seller and labels the document
  accordingly. According to the worked example in the text, what is the correct description of this
  document?
options:
  - A CMA that is not an appraisal
  - An appraisal meeting USPAP standards
  - A broker price opinion with a fee
  - An automated valuation model for lending
key: A
explanation: The worked example states that the licensee "labels the document a CMA that is not an
  appraisal." This matches the option describing a CMA that is not an appraisal. The other options
  describe an appraisal meeting USPAP standards, a broker price opinion with a fee, and an automated
  valuation model for lending, none of which match the document described in the example, so they
  are incorrect.
