key: C
explanation: For apartment, office, retail, and industrial investment properties, the income
  approach receives the most weight, with sales comparison used to extract cap rates and confirm the
  result. Thus, for an office building, the income approach is weighted most heavily. The cost
  approach is incorrect because although sales comparison supports the income approach, it does not
  receive the most weight for these property types.
