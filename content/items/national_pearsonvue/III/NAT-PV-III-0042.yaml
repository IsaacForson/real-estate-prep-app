stem: In the cost approach, which cause of accrued depreciation results from a factor located
  outside the property's boundaries, such as a newly constructed landfill next door?
options:
  - External obsolescence
  - Functional obsolescence
  - Curable depreciation
  - Physical deterioration
key: A
explanation: External (economic or locational) obsolescence is a loss caused by something outside
  the property boundaries, such as a neighboring landfill, and it is incurable from the owner's
  standpoint. Physical deterioration is wear and damage to the structure itself, and functional
  obsolescence is a flaw in design or utility within the property.
