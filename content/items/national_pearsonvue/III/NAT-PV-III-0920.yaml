stem: A residential property located next to a newly constructed landfill suffers a decrease in
  value despite no changes to the property itself. Which principle best explains this?
options:
  - Progression
  - Regression
  - Contribution
  - Anticipation
key: B
explanation: Regression occurs when the value of a superior property is pulled down by inferior
  properties around it, which matches the scenario of a home declining in value due to a neighboring
  landfill. Progression describes the opposite effect, where an inferior property is lifted by
  superior neighbors. Contribution measures how a component adds to or subtracts from the whole's
  value, not external influences.
