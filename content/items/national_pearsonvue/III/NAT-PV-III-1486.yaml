stem: Which statement correctly describes the relationship between the Appraisal Subcommittee (ASC)
  and the Appraiser Qualifications Board (AQB) under the federal FIRREA framework?
options:
  - The ASC oversees state programs and maintains the National Registry while the AQB establishes
    the minimum education, experience, and examination requirements for appraiser certification
  - The AQB oversees state programs and maintains the National Registry while the ASC establishes
    the minimum education, experience, and examination requirements for appraiser certification
  - The ASC writes USPAP and oversees state programs while the AQB establishes the minimum
    education, experience, and examination requirements for appraiser certification
  - The AQB writes USPAP and oversees state programs while the ASC establishes the minimum
    education, experience, and examination requirements for appraiser certification
key: A
explanation: Under FIRREA, the ASC oversees state programs and maintains the National Registry of
  appraisers, while the AQB establishes the minimum education, experience, and examination
  requirements for appraiser certification. Writing USPAP is the responsibility of the Appraisal
  Standards Board, not the ASC or AQB.
