stem: A property has an assessed value of $320,000, exemptions of $15,000, and a mill rate of 18
  mills. What is the property tax due?
options:
  - $5,760
  - $5,490
  - $6,100
  - $54,900
key: B
explanation: Using the formula Tax = (assessed value − exemptions) × mill rate ÷ 1,000, the
  calculation is (320,000‑15,000)=305,000; 305,000 × 18=5,490,000; ÷1,000 = $5,490. The $5,760
  answer omits the exemptions, $6,100 uses an incorrect mill rate, and $54,900 misplaces the
  divisor.
