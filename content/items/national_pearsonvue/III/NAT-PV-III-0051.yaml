stem: "A licensee listing a home tells the appraiser hired by the buyer's lender, \"If this doesn't
  come in at the contract price, my brokerage will stop referring appraisals to you.\" Under the
  appraisal independence rules added to the Truth in Lending Act, this statement is:"
options:
  - Prohibited, because it attempts to influence the appraiser's opinion of value
  - Prohibited, unless the licensee also supplies comparable sales supporting the price
  - Permitted, because only the lender is subject to appraisal independence rules
  - Permitted, because a licensee may discuss the contract price with an appraiser
key: A
explanation: No one with an interest in a covered transaction may coerce, intimidate, or otherwise
  attempt to influence an appraiser's opinion of value, and threatening to steer future business
  away is expressly the kind of conduct barred. Providing comparable sales or pointing out property
  features is permitted, but conditioning future referrals on hitting a number is not.
