stem: What is the gross rent multiplier (GRM) defined as?
options:
  - Sale price divided by net operating income
  - Gross monthly rent divided by sale price
  - Sale price divided by gross monthly rent
  - Net operating income divided by sale price
key: C
explanation: GRM equals sale price divided by gross monthly rent (Valuation & Appraisal reference).
  An option that uses net operating income confuses GRM with the capitalization rate, which is based
  on NOI. Options that place rent or NOI in the numerator reverse the ratio and are therefore
  incorrect.
