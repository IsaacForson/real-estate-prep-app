stem: According to the straight-line (economic age-life) method, how is total accrued depreciation
  estimated?
options:
  - Improvements lose value evenly over their total economic life
  - Improvements lose value based solely on actual age
  - Improvements lose value only when physical deterioration is present
  - Improvements lose value at a rate that changes each year
key: A
explanation: The straight-line method estimates accrued depreciation by assuming improvements lose
  value evenly over their total economic life. The option stating that improvements lose value
  evenly over their total economic life is correct. The option stating that improvements lose value
  based solely on actual age is incorrect because the method uses effective age, which may differ
  from actual age.
