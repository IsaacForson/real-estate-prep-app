stem: Which of the following best defines a trade fixture?
options:
  - A trade fixture is an item that began as personal property and became real property by being
    attached to land or a building with the intent that it remain
  - A trade fixture is a right that belongs to and passes with the land even if the deed does not
    name it, such as an appurtenant easement
  - A trade fixture is perennial plants that grow without annual cultivation (trees, shrubs, native
    grasses) are real property until severed
  - "A trade fixture is an item a commercial tenant attaches to leased premises to carry on a
    business: display shelving, kitchen hoods, a barber's chairs"
key: D
explanation: A trade fixture is an item that a commercial tenant installs in leased premises for the
  purpose of conducting a business, such as display shelving, kitchen hoods, or barber chairs.
  Although attached to the property, it remains the tenant’s personal property and may be removed at
  the end of the lease. This description matches the correct answer.
