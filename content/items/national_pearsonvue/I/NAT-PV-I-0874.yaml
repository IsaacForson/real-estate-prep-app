math:
  worked_solution: |-
    1. A section = 640 acres.
    2. A quarter‑quarter = 1/4 × 1/4 = 1/16 of a section.
    3. Multiply: 640 acres × 1/16 = 40 acres.
  formulas:
    - Section acreage = 640 acres
    - Quarter‑quarter fraction = 1/4 × 1/4 = 1/16
    - Acreage = Section acreage × Quarter‑quarter fraction
