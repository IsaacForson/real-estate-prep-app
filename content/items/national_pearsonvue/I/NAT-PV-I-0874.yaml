stem: What is the acreage of the SW 1/4 of the NW 1/4 of Section 14 in the rectangular survey system?
options:
  - A. 10 acres
  - B. 40 acres
  - C. 80 acres
  - D. 160 acres
key: B
explanation: A quarter‑quarter of a section is 1/16 of a section. Since a section contains 640
  acres, 1/16 of 640 acres equals 40 acres. Therefore the SW 1/4 of the NW 1/4 of a section is 40
  acres.
citation:
  source: REP Ref. Property & Land Use § 3.3
  url: null
  quoted_text: A quarter-quarter (the NW 1/4 of the SE 1/4) is 40 acres and 1,320 feet per side.
