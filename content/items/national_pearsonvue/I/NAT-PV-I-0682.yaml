stem: A landowner cuts down timber on his property and sells the logs. What is the legal
  classification of the logs after they are cut?
options:
  - The item is real property
  - The item is personal property
  - The item is a fixture of the house
  - The item is a trade fixture
key: B
explanation: Severance converts real property into personal property. Cutting timber is an act of
  severance, so the logs become personal property. Fixtures and trade fixtures involve attachment
  with intent to remain, which does not apply to severed timber.
citation:
  source: REP Ref. Property & Land Use § 1.6
  url: null
  quoted_text: Real property becomes personal property by severance (cutting timber, mining ore,
    detaching a fixture).
