stem: A property has a mortgage recorded in January 2018, a judgment lien recorded in March 2019,
  and unpaid property taxes for 2020. Which lien is paid first from foreclosure proceeds?
options:
  - The mortgage recorded in January 2018.
  - The judgment lien recorded in March 2019.
  - The property tax lien for 2020.
  - The lien recorded most recently.
key: C
explanation: Property tax and special assessment liens rank ahead of all other liens regardless of
  date, including an earlier-recorded mortgage. Therefore the 2020 property tax lien is paid before
  the 2018 mortgage and the 2019 judgment lien. The option stating that the lien recorded most
  recently is paid first incorrectly applies the first-in-time rule and overlooks the tax-lien
  exception. The option stating that the judgment lien recorded in March 2019 is paid first ignores
  both the tax-lien exception and the earlier mortgage. The option stating that the mortgage
  recorded in January 2018 is paid first misstates the rule, because priority is not based solely on
  the most recent recording.
