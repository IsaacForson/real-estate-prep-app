stem: "A metes-and-bounds description reads: 'Beginning at an iron pin on the north line of Oak
  Road, thence North 20 degrees East 180 feet to a stone wall, thence South 70 degrees East 220 feet
  to the stone wall.' The description also states the distance from the iron pin to the stone wall
  as 250 feet. According to the rule of construction for metes-and-bounds descriptions, which
  element controls the location of the stone wall corner?"
options:
  - The stone wall (an artificial monument)
  - The iron pin (the point of beginning)
  - The bearing North 20 degrees East as given
  - The stated distance of 250 feet as written
key: A
explanation: Under the rule of construction for metes-and-bounds descriptions, artificial monuments
  are ranked above courses and distances. Therefore the stone wall, as an artificial monument,
  controls the corner location over the stated distance, which is considered less reliable in the
  hierarchy.
citation:
