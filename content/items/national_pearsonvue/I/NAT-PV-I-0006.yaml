stem: A deed conveys "the NW 1/4 of the SE 1/4 and the SW 1/4 of the NE 1/4 of Section 22." How many
  acres does the deed convey?
options:
  - 40 acres
  - 160 acres
  - 80 acres
  - 120 acres
key: C
explanation: 'Each piece is a quarter of a quarter of a 640-acre section: 640 / (4 x 4) = 40 acres.
  The word "and" joins separate pieces whose acreages are added, so 40 + 40 = 80 acres. An answer of
  40 acres treats only one piece; 160 acres would be a single quarter section.'
citation:
  source: REP Ref. Property & Land Use § 3.3
  url: null
  quoted_text: 'Acreage is 640 divided by the product of the fraction denominators: 640 / (4 x 4) = 40
    acres. The word "of" means keep dividing; the word "and" joins separate pieces whose acreages
    are added.'
