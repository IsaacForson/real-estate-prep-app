stem: In a foreclosure sale, which lien is paid first when a property has a 2018 mortgage, unpaid
  2020 property taxes, and a 2022 mechanic's lien?
options:
  - The 2020 property tax lien
  - The 2018 mortgage
  - The owner's equity
  - The 2022 mechanic's lien
key: A
explanation: Property tax liens rank ahead of all other liens regardless of date. Therefore the 2020
  property tax lien is paid before the 2018 mortgage and the 2022 mechanic's lien.
citation:
  source: REP Ref. Property & Land Use § 8.3
  url: null
  quoted_text: "Property tax and special assessment liens are the major exception: by statute they
    generally rank ahead of all other liens regardless of date, including an earlier-recorded
    mortgage."
