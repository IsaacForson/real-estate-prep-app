stem: A grocery store has been operating as a legal nonconforming use in a single-family residential
  zone. The owner wants to add a second story of retail space. Under typical zoning rules, is this
  permitted?
options:
  - Yes, because the use is grandfathered.
  - Yes, if the owner obtains a variance.
  - No, unless the owner first gains a special-use permit.
  - No, enlarging a nonconforming use is prohibited.
key: D
explanation: The privilege of a legal nonconforming use does not allow the owner to enlarge or
  intensify the use; ordinances generally forbid expanding a nonconforming use, so adding a second
  story of retail space is not permitted.
