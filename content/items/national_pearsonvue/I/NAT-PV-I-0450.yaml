stem: A triangular lot cannot meet the 25-foot rear setback required by the zoning ordinance. The
  owner applies for an area variance to reduce the setback to 12 feet. The hardship results from the
  lot's shape and predates the owner's purchase. According to the text, what is the likely outcome?
options:
  - The board grants a use variance instead
  - The board denies the variance; hardship is self-created
  - The board requires the owner to sell the lot
  - The board grants the variance with conditions
key: D
explanation: A variance may be granted when strict application would impose unnecessary hardship
  unique to the property, not created by the owner, and the deviation would not harm the public.
  Because the hardship arises from the lot's shape and predates the owner, the board grants an area
  variance with conditions.
