stem: A county takes a 10-foot strip along a residential lot valued at $150,000. The remainder loses
  $5,000 in value due to loss of driveway. What is just compensation?
options:
  - $150,000.00
  - $5,000.00
  - $160,000.00
  - $155,000.00
key: D
explanation: Just compensation is ordinarily the fair market value of what is taken plus, for a
  partial taking, any loss in value to the remainder (severance damages). In this case, the taken
  portion is valued at $150,000 and the remainder loses $5,000, so just compensation is $150,000 +
  $5,000 = $155,000. The option stating $150,000.00 omits the severance damages, a common error when
  calculating compensation for a partial taking.
