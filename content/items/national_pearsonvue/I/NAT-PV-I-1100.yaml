stem: A lien that arises without the owner's consent is classified as which type?
options:
  - particular lien
  - involuntary lien
  - voluntary lien
  - comprehensive lien
key: B
explanation: Section § 8.1 defines an involuntary lien as one that arises without consent by statute
  or court action, making "involuntary lien" the correct choice. "Voluntary lien" is incorrect
  because it requires the owner's agreement.
citation:
  source: REP Ref. Property & Land Use § 8.1
  url: null
  quoted_text: "Voluntary versus involuntary: a voluntary lien is created by the owner's agreement
    (mortgage, deed of trust); an involuntary lien arises without consent by statute (property
    taxes, mechanic's liens, tax liens) or by court action (judgments, attachments)."
