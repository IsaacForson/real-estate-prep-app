stem: A property has a 2018 mortgage, a 2020 judgment lien, and unpaid 2023 property taxes. If the
  property is foreclosed, which lien is paid first?
options:
  - The 2018 first mortgage lien
  - The 2020 court judgment lien
  - The 2023 property tax lien
  - The 2019 home equity lien
key: C
explanation: Section 8.3 states that property tax liens rank ahead of all other liens regardless of
  date, including an earlier-recorded mortgage. Therefore, the 2023 property tax lien is paid first
  before the mortgage or judgment lien.
