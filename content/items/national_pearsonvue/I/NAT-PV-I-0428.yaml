stem: Under the classifications in the text, a lien that is general, involuntary, and arises when a
  money judgment is recorded is called what?
options:
  - Mechanic's lien
  - Property tax lien
  - Mortgage lien
  - Judgment lien
key: D
explanation: A judgment lien is a general, involuntary lien that arises when a money judgment is
  recorded (Property & Land Use). A mechanic's lien is a specific lien that attaches to property
  where construction work was performed. A property tax lien is a specific, involuntary lien that
  attaches for unpaid tax assessments. A mortgage lien is a voluntary lien created by a loan
  agreement.
