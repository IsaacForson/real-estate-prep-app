stem: A property has a first mortgage recorded in 2015, a second mortgage recorded in 2018, and
  unpaid property taxes from 2023. In a foreclosure sale, in what order are these liens paid?
options:
  - Second mortgage, first mortgage, then property taxes
  - Property taxes, second mortgage, then first mortgage
  - First mortgage, second mortgage, then property taxes
  - Property taxes, first mortgage, then second mortgage
key: D
explanation: Property tax liens are the major exception to the 'first in time, first in right' rule
  and rank ahead of all other liens regardless of date. After the taxes are paid, the 2015 first
  mortgage is paid before the 2018 second mortgage.
citation:
  source: REP Ref. Property & Land Use § 8.3
  url: null
  quoted_text: "Property tax and special assessment liens are the major exception: by statute they
    generally rank ahead of all other liens regardless of date, including an earlier-recorded
    mortgage."
