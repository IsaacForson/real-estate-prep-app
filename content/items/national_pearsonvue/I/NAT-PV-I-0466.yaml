  quoted_text: A metes-and-bounds description starts at a point of beginning (POB) tied to a monument
    (an iron pin, a stone, a stream, a section corner), travels around the parcel in courses each
    stated as a bearing and a distance (for example "North 45 degrees 30 minutes East, 210.5 feet"),
    and must return to the point of beginning so the figure closes.
