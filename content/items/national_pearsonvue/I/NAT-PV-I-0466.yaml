stem: A surveyor prepares a metes-and-bounds description that begins at a point of beginning, lists
  several courses with bearings and distances, and ends at a different point. For the description to
  be valid, what must it do?
options:
  - Be recorded in the county plat book
  - Use only artificial monuments for accuracy
  - Return to the point of beginning so the figure closes
  - Include at least one natural monument
key: C
explanation: The correct answer is that a metes-and-bounds description must return to the point of
  beginning so the figure closes. The option stating the description must be recorded in the county
  plat book is incorrect; recording is not required for validity. The option stating the description
  must use only artificial monuments is incorrect; monuments may be natural or artificial, and there
  is no requirement to use only artificial ones. The option stating the description must include at
  least one natural monument is incorrect; while natural monuments are helpful, they are not
  required for a valid description.
