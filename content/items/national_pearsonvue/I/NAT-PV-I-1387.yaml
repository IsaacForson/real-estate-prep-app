stem: When a debt secured by a lien is **NOT** satisfied, what can the lienholder do to obtain payment?
options:
  - Request a loan modification from the mortgage lender
  - Seek a court order to garnish the debtor's wages
  - File a complaint with the federal housing agency
  - Force a sale of the property and be paid from the proceeds
key: D
explanation: If a debt secured by a lien remains unpaid, the lienholder may enforce the lien by
  forcing a sale of the property and receiving payment from the sale proceeds. Requesting a loan
  modification is a borrower‑initiated change to loan terms, not a lienholder remedy. Seeking a wage
  garnishment is a remedy for unsecured debts, not for a lien on property. Filing a complaint with a
  federal housing agency does not provide a mechanism to collect on a lien.
