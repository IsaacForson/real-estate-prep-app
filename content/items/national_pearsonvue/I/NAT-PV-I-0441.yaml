stem: A property has a 2017 judgment lien, a 2019 mortgage, and unpaid property taxes from 2020. If
  the property is foreclosed in 2022, which lien is paid second from the proceeds?
options:
  - The property tax lien.
  - The judgment lien.
  - The mortgage lien.
  - The home-equity line lien.
key: C
explanation: "Property tax liens rank ahead of all other liens regardless of date, so they are paid
  first. After taxes, the remaining liens are paid in order of recording date: the 2019 mortgage is
  senior to the 2017 judgment lien, so the mortgage is paid second."
citation:
  source: REP Ref. Property & Land Use § 8.3
  url: null
  quoted_text: Foreclosure proceeds go first to the taxes, then the 2019 mortgage, then the 2022 line,
    then the mechanic's lien (unless state law gives it an earlier effective date), and any surplus
    to the owner.
