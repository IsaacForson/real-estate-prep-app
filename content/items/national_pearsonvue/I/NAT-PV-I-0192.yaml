stem: A homeowner has a 2020 mortgage recorded, and in 2023 unpaid property taxes accrue. If the
  property is foreclosed in 2024, which lien is paid first from the proceeds?
options:
  - The 2023 property tax lien
  - The 2020 mortgage
  - Both liens paid simultaneously
  - The proceeds go to the owner
key: A
explanation: Under the priority rule, property tax liens rank ahead of all other liens regardless of
  date, so the 2023 property tax lien is paid before the 2020 mortgage. The distractor suggesting
  the mortgage is paid first ignores the statutory exception for tax liens.
citation:
  source: REP Ref. Property & Land Use § 8.3
  url: null
  quoted_text: "Property tax and special assessment liens are the major exception: by statute they
    generally rank ahead of all other liens regardless of date, including an earlier-recorded
    mortgage."
