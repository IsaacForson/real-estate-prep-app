stem: A city enacts a zoning ordinance that limits building height to ten feet in a commercial
  district, leaving the owner no economically viable use of the property. Under the police power
  description in REP Ref. Property & Land Use §4.2, what is the likely outcome?
options:
  - A regulation that transfers title to the city
  - A regulation that may be challenged as a regulatory taking
  - A regulation that is not a taking and requires no compensation
  - A regulation that requires just compensation before it takes effect
key: B
explanation: A regulation under police power that leaves the owner with no economically viable use
  may be challenged as a regulatory taking. It does not transfer title to the city, is not
  automatically valid without compensation, and does not require compensation before it takes
  effect.
