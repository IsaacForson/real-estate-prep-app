stem: "A fixture is defined as:"
options:
  - An item that began as personal property and became real property only if a written agreement
    exists
  - An item that began as personal property and remained personal property after attachment
  - An item that began as personal property and became real property automatically upon attachment
  - An item that began as personal property and became real property by being attached with intent
    to remain
key: D
explanation: A fixture is an item that began as personal property and became real property by being
  attached to land or a building with the intent that it remain. The other options are incorrect
  because they either suggest the item remains personal property, require a written agreement, or
  imply that attachment alone automatically converts the item to real property without the necessary
  intent.
