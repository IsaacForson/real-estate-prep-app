stem: Which of the following is an example of an appurtenance?
options:
  - A right that belongs to and passes with the land even if the deed does not name it
  - A personal right that the landowner may revoke at any time without cause
  - A leasehold interest that ends when the rental term expires and the tenant vacates
  - A license granting permission to use the property for a specific purpose and duration
key: A
explanation: An appurtenance is a right that belongs to and passes with the land even if the deed
  does not name it. The option stating 'A right that belongs to and passes with the land even if the
  deed does not name it' matches this definition. The option describing a leasehold interest that
  ends when the rental term expires and the tenant vacates refers to a leasehold estate, not an
  appurtenance. The option describing a license granting permission to use the property for a
  specific purpose and duration refers to a license, which is a personal privilege that can be
  revoked. The option describing a personal right that the landowner may revoke at any time without
  cause also describes a license or mere privilege, not an appurtenance.
