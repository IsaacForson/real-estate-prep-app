stem: Which statement accurately reflects the general rule of lien priority and its major exception?
options:
  - Liens are paid in order of recording date, with property tax liens paid after all other liens.
  - Liens are paid in order of recording date, except property tax liens which are paid before all
    other liens.
  - Liens are paid in order of recording date, except mechanic's liens which are paid before all
    other liens.
  - Liens are paid in order of recording date, except judgment liens which are paid before all other
    liens.
key: B
explanation: Under the general rule, liens are paid in the order they were recorded (first in time,
  first in right). The major exception is that property tax liens (and special assessment liens) are
  paid before all other liens, regardless of when they were recorded. Therefore the statement that
  liens are paid in order of recording date except property tax liens which are paid before all
  other liens correctly reflects the rule. The statement that property tax liens are paid after all
  other liens incorrectly reverses the exception.
citation:
  source: REP Ref. Property & Land Use § 8.3
  url: null
  quoted_text: "The general rule is first in time, first in right: liens rank by recording date (or,
    for some statutory liens, the date they arose), and a junior lien is paid only after every
    senior lien is paid in full. Property tax and special assessment liens are the major exception:
    by statute they generally rank ahead of all other liens regardless of date, including an
    earlier-recorded mortgage."
