stem: A landlord installs a built-in oven in a leased apartment. The lease does not mention the
  oven. At lease end, the tenant removes the oven, claiming it is a trade fixture. Who prevails?
options:
  - The landlord retains ownership of the oven because it is a fixture under the lease terms
  - The tenant may remove the oven as a trade fixture under the lease agreement
  - The oven becomes personal property of the tenant upon removal after the lease ends
  - The landlord and tenant must share the oven's value equally in the event of disagreement
key: A
explanation: When a landlord installs an item in leased premises, it becomes a fixture belonging to
  the real estate unless it is a trade fixture installed by a business tenant. Since the landlord
  installed the oven and it is not a trade fixture, the oven remains the landlord's property and the
  tenant may not remove it.
