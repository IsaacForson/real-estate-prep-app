stem: A contractor completes work on a property in April and files a mechanic's lien in July. What
  factor may determine the priority of this mechanic's lien relative to other liens?
options:
  - Date the lien is filed
  - Date property purchased
  - Date of mortgage recording
  - Date work began on site
key: D
explanation: A mechanic's lien's priority may relate back to when the work began, so the date work
  began determines its priority. The filing date alone does not set priority under the rule
  described.
citation:
  source: REP Ref. Property & Land Use § 8.3
