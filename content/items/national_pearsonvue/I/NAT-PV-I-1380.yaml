stem: "Under the doctrine of emblements, a tenant whose tenancy ends through no fault of the tenant
  at an unpredictable time may:"
options:
  - The tenant may re-enter to harvest crops they planted
  - The tenant must leave growing crops for the landlord
  - The tenant must sell the crops to the landlord before vacating
  - The tenant forfeits all rights to crops and cannot harvest them
key: A
explanation: The emblements doctrine expressly allows a tenant to re-enter and harvest crops they
  planted when the tenancy ends through no fault of the tenant at an unpredictable time. The
  distractor that says the tenant must leave crops for the landlord contradicts this right, as the
  tenant retains the harvest privilege.
