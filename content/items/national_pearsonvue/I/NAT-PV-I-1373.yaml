stem: When do property tax and special assessment liens arise?
options:
  - They arise when a mortgage is recorded.
  - They arise after a tax delinquency notice is issued.
  - They arise each year without filing.
  - They arise only when the property is sold.
key: C
explanation: Property tax and special assessment liens become effective each year automatically; no
  filing is required. The other choices are incorrect because they tie the lien’s creation to a
  mortgage recording, a tax delinquency notice, or a sale of the property, none of which is required
  for the lien to arise.
