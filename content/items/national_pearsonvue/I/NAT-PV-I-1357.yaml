stem: A commercial tenant installs a display shelving unit in a leased retail space. The lease ends
  and the tenant does not remove the shelving. Who owns the shelving?
options:
  - The absence of ownership for either party
  - The shared ownership of tenant and landlord
  - The landlord who owns the property
  - The tenant who installed the shelving
key: C
explanation: Trade fixtures left behind after the lease ends become the landlord's property by
  accession, so the landlord owns the shelving. If the tenant had removed the fixture before the
  lease ended, they would retain ownership.
