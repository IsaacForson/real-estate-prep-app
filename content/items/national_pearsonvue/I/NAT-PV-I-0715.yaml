stem: What is a trade fixture?
options:
  - An item that a commercial tenant attaches to leased premises to carry on a business
  - An item that becomes part of the real estate when attached by a property owner
  - An item that must remain with the leased premises at the end of the tenancy
  - An item that is considered personal property only if it is not attached to the building
key: A
explanation: A trade fixture is an item that a commercial tenant attaches to leased premises to
  carry on a business and remains the tenant's personal property. An item that becomes part of the
  real estate when attached by a property owner is a fixture, not a trade fixture. An item that must
  remain with the leased premises at the end of the tenancy is not necessarily a trade fixture;
  trade fixtures may be removed by the tenant. An item that is considered personal property only if
  it is not attached to the building mischaracterizes trade fixtures, which remain personal property
  even when attached for business use.
