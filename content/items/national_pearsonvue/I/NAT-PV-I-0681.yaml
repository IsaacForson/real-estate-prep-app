stem: Which of the following rights is listed first in the bundle of rights that define real property?
options:
  - The right to control the land
  - The right to possess the land
  - The right to exclude others
  - The right to dispose of the land
key: B
explanation: The bundle of rights for real property includes the right to possess, the right to
  control and use, the right to enjoy without interference, the right to exclude others, and the
  right to dispose. The first right listed is the right to possess.
