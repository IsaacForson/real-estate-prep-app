stem: What is the controlling question when determining if an item has become a fixture?
options:
  - The method of attachment used for the item
  - The intent of the person who attached it
  - The way the item is adapted to the property
  - The written agreement between the parties
key: B
explanation: The intent of the person who attached the item is the controlling question in
  determining if an item has become a fixture. While factors such as the method of attachment,
  adaptation to the property, and written agreements are relevant, they do not override the intent
  of the person who attached the item.
