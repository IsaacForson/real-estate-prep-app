stem: A grocery store has operated for twenty years in a residentially zoned area. The zoning was
  later changed to single‑family residential. The store owner wants to add a second story of retail
  space. What is the likely outcome under the nonconforming use rules?
options:
  - The owner must cease the grocery operation before any expansion
  - The owner must obtain a special‑use permit before expanding
  - The owner may not add the second story as it would intensify the nonconforming use
  - The owner may add the second story because the use is grandfathered
key: C
explanation: The owner may not add a second story because expanding a nonconforming use by adding
  floor area intensifies the use, which is prohibited. A legal nonconforming use may continue as‑is
  but cannot be enlarged.
