stem: How is a specific lien defined?
options:
  - It attaches to all of the debtor's property
  - It attaches to one parcel of real property
  - It arises only with the owner's written consent
  - It is considered voluntary and arises from agreement
key: B
explanation: A specific lien attaches to a single parcel of real property. Examples include
  mortgages, deeds of trust, property tax liens, and mechanic's liens. A lien that arises only with
  the owner's written consent describes a contractual lien, not necessarily a specific one. A lien
  that is considered voluntary is incorrect because some specific liens, such as mechanic's liens,
  can be involuntary. A lien that attaches to all of the debtor's property is a general lien, not a
  specific lien.
