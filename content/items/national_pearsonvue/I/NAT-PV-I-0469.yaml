stem: "Personal property (chattels, personalty) is:"
options:
  - Personal property is land plus permanent human-made attachments such as buildings, fences,
    wells, and paving
  - Personal property is the legal rights of ownership often described as a bundle of rights to
    possess, control, use, enjoy, exclude, and dispose
  - Personal property is the surface of the earth, everything beneath it to the center of the earth,
    the airspace above it, and things attached by nature such as trees and water
  - "Personal property is everything that is not real property: movable things such as furniture,
    vehicles, and equipment, and intangible rights such as a promissory note"
key: D
explanation: Personal property is defined as everything that is not real property, including movable
  items such as furniture, vehicles, equipment, and intangible rights like a promissory note. That
  description matches the answer that states personal property is everything that is not real
  property with those examples. The other choices describe real property and its fixtures, the
  bundle of ownership rights, or land and natural attachments, which are not personal property.
