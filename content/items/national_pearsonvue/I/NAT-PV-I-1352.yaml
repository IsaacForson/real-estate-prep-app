stem: In a state that follows the riparian doctrine, what right does a landowner whose property
  borders a stream have?
options:
  - The right to divert the water for irrigation
  - The right to own the streambed
  - The right to reasonable use of the water
  - The right to prohibit upstream users from using water
key: C
explanation: Under the riparian doctrine, a landowner whose property borders a stream has the right
  to reasonable use of the water. The idea that the landowner owns the streambed is incorrect;
  riparian rights do not grant ownership of the streambed.
