stem: When both a property tax lien and a federal tax lien are attached to the same parcel, which
  lien will be satisfied first in a foreclosure proceeding?
options:
  - the federal tax lien
  - the first mortgage lien
  - the property tax lien
  - the mechanic's lien
key: C
explanation: Property tax liens are given statutory seniority over all other liens, including
  federal tax liens, so the property tax lien is satisfied before the federal tax lien in a
  foreclosure. The federal tax lien, while a general involuntary lien, does not enjoy the same
  priority; mortgage and mechanic's liens are also junior to the tax lien.
