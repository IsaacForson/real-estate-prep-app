stem: A contractor begins work on a property in January and files a mechanic's lien in May. A
  mortgage was recorded on the property in March. Assuming the mechanic's lien relates back to when
  work began, which lien is paid first from foreclosure proceeds?
options:
  - The property tax lien
  - The mechanic's lien
  - Both liens equally
  - The mortgage
key: B
explanation: Because the mechanic's lien may relate back to the date work began (January), it
  becomes senior to the March-recorded mortgage under the first-in-time rule. No property tax lien
  is mentioned, so it does not affect the order.
