stem: "An owner seeks a variance to build a larger house because they want more space for a growing
  family. Under typical zoning rules, the variance is likely to be denied because:"
options:
  - The variance must be consistent with the comprehensive plan to be granted
  - The deviation must not result in any change to the neighborhood's character
  - The hardship must be financial, not related to the physical characteristics of the lot
  - The hardship must arise from the land itself, not the owner's desires
key: D
explanation: The variance section requires that hardship stem from the land itself, not the owner's
  finances or wishes. The other options describe possible concerns but are not the statutory basis
  for denying a variance.
