stem: Under the classification of liens, which of the following is an example of a general lien that
  attaches to all of a debtor's property?
options:
  - A property tax lien arising for a specific parcel
  - A mechanic's lien filed by an unpaid contractor
  - A mortgage recorded against a specific parcel of real estate
  - A judgment lien arising from a recorded money judgment
key: D
explanation: A general lien attaches to all of a debtor's property, real and personal, and judgment
  liens are a primary example of this type of lien. In contrast, a mortgage, a property tax lien,
  and a mechanic's lien are specific liens that attach only to a particular parcel of real estate.
