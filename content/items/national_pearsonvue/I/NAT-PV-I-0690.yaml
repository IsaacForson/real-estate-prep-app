stem: Which type of lien arises without the owner's consent, either by statute or by court action?
options:
  - Specific lien
  - Voluntary lien
  - Involuntary lien
  - General lien
key: C
explanation: An involuntary lien arises without the owner's consent, either by statute (such as
  property taxes, mechanic's liens, or tax liens) or by court action (such as judgments or
  attachments). A voluntary lien requires the owner's agreement, while specific and general liens
  describe the scope of the lien rather than how it is created.
