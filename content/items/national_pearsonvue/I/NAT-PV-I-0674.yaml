stem: What does the term 'land' include?
options:
  - Land includes the surface of the earth, everything beneath it to the center of the earth, the
    airspace above it, and things attached by nature such as trees and water.
  - Land includes the surface of the earth, everything beneath it to the center of the earth, the
    airspace above it, and things attached by nature such as buildings and fences.
  - Land includes the surface of the earth, everything beneath it to the center of the earth, the
    airspace above it, and things attached by nature such as minerals and oil.
  - Land includes the surface of the earth, everything beneath it to the center of the earth, the
    airspace above it, and things attached by nature such as roads and utilities.
key: A
explanation: Land includes the surface of the earth, everything beneath it to the center of the
  earth, the airspace above it, and natural attachments such as trees and water. An option that
  lists roads and utilities describes human-made improvements, which are not natural attachments. An
  option that lists buildings and fences also describes human-made improvements. An option that
  lists minerals and oil describes subsurface resources that are not considered natural attachments
  in this definition.
