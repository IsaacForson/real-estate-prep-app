stem: A developer is subdividing a large, irregularly shaped tract of land in a state that does
  **not** use the rectangular survey system. Which legal description system would most likely be
  used to ensure each lot can be located on the ground and distinguished from every other parcel?
options:
  - Lot and block
  - Metes and bounds
  - Monument-only description
  - Rectangular (government) survey
key: B
explanation: Metes and bounds is the oldest legal description system; it defines a parcel’s
  boundaries by stating directions and distances from a point of beginning, using natural or
  artificial monuments. Because it does not rely on a recorded plat or the rectangular survey
  system, it is appropriate for large, irregular tracts in states that do not use the government
  survey method.
