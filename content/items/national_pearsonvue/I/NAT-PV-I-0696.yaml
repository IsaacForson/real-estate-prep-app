stem: What does a special-use permit authorize?
options:
  - A use prohibited in the zoning district
  - A use allowed only if conditions are met
  - A use requiring proof of unnecessary hardship
  - A use that runs automatically with the land
key: B
explanation: A special-use permit authorizes a use that the ordinance deems appropriate in a
  district only when stated conditions are met, such as a house of worship or school in a
  residential area. The option stating that a special-use permit requires proof of unnecessary
  hardship is incorrect because that requirement applies to a variance, not a special-use permit.
  The option stating that a special-use permit runs automatically with the land is incorrect because
  the permit is tied to specific conditions and does not run with the land automatically. The option
  stating that a special-use permit prohibits a use in the zoning district is incorrect because the
  permit allows, rather than prohibits, a use that would otherwise not be permitted.
citation:
  source: REP Ref. Property & Land Use § 5.5
  url: null
  quoted_text: "A special-use permit (conditional-use permit, special exception) authorizes a use the
    ordinance identifies as appropriate in a district only when stated conditions are met: houses of
    worship, schools, day-care centers, hospitals, and cemeteries in residential districts are
    common examples."
