stem: What must happen before a newly constructed building can be lawfully occupied after passing
  final inspection?
options:
  - The authority must issue a certificate of occupancy prior to occupancy
  - The local government must record a deed restriction on the property
  - The owner must obtain a use permit from the planning department
  - The builder must file a notice of completion with the county recorder
