stem: Which statement correctly describes a general lien?
options:
  - It attaches to all of a debtor's property, real and personal.
  - It attaches to a single parcel of real property only.
  - It arises only when a court records a money judgment.
  - It is created by the owner's voluntary agreement.
key: A
explanation: A general lien attaches to all of a debtor's property, real and personal. The option
  stating that a general lien arises only when a court records a money judgment describes a judgment
  lien, which is just one example of a general lien, not the full definition. The option saying a
  general lien is created by the owner's voluntary agreement describes a voluntary or contractual
  lien, which is specific, not general. The option claiming a general lien attaches to a single
  parcel of real property only describes a specific lien.
citation:
