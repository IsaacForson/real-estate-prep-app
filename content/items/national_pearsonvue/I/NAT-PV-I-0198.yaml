stem: Which of the following liens is **NOT** automatically ahead of a mortgage regardless of
  recording date?
options:
  - It is a property tax lien.
  - It is a special assessment lien.
  - It is a mechanic's lien.
  - It is a federal tax lien.
key: C
explanation: Property tax and special assessment liens rank ahead of all other liens regardless of
  recording date. A mechanic's lien's priority depends on state law and relation‑back rules, so it
  is not automatically ahead. A federal tax lien does not have this automatic priority; a special
  assessment lien does; a property tax lien does.
