stem: Which of the following is one of the tests used to determine if an item has become a fixture
  according to REP Ref. Property & Land Use §1.3?
options:
  - The method of attachment
  - The color of the item itself
  - The brand name of the item
  - The purchase price of the item
key: A
explanation: A fixture is identified by factors such as how the item is attached to the property.
  When an item is bolted, wired, plumbed, cemented, or built‑in and removal would damage the realty,
  it is treated as a fixture. Characteristics like color, brand name, or purchase price do not
  affect fixture status.
