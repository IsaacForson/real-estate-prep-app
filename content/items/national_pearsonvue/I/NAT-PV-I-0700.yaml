stem: What is escheat under state law?
options:
  - The government's power to take private property for public use
  - The process of subdividing land into smaller lots for development
  - A lien that attaches to all of a debtor's property to secure a debt
  - The reversion of property to the state when an owner dies intestate and no heirs are found
key: D
explanation: Escheat occurs when property reverts to the state because the owner died without a will
  and no heirs can be located, or when the property is legally abandoned. The other options describe
  eminent domain, subdivision, and a general lien.
