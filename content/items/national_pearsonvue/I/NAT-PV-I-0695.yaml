stem: A commercial tenant installs display shelving and a kitchen hood in a leased restaurant space.
  The lease ends and the tenant does not remove these items. What is the likely outcome for the
  shelving and hood?
options:
  - The items remain the tenant's personal property and may be removed
  - The items become the landlord's property by accession
  - The items must be removed by the tenant at the tenant's expense
  - The items are considered abandoned and belong to the municipality
key: B
explanation: According to the trade‑fixture rule, trade fixtures remain the tenant's personal
  property but, if left behind after the lease ends, they generally become the landlord's property
  by accession. Thus, the shelving and hood become the landlord's property. The distractor that they
  remain the tenant's property ignores the accession provision for abandoned trade fixtures.
