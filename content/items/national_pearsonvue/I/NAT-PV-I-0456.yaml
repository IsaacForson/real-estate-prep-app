stem: "Real property consists of:"
options:
  - Land only, without any improvements or ownership rights
  - Land plus permanent human-made attachments plus the legal rights of ownership
  - Land plus personal property such as furniture and vehicles
  - Land plus permanent human-made attachments (improvements)
key: B
explanation: The correct answer includes land, permanent human-made attachments (improvements), and
  the legal rights of ownership, which together define real property as the bundle of rights. The
  option that lists only land is incorrect because it omits both improvements and ownership rights.
  The option that lists land plus improvements is incorrect because it omits the legal rights of
  ownership. The option that lists land plus personal property such as furniture and vehicles is
  incorrect because personal property is not part of real property.
