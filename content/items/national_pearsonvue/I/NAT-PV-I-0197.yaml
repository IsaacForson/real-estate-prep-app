stem: What does real property consist of?
options:
  - Land plus permanent human-made attachments and the legal rights of ownership
  - Land plus personal property such as furniture, vehicles, and equipment
  - Land plus mineral rights such as oil, gas, and coal that may be severed
  - Land plus water rights under riparian doctrine that govern reasonable use
key: A
explanation: Real property consists of land plus permanent human-made attachments and the legal
  rights of ownership, often described as a bundle of rights to possess, control, use, enjoy,
  exclude, and dispose. The other options incorrectly limit real property to only personal property,
  mineral rights, or water rights.
