stem: A homeowner's land is flooded by a newly constructed dam without any condemnation proceeding.
  Which legal action allows the homeowner to seek compensation?
options:
  - Inverse condemnation
  - Eminent domain action
  - Adverse possession suit
  - Quiet title legal claim
key: A
explanation: When a public project causes damage to private land without a formal condemnation
  proceeding, the owner may bring an inverse condemnation action to obtain just compensation. An
  eminent domain action requires a formal taking, adverse possession is a method of acquiring title
  through continuous possession, and a quiet title action resolves disputes over ownership.
