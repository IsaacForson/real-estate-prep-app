stem: When a landowner divides a parcel and one resulting lot has no access to a public road, what
  type of easement may be implied by law?
options:
  - Easement by necessity
  - Appurtenant easement
  - Easement by prescription
  - Easement in gross
key: A
explanation: The statute states that when a division leaves one part landlocked, the law implies an
  easement of access over the part that keeps road access. This defines an easement by necessity. An
  easement by prescription requires open, notorious, and continuous use for the statutory period,
  which is not present in the scenario.
