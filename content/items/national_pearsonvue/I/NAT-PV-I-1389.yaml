stem: During a residential sale, the licensee learns that the seller constructed a sunroom without
  obtaining a building permit. What is the licensee's appropriate action under the statute?
options:
  - Disclose the unpermitted work to the buyer before closing
  - Advise the buyer to sue the seller for fraud damages
  - Recommend that the buyer obtain a retroactive permit before closing
  - Take no action because the unpermitted work is not a lien
key: A
explanation: The statute notes that unpermitted work is a common resale disclosure issue because the
  buyer may inherit the duty to bring it into compliance. Therefore, the licensee should disclose
  the unpermitted work to the buyer. Advising the buyer to sue for fraud damages goes beyond the
  required disclosure and is not mandated by the statute.
