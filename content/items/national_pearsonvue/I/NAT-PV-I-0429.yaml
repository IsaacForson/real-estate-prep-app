stem: A property has an unpaid property tax lien recorded in 2023, a first mortgage recorded in
  2020, and a mechanic's lien recorded in 2024 for work completed in 2022. In a foreclosure sale,
  which lien is paid first from the proceeds?
options:
  - the mechanic's lien
  - the property tax lien
  - the first mortgage lien
  - the surplus to the owner
key: B
explanation: Property tax liens have priority over all other liens, regardless of when they were
  recorded, so the tax lien is satisfied first. The first mortgage, although recorded earlier, is
  junior to the tax lien, as is the mechanic's lien. Any remaining surplus after all liens are paid
  goes to the owner.
