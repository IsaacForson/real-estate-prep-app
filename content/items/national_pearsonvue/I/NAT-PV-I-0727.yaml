stem: A deed describes a parcel using metes and bounds that references a river as a boundary, but
  the accompanying lot-and-block plat shows the boundary as a straight line 15 feet inland from the
  river. According to the rule of construction for metes-and-bounds descriptions, which boundary
  controls?
options:
  - The river (natural monument) as the boundary
  - The lot-and-block plat line as the boundary
  - The course and distance calls as the boundary
  - The stated area description as the boundary
key: A
explanation: The rule of construction for metes‑and‑bounds descriptions ranks natural monuments
  first, so the river boundary prevails over the plat line. The lot‑and‑block line is an artificial
  monument and thus lower in priority. Course and distance and stated area are ranked even lower.
citation:
  source: REP Ref. Property & Land Use § 3.2
  url: null
  quoted_text: When elements of a description conflict, the usual rule of construction ranks natural
    monuments first, then artificial monuments, then adjoining boundaries, then courses, then
    distances, and stated area last
