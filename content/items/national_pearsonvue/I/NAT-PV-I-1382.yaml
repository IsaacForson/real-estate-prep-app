stem: A restaurant tenant installs a custom-built ventilation hood that is welded to the building's
  roof. Two months before the lease expires, the tenant removes the hood and repairs the roof
  penetration. According to the REP Ref. Property & Land Use, what is the status of the ventilation
  hood?
options:
  - The ventilation hood remains the tenant's personal property.
  - The ventilation hood is considered abandoned property and may be claimed by either party.
  - The ventilation hood becomes part of the real property and must stay with the building.
  - The ventilation hood belongs to the landlord because it was attached to the roof.
key: A
explanation: Trade fixtures remain the tenant's personal property and may be removed before the
  lease ends, provided the tenant repairs any damage caused by removal. The distractor that says it
  becomes part of the real property incorrectly treats the trade fixture as a regular fixture.
citation:
  source: REP Ref. Property & Land Use §1.4
  url: null
  quoted_text: "A trade fixture is an item a commercial tenant attaches to leased premises to carry on
    a business: display shelving, kitchen hoods, a barber's chairs. Although attached, trade
    fixtures remain the tenant's personal property. The tenant may remove them before the lease ends
    and must repair the damage removal causes."
