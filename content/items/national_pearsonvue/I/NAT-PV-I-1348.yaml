stem: What is the current national vertical datum used for elevations in the United States?
options:
  - The Mean Sea Level datum of 1929
  - The North American Vertical Datum of 1988 (NAVD 88)
  - The Local City Datum established by municipalities
  - The International Terrestrial Reference Frame
key: B
explanation: The current national vertical datum for elevations in the United States is the North
  American Vertical Datum of 1988 (NAVD 88), which superseded the 1929 Mean Sea Level datum. The
  option stating the Mean Sea Level datum of 1929 refers to the outdated datum. The option
  describing a local city datum is not a national standard. The option citing the International
  Terrestrial Reference Frame is a global reference system, not the U.S. vertical datum.
