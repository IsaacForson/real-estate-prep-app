  quoted_text: Vertical measurement requires a reference plane called a datum. Elevations were
    historically referred to mean sea level; the current national reference is the North American
    Vertical Datum of 1988 (NAVD 88), which replaced the 1929 datum, and many cities keep a local
    datum.
