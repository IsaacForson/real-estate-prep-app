stem: How many acres are in a quarter-quarter section of land under the rectangular survey system?
options:
  - The area of 80 acres
  - The area of 160 acres
  - The area of 40 acres
  - The area of 320 acres
key: C
explanation: A quarter‑quarter section equals one‑quarter of a quarter section. A full section
  contains 640 acres, so a quarter section is 640 × ¼ = 160 acres and a quarter‑quarter is
  160 × ¼ = 40 acres. Therefore the correct answer is the option stating 40 acres. The other options
  describe 80 acres (half of a quarter section), 160 acres (a quarter section), and 320 acres (half
  a section), which are not the size of a quarter‑quarter section.
citation:
  source: "### REP Ref. Property & Land Use — Reference note: property characteristics, legal
    descriptions, land use controls (authored, status: draft — needs licensed review) ### § 3.3
