  url: null
  quoted_text: A quarter-quarter (the NW 1/4 of the SE 1/4) is 40 acres
  secondary: []
math:
  worked_solution: |-
    1. A full section = 640 acres.
    2. Quarter section = 640 acres × 1/4 = 160 acres.
    3. Quarter‑quarter section = 160 acres × 1/4 = 40 acres.
  formulas:
    - Quarter section = Section size × 1/4
    - Quarter‑quarter = Quarter section × 1/4
