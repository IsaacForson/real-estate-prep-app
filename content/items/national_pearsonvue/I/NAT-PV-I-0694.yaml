stem: How does the reference define personal property?
options:
  - Personal property is everything that is not real property
  - Personal property is only tangible items such as furniture and vehicles
  - Personal property is only intangible rights such as promissory notes
  - Personal property is items permanently attached to land
key: A
explanation: Personal property (chattels, personalty) is everything that is not real property; it
  includes movable items such as furniture, vehicles, and equipment, as well as intangible rights
  such as promissory notes. The choice that says 'Personal property is only tangible items such as
  furniture and vehicles' is incorrect because it excludes intangible rights. The choice that says
  'Personal property is only intangible rights such as promissory notes' is incorrect because it
  excludes tangible items. The choice that says 'Personal property is items permanently attached to
  land' is incorrect because it describes real property, not personal property.
