stem: A property has a 2018 mortgage, a 2020 mechanic's lien, and unpaid 2022 property taxes. In a
  foreclosure sale, which lien is paid first from the proceeds?
options:
  - The 2018 mortgage.
  - The 2020 mechanic's lien.
  - The 2022 property tax lien.
  - The owner's equity.
key: C
explanation: Property tax and special assessment liens take priority over all other liens,
  regardless of when they were recorded. Therefore the 2022 property tax lien is paid first.
citation:
  source: REP Ref. Property & Land Use § 8.3
  url: null
  quoted_text: "Property tax and special assessment liens are the major exception: by statute they
    generally rank ahead of all other liens regardless of date, including an earlier-recorded
    mortgage."
