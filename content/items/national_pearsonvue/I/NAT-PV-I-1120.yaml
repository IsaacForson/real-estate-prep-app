math:
  worked_solution: "A full section is 640 acres. A quarter section is 1/4 of a section: 640 × 1/4 =
    160 acres. A quarter‑quarter section is 1/4 of a quarter section: 160 × 1/4 = 40 acres.
    Alternatively, 640 × (1/4) × (1/4) = 40 acres."
