stem: What characterizes an easement in gross?
options:
  - It benefits a person or entity rather than a parcel
  - It benefits the dominant tenement and runs with the land
  - It terminates automatically when the servient estate is sold
  - It requires proof of unnecessary hardship to obtain
key: A
explanation: "An easement in gross benefits a person or entity rather than a parcel and has no
  dominant tenement. This matches the statement that it benefits a person or entity rather than a
  parcel. The other options describe concepts that do not apply: requiring proof of unnecessary
  hardship relates to an easement by necessity, benefiting the dominant tenement and running with
  the land describes an appurtenant easement, and automatic termination upon sale of the servient
  estate is not a characteristic of an easement in gross."
citation:
