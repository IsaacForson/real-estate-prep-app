stem: What is the defining characteristic that determines whether an item is a fixture?
options:
  - The item is custom-fitted to the property's dimensions.
  - The item is bolted or cemented to the structure.
  - The item is attached with the intent that it remain.
  - The item is listed in the purchase contract.
key: C
explanation: "A fixture is an item that began as personal property and became real property when it
  is attached to land or a building with the intent that it remain. The intent of the party who
  attached the item is the controlling factor. (Property & Land Use reference note: property
  characteristics, legal descriptions, land use controls)"
