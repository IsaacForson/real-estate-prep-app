stem: Which physical characteristic of land means it remains while improvements wear out?
options:
  - The characteristic that land cannot be moved from its location
  - The characteristic that land remains while improvements wear out
  - The characteristic that no two parcels occupy the same location
  - The characteristic that land value changes with nearby improvements
key: B
explanation: Indestructibility means land is durable while improvements wear out, so the land
  remains. The option describing land that cannot be moved refers to immobility, not
  indestructibility.
