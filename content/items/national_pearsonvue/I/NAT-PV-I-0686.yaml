stem: Which lien is classified as a general, involuntary lien that arises on assessment and requires
  filing of notice?
options:
  - Federal tax lien
  - Judgment lien
  - Mechanic's lien
  - Mortgage lien
key: A
explanation: The federal tax lien is defined as a general, involuntary lien that arises upon
  assessment and is perfected by filing notice. A judgment lien also is general and involuntary but
  arises from a recorded money judgment, not assessment. Mechanic's and mortgage liens are specific,
  not general.
