stem: Which of the following is included in the bundle of rights that define real property?
options:
  - The right to possess the property
  - The right to mine subsurface minerals
  - The right to change local zoning regulations
  - The right to receive federal housing subsidies
key: A
explanation: Real property consists of real estate plus the legal rights of ownership, often
  described as a bundle of rights that includes the right to possess, to control and use, to enjoy
  without interference, to exclude others, and to dispose (sell, lease, give, mortgage, or will).
  Therefore, the right to possess is part of the bundle. The right to mine subsurface minerals is
  not one of those rights.
