stem: A parcel described by metes and bounds forms a rectangle measuring 500 feet in width and 100
  feet in depth. What is the area of the parcel in acres?
options:
  - 1.25 acres
  - 1.05 acres
  - 1.35 acres
  - 1.15 acres
key: D
explanation: 'First, compute the area in square feet: 500 ft × 100 ft = 50,000 sq ft. Then convert
  to acres using the standard conversion 1 acre = 43,560 sq ft: 50,000 ÷ 43,560 ≈ 1.147 acres, which
  rounds to 1.15 acres. The distractor "1.05 acres" would result from using an incorrect conversion
  factor or miscalculating the square footage.'
