math:
  worked_solution: |-
    Area in square feet = width × depth = 500 ft × 100 ft = 50,000 sq ft
    Area in acres = square feet ÷ 43,560 sq ft/acre = 50,000 ÷ 43,560 = 1.147... acres
    Rounded to two decimal places = 1.15 acres
