stem: A commercial tenant installs a display shelving unit in a leased retail space. The lease
  agreement includes a clause stating that the shelving will remain the property of the landlord
  upon lease termination. At the end of the lease, the tenant does not remove the shelving. Who owns
  the shelving?
options:
  - The shelving remains the tenant's personal property under the lease
  - The shelving is a fixture and belongs to the landlord under the lease
  - The shelving must be removed by the tenant before lease end under the agreement
  - The shelving becomes the landlord's property if the tenant agrees in writing
key: B
explanation: Because the lease agreement contains a written clause that the shelving will remain the
  landlord's property, the agreement test for fixtures applies and the shelving is considered a
  fixture that belongs to the landlord. The tenant’s failure to remove it does not change this
  outcome.
