stem: A property has a 2018 mortgage recorded February 2018, a 2020 judgment lien recorded April
  2020, and a mechanic's lien for work begun November 2019 and filed January 2021. Assuming the
  mechanic's lien relates back to when work began, which lien is paid second from foreclosure
  proceeds?
options:
  - The mortgage lien
  - The judgment lien
  - The mechanic's lien
  - The property tax lien
key: C
explanation: Because the mechanic's lien relates back to November 2019, its effective date is after
  the February 2018 mortgage but before the April 2020 judgment lien, so it is paid second. The
  mortgage lien, despite being earliest, is paid first, not second, because the mechanic's lien's
  relation‑back date places it after the mortgage.
