stem: Which of the following liens is classified as both specific and voluntary?
options:
  - A mortgage lien
  - A mechanic's lien
  - A judgment lien
  - A property tax lien
key: A
explanation: A mortgage lien is classified as both specific and voluntary because it is created by
  the property owner's agreement and attaches to a particular piece of real property. In contrast,
  property tax and mechanic's liens are involuntary, and a judgment lien is general rather than
  specific.
