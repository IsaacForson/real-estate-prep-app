stem: What is the definition of a lien in real estate?
options:
  - A legal claim that gives the holder ownership of the property when the debtor fails to satisfy
    the underlying obligation.
  - A contractual agreement allowing the holder to use the property for a specified period in
    exchange for consideration.
  - A government-imposed restriction limiting how the land may be used, often for environmental or
    public welfare purposes.
  - A charge against property securing payment of a debt or obligation; if unpaid, the lienholder
    may force a sale and be paid from the proceeds.
key: D
explanation: A lien is a charge against property that secures the payment of a debt or obligation;
  if the debt remains unpaid, the lienholder can force a sale and be paid from the proceeds. The
  other choices describe a usage agreement, an ownership claim, or a land-use restriction, none of
  which define a lien.
