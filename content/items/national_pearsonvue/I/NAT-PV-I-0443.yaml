stem: Which of the following is one of the five rights that comprise the bundle of rights in real
  property?
options:
  - Right to possess.
  - Right to zone land.
  - Right to get aid.
  - Right to levy taxes.
key: A
explanation: The bundle of rights in real property consists of the right to possess, the right to
  control and use, the right to enjoy without interference, the right to exclude others, and the
  right to dispose. The right to possess is one of these rights. The other options describe
  governmental powers or rights not included in the ownership bundle.
