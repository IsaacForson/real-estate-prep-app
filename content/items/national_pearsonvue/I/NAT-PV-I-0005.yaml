stem: Under the usual rule of construction, when elements of a metes-and-bounds description conflict
  with one another, which element controls first?
options:
  - Courses, such as the bearings of each line
  - Natural monuments, such as a river or a tree
  - Stated distances, such as feet in each course
  - Stated area, such as the acreage recited
key: B
explanation: When elements conflict, the rule ranks natural monuments first, then artificial
  monuments, adjoining boundaries, courses, distances, and stated area last, because what a surveyor
  could see on the ground is more reliable than copied numbers. Stated area ranks last, not first.
