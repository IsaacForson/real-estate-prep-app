stem: Which statement correctly compares the priority treatment of property tax liens and mechanic's
  liens?
options:
  - Mechanic liens beat tax liens
  - Tax liens paid after mechanic liens
  - Tax liens ahead regardless of date
  - Both liens paid in recording order
key: C
explanation: Property tax liens generally rank ahead of all other liens regardless of date,
  including an earlier-recorded mortgage. Mechanic's lien priority is set by state statute and may
  relate back to when work began. Therefore, the statement that tax liens take precedence regardless
  of date is correct, while the statement claiming mechanic's liens beat tax liens is incorrect.
