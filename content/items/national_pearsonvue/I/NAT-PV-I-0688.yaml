stem: A lender wants its mortgage to be paid before an existing mechanic's lien despite the mortgage
  being recorded later. What can the parties do to achieve this?
options:
  - Record a subordination agreement
  - File a lis pendens
  - Record a declaration of homestead
  - Execute a quitclaim deed
key: A
explanation: Parties can rearrange lien priority by executing a recorded subordination agreement,
  which makes a junior lien senior to a prior lien. A lis pendens only notes pending litigation, a
  homestead declaration protects equity, and a quitclaim deed transfers interest without affecting
  priority.
