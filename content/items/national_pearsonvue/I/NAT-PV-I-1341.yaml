stem: What is police power under the government powers over private land?
options:
  - The state's inherent authority delegated to local governments to regulate land use for public
    welfare
  - The power to take private property for public use upon payment of just compensation
  - The authority to impose taxes on real property to fund government services
  - The right of the state to reclaim property when an owner dies without heirs
key: A
explanation: Police power is the state's inherent authority, delegated to counties and cities, to
  enact and enforce laws that protect public health, safety, morals, and general welfare. This
  differs from eminent domain, which allows the government to take private property for public use
  with just compensation, and from taxation and escheat, which involve levying taxes on real
  property and reverting ownerless property to the state, respectively. (Reference note on police
  power, Property & Land Use)
