stem: What are air rights?
options:
  - A. The right to use the space above the surface subject to navigable-airspace rules
  - B. The right to extract minerals from beneath the land surface
  - C. The right to divert water from a non-navigable stream
  - D. The right to occupy land for a limited period under a lease
key: A
explanation: "Air rights are the right to use the space above the surface, subject to
  navigable-airspace rules. The other options describe different rights: the right to extract
  minerals from beneath the land surface (subsurface mineral rights), the right to divert water from
  a non-navigable stream (water rights), and the right to occupy land for a limited period under a
  lease (a leasehold)."
