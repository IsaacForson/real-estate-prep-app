stem: A tenant plants corn on leased farmland. Six months later, the landlord terminates the lease
  for no fault of the tenant. Under the doctrine of emblements, what may the tenant do?
options:
  - The tenant must pay the landlord for the value of the corn
  - The tenant may remove the corn as personal property before leaving
  - The tenant must leave the corn for the landlord
  - The tenant may re-enter to harvest the corn
key: D
explanation: The doctrine of emblements allows a tenant whose tenancy ends through no fault of the
  tenant at an unpredictable time to return to the farm and harvest the crops the tenant planted.
  Accordingly, the tenant may re‑enter to harvest the corn. The other answer choices are incorrect
  because the corn is not personal property that can be removed, the tenant does not owe payment for
  the corn, and the tenant is not required to leave the corn for the landlord. (Property & Land Use
  reference)
