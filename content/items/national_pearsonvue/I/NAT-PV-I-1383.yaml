stem: What is an appurtenance?
options:
  - A right that must be expressly mentioned in the deed to be enforceable
  - A right that belongs to and passes with the land even if the deed does not name it
  - A temporary permission to use another's land that expires with the lease
  - A personal property item that becomes real property when attached
key: B
explanation: An appurtenance is a right that belongs to the land and passes with it, even if the
  deed does not mention that right. The option stating 'A right that belongs to and passes with the
  land even if the deed does not name it' matches this definition. The option describing a personal
  property item that becomes real property when attached refers to a fixture, not an appurtenance.
  The option saying a right must be expressly mentioned in the deed to be enforceable contradicts
  the definition, which says the deed need not name the right. The option describing a temporary
  permission to use another's land that expires with the lease describes a license, not an
  appurtenance.
