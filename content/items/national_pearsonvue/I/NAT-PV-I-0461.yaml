stem: "Real property is defined as:"
options:
  - Land plus ownership rights and personal property
  - Land plus attachments and ownership rights
  - Land plus the legal rights of ownership
  - Land plus permanent human-made attachments
key: B
explanation: Real property consists of land together with any permanent improvements attached to the
  land and the bundle of rights that accompany ownership. Because real estate is land plus permanent
  human-made attachments and real property adds the legal rights of ownership, the complete
  definition includes land, attachments, and ownership rights. The other choices omit either the
  attachments or the ownership rights, so they are incomplete.
