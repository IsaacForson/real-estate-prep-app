stem: Which statement correctly defines a general lien?
options:
  - A lien that attaches to all of the debtor's property, real and personal.
  - A lien that attaches to only one parcel of real property.
  - A lien that is created by the owner's agreement.
  - A lien that arises without the owner's consent by statute.
key: A
explanation: "A general lien attaches to all of the debtor's property, both real and personal. The
  other options describe different types of liens: a statutory lien that arises without consent, a
  specific lien that attaches to only one parcel, and a consensual lien created by agreement."
