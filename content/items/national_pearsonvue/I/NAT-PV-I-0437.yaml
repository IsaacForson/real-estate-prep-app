stem: A buyer purchases a home and the seller leaves a built‑in microwave that is bolted to the
  kitchen cabinets. The purchase contract does **NOT** mention the microwave. What is the status of
  the microwave?
options:
  - It remains personal property because it is not bolted.
  - It is a trade fixture and must be removed by the seller.
  - It becomes the buyer's personal property only if the buyer pays extra.
  - It is a fixture and passes with the real estate.
key: D
explanation: A built‑in appliance that is attached to the property is a fixture. A fixture passes
  with the real estate unless the contract specifically excludes it, so the microwave remains part
  of the property. (Reference note on property characteristics, legal descriptions, land use
  controls)
