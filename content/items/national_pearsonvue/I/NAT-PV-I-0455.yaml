stem: Which statement is true regarding both area variances and use variances?
options:
  - An area variance permits a use not otherwise allowed.
  - They both require demonstrating unnecessary hardship unique to the property.
  - A use variance is easier to obtain than an area variance.
  - A use variance can be granted by a zoning board of appeals, but an area variance cannot.
key: B
explanation: Both area and use variances may be granted only when the applicant shows that the
  strict application of the zoning ordinance would create an unnecessary hardship that is unique to
  the particular property and not caused by the owner, and that the proposed deviation will not
  adversely affect the public or the neighborhood. The other answer choices describe characteristics
  that are not required for either type of variance.
citation:
