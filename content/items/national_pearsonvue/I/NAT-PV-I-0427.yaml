stem: Which lien is described as a specific, involuntary, statutory claim that arises for
  contractors, subcontractors, laborers, or suppliers who improve real property and are unpaid?
options:
  - Judgment lien
  - Mortgage lien
  - Mechanic's lien
  - Federal tax lien
key: C
explanation: A mechanic's lien is a specific, involuntary, statutory claim that arises when
  contractors, subcontractors, laborers, or suppliers improve real property and are not paid.
  Judgment liens arise from court judgments and are general in nature. Federal tax liens are general
  liens that attach to property for unpaid tax assessments. Mortgage liens are voluntary liens
  created to secure a loan. (Property & Land Use reference)
