key: A
explanation: A section is defined as a one‑mile square, which contains 640 acres. The option stating
  that a section contains 640 acres is correct. The option stating that a section contains 320 acres
  describes a half‑section, which is a common mistake.
citation:
  source: REP Ref. Property & Land Use § 3.3
  url: null
  quoted_text: "A section is 1 mile square: 1 square mile, 640 acres, 5,280 feet per side."
