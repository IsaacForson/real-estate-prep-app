stem: Which lien is created by the owner's agreement?
options:
  - It is a mortgage or deed of trust.
  - It is a property tax lien.
  - It is a mechanic's lien.
  - It is a judgment lien.
key: A
explanation: A voluntary lien is created by the owner's agreement; examples include a mortgage or
  deed of trust. The option stating 'It is a mortgage or deed of trust' correctly identifies a
  voluntary lien. The option stating 'It is a mechanic's lien' describes an involuntary lien that
  arises from work performed on the property, not from the owner's agreement. The option stating 'It
  is a property tax lien' describes an involuntary lien imposed by statute for unpaid taxes. The
  option stating 'It is a judgment lien' describes an involuntary lien resulting from a court
  judgment.
