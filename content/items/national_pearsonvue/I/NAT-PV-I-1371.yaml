stem: If a lien remains unpaid, what action can the lienholder take?
options:
  - The lienholder can wait until the property is sold voluntarily.
  - The lienholder can sue the borrower for personal damages only.
  - The lienholder can automatically acquire title to the property.
  - The lienholder can force a sale of the property and be paid from the proceeds.
key: D
explanation: Under § 8.1, a lienholder may force a sale of the property and be paid from the
  proceeds if the debt remains unpaid. The distractor suggesting automatic acquisition of title is
  incorrect because a lien does not convey ownership; it only gives the right to satisfy the debt
  from sale proceeds.
