stem: What is the term for the right to use the space above the surface subject to
  navigable‑airspace rules?
options:
  - Water rights
  - Mineral rights
  - Easement
  - Air rights
key: D
explanation: Air rights are the right to use the space above the surface subject to
  navigable‑airspace rules, and they may be sold or leased to allow construction above a rail yard.
  Mineral rights involve subsurface resources such as oil, gas, or minerals. Water rights pertain to
  the use of surface water like rivers or lakes. An easement is a non‑possessory interest that
  allows someone to use another’s land for a specific purpose.
