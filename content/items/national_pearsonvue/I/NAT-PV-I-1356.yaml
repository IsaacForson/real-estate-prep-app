stem: Which of the following is an example of personal property?
options:
  - The furnace installed in a house
  - The promissory note for the loan
  - The parcel of land surveyed by the
  - The appurtenant easement granted
key: B
explanation: Personal property includes intangible rights such as a promissory note; a furnace is a
  fixture, land is real property, and an easement is an appurtenance that runs with the land.
  Therefore, the promissory note for the loan is personal property. The other options describe real
  property or fixtures.
citation:
  source: REP Ref. Property & Land Use § 1.2
  url: null
  quoted_text: "Personal property (chattels, personalty) is everything that is not real property:
    movable things such as furniture, vehicles, and equipment, and intangible rights such as a
    promissory note."
