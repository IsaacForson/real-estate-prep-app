stem: What must be shown to obtain a zoning variance?
options:
  - Unnecessary hardship unique to the property
  - Financial difficulty experienced by the owner
  - Higher traffic volume affecting the neighborhood
  - Approval from neighboring property owners
key: A
explanation: According to the variance provisions, a variance is granted only when strict
  application would impose unnecessary hardship unique to the property, not created by the owner,
  and the deviation would not harm the public or neighborhood. The distractor 'Financial hardship of
  the owner' is incorrect because the hardship must arise from the land itself, not the owner's
  finances.
