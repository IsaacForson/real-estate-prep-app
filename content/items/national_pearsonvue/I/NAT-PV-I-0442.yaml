stem: If work on a property began in January 2021, a mortgage was recorded in March 2021, and a
  mechanic's lien for that work was recorded in May 2021, which factor determines whether the
  mechanic's lien has priority over the mortgage under the rule described in the text?
options:
  - The date when the lien was recorded.
  - The date when the work began.
  - The amount of the lien claimed.
  - The type of work performed.
key: B
explanation: Mechanic's lien priority is set by state statute and may relate back to when work
  began. Thus, the determining factor is the date the work began, not the recording date or other
  considerations.
