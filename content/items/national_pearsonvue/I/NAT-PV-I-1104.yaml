stem: What is a trade fixture?
options:
  - An item a commercial tenant attaches to leased premises to carry on a business.
  - An item a landlord installs to improve the rental property.
  - An item that becomes real property regardless of the tenant's intent.
  - An item that must remain with the property after the lease ends.
key: A
explanation: A trade fixture is an item that a commercial tenant attaches to the leased premises to
  conduct a business; it remains the tenant’s personal property and may be removed at the end of the
  lease. Items installed by the landlord are not trade fixtures, and a trade fixture does not become
  real property merely because it is attached.
