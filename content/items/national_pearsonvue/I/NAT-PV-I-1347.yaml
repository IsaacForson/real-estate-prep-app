stem: What is a benchmark in the context of land surveying?
options:
  - A permanent marker whose elevation above the datum is precisely established
  - A temporary stake driven into the ground to mark property corners
  - A legal description that references a section corner in the plat
  - A type of monument used to define riparian water boundaries
key: A
explanation: A benchmark is a permanent marker (often a metal disk set in concrete or rock) whose
  elevation above the datum has been precisely established; surveyors use it as a reference point
  for measuring elevations. The option describing a temporary stake driven into the ground to mark
  property corners does not meet this definition.
