stem: A city installs new sidewalk and levies a charge only on the properties that benefit from the
  improvement. What is this charge called?
options:
  - Special assessment
  - Property tax charge
  - Impact fee assessment
  - Earnest money deposit
key: A
explanation: A special assessment is a charge imposed only on properties that receive a direct
  benefit from a specific improvement, such as a new sidewalk. Property taxes are ad valorem taxes
  applied to all property, impact fees are charged to fund general infrastructure improvements, and
  earnest money deposits are funds held by a buyer to show good faith in a purchase contract.
