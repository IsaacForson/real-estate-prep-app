stem: Which of the following rights is part of the bundle of rights that defines real property?
options:
  - The right to obtain a driver's license
  - The right to receive federal subsidies
  - The right to possess the property
  - The right to vote in local elections
key: C
explanation: Real property is defined as real estate plus the legal rights of ownership, often
  described as a bundle of rights that includes the right to possess, control and use, enjoy without
  interference, exclude others, and dispose. Voting, obtaining a driver's license, and receiving
  federal subsidies are not ownership rights included in this bundle.
