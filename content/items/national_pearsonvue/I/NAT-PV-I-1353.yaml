stem: What is escheat under property law?
options:
  - The reversion of property to the state when an owner dies intestate and no heirs can be found
  - The government's power to take private property for public use upon payment of just compensation
  - The legal nonconforming use that continues after a zoning change
  - The written agreement that limits the use of land for a specified period
key: A
explanation: Escheat is the reversion of property to the state when an owner dies intestate without
  heirs and no heirs can be found, or when property is legally abandoned. The option stating that
  property reverts to the state under those conditions is correct. The option describing the
  government's power to take private property for public use upon payment of just compensation
  describes eminent domain, which is a different concept.
