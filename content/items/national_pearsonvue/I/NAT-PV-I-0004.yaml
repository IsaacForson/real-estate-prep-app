stem: Which characteristic of land provides the legal basis for a court to order specific
  performance of a real estate purchase contract?
options:
  - Uniqueness, because no two parcels occupy the same location
  - Immobility, because land cannot be moved to another market
  - Permanence of investment, because capital in land is long-lived
  - Scarcity, because the supply of land in an area is finite
key: A
explanation: Uniqueness (non-homogeneity) means no two parcels are identical because no two occupy
  the same location, so money damages are considered inadequate and specific performance is
  available. Scarcity is an economic characteristic about finite supply pushing value up, not the
  basis for the remedy.
citation:
  source: REP Ref. Property & Land Use § 2.1
  url: null
  quoted_text: "Uniqueness is the legal basis for specific performance in real estate contracts: money
    damages are considered inadequate because the buyer cannot buy an identical substitute."
