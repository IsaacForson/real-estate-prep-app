stem: What are the three physical characteristics of land that **never** change?
options:
  - Immobility, indestructibility, and uniqueness.
  - Immobility, durability, and uniqueness.
  - Mobility, indestructibility, and uniqueness.
  - Immobility, indestructibility, and homogeneity.
key: A
explanation: "The Property & Land Use reference states that land has three physical characteristics
  that never change: immobility, indestructibility, and uniqueness. The source uses the term
  indestructibility rather than durability, so the option that substitutes durability is incorrect."
citation:
  source: REP Ref. Property & Land Use § 2.1
  url: null
  quoted_text: "Land has three physical characteristics that never change. Immobility: land cannot be
    moved, so real estate markets are local and the law of the place where the land sits governs it.
    Indestructibility: land is durable; improvements wear out but the land remains, which is why
    land is not depreciated while buildings are. Uniqueness (non-homogeneity): no two parcels are
    identical because no two occupy the same location."
