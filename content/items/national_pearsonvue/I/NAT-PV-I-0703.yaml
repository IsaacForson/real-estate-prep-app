stem: A parcel is described as "the NW 1/4 of the SE 1/4 of Section 12, Township 4 North, Range 3
  East of the Fourth Principal Meridian." What is the acreage of this parcel?
options:
  - 40 acres.
  - 80 acres.
  - 160 acres.
  - 320 acres.
key: A
explanation: A quarter‑quarter section (the NW 1/4 of the SE 1/4) is one‑sixteenth of a full
  section. Because a section contains 640 acres, one‑sixteenth of that is 40 acres. The option
  stating 80 acres would describe a half‑quarter (for example, the N 1/2 of the SE 1/4), which is
  not the parcel described.
