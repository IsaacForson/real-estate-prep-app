stem: A buyer purchases a manufactured home that currently has a vehicle title. The buyer affixes
  the home to a permanent foundation on land they own and completes the state title-surrender
  procedure. According to the text, what is the legal status of the home after these steps?
options:
  - The home is considered a fixture.
  - The home is considered a trade fixture.
  - The home is considered real property.
  - The home is considered personal property.
key: C
explanation: A manufactured home remains personal property while it carries a vehicle‑type title.
  When it is permanently affixed to a foundation on land owned by the buyer and the state conversion
  or title‑surrender process is completed, it converts to real property. Because both conditions are
  satisfied, the home is real property. The statement that the home is a trade fixture is incorrect
  because trade fixtures refer to personal‑property items used in a business and do not apply to a
  permanently affixed residence.
citation:
