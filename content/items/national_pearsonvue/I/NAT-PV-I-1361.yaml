stem: What must the government pay when exercising eminent domain to take private property for
  public use?
options:
  - Fair market value of the property
  - Severance damages for the taken parcel
  - Just compensation for the taking
  - No compensation if the use is public
key: C
explanation: Eminent domain requires the government to pay just compensation when taking private
  property for public use. Just compensation includes fair market value plus any severance damages
  for a partial taking. The option stating only fair market value is incomplete because it omits
  possible severance damages.
