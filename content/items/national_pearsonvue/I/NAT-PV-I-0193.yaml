stem: A property has a 2019 first mortgage, a 2022 home-equity line, and a 2024 mechanic's lien for
  work that began in 2021. Under the rule that mechanic's lien priority may relate back to when work
  began, which lien is senior to the mechanic's lien?
options:
  - The 2022 home-equity line
  - The mortgage and the home-equity line
  - The 2019 first mortgage
  - The mechanic's lien
key: C
explanation: If the mechanic's lien relates back to 2021, it is senior to the 2022 home-equity line
  but junior to the 2019 mortgage; thus the 2019 first mortgage remains senior to the mechanic's
  lien. The distractor claiming the home-equity line is senior overlooks the relation‑back date of
  2021.
