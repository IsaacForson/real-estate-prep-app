stem: A Wyoming real estate licensee lets their license expire after the grace period has ended.
  According to Wyoming law, what must the licensee do before the commission will reissue the
  license?
options:
  - The licensee must submit only the renewal fee and a completed renewal application.
  - The licensee must complete additional continuing education hours equal to the missed period.
  - The licensee must meet all requirements of a new applicant, including writing the appropriate
    examination.
  - The licensee must pay a penalty equal to twice the renewal fee.
key: C
explanation: After the grace period ends, an expired license cannot be renewed simply by paying
  fees; the licensee must satisfy all new-applicant requirements, which include passing the
  appropriate examination. Submitting only the renewal fee and application is insufficient once the
  grace period has lapsed.
citation:
  source: Wyo. Stat. Ann. § 33-28-101 et seq. — Wyoming Statutes Title 33, Chapter 28 — Real Estate
    License Act (Articles 1-4) — § 33-28-118(d)
  url: null
  quoted_text: Any licensee whose license has expired as provided in this section after the grace
    period has ended, shall comply with all requirements of a new applicant, including writing the
    appropriate examination, before a license will be reissued.
