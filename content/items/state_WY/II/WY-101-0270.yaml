  url: null
  quoted_text: '"Material to the transaction" means having importance, relevance or consequence to a
    person making a decision regarding the purchase, sale or lease of real estate. "Material to the
    transaction" does not include psychological considerations including, but not limited to, health
    issues, suicide, murder or crimes which have occurred on the property;'
