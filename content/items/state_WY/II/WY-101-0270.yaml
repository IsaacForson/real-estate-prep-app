stem: What does the term 'material to the transaction' mean under Wyo. Stat. Ann. § 33-28-102(b)(xxxii)?
options:
  - It is defined as having importance, relevance, or consequence to a person making a decision
    regarding the purchase, sale, or lease of real estate.
  - It is defined as any psychological consideration including health issues, suicide, murder, or
    crimes that have occurred on the property.
  - It is defined as a fee claimed, charged, or received for a listing, advertisement, or offer to
    sell or lease real estate.
  - It is defined as a license that has been placed on inactive status at the request of the
    licensee.
key: A
explanation: The statute explicitly defines 'material to the transaction' as having importance,
  relevance, or consequence to a person making a decision regarding the purchase, sale, or lease of
  real estate. The distractor about psychological considerations is incorrect because the definition
  expressly excludes such considerations from materiality.
