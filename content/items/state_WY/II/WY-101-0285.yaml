stem: A person applying for a Wyoming salesperson license submits all required documents except the
  name and address of their previous employer. According to Wyoming law, what is the most likely
  consequence?
options:
  - The commission may refuse the license because omitting a material fact is grounds for denial
  - The application will be processed normally because employment history is not required for
    licensure
  - The commission will request the missing information and then proceed with processing the
    application
  - The applicant will receive a $250 fine but the license will still be issued
key: A
explanation: The statute requires furnishing the name and address of the previous employer; omission
  constitutes a false statement of material fact, which is sufficient grounds for refusal under
  §33-28-106(m).
