stem: Under Wyoming law, what duty does a seller's agent owe to a prospective buyer regarding
  adverse material facts actually known by the licensee?
options:
  - The seller's agent shall conceal adverse material facts from the buyer.
  - The seller's agent shall disclose all adverse material facts actually known by the licensee.
  - The seller's agent shall verify adverse material facts through an independent inspection.
  - The seller's agent shall have no duty regarding adverse material facts to the buyer.
key: B
explanation: The statute states that a seller's agent owes no duty or obligation to the buyer except
  to disclose all adverse material facts actually known by the licensee. Therefore, disclosure is
  required. The distractor claiming no duty overlooks the exception that creates this disclosure
  obligation.
citation:
