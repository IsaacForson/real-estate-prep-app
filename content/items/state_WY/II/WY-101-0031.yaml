stem: What education documentation must an applicant for a Wyoming salesperson license submit if
  they do **NOT** currently hold an active real estate license in another jurisdiction?
options:
  - Proof of completion of the pre-license Salesperson Course I (state and national portions) and
    Salesperson Course II
  - Proof of completion of the pre-license Salesperson Course I (state portion only) and Salesperson
    Course II
  - Proof of completion of the pre-license Broker Course I (state and national portions) and Broker
    Course II
  - Proof of completion of the pre-license Salesperson Course II only, plus any required
    state-specific continuing education hours.
key: A
explanation: An original applicant not holding an active license in another jurisdiction must show
  proof of completing both the state and national portions of Salesperson Course I and Salesperson
  Course II. The option that requires only the state portion of Course I is insufficient because it
  omits the national portion, which is required for applicants without an active license elsewhere.
citation:
