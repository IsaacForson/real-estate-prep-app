stem: Under Wyoming law, a licensee advertising the sale of real estate that the licensee owns must
  include in the advertisement which of the following?
options:
  - The real estate company name
  - A statement that the owner is a licensee
  - The property's tax identification number
  - The licensee's individual name
key: B
explanation: Under Wyo. Stat. Ann. § 33-28-119(h), a licensee must disclose in any advertisement for
  property they own that the owner is a licensee. The correct option states this required
  disclosure. The most tempting distractor, the licensee's individual name, is insufficient because
  the statute requires disclosure of owner licensee status, not just the licensee's name.
citation:
  source: Wyo. Stat. Ann. § 33-28-119(h)
  url: null
  quoted_text: A licensee shall not advertise the sale, purchase, exchange or lease of real estate
    owned by the licensee unless the advertisement includes the fact that an owner of the real
    estate is a licensee.
