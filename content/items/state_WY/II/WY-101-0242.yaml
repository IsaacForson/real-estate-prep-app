stem: A continuing education provider finishes a class on June 15, 2024. According to Wyoming Real
  Estate Commission Rules, until what date must the provider retain the completed evaluations for
  that class?
options:
  - June 14, 2026
  - June 15, 2025
  - June 15, 2026
  - June 14, 2025
key: C
explanation: Rule 4-8(viii) mandates that evaluations be saved and archived for two (2) years
  following each class offering; June 15, 2024 plus two years is June 15, 2026. The distractor "June
  15, 2025" reflects only one year of retention, which fails to satisfy the two‑year obligation.
