stem: A licensee obtains an active Wyoming real estate license on July 10, 2022. According to
  Wyoming Real Estate Commission Rules, by what date must the licensee first renew the active
  license?
options:
  - The license must be renewed by December 31 of the third year after the license was issued
  - The license must be renewed by December 31 of the second year after the license was issued
  - The license must be renewed by December 31 of the year after the license was issued
  - The license must be renewed by December 31 of the year the license was issued
key: D
explanation: Under Section 1.(a) of the Wyoming Real Estate Commission Rules, a newly issued active
  license must be renewed by December 31 of the year it was issued, making December 31, 2022 the
  correct renewal date. The distractor that states the license must be renewed by December 31 of the
  year following the year the license was issued incorrectly adds an extra year to the renewal
  deadline.
