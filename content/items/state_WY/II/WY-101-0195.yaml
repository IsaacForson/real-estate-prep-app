stem: Under Wyoming Real Estate Commission Rules, how many days does a candidate have to submit a
  license application after receiving official notification of passing the required examination?
options:
  - The candidate must submit the application within 30 days of the notification date.
  - The candidate must submit the application within 60 days of the notification date.
  - The candidate must submit the application within 90 days of the notification date.
  - The candidate must submit the application within 120 days of the notification date.
key: C
explanation: The rule states that the registrant shall within ninety (90) days of the most recent
  notice date file the appropriate application; therefore 90 days is correct. The 60‑day option is
  incorrect because the rule specifies a 90‑day period, not 60 days.
