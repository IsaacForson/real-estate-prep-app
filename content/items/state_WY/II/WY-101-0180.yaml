stem: A Wyoming Responsible Broker receives a $10,000 earnest money check from a buyer and deposits
  it into the trust account. According to the Commission’s recordkeeping rules, which of the
  following must be included in the broker’s recordkeeping system for this transaction?
options:
  - The record must include the date received, check number, amount, buyer, seller, escrow agent,
    date delivered, description of the real estate, and disposition of the transaction in the
    broker’s journal as required by Commission rule
  - The record must include the date received, check number, amount, buyer, seller, and description
    of the real estate in the broker’s journal as required by Commission rule
  - The record must include the date received, check number, amount, buyer, seller, escrow agent,
    and date delivered in the broker’s journal as required by Commission rule
  - The record must include the date received, check number, amount, buyer, seller, escrow agent,
    date delivered, and description of the real estate in the broker’s journal as required by
    Commission rule
key: A
explanation: Under Wyo. Real Estate Comm'n Rules ch. 5, § 1(vi), the broker’s recordkeeping system
  must include the date received, check number, amount, buyer, seller, escrow agent, date delivered,
  description of the real estate, and disposition of the transaction. The option that lists all of
  these elements is correct. The other options omit one or more required elements, making them
  incorrect.
