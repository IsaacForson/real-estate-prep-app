stem: Alex has been a licensed real estate salesperson for 18 months and then worked as an associate
  broker for 12 months, all within the four years immediately preceding his application for a
  responsible broker license. Does Alex satisfy the experience requirement for a responsible broker
  license under Wyoming law?
options:
  - Yes, he meets the experience requirement.
  - No, he needs only salesperson experience.
  - No, he needs only associate broker experience.
  - No, he needs consecutive experience in one license type.
key: A
explanation: The law requires an applicant for a responsible broker license to have served actively
  for two of the four years immediately preceding the application as a real estate salesperson or
  associate broker. Alex’s combined 30 months of salesperson and associate broker experience meets
  this threshold. The distractors incorrectly impose additional restrictions not present in the
  statute.
