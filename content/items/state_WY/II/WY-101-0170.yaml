stem: Under Wyoming law, how may a licensee with an inactive status for less than three years renew
  to active status?
options:
  - Obtaining a sponsorship from an active broker
  - Completing the state licensing examination again for credit
  - Submitting the renewal fee with a renewal application
  - Providing proof of completed continuing education
key: C
explanation: The statute allows a licensee with inactive status under three years to return to
  active status by submitting the renewal fee and a renewal application. No continuing education or
  exam retake is required for this process. The distractor about providing proof of completed
  continuing education is incorrect because the statute does not mandate education for
  inactive‑to‑active renewal.
citation:
