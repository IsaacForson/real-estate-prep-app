stem: An active Responsible Broker in Wyoming is renewing their license. How many hours of required
  education must they complete during the renewal cycle?
options:
  - 24 hours of required education
  - 30 hours of required education
  - 32 hours of required education
  - 36 hours of required education
key: C
explanation: Under Section 8(a) of the Wyoming Real Estate Commission Rules, active Responsible
  Brokers must complete thirty‑two hours of required education each renewal cycle. Therefore, 32
  hours is the correct requirement. The 24‑hour option applies to Associate Brokers and
  Salespersons, not Responsible Brokers.
