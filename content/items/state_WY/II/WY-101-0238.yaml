stem: A Wyoming licensee receives a $7,500 earnest money check from a buyer. To comply with the
  definition of a funds holder under Wyoming Statute § 33-28-102(b)(xxi), the licensee must deposit
  the check with which of the following?
options:
  - An unlicensed escrow agent from another state
  - The licensee’s personal savings account
  - A mortgage broker who is not an attorney
  - A title company licensed in Wyoming
key: D
explanation: Under Wyoming Statute § 33-28-102(b)(xxi), a funds holder is a title company, closing
  agent, or attorney licensed in Wyoming who holds items of value in trust for the parties to a real
  estate transaction. Therefore, the licensee must deposit the earnest money check with a
  Wyoming‑licensed title company. Placing the funds in the licensee’s personal savings account would
  not satisfy the definition because it is not a licensed funds holder.
