stem: What is the maximum period a license may remain inactive and still be eligible for renewal to
  active status by submitting only the renewal fee and a renewal application?
options:
  - Less than four (4) year
  - Less than three (3) years
  - Less than two (2) years
  - Less than one (1) year
key: B
explanation: Under Wyo. Stat. Ann. § 33-28-101(g), a license on inactive status for less than three
  years may be renewed to active status by submitting the renewal fee and application. Therefore,
  the maximum allowable period is less than three (3) years. The option stating less than two (2)
  years is incorrect because the statute specifies three years, not two.
