stem: A responsible broker in Wyoming has obtained permission to use the trade name 'Wyoming Homes'
  alongside their licensed company name 'Peak Realty'. According to Wyoming law, what must be true
  about the display of the licensed company name on promotional materials that use the trade name?
options:
  - The licensed company name shall be omitted if the trade name is more prominent and the licensed
    name is not required.
  - The licensed company name shall be placed below the trade name on all materials unless the
    commission approves an alternative layout.
  - The licensed company name shall be displayed in a font size at least twice that of the trade
    name on all advertising.
  - The licensed company name shall be displayed in a conspicuous manner that the general public may
    easily identify, as prescribed in commission rules.
key: D
explanation: The rule states that on promotional materials the real estate company name shall be
  displayed in a conspicuous manner that the general public may easily identify, as prescribed in
  commission rules. Therefore the licensed company name must be shown conspicuously per commission
  rules. The distractor suggesting the name may be omitted is incorrect because the rule requires
  the licensed name to be displayed, not omitted.
