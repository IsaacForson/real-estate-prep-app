stem: A buyer obtains a final judgment against a licensee for fraud on March 10, 2023. All
  proceedings, including appeals, terminate on August 1, 2023. By what date must the buyer file a
  verified petition with the commission to seek payment from the real estate recovery account?
options:
  - The filing deadline is March 10, 2024
  - The filing deadline is August 1, 2023
  - The filing deadline is August 1, 2024
  - The filing deadline is August 1, 2025
key: C
explanation: Under the recovery account provisions, a claimant must file a verified petition within
  one year of termination of all proceedings, including appeals. Since proceedings ended on August
  1, 2023, the deadline is August 1, 2024. The distractor using the judgment date (March 10, 2024)
  misapplies the one-year period to the judgment date rather than the termination of proceedings.
