stem: Alex completed a felony sentence, including parole and probation, on January 15, 2023. When
  may Alex first be considered for a Wyoming real estate license under the Commission’s rule?
options:
  - Alex may be considered for certification on January 15, 2023.
  - Alex may be considered for certification on January 15, 2024.
  - Alex may be considered for certification on January 15, 2025.
  - Alex may be considered for certification immediately upon completion of the sentence.
key: B
explanation: Wyoming Real Estate Commission Rules Chapter 1 § 3(d) requires a twelve‑month waiting
  period after completion of sentencing, parole, probation, and requirements before an applicant
  with a prior felony conviction may be considered for certification. Twelve months after January
  15, 2023 is January 15, 2024, so the correct choice is the one stating that date.
