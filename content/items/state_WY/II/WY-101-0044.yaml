stem: "Under Wyoming law, a person is considered to be acting as a licensee when they:"
options:
  - The person works as an unpaid intern at a real estate office under supervision of a licensee
  - The person offers to perform any single act of real estate activity for another with the
    intention of receiving compensation
  - The person provides gratuitous advice to a friend about buying a home without expectation of
    payment
  - The person performs real estate activity solely for their own personal property without
    compensation
key: B
explanation: Wyoming law defines a licensee as anyone who, for another and with the intention or
  promise of compensation, offers, attempts, agrees to perform, or performs any single act of real
  estate activity (Wyo. Stat. Ann. § 33-28-104). The correct option describes offering to perform a
  single real‑estate act for another with the intent of receiving compensation, which meets that
  definition. The unpaid intern option lacks compensation intent, so it does not qualify. Providing
  free advice to a friend involves no compensation and therefore is not licensable activity.
  Performing real‑estate work only on one’s own property without compensation is not done for
  another and also lacks compensation, so it does not satisfy the definition.
