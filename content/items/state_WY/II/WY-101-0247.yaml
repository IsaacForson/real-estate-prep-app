stem: Maria has been a licensed real estate salesperson in Wyoming for 3 years. She wants to apply
  for a responsible broker license. Does she meet the experience requirement?
options:
  - No, she needs at least 4 years.
  - No, she needs at least 5 years.
  - No, she needs exactly 2 years.
  - Yes, she meets the requirement.
key: D
explanation: The rule states that an applicant for a responsible broker license must have served
  actively for two of the four years preceding the application as a salesperson or associate broker.
  Maria's three years of experience satisfies this requirement. The distractor "No, she needs at
  least 4 years" is incorrect because the requirement is two of four years, not a minimum of four
  years.
