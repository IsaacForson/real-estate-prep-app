stem: What is the maximum administrative fine that the Wyoming Real Estate Commission may impose for
  a single offense under the Real Estate License Act?
options:
  - $1,000
  - $2,500
  - $5,000
  - $10,000
key: B
explanation: Under Wyo. Stat. Ann. § 33-28-111(a), the commission may impose an administrative fine
  not to exceed $2,500 for each separate offense. This directly sets the ceiling for a single
  violation. The $5,000 amount applies to subsequent unlicensed activity penalties under
  §33-28-114(a), not to administrative fines for licensees.
