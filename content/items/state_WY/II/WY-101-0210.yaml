stem: A licensee changed their license from active to inactive on June 1, 2023. At the next regular
  renewal date, what must the licensee submit to renew the inactive license?
options:
  - A current fingerprint background check
  - Submission of renewal forms and fee payment
  - Proof of errors and omissions coverage
  - Completed continuing education hours
key: B
explanation: Wyoming Real Estate Commission Rules Chapter 4 §2(b) requires that an inactive license
  be renewed by submitting the proper Commission forms and paying the renewal fee. Continuing
  education is not required for inactive license renewal, so the option listing completed continuing
  education hours is incorrect. The other options describe items not mentioned in the rule for
  inactive license renewal.
