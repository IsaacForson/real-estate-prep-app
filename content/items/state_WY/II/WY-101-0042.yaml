stem: A licensed broker from Colorado wishes to apply for a Wyoming responsible broker license. In
  addition to meeting other requirements, what document must they submit to the Wyoming Real Estate
  Commission?
options:
  - A statement under seal of the home state commission evidencing good standing for the commission
  - A certified copy of the home state broker license accompanied by a letter of good standing for
    the commission
  - A certificate of completion from a Wyoming pre-licensing education course for the commission
  - A letter of good standing issued by the home state real estate commission for the commission
key: A
explanation: For a nonresident responsible broker license, the applicant must furnish the commission
  a statement under seal of the commission of their home state evidencing they are an active
  licensed responsible broker in good standing with no complaints pending. The other options either
  omit the required seal or include unnecessary documents.
citation:
  source: Wyo. Stat. Ann. § 33-28-101 et seq. § 33-28-110(b)(iv)
  url: null
  quoted_text: The individual furnishes the commission a statement under seal of the commission of his
    home state evidencing that he is an active licensed responsible broker, or an equivalent, in
    good standing and has no complaints pending against him in his home state.
