stem: A Wyoming pre-licensing school that currently delivers its Salesperson I course in a
  traditional classroom setting wishes to switch to an asynchronous online format during its
  three‑year approval period. According to Wyoming Real Estate Commission Rules, what must the
  school do before it may begin delivering the course online?
options:
  - Obtain IDECC certification for the asynchronous course before submitting any paperwork.
  - Notify all currently enrolled students of the change at least 30 days in advance.
  - Reduce the course tuition by 20 percent to reflect the online delivery format.
  - Submit an amended application to the Commission and obtain its ratification before modifying the
    delivery method.
key: D
explanation: The rule allows a school to change how a pre‑licensing course is delivered during its
  three‑year approval period, but it must first submit an amended application to the Commission and
  have that amendment ratified before offering the course in the new format. The other
  choices—requiring IDECC certification, notifying enrolled students 30 days ahead, or reducing
  tuition by 20 percent—are not required by the rule for a delivery‑method change.
citation:
