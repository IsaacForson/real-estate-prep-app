stem: In addition to meeting the associate broker coursework and examination requirements, what must
  an applicant for a Wyoming responsible broker license who holds an active license in another
  jurisdiction submit to satisfy the trust account requirement?
options:
  - Proof of errors and omissions insurance as described in W.S. 33-28-401
  - A copy of the out-of-state real estate license in good standing
  - Proof of Wyoming trust account(s) or funds holder agreement(s)
  - A certificate of completion of a Commission-approved broker management course
key: C
explanation: Section §3(c)(iii) requires a responsible broker applicant to provide proof of Wyoming
  trust account(s) or funds holder agreement(s). The distractor "Proof of errors and omissions
  insurance" is required for all license applicants under §3(a)(viii) but does not fulfill the
  specific trust account obligation for a responsible broker.
