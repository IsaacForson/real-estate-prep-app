stem: A Wyoming salesperson's license renewal deadline is June 30, 2024. The licensee submits a
  complete renewal application on August 10, 2024. Assuming the commission has set the grace period
  at the maximum allowed by law, what is the maximum late fee that may be imposed?
options:
  - $50.00
  - $75.00
  - $25.00
  - $100.00
key: B
explanation: The statute permits a grace period not exceeding sixty days; with the maximum grace
  period, June 30 plus sixty days is August 29. Since August 10 falls within that window, the
  renewal is timely but late, and the commission may assess a late fee up to the statutory maximum
  of seventy‑five dollars.
citation:
  source: Wyo. Stat. Ann. § 33-28-118(a)
  url: null
  quoted_text: The commission may establish a grace period for license renewal not to exceed sixty
    (60) days. The commission may establish a late fee for license renewal not to exceed
    seventy-five dollars ($75.00).
