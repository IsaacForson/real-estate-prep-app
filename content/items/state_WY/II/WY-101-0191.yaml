stem: An applicant for a Wyoming associate broker license who currently holds an active real estate
  license in another jurisdiction must submit proof of completion of which pre-license coursework?
options:
  - Broker Course I (state and national portions) and Broker Course II
  - Broker Course I (state portion only) and Broker Course II
  - Salesperson Course I (state and national portions) and Salesperson Course II
  - Salesperson Course I (state portion only) and Salesperson Course II
key: B
explanation: Section §3(b)(viii)(C) specifies that an applicant who presently holds an active
  license in another jurisdiction must show proof of completing only the state portion of Broker
  Course I plus Broker Course II. The distractor "Broker Course I (state and national portions) and
  Broker Course II" applies to original applicants without an out-of-state license, making it
  incorrect for this scenario.
