stem: A responsible broker who is supervising licensees in an in-house transaction learns that the
  buyer is willing to pay more than the offer price. According to Wyoming law, what may the broker
  do with this information?
options:
  - The responsible broker shall use the information to negotiate a higher price for the seller.
  - The responsible broker shall share the information with the seller to improve their position.
  - The responsible broker shall keep the information confidential and not share it with any party.
  - The responsible broker shall disclose the information to the buyer's agent to facilitate the
    transaction.
key: C
explanation: The statute prohibits sharing any confidential information learned while supervising
  licensees or the transaction. Therefore, the broker must keep the information confidential.
  Sharing it with the seller, as in the distractor, would violate this prohibition.
citation:
  source: Wyo. Stat. Ann. § 33-28-302(j)
  url: null
  quoted_text: A responsible broker or transaction manager shall have access to all necessary
    information but shall be prohibited from sharing any confidential information of any party to
    the transaction that the responsible broker or transaction manager may learn in the process of
    supervising the licensees or the transaction.
