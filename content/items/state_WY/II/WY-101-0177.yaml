stem: A pre-licensing school that was previously approved by the Wyoming Real Estate Commission
  loses its good standing with the Wyoming Department of Education. According to Wyoming Real Estate
  Commission Rules, what is the most likely consequence for the school’s Commission approval?
options:
  - The Commission may deny renewal of the school’s approval at the end of the current approval
    period
  - The Commission is required to transfer the school’s approval to another qualifying institution
  - The Commission must impose a fine of $2,500 for each day the school remains out of good standing
  - The Commission must automatically revoke the school’s approval effective immediately
key: A
explanation: Subsection (i) requires schools to maintain good standing with the Wyoming Department
  of Education to be considered for approval. Loss of good standing means the school no longer meets
  the approval criteria, so the Commission may deny renewal of its approval.
