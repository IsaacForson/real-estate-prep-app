stem: A pre-licensing instructor plans to conduct a live Salesperson II review session using a
  synchronous webinar platform. According to Wyoming Real Estate Commission Rules, what is the
  maximum number of participants that may attend this session without requiring additional approval?
options:
  - Up to fifty (50) participants
  - Up to twenty‑five (25) participants
  - Up to seventy‑five (75) participants
  - Up to one hundred (100) participants
key: A
explanation: The rule explicitly states that approved pre‑licensing classes formatted for live
  delivery may also be delivered via live, synchronous webinar or video conference at any time to no
  more than fifty (50) participants. The other options exceed this limit and would require
  additional approval.
