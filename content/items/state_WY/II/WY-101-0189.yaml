stem: A Wyoming associate broker placed his license on inactive status on November 1, 2022. Assuming
  he wishes to reactivate the license without completing additional continuing education, what is
  the latest date he may submit a renewal application to reactivate the license?
options:
  - November 1, 2023
  - November 1, 2024
  - November 1, 2025
  - November 1, 2026
key: C
explanation: According to Wyo. Stat. Ann. § 33-28-118(f), a license on inactive status for more than
  three years cannot be reissued to active status unless the licensee first meets the
  continuing‑education requirement. To avoid that requirement, reactivation must occur within three
  years of the inactive date, making November 1, 2025 the latest permissible date.
