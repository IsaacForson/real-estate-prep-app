stem: A continuing education provider delivered a class on March 10, 2023. By what date must the
  provider retain the attendance records for that class?
options:
  - The records must be retained until March 10, 2029.
  - The records must be retained until March 10, 2026.
  - The records must be retained until March 10, 2025.
  - The records must be retained until March 10, 2028.
key: D
explanation: The rule requires attendance records to be kept for no less than five (5) years after
  each course is delivered. Adding five years to March 10, 2023 gives March 10, 2028, so the correct
  option is the one stating that the records must be retained until March 10, 2028. The other
  options give dates earlier than five years (insufficient) or later than five years (exceeds the
  minimum retention period).
citation:
  source: Wyo. Real Estate Comm'n Rules ch. 4 — Wyoming Real Estate Commission Rules, Chapter 4 —
