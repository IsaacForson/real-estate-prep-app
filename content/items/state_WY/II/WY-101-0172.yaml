stem: Under Wyoming Real Estate Commission Rules, what notice must be provided when the Commission
  revokes approval of a pre-licensing school or instructor?
options:
  - Notice provided only to the school or instructor and the Wyoming Department of Education within
    five business days
  - Notice made public and provided to the school or instructor and the Wyoming Department of
    Education within ten business days
  - Notice posted on the Commission’s website and delayed fifteen business days before informing the
    school or instructor
  - Notice filed as a formal complaint with the Attorney General before notifying the school or
    instructor
key: B
explanation: Subsection (e) requires that notice of revocation be made public and provided to the
  school or instructor and the Wyoming Department of Education within ten business days. The most
  tempting distractor omits the public notice requirement and incorrectly states a five‑day
  timeframe.
