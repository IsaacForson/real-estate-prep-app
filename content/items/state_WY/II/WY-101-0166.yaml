stem: "Under Wyoming law, a non-licensee who holds a duly executed and recorded power of attorney to
  convey real estate for an owner is:"
options:
  - The attorney-in-fact is required to hold a real estate license.
  - The attorney-in-fact is exempt from licensing requirements.
  - The attorney-in-fact must obtain a broker's license.
  - The attorney-in-fact must be employed by a licensed broker.
key: B
explanation: The statute exempts an attorney-in-fact acting under a duly executed and recorded power
  of attorney to convey real estate, unless the attorney is a licensee. Since the individual is not
  a licensee, the exemption applies and no license is required. The distractor that asserts a
  license is required overlooks the specific exemption for attorneys-in-fact.
