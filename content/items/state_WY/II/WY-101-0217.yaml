stem: A person shows a property for compensation without holding a real estate license. After a
  hearing, the Wyoming Real Estate Commission determines the person engaged in licensed activity
  without a license. What action may the commission take?
options:
  - Deny the person a license
  - Impose a fine of $2,500
  - Require additional education
  - Issue a written warning
key: A
explanation: According to Wyo. Stat. Ann. § 33-28-106(j), the commission may deny a license to
  anyone determined after a hearing to have engaged in licensed real estate activity without a
  license. The distractor suggesting a fine is incorrect because the cited statute does not
  authorize monetary penalties for this violation.
