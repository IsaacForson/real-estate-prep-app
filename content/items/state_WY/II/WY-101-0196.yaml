stem: Jordan holds an active real estate license in Colorado and wishes to obtain a Wyoming
  salesperson license. What coursework must Jordan show proof of completing with the application?
options:
  - Jordan must show proof of completion of the pre-license Broker Course I (state portion only) and
    Broker Course II.
  - Jordan must show proof of completion of the pre-license Salesperson Course I (state and national
    portions) and Salesperson Course II.
  - Jordan must show proof of completion of the pre-license Salesperson Course II only.
  - Jordan must show proof of completion of the pre-license Salesperson Course I (state portion
    only) and Salesperson Course II.
key: D
explanation: An applicant who already holds an active real‑estate license in another jurisdiction
  must submit proof of completing the pre‑license Salesperson Course I (state portion only) and
  Salesperson Course II before applying for a Wyoming license. The national portion of Course I is
  not required, and broker courses do not satisfy the requirement. Consequently, the statement that
  requires proof of the state‑only portion of Salesperson Course I and Salesperson Course II is the
  correct choice.
