stem: A required education class is scheduled for 8 clock hours. According to Wyoming Real Estate
  Commission Rules, what is the minimum attendance time a participant must have to be eligible for
  continuing education credit?
options:
  - The participant must attend at least 7.2 clock hours.
  - The participant must attend at least 7.5 clock hours.
  - The participant must attend at least 8.0 clock hours.
  - The participant must attend at least 6.4 clock hours.
key: A
explanation: The rule requires participants to be present for at least ninety percent (90%) of the
  approved course to receive credit; 90% of 8 clock hours equals 7.2 clock hours, so the correct
  requirement is that the participant must attend at least 7.2 clock hours. The other options
  overstate the requirement, demand full attendance, or understate it.
