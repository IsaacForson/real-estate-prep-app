stem: Under Wyoming law, what is required to reactivate a real estate license that has been on
  inactive status for more than three years?
options:
  - Submission of a new application and passage of the licensing exam
  - Proof of active licensure in another state for at least one year
  - Completion of thirty (30) hours of continuing education
  - Completion of the educational requirements under subsection (b) of § 33-28-118
key: D
explanation: Under Wyo. Stat. Ann. § 33-28-118(f), a license on inactive status for more than three
  years cannot be reissued to active status unless the licensee first meets the educational
  requirements set out in subsection (b). Therefore, reactivation requires completing those
  continuing‑education obligations. The other options describe actions for a brand‑new applicant or
  for reciprocity, which are not sufficient for reactivation after prolonged inactivity.
