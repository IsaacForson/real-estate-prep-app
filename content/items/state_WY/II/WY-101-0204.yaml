stem: "A responsible broker receives earnest money from a buyer and, before closing, uses part of it
  to pay for personal office rent, intending to repay later. Under Wyoming law, this action is:"
options:
  - Not permissible because trust funds cannot be used elsewhere
  - Not permissible because all parties agree in writing to the use
  - Not permissible because the amount is repaid before settlement
  - Not permissible because the broker labels the funds as personal
key: A
explanation: Wyo. Stat. Ann. § 33-28-122(e) prohibits using trust account deposits for any purpose
  other than the specific transaction for which they were received. Using earnest money to pay
  office rent violates this rule, regardless of intent to repay or obtaining party consent. The
  distractor suggesting repayment before settlement is incorrect because the prohibition applies at
  the time of use, not contingent on later repayment.
