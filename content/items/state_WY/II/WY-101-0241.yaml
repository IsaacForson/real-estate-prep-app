stem: A continuing education provider completes a class on March 1, 2025. According to Wyoming Real
  Estate Commission Rules, by what date must the provider file the final attendance records and
  completion certificates with the Commission?
options:
  - March 12, 2025
  - March 11, 2025
  - March 10, 2025
  - March 13, 2025
key: B
explanation: Under 4-8(vii), final attendance records and completion certificates must be filed
  within ten (10) calendar days following each class offering; March 1 plus ten days equals March
  11, 2025. The distractor "March 10, 2025" is only nine days after the offering and therefore does
  not meet the ten‑day requirement.
