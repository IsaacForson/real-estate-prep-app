stem: An applicant for a Wyoming salesperson license completed 28 classroom hours in an approved
  pre‑licensing course. Does this satisfy the education requirement for licensure?
options:
  - No, because at least 30 classroom hours are required
  - Yes, if the applicant also passes the state examination
  - No, because the course must be completed in a traditional classroom setting
  - Yes, because any coursework over 20 hours is acceptable
key: A
explanation: The law requires salesperson applicants to furnish evidence of completing not less than
  thirty class hours in an approved course; 28 hours falls short of this threshold. The option
  suggesting that any coursework over 20 hours is acceptable misstates the hourly requirement.
