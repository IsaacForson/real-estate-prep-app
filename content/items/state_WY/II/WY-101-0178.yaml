stem: Under Wyoming Real Estate Commission Rules, when a Responsible Broker receives cash or a check
  belonging to another person, by what time must the money be deposited into the trust account if no
  written agreement to the contrary exists?
options:
  - The money must be deposited by the close of the next banking day after receipt
  - The money must be deposited within 24 hours of receipt
  - The money must be deposited within five business days of receipt
  - The money must be deposited within three business days of receipt
key: A
explanation: Wyoming Real Estate Commission Rules, Chapter 5, § 1(v) requires that a responsible
  broker place cash or checks received for another person into the trust account no later than the
  close of the first banking day after receipt, unless the parties have a written agreement
  providing a different deadline. Accordingly, the statement that the money must be deposited by the
  close of the next banking day after receipt is the correct choice. The alternatives that set a
  24‑hour deadline, a five‑business‑day deadline, or a three‑business‑day deadline do not match the
  rule’s required timing.
