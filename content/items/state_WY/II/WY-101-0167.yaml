stem: "Under Wyoming law, an officer of a federal agency who is performing official duties that
  involve real estate transactions is:"
options:
  - The federal officer is exempt from licensing requirements.
  - The federal officer must be employed by a licensed broker.
  - The federal officer must obtain a broker's license.
  - The federal officer is required to hold a real estate license.
key: A
explanation: The statute exempts any officer or employee of a federal agency in the conduct of his
  official duties, unless that individual is a licensee. Therefore, a federal officer performing
  official duties involving real estate is exempt from licensing requirements. The distractor
  claiming a license is required ignores the federal employee exemption.
