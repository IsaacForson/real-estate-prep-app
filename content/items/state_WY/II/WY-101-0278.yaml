stem: After commencing a lawsuit that may result in payment from the real estate recovery account,
  when must the plaintiff notify the Wyoming Real Estate Commission in writing?
options:
  - Notify the commission after the court enters judgment
  - Notify the commission at the commencement of the action
  - Notify the commission upon receiving the investigation notice
  - Notify the commission before filing the lawsuit
key: B
explanation: The statute mandates that the person notify the commission in writing of the
  commencement of the action (Wyo. Stat. Ann. § 33-28-203(a)). Therefore, notice must be given at
  the commencement of the action. The option stating notice before filing the lawsuit is incorrect
  because the requirement is tied to commencement, not pre‑filing.
