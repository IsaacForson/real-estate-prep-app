stem: A responsible broker completed a real estate transaction on April 15, 2022. On what date may
  the broker first destroy the records of that transaction, assuming the minimum retention period?
options:
  - The records may be destroyed on April 15, 2023
  - The records may be destroyed on April 15, 2024
  - The records may be destroyed on April 15, 2025
  - The records may be destroyed on April 15, 2026
key: B
explanation: Records must be maintained for not less than two years from the latest date the real
  estate company participated in the transaction. Starting from April 15, 2022, the two‑year period
  ends on April 15, 2024, after which records may be destroyed. The distractor suggesting April 15,
  2023 incorrectly uses a one‑year period.
