stem: "Under Wyoming law, a resident manager who lives on the premises and leases apartments for the
  owner as part of employment is:"
options:
  - The resident manager must obtain a broker's license.
  - The resident manager is required to hold a real estate license.
  - The resident manager is exempt from licensing requirements.
  - The resident manager must be employed by a licensed broker.
key: C
explanation: The statute exempts a resident manager who resides on the premises and engages in
  leasing in connection with employment, unless the individual is a licensee. Therefore, the
  resident manager described is exempt from licensing requirements. The distractor that claims a
  license is required ignores the statutory exemption for resident managers.
