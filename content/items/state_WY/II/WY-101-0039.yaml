stem: Taylor holds a bachelor’s degree in business and has been licensed as a real estate
  salesperson for 14 months. Taylor applies for an associate broker license in Wyoming. Does Taylor
  meet the qualification requirements under Wyoming law?
options:
  - Yes, because a bachelor’s degree satisfies the education alternative.
  - Yes, because fourteen months of salesperience counts toward the experience requirement.
  - No, because Taylor lacks either two years of salesperson experience or a real estate degree.
  - No, because Taylor must also provide proof of errors and omissions insurance.
key: C
explanation: For an associate broker license, the applicant must either have served actively for two
  of the four years as a salesperson or hold a degree in real estate from an accredited institution.
  Taylor’s business degree does not satisfy the real‑estate degree alternative, and 14 months is
  insufficient experience. Therefore Taylor does not qualify. The other options misstate the degree
  or experience criteria.
