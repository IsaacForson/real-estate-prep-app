stem: Which of the following items is **NOT** required to be included in the same packet as the
  application form for a Wyoming salesperson license?
options:
  - Completed application form with the required fees
  - Proof of legal presence and legal name in the United States
  - Fingerprint cards accompanied by payment for processing
  - Recent photograph of the applicant taken within the last year
key: C
explanation: The rule states that salesperson applicants must submit the listed items in one packet,
  excluding fingerprint cards. Therefore fingerprint cards are not required to be included in the
  packet with the other documents. The most tempting distractor is "Proof of legal presence and
  legal name in the United States" because it is a required packet item, but the question asks for
  the item that is NOT required to be in the packet.
