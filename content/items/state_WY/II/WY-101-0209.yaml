stem: A licensee obtains an inactive license on August 22, 2023. According to Wyoming Real Estate
  Commission Rules, by what date must the licensee first renew this inactive license?
options:
  - June 30, 2024
  - December 31, 2023
  - December 31, 2024
  - August 22, 2024
key: B
explanation: According to Wyo. Real Estate Comm'n Rules ch. 4 § 2(c), a newly issued inactive
  license must be renewed by December 31 of the year it was issued. Since the license was issued on
  August 22, 2023, the renewal deadline is December 31, 2023. The other choices give dates later
  than that or use the issuance date, which do not meet the rule. Therefore the choice specifying
  December 31, 2023 is correct.
