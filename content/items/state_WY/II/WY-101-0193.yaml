stem: A Wyoming associate broker who does not own a commercial building wishes to advertise its
  lease. What must the advertisement include under Wyoming law?
options:
  - The associate broker's personal phone number and email
  - The real estate company name under which he is licensed
  - The broker's statement that he is a licensed real estate agent
  - The building's zoning classification and permitted use
key: B
explanation: For an associate broker or salesperson advertising property they do not own, the law
  obliges inclusion of the real estate company name under which they are licensed. Failure to do so
  is prohibited. The distractor about a personal phone number does not satisfy the requirement, as
  the statute specifies the company name must appear in the advertisement.
citation:
  source: Wyo. Stat. Ann. § 33-28-119(g)
  url: null
  quoted_text: A licensed associate broker or salesperson shall not advertise the sale, purchase,
    exchange or lease of real estate, unless owned by him, without including in the advertisement
    the real estate company name under which he is licensed by the commission.
