stem: Under Wyoming law, what is the effect of making a **false** statement of material fact on a
  real estate license application?
options:
  - Temporary suspension of the license
  - Mandatory revocation of the license
  - Conditional approval of the application
  - Automatic denial of the application
key: D
explanation: Under Wyo. Stat. Ann. § 33-28-106(m), a false statement of material fact made in an
  application is sufficient grounds for the refusal of a license, meaning the application must be
  denied. The distractor describing possible denial after a hearing applies to unlicensed activity
  under subsection (j), not to false statements.
