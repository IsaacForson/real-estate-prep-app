stem: An instructor plans to deliver a pre-licensing Salesperson I course entirely asynchronously
  online. What must the instructor do before offering the course to students?
options:
  - Obtain IDECC certification after Commission pre-approval
  - Obtain IDECC certification before Commission pre-approval
  - Obtain Wyoming Department of Education approval as a training entity
  - Obtain a live synchronous webinar license for up to 50 participants
key: A
explanation: Subsection (a)(vi) states that asynchronous online pre-licensing classes shall be
  certified by IDECC after they are pre-approved or approved by the Commission. Therefore,
  certification must follow Commission pre‑approval, not precede it. Obtaining Wyoming Department of
  Education approval or a live webinar license does not satisfy the asynchronous‑online requirement.
