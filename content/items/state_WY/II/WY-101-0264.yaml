stem: What must a pre-licensing school submit to the Commission every three years to maintain approval?
options:
  - Proof of IDECC certification
  - A copy of the state real estate statutes
  - A list of all enrolled students
  - A formal application
key: D
explanation: The rule requires schools to submit a formal application to the Commission every three
  years to maintain approval (Wyo. Real Estate Comm'n Rules ch. 4 § 5(ii)). Therefore, the school
  must provide a formal application. The distractor about IDECC certification applies only to
  asynchronous online classes, not to the general three‑year renewal requirement.
