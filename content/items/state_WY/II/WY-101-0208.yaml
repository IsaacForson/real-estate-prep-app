stem: Under Wyoming Real Estate Commission Rules, what is **NOT** required for the renewal of an
  inactive license?
options:
  - Completion of continuing education hours
  - Payment of the required fees
  - Renewal on the regular renewal cycle
  - Submission of the appropriate forms
key: A
explanation: Under Wyo. Real Estate Comm'n Rules ch. 4 § 2(b), completion of required and continuing
  education is not necessary for inactive license renewal. Therefore, the option stating that
  completion of continuing education hours is required is incorrect; the correct answer is that this
  item is NOT required. The other options—payment of the required fees, renewal on the regular
  renewal cycle, and submission of the appropriate forms—are all mandated for renewal.
