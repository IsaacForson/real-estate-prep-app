stem: "A responsible broker plans to open a branch office that will operate under a trade name
  different from the licensed real estate company. According to Wyoming law, this action is:"
options:
  - The action is permitted because branch offices may choose any trade name
  - The action is permitted if the broker obtains prior approval from the commission
  - The action is not permitted unless the broker also obtains a separate company license for the
    branch office
  - The action is not permitted because a branch office must use the same trade name as the licensed
    real estate company
key: D
explanation: Wyoming Statute § 33-28-109(b) requires that a branch office use the same trade name or
  business name as the licensed real estate company. Therefore, using a different trade name is not
  permitted. The option stating that the action is permitted because branch offices may choose any
  trade name is incorrect because the rule does not allow branch offices to select a different name;
  it requires sameness with the parent company's name.
