stem: A responsible broker currently operates one real estate company and wants to open a second
  company. Is this permitted under Wyoming law?
options:
  - Yes, because the broker may establish up to three companies.
  - No, because a broker may establish only one company.
  - No, because a broker must first close the existing company.
  - Yes, but only if the broker relinquishes the first company's license.
key: A
explanation: The statute allows a resident responsible broker to establish at least one but no more
  than three real estate companies or sole proprietorships within Wyoming. Opening a second company
  is therefore permitted. The distractor "No, because a broker may establish only one company" is
  incorrect because the limit is three, not one.
