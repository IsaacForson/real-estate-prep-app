stem: An instructor with five years of real estate experience and a professional resume wishes to
  teach a pre-licensing Salesperson I course. What additional documentation must they submit to meet
  the Commission’s instructor qualifications?
options:
  - Proof of completion of a state-approved real estate degree with coursework
  - Proof of successful completion of advanced coursework in adult education and instruction
  - A letter of recommendation from a supervising broker dated within the last six months
  - Evidence of having sold at least ten properties in the past year verified by brokerage records
key: B
explanation: Instructors must submit proof of successful completion of advanced coursework in adult
  education and instruction as part of their qualifications (Wyo. Real Estate Comm'n Rules ch. 4 §
  5(b)(iii)). Hence the instructor needs to provide that proof. The distractor about a
  state‑approved real estate degree is not mentioned as a requirement for pre‑licensing instructors.
