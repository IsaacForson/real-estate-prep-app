stem: A licensee wants to take an elective continuing education course offered entirely
  asynchronously online. For the course to count toward renewal, what must be true about the course?
options:
  - It must be IDECC certified
  - It must be limited to 50 attendees
  - It must be delivered via live webinar
  - It must be approved by the Commission
key: A
explanation: Section 4‑7(c) states that all elective classes delivered asynchronously online must be
  certified by the International Distance Education Certification Center (IDECC). Hence, the course
  must be IDECC certified to count toward renewal. The 50‑participant limit applies only to live
  delivery formats, not to asynchronous online courses.
