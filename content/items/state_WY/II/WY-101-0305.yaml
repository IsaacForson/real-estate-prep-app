stem: A Wyoming real estate license expires on November 15, 2023. According to the definition of
  "grace period" in Wyo. Stat. Ann. § 33-28-102(b)(xxii), by what date must the licensee renew the
  license to avoid lapse?
options:
  - March 1, 2024
  - February 28, 2024
  - January 31, 2024
  - April 1, 2024
key: A
explanation: The grace period runs from January 1 to March 1 of each year for renewing an expired
  license. A license that expires on November 15, 2023 falls within the 2023‑2024 grace period,
  which ends on March 1, 2024. Renewing by that date avoids lapse.
