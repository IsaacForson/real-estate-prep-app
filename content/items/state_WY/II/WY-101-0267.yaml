stem: After a student successfully completes a pre-licensing Broker II course, what must the
  approved school or instructor provide to the student?
options:
  - A score report showing the student’s exam results
  - A certificate showing school/instructor and completion date
  - A refund of any unused tuition fees
  - A letter of eligibility for the state exam
key: B
explanation: Approved pre‑licensing schools or instructors must issue a certificate to every
  successful participant that discloses the school and/or instructor and the date of course
  completion (Wyo. Real Estate Comm'n Rules ch. 4 § 5(viii)). Thus the school must provide such a
  certificate. The distractor about a score report is not required; only the certificate is
  mandated.
