stem: "A resident manager who lives on-site and leases apartments for the owner but does **not**
  hold a real estate license is:"
options:
  - The resident manager must obtain a salesperson license
  - The resident manager is exempt only if they hold a management certificate
  - The resident manager must obtain a broker license
  - The resident manager is exempt from licensing requirements
key: D
explanation: Under § 33-28-101(vi), any person acting as a resident manager for the owner who
  resides on the premises and is engaged in leasing real estate in connection with employment is
  exempt from licensing unless that individual is a licensee. Since the manager is unlicensed, the
  exemption applies. The option stating that the resident manager must obtain a salesperson license
  is incorrect because the statute provides an exemption for unlicensed resident managers meeting
  those conditions; a salesperson license is not required.
