stem: If a cause of action for fraud against a licensee accrued on January 15, 2024, by what date
  must a lawsuit be commenced to be eligible for payment from the real estate recovery account?
options:
  - January 15, 2024
  - January 14, 2025
  - January 15, 2026
  - January 15, 2025
key: D
explanation: The statute requires that a suit for payment from the real estate recovery account be
  commenced within one year after the cause of action accrues (Wyo. Stat. Ann. § 33-28-203(a)).
  Adding one year to January 15, 2024 gives January 15, 2025. The option January 15, 2024 is
  incorrect because it is the same day as the accrual date, not one year later.
citation:
