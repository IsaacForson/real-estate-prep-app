stem: A licensee moved their active license to inactive status on June 1, 2022, submitting the
  required forms and fees. At the next regular renewal date, what must be true about the timing of
  the renewal?
options:
  - The license must be renewed only after completing continuing education.
  - The license must be renewed on the regular renewal cycle.
  - The license must be renewed by December 31 of the year it was issued.
  - The license must be renewed within six months of the inactive date.
key: B
explanation: Subsection (b) requires that inactive licenses be renewed on the regular renewal cycle
  with proper submission of forms and payment of fees; it does not impose a six‑month window, a
  continuing education requirement, or a December 31 deadline. Thus, the only statement that must be
  true is that the license must be renewed on the regular renewal cycle. The other options add
  conditions not supported by the rule.
