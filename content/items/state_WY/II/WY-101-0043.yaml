stem: A licensee who has been acting as an agent for a buyer in a transaction wishes to instead act
  as an intermediary for the same parties. What must occur before the licensee can change the
  relationship?
options:
  - The licensee must disclose the change to both parties using a conspicuous 12‑point font
    disclosure in the contract documents.
  - Both parties must execute a written consent at the earliest reasonable opportunity after the
    events creating the potential conflict in agency relationships develops.
  - The licensee must obtain approval from the Wyoming Real Estate Commission before changing the
    relationship from agent to intermediary.
  - The licensee must terminate the existing agency agreement with the buyer and establish a mere
    customer relationship with both parties.
key: B
explanation: Under Wyo. Stat. Ann. § 33-28-307(a)(ii), a licensee may change from agent to
  intermediary only after both parties execute a written consent at the earliest reasonable
  opportunity following the events that create the potential conflict. The written consent must
  include a conspicuous statement of the duties no longer owed. Simply disclosing the change in a
  12‑point font does not satisfy the consent requirement, and commission approval or ending the
  agency agreement for a customer relationship is not mandated.
