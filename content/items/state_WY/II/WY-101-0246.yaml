stem: A Wyoming licensee prepares a broker's price opinion for a prospective buyer recommending a
  purchase price. What must the licensee include in the printed or electronic opinion according to
  Wyoming law?
options:
  - The opinion must include a statement that it is an opinion of price and not a certified appraisal
  - The opinion must include a certified appraisal from a licensed appraiser
  - The opinion must include the licensee's commission rate for the transaction
  - The opinion must include a guarantee that the price reflects market value
key: A
explanation: The law mandates that every printed or electronic broker's price opinion include the
  disclaimer that it is an opinion of price and not a certified appraisal, and that a certified
  appraisal must be obtained if desired. The other options add requirements not present in the
  statute.
citation:
  source: Wyo. Stat. Ann. § 33-28-101 et seq. — Wyoming Statutes Title 33, Chapter 28 — Real Estate
    License Act (Articles 1-4) — § 33-28-125(b)
  url: null
  quoted_text: "Every printed or electronic broker's price opinion prepared as provided in subsection
    (a) of this section shall include the statement: 'This is an opinion of price and is not a
    certified appraisal of the market value of the property. If such an appraisal is desired, the
    service of a certified appraiser must be obtained.'"
