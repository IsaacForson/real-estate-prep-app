stem: A Wyoming Responsible Broker deposits his personal commission check into the company’s trust
  account to cover a temporary shortfall, intending to repay the amount later. Is this permissible
  under the Commission’s trust account rules?
options:
  - The action is allowed if the broker later reimburses the account
  - The action is allowed if the amount is less than $500
  - The action is prohibited because personal funds must remain separate from trust funds
  - The action is allowed if the broker obtains written consent from all parties
key: C
explanation: Under Wyoming Real Estate Commission Rules Chapter 5, §1(a), trust or escrow accounts
  must be kept separate from the broker’s personal or business money. Depositing personal commission
  checks into the trust account commingles funds and is therefore prohibited, regardless of intent
  to repay, the amount involved, or obtaining consent. Therefore the statement that the action is
  prohibited because personal funds must remain separate from trust funds is correct, while the
  other statements are incorrect.
