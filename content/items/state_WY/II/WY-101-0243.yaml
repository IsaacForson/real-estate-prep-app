stem: Under Wyoming Statute §33-28-119(a), when must a licensee use the licensed company name in
  advertising?
options:
  - When the licensee advertises a non-real-estate business on social media
  - When the licensee works as an unlicensed assistant for a brokerage
  - When the licensee discusses real estate in a private conversation
  - When the licensee promotes himself as a licensee in any advertisement
key: D
explanation: The statute requires a licensee to use the company name when promoting himself as a
  licensee or advertising real estate activities. Promoting oneself as a licensee in an
  advertisement triggers this requirement. Advertising a non-real-estate business, discussing real
  estate privately, or working as an unlicensed assistant do not involve promoting oneself as a
  licensee in real estate advertising.
