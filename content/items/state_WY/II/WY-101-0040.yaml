explanation: The statute explicitly states that the commission may establish a grace period for
  license renewal not to exceed sixty (60) days. Therefore, the maximum allowable grace period is 60
  days. A 30‑ or 45‑day period is permissible but not the maximum, while a 90‑day period exceeds the
  statutory limit.
