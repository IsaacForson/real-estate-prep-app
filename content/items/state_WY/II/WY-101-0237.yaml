stem: According to Wyoming Statute § 33-28-102(b)(xxi), what is the definition of a 'Funds holder'?
options:
  - A title company, closing agent or attorney licensed in this state who holds items of value in
    trust for the parties to a real estate transaction
  - A licensee who deposits earnest money into a personal brokerage account and holds it until
    closing
  - An out-of-state title company that holds real estate funds for Wyoming transactions and is not
    licensed locally
  - A mortgage lender that collects loan payments on behalf of the buyer and seller and deposits
    them into a trust account
key: A
explanation: Under Wyoming Statute § 33-28-102(b)(xxi), a funds holder is defined as a title
  company, closing agent, or attorney licensed in the state who holds items of value in trust for
  the parties to a real estate transaction. The option describing a licensee depositing earnest
  money into a personal brokerage account does not meet this definition because the holder must be a
  title company, closing agent, or attorney licensed in Wyoming. The option describing an
  out-of-state title company that is not licensed locally fails because the statute requires the
  holder to be licensed in this state. The option describing a mortgage lender collecting loan
  payments and depositing them into a trust account is incorrect because a mortgage lender is not a
  title company, closing agent, or attorney licensed in the state.
