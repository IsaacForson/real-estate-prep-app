stem: A Wyoming responsible broker currently holds licenses for two real estate companies and wishes
  to apply for a license for a third company. Is this permitted under Wyoming law?
options:
  - Yes, up to three companies may be licensed to the same responsible broker
  - No, because a responsible broker may have only one company license
  - Yes, but only if the third company is a sole proprietorship
  - No, because additional companies require a separate broker’s license for each
key: A
explanation: The statute allows a responsible broker to establish no more than three real estate
  companies or sole proprietorships, so adding a third company is permissible. The claim that a
  broker may have only one company license contradicts the explicit allowance of up to three.
