stem: According to Wyoming Real Estate Commission Rules, what is the minimum required duration for a
  required education seminar or class?
options:
  - It must be at least three (3) clock hours long.
  - It must be at least four (4) clock hours long.
  - It must be at least five (5) clock hours long.
  - It must be at least six (6) clock hours long.
key: A
explanation: Under Wyo. Real Estate Comm'n Rules ch. 4, § 6(j)(i), each seminar or class must be at
  least three clock hours long. Therefore the option stating a minimum of three clock hours is
  correct. The other options list longer durations, which exceed the required minimum.
