stem: A buyer obtains a final judgment against a licensee for fraud in a real estate transaction.
  How long after the cause of action accrues may the buyer seek payment from the Wyoming real estate
  recovery account?
options:
  - 6 months
  - 18 months
  - 24 months
  - 12 months
key: D
explanation: The statute provides that no order for payment from the recovery account shall be
  issued unless the suit was commenced within one (1) year after the cause of action accrued. The
  option "6 months" is incorrect because the statutory period is one year; a claim filed after six
  months but before one year would still be timely, so six months is too short.
