stem: Under Wyoming law, what is the maximum penalty an individual may face for a first conviction
  of performing real estate activity without first obtaining a license?
options:
  - A fine of not more than two thousand five hundred dollars ($2,500.00) or imprisonment in the
    county jail for a term not to exceed six (6) months.
  - A fine of not more than five thousand dollars ($5,000.00) or imprisonment in the county jail for
    a term not to exceed one (1) year.
  - A fine of not more than seven thousand five hundred dollars ($7,500.00) or imprisonment in the
    county jail for a term not to exceed eighteen (18) months.
  - A fine of not more than ten thousand dollars ($10,000.00) or imprisonment in the county jail for
    a term not to exceed two (2) years.
key: A
explanation: The statute specifies that a first offense for conducting business without a license is
  punishable by a fine not exceeding $2,500 or imprisonment not exceeding six months, or both. The
  option describing a fine up to $5,000 or imprisonment up to one year applies to a subsequent
  violation, not the first offense.
citation:
  source: Wyo. Stat. Ann. § 33-28-101 et seq. — Wyoming Statutes Title 33, Chapter 28 — Real Estate
    License Act (Articles 1-4) — § 33-28-114(a)
  url: null
  quoted_text: Any individual performing real estate activity without first obtaining a license is
    guilty of a misdemeanor and upon conviction shall be punished by a fine of not more than two
    thousand five hundred dollars ($2,500.00) or by imprisonment in the county jail for a term not
    to exceed six (6) months.
