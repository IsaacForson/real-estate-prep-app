stem: Under Wyoming Real Estate Commission Rules, what authority does the Commission have regarding
  approved pre-licensing classes?
options:
  - The Commission may audit and evaluate approved pre-licensing classes at any time.
  - The Commission must renew the approval of each school every year as required by rule.
  - The Commission may require instructors to submit lesson plans monthly for review.
  - The Commission may set the tuition rates that schools may charge for pre‑licensing courses.
key: A
explanation: The rule reserves to the Commission the right to audit and evaluate approved
  pre‑licensing classes at any time, allowing commissioners or staff to attend free of charge. The
  Commission does not have authority to mandate monthly lesson plans, set tuition, or require annual
  renewal.
