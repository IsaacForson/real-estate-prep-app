stem: When the commission causes payment to be made from the real estate recovery account to a
  judgment creditor by court order, what right does the commission acquire?
options:
  - Immunity from any further claims related to that licensee
  - Authority to void the underlying judgment against the licensee
  - Ownership interest in the licensee's real estate company
  - Subrogation to the creditor's rights for the amount paid
key: D
explanation: The statute subrogates the commission to the rights of the judgment creditor with
  respect to the amount it paid from the recovery account.
citation:
  source: Wyo. Stat. Ann. § 33-28-205
  url: null
  quoted_text: |-
    If, upon order of any court, the commission has caused payment
    to be made from the real estate recovery account to a judgment
    creditor, the commission is subrogated to the rights of the
    judgment creditor with respect to the amount so paid.
