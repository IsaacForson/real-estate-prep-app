stem: Which of the following best describes the 'Grace period' for an expired Wyoming real estate
  license under the Real Estate License Act?
options:
  - January 1 to March 1 of each year during which a suspended license may be renewed
  - January 1 to March 1 of each year during which an inactive license may be renewed
  - January 1 to March 1 of each year during which an active license may be renewed
  - January 1 to March 1 of each year during which an expired license may be renewed
key: D
explanation: Under Wyo. Stat. Ann. § 33-28-102(xxii), the grace period runs from January 1 to March
  1 each year and allows renewal of an expired license. The option stating that the grace period
  applies to an expired license is correct. The other options are incorrect because they describe
  the grace period as applying to suspended, inactive, or active licenses, which the statute does
  not support.
