stem: Under the Wyoming Safe Homes Act, how is a "Tenant" defined?
options:
  - A person who has entered into an oral or written lease with a landlord whereby the person is the
    lessee under the lease.
  - A person who occupies a residential rental unit without a written or oral lease agreement.
  - A person who owns the residential rental property and leases it to others for profit.
  - A person who manages the residential rental unit on behalf of the owner as a property manager.
key: A
explanation: The definition of "Tenant" in the Wyoming Safe Homes Act is explicitly stated as a
  person who has entered into an oral or written lease with a landlord whereby the person is the
  lessee under the lease. The other options describe occupants, owners, or managers, which do not
  match the statutory definition.
