stem: A Wyoming landlord decides the cost to repair a habitability defect is unreasonable given the
  rent charged and elects to terminate the rental agreement instead of repairing it. Within what
  window after the tenant's notice must the landlord give the tenant time to find substitute
  housing?
options:
  - No less than thirty days nor more than sixty days from the date of the notice
  - No less than three days nor more than seven days from the date of the notice
  - No less than five days nor more than ten days from the date of the notice
  - No less than ten days nor more than twenty days from the date of the notice
key: D
explanation: The residential rental statute requires an owner who elects to terminate rather than
  repair to give the renter time to find substitute housing of no less than ten days nor more than
  twenty days from the date of the notice.
citation:
  source: Wyo. Stat. Ann. § 1-21-1203
