stem: If a Wyoming real estate licensee **cannot** be personally served with a summons and complaint
  through reasonable diligence in an action alleging fraud, who is deemed to have been appointed as
  the licensee's agent for service of process?
options:
  - The director of the Wyoming Real Estate Commission
  - The state attorney general representing the state
  - The clerk of the court where the judgment was entered
  - The licensee's responsible broker who supervises them
key: A
explanation: Under Wyo. Stat. Ann. § 33-28-202, a licensee who cannot be personally served shall be
  deemed to have appointed the director of the commission as his agent for service of process. The
  responsible broker is not designated for this purpose under this provision.
