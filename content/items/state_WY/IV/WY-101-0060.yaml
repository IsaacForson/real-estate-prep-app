  source: Wyo. Stat. Ann. § 33-28-101 et seq. — Wyoming Statutes Title 33, Chapter 28 — Real Estate
    License Act (Articles 1-4) — § 33-28-202
  url: null
  quoted_text: Any licensee who cannot personally be served with a copy of a summons and complaint
    through reasonable diligence, shall be deemed to have appointed the director of the commission
    as his agent for service of process for purposes of actions filed against him pursuant to
    subsection (a) of this section.
