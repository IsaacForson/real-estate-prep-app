stem: The balances of Wyoming's real estate recovery fund and education fund each exceed fifty
  thousand dollars. What must the commission do regarding the annual recovery account fee?
options:
  - Stop collecting the annual fee under recovery statute
  - Double the annual fee under the recovery account statute
  - Transfer the fee collection duty to the state treasurer
  - Redirect the annual fee entirely to education grants
key: A
explanation: The statute directs that once both fund balances exceed fifty thousand dollars each,
  the commission shall not collect the annual fee otherwise required on license issuance or renewal.
citation:
  source: Wyo. Stat. Ann. § 33-28-206
  url: null
  quoted_text: |-
    When the real estate recovery fund and education fund
    balances exceed fifty thousand dollars ($50,000.00) each, the
    commission shall not collect annual fees under W.S.
    33-28-201(b).
