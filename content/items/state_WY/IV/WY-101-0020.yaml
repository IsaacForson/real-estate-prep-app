stem: After a Wyoming residential rental agreement terminates, within how many days must the owner
  deliver or mail the balance of the deposit and a written itemization of any deductions, absent
  damage to the unit?
options:
  - Thirty days after termination of the rental agreement
  - Fifteen days after termination of the rental agreement
  - Sixty days after termination of the rental agreement
  - Ten days after termination of the rental agreement
key: A
explanation: The deposit statute requires the balance of the deposit and a written itemization of
  deductions to be delivered or mailed within thirty days after termination of the rental agreement,
  absent damage to the unit.
