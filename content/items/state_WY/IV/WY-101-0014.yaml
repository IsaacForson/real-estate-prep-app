stem: After the commission pays a claim from the real estate recovery account on behalf of a
  judgment debtor licensee, under what condition may that licensee be relicensed or have a suspended
  license reinstated?
options:
  - Only after obtaining a co-signer for all future trust accounts
  - Only after completing twelve additional hours of ethics coursework
  - Only after repaying the amount paid with eighteen percent interest
  - Only after posting a surety bond equal to the original judgment amount
key: C
explanation: The statute keeps a judgment debtor's license suspended and unavailable until he repays
  in full the amount paid from the recovery account, with interest at eighteen percent per annum.
citation:
  source: Wyo. Stat. Ann. § 33-28-204
  url: null
  quoted_text: |-
    The judgment debtor shall
    not be licensed by the commission or have his license reinstated
    by the commission until he has repaid in full the amount paid
    from the real estate recovery account with interest thereon of
    eighteen percent (18%) per annum.
