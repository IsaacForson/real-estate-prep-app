stem: A licensee placed their real estate license on inactive status in January 2021 and wishes to
  renew it for the 2024 renewal cycle. Is continuing education required for this inactive license
  renewal?
options:
  - Forty-five hours of continuing education
  - Fifty-three hours of continuing education
  - No continuing education required
  - Continuing education required for reactivation
key: C
explanation: Wyo. Real Estate Comm'n Rules ch. 4 Section 2.(b) states that inactive licenses must be
  renewed on the regular cycle with forms and fees, but completion of required and continuing
  education is not necessary for inactive license renewal. Therefore no CE is needed; the forty‑five
  and fifty‑three hour options apply only to active licenses, and reactivation has separate
  requirements.
