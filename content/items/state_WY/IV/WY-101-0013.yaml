stem: A person intends to petition Wyoming's real estate recovery account for payment from a
  judgment against a licensee. Within what time period after the cause of action accrued must the
  underlying suit have been commenced for an order of payment to issue?
options:
  - Three years
  - One year
  - Two years
  - Six months
key: B
explanation: The statute bars any order for payment from the recovery account unless the suit that
  produced the judgment was commenced within one year after the cause of action accrued.
citation:
  source: Wyo. Stat. Ann. § 33-28-203
  url: null
  quoted_text: |-
    No order for payment from the real estate recovery
    account shall be issued unless the suit in which the order
    subsequently results was commenced within one (1) year after the
    cause of action accrued.
