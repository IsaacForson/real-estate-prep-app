stem: A salesperson license was issued on June 15, 2022. By what date must the licensee first renew
  the license to keep it active?
options:
  - June 15, 2023
  - June 15, 2025
  - December 31, 2022
  - December 31, 2023
key: C
explanation: According to Wyo. Real Estate Comm'n Rules ch. 4 Section 1.(a), a newly issued active
  license shall be renewed by December 31 of the year it was issued, regardless of the month of
  issuance. Therefore the first renewal is due December 31, 2022. The other dates mistakenly apply
  the three‑year cycle or use the issuance anniversary.
