stem: When a responsible broker transfers earnest money to a funds holder, what must the broker
  obtain under Wyoming Real Estate Commission Rules Chapter 5 §1(vi)?
options:
  - A written authorization signed by the buyer
  - A receipt showing the date and amount transferred
  - A copy of the cleared check with the deposit slip
  - A signed agreement from the funds holder
key: B
explanation: The rule requires the broker to obtain a receipt showing the date and amount of the
  funds transferred to the funds holder. The option stating that a receipt showing the date and
  amount transferred must be obtained satisfies this requirement. An option stating that a written
  authorization signed by the buyer is required does not, as the rule does not mandate such
  authorization.
