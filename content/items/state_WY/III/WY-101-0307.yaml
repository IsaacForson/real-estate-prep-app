stem: A responsible broker completed a real estate transaction on June 10, 2022. Under Wyoming law,
  what is the earliest date the broker may destroy the records for that transaction?
options:
  - June 10, 2023
  - June 10, 2024
  - June 10, 2025
  - June 10, 2026
key: B
explanation: Records must be kept for not less than two years from the latest date of participation.
  Adding two years to June 10, 2022 yields June 10, 2024 as the earliest permissible destruction
  date. The option of June 10, 2025 incorrectly adds three years.
citation:
  source: Wyo. Stat. Ann. § 33-28-123
  url: null
  quoted_text: The records shall be maintained not less than two (2) years from the latest date on
    which the real estate company participated in the transaction.
