stem: Under Wyo. Stat. § 33-28-122(d), what is the consequence if a licensee attempts to retain
  earnest money as compensation before a real estate transaction is consummated?
options:
  - The licensee is not entitled to any part of the earnest money as compensation until the
    transaction is consummated or terminated.
  - The licensee may retain the earnest money as compensation if the seller provides written consent.
  - The licensee may keep earnest money as compensation after providing a broker's price opinion.
  - The licensee must deposit earnest money into a trust account to avoid commingling.
key: A
explanation: Under Wyo. Stat. § 33-28-122(d), a licensee is not entitled to any part of the earnest
  money as compensation until the transaction has been consummated or terminated. Therefore, the
  statement that the licensee is not entitled to any part of the earnest money as compensation until
  the transaction is consummated or terminated is correct. The other statements are incorrect
  because the statute does not permit retaining earnest money as compensation based on seller
  consent, after providing a broker's price opinion, or by depositing earnest money into a trust
  account to avoid commingling.
