stem: Under Wyoming Real Estate Commission Rules Chapter 1 §5(c), what is the maximum number of days
  a licensee may request to hold his license for transfer before it automatically becomes inactive?
options:
  - 45 days
  - 15 days
  - 30 days
  - 60 days
key: C
explanation: The rule states a licensee may request to hold the license for not more than thirty
  (30) days on a hold for transfer basis; after that period the license becomes inactive. The
  thirty‑day limit distinguishes hold‑for‑transfer from an inactive license, which has no time limit
  but prohibits activity.
