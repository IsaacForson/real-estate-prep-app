stem: For how long must a responsible broker maintain a full set of records for each real estate
  transaction in which he participates?
options:
  - Not less than two years from the last participation
  - Not less than five years from the listing agreement date
  - Not less than ninety days from the final settlement date
  - Not less than one year from the date the sale closed
key: A
explanation: The statute on retention of records requires a responsible broker to keep transaction
  records for not less than two years from the latest date the real estate company participated in
  the transaction.
citation:
  source: Wyo. Stat. Ann. § 33-28-123
  url: null
  quoted_text: |-
    Every responsible broker licensed by the commission in this
    state shall keep and maintain a full set of records of every
    real estate transaction in which he participates on behalf of or
    to assist any party to the transaction. The records shall be
    maintained not less than two (2) years from the latest date on
    which the real estate company participated in the transaction.
