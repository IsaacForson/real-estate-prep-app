stem: A licensee’s Wyoming real estate license has been placed on inactive status due to failure to
  provide proof of errors and omissions insurance. According to Wyoming Real Estate Commission Rules
  Chapter 7 §12, when may the licensee resume real estate activities requiring a license?
options:
  - Immediately after submitting proof of insurance to the Commission.
  - After the Commission receives the proof and activates the license.
  - After waiting thirty days from the date of notice.
  - After paying a late fee for the missing insurance.
key: B
explanation: The rule provides that a licensee may not conduct any licensed activities until proof
  of insurance has been provided to the Commission and the license has been activated. Merely
  submitting proof is insufficient; activation is required. Waiting thirty days or paying a fee are
  not stated conditions.
