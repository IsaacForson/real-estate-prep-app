stem: "A licensee receives the buyer's earnest money deposit and, before closing, uses it to pay his
  own commission. Under Wyoming law, this conduct is:"
options:
  - Prohibited because earnest money cannot be used as compensation before closing
  - Permitted because the licensee disclosed the use to the buyer in writing
  - Permitted because the licensee returns the earnest money promptly after closing
  - Allowed because the earnest money is deposited in an interest-bearing trust account
key: A
explanation: The rule forbids a licensee from taking earnest money as compensation before the
  transaction is consummated or terminated, regardless of disclosure or intent to return the funds.
  Using the deposit to pay commission violates this prohibition. Holding the money in an
  interest‑bearing trust account does not change the fact that it is being used as premature
  compensation.
citation:
  source: Wyo. Stat. Ann. § 33-28-122(d)
  url: null
  quoted_text: A licensee is not entitled to any part of the earnest money or other item of value
    given to him in connection with any real estate transaction as part or all of his compensation
    or fee until the transaction has been consummated or terminated.
