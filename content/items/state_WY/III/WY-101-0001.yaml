stem: Under Wyoming's real estate licensing act, what must a responsible broker's advertisement
  include when advertising real estate for sale that the broker does **NOT** personally own?
options:
  - The broker's continuing education completion date on file
  - The property's most recent professional appraisal report
  - The seller's current legal mailing address of record
  - The real estate company name under which he is licensed
key: D
explanation: The licensing act requires a responsible broker advertising real estate he does not own
  to include the real estate company name under which he is licensed, so the public can identify the
  responsible company.
citation:
  source: Wyo. Stat. Ann. § 33-28-119
  url: null
  quoted_text: A licensed responsible broker shall not advertise the sale, purchase, exchange or lease
    of real estate, unless owned by him, without including in the advertisement the real estate
    company name under which he is licensed by the commission.
