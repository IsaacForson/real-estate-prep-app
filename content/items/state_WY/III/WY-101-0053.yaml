stem: Under Wyoming law, when a licensee works with a tenant in a rental transaction and there is no
  written agreement to the contrary, how is the licensee deemed to be working with the tenant?
options:
  - As the tenant's sales agent.
  - As the tenant's customer.
  - As the tenant's intermediary.
  - As the tenant's principal.
key: B
explanation: The statute expressly states that a tenant is a customer unless the parties agree
  otherwise in writing. Therefore, absent such an agreement, the licensee is deemed to be working
  with the tenant as a customer. The distractor calling the tenant an agent is incorrect because no
  agency relationship arises without a written agreement.
