stem: A sole proprietor responsible broker dies, and his personal representative applies to the
  commission for authority to wind up the deceased broker's business. What may the commission issue
  to accomplish this?
options:
  - A permanent license transferring full ownership of the company
  - A temporary license to complete the deceased broker's affairs
  - A provisional salesperson license for the representative
  - An emergency waiver exempting the estate from licensing
key: B
explanation: Wyoming law allows the director to issue a temporary license to a personal
  representative, or a person the representative designates, solely to complete the deceased
  responsible broker's affairs.
citation:
  source: Wyo. Stat. Ann. § 33-28-121
  url: null
  quoted_text: |-
    The license shall authorize the holder of the temporary license to
    continue to transact business for the sole purpose of completing
    the affairs of the deceased responsible broker.
