stem: When a licensee uses his individual name in advertising, what must be included?
options:
  - The licensee's first name only
  - The licensee's first and last name
  - The licensee's nickname only
  - The licensee's last name only
key: B
explanation: Under Wyo. Stat. Ann. § 33-28-119(j), a licensee who uses his individual name in
  advertising must include both the first and last name. Therefore, the option stating the
  licensee's first and last name is correct. The option stating only the first name does not meet
  this requirement.
