stem: A responsible broker opens a second office under the same trade name as her licensed real
  estate company. Under Wyoming law, who must direct and supervise that additional location?
options:
  - The associate broker with the most seniority at that location
  - The responsible broker who holds the company license
  - The salesperson who requested the new location
  - The commission's designated regional inspector
key: B
explanation: Wyoming law places every branch office under the direction and supervision of the
  responsible broker, so the same broker who holds the company license must oversee it.
