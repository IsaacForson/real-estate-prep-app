stem: A responsible broker deposits a small amount of his own money into a newly opened trust
  account solely to keep the account open and avoid a minimum-balance charge, identifying the
  deposit at the time it is made. How does Wyoming law treat this deposit?
options:
  - It is treated as an unlawful use of trust funds for a personal purpose
  - It voids the trust account and requires a new account
  - It requires immediate written consent from the commission
  - It is not considered commingling of personal and client funds
key: D
explanation: The statute states that depositing personal funds to open a trust account or avoid a
  minimum-balance charge is not commingling, provided the deposit is identified at the time it is
  made.
citation:
  source: Wyo. Stat. Ann. § 33-28-122
  url: null
  quoted_text: |-
    It will not be considered commingling if, when
    establishing the trust account, the responsible broker deposits
    some of his funds to keep the account open or to avoid charges
    for a minimum balance, so long as that deposit is identified at
    the time of deposit.
