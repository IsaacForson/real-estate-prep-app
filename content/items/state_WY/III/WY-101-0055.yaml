stem: Under Wyoming's errors and omissions insurance group policy, what is the minimum single-limit
  liability coverage required for each licensee per occurrence?
options:
  - $75,000.00
  - $100,000.00
  - $125,000.00
  - $150,000.00
key: B
explanation: The statute requires not less than one hundred thousand dollars single-limit liability
  coverage for each licensee per occurrence. Therefore, the minimum is $100,000.00. The distractor
  of $75,000.00 is below the statutory minimum and would not satisfy the requirement.
