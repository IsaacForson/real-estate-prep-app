  url: null
  quoted_text: All money belonging to others accepted by the Responsible Broker shall be deposited
    with a funds holder or in a bank, financial institution or other recognized depository in this
    state in a trust or escrow account separate from personal or business money belonging to the
    Responsible Broker.
