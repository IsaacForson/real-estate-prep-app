stem: According to Wyoming Real Estate Commission rules, what must a responsible broker do with
  money belonging to others that is accepted by the broker?
options:
  - Withdrawal of the money for the broker's personal expenses
  - Investment of the money in a certificate of deposit with a fixed term
  - Retention of the money in the broker's operating account
  - Deposit of the money in a trust account separate from personal or business funds
key: D
explanation: The rule requires that all money belonging to others accepted by the responsible broker
  be deposited in a trust or escrow account separate from the broker’s personal or business funds
  (Wyo. Real Estate Comm'n Rules ch. 5 § 1(a)). Therefore, the correct action is to deposit the
  money in a separate trust account. Investing the money in a fixed‑term certificate of deposit is
  prohibited unless written consent is obtained from all parties, making that option incorrect.
citation:
