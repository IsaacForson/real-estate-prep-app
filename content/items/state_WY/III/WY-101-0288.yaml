stem: A responsible broker opens a second office location under the same trade name as her licensed
  real estate company, located in a different town. The office is supervised by the responsible
  broker. Under Wyoming law, how is this second office classified?
options:
  - A principal office of the real estate company
  - A branch office of the real estate company
  - An unlicensed office location
  - A temporary license location
key: B
explanation: The definition of a branch office is any office location of a real estate company that
  is separate from a principal office and supervised by a responsible broker, which matches the
  scenario. The description that it is a principal office is incorrect because a principal office is
  not separate from itself.
