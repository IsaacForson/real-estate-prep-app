stem: There is a dispute over the return of an earnest money deposit held by a responsible broker.
  Under Wyo. Stat. § 33-28-122(f), what must the responsible broker do with the deposit?
options:
  - Apply the deposit toward the broker’s own commission to cover administrative costs.
  - Immediately disburse the deposit to the party who originally provided it.
  - Hold the deposit in trust pending release, civil action, or interpleader; then it may go to
    court.
  - Split the deposit equally between the buyer and seller regardless of the dispute.
key: C
explanation: The rule requires the broker to continue holding the deposit in a trust account until a
  written release is obtained, a civil action is filed, or the broker interpleads the parties, after
  which the deposit may be paid to the court. The distractor suggesting immediate disbursement to
  the original party is incorrect because the deposit must be held until the dispute is resolved.
citation:
  source: Wyo. Stat. Ann. § 33-28-101 et seq. — Wyoming Statutes Title 33, Chapter 28 — Real Estate
    License Act (Articles 1-4) — § 33-28-122
  url: null
  quoted_text: (f) In the event of a dispute over the return or forfeiture of any deposit held by a
    responsible broker, the responsible broker shall continue to hold the deposit in a trust account
    until he has a written release from the parties consenting to its disposition, until a civil
    action is filed or the responsible broker interpleads all parties, at which time it may be paid
    to the court.
