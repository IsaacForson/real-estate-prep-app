stem: A responsible broker receives a buyer's earnest money check on a Tuesday. Under Wyoming Real
  Estate Commission Rules Chapter 5 §1(v), by when must the broker deposit the funds unless all
  parties agree otherwise in writing?
options:
  - At the broker's discretion prior to closing
  - No later than the first banking day after receipt
  - By the close of the same business day or earlier
  - Within three banking days following receipt
key: B
explanation: The rule requires that a broker deposit any earnest money check into the trust account
  no later than the first banking day after receipt, unless all parties agree otherwise in writing.
  The choice that reads 'No later than the first banking day after receipt' matches the rule. The
  choice that reads 'At the broker's discretion prior to closing' is incorrect because it would
  permit deposit later than the required deadline.
citation:
  source: Wyo. Real Estate Comm'n Rules ch. 5 — Wyoming Real Estate Commission Rules, Chapter 5 —
