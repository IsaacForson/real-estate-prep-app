  url: null
  quoted_text: All money belonging to others in the form of cash, or check received shall be deposited
    directly into the listing Responsible Broker’s real estate company trust account or with the
    Responsible Broker’s real estate company funds holder by the listing Responsible Broker per W.S.
    33-28-122(a)(i), not later than the first banking day after receipt unless all persons having an
    interest in the funds have agreed otherwise in writing.
