stem: If the Wyoming real estate recovery account has insufficient funds to pay all valid claims,
  how are the available funds distributed according to Wyo. Stat. § 33-28-202(b)?
options:
  - Equally divided among all claimants
  - Divided proportionally to each claim's size
  - Paid to the earliest filed claims first
  - Distributed by random selection
key: B
explanation: The law requires distribution in the ratio that each claim bears to the total valid
  claims when funds are insufficient. Thus, funds are divided proportionally to each claim's size.
  The distractor of equal division ignores the claim-size ratio mandated by the statute.
