stem: A broker wants to advertise using the trade name 'Wyoming Homes' with the owner's permission
  but omits the licensed real estate company name from the advertisement. Under Wyo. Stat. §
  33-28-119(e), is this advertisement permissible?
options:
  - The advertisement is permissible because the trade name has permission
  - The advertisement is impermissible because the licensed company name must be displayed
    conspicuously
  - The advertisement is permissible only if the licensed company name appears
  - The advertisement is impermissible unless the licensed company name is shown
key: B
explanation: The statute requires that when a trade name is used in advertising, the licensed real
  estate company name must be displayed conspicuously so the public can easily identify it.
  Therefore, an advertisement that uses the trade name but omits the company name is not allowed.
  The statement that the advertisement is impermissible because the licensed company name must be
  displayed conspicuously correctly reflects this requirement. The statement that the advertisement
  is permissible only if the licensed company name appears is incorrect because merely appearing is
  not enough; the name must be displayed conspicuously.
citation:
