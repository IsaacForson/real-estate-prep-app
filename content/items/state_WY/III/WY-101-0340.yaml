stem: Under Wyo. Stat. § 33-28-302(a), what is the maximum number of broker relationships a
  responsible broker is required to offer or engage in?
options:
  - "Number of broker relationships: Four (4)."
  - "Number of broker relationships: Three (3)."
  - "Number of broker relationships: Two (2)."
  - "Number of broker relationships: One (1)."
key: D
explanation: The statute states that a responsible broker shall not be required to offer or engage
  in more than one (1) of the broker relationships, meaning the maximum number required is one. The
  distractor suggesting two relationships is incorrect because the law does not require a broker to
  engage in more than one relationship.
