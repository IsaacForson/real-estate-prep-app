stem: A Wyoming licensee currently sponsored by Broker Alpha wants to change sponsorship to Broker
  Beta. What must the licensee do to remain compliant with Wyoming law?
options:
  - The payment of a transfer fee to the Commission before changing sponsors
  - The indication of the license transfer on a Commission-provided transfer form
  - The submission of a written request to the Commission for a new license
  - The notification of the change to the licensee's clients within 30 days
key: B
explanation: Wyo. Real Estate Comm'n Rules ch. 1 §5(a) requires that the notice of transfer be
  indicated on a Commission-provided transfer form. The other options describe actions not mandated
  by this rule.
