stem: Under Wyoming law, what is the consequence if a responsible broker uses trust account funds to
  pay office rent?
options:
  - Allowed because office rent is a necessary business expense
  - Permitted if the broker replenishes the funds within thirty days
  - Permitted with written consent from all parties whose funds are in the account
  - Prohibited because trust funds must be used only for the related transaction
key: D
explanation: The statute forbids using trust account deposits for any purpose other than the
  specific transaction for which they were provided. Paying office rent is not related to a client
  transaction, so it is prohibited. The distractor suggesting permission with consent incorrectly
  adds an exception not present in the law.
citation:
