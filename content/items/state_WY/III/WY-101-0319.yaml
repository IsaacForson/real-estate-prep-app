stem: Under Wyoming Real Estate Commission Rules Chapter 1 §6(b), what must a responsible broker be
  in relation to the real estate company they license?
options:
  - The sole proprietor who owns and operates the real estate company
  - Officer, partner or manager, or have an ownership interest in the real estate company
  - A licensed salesperson who is employed by the real estate company
  - An independent contractor with no ownership interest in the real estate company
key: B
explanation: Under Wyoming Real Estate Commission Rules Chapter 1 §6(b), the responsible broker must
  be an officer, partner, manager, or hold an ownership interest in the real estate company. The
  option stating that the responsible broker must be an officer, partner or manager, or have an
  ownership interest in the real estate company correctly reflects this requirement. The option
  describing a licensed salesperson employed by the company does not meet the responsible broker
  qualification.
