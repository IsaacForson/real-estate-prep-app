stem: Within how many calendar days after a required education course is offered must the provider
  submit attendance records to the Wyoming Real Estate Commission?
options:
  - Within 5 days.
  - Within 10 days.
  - Within 15 days.
  - Within 30 days.
key: B
explanation: The rule requires providers to file attendance records within ten (10) calendar days
  following each class offering. Therefore the correct answer is ten days. The five‑day option
  confuses the requirement with a shorter period that does not appear in the rule.
