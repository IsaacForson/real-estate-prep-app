  url: null
  quoted_text: When a real estate licensee or real estate company advertises with the use of a
    registered trade name, group name, or team name, the advertisement shall display the name of the
    real estate company as licensed by the Commission concurrently with the registered trade name,
    team name, or group name in a conspicuous manner that the general public may easily identify;
