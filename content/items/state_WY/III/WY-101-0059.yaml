stem: A licensee advertises using a registered trade name 'Summit Team' but does not include the
  real estate company name in the advertisement. Which ground for discipline under Wyo. Stat.
  §33-28-111 does this conduct satisfy?
options:
  - Making any substantial misrepresentation, false promises or false or fraudulent representation
    in connection with a real estate transaction
  - Violation of this act or any rule of the Wyoming Real Estate Commission, including failure to
    display the company name with a trade name in advertising
  - Using advertising which is misleading or inaccurate in any matter material to a real estate
    transaction
  - Using a trade name, collective membership mark, service mark or logo name, mark or logo without
    authorization owned by another person unless authorized to do so in real estate advertising
key: B
explanation: The rule requires that when a trade name is used in advertising, the licensee's company
  name must be displayed concurrently; failing to do so violates that rule. Under Wyo. Stat.
  §33-28-111(ii), any violation of the commission's rules is grounds for discipline. The distractor
  about misleading advertising is less directly applicable because the rule violation does not
  necessarily involve a material misrepresentation.
citation:
