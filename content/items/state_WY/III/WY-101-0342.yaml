stem: A responsible broker wants to receive compensation from both the seller and the buyer in a
  transaction. Under Wyo. Stat. § 33-28-308(g), what must occur before the seller and buyer enter
  into a contract to buy or sell for the broker to lawfully receive compensation from both parties?
options:
  - Consent from the seller only is required
  - Consent from neither party is required
  - Consent from the buyer only is required
  - Consent from both parties is required
key: D
explanation: The statute requires that parties compensating the broker provide written consent to
  the shared payment prior to the seller and buyer entering into a contract. Therefore, consent from
  both parties is necessary. The distractor suggesting consent from only one party is incorrect
  because compensation from both parties necessitates agreement from both.
citation:
  source: Wyo. Stat. Ann. § 33-28-308(g)
  url: null
  quoted_text: A responsible broker may be compensated by more than one (1) party for services in a
    transaction, if those parties have consented in writing to the shared payment prior to seller
    and buyer entering into a contract to buy or sell.
