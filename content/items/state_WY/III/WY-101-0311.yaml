stem: A licensee is acting as an intermediary in a real estate transaction. According to Wyoming
  law, which statement must be included in the written disclosure to the parties regarding the
  intermediary's obligations?
options:
  - A statement that the intermediary must seek a price acceptable to the party and present all
    offers in a timely manner regardless of contract status
  - A statement that the intermediary must disclose all adverse material facts known to the licensee
    and advise the parties to obtain expert advice
  - A statement that the intermediary is not an agent or advocate for any party and has only the
    obligations set forth in W.S. 33-28-305
  - A statement that the intermediary owes the same duties as an agent to the client and must act
    with utmost good faith and loyalty
key: C
explanation: The rule requires a disclosure that an intermediary is not an agent or advocate for any
  party and has only the obligations set forth in W.S. 33-28-305. The statement that an intermediary
  owes the same duties as an agent is incorrect because the intermediary's duties are limited.
