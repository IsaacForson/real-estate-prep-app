stem: Under Wyoming Real Estate Commission Rules Chapter 6 §4(a), when a licensee advertises using a
  registered trade name, what must also be displayed in the advertisement?
options:
  - The real estate company's licensed name
  - The licensee's full individual legal name
  - The broker's individual license number
  - The company's principal office mailing address
key: A
explanation: The rule requires the advertisement to show the name of the real estate company as
  licensed by the Commission alongside the trade name. The licensee's individual legal name is not
  required when a trade name is used.
citation:
  source: Wyo. Real Estate Comm'n Rules ch. 6 — Wyoming Real Estate Commission Rules, Chapter 6 —
    Regulatory Enforcement Grounds — § 4
  url: null
  quoted_text: (a) When a real estate licensee or real estate company advertises with the use of a
    registered trade name, group name, or team name, the advertisement shall display the name of the
    real estate company as licensed by the Commission concurrently with the registered trade name,
    team name, or group name in a conspicuous manner that the general public may easily identify;
