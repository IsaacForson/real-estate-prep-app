stem: Under Wyoming Real Estate Commission rules, what is the maximum clock-hour length allowed for
  a continuing education course delivered in a luncheon or conference format within the state?
options:
  - Two clock hours
  - Four clock hours
  - Three clock hours
  - One clock hour
key: A
explanation: The rule explicitly states that luncheon or conference format courses may be approved
  for one or two clock hours, making two the maximum allowable length. The distractor ‘Three clock
  hours’ incorrectly applies the standard minimum duration for regular courses to the luncheon
  format exception.
