key: C
explanation: Under Wyo. Stat. Ann. § 33‑28‑119(j) a nickname may be used in advertising only when
  the nickname is reflected on the license. A nickname that appears on the license therefore meets
  the statutory requirement. A nickname that has been used for five years, that is commonly used by
  friends and family, or that has been approved by the real estate commission does not satisfy the
  condition.
