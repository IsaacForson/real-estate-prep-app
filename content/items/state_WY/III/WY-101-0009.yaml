stem: A responsible broker maintains one trust account used for sales earnest money, security
  deposits, and property management funds combined, labeling it only with his own name. Which
  requirement of Wyoming's trust account rules does this arrangement fail to satisfy?
options:
  - Trust funds must be held in a bank located outside of Wyoming
  - A licensed cosigner must approve every trust account withdrawal
  - Trust account interest must accrue at a fixed statutory rate
  - Each account must be labeled with the word trust or escrow
key: D
explanation: The rule requires the name of each trust account to be identified by the word trust or
  escrow, and an account labeled only with the broker's personal name does not meet that labeling
  requirement.
