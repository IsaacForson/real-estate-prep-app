stem: "A responsible broker holds earnest money from two buyers for a property: Buyer A contributed
  $8,000 and Buyer B contributed $2,000. The parties have a written agreement that any interest
  earned on the deposit shall be split 75% to Buyer A and 25% to Buyer B. If the deposit earns $100
  in interest, how should the interest be distributed under Wyo. Stat. § 33-28-122(c)?"
options:
  - Buyer A receives $60 and Buyer B receives $40.
  - Buyer A receives $50 and Buyer B receives $50.
  - Buyer A receives $75 and Buyer B receives $25.
  - Buyer A receives $80 and Buyer B receives $20.
key: C
explanation: Under Wyo. Stat. Ann. § 33-28-122(c), interest on trust deposits must be paid out as
  agreed in writing by all parties. When a written agreement specifies a 75%-25% split, the $100
  interest is divided accordingly, giving Buyer A $75 and Buyer B $25.
