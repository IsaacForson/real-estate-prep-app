stem: A listing broker receives three written offers on a property but presents only the highest
  offer to the seller. Which basis for discipline under the licensing act does this conduct meet?
options:
  - Failing to supervise an associate broker's activity
  - Soliciting the breach of an existing listing contract
  - Failing to submit all offers to a seller or buyer
  - Commingling client funds with personal funds
key: C
explanation: The licensing act authorizes discipline for failing to submit all offers to a seller or
  buyer, and withholding two of three written offers is exactly that failure.
