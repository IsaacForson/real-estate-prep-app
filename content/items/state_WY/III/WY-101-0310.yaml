stem: A seller's agent has been asked by the buyer to share part of the commission paid by the buyer
  with another responsible broker. According to Wyoming law, what is required for this arrangement
  to be permissible?
options:
  - Approval from the seller
  - Approval from the buyer
  - Approval from the licensee
  - Approval from the commission
key: B
explanation: The rule states that a buyer may agree that a seller's agent may share in the
  compensation paid by the buyer with another responsible broker. Therefore, the buyer's agreement
  is required. Approval from the licensee is not mandated by this provision.
citation:
  source: Wyo. Stat. Ann. § 33-28-308(d)
  url: null
  quoted_text: A buyer may agree that a seller's agent, intermediary, subagent or a licensee working
    with a seller as a customer may share in the compensation paid by the buyer with another
    responsible broker.
