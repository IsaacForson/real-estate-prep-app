stem: Under Wyoming law, before a buyer's agent may propose to the seller's agent that the buyer's
  agent be compensated by sharing compensation paid by the seller, what must the buyer's agent
  obtain?
options:
  - Written approval from the seller
  - Written approval from the buyer
  - Written approval from the licensee
  - Written approval from the commission
key: B
explanation: The statute requires a buyer's agent to obtain the buyer's written approval before
  proposing to share compensation paid by the seller. Approval from the seller, licensee, or
  commission is not specified by this rule.
