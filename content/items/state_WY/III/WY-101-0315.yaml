stem: Under Wyoming Real Estate Commission Rules Chapter 7 §10, what must a licensee do upon
  receiving notice of being placed on inactive status for failure to provide proof of insurance?
options:
  - File a written appeal with the Commission within ten days.
  - Pay a reinstatement fee to retain the license.
  - Immediately surrender the license to the Commission.
  - Continue real estate activities while submitting proof of insurance.
key: C
explanation: The rule states that upon notice of inactive status for lack of proof, the licensee
  shall immediately surrender the license to the Commission. Continuing activities or appealing are
  not permitted; no reinstatement fee is mentioned for this situation.
