stem: When a Wyoming licensee changes sponsorship from one responsible broker to another, what must
  be indicated on the transfer form provided by the Commission?
options:
  - The notice of transfer of license from the sponsorship of one Responsible Broker to another
  - The licensee's driver's license number, expiration date, and current phone number
  - The amount of any renewal fee paid to the Commission and the date it was posted
  - The licensee's most recent continuing education course title and the number of credit hours
    completed
key: A
explanation: Under Wyo. Real Estate Comm'n Rules ch. 1 §5(a), the notice of transfer of license from
  the sponsorship of one Responsible Broker to another must be indicated on the transfer form. The
  distractors list personal or fee information that the rule does not require.
