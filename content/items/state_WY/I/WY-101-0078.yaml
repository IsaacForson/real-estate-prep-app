stem: If the chairman of the Wyoming Real Estate Commission is absent, who serves as the presiding
  officer according to Wyo. Stat. Ann. § 33-28-105(h)?
options:
  - The member present who is senior in time of service
  - The Liaison Commission Member appointed
  - The Attorney General of the state
  - The commission director of the agency
key: A
explanation: The statute provides that in the chairman's absence, the member present who is senior
  in time of service serves as the presiding officer. The director does not automatically assume
  this role unless they meet the seniority requirement.
