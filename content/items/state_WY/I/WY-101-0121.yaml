stem: "A responsible broker maintains a trust account and deposits $500 of his personal funds into
  it solely to avoid a monthly minimum balance charge from the financial institution. This specific
  deposit of personal funds into the trust account is considered a violation of the prohibition
  against commingling if:"
options:
  - The $500 deposit is not identified as personal funds at the time of deposit
  - The trust account is designated as an interest-bearing account under state regulation
  - The broker fails to notify the commission of the account's name within thirty days
  - The $500 deposit remains in the trust account for a period longer than thirty days
key: A
explanation: Under Wyo. Stat. Ann. § 33-28-122(e), depositing personal funds to keep an account open
  or avoid minimum balance charges is not considered commingling, provided that the deposit is
  identified at the time of deposit. Failing to identify the funds at the time of deposit means the
  statutory exception does not apply, making the action a violation of the commingling prohibition.
