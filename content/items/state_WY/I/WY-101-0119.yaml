stem: Under Wyo. Stat. Ann. § 33-28-113(a), who may the Wyoming Real Estate Commission contract with
  to hear contested cases arising under the Real Estate License Act?
options:
  - Independent hearing officers
  - The Wyoming Attorney General’s office
  - District court judges
  - Commission staff members
key: A
explanation: Under Wyo. Stat. Ann. § 33-28-113(a), the commission may contract with independent
  hearing officers to hear all contested cases under the act, and the hearing officer must not be an
  employee of the attorney general’s office or a commission member. Therefore, the attorney
  general’s office, district court judges, and commission staff members are not permissible choices
  for hearing officers.
