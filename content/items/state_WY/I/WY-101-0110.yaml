stem: A licensee is accused of practicing without a valid license. According to Wyo. Stat. Ann. §
  33-28-105(c)(iv), what action must the Wyoming Real Estate Commission director take upon receipt
  of a sworn written complaint?
options:
  - Immediately suspend the licensee's license pending review
  - Conduct an investigation and provide findings and recommendations to the commission
  - Forward the complaint to the Attorney General for prosecution and possible penalties
  - Dismiss the complaint if no evidence is found within five days after preliminary review
key: B
explanation: Under Wyo. Stat. Ann. § 33-28-105(c)(iv), the director of the Wyoming Real Estate
  Commission is required to investigate any sworn written complaint alleging a violation and to
  provide the commission with findings and recommendations for further action.
