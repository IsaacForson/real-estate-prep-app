stem: After completing an investigation of a sworn written complaint, what must the Liaison
  Commission Member do with the investigative report according to Wyo. Real Estate Commission Rules
  ch. 8 § 4(b)?
options:
  - Preparing and filing a formal petition and notice of hearing as provided in the rule
  - Sending the notice required by Section 5 of this chapter
  - Recommending the Commission dismiss the complaint after consultation
  - Forwarding the report with recommendations to the Attorney General prosecuting attorney
key: D
explanation: The rule requires the Liaison Commission Member to review the investigative report and
  forward it with recommendations to the appropriate Attorney General prosecuting attorney.
  Preparing a petition is only permissible after consulting the Attorney General, not as the
  immediate next step.
