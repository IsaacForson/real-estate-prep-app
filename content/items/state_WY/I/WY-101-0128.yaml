stem: Under Wyoming law, what is the maximum multiplier applied to the amount of money received as a
  fee or profit in consequence of a violation when determining the additional penalty under the Real
  Estate License Act?
options:
  - One times the amount received
  - Two times the amount received
  - Three times the amount received
  - Four times the amount received
key: C
explanation: The statute states that a person who receives money as a fee or profit from a violation
  is liable to a penalty of not more than three times the sum received. Therefore the maximum
  multiplier is three. The option stating one times the amount received is incorrect because the law
  allows a penalty up to three times, not limited to the amount itself.
