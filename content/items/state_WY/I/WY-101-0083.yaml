stem: A Wyoming responsible broker completed a real estate transaction on March 10, 2024. According
  to Wyoming law, until what date must the broker retain the records of that transaction?
options:
  - March 10, 2025
  - March 10, 2026
  - March 10, 2027
  - March 10, 2028
key: B
explanation: The law mandates that records be kept for not less than two years from the latest date
  the broker participated in the transaction, so records from March 10, 2024 must be retained until
  at least March 10, 2026. The one‑year option is a common mistake that underestimates the required
  retention period.
