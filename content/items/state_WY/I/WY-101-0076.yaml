stem: According to Wyo. Stat. Ann. § 33-28-105(c), which officer is responsible for keeping the
  books, records, and accounts of all activities of the Wyoming Real Estate Commission?
options:
  - The commission chairman
  - The commission director
  - The Liaison Commission Member appointed
  - The Attorney General of the state
key: B
explanation: The statute explicitly assigns the duty of keeping the commission's books, records, and
  accounts to the director. The commission chairman oversees meetings but does not maintain these
  records.
