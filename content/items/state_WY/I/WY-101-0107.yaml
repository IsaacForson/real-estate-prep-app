stem: After an investigation finds a licensee guilty of misleading advertising, which disciplinary
  action may the Wyoming Real Estate Commission take?
options:
  - Impose a criminal fine immediately
  - Censure the licensee formally
  - Award damages to the public promptly
  - Revoke the license automatically
key: B
explanation: The statute expressly authorizes the commission to censure licensees for violations.
  Imposing criminal fines or automatic revocation requires additional proceedings, and awarding
  damages is not a commission power.
