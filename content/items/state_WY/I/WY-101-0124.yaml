stem: A licensee receives earnest money from a buyer on a Thursday afternoon. According to Wyoming
  law, by when must the licensee deposit the funds into an escrow or trust account?
options:
  - By the close of Thursday
  - By the close of Friday
  - By the close of Monday
  - By the close of Tuesday
key: B
explanation: The rule in § 33-28-111(xxvii) mandates deposit within one banking day. Assuming Friday
  is a banking day, the latest permissible time is the close of Friday. Depositing by close of
  Thursday is allowed but not required; close of Monday would be two banking days later, exceeding
  the limit.
citation:
