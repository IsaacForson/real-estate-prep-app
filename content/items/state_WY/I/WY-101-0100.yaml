stem: A responsible broker in Cheyenne receives an earnest money check from a buyer for a
  residential purchase. The buyer and seller have not agreed otherwise in writing. What must the
  broker do with the check?
options:
  - Depositing the earnest money into the broker's personal checking account now
  - Depositing the earnest money into a trust or escrow account at a Wyoming financial institution
  - Depositing the earnest money into the broker's savings account
  - Depositing the earnest money into a money market mutual fund
key: B
explanation: Wyoming law requires that earnest money deposits be deposited in a trust or escrow
  account at a Wyoming financial institution unless all interested parties agree otherwise in
  writing. Depositing the check into the broker's personal account would constitute commingling,
  which is prohibited.
citation:
  source: "### Wyo. Stat. Ann. § 33-28-101 et seq. — Wyoming Statutes Title 33, Chapter 28 — Real
    Estate License Act (Articles 1-4) — § 33-28-122"
  url: null
  quoted_text: Maintain an account in a financial institution in this state designated as a trust or
    escrow account in which all down payments, earnest money deposits, advance listing fees or other
    trust funds received by him, his associate brokers or his salespersons on behalf of a principal
    or any other person shall be deposited unless all persons having an interest in the funds have
    agreed otherwise in writing.
