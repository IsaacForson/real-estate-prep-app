stem: A licensee receives an undisclosed rebate from a vendor in connection with a real estate
  transaction. Which of the following is **NOT** a sanction the Wyoming Real Estate Commission may
  impose under §33-28-111(a)?
options:
  - The commission may impose a censure for the violation after investigation
  - The commission may place the licensee on probation for the violation after review
  - The commission may suspend or revoke the license for the violation after review
  - The commission may impose a civil penalty equal to three times the amount received
key: D
explanation: Under Wyoming Statute §33-28-111(a), the Real Estate Commission may censure a licensee,
  place the licensee on probation, or suspend or revoke the license. A civil penalty equal to three
  times the amount received is authorized under §33-28-114(b), not under the commission’s
  disciplinary powers in §33-28-111(a).
