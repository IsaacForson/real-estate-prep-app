stem: A licensee advertises a property using a logo that belongs to another brokerage without
  permission. Which ground for disciplinary action does this violate?
options:
  - Using a logo without authorization
  - Using misleading advertising that omits facts
  - Using a license while inactive to conduct real estate
  - Using unlicensed assistants to show properties
key: A
explanation: Using a logo belonging to another broker without permission violates the prohibition
  against using a trademark, service mark, or logo without authorization (§33-28-111(a)(vi)(B)). The
  statement about misleading advertising that omits material facts describes a different prohibited
  act under the same subsection but does not match the scenario. The statements about using a
  license while inactive and using unlicensed assistants describe violations of other rules and are
  not relevant to the unauthorized logo use.
