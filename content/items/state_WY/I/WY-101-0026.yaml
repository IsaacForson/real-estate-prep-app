stem: A responsible broker working with a buyer receives a promissory note as earnest money in a
  cooperative transaction. What must the broker do with the note according to Wyoming law?
options:
  - Deliver the note and the contract to the responsible broker working with the seller, who shall
    hold the note or thing of value.
  - Return the note to the buyer because earnest money must be in cash or check form unless all
    parties agree otherwise in writing.
  - Deposit the note into the buyer's broker's trust account as earnest money unless all parties
    agree otherwise in writing.
  - Keep the note as part of the broker's compensation until the transaction closes unless all
    interested parties agree otherwise in writing.
key: A
explanation: Wyoming law directs that a promissory note received as earnest money must be delivered
  with the contract to the seller's broker, who shall hold the note. Depositing the note in the
  buyer's broker's trust account contradicts this requirement, making the option that suggests
  depositing the note in the buyer's broker's trust account incorrect.
