stem: A responsible broker is required to reconcile trust or escrow account journals and ledger
  liabilities monthly. Under what condition is the responsible broker exempt from performing this
  monthly reconciliation?
options:
  - When the broker's license is in the process of renewal
  - When no banking activity has occurred during the month
  - When the combined balance of all ledgers is under $1,000
  - When the financial institution where the account is held is out of state
key: B
explanation: Wyoming Real Estate Commission Rules ch. 5 § 2(vii)(C) explicitly states that a
  responsible broker is not required to reconcile any trust or escrow account when no banking
  activity has occurred. The other options, such as the broker's license status or the account
  balance, are not listed as valid exceptions to the monthly reconciliation requirement in the
  provided text.
