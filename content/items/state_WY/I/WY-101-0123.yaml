stem: What is the maximum time allowed to deposit funds received for a real estate transaction into
  an escrow or trust account under Wyoming law?
options:
  - Within two banking days
  - Within one banking day
  - Within five banking days
  - Within three banking days
key: B
explanation: Wyo. Stat. Ann. § 33-28-111(xxvii) requires that all financial instruments be deposited
  in an escrow or trust account within one (1) banking day unless the parties agree otherwise in
  writing. Therefore the maximum permissible period is one banking day. Options specifying two or
  more days exceed this limit absent a written agreement.
