stem: A real estate company license is issued on August 15, 2024. By what date must the license be
  renewed to avoid expiration?
options:
  - August 31, 2024
  - August 15, 2025
  - December 31, 2024
  - December 31, 2025
key: C
explanation: The license issued for the balance of the year expires on December 31 of the year it
  was issued, and must be renewed on or before that date to remain in effect (Wyo. Real Estate
  Comm'n Rules ch. 1 § 6). Thus, an August 15, 2024 issuance requires renewal by December 31, 2024.
  The distractor of August 15, 2025 mistakenly treats the license as valid for a full year from
  issuance.
