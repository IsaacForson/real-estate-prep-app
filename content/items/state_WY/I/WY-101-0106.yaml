stem: A property management firm seeks a license to operate in Wyoming. Which action may the Wyoming
  Real Estate Commission take regarding this request?
options:
  - Regulate the issuance of the license
  - Approve the firm's advertising plan
  - Establish the firm's commission rates
  - Determine the firm's advertising content
key: A
explanation: The commission has the power to regulate the issuance of licenses, so it may regulate
  the firm's license application. Setting commission rates is prohibited as it would constitute
  price-fixing.
