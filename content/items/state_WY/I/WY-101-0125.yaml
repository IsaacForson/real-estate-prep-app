stem: Upon closing of a real estate transaction, what must a responsible broker provide to the
  parties concerning funds held in escrow or trust under Wyoming law?
options:
  - Provide a verbal summary
  - Provide a written receipt
  - Provide a full accounting
  - Provide a bank statement
key: C
explanation: Section 33-28-111(xxviii) obligates a responsible broker to give a full accounting of
  the monies and property placed in escrow or trust, showing dates of deposit, management, and
  withdrawals upon consummation or termination. A verbal summary, written receipt, or bank statement
  alone does not satisfy this statutory requirement.
