stem: A responsible broker holds an earnest money deposit from a buyer. No written agreement exists
  regarding interest. The broker withdraws part of the deposit to pay closing costs. According to
  Wyoming law, how must the interest accrued on the withdrawn portion be handled?
options:
  - The interest must stay in the trust account until withdrawal.
  - The interest must be paid to the buyer in proportion to the amount withdrawn.
  - The interest must be split equally between the buyer and the seller.
  - The interest must be paid to the broker as compensation for services rendered.
key: B
explanation: When no written agreement governs interest, any interest earned on withdrawn trust
  funds must be paid out to the person who supplied the funds, in the same proportion as the
  withdrawn amount bears to the total deposit. Paying the broker, retaining the interest, or
  splitting it equally contradicts this rule.
citation:
  source: "### Wyo. Stat. Ann. § 33-28-101 et seq. — Wyoming Statutes Title 33, Chapter 28 — Real
    Estate License Act (Articles 1-4) — § 33-28-122"
  url: null
  quoted_text: In the absence of a written agreement among all persons having an interest in the
    deposit, at the time all or any portion of any deposit is withdrawn and paid out, all interest
    accrued upon the funds withdrawn and paid out shall also be withdrawn and paid out to the person
    from whom the trust funds were received;
