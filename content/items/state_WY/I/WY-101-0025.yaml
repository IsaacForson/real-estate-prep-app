stem: Under Wyoming Statute §33-28-105(a), which of the following is a power granted to the Wyoming
  Real Estate Commission?
options:
  - To establish minimum commission rates for brokers in Wyoming
  - To regulate licensing, revoke or suspend licenses, censure licensees
  - To approve all real estate advertising content and materials
  - To oversee the state's real estate property tax assessment process
key: B
explanation: The statute explicitly grants the commission the power to regulate license issuance,
  revoke or suspend licenses, and censure licensees. The distractor about setting commission rates
  is not mentioned in the statute.
