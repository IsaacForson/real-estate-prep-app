stem: Under Wyoming law, what is the maximum penalty for a first offense of performing real estate
  activity without a license?
options:
  - The maximum penalty is a fine of not more than $2,500 or imprisonment up to 6 months.
  - The maximum penalty is a fine of not more than $5,000 or imprisonment up to 1 year.
  - The maximum penalty is a fine of not more than $1,000 or imprisonment up to 3 months.
  - The maximum penalty is a fine of not more than $2,500 and imprisonment up to 6 months.
key: A
explanation: Under Wyo. Stat. Ann. § 33-28-114(a), a first offense for unlicensed real estate
  activity is punishable by a fine not exceeding $2,500 or imprisonment up to six months. Therefore,
  the option stating that the maximum penalty is a fine of not more than $2,500 or imprisonment up
  to 6 months is correct. The option stating a fine of not more than $5,000 or imprisonment up to 1
  year describes the penalty for a subsequent violation, which applies only after a prior
  conviction, and is therefore incorrect. The remaining options do not match the statutory penalty.
citation:
  source: Wyo. Stat. Ann. § 33-28-101 et seq. — Wyoming Statutes Title 33, Chapter 28 — Real Estate
    License Act (Articles 1-4) — § 33-28-114
  url: null
  quoted_text: Any individual performing real estate activity without first obtaining a license is
    guilty of a misdemeanor and upon conviction shall be punished by a fine of not more than two
    thousand five hundred dollars ($2,500.00) or by imprisonment in the county jail for a term not
    to exceed six (6) months.
