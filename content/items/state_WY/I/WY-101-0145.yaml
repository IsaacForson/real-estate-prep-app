stem: Under Wyoming law, what must a responsible broker disclose in every real estate transaction if
  the broker holds licenses for multiple real estate companies?
options:
  - The names of all real estate companies for which the broker holds a license
  - The broker's personal net worth and assets and liabilities and annual income
  - The commission's contact information and procedures for complaints
  - The property's zoning classification and tax ID and assessment number
key: A
explanation: The statute requires a responsible broker to disclose the names of all real estate
  companies for which the broker holds a license in every transaction. Failure to do so is grounds
  for disciplinary action. The distractor about personal net worth is unrelated to disclosure
  requirements under the license act.
