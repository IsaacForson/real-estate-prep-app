stem: A partnership performs real estate activity in Wyoming without first obtaining a license. Upon
  conviction, what is the maximum fine that may be imposed under Wyo. Stat. Ann. § 33-28-114(a)?
options:
  - $7,500
  - $2,500
  - $5,000
  - $10,000
key: C
explanation: Under Wyo. Stat. Ann. § 33-28-114(a), a corporation, partnership, or association
  convicted of performing real estate activity without a license is subject to a fine not exceeding
  $5,000. The correct option states this maximum fine. The $2,500 figure applies only to an
  individual's first offense, while higher amounts are not authorized by the statute.
