stem: Which action is prohibited under Wyo. Stat. Ann. § 33-28-122(e)?
options:
  - Using trust account funds to pay the broker's personal expenses without client consent
  - Depositing identified personal funds to maintain a minimum balance in the trust account
  - Depositing trust funds in an interest-bearing account with written consent of all parties
  - Withdrawing earnest money from the trust account after all interested parties agree in writing
key: A
explanation: Wyo. Stat. Ann. § 33-28-122(e) forbids a responsible broker from allowing trust funds
  belonging to others to be deposited into the broker’s personal account or commingled with the
  broker’s personal funds. Using trust account funds to pay the broker’s personal expenses without
  client consent is exactly that commingling, so it is prohibited. Depositing identified personal
  funds to maintain a minimum balance in the trust account is expressly permitted. Depositing trust
  funds in an interest‑bearing account with the written consent of all parties is also permitted.
  Withdrawing earnest money from the trust account after all interested parties agree in writing is
  likewise allowed.
