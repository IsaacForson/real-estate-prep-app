stem: A defendant violates an injunction issued under Wyo. Stat. Ann. § 33-28-112(a) prohibiting
  further violations of the Real Estate License Act. What is the maximum fine that may be imposed
  for contempt of court under § 33-28-112(b)?
options:
  - $5,000
  - $2,500
  - $7,500
  - $1,000
key: B
explanation: According to Wyo. Stat. Ann. § 33-28-112(b), a defendant who violates an injunction may
  be punished for contempt of court by a fine of not more than $2,500. The correct option identifies
  this maximum fine. The $5,000 amount mistakenly applies to penalties for unlicensed activity by a
  corporation, and the $1,000 and $7,500 figures have no basis in the rule.
citation:
  source: Wyo. Stat. Ann. § 33-28-101 et seq. — Wyoming Statutes Title 33, Chapter 28 — Real Estate
