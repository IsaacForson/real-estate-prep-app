stem: A broker receives earnest money on a Tuesday that is a banking day. Under Wyo. Stat. Ann. §
  33-28-111(xxvii), by what date must the broker deposit the funds into an escrow or trust account?
options:
  - By the end of Tuesday
  - By the end of Thursday
  - By the end of Wednesday
  - By the end of Friday
key: C
explanation: The rule requires deposit of all financial instruments within one banking day of
  receipt. If the earnest money is received on a Tuesday, the next banking day is Wednesday, so the
  funds must be deposited by the end of Wednesday. Depositing by the end of Tuesday would be
  same-day, which does not satisfy the 'within one banking day' requirement.
