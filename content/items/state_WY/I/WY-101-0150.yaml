stem: Under Wyoming law, what triggers the Wyoming Real Estate Commission's investigation of a licensee?
options:
  - Investigation requires a written sworn complaint only when filed with the commission
  - Investigation requires the commission's own motion only when initiated by the commission
  - Investigation requires either a written sworn complaint or the commission's own motion
  - Investigation requires a court order directing an investigation of the alleged violation
key: C
explanation: The statute states that the commission shall investigate upon a written sworn complaint
  or may investigate upon its own motion, meaning either trigger is sufficient. The distractors that
  require only one trigger are incorrect because the law allows both.
