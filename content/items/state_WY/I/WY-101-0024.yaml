stem: Under Wyoming law, what must a responsible broker do with earnest money deposits received on
  behalf of a principal?
options:
  - Deposit the funds in a trust or escrow account at a Wyoming financial institution unless all
    interested parties agree otherwise in writing.
  - Place the funds in the broker's personal account only after obtaining a signed written
    acknowledgment from the broker.
  - Invest the funds in a certificate of deposit with a fixed maturity date unless all parties
    consent in writing.
  - Commingle the funds with personal funds to avoid minimum balance fees unless a written agreement
    exists.
key: A
explanation: According to Wyo. Stat. Ann. § 33-28-122(a)(i), earnest money must be deposited in a
  trust or escrow account at a Wyoming financial institution unless all interested parties agree
  otherwise in writing. Placing the funds in the broker's personal account, investing them in a
  certificate of deposit, or commingling them with personal funds violates this requirement and is
  therefore incorrect.
citation:
  source: Wyo. Stat. Ann. § 33-28-122(a)(i)
  url: null
  quoted_text: Maintain an account in a financial institution in this state designated as a trust or
    escrow account in which all down payments, earnest money deposits, advance listing fees or other
    trust funds received by him, his associate brokers or his salespersons on behalf of a principal
    or any other person shall be deposited unless all persons having an interest in the funds have
    agreed otherwise in writing.
