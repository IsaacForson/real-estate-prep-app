stem: A buyer informs a licensee that they have a buyer's broker agreement with another broker, but
  the licensee continues to show properties and negotiate an offer directly with the buyer. Which
  ground for disciplinary action does this violate?
options:
  - Failing to disclose terms
  - Conducting direct activity
  - Placing a sign unlawfully
  - Accepting hidden compensation
key: B
explanation: By continuing to work directly with a buyer who has disclosed an existing buyer’s
  broker agreement, the licensee engages in real estate activity despite knowing the buyer is bound
  to another responsible broker, violating §33-28-111(a)(v). The other options pertain to unrelated
  duties such as term disclosure, sign placement, or undisclosed compensation. Thus, the correct
  ground is conducting direct activity despite another broker's agreement.
