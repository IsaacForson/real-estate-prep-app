stem: When must a Wyoming real estate company license be renewed each year to remain valid?
options:
  - By June 30 of the following calendar year
  - Within 60 days after the license expiration date
  - On or before December 31 of each year
  - Within 30 days of the license issuance date
key: C
explanation: The rule states that initial licenses expire on December 31 of the year issued and must
  be renewed on or before that date to remain valid (Wyo. Real Estate Comm'n Rules ch. 1 § 6).
  Therefore, the license must be renewed by December 31 each year. The distractor suggesting renewal
  within 30 days of issuance confuses the initial term with the annual renewal requirement.
