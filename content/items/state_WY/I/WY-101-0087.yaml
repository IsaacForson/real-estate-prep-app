  source: Wyo. Stat. Ann. § 33-28-101 et seq. — Wyoming Statutes Title 33, Chapter 28 — Real Estate
    License Act (Articles 1-4) — § 33-28-113
  url: null
  quoted_text: The commission may contract with independent hearing officers to hear all contested
    cases arising under this act. The hearing officer shall not be an employee of the office of the
    attorney general, or an employee or member of the commission.
