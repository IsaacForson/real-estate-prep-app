stem: According to Wyo. Stat. Ann. § 33-28-113(a), who may the Wyoming Real Estate Commission
  contract with to hear a contested case?
options:
  - Contract with an employee of the attorney general's office
  - Contract with a current commission member
  - Contract with an independent hearing officer
  - Contract with the licensee's attorney
key: C
explanation: The statute authorizes the commission to contract with independent hearing officers who
  are not employees of the attorney general or commission. The distractor "Contract with an employee
  of the attorney general's office" is prohibited by the same provision.
