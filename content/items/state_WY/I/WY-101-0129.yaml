stem: A Wyoming licensee receives $1,200 as an undisclosed rebate from a vendor in connection with a
  real estate transaction. According to Wyo. Stat. Ann. § 33-28-114(b), what is the maximum
  additional penalty the licensee could be liable for?
options:
  - $1,200
  - $3,600
  - $2,400
  - $4,800
key: B
explanation: The law allows a penalty of up to three times the amount received as a fee or profit
  from a violation. Multiplying $1,200 by three yields $3,600, which is the maximum penalty. The
  option of $2,400 represents only two times the amount and therefore understates the allowable
  maximum.
