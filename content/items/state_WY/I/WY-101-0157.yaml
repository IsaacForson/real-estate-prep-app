stem: A licensee contacts a seller who has an exclusive listing with another broker and persuades
  the seller to cancel that listing and list with the licensee instead. Which ground for
  disciplinary action does this violate?
options:
  - Using misleading advertising
  - Commingling funds with personal money
  - Soliciting breach of a listing
  - Failing to disclose an interest
key: C
explanation: The licensee’s conduct of persuading a seller to break an existing exclusive listing
  constitutes soliciting the breach of a listing or property management contract, which is
  prohibited under §33-28-111(a)(iv). The other options describe different violations that do not
  match the scenario. Hence, the correct ground is soliciting the breach of a listing.
