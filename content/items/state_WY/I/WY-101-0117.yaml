stem: Under Wyo. Stat. Ann. § 33-28-105(a), what authority does the Wyoming Real Estate Commission
  have regarding rules and regulations?
options:
  - To promulgate and amend reasonable rules and regulations for the act
  - To set minimum education requirements for licensees
  - To approve all real estate advertising before publication
  - To collect and allocate state appropriations for commission operations
key: A
explanation: Wyo. Stat. Ann. § 33-28-105(a) provides that the commission may, from time to time,
  promulgate and amend necessary and reasonable rules and regulations for the purposes of the act.
  The statement that the commission may promulgate and amend reasonable rules and regulations for
  the act directly reflects this language. The commission’s authority does not include setting
  minimum education requirements for licensees, approving every real‑estate advertisement before it
  is published, or collecting and allocating state appropriations for its operations, as those
  powers are not granted in this subsection.
