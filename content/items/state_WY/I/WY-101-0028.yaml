stem: After investigating a sworn written complaint against a licensee, the Liaison Commission
  Member (LCM) may recommend that the Wyoming Real Estate Commission take which of the following
  actions?
options:
  - To revoke the license without a hearing, prior notice, or opportunity to respond
  - To appoint a new commission member to replace the LCM on the investigative panel
  - To impose a monetary fine on the licensee immediately after investigation
  - To recommend the Commission accept conditional terms including education courses
key: D
explanation: The rule authorizes the LCM to recommend conditional settlement terms that may include
  education courses. The LCM cannot impose fines directly; only the commission may impose sanctions
  after a hearing.
