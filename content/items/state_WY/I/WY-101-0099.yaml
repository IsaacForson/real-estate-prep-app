stem: According to Wyoming law, what authority does the Wyoming Real Estate Commission have
  regarding a responsible broker's trust accounting records?
options:
  - Approving all trust account interest rates
  - Examining the responsible broker's trust accounting records
  - Setting minimum balance requirements for trust accounts
  - Authorizing brokers to commingle personal funds with trust funds
key: B
explanation: The statute expressly permits the commission or its representative to examine the
  responsible broker's trust accounting records. The option about approving interest rates is
  incorrect because the statute does not grant the commission authority to set or approve interest
  rates on trust accounts.
