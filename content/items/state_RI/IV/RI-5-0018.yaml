stem: A company regularly manages rental properties on behalf of owners and performs acts that meet
  the definition of a real estate broker. What does Rhode Island's regulation require of that
  company?
options:
  - It must register as a licensed property manager
  - It must be licensed as a real estate broker
  - It must obtain a separate escrow permit
  - It must file quarterly reports with the Commission
key: B
explanation: Section 2.12 requires a person or company performing broker-type acts while managing
  another's real property to hold a real estate broker license.
citation:
  source: 230-RICR-30-20-2 § 2.12
  url: null
  quoted_text: Any person who performs any of the acts within the meaning of “real estate broker”
    pursuant to R.I. Gen. Laws § 5-20.5-1(5) in the regular course of, or as an incident to, the
    management of another person’s real property are required to be licensed as a real estate broker
    pursuant to R.I. Gen. Laws Chapter 5-20.5 .
