stem: A Rhode Island licensee is about to disclose a seller's confidential motivation for selling to
  a prospective buyer. What must the licensee do before making this disclosure, according to Rhode
  Island law?
options:
  - Notify the principal broker in writing before disclosing any confidential information to the
    buyer.
  - Obtain verbal consent from the buyer to share confidential information after providing the
    mandatory relationship disclosure.
  - Wait until the buyer signs the acknowledgement of receipt before revealing any confidential
    seller details.
  - Provide the buyer with the mandatory relationship disclosure and obtain a signed acknowledgement
    before sharing any confidential information.
key: D
explanation: Under R.I. Gen. Laws § 5-20.6-8(b), a licensee must provide the prospective party with
  a copy of the mandatory relationship disclosure and obtain a signed acknowledgement of receipt
  prior to disclosing any confidential information. The distractor that suggests verbal consent is
  insufficient because the statute requires a signed written acknowledgement, not merely verbal
  agreement.
citation:
