    Title 5, Chapter 20.6 — Relationships Between Licensees and the Public, §§ 5-20.6-1 to 5-20.6-13
    concatenated from the official RI General Assembly section pages read via Internet Archive
    captures of 2025–2026 because webserver.rilegislature.gov times out from this network — §
    5-20.6-8
  url: null
  quoted_text: A licensee shall provide a prospective buyer, seller, tenant, or landlord in a real
    estate transaction with a copy of the mandatory relationship disclosure and shall obtain a
    signed acknowledgement of receipt from the buyer, seller, tenant, or landlord prior to the
    disclosure of any confidential information.
