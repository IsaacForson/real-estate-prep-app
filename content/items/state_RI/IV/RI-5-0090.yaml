stem: Under Rhode Island's real estate license law, how is an 'affiliated licensee' defined?
options:
  - A principal broker who employs affiliated licensees to conduct transactions on his or her behalf.
  - A licensed real estate salesperson who operates as a sole proprietor without any principal
    broker oversight.
  - A licensed real estate salesperson or broker who holds an active license from the director.
  - A licensed real estate salesperson or broker associated with a particular principal broker.
key: D
explanation: The statute defines an affiliated licensee as a licensed real estate salesperson or
  broker associated with a particular principal broker. The other options describe independent
  salespersons, principal brokers, or generic licensees, which do not match the definition.
