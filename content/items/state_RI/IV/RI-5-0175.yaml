stem: A Rhode Island real estate salesperson is convicted of a misdemeanor on August 10. By what
  date must the licensee file a written report of the conviction with the Department to comply with
  the regulation?
options:
  - October 9
  - October 10
  - November 9
  - September 9
key: A
explanation: The regulation requires a written report of any conviction to be filed within sixty
  (60) days of the final judgment. Counting sixty days from August 10 results in a deadline of
  October 9. The answer choice "October 10" is one day later than the required deadline,
  "November 9" is thirty days later, and "September 9" is one day earlier than the deadline.
