stem: If a buyer refuses to sign a receipt for the required real estate disclosure, what must the
  seller or agent do immediately according to Rhode Island law?
options:
  - Proceed with the transaction and note the refusal in the contract.
  - Immediately sign and date a written record of the buyer's refusal.
  - Request the buyer to sign a receipt before continuing negotiations.
  - Cancel the transaction and refund the earnest money received soon.
key: B
explanation: The statute directs that if the buyer refuses to sign a receipt, the seller or agent
  must immediately sign and date a written account of the refusal. The other options either delay
  action, seek enforcement, or terminate the transaction, which are not required by the rule.
