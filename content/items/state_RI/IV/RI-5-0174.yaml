stem: A Rhode Island landlord manages their own residential rental property and performs activities
  such as showing the unit to prospective tenants and negotiating lease terms. Under Rhode Island's
  real estate regulation, is the landlord required to hold a real estate broker license?
options:
  - Yes, because any person who performs acts within the meaning of “real estate broker” must be
    licensed regardless of property ownership.
  - No, because the regulation exempts bona fide owners, lessors, or lessees of the real property
    being managed from the licensing requirement.
  - Yes, but only if the landlord also manages properties for other owners in addition to their own.
  - No, because the landlord must first obtain a property management certificate from the Department
    before engaging in any leasing activities.
key: B
explanation: Under 230‑RICR‑30‑20‑2 § 2.12(B), a bona fide owner, lessor, or lessee of the real
  property being managed is exempt from the broker‑licensing requirement. Because the landlord is
  managing their own rental unit, the exemption applies and no broker license is needed. The claim
  that any person who performs acts within the meaning of “real estate broker” must be licensed
  regardless of ownership is incorrect because the exemption overrides that general rule. The
  suggestion that a license is required only when the landlord also manages other owners’ properties
  adds a condition not found in the regulation. Requiring a separate property‑management certificate
  before leasing activities is also unsupported by the rule.
