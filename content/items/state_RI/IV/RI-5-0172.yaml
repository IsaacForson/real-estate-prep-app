stem: A team leader wants to collect monthly contributions from team members to pay for shared
  office supplies and advertising. According to Rhode Island regulation, what action is permitted
  for the team leader?
options:
  - The team leader may form a single member/manager LLC to collect dues for shared expenses.
  - The team leader must deposit all collected funds into the principal broker's trust account.
  - The team leader must open a separate bank account under the team's name to cover expenses.
  - The team leader must pay shared costs from personal funds without forming an LLC.
key: A
explanation: The regulation explicitly allows a team leader to form a single member/manager LLC for
  the purpose of collecting funds from team members to pay common joint expenses. Depositing the
  funds into the principal broker's trust account is not permitted under this rule; the regulation
  only authorizes the LLC method for handling team expense collections.
