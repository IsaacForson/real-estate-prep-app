stem: An attorney licensed in Rhode Island holds a valid power of attorney from a seller to execute
  the sale of the seller's house. The attorney is not a licensed real estate broker. Under Rhode
  Island law, is the attorney required to have a real estate license to complete the sale?
options:
  - He is required to obtain a real estate license
  - He is not required to obtain a real estate license
  - He is required to obtain a license only if he receives a commission
  - He is required to obtain a license because he is negotiating the sale
key: B
explanation: An attorney holding a power of attorney to execute a sale is expressly exempt from
  licensing requirements. The distractor that mentions negotiating the sale is wrong because the
  exemption covers attorneys acting under a valid power of attorney.
