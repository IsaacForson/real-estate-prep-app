    the official RI General Assembly section pages read via Internet Archive captures of 2025–2026
    because webserver.rilegislature.gov times out from this network — § 5-20.5-3(c)
  url: null
  quoted_text: In the case of an applicant for a real estate salesperson’s license, he or she must
    also file a statement under oath from the broker in whose employ the applicant desires to enter,
    that in his or her opinion, the applicant is competent and trustworthy and is recommended as a
    suitable person to be granted a salesperson’s license.
