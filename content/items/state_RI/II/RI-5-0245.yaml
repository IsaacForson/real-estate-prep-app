stem: An applicant for a real estate salesperson license has completed the required education and
  submitted the application fee but has not yet obtained a statement under oath from a broker.
  According to Rhode Island law, what is the status of the application?
options:
  - The application is complete and will be processed once the fee is paid.
  - The application is incomplete because it lacks the required statement from the employing broker.
  - The application can be approved if the applicant provides three personal references instead.
  - The application is valid only if the applicant is also applying for a broker license.
key: B
explanation: The statute explicitly requires a salesperson applicant to file a statement under oath
  from the broker whose employ they seek to enter. Without this statement, the application is
  incomplete. The other options suggest that the application could be processed without the broker's
  statement, that personal references could substitute, or that the application is valid only if
  also applying for a broker license—none of which are supported by the cited provision.
