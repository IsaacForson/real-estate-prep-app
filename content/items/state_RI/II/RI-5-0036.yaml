stem: What is the minimum number of classroom hours required for an applicant to qualify for a real
  estate salesperson license in Rhode Island?
options:
  - Forty-five (45) classroom hours
  - Sixty (60) classroom hours
  - Ninety (90) classroom hours
  - Thirty (30) classroom hours
key: A
explanation: The regulation explicitly states that applicants for a salesperson license must
  complete a minimum of forty-five (45) classroom hours. This requirement is found in § 2.7(A) of
  the Rhode Island Real Estate Brokers and Salespersons regulation. The thirty‑hour option is
  insufficient because the rule sets the floor at forty‑five hours, not thirty.
citation:
  source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons) — Rhode Island Code of Regulations
    230-RICR-30-20-2 — Real Estate Brokers and Salespersons (DBR Commercial Licensing) § 2.7(A)
  url: null
  quoted_text: Applicants for a real estate salesperson’s license, including former licensees whose
    salesperson’s license has expired for more than one (1) year, must submit satisfactory evidence
    of completion of a minimum of forty-five (45) classroom hours pursuant to R.I. Gen. Laws §
    5-20.5-4(b).
