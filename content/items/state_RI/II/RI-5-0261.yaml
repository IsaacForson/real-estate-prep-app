stem: An attorney licensed by the Rhode Island Supreme Court who holds a real estate license issued
  under R.I. Gen. Laws § 5-20.5-4(d) is applying for license renewal. Is this attorney required to
  complete continuing education?
options:
  - Yes, unless the attorney has held the real estate license for over ten consecutive years.
  - No, because attorneys licensed by the Rhode Island Supreme Court under §5-20.5-4(d) are exempt
    from continuing education.
  - No, because only licensees originally issued before December 12, 1984 are exempt from continuing
    education.
  - Yes, because the attorney must complete the standard twenty‑four hour continuing education
    requirement for renewal.
key: B
explanation: Under 230-RICR-30-20-2 § 2.30(D)(2), attorneys licensed by the Rhode Island Supreme
  Court and granted a license pursuant to R.I. Gen. Laws § 5-20.5-4(d) are exempt from the
  continuing education requirements. Therefore, the attorney described is not required to complete
  continuing education for renewal. The option stating that attorneys licensed by the Rhode Island
  Supreme Court under §5-20.5-4(d) are exempt from continuing education correctly reflects this
  rule, while the options stating a requirement or different exemption conditions are inaccurate.
