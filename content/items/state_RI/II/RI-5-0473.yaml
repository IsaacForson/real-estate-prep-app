stem: A Rhode Island real estate salesperson allows an unlicensed acquaintance to use the
  salesperson’s license number in online advertisements to attract clients and to receive referral
  fees. Under Rhode Island regulations, this conduct most directly violates which provision?
options:
  - It constitutes a violation of § 2.24(A) prohibiting lending one’s name or license to another
    person.
  - It constitutes a violation of § 2.25(B) prohibiting false or misleading advertising.
  - It constitutes a violation of § 2.26(D) prohibiting net listing contracts.
  - It constitutes a violation of § 2.27(A) prohibiting unlicensed appraisal activities.
key: A
explanation: The scenario describes the salesperson permitting an unlicensed individual to use the
  licensee’s license number for business purposes, which is expressly forbidden by § 2.24(A) that
  prohibits lending one’s name or license to another person. While the conduct also involves
  advertising, the core violation is the lending of the license, not the content of the ads, making
  the advertising distractor incorrect.
