stem: Under Rhode Island regulations, what is the minimum period for which a real estate school
  permit is valid?
options:
  - One (1) year, expiring annually on August 31
  - Two (2) years, expiring annually on August 31
  - One (1) year, expiring annually on June 30
  - Three (3) years, expiring annually on August 31
key: A
explanation: According to 230-RICR-30-20-2 § 2.29(A), a real estate school permit is valid for one
  (1) year and expires annually on August 31. This establishes the minimum period of validity as one
  year. The other options either change the length of validity or the expiration date, which
  contradicts the regulation.
