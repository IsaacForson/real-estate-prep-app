stem: A principal broker who previously supervised Brokerage A resigns as principal broker and
  continues to work as a licensed salesperson at the same brokerage. According to Rhode Island
  regulations, within how many days must the principal broker notify the Department of this change
  in status?
options:
  - Within 15 days
  - Within 5 days
  - Within 10 days
  - Within 30 days
key: C
explanation: The regulation requires the principal broker to notify the Department in writing of any
  change in status as principal broker within ten (10) days following the change. Therefore, the
  correct timeframe is ten days. The distractor of five days is incorrect because it is shorter than
  the required period.
citation:
  source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons) — Rhode Island Code of Regulations
    230-RICR-30-20-2 — Real Estate Brokers and Salespersons (DBR Commercial Licensing) § 2.4(E)(3)
  url: null
  quoted_text: The notification in writing of any change of his or her status as principal broker to
    the Department within ten (10) days following the change
