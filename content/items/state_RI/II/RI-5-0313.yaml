stem: A real estate school's permit was issued on September 1, 2023. On what date does the permit
  expire under Rhode Island regulations?
options:
  - August 31, 2025
  - August 31, 2026
  - August 31, 2023
  - August 31, 2024
key: D
explanation: Permits are valid for one year and expire annually on August 31. A permit issued on
  September 1, 2023 runs for one year to August 31, 2024. Therefore the expiration date is August
  31, 2024. August 31, 2023 would be incorrect because it precedes the end of the one‑year term.
