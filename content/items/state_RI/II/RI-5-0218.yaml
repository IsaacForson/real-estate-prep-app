stem: A Rhode Island real estate licensee changes her firm affiliation from ABC Brokerage to XYZ
  Brokerage. According to Rhode Island regulations, within how many days must she notify the
  Department in writing of this change?
options:
  - Five (5) days
  - Thirty (30) days
  - Sixty (60) days
  - Ten (10) days
key: D
explanation: The rule requires every licensee to notify the Department in writing of each change of
  firm affiliation within ten (10) days of the change. Therefore, the licensee has ten days to
  submit the notification. The other time periods do not match the regulatory requirement.
citation:
  source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons) — Rhode Island Code of Regulations
    230-RICR-30-20-2 — Real Estate Brokers and Salespersons (DBR Commercial Licensing) § 2.3
  url: null
  quoted_text: Upon initial licensure and at all times thereafter, every licensee shall ensure that
    the Department has on record the licensee’s current personal name, firm affiliation, trade name,
    residence address and firm address. Every licensee shall notify the Department in writing of
    each change of personal name, firm affiliation, trade name, residence address and firm address
    within ten (10) days of the change.
