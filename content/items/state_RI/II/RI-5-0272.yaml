stem: Under Rhode Island regulations, what must a principal broker ensure before disbursing funds
  held in an escrow account for others?
options:
  - The funds have been deposited for at least 30 days
  - The broker has received verbal approval from the client
  - The broker has express authorization and knowledge
  - The broker has notified the Department in writing
key: C
explanation: The regulation states that a principal broker must make certain that no funds of others
  are disbursed or utilized without his or her express authorization and knowledge. Therefore,
  express authorization and knowledge is required before any disbursement. The distractor about
  verbal approval is incorrect because the rule requires express authorization, not merely verbal
  consent.
citation:
  source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons) — Rhode Island Code of Regulations
    230-RICR-30-20-2 — Real Estate Brokers and Salespersons (DBR Commercial Licensing) § 2.4 D
  url: null
  quoted_text: The principal broker shall maintain an escrow account for the funds of others and shall
    make certain that no funds of others are disbursed or utilized without his or her express
    authorization and knowledge.
