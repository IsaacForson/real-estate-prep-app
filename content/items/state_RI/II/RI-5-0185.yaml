stem: What is the minimum age requirement for an applicant seeking a real estate salesperson license
  in Rhode Island?
options:
  - Sixteen years old
  - Eighteen years old
  - Twenty-one years old
  - No age requirement
key: B
explanation: The Rhode Island statute (R.I. Gen. Laws § 5-20.5-3(c)) requires an applicant for a
  salesperson license to be at least eighteen years old. Sixteen years old does not meet that
  minimum. Twenty‑one years old is older than the required minimum. Saying there is no age
  requirement contradicts the explicit age provision in the law.
