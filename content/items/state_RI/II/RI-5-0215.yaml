stem: An applicant for a real estate broker license submits the names of two Rhode Island residents
  who have known him for three years and are not related. Which statement is correct about his
  application?
options:
  - His application is complete because the references meet the residency and relationship
    requirements.
  - His application is incomplete because he must provide at least three references.
  - His application is incomplete because the references must have known him for at least five years.
  - His application is complete because he provided references who are not related Rhode Island
    residents.
key: B
explanation: A broker’s license application must include at least three Rhode Island residents who
  have known the applicant for three years and are not related. Supplying only two references fails
  this requirement. The other options either misstate the number or the duration of acquaintance.
