  url: null
  quoted_text: The application for a broker’s license shall be accompanied by the names of at least
    three (3) Rhode Island residents who have known the applicant for three (3) years, and are not
    related to the applicant and will attest that the applicant bears a good reputation for honesty
    and trustworthiness, and who will recommend that a license be granted to the applicant.
