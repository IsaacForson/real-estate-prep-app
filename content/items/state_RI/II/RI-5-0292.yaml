stem: A regionally accredited college offers real estate courses to prepare students for the
  licensing exam. Under Rhode Island law, does the college need to obtain a permit from the Division
  of Professional Regulation to offer these courses?
options:
  - The college must obtain a permit because all schools offering real estate courses require one
  - The college is exempt from obtaining a permit if accredited by an approved accrediting body
  - The college must obtain a permit only if it charges tuition for the courses
  - The college must obtain a permit only if the courses are delivered online
key: B
explanation: The statute explicitly exempts any college or university accredited by an accrediting
  body approved by the council on postsecondary education from the permit requirement. Therefore,
  the college is not required to obtain a permit if it meets this accreditation condition.
