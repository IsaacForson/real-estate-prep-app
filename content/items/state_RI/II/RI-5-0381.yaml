  - $100
key: D
explanation: The statute imposes a late fee of one hundred dollars for reinstating a salesperson’s
  license after expiration, in addition to the renewal fee. The $10 amount corresponds to the
  application fee, not the late fee. The $50 and $150 amounts are not specified in the law for this
  purpose.
