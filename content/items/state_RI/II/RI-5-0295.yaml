stem: A licensee obtained their Rhode Island real estate license on March 15, 2021. According to
  Rhode Island regulations, what is the date of their next license renewal?
options:
  - May 1, 2022
  - March 15, 2025
  - March 15, 2023
  - May 1, 2024
key: C
explanation: Licenses issued after January 1, 2020 renew every two years on the anniversary of the
  issue date. Adding two years to March 15, 2021 gives March 15, 2023. The May 1, 2022 choice
  applies the pre‑2020 rule that ties renewal to May 1 of even‑numbered years, which does not apply
  here.
