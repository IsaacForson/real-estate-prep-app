stem: A licensee changes her trade name from "Coastal Homes" to "Seaside Realty". According to Rhode
  Island regulations, within how many days must she notify the Department in writing of this change?
options:
  - Thirty (30) days
  - Ten (10) days
  - Fifteen (15) days
  - Five (5) days
key: B
explanation: Section 2.3 of the regulation requires written notice of any change in trade name to be
  given to the Department within ten (10) days. Thus “Ten (10) days” is correct; the distractor
  “Fifteen (15) days” exceeds the allowed period.
