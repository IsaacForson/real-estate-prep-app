stem: A Rhode Island real estate licensee has completed 3 credits in CORE-Fair Housing and 6 credits
  in a CORE subject area. How many additional continuing education hours must the licensee complete
  to meet the total renewal requirement?
options:
  - 12 hours
  - 15 hours
  - 18 hours
  - 21 hours
key: B
explanation: The rule requires a minimum of 3 credits in CORE‑FH, 6 credits in any CORE subject
  area, and the remaining 15 CE hours from any department‑approved course, for a total of 24 hours.
  Having completed 9 hours, the licensee needs 15 more hours to reach the 24‑hour requirement. The
  12‑hour option mistakenly subtracts only the completed hours from the 15‑hour remainder.
citation:
  source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons) — Rhode Island Code of Regulations
    230-RICR-30-20-2 — Real Estate Brokers and Salespersons (DBR Commercial Licensing) § 2.30(B)
  url: null
  quoted_text: § 2.30(B) (new numbering) – increased the CORE course requirements by three to include
    a minimum of 3 credits in CORE-Fair Housing and a minimum of 6 credits in any CORE subject area
    listed in 2.30(B)(1), including fair housing. Clarified that the remaining 15 CE hours may be
    completed with any department-approved course.
  secondary: []
math:
  worked_solution: |-
    Total CE required = 3 (CORE‑FH) + 6 (CORE) + 15 (remaining) = 24 hours
    Completed CE = 3 + 6 = 9 hours
    Additional CE needed = 24 – 9 = 15 hours
  formulas:
    - Total CE = CORE‑FH + CORE + Remaining
    - Additional CE = Total CE – Completed CE
