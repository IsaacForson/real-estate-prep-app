stem: Maria, a 17-year-old Rhode Island resident, submits an application for a real estate
  salesperson license. Which statement is correct regarding her eligibility?
options:
  - She is eligible because she is a Rhode Island resident in the state.
  - She is eligible if she has a sponsoring broker’s recommendation from the broker.
  - She is eligible because the age requirement applies only to broker applicants.
  - She is not eligible because she is under the minimum age of eighteen.
key: D
explanation: For a salesperson license, the applicant must be at least eighteen years of age. Maria
  is only seventeen, so she does not meet this requirement. Residency or a broker’s recommendation
  does not override the age rule.
