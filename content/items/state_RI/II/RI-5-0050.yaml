stem: A salesperson obtains a license on June 3, 2022. When is the first renewal deadline for this
  license?
options:
  - June 3, 2024
  - May 1, 2024
  - June 3, 2023
  - June 3, 2025
key: B
explanation: According to § 2.9(C), licenses issued after January 1, 2020 are renewed every two
  years on the anniversary of the issuance date. The license was issued June 3, 2022, so the first
  renewal occurs two years later on June 3, 2024. The May 1 date applies only to licenses issued
  before 2020, the 2023 date is only one year later, and the 2025 date is three years later.
