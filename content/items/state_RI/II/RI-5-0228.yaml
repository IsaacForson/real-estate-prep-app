  - $100.00
  - $150.00
  - $75.00
key: B
explanation: The statute specifies a late fee of one hundred dollars ($100) for each broker’s
  license reinstated after its expiration date, in addition to the required renewal fee. This makes
  $100.00 the correct amount. The $150.00 distractor incorrectly adds the renewal fee to the late
  fee, while $50.00 and $75.00 are amounts not mentioned in the provision.
