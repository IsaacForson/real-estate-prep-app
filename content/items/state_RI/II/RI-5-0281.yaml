    the official RI General Assembly section pages read via Internet Archive captures of 2025–2026
    because webserver.rilegislature.gov times out from this network — § 5-20.5-5
  url: null
  quoted_text: the license of the broker or salesperson shall be automatically revoked upon the
    issuance of a court order authorizing payment from the real estate recovery account. This broker
    or salesperson is not eligible to receive a new license until he or she has repaid in full, plus
    interest at the rate of twelve percent (12%) a year, the amount paid from the real estate
    recovery account on his or her account.
