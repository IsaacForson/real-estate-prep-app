stem: A licensee's license was revoked after the department paid from the real estate recovery
  account for a claim. What must the licensee do to become eligible for a new license?
options:
  - Repay the recovery account payment plus 12% annual interest
  - Pay a $250 penalty fee to the department within six months
  - File a renewal application with proof of financial responsibility
  - Submit a signed affidavit of no prior claims to the commissioner
key: A
explanation: The law states that after a recovery account payment, the license is automatically
  revoked and the licensee is not eligible for a new license until they repay the amount paid plus
  interest at 12% per year. Simply waiting a year and retaking the exam does not satisfy this
  requirement.
citation:
  source: R.I. Gen. Laws ch. 5-20.5 (Real Estate Brokers and Salespersons) — R.I. Gen. Laws Title 5,
