stem: After obtaining a final judgment against a licensee for fraud, how many days' written notice
  must an aggrieved person give to the Department of Business Regulation before applying to the
  court for an order directing payment from the real estate recovery account?
options:
  - Seven (7) days
  - Five (5) days
  - Fifteen (15) days
  - Ten (10) days
key: D
explanation: According to R.I. Gen. Laws § 5-20.5-5(c)(2), after obtaining a judgment, an aggrieved
  person must provide the Department of Business Regulation with ten (10) days’ written notice
  before seeking payment from the real estate recovery account. Hence ten (10) days is required. The
  distractor of five (5) days is wrong because the statute explicitly specifies a ten‑day notice
  period, not a shorter one.
