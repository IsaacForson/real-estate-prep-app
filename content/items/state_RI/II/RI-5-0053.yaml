stem: John submits his application for an original broker's license on July 1, 2024. When must he
  pay the total fees for the term of initial licensure and renewal under Rhode Island law?
options:
  - He must pay the total fees after passing the examination.
  - He must pay the total fees within 30 days of license issuance.
  - He must pay the total fees annually on the license anniversary.
  - He must pay the total fees at the time of application.
key: D
explanation: The statute requires that the total fees for the term of initial licensure and renewal
  be paid at the time of application for the license. The other options misstate the timing by
  referring to issuance, anniversary, or exam passage, which are not mentioned in the fee payment
  rule.
