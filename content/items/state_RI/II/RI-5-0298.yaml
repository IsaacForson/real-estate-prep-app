stem: A cause of action for fraud against a real estate licensee accrued on January 15, 2022. If the
  aggrieved person files a lawsuit on February 1, 2025, can they later seek payment from the real
  estate recovery account under Rhode Island law?
options:
  - The claim is recoverable because it was filed within two years
  - The claim is barred because it was filed after the two‑year limit
  - The claim is recoverable if the judgment is under $25,000
  - The claim is barred unless the licensee consents to payment
key: B
explanation: The statute bars any action for recovery account payment that is started later than two
  years from the accrual of the cause of action. Filing more than two years after January 15, 2022,
  therefore prevents recovery.
