stem: When must a licensee file a certificate of errors and omissions insurance coverage with the
  Rhode Island Department of Business Regulation?
options:
  - By the end of the fiscal year
  - By the annual license renewal date
  - By the close of the licensing period
  - By the date of the next exam
key: B
explanation: The statute mandates that a certificate of coverage must be filed with the department
  of business regulation by the annual license renewal date for each licensee. Therefore, the
  correct timing is tied to the license renewal date, not to the fiscal year or any other event. The
  distractor referencing the fiscal year is incorrect because the law does not mention that
  deadline.
