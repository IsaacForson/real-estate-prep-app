stem: An applicant passes the real estate examination and pays all required fees on April 10.
  According to Rhode Island law, by what date must the real estate division issue the certificate of
  licensure, and what is the maximum amount that may be charged for it?
options:
  - Must be issued by May 10 at a cost not exceeding $10.
  - Must be issued by April 30 at a cost not exceeding $25.
  - Must be issued by April 30 at a cost not exceeding $10.
  - Must be issued by May 10 at a cost not exceeding $25.
key: D
explanation: The certificate of licensure must be issued within thirty days of the request and may
  not cost more than twenty-five dollars. Adding thirty days to April 10 yields May 10, and the
  maximum fee is $25. The distractors either use an incorrect fee or miscalculate the deadline.
