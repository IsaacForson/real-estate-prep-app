stem: An attorney-at-law licensed by the Rhode Island Supreme Court applies for a real estate
  broker's license. What examination requirement applies under Rhode Island law?
options:
  - The applicant must pass the state portion of the examination only.
  - The applicant must pass the uniform portion of the examination only.
  - The applicant must pass both the state and uniform portions of the examination.
  - The applicant is not required to take any examination.
key: D
explanation: The law states that an attorney licensed by the supreme court shall be granted a
  license without examination upon application and payment of the fee. The distractors incorrectly
  require passing portions of the exam, which the statute does not mandate for attorneys.
