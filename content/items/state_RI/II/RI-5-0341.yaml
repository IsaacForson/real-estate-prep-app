math:
  worked_solution: Required fee = $10.00; Submitted fee = $5.00; Shortfall = Required fee - Submitted
    fee = $10.00 - $5.00 = $5.00. Because the submitted fee is less than the required fee, the
    application is incomplete and must be supplemented with the correct fee.
  formulas:
    - Required fee = $10.00
    - Submitted fee = $5.00
    - Shortfall = Required fee - Submitted fee
