stem: An applicant submits an original salesperson license application accompanied by a check for
  five dollars ($5.00) to cover the processing fee.
options:
  - The application is rejected and the applicant must reapply after six months.
  - The application is accepted but will incur a late penalty.
  - The application is incomplete and must be supplemented with the correct fee.
  - The application is complete because the fee is sufficient.
key: C
explanation: The statute requires a fee of ten dollars ($10.00) for any original broker or
  salesperson license application. Submitting only five dollars fails to meet this requirement, so
  the application is incomplete and must be supplemented with the correct fee. The option claiming
  the fee is sufficient contradicts the $10 mandate.
citation:
  source: R.I. Gen. Laws § 5-20.5-3(b)
  url: null
  quoted_text: All applicants for a license to act as a real estate broker or real estate salesperson
    shall accompany their applications with a fee of ten dollars ($10.00) to cover costs of
    processing those applications.
