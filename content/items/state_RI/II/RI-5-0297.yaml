stem: An aggrieved person files a lawsuit against a licensee for fraud on March 1, 2023, but fails
  to notify the Department of Business Regulation in writing at the time of filing. What is the
  effect of this failure under Rhode Island law?
options:
  - The person waives any rights under the recovery account chapter
  - The person may still recover up to $50,000 from the account
  - The department must still pay the claim if awarded
  - The court will dismiss the lawsuit for lack of jurisdiction
key: A
explanation: Failure to comply with the recovery‑account chapter constitutes a waiver of any rights
  under that chapter. Therefore, not providing the required written notice waives the person’s right
  to seek payment from the account.
