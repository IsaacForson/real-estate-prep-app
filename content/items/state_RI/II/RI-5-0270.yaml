stem: An applicant for a Rhode Island real estate broker license submits the required application
  and fee but fails to include a statement under oath regarding whether they have ever been refused
  a license or had a license suspended or revoked. According to Rhode Island law, what is the status
  of the application?
options:
  - The application is complete because the omission does not affect licensing eligibility.
  - The application is incomplete and must be supplemented with the missing statement.
  - The application will be automatically denied due to the omission.
  - The applicant may correct the omission after the license is issued.
key: B
explanation: The application must contain a statement under oath giving the applicant’s age,
  residence, place of business, present occupation, and whether or not the applicant has been
  refused a license or had a license suspended or revoked. Omitting any of these required elements
  renders the application incomplete and it must be supplemented before processing can continue.
