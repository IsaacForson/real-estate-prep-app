stem: Under Rhode Island law, which individual is exempt from the written examination requirement
  for a real estate broker or salesperson license?
options:
  - A person who has completed forty-five classroom hours
  - A person who holds a college degree in real estate
  - A person who has been a licensed salesperson for two years
  - An attorney licensed by the Rhode Island Supreme Court
key: D
explanation: The statute explicitly states that an attorney-at-law licensed by the Rhode Island
  Supreme Court who applies for a broker or salesperson license and pays the required fee shall be
  granted a license without examination. This establishes the attorney exemption from the written
  exam. The other options describe requirements that do not confer exemption.
citation:
  source: R.I. Gen. Laws § 5-20.5-4(d)
  url: null
  quoted_text: When an attorney-at-law licensed by the supreme court of the state desires to have a
    real estate broker’s license or a real estate salesperson’s license, the attorney, by
    application, and upon payment of the applicable fee as provided in § 5-20.5-11, shall be granted
    a license without examination.
