stem: A principal broker employs four licensees. What is the minimum per‑claim coverage required
  under option (a) of the errors and omissions insurance rule for a principal broker’s blanket
  policy?
options:
  - $50,000
  - $150,000
  - $200,000
  - $300,000
key: C
explanation: Option (a) requires the per‑claim amount to be $50,000 multiplied by the number of
  licensees. With four licensees, the calculation is $50,000 × 4 = $200,000. The $50,000 distractor
  omits the multiplication, while $300,000 reflects the fixed amount in option (b).
