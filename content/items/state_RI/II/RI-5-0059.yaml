stem: A real estate school applies for a three-year permit. According to Rhode Island law, what
  total fee must accompany the application?
options:
  - $450
  - $250
  - $350
  - $550
key: A
explanation: The law requires a first‑year license fee of $250 plus an additional $100 for each
  remaining year of the license term. For a three‑year term, the remaining term is two years, so the
  fee is $250 + (2 × $100) = $450. The distractor of $350 results from mistakenly adding only one
  $100 increment, as if the term were two years.
citation:
  source: "### R.I. Gen. Laws ch. 5-20.5 (Real Estate Brokers and Salespersons) — R.I. Gen. Laws Title
    5, Chapter 20.5 — Real Estate Brokers and Salespersons, §§ 5-20.5-1 to 5-20.5-28 concatenated
    from the official RI General Assembly section pages read via Internet Archive captures of
    2025–2026 because webserver.rilegislature.gov times out from this network — § 5-20.5-20"
  url: null
  quoted_text: The application of each school shall be accompanied by a first-year license fee of two
    hundred fifty dollars ($250) and a further fee of one hundred dollars ($100) multiplied by the
    remaining term of licensure.
