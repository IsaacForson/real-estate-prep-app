stem: Principal broker Alex’s brokerage dissolves on August 1, 2024. What must Alex do with his
  broker license within ten (10) days under Rhode Island regulations?
options:
  - He must submit a new application for a salesperson license and notify the Department within ten
    (10) days.
  - He must continue to supervise affiliated licensees and notify the Department within ten (10)
    days.
  - He must transfer his license to another brokerage and notify the Department within ten (10) days.
  - He must notify the Department in writing of the dissolution and return his license to the
    Department.
key: D
explanation: Per 230-RICR-30-20-2 § 2.11, the principal broker must notify the Department in writing
  of the dissolution and return his or her license within ten (10) days. The other options describe
  actions not required by the rule, such as transferring the license, continuing supervision, or
  applying for a salesperson license.
citation:
