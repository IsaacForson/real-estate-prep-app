stem: If the balance in the Rhode Island real estate recovery account is less than $200,000 on
  December 31 of a given year, what additional fee must a licensed real estate broker pay when
  renewing the license for the following calendar year?
options:
  - $10.00
  - $25.00
  - $50.00
  - $100.00
key: B
explanation: Under subsection (b) of §5‑20.5‑5, when the account balance is below $200,000, each
  broker renewing a license must pay an extra $25.00 deposit to the recovery account. The $10.00
  distractor confuses this fee with the $10.00 per‑year renewal fee for a school permit, which
  applies to a different provision.
