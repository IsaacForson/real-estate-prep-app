stem: A real estate school applies for a permit with a requested licensure term of four (4) years.
  What total fee must be paid at the time of application under Rhode Island law?
options:
  - $250.00
  - $350.00
  - $450.00
  - $550.00
key: D
explanation: The initial application requires a $250 first‑year license fee plus $100 for each year
  beyond the first (§5-20.5-20(b)). For a four‑year term, the remaining term is three years, so $100
  × 3 = $300. Adding the $250 yields $550 total. The $350.00 distractor results from adding only one
  extra year’s $100 fee instead of three.
citation:
  source: R.I. Gen. Laws ch. 5-20.5 (Real Estate Brokers and Salespersons) — R.I. Gen. Laws Title 5,
    Chapter 20.5 — Real Estate Brokers and Salespersons, §§ 5-20.5-1 to 5-20.5-28 concatenated from
    the official RI General Assembly section pages read via Internet Archive captures of 2025–2026
    because webserver.rilegislature.gov times out from this network — § 5-20.5-20
  url: null
  quoted_text: The application of each school shall be accompanied by a first-year license fee of two
    hundred fifty dollars ($250) and a further fee of one hundred dollars ($100) multiplied by the
    remaining term of licensure.
  secondary: []
math:
  worked_solution: |-
    First‑year fee = $250
    Remaining term = 4 years – 1 year = 3 years
    Additional fee = $100 × 3 = $300
    Total fee = $250 + $300 = $550
  formulas:
    - Total = $250 + ($100 × (term – 1))
