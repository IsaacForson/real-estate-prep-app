stem: A broker’s Rhode Island real estate license expired six months ago. What must the broker do to
  reinstate the license?
options:
  - Pay the renewal fee only
  - Retake and pass the written examination
  - Pay the $100 late fee only
  - Pay the renewal fee plus a $100 late fee
key: D
explanation: The law requires payment of the renewal fee plus a one‑hundred‑dollar late fee for
  reinstating a broker’s license after expiration. Paying only the renewal fee omits the mandated
  late fee, while retaking the exam is only required if the license has been expired beyond one
  year. Paying only the late fee fails to satisfy the renewal fee obligation.
citation:
