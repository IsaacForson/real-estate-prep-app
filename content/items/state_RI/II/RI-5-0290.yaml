stem: After terminating an affiliated licensee’s employment, within how many days must a principal
  broker complete a written accounting of all commissions due to the licensee under Rhode Island
  regulations?
options:
  - The principal broker must complete the accounting within ten (10) days
  - The principal broker must complete the accounting within thirty (30) days
  - The principal broker must complete the accounting within sixty (60) days
  - The principal broker must complete the accounting within fifteen (15) days
key: B
explanation: The regulation specifies that the accounting shall be made within thirty (30) days
  after the termination of affiliation or employment. The distractor suggesting ten days is
  incorrect because that timeline applies to commission payments, not the termination accounting.
