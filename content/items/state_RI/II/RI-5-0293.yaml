stem: Under Rhode Island law, when must an aggrieved person notify the Department of Business
  Regulation in writing of commencing an action that may result in collection from the real estate
  recovery account?
options:
  - After the court enters judgment
  - Within ten days after commencement
  - At the time of commencement of the action
  - Within thirty days after commencement
key: C
explanation: The statute requires notification 'at the time of the commencement of that action' when
  a lawsuit that may lead to recovery account payment is filed. Waiting until after judgment or
  within a set period does not satisfy this requirement.
