stem: A pre‑licensing course consists of ten sessions, each lasting forty‑five minutes. How many
  clock hours of instruction does the course provide under Rhode Island regulations?
options:
  - 10 clock hours
  - 6 clock hours
  - 12 clock hours
  - 0 clock hours
key: D
explanation: A clock hour is defined as a period of at least fifty (50) minutes of classroom
  instruction. Each forty‑five‑minute session is shorter than fifty minutes, so it does not qualify
  as a clock hour. Therefore ten such sessions yield zero clock hours.
