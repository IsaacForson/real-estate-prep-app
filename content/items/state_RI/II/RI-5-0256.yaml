stem: If a Rhode Island real estate license has been expired for more than one year, what must the
  licensee do to renew it?
options:
  - Pay the renewal fee and late charge
  - Submit proof of continuing education
  - Retake and pass the written exam
  - Pay a one-hundred-dollar late fee
key: C
explanation: Under R.I. Gen. Laws § 5-20.5-11(b), a license cannot be renewed without examination if
  it has expired beyond a one‑year period; therefore the licensee must retake and pass the written
  exam. The option to pay only fees or submit education ignores the examination requirement.
