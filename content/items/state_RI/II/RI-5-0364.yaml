stem: What is the minimum number of classroom hours required for an applicant for a real estate
  salesperson license under Rhode Island law?
options:
  - 60 hours
  - 45 hours
  - 90 hours
  - 30 hours
key: B
explanation: Under Rhode Island law, a salesperson license applicant must submit proof of completing
  at least forty-five classroom hours in an approved real estate course. This requirement is set
  forth in § 5-20.5-4(b). The other options either fall short of the minimum or exceed it without
  being required.
