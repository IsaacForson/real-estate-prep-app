stem: A Rhode Island real estate school refuses to enroll an applicant because the applicant uses a
  service dog due to a disability. According to the regulations, what action may the Department of
  Business Regulation take regarding the school’s permit?
options:
  - Issuing a formal warning and requiring the school to complete remedial training within 30 days
  - Taking action against the school permit as grounds for disciplinary action
  - Imposing a fine of $1,000 for each violation found by the Department
  - Requiring the school to provide a full refund of all tuition collected from the affected student
key: B
explanation: Under 230-RICR-30-20-2 § 2.29(E)(8), discrimination against a protected class under the
  Civil Rights of People with Disabilities Act in Rhode Island is grounds for taking action against
  a real estate school’s permit, so the Department may take such action. Issuing a warning or
  imposing a fine are not specified consequences for this violation.
