stem: An applicant holds a current real estate license from another state that has a reciprocity
  agreement with Rhode Island. Which portion of the Rhode Island real estate licensing examination
  may be waived?
options:
  - The uniform portion only
  - The state-specific portion only
  - Both portions
  - Neither portion
key: A
explanation: The statute provides that an applicant with a valid out-of-state license from a state
  offering reciprocal waiver is not required to take the uniform portion of the Rhode Island exam.
  The state-specific portion remains required. Therefore, only the uniform portion may be waived.
citation:
  source: "### R.I. Gen. Laws ch. 5-20.5 (Real Estate Brokers and Salespersons) — R.I. Gen. Laws Title
    5, Chapter 20.5 — Real Estate Brokers and Salespersons, §§ 5-20.5-1 to 5-20.5-28 concatenated
    from the official RI General Assembly section pages read via Internet Archive captures of
    2025–2026 because webserver.rilegislature.gov times out from this network — § 5-20.5-4"
  url: null
  quoted_text: An applicant shall not be required to take the uniform portion of the Rhode Island real
    estate licensing examination if the applicant provides sufficient evidence that the applicant
    possesses an existing valid real estate license from a state that has similar statutes or
    regulations in effect that provide for reciprocal waiver of the uniform portion of the real
    estate licensing examination for persons holding an existing valid Rhode Island real estate
    broker’s or salesperson’s license.
