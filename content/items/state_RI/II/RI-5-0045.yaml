stem: John is applying for his first real estate broker license in Rhode Island. Which of the
  following is required to accompany his application?
options:
  - A ten‑dollar ($10.00) processing fee and proof of completion of sixty hours of approved
    pre‑license education, together with a certificate of finishing a thirty‑hour ethics course.
  - A ten‑dollar ($10.00) processing fee and the names of three Rhode Island residents who have
    known him for at least three years and are not related to him.
  - A ten‑dollar ($10.00) processing fee and a statement under oath from the broker whose employ he
    wishes to enter, along with a notarized affidavit of good moral character.
  - A ten‑dollar ($10.00) processing fee and a copy of his college diploma or equivalent, plus a
    letter of recommendation from a licensed attorney.
key: B
explanation: Rhode Island law requires every broker license application to include a ten‑dollar
  processing fee and, for a broker applicant, the names of at least three Rhode Island residents who
  have known the applicant for three years and are not related. Therefore the option that lists the
  fee and those three names is correct. The option that mentions a broker’s statement under oath is
  incorrect because that requirement applies to a salesperson license, not a broker license.
citation:
  source: R.I. Gen. Laws § 5-20.5-3
  url: null
  quoted_text: |-
    All applicants for a license to act as a real estate broker or real estate salesperson
     shall accompany their applications with a fee of ten dollars ($10.00) to cover costs
     of processing those applications.

     (c) The application for a broker’s license shall be accompanied by the names of at least
     three (3) Rhode Island residents who have known the applicant for three (3) years
