  url: null
  quoted_text: (1) Any person, partnership, association, or corporation, who or that, as a bona fide
    owner, lessee, or lessor, performs any of the previously stated acts as to property owned, or
    leased by them, or to their regular employees, where those acts are performed in the regular
    course of, or as an incident to the management of the property and the investment in the
    property;
