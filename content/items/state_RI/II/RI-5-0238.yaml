stem: Jane owns a rental house and lists it for sale herself without a real estate license. Under
  Rhode Island law, is she required to obtain a real estate license to sell her own property?
options:
  - She is required to obtain a real estate license
  - She is not required to obtain a real estate license
  - She is required to obtain a license only if she receives a commission
  - She is required to obtain a license because she is advertising the home
key: B
explanation: As a bona fide owner selling her own property, Jane falls under the exemption for
  owners who act in the regular course of managing their property. The distractor about receiving a
  commission is incorrect because the exemption applies regardless of compensation when the owner
  acts on their own property.
