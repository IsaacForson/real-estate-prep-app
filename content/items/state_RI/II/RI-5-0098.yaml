    230-RICR-30-20-2 — Real Estate Brokers and Salespersons (DBR Commercial Licensing) § 2.3
  url: null
  quoted_text: Every licensee shall notify the Department in writing of each change of personal name,
    firm affiliation, trade name, residence address and firm address within ten (10) days of the
    change.
