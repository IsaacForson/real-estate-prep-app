stem: Within how many days must a licensee notify the Rhode Island Department of Business Regulation
  in writing of a change in residence address?
options:
  - Within five (5) days
  - Within ten (10) days
  - Within fifteen (15) days
  - Within thirty (30) days
key: B
explanation: Under 230-RICR-30-20-2 § 2.3, a licensee must notify the Department in writing of each
  change of residence address within ten (10) days of the change. The other options list incorrect
  timeframes that do not match the regulatory requirement.
