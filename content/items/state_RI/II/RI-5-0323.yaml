stem: An applicant completed ninety classroom hours thirty months ago and applies for a real estate
  broker license. According to Rhode Island regulations, does the applicant satisfy the
  pre‑licensing education requirement?
options:
  - Yes, but only if the applicant also completes an additional forty‑five hours.
  - Yes, because the hours were completed within the four‑year limit for broker applicants.
  - No, because salesperson hours cannot be applied toward a broker license.
  - No, because the hours were completed more than two years before the application.
key: B
explanation: Under 230-RICR-30-20-2 § 2.7(C), classroom hours completed more than four years before
  the application are not counted toward the broker’s ninety‑hour requirement. The applicant’s
  ninety hours were finished thirty months (2.5 years) prior, which is within the four‑year window,
  so they satisfy the requirement. The distractor that claims the hours are too old mistakenly
  applies the two‑year limit that applies only to salesperson applicants.
