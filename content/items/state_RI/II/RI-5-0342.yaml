stem: An applicant for a broker license submits the names of six Rhode Island residents who have
  known him for at least three years and are not related. How many more references than the minimum
  required has the applicant provided?
options:
  - Zero references
  - One reference
  - Two references
  - Three references
key: D
explanation: The rule mandates at least three references for a broker license application.
  Submitting six references exceeds the minimum by three (6 − 3 = 3). The option ‘One reference’
  would be correct only if four references were submitted, which is not the case.
citation:
