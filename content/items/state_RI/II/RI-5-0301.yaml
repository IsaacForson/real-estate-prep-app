stem: What is the maximum time period allowed to commence an action that may result in collection
  from the real estate recovery account after the accrual of the cause of action based on fraud,
  misrepresentation, or deceit?
options:
  - One (1) year
  - Two (2) years
  - Three (3) years
  - Five (5) years
key: B
explanation: Under R.I. Gen. Laws § 5-20.5-5(c)(1), an action that may lead to recovery from the
  real estate recovery account must be commenced within two (2) years of the accrual of the cause of
  action. The correct answer is therefore two (2) years. The distractor of three (3) years is
  incorrect because it confuses the recovery account limitation with the maximum term for a school
  permit, which is governed by a different provision.
citation:
