stem: Under Rhode Island regulations, what is the minimum length of a clock hour for pre‑licensing
  classroom instruction?
options:
  - 55 minutes
  - 60 minutes
  - 45 minutes
  - 50 minutes
key: D
explanation: The regulation defines a clock hour as a period of at least fifty (50) minutes of
  classroom instruction. Therefore 50 minutes is correct. The 45‑minute option confuses the clock
  hour with the 45‑hour pre‑licensing education requirement for salespersons, which is a separate
  rule.
