stem: An applicant completed forty-five classroom hours twenty-five months before submitting a
  salesperson license application. According to Rhode Island regulations, does the applicant satisfy
  the pre‑licensing education requirement?
options:
  - The applicant does not satisfy the requirement because the hours were completed more than two
    years before the application.
  - The applicant does not satisfy the requirement because fewer than forty‑five hours were
    completed.
  - The applicant satisfies the requirement because forty‑five hours were completed within the last
    two years.
  - The applicant satisfies the requirement because the hours were completed less than two years ago.
key: A
explanation: Regulations state that classroom hours completed more than two years from the
  application date cannot be counted toward the forty‑five‑hour requirement. Twenty‑five months
  exceeds this limit, so the requirement is not met. The distractor claiming satisfaction because
  hours were completed less than two years ago ignores the twenty‑month gap.
