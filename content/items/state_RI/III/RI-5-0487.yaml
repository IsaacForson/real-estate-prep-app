stem: A buyer sues the agent for misrepresentation based on the seller's written disclosure.
  According to R.I. Gen. Laws § 5-20.8-2(a), is the agent liable for the accuracy of the seller's
  representations?
options:
  - The agent is not liable for the accuracy or thoroughness of the seller's representations
  - The agent is liable for the accuracy of the seller's representations in the written disclosure
  - The agent is liable for the thoroughness of the seller's representations in the written
    disclosure
  - The agent is liable for deficient conditions not disclosed to the agent by the seller
key: A
explanation: The statute explicitly says the agent is not liable for the accuracy or thoroughness of
  representations made by the seller in the written disclosure. The distractor claiming liability
  contradicts this direct provision.
