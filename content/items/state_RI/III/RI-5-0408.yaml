stem: An affiliated licensee forms a corporation to receive commission payments and then uses that
  corporation to sign a listing agreement as the broker. Is this permissible under Rhode Island
  regulation?
options:
  - Under Rhode Island regulation, the corporation may not be licensed or conduct licensed real
    estate activity in its own name.
  - Under Rhode Island regulation, the corporation may be licensed to conduct real estate activity
    if it is wholly owned by the licensee.
  - Under Rhode Island regulation, the corporation may conduct real estate activity as long as the
    licensee is its sole shareholder.
  - Under Rhode Island regulation, the corporation may act as a broker for the licensee's clients
    without additional licensing.
key: A
explanation: The regulation states that a corporation created to receive commission payments may not
  be licensed or conduct licensed real estate activity in its own name. Using the corporation to
  sign a listing agreement as the broker would constitute conducting licensed activity, which is
  prohibited. The idea that sole ownership by the licensee permits the corporation to act as a
  broker is incorrect; the prohibition applies regardless of ownership structure.
