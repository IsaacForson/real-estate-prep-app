stem: Under Rhode Island regulation, what must a licensee do immediately if their errors and
  omissions insurance coverage is canceled or interrupted?
options:
  - Cease real estate activities requiring licensure immediately
  - Notify the Department within five business days
  - Submit proof of new coverage within ten days
  - Continue activities while seeking new coverage
key: A
explanation: The regulation states that cancellation or interruption of required insurance coverage
  requires the licensee to cease any real estate activities requiring licensure immediately until
  compliance is restored. The distractor about notifying the Department within five business days
  applies to a separate notice requirement, not the immediate cessation mandate.
citation:
  source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons) — Rhode Island Code of Regulations
    230-RICR-30-20-2 — Real Estate Brokers and Salespersons (DBR Commercial Licensing) § B
  url: null
  quoted_text: Cancellation or any other interruption in required insurance coverage shall require the
    licensee to cease any real estate activities requiring licensure immediately until such time as
    the licensee is in compliance with R.I. Gen. Laws § 5-20.5-25.
