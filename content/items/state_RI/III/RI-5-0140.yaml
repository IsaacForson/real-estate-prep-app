stem: A broker receives an earnest money deposit and records the date deposited, amount, and to whom
  paid, but only retains the records for two years. Which requirement has the broker violated under
  Rhode Island law?
options:
  - The broker failed to deposit the funds with the general treasurer within 180 days.
  - The broker failed to keep records for three years showing to whom the money belongs.
  - The broker failed to apply the funds to commission when earned.
  - The broker failed to segregate the funds from personal accounts.
key: B
explanation: The statute mandates that escrow records be kept for three (3) years, showing details
  such as to whom the money belongs. The distractor about depositing funds with the treasurer
  applies only when ownership is disputed, not to routine record‑keeping.
