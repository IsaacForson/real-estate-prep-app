stem: Under R.I. Gen. Laws ch. 5-20.8-2(a), what must happen before an agent may communicate the
  buyer's offer to the seller?
options:
  - The agent must obtain a written waiver from the seller in writing.
  - The buyer must receive a copy of the written disclosure and sign a written receipt.
  - The seller must sign a written account of the buyer's refusal of the property.
  - The buyer must pay an earnest money deposit to secure the transaction.
key: B
explanation: The statute prohibits the agent from communicating the buyer's offer until the buyer
  has received the disclosure and signed a receipt. The other options describe unrelated or
  incorrect prerequisites.
