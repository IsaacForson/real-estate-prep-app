stem: A seller is listing a residential property built in 1972. According to R.I. Gen. Laws
  §5-20.8-2(b)(3)(xxxI), what must the seller provide to the buyer regarding lead paint?
options:
  - The seller must conduct a professional lead inspection at the seller’s expense before accepting
    any offer.
  - The seller must provide the buyer with a copy of any lead inspection report in the seller’s
    possession and notify the buyer of any known lead poisoning problem.
  - The seller must guarantee that the property is free of lead-based paint and provide a warranty
    against future lead exposure.
  - The seller must inform the buyer that lead paint is only a concern if children under six are
    present and no documentation is required.
key: B
explanation: The statute explicitly requires the seller to provide any lead inspection report in the
  seller’s possession and to notify the buyer of any known lead poisoning problem for residential
  real estate built prior to 1978. The other options either impose unwarranted guarantees, require
  inspections not mandated, or incorrectly limit disclosure obligations.
