stem: Under Rhode Island regulation, what is the maximum number of shareholders permitted in a
  corporation formed by an affiliated licensee solely to receive commission payments?
options:
  - Under Rhode Island regulation, the corporation may have one shareholder.
  - Under Rhode Island regulation, the corporation may have two shareholders.
  - Under Rhode Island regulation, the corporation may have three shareholders.
  - Under Rhode Island regulation, the corporation may have an unlimited number of shareholders.
key: A
explanation: The regulation states that a corporation created to receive commission payments may not
  have more than one shareholder. Therefore, the maximum allowable is one shareholder. The option
  suggesting two shareholders is incorrect because the rule expressly prohibits any corporation from
  having more than one shareholder in this context.
