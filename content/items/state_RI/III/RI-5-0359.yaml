  quoted_text: As soon as practicable, but in any event no later than prior to signing any agreement
    to transfer real estate, the seller of the real estate shall deliver a written disclosure to the
    buyer and to each agent with whom the seller knows he or she or the buyer has dealt in
    connection with the real estate.
