stem: By what latest point must the seller deliver the written disclosure to the buyer under R.I.
  Gen. Laws § 5-20.8-2(a)?
options:
  - Within three (3) days of receiving the purchase offer
  - Prior to signing any agreement to transfer real estate
  - After the buyer and seller have executed the purchase agreement
  - At the time of closing the real estate transaction
key: B
explanation: The statute requires the seller to deliver the written disclosure no later than prior
  to signing any agreement to transfer real estate. Therefore the latest permissible moment is
  before the agreement is signed. The distractor “Within three (3) days of receiving the purchase
  offer” imposes a shorter timeframe that the law does not mandate, while the other options suggest
  delivery after the agreement has been signed, which violates the deadline.
