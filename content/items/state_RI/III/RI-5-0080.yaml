stem: If a buyer refuses to sign a receipt for the seller's disclosure under R.I. Gen. Laws ch.
  5-20.8-2(a), what must the seller or agent do?
options:
  - Terminate the transaction and return any earnest money.
  - File a complaint with the Rhode Island real estate commission.
  - Immediately sign and date a written account of the refusal.
  - Provide the buyer with a second disclosure form.
key: C
explanation: The statute directs the seller or agent to immediately sign and date a written account
  of the buyer's refusal to sign the receipt. The other options are not required by the disclosure
  provision.
