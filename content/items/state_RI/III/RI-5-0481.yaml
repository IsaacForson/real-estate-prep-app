stem: A licensee is renewing their license and needs to confirm that a continuing education course
  satisfies the new CORE-Fair Housing requirement. According to Rhode Island regulation, what should
  the licensee verify on the course completion certificate?
options:
  - The licensee should check whether the certificate indicates the course qualifies for CORE or
    CORE-Fair Housing Requirements.
  - The licensee should ensure that the certificate lists the date the course was completed.
  - The licensee should verify that the certificate is signed by the course instructor.
  - The licensee should confirm that the certificate includes the school's accreditation number.
key: A
explanation: Rhode Island regulation 230-RICR-30-20-2 § 2.29(G)(8) requires that completion
  certificates indicate whether a course satisfies the CORE or CORE‑Fair Housing requirement;
  therefore the licensee should verify that the certificate shows this designation.
