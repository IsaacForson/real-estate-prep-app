stem: A licensee is convicted of a misdemeanor on March 5, and the final judgment is entered that
  same day. According to Rhode Island regulation, by what date must the licensee file a written
  report of the conviction with the Department?
options:
  - May 11
  - May 4
  - May 3
  - June 4
key: B
explanation: The regulation requires a written report to be filed within sixty (60) days of the
  final judgment; adding sixty days to March 5 gives May 4. The May 3 option reflects an off‑by‑one
  error.
citation:
  source: 230-RICR-30-20-2 § 2.13
  url: null
  quoted_text: Any licensee convicted of, or otherwise pleads guilty or nolo contendere to, any felony
    or misdemeanor, or is disciplined by any governmental agency in connection with any other
    occupational license, shall file with the Department a written report of such conviction or
    disciplinary action within sixty (60) days of the final judgment or final order in the case.
