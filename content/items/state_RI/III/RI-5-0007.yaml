stem: A licensee distributes flyers urging homeowners to sell quickly because families from a
  protected class are moving into the neighborhood. Which Rhode Island rule does this conduct
  violate?
options:
  - The rule against soliciting sales due to protected-class entry
  - The rule against collecting an advance fee without providing a service list
  - The rule against forming a wholly owned entity to receive commissions
  - The rule against withholding material facts from a client in writing
key: A
explanation: Section 2.14 bars a licensee from soliciting a sale or listing because a protected
  class is entering or may enter the neighborhood, which is exactly the panic-selling tactic
  described.
citation:
  source: 230-RICR-30-20-2 § 2.14
  url: null
  quoted_text: No licensee shall solicit the sale, lease, the listing for sale, or the lease of
    residential property due to the presence or prospective entry into the neighborhood of an
    individual or individuals of any protected class designated in the Rhode Island Fair Housing
    Practices Act, R.I. Gen. Laws Chapter 34-37
