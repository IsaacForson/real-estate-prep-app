stem: A seller knows the property being sold is located in a historic district. Under R.I. Gen. Laws
  § 5-20.8-2(b)(2)(vi), what must the seller disclose to the buyer?
options:
  - The agent must disclose that the property is in a historic district and notify the buyer that
    property located in a historic district may be subject to construction, expansion, or renovation
    limitations, and advise to contact the local building inspection official for details, and
    ensure the buyer receives a copy of the disclosure statement.
  - The seller must disclose that the property is in a historic district but is not required to
    provide any notification about construction limitations, and must also provide the buyer with a
    copy of the property tax assessment.
  - The seller must disclose that the property is in a historic district and notify the buyer that
    property located in a historic district may be subject to construction, expansion, or renovation
    limitations, and advise to contact the local building inspection official for details.
  - The buyer must disclose that the property is in a historic district and notify the seller that
    property located in a historic district may be subject to construction, expansion, or renovation
    limitations, and advise to contact the local building inspection official for details, and
    ensure the seller receives a copy of the disclosure statement.
key: C
explanation: The rule requires the seller to disclose the historic district fact and to provide the
  notification about possible construction, expansion, or renovation limitations, advising the buyer
  to contact the local building inspection official. The distractor that omits the
  construction‑limitation notification is incorrect because the statute mandates that specific
  warning.
