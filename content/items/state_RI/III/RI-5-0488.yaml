stem: A buyer receives the seller's written disclosure on June 10 and schedules an inspection of the
  property's sewage system for June 22. According to R.I. Gen. Laws § 5-20.8-2(b)(2)(i) and §
  5-20.8-13, is this inspection permitted?
options:
  - The inspection is permitted because it occurs within ten days of receipt
  - The inspection is not permitted because it occurs after the ten-day period
  - The inspection is permitted only if the buyer pays for the inspection
  - The inspection is not permitted because the seller did not provide the disclosure
key: B
explanation: The rule grants a ten-day inspection period starting from receipt of the disclosure; an
  inspection on June 22 is twelve days after June 10, which exceeds the allowed period. The
  distractor suggesting permission within ten days miscalculates the timeline.
citation:
  source: R.I. Gen. Laws § 5-20.8-2(b)(2)(i)
  url: null
  quoted_text: Pursuant to § 5-20.8-13, potential purchasers shall be permitted a ten-day (10) period
    to conduct an inspection of a property’s sewage system to determine if a cesspool exists, and if
    so, whether it will be subject to the phase-out requirements as established in chapter 19.15 of
    title 23.
