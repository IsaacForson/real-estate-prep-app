stem: According to R.I. Gen. Laws § 5-20.8-2(a), when may an agent communicate the buyer's offer to
  the seller?
options:
  - The agent may communicate the offer as soon as the buyer expresses interest in the property.
  - The agent may communicate the offer after the buyer receives the disclosure and signs a receipt.
  - The agent may communicate the offer once the seller has signed the purchase and sale agreement.
  - The agent may communicate the offer after the buyer submits a completed loan application to the
    lender.
key: B
explanation: The statute explicitly states that the agent shall not communicate the offer until the
  buyer has received a copy of the written disclosure and signed a written receipt. Therefore,
  communication is permissible only after those two events occur. The distractor that suggests
  communication may occur as soon as the buyer expresses interest ignores the statutory prerequisite
  of receipt and disclosure.
