stem: What does the term 'Broker price opinion' mean under Rhode Island regulation?
options:
  - An analysis, opinion, or conclusion prepared by a person licensed under R.I. Gen. Laws Chapter
    5-20.5 in the ordinary course of his or her business relating to the price of specified
    interests in or aspects of identified real estate or identified real property for the purpose of
    listing, purchase, or sale
  - An analysis, opinion, or conclusion relating to the nature, quality, value or utility of
    specified interests in, or aspects of, identified real estate prepared by a person licensed
    under R.I. Gen. Laws Chapter 5-20.7 and Part 1 of this Subchapter, that conforms to the
    standards adopted by the Uniform Standards of Professional Appraisal Practice (“USPAP”) in
    accordance with R.I. Gen. Laws § 5-20.7-19
  - An agreement in which a prospective seller lists Real Estate for sale with an authorization to a
    Broker to sell at a specified net dollar return to the seller and which provides that the Broker
    may retain as Commission the difference between the specified dollar return to the seller and
    the actual sales price
  - An analysis, opinion, or conclusion prepared by a person licensed under R.I. Gen. Laws Chapter
    5-20.5 in the ordinary course of his or her business relating to the price of specified
    interests in or aspects of identified real estate or identified real property by comparison to
    other real property currently or recently sold in the marketplace for the purpose of listing,
    purchase, or sale
key: A
explanation: The regulation defines a broker price opinion as an analysis prepared by a licensee in
  the ordinary course of business relating to the price of real estate for listing, purchase, or
  sale. The first incorrect option describes an appraisal, which is a different definition, and the
  third incorrect option describes a comparative market analysis, also distinct.
citation:
  source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons) — Rhode Island Code of Regulations
    230-RICR-30-20-2 — Real Estate Brokers and Salespersons (DBR Commercial Licensing) § 2.2(A)(3)
  url: null
  quoted_text: “Broker price opinion” or “BPO” means an analysis, opinion, or conclusion prepared by a
    person licensed under R.I. Gen. Laws Chapter 5-20.5 in the ordinary course of his or her
    business relating to the price of specified interests in or aspects of identified real estate or
    identified real property for the purpose of listing, purchase, or sale.
