stem: A Rhode Island broker wants to use an attorney to hold an earnest money deposit. Is this
  permissible under Rhode Island law?
options:
  - It is permissible only if the attorney is employed by the brokerage and licensed in Rhode Island
  - It is permissible because any person or entity legally authorized to hold funds may hold escrow
  - It is impermissible because only a bank or title company may hold escrow funds in Rhode Island
  - It is impermissible because only a licensed broker may hold escrow funds in Rhode Island
key: B
explanation: The law states that funds in escrow may be held by any person or entity legally
  authorized to hold funds in that capacity, such as a broker or attorney. Therefore, using an
  attorney is allowed; the claim that only a broker may hold escrow funds contradicts the statute.
