stem: A licensee is found guilty of making a substantial misrepresentation in violation of
  §5-20.5-14(a)(1). What is the maximum administrative penalty the director may impose under Rhode
  Island law?
options:
  - Five hundred dollars ($500)
  - One thousand dollars ($1,000)
  - Two thousand dollars ($2,000)
  - Five thousand dollars ($5,000)
key: C
explanation: Section 5-20.5-14(b) authorizes the director to levy an administrative penalty not
  exceeding two thousand dollars ($2,000) for any violation under that section or the department’s
  rules. Therefore, the maximum penalty for a substantial misrepresentation is $2,000. The options
  listing $500, $1,000, or $5,000 are incorrect because they either understate or overstate the
  statutory limit.
