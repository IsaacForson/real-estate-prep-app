stem: A team leader who is an affiliated licensee wants to create a single-member limited liability
  company to collect money from team members to pay shared office rent and utilities. Is this
  permissible under Rhode Island regulation?
options:
  - Under Rhode Island regulation, the team leader may not form any LLC because only corporations
    are permitted to receive commission payments.
  - Under Rhode Island regulation, the team leader may form a single-member LLC to collect funds for
    common joint expenses such as rent and utilities.
  - Under Rhode Island regulation, the team leader may form an LLC only if it has multiple members
    to share expenses.
  - Under Rhode Island regulation, the team leader may form an LLC only if it also receives
    commission payments from the principal broker.
key: B
explanation: The regulation explicitly allows a team leader to form a single-member/manager LLC
  solely for collecting funds from team members to pay common joint expenses such as rent and
  utilities. Therefore, forming the LLC for this purpose is permissible. The claim that LLCs are
  prohibited because only corporations may receive commissions is incorrect; the exception permits
  the LLC for expense collection, not commission receipt.
