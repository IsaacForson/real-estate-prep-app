stem: Under R.I. Gen. Laws § 5-20.5-26(a)(1)(i), who must supervise the escrow account maintained by
  a real estate firm?
options:
  - The salesperson who handles the deposit for the client
  - The broker qualified to do business on behalf of the licensee
  - The department of business regulation overseeing escrow accounts
  - The financial institution holding the account under state regulations
key: B
explanation: Under R.I. Gen. Laws § 5-20.5-26(a)(1)(i), each real estate firm must maintain its
  escrow account under the supervision of the broker qualified to do business on behalf of the
  licensee. The salesperson who handles the deposit for the client is not designated as a
  supervisor; the department of business regulation overseeing escrow accounts does not supervise
  the firm's escrow account; and the financial institution holding the account under state
  regulations is not responsible for supervision.
