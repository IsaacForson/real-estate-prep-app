stem: Under Rhode Island's real estate regulation, which party must act in a supervisory capacity
  for every real estate transaction in which an affiliated licensee participates?
options:
  - The principal broker of the brokerage
  - The Real Estate Commission's compliance officer
  - The affiliated licensee's designated mentor
  - The listing service administrator
key: A
explanation: The regulation makes the principal broker responsible for supervising every transaction
  in which an affiliated licensee takes part, not merely available for consultation.
