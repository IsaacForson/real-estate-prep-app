stem: If the buyer refuses to sign a receipt for the seller's written disclosure, what must the
  seller or agent do immediately according to R.I. Gen. Laws § 5-20.8-2(a)?
options:
  - Immediately sign and date a written account of the refusal
  - Immediately inform the Rhode Island real estate commission about the refusal
  - Immediately return the deposit to the buyer and cancel the contract
  - Immediately terminate the agency agreement and return the deposit
key: A
explanation: The rule states that if the buyer refuses to sign a receipt, the seller or agent shall
  immediately sign and date a written account of the refusal. The distractor about notifying the
  commission is incorrect because the statute does not require that action.
