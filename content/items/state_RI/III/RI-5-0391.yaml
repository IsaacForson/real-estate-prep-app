stem: Maria is a Rhode Island-licensed attorney who also holds a real estate salesperson license.
  She is renewing her real estate license for the upcoming biennial period. According to Rhode
  Island regulation, what continuing education obligation does Maria have?
options:
  - She must complete 3 hours of fair housing instruction plus 15 additional CE hours.
  - She must complete 18 CE hours in any department-approved subject.
  - She is exempt from all real estate continuing education requirements.
  - She must complete only the 3-hour fair housing course.
key: C
explanation: Under § 2.30(D) and the statutory changes noted in the regulation, RI licensed
  attorneys who also hold a real estate license are exempt from completing any real estate
  continuing education courses for license renewal. Consequently, Maria has no CE obligation,
  including the mandatory fair‑housing instruction.
