stem: Before releasing a forfeited deposit to a seller, a principal broker sends the buyer written
  notice by certified mail of the intent to release the funds. How many days from the buyer's
  receipt of that notice does the buyer have to dispute ownership before release?
options:
  - Twenty-one days
  - Thirty days
  - Sixty days
  - Fifteen days
key: C
explanation: Section 2.19 gives the buyer or renter sixty days from receiving the certified notice
  to dispute the deposit before the principal broker may release it to the seller.
citation:
  source: 230-RICR-30-20-2 § 2.19
  url: null
  quoted_text: The principal broker provides written notice to the buyer or renter by certified mail,
    return receipt requested, of his or her intent to release the deposit to the seller or landlord
    sixty (60) days from the date of receipt of the written notice
