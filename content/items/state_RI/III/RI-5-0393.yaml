stem: Under R.I. Gen. Laws § 5-20.8-2(b)(2)(iv), which party must provide the buyer with a copy of
  any previous surveys of the real estate that are in the seller’s possession and notify the buyer
  of any known easements, encroachments, covenants, or restrictions?
options:
  - The seller must provide the buyer with a copy of any previous surveys of the real estate that
    are in the seller’s possession and notify the buyer of any known easements, encroachments,
    covenants, or restrictions.
  - The buyer must provide the seller with a copy of any previous surveys of the real estate that
    are in the buyer’s possession and notify the seller of any known easements, encroachments,
    covenants, or restrictions.
  - The agent must provide the buyer with a copy of any previous surveys of the real estate that are
    in the agent’s possession and notify the buyer of any known easements, encroachments, covenants,
    or restrictions.
  - The broker must provide the buyer with a copy of any previous surveys of the real estate that
    are in the broker’s possession and notify the buyer of any known easements, encroachments,
    covenants, or restrictions.
key: A
explanation: The rule explicitly states that the seller must provide the buyer with a copy of any
  previous surveys in the seller’s possession and notify the buyer of known easements,
  encroachments, covenants, or restrictions. The distractor that assigns this duty to the buyer is
  incorrect because the statute places the obligation on the seller, not the buyer.
