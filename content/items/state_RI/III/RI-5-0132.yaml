stem: A licensee is placed on probation for eight months after being found guilty of making a
  substantial misrepresentation. Is this probation period permissible under Rhode Island law?
options:
  - Yes, because the probation period does not exceed one year.
  - No, because the probation period exceeds one year.
  - Yes, because the probation period is exactly one year.
  - No, because probation is only allowed for violations involving fraud.
key: A
explanation: The director may place a licensee on probation for up to one year for violations such
  as a substantial misrepresentation. An eight‑month probation falls within that maximum, so it is
  permissible. The statement that the probation period exceeds one year is incorrect because eight
  months is less than a year. The claim that the probation period is exactly one year is inaccurate;
  the statute permits any period up to, but not necessarily equal to, one year. The assertion that
  probation is limited to fraud‑related violations only is also wrong, as the statute includes false
  representation and other misconduct.
