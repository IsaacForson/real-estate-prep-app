stem: Under Rhode Island's real estate sales disclosure law, how is a "lead exposure hazard" defined?
options:
  - A condition that presents a clear and significant health risk to occupants of the dwelling,
    dwelling unit, or premises, particularly where there are children under the age of six (6)
    years.
  - A condition that presents any health risk to occupants of the dwelling, dwelling unit, or
    premises, regardless of the age of children present.
  - A condition that presents a clear and significant health risk only to children under the age of
    six (6) years residing in the dwelling.
  - A condition that presents a clear and significant health risk to occupants of any building,
    including commercial properties, particularly where there are children under the age of six (6)
    years.
key: A
explanation: The statute defines a lead exposure hazard as a condition that presents a clear and
  significant health risk to occupants of the dwelling, dwelling unit, or premises, particularly
  where there are children under the age of six years. One distractor describes a condition that
  presents any health risk regardless of children’s age, which is broader than the statutory
  definition. Another distractor limits the risk only to children under six, omitting occupants
  generally, which is narrower than the definition. A third distractor expands the scope to any
  building, including commercial properties, which the law does not include.
