stem: A broker receives a disputed earnest money deposit on March 3. According to R.I. Gen. Laws §
  5-20.5-26(a)(1)(iv), by what date must the broker deposit the monies with the general treasurer
  unless the parties agree in writing to extend the period?
options:
  - July 30
  - August 30
  - September 1
  - August 15
key: B
explanation: The law requires deposit within 180 days of the original deposit. Counting 180 days
  from March 3 lands on August 30 in a non‑leap year. The other dates result from miscalculating the
  month lengths.
