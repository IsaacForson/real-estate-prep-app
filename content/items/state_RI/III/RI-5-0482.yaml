stem: A real estate school is preparing to submit a new continuing education course for approval by
  the Rhode Island Department of Business Regulation. According to Rhode Island regulation, what
  must the school include in its application regarding the course's classification?
options:
  - The school must identify whether the course qualifies as CORE or CORE-Fair Housing.
  - The school must provide a detailed syllabus of the course topics.
  - The school must attach a copy of the instructor's real estate license.
  - The school must submit proof of payment for the application fee.
key: A
explanation: According to 230-RICR-30-20-2 § 2.29(G)(6)(f), the school must state whether the course
  is classified as CORE or CORE‑Fair Housing when submitting the application for approval. This
  identification allows the Department to assign the appropriate continuing education credit
  category. While a syllabus, instructor license copy, or proof of fee payment may be required
  elsewhere, the regulation does not mandate those items for the course classification step.
