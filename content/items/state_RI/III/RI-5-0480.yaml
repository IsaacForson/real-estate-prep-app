stem: According to Rhode Island regulation, what must real estate schools indicate on completion
  certificates for continuing education courses?
options:
  - The certificate must show the licensee's score on the final exam.
  - The certificate must list the total number of classroom hours completed.
  - The certificate must include the name of the brokerage employing the licensee.
  - The certificate must indicate whether the course qualifies for CORE or CORE-Fair Housing
    Requirements.
key: D
explanation: Rhode Island regulation 230-RICR-30-20-2 § 2.29(G)(8) requires that completion
  certificates for continuing education courses indicate whether the course qualifies for CORE or
  CORE-Fair Housing Requirements. Therefore the correct option is the one stating that the
  certificate must indicate whether the course qualifies for CORE or CORE-Fair Housing Requirements.
