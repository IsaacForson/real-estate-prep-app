stem: A licensee receives a purchase offer from a buyer on May 1. The buyer has not yet received the
  seller's written disclosure nor signed a receipt. According to R.I. Gen. Laws § 5-20.8-2(a), what
  must the licensee do with the offer?
options:
  - Submit the offer to the seller after informing the buyer of the delay.
  - Communicate the offer to the seller immediately.
  - Hold the offer until the buyer receives the disclosure and signs a receipt.
  - Forward the offer to the seller's attorney for review.
key: C
explanation: The statute prohibits the agent from communicating the buyer's offer until the buyer
  has received a copy of the written disclosure and signed a written receipt. Thus, the licensee
  must withhold the offer until those conditions are satisfied. The distractor that advises
  immediate communication violates the statutory prohibition.
