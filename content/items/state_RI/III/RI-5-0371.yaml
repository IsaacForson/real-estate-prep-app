stem: A broker retains escrow records showing details of deposited funds for 2 years and 11 months.
  Is this retention period sufficient under Rhode Island law?
options:
  - The retention period is sufficient because the law requires only two years.
  - The retention period is insufficient because records must be kept for at least three years.
  - The retention period is insufficient because records must be destroyed after two years.
  - The retention period is sufficient because it is close to three years.
key: B
explanation: Rhode Island law requires brokers to keep escrow records for a period of three (3)
  years, showing details such as to whom the money belongs, dates of deposit and withdrawal, and to
  whom paid. Retaining records for only 2 years and 11 months fails to meet this three‑year
  requirement, so the period is insufficient.
