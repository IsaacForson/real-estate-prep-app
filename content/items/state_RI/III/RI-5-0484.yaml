stem: According to Rhode Island regulation, must a salesperson who manages rental properties for an
  investor obtain a broker license?
options:
  - Yes, because managing another's property constitutes real estate broker activity requiring a
    broker license.
  - Yes, because the investor is the owner and therefore exempt from licensing requirements.
  - Yes, because only property owners need a broker license for management activities.
  - Yes, because the salesperson can rely on their existing salesperson license for property
    management.
key: A
explanation: Under Rhode Island regulation, anyone who performs broker activities—such as managing
  another person’s real property—must hold a broker license. The salesperson in the scenario is
  managing property for an investor, which is a broker activity, so a broker license is required.
  The claim that the investor’s ownership exempts the manager is incorrect because the exemption
  applies only to owners managing their own property, not to hired managers. The statement that only
  property owners need a broker license misstates the rule; the requirement applies to anyone
  performing broker acts for another’s property, regardless of ownership. Finally, a salesperson
  license does not authorize property‑management broker activities; a separate broker license is
  needed for those acts. (see 230-RICR-30-20-2 § 2.12(A))
citation:
  source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons) — Rhode Island Code of Regulations
    230-RICR-30-20-2 — Real Estate Brokers and Salespersons (DBR Commercial Licensing) § 2.12(A)
  url: null
  quoted_text: Any person who performs any of the acts within the meaning of 'real estate broker'
    pursuant to R.I. Gen. Laws § 5-20.5-1(5) in the regular course of, or as an incident to, the
    management of another person’s real property are required to be licensed as a real estate broker
    pursuant to R.I. Gen. Laws Chapter 5-20.5.
