stem: Under Rhode Island law, when a dispute arises over the ownership of deposit monies received by
  a broker in a real estate transaction, within how many days must the broker deposit the monies
  with the general treasurer?
options:
  - 90 days
  - 10 days
  - 365 days
  - 180 days
key: D
explanation: The rule requires a broker to deposit disputed monies with the general treasurer within
  one hundred eighty (180) days of the original deposit. The 90‑day distractor reflects a common
  misperception but the statute explicitly sets the period at 180 days.
