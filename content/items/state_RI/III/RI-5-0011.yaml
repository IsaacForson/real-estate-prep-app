stem: A broker allows an unlicensed friend to use the broker's license number on transaction
  paperwork so the friend can act as though licensed. Which principle from Rhode Island's regulation
  is being violated?
options:
  - A licensee may not lend a license for another person's benefit
  - A licensee may not charge an advance fee without a service list
  - A licensee may not disburse escrow funds before closing
  - A licensee may not retain a net listing commission arrangement
key: A
explanation: Section 2.24 forbids a licensee from lending a name or license to benefit another
  person, which is exactly what occurs when an unlicensed individual is allowed to operate under
  someone else's license.
