stem: Under Rhode Island law, within how many days must a person aggrieved by a final administrative
  decision file a notice of appeal?
options:
  - Within ten (10) days
  - Within fifteen (15) days
  - Within thirty (30) days
  - Within sixty (60) days
key: C
explanation: Under R.I. Gen. Laws § 5-20.5-16(b), a person who is aggrieved has the right to appeal
  within thirty (30) days after service of notice of the department’s action. The thirty‑day period
  makes the answer that states thirty days correct. The ten‑day choice reflects a different
  requirement for affiliation changes under §5-20.5-14(a)(33) and does not apply to appeals.
citation:
