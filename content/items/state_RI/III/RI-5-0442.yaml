  url: null
  quoted_text: Any person aggrieved has the right of appeal from any adverse ruling, order, or
    decision of the department of business regulation to a court of competent jurisdiction in the
    county where the hearing was held within thirty (30) days from the service of notice of the
    action of the department upon the parties to the hearing.
