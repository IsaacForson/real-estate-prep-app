stem: A broker who is also a builder receives an earnest money deposit from a buyer for a property
  the broker is constructing. Unless there is a written agreement to the contrary, where must the
  deposit be placed?
options:
  - In the broker’s real estate escrow account
  - In the broker’s personal savings account
  - In the builder’s business operating account
  - In the buyer’s attorney’s trust account
key: A
explanation: Under § 5-20.5-26(b), when a broker holds more than one title (e.g., builder,
  contractor), all deposit monies received must be placed in the broker’s real estate escrow account
  unless the principals agree otherwise in writing. The other options are incorrect because they
  would violate this requirement.
