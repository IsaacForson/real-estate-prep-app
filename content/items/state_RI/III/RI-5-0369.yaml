stem: Under Rhode Island law, how can the 180‑day period for depositing disputed monies with the
  general treasurer be extended?
options:
  - The 180‑day period may be extended by a written agreement between the parties.
  - The 180‑day period may be extended by an oral agreement between the parties.
  - The 180‑day period may be extended by a court order between the parties.
  - The 180‑day period may be extended by a broker’s discretion between the parties.
key: A
explanation: The statute explicitly states that the parties to a real estate transaction may agree
  in writing to extend the time period for depositing disputed monies with the general treasurer.
  This written agreement is the only method provided for extension. Oral agreements, court orders,
  or broker discretion are not mentioned.
