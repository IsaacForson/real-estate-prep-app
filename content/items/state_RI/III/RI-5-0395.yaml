stem: Under R.I. Gen. Laws § 5-20.8-2(e), what must the seller disclose regarding shoreline access?
options:
  - The seller must notify the buyer of any public rights of way on the real estate known to the
    seller and provide the buyer with a copy of any documentation evidencing such rights of way or
    conditions of public access that is in the seller’s possession.
  - The buyer must notify the seller of any public rights of way on the real estate known to the
    buyer and provide the seller with a copy of any documentation evidencing such rights of way or
    conditions of public access that is in the buyer’s possession.
  - The agent must notify the buyer of any public rights of way on the real estate known to the
    agent and provide the buyer with a copy of any documentation evidencing such rights of way or
    conditions of public access that is in the agent’s possession.
  - The seller must notify the buyer of any public rights of way on the real estate known to the
    seller but is not required to provide any documentation to the buyer.
key: A
explanation: The statute obligates the seller to notify the buyer of any known public rights of way
  and to supply the buyer with a copy of any documentation evidencing those rights that the seller
  possesses. The distractor that relieves the seller of providing documentation is incorrect because
  the rule explicitly requires the seller to furnish such copies.
