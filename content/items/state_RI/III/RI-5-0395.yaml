  url: null
  quoted_text: The seller of the real estate is required to notify the buyer of any public rights of
    way on the real estate that are known to the seller. The seller shall provide the buyer with a
    copy of any documentation evidencing such rights of way or conditions of public access that is
    in the seller’s possession.
