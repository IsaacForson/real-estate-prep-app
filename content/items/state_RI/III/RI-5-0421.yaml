stem: An applicant fails the salesperson law portion of the broker examination in January 2024.
  Assuming they do **NOT** retake that section, by what date must they retake the entire examination
  if they wish to become licensed?
options:
  - January 2025
  - July 2024
  - January 2026
  - July 2025
key: A
explanation: The regulation provides a one‑year time limit to retake a failed section; if that limit
  expires without retaking, the applicant must retake the entire examination. A failure in January
  2024 gives until January 2025 to retake that section, after which the full exam must be retaken.
  The distractor "July 2024" mistakenly uses a six‑month deadline.
citation:
  source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons) — Rhode Island Code of Regulations
    230-RICR-30-20-2 — Real Estate Brokers and Salespersons (DBR Commercial Licensing) § 2.6(B)
  url: null
  quoted_text: There shall be a one (1) year time limit for reexamination with regard to failure of
    any section of the Broker or Salesperson examination. If an applicant fails to pass any
    particular section, he or she may retake that section within the one (1) year time limit. If the
    one (1) year time limit for reexamination expires, he or she must retake the entire examination.
