stem: A principal broker keeps a small amount of personal funds in the brokerage escrow account
  solely to cover recurring bank service charges. How does Rhode Island's regulation treat this
  practice?
options:
  - It is a minor violation subject to a warning letter
  - It is not considered commingling of funds
  - It voids the broker's errors and omissions coverage
  - It requires prior written approval from the Department
key: B
explanation: Section 2.18 exempts nominal broker funds kept only to sustain the account or cover
  bank charges from the definition of commingling.
