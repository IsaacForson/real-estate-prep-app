stem: A licensee receives an adverse ruling from the Rhode Island Department of Business Regulation
  and wishes to appeal the decision. What must the licensee do to perfect the appeal under Rhode
  Island law?
options:
  - Submit a written request for rehearing to the director within fifteen (15) days of service
  - File a notice of appeal within ten (10) days and remit a five‑hundred‑dollar filing fee to the
    department
  - Post a bond in the amount of one thousand dollars ($1,000) for the payment of any costs that may
    be assessed
  - Post a bond in the amount of five hundred dollars ($500) with the clerk of the court
key: C
explanation: Under §5-20.5-16(e), any person taking an appeal must post a bond in the amount of one
  thousand dollars ($1,000) for the payment of any costs that may be assessed against them. The
  other options either specify an incorrect bond amount, omit the bond requirement, or refer to a
  filing fee or rehearing request that the statute does not mandate for perfecting an appeal.
