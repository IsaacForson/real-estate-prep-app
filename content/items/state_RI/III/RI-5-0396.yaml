stem: Under Rhode Island law, who must supervise the escrow account maintained by a real estate firm?
options:
  - The Rhode Island Department of Business Regulation overseeing escrow
  - The broker qualified to do business on behalf of the licensee
  - The office supervisor overseeing the firm’s escrow account
  - The salesperson who received the funds from the client
key: B
explanation: The statute requires each real estate firm to keep its escrow account under the
  supervision of the broker qualified to do business on behalf of the licensee. The salesperson who
  received the funds is not tasked with supervising the escrow account, making that option
  incorrect.
citation:
  source: R.I. Gen. Laws § 5-20.5-26(a)(1)(i)
  url: null
  quoted_text: Each real estate firm shall maintain an escrow account under the supervision of the
    broker qualified to do business in the name and on behalf of the corporate, partnership, or
    association licensee.
