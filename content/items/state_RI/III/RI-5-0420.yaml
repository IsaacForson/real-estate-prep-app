stem: An applicant completed 45 classroom hours in May 2021 and submitted a salesperson license
  application in November 2023. Are those classroom hours acceptable to meet the pre‑licensing
  education requirement?
options:
  - No, because the applicant must complete the hours after submitting the application
  - Yes, because any hours completed within the last four years are acceptable
  - No, because the hours were completed more than two years before the application
  - Yes, because the hours were completed within the last two years
key: C
explanation: The rule states that classroom hours completed more than two years from the date of
  application will not be considered. Since May 2021 to November 2023 exceeds two years, the hours
  are invalid. The distractor "Yes, because the hours were completed within the last two years"
  incorrectly claims the hours fall within the allowable window.
