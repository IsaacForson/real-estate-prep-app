stem: A broker receives a written release signed by all parties to a failed real estate transaction
  on June 5. According to Rhode Island law, by what date must the broker disburse the escrow funds
  to the appropriate parties?
options:
  - June 15
  - June 10
  - June 20
  - June 5
key: A
explanation: The rule requires the broker to pay escrow funds within ten (10) days of receiving a
  written release signed by all parties to a failed transaction. Adding ten days to June 5 yields
  June 15 as the correct deadline. The June 10 option would allow only five days, which is
  insufficient, while June 20 would exceed the permitted ten‑day period.
