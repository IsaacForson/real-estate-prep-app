stem: A licensee’s real estate license has been revoked due to disciplinary action. The Director is
  considering conditions for future license restoration. Which of the following is a permissible
  condition the Director may impose under Rhode Island regulation?
options:
  - Complete a broker pre‑licensing course
  - Pass a written exam for initial applicants
  - Pay a fine double the administrative penalty
  - Submit a recommendation letter from a client
key: B
explanation: The regulation allows the Director to require successful completion of a written
  examination of the same type normally given to applicants for initial licenses as a condition for
  license restoration. The other options are not listed as permissible conditions in the rule.
  Therefore, passing the initial‑applicant exam is the correct condition.
