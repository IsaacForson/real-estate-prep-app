stem: A team leader wants to collect money from team members to pay shared office expenses. Under
  Rhode Island regulation, what may the team leader do to comply with the rule?
options:
  - The team leader may request the principal broker to reimburse the expenses from the brokerage
    account
  - The team leader may form a single member/manager LLC to collect funds for joint expenses
  - The team leader may pay the expenses directly from personal accounts without requiring broker
    approval
  - The team leader may deposit the funds into a separate escrow account held under the team’s name
key: B
explanation: The regulation permits a team leader to form a single member/manager LLC specifically
  for collecting funds from team members to pay common joint expenses. Depositing funds into a
  separate escrow account for the team is prohibited because teams may not maintain a separate
  escrow account from the principal broker.
