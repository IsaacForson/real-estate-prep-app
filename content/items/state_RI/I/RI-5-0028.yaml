stem: Commissioner James Lee resigns after serving one year of a five-year term on the Rhode Island
  real estate commission. The governor appoints a replacement to fill the vacancy. How long will the
  replacement serve?
options:
  - The replacement will serve for one (1) year.
  - The replacement will serve for two (2) years.
  - The replacement will serve for three (3) years.
  - The replacement will serve for four (4) years.
key: D
explanation: The statute provides that members appointed to fill vacancies shall serve for the
  unexpired term of the departing member. Since Commissioner Lee had completed one year of a
  five‑year term, four years remain, so the replacement serves four years. The one‑, two‑, and
  three‑year options incorrectly assume a different remaining term.
