stem: What is the stated purpose of the Rhode Island Real Estate Brokers and Salespersons regulation?
options:
  - To promote the general welfare of Rhode Island citizens by implementing state real estate laws.
  - To authorize the Department to set maximum commission rates for residential sales.
  - To require all real estate advertisements to include the license number of the broker.
  - To establish a minimum continuing education requirement of twelve hours annually for licensees.
key: A
explanation: The Rhode Island Real Estate Brokers and Salespersons regulation states that its
  purpose is to promote the general welfare of Rhode Island citizens by implementing state real
  estate laws, as provided in 230-RICR-30-20-2 § 2.1 Authority and Purpose. The regulation does not
  authorize the Department to set maximum commission rates, does not require advertisements to
  include a broker’s license number, and does not establish a twelve‑hour annual continuing
  education requirement.
