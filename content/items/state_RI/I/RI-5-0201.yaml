stem: "Under Rhode Island law, a real estate licensee violates § 5-20.5-14(a)(5) by:"
options:
  - Failing to deposit customers’ funds into an escrow account
  - Failing to preserve transaction records for three years
  - Failing to disclose a personal interest in a listed property
  - Failing to obtain written consent before placing a for‑sale sign
key: A
explanation: Under R.I. Gen. Laws § 5-20.5-14(a)(5), a licensee violates the law by failing to
  deposit customers’ funds into an escrow account after a purchase and sales agreement. The option
  about failing to preserve transaction records for three years corresponds to subsection (6), not
  subsection (5). The option about failing to disclose a personal interest in a listed property
  corresponds to subsection (13). The option about failing to obtain written consent before placing
  a for‑sale sign corresponds to subsection (8). Therefore only the option describing the failure to
  deposit customers’ funds into an escrow account matches the cited violation.
