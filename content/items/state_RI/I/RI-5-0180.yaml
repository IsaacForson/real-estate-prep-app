stem: Which party is responsible for maintaining an escrow account for the funds of others under
  Rhode Island real estate regulation?
options:
  - The state Department
  - The prospective buyer
  - The licensed salesperson
  - The principal broker
key: D
explanation: The regulation states that the principal broker shall maintain an escrow account for
  the funds of others and ensure no disbursement occurs without authorization. Therefore, the
  principal bearer of this duty is the principal broker. The licensed salesperson cannot maintain
  escrow accounts; only principal brokers have this responsibility.
citation:
