  url: null
  quoted_text: Any rules or regulations promulgated with regard to the requirement of continuing
    education for the renewal of any real estate broker’s or salesperson’s license whose application
    for an initial broker’s or salesperson’s license is approved within one hundred eighty (180)
    days of the expiration date of his or her initial license is not subject to the continuing
    education requirement at the time of his or her first renewal.
