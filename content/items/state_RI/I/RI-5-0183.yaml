stem: A real estate salesperson receives an initial license with a six‑month term on January 10,
  2024. The license expires on July 10, 2024. She applies for renewal on June 30, 2024. What
  continuing education requirement applies at this first renewal?
options:
  - She must complete 24 classroom hours including three hours of fair‑housing instruction.
  - She must complete 24 classroom hours but may substitute experience for classroom hours.
  - She is exempt from the continuing education requirement for this renewal.
  - She must complete 12 classroom hours of any real‑estate‑oriented education.
key: C
explanation: Because the initial license term is six months—within 180 days of its expiration—the
  statute exempts the first renewal from continuing education. The other options impose CE
  requirements that do not apply under this exemption.
