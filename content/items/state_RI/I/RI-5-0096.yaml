stem: A salesperson accepts a commission directly from a buyer, not from her affiliated broker.
  Which provision of § 5-20.5-14 has been violated?
options:
  - Accepting a commission from a person other than the affiliated broker
  - Failing to deposit escrow funds as required
  - Making a substantial misrepresentation to a client
  - Failing to preserve transaction records for three years
key: C
explanation: Subsection (a)(12) prohibits a salesperson from accepting a commission or valuable
  consideration from any person except the licensed broker with whom they are affiliated. Accepting
  a commission directly from the buyer violates this rule. The distractor about failing to deposit
  escrow funds refers to subsection (a)(5), which is unrelated to commission receipt.
