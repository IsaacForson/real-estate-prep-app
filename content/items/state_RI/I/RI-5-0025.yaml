stem: After closing a residential sale, a broker destroys the transaction file 18 months later.
  Which provision of § 5-20.5-14 has been violated?
options:
  - Failing to preserve records for three years
  - Failing to obtain written consent for dual agency
  - Failing to deposit funds into escrow account
  - Failing to disclose a material fact to the client
key: A
explanation: Section 5-20.5-14(a)(6) requires brokers to preserve transaction records for three
  years after consummation; destroying the file after 18 months breaches this duty. The distractor
  concerning escrow deposits is inapplicable as no funds were mishandled.
