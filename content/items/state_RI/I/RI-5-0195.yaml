stem: A consumer files a written complaint against an unlicensed individual who is acting as a real
  estate broker. The Department determines that the complaint is outside its jurisdiction. What
  action must the Department take next according to regulation?
options:
  - Impose an administrative penalty on the individual
  - Notify the complainant in writing of the lack of jurisdiction
  - Take no action and advise the parties in writing
  - Conduct an investigation and forward the complaint
key: B
explanation: When the Department finds no jurisdiction over a complaint, it must notify the
  complainant in writing of that determination. The rule does not require an investigation or
  advising the respondent when jurisdiction is lacking. Imposing a penalty is not authorized absent
  jurisdiction.
