stem: Under Rhode Island law, what is the minimum number of classroom hours of continuing education
  that a real estate broker must complete during the preceding two-year period for license renewal?
options:
  - The licensee must complete 12 classroom hours of continuing education.
  - The licensee must complete 24 classroom hours of continuing education.
  - The licensee must complete 36 classroom hours of continuing education.
  - The licensee must complete 48 classroom hours of continuing education.
key: B
explanation: The statute requires applicants for renewal to submit proof of completing a minimum of
  twenty-four (24) classroom hours of approved real estate‑oriented education during the preceding
  two‑year period. The 12‑hour option understates this minimum, while the 36‑ and 48‑hour options
  exceed the required minimum.
