  url: null
  quoted_text: Except as provided in subsection (d) of this section, all applicants for a renewal
    license for real estate brokers or real estate salespersons shall submit proof to the director
    that they have completed during the preceding two-year (2) period, a minimum of twenty-four (24)
    classroom hours of real estate oriented educational sessions or courses of instruction that have
    been previously approved by the director.
