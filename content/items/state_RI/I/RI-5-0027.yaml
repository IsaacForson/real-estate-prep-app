stem: Attorney Maria Lopez, who is licensed to practice law by the Rhode Island Supreme Court,
  obtains a real estate salesperson license under §5-20.5-4(d). Two years later, she applies for
  renewal of her salesperson license. What is her continuing education obligation?
options:
  - She is exempt from the continuing education requirement.
  - She must submit proof of completing 24 classroom hours of continuing education.
  - She must submit proof of completing 12 classroom hours of continuing education.
  - She must submit proof of completing 3 classroom hours of fair housing education.
key: A
explanation: The statute expressly exempts an attorney at law licensed by the supreme court and
  granted a license pursuant to §5-20.5-4(d) from the continuing education requirements for renewal.
  The option requiring 24 hours applies the standard renewal rule, which does not override the
  attorney exemption.
