stem: Under Rhode Island law, what is the maximum administrative penalty the director may impose for
  a violation of § 5-20.5-14?
options:
  - $500
  - $5,000
  - $1,000
  - $2,000
key: D
explanation: The statute authorizes the director to levy an administrative penalty not exceeding two
  thousand dollars for any violation under this section. Therefore the maximum allowable fine is
  $2,000. The $1,000 distractor reflects a common misperception of the limit but exceeds the
  statutory ceiling.
