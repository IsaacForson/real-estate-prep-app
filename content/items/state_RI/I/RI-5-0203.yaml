stem: A licensee lists a property for sale and then secretly submits an offer to purchase the same
  property without informing the owner. Which provision of § 5-20.5-14 has been violated?
options:
  - Failing to deposit escrow funds received from a buyer
  - Failing to disclose a personal interest in a listed property
  - Failing to obtain written consent before placing a for‑sale sign
  - Failing to preserve transaction records for three years
key: B
explanation: "Subsection (13) of R.I. Gen. Laws § 5-20.5-14 requires a licensee to disclose any
  personal interest in acquiring property they have listed for sale. Secretly submitting an offer to
  purchase the listed property without informing the owner violates this duty. The other options
  describe unrelated violations: failing to deposit escrow funds received from a buyer, failing to
  obtain written consent before placing a for‑sale sign, and failing to preserve transaction records
  for three years. Those do not pertain to the nondisclosure of a personal interest, so they are
  incorrect."
