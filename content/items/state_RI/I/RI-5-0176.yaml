stem: What is the maximum length of time a real estate license may remain in force in Rhode Island
  before it must be renewed?
options:
  - One (1) year
  - Two (2) years
  - Three (3) years
  - Four (4) years
key: C
explanation: R.I. Gen. Laws § 5‑20.5‑6 provides that a license may not remain in force for more than
  three years, establishing three years as the maximum term. The other choices propose one year, two
  years, and four years, which do not match the statutory limit and are therefore incorrect.
