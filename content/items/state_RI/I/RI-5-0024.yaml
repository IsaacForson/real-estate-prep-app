stem: A salesperson receives an earnest money deposit from a buyer and deposits the funds into her
  personal checking account instead of the broker’s escrow account. Which provision of § 5-20.5-14
  has been violated?
options:
  - Failing to deposit funds into escrow account
  - Failing to preserve records for three years
  - Failing to disclose a material fact to the client
  - Failing to obtain written consent for dual agency
key: A
explanation: Under §5-20.5-14, a licensee who receives customers’ funds must deposit them into a
  broker’s compliant escrow account upon execution of a purchase‑and‑sale agreement; depositing the
  earnest money into a personal account violates this requirement. The distractor about preserving
  records is unrelated because the scenario does not involve record retention.
