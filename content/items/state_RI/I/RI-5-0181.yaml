stem: An applicant for a salesperson’s license completed the required 45 classroom hours 28 months
  before submitting the application. Are those hours valid to meet the pre‑licensing education
  requirement?
options:
  - The hours are valid because they were completed within the last two years.
  - The hours are invalid because they were completed more than two years before the application.
  - The hours are valid because the applicant may supplement them with continuing education.
  - The hours are invalid because the applicant must complete a new forty‑five‑hour course.
key: B
explanation: According to 2.7(A), classroom hours completed more than two years from the date of the
  application will not be considered toward the forty‑five‑hour requirement. Since the hours were
  finished 28 months prior, they exceed the allowable limit and are invalid. The option suggesting
  validity within two years misapplies the time limit.
