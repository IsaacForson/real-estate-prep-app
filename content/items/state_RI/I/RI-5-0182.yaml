stem: A salesperson disaffiliates from her brokerage to join another firm. What must the principal
  broker of the original brokerage do under Rhode Island regulation?
options:
  - Send a disciplinary complaint to the Real Estate Commission regarding the disaffiliation
  - Send updated escrow account records to the Department after the disaffiliation
  - Send written notice to the Real Estate Section of the Department of the disaffiliation
  - Send the salesperson’s license to the Department for cancellation within ten days
key: C
explanation: Under 2.10(A), when a licensee disaffiliates from a brokerage, the principal broker
  must send written notice to the Real Estate Section of the Department of the disaffiliation of the
  licensee. Returning the license is only required upon revocation or surrender, and no disciplinary
  complaint or escrow record submission is mandated by this rule.
