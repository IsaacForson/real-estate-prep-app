stem: Under Del. Code Ann. tit. 24, ch. 29, what is the minimum active licensure required for a
  salesperson member of the Delaware Real Estate Commission?
options:
  - At least 2 years of active licensure prior to appointment.
  - At least 4 years of active licensure prior to appointment.
  - At least 5 years of active licensure prior to appointment.
  - At least 3 years of active licensure prior to appointment.
key: B
explanation: The statute specifies that a salesperson member of the Commission must have been an
  active licensee for at least four years immediately prior to appointment. Therefore, the minimum
  required active licensure is four years. Options listing two, three, or five years do not match
  this requirement.
