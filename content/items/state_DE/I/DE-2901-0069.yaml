stem: Under Del. Code Ann. tit. 24, ch. 29, how is a "ministerial task" defined?
options:
  - A task that includes drafting a purchase agreement for a client
  - A task that requires the licensee to exercise personal judgment in negotiations
  - A task that does not involve discretion or the exercise of the licensee’s own judgment
  - A task that involves setting the listing price for a property
key: C
explanation: Under Del. Code Ann. tit. 24, ch. 29, § 2901(16), a ministerial task is defined as a
  task that does not involve discretion or the exercise of the licensee’s own judgment. The answer
  choice that describes a task that does not involve discretion or the licensee’s own judgment
  therefore matches the statutory definition. The other choices describe activities that require
  judgment—drafting a purchase agreement, exercising personal judgment in negotiations, or setting a
  listing price—so they are not ministerial.
