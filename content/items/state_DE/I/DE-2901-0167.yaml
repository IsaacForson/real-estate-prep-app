stem: In a calendar year with four regularly scheduled Commission meetings, a member misses two
  meetings without adequate reason. Under Del. Code Ann. tit. 24, ch. 29, how is this member's
  conduct classified?
options:
  - Considered compliant with attendance requirements.
  - Considered guilty of neglect of duty.
  - Considered eligible for immediate reappointment.
  - Considered exempt from Commission duties per statute.
key: B
explanation: Missing two out of four meetings equals failing to attend at least half of the regular
  business meetings, which the statute defines as neglect of duty. Therefore, the member’s conduct
  is classified as neglect of duty. The other options do not reflect this rule.
