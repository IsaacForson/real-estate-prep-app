stem: Under Del. Code Ann. tit. 24, § 2906(a)(9), what must the Commission do with complaints it
  receives about licensed real estate practitioners?
options:
  - Refer the complaints to local law enforcement for criminal review
  - Resolve the complaints internally without any outside investigation
  - Refer the complaints to the Division and assign a Commission member to assist
  - Dismiss the complaints automatically unless a signed affidavit is filed with the Commission
key: C
explanation: Section 2906(a)(9) requires the Commission to refer complaints about licensees or the
  profession to the Division for investigation under § 8735 of Title 29, with a Commission member
  assisting on technical aspects.
citation:
  source: Del. Code Ann. tit. 24, § 2906
  url: null
  quoted_text: Refer all complaints from licensees and the general public concerning individuals
    licensed in this chapter or concerning practices of the Commission or of the profession, to the
    Division for investigation pursuant to § 8735 of Title 29 and assign a member of the Commission
    to assist the Division in an advisory capacity with the investigation of the technical aspects
    of the complaint.
