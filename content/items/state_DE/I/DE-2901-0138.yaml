stem: An applicant received a formal reprimand from another state’s real estate commission for
  misleading advertising. Under Del. Code Ann. tit. 24, § 2907(a)(2), what action may the Delaware
  Real Estate Commission take regarding this applicant’s administrative penalty?
options:
  - Approve licensure without review since the penalty is unrelated to Delaware.
  - Automatically deny licensure because any administrative penalty disqualifies the applicant.
  - Refer the matter to the Attorney General for criminal prosecution.
  - After a hearing, determine whether the penalty is grounds to deny licensure.
key: D
explanation: The statute says the Commission, after a hearing, may determine whether such
  administrative penalty is grounds to deny licensure; it does not automatically deny or approve.
  Referral to the Attorney General applies only to intentional fraud findings.
