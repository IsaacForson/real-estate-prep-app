stem: Under Del. Code Ann. tit. 24, § 2900, what are the secondary objectives of the Delaware Real
  Estate Commission?
options:
  - To protect the general public from unsafe practices and anticompetitive pricing
  - To maintain minimum standards of licensee competency and to maintain certain standards in the
    delivery of services to the public
  - To develop standards assuring professional competence and monitor complaints against licensees
  - To promulgate rules and regulations and impose sanctions where necessary to ensure compliance
    with the law
key: B
explanation: The secondary objectives are maintaining minimum standards of licensee competency and
  certain standards in service delivery, as stated in § 2900(b). The option about promulgating rules
  and imposing sanctions describes the primary objective under § 2900(a).
