stem: A licensee is accused of fraud that poses a clear and immediate danger to public safety.
  Before the Commission can issue a temporary suspension of the license pending a hearing, what must
  occur under Del. Code Ann. tit. 24, ch. 29, § 2915(a)?
options:
  - The Commission must obtain a court order from the Secretary of State before issuing the
    temporary suspension.
  - The Commission must issue the temporary suspension immediately if the licensee admits guilt.
  - The Commission must wait for the hearing to conclude before issuing the temporary suspension.
  - The Commission must give the licensee or attorney at least 24 hours’ notice before the temporary
    suspension.
key: D
explanation: Section 2915(a) states that an order of temporary suspension may not be issued unless
  the licensee or attorney receives at least 24 hours’ written or oral notice before the suspension,
  allowing a written response. Thus, providing this notice is required prior to issuance. The
  distractor about obtaining a court order is incorrect because the statute does not mandate
  judicial involvement for a temporary suspension.
citation:
  source: Del. Code Ann. tit. 24, ch. 29, § 2915(a)
  url: null
  quoted_text: An order temporarily suspending a license may not be issued unless the licensee or the
    licensee’s attorney received at least 24 hours’ written or oral notice before the temporary
    suspension so that the licensee or the licensee’s attorney can file a written response to the
    proposed suspension.
