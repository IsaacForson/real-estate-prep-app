stem: A broker fails to maintain copies of continuing education certificates for two years after a
  renewal period. Under 24 Del. Admin. Code § 2900, what is the most likely consequence?
options:
  - The broker faces no action.
  - The broker must pay a fine of $500.
  - The broker's license is automatically suspended.
  - The broker may face disciplinary action.
key: D
explanation: The rule provides that a broker's failure to satisfy the requirements in subsection
  1.3.1 may result in disciplinary action and possible sanctions. Thus, disciplinary action is the
  appropriate consequence. Automatic suspension, a specific fine, or no action are not stated in the
  rule.
