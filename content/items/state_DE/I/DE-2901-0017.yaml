stem: The Delaware Real Estate Commission wants to discipline a licensee at a meeting where only 4
  of the 9 members are present. Under Del. Code Ann. tit. 24, § 2904(c), may the Commission proceed
  to discipline the licensee at that meeting?
options:
  - No, because disciplining a licensee needs at least 5 affirmative votes
  - Yes, because 4 present members already satisfy the quorum requirement
  - Yes, because a simple majority of members present can approve discipline
  - No, because disciplining a licensee needs at least 7 affirmative votes, per Commission policy
key: A
explanation: Section 2904(c) requires the affirmative vote of at least 5 members before any licensee
  may be disciplined, regardless of how many members are needed merely to establish a quorum.
