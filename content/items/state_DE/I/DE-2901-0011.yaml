stem: Under Del. Code Ann. tit. 24, § 2900, what is the primary objective of the Delaware Real
  Estate Commission?
options:
  - Guaranteeing fixed commission rates for every licensed brokerage
  - Promoting membership growth in real estate trade associations
  - Protecting the public from unsafe practices and anticompetitive pricing
  - Maximizing the total number of annual real estate transactions closed statewide
