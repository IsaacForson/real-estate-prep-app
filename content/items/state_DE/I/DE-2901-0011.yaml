  source: Del. Code Ann. tit. 24, § 2900
  url: null
  quoted_text: The primary objective of the Delaware Real Estate Commission, to which all other
    objectives and purposes are secondary, is to protect the general public, specifically those
    persons who are the direct recipients of services regulated by this chapter, from unsafe
    practices and from occupational practices which tend to reduce competition or fix the price of
    services rendered.
