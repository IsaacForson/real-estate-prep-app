stem: A Delaware-licensed salesperson currently employed by Broker XYZ wishes to affiliate with
  Broker ABC. According to 24 Del. Admin. Code § 2900 7.1, what must the salesperson do before the
  license can be transferred to Broker ABC?
options:
  - Submit a completed Change Form signed by Broker XYZ to the Commission.
  - Notify the Commission in writing at least 30 days prior to the affiliation.
  - Submit a new office application to the Commission for approval.
  - Obtain a waiver from the Commission for good cause shown in writing.
key: A
explanation: Under 24 Del. Admin. Code § 2900 7.1, a licensee transferring to another office must
  submit a completed Change Form signed by the former broker before the license will be transferred.
  The distractor about 30‑day notice applies to office relocation under subsection 7.3, not to
  license transfers.
citation:
  source: 24 Del. Admin. Code § 2900 7.1
  url: null
  quoted_text: All Licensees who transfer to another office, or Brokers who open their own offices,
    but who were associated previously with another Broker, shall submit a completed Change Form to
    the Commission signed by the individual Broker with whom they were formerly associated, before
    the license will be transferred.
