stem: An applicant has a pending criminal charge for theft, which is substantially related to real
  estate services. After submitting the required records, the Commission finds that granting a
  waiver would not create an unreasonable risk to public safety. Under Del. Code Ann. tit. 24, §
  2907(a)(4), what must the Commission do to waive the criminal conviction prohibition?
options:
  - Issue a written waiver without a vote, based solely on the applicant's request.
  - Deny the application regardless of the risk assessment.
  - Grant the waiver by an affirmative vote of a majority of the quorum.
  - Automatically waive the prohibition because the charge is pending.
key: C
explanation: The statute states that if the Commission determines a waiver would not create an
  unreasonable risk, it shall waive the prohibition by an affirmative vote of a majority of the
  quorum. The other options misstate the voting requirement or automaticness.
