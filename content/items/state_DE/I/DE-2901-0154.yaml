stem: Under Del. Code Ann. tit. 24, § 2900(b), what are the secondary objectives of the Delaware
  Real Estate Commission?
options:
  - To monitor complaints brought against licensees and to adjudicate at formal hearings.
  - To protect the general public from unsafe practices and from occupational practices which tend
    to reduce competition or fix the price of services rendered.
  - To maintain minimum standards of licensee competency and to maintain certain standards in the
    delivery of services to the public.
  - To develop standards assuring professional competence and to impose sanctions where necessary
    against licensees.
key: C
explanation: The secondary objectives are explicitly stated in § 2900(b) as maintaining minimum
  standards of licensee competency and maintaining certain standards in the delivery of services to
  the public. The statement about protecting the general public from unsafe practices and from
  occupational practices that tend to reduce competition or fix the price of services rendered
  describes the primary objective from § 2900(a), not the secondary objectives.
