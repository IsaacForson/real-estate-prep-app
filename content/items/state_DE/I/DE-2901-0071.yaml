  source: Del. Code Ann. tit. 24, ch. 29, § 2912(d)
  url: null
  quoted_text: Subject to the provisions of this chapter and subchapter IV of Chapter 101 of Title 29,
    no license shall be restricted, suspended or revoked by the Commission, and no licensee’s right
    to practice real estate services shall be limited by the Commission until such licensee has been
    given notice, and an opportunity to be heard, in accordance with the Administrative Procedures
    Act, Chapter 101 of Title 29.
