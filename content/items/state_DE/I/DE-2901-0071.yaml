stem: A licensee has been convicted of embezzlement, a crime listed in § 2912(c). The Delaware Real
  Estate Commission attempts to suspend the license immediately without providing notice or a
  hearing. Under Del. Code Ann. tit. 24, ch. 29, § 2912(d), may the Commission proceed with the
  suspension?
options:
  - The Commission may suspend the license right after a criminal conviction.
  - The Commission may not suspend the license until notice and a hearing are provided.
  - The Commission may suspend the license if the licensee agrees to the action in writing.
  - The Commission may suspend the license only for crimes involving moral turpitude.
key: B
explanation: Section 2912(d) requires that no license be restricted, suspended, or revoked until the
  licensee has been given notice and an opportunity to be heard. Therefore, the Commission cannot
  suspend the license without first providing notice and a hearing. The distractor claiming
  immediate suspension upon conviction ignores this mandatory procedural prerequisite.
