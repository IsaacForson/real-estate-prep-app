stem: Under Del. Code Ann. tit. 24, ch. 29 § 2908, what is true about the application fee for a real
  estate license in Delaware?
options:
  - The application fee may be combined with the Guaranty Fund fee.
  - The application fee shall not be combined with any other fee or charge.
  - The application fee is refundable if the applicant fails the examination.
  - The application fee is waived for applicants over 65 years of age.
key: B
explanation: The statute states that the application fee shall not be combined with any other fee or
  charge, making the statement that the application fee shall not be combined with any other fee or
  charge correct. The option stating that the application fee may be combined with the Guaranty Fund
  fee incorrectly suggests the fee may be combined with another charge, which contradicts the
  prohibition against combining the application fee with any other charge.
