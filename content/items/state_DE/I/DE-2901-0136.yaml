stem: A Delaware salesperson has formed a limited liability company (LLC) that does not engage in
  any real estate brokerage activity and exists solely to receive the salesperson’s commission.
  Under Del. Code Ann. tit. 24, ch. 29, § 2930(d), may the salesperson receive their commission
  through this LLC?
options:
  - The salesperson may receive compensation through the LLC only if the LLC employs at least one
    licensed real estate agent and the LLC must file an annual report with the Division of
    Professional Regulation.
  - The salesperson may receive compensation through the LLC because the entity does not need
    Commission approval as it does not engage in brokerage business and is solely for receiving
    compensation.
  - The salesperson may receive compensation through the LLC only if the LLC is first approved by
    the Commission as a brokerage organization and the LLC must maintain a separate bank account for
    commission funds.
  - The salesperson may receive compensation through the LLC only if the LLC is registered as a real
    estate brokerage and the LLC must obtain a tax identification number from the IRS.
key: B
explanation: Under § 2930(d), a broker may pay a licensee’s compensation to an entity created by the
  licensee if the entity does not need Commission approval because it does not engage in brokerage
  business and is established solely to receive compensation. Since the LLC in the scenario does not
  engage in brokerage business and exists only to receive the salesperson’s commission, the
  salesperson may receive compensation through it. The distractor claiming Commission approval is
  required is incorrect because the statute explicitly exempts such entities from approval when they
  do not engage in brokerage business. The other distractors impose additional conditions (employing
  a licensee or being registered as a brokerage) that the statute does not mention.
