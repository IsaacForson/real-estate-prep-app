stem: A licensee’s activity presents a clear and immediate danger to public health, prompting the
  Commission to temporarily suspend the license under § 2915(a). The licensee does not request a
  continuance of the hearing date. How long may the temporary suspension remain in effect from the
  date of issuance of the order?
options:
  - 15 days
  - 30 days
  - 45 days
  - 60 days
key: D
explanation: The law provides that an order of temporary suspension may remain in effect for no
  longer than 60 days from the date of issuance unless a continuance is requested. Since no
  continuance was sought, the maximum period is 60 days. The 30‑day option mistakenly applies the
  expedited‑hearing timeline instead of the suspension limit.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2915(a)
  url: null
  quoted_text: An order of temporary suspension pending a hearing may remain in effect for no longer
    than 60 days from the date of the issuance of the order unless the temporarily suspended
    licensee requests a continuance of the hearing date.
