stem: A licensee submits continuing education credits for license renewal. Under Del. Code Ann. tit.
  24, ch. 29, what action may the Commission take regarding these submitted credits?
options:
  - Approving the forms used for continuing education renewal
  - Performing a random audit of submitted continuing education credits
  - Establishing qualifications for instructors and course providers
  - Ordering compensation from the Real Estate Guaranty Fund for consumers
key: B
explanation: The correct answer is 'Performing a random audit of submitted continuing education
  credits' because §2906(a)(7) authorizes the Commission to perform random audits of continuing
  education credits submitted by licensees for license renewal. The distractor 'Approving the forms
  used for continuing education renewal' describes a duty under subsection (2), which is unrelated
  to auditing credits.
