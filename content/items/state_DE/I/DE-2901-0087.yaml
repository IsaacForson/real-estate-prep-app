stem: Under Del. Code Ann. tit. 24, ch. 29, which individual is exempt from licensing requirements
  when performing real estate services?
options:
  - The wholesaler who markets equitable interests in purchase agreements for profit
  - The property manager who leases properties owned by others for a fee
  - The tenant who sublets their apartment without the landlord's permission
  - The attorney-in-fact acting under a duly executed power of attorney to complete a sale
key: D
explanation: Section 2901(e)(2) exempts persons acting as attorney-in-fact under a duly executed
  power of attorney to perform an agreement of sale, leasing, or exchange of real estate. Managing
  others' property for a fee, subletting without permission, and wholesaling equitable interests are
  not covered by this exemption.
