stem: Under Del. Code Ann. tit. 24, § 2933(a), a licensee functioning as a broker, associate broker,
  or salesperson is considered what type of agent?
options:
  - A statutory agent
  - A common law agent
  - A dual agent
  - A transaction broker
key: A
explanation: The statute expressly abrogates common law agency for licensees acting as brokers,
  associate brokers, or salespeople and defines them as statutory agents. Therefore, the correct
  classification is a statutory agent. The distractor 'A common law agent' is incorrect because the
  common law of agency is expressly abrogated for these licensees under the same provision.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2933(a)
  url: null
  quoted_text: The common law of agency relative to brokerage relationships in real estate services
    transactions established pursuant to this chapter is expressly abrogated for any licensee
    functioning as a broker, associate broker, or salesperson, licensee owner, or brokerage
    organization as defined in this chapter as a statutory agent.
