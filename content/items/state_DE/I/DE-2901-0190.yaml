stem: A licensee receives a referral fee from a title company for directing a client to that company
  but fails to provide written disclosure to the client and the title company before receiving the
  fee. Under Del. Code Ann. tit. 24, ch. 29, what action may the Delaware Real Estate Commission
  take?
options:
  - The Commission may order the licensee to refund the referral fee.
  - The Commission may impose disciplinary sanctions set forth in §2914.
  - The Commission may automatically revoke the licensee's license.
  - The Commission may issue a warning but take no further action.
key: B
explanation: Failing to disclose valuable consideration violates §2912(a)(10), which makes the
  licensee subject to disciplinary sanctions under §2912(a) and §2914. The Commission does not have
  authority to order a refund or automatically revoke a license without a hearing.
