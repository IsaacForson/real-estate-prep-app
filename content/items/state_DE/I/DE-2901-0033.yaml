stem: The Delaware Real Estate Commission has adopted a rule prescribing the exact format for common
  law agency disclosure forms. A licensee uses a different format that still includes all required
  information. Under Del. Code Ann. tit. 24, ch. 29, § 2932(c)(3), is the licensee’s disclosure
  compliant?
options:
  - Yes, as long as the disclosure contains all required information
  - No, the licensee must use the Commission-prescribed form
  - Yes, because the Commission only sets minimum criteria, not exact format
  - No, unless the licensee obtains written consent from the client
key: B
explanation: Delaware Code, Title 24, Chapter 29, Section 2932(c)(3) allows the Commission to adopt
  rules that prescribe the form of disclosure to be used by licensees. Because the Commission has
  adopted a rule that specifies an exact format, a licensee is required to use that prescribed form.
  Simply including all required information on a different form does not satisfy the rule. Therefore
  the statement that the licensee must use the Commission‑prescribed form is correct. The view that
  compliance is achieved as long as the required information is present is incorrect, as the rule
  mandates the specific format. The idea that the Commission only sets minimum criteria is wrong
  because the rule expressly prescribes the exact form. The suggestion that a written client consent
  would make a different format acceptable is also incorrect, since the rule provides no such
  waiver.
