stem: Under Del. Code Ann. tit. 24, ch. 29, what is one duty of the Delaware Real Estate Commission
  regarding forms used under this chapter?
options:
  - Conducting hearings and issuing orders after a hearing
  - Approving the forms to be used under this chapter
  - Establishing the qualifications for licensure and renewal
  - Ordering compensation from the Real Estate Guaranty Fund
key: B
explanation: The correct answer is 'Approving the forms to be used under this chapter' because
  §2906(a)(2) explicitly states that the Commission shall approve the forms to be used under this
  chapter or as directed by other statutory provisions. The distractor 'Establishing the
  qualifications for licensure and renewal' describes the duty under subsection (3), not subsection
  (2).
