stem: Under Del. Code Ann. tit. 24, § 2901(13), how is a 'dual agent' defined?
options:
  - A salesperson, associate broker, broker and/or brokerage organization which represents both
    buyer and seller or tenant and landlord as clients in a real estate services transaction
  - A licensee appointed by the broker to work with a customer or client as a statutory agent in a
    real estate services transaction
  - A licensee who has at least five years of continuous real estate services experience and who has
    been appointed as the full-time supervisor of a branch office by the broker
  - A separate account established by the brokerage organization used solely for holding funds
    belonging to the broker’s customers or clients in a transaction
key: A
explanation: The definition of dual agent is explicitly stated in Del. Code Ann. tit. 24, § 2901(13)
  as a licensee representing both buyer and seller or tenant and landlord as clients. The option
  describing a licensee appointed by the broker to work with a customer or client as a statutory
  agent in a real estate services transaction describes a designated agent, not a dual agent.
