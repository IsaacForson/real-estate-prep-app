stem: A licensee representing a buyer learns that the seller’s financial statement, which the seller
  provided to support the purchase price, contains an overstated asset value that the licensee knows
  is false. According to Del. Code Ann. tit. 24, ch. 29, § 2929, what must the licensee do?
options:
  - The broker shall advise the seller to correct the false information and shall not pass on the
    information known to be false.
  - The broker shall terminate the brokerage agreement immediately upon discovering any false
    financial information.
  - The broker shall ignore the false information because there is no duty to verify financial
    statements.
  - The broker shall pass on the false information to the buyer’s lender to facilitate the
    transaction.
key: A
explanation: The statute requires a licensee with actual knowledge of false financial information to
  advise the party to correct it and to refrain from passing on that false information. Ignoring the
  information or passing it on violates this duty, and termination is not mandated by the rule.
