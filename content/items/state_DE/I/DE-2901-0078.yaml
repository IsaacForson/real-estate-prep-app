stem: A person who has been a licensed broker for 4 years and 11 months and resides in Kent County
  applies for a broker seat on the Delaware Real Estate Commission. Under Del. Code Ann. tit. 24,
  ch. 29, § 2903(b)(1), is the applicant eligible for appointment?
options:
  - The applicant is eligible because they meet the residency requirement.
  - The applicant is not eligible due to insufficient broker experience.
  - The applicant is eligible after completing 5 years of experience.
  - The applicant is eligible if they also have an associate broker license.
key: B
explanation: The rule requires broker members of the Commission to have been active licensees for at
  least five years immediately prior to appointment. Because the applicant has only four years and
  eleven months of experience, they do not satisfy the experience requirement. The statement that
  the applicant is eligible because they meet the residency requirement is incorrect, as residency
  alone does not satisfy the statutory experience condition.
