stem: A licensee advertises a property with the phrase 'If we cannot sell your home, we will buy
  your home' and obtains a signed listing agreement. According to 24 Del. Admin. Code § 2900 10.2,
  what must the licensee do regarding the purchase price if no sales agreement is executed during
  the listing term?
options:
  - Disclose the purchase price only after the listing agreement has expired and no sales agreement
    has been executed
  - Wait until a sales agreement is executed before disclosing the purchase price to the seller
  - Disclose the purchase price in any advertisement or marketing material for the property
  - Disclose the purchase price in the original listing agreement at the time the licensee obtains
    the signature
key: D
explanation: The rule requires the licensee to disclose in the original listing agreement, at the
  time the signature is obtained, the price he will pay if no sales agreement is executed during the
  term (24 Del. Admin. Code § 2900 10.2). Disclosing after expiration, in advertisements, or waiting
  for a sales agreement does not satisfy this requirement.
citation:
  source: 24 Del. Admin. Code § 2900 10.2
  url: null
  quoted_text: 10.2 Any Licensee advertising real estate for sale stating in such advertisement, 'If
    we cannot sell your home, we will buy your home', or words to that effect, shall disclose in the
    original listing agreement at the time the Licensee obtains the signature on the listing
    agreement, the price he will pay for the property if no sales agreement is executed during the
    term of the listing.
