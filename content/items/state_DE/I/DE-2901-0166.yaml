stem: A Delaware Real Estate Commission member is appointed to fill a vacancy with 18 months
  remaining in the term. After serving that period, how many additional years may the member serve
  if reappointed for a full term?
options:
  - Up to 2 years.
  - Up to 1 year.
  - Up to 4 years.
  - Up to 3 years.
key: D
explanation: The law states that a member initially appointed to fill a vacancy may succeed himself
  or herself for only one additional full term. A full term is three years, so after completing the
  vacancy period, the member may serve up to three more years if reappointed.
