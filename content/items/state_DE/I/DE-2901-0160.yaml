stem: An individual who was employed by a brokerage organization six years ago applies for a public
  member seat on the Delaware Real Estate Commission. Under Del. Code Ann. tit. 24, § 2903(b)(4), is
  the applicant eligible for appointment?
options:
  - The applicant is ineligible due to employment by a brokerage organization within the last eight
    years prior to appointment
  - The applicant is eligible because the restriction only applies to individuals who are currently
    licensed as brokers or salespersons
  - The applicant is eligible because the employment ended more than five years ago, which the
    Commission considers sufficient
  - The applicant is eligible because they have not held a real estate license in any jurisdiction
key: A
explanation: Section 2903(b)(4) bars public members who have been employed by a broker or brokerage
  organization within the last eight years prior to appointment; six years ago falls within that
  period, making the applicant ineligible. The claim that the restriction applies only to current
  licensees is incorrect.
