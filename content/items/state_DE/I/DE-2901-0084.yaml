stem: A broker decides to move her office to a new location and notifies the Commission only 10 days
  before the move. To comply with 24 Del. Admin. Code § 2900 7.3, what must she do?
options:
  - She must take no further action because the notice was given within the allowed period.
  - She must wait until after the move to submit the new office application.
  - She must notify the Commission in writing at least 30 days prior to the move.
  - She must notify the Commission in writing as soon as practical prior to the move.
key: D
explanation: The rule requires brokers moving their office to notify the Commission in writing at
  least 30 days prior or as soon as practical prior to the move. Since the broker gave only 10 days
  notice, she must notify as soon as practical. The distractor that she must notify at least 30 days
  prior is incorrect because the rule provides an alternative when less than 30 days notice is
  given.
