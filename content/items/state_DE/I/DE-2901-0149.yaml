stem: A licensee advertises a property as having a new roof when the roof is original and leaking.
  This statement is a substantial misrepresentation. Under Del. Code Ann. tit. 24, ch. 29 §
  2912(a)(1), what action may the Commission take regarding this licensee?
options:
  - The Commission may impose disciplinary sanctions set forth in § 2914.
  - The Commission may require the licensee to complete additional continuing education hours.
  - The Commission may issue a warning but cannot impose any penalty.
  - The Commission may transfer the licensee to another broker without consent.
key: A
explanation: The statute defines a substantial misrepresentation as grounds for disciplinary
  sanctions under § 2914, so the Commission may impose those sanctions. The option stating that the
  Commission may require the licensee to complete additional continuing education hours is incorrect
  because the statute does not automatically require additional continuing education for this
  violation.
