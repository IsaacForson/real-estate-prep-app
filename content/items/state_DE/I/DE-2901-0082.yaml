stem: A broker has received continuing education certificates from its salespersons after a renewal
  period. Under 24 Del. Admin. Code § 2900, what action must the broker take regarding these
  certificates?
options:
  - The broker must co-sign logs and retain certificates for at least three years after renewal.
  - The broker must submit certificates to the Commission within 30 days of receipt.
  - The broker must destroy certificates after one year of licensure.
  - The broker must keep certificates only until the next renewal cycle.
key: A
explanation: The rule requires the broker to co-sign continuing education logs and maintain copies
  of certificates for at least three years after each renewal period. Therefore, the broker must
  co-sign logs and retain certificates for at least three years after renewal. Submitting,
  destroying, or keeping only until the next renewal do not satisfy this requirement.
