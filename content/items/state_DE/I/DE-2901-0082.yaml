  source: 24 Del. Admin. Code § 2900 — 24 DE Admin. Code 2900 - Real Estate Commission Rules and
    Regulations (Delaware Registrar of Regulations current text) § 1.3.1
  url: null
  quoted_text: The Broker shall co-sign continuing education logs and shall maintain copies of
    continuing education certificates for the Broker’s Salespersons and Associate Brokers for at
    least three years after the conclusion of each renewal period.
