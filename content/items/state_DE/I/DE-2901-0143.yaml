stem: A consumer obtains a final judgment against a Delaware licensee for fraud and wishes to claim
  from the Real Estate Guaranty Fund. The consumer files the verified claim seventy days after the
  judgment. Under Del. Code Ann. tit. 24, ch. 29, § 2922(b), is the claim timely?
options:
  - Yes, because the Commission may accept late claims with good cause.
  - No, because the claim must be filed within sixty days of the final judgment.
  - Yes, as long as the claim includes a copy of the judgment.
  - No, because the claim must be filed within thirty days of the judgment.
key: B
explanation: The law specifies that a verified claim must be filed within 60 days after the final
  judgment has been obtained. Filing on the seventieth day exceeds this limit, making the claim
  untimely. The option suggesting the Commission may accept late claims is not supported by the
  text, and the 30‑day option misstates the deadline.
