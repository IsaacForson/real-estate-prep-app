stem: Under Del. Code Ann. tit. 24, ch. 29, § 2912(c), which of the following is **NOT** a crime
  that authorizes the Commission to suspend or revoke a license?
options:
  - Embezzlement crime
  - Tax evasion offense
  - Bribery offense
  - Extortion violation
key: B
explanation: The statute lists forgery, embezzlement, obtaining money under false pretenses,
  bribery, larceny, extortion, conspiracy to defraud, or any similar offense as grounds for
  suspension or revocation. Tax evasion is not among those enumerated crimes, so it does not
  authorize action under this subsection. The distractor “Embezzlement crime” is incorrect because
  embezzlement is explicitly listed as a qualifying offense.
