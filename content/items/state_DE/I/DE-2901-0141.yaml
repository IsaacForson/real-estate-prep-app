stem: Under Del. Code Ann. tit. 24, ch. 29, § 2915(a), what is the maximum number of days a
  temporary suspension order may remain in effect if the licensee does **NOT** request a continuance
  of the hearing date?
options:
  - 30 days
  - 45 days
  - 60 days
  - 90 days
key: C
explanation: The rule states that an order of temporary suspension pending a hearing may remain in
  effect for no longer than 60 days from the date of issuance unless the licensee requests a
  continuance. Therefore, without a continuance, the limit is 60 days. The 30‑day option understates
  the statutory period, while the 90‑day option exceeds it.
