  quoted_text: (3) This chapter shall not be construed to include in any way the services rendered by
    an attorney-at-law, nor shall it be held to include, while acting as such, the receiver, trustee
    in bankruptcy, administrator or executor, or any person selling real estate under order of any
    court, or a trustee acting under a trust agreement, deed of trust or will, or the regular
    salaried employee thereof.
