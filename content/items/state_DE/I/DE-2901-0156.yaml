stem: An employee of a Delaware bank, acting as trustee under a trust agreement, sells real estate
  held in the trust to a third party. Under Del. Code Ann. tit. 24, § 2901(e)(3), is the employee
  required to hold a real estate license to perform this sale?
options:
  - The employee is exempt from licensing requirements as a trustee acting under a trust agreement.
  - The employee must hold a real estate license because any sale of real estate requires licensure.
  - The employee must hold a real estate license unless they also hold a broker license.
  - The employee is exempt only if they are also an attorney-at-law.
key: A
explanation: Section 2901(e)(3) exempts trustees acting under a trust agreement from licensing
  requirements. The option claiming that a license is always required is incorrect because it
  overlooks this exemption.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
