stem: The Delaware Real Estate Commission plans to issue a cease and desist order against an
  individual practicing real estate without a license. According to Del. Code Ann. tit. 24, §
  2906(a)(10), what must the Commission do before issuing such an order?
options:
  - Conduct a hearing in accordance with the procedures established pursuant to Chapter 101 of Title
    29
  - Approve the forms to be used under this chapter before taking any enforcement action
  - Refer the complaint to the Division for investigation and assign a Commission member to assist
  - Renew the individual's license after verifying completion of continuing education requirements
key: A
explanation: Section 2906(a)(10) requires the Commission to conduct hearings and issue orders in
  accordance with Chapter 101 procedures, so a hearing must precede any cease and desist order. The
  other options describe actions that are either unrelated to enforcement prerequisites or pertain
  to different Commission duties such as renewing licenses, approving forms, or referring complaints
  for investigation.
