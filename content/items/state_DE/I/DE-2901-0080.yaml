stem: According to 24 Del. Admin. Code § 2900, what is the minimum period a broker must maintain
  copies of continuing education certificates for salespersons and associate brokers after each
  renewal period?
options:
  - Seven years
  - Eleven years
  - Three years
  - Four years
key: C
explanation: The rule states that a broker must maintain copies of continuing education certificates
  for at least three years after the conclusion of each renewal period. Therefore, three years is
  the correct minimum period. One or two years are insufficient, and four years exceeds the
  requirement.
