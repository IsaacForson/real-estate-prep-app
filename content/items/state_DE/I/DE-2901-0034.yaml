stem: A licensee prepares a competitive market analysis for a seller and places the required
  disclosure in 10-point font immediately after the estimated market price. Under Del. Code Ann.
  tit. 24, ch. 29, § 2931(2), is the CMA compliant?
options:
  - Yes, because the disclosure is present and readable
  - No, the disclosure must be at least 12-point bold face type
  - Yes, as long as the disclosure follows the price
  - No, unless the licensee also includes a disclaimer about appraisal
key: B
explanation: The rule requires the disclosure to appear in at least a 12‑point bold face type font
  immediately following the estimated market price. Using a 10‑point font does not meet this size
  requirement, so the CMA is not compliant. Saying that the disclosure is present and readable does
  not satisfy the specific font‑size and bold‑face mandate. Simply noting that the disclosure
  follows the price ignores the font‑size and bold‑face requirement. Adding a disclaimer about
  appraisal is not required by the rule and does not cure the font‑size deficiency.
