stem: Under 24 Del. Admin. Code § 2900 10.3, what must be included in the agreement for a real
  estate transaction regardless of whether the agency relationship is statutory or common law?
options:
  - A written confirmation of the agency relationship
  - A written estimate of the property's market value
  - A written receipt of the earnest money deposit
  - A written disclosure of the licensee's personal interest
key: A
explanation: The rule states that a written confirmation of the agency relationship shall be
  included in the agreement for the real estate transaction regardless of whether the relationship
  is a statutory agency relationship or a common law agency relationship. The written disclosure of
  personal interest is required under § 2900 10.1 but is not the confirmation mandated by 10.3.
