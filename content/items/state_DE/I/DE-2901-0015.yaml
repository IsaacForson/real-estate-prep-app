stem: A Commission member completes a full three-year term after being appointed to a full term, not
  to fill a vacancy. Under Del. Code Ann. tit. 24, § 2903(c), what may that member do next?
options:
  - Step down permanently with no possibility of reappointment
  - Serve two additional three-year terms if reappointed
  - Serve one additional three-year term if reappointed
  - Remain on the Commission indefinitely without reappointment
key: C
explanation: Section 2903(c) allows a member appointed to a full term to succeed himself or herself
  for one additional term, so the member may serve a second three-year term if reappointed.
citation:
  source: Del. Code Ann. tit. 24, § 2903
  url: null
  quoted_text: Each member shall serve for a term of 3 years, unless otherwise specified in this
    chapter; and may succeed himself or herself for 1 additional term; provided, however, that where
    a member was initially appointed to fill a vacancy, such member may succeed himself or herself
    for only 1 additional full term.
