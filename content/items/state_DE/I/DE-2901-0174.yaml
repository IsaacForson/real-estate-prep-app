stem: A licensee is assisting a buyer in purchasing a single-family home. Under Del. Code Ann. tit.
  24, § 2933(c)(1), what is the presumed agency relationship for this licensee?
options:
  - A statutory agent representing the seller
  - A statutory agent representing the buyer
  - A common law agent representing the buyer
  - A dual agent representing both parties
key: B
explanation: The provision creates a presumption that a licensee working for the buyer of a 1-to-4
  family residence is a statutory agent representing the buyer. This presumption applies unless
  rebutted by a consumer information statement. The distractor 'A statutory agent representing the
  seller' is incorrect because the presumption specifically concerns the buyer's side, not the
  seller's.
