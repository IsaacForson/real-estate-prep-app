stem: Under Del. Code Ann. tit. 24, ch. 29, § 2912(a)(10), what must a licensee do prior to
  receiving any valuable consideration for products or services relating to a real estate services
  transaction?
options:
  - The licensee must provide disclosure after the transaction closes.
  - The licensee must provide prior written disclosure to the customer or client and the payor.
  - The licensee must provide oral disclosure to the customer or client.
  - The licensee is not required to disclose if the consideration is less than five hundred dollars.
key: B
explanation: The statute requires prior written disclosure to both the customer or client and the
  payor for any valuable consideration received relating to a real estate transaction. Oral
  disclosure alone does not satisfy this written requirement.
