stem: Under Del. Code Ann. tit. 24, ch. 29, what are the secondary objectives of the Delaware Real
  Estate Commission?
options:
  - To maintain minimum standards of licensee competency and to maintain certain standards in the
    delivery of services to the public
  - To protect the general public from unsafe practices and from occupational practices that reduce
    competition or fix service prices
  - To adjudicate at formal hearings, promulgate rules and regulations, and impose sanctions where
    necessary
  - To develop standards assuring professional competence and to monitor complaints brought against
    licensees
key: A
explanation: The secondary objectives are defined in § 2900(b) as maintaining minimum standards of
  licensee competency and certain standards in service delivery. The option stating 'To maintain
  minimum standards of licensee competency and to maintain certain standards in the delivery of
  services to the public' matches this language. The option stating 'To protect the general public
  from unsafe practices and from occupational practices that reduce competition or fix service
  prices' describes the primary objective from § 2900(a), which is not correct for the question
  about secondary objectives.
