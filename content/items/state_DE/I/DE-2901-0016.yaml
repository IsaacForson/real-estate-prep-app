stem: A Commission member misses three consecutive quarterly meetings without an adequate reason.
  Under Del. Code Ann. tit. 24, § 2903(g), how is that member's conduct classified?
options:
  - Excused from further meeting attendance duties
  - Found guilty of misfeasance in office by the Commission
  - Made subject to immediate criminal prosecution
