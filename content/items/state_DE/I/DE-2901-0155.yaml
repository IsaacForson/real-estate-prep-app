  quoted_text: (c) In meeting its objectives, the Commission shall develop standards assuring
    professional competence; shall monitor complaints brought against licensees regulated by the
    Commission; shall adjudicate at formal hearings; shall promulgate rules and regulations; and
    shall impose sanctions where necessary against licensees and nonlicensees engaged in the
    practice of providing real estate services.
