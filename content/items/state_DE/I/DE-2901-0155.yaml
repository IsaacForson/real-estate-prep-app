stem: A consumer files a complaint alleging that a Delaware licensee failed to disclose a material
  defect. According to Del. Code Ann. tit. 24, § 2900(c), what action must the Commission take
  regarding this complaint?
options:
  - The Commission must dismiss the complaint if it is not sworn under oath.
  - The Commission must monitor the complaint and adjudicate it at a formal hearing.
  - The Commission must refer the complaint to the Division and assign a Commission member to assist.
  - The Commission must impose a monetary penalty without holding a hearing.
key: B
explanation: Section 2900(c) requires the Commission to monitor complaints brought against licensees
  and to adjudicate them at formal hearings. Referring the complaint to the Division and assigning a
  Commission member to assist is a duty found in § 2906(a)(9), not § 2900(c).
