stem: A licensee submits continuing education credits for license renewal. What authority does the
  Delaware Real Estate Commission have regarding these credits under Delaware Code?
options:
  - Must approve all submitted credits without review.
  - May perform random audits of the submitted credits.
  - Must reject credits older than one year.
  - Must forward the credits to the Attorney General for verification.
key: B
explanation: The Commission may perform random audits of continuing education credits submitted by
  licensees for renewal under Del. Code Ann. tit. 24, ch. 29, § 2906(a)(7). It is not required to
  approve all submitted credits without review, so the statement that the Commission must approve
  all credits without review is incorrect.
