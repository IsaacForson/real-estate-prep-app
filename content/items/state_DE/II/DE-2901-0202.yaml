stem: Under Del. Code Ann. tit. 24, § 2902(a)(15), how is a 'licensee' defined?
options:
  - An individual licensed under this chapter as a broker, associate broker, or salesperson without
    implying their legal relationship with a client.
  - A person who performs ministerial tasks for a client according to the brokerage agreement or
    other consent.
  - A member of the public who is the principal in the statutory or common law agency relationship.
  - An individual who holds a broker license from the Commission and who is self-employed or
    employed by a brokerage organization.
key: A
explanation: The definition of licensee in §2902(a)(15) explicitly states it is an individual
  licensed under the chapter as a broker, associate broker, or salesperson without implying any
  legal relationship with a customer or client. The option stating 'An individual licensed under
  this chapter as a broker, associate broker, or salesperson without implying their legal
  relationship with a client.' matches this definition. The other options describe different roles
  or add details not present in the statutory definition.
