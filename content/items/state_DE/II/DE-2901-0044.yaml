stem: A person holds a power of attorney to consummate a real estate sale for a friend who is the
  seller. Does this person need a real estate license to sign the deed under Delaware law?
options:
  - The person is required to notify the Real Estate Commission before acting
  - The person is exempt from licensing under the power‑of‑attorney exemption
  - The person is required to hold a salesperson license to complete the sale
  - The person is required to hold a broker license to complete the sale
key: B
explanation: Section 2901(e)(2) exempts persons acting as an attorney in fact under a duly executed
  power of attorney who are authorized to consummate a real estate transaction. Signing the deed on
  behalf of the seller falls within this exemption, so no license is required. The distractors
  incorrectly assert that a broker or salesperson license is necessary or that notification to the
  Commission is required, which the statute does not mandate for this exemption.
