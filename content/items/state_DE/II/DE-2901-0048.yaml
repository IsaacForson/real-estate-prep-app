stem: A salesperson wishes to transfer to a new brokerage but cannot obtain the signed Change Form
  from their former broker because the broker is unreachable. According to Delaware Real Estate
  Commission rules, what is the appropriate next step?
options:
  - Request permission to open their own office without a broker affiliation
  - Request a waiver of the Change Form requirement from the Commission based on good cause
  - Request an extension of thirty days to obtain the former broker’s signature
  - Request a temporary license while awaiting the former broker’s signature
key: B
explanation: Section 7.2 allows the Commission to waive the Change Form requirement upon a
  determination of good cause. Requesting a waiver based on good cause is therefore the correct
  action. Simply asking for an extension to obtain the signature is not provided for in the rule and
  would not satisfy the transfer requirement.
