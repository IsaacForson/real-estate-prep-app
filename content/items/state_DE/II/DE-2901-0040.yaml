stem: A salesperson who has been licensed for nine months is renewing their license. How many
  continuing education hours must they complete?
options:
  - 6 hours of continuing education
  - 12 hours of continuing education
  - 21 hours of continuing education
  - 18 hours of continuing education
key: A
explanation: According to 24 Del. Admin. Code § 2900 14.2.2, licensees with at least six months but
  less than twelve months of licensure must complete six hours of continuing education, consisting
  of two different modules. The nine‑month licensee falls within this range, so six hours are
  required. The twelve‑hour option applies only after twelve but less than eighteen months of
  licensure per 14.2.3.
