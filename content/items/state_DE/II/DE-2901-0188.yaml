stem: Under Delaware law, what is the minimum number of Commission members whose affirmative vote is
  required to discipline a licensee?
options:
  - Three members
  - Four members
  - Five members
  - Six members
key: C
explanation: The statute provides that a majority of members constitutes a quorum and that no
  licensee shall be disciplined without the affirmative vote of at least 5 members. Thus, five
  affirmative votes are required. The distractor of four members is insufficient because it does not
  meet the statutory threshold of at least five votes.
