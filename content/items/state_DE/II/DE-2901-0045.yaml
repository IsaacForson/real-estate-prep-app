  quoted_text: if after consideration of the factors set forth under § 8735(x)(3) of Title 29 through
    a hearing or review of documentation the Commission determines that granting a waiver would not
    create an unreasonable risk to public safety, the Commission, by an affirmative vote of a
    majority of the quorum, shall waive this paragraph (a)(4).
