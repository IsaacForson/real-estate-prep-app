stem: An applicant for a Delaware salesperson license has a pending criminal charge for fraud, which
  is substantially related to real estate practice. The applicant has requested that the relevant
  authorities send the charge information directly to the Commission. Under Del. Code Ann. tit. 24,
  ch. 29, § 2907(a)(4), when may the Commission waive the disqualification based on this charge?
options:
  - The Commission may waive the disqualification if the applicant has successfully completed a
    state-approved rehabilitative program and has paid all fines and restitution related to the
    charge.
  - The Commission may waive the disqualification if, after considering the factors under §
    8735(x)(3) of Title 29, it finds no unreasonable risk to public safety and a majority of the
    quorum votes yes.
  - The Commission may waive the disqualification if the charge is lowered to a misdemeanor and the
    applicant enters into a consent agreement with the Commission.
  - The Commission may waive the disqualification if the applicant supplies three character
    references from licensed brokers and passes a comprehensive background check.
key: B
explanation: The Commission may waive the disqualification if, after evaluating the factors listed
  in § 8735(x)(3) of Title 29, it finds that granting the waiver would not pose an unreasonable risk
  to public safety and a majority of the quorum votes in favor. The statute does not provide waiver
  based on completion of a rehabilitative program or payment of fines and restitution, nor does it
  allow waiver simply by reducing the charge to a misdemeanor and entering a consent agreement, or
  by supplying three character references from licensed brokers and passing a background check.
