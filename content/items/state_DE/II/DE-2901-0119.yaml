stem: An applicant has satisfied all qualifications for licensure set forth by the Delaware Real
  Estate Commission. According to Delaware Code, what must the Commission do?
options:
  - Refer the application to the Governor for approval.
  - Deny the application pending further review.
  - Require the applicant to complete additional education.
  - Grant the license to the applicant.
key: D
explanation: The Commission must grant licenses to all individuals who meet the qualifications for
  licensure per Del. Code Ann. tit. 24, ch. 29, § 2906(a)(4). Therefore, denying the application
  when qualifications are satisfied is not required, making the option that says 'Deny the
  application pending further review.' incorrect.
