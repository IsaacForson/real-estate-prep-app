stem: According to Delaware law, what is a Competitive Market Analysis (CMA)?
options:
  - A marketing plan developed by a brokerage organization to advertise listings.
  - A legal document required for all real estate transactions over $500,000.
  - A service provided by a licensee to estimate market price by comparing similar properties.
  - A formal appraisal conducted by a licensed appraiser to determine market value.
key: C
explanation: The definition of Competitive Market Analysis in §2902 states it is a service provided
  by a licensee to estimate market price by comparing similar properties. The other options describe
  appraisals, legal documents, or marketing plans, which are not the definition of a CMA.
