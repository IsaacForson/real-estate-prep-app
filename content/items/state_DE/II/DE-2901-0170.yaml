stem: A Delaware salesperson moved to a new residence two months ago but did not notify the Division
  of Professional Regulation of the address change. The Division mails a renewal notice to the
  salesperson's old address. Is the renewal notice considered proper notice under Delaware
  Administrative Code § 2900?
options:
  - Under Delaware Administrative Code § 2900, the renewal notice is not considered proper notice
    because the salesperson failed to report the address change within the required thirty-day
    period.
  - Under Delaware Administrative Code § 2900, the renewal notice is considered proper notice
    because notices are sent only to the most recent address on file with the Division.
  - Under Delaware Administrative Code § 2900, the renewal notice is not considered proper notice
    unless the salesperson provides proof of receipt of the notice.
  - Under Delaware Administrative Code § 2900, the renewal notice is considered proper notice only
    if the salesperson also files a change-of-address form within ten days of mailing.
key: B
explanation: The rule requires that all mailings go to the most recent address on file and deems
  delivery to that address proper notice; failure to update does not invalidate the notice.
citation:
  source: 24 Del. Admin. Code § 2900 — 24 DE Admin. Code 2900 - Real Estate Commission Rules and
    Regulations (Delaware Registrar of Regulations current text) 1.5 Duty to update address
  url: null
  quoted_text: All notifications and correspondence pertaining to a Licensee’s license that are sent
    through the mail will be sent only to the most recent address provided by the Licensee. The
    failure to provide the Division with a current address will not operate to excuse any duty or
    responsibility of the Licensee and confirmed delivery to the most recent address provided by the
    Licensee will be considered proper notice.
