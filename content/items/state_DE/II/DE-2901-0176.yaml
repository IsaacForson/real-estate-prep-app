stem: A Delaware real estate licensee receives a client’s earnest money deposit and fails to remit
  it to the escrow account within a reasonable time. Under Del. Code Ann. tit. 24, ch. 29, §
  2912(a)(4), what may happen to the licensee?
options:
  - The licensee’s license is automatically revoked without a hearing.
  - The licensee may be subject to disciplinary sanctions after a hearing.
  - The licensee must pay a fixed fine of $500 to the Commission.
  - The licensee is required to complete additional continuing education hours.
key: B
explanation: The statute lists failure to account for or remit others’ money as a ground for
  discipline, and provides that a licensee shall be subject to disciplinary sanctions after a
  hearing if the Commission finds the violation. Thus, the licensee may face sanctions following a
  hearing. The distractor stating automatic revocation without a hearing is incorrect because the
  statute requires a hearing before any sanctions.
