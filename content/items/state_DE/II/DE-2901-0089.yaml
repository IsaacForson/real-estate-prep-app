stem: A Delaware broker wants to open a branch office. What must the broker include in the
  application for the additional license under Delaware Administrative Code § 2900?
options:
  - The application must include a copy of the broker’s current errors and omissions insurance policy
  - The application must include the location of the branch office and the name of the Designated
    On-Site Supervisor
  - The application must include proof of completing thirty hours of continuing education in the
    last renewal period
  - The application must include a list of thirty sale or lease transactions completed within the
    past two years
key: B
explanation: The rule requires the branch office location and the Designated On‑Site Supervisor’s
  name in the application (quoted). The distractor about a pre‑licensing course certificate applies
  to initial licensure, not a branch office application.
