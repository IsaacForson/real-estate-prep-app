stem: Under Delaware Code, which entity is responsible for establishing the qualifications for
  licensure and evaluating the credentials of applicants for a real estate license?
options:
  - The Division of Professional Regulation establishes qualifications and evaluates credentials.
  - The Delaware Real Estate Commission establishes qualifications and evaluates credentials.
  - The Governor establishes qualifications and evaluates credentials.
  - The Attorney General establishes qualifications and evaluates credentials.
key: B
explanation: Under Del. Code Ann. tit. 24, ch. 29, § 2906(a)(3), the Delaware Real Estate Commission
  establishes the qualifications for licensure and evaluates the credentials of applicants. The
  Division of Professional Regulation maintains records and conducts investigations, but does not
  set qualifications or evaluate credentials.
citation:
  source: Del. Code Ann. tit. 24, ch. 29, § 2906(a)(3)
  url: null
  quoted_text: Establish the qualifications for licensure and evaluate the credentials of all
    applicants for a license to practice real estate services, in order to determine whether such
    applicants meet the qualifications set forth in this chapter.
