stem: "Under Del. Code Ann. tit. 24, § 2901(e)(4), an auctioneer licensed under Title 30 who
  conducts a sale of real estate in Delaware:"
options:
  - Is exempt from the licensing requirement for conducting the sale.
  - Must obtain a temporary permit from the Commission before the sale.
  - Must hold a Delaware real estate license to conduct the sale.
  - May only conduct the sale if supervised by a licensed broker.
key: A
explanation: Section 2901(e)(4) exempts auctioneers as defined in Title 30 from the licensing
  requirements of this chapter. Therefore, an auctioneer conducting a real estate sale does not need
  a Delaware real estate license. The option stating that the auctioneer is exempt from the
  licensing requirement is correct, while the option stating that a license must be obtained is
  incorrect.
