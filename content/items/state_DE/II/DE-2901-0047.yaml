stem: What must a licensee submit to the Delaware Real Estate Commission before transferring their
  license to a new office if they were previously associated with another broker?
options:
  - A completed Change Form signed by the former broker
  - A letter of recommendation from the former broker
  - A certificate of continuing education completion
  - A new application for licensure submitted to the Commission
key: A
explanation: Under 24 Del. Admin. Code § 2900 § 7.1, a licensee transferring to a new office must
  submit a completed Change Form signed by the former broker before the license can be transferred.
  A letter of recommendation from the former broker does not satisfy this requirement because the
  rule specifically mandates the signed Change Form.
