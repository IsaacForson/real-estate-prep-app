stem: Under Delaware law, which of the following persons is exempt from licensure when performing
  real estate services in the course of their profession?
options:
  - A lawyer who is an attorney-at-law acting in a real estate transaction
  - A property manager who also negotiates leases for others
  - A salesperson working under a broker's supervision
  - A licensed auctioneer conducting sales of personal property
key: A
explanation: The attorney-at-law exemption is explicitly stated in § 2901(e)(3), which excludes
  services rendered by an attorney-at-law acting as such. A property manager who negotiates leases
  is not exempt because the property management services exemption excludes negotiating leases or
  rental agreements. A salesperson must be licensed, and an auctioneer conducting sales of personal
  property is not covered by the real estate auctioneer exemption.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) — § 2901(e)(3)
  url: null
  quoted_text: This chapter shall not be construed to include in any way the services rendered by an
    attorney-at-law, nor shall it be held to include, while acting as such, the receiver, trustee in
    bankruptcy, administrator or executor, or any person selling real estate under order of any
    court, or a trustee acting under a trust agreement, deed of trust or will, or the regular
    salaried employee thereof.
