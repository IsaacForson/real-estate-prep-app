stem: A Delaware real estate salesperson is convicted of fraud, which is substantially related to
  real estate practice. Under Del. Code Ann. tit. 24, ch. 29, § 2912(a)(13), what may happen to the
  licensee?
options:
  - The licensee must immediately surrender the license to the Commission.
  - The licensee’s license is automatically suspended for six months.
  - The licensee may be subject to disciplinary sanctions after a hearing.
  - The licensee is required to retake the prelicensing exam.
key: C
explanation: The statute treats a conviction for a substantially related crime as a ground for
  discipline, leading to possible disciplinary sanctions after a hearing. The Commission does not
  impose automatic surrender or suspension; it must hold a hearing before determining sanctions. The
  distractor claiming automatic six‑month suspension adds a penalty not specified in the statute.
