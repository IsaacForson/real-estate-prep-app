stem: Which of the following is a ground for discipline under Delaware law?
options:
  - Not holding a broker's license
  - Receiving a kickback without disclosure
  - Failing to attend a continuing education seminar
  - Advertising a property without a sign
key: B
explanation: Under § 2912(a)(10), a licensee may be disciplined for receiving or agreeing to receive
  any form of valuable consideration for real‑estate‑related services without prior written
  disclosure to the client and the payor. The other options describe conduct not listed as grounds
  for discipline in the statute.
