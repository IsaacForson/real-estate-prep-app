stem: A brokerage organization receives a buyer's earnest money deposit. Where must that money be
  held under Delaware law?
options:
  - In a general operating account for business expenses
  - In a state‑maintained real estate trust fund
  - In a separate escrow account for client funds
  - In a personal trust account for broker funds
key: C
explanation: Delaware law defines an escrow account as a separate account established by the
  brokerage organization used solely for moneys in which a broker’s customers or clients have an
  interest. Therefore, the earnest money must be placed in that escrow account. The distractor of
  placing it in the broker's personal trust account violates the requirement that the account be
  separate and solely for clients' interests.
citation:
