stem: Under Delaware Administrative Code § 2900, what must an employing broker do with continuing
  education logs and certificates for salespersons and associate brokers?
options:
  - The broker must co-sign the continuing education logs and maintain copies of certificates for at
    least three years after each renewal period.
  - The broker must submit the continuing education logs to the Commission annually and destroy
    certificates after one year.
  - The broker must co-sign logs only for associate brokers and not for salespersons.
  - The broker must maintain certificates but is not required to co-sign continuing education logs.
key: A
explanation: The rule explicitly states that the employing broker must co-sign continuing education
  logs and maintain copies of certificates for at least three years after each renewal period. The
  distractor about submitting logs annually and destroying certificates after one year is incorrect
  because it shortens the retention period and omits the co‑signature requirement.
