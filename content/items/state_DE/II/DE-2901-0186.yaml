stem: Under Delaware law, a member of the Delaware Real Estate Commission who was initially
  appointed to fill a vacancy may serve for how many additional full terms after completing the
  unexpired term?
options:
  - Zero additional full terms
  - One additional full term
  - Two additional full terms
  - Three additional full terms
key: B
explanation: The statute states that a member appointed to fill a vacancy may succeed himself or
  herself for only 1 additional full term after serving the unexpired term. Therefore, the correct
  answer is one additional full term. The distractor of two additional full terms incorrectly
  assumes the same limit as a regularly appointed member.
