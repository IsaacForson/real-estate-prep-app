stem: Under Delaware law, which statement is true regarding the licensing of brokerage organizations?
options:
  - A brokerage organization may be licensed as a broker if it employs a licensed broker
  - A brokerage organization cannot be licensed under this chapter
  - A brokerage organization must be licensed if it provides property management services
  - A brokerage organization may be licensed if it is a corporation
key: B
explanation: The statute explicitly states that no brokerage organization, corporation, partnership
  or other business entity shall be licensed under this chapter. Therefore, a brokerage organization
  cannot be licensed regardless of employing a licensed broker or being a corporation. The option
  claiming a brokerage organization must be licensed if it provides property management services
  contradicts the prohibition.
