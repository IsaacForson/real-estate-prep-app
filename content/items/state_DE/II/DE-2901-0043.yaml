stem: A property owner who manages their own rental units shows the units to prospective tenants and
  negotiates lease terms. Does this activity require a real estate license under Delaware law?
options:
  - The owner must register as a property management service provider
  - The owner must obtain a broker license before negotiating leases
  - The owner must obtain a salesperson license before showing the units
  - The owner is exempt from licensing under the management exemption
key: D
explanation: Under §2901(e)(1), an owner or lessor who performs acts in the regular course of
  managing property they own is exempt from licensing requirements. Showing units and negotiating
  lease terms as part of property management falls within this exemption. Therefore, no license is
  required. The distractors incorrectly suggest that a license or registration is needed despite the
  statutory exemption.
