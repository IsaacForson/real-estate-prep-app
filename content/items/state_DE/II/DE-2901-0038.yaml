stem: A licensee let their license lapse for nine months and wishes to reinstate it. They have not
  been actively licensed in another state during that time. What must the licensee do to reinstate
  the license?
options:
  - The licensee must pay the required late fees, complete the Delaware pre-licensing law course,
    and pass the state portion of the licensing examination
  - The licensee must pay the required late fees, complete the seven modules of continuing
    education, and pass both state and general exams
  - The licensee must pay the required late fees and complete the seven modules of continuing
    education required by the regulation
  - The licensee must pay the required late fees and pass only the state portion of the licensing
    examination
key: A
explanation: For a license expired six months or more but less than two years, reinstatement
  requires payment of late fees, completion of the Delaware pre-licensing law course, and passing
  the state portion of the exam. The nine-month lapse falls within this range, so those steps are
  needed. The option requiring only continuing education is incorrect because that applies to
  shorter lapses. The option adding extra coursework and exams is incorrect because it applies to
  longer lapses without out-of-state practice.
citation:
  source: 24 Del. Admin. Code § 2900 § 13.1.2
  url: null
  quoted_text: Effective the renewal period beginning May 1, 2022, a license expired for six months or
    more but less than two years shall be reinstated if the Licensee pays the required late fees,
    completes the Delaware pre-licensing law course and passes the state portion of the licensing
    examination.
