stem: Under Delaware Real Estate Commission rules, how long after completing the Salesperson
  pre-licensing course must an applicant apply for licensure?
options:
  - Twelve months after completing the course.
  - Six months after completing the course.
  - Nine months after completing the course.
  - Twenty-four months after completing the course.
