stem: If a salesperson applicant does **NOT** apply for licensure within 12 months of completing the
  Salesperson pre-licensing course, what must they submit according to Delaware Administrative Code
  § 2900?
options:
  - Submit proof of completion of continuing education, pro-rated pursuant to the pro-ration
    requirements of subsection 14.3.
  - Submit a completed salesperson pre-licensing course completion certificate along with a letter
    of good standing from the course provider.
  - Provide a notarized affidavit stating the reason for the delay and evidence of ongoing real
    estate employment.
  - Retake the salesperson pre-licensing course, pass both the general and state portions of the
    examination, and submit a new application.
key: A
explanation: The rule explicitly states that an applicant who misses the 12‑month window must submit
  proof of completed continuing education, pro‑rated under subsection 14.3. The most tempting
  distractor suggests submitting a new course completion certificate, but the regulation does not
  require retaking the pre‑licensing course; it only requires proof of continuing education.
