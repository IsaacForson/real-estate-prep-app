stem: A Delaware salesperson let their license expire eight months ago. To reinstate the license,
  what must the licensee do?
options:
  - Pay late fees, complete the Delaware pre-licensing law course, and pass the state portion of the
    licensing exam
  - Pay late fees only and must retake the Salesperson pre-licensing course
  - Pay late fees and pass both the state and general portions of the licensing examination
  - Pay late fees and complete seven modules of continuing education for the current renewal period
key: A
explanation: For a license lapsed between six months and two years, the rule requires payment of
  late fees, completion of the Delaware pre-licensing law course, and passing the state portion of
  the licensing exam to reinstate. The distractor that omits the exam requirement fails to satisfy
  the full reinstatement criteria, and the distractor that only requires late fees ignores the
  mandatory education and examination steps.
