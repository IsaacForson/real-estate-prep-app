stem: A broker plans to relocate their office to a new address. What must they do under Delaware
  Real Estate Commission rules before the move?
options:
  - Notify the Commission by placing a notice on the office door and calling the main line
  - Notify the Commission via email within five business days of deciding to move the office
  - Notify the Commission in writing at least 30 days prior by submitting a new office application
  - Notify the Commission only after the move is completed by submitting a change of address form
key: C
explanation: According to 7.3, a broker moving the physical location of the office must notify the
  Commission in writing at least 30 days prior by submitting a new office application. Notifying the
  Commission only after the move or via email within five days does not meet the statutory timing
  and format requirements.
