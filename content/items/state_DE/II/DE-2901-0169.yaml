stem: Under Delaware Administrative Code § 2900, if a licensee fails to update their mailing address
  with the Division of Professional Regulation, what is considered proper notice for communications
  sent by mail?
options:
  - Notice sent to the licensee's new address is considered proper notice only if the licensee also
    notifies the Division within fifteen days.
  - Notice sent to the licensee's most recent address on file with the Division is considered proper
    notice.
  - Notice is considered improper unless the licensee personally acknowledges receipt.
  - Notice sent to the licensee's last known address is considered proper notice only if accompanied
    by a return receipt request.
key: B
explanation: The rule states that all mailings are sent only to the most recent address on file and
  that delivery to that address constitutes proper notice, even if the licensee did not update their
  address.
citation:
  source: 24 Del. Admin. Code § 2900 — 24 DE Admin. Code 2900 - Real Estate Commission Rules and
    Regulations (Delaware Registrar of Regulations current text) 1.5 Duty to update address
  url: null
  quoted_text: All notifications and correspondence pertaining to a Licensee’s license that are sent
    through the mail will be sent only to the most recent address provided by the Licensee. The
    failure to provide the Division with a current address will not operate to excuse any duty or
    responsibility of the Licensee and confirmed delivery to the most recent address provided by the
    Licensee will be considered proper notice.
