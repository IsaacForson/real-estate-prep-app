stem: Under Delaware law, what may the Commission do if an applicant has previously received an
  administrative penalty (such as a fine) for real estate services in another jurisdiction?
options:
  - Automatically deny the application regardless of the penalty's nature.
  - Determine after a hearing whether the penalty is grounds to deny licensure.
  - Deny the application only if the penalty was for nonpayment of renewal fees.
  - Waive the penalty automatically if the applicant pays a restitution fee.
key: B
explanation: The statute states that, notwithstanding the prohibition on applicants with
  administrative penalties, the Commission after a hearing may determine whether such penalty is
  grounds to deny licensure. Therefore, the Commission does not automatically deny; it evaluates
  after a hearing. The distractor claiming automatic denial ignores the required hearing and
  determination.
