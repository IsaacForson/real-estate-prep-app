stem: A licensee fails to cooperate fully with the Voluntary Treatment Option as required by the
  Delaware Real Estate Commission. What is the consequence?
options:
  - The licensee may be subject to immediate license revocation without hearing following an
    investigation
  - The licensee may be disqualified from the Voluntary Treatment Option and may face disciplinary
    proceedings
  - The licensee may be required to pay a fixed fine of $1,000 for each violation
  - The licensee may be automatically granted unrestricted licensure upon completion of the required
    continuing education
key: B
explanation: The regulation provides that failure to cooperate may disqualify the professional from
  the Voluntary Treatment Option and trigger an immediate investigation and possible disciplinary
  proceedings. It does not mandate automatic revocation, impose a fixed fine, or grant unrestricted
  licensure. Thus, the correct outcome is disqualification and potential disciplinary action.
citation:
  source: 24 Del. Admin. Code § 2900 — 24 DE Admin. Code 2900 - Real Estate Commission Rules and
    Regulations (Delaware Registrar of Regulations current text) § 15.5
  url: null
  quoted_text: Failure to cooperate fully with the participating Board chairperson or that
    chairperson's designate or designates or the Director of the Division of Professional Regulation
    or the chairperson’s designate in regard to the Voluntary Treatment Option or to comply with
    their requests for evaluations and screens may disqualify the regulated professional from the
    provisions of the Voluntary Treatment Option, and the participating Board chairperson or that
    chairperson's designate or designates shall cause to be activated an immediate investigation and
    institution of disciplinary proceedings, if appropriate.
