stem: A licensee has the parties sign a purchase agreement on Wednesday, June 5, and receives the
  earnest money deposit at that time. Under Delaware law, by when must the licensee deposit the
  earnest money into the broker’s escrow account?
options:
  - By the end of the business day on Friday, June 7.
  - By the end of the business day on Monday, June 10.
  - By the end of the business day on Thursday, June 6.
  - By the end of the business day on Saturday, June 8.
key: A
explanation: The rule requires the broker to deposit escrow money within 72 hours of signing,
  excluding weekends and federal holidays. Counting only business days, Wednesday (day 1), Thursday
  (day 2), and Friday (day 3) satisfy the requirement, so deposit must be made by the end of Friday.
  The Saturday option incorrectly includes a weekend day in the 72‑hour period.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2923(d)
  url: null
  quoted_text: The broker shall deposit the moneys into the broker’s escrow account within 72 hours of
    the signing of the written agreement by all parties, or by the dates defined therein, excluding
    weekends and federal holidays.
