stem: A broker’s salesperson plans to host an open house for a listed property but will leave the
  site to run an errand, leaving an unlicensed assistant to continue hosting the open house. Under
  24 Del. Admin. Code § 2900-11.1, is this arrangement permissible?
options:
  - The arrangement is not permissible because only the broker may host an open house.
  - The arrangement is permissible because the unlicensed assistant is experienced.
  - The arrangement is not permissible because a licensee must be on site when non-licensed persons
    assist.
  - The arrangement is permissible because the salesperson will return shortly.
key: C
explanation: The rule permits non-licensed persons to assist only if a licensee is present on site.
  Leaving the site violates this condition, making the arrangement impermissible. The option stating
  that the arrangement is permissible because the salesperson will return shortly is incorrect
  because the rule requires a licensee to be on site at all times while non-licensed persons assist.
citation:
  source: 24 Del. Admin. Code § 2900-11.1
  url: null
  quoted_text: For any property listed with a Broker for sale, lease or exchange, only a Licensee
    shall be permitted to host or staff an open house or otherwise show a listed property. That
    Licensee may be assisted by non-licensed persons provided a Licensee is on site.
