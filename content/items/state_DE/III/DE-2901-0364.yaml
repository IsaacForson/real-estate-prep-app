  - 48 hours
  - 72 hours
  - 96 hours
key: C
explanation: The statute requires the broker to deposit the moneys within 72 hours of the signing of
  the written agreement by all parties, excluding weekends and federal holidays. The other options
  represent incorrect time periods.
