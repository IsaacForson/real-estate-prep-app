stem: Under Del. Code Ann. tit. 24, ch. 29 § 2915(a), what is the maximum length of time a temporary
  suspension pending a hearing may remain in effect without a continuance request?
options:
  - 45 days
  - 60 days
  - 30 days
  - 90 days
key: B
explanation: The statute states that an order of temporary suspension pending a hearing may remain
  in effect for no longer than 60 days from the date of issuance unless the licensee requests a
  continuance. Therefore, the maximum without a continuance is 60 days. The 90‑day option exceeds
  the statutory limit and is incorrect.
