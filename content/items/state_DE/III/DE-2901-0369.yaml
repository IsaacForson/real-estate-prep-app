stem: What must a licensee include in the written confirmation of agency relationship when acting as
  a common law agent for a seller?
options:
  - The licensee must include the statement that "This Broker, any cooperating Broker, and any
    Associate Broker or Salesperson working with either, are representing the seller's interest and
    have fiduciary responsibilities to the seller, but are obligated to treat all parties with
    honesty."
  - The licensee must include the statement that "This Broker, any cooperating Broker, and any
    Associate Broker or Salesperson working with either, are representing the buyer's interest and
    have fiduciary responsibilities to the buyer, but are obligated to treat all parties with
    honesty."
  - The licensee must include the statement that "This Broker, any cooperating Broker, and any
    Associate Broker or Salesperson working with either, are representing the seller's interest and
    have fiduciary responsibilities to the seller, but are obligated to treat all parties fairly."
  - The licensee must include the statement that "This Broker, any cooperating Broker, and any
    Associate Broker or Salesperson working with either, are representing the seller's interest and
    have fiduciary responsibilities to the seller, but are obligated to submit all offers to
    purchase promptly."
key: A
explanation: The rule requires the exact wording for a seller’s agent in a common law agency
  relationship, which includes the fiduciary duty to the seller and the obligation to treat all
  parties honestly. The option that substitutes "buyer" for "seller" misstates the party to whom the
  fiduciary duty is owed.
