stem: A broker opens a separate account at a Delaware bank and deposits earnest money from a client
  into that account, which is used solely for the client's funds. Does this account qualify as an
  escrow account under Delaware law?
options:
  - Yes, because the account is separate and used solely for the client's funds.
  - No, because the account is not maintained at a Delaware bank.
  - No, because the account commingles the broker's personal funds with client funds.
  - No, because the account may be used to pay office expenses.
key: A
explanation: The definition requires an escrow account to be a separate account used solely for
  clients' moneys. Since the broker opened a separate account used solely for the client's funds, it
  qualifies as an escrow account. The distractor claiming the account is not at a Delaware bank is
  wrong because the definition does not require a Delaware bank; it only requires separation and
  sole use for client funds.
citation:
