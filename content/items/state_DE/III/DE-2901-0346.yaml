stem: A broker changes the address of her approved office from Wilmington to Newark. Under Del. Code
  Ann. tit. 24, ch. 29 § 2919(c), what must she do to remain compliant?
options:
  - She must update her broker's license to reflect the new office address
  - She must notify the Commission only after closing the Wilmington office
  - She must obtain a new broker's license for the Newark office
  - She must cease operations at the Wilmington office immediately
key: A
explanation: Subsection (c) requires that the broker’s license include the address of the approved
  office. Therefore, when the office address changes, the broker must update her license to reflect
  the new address. Obtaining a new license, ceasing operations, or delayed notification are not
  required by this provision.
