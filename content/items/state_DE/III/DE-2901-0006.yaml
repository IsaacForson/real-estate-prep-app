stem: A seller and a Broker orally agree to a non-exclusive listing for the sale of the seller's
  property, with no signed paperwork. Under 24 Del. Admin. Code § 2900-8.1, is this listing
  agreement valid?
options:
  - Yes, because oral listing agreements bind the seller once performance begins
  - Yes, because non-exclusive listings are exempt from the writing requirement
  - No, because exclusive listings alone require a written agreement
  - No, because listing agreements are required to be in writing and signed
key: D
explanation: Rule 8.1.1 requires every listing agreement, whether exclusive or non-exclusive, to be
  in writing and signed by the seller, owner, Broker, or the Broker's designee.
