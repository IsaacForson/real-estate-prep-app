stem: Under 24 Del. Admin. Code § 2900-8.5.1, how is a 'Team' defined for real estate licensees in
  Delaware?
options:
  - Two or more licensees who represent themselves to the public as part of one entity
  - Two or more licensees who work in the same office regardless of public representation
  - A single licensee who advertises under a name that includes the word 'team'
  - Any group of licensees who share office space and advertising materials
key: A
explanation: Under 24 Del. Admin. Code § 2900-8.5.1, a Team is defined as two or more licensees who
  represent themselves to the public as being part of one entity. Therefore the option stating 'Two
  or more licensees who represent themselves to the public as part of one entity' is correct. The
  option stating 'Two or more licensees who work in the same office regardless of public
  representation' is incorrect because merely sharing an office does not satisfy the public
  representation requirement.
