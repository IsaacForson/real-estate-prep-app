stem: A licensee submits a false statement to the Commission regarding a required notice. According
  to Del. Code Ann. tit. 24, ch. 29 § 2921(f), what is the range of the fine that may be imposed?
options:
  - The licensee shall be fined not less than $1,000 nor more than $10,000.
  - The licensee shall be fined not less than $0 nor more than $0.
  - The licensee shall be fined not less than $500 nor more than $5,000.
  - The licensee shall be fined not less than $250 nor more than $2,500.
key: C
explanation: The correct answer reflects the statutory fine range for filing a false notice under
  subsection (f). The distractor proposing a $250–$2,500 range understates both the minimum and
  maximum amounts set by law.
