stem: A licensee is convicted of fraud, a crime substantially related to real estate services. Under
  § 2912(a)(13), what may the Commission do?
options:
  - The Commission may issue a warning but cannot take further action.
  - The Commission must refer the case to the Attorney General for prosecution.
  - The Commission must automatically revoke the licensee’s license.
  - The Commission may impose disciplinary sanctions on the licensee.
key: D
explanation: Section 2912(a)(13) provides that a conviction for a crime substantially related to the
  practice of real estate services is grounds for discipline, and the record of conviction is
  conclusive evidence. Accordingly, the Commission may impose disciplinary sanctions. Automatic
  revocation, mandatory referral to the Attorney General, or limitation to a warning only are not
  prescribed by this subsection.
