stem: A broker employs a sales manager to oversee daily office operations. Under 24 Del. Admin. Code
  § 2900-1.3.5, what is the broker's responsibility regarding compliance with commission rules?
options:
  - The broker is only responsible for the sales manager's actions
  - The broker delegates all compliance duties to the sales manager
  - The broker remains responsible for ensuring licensees comply with rules
  - The broker may rely on the sales manager for rule compliance
key: C
explanation: The rule states that employing a sales manager or similar administrator shall not
  relieve the broker of the responsibilities contained in the rules and regulations. Therefore, the
  broker remains responsible for ensuring licensees comply with commission rules. The distractor
  that the broker delegates all compliance duties is incorrect because the rule explicitly prohibits
  relieving the broker of responsibilities through such employment.
citation:
