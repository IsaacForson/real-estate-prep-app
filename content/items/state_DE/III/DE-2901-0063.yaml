stem: Under 24 Del. Admin. Code § 2900-7.1, what must a licensee submit before the Commission will
  transfer their license to a new office or allow a broker to open their own office after previously
  being associated with another broker?
options:
  - A completed Change Form signed by the former broker
  - A written notice to the Commission of the intended office move
  - A new office application including a telephone number
  - A signed cooperation agreement with the new broker
key: A
explanation: The rule requires a completed Change Form signed by the former broker before the
  license can be transferred. Therefore, the licensee must submit that form. Providing only a notice
  of move or a new office application does not satisfy the transfer requirement under 7.1.
