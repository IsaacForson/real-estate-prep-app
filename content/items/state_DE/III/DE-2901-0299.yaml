stem: Under 24 Del. Admin. Code § 2900-8.6.3, what is a licensee who violates the advertising rules
  subject to?
options:
  - Possible fine of up to five thousand dollars
  - Possible suspension of the license for six months
  - Possible revocation of the license immediately
  - Possible disciplinary sanctions set forth in 24 Del.C. §2914
key: D
explanation: The key is correct because 24 Del. Admin. Code § 2900-8.6.3 states that a licensee who
  violates advertising rules is subject to the disciplinary sanctions set forth in 24 Del.C. §2914.
  The most tempting distractor, 'Possible suspension of the license for six months,' is incorrect
  because the rule does not specify any particular penalty length; it only references the general
  disciplinary sanctions in §2914.
