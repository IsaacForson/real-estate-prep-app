stem: A licensee receives a temporary suspension order under Del. Code Ann. tit. 24, ch. 29 §
  2915(a) and requests a continuance of the hearing date. How long may the suspension remain in
  effect?
options:
  - The suspension may remain in effect for no longer than 60 days from the date of issuance
  - The suspension may remain in effect for exactly 30 days regardless of continuance request
  - The suspension may remain in effect until the licensee withdraws the continuance request
  - The suspension may remain in effect until the Commission convenes and renders a decision
key: D
explanation: The statute provides that if a licensee requests a continuance, the temporary
  suspension remains in effect until the Commission convenes and a decision is rendered, not limited
  to the 60‑day period. The distractor stating a 60‑day maximum applies only when no continuance is
  requested.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2915(a)
  url: null
  quoted_text: An order of temporary suspension pending a hearing may remain in effect for no longer
    than 60 days from the date of the issuance of the order unless the temporarily suspended
    licensee requests a continuance of the hearing date. If the temporarily suspended licensee
    requests a continuance, the order of temporary suspension remains in effect until the Commission
    convenes and a decision is rendered.
