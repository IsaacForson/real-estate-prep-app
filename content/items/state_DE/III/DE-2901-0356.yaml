stem: A licensee advertises a property for sale where an unlicensed salesperson will conduct on‑site
  showings for the seller, who is exempt from licensure under 24 Del.C. §2901. What must the
  licensee include in the advertisement?
options:
  - Including the licensee’s real estate license number, expiration date, and contact email
  - Including the licensee’s personal telephone number, email address, and mailing address
  - Including the brokerage’s main office telephone number, email address, and website URL
  - Including the statement “On‑site unlicensed salespeople represent the seller only.”
key: D
explanation: When advertising for an exempted party where an unlicensed salesperson conducts on‑site
  sales, the licensee must disclose that the unlicensed salespeople represent the seller only. The
  other options describe permissible but not required information.
citation:
  source: 24 Del. Admin. Code § 2900 — 24 DE Admin. Code 2900 - Real Estate Commission Rules and
    Regulations (Delaware Registrar of Regulations current text) § 8.6.5.7
  url: null
  quoted_text: '8.6.5.7 A Licensee advertising for sale for an exempted party under 24 Del.C. §2901 ,
    where an unlicensed salesperson conducts on-site sales, shall disclose in any advertising that:
    "On-site unlicensed salespeople represent the seller only."'
