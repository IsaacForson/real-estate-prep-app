stem: Under Delaware law, which activity is permitted for an individual claiming the property
  management exemption?
options:
  - Negotiating lease terms
  - Approving lease applications
  - Advertising managerial duties
  - Collecting rent payments
key: D
explanation: The property management exemption allows an individual to collect or accept rents
  payable to the owner or brokerage. Negotiating lease terms, approving applications, and indicating
  managerial responsibility are prohibited activities under the exemption.
