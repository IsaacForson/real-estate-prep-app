stem: "Under Del. Code Ann. tit. 24, ch. 29 § 2912(e), a licensee who is providing services under an
  exemption defined in § 2901 and is later found guilty of certain violations after a hearing is:"
options:
  - The licensee is exempt from disciplinary action under this chapter
  - The licensee is subject to discipline under § 2914
  - The licensee has their license automatically revoked
  - The licensee must cease providing the exempted service immediately
key: B
explanation: The statute states that a licensee acting under an exemption who is found guilty of
  violations after a hearing shall be subject to discipline pursuant to § 2914. Therefore, the
  licensee is not exempt from disciplinary action. The distractor claiming exemption from discipline
  is incorrect because the rule explicitly subjects such licensees to discipline.
