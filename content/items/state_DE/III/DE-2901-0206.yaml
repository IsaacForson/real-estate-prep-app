stem: A licensee holds a client’s earnest money deposit in a personal account and does not remit it
  to the closing agent within a reasonable time. Under § 2912(a)(4), what is the likely outcome?
options:
  - The licensee’s license is automatically revoked upon discovery of the failure.
  - The licensee must pay a fine of $500 to the Division of Professional Regulation.
  - The licensee must wait for the client to sue before any administrative action can be taken.
  - The licensee may be subject to disciplinary sanctions by the Commission.
key: D
explanation: Section 2912(a)(4) provides that failing to account for or remit money belonging to
  others within a reasonable time is grounds for discipline. Therefore the licensee may face
  disciplinary sanctions. The other options describe consequences not authorized by this subsection,
  such as a fixed fine, automatic revocation, or prerequisite civil action.
