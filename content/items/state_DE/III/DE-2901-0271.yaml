stem: A licensee is preparing to list a 10,000‑square‑foot office building for sale. A prospective
  buyer asks for the consumer information statement. Is the licensee required to provide the CIS
  under Delaware law?
options:
  - No, the CIS exemption applies only to leases of 120 days or less
  - Yes, the CIS must be delivered before the first showing of the property
  - No, the CIS is not required for non‑residential property listings
  - Yes, the CIS must be delivered at the first scheduled appointment with the buyer
key: C
explanation: Under §2938(f), transactions of properties other than those marketed as one‑to‑four
  family residential properties or single lot sales intended for such residence are exempt from
  providing the CIS; an office building qualifies for this exemption.
