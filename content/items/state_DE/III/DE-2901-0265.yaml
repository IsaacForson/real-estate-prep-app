stem: A licensee has been licensed for 20 months and is renewing their license. How many continuing
  education hours and from how many different modules must they complete to satisfy the CE
  requirement for renewal?
options:
  - 21 hours of CE from 7 different modules
  - 6 hours of CE from 2 different modules
  - 18 hours of CE from 6 different modules
  - 12 hours of CE from 4 different modules
key: C
explanation: For licensure between eighteen and twenty‑four months, the rule mandates eighteen CE
  hours drawn from six different modules. The six‑hour and twelve‑hour options apply to shorter
  licensure periods, while twenty‑one hours is required after twenty‑four months.
