stem: A licensee wishes to move to a new office but does not have a completed Change Form signed by
  the former broker. Under 24 Del. Admin. Code § 2900-7.2, what may the Commission do?
options:
  - The licensee may submit the form after transfer
  - The Commission may waive the requirement upon good cause
  - The license must be transferred immediately
  - The licensee must retake the examination
key: B
explanation: Subsection 7.2 authorizes the Commission to waive the requirement of subsection 7.1
  upon a determination of good cause. Thus, if the licensee lacks the signed Change Form, the
  Commission may waive the requirement. The distractor "The licensee may submit the form after
  transfer" is incorrect because the form must be submitted before the license will be transferred.
