stem: Under 24 Del. Admin. Code § 2900-10.1, a licensee who is the owner of the property being sold
  must disclose what to all parties before executing any agreement?
options:
  - the licensee’s status as a dual agent
  - the licensee’s status as a seller
  - the licensee’s status as a licensee
  - the licensee’s status as a broker
key: C
explanation: The rule explicitly requires a licensee who has an ownership or personal interest in a
  transaction to disclose their licensee status to all parties prior to executing any agreement and
  to include that status on the agreement. The distractor about the property’s listing price is
  incorrect because this provision does not mandate price disclosure; it concerns only the
  licensee’s status.
citation:
  source: 24 Del. Admin. Code § 2900-10.1
  url: null
  quoted_text: A Licensee who is the owner, the prospective purchaser, lessor or lessee or who has any
    personal interest in a transaction, shall disclose the Licensee’s status as a Licensee to all
    persons with whom the Licensee is transacting such business, prior to the execution of any
    agreements and shall include on the agreement such status.
