stem: What must the employing broker do regarding continuing education logs for salespersons and
  associate brokers?
options:
  - B. Submit the continuing education logs to the Division of Professional Regulation within thirty
    days of completion.
  - D. Destroy the continuing education logs after one year from the date of completion.
  - C. Allow the salesperson or associate broker to retain the logs without broker involvement.
  - A. Co-sign the continuing education logs and maintain copies of the certificates for at least
    three years after each renewal period.
key: D
explanation: The rule requires the employing broker to co-sign continuing education logs and retain
  copies of the certificates for at least three years after each renewal period. The other options
  are incorrect because the rule does not require submission of logs to the Division, does not
  require destruction after one year, and does not allow the salesperson or associate broker to
  retain the logs without broker involvement.
