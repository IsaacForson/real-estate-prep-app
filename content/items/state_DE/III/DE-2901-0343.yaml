stem: A licensee receives notice from the Board chairperson to participate in the Voluntary
  Treatment Option but fails to cooperate fully with requests for evaluations and screens. According
  to 24 Del. Admin. Code § 2900-15.5, what is the consequence?
options:
  - The licensee’s license is automatically revoked without a hearing
  - The licensee may continue practicing without any restrictions while awaiting a treatment plan
  - The licensee must complete an additional thirty‑day evaluation period before reapplying
  - The licensee is disqualified from the program and the Board shall initiate an immediate
    investigation
key: D
explanation: The rule provides that failure to cooperate fully may disqualify the licensee from the
  Voluntary Treatment Option and triggers an immediate investigation and possible disciplinary
  proceedings by the Board. The distractor suggesting an additional evaluation period is not
  supported by the text.
citation:
  source: 24 Del. Admin. Code § 2900-15.5
  url: null
  quoted_text: Failure to cooperate fully with the participating Board chairperson or that
    chairperson's designate or designates or the Director of the Division of Professional Regulation
    or the chairperson’s designate in regard to the Voluntary Treatment Option or to comply with
    their requests for evaluations and screens may disqualify the regulated professional from the
    provisions of the Voluntary Treatment Option, and the participating Board chairperson or that
    chairperson's designate or designates shall cause to be activated an immediate investigation and
    institution of disciplinary proceedings, if appropriate.
