stem: A salesperson has held a Delaware real estate license for eight months and is preparing for
  renewal. How many continuing education hours must the salesperson complete to satisfy the renewal
  requirement?
options:
  - 6 hours
  - 0 hours
  - 21 hours
  - 12 hours
key: A
explanation: For licensure periods of at least six months but less than twelve months, the rule
  requires six hours of continuing education (§ 14.2.2). An eight‑month licensee falls within this
  range, so six hours are required. The twelve‑hour option applies to the twelve‑to‑eighteen month
  period, which does not yet apply.
