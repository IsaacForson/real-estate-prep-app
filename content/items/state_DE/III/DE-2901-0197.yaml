stem: A licensee is asked by a mortgagee to prepare a competitive market analysis for a property
  that is under contract. Is the licensee permitted to do so?
options:
  - The action is permitted for the mortgagee
  - The action is not permitted for the mortgagee
  - The action is permitted with the required disclosure
  - The action is permitted for a potential buyer
key: B
explanation: The law prohibits a licensee from performing a competitive market analysis for the
  mortgagee on a property that is the subject of a signed agreement of sale. Therefore, the licensee
  may not prepare the analysis. The distractor suggesting that adding the required disclosure would
  allow the analysis is incorrect because the prohibition is not overridden by disclosure.
