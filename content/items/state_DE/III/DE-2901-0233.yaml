stem: Which of the following is **NOT** a sanction that the Commission may impose under Del. Code
  Ann. tit. 24, ch. 29 § 2914(a)?
options:
  - Impose a fine over $5,000 for each violation
  - Suspend the licensee’s license
  - Issue a letter of reprimand
  - Place the licensee on probation
key: A
explanation: The statute limits monetary penalties to $5,000 per violation, so imposing a fine over
  $5,000 is not permitted. Placing the licensee on probation is allowed under subsection (a)(2) as a
  disciplinary sanction.
