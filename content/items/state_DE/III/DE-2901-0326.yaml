stem: A licensee’s license has been expired for four months. The licensee wants to reinstate the
  license. What must the licensee do to qualify for reinstatement under Delaware rule?
options:
  - Pay the required late fees and complete the seven modules of continuing education required by
    Section 14.0.
  - Pay the required late fees and pass the state portion of the licensing examination only.
  - Pay the required late fees, complete the Delaware pre-licensing law course, and pass the state
    portion of the licensing examination.
  - Pay the required late fees, complete the seven modules of continuing education, and pass both
    the state and general portions of the examination.
key: A
explanation: For a license expired more than thirty days but less than six months, reinstatement
  requires paying the required late fees and completing the seven modules of continuing education
  required by Section 14.0.
