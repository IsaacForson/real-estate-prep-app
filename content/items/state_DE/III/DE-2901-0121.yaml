stem: A licensee is placed on probationary status with a condition to limit real estate services to
  residential transactions only. The licensee subsequently engages in a commercial transaction.
  After a hearing, what action may the Commission take under Del. Code Ann. tit. 24, ch. 29 §
  2914(d)?
options:
  - Impose a monetary penalty not exceeding $5,000
  - Issue a letter of reprimand to the consumer
  - Place the licensee on probationary status again
  - Suspend or revoke the licensee’s license
key: D
explanation: Section 2914(d) states that if a licensee on probation violates the imposed
  restrictions or conditions, the Commission may, after a hearing, suspend or revoke the license.
  The other options are permissible sanctions for initial violations but not for a probation
  violation after hearing.
