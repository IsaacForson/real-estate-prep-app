stem: Which term is prohibited from being included in a Team name under 24 Del. Admin. Code §
  2900-8.5.2.2?
options:
  - The term Group is prohibited.
  - The term Realty is prohibited.
  - The term Associates is prohibited.
  - The term Team is prohibited.
key: B
explanation: The rule explicitly states that a Team name may not include terms suggesting the Team
  is a separate brokerage organization, such as “Realty”, “Real Estate”, or “Realtors”. Therefore,
  “Realty” is prohibited. The other terms—Group, Team, and Associates—are either required or
  permitted in a Team name.
