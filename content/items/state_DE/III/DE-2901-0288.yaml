stem: A licensee assists a seller in the sale of a parcel of land intended for a commercial
  warehouse, a transaction exempt from providing the Consumer Information Statement. Under Delaware
  law, when do the licensee's statutory duties to the client begin?
options:
  - When the licensee first contacts the customer
  - When the parties form an agency relationship
  - When the licensee conducts the first showing of the property
  - When the licensee makes an offer to purchase
key: B
explanation: The statute provides that for transactions exempt from providing the CIS, the duties of
  the agent commence when the parties form an agency relationship. The distractor that cites first
  contact is incorrect because the exemption shifts the start of duties to the moment an agency
  relationship is established.
