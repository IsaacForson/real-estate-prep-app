stem: A tenant gives a licensee a security deposit to hold. The licensee deposits the money into
  their personal account and uses it to pay personal bills. Which Delaware rule has the licensee
  violated?
options:
  - The duty to disclose adverse material facts
  - The duty to cooperate with other licensees
  - The duty to account for money in a timely manner
  - The duty to hold the escrow deposit when requested
key: D
explanation: The licensee violated the duty to hold the escrow deposit when requested by depositing
  the security deposit into a personal account and using it for personal bills. This breaches the
  specific requirement to hold escrow deposits as stated in the statute. The distractor about timely
  accounting is incorrect because the violation concerns the failure to hold the funds, not the
  timing of recording them.
