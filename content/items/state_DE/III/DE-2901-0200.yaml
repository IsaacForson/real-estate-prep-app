stem: A broker who is the sole licensee in an office dies unexpectedly. According to 24 Del. Admin.
  Code § 2900-1.3.4, what must happen for the office to continue operating?
options:
  - Submit notice of office closure until a new broker is licensed
  - Submit documentation allowing the associate broker to act as broker
  - Submit a request to the Division for a temporary substitute broker
  - Submit authorization for salespersons to continue under broker license
key: C
explanation: The rule provides that when an unforeseen event such as death removes the sole licensed
  broker, a request shall be submitted to the Division of Professional Regulation for substitution
  of another broker on a temporary basis. Thus, submitting a request for a temporary substitute
  broker is required. The distractor suggesting notice of office closure is incorrect because the
  rule mandates a request for a temporary substitute, not closure.
