stem: Under 24 Del. Admin. Code § 2900-1.3.3, what must a broker provide for each office location?
options:
  - Provide complete and adequate supervision
  - Provide a written office policy document
  - Provide a designated on-site supervisor
  - Provide a minimum of five years experience
key: A
explanation: The rule explicitly states that each office location shall be under the direction of a
  broker who shall provide complete and adequate supervision of that office. Therefore, the broker
  must provide complete and adequate supervision. The distractor about providing a written office
  policy is incorrect because the rule does not require a policy document as the broker's duty.
