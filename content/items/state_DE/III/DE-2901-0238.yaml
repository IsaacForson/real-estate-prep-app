stem: A salesperson has been licensed for 9 months and is renewing their license. Under 24 Del.
  Admin. Code § 2900, what is the continuing education requirement for this licensee?
options:
  - The licensee must complete 6 continuing education hours from two different modules.
  - The licensee must complete 12 continuing education hours from four different modules.
  - The licensee must complete 21 continuing education hours from seven different modules.
  - The licensee is not required to complete any continuing education.
key: A
explanation: For licensure periods of at least six months but less than twelve months, the rule
  requires six hours of CE consisting of two different modules. Since nine months falls within this
  range, the licensee must complete six hours from two distinct modules. The distractor proposing
  twelve hours from four modules applies to the twelve‑to‑eighteen‑month period.
