stem: Under Delaware law, a licensee may prepare a competitive market analysis for which of the
  following purposes?
options:
  - To assist a potential tenant in purchasing a property for lease.
  - To assist a mortgagee in evaluating a property that is under contract.
  - To assist an appraiser in determining market value.
  - To assist an existing seller in listing a property for sale.
key: D
explanation: Under Delaware Code Title 24, Chapter 29, §2931(1)(a), a competitive market analysis
  may only be prepared for an existing or potential seller or owner to list a property for sale or
  lease, or for an existing or potential buyer or tenant to purchase or lease a property. The option
  that assists a potential tenant in purchasing a property for lease fits the permissible purpose
  for a buyer or tenant. The option that assists a mortgagee in evaluating a property under contract
  is not permitted because a mortgagee is not listed among the authorized recipients.
citation:
