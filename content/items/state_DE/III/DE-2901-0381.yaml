stem: A licensee holds an open house for a residential property on Saturday, and a prospective buyer
  attends the open house and submits a written offer on Monday morning. When must the licensee
  deliver the CIS to the buyer?
options:
  - The licensee must deliver the CIS no later than Thursday, three days after the open house.
  - The licensee must deliver the CIS only after the buyer signs the purchase agreement.
  - The licensee must deliver the CIS no later than Saturday, the time of the first showing of the
    property.
  - The licensee must deliver the CIS no later than Monday, the time the offer is made.
key: C
explanation: Under Del. Code Ann. tit. 24, ch. 29 § 2938(b), the CIS must be delivered no later than
  the earlier of the first scheduled appointment, first showing, or making an offer. The first
  showing occurs on Saturday, so delivery must occur by that time. The statement that the CIS must
  be delivered only after the buyer signs the purchase agreement is incorrect because the offer
  occurs later than the showing, which does not set the earlier deadline.
citation:
