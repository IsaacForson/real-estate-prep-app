stem: Under 24 Del. Admin. Code § 2900, which party is required to immediately notify the Director
  of Professional Regulation upon receiving a report of chemical dependency?
options:
  - The chairperson of the regulatory Board
  - The licensee who is the subject of the report
  - The Director of the Division of Professional Regulation
  - The treating professional in the approved treatment program
key: A
explanation: The rule states that if the report is received by the chairperson, that chairperson
  shall immediately notify the Director. The licensee, the Director themselves, and the treating
  professional are not assigned this duty.
citation:
  source: 24 Del. Admin. Code § 2900.15.1
  url: null
  quoted_text: If the report is received by the chairperson of the regulatory Board, that chairperson
    shall immediately notify the Director of Professional Regulation or the chairperson’s designate
    of the report.
