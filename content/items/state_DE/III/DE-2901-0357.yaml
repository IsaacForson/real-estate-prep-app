stem: A licensee offers a closing cost credit to a buyer as an inducement to purchase the property.
  Under Delaware law, is this permissible?
options:
  - The licensee may not offer the credit unless part of a written cooperation agreement
  - The licensee may not offer the credit because rebates must be paid through escrow
  - The licensee may offer the credit as it is a permissible rebate to the buyer
  - The licensee may offer the credit only if disclosed in writing to the seller
key: C
explanation: Under 24 Del. Admin. Code § 2900‑8.8.2, a licensee is allowed to give a rebate or
  discount directly to the purchaser or seller of real estate. The regulation does not require the
  rebate to be routed through escrow or disclosed to the seller.
