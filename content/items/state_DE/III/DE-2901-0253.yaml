stem: A consumer files a written complaint with the Delaware Real Estate Commission alleging that a
  licensee failed to disclose a known defect. According to § 2906(a)(9), what action must the
  Commission take regarding this complaint?
options:
  - Referral to the Division for investigation with a Commission member assisting
  - Dismissal of the complaint without further action or investigation by the Commission
  - Imposition of a fine on the licensee pending a formal hearing by the Commission
  - Scheduling of a hearing to determine appropriate disciplinary sanctions by the Commission
key: A
explanation: The statute requires the Commission to refer all complaints to the Division for
  investigation and to assign a Commission member to assist in an advisory capacity. Therefore, the
  correct action is to refer the complaint and have a Commission member assist. The distractor
  "Dismissal of the complaint without further action or investigation" is incorrect because the
  Commission must not dismiss the complaint; it must refer it for investigation.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2906(a)(9)
  url: null
  quoted_text: Refer all complaints from licensees and the general public concerning individuals
    licensed in this chapter or concerning practices of the Commission or of the profession, to the
    Division for investigation pursuant to § 8735 of Title 29 and assign a member of the Commission
    to assist the Division in an advisory capacity with the investigation of the technical aspects
    of the complaint.
