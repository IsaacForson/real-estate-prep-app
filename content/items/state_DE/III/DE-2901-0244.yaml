stem: A prospective tenant submits a written request to a licensee asking whether the apartment was
  previously occupied by a person diagnosed with HIV. Under Del. Code Ann. tit. 24, ch. 29 §
  2927(d), what must the licensee do?
options:
  - The licensee must provide any information about HIV/AIDS psychological impacts.
  - The licensee must disclose any information about HIV/AIDS psychological impacts.
  - The licensee must withhold any information about HIV/AIDS psychological impacts.
  - The licensee must share any information about HIV/AIDS psychological impacts.
key: C
explanation: The statute prohibits any disclosure concerning psychological impacts of HIV, AIDS, or
  other diseases deemed unlikely to be transmitted through dwelling occupancy, even if specifically
  asked. Therefore the licensee must refrain from providing any information on that topic. The
  distractor suggesting a truthful answer contradicts the outright prohibition on disclosure.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2927(d)
  url: null
  quoted_text: The owner, landlord or licensee shall not make any disclosure concerning those
    psychological impacts of HIV, AIDS, or any other disease which has been determined by medical
    evidence to be highly unlikely to be transmitted through the occupancy of a dwelling place even
    if a customer or client specifically asks about such psychological impacts.
