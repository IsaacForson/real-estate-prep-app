stem: Under Del. Code Ann. tit. 24, ch. 29 § 2912(c), what action may the Commission take if a
  licensee has been convicted of forgery?
options:
  - The Commission may impose a letter of reprimand
  - The Commission may suspend or revoke the license
  - The Commission may place the licensee on probation
  - The Commission may require continuing education courses
key: B
explanation: Under §2912(c), the Commission may suspend or revoke a license for a conviction of
  forgery or similar crimes. Imposing a letter of reprimand is not authorized under this provision
  for criminal convictions, though it may be used for other violations under §2914.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2912(c)
  url: null
  quoted_text: The Commission may suspend or revoke any license issued under this chapter at any time
    where the licensee has been convicted in a court of competent jurisdiction of the crime of
    forgery, embezzlement, obtaining money under false pretenses, bribery, larceny, extortion,
    conspiracy to defraud or any similar offense or has had entered a plea of guilty or nolo
    contendere to any similar offense.
