stem: A licensee acts as a designated agent (not a dual agent) for a buyer purchasing a commercial
  office building. Under Delaware law, when does the licensee's duty of confidentiality to the
  client begin?
options:
  - Upon formation of the client relationship.
  - Upon making an offer to purchase the property.
  - Upon first contact with the customer.
  - Upon first showing of the property to the client.
key: A
explanation: For designated agents who are not dual agents, the duty of confidentiality applies
  after a client relationship is formed, per § 2936(d). The distractor 'upon first contact'
  incorrectly applies the general confidentiality rule.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2936(d)
  url: null
  quoted_text: designated agents who are not dual agents are exempt from subsection (c) of this
    section; instead, a duty of confidentiality by the agent to the client shall apply after a
    client relationship is formed.
