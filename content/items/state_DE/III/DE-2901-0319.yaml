stem: A licensee receives earnest money from a buyer and deposits it into the brokerage's escrow
  account on Monday. According to Del. Code Ann. tit. 24, ch. 29 § 2936(b)(5), when must the
  licensee account for this money?
options:
  - Account for the money in a timely manner, as soon as practicable.
  - Account for the money at the end of the month.
  - Account for the money immediately upon receipt.
  - Account for the money within 24 hours of receipt.
key: A
explanation: The rule requires accounting in a timely manner for all money and property received,
  without specifying a fixed deadline. Thus, the licensee must account for the money in a timely
  manner, as soon as practicable. The distractor imposing a 24‑hour deadline adds a requirement not
  found in the statute.
