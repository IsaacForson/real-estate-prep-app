stem: Under Del. Code Ann. tit. 24, ch. 29 § 2927(a), how is a fact or suspicion that a property
  might be psychologically impacted classified for disclosure purposes?
options:
  - It is not a material fact that must be disclosed in a real property transaction.
  - It is a fact that must be disclosed only in commercial property transactions.
  - It is a material fact that must be disclosed in any real property transaction.
  - It is a fact that must be disclosed only when the buyer makes a written request.
key: A
explanation: According to Del. Code Ann. tit. 24, ch. 29 § 2927(a), a fact or suspicion that a
  property might be psychologically impacted is not a material fact that must be disclosed in a real
  property transaction. The option stating it is a material fact that must be disclosed contradicts
  the statute. The option limiting disclosure to commercial transactions adds a condition not
  present in subsection (a). The option requiring a written request from the buyer introduces a
  requirement that the statute does not include.
