stem: A licensee acts as a designated agent (not a dual agent) for a buyer purchasing a five-unit
  apartment building. Under Del. Code Ann. tit. 24, ch. 29 § 2936(d), is the licensee exempt from
  the general confidentiality duty under subsection (c) of this section?
options:
  - No, because the confidentiality exception under subsection (d) of this section applies only to
    transactions of one-to-4 family residences.
  - Yes, but only if the licensee also discloses material confidential information as allowed by
    subsection (c) of this section.
  - Yes, because the transaction involves property other than one-to-4 family residences or single
    family lots intended for such residences.
  - No, because the confidentiality exception under subsection (d) applies only to dual agents in
    transactions of one-to-4 family residences.
key: C
explanation: The confidentiality exception in subsection (d) exempts designated agents who are not
  dual agents from the general confidentiality duty when the transaction involves property other
  than one-to-4 family residences or single family lots intended for such residences. Since a
  five-unit apartment building is not a 1-to-4 family residence, the exemption applies. The
  distractor claiming the exemption only applies to dual agents misstates the rule.
