stem: Under Delaware law, a licensee is prohibited from performing a competitive market analysis for
  which of the following?
options:
  - The licensee may perform a competitive market analysis for a prospective buyer seeking to lease
    a property.
  - The licensee shall not perform a competitive market analysis for a mortgagee on a property that
    is the subject of a signed agreement of sale.
  - The licensee may perform a competitive market analysis for an existing seller preparing to list
    a property for sale.
  - The licensee may perform a competitive market analysis for a tenant seeking to purchase a
    property.
key: B
explanation: The cited statute explicitly forbids a licensee from preparing a CMA for a mortgagee
  when the property is under a signed agreement of sale. The other options describe permissible
  situations where a licensee may prepare a CMA for a buyer, seller, or tenant.
