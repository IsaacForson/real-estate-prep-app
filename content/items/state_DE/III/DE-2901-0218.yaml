stem: A licensee advertises a residential property with the statement 'If we cannot sell your home,
  we will buy your home'. Under 24 Del. Admin. Code § 2900-10.2, what must the licensee include in
  the original listing agreement?
options:
  - the broker's contact information sheet for sellers
  - the price the licensee will pay if no sale
  - the seller's Condition Report copy form
  - the Radon Disclosure statement required
key: B
explanation: Section 2900-10.2 obligates a licensee using that specific advertising language to
  disclose in the original listing agreement the price they will pay if no sales agreement is
  executed during the term. The distractor regarding the Radon Disclosure statement is incorrect
  because radon disclosure requirements are found in § 2900-10.8, not in this advertising rule.
citation:
  source: 24 Del. Admin. Code § 2900-10.2
  url: null
  quoted_text: Any Licensee advertising real estate for sale stating in such advertisement, "If we
    cannot sell your home, we will buy your home", or words to that effect, shall disclose in the
    original listing agreement at the time the Licensee obtains the signature on the listing
    agreement, the price he will pay for the property if no sales agreement is executed during the
    term of the listing.
