stem: A buyer submits a written request to a licensee asking whether the property is rumored to be
  haunted. Under Delaware law, what must the licensee do?
options:
  - The licensee should consult the broker before responding to the request.
  - The licensee should answer the question truthfully to the best of their knowledge.
  - The licensee should disclose the information regardless of the request.
  - The licensee should refuse to answer because the topic is not a material fact.
key: B
explanation: When a customer makes a specific written request about psychological impacts, the
  licensee must answer truthfully to the best of their knowledge. Refusing to answer is incorrect
  because the written request overrides the general rule that such impacts are not material facts.
