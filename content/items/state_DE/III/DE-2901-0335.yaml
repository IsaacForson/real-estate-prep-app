stem: A prospective buyer submits a specific written request to the licensee asking whether the
  property was ever the site of a suicide. Under Del. Code Ann. tit. 24, ch. 29 § 2927(c), what must
  the licensee do?
options:
  - The licensee must refuse to answer the request because psychological impacts are generally not
    disclosable.
  - The licensee must answer the question truthfully to the best of the licensee's knowledge.
  - The licensee must disclose the information only if the buyer also provides a written waiver.
  - The licensee must disclose the information but may omit details that could embarrass the seller.
key: B
explanation: Subsection (c) requires the licensee to answer a specific written request truthfully to
  the best of their knowledge, unless the request concerns HIV/AIDS impacts covered by subsection
  (d). The statement that the licensee must refuse to answer because psychological impacts are never
  disclosable is incorrect; the requirement to disclose only if the buyer provides a written waiver
  adds a condition not present in the statute; and allowing omission of details that could embarrass
  the seller contradicts the truthfulness requirement.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 § 2927(c)
  url: null
  quoted_text: (c) Except as stated in subsection (d) of this section if a customer or client makes a
    specific written request to the owner, landlord or licensee about the psychological impacts
    regarding a specific property, the owner, landlord or licensee shall answer the questions
    truthfully, to the best of such owner’s, landlord’s or licensee’s knowledge.
