stem: A licensee receives a report of chemical dependency from a colleague. The chairperson contacts
  the licensee within five days and provides information about the Voluntary Treatment Option. The
  licensee refuses to enter the program. According to 24 Del. Admin. Code § 2900-15.5, what is the
  likely consequence?
options:
  - The licensee may continue practicing under supervision while in an approved treatment program.
  - The licensee must complete a 30‑day evaluation before any further disciplinary action.
  - The licensee may be disqualified from the Voluntary Treatment Option and may face an
    investigation.
  - The licensee must immediately surrender their real estate license to the Commission for review.
key: C
explanation: Section 15.5 provides that failure to cooperate fully may disqualify the professional
  from the Voluntary Treatment Option and triggers an immediate investigation and possible
  disciplinary proceedings. The other options either impose automatic license surrender, require a
  screening not mentioned, or allow continued practice without consequences, which the rule does not
  support.
citation:
  source: 24 Del. Admin. Code § 2900 — 24 DE Admin. Code 2900 - Real Estate Commission Rules and
    Regulations (Delaware Registrar of Regulations current text) § 15.5
  url: null
  quoted_text: Failure to cooperate fully with the participating Board chairperson or that
    chairperson's designate or designates or the Director of the Division of Professional Regulation
    or the chairperson’s designate in regard to the Voluntary Treatment Option or to comply with
    their requests for evaluations and screens may disqualify the regulated professional from the
    provisions of the Voluntary Treatment Option, and the participating Board chairperson or that
    chairperson's designate or designates shall cause to be activated an immediate investigation and
    institution of disciplinary proceedings, if appropriate.
