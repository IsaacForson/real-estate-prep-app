stem: A broker opens a branch office in Dover and appoints a licensee who has 4 years of continuous
  real estate services experience as the designated on-site supervisor. Under Del. Code Ann. tit.
  24, ch. 29 § 2919(d), is this appointment permissible?
options:
  - C) Yes, if the broker provides additional training to the supervisor.
  - B) No, because the supervisor must have at least 5 years of continuous experience.
  - D) No, unless the licensee obtains a waiver from the Commission.
  - A) Yes, because the supervisor only needs 3 years of experience.
key: B
explanation: The rule requires a designated on-site supervisor to have a minimum of five years of
  continuous real estate services experience. Since the appointed licensee has only four years, the
  appointment does not satisfy the statutory requirement. The option stating that the supervisor
  only needs three years of experience is incorrect.
