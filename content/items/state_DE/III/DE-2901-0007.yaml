stem: A brokerage's permanent office sign displays the team name in larger lettering than the
  brokerage name. Under 24 Del. Admin. Code § 2900-8.7, does this sign comply with the rule?
options:
  - No, the brokerage name has to be more prominent than the team name
  - Yes, team names may be displayed more prominently than the brokerage
  - Yes, sign order and lettering size are left to the Broker's own discretion
  - No, team names are prohibited from appearing on any permanent sign
