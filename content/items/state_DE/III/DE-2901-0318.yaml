stem: Under Del. Code Ann. tit. 24, ch. 29 § 2935(b)(4), what must a licensee do when requested by
  their customer or client to hold the escrow deposit?
options:
  - Hold the escrow deposit as requested by the client.
  - Notify the Commission before depositing any funds.
  - Deposit the funds into any account and keep records.
  - Invest the funds in an interest-bearing account promptly.
key: A
explanation: The rule explicitly states that licensees must hold the escrow deposit when requested
  by the customer or client. Therefore, the correct action is to hold the escrow deposit as
  requested. The distractor suggesting depositing funds into any account violates the duty to hold
  the deposit.
