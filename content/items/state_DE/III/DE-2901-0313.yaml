stem: A licensee first speaks with a prospective buyer by telephone about a property and later shows
  the property to that buyer. When do the licensee's statutory duties of confidentiality begin under
  Delaware law?
options:
  - The duty of confidentiality begins upon first contact between the licensee and the customer.
  - The duty of confidentiality begins when the licensee makes an offer on behalf of the buyer.
  - The duty of confidentiality begins after the consumer information statement is signed by the
    buyer.
  - The duty of confidentiality begins at the first scheduled appointment with the prospective buyer.
key: A
explanation: The statute explicitly states that the duties of confidentiality begin upon first
  contact between a licensee and the customer, regardless of whether that contact is a phone call,
  showing, or other interaction. Subsequent actions such as appointments or making an offer trigger
  the other statutory duties, but confidentiality starts at the very first contact. Hence, the duty
  begins at the telephone call.
