stem: A broker employs three salespersons. One salesperson's license expired two months ago and they
  have not submitted a renewal application. According to 24 Del. Admin. Code § 2900-1.3.1, what is
  the broker's responsibility?
options:
  - Ensure the salesperson submits a renewal application promptly
  - Co-sign the salesperson's continuing education logs
  - Report the salesperson to the Division within thirty days
  - Terminate the salesperson's employment immediately
key: A
explanation: The broker must ensure that all salespersons are currently licensed and make timely
  application for license renewal. The rule does not mandate termination, co-signing CE logs for an
  expired license, or reporting to the Division within thirty days for this situation.
citation:
  source: 24 Del. Admin. Code § 2900-1.3.1
  url: null
  quoted_text: Every Broker is responsible for making certain that all of the Broker’s Salespersons
    and Associate Brokers are currently licensed, make timely application for license renewal, and
    meet the Commission's continuing education requirements.
