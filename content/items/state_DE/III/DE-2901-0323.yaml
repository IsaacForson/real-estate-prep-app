stem: A licensee placed on inactive status for 24 months wishes to reactivate the license. Under
  Del. Code Ann. tit. 24, ch. 29 § 2921(b), what must the licensee do to reactivate?
options:
  - The licensee must pay biennial fees for each year of inactivity and submit proof of continuing
    education for each renewal period
  - The licensee must pay a single reactivation fee and submit proof of continuing education for the
    current renewal period
  - The licensee must pay no fees and submit no proof of continuing education for any renewal period
    during the inactive term
  - The licensee must pay a reactivation fee and submit proof of continuing education for the
    renewal period covering the inactive term
key: A
explanation: The statute specifies that to reactivate an inactive status license, the licensee must
  pay the biennial registration fees for the period of inactivity and submit proof of fulfilling
  continuing education requirements for each renewal period. The distractor suggesting only a single
  fee or limited CE is incorrect because the rule requires fees and proof for each renewal period of
  inactivity.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2921(b)
  url: null
  quoted_text: Upon completion of a form as provided in the rules and regulations and payment of the
    prescribed fee, the Commission shall place any active licensee on an inactive status for an
    unlimited amount of time. A licensee may reactivate an inactive status license, subject to
    payment of the biennial registration fees, for such time as the license has been inactive, and
    upon submission of proof of fulfillment of continuing education requirements for each renewal
    period.
