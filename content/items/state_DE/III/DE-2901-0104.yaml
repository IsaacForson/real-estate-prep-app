stem: A licensee representing a seller offers a $5,000 discount to the buyer to encourage a quick
  sale. Under 24 Del. Admin. Code § 2900-8.8.3, what must the licensee do?
options:
  - The licensee must provide the discount to the buyer without any disclosure.
  - The licensee must disclose the discount verbally to the seller.
  - The licensee must disclose the discount in writing to the seller.
  - The licensee must refuse to offer any discount to the buyer.
key: C
explanation: Under 24 Del. Admin. Code § 2900-8.8.3, a licensee has an affirmative obligation to
  disclose any rebate or discount made to the other party in writing to the licensee’s principal.
  Here the licensee represents the seller (the principal) and offers a $5,000 discount to the buyer
  (the other party), so the discount must be disclosed in writing to the seller. Verbal disclosure
  or no disclosure does not meet the requirement, and the rule does not prohibit offering the
  discount.
