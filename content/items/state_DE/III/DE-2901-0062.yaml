stem: A Delaware licensee is found guilty of three separate violations of § 2912 (such as fraud,
  misrepresentation, and forgery). What is the maximum total monetary penalty the Commission may
  impose under § 2914(a)(3)?
options:
  - $5,000.00
  - $10,000.00
  - $15,000.00
  - $20,000.00
key: C
explanation: Under § 2914(a)(3), the Commission may impose a monetary penalty not to exceed $5,000
  for each violation. For three violations, the maximum total is 3 × $5,000 = $15,000. The $10,000
  distractor incorrectly assumes only two violations.
