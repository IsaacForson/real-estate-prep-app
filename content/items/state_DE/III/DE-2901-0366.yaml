stem: A buyer and seller agree that a title company will hold the earnest money deposit. The
  licensee accepts the earnest money and deposits it into the title company’s account. Under
  Delaware law, is this permissible?
options:
  - Yes, but only if the licensee also remains a signatory on the account
  - Yes, if the parties have agreed to a different third‑party escrow agent
  - Yes, only if the title company is a federally insured banking institution
  - No, all escrow deposits must be held in the brokerage’s escrow account
key: B
explanation: The statute permits escrow deposits to be accepted in the name of a different
  third‑party escrow agent when the parties have so agreed. The other options incorrectly restrict
  the arrangement.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 § 2923(c)
  url: null
  quoted_text: All escrow deposits accepted by a licensee in accordance with the terms of a real
    estate services transaction shall be accepted in the name of the brokerage organization unless
    the parties have agreed to a different third-party escrow agent.
