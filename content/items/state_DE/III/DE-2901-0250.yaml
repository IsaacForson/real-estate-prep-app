stem: A broker opens a new branch office in Wilmington and appoints a licensee with four years of
  continuous experience as the Designated On-Site Supervisor. Under 24 Del. Admin. Code §
  2900-1.3.3, what must the broker do to comply with the rule?
options:
  - The broker may keep the supervisor if they supervise under the broker's direct oversight
  - The broker must replace the supervisor with a licensee who has at least five years of continuous
    experience
  - The broker may keep the supervisor if they obtain a waiver from the Commission
  - The broker may keep the supervisor if they complete a continuing education course
key: B
explanation: The regulation requires a Designated On-Site Supervisor to have a minimum of five (5)
  years of continuous Real Estate Services experience. Since the appointed licensee has only four
  years, the appointment does not satisfy the requirement and must be replaced. Completing
  continuing education or obtaining a waiver is not permitted under this rule to substitute for the
  experience threshold.
