stem: On Friday, April 5, a broker obtains a sponsoring broker and the transferring licensee signs
  the transfer form. What is the last day the broker may file the completed form with the Commission
  to comply with the rule?
options:
  - Wednesday, April 10
  - Thursday, April 11
  - Friday, April 12
  - Monday, April 15
key: C
explanation: The rule requires the releasing broker to file the completed form within 5 business
  days of obtaining the signatures. Counting five business days from April 5 (starting April 8)
  leads to April 12 as the deadline. The option ‘Thursday, April 11’ is incorrect because it
  reflects only four business days.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2921(c)
  url: null
  quoted_text: The releasing broker must file a completed form with the Commission within 5 business
    days of obtaining a sponsoring broker and the transferring licensee’s signatures on the form.
