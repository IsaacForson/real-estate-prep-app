stem: A licensee receives an oral request from a buyer asking whether the property has ever been
  occupied by someone with HIV/AIDS. Under Del. Code Ann. tit. 24, ch. 29 § 2927(d), what must the
  licensee do?
options:
  - Answer truthfully to the best of their knowledge
  - Withhold any information about HIV/AIDS psychological impacts
  - Refer the buyer to a public health agency for clarification
  - Disclose the information only if the buyer provides written consent
key: B
explanation: Subsection (d) prohibits any disclosure of psychological impacts of HIV, AIDS, or other
  diseases deemed unlikely to be transmitted through occupancy, even if specifically asked.
  Therefore the licensee must withhold that information. The distractor 'Answer truthfully to the
  best of their knowledge' applies only to non‑HIV/AIDS psychological impacts under subsection (c)
  and is incorrect here.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 § 2927(d)
  url: null
  quoted_text: The owner, landlord or licensee shall not make any disclosure concerning those
    psychological impacts of HIV, AIDS, or any other disease which has been determined by medical
    evidence to be highly unlikely to be transmitted through the occupancy of a dwelling place even
    if a customer or client specifically asks about such psychological impacts.
