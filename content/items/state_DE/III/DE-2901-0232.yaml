stem: Under Del. Code Ann. tit. 24, ch. 29 § 2910(c), by what date must a licensee submit a renewal
  application and pay the required fee?
options:
  - The licensee must submit the renewal application on or before the biennial date established by
    the Division.
  - The licensee must submit the renewal application within 30 days after the biennial date.
  - The licensee must submit the renewal application within 60 days before the biennial date.
  - The licensee must submit the renewal application annually on the licensee's birthday.
key: A
explanation: The key is correct because § 2910(c) explicitly states that renewal applications and
  fees must be submitted on or before the biennial date set by the Division. The distractor that
  allows submission within 30 days after the biennial date is incorrect, as the statute does not
  provide any post‑deadline window; it requires filing on or before that date.
