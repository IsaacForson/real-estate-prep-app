stem: Under Del. Code Ann. tit. 24, ch. 29, what is the definition of a “Designated agent”?
options:
  - A licensee who has at least 5 years of continuous real estate services experience
  - A licensee appointed by the broker working with a customer or client as a statutory agent
  - A licensee who represents both buyer and seller as clients in a transaction
  - A licensee appointed by the Commission to oversee brokerage advertisements
key: B
explanation: Del. Code Ann. tit. 24, ch. 29 § 2901(10) defines a designated agent as a licensee
  appointed by the broker to work with a customer or client as a statutory agent. The option
  describing a licensee with at least five years of continuous experience refers to the requirement
  for a designated on‑site supervisor, not a designated agent. The option describing a licensee who
  represents both buyer and seller as clients describes dual agency, which is a different
  relationship. The option describing a licensee appointed by the Commission to oversee brokerage
  advertisements does not match the statutory definition of a designated agent.
