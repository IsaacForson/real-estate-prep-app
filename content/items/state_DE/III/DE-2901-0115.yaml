stem: A broker deposits earnest money from a client into the broker's personal checking account,
  which also holds the broker's operating funds. Under Del. Code Ann. tit. 24, ch. 29, does this
  account qualify as an escrow account?
options:
  - The account qualifies as an escrow account because the brokerage organization established it
  - The account does not qualify as an escrow account because it is not a separate account and is
    not used solely for the clients' moneys
  - The account does not qualify as an escrow account because the broker failed to obtain written
    consent from the client
  - The account qualifies as an escrow account because the funds belong to the client
key: B
explanation: An escrow account must be a separate account established by the brokerage organization
  used solely for moneys in which clients have an interest (§ 2901(14)). The personal account fails
  both the separation and exclusive use requirements. Stating that ownership of the funds alone
  satisfies the definition is incorrect.
citation:
