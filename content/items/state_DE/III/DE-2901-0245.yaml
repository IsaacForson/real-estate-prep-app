stem: A prospective buyer sends a written request to a licensee asking whether anyone has ever died
  in the property. Under Del. Code Ann. tit. 24, ch. 29 § 2927(c), what must the licensee do?
options:
  - The licensee must answer truthfully regarding the death inquiry.
  - The licensee must disclose that no deaths have ever occurred.
  - The licensee must refuse to answer the death question.
  - The licensee must state that deaths are not material facts to disclose.
key: A
explanation: When a customer makes a specific written request about psychological impacts, the
  licensee must answer the question truthfully to the best of their knowledge. The licensee is not
  required to volunteer additional information or to deny the occurrence. The distractor that
  insists on disclosing that no deaths occurred adds a substantive claim not mandated by the rule.
