stem: An applicant had their real estate license revoked in another state solely for failure to pay
  renewal fees. Under Delaware law, is this revocation a basis for denying licensure?
options:
  - Under Delaware law, the revocation is grounds for denial because any license revocation
    disqualifies an applicant.
  - Under Delaware law, the revocation is not grounds for denial because the exception excludes
    revocations for nonpayment of renewal fees.
  - Under Delaware law, the revocation is grounds for denial unless the applicant pays the
    outstanding fees.
  - Under Delaware law, the revocation is not grounds for denial, but only if the revocation
    occurred more than five years ago.
key: B
explanation: Under Del. Code Ann. tit. 24, ch. 29 § 2907(a)(2), license revocations for nonpayment
  of renewal fees are excluded from the list of disqualifying administrative penalties. Therefore,
  such a revocation does not bar licensure. The statement that any license revocation disqualifies
  an applicant is incorrect.
