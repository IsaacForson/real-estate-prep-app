stem: A consumer obtains a final judgment against a licensee for $60,000 due to fraud. What is the
  maximum amount recoverable from the Real Estate Guaranty Fund under § 2922(a)?
options:
  - $10,000
  - $25,000
  - $60,000
  - $50,000
key: D
explanation: § 2922(a) limits Guaranty Fund recovery to $50,000 per transaction or claim, regardless
  of the judgment amount. Thus the maximum recoverable is $50,000, not the full $60,000 judgment.
  The distractor $60,000 incorrectly assumes the Fund pays the entire judgment.
