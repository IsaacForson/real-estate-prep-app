stem: A licensee completes an out-of-state continuing education course that covers Module 3 content.
  Under 24 Del. Admin. Code § 2900, what is true regarding Module 7 credit for this course?
options:
  - The licensee cannot receive any continuing education credit for this out-of-state course.
  - The licensee must complete an additional three hours of Module 7 coursework.
  - The licensee automatically receives Module 7 credit for this out-of-state course.
  - The licensee must submit a separate application for Module 7 approval for this out-of-state
    course.
key: D
explanation: The provision that courses approved for Modules 1–6 automatically qualify for Module 7
  credit does not apply to out-of-state courses. Therefore, the licensee must seek separate approval
  for Module 7 credit. The distractor claiming automatic credit is incorrect because the exemption
  excludes out‑of‑state courses.
