stem: A broker opens an escrow account at a bank located in Pennsylvania but maintains an office in
  Delaware. Under 24 Del. Admin. Code § 2900-6.4, is the escrow account valid for the broker’s
  license?
options:
  - The escrow account is valid because the broker maintains a Delaware office
  - The escrow account is valid because the broker can use any U.S. bank
  - The escrow account is invalid because the bank must have an office located in Delaware
  - The escrow account is invalid because the broker must also maintain a separate trust account for
    clients
key: C
explanation: The rule explicitly states that an escrow account must be opened and maintained in a
  bank with an office located in Delaware. A bank in Pennsylvania without a Delaware office does not
  satisfy this requirement, making the account invalid. Merely having a Delaware office does not
  override the bank location requirement.
