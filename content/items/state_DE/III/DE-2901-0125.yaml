stem: A buyer and seller sign a purchase agreement on a Monday morning. Under Del. Code Ann. tit.
  24, ch. 29 § 2923(d), when must the broker deposit the earnest money into the escrow account?
options:
  - Within 48 hours
  - Within 72 hours
  - Within 24 hours
  - Within 96 hours
key: B
explanation: The rule requires the broker to deposit the funds within 72 hours of the signing of the
  written agreement, excluding weekends and federal holidays. The 24‑hour option imposes a stricter
  deadline than the statute allows, while the 96‑hour option allows too much time.
citation:
