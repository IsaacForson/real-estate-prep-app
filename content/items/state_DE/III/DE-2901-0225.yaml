stem: A licensee wants to name their team 'Capital Realty Associates'. Under 24 Del. Admin. Code §
  2900-8.5.2.1 and § 2900-8.5.2.2, which part of the name violates the team naming rules?
options:
  - A. The term "Capital"
  - B. The term "Realty"
  - C. The term "Associates"
  - D. The term "Team"
key: B
explanation: Under 24 Del. Admin. Code § 2900-8.5.2.2, a team name may not include terms suggesting
  a separate brokerage such as 'Realty', 'Real Estate', or 'Realtors'. The name must also include
  'team', 'group', or 'associates' to satisfy the inclusion requirement. In 'Capital Realty
  Associates', the term 'Realty' violates the prohibition, while 'Associates' satisfies the
  inclusion requirement.
