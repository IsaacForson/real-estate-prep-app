stem: A broker maintains an escrow account at a Delaware bank and occasionally transfers money from
  the account to cover the brokerage’s monthly office rent. Under Delaware law, is this permissible?
options:
  - The broker may use the escrow account for office rent with client consent
  - The broker may use the escrow account for office rent if funds returned
  - The broker may use the escrow account for office rent to cover fees
  - The broker may not use the escrow account for office rent
key: D
explanation: Except for the minimum balance and money to cover bank fees, the escrow account shall
  be used only for escrow deposits, earnest money deposits, rental money, or other moneys in which
  clients have an interest (§ 2923(a)(3)). Using the account for office rent is not permitted.
