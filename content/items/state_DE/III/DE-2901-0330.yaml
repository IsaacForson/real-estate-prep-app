stem: Under 24 Del. Admin. Code § 2900-15.5, what is the consequence if a licensee fails to
  cooperate fully with the Voluntary Treatment Option?
options:
  - The licensee will have their license automatically suspended.
  - The licensee will receive a written warning only.
  - The licensee will be disqualified from the program and may be investigated.
  - The licensee will be required to attend a remedial education course.
key: C
explanation: The rule states that failure to cooperate fully may disqualify the licensee from the
  Voluntary Treatment Option and trigger an immediate investigation and disciplinary proceedings.
  Therefore, disqualification and possible investigation is the correct consequence. Automatic
  suspension is not provided for under this provision; the rule only mentions disqualification and
  investigation, not suspension.
citation:
  source: 24 Del. Admin. Code § 2900-15.5
  url: null
  quoted_text: Failure to cooperate fully with the participating Board chairperson or that
    chairperson's designate or designates or the Director of the Division of Professional Regulation
    or the chairperson’s designate in regard to the Voluntary Treatment Option or to comply with
    their requests for evaluations and screens may disqualify the regulated professional from the
    provisions of the Voluntary Treatment Option, and the participating Board chairperson or that
    chairperson's designate or designates shall cause to be activated an immediate investigation and
    institution of disciplinary proceedings, if appropriate.
