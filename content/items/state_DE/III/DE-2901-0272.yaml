stem: A brokerage hires a licensee as a common law agent to assist a client in a purchase
  transaction. The licensee negligently misstates the property’s square footage. Is the broker
  vicariously liable for the licensee’s error under Delaware law?
options:
  - Yes, the broker is vicariously liable for the licensee’s mistake regardless of agency type
  - Yes, but only if the licensee is classified as an employee of the broker
  - No, because §2937(e) does not apply when the licensee is hired as a common law agent
  - No, because brokers are not liable for licensees working as independent contractors
key: C
explanation: Section 2937(e) expressly states that the vicarious liability rule does not apply if
  the licensee or brokerage organization is hired as a common law agent, so the broker is not liable
  in this scenario.
