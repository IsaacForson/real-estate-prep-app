stem: A licensee creates a billboard advertising only their own name and phone number for personal
  promotion. Under 24 Del. Admin. Code § 2900-8.6.5.5, what must the advertisement also include?
options:
  - The licensee's name and phone number only
  - The brokerage name and office phone
  - The team name and email address
  - The property address and asking price
key: B
explanation: The rule requires that all advertisements for personal promotion of licensees include
  the complete brokerage organization name and the office phone number registered with the
  Commission. Therefore, the advertisement must also include the brokerage name and office phone.
  The distractor "The licensee's name and phone number only" is incorrect because it omits the
  required brokerage name and office phone number.
