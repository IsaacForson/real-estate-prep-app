stem: A 22-year-old applicant wishes to obtain an associate broker license. According to
  §2907(c)(2), is the applicant eligible?
options:
  - Yes, if the applicant has passed the broker examination
  - No, because the applicant lacks the required experience
  - Yes, because the applicant is over 18 years of age
  - No, because the applicant is under 23 years of age
key: D
explanation: The associate broker provision requires the applicant to be at least 23 years of age.
  Since the applicant is only 22, they do not meet this age requirement and are therefore
  ineligible. The distractor suggesting eligibility based on being over 18 is wrong because the
  associate broker category has a higher age threshold than the salesperson category.
