stem: A Delaware licensee advertises a residential property for sale that is listed with Broker XYZ.
  The advertisement includes the licensee’s name and phone number but does not show the brokerage
  name. Under 24 Del. Admin. Code § 2900-8.6.5.3, what must the licensee do to comply with the rule?
options:
  - The licensee should add the brokerage organization name only, displaying it the same size as the
    licensee’s name.
  - The licensee should add the brokerage organization name and phone number, displaying them more
    prominently than the licensee’s name.
  - The licensee should add the brokerage organization phone number only, displaying it more
    prominently than the licensee’s name.
  - The licensee should leave the advertisement unchanged because the licensee’s name is sufficient.
key: B
explanation: The regulation requires that any advertisement for a listed property include the
  brokerage organization’s name and phone number, and that these be displayed more prominently than
  the licensee’s name. Adding only the name or only the phone number, or leaving the ad unchanged,
  fails to meet both the content and prominence requirements.
citation:
  source: 24 Del. Admin. Code § 2900-8.6.5.3
  url: null
  quoted_text: Any Licensee who advertises any real property for sale, lease, exchange, or transfer
    that is listed with a Broker shall include in the advertisement the complete Brokerage
    Organization name that has been registered with the Commission, and Brokerage Organization phone
    number registered by the Broker with the Commission for that office location. The advertisement
    shall prominently display the Brokerage Organization name and phone number in greater size and
    visibility than the Licensee’s name.
