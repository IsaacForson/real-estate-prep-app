stem: Under 24 Del. Admin. Code § 2900-8.6, which of the following fits the regulatory definition of
  “Advertising”?
options:
  - Printed newspaper announcements placed by a formally registered Brokerage Organization
  - Verbal statements made privately between a Licensee and one client
  - Internal office memos circulated among Licensees at the same brokerage
  - A written, visual, or electronic ad promoting a Licensee's real estate services
key: D
explanation: Rule 8.6.2 broadly defines Advertising to include any written, visual, printed, or
  electronically generated communication promoting a Licensee's services, well beyond print ads or
  private or internal communications.
citation:
  source: 24 Del. Admin. Code § 2900-8.6
  url: null
  quoted_text: “ Advertising ” means the use of any written, visual, printed, or electronically
    generated advertisement by a real estate Licensee or any other person on behalf of a real estate
    Licensee including, but not limited to any correspondence, mailing, newsletter, brochure,
    business card, for sale or for lease signage or sign rider, billboards, promotional items,
    automobile signage, telephone directory listing, radio and television broadcasts, telephone
    solicitation and electronic media to include emails, text messaging, public blogs, podcasts,
    social media networking websites or internet displays.
