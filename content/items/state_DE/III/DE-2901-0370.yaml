stem: A licensee is preparing to take a written listing agreement for a residential property. The
  seller has not yet provided a Condition Report. What must the licensee do before accepting the
  listing agreement?
options:
  - The licensee must obtain a Condition Report from the seller prior to accepting the listing
    agreement.
  - The licensee must inform the buyer that a Condition Report is not required for residential
    property transactions.
  - The licensee must accept the listing agreement without obtaining a Condition Report from the
    seller.
  - The licensee must provide a Radon Disclosure in lieu of obtaining a Condition Report from the
    seller.
key: A
explanation: The regulation obligates licensees to obtain a Condition Report from the seller before
  accepting a written listing agreement for residential property. Accepting the agreement without
  the report violates this requirement, even if a Radon Disclosure is provided instead.
citation:
  source: 24 Del. Admin. Code § 2900-10.7.1
  url: null
  quoted_text: Licensees shall obtain a Condition Report from the seller of residential property prior
    to accepting a written listing agreement and shall make the Condition Report available to any
    buyer.
