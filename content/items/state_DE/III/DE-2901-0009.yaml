stem: A Broker wants to pay part of a commission to an unlicensed referral source as a finder's fee,
  with no written cooperation or affiliation agreement signed by the parties. Under 24 Del. Admin.
  Code § 2900-8.8, is this payment permitted?
options:
  - Yes, because finder's fees to unlicensed persons need no written agreement
  - Yes, because commissions may be shared freely with any referral source
  - No, because such a finder's fee needs a signed written cooperation agreement
  - No, because unlicensed persons cannot legally receive any real estate commission income
key: C
explanation: Rule 8.8.1 permits a finder's fee or similar compensation to an unlicensed person only
  when it is paid pursuant to a written cooperation or affiliation agreement signed by all parties.
citation:
  source: 24 Del. Admin. Code § 2900-8.8
  url: null
  quoted_text: Licensees cannot use commissions or income received from commissions as rebates or
    compensation paid to or given to non-licensed persons, partnerships or corporations as
    inducements to do or secure business, or as a finder's fee, unless those fees are paid pursuant
    to a written cooperation or affiliation agreement signed by all parties as permitted under 24
    Del.C. Ch. 29 and these Rules and Regulations.
