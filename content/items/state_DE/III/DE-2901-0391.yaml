stem: Under 24 Del. Admin. Code § 2900-10.2, how many days does a licensee have to purchase and
  settle for the property if no sales agreement is executed during the term of the listing?
options:
  - 30 days
  - 90 days
  - 45 days
  - 60 days
key: D
explanation: The rule states that a licensee who advertises 'If we cannot sell your home, we will
  buy your home' must have no more than sixty (60) days to purchase and settle for the property
  after the listing expires. Therefore the correct answer is sixty days. The distractor of
  forty‑five days incorrectly applies a shorter period that is not mentioned in the rule.
