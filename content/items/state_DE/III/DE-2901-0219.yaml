stem: A property is under an agreement of sale but is left on the market for backup offers. Under 24
  Del. Admin. Code § 2900-10.6, what must the listing broker disclose in writing to an individual
  who inquires about the property at the time of initial inquiry?
options:
  - the property’s listing price
  - the seller’s Condition Report
  - the existence of such agreement
  - the broker’s contact information
key: C
explanation: The rule requires the listing broker to disclose in writing the existence of an
  agreement for backup offers or a right of first refusal to anyone who inquires about the property
  at the time of the initial inquiry. The distractor about the property’s listing price is incorrect
  because this provision does not require price disclosure; it only mandates disclosure of the
  agreement’s existence.
citation:
  source: 24 Del. Admin. Code § 2900-10.6
  url: null
  quoted_text: If a property is the subject of an agreement of sale or lease but being left on the
    market for backup offers, or is the subject of an agreement of sale or lease which contains a
    right of first refusal clause, the existence of such agreement shall be disclosed in writing by
    the listing Broker to any individual who inquires about such property at the time such initial
    inquiry is made.
