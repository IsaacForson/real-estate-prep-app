stem: Under Delaware law, for a 1-to-4 family residence marketed for sale, a licensee working for
  the buyer is presumed to be what?
options:
  - A statutory agent representing the buyer
  - A statutory agent representing the seller
  - A statutory agent representing both parties
  - A common law agent representing the buyer
key: A
explanation: The statute expressly states that for properties marketed for sale of 1-to-4 family
  residences, the licensee working for the buyer is presumed to be a statutory agent representing
  the buyer. The other options describe different presumptions or a common law agency relationship,
  which are not supported by the cited provision.
