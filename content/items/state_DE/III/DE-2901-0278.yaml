stem: A licensee moves to a new residence but fails to inform the Division of Professional
  Regulation of the change. Later, a notice of a disciplinary hearing is mailed to the licensee’s
  former address. Under 24 Del. Admin. Code § 2900-1.5, how is this notice treated?
options:
  - Notices sent to the old address must be resent to the new address.
  - Notices sent to the old address are considered proper notice under the rule.
  - Notices sent to the old address are subject to a fine for improper service.
  - Notices sent to the old address are considered invalid because the licensee did not update the
    address.
key: B
explanation: The rule provides that failure to provide a current address will not excuse any duty or
  responsibility and that confirmed delivery to the most recent address will be considered proper
  notice. Hence a notice mailed to the old address remains proper. The distractor claiming the
  notice is invalid is incorrect because the rule expressly states that failure to update does not
  invalidate service to the most recent address.
