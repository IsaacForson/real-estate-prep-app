stem: If a licensee requests a continuance of the hearing date after receiving a temporary
  suspension order, how long may the suspension remain in effect under Del. Code Ann. tit. 24, ch.
  29 § 2915(a)?
options:
  - Until 90 days have passed from the issuance of the order
  - Until the Commission convenes and renders a decision
  - Until 60 days have passed from the issuance of the order
  - Until 30 days have passed from the issuance of the order
key: B
explanation: If a continuance is requested, the temporary suspension stays in effect until the
  Commission convenes and renders a decision, per §2915(a). A fixed day limit such as 30 days only
  applies when no continuance is requested.
