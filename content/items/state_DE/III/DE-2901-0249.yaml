stem: Under 24 Del. Admin. Code § 2900-1.3.3, what is the minimum continuous real estate services
  experience required for a Designated On-Site Supervisor?
options:
  - Three (3) years
  - Five (5) years
  - Seven (7) years
  - Ten (10) years
key: B
explanation: The rule states that a Designated On-Site Supervisor must be a licensee with a minimum
  of five (5) years of continuous Real Estate Services experience. Therefore, five years is the
  correct answer. Three years is insufficient because it does not meet the five‑year threshold set
  by the regulation.
