stem: A Commission member who is a licensed broker misses three consecutive regular business
  meetings without adequate reason. Under Del. Code Ann. tit. 24, ch. 29 § 2903(g), what is the
  consequence?
options:
  - The member is automatically removed from the Commission.
  - The member is considered guilty of neglect of duty.
  - The member must attend a makeup meeting within 30 days.
  - The member is subject to a fine of $500.
key: B
explanation: The statute provides that any member absent without adequate reason for 3 consecutive
  meetings shall be guilty of neglect of duty. Therefore, the member is considered guilty of neglect
  of duty. The distractor about a $500 fine is not mentioned in this subsection, and removal or a
  makeup meeting are not automatic consequences under this rule.
