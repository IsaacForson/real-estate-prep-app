math:
  worked_solution: "Start date: April 15. Add 15 days to reach April 30. Remaining days: 60 - 15 = 45.
    Add 31 days to reach May 31. Remaining days: 45 - 31 = 14. Add 14 days to reach June 14.
    Therefore, the deadline is June 14."
  formulas:
    - deadline = judgment date + 60 days
