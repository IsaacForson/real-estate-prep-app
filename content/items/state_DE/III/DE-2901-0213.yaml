stem: A consumer obtains a final judgment on April 15. By what date must they file a verified claim
  with the Commission to be eligible for payment from the Real Estate Guaranty Fund?
options:
  - June 12
  - June 14
  - June 10
  - June 16
key: B
explanation: The Guaranty Fund provision requires a verified claim to be filed within 60 days after
  the final judgment is obtained. Adding 60 days to April 15 yields June 14 as the final permissible
  date. The option ‘June 12’ is incorrect because it falls two days short of the 60‑day period.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 — Delaware Code Title 24, Chapter 29 - Real Estate Services,
    Brokers, Associate Brokers and Salespersons (Subchapters I-II) § 2922(b)
  url: null
  quoted_text: The verified claim shall be filed within 60 days after the final judgment has been obtained.
