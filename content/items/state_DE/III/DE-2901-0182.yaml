math:
  worked_solution: "Identify the judgment amount: $75,000. Identify the statutory cap per transaction
    under § 2922(a): $50,000. The recoverable amount is the lesser of the judgment and the cap,
    which is $50,000."
  formulas:
    - Recoverable = min(Judgment amount, Statutory cap)
