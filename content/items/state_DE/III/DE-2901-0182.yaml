stem: A consumer obtains a final judgment of $75,000 against a licensee for fraud in a real estate
  transaction. Under § 2922(a), what is the maximum amount the consumer may recover from the Real
  Estate Guaranty Fund for this transaction?
options:
  - $25,000
  - $50,000
  - $75,000
  - $100,000
key: B
explanation: The statute caps recovery at $50,000 per transaction or claim, regardless of the
  judgment amount. Therefore, even with a $75,000 judgment, the maximum recoverable is $50,000. The
  distractors either understate the cap, equal the judgment, or exceed it.
citation:
  source: Del. Code Ann. tit. 24, ch. 29 § 2922(a)
  url: null
  quoted_text: may recover, after a hearing and on order of the Commission, compensation in an amount
    not exceeding in the aggregate the sum of $50,000 in connection with any 1 transaction or claim,
    regardless of the number of persons aggrieved or parcels of real estate involved in such
    transaction or claim.
