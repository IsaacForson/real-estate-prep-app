stem: A licensee with 4 years and 11 months of continuous real estate services experience is
  appointed as the full-time supervisor of a branch office. Under Del. Code Ann. tit. 24, ch. 29 §
  2901(11), is this appointment permissible?
options:
  - According to the definition, the appointment is permissible because the licensee has nearly 5
    years of experience.
  - According to the definition, the appointment is not permissible because the experience
    requirement is not met.
  - According to the definition, the appointment is permissible because the licensee holds a broker
    license.
  - According to the definition, the appointment is permissible because the broker approved the
    appointment.
key: B
explanation: The definition requires at least 5 years of continuous real estate services experience
  for a designated on‑site supervisor. The licensee has only 4 years and 11 months, which is less
  than 5, so the appointment is not permissible. The distractor suggesting approval by the broker
  overrides the requirement is incorrect because the experience threshold is mandatory regardless of
  broker approval.
citation:
