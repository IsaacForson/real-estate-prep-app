stem: A salesperson currently licensed in good standing in another state has only 18 months of
  continuous licensure there. Under Delaware reciprocal licensure rules, what must they do to obtain
  a Delaware salesperson license?
options:
  - They must submit proof of current licensure in good standing and pay the reciprocal licensure
    fee as required by the Commission.
  - They must complete the Delaware law portion of the prelicensing course and pass the state
    portion of the Delaware licensing examination.
  - They must have at least three years of continuous licensure in the other state and pass the
    state portion of the examination.
  - They must complete the full prelicensing course for brokers and pass the national portion of the
    examination.
key: B
explanation: Under Del. Code Ann. tit. 24, ch. 29, § 2909(b)(2), a salesperson with less than three
  years of licensure in another state must complete the Delaware law portion of the prelicensing
  course and pass the state portion of the examination. The option stating they must have at least
  three years of continuous licensure in the other state and pass the state portion of the
  examination adds a requirement not found in the statute, making it incorrect.
