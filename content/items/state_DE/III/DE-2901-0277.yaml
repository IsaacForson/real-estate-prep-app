stem: A licensee changes residence on May 10 and notifies the Division of Professional Regulation of
  the new address on June 5. Under 24 Del. Admin. Code § 2900-1.5, is the licensee in compliance
  with the address‑reporting requirement?
options:
  - The licensee is non‑compliant with the address reporting requirement.
  - The licensee is subject to disciplinary action for late reporting.
  - The licensee is compliant with the address reporting requirement.
  - The licensee is exempt from the address reporting requirement.
key: C
explanation: The rule requires address changes to be reported within thirty days. Moving on May 10
  gives a deadline of June 9; reporting on June 5 meets this deadline, so the licensee is compliant.
  The distractor “non‑compliant” is wrong because the notice was made within the required thirty‑day
  period.
