stem: A licensee receives a commission check and places it in the brokerage's escrow account but
  waits two weeks before recording the receipt in the brokerage's books. Which Delaware rule has the
  licensee violated?
options:
  - The duty to cooperate with other licensees
  - The duty to disclose adverse material facts
  - The duty to hold the escrow deposit when requested
  - The duty to account for money in a timely manner
key: D
explanation: The licensee violated the duty to account for money in a timely manner by delaying the
  recording of the commission check receipt for two weeks. The statute requires licensees to account
  for all money and property received in a timely manner. The distractor about holding escrow
  deposits is incorrect because the funds were properly placed in the escrow account; the issue is
  the delayed accounting, not a failure to hold.
