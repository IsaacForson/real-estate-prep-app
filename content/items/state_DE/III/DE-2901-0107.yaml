stem: A broker opens a branch office and appoints a salesperson with three years of experience as
  the Designated On-Site Supervisor. Under 24 Del. Admin. Code § 2900-1.3.3, is this permissible?
options:
  - Yes, because the salesperson qualifies as a licensee
  - No, because the supervisor needs five years of continuous experience
  - Yes, if the broker co-signs the supervisor's continuing education logs
  - No, because the supervisor must be a broker, not a salesperson
key: B
explanation: The rule requires the Designated On-Site Supervisor to be a licensee with a minimum of
  five years of continuous real estate services experience. A salesperson with only three years does
  not meet this requirement, regardless of co-signing CE logs or being a broker.
