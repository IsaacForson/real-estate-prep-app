stem: Under Delaware law, what is a Consumer Information Statement (CIS)?
options:
  - The disclosure form required by §2938
  - A licensee's continuing education record
  - A broker's escrow account statement
  - A property condition disclosure form
key: A
explanation: The definition in §2902 explicitly states that a Consumer Information Statement (CIS)
  is the disclosure form required by §2938. The other options describe unrelated documents such as
  continuing education records, escrow statements, or property condition reports, which are not
  defined as the CIS.
