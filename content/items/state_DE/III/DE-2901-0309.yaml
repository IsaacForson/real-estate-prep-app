  - 30 business days
  - 10 business days
  - 20 business days
key: D
explanation: According to the rule, licensees selected for random audit must submit verification
  within twenty (20) business days of receipt of the audit notice, so twenty business days is the
  required timeframe. Ten business days is insufficient; the rule requires twenty business days.
