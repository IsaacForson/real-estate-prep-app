stem: "Under § 2912(a)(10) of the Delaware Real Estate Services law, a licensee may be subject to
  disciplinary sanctions if they:"
options:
  - Receiving a referral fee with written disclosure to both the client and the payor.
  - Receiving a salary from the employing broker for office work performed.
  - Receiving a thank‑you card from a client after closing with no monetary value.
  - Receiving a referral fee without written disclosure to the client and the payor.
key: D
explanation: Under Del. Code Ann. tit. 24, ch. 29, § 2912(a)(10), a licensee may be disciplined for
  receiving any valuable consideration in a real estate services transaction without prior written
  disclosure to both the client and the payor. The option that describes receiving a referral fee
  without such written disclosure therefore constitutes a violation. The option describing a
  referral fee with written disclosure to both the client and the payor includes the required
  disclosure and is permissible. Receiving a salary from the employing broker for office work is
  compensation for employment, not a referral fee for a transaction, and thus does not trigger the
  provision. A thank‑you card from a client after closing has no monetary value and is not valuable
  consideration, so it also does not violate the rule.
