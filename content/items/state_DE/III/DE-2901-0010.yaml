stem: A licensee's Delaware license has been expired for three years, and during that time the
  licensee was actively licensed and practicing in another state for over a year. Under 24 Del.
  Admin. Code § 2900-13.1, what examination requirement applies to reinstatement?
options:
  - No additional examination before reinstatement
  - Retaking the full pre-licensing course before any exam
  - Passing both the general and state portions of the examination
  - Passing the state portion of the examination
key: D
explanation: Rule 13.1.3.2 reduces the reinstatement burden to the state portion of the examination
  when the licensee was actively licensed and practicing in another state for at least one of the
  two years before applying.
citation:
  source: 24 Del. Admin. Code § 2900-13.1
  url: null
  quoted_text: If the license has been expired for two years or more and the licensee has been
    actively licensed and practicing in another state for at least one of the two years immediately
    prior to making application for reinstatement, the licensee shall only be required to pass the
    state portion of the examination.
