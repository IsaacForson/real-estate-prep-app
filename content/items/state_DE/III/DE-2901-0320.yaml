stem: A licensee receives an earnest money check and, instead of holding it as requested by the
  client, deposits it into their personal checking account. Under Del. Code Ann. tit. 24, ch. 29 §
  2935(b)(4), what is the licensee's obligation?
options:
  - Hold the escrow deposit as requested by the client.
  - Deposit the funds into any account and keep records.
  - Invest the funds in an interest-bearing account promptly.
  - Notify the Commission before depositing any funds.
key: A
explanation: The rule mandates that licensees hold the escrow deposit when requested by the customer
  or client. Depositing the money into a personal account fails to satisfy this duty. The distractor
  suggesting depositing into any account ignores the specific obligation to hold the deposit.
