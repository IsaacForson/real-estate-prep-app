stem: A licensee advertises a property on an internet website that they do not own or control, and
  the website's terms of use limit the licensee's ability to display the firm's name and telephone
  number directly. According to Georgia Real Estate Commission rules, what must the licensee do to
  comply with the advertising rule?
options:
  - Provide a direct link to a compliant display on every viewable webpage
  - Include the firm's details in the website's metadata tags for compliance
  - Display the firm's name and number in the website footer only
  - Obtain written permission from the website owner to post the information
key: A
explanation: When advertising on a third‑party website that limits direct compliance, the licensee
  must provide a direct link to a compliant display on every viewable webpage. The distractor
  suggesting a footer‑only display does not satisfy the requirement for every viewable page.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.09(5)(b)
  url: null
  quoted_text: When advertising real estate for sale, rent, lease or exchange on an internet website
    not owned or controlled by the licensee or firm with which the licensee is affiliated and that
    website's terms of use limit the licensee's ability to comply with this paragraph, the
    advertising shall provide a direct link to a display that is in compliance with this Rule on
    every viewable webpage of the website.
