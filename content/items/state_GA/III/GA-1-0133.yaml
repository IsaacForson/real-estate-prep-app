stem: A licensee receives an offer to purchase property from a buyer who is not a client or customer
  of the licensee. According to Georgia Real Estate Commission rules, what must the licensee do with
  the offer?
options:
  - Keep the offer confidential until the transaction closes and all parties are notified
  - Accept the offer immediately on behalf of the buyer and inform the seller promptly
  - Negotiate directly with the buyer without involving any other licensee or the firm
  - Provide a copy of the offer to the licensee working with or representing the offeree and retain
    a copy for the file
key: D
explanation: Rule 520-1-.10(1) requires that when the offeror is not a client or customer, the
  licensee receiving the offer must provide a copy to the licensee working with or representing the
  offeree. Keeping the offer confidential or accepting it directly violates this duty. Negotiating
  directly is only permitted if the offeree has a written agreement barring the other licensee from
  negotiation services.
