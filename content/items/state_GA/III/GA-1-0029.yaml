stem: A licensee receives a commission and wishes to rebate part of it to the principal. According
  to Georgia Real Estate Commission rules, which condition must be satisfied for the rebate to be
  permissible?
options:
  - The rebate must be disclosed on the closing statement and not mislead about funds.
  - The rebate must be given to the principal prior to the closing of the transaction.
  - The rebate must be approved by the Georgia Real Estate Commission before it is given.
  - The rebate must be limited to ten percent of the commission received by the principal.
key: A
explanation: The rule permits a licensee to rebate any part of a commission, fee, or other
  compensation received related to a real estate transaction as long as the rebate is disclosed on
  the closing statement for that transaction and does not mislead any other party regarding the
  source of funds or financial resources. Therefore, the correct condition is disclosure on the
  closing statement and no misleading about funds. The option requiring the rebate to be given
  before closing is incorrect because the rule does not impose a timing restriction before closing,
  only a disclosure requirement on the closing statement.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.10(6)(e)
  url: null
  quoted_text: A licensee may rebate to a principal any part of a commission, fee, or other
    compensation received by the licensee related to the purchase, sale, lease or exchange of real
    estate as long as said rebate is disclosed on the closing statement for that transaction and as
    long as the rebate does not mislead any other licensee, other principal, lender, title company
    or government agency involved in the transaction regarding the source of funds to complete the
    transaction or regarding the financial resources or obligations of a buyer principal.
