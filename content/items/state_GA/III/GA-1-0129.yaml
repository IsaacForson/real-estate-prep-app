stem: According to Georgia Real Estate Commission rules, what must a broker do with copies of
  required records when requested by an authorized agent of the Commission?
options:
  - Provide the copies to the Commission free of charge upon request.
  - Provide the copies to the Commission only if a court order is presented.
  - Provide the copies to the Commission at a reasonable cost upon request.
  - Provide the copies to the Commission only after obtaining a written request.
key: C
explanation: The rule states that copies of required records must be made available to authorized
  agents of the Commission upon reasonable request and at a reasonable cost to the Commission.
  Therefore, the broker may charge a reasonable cost. Providing the copies free of charge is
  incorrect because the rule does not require free provision; it permits a reasonable charge.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
