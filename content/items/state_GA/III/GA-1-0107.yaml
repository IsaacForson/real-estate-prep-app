stem: A licensee prepares an offer to purchase property on behalf of a buyer. The buyer's broker is
  from XYZ Firm with license number 112233, and the seller's broker is from ABC Firm with license
  number 445566. According to Georgia Real Estate Commission rules, what must the licensee include
  in the offer?
options:
  - The license numbers of both firms only
  - The license number of the buyer's broker only
  - The license numbers of the licensee and the buyer's broker
  - The license numbers of both firms and each licensee
key: D
explanation: The rule obligates a licensee preparing or signing an offer to include the Commission
  license number of each firm and each licensee participating in the transaction, per §
  520-1-.10(2). The distractor "The license numbers of both firms only" omits the required license
  numbers of the licensee and the other brokers.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
