stem: According to Georgia Real Estate Commission rules, what constitutes prohibited misleading
  advertising?
options:
  - It is prohibited to advertise real estate with misleading or inaccurate information about any
    material fact.
  - It is prohibited to advertise real estate only if the advertisement contains false statements
    about price.
  - It is prohibited to advertise real estate without including the firm's telephone number.
  - It is prohibited to advertise real estate unless the licensee has written permission from the
    owner.
key: A
explanation: The rule prohibits any advertising that is misleading or inaccurate regarding any
  material fact of the property. Therefore, the statement that it is prohibited to advertise real
  estate with misleading or inaccurate information about any material fact is correct. The
  prohibition is not limited to false statements about price, so the claim that it applies only to
  price is incorrect. The rule does not require advertisements to include the firm's telephone
  number, making the telephone‑number requirement incorrect. Likewise, the rule does not mandate
  written permission from the property owner before advertising, so the owner‑permission requirement
  is also incorrect. See Ga. Comp. R. & Regs. § 520-1-.09.
