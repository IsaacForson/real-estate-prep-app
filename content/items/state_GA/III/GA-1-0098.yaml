stem: A licensee refers a principal to another broker for relocation services. The broker who
  receives the referral expects to receive a referral fee. According to Georgia Real Estate
  Commission rules, when must the disclosure of this fee be made to the principal?
options:
  - Disclose the fee in writing to the principal by the referral broker before closing.
  - Tell the principal verbally about the fee when the referral is made.
  - Disclose the fee in writing to the principal only if they request it.
  - Disclose the fee in writing to the principal after the closing documents are signed.
key: A
explanation: Under Ga. Comp. R. & Regs. § 520-1-.10, the broker who receives a referral must
  disclose any referral fee in writing to the principal no later than the closing of the
  transaction. Therefore, the correct choice is the one that requires written disclosure by the
  referral broker before closing. The option that suggests a verbal disclosure at the time of
  referral is incorrect because the rule requires written disclosure and allows it to be made up to
  closing, not earlier. The option that limits disclosure to only when the principal requests it is
  incorrect because the rule mandates disclosure regardless of a request. The option that calls for
  disclosure after the closing documents are signed is incorrect because the rule requires the
  disclosure to be made no later than closing, i.e., before or at that point.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.10
  url: null
  quoted_text: In a transaction where a licensee refers a principal to another broker for brokerage or
    relocation services (and the broker to whom the principal is referred knows of the referral and
    the referring licensee's expectation of receiving a commission, fee or other thing of value for
    the referral), the payment of a commission, fee or other thing of value to the referring
    licensee by the broker working with the principal shall be disclosed in writing to the principal
    by the broker to whom the referral was made no later than at the closing of the purchase, sale,
    exchange, or lease, of any property in a transaction where a commission, fee or other thing of
    value will be paid by the broker to the referring licensee.
