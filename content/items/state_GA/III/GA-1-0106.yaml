stem: According to Georgia Real Estate Commission rules, what must a licensee do with copies of any
  document utilized in a real estate transaction?
options:
  - To provide a copy to any individual signing the document
  - To provide a copy to the principal and any witnesses
  - To provide a copy to the brokerage firm and the licensee
  - To provide a copy to the licensee's supervising broker
key: A
explanation: The rule requires a licensee to provide a copy of any document utilized in a real
  estate transaction to any individual signing that document, as stated in § 520-1-.10(3). The
  distractor "To provide a copy only to the brokerage firm" is incorrect because the rule mandates
  distribution to signing individuals, not exclusively to the firm.
