stem: A licensee receives a signed offer to purchase a property from a prospective buyer who is not
  the licensee's client. According to Ga. Comp. R. & Regs. § 520-1-.10(1), what action must the
  licensee take?
options:
  - Provide a copy of the offer to the licensee representing the seller
  - Provide a copy of the offer to the buyer's attorney for review
  - Provide a copy of the offer to the Georgia Real Estate Commission
  - Provide a copy of the offer to the licensee's supervising broker
key: A
explanation: When the person making the offer is not a client or customer, the licensee who receives
  the offer must give a copy to the licensee who is working with or representing the offeree, as
  required by Ga. Comp. R. & Regs. § 520‑1‑.10(1). Because the seller is the offeree, the copy must
  be provided to the seller’s licensee. Sending the offer to the Georgia Real Estate Commission, the
  supervising broker, or the buyer’s attorney is not required by this rule.
