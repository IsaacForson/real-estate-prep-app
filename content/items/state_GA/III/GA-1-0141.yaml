stem: According to Georgia Real Estate Commission rules, what must a licensee do before advertising
  any real estate for sale, rent, lease, or exchange?
options:
  - Obtaining verbal approval from the property owner
  - Securing written permission of the owner or authorized agent
  - Including a disclaimer that the advertisement is not an offer
  - Waiting until the property is under contract to advertise
key: B
explanation: The rule explicitly states that a licensee must secure written permission from the
  owner, owner's authorized agent, or owner of a leasehold estate before advertising real estate.
  The distractor about verbal approval is incorrect because the permission must be written.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.09(3)
  url: null
  quoted_text: A licensee shall not advertise any real estate for sale, rent, lease, or exchange
    unless the licensee has first secured the written permission of the owner, the owner's
    authorized agent, or the owner of a leasehold estate.
