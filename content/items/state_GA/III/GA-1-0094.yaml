stem: A licensee receives a signed offer to purchase property from a buyer who is not a client of
  the licensee. The licensee is representing the seller. According to Georgia Real Estate Commission
  rules, what must the licensee do with the offer?
options:
  - Immediately accept the offer on behalf of the seller
  - Submit the offer to the Georgia Real Estate Commission for approval
  - Provide a copy of the offer to the licensee representing the buyer
  - Keep the offer confidential and not share it with anyone
key: C
explanation: The rule states that when the offeror is not a client or customer of the licensee, the
  licensee receiving the offer must provide a copy to the licensee working with or representing the
  offeree. Keeping the offer confidential or accepting it outright violates this duty, and
  submission to the Commission is not required.
