stem: According to Georgia Real Estate Commission rules, what must a broker do with copies of
  required real estate transaction documents upon request from an authorized agent of the
  Commission?
options:
  - Make the copies available to the Commission upon request at a reasonable cost.
  - Charge the Commission a fee equal to the actual cost of copying the documents.
  - Provide the copies only if the request is accompanied by a valid subpoena.
  - Retain the copies for an additional two years before releasing them to the Commission.
key: A
explanation: Under Georgia Real Estate Commission rules, a broker must make copies of required
  transaction documents available to an authorized Commission agent upon a reasonable request and at
  a reasonable cost. Therefore the correct answer is the option stating that the broker must make
  the copies available upon request at a reasonable cost. The option about retaining copies for an
  additional two years is incorrect because no such waiting period is required. The option about
  charging a fee equal to the actual cost of copying is incorrect because the rule permits only a
  reasonable cost, not necessarily the actual cost, and does not allow the broker to impose a fee
  beyond that. The option requiring a valid subpoena is incorrect because the broker must comply
  with any reasonable request; a subpoena is not necessary.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
