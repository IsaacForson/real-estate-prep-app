stem: A licensee is preparing an offer to purchase property that involves both the buyer's agent and
  the seller's agent from different firms. According to Georgia Real Estate Commission rules, what
  must the licensee include in the offer?
options:
  - The licensee must include only the licensee's own license number and no other identifiers, which
    is insufficient under the rule.
  - The licensee must include the license numbers of the buyer and seller, even though the rule
    applies to firms and licensees, not the parties themselves.
  - The licensee must include the six-digit license number issued by the Commission of each firm and
    of each licensee participating in the transaction.
  - The licensee must include the firm's name and telephone number only, omitting the required
    license numbers, which does not satisfy the regulation.
key: C
explanation: A licensee who prepares or signs an offer to purchase, sell, lease, or exchange real
  property must list the six‑digit license number issued by the Commission for each brokerage firm
  and for each licensee involved in the transaction. This requirement is found in Georgia Real
  Estate Commission rules § 520-1-.10(2).
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
