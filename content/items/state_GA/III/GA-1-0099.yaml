stem: According to Georgia Real Estate Commission rules, copies of required transaction documents
  must be made available to whom?
options:
  - In accordance with Georgia Real Estate Commission rules, copies must be made available to the
    buyer and seller only.
  - In accordance with Georgia Real Estate Commission rules, copies must be made available to
    authorized agents of the Commission upon request.
  - In accordance with Georgia Real Estate Commission rules, copies must be made available to the
    public upon request.
  - In accordance with Georgia Real Estate Commission rules, copies must be made available to the
    licensee's firm only.
key: B
explanation: The rule states that copies of sales contracts, brokerage engagements, closing
  statements, leases, and other documents required to be kept for three years shall be made
  available to authorized agents of the Commission upon reasonable request and at a reasonable cost.
  The distractor that limits availability to the buyer and seller only is incorrect because the rule
  does not restrict access to those parties alone.
citation:
