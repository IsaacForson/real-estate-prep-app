stem: A licensee has a pre-established brokerage agreement that provides for a referral fee upon
  closing. According to Georgia Real Estate Commission rules, when may the licensee disclose this
  referral fee to the principal?
options:
  - Disclosure is prohibited at the closing of the real estate transaction
  - Disclosure is prohibited after the principal pays the fee to the broker
  - In advance of payment based on the pre-established terms
  - Disclosure of referral fees is required before any payment is made
key: C
explanation: The rule permits a licensee to disclose commissions, fees, or other valuable
  consideration to a principal in advance of payment when the amount is set forth in a
  pre‑established brokerage agreement. It does not require waiting until closing or after payment,
  nor does it forbid disclosure at those times, and it does not mandate disclosure before payment.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.10(6)(a)
  url: null
  quoted_text: The disclosures required by O.C.G.A. § 43-40-25(b)(6) from a licensee to a principal
    may be made in advance of the payment or receipt of a commission, fee, rebate or thing of value
    to a licensee based upon pre-established terms set forth in a brokerage agreement, a brokerage
    engagement agreement, management agreement or other written agreement.
