stem: According to Georgia Real Estate Commission rules, when a licensee receives a signed offer to
  purchase property from a party who is **NOT** the licensee's client or customer, what must the
  licensee do with that offer?
options:
  - Provide a copy of the offer to the licensee working with or representing the offeree.
  - Submit the offer to the licensee's managing broker for immediate review.
  - Forward the offer to the licensee's firm's compliance officer within one business day.
  - Inform the offeror that a earnest money deposit is required before proceeding.
key: A
explanation: The rule states that when the offeror is not a client or customer, the licensee
  receiving the offer must provide a copy to the licensee working with or representing the offeree.
  The other options describe actions not required by the rule, such as presenting to one's own
  broker or filing with a county office.
