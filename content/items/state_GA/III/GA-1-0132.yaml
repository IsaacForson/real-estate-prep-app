stem: According to Georgia Real Estate Commission rules, which of the following actions is
  prohibited when preparing transaction documents?
options:
  - Representing an amount other than the true and actual earnest money, security deposit, or other
    trust funds
  - Providing a copy of the signed offer to the client or customer before any acceptance occurs
  - Retaining copies of sales contracts for three years as mandated by commission record‑keeping
    rules
  - Including the license number of the firm and each licensee in the offer as required by
    Commission rules
key: A
explanation: Rule 520-1-.10(5)(c) prohibits representing an amount other than the true and actual
  earnest money, security deposit, or other trust funds. Including license numbers is required, not
  prohibited. Providing a copy of a signed offer to a client is required by.10(3). Retaining records
  for three years is required by.10(4).
