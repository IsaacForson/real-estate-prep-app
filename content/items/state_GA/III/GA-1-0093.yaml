stem: A Georgia licensee discovers that the seller client is running a newspaper ad that misstates
  the square footage of the home. According to Georgia Real Estate Commission rules, what must the
  licensee do?
options:
  - Immediately take steps to stop the advertisement until it complies
  - Inform the seller but take no further action regarding the ad
  - Submit a written complaint to the Georgia Real Estate Commission
  - Wait for the advertisement to run its course before acting
key: A
explanation: The rule requires a licensee who becomes aware of inconsistent advertising by a
  principal to immediately take steps to stop the advertising until it complies. Waiting to act or
  merely informing the seller does not satisfy this duty, and filing a complaint is not the
  prescribed first step.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.09
  url: null
  quoted_text: Whenever a licensee becomes aware that a principal with whom the licensee's firm has a
    brokerage engagement is advertising to sell, buy, rent, lease, or exchange real estate in such a
    manner that is inconsistent with this rule, the licensee must immediately take steps to stop the
    advertising until it complies with this rule.
