stem: A licensee prepares a purchase agreement and states the earnest money deposit as $5,000 when
  the actual amount deposited is $3,000. According to Georgia Real Estate Commission rules, what is
  the licensee doing?
options:
  - The licensee is violating the prohibition against falsifying transaction documents.
  - The licensee is allowed to do so if the amount is disclosed later in the transaction.
  - The licensee is making a permissible estimate of the earnest money amount.
  - The licensee is acting acceptably if the buyer agrees to the stated amount.
key: A
explanation: The rule prohibits representing an amount other than the true and actual earnest money,
  security deposit, or other trust funds. Stating an incorrect earnest money amount constitutes
  falsification of a transaction document. Disclosing later or obtaining buyer agreement does not
  cure the prohibition. See Ga. Comp. R. & Regs. § 520-1-.10.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
