  url: null
  quoted_text: an amount other than the true and actual earnest money, security deposit, or other
    trust funds or that such trust funds have been tendered in any form other than its true and
    actual form;
  secondary: []
math:
  worked_solution: The licensee stated $5,000 but the actual deposit is $3,000. The overstatement is
    $5,000 - $3,000 = $2,000.
