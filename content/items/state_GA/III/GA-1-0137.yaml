stem: A licensee receives a signed purchase offer from a buyer who is not the licensee's client or
  customer. According to Georgia Real Estate Commission rules, what must the licensee do with that
  offer?
options:
  - The licensee must provide a copy of the offer to the licensee who is working with or
    representing the offeree
  - The licensee must keep the offer confidential and not share it with any other party unless
    required by law
  - The licensee must immediately present the offer to the offeree regardless of representation and
    obtain the offeree's signature
  - The licensee must alter the offer to reflect the licensee's commission before sharing it and
    submit it to the commission for approval
key: A
explanation: When the offeror is not a client or customer, the licensee receiving the offer must
  provide a copy of the offer to the licensee who is working with or representing the offeree. The
  other options either violate confidentiality rules, add unauthorized steps, or modify the offer
  improperly.
