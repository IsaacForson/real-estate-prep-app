stem: A licensee has a signed purchase agreement that has been accepted and signed by all parties.
  According to Georgia Real Estate Commission rules, how must the licensee distribute copies of the
  agreement?
options:
  - Provide one copy to the buyer and the seller
  - Provide one copy to each party and each brokerage firm
  - Provide one copy to the brokerage firm only
  - Provide one copy to the principal only
key: B
explanation: When an offer is accepted and signed by all parties, the rule requires distribution of
  one copy to each person signing the document and one copy to each brokerage firm involved, per §
  520-1-.10(3). The distractor "Provide one copy to the buyer and the seller" fails to include
  copies for the brokerage firms.
citation:
