stem: A licensee wants to negotiate directly with the owner of a property after receiving an offer
  from a buyer. Under what condition may the licensee do so without violating the rule about
  presenting offers?
options:
  - The licensee may negotiate directly with the offeree if the offeree has a written outstanding
    agreement that expressly provides the other licensee will not provide negotiation services
  - The licensee may negotiate directly with the offeree if the offeree verbally agrees not to use
    another licensee's services and confirms this intention
  - The licensee may negotiate directly with the offeree if the licensee has a written agreement
    with the offeree to share the commission and the agreement outlines the commission split
  - The licensee may negotiate directly with the offeree if the offeree is a family member of the
    licensee and the offeree is related by blood
key: A
explanation: The licensee may negotiate directly with the offeree only when the offeree has a
  written outstanding agreement that expressly states the other licensee will not provide
  negotiation services. Verbal agreements, commission-sharing arrangements, or familial
  relationships do not satisfy this requirement.
