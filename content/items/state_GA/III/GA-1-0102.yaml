stem: A licensee receives a signed offer to purchase property from a party who is not a client or
  customer of the licensee. According to Georgia Real Estate Commission rules, what must the
  licensee do with the offer?
options:
  - The licensee must provide a copy of the offer to the licensee representing the offeree.
  - The licensee must file the offer with the commission within ten days of receipt.
  - The licensee must disclose the offer to the broker's supervising broker within five business
    days.
  - The licensee must advertise the offer in a local newspaper within thirty days.
key: A
explanation: The rule requires that when the offeror is not a client or customer, the licensee
  receiving the offer must provide a copy of the offer to the licensee working with or representing
  the offeree. The distractor about retaining the offer for three years is incorrect because that
  retention period applies to transaction documents, not to handling offers from non‑clients.
