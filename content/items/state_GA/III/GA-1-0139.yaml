stem: A licensee receives a signed offer to purchase a property from a buyer who is not the
  licensee's client. The buyer is represented by another broker from Firm B. According to Georgia
  Real Estate Commission rules, what must the licensee do with the offer?
options:
  - Provide a copy of the offer to the broker representing the buyer.
  - Keep the offer confidential and not share it with any other broker.
  - Present the offer directly to the buyer without involving the buyer's broker.
  - Forward the offer to the Georgia Real Estate Commission for review.
key: A
explanation: The rule requires that when the offeror is not a client or customer, the licensee
  receiving the offer must provide a copy to the licensee working with or representing the offeree.
  Keeping the offer confidential, presenting it directly to the buyer, or forwarding it to the
  Commission are not permitted under this provision.
