stem: A licensee obtains a signed offer to purchase property from a seller who is not the licensee's
  client. The seller has a written agreement with another broker that states that broker will not
  provide negotiation services for this property. According to Georgia Real Estate Commission rules,
  what may the licensee do?
options:
  - Obtain written consent from the seller's broker before negotiating.
  - Disregard the offer because the seller is not a client and look for other options.
  - Negotiate the sale directly with the seller without involving any broker.
  - Refer the offer to the broker who holds the written agreement.
key: C
explanation: The rule permits a licensee who obtains an offer to negotiate directly with the offeree
  if the offeree has a written outstanding agreement that expressly provides the other licensee will
  not provide negotiation services. Referring the offer, obtaining consent from the other broker, or
  disregarding the offer are not authorized actions under this rule.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.10(1)
  url: null
  quoted_text: However, a licensee who obtains an offer may negotiate a sale, exchange, or lease
    directly with an owner, a lessor, a purchaser, or a tenant if the licensee who obtains the offer
    knows that such offeree has a written outstanding agreement in connection with such property
    that expressly provides the other licensee will not provide negotiation services to the offeree.
