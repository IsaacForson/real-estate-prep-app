stem: According to Georgia Real Estate Commission rules, what must a licensee include when preparing
  or signing an offer to purchase real property?
options:
  - The broker's name and address as recorded with the Commission on the firm's roster
  - The six-digit license number of each firm and licensee participating in the transaction
  - The earnest money deposit amount required by the contract and any applicable addenda
  - The property's legal description, tax map number, and zoning classification
key: B
explanation: The rule requires the licensee to include the six‑digit license number issued by the
  Commission for each firm and each licensee participating in the transaction. Providing only the
  broker's name and address, as in the most tempting distractor, does not satisfy this requirement.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
