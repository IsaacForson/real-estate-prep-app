stem: A licensee receives a signed offer to purchase a property from a buyer who is not a client of
  the licensee. The licensee is working with the seller. According to Georgia Real Estate Commission
  rules, what must the licensee do with the offer?
options:
  - Provide a copy of the offer to the licensee representing the seller.
  - Return the offer to the buyer unsigned until a client agreement is signed.
  - Keep the offer confidential and present it only at closing.
  - Negotiate directly with the buyer without involving another licensee.
key: A
explanation: The rule requires that when the offeror is not a client or customer, the licensee
  receiving the offer must provide a copy to the licensee working with or representing the offeree,
  which here is the seller's licensee. Keeping the offer confidential and not providing a copy, as
  suggested by returning the offer to the buyer unsigned until a client agreement is signed, is not
  permitted; a copy must be provided.
