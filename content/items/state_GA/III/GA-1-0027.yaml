stem: According to Georgia Real Estate Commission rules, for how long must a broker retain copies of
  sales contracts, brokerage engagements, closing statements, leases, and other documents related to
  a real estate transaction?
options:
  - The broker must retain the documents for seven years.
  - The broker must retain the documents for two years.
  - The broker must retain the documents for five years.
  - The broker must retain the documents for three years.
key: D
explanation: The rule states that copies of sales contracts, brokerage engagements, closing
  statements, leases, and other documents related to a real estate transaction required by law to be
  maintained in a broker's file for three years shall be made available to the Commission.
  Therefore, the correct retention period is three years. The one‑year option is incorrect because
  the rule explicitly specifies three years, not one.
