  url: null
  quoted_text: (c) an amount other than the true and actual earnest money, security deposit, or other
    trust funds or that such trust funds have been tendered in any form other than its true and
    actual form;
  secondary: []
math:
  worked_solution: "Identify the stated earnest money amount ($5,000) and the actual amount received
    ($3,000). Subtract the actual from the stated to find the overstatement: $5,000 - $3,000 =
    $2,000."
