stem: "A licensee preparing a closing statement states that the earnest money deposit is $5,000,
  although the actual deposit received was $3,000. According to Georgia Real Estate Commission
  rules, this action is:"
options:
  - Permitted if the buyer agrees to the higher amount
  - Allowed as long as the discrepancy is disclosed later in the transaction
  - Prohibited because it misrepresents the true amount of earnest money
  - Acceptable if the licensee believes the higher amount will assist financing
key: C
explanation: Georgia Real Estate Commission rules prohibit representing an earnest money amount
  other than the true and actual amount; such a misrepresentation is not cured by buyer agreement,
  later disclosure, or the licensee's belief about financing (Ga. Comp. R. & Regs. § 520-1-.10).
