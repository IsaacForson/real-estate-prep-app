stem: A licensee obtains an offer to purchase property and learns that the offeree has a written
  outstanding agreement stating that another licensee will not provide negotiation services.
  According to Georgia Real Estate Commission rules, what may the licensee do?
options:
  - Provide a copy of the offer to the licensee working with the offeree and retain a copy for the
    file
  - Cease all advertising related to the property immediately and remove any misleading statements
  - Include the firm's name and telephone number in the advertisement and display them prominently
  - Negotiate the sale directly with the offeree without involving any other licensee
key: D
explanation: Rule 520-1-.10(1) provides an exception allowing a licensee who obtains an offer to
  negotiate directly with the offeree when the offeree has a written outstanding agreement that
  expressly bars the other licensee from negotiation services. Providing a copy of the offer is
  required only when the offeror is not a client or customer. Ceasing advertising or including firm
  names in ads are unrelated to this negotiation rule.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.10(1)
  url: null
  quoted_text: However, a licensee who obtains an offer may negotiate a sale, exchange, or lease
    directly with an owner, a lessor, a purchaser, or a tenant if the licensee who obtains the offer
    knows that such offeree has a written outstanding agreement in connection with such property
    that expressly provides the other licensee will not provide negotiation services to the offeree.
