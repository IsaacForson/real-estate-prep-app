stem: A licensee maintains a personal website that advertises residential properties for sale.
  According to Georgia Real Estate Commission Rule 520-1-.09(5), what must be disclosed on every
  viewable web page of that website?
options:
  - The licensee must clearly and conspicuously display the property address and asking price for
    each advertised listing on every viewable web page of the website.
  - The licensee must clearly and conspicuously display the firm's logo only, without any
    accompanying text, on every viewable web page of the website.
  - The licensee must clearly and conspicuously display the name and telephone number of the
    licensee's firm on every viewable web page of the website.
  - The licensee must clearly and conspicuously display the licensee's individual name and email
    address on every viewable web page of the website.
key: C
explanation: The rule requires that any Internet advertising by a licensee disclose the name and
  telephone number of the licensee's firm on every viewable web page of the website. The option that
  requires the property address and asking price is incorrect because the rule does not mandate
  that.
