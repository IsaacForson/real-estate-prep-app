key: A
explanation: The rule sets the activation fee for original licensure as an individual broker,
  associate broker, salesperson, or community association manager at $45.00, which includes $20.00
  for the Real Estate Education, Research, and Recovery Fund. The $75.00 amount applies to firm,
  school, or instructor activation fees, not to an individual salesperson.
