stem: A firm licensee allowed their license to lapse for eight months. What is the total
  reinstatement fee for this firm license?
options:
  - $100.00
  - $200.00
  - $250.00
  - $150.00
key: B
explanation: For a firm license lapsed more than four months, the reinstatement fee is $100.00 plus
  $50.00 for each month beyond six months. Eight months lapsed means two months beyond six, so
  $100.00 + ($50.00 × 2) = $200.00.
