stem: "According to Georgia Real Estate Commission Rule 520-1-.04(g), an inactive licensee may
  perform real estate brokerage activity only:"
options:
  - On property listed with another licensee
  - On property owned solely by the inactive licensee
  - On property managed by a licensed broker
  - On property owned by an unlicensed employer
key: B
explanation: The rule states that inactive licensees may not perform real estate brokerage activity
  on any real estate except real estate owned solely by the inactive licensee. Therefore, the
  correct answer is the option that limits activity to the licensee's own property. The distractor
  suggesting activity for an unlicensed employer is incorrect because the rule prohibits brokerage
  activity for unlicensed persons unless the license is surrendered.
