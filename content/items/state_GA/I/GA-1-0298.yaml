stem: According to Ga. Comp. R. & Regs. r. 520-1-.08(3)(a), what is the consequence if a broker
  disburses trust funds contrary to the terms of a contract?
options:
  - Being considered to have demonstrated incompetence as a broker
  - Being required to pay a fine of five hundred dollars to the Commission
  - Being allowed to retain the disbursed funds as commission without approval
  - Being permitted to disburse funds after providing written notice to the Commission
key: A
explanation: The rule states that a broker who disburses trust funds contrary to the terms of a
  contract will be considered by the Commission to have demonstrated incompetence to act as a real
  estate broker. The other options describe outcomes not supported by the rule, such as fines or
  permission to keep funds, which are not mentioned in this provision.
