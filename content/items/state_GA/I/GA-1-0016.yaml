stem: A broker's file contains a closing statement and a lease from a completed transaction. Under
  Georgia Real Estate Commission Rule 520-1-.10, how long must the broker retain copies of these
  documents for the Commission's inspection?
options:
  - must be retained for at least 1 year
  - must be retained for at least 5 years
  - must be retained for at least 180 days
  - must be retained for at least 3 years
key: D
explanation: Rule 520-1-.10 requires that copies of sales contracts, brokerage engagements, closing
  statements, and leases required by law to be maintained in a broker's file for three years be made
  available to the Commission upon reasonable request.
citation:
  source: Ga. Comp. R. & Regs. Rule 520-1-.10
  url: null
  quoted_text: Copies of sales contracts, brokerage engagements, closing statements, leases, and other
    documents related to a real estate transaction required by law to be maintained in a broker's
    file for three years shall be made available to authorized agents of the Commission upon
    reasonable request and at a reasonable cost to the Commission.
