stem: An individual licensee allowed their license to lapse for five months. What is the total
  reinstatement fee for this licensee?
options:
  - $150.00
  - $100.00
  - $125.00
  - $175.00
key: B
explanation: The rule imposes a $100.00 base reinstatement fee for licenses lapsed more than four
  months, with an additional $25.00 per month only for each month or portion beyond six months.
  Since five months lapsed is less than six months, no extra fee applies, so the total remains
  $100.00. The $125.00 distractor mistakenly adds one month’s extra fee, while $150.00 and $175.00
  add two and three months’ extra fees.
