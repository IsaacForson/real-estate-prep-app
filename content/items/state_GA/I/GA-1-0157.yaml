stem: A broker receives a request from the Georgia Real Estate Commission for copies of a closing
  statement from a transaction that closed 18 months ago. According to Rule 520-1-.10(4), what must
  the broker do?
options:
  - Provide copies within a reasonable time and at a reasonable cost
  - Provide copies only if the broker still retains the original documents
  - Provide copies only after paying a fee to the Commission
  - Provide copies only if the transaction involved trust funds
key: A
explanation: The rule states that copies of documents required to be maintained for three years
  shall be made available to authorized Commission agents upon reasonable request and at a
  reasonable cost. The broker must comply with the request regardless of whether the original
  documents are still retained, a fee is paid, or trust funds were involved, as long as the
  documents fall within the three‑year retention period.
