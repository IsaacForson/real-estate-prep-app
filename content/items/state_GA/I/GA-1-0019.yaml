stem: "A broker disburses trust funds from a designated trust account after a buyer's offer is
  rejected by the seller. Under Georgia Real Estate Commission Rule 520-1-.08, disbursing funds
  under one of the rule's listed circumstances means the broker is considered to have:"
options:
  - violated the duty to maintain trust funds until closing
  - triggered an automatic Commission audit of the account
  - fulfilled properly the duty to account for trust funds
  - waived the right to any commission earned on the sale
key: C
explanation: Rule 520-1-.08 provides that a broker who disburses trust funds under the circumstances
  listed in the rule, including rejection of an offer, is deemed to have fulfilled properly the duty
  to account for and remit funds the broker is required to hold in trust.
