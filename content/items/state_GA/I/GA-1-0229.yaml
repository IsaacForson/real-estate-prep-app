stem: A licensee passed the salesperson examination on June 1, 2023 and did not apply for a license.
  If they submit an application for an active salesperson license on July 1, 2024, what is required?
options:
  - Retake the salesperson examination
  - Submit a new application on the latest form
  - Provide proof of active licensure for three years
  - Pay double the original application fee
key: A
explanation: Under Ga. Comp. R. & Regs. ch. 520-1 § 520-1-.04(5)(a), a salesperson who does not
  activate the license within twelve months of passing the examination must retake the exam. Since
  more than twelve months have passed between the June 1, 2023 exam and the July 1, 2024
  application, retaking is required. Paying the double fee applies only if the application is made
  between three and twelve months after the exam, not after twelve months. Submitting a new
  application on the latest form is required only when the original form is obsolete, which is not
  the case here.
citation:
