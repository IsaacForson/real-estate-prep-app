stem: A broker's designated trust account incurs a monthly service charge from the financial
  institution. Under Rule 520-1-.08, what may the broker do regarding the broker's own funds in that
  account?
options:
  - Close the trust account and open a new one
  - Transfer the charge to the client's closing statement
  - Withdraw client funds to avoid the charge
  - Maintain a reasonable amount for the charge
key: D
explanation: Rule 520-1-.08 permits a broker to keep a reasonable amount of the broker's own funds
  in the trust account solely to cover a service charge required by the financial institution.
