stem: A licensee moved to a new residence on June 1, 2024 and was convicted of a criminal offense on
  June 15, 2024. According to Georgia Real Estate Commission Rule 520-1-.04, which notification must
  be made first?
options:
  - Notify the Commission of both the conviction and the address change within one month of the move.
  - Notify the Commission of the change of address within one month of the move.
  - Notify the Commission of the conviction within ten days of the conviction.
  - Notify the Commission of both the conviction and the address change within ten days of the
    conviction.
key: C
explanation: Rule 520-1-.04(5)(a) requires notice of any criminal action within ten days of
  conviction, which is sooner than the one‑month period for a change of address under (5)(b). The
  distractor about the address change is incorrect because it has the longer deadline.
