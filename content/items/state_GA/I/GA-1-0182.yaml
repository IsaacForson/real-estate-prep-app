stem: A firm license allowed its license to lapse for nine months. What is the total reinstatement
  fee for the firm?
options:
  - $150.00
  - $250.00
  - $200.00
  - $100.00
key: B
explanation: For a firm, the reinstatement fee is $100.00 plus $50.00 for each month or portion of a
  month beyond six months from the date of lapsing. Nine months lapsed means three months beyond six
  months, adding $150.00 to the base $100.00 for a total of $250.00. The $150.00 distractor results
  from adding only one month’s additional fee instead of three.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.04
  url: null
  quoted_text: if the license or approval is reinstated more than four months after the date of
    lapsing, $100.00 plus an additional fee of $25.00 for an individual or instructor or $50.00 for
    a firm or school for each month or portion of a month beyond six months from the date of
    lapsing;
  secondary: []
math:
  worked_solution: |-
    Determine base reinstatement fee: $100.00
    Calculate months beyond six months: 9 months - 6 months = 3 months
    Calculate additional fee for firm: 3 months × $50.00/month = $150.00
    Add base and additional fees: $100.00 + $150.00 = $250.00
  formulas:
    - Total = Base + (max(0, LapsedMonths - 6) × AdditionalPerMonth)
    - Base = $100.00
    - AdditionalPerMonth (firm) = $50.00
