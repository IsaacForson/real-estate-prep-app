stem: A licensee wishes to list her own residential property for sale in her own name. According to
  Georgia Real Estate Commission Rule 520-1-.11(1), what must she do before listing the property?
options:
  - Notify the Georgia Real Estate Commission in writing before listing.
  - Advise her broker in writing that she is acting as principal.
  - Give written notice to buyers that she is the principal.
  - File a principal disclosure form with the county clerk.
key: B
explanation: The rule requires a licensee acting as principal to first advise the broker in writing
  before listing, selling, or otherwise dealing with real estate in their own name. The distractor
  about obtaining a purchase agreement is unrelated to the prerequisite notice to the broker.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — Rule 520-1-.11(1)
  url: null
  quoted_text: No licensee shall be permitted to list, sell, buy, exchange, rent, lease, or option or
    offer to list, sell, buy, exchange, rent, lease, or option real estate, either in individual or
    multiple parcels, in the licensee's own name or in the name of any other firm or entity in which
    the licensee is an officer, employee, beneficiary, or member of such firm or other entity acting
    as principal without first advising, in writing, the broker for whom the real estate licensee is
    acting.
