stem: According to Georgia Real Estate Commission Rule 520-1-.10(6)(e), what must a licensee do to
  legally rebate part of a commission to a principal?
options:
  - Disclose the rebate on the closing statement
  - Obtain written approval from the broker
  - Limit the rebate to under ten percent of commission
  - Provide the rebate in cash to the principal
key: A
explanation: The rule states that a licensee may rebate part of a commission only if the rebate is
  disclosed on the closing statement and does not mislead others about the source of funds.
  Disclosure on the closing statement is therefore a required condition. The other options are not
  mandated by the rule.
