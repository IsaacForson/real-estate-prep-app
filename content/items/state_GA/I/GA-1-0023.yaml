stem: Licensee Jane receives a signed offer to purchase a home from a buyer who is not her client.
  The seller is represented by Licensee Mark. Under the rules, what must Jane do with the offer?
options:
  - Provide a copy of the offer to Licensee Mark
  - Discard the offer after 24 hours
  - Retain the offer for 30 days before forwarding it
  - Deliver the offer only to the buyer
key: B
explanation: When the offeror is not a client, the licensee receiving the offer must provide a copy
  to the licensee representing the offeree (Rule 520-1-.10(1)). The other actions are not required
  by the rule.
