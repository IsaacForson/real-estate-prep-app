stem: What triggers the start of the 30-day compliance period for a final citation order under Ga.
  Comp. R. & Regs. r. 520-1-.14(b)?
options:
  - The date the licensee requests a contested case hearing
  - The effective date of the citation order
  - The date the Commission serves the citation
  - The date the licensee receives the citation
key: B
explanation: The rule states that a licensee must meet any requirements within 30 days of the
  effective date of the order unless the order prescribes a different timetable for completion.
  Therefore, the effective date of the order starts the compliance period. The other options
  describe events that do not trigger the period under this rule.
