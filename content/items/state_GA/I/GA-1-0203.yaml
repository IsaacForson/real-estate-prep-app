stem: A person passed the salesperson examination on March 10, 2024 and wishes to apply for a
  license. According to Ga. Comp. R. & Regs. § 520-1-.04(5)(a), within what time frame must they
  submit an application for an active or inactive license to avoid paying double the original
  application fee?
options:
  - Within twelve months of the examination date
  - Within one month of the examination date
  - Within six months of the examination date
  - Within three months of the examination date
key: D
explanation: The rule states that anyone who has passed the salesperson exam must apply for a
  license within three months of the exam date; otherwise they must pay twice the original fee.
  Therefore, the three‑month window is the correct period. The twelve‑month period applies only to
  the deadline for activating the license before retaking the exam, not to the fee‑avoidance window.
citation:
  source: Ga. Comp. R. & Regs. § 520-1-.04(5)(a)
  url: null
  quoted_text: Any person who has taken the salesperson's examination and successfully passed the
    examination must make application for an active or inactive license within three months from the
    date of the examination taken, or after three months, must pay a fee equal to two times the
    original application fee.
