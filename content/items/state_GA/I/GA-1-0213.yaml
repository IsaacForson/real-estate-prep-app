stem: A Georgia-licensed broker advertises and shows a condominium in South Carolina to a
  prospective buyer but does not hold a South Carolina real estate license. Is this permissible
  under Georgia Real Estate Commission Rule 520-1-.02(2)(f)?
options:
  - The licensee may proceed only if the transaction is handled by a South Carolina-licensed
    attorney or agent.
  - The licensee may proceed because the property is owned by a Georgia resident and the buyer is
    aware.
  - The licensee may proceed if they disclose their Georgia license status to the buyer and obtain
    consent.
  - The licensee may not perform brokerage acts unless licensed in South Carolina or compliant with
    its laws.
key: D
explanation: Rule (f) forbids a Georgia licensee from performing brokerage acts on property in
  another state without being properly licensed there or complying with that state's laws. The other
  options incorrectly suggest that disclosure, ownership, or attorney involvement overrides this
  requirement.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
