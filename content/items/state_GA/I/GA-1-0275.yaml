stem: "Under Georgia Real Estate Commission Rule 520-1-.06(6)(d), a customer who is working
  primarily with the broker and is **not** represented by another broker in a transaction is
  considered:"
options:
  - The customer is not considered the licensee's principal because only clients qualify under the
    rule in the transaction.
  - The customer is considered the licensee's principal for disclosure purposes in the specific real
    estate transaction.
  - The customer is considered the licensee's principal only if the broker receives a commission
    from the customer in the transaction.
  - The customer is considered the licensee's principal only if a written brokerage agreement exists
    in the transaction.
key: B
explanation: The definition states that a customer meeting those conditions is included as a
  licensee's principal for disclosure purposes. The distractor that claims only clients qualify
  incorrectly ignores the rule's express inclusion of a qualifying customer.
