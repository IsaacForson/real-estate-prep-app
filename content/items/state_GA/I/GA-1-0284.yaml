stem: A licensee allowed their individual license to lapse for two months. What is the reinstatement
  fee for this licensee?
options:
  - $200.00
  - $150.00
  - $100.00
  - $50.00
key: C
explanation: According to the rule, if a license is reinstated within four months of lapsing, the
  reinstatement fee is $100.00. Since the license lapsed for only two months, it falls within the
  four‑month window, so the fee is $100.00. The $50.00 amount is not specified in the rule, while
  $150.00 and $200.00 correspond to longer lapses that incur additional monthly charges.
