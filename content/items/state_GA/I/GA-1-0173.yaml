stem: Under Georgia Real Estate Commission Rule 520-1-.10(5), which of the following actions is
  prohibited?
options:
  - Including the firm's and individual's license numbers on the offer
  - Disclosing a rebate on the closing statement as permitted by rule
  - Misrepresenting the amount of earnest money deposited in the transaction
  - Providing a copy of the signed offer to the client who made the offer
key: C
explanation: "Rule 520-1-.10(5)(c) prohibits knowingly representing an amount other than the true
  and actual earnest money, security deposit, or other trust funds. Misrepresenting the earnest
  money amount is therefore prohibited. The other options describe permissible actions: providing a
  copy of an offer to the client, including license numbers on offers, and disclosing rebates are
  allowed under the rule."
