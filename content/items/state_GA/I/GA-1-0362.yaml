stem: An individual with a prior disciplinary action requests a preliminary decision from the
  Georgia Real Estate Commission before completing required education. What must they submit to the
  Commission to obtain that preliminary decision?
options:
  - The individual must submit a receipt showing payment of the application fee
  - The individual must submit proof of completing the required prelicense education course
  - The individual must submit a letter of recommendation from their current employer
  - The individual must submit a certified copy of the indictment or disciplinary action
key: D
explanation: To obtain a preliminary decision, the individual must submit a certified copy of any
  indictment and conviction or a disciplinary action imposed by another licensing regulatory
  authority. The distractor about submitting proof of completing prelicense education is incorrect
  because education is not required for the preliminary decision request.
