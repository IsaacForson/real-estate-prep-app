stem: A Georgia resident who holds an active salesperson license wants to take the broker
  examination only to test their readiness, with no plan to apply for a broker license at this time.
  According to Ga. Comp. R. & Regs. r. 520-1-.04(k), what must the resident do before sitting for
  the examination?
options:
  - Complete the broker prelicense course
  - Obtain written permission from the Commission
  - Wait for the next scheduled examination date
  - Submit a reciprocity request to another state
key: B
explanation: Rule 520-1-.04(k) prohibits taking any qualifying examination without written
  permission unless the purpose is to qualify for or reinstate the license, to meet another state's
  reciprocity requirement, or as ordered by the Commission in a disciplinary matter. Since the
  resident’s purpose is none of these, they must obtain written permission. Completing the broker
  prelicense course is irrelevant to the permission requirement, submitting a reciprocity request
  does not address the prohibition, and waiting for the next scheduled date still violates the rule
  without permission.
