stem: A licensee was convicted of a criminal offense on May 12, 2024. According to Ga. Comp. R. &
  Regs. § 520-1-.04(5)(a), by what date must the licensee notify the Commission in writing of the
  conviction, including a copy of the indictment, accusation, and conviction?
options:
  - May 20, 2024
  - May 22, 2024
  - May 31, 2024
  - May 24, 2024
key: B
explanation: The rule mandates notice within ten days of a criminal conviction, making May 22, 2024
  the correct date. The distractor May 20, 2024 assumes only eight days, which does not satisfy the
  ten‑day requirement.
