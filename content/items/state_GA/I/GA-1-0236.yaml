stem: Under Georgia Real Estate Commission Rule 520-1-.14(o), what is the fine for a licensee who
  fails to have the financial institution designate an account as a trust or escrow account,
  assuming the financial institution did **NOT** make an error?
options:
  - $500 per account
  - $600 per account
  - $800 per account
  - $900 per account
key: B
explanation: The rule states a fine of $600.00 per account not designated. A $500 fine applies to
  other violations such as failure to turn over trust funds promptly.
