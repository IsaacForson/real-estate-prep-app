stem: A nonresident licensee from Tennessee lets her Georgia license lapse for failure to pay the
  renewal fee. During the lapse she maintains an active Tennessee license and completes Tennessee's
  continuing education requirements. What must she do to reactivate her Georgia license?
options:
  - Submit proof of Tennessee licensure and pay the fee required of an original applicant
  - Obtain a letter of good standing from Tennessee and pay the standard renewal fee
  - Provide evidence of Georgia residency and pay the fee required of an original applicant
  - Submit a completed reinstatement application and pay the standard renewal fee
key: A
explanation: Rule 520-1-.05(e) states that a nonresident licensee whose license lapses for failure
  to pay a renewal fee may reactivate by paying the fee required of an original applicant if the
  licensee maintained an active license in the home state and met that state's continuing education
  requirements. The option to pay only the renewal fee is incorrect because the reactivation fee
  equals the original applicant fee, not the renewal fee.
