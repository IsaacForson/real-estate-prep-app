  url: null
  quoted_text: Any nonresident licensee whose license lapses for failure to pay a renewal fee may
    reactivate that license by paying the fee required of an original applicant if such nonresident
    has maintained an active license in his or her state of residence during the period that his or
    her license lapsed and has met that state's continuing education requirements.
