stem: What is the activation fee for an original firm license in Georgia?
options:
  - $45.00
  - $75.00
  - $100.00
  - $125.00
key: B
explanation: The rule states that the activation fee for original licensure as a firm is $75.00,
  which includes $20.00 for the Real Estate Education, Research, and Recovery Fund. The $45.00 fee
  applies to individual broker, associate broker, salesperson, or community association manager
  licenses. The $100.00 and $125.00 amounts are renewal fees, not activation fees.
