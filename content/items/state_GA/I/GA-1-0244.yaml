stem: A broker reconciles the trust account every 45 days. Based on Georgia Real Estate Commission
  Rule 520-1-.08(6), is this practice compliant?
options:
  - No, unless the broker receives a waiver from the Commission.
  - Yes, because 45 days falls within a one‑month period.
  - No, because the rule requires reconciliation at least monthly.
  - Yes, provided the broker notes the delay in the reconciliation statement.
key: C
explanation: The rule requires a trust account reconciliation to be made at least monthly; a 45‑day
  interval exceeds that frequency, so the practice is noncompliant. The claim that 45 days falls
  within a one‑month period incorrectly treats the interval as acceptable.
