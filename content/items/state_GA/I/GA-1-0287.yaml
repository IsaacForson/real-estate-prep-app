stem: A firm licensee allowed their license to lapse for seven months. What is the total
  reinstatement fee for this license?
options:
  - $100.00.
  - $150.00.
  - $200.00.
  - $125.00.
key: B
explanation: Per Ga. Comp. R. & Regs. § 520-1-.04(1)(a)3(ii), the reinstatement fee is $100.00 plus
  $50.00 for each month or portion beyond six months. Seven months lapsed means one month beyond
  six, so $100.00 + $50.00 = $150.00. The $200.00 distractor would correspond to eight months lapsed
  (two months beyond six).
