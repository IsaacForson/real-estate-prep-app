stem: According to Georgia Real Estate Commission Rule 520-1-.02, how is the term 'Agency' defined?
options:
  - Every relationship in which a real estate broker acts for or represents another by the latter's
    express authority in a real property transaction
  - Every relationship in which a real estate broker acts for or represents another by the latter's
    express authority in a personal property transaction
  - Every relationship in which a real estate broker acts for or represents another by the latter's
    express authority in a real property transaction and includes property management services
  - Every relationship in which a real estate broker acts for or represents another by the latter's
    implied authority in a real property transaction
key: A
explanation: The rule defines agency as a relationship where a real estate broker acts for or
  represents another party by that party's express authority in a real property transaction. The
  option that replaces express authority with implied authority does not match the definition. The
  option that refers to personal property instead of real property is incorrect. The option that
  adds property management services to the definition introduces language not present in the rule.
