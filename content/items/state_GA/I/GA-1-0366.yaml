stem: A licensee is convicted of a criminal offense involving O.C.G.A. § 43-40-25. Within how many
  days must she notify the Commission in writing of the final disposition?
options:
  - 5 days
  - 10 days
  - 15 days
  - 30 days
key: B
explanation: Ga. Comp. R. & Regs. § 520-1-.04(5)(a) requires that notice of any criminal action be
  given to the Commission within ten days of conviction. Therefore, the correct answer is ten days.
  Five days is too short, while fifteen and thirty days exceed the required period.
