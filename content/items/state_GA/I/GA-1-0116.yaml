stem: A person passed the broker examination on June 1, 2023 and has held an active salesperson
  license for only two years of the five years preceding the application date. If they submit a
  broker license application on May 30, 2024, what additional requirement must they satisfy to be
  eligible for licensure under Ga. Comp. R. & Regs. § 520-1-.04(5)(b)?
options:
  - Show proof of having held a license in active status for at least 3 years of the five years
    immediately preceding the filing
  - Show proof of having held a license in active status for at least 1 years of the five years
    immediately preceding the filing
  - Show proof of having held a license in active status for at least 2 years of the five years
    immediately preceding the filing
  - Show proof of having held a license in active status for at least 4 years of the five years
    immediately preceding the filing
key: A
explanation: Ga. Comp. R. & Regs. § 520-1-.04(5)(b) requires that a broker applicant show proof of
  having held a license in active status for at least three years of the five years immediately
  preceding the filing. Because the applicant has only two years of active licensure, they must
  provide proof of three years to meet the statutory requirement. The alternatives that call for one
  year, two years, or four years of active licensure do not satisfy the minimum three‑year standard
  set by the rule.
