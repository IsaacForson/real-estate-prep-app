stem: According to Ga. Comp. R. & Regs. § 520-1-.04(5)(b), within what time frame must a licensee
  notify the Commission in writing of a change of mailing address?
options:
  - Within 45 days of the change
  - Within two months of the change
  - Within six weeks of the change
  - Within one month of the change
key: D
explanation: The rule requires notification within one month of any change in mailing address. The
  30‑day option incorrectly assumes a fixed 30‑day period rather than a calendar month.
