stem: A disabled veteran with a 12% service-connected disability applies for a Georgia salesperson
  license and scores 68 on the qualifying examination. According to Ga. Comp. R. & Regs. §
  520-1-.04(3)(d), what is the applicant's final score after veterans preference points are applied?
options:
  - "68"
  - "73"
  - "78"
  - "83"
key: C
explanation: Under Ga. Comp. R. & Regs. § 520-1-.04(3)(d), a disabled veteran with a disability
  rating of 10% or higher receives ten preference points that are added to the exam score for a
  salesperson license. Adding ten points to the raw score of 68 yields a final score of 78.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.04(3)(d)
  url: null
  quoted_text: Any candidate for licensure who is a disabled veteran and who served on active duty in
    the armed forces of the United States, or on active duty in a reserve component of the armed
    forces of the United States, including the National Guard, during wartime or during any conflict
    when military personnel were committed by the President of the United States shall be entitled
    to a credit of ten points if the disability was for an injury or illness incurred in line of
    duty and such disability is rated at 10 percent or above at the time of taking said examination.
    If such candidate for licensure is taking the examination in order to become licensed as a
    community association manager or a salesperson, said points shall be added to the grade made by
    the candidate for licensure in answering all questions in any such examination.
  secondary: []
math:
  worked_solution: Base score = 68. Preference points = 10. Final score = base score + preference
    points = 68 + 10 = 78.
