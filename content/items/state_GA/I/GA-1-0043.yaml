stem: A licensee receives a signed offer to purchase from a buyer for the licensee's listed
  property. Under Rule 520-1-.10, what must the licensee do with that offer?
options:
  - Hold the offer until a second offer arrives
  - Promptly tender the offer to the seller
  - Reject the offer if it is below list price
  - Forward the offer to the buyer's lender
key: B
explanation: Rule 520-1-.10 requires a licensee to promptly tender to the client any signed offer
  received on the client's property, rather than delaying delivery.
