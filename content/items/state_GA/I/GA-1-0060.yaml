stem: A licensee prepares a sales contract for a buyer that includes a financing contingency but
  omits the financing terms. According to Georgia Real Estate Commission Rule 520-1-.14, what is the
  maximum fine for this single violation?
options:
  - The maximum fine is $300.00.
  - The maximum fine is $500.00.
  - The maximum fine is $600.00.
  - The maximum fine is $800.00.
key: B
explanation: Rule 520-1-.14(b) specifies a $500 fine for failing to include financing terms in a
  sales contract with a financing contingency. The $600 amount applies to other violations such as
  late trust‑fund deposits.
