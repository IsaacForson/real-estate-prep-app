stem: A licensee receives a final citation order that requires completion of continuing education
  within 20 days. The licensee does not complete the requirement within that period. According to
  Georgia Real Estate Commission Rule 520-1-.14, what action may the Commission take?
options:
  - The Commission may impose sanctions after giving notice and an opportunity for a hearing.
  - The Commission may automatically revoke the license without further proceedings.
  - The Commission may require the licensee to pay a fine equal to twice the renewal fee.
  - The Commission may issue a warning letter but cannot impose any sanctions.
key: A
explanation: Under Rule 520-1-.14(8), the Commission may impose sanctions only after providing
  notice and an opportunity for a hearing. Thus, the correct action is to impose sanctions after
  notice and hearing. The option stating that the Commission may automatically revoke the license
  without further proceedings is wrong because the rule does not allow automatic revocation without
  notice and a hearing.
