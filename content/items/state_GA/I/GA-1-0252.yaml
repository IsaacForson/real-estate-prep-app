stem: Under Rule 520-1-.14(9), what condition must be met for prior citations to be excluded from
  consideration in a disciplinary action?
options:
  - The licensee must have contested the prior citations in a hearing.
  - The licensee must have paid all fines associated with the prior citations.
  - The licensee must have waited at least six months after the prior citations were issued.
  - The licensee must have fully complied with the terms of those prior citations.
key: D
explanation: Under Rule 520-1-.14(9), the Commission shall not consider prior citations if the
  licensee has fully complied with the terms of those citations. Therefore, full compliance is the
  condition for exclusion. Paying fines alone does not constitute full compliance with all terms of
  the citation.
