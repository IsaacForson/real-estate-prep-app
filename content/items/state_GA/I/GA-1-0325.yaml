  quoted_text: Terms Defined by 43-40-1. As used in this Chapter and Chapters 520-2 and 520-3, the
    terms "associate broker," "broker," "commission," "commissioner," "community association,"
    "community association management services," "community association manager," "licensee,"
    "person," "property management services," "purchaser," "real estate," and "salesperson" have the
