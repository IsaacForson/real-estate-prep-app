stem: According to Ga. Comp. R. & Regs. § 520-1-.02(1), which term is defined by O.C.G.A. § 43-40-1?
options:
  - Real estate client
  - Associate broker
  - Real estate agency
  - Real estate customer
key: B
explanation: The rule states that the terms listed in subsection (1), including "associate broker,"
  have the same definitions as provided in O.C.G.A. § 43-40-1. The other options are defined in
  subsection (2) of the same rule, not by the statute.
