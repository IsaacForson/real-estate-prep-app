stem: According to Ga. Comp. R. & Regs. § 520-1-.08(1)(a), within what time frame must a broker
  notify the Commission of the financial institution and account name or number after opening a
  designated trust or escrow account?
options:
  - Within one month of opening the account
  - Within fifteen days of opening the account
  - Within ninety days of opening the account
  - Within one year of opening the account
key: A
explanation: Brokers must notify the Commission of the financial institution and account name or
  number within one month of opening a trust or escrow account, as required by Ga. Comp. R. & Regs.
  § 520-1-.08(1)(a). The fifteen‑day option is incorrect because the rule specifies a one‑month
  period, not a shorter timeframe.
