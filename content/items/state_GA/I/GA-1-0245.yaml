  quoted_text: Copies of sales contracts, brokerage engagements, closing statements, leases, and other
    documents related to a real estate transaction required by law to be maintained in a broker's
    file for three years shall be made available to authorized agents of the Commission upon
    reasonable request and at a reasonable cost to the Commission.
