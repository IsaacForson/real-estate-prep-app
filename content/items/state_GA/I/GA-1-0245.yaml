stem: A broker disposes of closing statements after two years. According to Georgia Real Estate
  Commission Rule 520-1-.10(4), is this action permissible?
options:
  - Yes, if the broker keeps electronic copies instead of paper.
  - Yes, because the broker may destroy records after two years.
  - No, because records must be retained for three years.
  - No, unless the broker obtains written permission from the Commission.
key: C
explanation: The rule requires copies of closing statements and related documents to be maintained
  in a broker's file for three years; disposing after two years violates that requirement. The
  option suggesting destruction after two years is incorrect because the rule does not permit
  earlier disposal.
