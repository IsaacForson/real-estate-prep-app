stem: A firm engages a part-time assistant to help schedule showings and answer phones. Under
  Georgia Real Estate Commission Rule 520-1-.07, what type of duties may this support personnel
  perform?
options:
  - any brokerage activity approved verbally by the licensee
  - only ministerial duties that require no discretion
  - discussing a listing's terms directly with the seller
  - negotiating a commission split with another broker
key: B
explanation: Rule 520-1-.07 states that support personnel may not perform any real estate brokerage
  activities and may perform only ministerial duties that do not require discretion or the exercise
  of the support personnel's own judgment.
citation:
  source: Ga. Comp. R. & Regs. Rule 520-1-.07
  url: null
  quoted_text: Support personnel may not perform any real estate brokerage activities of a real estate
    licensee when engaged as support personnel and may perform only ministerial duties, those that
    do not require discretion or the exercise of the support personnel's own judgment.
