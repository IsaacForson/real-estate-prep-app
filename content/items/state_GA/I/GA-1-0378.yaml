stem: A licensee previously received a citation, fully complied with its terms, and is now subject
  to a contested case disciplinary proceeding. According to Ga. Comp. R. & Regs. § 520-1-.14(9),
  what may the Commission **NOT** consider when imposing the disciplinary action?
options:
  - Fine amount due
  - CE requirement
  - Prior citations
  - Criminal past
key: C
explanation: The rule provides that the Commission shall not consider prior citations if the
  licensee has fully complied with those citations. Criminal history, fine amounts, and continuing
  education are not barred by this provision, making them incorrect distractors.
