stem: Within how many years may a licensee who allowed an active license to lapse reinstate it by
  paying the required fees, provided they have completed the continuing education that would have
  been required if the license had remained active?
options:
  - One year period
  - Two year period
  - Three year period
  - Five year period
key: B
explanation: Under Rule 520-1-.04(4)(c), a licensee who lets an active license lapse for nonpayment
  of fees may reinstate to active status within two years of the lapse date if they have completed
  the continuing education that would have been required during active status. The one‑year period
  applies only to certain education‑deficiency lapses, and three or five years are not authorized
  for this scenario.
