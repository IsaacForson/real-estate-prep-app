stem: A licensee receives notice from their broker that the broker is returning the license to the
  Commission and does not affiliate with a new company or apply for inactive status within 30 days.
  According to Ga. Comp. R. & Regs. r. 520-1-.04(1)(a)4(2), what fee must the licensee pay?
options:
  - $25.00
  - $50.00
  - $100.00
  - $125.00
key: A
explanation: The rule imposes a $25.00 fee for failure to affiliate with a new company or to apply
  for inactive status within 30 days of the broker's notice.
citation:
  source: Ga. Comp. R. & Regs. r. 520-1-.04 — Ga. Comp. R. & Regs. 520-1-.04 — Obtaining a License
    (GREC-hosted official rule PDF) r. 520-1-.04(1)(a)4
  url: null
  quoted_text: $25.00 (1) for failure to notify the Commission in writing within 30 days of a change
    of address, of the opening or closing of a designated trust account, of transferring to a new
    company, or of leaving a firm to go on inactive status; (2) for failure to affiliate with a new
    company or to apply to go on inactive status within 30 days of the Commission's receipt of
    notice that the broker holding the licensee's license no longer wishes to do so and has mailed a
    letter to the licensee's last known address indicating that the broker is returning the license
    to the Commission;
