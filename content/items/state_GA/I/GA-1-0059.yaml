stem: According to Georgia Real Estate Commission Rule 520-1-.02, which of the following best
  defines an "applicant" for a real estate license?
options:
  - Any person who has submitted a license application but has not yet completed the required
    education, passed the examination, or paid the licensing fee as mandated by the Georgia Real
    Estate Commission.
  - Any person who has completed all of the requirements for a license or an approval as set forth
    in O.C.G.A. Chapter 43-40 and in any Chapter of the Commission's Rules and Regulations and who
    has submitted a complete application on the proper form accompanied by the correct fee.
  - Any person who is currently enrolled in a pre-license education course and plans to submit a
    license application after finishing the required classroom hours and passing the final exam
    administered by the school.
  - Any person who holds an active real estate license in another state and is seeking to obtain a
    Georgia license through reciprocity, which may require submitting proof of licensure, passing a
    state law exam, and paying applicable fees.
key: B
explanation: Rule 520-1-.02 defines an applicant as a person who has completed all licensing
  requirements set out in O.C.G.A. § 43‑40 and the Commission’s rules and who has submitted a
  complete application on the proper form with the correct fee. A description that a person has only
  submitted an application but has not yet completed the education, passed the exam, or paid the fee
  does not satisfy that definition.
