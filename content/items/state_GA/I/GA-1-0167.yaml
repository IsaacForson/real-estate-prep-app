stem: According to Ga. Comp. R. & Regs. r. 520-1-.02, what does the term 'brokerage relationship' mean?
options:
  - It is defined as a person who has not entered into a brokerage engagement but for whom a broker
    may perform ministerial acts.
  - It is defined as the written contract where a seller, buyer, landlord, or tenant becomes the
    broker's client and promises to pay valuable consideration.
  - It is defined as the agency and non-agency relationships between a broker and the broker's
    clients and customers resulting from a brokerage engagement.
  - It is defined as a person who has entered into a brokerage engagement with a real estate broker.
key: C
explanation: The regulation defines brokerage relationship as the agency and non-agency
  relationships that may arise between a broker and the broker's clients and customers as a result
  of a brokerage engagement, per Ga. Comp. R. & Regs. r. 520-1-.02(e).
