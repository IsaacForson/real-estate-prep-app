stem: Before the Georgia Real Estate Commission may impose sanctions on a licensee’s license for
  failing to comply with a final citation order, what must the Commission first do?
options:
  - Provide the licensee with a written warning and allow 10 days to comply.
  - Provide the licensee with notice of the failure and an opportunity for a hearing.
  - Provide the licensee with a refund of any fees paid.
  - Provide the licensee with a copy of the citation and a demand for immediate payment.
