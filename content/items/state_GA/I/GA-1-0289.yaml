stem: Under Georgia Real Estate Commission Rule 520-1-.07(5)(a), what must a broker do when seeking
  to have a licensee affiliate with the broker's firm?
options:
  - Enter into a written agreement specifying compensation terms
  - File a notice with the Commission within 10 days
  - Provide verbal notice of commission split
  - Obtain written consent from the licensee's current broker
key: A
explanation: The rule requires the broker to enter into a written agreement that specifies the
  compensation terms for the licensee's work during affiliation and for work begun but not completed
  prior to termination. The correct option reflects this written agreement requirement. The
  distractor about verbal notice is incorrect because the rule mandates a written agreement, not
  merely verbal notice.
