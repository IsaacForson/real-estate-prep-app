stem: A broker disburses trust funds from the designated trust account in a manner that contradicts
  the terms of the sale contract creating the escrow. Under Rule 520-1-.08, how does the Commission
  view this conduct?
options:
  - As demonstrating incompetence to act as a broker
  - As a matter to be resolved solely between the parties
  - As acceptable if the broker later corrects the error
  - As a minor bookkeeping error requiring no action
key: A
explanation: Rule 520-1-.08 states that disbursing trust funds contrary to the escrow contract's
  terms will be considered by the Commission to demonstrate incompetence to safeguard the public's
  interest.
