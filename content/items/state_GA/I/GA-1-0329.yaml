stem: A licensee receives trust funds on Monday, April 1, and deposits them into the trust account
  on Monday, April 8 (six business days later), with no contractual provision allowing a later
  deposit. According to Rule 520-1-.14(3)(t), what fine may be assessed for this violation?
options:
  - $500.00
  - $600.00
  - $800.00
  - $900.00
key: B
explanation: The rule imposes a $600.00 fine when trust funds are deposited more than three business
  days after receipt without a contract exception. Six business days exceeds the limit, so the
  $600.00 fine applies. The other amounts correspond to different violations.
