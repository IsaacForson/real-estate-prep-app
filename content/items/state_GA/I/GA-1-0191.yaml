stem: An applicant submits an incomplete salesperson license application that lacks a mailing
  address. Under Ga. Comp. R. & Regs. r. 520-1-.04(e), where will the Commission return the
  incomplete application?
options:
  - To the Commission's headquarters address on file
  - To the applicant's employer's address on file
  - To the Commission's last known business address on file
  - To the applicant's current email address on file
key: C
explanation: The rule specifies that if an incomplete application contains no address, the
  Commission returns it to the last known business address of record in its files. The distractor
  referencing the applicant's email address is incorrect because the rule requires a physical
  mailing address for return.
