stem: An applicant submits a broker license application by private courier on the last day of the
  filing period, but the Commission dates receipt two days after the deadline. According to Ga.
  Comp. R. & Regs. r. 520-1-.04(b), who bears the burden of proof that the application was timely
  filed?
options:
  - The Georgia Real Estate Commission
  - The applicant seeking licensure
  - The courier service handling delivery
  - The applicant's sponsoring broker
key: B
explanation: The rule places the burden of proof on the applicant or licensee when the Commission's
  receipt occurs after the deadline. The distractor suggesting the Commission bears the burden
  contradicts the explicit allocation of responsibility to the applicant.
citation:
  source: Ga. Comp. R. & Regs. r. 520-1-.04(b)
  url: null
  quoted_text: In the event that receipt by the Commission of an application or fee occurs later than
    the deadline for the filing of such application or fee, the applicant or licensee shall bear the
    burden of proof that the application or fee was timely filed.
