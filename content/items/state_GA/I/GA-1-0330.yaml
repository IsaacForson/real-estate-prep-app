stem: A licensee has a buyer sign a purchase agreement but fails to provide the buyer with a copy of
  the signed document. According to Rule 520-1-.14(3)(c), what fine may be assessed for this
  violation?
options:
  - $600.00
  - $800.00
  - $500.00
  - $400.00
key: C
explanation: The rule specifies a $500.00 fine for failing to provide a copy of any document used in
  a real estate transaction to any individual signing that document. Since the licensee did not give
  the buyer a copy, the $500.00 fine applies. The other amounts are associated with different rule
  violations.
