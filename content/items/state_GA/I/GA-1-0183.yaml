key: B
explanation: The rule states the activation fee for original licensure as a firm is $75.00, which
  includes $20.00 for the Real Estate Education, Research, and Recovery Fund. The $45.00 fee applies
  to individual brokers, associate brokers, salespersons, and community association managers, while
  $100.00 and $125.00 are renewal fees for offline and online submissions respectively.
