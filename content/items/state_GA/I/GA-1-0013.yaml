stem: Georgia Real Estate Commission Rule 520-1-.14 allows the Commission to issue a citation in
  lieu of pursuing formal sanctions. Which of these may a citation include?
options:
  - an order for coursework and a capped fine
  - automatic revocation of the licensee's firm license
  - a permanent bar on renewing any real estate license
  - mandatory prosecution referred to the district attorney
key: A
explanation: Rule 520-1-.14 provides that a citation may include an order to complete a course of
  study, file periodic trust account reports, and pay a fine not to exceed $1,000 for each
  violation, up to $5,000 per citation.
citation:
  source: Ga. Comp. R. & Regs. Rule 520-1-.14
  url: null
  quoted_text: A citation issued by the Commission may include an order to complete a course of study
    in real estate brokerage or instruction; to file periodic reports by an independent accountant
    on a real estate broker's designated trust account; and/or to pay a fine not to exceed $1,000.00
    for each violation, with fines for multiple violations limited to $5,000.00 in any one citation.
