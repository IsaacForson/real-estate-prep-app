stem: The Commission serves a licensee with a citation on its own motion, and the licensee takes no
  further action. Under Georgia Real Estate Commission Rule 520-1-.14, when does the order in the
  citation become final?
options:
  - immediately upon the Commission's mailing of the citation
  - 30 days after the date of service upon the licensee
  - 90 days after the licensee's next license renewal
  - only after a formal contested case hearing is held
key: B
explanation: Rule 520-1-.14 states that when the Commission issues a citation on its own motion, the
  order becomes final 30 days after the date of service upon the licensee unless the licensee
  reaches an alternative agreement or requests a contested case hearing.
