  - $65.00
  - $20.00
  - $25.00
key: A
explanation: Rule 520-1-.04(a)(1) states the activation fee for original licensure as an individual
  broker is $45.00, which includes $20.00 for the Real Estate Education, Research, and Recovery
  Fund. Therefore the total fee is $45.00. The $20.00 option reflects only the fund portion, not the
  total activation fee.
