stem: A broker renewed their active license on August 1, 2025. According to Ga. Comp. R. & Regs. r.
  520-1-.05(1)(f), how many hours of continuing education on the topic of broker education must the
  broker have completed to be eligible for that renewal?
options:
  - 21 hours
  - 12 hours
  - 18 hours
  - 15 hours
key: C
explanation: The rule mandates at least eighteen (18) hours of broker‑education CE for renewals on
  or after July 1, 2025, and the renewal date falls after that effective date. The distractor of 15
  hours mistakenly subtracts three hours from the required total.
