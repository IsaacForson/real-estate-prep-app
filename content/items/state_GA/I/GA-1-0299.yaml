stem: A broker, acting as escrow agent, disburses earnest money to the seller before the closing
  date, despite the purchase agreement stating that funds are to be released only at closing.
  According to Ga. Comp. R. & Regs. r. 520-1-.08(3)(a), what is the likely consequence for the
  broker?
options:
  - Being considered to have demonstrated incompetence as a broker
  - Being allowed to keep the disbursed amount as commission without approval
  - Being permitted to continue as escrow agent after notifying the Commission in writing
  - Being required to refund the earnest money immediately to the parties
key: A
explanation: Disbursing earnest money before the closing date violates the contract terms, which
  triggers the rule that such conduct is considered demonstrated incompetence. The distractors
  suggest remedies or allowances that the rule does not provide for this violation.
