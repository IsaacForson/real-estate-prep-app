stem: According to Georgia Real Estate Commission Rule 520-1-.06(6), how often must a broker who is
  required to maintain a trust or escrow account cause a written reconciliation statement to be
  made?
options:
  - The broker must perform the reconciliation monthly.
  - The broker must perform the reconciliation quarterly.
  - The broker must perform the reconciliation semi-annually.
  - The broker must perform the reconciliation annually.
key: A
explanation: The rule states that a broker shall cause a written reconciliation statement to be made
  at least monthly. Therefore, monthly is the minimum required frequency. Quarterly is insufficient
  because it does not meet the 'at least monthly' standard.
