stem: A broker shows a property to a prospective buyer who has not signed any agreement authorizing
  the broker to represent them. Under Ga. Comp. R. & Regs. § 520-1-.02(2)(a), is this an agency
  relationship?
options:
  - No, because the buyer is not a client.
  - No, because the broker lacks the buyer's express authority.
  - Yes, because the broker is acting for the buyer.
  - Yes, because the buyer is a purchaser.
key: B
explanation: The definition of "agency" requires the broker to act for or represent another by the
  latter's express authority in a real property transaction. Since the buyer has not given express
  authority, no agency relationship exists. The option claiming "Yes, because the broker is acting
  for the buyer" is incorrect because express authority is mandatory, not merely acting for the
  buyer.
citation:
