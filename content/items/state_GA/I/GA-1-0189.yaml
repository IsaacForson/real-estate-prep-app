stem: Under Ga. Comp. R. & Regs. r. 520-1-.04(b), what determines the effective date of an
  application filed by private courier or delivery service?
options:
  - The date the Commission receives the application in its mailroom
  - The date the Commission stamps receipt of the application
  - The date the applicant hands the application to the courier
  - The date the applicant signs the application form
key: B
explanation: The rule states that for filings not made by mail, the effective date is the date the
  Commission dates receipt of the application or fee. The distractor about the USPS postmarked date
  applies only to mailed filings.
