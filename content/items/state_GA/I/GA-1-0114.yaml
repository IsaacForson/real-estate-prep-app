stem: Under Georgia Real Estate Commission Rule 520-1-.04(g), for how long must the Commission
  maintain the paper record of an original application submitted on paper for licensure as a broker,
  salesperson, or other license type?
options:
  - 120 months
  - 240 months
  - 180 months
  - 60 months
key: C
explanation: The rule provides that the Commission shall keep the paper record for a period of 15
  years before it may be destroyed. Fifteen years equals 180 months, which matches the answer choice
  stating 180 months. The answer choice stating 120 months reflects ten years, which is shorter than
  the required retention period.
