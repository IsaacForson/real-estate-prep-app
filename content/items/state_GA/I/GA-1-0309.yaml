stem: According to Georgia Real Estate Commission Rule 520-1-.14(3)(bb), what is the fine for a
  licensee who fails to deposit earnest money, security deposits, or other trust funds according to
  the terms of a contract?
options:
  - $900 per contract
  - $800 per contract
  - $600 per contract
  - $500 per contract
key: B
explanation: The rule explicitly states a fine of $800 per contract for failing to deposit earnest
  money, security deposits, or other trust funds according to the contract terms. The $600 per
  contract distractor applies to other violations such as failing to present a signed offer
  promptly, not to earnest money deposit terms.
