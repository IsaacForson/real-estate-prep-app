stem: Under Rule 520-1-.10, which of the following representations by a licensee is prohibited?
options:
  - Stating that the payment was made by cash when it was actually made by check.
  - Stating that the earnest money deposit is $5,000 when the actual deposit is $5,000.
  - Stating that the downpayment is $20,000 when the actual downpayment is $20,000.
  - Stating that the sales price is $300,000 when the actual price is $250,000.
key: C
explanation: The rule bars any representation of an amount other than the true and actual sales,
  lease, or exchange price, downpayment, or earnest money (see § 520-1-.10(5)(a)). The correct
  option describes a false sales‑price statement, which is prohibited. The other options convey the
  true amounts or method of payment, which the rule does not forbid.
