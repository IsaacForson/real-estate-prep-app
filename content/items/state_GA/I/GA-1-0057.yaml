stem: A salesperson whose birthday is March 15 fails to pay the renewal fee. On what date will the
  license lapse under Georgia Real Estate Commission Rule 520-1-.04(3)(a)?
options:
  - February 28
  - April 30
  - March 31
  - March 15
key: C
explanation: The rule provides that an individual license lapses on the last day of the month of the
  licensee's birthday. For a March 15 birthday, the last day of March is March 31. The distractor
  April 30 incorrectly uses the following month, while February 28 and March 15 do not match the
  last day of the birthday month.
