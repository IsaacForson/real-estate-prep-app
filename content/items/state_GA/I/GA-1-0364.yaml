stem: Under Ga. Comp. R. & Regs. § 520-1-.04(6)(f), what is prohibited for a Georgia licensee
  regarding brokerage acts on property located in another state?
options:
  - Performing brokerage acts without being licensed in that state or complying with that state's
    laws
  - Performing brokerage acts only after obtaining a nonresident license
  - Performing brokerage acts only on residential property in Georgia and following state rules
  - Performing brokerage acts if they have a written agreement with an out-of-state broker and
    paying fees
key: A
explanation: The rule explicitly prohibits a Georgia licensee from performing brokerage acts on
  out-of-state property without first being properly licensed in that state or otherwise complying
  fully with that state's laws regarding real estate brokerage. This option states that performing
  brokerage acts without being licensed in that state or complying with that state's laws is
  prohibited, which matches the rule. The option stating that performing brokerage acts only after
  obtaining a nonresident license is incorrect because a nonresident license does not authorize
  brokerage acts in another state; it only permits the licensee to act in Georgia while residing
  elsewhere. The remaining options describe scenarios that are not addressed by the rule and
  therefore do not represent the prohibited conduct.
citation:
  source: Ga. Comp. R. & Regs. § 520-1-.04(6)(f)
  url: null
  quoted_text: No Georgia licensee may perform or attempt to perform any of the acts of a broker as
    defined in O.C.G.A. Section 43-40-1 on property located in another state without having first
    been properly licensed in that state or otherwise complied fully with that state's laws
    regarding real estate brokerage.
