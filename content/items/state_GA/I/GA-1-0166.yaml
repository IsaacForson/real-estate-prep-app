stem: Licensee Dana wants to rebate part of her commission to Ethan, the buyer, in a transaction.
  According to Georgia Real Estate Commission Rule 520-1-.10, what condition must Dana meet for the
  rebate to be permissible?
options:
  - Rebate only if the transaction involves a lease rather than a purchase
  - Limit the rebate to no more than ten percent of the total commission
  - Obtain written consent from the lender before closing the transaction
  - Disclose the rebate on the closing statement and keep it transparent
key: D
explanation: The rule permits a licensee to rebate any part of a commission provided the rebate is
  disclosed on the closing statement and does not mislead any other party involved in the
  transaction. The option stating that the rebate is limited to no more than ten percent of the
  total commission adds a percentage limit that the rule does not contain. The option requiring
  written consent from the lender before closing adds a lender‑approval requirement that the rule
  does not contain. The option limiting rebates to lease transactions adds a lease‑only restriction
  that the rule does not contain.
citation:
