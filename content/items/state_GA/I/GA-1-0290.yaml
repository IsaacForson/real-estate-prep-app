stem: A licensee leaves Broker A's firm and takes with them a list of prospective client names that
  were given to the licensee in writing during their affiliation. According to Ga. Comp. R. & Regs.
  § 520-1-.07(5)(c), what is the licensee required to do with those names?
options:
  - Account for the names to the releasing broker
  - Submit the list to the Commission office
  - Keep the list for personal future use
  - Destroy the list immediately upon leaving the firm
key: A
explanation: The rule states that the names of all prospective customers or clients given in writing
  to the departing licensee must be accounted for to the releasing broker. Therefore, the licensee
  must provide those names to the broker they are leaving. The distractor about keeping the list for
  personal use is incorrect because the rule requires accounting for the names to the broker, not
  retaining them for personal use.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
