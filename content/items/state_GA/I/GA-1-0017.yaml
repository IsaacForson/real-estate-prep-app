stem: All parties sign and accept an offer to purchase a home involving two brokerage firms. Under
  Georgia Real Estate Commission Rule 520-1-.10, how must copies of the accepted contract be
  distributed?
options:
  - one to each signer and one to each firm involved
  - one to each signer only, with firms retrieving copies later
  - a single master copy retained by the listing firm
  - copies distributed only if requested by a signing party
key: A
explanation: Rule 520-1-.10 requires that once an offer is accepted and signed by all parties,
  copies of the document be distributed one to each person signing and one to each brokerage firm
  involved in the transaction.
