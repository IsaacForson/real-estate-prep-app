  source: Ga. Comp. R. & Regs. Rule 520-1-.10
  url: null
  quoted_text: If any offer to purchase, sell, lease, or exchange is accepted and signed by all
    parties, copies of that document shall be properly distributed, one to each person signing the
    document and one to each brokerage firm involved in the transaction.
