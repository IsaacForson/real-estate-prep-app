stem: A licensee held an active real estate license in another state from January 2019 through
  December 2021. They apply for a Georgia broker license on March 1, 2023 and submit a certification
  from the other state dated February 15, 2023. Assuming the certification shows they passed the
  exam, met prelicense and continuing education requirements, are in good standing, and have no
  disciplinary action, what is the outcome under Rule 520-1-.04(g)?
options:
  - The licensee must complete additional continuing education before being eligible for licensure.
  - The licensee may be granted a Georgia broker license without further examination.
  - The licensee must first obtain a salesperson license in Georgia before applying for a broker
    license.
  - The licensee must take and pass the Georgia broker examination because the certification is
    older than 12 months.
key: B
explanation: Rule 520-1-.04(g) allows a licensee moving from another state to be granted a Georgia
  license without further examination if they provide an original certification issued no more than
  twelve months prior to application showing they passed the exam, met prelicense and CE
  requirements, are in good standing, and have no disciplinary action. The certification dated
  February 15, 2023 is within twelve months of the March 1, 2023 application, and the other
  conditions are satisfied, so no further examination is required.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.04
  url: null
  quoted_text: "A candidate for licensure for licensure who has moved to Georgia from another state or
    a candidate for licensure for non-resident licensure may be granted a license without further
    examination or education if such candidate for licensure produces, from the licensing body of
    each state which has licensed the candidate for licensure, an original certification issued no
    more than twelve months prior to the candidate for licensure making application for licensure
    which shows that the candidate for licensure: 1. has passed an examination for the type of
    license for which such candidate for licensure seeks licensure in Georgia; 2. has met all
    prelicense and continuing education requirements required by such other state(s) for that
    license; 3. is licensed in good standing at the time of the certification; and 4. has not had
    any disciplinary action imposed by such state's licensing body."
