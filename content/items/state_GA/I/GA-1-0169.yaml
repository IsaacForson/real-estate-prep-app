stem: A licensee is asked to perform a task for a customer. Which of the following tasks would be
  considered a ministerial act under Ga. Comp. R. & Regs. r. 520-1-.02?
options:
  - The licensee prepares a comparative market analysis to suggest a listing price.
  - The licensee advises the buyer on whether the purchase price is fair based on market data.
  - The licensee delivers a signed purchase agreement to the buyer's attorney without altering its
    contents.
  - The licensee negotiates the repair credits requested by the seller after inspection.
key: C
explanation: Ga. Comp. R. & Regs. r. 520-1-.02(r) defines ministerial acts as those performed for a
  person that do not require discretion or the exercise of judgment. Delivering a signed purchase
  agreement to the buyer's attorney without altering its contents involves no discretion, so it is a
  ministerial act. Preparing a comparative market analysis, advising on whether a price is fair, and
  negotiating repair credits each require the licensee to exercise judgment or discretion, so they
  are not ministerial.
