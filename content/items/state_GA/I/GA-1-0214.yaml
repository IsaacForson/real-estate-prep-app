stem: According to Georgia Real Estate Commission Rule 520-1-.04(i), what occurs when an active
  licensee’s license lapses for failure to complete any required continuing education and the
  licensee then pays the renewal fee?
options:
  - The licensee remains active and must complete the missed continuing education before renewal.
  - The licensee becomes an inactive licensee and is subject to the rules governing inactive status.
  - The licensee must submit proof of completing the required continuing education before
    reactivation.
  - The licensee must pay a penalty fee and complete additional education to regain active status.
key: B
explanation: The rule states that an active licensee whose license lapses for not completing any
  continuing education required for renewal shall automatically, upon paying a renewal fee, become
  an inactive licensee and be subject to the rules governing inactive status. The option stating
  that the licensee remains active and must complete the missed continuing education before renewal
  is incorrect because the licensee does not remain active; it becomes inactive regardless of
  completing the missed education.
citation:
  source: Ga. Comp. R. & Regs. § 520-1-.04(i)
  url: null
  quoted_text: Any active licensee whose license lapses for not completing any continuing education
    required for renewal of a license shall automatically upon paying a renewal fee become an
    inactive licensee and subject to the rules which govern an inactive license.
