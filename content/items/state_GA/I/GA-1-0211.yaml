stem: A broker wishes to retain part of the earnest money as commission after a sales transaction
  has closed. According to Georgia Real Estate Commission Rule 520-1-.08(3)(d), which condition must
  be satisfied for the broker to be deemed to have complied with O.C.G.A. § 43-40-20(e)?
options:
  - The broker has received written approval from the Georgia Real Estate Commission to retain the
    earnest money and disburse funds accordingly
  - The broker has deposited the earnest money into an interest-bearing account and notified the
    parties of the interest earned
  - The broker has disclosed the commission on the closing statement and obtained the buyer’s
    written consent before closing
  - The broker has secured a separate written agreement signed by all parties agreeing the broker is
    entitled to the commission
key: D
explanation: The rule states that claiming earnest money as commission complies with O.C.G.A. §
  43-40-20(e) only when the broker has a separate written agreement signed by all interested parties
  agreeing to the commission. Verbal consent, Commission approval, or depositing into an
  interest‑bearing account do not satisfy this requirement.
