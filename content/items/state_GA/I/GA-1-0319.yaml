key: A
explanation: The rule states a $100.00 fee for submitting a check returned unpaid or for a
  chargeback resulting from a disputed credit‑card payment. Therefore the correct fee is $100.00.
  The $25.00 distractor applies to failure to notify the Commission of an address change, not to
  returned checks.
