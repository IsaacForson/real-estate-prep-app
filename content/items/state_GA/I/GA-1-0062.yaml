stem: According to Georgia Real Estate Commission Rule 520-1-.04(b), what continuing education
  requirement applies to a licensee who was exempt from CE, allowed the license to lapse for more
  than one year, and reinstated by paying the required fees?
options:
  - The licensee must retake the salesperson prelicense course.
  - The licensee must complete 10 hours of continuing education before reinstatement.
  - The licensee remains exempt from continuing education requirements.
  - The licensee becomes subject to the continuing education requirements of O.C.G.A. § 43-40-8(e).
key: D
explanation: Rule 520-1-.04(b) states that a licensee who was exempt from the continuing education
  requirements of O.C.G.A. § 43‑40‑8(e), lets the license lapse for longer than one year, and
  reinstates by paying the required fees shall thereafter be subject to those continuing education
  requirements. Therefore, the licensee becomes subject to the continuing education requirements of
  O.C.G.A. § 43‑40‑8(e). The statement that the licensee must retake the salesperson prelicense
  course is incorrect because the rule does not require a pre‑license course after reinstatement; it
  only removes the exemption and imposes the standard CE requirement.
