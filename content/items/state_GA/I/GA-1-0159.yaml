stem: A licensee wishes to advertise a residential property that is currently listed with another
  brokerage firm. The licensee has obtained written permission from the property owner to advertise
  the property. According to Georgia Real Estate Commission Rule 520-1-.09(3), what additional
  action must the licensee take before publishing the advertisement?
options:
  - The licensee must disclose that the property is listed with another firm and name the listing
    firm unless that firm has waived the disclosure in writing.
  - The licensee must include the licensee's own firm name and telephone number in the advertisement
    and ensure they are at least as prominent as any affiliated licensee's information.
  - The licensee must secure written permission from both the property owner and the listing firm
    before advertising any real estate for sale, rent, lease, or exchange.
  - The licensee must refrain from making any additional disclosures beyond the owner's written
    permission unless the listing firm waives them in writing.
key: A
explanation: The rule requires that when advertising property listed with another firm, the licensee
  must clearly and conspicuously disclose that fact and the name of the listing firm unless the
  listing firm has waived the disclosure in writing. The requirement that the licensee include the
  licensee’s own firm name and telephone number and ensure they are at least as prominent as any
  affiliated licensee’s information is not mandated by this subsection.
