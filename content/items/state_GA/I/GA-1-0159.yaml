  quoted_text: When such permission is granted, a licensee advertising real estate that is listed with
    another firm shall clearly and conspicuously disclose that fact and the name of the listing firm
    unless the listing firm has expressly agreed in writing to waive those clear and conspicuous
    disclosures.
