stem: A licensee receives a signed purchase offer from a buyer. The seller has a written agreement
  with another broker stating that broker will not provide negotiation services to the seller.
  According to Ga. Comp. R. & Regs. § 520-1-.10(1), may the licensee who obtained the offer
  negotiate the sale directly with the seller?
options:
  - Yes, if the licensee knows of the written agreement.
  - No, direct negotiation is prohibited unless the buyer is the licensee's client.
  - No, the licensee must provide a copy of the offer to the other broker.
  - Yes, but only after providing a copy of the offer to the other broker.
key: A
explanation: The rule allows a licensee who obtains an offer to negotiate directly with the offeree
  if the licensee knows that the offeree has a written outstanding agreement that expressly provides
  the other licensee will not provide negotiation services. Since the seller has such an agreement
  and the licensee is aware of it, direct negotiation is permissible. Providing a copy of the offer
  to the other broker is not required under this exception, and the prohibition does not depend on
  whether the buyer is the licensee's client.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
