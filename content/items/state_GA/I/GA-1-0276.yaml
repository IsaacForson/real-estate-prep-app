    Regulations site, fetched live § (6)(d)
  url: null
  quoted_text: the term "licensee's principal" shall, in the specific real estate transaction for
    which disclosure is required, mean both the client of the broker and a customer of the broker if
    the customer is working primarily with the broker and is not being represented by another broker
    in the transaction.
