stem: "According to Georgia Real Estate Commission Rule 520-1-.06(6)(d), a customer who is working
  primarily with the broker but is also represented by another broker in the same transaction is:"
options:
  - The customer is considered the licensee's principal for disclosure purposes in the specific real
    estate transaction.
  - The customer is not considered the licensee's principal because the customer is represented by
    another broker in the transaction.
  - The customer is considered the licensee's principal only if the broker discloses the rebate to
    the customer in the transaction.
  - The customer is considered the licensee's principal only if the customer pays a fee to the
    broker for the referral in the transaction.
key: B
explanation: The rule excludes from the definition any customer who is being represented by another
  broker, so such a customer is not a licensee's principal. The distractor that treats the customer
  as a principal incorrectly overlooks the representation disqualification.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
