stem: Which condition disqualifies a veteran from receiving preference points under Georgia Real
  Estate Commission Rule 520-1-.04(e)?
options:
  - Has a disability rating below ten percent
  - Has not received an honorable discharge
  - Served less than ninety days of active duty
  - Served exclusively during peacetime periods
key: B
explanation: Rule 520-1-.04(e) states that veterans preference points shall not apply to any
  candidate who has not been honorably discharged. Therefore, lacking an honorable discharge
  disqualifies the candidate from receiving the five‑ or ten‑point credit. The other options—serving
  fewer than 90 days, having a disability rating under 10%, or serving only in peacetime—do not
  automatically void the preference under the rule. Only the discharge status is expressly excluded.
