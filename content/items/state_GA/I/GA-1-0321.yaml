stem: An individual licensee allowed their license to lapse for five months. What is the total
  reinstatement fee?
options:
  - $150.00
  - $225.00
  - $100.00
  - $125.00
key: C
explanation: Because the lapse is more than four months but less than six months, the rule provides
  a base $100.00 reinstatement fee with no additional monthly charge. Thus the total fee is $100.00.
  The $125.00 distractor mistakenly adds a single month’s surcharge, which only applies after six
  months.
