stem: A licensee moves their business address and fails to notify the Georgia Real Estate Commission
  in writing within 30 days. According to Ga. Comp. R. & Regs. § 520-1-.04(1)(a)4, what fee must the
  licensee pay?
options:
  - $45.00
  - $100.00
  - $25.00
  - $75.00
key: C
explanation: The rule explicitly states a $25.00 fee for failure to notify the Commission in writing
  within 30 days of a change of address, among other events. The $45.00 amount is the activation fee
  for original licensure, not the notification fee.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
