stem: A property manager working for a brokerage firm obtains the owner's signature on a written
  property management agreement for a rental house. According to Georgia Real Estate Commission Rule
  520-1-.06(2)(b), what must the property manager do at that time?
options:
  - The property manager must submit the agreement to the Commission within 24 hours
  - The property manager must notify the owner's lender of the agreement
  - The property manager must give the owner a legible copy of the agreement
  - The property manager must keep the agreement in the firm's files only
key: C
explanation: The rule requires the licensee to give the owner a legible copy of the management
  agreement at the time the owner's signature is obtained. Keeping the copy only, submitting it to
  the Commission, or notifying the lender are not required by this provision.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
