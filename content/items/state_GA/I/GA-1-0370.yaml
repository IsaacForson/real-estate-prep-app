stem: A broker licensed in Florida holds an active license there and wishes to act as the qualifying
  broker for an out-of-state limited liability company that has obtained a Georgia real estate
  license from the Commission and is authorized to transact business in Georgia. According to Ga.
  Comp. R. & Regs. § 520-1-.04(c), is the Florida broker permitted to serve as the qualifying
  broker?
options:
  - The broker may serve as qualifying broker only if they also obtain a Georgia nonresident license
  - The broker may not serve as qualifying broker because the LLC must be a Georgia entity to
    conduct real estate brokerage activity in Georgia
  - The broker may serve as qualifying broker because the LLC is licensed by the Commission and
    authorized to do business in Georgia
  - The broker may not serve as qualifying broker because only Georgia residents can be qualifying
    brokers in the State of Georgia
key: C
explanation: The rule expressly allows a nonresident broker to be the qualifying broker for an
  out-of-state entity that is licensed by the Commission and authorized to do business in Georgia.
  The distractor claiming the broker must also obtain a Georgia nonresident license adds a
  requirement not found in the rule.
citation:
