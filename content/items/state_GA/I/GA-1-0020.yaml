stem: A broker's trust account has several open transactions with earnest money still held for
  pending sales. Under Georgia Real Estate Commission Rule 520-1-.08, how is the broker's trust
  liability defined for purposes of the required monthly reconciliation?
options:
  - the broker's operating account balance at month end
  - the total commissions the broker expects to earn on sales
  - the value of properties currently listed with the firm
  - the sum of all deposits received or held by the broker
key: D
explanation: Rule 520-1-.08 defines the broker's trust liability as the sum total of all deposits
  received, required by contract to be deposited, and being held by the broker at any point in time.
