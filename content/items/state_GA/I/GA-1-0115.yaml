stem: A license candidate passes the salesperson examination on January 20, 2024. If they submit
  their license application on August 20, 2024, what must they do according to Ga. Comp. R. & Regs.
  § 520-1-.04(5)(a)?
options:
  - Pay the original application fee now
  - Pay double the original application fee now
  - Pay triple the original application fee now
  - Pay quadruple the original application fee now
key: B
explanation: Because the application is submitted more than three months but less than twelve months
  after passing the exam, the rule requires payment of a fee equal to two times the original
  application fee. Therefore the candidate must pay double the original fee now. A fee of three or
  four times the original applies only when the application is filed after twelve months.
