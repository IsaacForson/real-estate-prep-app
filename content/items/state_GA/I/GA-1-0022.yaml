stem: What identifier must a licensee include on a brokerage engagement or offer for each firm and
  licensee participating in the transaction?
options:
  - The broker’s state‑issued real‑estate license expiration date
  - The broker’s National Association of Realtors membership number
  - The broker’s federal tax identification number
  - The six‑digit license number issued by the Commission for each firm and licensee
key: A
explanation: The rule requires inclusion of the six‑digit license number issued by the Commission
  for each firm and each licensee (Rule 520-1-.10(2)). The other identifiers are not mandated by the
  rule.
citation:
  source: Ga. Comp. R. & Regs. § 520-1-.10(2)
  url: null
  quoted_text: A licensee preparing or signing a brokerage engagement or an offer to purchase, sell,
    lease, or exchange real property shall include the license number issued by the Commission of
    each firm and of each licensee participating in the transaction. The licensee shall include the
    six digit license number issued by the Commission.
