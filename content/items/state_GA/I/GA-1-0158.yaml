stem: According to Georgia Real Estate Commission Rule 520-1-.09(1)(a), how is the term
  'advertising' or 'advertisement' defined?
options:
  - Any signs placed on real property indicating the property is available for sale, lease, or
    exchange to prospective buyers or tenants.
  - Any publication in a newspaper or magazine that lists real estate properties for sale or lease
    to the general public.
  - Any written or oral communication that promotes a real estate transaction to a specific
    individual, regardless of the medium used.
  - Any manner, method, or activity by which a licensee through the use of any media makes known to
    the general public real estate for sale, rent, lease, or exchange.
key: D
explanation: Georgia Real Estate Commission Rule 520-1-.09(1)(a) defines advertising as any manner,
  method, or activity by which a licensee, through any media, makes known to the general public real
  estate for sale, rent, lease, or exchange. The option that describes advertising as any written or
  oral communication that promotes a real estate transaction to a specific individual, regardless of
  the medium used, is incorrect because the definition requires the communication be to the general
  public, not to a particular individual.
