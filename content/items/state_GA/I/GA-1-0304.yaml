stem: Before a Georgia licensee lists, sells, buys, exchanges, rents, leases, or options real estate
  in their own name or in the name of another entity where they are an officer, employee,
  beneficiary, or member, what must they do?
options:
  - Obtain a separate broker license
  - Complete continuing education
  - Advise the broker in writing
  - File a notice with the Commission
key: C
explanation: The rule requires the licensee to first advise the broker in writing before acting as
  principal in any real estate transaction. Advising the broker in writing satisfies this
  requirement. Obtaining a separate broker license, filing a notice with the Commission, or
  completing continuing education are not required by this provision.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live .11(1)
  url: null
  quoted_text: No licensee shall be permitted to list, sell, buy, exchange, rent, lease, or option or
    offer to list, sell, buy, exchange, rent, lease, or option real estate, either in individual or
    multiple parcels, in the licensee's own name or in the name of any other firm or entity in which
    the licensee is an officer, employee, beneficiary, or member of such firm or other entity acting
    as principal without first advising, in writing, the broker for whom the real estate licensee is
    acting.
