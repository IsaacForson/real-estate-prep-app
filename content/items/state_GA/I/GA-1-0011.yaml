citation:
  source: Ga. Comp. R. & Regs. Rule 520-1-.02
  url: null
  quoted_text: "\"Brokerage engagement\" means a written contract wherein the seller, buyer, landlord,
    or tenant becomes the client of the broker and promises to pay the broker a valuable
    consideration or agrees that the real estate broker may receive a valuable consideration from
    another in consideration of the broker's producing a seller, buyer, tenant, or landlord ready,
    able, and willing to sell, buy, or rent the property or in consideration of the broker's
    performing property management services or performing community association management
    services."
