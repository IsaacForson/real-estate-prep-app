stem: Under Ga. Comp. R. & Regs. § 520-1-.04(5)(a), within how many days must a licensee notify the
  Commission in writing of the final disposition of an administrative or civil action?
options:
  - Five (5) days
  - Ten (10) days
  - Twenty (20) days
  - Fifteen (15) days
key: B
explanation: The rule requires written notice to the Commission within ten (10) days after the
  conclusion of administrative or civil proceedings. The distractor of five (5) days incorrectly
  halves the required period.
