stem: An individual licensee renews her license through the Commission's Internet on-line renewal
  system. What is the renewal fee?
options:
  - $100.00
  - $125.00
  - $45.00
  - $75.00
key: A
explanation: The rule sets the renewal fee at $100.00 for each individual licensee when payment is
  made through the Commission's Internet on-line system. Hence the correct fee is $100.00. The
  $125.00 amount applies when the renewal is submitted by any other method, not via the Internet.
