stem: A licensee preparing an offer to purchase property works for XYZ Brokerage (firm license
  number 987654) and holds individual license number 321098. According to Rule 520-1-.10(2), what
  must the licensee include on the offer?
options:
  - Include no license numbers but provide a copy
  - Include the individual's license number and a copy
  - Include the firm's license number and a copy
  - Include both the firm's and individual's license numbers
key: D
explanation: The rule mandates that any licensee preparing or signing an offer must include the
  Commission‑issued license number of each firm and each licensee participating in the transaction.
  Therefore both the firm’s and the individual’s six‑digit numbers must appear on the offer.
  Including only one number or omitting numbers fails to meet this requirement, and providing a copy
  does not substitute for the license numbers.
