stem: Licensee Alex receives a signed purchase offer from Bailey, who is Alex's client. The seller,
  Chris, is not represented by any licensee. According to Georgia Real Estate Commission Rule
  520-1-.10, what must Alex do with the offer?
options:
  - Promptly tender the offer to Bailey
  - Promptly tender the offer to Chris
  - Provide a copy of the offer to Chris
  - Discard the offer after 24 hours
key: A
explanation: The rule requires a licensee to promptly tender any signed offer to the client or
  customer who made it. Since Bailey is Alex's client, Alex must tender the offer to Bailey.
  Promptly tendering the offer to Chris is incorrect because the offer need not be tendered to the
  unrepresented seller. Providing a copy of the offer to Chris misapplies the copy requirement,
  which applies only when the offeror is not a client. Discarding the offer after 24 hours is not
  permitted.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
