stem: An individual licensee allowed their license to lapse for eight months. What is the total
  reinstatement fee for this licensee?
options:
  - $150.00
  - $100.00
  - $125.00
  - $175.00
key: A
explanation: For an individual license reinstated more than four months after lapsing, the base fee
  is $100.00 plus $25.00 for each month or portion of a month beyond six months. Eight months lapsed
  exceeds six months by two months, adding $50.00, for a total of $150.00. The $125.00 distractor
  incorrectly adds only one month's additional fee.
