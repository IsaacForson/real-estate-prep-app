stem: A broker residing in Florida holds an active Georgia broker license and wishes to serve as the
  qualifying broker for a Georgia-licensed limited liability company that is authorized to do
  business in Georgia. According to Georgia Real Estate Commission Rule 520-1-.02(c), what is the
  broker's eligibility?
options:
  - The broker is ineligible unless also licensed in Florida
  - The broker is eligible to serve as qualifying broker
  - The broker is eligible only if the LLC members are Georgia residents
  - The broker is ineligible due to residency requirements
key: B
explanation: The rule permits a nonresident broker to serve as qualifying broker for any
  corporation, LLC, or partnership licensed by the Commission, regardless of the broker's state of
  residence. Therefore, the Florida broker is eligible. The incorrect options add residency,
  ownership, or licensing conditions that the rule does not require.
