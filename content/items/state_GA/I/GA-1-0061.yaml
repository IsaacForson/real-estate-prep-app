stem: If a licensee requests a contested case hearing after being served with a citation under
  Georgia Real Estate Commission Rule 520-1-.14, what effect does this have on when the citation
  order becomes final?
options:
  - The citation order will become final after 30 days regardless of whether a hearing request is
    filed.
  - The citation order will not become final at the 30‑day mark; finality is delayed until after the
    hearing concludes.
  - The citation order will become final immediately after the hearing request is submitted.
  - The citation order will be dismissed if the licensee requests a contested case hearing.
key: B
explanation: Georgia Real Estate Commission Rule 520-1-.14 provides that the order in a citation
  becomes final 30 days after service unless the licensee has requested a contested case hearing, in
  which case finality is postponed until the hearing is resolved. The statement that the citation
  order becomes final immediately after the hearing request is submitted is therefore incorrect.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.14
  url: null
  quoted_text: "When the Commission issues a citation on its own motion, the order in the citation
    shall become final when 30 days have passed since the date of service of the citation upon the
    licensee either personally or by certified mail or statutory overnight delivery unless prior to
    that time: (a) the licensee and the Commission have reached agreement on alternative terms; or
    (b) the licensee has requested a contested case hearing."
