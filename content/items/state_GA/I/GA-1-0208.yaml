stem: Under Georgia Real Estate Commission Rule 520-1-.02(2)(i), what is prohibited for a licensee
  who places their license on inactive status?
options:
  - A licensee may place the license on inactive status and perform real estate brokerage activity
    for an unlicensed person.
  - A licensee may not place the license on inactive status and perform real estate brokerage
    activity for an unlicensed person.
  - A licensee may place the license on inactive status and perform real estate brokerage activity
    only if the unlicensed person consents in writing.
  - A licensee may not place the license on inactive status but may perform real estate brokerage
    activity for an unlicensed person if supervised by a broker.
key: B
explanation: Under Georgia Real Estate Commission Rule 520-1-.02(2)(i), a licensee may not place the
  license on inactive status while performing real estate brokerage activity for an unlicensed
  person. The option that says a licensee may place the license on inactive status and perform real
  estate brokerage activity for an unlicensed person is incorrect.
