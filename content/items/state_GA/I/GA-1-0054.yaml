stem: A disabled veteran with a service-connected disability rated at 12 percent is applying for a
  Georgia salesperson license. How many veteran preference points will be added to the applicant's
  examination score under Georgia Real Estate Commission Rule 520-1-.04?
options:
  - Zero points
  - Fifteen points
  - Five points
  - Ten points
key: D
explanation: Under Rule 520-1-.04(d), a disabled veteran whose disability is rated at 10 percent or
  above receives a credit of ten points added to the examination score. Since the disability rating
  is 12 percent, ten points apply. The five‑point credit is for non‑disabled veterans or
  disabilities rated below 10 percent.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.04
  url: null
  quoted_text: (d) Any candidate for licensure who is a disabled veteran and who served on active duty
    in the armed forces of the United States, or on active duty in a reserve component of the armed
    forces of the United States, including the National Guard, during wartime or during any conflict
    when military personnel were committed by the President of the United States shall be entitled
    to a credit of ten points if the disability was for an injury or illness incurred in line of
    duty and such disability is rated at 10 percent or above at the time of taking said examination.
