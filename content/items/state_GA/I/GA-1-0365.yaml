stem: A Georgia licensee moves to Alabama and places her license on inactive status to avoid
  termination. When may she conduct brokerage business in Georgia?
options:
  - After six months of inactive status and completing required continuing education for Georgia
    license
  - After paying a renewal fee and submitting proof of compliance with education requirements
  - After moving to Alabama and placing her license on inactive status to avoid termination
  - After she regains Georgia residency and satisfies reactivation or nonresident licensure rules
key: D
explanation: "The rule provides that a licensee who elects inactive status after moving out‑of‑state
  may not conduct brokerage business in Georgia until they become a Georgia resident again and
  satisfy reactivation or nonresident licensure requirements. Therefore, the correct condition is
  when the licensee regains Georgia residency and meets reactivation or nonresident licensure rules.
  The other options describe situations that do not restore the right to practice: merely being
  inactive for six months with continuing education, paying a renewal fee and submitting proof of
  education, or simply moving and going inactive do not reinstate the authority to conduct brokerage
  business in Georgia."
citation:
  source: Ga. Comp. R. & Regs. § 520-1-.04(6)(d)
  url: null
  quoted_text: Licensees who elect such inactive status may not then conduct brokerage business in
    this state until they have again become residents of this state and have complied with the
    reactivation provisions of O.C.G.A. Section 43-40-12 or have qualified for nonresident licensure
    as provided in paragraph (2) of this rule.
