stem: A licensee previously received two citations for minor violations and fully complied with all
  requirements of those citations. The licensee now faces a disciplinary action for a separate
  violation. According to Rule 520-1-.14(9), will the Commission consider the prior citations when
  imposing discipline for the new violation?
options:
  - The Commission will consider the prior citations regardless of compliance.
  - The Commission will consider the prior citations only if they were for serious violations.
  - The Commission will not consider the prior citations because the licensee fully complied with
    them.
  - The Commission will consider the prior citations if the licensee paid any associated fines.
key: C
explanation: Rule 520-1-.14(9) provides that prior citations are not considered in a disciplinary
  action when the licensee has fully complied with the terms of those citations. Hence, the
  Commission will not consider the prior citations. The option stating that the Commission will
  consider prior citations only if they were for serious violations is incorrect because the rule
  does not limit consideration to serious violations; it excludes all prior citations when fully
  complied.
