stem: A licensee's website displays outdated property listing information on April 5. According to
  Georgia Real Estate Commission Rule 520-1-.09(5)(c), by what date must the licensee update or
  remove that information to comply with the rule?
options:
  - May 7
  - May 6
  - May 4
  - May 5
key: D
explanation: The rule requires outdated website information to be updated or removed within thirty
  (30) days of becoming outdated. Adding thirty days to April 5 yields May 5. May 4 is only
  twenty-nine days later and therefore does not satisfy the thirty‑day requirement.
