stem: A licensee fails to notify the Commission in writing of a change of mailing address within 30
  days. What fee must the licensee pay?
options:
  - $10.00
  - $100.00
  - $25.00
  - $50.00
key: C
explanation: Rule 520-1-.04(1)(a)4 imposes a $25.00 fee for failure to notify the Commission in
  writing within 30 days of a change of address. Hence the licensee owes $25.00. The $10.00 amount
  is not mentioned in the rule, while $50.00 and $100.00 correspond to other violations.
