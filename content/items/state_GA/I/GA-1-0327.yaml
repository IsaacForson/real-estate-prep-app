stem: A licensee prepares a purchase agreement for a friend who has not entered into any brokerage
  agreement with the licensee. According to Ga. Comp. R. & Regs. § 520-1-.02(2)(i), how is this
  friend classified?
options:
  - Real estate client
  - Real estate prospect
  - Real estate customer
  - Real estate principal
key: C
explanation: The rule defines a "customer" as a person who has not entered into a brokerage
  engagement with a broker but for whom the broker may perform ministerial acts. Because the friend
  lacks a brokerage engagement, the friend is a customer, not a client. The option "Real estate
  client" is incorrect because a client requires a brokerage engagement.
