  quoted_text: Each licensee, approved school, or approved instructor must notify the Commission in
    writing within one month of any change in any such licensee's, approved school's, or approved
    instructor's mailing address or residence address, or email address if an email address is
    maintained by such licensee, approved school, or approved instructor.
