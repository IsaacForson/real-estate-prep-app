stem: A licensee moved to a new residence on March 15, 2024. According to Rule 520-1-.04(5)(b), by
  what date must the licensee notify the Commission in writing of the address change?
options:
  - April 30, 2024
  - April 16, 2024
  - April 15, 2024
  - April 14, 2024
key: C
explanation: The rule requires notification within one month of any change in residence address.
  Adding one month to March 15 yields April 15, 2024. April 14 is one day early, April 16 is one day
  late, and April 30 incorrectly assumes the end of the month.
