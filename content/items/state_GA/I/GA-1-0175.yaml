stem: A licensee refers a principal to another broker for brokerage services, and the referring
  licensee expects to receive a referral fee. The broker who receives the referral must disclose the
  payment in writing to the principal no later than what point?
options:
  - No later than at the closing
  - Within 30 days after closing
  - Before the principal signs any contract
  - At the time of referral
key: A
explanation: Rule 520-1-.10(6)(b) requires that the payment of a commission, fee, or other thing of
  value to the referring licensee be disclosed in writing to the principal by the broker to whom the
  referral was made no later than at the closing of the transaction. Therefore, disclosure must
  occur no later than closing. The other timings are either too early, too late, or not specified by
  the rule.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
