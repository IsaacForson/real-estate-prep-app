  url: null
  quoted_text: the payment of a commission, fee or other thing of value to the referring licensee by
    the broker working with the principal shall be disclosed in writing to the principal by the
    broker to whom the referral was made no later than at the closing of the purchase, sale,
    exchange, or lease, of any property in a transaction where a commission, fee or other thing of
    value will be paid by the broker to the referring licensee.
