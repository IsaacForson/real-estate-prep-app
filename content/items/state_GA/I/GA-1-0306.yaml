  url: null
  quoted_text: Failure of a licensee to have the financial institution designate an account as a trust
    or escrow account, except where the financial institution has erred. 43-40-20(b). Fine of
    $600.00 per account not designated.
  secondary: []
math:
  worked_solution: 2 accounts × $600 per account = $1,200
  formulas:
    - Total fine = number of accounts × fine per account
