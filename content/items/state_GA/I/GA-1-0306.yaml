stem: A licensee fails to have the financial institution designate two separate trust accounts as
  trust or escrow accounts, and the institution did not make an error. What is the total fine that
  may be assessed for these violations under Rule 520-1-.14(3)(o)?
options:
  - $800.00
  - $1,500
  - $1,000
  - $1,200
key: D
explanation: The rule imposes a $600 fine for each account not properly designated. With two
  accounts, the total fine is 2 × $600 = $1,200. The other amounts correspond to one account, one
  and a half accounts, or an incorrect calculation.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
