stem: When a licensee prepares an offer to purchase real property, what must the licensee include
  for each firm and licensee participating in the transaction, per Rule 520-1-.10?
options:
  - The firm's federal tax identification number
  - The six-digit Commission license number
  - The licensee's date of original licensure
  - The licensee's continuing education hours
key: B
explanation: Rule 520-1-.10 requires that offers and brokerage engagements list the six digit
  license number the Commission has issued to each participating firm and licensee.
