stem: A corporation's qualifying broker dies unexpectedly. Under Georgia Real Estate Commission Rule
  520-1-.07, what must the corporation do within 60 days to continue real estate brokerage activity?
options:
  - surrender the firm's license to the Commission
  - secure a new qualifying broker
  - transfer its listings to a competing firm
  - dissolve and reorganize as a partnership
key: B
explanation: Rule 520-1-.07 requires that when a qualifying broker dies, resigns, or is discharged
  unexpectedly, the firm must secure a new qualifying broker within 60 days or cease all real estate
  brokerage activity until it does.
citation:
  source: Ga. Comp. R. & Regs. Rule 520-1-.07
  url: null
  quoted_text: Whenever the qualifying broker of a partnership, limited liability company, or
    corporation dies, resigns, or is discharged unexpectedly, the partnership, limited liability
    company, or corporation must secure a new qualifying broker within 60 days or cease all real
    estate brokerage activity until it does secure a new qualifying broker.
