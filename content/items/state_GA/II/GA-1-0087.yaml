stem: A partnership's qualifying broker resigns unexpectedly. While the partnership seeks a new
  qualifying broker, who must the partnership designate to sign documents and applications and to
  disburse trust funds under Georgia Real Estate Commission Rule 520-1-.07?
options:
  - A partner of the partnership.
  - A member of the partnership.
  - An officer of the partnership.
  - The managing broker of the partnership.
key: A
explanation: For a partnership, the rule requires the firm to designate a partner to sign documents
  and applications and to disburse trust funds during the period when a qualifying broker is being
  replaced.
citation:
  source: Ga. Comp. R. & Regs. ch. 520-1 — Ga. Comp. R. & Regs. Chapter 520-1 — Licensure and
    Brokerage (Georgia Real Estate Commission rules), official Georgia Secretary of State Rules &
    Regulations site, fetched live — § 520-1-.07
  url: null
  quoted_text: During the period of time that the firm is seeking a new qualifying broker to replace a
    qualifying broker who dies, resigns, or is discharged unexpectedly, the firm must designate a
    partner, if a partnership; a member, if a limited liability company; or an officer, if a
    corporation, to sign any documents and applications which must be filed with the Commission and
    to disburse trust funds from the firm's designated trust account(s) as may be required by any
    contracts or agreements authorizing the firm to hold such trust funds.
