stem: A firm employs an unlicensed individual as support personnel. Under Georgia Real Estate
  Commission Rule 520-1-.07, which of the following tasks may this individual legally perform on
  behalf of the firm?
options:
  - Make cold calls to potential sellers to secure listings
  - Arrange dates and times for a mortgage application or closing
  - Discuss the attributes and amenities of a property with a prospective purchaser
  - Answer questions regarding the financing options for a listed property
key: B
explanation: "Rule 520-1-.07(6)(e)(18) lists 'arrange dates and times for a mortgage application, a
  pre-closing walk through, or a closing' as a permitted task for support personnel. The other
  options are explicitly prohibited: answering questions on financing (6)(f)(5), discussing
  attributes with prospective purchasers (6)(f)(9), and making cold calls (6)(f)(1)."
