stem: A franchise real estate firm advertises a specific listing and displays the individual agent's
  name in larger, more prominent type than the firm's registered name. Under Rule 520-1-.09, why
  does this advertisement violate the rule?
options:
  - The firm's name must appear on office signs, but not in advertisements
  - The firm's name must appear as prominently as the agent's name
  - The agent's name must be omitted from advertisements
  - The agent's license number must appear larger than the firm's name
key: B
explanation: Rule 520-1-.09 requires a firm's registered name to appear in equal or greater size,
  prominence, and frequency than any affiliated licensee's name in advertising for specific real
  estate.
citation:
  source: Ga. Comp. R. & Regs. Rule 520-1-.09
  url: null
  quoted_text: the name of the firm offering the real estate for sale, rent, or exchange shall appear
