stem: According to Georgia Real Estate Commission Rule 520-1-.10(2), how many digits must the
  license number included in an offer or brokerage engagement have?
options:
  - Five digits
  - Three digits
  - Six digits
  - Four digits
key: C
explanation: The rule states that the licensee shall include the six digit license number issued by
  the Commission. Therefore, the correct answer is six digits. The other options list different
  digit counts that are not supported by the rule.
