stem: A corporation's qualifying broker resigns unexpectedly. Under Georgia Real Estate Commission
  Rule 520-1-.07(3)(b), who must the corporation designate to sign documents and disburse trust
  funds while seeking a new qualifying broker?
options:
  - The partner if a partnership, the member if a limited liability company, or the officer if a
    corporation
  - The outgoing qualifying broker who previously held the position and is authorized to act on
    behalf of the firm
  - The Georgia Real Estate Commission acting as interim supervisor to oversee signatory duties
  - Any licensed salesperson affiliated with the firm who has written authority to sign documents
key: A
explanation: The rule requires the firm to designate a partner (if a partnership), a member (if an
  LLC), or an officer (if a corporation) to sign documents and disburse trust funds during the
  period of seeking a new qualifying broker. The distractor suggesting the outgoing broker cannot
  act after resignation or discharge, and the Commission or a salesperson lack this authority under
  the rule.
citation:
  source: Ga. Comp. R. & Regs. § 520-1-.07(3)(b)
  url: null
  quoted_text: During the period of time that the firm is seeking a new qualifying broker to replace a
    qualifying broker who dies, resigns, or is discharged unexpectedly, the firm must designate a
    partner, if a partnership; a member, if a limited liability company; or an officer, if a
    corporation, to sign any documents and applications which must be filed with the Commission and
    to disburse trust funds from the firm's designated trust account(s) as may be required by any
    contracts or agreements authorizing the firm to hold such trust funds.
