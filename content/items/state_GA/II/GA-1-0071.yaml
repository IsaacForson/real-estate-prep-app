stem: According to Georgia Real Estate Commission Rule 520-1-.02, how is a 'firm' defined?
options:
  - A sole proprietorship, partnership, limited liability company, or corporation licensed by the
    Commission as a broker
  - An individual licensed as a salesperson or associate broker working under a supervising broker
  - A person who has entered into a brokerage engagement with a real estate broker
  - A business entity owning a trade name whose use by others the owner of the trade name controls
    and authorizes
key: A
explanation: The rule defines "firm" as a sole proprietorship, partnership, limited liability
  company, or corporation licensed by the Commission as a broker. An individual licensed as a
  salesperson or associate broker working under a supervising broker is not a firm; a person who has
  entered into a brokerage engagement with a real estate broker is a client, not a firm; a business
  entity owning a trade name whose use by others the owner controls and authorizes is a franchisor,
  not a firm.
