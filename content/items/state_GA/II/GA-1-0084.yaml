stem: According to Georgia Real Estate Commission Rule 520-1-.07, what restriction applies to the
  name under which a broker may conduct business?
options:
  - The broker may use any trade name as long as it is registered with the Commission.
  - The broker must conduct business only under the name in which the broker's license is issued.
  - The broker may use a different name if the broker obtains a fictitious name permit.
  - The broker may conduct business under any name that includes the broker's license number.
key: B
explanation: The rule explicitly states that a broker shall not conduct business under any name
  other than the one in which the broker's license is issued, meaning the broker must use the
  licensed name only.
