stem: Under Ga. Comp. R. & Regs. r. 520-1-.02, what is the minimum length of an instructional hour?
options:
  - At least forty-five minutes
  - At least fifty minutes
  - At least fifty-five minutes
  - At least sixty minutes
key: B
explanation: The rule defines an instructional hour as a period of time of at least fifty minutes of
  instruction or other learning activity. Therefore, the minimum length is fifty minutes. The
  options stating forty-five minutes, fifty-five minutes, and sixty minutes are incorrect.
