stem: Under Georgia Real Estate Commission Rule 520-1-.07, what specific action must a broker or
  qualifying broker take if they become aware that an affiliated licensee has violated the License
  Law or its Rules and Regulations?
options:
  - Notify the affiliated licensee in writing of the violation
  - Notify the Georgia Department of Revenue of the violation
  - Notify the local law enforcement agency of the violation
  - Notify the Georgia Real Estate Commission of the violation
key: D
explanation: Rule 520-1-.07(2)(c) explicitly states that the broker or qualifying broker shall
  notify the Georgia Real Estate Commission of any violation of the License Law and its Rules and
  Regulations. Filing a formal written complaint is a remedy for departing licensees who fail to
  return property, not the immediate duty for general violations. Suspend authority is not granted
  to the broker, and law enforcement is not the primary regulatory body for license law violations.
