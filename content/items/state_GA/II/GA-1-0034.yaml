stem: A broker licensed in another state refers a prospective buyer to a Georgia broker and performs
  no other brokerage acts regarding property located in Georgia. Under Rule 520-1-.07, what may the
  Georgia broker do?
options:
  - Require the broker to hold a Georgia license
  - Pay a referral fee to the out-of-state broker
  - Report the referral to the Georgia Real Estate Commission
  - Refuse any division of the referral fee
key: B
explanation: Rule 520-1-.07 allows a Georgia broker to pay a referral fee to an out-of-state broker
  who refers prospective clients, even though that broker performs no other brokerage acts in
  Georgia.
