stem: A service member separated from the military 10 months ago is considering obtaining a real
  estate license. Under Ga. Comp. R. & Regs. r. 520-1-.02, does this individual qualify as a
  Transitioning Service Member?
options:
  - The individual does not qualify as a Transitioning Service Member because they are not on active
    duty.
  - The individual qualifies as a Transitioning Service Member because they are within twenty-four
    months of retirement.
  - The individual does not qualify as a Transitioning Service Member because they exceed twelve
    months of separation.
  - The individual qualifies as a Transitioning Service Member because they are within twelve months
    of separation.
key: D
explanation: The rule defines a Transitioning Service Member as someone who is within twelve months
  of separation or within twenty-four months of retirement. Having been separated for ten months
  satisfies the twelve‑month separation criterion, so the individual qualifies. The statement that
  the individual does not qualify because they are not on active duty is incorrect; the statement
  that they qualify because they are within twenty‑four months of retirement is incorrect; and the
  statement that they do not qualify because they exceed twelve months of separation is incorrect.
citation:
