stem: A licensee completes a continuing education course that consists of 30 instructional hours.
  According to Ga. Comp. R. & Regs. r. 520-1-.02, how many minutes of instruction must the course
  contain at minimum?
options:
  - 1,200 minutes
  - 1,500 minutes
  - 1,650 minutes
  - 1,350 minutes
key: B
explanation: Each instructional hour must be at least fifty minutes. Multiplying thirty hours by
  fifty minutes per hour yields one thousand five hundred minutes. The distractors result from using
  incorrect minute-per-hour values.
citation:
  source: Ga. Comp. R. & Regs. r. 520-1-.02 — Ga. Comp. R. & Regs. 520-1-.02 — Definitions
    (GREC-hosted official rule PDF) r. 520-1-.02(2)(p)
  url: null
  quoted_text: Instructional hour means a period of time of at least fifty minutes of instruction or
    other learning activity
  secondary: []
math:
  worked_solution: |-
    Identify minutes per hour: 50 minutes (from rule).
    Multiply: 30 hours × 50 minutes/hour = 1500 minutes.
    Express as 1,500 minutes.
  formulas:
    - total_minutes = hours × minutes_per_hour
