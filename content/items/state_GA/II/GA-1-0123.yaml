stem: According to Ga. Comp. R. & Regs. r. 520-1-.02, which of the following best describes
  'ministerial acts'?
options:
  - Acts performed constituting a brokerage engagement
  - Acts performed without discretion or judgment
  - Acts performed requiring a real estate license
  - Acts performed with discretion or judgment
key: B
explanation: The rule defines ministerial acts as those performed for a person that do not require
  discretion or the exercise of the broker's own judgment. Therefore, the correct choice is the
  option describing acts performed without discretion or judgment. The distractor stating acts
  requiring discretion or judgment is incorrect because it directly contradicts the definition.
