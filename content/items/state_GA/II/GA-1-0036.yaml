stem: A licensee gives a principal a small gift unrelated to any pending transaction and not
  contingent on the purchase, sale, lease, or exchange of real estate. Under Rule 520-1-.10, what
  disclosure is required for this gift?
options:
  - Disclosure on the closing statement is required
  - A report to the Commission is required
  - No disclosure is required for the gift
  - Written consent from each party is required
key: C
explanation: Rule 520-1-.10 excuses a licensee from disclosing gifts, products, or services given to
  a principal as long as those items are not contingent on the transaction closing.
