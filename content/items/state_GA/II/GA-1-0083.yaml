stem: "Under Georgia Real Estate Commission Rule 520-1-.09(1)(a), the term 'advertising' means:"
options:
  - any manner, method, or activity by which a licensee through the use of any media makes known to
    the general public real estate for sale, rent, lease, or exchange
  - any written or oral communication that promotes a licensee's services to potential clients and
    encourages them to inquire about available listings
  - the act of placing a sign on a property indicating it is available for sale or lease and
    including contact information for the listing broker
  - the distribution of promotional materials exclusively through electronic mail and social media
    platforms to reach prospective buyers and sellers
key: A
explanation: The rule defines advertising as any manner, method, or activity by which a licensee
  uses any media to make known to the general public real estate for sale, rent, lease, or exchange.
  This definition matches the option that states any manner, method, or activity by which a licensee
  through the use of any media makes known to the general public real estate for sale, rent, lease,
  or exchange. The other options are incorrect because they limit advertising to specific media or
  to promotion of services rather than real estate.
