stem: A property management agreement between a broker and an owner states that the broker will
  provide statements of property income and expenses only once every two years. Under Rule
  520-1-.06, why does this term fail to comply?
options:
  - Periodic statements must be sent at least annually
  - Periodic statements must be certified by an accountant
  - Periodic statements must be provided at least monthly
  - Periodic statements must be provided upon request
key: A
explanation: Rule 520-1-.06 requires a property management agreement to specify that periodic
  written statements of income and expenses be submitted to the owner on at least an annual basis,
  so a two-year interval falls short.
