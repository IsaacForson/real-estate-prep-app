stem: A licensee wants to purchase a homeowner's property as a condition of obtaining a listing
  agreement to sell the homeowner's other property. Under Georgia Real Estate Commission Rule
  520-1-.11, when must the licensee enter into a written contract expressing all terms of that
  purchase?
options:
  - at any time before reselling the purchased property
  - within thirty days after the brokerage engagement is signed
  - prior to or at the time of entering the engagement
  - only after the listed property has closed
key: C
explanation: Rule 520-1-.11 requires that when a licensee offers to purchase property as a condition
  of obtaining a brokerage engagement, the licensee must enter into a written contract expressing
  all purchase terms prior to or at the time of entering into the brokerage engagement.
citation:
  source: Ga. Comp. R. & Regs. Rule 520-1-.11
  url: null
  quoted_text: Whenever a licensee offers to purchase a property as a condition to obtaining a
    brokerage engagement to sell, lease, or exchange or on which the licensee is extending the
    expiration date of an existing brokerage engagement, the licensee must enter into a written
    contract to purchase which expresses all the terms and conditions of the licensee's purchase
    prior to or at the time of entering into the proposed brokerage engagement or into the extension
    of the existing brokerage engagement.
