stem: A licensee affiliated with a Georgia brokerage firm requests a release to transfer to a new
  firm. Under Georgia Real Estate Commission Rule 520-1-.07, what is the releasing broker required
  to do immediately upon receiving this request?
options:
  - Sign the release and forward the wall certificate of licensure to the Commission
  - Wait for the new broker to submit a transfer application before signing
  - Hold the wall certificate until the departing licensee returns all keys
  - Send a letter to the licensee's last known address confirming the release
key: A
explanation: Rule 520-1-.07(5)(b) mandates that when a licensee requests a release, the releasing
  broker shall immediately sign the release and forward the wall certificate of licensure to the
  Commission (or notify the Commission that it was forwarded to the new broker). The broker cannot
  withhold the certificate pending the return of keys or other property, as failure to return
  property is grounds for a complaint, not a refusal to sign the release.
