  url: null
  quoted_text: When a licensee requests that a release form be signed, the releasing broker shall
    immediately sign the release and forward the wall certificate of licensure of the departing
    licensee to the Commission or notify the Commission in writing that the wall certificate of
    licensure has been forwarded to the new broker for whom the licensee will act.
