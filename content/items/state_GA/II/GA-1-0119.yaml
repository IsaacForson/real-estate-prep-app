stem: A broker returns a licensee's wall certificate to the Commission because the licensee cannot
  be located for a signature. Under Georgia Real Estate Commission Rule 520-1-.07(5)(d), what must
  the broker include with the wall certificate?
options:
  - A copy of a letter mailed to the licensee's address stating the licensee has one month to
    transfer or go inactive
  - A signed release from the licensee authorizing the return of the wall certificate to the
    Commission
  - A notice to the Commission requesting that the licensee be placed on inactive status within one
    month
  - A new qualifying broker appointment letter from the firm confirming the temporary replacement
key: A
explanation: When the broker cannot obtain the licensee's signature on the release, the rule
  requires sending a copy of a letter mailed to the licensee's last known address stating the
  licensee has one month to transfer or go inactive. The distractor about a signed release is not
  feasible in this scenario, and the other options do not satisfy the rule's specific requirement.
citation:
  source: Ga. Comp. R. & Regs. § 520-1-.07(5)(d)
  url: null
  quoted_text: If a broker is releasing a licensee for reasons other than the licensee's request and
    is unable for any reason to obtain the licensee's signature on the release, the broker or
    authorized associate broker shall send to the Commission a copy of a letter from the broker or
    authorized associate broker mailed to the licensee's last known address indicating that the
    broker is returning the license to the Commission. The broker's letter to the licensee should
    state clearly that the licensee has one month from the Commission's receipt of the licensee's
    wall certificate of licensure to apply to transfer to another broker or to apply to place the
    license on inactive status.
