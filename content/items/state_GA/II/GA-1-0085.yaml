stem: A licensee working for a brokerage firm sees that the firm's client (the property owner) has
  placed an online advertisement claiming the house has a new roof when the roof is actually 20
  years old. According to Georgia Real Estate Commission Rule 520-1-.09(2), what must the licensee
  do?
options:
  - wait until the next scheduled marketing meeting to discuss the inaccuracy
  - ignore the advertisement because the licensee did not create it
  - immediately take steps to stop the advertising until it complies with the rule
  - inform the client that the advertisement is acceptable as long as the roof is functional
key: C
explanation: The rule requires that whenever a licensee becomes aware that a principal's advertising
  is inconsistent with the rule, the licensee must immediately take steps to stop the advertising
  until it complies. Waiting for a later meeting or ignoring the advertisement does not satisfy this
  requirement. Telling the client that the advertisement is acceptable because the roof is
  functional is also incorrect, as the rule prohibits any misleading or inaccurate statement of a
  material fact regardless of the roof's condition.
citation:
