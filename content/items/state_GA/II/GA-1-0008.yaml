stem: A licensee is preparing an offer to purchase real property on behalf of a buyer. Under Georgia
  Real Estate Commission Rule 520-1-.10, what must the licensee include for each firm and licensee
  participating in the transaction?
options:
  - the licensee's personal home address
  - the license number issued by the Commission
  - the licensee's continuing education transcript
  - a notarized copy of the licensee's diploma
