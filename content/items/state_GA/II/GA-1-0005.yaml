stem: A broker licensed only in another state refers a prospective buyer to a Georgia broker for a
  fee. Under Georgia Real Estate Commission Rule 520-1-.07, what must the out-of-state broker do
  before performing any other broker acts regarding the Georgia property?
options:
  - post a fidelity bond with the Commission
  - register as a Georgia salesperson within thirty days
  - obtain a nonresident's license or broker agreement
  - complete Georgia's broker continuing education
key: C
explanation: Rule 520-1-.07 states that a broker who refers clients to a Georgia broker may not
  perform other broker acts regarding Georgia property unless the broker first obtains a
  nonresident's license or enters into a written agreement with a Georgia broker.
citation:
  source: Ga. Comp. R. & Regs. Rule 520-1-.07
  url: null
  quoted_text: Such brokers who refer prospective clients or customers to a Georgia broker may not
    perform any of the other acts of a broker with regard to property located in this state unless
    they first obtain a nonresident's license or enter into a written agreement with a Georgia
    broker as permitted by O.C.G.A. Section 43-40-9
