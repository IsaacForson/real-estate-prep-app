  url: null
  quoted_text: (b) When advertising real estate for sale, rent, lease or exchange on an internet
    website not owned or controlled by the licensee or firm with which the licensee is affiliated
    and that website's terms of use limit the licensee's ability to comply with this paragraph, the
    advertising shall provide a direct link to a display that is in compliance with this Rule on
    every viewable webpage of the website.
