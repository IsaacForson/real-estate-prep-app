stem: A licensee lists a property on a popular real estate website that the licensee does not own or
  control, and the website's terms of use prevent the licensee from displaying the firm's name and
  telephone number directly on the listing page. According to Georgia Real Estate Commission Rule
  520-1-.09(5)(b), what must the licensee do to comply?
options:
  - display the firm's name and telephone number in the website's footer regardless of the site's
    restrictions
  - refrain from advertising on any website that the licensee does not own or control
  - provide a direct link to a display that is in compliance with this rule on every viewable
    webpage of the website
  - obtain written permission from the website owner to override the terms of use
key: C
explanation: Georgia Real Estate Commission Rule 520-1-.09(5)(b) requires that when advertising on a
  website not owned or controlled by the licensee and the site's terms of use limit the licensee's
  ability to comply, the licensee must provide a direct link to a display that meets the rule on
  every viewable webpage of the website. This matches the option that calls for providing such a
  direct link on every viewable webpage. The option that suggests displaying the firm's name and
  telephone number in the website's footer does not satisfy the rule because the site's terms
  prevent that placement.
