stem: Under Georgia Real Estate Commission Rule 520-1-.07(2)(b), what is a broker or qualifying
  broker required to do regarding affiliated licensees?
options:
  - To instruct affiliated licensees of the License Law and Rules and Regulations provisions
  - To notify the Georgia Real Estate Commission of any violations by affiliated licensees
  - To secure a new qualifying broker within sixty days after a vacancy occurs
  - To sign a release and forward the wall certificate upon a licensee's transfer request
key: A
explanation: The rule explicitly states that a broker or qualifying broker must instruct affiliated
  licensees of the provisions set forth in the License Law and its Rules and Regulations. The
  distractor about notifying the Commission refers to subsection (c), which addresses reporting
  violations, not the instructional duty.
citation:
  source: Ga. Comp. R. & Regs. § 520-1-.07(2)(b)
  url: null
  quoted_text: Every broker or qualifying broker shall be responsible to instruct licensees affiliated
    with the broker or the broker's firm of the provisions set forth in the License Law and its
    Rules and Regulations.
