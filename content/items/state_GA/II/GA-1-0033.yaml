stem: A broker is asked to sign a written agreement with a departing licensee specifying
  compensation for work begun but not completed at the time of transfer. Under Rule 520-1-.07, what
  may the Commission do regarding the content of that agreement?
options:
  - Decline to regulate the agreement's terms
  - Approve the agreement before it is signed
  - Require arbitration of the agreement's terms
  - Set the commission split in the agreement
key: A
explanation: Rule 520-1-.07 states that beyond confirming a compensation agreement exists between
  the licensee and broker, the Commission does not regulate its content or enforce its provisions.
