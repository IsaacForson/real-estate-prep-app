stem: A firm's newspaper advertisement lists a specific home for sale alongside the name of the
  listing agent. Under Georgia Real Estate Commission Rule 520-1-.09, how must the firm's name
  compare to the agent's name in the advertisement?
options:
  - required to appear in equal or greater prominence
  - required to appear only once regardless of listings
  - permitted to appear smaller if the firm consents
  - permitted to be omitted if a license number is shown
key: A
explanation: Rule 520-1-.09 requires that in advertising real estate for sale, rent, or exchange,
  the firm's name appear in equal or greater size, prominence, and frequency than the name of any
  affiliated licensee.
citation:
  source: Ga. Comp. R. & Regs. Rule 520-1-.09
  url: null
  quoted_text: In advertising real estate for sale, rent, or exchange, the name of the firm offering
    the real estate for sale, rent, or exchange shall appear in equal or greater size, prominence,
    and frequency than the name or names of any affiliated licensees or groups of licensees.
