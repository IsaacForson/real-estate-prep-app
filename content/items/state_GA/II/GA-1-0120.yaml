stem: "Under Georgia Real Estate Commission Rule 520-1-.02, the term 'firm' means:"
options:
  - A group of salespersons employed by a broker and working under their supervision
  - A sole proprietorship, partnership, limited liability company, or corporation licensed by the
    Commission as a broker
  - An individual licensed by the Commission to perform real estate brokerage activities
  - Any person who has entered into a brokerage engagement with a client for a real estate
    transaction
key: B
explanation: Under Georgia Real Estate Commission Rule 520-1-.02, a firm means a sole
  proprietorship, partnership, limited liability company, or corporation licensed by the Commission
  as a broker. The option that says 'A group of salespersons employed by a broker and working under
  their supervision' does not match this definition. The option that says 'A sole proprietorship,
  partnership, limited liability company, or corporation licensed by the Commission as a broker'
  correctly states the definition. The option that says 'An individual licensed by the Commission to
  perform real estate brokerage activities' describes an individual licensee, not a firm. The option
  that says 'Any person who has entered into a brokerage engagement with a client for a real estate
  transaction' refers to a party to a brokerage engagement, not a firm.
