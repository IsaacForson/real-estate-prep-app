stem: A licensed real estate broker who serves as a professional member of the Board of Real Estate
  submits an application to renew their own broker license. Under D.C. Code § 47-2853.07(f), what
  must the broker do regarding this application?
options:
  - The broker must approve the application without further review
  - The broker must request a hearing before the full board
  - The broker must submit the application to the Mayor for approval
  - The broker must disqualify himself or herself from acting on the application
key: D
explanation: The statute requires a professional member to disqualify himself or herself from acting
  on their own application for licensure or renewal. Therefore, the broker must disqualify himself
  or herself from acting on the application. The distractor suggesting the broker may approve the
  application without review is incorrect because the rule prohibits self-action on one's own
  application.
