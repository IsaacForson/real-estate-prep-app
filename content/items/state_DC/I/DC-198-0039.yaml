stem: Under D.C. Code § 42-1706(c), money in the Real Estate Guaranty and Education Fund may be used
  for what purpose?
options:
  - To pay broker commissions, fees, and penalties
  - To support purposes consistent with § 42-1707
  - To finance the Mayor's education initiatives
  - To cover real estate licensee recovery costs
key: B
explanation: According to D.C. Code § 42-1706(c), money in the Real Estate Guaranty and Education
  Fund may be used for purposes consistent with § 42-1707. Therefore the correct answer is the
  option stating that the Fund’s money supports purposes consistent with § 42-1707. The option
  suggesting the Fund pays broker commissions, fees, and penalties is incorrect because the statute
  does not limit the Fund’s use to those items; it requires alignment with the broader purposes in §
  42-1707. The option proposing to finance the Mayor’s education initiatives is incorrect as the
  statute does not earmark Fund money for the Mayor’s initiatives. The option stating the Fund
  covers real estate licensee recovery costs is incorrect because recovery costs are not specified
  as a permissible use; the Fund’s expenditures must be consistent with § 42-1707.
