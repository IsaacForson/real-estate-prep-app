stem: Under D.C. Code § 47-2853.07(a), what is the maximum number of full consecutive 3-year terms a
  board member may serve?
options:
  - Two full consecutive 3-year terms
  - Three full consecutive 3-year terms
  - One full consecutive 3-year terms
  - Seven full consecutive 3-year terms
key: B
explanation: The rule states that a member may be appointed to succeed themselves but no member
  shall be appointed to serve more than 3 full consecutive 3‑year terms. Therefore three consecutive
  terms is the maximum allowed. The distractor "Two full consecutive 3‑year terms" is incorrect
  because the statute permits a third consecutive term.
