stem: A licensee applicant fails the required real estate examination. Under D.C. Code § 47-2853.22,
  what action may the Board of Real Estate take without first providing the applicant a hearing?
options:
  - Deny the application
  - Impose a civil penalty
  - Require remedial training
  - Suspend the licensee
key: A
explanation: The statute provides that a board must give an opportunity for a hearing before denying
  a license, except where the denial is based solely on the applicant’s failure to pass a required
  examination. Therefore, the board may deny the application without a hearing. Imposing a civil
  penalty would require a hearing because it is not covered by that exception.
