stem: A licensee receives written notice from the Board of Real Estate regarding a hearing to
  determine whether a prior conviction is directly related to the practice of real estate. According
  to D.C. Code § 47-2853.22(a-1)(1), which of the following must be included in that notice?
options:
  - A notice of the potential civil fine that may be imposed
  - A statement that the licensee may request a rehearing before the full board
  - A copy of any criminal history records on which the board relies
  - A description of the board's investigative procedures for complaints
key: C
explanation: The board must provide a copy of any criminal history records it relies on when
  notifying a licensee of a hearing based on a criminal conviction determination. The distractor
  about the board's investigative procedures is incorrect because the statute does not require that
  information in the notice.
