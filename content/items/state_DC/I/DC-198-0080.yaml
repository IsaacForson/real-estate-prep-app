stem: Under D.C. Code § 47-2853.17, which of the following constitutes grounds for disciplinary action?
options:
  - Knowingly providing false or misleading information on or in support of an application or
    renewal application
  - Failing to attend a scheduled board meeting without a valid excuse or proper notification
  - Charging a commission rate that exceeds the average rate established by the local market
    association
  - Advertising a property for sale or lease without obtaining the broker's written permission
key: A
explanation: The statute explicitly lists knowingly providing false or misleading information on or
  in support of an application or renewal application as a ground for disciplinary action under
  subsection (a)(1). The distractor about failing to attend a board meeting is not mentioned as a
  ground in this section.
