stem: If the Board finds that a licensee committed three separate violations of D.C. Code §
  47-2853.17, what is the maximum total civil fine the Board may impose under § 47-2853.17(c)(5)?
options:
  - The maximum total civil fine is $20,000.
  - The maximum total civil fine is $15,000.
  - The maximum total civil fine is $10,000.
  - The maximum total civil fine is $5,000.
key: B
explanation: The statute authorizes a civil fine not exceeding $5,000 for each violation. For three
  violations, the maximum total fine is 3 × $5,000 = $15,000. The distractors correspond to one,
  two, or four violations, which are incorrect for the given scenario.
