stem: The Mayor determines that a licensee's conduct presents an imminent danger to health and
  safety. Under D.C. Code § 47-2853.18(b), what must the Mayor provide at the time of the summary
  suspension?
options:
  - Providing a statement of the licensee's right to appeal the suspension to the Court of Appeals
    within thirty days
  - Providing written notice stating the action, the right to request a hearing, and legal resources
    available
  - Providing a copy of the board's meeting minutes along with the agenda and supporting documents
  - Providing a copy of the licensee's complete disciplinary file including all prior complaints and
    resolutions
key: B
explanation: Subsection (b) requires the Mayor to provide written notice stating the action being
  taken, the right to request a hearing, and legal resources available in the District. The
  distractor about providing a statement of the right to appeal is not required by the statute at
  the time of suspension.
citation:
  source: "D.C. Code §§ 47-2853.01–47-2853.30 — D.C. Code Title 47, Ch. 28, Subch. I-B, Part A -
