  url: null
  quoted_text: The Mayor, at the time of the summary suspension or restriction of a license, shall
    provide the licensee with written notice stating the action that is being taken, the right of
    the licensee, registrant, person certified, or person permitted by [this subchapter] to practice
    in the District to request a hearing, and legal resources available in the District.
