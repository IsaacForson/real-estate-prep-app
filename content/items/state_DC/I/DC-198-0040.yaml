stem: A judgment against a licensee became final on June 1, 2022. By what date must the aggrieved
  party file a written application for payment from the Real Estate Guaranty and Education Fund?
options:
  - By May 31, 2023
  - By June 1, 2023
  - By June 2, 2023
  - By July 1, 2023
key: B
explanation: The rule requires the application to be filed no later than 12 months after the
  judgment became final; adding 12 months to June 1, 2022 yields June 1, 2023. The option stating
  'By June 2, 2023' is incorrect because the deadline is the same calendar date one year later, not
  the following day.
