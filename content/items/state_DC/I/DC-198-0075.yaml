stem: Under D.C. Code § 42-1707(c), what is the maximum amount that may be paid from the Real Estate
  Guaranty and Education Fund to satisfy a final judgment that became final during the fourth year
  following March 10, 1983?
options:
  - $10,000.
  - $20,000.
  - $30,000.
  - $40,000.
key: D
explanation: The statute establishes a graduated maximum payment from the Fund based on how many
  years have passed since March 10, 1983; for the fourth year the limit is $40,000. The $30,000
  amount applies only to judgments that became final during the third year.
