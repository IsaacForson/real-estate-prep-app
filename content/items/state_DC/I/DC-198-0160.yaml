stem: A licensee's real estate license is suspended by the District's Board of Real Estate after a
  hearing. The licensee also holds an active real estate license in Virginia. Under D.C. Code §
  47-2853.10(a)(14), what action must the Mayor take regarding the Virginia license?
options:
  - The Mayor shall notify the Virginia real estate commission of the suspension.
  - The Mayor shall notify the licensee by certified mail within 15 days.
  - The Mayor shall publish the suspension in the District of Columbia Register.
  - The Mayor shall refund any fees paid by the licensee for the current licensing year.
key: A
explanation: The key is correct because § 47-2853.10(a)(14) obligates the Mayor to inform other
  jurisdictions of any disciplinary action taken against a licensee. The option stating that the
  Mayor shall notify the licensee by certified mail within 15 days is incorrect because the
  subsection does not require notice to the licensee; that provision governs hearing notices. The
  options stating that the Mayor shall publish the suspension in the District of Columbia Register
  and that the Mayor shall refund any fees paid by the licensee for the current licensing year
  describe actions unrelated to inter‑jurisdictional notification.
