stem: A real estate broker is appointed to the Board of Real Estate and thereafter ceases all real
  estate activity to pursue another career. Under the tenure requirements, may the broker continue
  to serve on the Board?
options:
  - The broker is eligible because the appointment term is fixed and non‑revocable.
  - The broker is ineligible because they must remain active in the field during tenure.
  - The broker is eligible if they complete continuing education credits.
  - The broker is ineligible because they have not met the residency requirement.
key: B
explanation: The statute requires professional members of the Board of Real Estate to remain active
  in their field during their tenure; ceasing activity violates this requirement. Therefore, the
  broker may not continue to serve. The distractor claiming eligibility due to a fixed term is
  incorrect because the activity requirement applies regardless of term length.
