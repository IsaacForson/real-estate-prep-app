stem: What is the minimum period of District residency required before appointment for a member of
  the Board of Real Estate?
options:
  - Six months of residency prior to appointment.
  - One year of residency prior to appointment.
  - Two years of residency prior to appointment.
  - Five years of residency prior to appointment.
key: B
explanation: The statute specifies that members of the Board of Real Estate must have been residents
  of the District for at least one year prior to their appointment. This residency requirement is in
  addition to the general requirement that all board members be District residents during their
  tenure. The other options incorrectly state shorter or longer periods that are not supported by
  the text.
