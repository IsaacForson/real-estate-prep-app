stem: Under D.C. Code § 42-1707(c), what is the maximum amount that may be paid from the Real Estate
  Guaranty and Education Fund to satisfy a final judgment that became final during the fifth year
  following March 10, 1983, or thereafter?
options:
  - $50,000
  - $40,000
  - $30,000
  - $20,000
key: A
explanation: The statute sets the maximum payment at $50,000 for judgments that become final in the
  fifth year after March 10, 1983, or any later year. The $40,000 distractor applies only to
  judgments final in the fourth year, not the fifth or later.
