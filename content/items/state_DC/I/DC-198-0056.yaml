stem: What must a licensee include in an affidavit to voluntarily surrender a license under D.C.
  Code § 47-2853.20(a)?
options:
  - The affidavit must state that the licensee desires to surrender the license and that the action
    is freely and voluntarily taken, and not the result of duress or coercion.
  - The affidavit must include a detailed account of the misconduct allegations under investigation,
    together with any witness statements, emails, or other documents the licensee deems relevant to
    the matter.
  - The affidavit must be notarized, submitted within 30 days of the investigation's start, and
    include a copy of the licensee's current identification and contact information as required by
    the licensee's internal policy.
  - The affidavit must request a hearing to contest the allegations before surrender is accepted,
    and must specify the preferred date, time, and location for such hearing, as well as the
    licensee's legal representative if any.
key: A
explanation: Under D.C. Code § 47-2853.20(a), a licensee may voluntarily surrender a license only by
  delivering an affidavit that states the person desires to surrender the registration, license, or
  certificate and that the action is freely and voluntarily taken, and not the result of duress or
  coercion. The other options add requirements not mentioned in the statute, such as detailing
  allegations, notarization, timing, or requesting a hearing.
