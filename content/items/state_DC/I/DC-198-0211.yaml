stem: An applicant for a real estate broker license discloses a prior felony conviction for fraud.
  Before the Board may consider this conviction in its licensing decision, what must the Board first
  determine under D.C. Code § 47-2853.17?
options:
  - Whether the conviction is directly related to real estate brokerage
  - Whether the applicant is otherwise qualified for the license
  - Whether the applicant has completed any rehabilitation program
  - Whether the conviction has been sealed or expunged
key: B
explanation: Under subsection (c-1)(A)(i), the Board may not inquire into or consider an applicant's
  criminal conviction until after the applicant is found to be otherwise qualified. Therefore, the
  Board must first determine if the applicant is otherwise qualified.
