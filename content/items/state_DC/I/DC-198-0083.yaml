key: A
explanation: Subsection (a)(3) of § 47‑2853.10 states that the Mayor must provide investigative and
  inspection services to the boards; this matches the option that says “Providing investigative and
  inspection services to the boards.” The option that says “Issuing and renewing licenses or
  certificates” is incorrect because that duty is assigned to the Mayor in subsection (a)(1), not
  subsection (a)(3).
