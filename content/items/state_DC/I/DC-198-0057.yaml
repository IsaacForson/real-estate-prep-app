stem: The Mayor determines that a licensee's conduct presents an imminent danger to the health and
  safety of persons in the District. Under D.C. Code § 47-2853.18(a), what action may the Mayor
  take?
options:
  - The Mayor may refer the matter to the Board for a hearing within 15 days.
  - The Mayor may order the licensee to pay restitution to affected clients.
  - The Mayor may require the licensee to complete a remedial education course before any action.
  - The Mayor may summarily suspend or restrict the license without a hearing.
key: D
explanation: Under D.C. Code § 47-2853.18(a), if the Mayor finds that a licensee’s conduct presents
  an imminent danger to health and safety, the Mayor may summarily suspend or restrict the license
  without a hearing. The statute does not authorize the Mayor to require remedial education, order
  restitution, or refer the matter to the Board for a hearing as a first step.
