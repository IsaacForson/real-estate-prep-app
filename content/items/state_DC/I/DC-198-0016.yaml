stem: A board schedules a disciplinary hearing against a licensee. Under D.C. Code § 47-2853.22, how
  must the hearing notice be delivered and how far in advance?
options:
  - By personal service, at least 10 days before the hearing
  - By certified mail, at least 15 days before the hearing
  - By regular mail, at least 15 days before the hearing
  - By certified mail, at least 30 days before the hearing
