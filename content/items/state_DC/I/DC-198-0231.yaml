stem: A board member has served three consecutive three-year terms and is nominated for a fourth
  term. Under D.C. Code § 47-2853.07(a), is the appointment permissible?
options:
  - The appointment is permissible because members may be appointed to succeed themselves.
  - The appointment is not permissible because a member may not serve more than three consecutive
    three-year terms.
  - The appointment is permissible if the member has been a resident for at least one year prior.
  - The appointment is not permissible because the member must disqualify themselves from own
    licensure matters.
key: B
explanation: Section 47-2853.07(a) permits reappointment but prohibits any member from serving more
  than three full consecutive three‑year terms. A member who has already served three consecutive
  terms cannot be appointed to a fourth consecutive term. The other options either misstate the rule
  or introduce irrelevant conditions.
