stem: How many consumer members serve on the District's Board of Real Estate?
options:
  - Two consumer members
  - Three consumer members
  - One consumer member
  - Four consumer members
key: C
explanation: The statute establishing the Board of Real Estate specifies exactly one consumer member
  among its nine members. Therefore, the correct answer is one consumer member. The distractor
  suggesting two consumer members is incorrect because the Board of Real Estate does not allocate
  two seats to consumer members; other boards may have two, but not this one.
citation:
