  url: null
  quoted_text: There is established a Board of Real Estate consisting of 9 members of whom 3 shall be
    real estate brokers licensed in the District, 2 shall be real estate salespersons licensed in
    the District, 2 shall be property managers licensed in the District, one shall be an attorney
    admitted to the bar of the District of Columbia and engaged in the practice of real estate law,
    and one shall be a consumer member.
