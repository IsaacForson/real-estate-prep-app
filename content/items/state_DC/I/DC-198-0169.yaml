stem: A potential judgment creditor files a lawsuit against a licensed real estate broker alleging
  fraud in a transaction. To preserve eligibility for payment from the Fund, what must the creditor
  do?
options:
  - Notifying the Mayor in writing within 30 days after the date of commencement of the action
  - Notifying the Board in writing within 15 days after the date of commencement of the action
  - Waiting until the judgment becomes final before notifying the Mayor of the action
  - Filing an affidavit with the Board detailing the alleged fraud before any court proceeding
key: A
explanation: The statute requires a person who commences an action that could lead to a Fund payment
  to notify the Mayor in writing within 30 days after the action's commencement. Notifying the
  Board, waiting for judgment, or filing an affidavit with the Board do not satisfy this specific
  requirement.
citation:
  source: D.C. Code §§ 42-1701–42-1709 — D.C. Code Title 42, Ch. 17, Subch. I - Real Estate Brokers'
