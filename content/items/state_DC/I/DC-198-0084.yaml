stem: The Board of Real Estate wishes to delegate its hearing authority to a panel consisting of
  only two members due to scheduling conflicts. According to D.C. Code § 47-2853.22(i), is this
  permissible?
options:
  - No, unless the board first holds a settlement conference
  - Yes, if the two members are both licensed brokers
  - No, because the panel must consist of three or more members
  - Yes, because the board may delegate to any number of members
key: C
explanation: Subsection (i) of § 47-2853.22 requires a hearing panel to consist of three or more
  board members, so a two‑member panel is not permissible. The statement that delegation is allowed
  if the two members are both licensed brokers is therefore incorrect because the statute sets a
  minimum of three members, not a licensing condition. The other choices are also incorrect for the
  same reason.
citation:
