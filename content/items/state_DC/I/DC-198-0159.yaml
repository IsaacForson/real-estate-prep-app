stem: Under D.C. Code § 47-2853.10(a)(14), what must the Mayor do when a licensee's license is
  revoked in the District?
options:
  - The Mayor shall notify the licensee by certified mail within 15 days.
  - The Mayor shall notify other jurisdictions where the licensee holds a license of the revocation.
  - The Mayor shall refund any fees paid by the licensee for the current licensing year.
  - The Mayor shall publish the revocation in the District of Columbia Register.
key: B
explanation: Section 47‑2853.10(a)(14) requires the Mayor to notify other jurisdictions of
  disciplinary action taken against a licensee or certificate holder when required by District or
  federal law. Accordingly, the statement that the Mayor shall notify other jurisdictions where the
  licensee holds a license of the revocation is the correct response. The statement that the Mayor
  shall notify the licensee by certified mail within 15 days reflects a different notice requirement
  and is not required by this subsection. The statement that the Mayor shall refund any fees paid
  for the current licensing year is not provided for in the code. The statement that the Mayor shall
  publish the revocation in the District of Columbia Register is also not mandated by this
  subsection.
