stem: A licensee is suspected of providing services while under the influence of alcohol. The Board
  has probable cause to believe the licensee is impaired under D.C. Code § 47-2853.17(a)(8). What
  action may the Board take under subsection (b)(1)?
options:
  - The board may mandate that the licensee attend a real estate ethics seminar.
  - The board may require the licensee to submit to a mental or physical examination.
  - The board may impose a civil fine of up to $10,000 for the violation.
  - The board may immediately revoke the licensee's license without a hearing.
key: B
explanation: Subsection (b)(1) authorizes the board to require a mental or physical examination when
  there is probable cause of impairment due to alcohol use, as listed in subsection (a)(8). The
  statute does not allow immediate revocation without a hearing, limit fines to $5,000 per
  violation, or mandate ethics seminars as a remedial action.
