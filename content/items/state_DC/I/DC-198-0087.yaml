stem: A licensee wishes to voluntarily surrender their license while under investigation for
  misconduct. Under D.C. Code § 47-2853.20(a), what must the licensee do to effect a valid voluntary
  surrender?
options:
  - Delivering to the Mayor an affidavit stating the desire to surrender the license and that the
    action is freely and voluntarily taken, not the result of duress or coercion
  - Delivering a written request to the Mayor to withdraw the license application, accompanied by a
    detailed explanation of the reasons for withdrawal and copies of all relevant documents
  - Delivering a notarized statement to the Mayor affirming that the decision to surrender the
    license is made voluntarily and without any external pressure or threat
  - Delivering proof of payment of any outstanding fees to the Mayor along with a signed affidavit
    confirming the voluntary surrender of the license
key: A
explanation: Subsection (a) states that a voluntary surrender is valid only by delivering to the
  Mayor an affidavit stating the desire to surrender and that the action is freely and voluntarily
  taken, not the result of duress or coercion. The distractor about delivering a written request to
  withdraw the application does not satisfy the affidavit requirement.
citation:
  source: "D.C. Code §§ 47-2853.01–47-2853.30 — D.C. Code Title 47, Ch. 28, Subch. I-B, Part A -
    Non-Health Related Occupations and Professions Licensure: General Provisions — § 47-2853.20"
  url: null
  quoted_text: Any person who is the subject of an investigation into, or a pending proceeding
    involving, allegations of misconduct may voluntarily surrender his or her registration, license,
    or certificate to practice in the District, but only by delivering to the Mayor an affidavit
    stating that the person desires to surrender the registration, license, or certificate and that
    the action is freely and voluntarily taken, and not the result of duress or coercion.
