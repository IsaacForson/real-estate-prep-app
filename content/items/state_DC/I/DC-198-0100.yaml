stem: A real estate broker receives an order from the Mayor directing payment from the Real Estate
  Guaranty and Education Fund to satisfy a judgment against him. What is the immediate effect on his
  license?
options:
  - It is subject to a hearing before any suspension can occur
  - It remains active until the judgment is fully paid
  - It is automatically suspended upon issuance of the order
  - It is revoked after a 30‑day grace period
key: C
explanation: Under § 42-1707(g), if the Mayor issues an order directing payment from the Fund toward
  a judgment against a licensee, the license of that person is automatically suspended upon the
  issuance of the order. The distractor suggesting a hearing is required before suspension is
  incorrect because the suspension is immediate and automatic.
