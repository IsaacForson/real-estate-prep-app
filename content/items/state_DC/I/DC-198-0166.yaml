stem: A licensed real estate broker serving on the Board of Real Estate resigns effective
  immediately, creating a vacancy. Under D.C. Code § 47-2853.07(a), how must the Board fill this
  vacancy?
options:
  - The vacancy shall be filled by a new appointment made by the Mayor with the consent of the
    Council.
  - The vacancy shall be filled by a vote of the remaining board members.
  - The vacancy shall be filled by a special election of licensed real estate professionals.
  - The vacancy shall remain unfilled until the next regular board election.
key: A
explanation: Under D.C. Code § 47-2853.07(a), a vacancy on the board must be filled in the same
  manner as the original appointment. Since board members are appointed by the Mayor with the
  consent of the Council, the vacancy must be filled by a new appointment made by the Mayor with the
  consent of the Council. The other options describe procedures that the statute does not authorize.
