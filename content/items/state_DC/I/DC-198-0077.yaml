stem: A 22-year-old applicant wishes to serve as a consumer member on the Board of Real Estate. The
  applicant is not a real estate practitioner, but their sibling, who lives with them, is a licensed
  real estate salesperson. Is the applicant eligible to serve as a consumer member?
options:
  - Yes, because the applicant meets the age requirement and is not a practitioner.
  - No, because the applicant has a household member who is a practitioner supervised by the board.
  - Yes, because sibling relationships are excluded from the household member definition.
  - No, because the applicant must be at least 25 years old.
key: B
explanation: The applicant is ineligible because the statute prohibits a consumer member from having
  a household member who is a practitioner of a profession supervised by the board. A sibling who
  lives with the applicant qualifies as a household member, and being a licensed real estate
  salesperson makes them a practitioner. The distractor claiming sibling relationships are excluded
  is incorrect; the definition of household member includes relatives by blood or marriage who share
  residence.
