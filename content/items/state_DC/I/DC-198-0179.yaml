stem: Under D.C. Code § 47-2853.07(d)(1), what residency requirement must a member of the Board of
  Real Estate meet during their term of office?
options:
  - Must be a District resident throughout the term of office
  - Must be a District resident at the time of appointment only
  - Must maintain a principal residence in the District year-round
  - Must have been a District resident for five years before appointment
key: A
explanation: The statute requires that board members be residents of the District at the time of
  appointment and during their tenure on the board. This means they must maintain District residency
  for the entire term. The distractor about being a resident only at appointment ignores the
  continuing residency requirement.
