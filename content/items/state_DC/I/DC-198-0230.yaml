stem: What constitutes neglect of duty for a board member under D.C. Code § 47-2853.07(c)?
options:
  - Attending exactly half of the regular scheduled meetings in a 12-month period.
  - Attending most regular scheduled meetings but missing one special meeting.
  - Attending more than half of the regular scheduled meetings but missing at least one meeting.
  - Attending less than half of the regular scheduled meetings in a 12-month period.
key: D
explanation: Under D.C. Code § 47-2853.07(c), neglect of duty is defined as a board member’s failure
  to attend at least half of the regular scheduled meetings within a 12‑month period. Therefore,
  attending less than half of the meetings meets this definition. The other options describe
  attendance patterns that do not meet the threshold for neglect of duty.
