stem: A hearing panel of the Board of Real Estate issues a final decision suspending a licensee. The
  licensee requests a rehearing before the full board. Under § 47-2853.22(i), what is the effect on
  the licensee's ability to appeal to the District of Columbia Court of Appeals?
options:
  - The licensee may appeal only after paying a fee
  - The licensee may appeal immediately to the Court of Appeals
  - The licensee may not appeal until the full board issues a ruling
  - The licensee may appeal only if the panel's decision is unanimous
key: C
explanation: Section 47-2853.22(i) states that a hearing panel’s decision is treated as the board’s
  decision for appeal purposes, but if a rehearing before the full board is requested, no appeal to
  the Court of Appeals is allowed until the full board issues a ruling. Therefore, the licensee must
  wait for the full board’s ruling before appealing. The option suggesting an immediate appeal is
  incorrect because the statute expressly bars appeal until the full board rules. The other options
  introduce conditions not mentioned in the statute.
