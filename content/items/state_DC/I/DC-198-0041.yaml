stem: If the amount deposited in the Real Estate Guaranty and Education Fund exceeds the maximum
  balance established by the Mayor, what action must the Mayor take?
options:
  - The Mayor shall waive contributions to the Fund required by this subchapter
  - The Mayor shall increase assessments on licensees to cover the shortfall
  - The Mayor shall suspend all licenses until the balance returns to the minimum
  - The Mayor shall transfer excess funds to the General Fund for future use
key: A
explanation: Under D.C. Code § 42-1707, whenever the amount deposited in the Fund exceeds the
  maximum balance set by the Mayor, the Mayor must waive the contributions to the Fund required by
  this subchapter. Therefore the correct answer is the option stating that the Mayor shall waive
  contributions. The other options are incorrect because they describe actions—increasing
  assessments, suspending licenses, or transferring excess to the General Fund—that are not required
  by the statute when the Fund exceeds its maximum balance.
