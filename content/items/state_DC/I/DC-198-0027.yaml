stem: Under D.C. Code § 42-1707(g), what happens to a licensee's license when the Mayor issues an
  order directing payment from the Real Estate Guaranty and Education Fund to satisfy a judgment?
options:
  - The license is automatically suspended upon issuance of the order.
  - The license is revoked after a hearing within thirty days.
  - The license remains active but the licensee must pay a fine.
  - The license is placed on probation for one year following suspension.
key: A
explanation: Subsection (g) states that the license shall be automatically suspended upon the
  issuance of the order. The other options describe revocation after a hearing, continuation with a
  fine, or probation, which are not supported by the text.
