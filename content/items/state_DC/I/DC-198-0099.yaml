stem: What happens to money deposited into the Real Estate Guaranty and Education Fund that is
  **NOT** expended in a fiscal year?
options:
  - It is transferred to the Mayor's office for administrative use
  - It remains in the Fund and does not revert to the General Fund
  - It is returned to the licensees who paid into the Fund
  - It reverts to the General Fund of the District of Columbia
key: B
explanation: The statute explicitly states that money deposited into the Fund but not expended in a
  fiscal year shall not revert to the unassigned fund balance of the General Fund of the District of
  Columbia. Therefore, the unexpended money stays in the Fund. The distractor that claims it reverts
  to the General Fund contradicts this provision.
citation:
  source: D.C. Code §§ 42-1701–42-1709 — D.C. Code Title 42, Ch. 17, Subch. I - Real Estate Brokers'
    Duties; Real Estate Guaranty and Education Fund — § 42-1706(d)(1)
  url: null
  quoted_text: Money deposited into the Fund but not expended in a fiscal year shall not revert to the
    unassigned fund balance of the General Fund of the District of Columbia at the end of a fiscal
    year, or at any other time.
