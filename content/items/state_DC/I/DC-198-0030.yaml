stem: Under § 47-2853.10(a)(1), if the Mayor has a question about an applicant’s qualification for a
  real estate license, what must the Mayor do?
options:
  - The Mayor shall refer the question to the appropriate board for resolution
  - The Mayor shall issue the license despite the question without consulting the board
  - The Mayor shall deny the application automatically without board review
  - The Mayor shall hold a hearing before issuing the license to the applicant
key: A
explanation: Under § 47-2853.10(a)(1), the Mayor must refer any question about an applicant’s
  qualifications to the appropriate board for resolution before taking licensing action. This
  ensures that qualification disputes are resolved by the board rather than the Mayor. The incorrect
  option that the Mayor would issue the license despite the question contradicts the requirement to
  refer the question. The option that the Mayor would deny the application automatically is also
  incorrect because the rule only mandates referral, not automatic denial.
