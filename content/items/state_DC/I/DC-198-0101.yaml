stem: The Office of the Chief Financial Officer projects that the Real Estate Guaranty and Education
  Fund's year‑end balance will be below the minimum balance set by the Mayor. What must the Mayor
  do?
options:
  - Transfer money from the General Fund to cover the shortfall
  - Suspend all license renewals until the balance is sufficient
  - Waive contributions to the Fund required by this subchapter
  - Assess each licensee an amount not exceeding $50 to bring the Fund to the minimum
key: D
explanation: When the projected year‑end Fund balance is less than the minimum established by rule,
  the Mayor must assess each licensee an amount not exceeding $50 during the license year to raise
  the Fund to the minimum level. The distractor about waiving contributions applies only when the
  Fund exceeds the maximum balance, not when it is below the minimum.
citation:
