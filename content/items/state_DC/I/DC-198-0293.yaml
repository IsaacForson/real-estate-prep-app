stem: A licensed real estate broker seeks appointment to the District's Board of Real Estate. The
  broker has actively engaged in real estate brokerage for six years and has resided in the District
  for the past ten months. Which statement correctly describes the broker's eligibility under D.C.
  Code § 47-2853.07?
options:
  - The broker is eligible because the active engagement requirement of six years satisfies the
    five‑year minimum.
  - The broker is ineligible because the residency requirement of at least one year prior to
    appointment is not met.
  - The broker is eligible because residency is only required at the time of appointment, not
    beforehand.
  - The broker is ineligible because professional board members must have been property managers for
    at least two years.
key: B
explanation: Under § 47-2853.07(d)(1), members of the Board of Real Estate must have been District
  residents for at least one year prior to appointment; the broker’s ten‑month residency fails this
  requirement. Although the broker satisfies the five‑year active‑engagement rule in
  § 47-2853.07(d)(2), residency is also mandatory, making the statement that the broker is eligible
  because the active engagement requirement of six years satisfies the five‑year minimum incorrect.
