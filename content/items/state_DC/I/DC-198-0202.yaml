stem: Under D.C. Code § 42-1707(e), within how many days must a person who commences an action for a
  judgment that could be the basis for a payment from the Real Estate Guaranty and Education Fund
  notify the Mayor in writing?
options:
  - 30 days
  - 10 days
  - 15 days
  - 60 days
key: A
explanation: The statute requires the person to notify the Mayor in writing within 30 days after the
  date of commencement of the action; failure to do so may be grounds for the Mayor to deny the
  application. The 15‑day option is a common misconception about a shorter notice period.
citation:
  source: D.C. Code § 42-1707(e)
  url: null
  quoted_text: Any person who commences an action for a judgment which could be the basis for an order
    of the Mayor directing payment from the Fund shall notify the Mayor in writing within 30 days
    after the date of the commencement of the action.
