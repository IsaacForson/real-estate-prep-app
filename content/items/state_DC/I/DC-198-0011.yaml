stem: Under 17 DCMR § 2600, what effect do courts give to Board records that are copied and duly
  certified and authenticated by the Board's seal?
options:
  - The same effect as the original record
  - Persuasive value, not binding effect
  - Effect limited to internal Board hearings
  - No evidentiary effect without live testimony
key: A
explanation: The regulation gives certified, sealed copies of Board records the same evidentiary
  effect as the original, so courts may rely on the copy without further proof.
citation:
  source: 17 DCMR § 2600.4
  url: null
  quoted_text: Copies of all records and papers duly certified and authenticated by the seal of the
    Board shall be received in evidence in all courts equally and with like effect as the original.
