stem: A board concludes a disciplinary hearing on June 10. Under § 47-2853.22(h), by what date must
  the board issue its final written decision?
options:
  - September 8
  - September 9
  - September 10
  - September 11
key: A
explanation: According to § 47-2853.22(h), a board must issue its final decision in writing within
  90 days after conducting a hearing. Adding 90 days to June 10 yields September 8 as the deadline
  for the board’s written decision. The option listing September 9 is one day too late, while
  September 10 and September 11 are further beyond the allowed period. Thus, only September 8
  satisfies the statutory timeframe.
