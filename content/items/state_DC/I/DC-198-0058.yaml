stem: A licensee willfully misrepresents the services they are authorized to perform under their
  license. Which of the following actions is **NOT** authorized by D.C. Code § 47-2853.17(c) for
  this violation?
options:
  - The Board may issue a cease and desist order to stop the misrepresentation.
  - The Board may impose a civil fine of $3,000 for the violation.
  - The Board may require the licensee to complete a course of remediation approved by the Board.
  - The Board may revoke the licensee's right to practice real estate in another state.
key: D
explanation: Under D.C. Code § 47-2853.17(c), the Board may deny licenses, revoke or suspend
  licenses, reprimand, impose civil fines up to $5,000, require remediation, impose probation, or
  issue a cease and desist order. Revoking a licensee’s right to practice in another state is not
  among the authorized actions.
