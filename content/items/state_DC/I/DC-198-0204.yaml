stem: A judgment creditor obtains a final judgment against a licensed real estate broker on March
  12, 2024. By what date must the creditor file an application for payment from the Real Estate
  Guaranty and Education Fund to be eligible under D.C. Code § 42-1707(a)?
options:
  - March 12, 2025
  - March 11, 2025
  - April 12, 2025
  - February 12, 2025
key: A
explanation: The application must be filed no later than 12 months after the judgment becomes final.
  Adding 12 months to March 12, 2024 yields March 12, 2025, which is the latest permissible filing
  date. The March 11 date is early but not the deadline, while the other dates fall outside the
  12‑month window.
