stem: Under D.C. Code § 47-2853.07(d)(1), what residency requirement must a member of the Board of
  Real Estate meet during their term of office?
options:
  - The member must be a resident of the District only at the time of appointment.
  - The member must be a resident of the District at all times during tenure.
  - The member must maintain a business address in the District but may reside elsewhere.
  - The member must have owned property in the District for at least five years.
key: B
explanation: The rule requires board members to be residents of the District at the time of
  appointment and throughout their tenure. The correct option reflects this continuous residency
  requirement. The distractor about owning property misstates the rule, which does not impose a
  property‑ownership condition for board service.
