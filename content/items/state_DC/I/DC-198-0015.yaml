stem: An applicant for a real estate license pays the required application fee, then withdraws the
  application before it is reviewed. What happens to the fee under D.C. Code § 47-2853.10?
options:
  - The fee is kept and not returned to the applicant
  - The fee is returned within 30 calendar days
  - The fee is credited toward a future application
  - The fee is refunded minus a small processing charge
key: A
explanation: The statute makes application fees non-refundable even when an applicant withdraws the
  application, so the agency retains the payment regardless of the withdrawal.
citation:
  source: D.C. Code § 47-2853.10(d)
  url: null
  quoted_text: Application fees paid under this section shall not be refundable, even if the applicant
    withdraws his or her application for licensure, certification or registration, or is found to be
    not qualified.
