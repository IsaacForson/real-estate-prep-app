stem: A person has lived in the District for 10 months and is nominated for appointment to the Board
  of Real Estate. Under D.C. Code § 47-2853.07(d)(1), is the person eligible?
options:
  - Yes, because they are a resident at the time of appointment.
  - No, because they must have been a resident for at least one year prior to appointment.
  - Yes, because the residency requirement only applies to consumer members.
  - No, because they must be a licensed real estate professional.
key: B
explanation: The law requires Board of Real Estate members to have been District residents for at
  least one year prior to appointment; 10 months is insufficient.
