stem: A vacancy occurs on the Board of Real Estate with six months remaining in the term. A
  successor is appointed and sworn into office four months after the vacancy arises. How long does
  the interim member appointed to fill the vacancy serve?
options:
  - Four months
  - Two months
  - Six months
  - Eight months
key: C
explanation: The interim member serves until the expiration of the term or until a successor is
  appointed and sworn into office, whichever is later. Since the successor is appointed at four
  months, which is earlier than the term’s end at six months, the later event is the term
  expiration, so the interim serves six months. The distractor "Four months" is wrong because it
  assumes service ends when the successor is appointed, ignoring the “whichever later” provision.
