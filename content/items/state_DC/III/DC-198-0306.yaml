stem: What is the effect of an owner's failure to provide the written notice required under D.C.
  Code § 42-3404.02(d)?
options:
  - The failure does not affect the validity of the exemption
  - The owner must pay a civil penalty of $2,500
  - The exemption from the tenant opportunity to purchase is void
  - The lease agreement is automatically terminated
key: A
explanation: Under D.C. Code § 42-3404.02(d)(3), failure to provide the required written notice does
  not affect the validity of the exemption. Therefore, the exemption remains valid despite the
  omission. The other options incorrectly state that the exemption is void, the lease is terminated,
  or a penalty applies.
