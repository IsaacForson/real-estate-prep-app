stem: A tenant with an oral lease receives a written offer of sale on August 2, 2024. By what date
  must the tenant notify the owner and provide a rent receipt or other proof of tenancy, according
  to D.C. Code § 42-3404.03(b)(3)?
options:
  - August 15, 2024
  - August 16, 2024
  - August 17, 2024
  - August 18, 2024
key: C
explanation: The statute requires oral-lease tenants to notify the owner and provide proof of
  tenancy no more than 15 days after receipt of the offer of sale; adding 15 days to August 2 yields
  August 17 as the final permissible day. The distractor of August 18 exceeds the 15-day limit.
