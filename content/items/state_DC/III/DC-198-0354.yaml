stem: A housing accommodation becomes subject to subsection (b)(20) of D.C. Code § 42-3404.02 on
  December 31, 2025. The owner provides written notice to all tenants on March 30, 2026. Is the
  notice compliant with the requirement under subsection (d)(2)?
options:
  - The notice is compliant because notice must be given within 60 days
  - The notice is non‑compliant because notice must be given before December 31, 2025
  - The notice is compliant because it falls within the 90‑day period
  - The notice is non‑compliant because it is after the 90‑day period
key: C
explanation: The rule requires notice within 90 days after December 31, 2025; March 30, 2026 is
  within that period, making the notice compliant. The distractor claiming a 60‑day requirement
  misstates the statutory timeframe.
