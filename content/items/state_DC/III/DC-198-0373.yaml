stem: A property manager discloses confidential client information to a third party without
  obtaining the client's prior written consent. Which prohibited act under D.C. Code § 47-2853.197
  has been committed?
options:
  - Failing to furnish a copy of the contract to signatories
  - Offering property for rent without owner's consent
  - Making oral representations about repairs after conveyance without written notice
  - Disclosing confidential information without prior written consent
key: D
explanation: The provision prohibits a property manager from disclosing to a third party
  confidential information that could injure the client’s business or personal affairs without the
  client’s prior written consent. Disclosing such information without consent therefore violates
  this specific prohibition. Offering property without the owner’s consent addresses a different
  requirement and does not fit the scenario.
