stem: A salesperson employed by Broker A advertises themselves as a salesperson for Broker B without
  Broker A’s knowledge or written consent. Which prohibited act under D.C. Code § 47-2853.197 has
  been committed?
options:
  - Disclosing confidential client information without prior written consent
  - Representing another broker as their salesperson without consent
  - Failing to deposit earnest money into an escrow account within three days
  - Accepting a commission directly from a buyer for a sale
key: B
explanation: The scenario matches the prohibition against representing another broker as one’s
  salesperson without the broker’s express knowledge and written consent. Accepting a commission
  directly from a buyer, while also prohibited, does not describe the conduct in the scenario.
