stem: A tenant who is an elderly tenant or a tenant with a disability receives a written offer of
  sale from the owner on May 10. Under D.C. Code § 42-3404.09(c)(3)(A), how many days does the
  tenant have to deliver a written statement of interest to the owner?
options:
  - 20 days
  - 10 days
  - 15 days
  - 25 days
key: A
explanation: Upon receiving a written offer of sale, an elderly or disabled tenant has exactly 20
  days to deliver a written statement of interest to the owner. Selecting 10 or 15 days
  underestimates the statutory period, while 25 days exceeds it.
citation:
  source: "D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental Housing
    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.09(c)(3)(A)"
  url: null
  quoted_text: Upon delivery of a written offer of sale from the owner, the tenant shall have 20 days
