stem: According to D.C. Code § 42-3404.03(a)(2), what must an offer of sale include regarding the
  tenant's right to purchase and technical assistance?
options:
  - The offer must state whether a third‑party sale contract exists and that the owner will provide
    a copy to the tenant within seven days of a request.
  - The offer must state that the tenant has the right to purchase and that tenants are entitled to
    no‑cost technical assistance from a Mayor‑approved tenant support provider.
  - The offer must state that the owner will provide a floor plan and an itemized list of monthly
    operating expenses within seven days of a tenant request.
  - The offer must include the name and contact information of all Mayor‑certified tenant support
    providers as of the offer's issuance.
key: B
explanation: Subsection (a)(2) requires the offer to include a statement that the tenant has the
  right to purchase and a notice of entitlement to no‑cost technical assistance from a
  Mayor‑approved tenant support provider. The option about floor plans and operating expenses
  corresponds to subsection (a)(4), not (a)(2).
citation:
  source: D.C. Code § 42-3404.03(a)(2)
  url: null
  quoted_text: A statement that the tenant has the right to purchase the accommodation under this
    subchapter and a notice that the tenants are entitled to no-cost technical assistance and
    training on their rights provided by a tenant support provider approved by the Mayor
