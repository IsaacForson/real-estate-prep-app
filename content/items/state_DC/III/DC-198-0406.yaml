stem: Which of the following is specifically required by D.C. Code § 42-3404.03(a)(1)?
options:
  - The asking price and material terms of the sale
  - A statement that the tenant has the right to purchase the accommodation
  - A copy of the most recent rent roll and list of tenants
  - The name and contact information of all certified tenant support providers
key: A
explanation: "Subsection (a)(1) explicitly states that an offer of sale must include the asking
  price and material terms of the sale. The other options correspond to different subsections:
  (a)(2) requires the right‑to‑purchase statement, (a)(4) requires the rent roll and tenant list,
  and (a)(5) requires tenant support provider information."
