stem: Which of the following activities is **NOT** included in the definition of a real estate
  salesperson under D.C. Code § 47-2853.171?
options:
  - Managing or leasing property
  - Negotiating a loan on real estate
  - Appraising real estate for a fee
  - Listing property for sale
key: C
explanation: The statute defines a real estate salesperson as a person employed by a licensed broker
  to perform activities such as managing or leasing property, negotiating loans, and listing
  property for sale. Appraising real estate for a fee is not listed among those authorized acts.
  Therefore, appraising is not part of the salesperson’s scope of practice.
citation:
  source: D.C. Code § 47-2853.171
  url: null
  quoted_text: For the purposes of this part, the term “real estate salesperson” means any person
    employed by a licensed real estate broker to manage or lease; rent or offer to lease or rent;
    list for sale, sell, or offer for sale; buy or offer to buy; negotiate the purchase or sale, or
    exchange of real estate; or to negotiate a loan on real estate.
