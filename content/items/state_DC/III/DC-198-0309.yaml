stem: Under D.C. Code § 47-2853.196(a), if a brokerage relationship does **NOT** specify a definite
  termination date, when does it terminate?
options:
  - 60 days after the date the brokerage relationship was entered into
  - 90 days after the date the brokerage relationship was entered into
  - 30 days after the date the brokerage relationship was entered into
  - 120 days after the date the brokerage relationship was entered into
key: B
explanation: Under D.C. Code § 47-2853.196(a), a brokerage relationship without a specified end date
  ends 90 days after it is formed. Therefore the correct answer is 90 days after the date the
  brokerage relationship was entered into. The other options propose different intervals that are
  not supported by the statute.
citation:
  source: D.C. Code § 47-2853.196(a)
  url: null
  quoted_text: (a) Brokerage relationships shall have a definite termination date; however, if a
    brokerage relationship does not specify a definite termination date, the brokerage relationship
    shall terminate 90 days after the date the brokerage relationship was entered into.
