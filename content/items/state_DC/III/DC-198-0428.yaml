stem: Under D.C. Code § 42-3404.09(b)(2), for how long after delivering notice to a tenant is an
  owner **NOT** required to provide subsequent notice of a received or solicited offer?
options:
  - One year
  - Six months
  - Thirty days
  - Two years
key: A
explanation: The rule states that for one year after delivering notice to a tenant pursuant to
  paragraph (1), an owner is not required to provide the same tenant with subsequent notice that the
  owner has received or solicited offers. After that year, the exemption ends and notice is again
  required. The distractor 'Six months' incorrectly shortens the period.
