stem: Under D.C. Code § 42-3404.02d(1), before an individual enters into a lease for a rental unit
  located in a housing accommodation that is **NOT** subject to the tenant opportunity to purchase
  based on subsection (b)(20) of this section, what must the owner provide?
options:
  - Written notice of the exemption
  - Written notice of tenant opportunity
  - Written notice of the rent increase
  - Written notice of the building's age
key: A
explanation: Under D.C. Code § 42-3404.02d(1), the owner must provide written notice of the
  exemption when leasing a unit that is not subject to the tenant opportunity to purchase because of
  the new-building exemption. The other notices are not required by this provision.
