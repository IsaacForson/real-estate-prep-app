stem: Under D.C. Code § 42-3404.02(d)(1), what must an owner do before an individual enters into a
  lease for a rental unit located in a housing accommodation that is **NOT** subject to the tenant
  opportunity to purchase based on subsection (b)(20)?
options:
  - Provide written notice to the individual regarding the exemption
  - Provide written notice to the tenant organization regarding the exemption
  - Provide written notice to the Mayor regarding the exemption
  - Provide written notice to the real estate broker regarding the exemption
key: A
explanation: Subsection (d)(1) requires the owner to provide written notice to the individual
  regarding the exemption before a lease is entered into for a unit exempt under subsection (b)(20).
  Therefore, the correct action is to provide written notice to the individual. Notifying the tenant
  organization is incorrect because the statute specifies the individual, not the organization.
citation:
  source: "D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental Housing
    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.02 § 42-3404.02(d)(1)"
  url: null
  quoted_text: Before an individual enters into a lease for a rental unit located in a housing
    accommodation that is not subject to the tenant opportunity to purchase based on subsection
    (b)(20) of this section, the owner of the housing accommodation shall provide written notice to
    the individual regarding such exemption.
