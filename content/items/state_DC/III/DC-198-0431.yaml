stem: Under D.C. Code § 42-3404.03b(a), within how many business days following receipt of the offer
  of sale by the Mayor must the Mayor provide all tenant support providers and qualified purchasers
  with a copy of the offer of sale?
options:
  - 10 business days
  - 5 business days
  - 3 business days
  - 7 business days
