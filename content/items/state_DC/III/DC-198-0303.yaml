stem: Under D.C. Code § 42-3404.09(d)(3), what is the maximum number of days before issuing an offer
  of sale that an owner may serve a tenant with a notice of intent to sell, demolish, or discontinue
  the housing use of a single-family accommodation?
options:
  - 30 days
  - 60 days
  - 90 days
  - 120 days
key: B
explanation: The statute explicitly states that an owner may not serve such notice more than 60 days
  before issuing the offer of sale, making 60 days the maximum permissible period.
