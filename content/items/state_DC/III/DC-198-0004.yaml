stem: One member of a licensed real estate partnership has his license revoked. Under D.C. Code §
  47-2853.187, what must occur so the other partners' licenses are **NOT** automatically revoked?
options:
  - Dissolve and reorganize the partnership under new terms
  - Pay a civil fine on behalf of the revoked partner
  - Report the license revocation to the Board promptly
  - Sever ties with the member within the Mayor's deadline
key: D
explanation: The statute excuses the other partners' licenses from automatic revocation only when
  the partnership severs its connection with the revoked member within the Mayor's prescribed time.
citation:
  source: D.C. Code § 47-2853.187
  url: null
  quoted_text: In a partnership, the connection with the member whose license has been revoked or
    suspended is severed within the time prescribed by the Mayor, and his or her participation in
    the partnership’s activities is terminated
