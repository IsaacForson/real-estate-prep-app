stem: A director of a corporate real estate firm has his real estate license revoked by the Mayor.
  To prevent the automatic revocation of the licenses of other directors or officers of the
  corporation, what must the corporation do under D.C. Code § 47-2853.187?
options:
  - Discharge the director and ensure he has no further participation in the corporation’s
    activities.
  - Sever the director’s connection and terminate his participation in the corporation’s activities.
  - Have the director transfer his shares to another officer within 30 days.
  - File a written appeal with the Mayor within 15 days of the revocation.
key: A
explanation: For an association or corporation, the statute provides that the license of other
  directors or officers will not be automatically revoked if the director whose license is revoked
  is discharged and has no further participation in the corporation’s activities. The other options
  describe partnership rules or actions not required by the statute.
