stem: An owner of a single-family accommodation receives a written offer to purchase the property on
  May 30. According to D.C. Code § 42-3404.09(b)(1), by what date must the owner deliver written
  notice to the tenant of the offer?
options:
  - 6/1/2024
  - 6/2/2024
  - 6/3/2024
  - 6/4/2024
key: B
explanation: The rule mandates that notice be delivered within 3 calendar days of receiving a
  written offer. Counting three days from May 30 brings the deadline to June 2. Choosing June 1
  assumes only one day has passed, while June 3 or June 4 incorrectly add extra days beyond the
  permitted period.
citation:
  source: "D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental Housing
    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.09(b)(1)"
  url: null
  quoted_text: Within 3 calendar days of receiving or soliciting, in writing, an offer to purchase a
    single-family accommodation, an owner of a single-family accommodation who has an intent to sell
    the single-family accommodation shall deliver written notice to a tenant of the single-family
    accommodation or a unit in the single-family accommodation that the owner received or solicited
    an offer to purchase the single-family accommodation.
