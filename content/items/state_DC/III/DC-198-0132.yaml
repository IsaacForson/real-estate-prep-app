stem: Under D.C. Code § 42-3404.02(c), who bears the burden of proof to establish that a property or
  transfer is exempt from the requirements of this subchapter and subchapter V?
options:
  - The broker
  - The owner
  - The landlord
  - The tenant
key: B
explanation: Subsection (c) states that the burden of proof to establish that a property or transfer
  is exempt from the requirements of this subchapter and subchapter V shall be on the owner.
  Therefore, the owner must prove the exemption applies. The tenant is incorrect because the statute
  places the burden on the owner, not the tenant.
