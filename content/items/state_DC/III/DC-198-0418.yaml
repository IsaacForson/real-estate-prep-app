    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.09 § 42-3404.09(b)(3)(A)"
  url: null
  quoted_text: (3)(A) Liability for failure to provide the notice required by this subsection shall
    lie with the owner and may not attach to the real property that is the subject of the required
    notice.
