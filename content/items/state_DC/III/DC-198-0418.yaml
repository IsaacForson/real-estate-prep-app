stem: Under D.C. Code § 42-3404.09(b)(3)(A), to whom does liability for failure to provide the
  required notice of a potential sale of a single-family accommodation attach?
options:
  - Liability of the owner
  - Liability of the real property
  - Liability of owner and property
  - Liability of the tenant
key: A
explanation: The statute states that liability for failure to provide the notice lies with the owner
  and may not attach to the real property. Therefore, only the owner is liable. The distractor
  assigning liability to the real property is incorrect because the rule explicitly excludes
  attachment to the property.
