stem: An escrow holder holds earnest money for 120 days before the transaction closes. According to
  D.C. Code § 42-1704(e), from which day does the escrow begin to earn interest?
options:
  - On the 1st day.
  - On the 30th day.
  - On the 60th day.
  - On the 91st day.
key: D
explanation: Section 42-1704(e) states that if an escrow is held for 90 days or more, it shall earn
  interest from the 91st day to the date the transaction is consummated or terminated. Therefore,
  interest begins on the 91st day, not earlier.
