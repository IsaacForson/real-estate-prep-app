stem: A property manager learns that a client is experiencing financial difficulties and plans to
  sell the property. The manager informs a prospective buyer about the client's motivation to sell
  quickly in order to facilitate a sale, without obtaining the client's written consent. Which
  prohibited act under D.C. Code § 47-2853.197 has the manager committed?
options:
  - Made a substantial misrepresentation
  - Disclosed confidential information without prior written consent
  - Accepted a fee from someone other than the employing broker
  - Failed to maintain accurate accounting records
key: B
explanation: The manager disclosed the client's confidential personal affairs (financial
  difficulties) to a third party without the client's prior written consent, which is prohibited by
  § 47-2853.197(5). The other options describe different prohibited acts not triggered by the
  scenario.
