stem: Under D.C. Code § 42-3404.09(e)(1), what documentation must a tenant who asserts rights under
  subsection (c) deliver to the Mayor?
options:
  - A written statement of interest submitted to the owner within the required period
  - A copy of the tenant's signed lease agreement with the landlord
  - A notice of intent to sell the single-family accommodation to the tenant
  - Documentation of status as an elderly tenant or a tenant with a disability
key: D
explanation: The statute requires a tenant asserting rights under subsection (c) to deliver
  documentation of their elderly or disability status to the Mayor. A copy of the lease agreement is
  not mentioned as required documentation.
