stem: A licensee advises a client who wishes to transfer ownership of a rental housing accommodation
  to his adult child while both are alive. Under D.C. Code § 42-3404.02(b)(2), is the transfer
  exempt from the Tenant Opportunity to Purchase requirements?
options:
  - The transfer is exempt because it is an inter-vivos gift between parent and child, which is
    exempt under subsection (b)(2).
  - The transfer is not exempt because it is not a transfer by a decedent's estate, which is the
    only family transfer exempt under subsection (b)(1).
  - The transfer is not exempt because the owner failed to provide written notice to tenants before
    the transfer as required by subsection (d)(1).
  - The transfer is exempt because it qualifies as a transfer by a decedent's estate to family
    members under subsection (b)(1).
key: A
explanation: Subsection (b)(2) exempts inter-vivos transfers between parent and child, so the
  transfer is exempt. Distractor B incorrectly claims only estate transfers are exempt, ignoring the
  inter-vivos exemption.
