stem: A licensee representing a landlord learns that a former tenant of the rental unit was
  diagnosed with HIV. Under D.C. Code § 47-2853.198, what is the licensee's obligation regarding
  disclosure of this fact to a prospective tenant?
options:
  - The licensee must disclose the former tenant's HIV status only if the tenant asks about health
  - The licensee must disclose the former tenant's HIV status to the prospective tenant
  - The licensee must not disclose the former tenant's HIV status because it is not a material fact
    under D.C. Code
  - The licensee must disclose the former tenant's HIV status if they think it matters to the tenant
key: C
explanation: The statute explicitly states that information about an occupant's HIV infection is not
  a material fact that must be disclosed in a real estate transaction. Therefore, the licensee is
  not obligated to disclose this information and may not do so without the tenant's consent.
citation:
