stem: If a tenant organization already exists in a form desired by the tenants, within how many days
  must the tenants deliver the application for registration to the Mayor and the owner after receipt
  of a valid offer, according to D.C. Code § 42-3404.11(1)?
options:
  - 30 days
  - 45 days
  - 15 days
  - 60 days
key: A
explanation: The statute states that when a tenant organization already exists in a form desired by
  the tenants, delivery of the application must be within 30 days of receipt of a valid offer (or
  the Mayor’s receipt, whichever is later). The 45‑day period applies only when the tenants must
  first form an organization, file articles, and then deliver the application.
citation:
  source: "### D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental
    Housing Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.11"
  url: null
  quoted_text: If, at the time of receipt of the valid offer, a tenant organization exists in a form
    desired by the tenants, the delivery of the application for registration to the Mayor and the
    owner by hand or by certified mail shall be within 30 days of receipt of a valid offer or the
    Mayor’s receipt of a valid offer, whichever is later.
