stem: In the event of the revocation of a license issued to a real estate corporation, under D.C.
  Code § 47‑2853.187, what must happen to the director or officer whose license has been revoked to
  avoid summary revocation of the corporation's license?
options:
  - The director or officer must transfer their shares to another shareholder within the Mayor's
    deadline.
  - The director or officer must be discharged and have no further participation in the
    corporation’s activities.
  - The corporation must appoint a new director or officer within 30 days of the revocation.
  - The director or officer must pay a fine of $2,500 to the Mayor for the violation.
key: B
explanation: Under D.C. Code § 47‑2853.187, a corporation avoids summary revocation only if the
  director or officer whose license is revoked is discharged and has no further participation in the
  corporation’s activities. The other statements are not required by the statute.
