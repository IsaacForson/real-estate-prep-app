stem: Which District law must a licensee comply with when engaging in an activity governed by the
  anti-discrimination rule in 17 DCMR § 2609?
options:
  - The Human Rights Act of 1977
  - The Rental Housing Conversion Act
  - The Security Deposit Act
  - The Tenant Opportunity to Purchase Act
key: A
explanation: The rule requires licensees to comply with the Human Rights Act of 1977 in addition to
  the specific list of protected classes named in the regulation.
citation:
  source: 17 DCMR § 2609.1
  url: null
  quoted_text: A licensee shall not discriminate or assist any party in discriminating in the sale,
    rental, leasing, exchange, or transfer of property to any person or group of persons because of
    race, color, religion, national origin, sex, age, marital status, personal appearance, sexual
    orientation, family responsibilities, political affiliation, physical handicap, source of
    income, matriculation, or place of residence or business, and shall comply with the Human Rights
    Act of 1977, effective December 13, 1977 (D.C. Law 2-38; D.C. Official Code §§ 2-1401.01 et
    seq.), as amended, and any other applicable District or federal anti-discrimination rule,
    regulation, or act.
