stem: Under D.C. Code § 42-3404.09(c)(1), for an elderly tenant or a tenant with a disability to
  have the provisions of the Rental Housing Conversion and Sale subchapter apply to a single-family
  accommodation, the tenant must have signed a rental agreement to occupy the unit by what date?
options:
  - 4/15/2018
  - 3/31/2018
  - 4/15/2019
  - 3/31/2019
key: B
explanation: The statute requires that an elderly or disabled tenant have signed a rental agreement
  by March 31, 2018 (and taken occupancy by April 15, 2018) for the subchapter to apply. The April
  15, 2018 date pertains to the occupancy deadline, not the agreement signing date, so choosing it
  confuses the two distinct deadlines. The other incorrect options change the year, which the
  statute does not allow.
citation:
