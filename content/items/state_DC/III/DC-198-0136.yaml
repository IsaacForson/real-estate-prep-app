stem: An owner of a single-family accommodation delivered written notice to a tenant on June 1,
  2023, informing the tenant of a received offer to purchase. The owner receives another written
  offer to purchase the property on July 10, 2024. Under D.C. Code § 42-3404.09(b)(2), is the owner
  required to provide notice to the tenant of the new offer?
options:
  - Yes, because more than one year has passed since the previous notice.
  - No, because the owner is exempt from providing notice for one year after the initial notice.
  - Yes, but only if the tenant is elderly or has a disability.
  - No, because the owner must wait until the tenant requests the notice.
key: A
explanation: The statute provides that for one year after delivering notice, the owner is not
  required to give subsequent notice. Since the new offer arrived more than one year after the June
  1, 2023 notice, the exemption has expired and notice is required. The distractor claiming no
  notice is needed ignores the one‑year limit.
citation:
