stem: An elderly tenant who signed a rental agreement and took occupancy receives a written offer of
  sale. The owner offers the tenant money to move out so the owner can occupy the unit. Under D.C.
  Code § 42-3404.09(c)(6)(C), what is the legal consequence of this arrangement?
options:
  - It is permissible because the tenant receives compensation.
  - It is allowed if the tenant agrees in writing.
  - It requires approval from the Mayor.
  - It is a willful violation of the subsection.
key: D
explanation: The statute declares that a bargain in which the tenant receives consideration to
  vacate before the 12‑month period ends so the owner may use the unit constitutes a willful
  violation. Offering money to vacate early is therefore prohibited. The distractor suggesting
  permissibility ignores the explicit prohibition on pre‑vacate consideration.
citation:
  source: D.C. Code § 42-3404.09(c)(6)(C)
  url: null
  quoted_text: A bargain in which the tenant receives consideration to vacate the tenant's unit before
    the 12-month period ends so that the owner may use or occupy the unit shall constitute a willful
    violation of this paragraph.
