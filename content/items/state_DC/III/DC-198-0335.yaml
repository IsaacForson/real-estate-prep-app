stem: An owner of a single-family accommodation delivered written notice to a tenant on March 15,
  2023, informing the tenant of a received offer to purchase. The owner receives another written
  offer to purchase the property on March 10, 2024. Under D.C. Code § 42-3404.09(b)(2), is the owner
  required to provide notice to the tenant of the new offer?
options:
  - No, notice is not required because more than one year has passed since the previous notice.
  - Yes, notice is required because more than one year has passed since the previous notice.
  - Yes, notice is required because the new offer occurs within one year of the previous notice.
  - No, notice is not required because the new offer occurs within one year of the previous notice.
key: D
explanation: The statute exempts an owner from providing subsequent notice for one year after the
  initial notice. Since the new offer on March 10, 2024 falls within one year of the March 15, 2023
  notice, no notice is required. The distractor claiming notice is required because the offer is
  within one year misstates the exemption.
citation:
  source: "D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental Housing
    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.09(b)(2)"
  url: null
  quoted_text: For one year after delivering notice to a tenant pursuant to paragraph (1) of this
    subsection, an owner is not required to provide the same tenant with subsequent notice that the
    owner has received or solicited offers to purchase the single-family accommodation.
