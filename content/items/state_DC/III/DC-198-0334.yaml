stem: Under D.C. Code § 42-3404.09(b)(1), what is the required timeframe for an owner to deliver
  written notice to a tenant after receiving or soliciting a written offer to purchase a
  single-family accommodation?
options:
  - Three calendar days
  - Five business days
  - Seven calendar days
  - Ten business days
key: A
explanation: The statute requires notice within three calendar days of receiving or soliciting a
  written offer. The most tempting distractor, five business days, confuses calendar days with
  business days, but the rule specifies calendar days.
citation:
  source: "D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental Housing
    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.09(b)(1)"
  url: null
  quoted_text: Within 3 calendar days of receiving or soliciting, in writing, an offer to purchase a
    single-family accommodation, an owner of a single-family accommodation who has an intent to sell
    the single-family accommodation shall deliver written notice to a tenant
