explanation: The rule requires that any oral or written representations about post‑conveyance
  repairs be provided in writing to the buyer at least five days before the conveyance. Therefore,
  five days is the correct timeframe. The three‑day option is incorrect because the statute
  specifies a five‑day period, not three.
