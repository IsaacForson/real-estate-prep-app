stem: Under D.C. Code § 42-3404.02, who bears the burden of proof to establish that an offer of sale
  is a bona fide offer of sale?
options:
  - The owner bears the burden of proof.
  - The tenant organization bears the burden of proof.
  - The Mayor bears the burden of proof.
  - The appraiser bears the burden of proof.
key: A
explanation: The statute places the burden of proof on the owner to show that the offer of sale is
  bona fide under subsection (a-1)(4). The distractor that assigns the burden to the tenant
  organization is incorrect because the law explicitly assigns this duty to the owner, not the
  tenant group.
citation:
  source: "D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental Housing
    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.02(a-1)(4)"
  url: null
  quoted_text: The owner of the housing accommodation shall have the burden of proof to establish that
    an offer of sale under this subsection is a bona fide offer of sale.
