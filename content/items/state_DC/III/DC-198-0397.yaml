stem: Under D.C. Code § 42-3404.09(c)(2)(A), what must a written offer of sale to an elderly tenant
  or tenant with a disability include, in addition to complying with § 42-3404.03?
options:
  - A notice of the tenant's right to terminate the lease, a request for the tenant's financial
    statements, and a duplicate of the building's maintenance log
  - A summary of the property's recent appraisal, the owner's contact information, and a copy of the
    property's tax assessment record
  - A copy of the tenant's rental agreement, a statement of the tenant's monthly rent amount, and a
    copy of the lease commencement date
  - A description of the tenant's rights and obligations under this section and a list of
    organizations from which the tenant may seek help to exercise the right to purchase
key: D
explanation: The statute explicitly requires that a written offer of sale include a description of
  the tenant's rights and obligations under the section and a list of organizations from which the
  tenant may seek help to exercise the right to purchase. The option that mentions a summary of the
  property's recent appraisal, the owner's contact information, and a copy of the property's tax
  assessment record does not contain these required elements and instead includes unrelated
  information.
