stem: Under D.C. Code § 42-3404.02(a-1)(5)(B), within how many days must a tenant organization
  request an appraisal after receiving an alleged bona fide offer of sale?
options:
  - 15 days
  - 30 days
  - 45 days
  - 60 days
key: C
explanation: The rule states that a tenant organization must request an appraisal within 45 days of
  receiving the alleged bona fide offer of sale. Therefore, the correct answer is 45 days. The
  distractor of 30 days is incorrect because it understates the statutory period, while 60 days
  overstates it.
