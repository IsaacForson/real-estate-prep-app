stem: An owner of a housing accommodation that qualifies for the exemption under subsection (b)(20)
  leases a unit to a prospective tenant without providing the written notice required before the
  lease begins. Is the exemption still valid under D.C. Code § 42-3404.02(d)?
options:
  - No, because notice was required and not given.
  - Yes, because failure to give notice does not affect the validity of the exemption
  - Only if the tenant later receives notice from the owner.
  - Only if the owner provides notice within 30 days after lease signing.
key: B
explanation: Subsection (d)(3) states that failure to provide the required notice does not affect
  the validity of the exemption. Thus, even though notice was omitted, the exemption remains valid.
  The other options incorrectly condition validity on later notice or impose a time limit not
  present in the statute.
