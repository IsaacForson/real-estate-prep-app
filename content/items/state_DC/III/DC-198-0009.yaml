stem: A broker receives earnest money for a pending sale and holds it without written instructions
  from the parties. Under D.C. Code § 42-1704, within how many days must the broker deposit the
  funds into an insured District financial institution account?
options:
  - 7 days
  - 3 days
  - 14 days
  - 30 days
key: A
explanation: The escrow-accounts statute requires that, absent contrary written instructions from
  all parties, entrusted monies be deposited within 7 days in an insured District financial
  institution.
citation:
  source: D.C. Code § 42-1704(a)(1)
  url: null
  quoted_text: Deposited within 7 days in an account in a financial institution located within the
    District whose deposits are insured either by the Federal Deposit Insurance Corporation or the
    Federal Savings and Loan Insurance Corporation, or their successors
