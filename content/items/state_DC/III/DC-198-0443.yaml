stem: An escrow account is opened on February 1 and remains open for 95 days before the transaction
  is consummated. According to D.C. Code § 42-1704(e), on what date does the escrow begin to earn
  interest?
options:
  - May 1
  - May 2
  - May 3
  - May 4
key: B
explanation: Interest accrues from the 91st day after the escrow is opened. Adding 90 days to
  February 1 yields May 2, which is the 91st day. The distractor “May 3” mistakenly adds 91 days
  instead of 90.
