stem: Under D.C. Code § 47-2853.196(d), the disclosure requirement to an actual or prospective
  landlord or tenant who is **NOT** the client does **NOT** apply to lessors or lessees in single or
  multifamily residential units for lease terms of less than how many months?
options:
  - The exemption applies for lease terms of less than one month.
  - The exemption applies for lease terms of less than two months.
  - The exemption applies for lease terms of less than three months.
  - The exemption applies for lease terms of less than four months.
key: B
explanation: The statute explicitly states that the disclosure requirement does not apply to lease
  terms of less than two months. The other options incorrectly state different durations.
