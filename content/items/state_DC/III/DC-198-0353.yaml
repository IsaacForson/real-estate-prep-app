stem: Under D.C. Code § 42-3404.02d(1), to whom must the owner provide written notice before a lease
  for a rental unit located in a housing accommodation that is **NOT** subject to the tenant
  opportunity to purchase based on subsection (b)(20) of this section?
options:
  - The tenants in the building
  - The tenant organization
  - The Mayor of the District
  - The prospective tenant
key: D
explanation: The statute requires the owner to provide written notice to the individual prospective
  tenant regarding the exemption. The other options list recipients not specified in the subsection.
