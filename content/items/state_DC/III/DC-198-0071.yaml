stem: On March 10, a broker terminates the employment of a salesperson. The broker mails the
  required notification to the former employee on March 26. Is the broker's action compliant with
  D.C. Code § 47-2853.186(b)?
options:
  - No, because the broker did not also notify the Mayor of the mailing.
  - Yes, because the broker also sent a copy of the notice to the Mayor.
  - No, because the notification was mailed after the required fifteen‑day period.
  - Yes, because the notification was mailed within the required fifteen‑day period.
key: C
explanation: The rule requires the broker to mail notification within 15 calendar days of the
  salesperson’s discharge or termination. Mailing on March 26 is 16 days after March 10, which
  misses the deadline, so the action is not compliant. The distractor claiming compliance assumes
  the notification was mailed within the required period, but the dates show it was late.
