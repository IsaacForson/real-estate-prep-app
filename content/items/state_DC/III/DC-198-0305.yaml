stem: An owner initiates delivery of a notice to a tenant on April 5. By what date must the owner
  deliver copies of that notice to the Mayor with written evidence of the date of delivery,
  according to D.C. Code § 42-3404.09(f)(2)?
options:
  - April 10
  - April 12
  - April 15
  - April 20
key: C
explanation: Copies must be delivered to the Mayor within 10 days of the initiation of delivery;
  April 5 plus 10 days is April 15.
