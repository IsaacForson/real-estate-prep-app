stem: A tenant organization registered under § 42-3404.11(1) requests an appraisal of a housing
  accommodation with six units after receiving an alleged bona fide offer of sale. Fourteen days
  pass without the tenant organization and the owner agreeing on an appraiser. Under D.C. Code §
  42-3404.02, what may occur next?
options:
  - The correct action is that the tenant organization must resubmit its request after 14 days.
  - The correct action is that the appraisal must be conducted by a third-party selected by the
    owner.
  - The correct action is that the Mayor must appoint an appraiser without a request.
  - The correct action is that either party may request the Mayor to select an appraiser.
key: D
explanation: The rule states that if the parties do not agree on an appraiser within 14 days, either
  party may request that the Mayor select an appraiser. The option claiming the Mayor must select
  automatically is incorrect because the statute requires a request from either party before the
  Mayor acts.
citation:
  source: "D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental Housing
    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.02"
  url: null
  quoted_text: If within 14 days after a tenant organization has requested an appraisal, the tenant
    organization and owner of the housing accommodation have not agreed upon an appraiser, either
    party may request that the Mayor select an appraiser.
