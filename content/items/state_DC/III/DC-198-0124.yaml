stem: A real estate salesperson is terminated by her employing broker on May 1. She notifies the
  Mayor in writing on May 18. Is her action compliant with D.C. Code § 47-2853.186(c)?
options:
  - Yes, because she notified the Mayor within 15 days.
  - No, because she notified the Mayor after the 15‑day period.
  - Yes, because the broker also mailed notification to the Mayor.
  - No, because she must also return her license to the Mayor within 15 days.
key: B
explanation: The statute requires a salesperson to notify the Mayor in writing within 15 days of
  discharge or termination. Notifying on May 18 is 17 days after May 1, which exceeds the 15‑day
  limit, so the action is not compliant. The broker’s notification is irrelevant to the
  salesperson’s duty, and returning the license is not required by this subsection.
