stem: A real estate salesperson performs a licensed brokerage act and accepts a commission directly
  from the buyer instead of through her employing broker. Which prohibited act under D.C. Code §
  47-2853.197 has she committed?
options:
  - Accepting a fee from someone other than her broker
  - Advertising property without the owner's written consent
  - Commingling escrow funds with her personal funds
  - Failing to put a dual representation disclosure in writing
key: A
explanation: The prohibited-acts statute bars a salesperson from accepting compensation for licensed
  acts from anyone except the broker under whom she was licensed when the fee was earned.
citation:
  source: D.C. Code § 47-2853.197(6)
  url: null
  quoted_text: Accepted a fee, commission, or other valuable consideration as a real estate
    salesperson for the performance of any of the acts specified in this subchapter from any person,
