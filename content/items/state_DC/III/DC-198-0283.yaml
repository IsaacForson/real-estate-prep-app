stem: A tenant organization requests an appraisal and delivers the request to the Mayor and owner on
  May 1. The tenant organization and owner fail to agree on an appraiser within the next 14 days. On
  May 16, the tenant organization delivers a written request to the Mayor to select an appraiser.
  Under D.C. Code § 42-3404.02, by what date must the Mayor select an appraiser?
options:
  - May 25.
  - May 24.
  - May 23.
  - May 22.
key: C
explanation: The Mayor must select an appraiser within 7 days of receiving the request. The request
  was received on May 16, so the selection must be made by May 23. The distractor “May 22” is one
  day too early, while “May 24” is one day late.
