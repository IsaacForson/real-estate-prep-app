stem: Under D.C. Code § 47-2853.186(a), when a real estate broker’s license has been suspended or
  revoked, what must employed real estate salespersons do with their licenses?
options:
  - The salesperson must notify the Mayor in writing within 15 days of the revocation or suspension.
  - The salesperson must return their licenses to the employing broker within 15 days of the
    revocation or suspension.
  - The salesperson must mail their licenses to the Mayor within 15 days of the revocation or
    suspension.
  - The salesperson must continue to perform licensed acts until a new broker license is issued.
key: C
explanation: The statute explicitly requires salespersons to mail their licenses to the Mayor within
  15 days of a broker’s suspension or revocation. Simply notifying the Mayor or returning the
  license to the broker does not satisfy this requirement.
