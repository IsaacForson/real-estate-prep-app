stem: An owner of a building with 6 units receives a valid offer and the tenants deliver their
  registration application on January 1. The owner fails to provide required information for 7 days
  as required by the subchapter. According to D.C. Code § 42-3404.11(2), what is the minimum number
  of days the owner must afford the tenant organization to negotiate a contract of sale?
options:
  - 120 days
  - 127 days
  - 113 days
  - 135 days
key: B
explanation: The base negotiation period is 120 days, and each day of owner delay adds one day; a
  7‑day delay yields 120 + 7 = 127 days. The distractor 120 days ignores the delay‑extension
  provision.
citation:
  source: "### D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental
    Housing Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.11"
  url: null
  quoted_text: The owner shall afford the tenant organization a reasonable period to negotiate a
    contract of sale, and shall not require less than 120 days from the date of receipt of the
    statement of registration. For every day of delay in providing information by the owner as
    required by this subchapter, the negotiation period is extended by 1 day.
  secondary: []
math:
  worked_solution: |-
    120 days (base negotiation period)
    + 7 days (owner delay)
    = 127 days
  formulas:
    - total days = base period + delay days
