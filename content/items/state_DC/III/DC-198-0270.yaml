stem: After closing, a buyer learns that the property was once the site of a suicide. The buyer sues
  the seller for non-disclosure. Under D.C. Code § 47-2853.198(3), is the buyer likely to succeed?
options:
  - No, because the buyer waived disclosure rights
  - No, because the fact is not material
  - Yes, because suicide is a material fact
  - Yes, because the seller violated disclosure duty
key: B
explanation: The statute lists a suicide as an example of information that is not a material fact
  and cannot be the basis for a cause of action, so the buyer is unlikely to succeed. The option
  claiming suicide is a material fact contradicts the statute.
