stem: Under D.C. Code § 47-2853.171, a real estate salesperson must be employed by whom in order to
  perform licensed activities such as listing or selling property?
options:
  - A licensed title insurance agent
  - A licensed real estate broker
  - A licensed real estate appraiser
  - A licensed property manager
key: B
explanation: The scope-of-practice statute defines a real estate salesperson as a person employed by
  a licensed real estate broker to perform the listed brokerage activities.
citation:
  source: D.C. Code § 47-2853.171
  url: null
  quoted_text: the term “real estate salesperson” means any person employed by a licensed real estate
    broker to manage or lease; rent or offer to lease or rent; list for sale, sell, or offer for
    sale; buy or offer to buy; negotiate the purchase or sale, or exchange of real estate; or to
    negotiate a loan on real estate.
