stem: A licensee wants to represent both the buyer and the seller in the same transaction. Under
  D.C. Code § 47-2853.196, what must the licensee obtain before acting as a dual representative?
options:
  - Approval from the Real Estate Guaranty and Education Fund
  - The written consent of every client to the transaction
  - A waiver filed with the Board after the closing
  - Verbal approval from the supervising broker
key: B
explanation: The dual-representation provision permits a licensee to represent more than one client
  in a transaction when every client to that transaction has given written consent.
citation:
  source: D.C. Code §§ 42-1701–42-1709 § 47-2853.196
  url: null
