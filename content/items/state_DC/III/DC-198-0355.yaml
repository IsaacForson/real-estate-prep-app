stem: Before a lease begins for a rental unit in a housing accommodation that is not subject to the
  tenant opportunity to purchase based on subsection (b)(20) of D.C. Code § 42-3404.02, the owner
  provides oral notice to the prospective tenant regarding the exemption. Is the notice compliant
  with the requirement under subsection (d)(1)?
options:
  - The notice is compliant because oral notice satisfies the requirement
  - The notice is non‑compliant because the notice must be written
  - The notice is compliant because the owner also gave a copy of the lease
  - The notice is non‑compliant because notice is not required for exempt units
key: B
explanation: The statute explicitly requires written notice; oral notice does not satisfy this
  requirement. The distractor suggesting oral notice is sufficient ignores the written‑notice
  mandate.
