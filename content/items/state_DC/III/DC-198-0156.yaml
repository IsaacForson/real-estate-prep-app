stem: An appraisal of a housing accommodation costs $1,500. Under D.C. Code § 42-3404.02, how much
  of the cost must the tenant organization pay?
options:
  - $500
  - $750
  - $1000
  - $1500
key: A
explanation: The tenant organization is responsible for one-third of the appraisal cost, while the
  owner pays two-thirds. One-third of $1,500 is $500. The distractor of $750 incorrectly assumes the
  tenant must pay half of the cost.
citation:
  source: "D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental Housing
    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.02(a-1)(D)"
  url: null
  quoted_text: The tenant organization and owner of the housing accommodation shall pay one-third and
    two-thirds of the cost of the appraisal, respectively.
