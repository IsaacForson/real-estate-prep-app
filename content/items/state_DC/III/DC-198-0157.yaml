stem: According to D.C. Code § 42-3404.03(a)(2), what must the offer of sale include regarding the
  tenant's right to purchase and technical assistance?
options:
  - A statement that the tenant has the right to purchase the accommodation under this subchapter
    and that the owner must provide a copy of any third-party sale contract within 7 days of a
    request;
  - A statement that the tenant has the right to purchase the accommodation under this subchapter
    and a notice that the tenants are entitled to no-cost technical assistance and training on their
    rights provided by a tenant support provider approved by the Mayor;
  - A statement that the tenant has the right to purchase the accommodation under this subchapter
    and that the owner will provide a floor plan of the building within 7 days of a request;
  - A statement that the tenant has the right to purchase the accommodation under this subchapter
    and that the tenant must pay for any technical assistance and training on their rights;
key: B
explanation: The correct answer mirrors the language of § 42-3404.03(a)(2), which mandates a
  statement of the tenant's right to purchase and notice of no-cost technical assistance. The
  statement that the tenant must pay for any technical assistance and training on their rights
  contradicts the "no-cost" requirement.
