stem: A licensee is representing a landlord in a lease of a single‑family residential unit for one
  month. The licensee also has a brokerage relationship with the prospective tenant. Under D.C. Code
  § 47-2853.196(d), what is the licensee’s disclosure obligation regarding this dual relationship?
options:
  - Disclosure required after lease signing
  - Disclosure not required because lease term under 2 months
  - Disclosure required before lease signing
  - Disclosure required only if tenant requests
key: B
explanation: Section 47-2853.196(d) exempts the disclosure requirement for lessors or lessees in
  single or multifamily residential units when the lease term is less than two months. Since the
  scenario involves a one‑month lease, no disclosure is required. The other options either impose a
  disclosure duty or add conditions not present in the law.
