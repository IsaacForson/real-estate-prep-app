stem: Under D.C. Code § 42-3404.02, if the owner withdraws the offer of sale after receiving the
  appraisal, what must the owner do regarding the tenant organization's share of the appraisal cost?
options:
  - The owner must reimburse the tenant organization for its entire share of the cost of the
    appraisal within 14 days
  - The owner must reimburse the tenant organization for half of the cost of the appraisal within 14
    days
  - The owner must reimburse the tenant organization for its entire share of the cost of the
    appraisal within 7 days
  - The owner must reimburse the tenant organization for its entire share of the cost of the
    appraisal only if the appraisal is challenged in court
key: A
explanation: The statute requires the owner to reimburse the tenant organization for its entire
  share of the appraisal cost within 14 days of delivery upon electing to withdraw the offer. The
  7‑day option is incorrect because it changes the timeframe that the law explicitly sets at 14
  days.
citation:
  source: "D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental Housing
    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.02"
  url: null
  quoted_text: Upon the election to withdraw the offer of sale, the owner shall reimburse the tenant
    organization for its entire share of the cost of the appraisal within 14 days of delivery
    pursuant to sub-subparagraph (i) of this subparagraph.
