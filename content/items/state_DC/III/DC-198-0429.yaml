stem: An owner delivered written notice to a tenant on January 1, 2022, informing the tenant of a
  received offer to purchase. The owner receives another written offer to purchase the property on
  February 1, 2024. Under D.C. Code § 42-3404.09(b)(2), is the owner required to provide notice to
  the tenant of the new offer?
options:
  - The owner is required to provide notice for every offer regardless of timing.
  - The owner is not required to provide notice because single-family accommodations are exempt from
    notice requirements.
  - The owner is required to provide notice because more than one year has passed since the previous
    notice.
  - The owner is not required to provide notice because less than one year has passed since the
    previous notice.
key: C
explanation: The exemption from providing subsequent notice lasts only one year after the initial
  notice. Since more than one year passed between the January 1, 2022 notice and the February 1,
  2024 offer, the owner must give notice again. The distractor claiming less than one year has
  passed misstates the elapsed time.
citation:
