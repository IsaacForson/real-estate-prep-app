stem: Under D.C. Code § 42-3404.02(a), what must an owner do before selling a housing accommodation
  or issuing a notice to vacate for demolition or discontinuance of housing use?
options:
  - The owner must give the tenant an opportunity to purchase the housing accommodation at a price
    and terms that represent a bona fide offer of sale
  - The owner must obtain a certified appraisal of the housing accommodation's value before making
    any offer of sale
  - The owner must notify the tenant organization within 45 days of receiving an offer to purchase
    the housing accommodation
  - The owner must provide written notice to the Mayor before selling the housing accommodation or
    issuing a notice to vacate
key: A
explanation: The statute requires the owner to give the tenant an opportunity to purchase the
  housing accommodation at a price and terms that represent a bona fide offer of sale before a sale
  or notice to vacate for demolition/discontinuance. The other options describe actions not mandated
  by subsection (a).
citation:
  source: "D.C. Code §§ 42-3404.01–42-3404.16 — D.C. Code Title 42, Ch. 34, Subch. IV - Rental Housing
    Conversion and Sale: Tenant Opportunity to Purchase (TOPA) — § 42-3404.02(a)"
  url: null
  quoted_text: Before an owner of a housing accommodation may sell the housing accommodation or issue
    a notice to vacate for purposes of demolition or discontinuance of housing use, the owner shall
    give the tenant an opportunity to purchase the housing accommodation at a price and terms that
    represent a bona fide offer of sale.
