stem: Under D.C. Code § 42-3404.02, within how many days must a tenant organization request an
  appraisal after receiving an alleged bona fide offer of sale?
options:
  - The tenant organization must request an appraisal within 45 days
  - The tenant organization must request an appraisal within 30 days
  - The tenant organization must request an appraisal within 60 days
  - The tenant organization must request an appraisal within 15 days
key: A
explanation: The statute requires the tenant organization to request an appraisal within 45 days of
  receiving the alleged bona fide offer of sale. The 30‑day option is a common mistake; it applies
  the wrong period and is not supported by the text.
