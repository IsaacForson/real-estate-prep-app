stem: Under D.C. Code § 42-1704(a)(1), monies entrusted in a real estate transaction must be
  deposited within how many days?
options:
  - Within 5 days
  - Within 10 days
  - Within 7 days
  - Within 3 days
key: C
explanation: The rule requires that escrow monies be deposited within 7 days in an insured District
  financial institution. The distractor “Within 5 days” is incorrect because the statute specifies a
  7‑day period, not five.
