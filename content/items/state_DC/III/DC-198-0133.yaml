stem: Under D.C. Code § 42-3404.02(d)(2), an owner of a housing accommodation that becomes subject
  to subsection (b)(20) on December 31, 2025 must provide written notice to all tenants regarding
  the change in applicability of law within what timeframe?
options:
  - Within 90 days after December 31, 2025
  - Within 60 days after December 31, 2025
  - Within 30 days after December 31, 2025
  - Within 120 days after December 31, 2025
key: A
explanation: Subsection (d)(2) requires the owner to provide written notice within 90 days after the
  date the housing accommodation becomes subject to subsection (b)(20). Therefore, the correct
  timeframe is 90 days after December 31, 2025. A distractor of 60 days is incorrect because the
  statute specifies 90 days, not 60.
