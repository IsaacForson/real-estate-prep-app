stem: An applicant submits a petition to the Board requesting a determination of disqualification
  under D.C. Code § 47-2853.12(n)(1). According to D.C. Code § 47-2853.12(n)(2), by when must the
  Board render its decision on the petition?
options:
  - Within 120 days of receiving the petition.
  - Within 90 days of receiving the petition.
  - Within 60 days of receiving the petition.
  - Within 30 days of receiving the petition.
key: B
explanation: Subsection (n)(2) requires the Board to render its decision on a person's petition
  within 90 days after receipt of the petition. Therefore, the correct deadline is 90 days. The
  60‑day option is incorrect because the statute specifies a 90‑day period, not 60 days.
