stem: A property owner who also manages their own rental units shows prospective tenants the units
  and collects rent as part of regular management. According to 17 DCMR ch. 26 § 2624.3(b), does
  this person need a real estate broker or property manager license?
options:
  - Needing a real estate broker license
  - Needing a property manager license
  - Being exempt from licensing requirements
  - Needing to obtain a property manager license
key: C
explanation: The key is correct because 2624.3(b) exempts an owner or lessor who performs acts in
  the regular course of managing their own property. The most tempting distractor, 'Needing a
  property manager license,' incorrectly assumes that self‑management requires licensure.
citation:
  source: 17 DCMR ch. 26, §§ 2600–2699 — DCMR Title 17, Chapter 26 - Real Estate Licenses (Board of
    Real Estate rules) 2624.3(b)
  url: null
  quoted_text: Any person who, as an owner or lessor of real estate, performs any of the acts
    specified in this subsection, where the acts are performed in the regular course of, or incident
    to, the management of real estate, business and the investments therein owned by that person;
