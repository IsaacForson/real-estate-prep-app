stem: A licensee prepares a newspaper advertisement for a property listing that includes the firm's
  name but does not display the firm's licensed name clearly and legibly. According to DCMR Title
  17, Chapter 26, who must ensure that the firm's licensed name is displayed clearly and legibly in
  all advertising?
options:
  - The responsible licensee or agent
  - The principal or supervising broker
  - The client or customer representative
  - The advertising medium or platform
key: B
explanation: The rule requires all advertising to be under the direct supervision of the principal
  broker or supervising broker and to display the firm's licensed name clearly and legibly. Hence,
  the principal or supervising broker is accountable for compliance. The licensee prepares the ad
  but does not have the supervisory duty.
