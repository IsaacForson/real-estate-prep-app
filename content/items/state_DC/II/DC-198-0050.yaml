  url: null
  quoted_text: Is at least 18 years of age, or at least 17 years of age if applying for license as a
    barber under § 47-2853.72 or as a cosmetologist, a cosmetologist-manager, a cosmetologist-owner,
    or any subcategory of specialty cosmetologist under § 47-2853.82;
