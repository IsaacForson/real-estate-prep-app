stem: For an applicant seeking a real estate salesperson license in the District of Columbia, what
  is the minimum age requirement according to D.C. Code § 47-2853.12(a)(2)?
options:
  - At least 21 years of age
  - At least 16 years of age
  - At least 18 years of age
  - At least 17 years of age
key: C
explanation: The statute states that an applicant must be at least 18 years of age, unless applying
  for certain barber or cosmetologist licenses which allow 17 years of age. Since the applicant is
  seeking a real estate salesperson license, the 18‑year threshold applies. The option stating 17
  years of age is incorrect because that exception does not cover real estate licensure.
citation:
  source: "### D.C. Code §§ 47-2853.01–47-2853.30 — D.C. Code Title 47, Ch. 28, Subch. I-B, Part A -
