stem: A real estate salesperson’s license expired on June 30, 2017. The salesperson did not apply
  for reinstatement within the allowed period. According to 17 DCMR § 2622.6, what must the
  salesperson do to obtain a license?
options:
  - Pay the late fee and submit renewal application
  - Submit reinstatement application showing CE completion
  - Request a waiver from the Board after denial
  - Complete the initial licensing requirements
key: D
explanation: After five years have passed since expiration, the Board may not reinstate the license;
  the individual must instead meet the requirements for initial licensure. Thus, completing the
  initial licensing requirements is the correct path. A distractor suggesting submission of a
  reinstatement application with continuing education proof is incorrect because the five‑year bar
  prevents reinstatement regardless of continuing education.
