stem: A licensee creates an online web page for a property listing but fails to include an online
  disclosure or a link to an online disclosure. According to DCMR Title 17, Chapter 26, what is the
  consequence?
options:
  - The licensee must obtain broker approval before publishing the page
  - The online advertising violates the requirement for online disclosure
  - The advertisement is allowed if disclosure was given in another format earlier
  - The licensee must pay a fine but may continue advertising
key: B
explanation: Under 17 DCMR ch. 26, § 2615.6(a), a licensee who owns or controls a web page must
  include an online disclosure or a link to one; failing to do so violates that requirement.
