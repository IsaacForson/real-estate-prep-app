  url: null
  quoted_text: If the Commission determines that an applicant cheated on an examination, in addition
    to any other consequences, the applicant shall not be eligible to take another examination for a
    period of one (1) year from the date of the decision of the Commission, or other period
    established by the Commission in its order.
