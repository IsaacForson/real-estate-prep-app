stem: An applicant is found to have cheated on the real estate salesperson examination. What is the
  consequence regarding future exam eligibility under DCMR Title 17, Chapter 26?
options:
  - The applicant shall pay a civil fine of five hundred dollars
  - The applicant shall not be eligible to take another examination for one year
  - The applicant shall be allowed to appeal and retake after thirty days
  - The applicant shall retake the examination after six months
key: B
explanation: The rule provides that an applicant found to have cheated shall be ineligible to take
  another exam for one year from the Commission’s decision. The distractor suggesting a six‑month
  wait is incorrect because the rule specifies a one‑year period unless the Commission orders
  otherwise.
citation:
