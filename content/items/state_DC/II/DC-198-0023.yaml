stem: An applicant passes the property manager examination on March 10. By what date must the
  applicant submit the license application to the Board to avoid having to retake the examination,
  according to DCMR Title 17, Chapter 26?
options:
  - Submit the application by December 10, six months after passing the exam
  - Submit the application by June 10, six months after passing the exam
  - Submit the application by September 10, six months after passing the exam
  - Submit the application by March 10 of the following year, six months after passing the exam
key: C
explanation: The correct answer is A because 2603.2 requires the application to be submitted within
  six months of passing the examination; March 10 plus six months is September 10. The distractor
  "Submit the application by June 10, six months after passing the exam" is wrong because June 10 is
  only three months after the exam, not six months as required.
citation:
  source: 17 DCMR ch. 26, §§ 2600–2699 — DCMR Title 17, Chapter 26 - Real Estate Licenses (Board of
