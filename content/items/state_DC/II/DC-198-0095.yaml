stem: An applicant for a property manager license submits the application but forgets to have it
  sworn to before a notary public. What must the applicant do to complete the application
  requirement under DCMR Title 17, Chapter 26?
options:
  - Having the application notarized before submission
  - Submitting a new application on the prescribed form
  - Paying the required application fee with the submission
  - Providing evidence of having passed the examination
key: A
explanation: Section 2603.1(d) requires the application to be sworn to or affirmed before a notary
  public; therefore the applicant must have the application notarized. Submitting a new application
  is unnecessary because the original only needs notarization.
