stem: During a real estate licensing examination, a proctor suspects an applicant of cheating. What
  is the first action the proctor must take according to DCMR Title 17, Chapter 26?
options:
  - Confiscating any materials suspected of being used to cheat
  - Permitting the applicant to complete the examination
  - Notifying the testing service and the Commission
  - Seating the applicant separately for the rest of the exam
key: D
explanation: According to 2604.3(a), if necessary the proctor must seat the applicant in a
  segregated location for the remainder of the examination before taking any other steps.
  Confiscating materials occurs after seating the applicant, not first.
