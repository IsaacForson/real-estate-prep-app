stem: According to D.C. Code § 47-2853.12(l), what is the standard duration of a real estate license
  before it must be renewed?
options:
  - The license expires three years after issuance and must be renewed every three years.
  - The license expires two years after issuance or renewal unless renewed earlier.
  - The license expires five years after issuance and must be renewed every five years.
  - The license expires one year after issuance and must be renewed each year.
key: B
explanation: Subsection (l) states that a license, certificate, or registration expires two years
  from the date of its first issuance or renewal unless renewed in accordance with procedures
  established in this section. Therefore, the standard term is two years. The one‑year option is
  incorrect because the statute specifies a two‑year period, not one year.
