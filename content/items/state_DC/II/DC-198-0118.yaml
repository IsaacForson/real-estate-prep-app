stem: A property manager license holder has not completed the required continuing education before
  the license expiration date. According to DCMR Title 17, Chapter 26, what must the holder do
  before the Board will consider a renewal application?
options:
  - Complete the continuing education requirements
  - Submit the renewal application with a late fee
  - Provide a notarized affidavit of exemption
  - Wait six months after expiration to reapply
key: A
explanation: The Board shall deny a renewal application if the applicant has not completed the
  continuing education prior to expiration; therefore the holder must finish the required education
  before the Board can accept a renewal. Submitting with a late fee does not overcome the continuing
  education deficiency.
