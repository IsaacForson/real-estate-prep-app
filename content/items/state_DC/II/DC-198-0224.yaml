stem: What is the minimum period of licensed and active experience required for an applicant to
  qualify for a real estate broker license in the District of Columbia?
options:
  - Three years of licensed experience.
  - Two years of licensed and active experience.
  - Four years of licensed and active experience.
  - One year of licensed experience.
key: B
explanation: The statute requires that an applicant for a broker license has been licensed and
  actively engaged in business as a real estate broker or salesperson for the two years immediately
  preceding the application. This establishes the two‑year experience threshold. The option stating
  one year is insufficient because the rule explicitly demands two years.
