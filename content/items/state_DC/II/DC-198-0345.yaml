stem: A property manager’s license expired on April 15, 2023. The licensee did not submit a renewal
  application until October 10, 2023. According to DCMR Title 17, Chapter 26, what must the licensee
  do to regain an active license?
options:
  - The licensee must provide proof of completed continuing education to the Board
  - The licensee must submit a renewal application accompanied by the late fee
  - The licensee must apply for reinstatement and pay the reinstatement fee
  - The licensee must retake the licensing examination and pay associated fees
key: C
explanation: Because renewal was attempted more than sixty days after expiration, the license lapsed
  and reinstatement with the required fee is necessary. The distractor about a late‑fee renewal only
  applies within the sixty‑day window.
citation:
  source: "### 17 DCMR ch. 26, §§ 2600–2699 — DCMR Title 17, Chapter 26 - Real Estate Licenses (Board
    of Real Estate rules) § 2621.6"
  url: null
  quoted_text: If a holder of a license fails to renew the license within sixty (60) days after its
    expiration, the license shall be deemed to have lapsed on the date of expiration and the holder
    shall be required to apply for reinstatement of the expired license and pay the required
    reinstatement fee.
