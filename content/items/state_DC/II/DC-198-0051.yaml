stem: A real estate brokerage corporation seeks a license. Its treasurer, who is not a licensed real
  estate broker, only prepares financial statements and does not engage in any activity defined as
  real estate brokerage under the subchapter. According to D.C. Code § 47-2853.183, which statement
  is correct regarding the corporation’s eligibility for a broker’s license?
options:
  - The corporation is eligible if the treasurer’s duties are not considered activities defined in
    this subsection
  - The corporation is ineligible because the treasurer must hold a real estate broker license
  - The corporation is eligible only if the treasurer obtains a broker license within 30 days
  - The corporation is ineligible because any officer must be licensed regardless of duties
key: A
explanation: The law requires that every member, partner, trustee, or officer who is engaged in
  activities defined in the subsection must be licensed. Since the treasurer’s duties are not
  considered such activities, the licensing requirement does not apply to that position. Therefore,
  the corporation may be eligible provided the other conditions are satisfied. The claim that the
  treasurer must be licensed misreads the statute because it applies only to those engaged in the
  defined activities.
citation:
