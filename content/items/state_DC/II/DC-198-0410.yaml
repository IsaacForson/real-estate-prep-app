stem: A real estate broker provides day-to-day supervision to an affiliated salesperson. According
  to DCMR Title 17, Chapter 26, what effect does this supervision have on the legal relationship
  between the broker and the salesperson?
options:
  - It creates an employer-employee relationship
  - It does not create an employer-employee relationship
  - It alters the independent contractor status
  - It requires a written employment contract
key: B
explanation: The rule provides that reasonable and adequate supervision may not be construed as
  creating an employer-employee relationship or altering the independent contractor status.
  Therefore, supervision does not create an employer-employee relationship. The option stating it
  creates such a relationship contradicts the rule.
citation:
  source: 17 DCMR ch. 26, § 2614.5
  url: null
  quoted_text: The exercise of reasonable and adequate supervision may not be construed as or deemed
    to create the existence of an employer-employee relationship between the supervisor and the
    licensed real estate organization and the associate real estate broker or real estate
    salesperson or to alter the status of an independent contractor.
