stem: A school that qualifies as an exempt institution under section 10 of the Educational Licensure
  Commission Act of 1976 seeks to offer pre-license education programs. What must the school do to
  obtain Commission approval under DCMR Title 17, Chapter 26?
options:
  - Accreditation from the Educational Licensure Commission
  - Certification from the Commission for the school
  - Proof of ARELLO distance learning certification for the school
  - A notarized application submitted by the school
key: B
explanation: The key is correct because 2606.5 states that a school qualifying as an exempt
  institution may be certified by the Commission. The most tempting distractor, 'Accreditation from
  the Educational Licensure Commission,' is wrong because exempt institutions need Commission
  certification, not accreditation.
citation:
  source: 17 DCMR ch. 26, §§ 2600–2699 — DCMR Title 17, Chapter 26 - Real Estate Licenses (Board of
    Real Estate rules) § 2606.5
  url: null
  quoted_text: Schools or organizations offering pre-license education programs or courses to persons
    intending to apply for a license under this chapter may be certified by the Commission if the
    school or organization qualifies as an exempt institution pursuant to section 10 of the
    Educational Licensure Commission Act of 1976, effective April 6, 1977 (D.C. Law 1-104; D.C.
    Official Code § 38-1310 et seq.), as amended.
