stem: An individual employed by a licensed real estate broker to handle only telephone calls and
  filing paperwork, without engaging in any licensed activity, is exempt from licensing under which
  provision of 17 DCMR ch. 26?
options:
  - Section 2624.3(g)
  - Section 2624.3(f)
  - Section 2624.3(h)
  - Section 2624.3(e)
key: D
explanation: The exemption applies to anyone employed by a licensed broker or property manager in a
  solely stenographic or clerical capacity who does not perform any licensed activity. This matches
  the description in § 2624.3(e). The distractor Section 2624.3(f) concerns government employees
  performing official duties, which does not describe a private broker's clerical worker.
