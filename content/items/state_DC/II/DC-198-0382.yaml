stem: Under D.C. Code § 47-2853.12(k), what is the consequence for a person who continues to
  practice real estate after failing to renew their license?
options:
  - They are considered unqualified and subject to penalties
  - They must pay a fine but may continue practicing without renewal
  - They are automatically issued a temporary permit for a limited period
  - He must retake the licensing exam and pay fees before reapplying
key: A
explanation: Under D.C. Code § 47-2853.12(k), a person who fails to renew and continues to practice
  is considered unqualified and subject to penalties. The option stating that the person must pay a
  fine but may continue practicing without renewal is incorrect because the statute does not permit
  continued practice after a fine; continued practice remains subject to penalties. The option
  claiming an automatic temporary permit is incorrect because the statute provides no such permit
  for those who fail to renew. The option stating that the person must retake the licensing exam and
  pay fees before reapplying is incorrect because the statute does not impose an exam retake
  requirement; it only deems the person unqualified and subject to penalties.
citation:
  source: D.C. Code § 47-2853.12
  url: null
  quoted_text: (k) A person who fails to renew a license or certification required by this subchapter,
    or fails to re-register, shall be considered to be unqualified to practice the occupation or
    profession and subject to the penalties set forth in this subchapter and other applicable laws
    of the District if he or she continues to practice the profession or occupation.
