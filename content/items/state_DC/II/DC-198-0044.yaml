stem: A real estate salesperson plans to attend a continuing education workshop offered by a local
  real estate association. For the workshop to count toward license renewal under DCMR Title 17,
  Chapter 26, which condition must be met?
options:
  - The workshop must be instructed by an individual approved by the Commission
  - The workshop must be held at a licensed real estate office
  - The workshop must last at least four hours and include a quiz
  - The workshop must be advertised in the D.C. Register and on the association's website
key: A
explanation: The rule states that a continuing education program must be instructed by an individual
  approved by the Commission to qualify for credit. The distractor about a four‑hour minimum is
  incorrect because the rule does not set a duration requirement for approval.
