stem: A real estate salesperson’s license expired two years ago. The salesperson wishes to have the
  license reinstated. According to 17 DCMR § 2622.7, what must the salesperson submit with the
  reinstatement application?
options:
  - Proof of completing all continuing education credits required under § 2605.7.
  - A letter of recommendation from the sponsoring broker confirming compliance.
  - A copy of the original license certificate issued by the Board and any required fees.
  - A notarized affidavit stating the applicant has no criminal record and any fees.
key: A
explanation: The rule requires an applicant for reinstatement to submit proof of having completed
  all continuing education credits required under § 2605.7. Therefore, the salesperson must provide
  that proof. The distractor of a letter of recommendation is incorrect because, while helpful, it
  does not satisfy the statutory proof requirement.
