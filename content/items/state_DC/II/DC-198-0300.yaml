stem: According to D.C. Code § 47-2853.161, a real estate broker who is also the owner of a
  subdivision may sell or offer to sell lots in that subdivision only if the subdivision comprises
  at **LEAST** how many lots?
options:
  - 6 lots
  - 3 lots
  - 5 lots
  - 4 lots
key: C
explanation: The statute explicitly states that a broker acting as owner may sell lots in a
  subdivision comprising 5 lots or more. Therefore, the threshold is 5 lots. The distractor of 4
  lots is incorrect because the requirement is for 5 lots or more.
