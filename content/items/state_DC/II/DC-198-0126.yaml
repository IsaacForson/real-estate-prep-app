stem: According to DCMR Title 17, Chapter 26, who has authority to sign all official documents
  issued on behalf of the Board of Real Estate?
options:
  - The Chairperson, after approval by the Board
  - The Board's Secretary, appointed by the Chairperson
  - The Department of Consumer and Regulatory Affairs
  - The Board member present at a meeting
key: A
explanation: The rule states that the Chairperson shall be elected from among the Board members and
  shall have authority to sign all official documents issued on behalf of the Board, after approval
  by the Board. Therefore, only the Chairperson, subject to Board approval, may sign such documents.
  The Board's Secretary does not have this signing authority under the cited rule.
