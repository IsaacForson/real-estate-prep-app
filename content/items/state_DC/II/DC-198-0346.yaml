stem: The Board of Real Estate decides to change the license renewal cycle from biennial to annual
  for administrative convenience. According to DCMR Title 17, Chapter 26, what is the maximum length
  of time a license already in effect may be extended to allow an orderly transition?
options:
  - Up to three years
  - Up to one year
  - Up to two years
  - Up to twelve years
key: A
explanation: Section 2620.4 permits an existing license to be extended up to three years when the
  Board changes the licensing cycle. The distractor of one year underestimates the allowable
  extension.
citation:
  source: "### 17 DCMR ch. 26, §§ 2600–2699 — DCMR Title 17, Chapter 26 - Real Estate Licenses (Board
    of Real Estate rules) § 2620.4"
  url: null
  quoted_text: If the Board changes the license cycle under § 2620.3 of this section, the term of a
    license that is in effect on the date of the Board's determination to change the system may be
    extended up to three (3) years in order to permit an orderly transition.
