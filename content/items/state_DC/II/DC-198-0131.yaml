stem: A person who, for a fee, provides information about available rental units to another person
  is exempt from licensing under which provision of 17 DCMR Chapter 26?
options:
  - Section 2624.3(c)
  - Section 2624.3(g)
  - Section 2624.3(a)
  - Section 2624.3(b)
key: B
explanation: The exemption in § 2624.3(g) expressly covers anyone who, for a fee, commission, or
  other valuable consideration, identifies rental units or provides information about them. The
  other sections describe different exemptions such as court‑appointed fiduciaries or owner‑lessor
  activities.
