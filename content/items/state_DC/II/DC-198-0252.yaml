stem: A property manager employed by an owner of a four‑unit apartment building receives a separate
  commission to negotiate a mortgage loan on the building for the owner. According to D.C. Code §
  47-2853.141, is this activity permissible for the property manager?
options:
  - The property manager may negotiate a loan on the property only if the owner provides written
    consent.
  - The property manager may not negotiate a loan on the property for a fee, as this is prohibited.
  - The property manager may negotiate a loan on the property because they are paid a commission for
    the service.
  - The property manager may negotiate a loan on the property if they also hold a broker license.
key: B
explanation: The statute expressly prohibits a property manager from negotiating a loan on real
  estate for a fee, commission, or other valuable consideration. Receiving a commission does not
  override this prohibition, so the statement that the manager may negotiate a loan for a fee is
  incorrect.
citation:
  source: D.C. Code §§ 47-2853.141 to 47-2853.199 — D.C. Code Title 47, Ch. 28, Subch. I-B, Parts K-P
    - Property Managers, Real Estate Brokers, Salespersons; Special Rules; Duties — § 47-2853.141
  url: null
  quoted_text: The property manager shall not perform any activities that relate to listing for sale,
    offering for sale, buying or offering to buy, negotiating the purchase, sale, or exchange of
    real estate, or negotiating a loan on real estate for a fee, commission, or other valuable
    consideration.
