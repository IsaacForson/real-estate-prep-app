stem: According to D.C. Code § 47-2853.12(i)(1), how often must a Board offer the licensing
  examination to applicants who require passage of an examination for licensure?
options:
  - At least once a year.
  - At least twice a year.
  - At least three times a year.
  - At least four times a year.
key: B
explanation: Subsection (i)(1) mandates that each board requiring an examination for licensure shall
  give applicants the opportunity to take such examination at least twice a year. Hence, the minimum
  frequency is twice per year. The once‑a‑year option is incorrect because the rule sets a minimum
  of two offerings annually.
