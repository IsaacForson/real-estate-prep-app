stem: According to DCMR Title 17, Chapter 26, what information must an applicant for a property
  manager license include on the application?
options:
  - The applicant must submit the applicant's employer's tax identification number.
  - The applicant must include the applicant's business and home addresses, which cannot be a post
    office box.
  - The applicant must provide the applicant's social security number and date of birth.
  - The applicant must list the applicant's preferred email address and phone number.
key: B
explanation: The rule requires applicants to include business and home addresses that are not a post
  office box. The distractor about social security number is incorrect because the rule does not
  mandate that information.
