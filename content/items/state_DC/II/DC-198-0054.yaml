stem: A licensed real estate broker in Washington, D.C. wishes to change his or her status to that
  of an associate real estate broker. What must the broker do to effect this change under D.C. Code
  § 47-2853.182(c)?
options:
  - Submit a written request to the Mayor and pay the requisite fees
  - Notify the Board of Real Estate by certified mail
  - Pass an additional examination on District real estate law
  - Obtain approval from the corporation’s principal broker
key: B
explanation: The statute explicitly states that any broker who wishes to change his or her status to
  that of an associate real estate broker shall notify the Board of Real Estate by certified mail.
  No written request to the Mayor, examination, or corporate approval is required by this provision.
  Therefore, notifying the Board by certified mail is the correct action.
