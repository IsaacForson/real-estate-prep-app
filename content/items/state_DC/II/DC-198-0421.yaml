stem: According to DCMR Title 17, Chapter 26, a licensed real estate broker who wishes to act as a
  property manager is exempt from which requirement?
options:
  - Educational and examination requirements
  - Submission of a notarized application
  - Payment of the application fee
  - Provision of business and home address
key: A
explanation: The key is correct because 2603.3 states that a licensed real estate broker is deemed
  to have satisfied the educational and examination requirements for property manager licensure. The
  most tempting distractor, 'Submission of a notarized application,' is wrong because the broker
  must still satisfy all other requirements, including having the application sworn to before a
  notary public.
citation:
  source: 17 DCMR ch. 26, §§ 2600–2699 — DCMR Title 17, Chapter 26 - Real Estate Licenses (Board of
    Real Estate rules) § 2603.3
  url: null
  quoted_text: A person licensed as a real estate broker pursuant to § 2601 of this chapter shall be
    deemed to have satisfied the educational and examination requirements for licensure as a
    property manager under this chapter
