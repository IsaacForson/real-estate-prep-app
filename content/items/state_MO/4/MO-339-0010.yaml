stem: A broker's license is suspended while several pending contracts still have earnest money held
  in the brokerage's escrow account. Applying 20 CSR 2250-8.155, what must the broker do with those
  escrow funds during the suspension?
options:
  - Maintain escrow funds in trust until properly transferred or disbursed
  - Transfer the funds to the real estate commission for safekeeping
  - Deposit escrow funds into the broker's personal checking account
  - Return the funds directly to the brokerage's individual salespersons for holding
key: A
explanation: When a broker's license is suspended, the broker must maintain escrow or trust accounts
  until the funds are transferred to a title company, lending institution, escrow company, or
  attorney for closing, or are otherwise properly disbursed as agreed to in writing by the
  interested parties.
citation:
  source: 20 CSR 2250-8.155 § (Closing a Real Estate Brokerage Firm)
  url: null
  quoted_text: Maintain all escrow or trust accounts until all monies are transferred to a title
    company, a lending institution, an escrow company, or an attorney for closing the transaction,
    or are otherwise properly disbursed as agreed to in writing by the parties having an interest in
    the funds;
