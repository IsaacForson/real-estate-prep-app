stem: According to 20 CSR 2250-8.040, what may satisfy the licensing requirement for a person to act
  as a sales manager for a broker?
options:
  - A broker-level license, such as broker-salesperson, partner, associate, or officer
  - A notary public commission granted by the secretary of state
  - A continuing education completion card issued by an approved Missouri real estate school
  - A property management certificate issued by a title company
key: A
explanation: The rule requires anyone acting as a sales manager or assistant sales manager for a
  broker to hold a broker-salesperson license or be licensed as a broker-partner, broker-associate,
  or broker-officer of that broker.
citation:
  source: 20 CSR 2250-8.040 § (Sales Manager)
  url: null
  quoted_text: Any licensee who acts in the capacity of a sales manager or assistant sales manager for
    the broker shall be required to hold a broker-salesperson license or to be licensed as a broker-
    partner, broker-associate or broker-officer of the broker.
