stem: A licensee's spouse holds part ownership in a title company, and the licensee refers a buyer
  to that company. Applying 20 CSR 2250-8.110, at what point does the spouse's ownership interest
  turn this into a controlled business arrangement requiring written disclosure?
options:
  - When the ownership interest reaches fifty percent
  - When the referral fee exceeds five hundred dollars
  - When the spouse is also a licensed real estate agent
  - When the ownership interest exceeds one percent
key: D
explanation: A controlled business arrangement exists whenever an associate of a licensee, including
  a spouse, holds a direct or beneficial ownership interest of more than one percent in a settlement
  service provider, which triggers the written disclosure requirement.
citation:
  source: 20 CSR 2250-8.110 § (Licensee's Interest in Transactions; Relationship with Parties)
  url: null
  quoted_text: The term controlled business arrangement means an arrangement in which a real estate
    licensee, or an associate of a real estate licensee, has either an affiliate relationship with
    or a direct or beneficial ownership interest of more than one percent (1%) in a provider of
    settlement services.
