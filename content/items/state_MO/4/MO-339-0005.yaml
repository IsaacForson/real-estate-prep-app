stem: A broker opens a new branch office on March 1. Under 20 CSR 2250-8.030, by what deadline must
  the broker notify the commission in writing?
options:
  - Within thirty days after the branch office's first closing
  - By the broker's next license renewal deadline
  - Before advertising the branch office to the public
  - Within ten days after opening the branch office
key: D
explanation: The rule requires a broker to notify the commission in writing within ten days after
  opening or changing the address or managing licensee of a branch office.
citation:
  source: 20 CSR 2250-8.030 § (Branch Offices)
  url: null
  quoted_text: A broker shall notify the commission, in writing, within ten (10) days after opening or
    making any change in the address or managing licensee of a branch office.
