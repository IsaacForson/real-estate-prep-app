stem: Under 20 CSR 2250-8.010, what must a broker display outside the broker's regular place of business?
options:
  - A framed copy of the broker's exam results
  - A public listing of the broker's commission rates
  - A printed notice of the broker's office hours
  - A sign showing the broker's licensed name
key: D
explanation: The rule requires a business sign of sufficient size bearing the name under which the
  broker or the firm is licensed to be displayed outside the regular place of business.
citation:
  source: 20 CSR 2250-8.010 § (Place of Business)
  url: null
  quoted_text: A broker’s business sign of sufficient size to identify it and bearing the name under
    which the broker or the broker’s firm is licensed, or the regular business name, shall be
    displayed outside of the broker’s regular place of business.
