stem: A broker is not acting as a party to a contract but fills in a standardized purchase agreement
  as a favor for a friend. Under 20 CSR 2250-8.140, what is the broker prohibited from doing in that
  situation?
options:
  - Using a form approved by the broker's trade association counsel
  - Retaining a signed copy of the completed form
  - Making a separate charge for completing the standardized form
  - Filling in the property description on the form
key: C
explanation: The rule bars a broker from making a separate charge for completing standardized forms
  for persons in transactions where the broker is not acting as a party to the contract or as the
  broker.
citation:
  source: 20 CSR 2250-8.140 § (Standard Forms)
  url: null
  quoted_text: A real estate broker shall not make a separate charge for completing any standardized
    forms and shall not prepare those forms for persons in transactions in which s/he is not acting
    as a broker, unless the broker is one of the parties to the contract or instrument or owns or is
    employed by an escrow company or closing firm which is handling the closing.
