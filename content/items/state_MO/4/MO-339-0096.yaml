stem: A licensee contacts another licensee and asks for a referral fee for bringing a buyer, even
  though the licensee did not introduce the business to the other licensee before any relationship
  was established. Under 339.151(2)(1), what is the status of this action?
options:
  - A violation because there was no reasonable cause
  - Allowed if the other licensee agrees verbally
  - Permitted because the licensee introduced the business
  - Permitted if a written agreement exists with the principal
key: A
explanation: The licensee solicited compensation without introducing the business, so there is no
  reasonable cause; 339.151(2)(1) makes such solicitation a violation. The distractor claiming it is
  permitted because the licensee introduced the business is incorrect because the scenario states no
  introduction occurred.
