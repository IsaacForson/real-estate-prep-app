stem: A buyer is about to sign a real estate contract without ever having signed a written
  confirmation of brokerage relationship. Under 20 CSR 2250-8.096, by when must that confirmation be
  completed?
options:
  - In residential transactions specifically identified by the parties
  - On or before the buyer's first contract signature
  - Whenever the buyer separately requests a written copy
  - No later than thirty days after the closing is completed
key: B
explanation: The rule requires brokerage relationships to be confirmed in writing by each party to
  the transaction on or before that party's first signature to the real estate contract.
citation:
  source: 20 CSR 2250-8.096 § (Brokerage Relationship Confirmation)
  url: null
  quoted_text: Licensees acting with or without a written agreement for brokerage services pursuant to
    sections 339.710 to 339.860, RSMo, are required to have such relationships confirmed in writing
    by each party to the real estate transaction on or before such party’s first signature to the
    real estate contract.
