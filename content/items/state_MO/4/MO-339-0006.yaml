stem: A broker's unlicensed receptionist wants to negotiate price terms directly with a prospective
  buyer. Under 20 CSR 2250-8.050, why is this activity prohibited?
options:
  - Clerical employees are limited to duties normally attributed to that position
  - The designated broker is required to speak with prospective buyers directly
  - Negotiating price terms with a buyer requires prior written approval from the commission
  - Clerical employees may act under a special limited power of attorney
key: A
explanation: The rule confines unlicensed clerical or office employees to the duties normally
  attributed to those positions, which excludes performing licensed activities such as negotiating
  transaction terms.
