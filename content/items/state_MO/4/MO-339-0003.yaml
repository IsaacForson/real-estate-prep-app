stem: Under 20 CSR 2250-8.130, what must a broker obtain before accepting a nonnegotiable instrument
  as earnest money?
options:
  - A verbal assurance from the buyer's mortgage lender
  - A signed, written consent from the real estate owner
  - An appraisal report confirming the property's fair value
  - A title insurance binder covering the full transaction
key: B
explanation: The rule bars a broker from accepting a note or other nonnegotiable instrument as
  earnest money without the owner's signed, written consent.
citation:
  source: 20 CSR 2250-8.130 § (Earnest and Escrow Money; Disputes)
  url: null
  quoted_text: A broker shall not accept any note, nonnegotiable instrument or anything of value not
    readily negotiable as earnest money in a transaction without the signed, written consent of the
    owner of the real estate.
