stem: Under Missouri law, what must a person do before acting as a real estate broker or salesperson?
options:
  - Obtaining a license from the Missouri Real Estate Commission
  - Completing a pre‑licensing education program approved by the Commission
  - Submitting an application to the Missouri Real Estate Commission
  - Posting a surety bond with the Missouri Real Estate Commission
key: A
explanation: The statute makes it unlawful to act as a broker or salesperson without first procuring
  a license from the commission. Therefore, obtaining a license is required before one may engage in
  those activities. The other options describe steps that are not mandated by this provision for
  initial authority to act.
