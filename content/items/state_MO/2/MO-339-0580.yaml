stem: Under 339.020 RSMo, what is the legal status of a person who advertises to act as a real
  estate broker without first obtaining a license from the commission?
options:
  - It is permitted to act as a broker without a license
  - It is subject only to a civil penalty for acting without a license
  - It is allowed to act as a broker after providing a disclosure
  - It is unlawful to act as a broker without a license
key: D
explanation: The statute explicitly states that it is unlawful to act as a broker without a license,
  which includes advertising to act as such. Therefore, advertising without a license is an unlawful
  act. The distractor claiming it is permitted without a license contradicts the statute’s clear
  prohibition.
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) — Missouri Real Estate
    Commission — Statutes (RSMo Chapter 339) and Rules (20 CSR 2250) book (June 2023) — § 339.020
  url: null
  quoted_text: It shall be unlawful for any person, partnership, limited partnership, limited
    liability company, association, professional corporation, or corporation, foreign or domestic,
    to act as a real estate broker, real estate broker-salesperson, or real estate salesperson, or
    to advertise or assume to act as such without a license first procured from the commission.
