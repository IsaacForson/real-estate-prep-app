stem: Under section 339.050, RSMo, what must every license application include?
options:
  - A notarized letter of recommendation from a licensed broker
  - A certified copy of the applicant's high school diploma
  - A surety bond covering the applicant's first year of licensure
  - A statement that it is made under oath or affirmation
key: D
explanation: The statute requires each application to contain a statement that it is made under oath
  or affirmation and that its representations are true and correct, subject to the penalties of a
  false affidavit.
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) § 339.050
  url: null
  quoted_text: Each application shall contain a statement that it is made under oath or affirmation
    and that its representations are true and correct to the best knowledge and belief of the person
    signing same, subject to the penalties of making a false affidavit or declaration.
