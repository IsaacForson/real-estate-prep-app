stem: Under section 339.050, RSMo, on what medium must a license application be written?
options:
  - On blanks furnished by the commission
  - On standard white letter‑size paper
  - On electronic form submitted via email
  - On a notarized affidavit form for submission
key: A
explanation: The statute explicitly states that applications must be in writing on blanks furnished
  by the commission. Using plain paper or electronic submission does not satisfy this requirement,
  and a notarized affidavit is not mentioned as a substitute.
