stem: A corporation applies for a Missouri real estate broker license. One of its managers had a
  real estate salesperson license revoked two years ago but holds no ownership stake in the
  corporation. Under 339.080 RSMo, may the commission refuse to issue the broker license to this
  corporation?
options:
  - Yes, because the person is a manager of the corporation
  - No, because the person has no ownership interest in the corporation
  - No, because the license revocation occurred more than one year ago
  - Yes, but only if the person also holds a controlling interest as a stockholder
key: A
explanation: The statute allows the commission to refuse a license to any corporation where a person
  whose license was revoked serves as a manager, officer, or general partner. Ownership interest is
  not required for this basis of refusal. Therefore, the manager’s role alone justifies refusal. The
  distractor claiming refusal requires ownership interest is incorrect because managerial status
  suffices.
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) — Missouri Real Estate
    Commission — Statutes (RSMo Chapter 339) and Rules (20 CSR 2250) book (June 2023) — § 339.080
  url: null
  quoted_text: or may refuse to issue a license to any association, partnership, corporation,
    professional corporation, limited partnership, or limited liability company of which such person
    is a manager, officer or general partner, or in which as a member, partner or associate such
    person has or exercises a controlling interest either directly or indirectly, or to any
    corporation of which such person is an officer or in which as a stockholder such person has or
    exercises a controlling interest either directly or indirectly
