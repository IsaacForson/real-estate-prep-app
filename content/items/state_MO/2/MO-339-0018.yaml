stem: A salesperson submits a timely, complete renewal application, but the salesperson's broker has
  not yet renewed the broker's own license. Applying 20 CSR 2250-4.020, what happens to the
  salesperson's renewal?
options:
  - It is issued immediately regardless of the broker's license status
  - It is placed on inactive status for the rest of the term
  - It will not be issued until the broker's license has been renewed
  - It is denied permanently and requires a fresh original application
key: C
explanation: The rule provides that a renewal license will not be issued until the license of the
  broker with whom the licensee is associated has been renewed.
