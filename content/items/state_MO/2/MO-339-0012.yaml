stem: Under 20 CSR 2250-3.010, what quality must an applicant demonstrate to be granted a real
  estate license?
options:
  - Good moral character and a reputation for honesty and fair dealing
  - Five years of prior experience in property appraisal
  - Ownership of a registered brokerage office within the state
  - Membership in a long-standing, state-recognized real estate trade association
key: A
explanation: The rule grants licenses only to persons who present satisfactory proof of good moral
  character, a reputation for honesty, integrity, and fair dealing, and competence to safeguard the
  public interest.
citation:
  source: 20 CSR 2250-3.010 § (Applications for License)
  url: null
  quoted_text: Licenses shall be granted only to persons who present, and corporations, associations
    or partnerships whose officers, associates, or partners present, satisfactory proof to the com-
    mission that they are persons of good moral character; bear a good reputation for honesty,
    integrity, and fair dealing; and are competent to transact the business of a broker or
    salesperson in such a manner as to safeguard the interest of the public.
