stem: According to 339.020 RSMo, which of the following must obtain a license from the Missouri Real
  Estate Commission before acting as a real estate broker?
options:
  - A partnership engaged in real estate brokerage services
  - A sole proprietorship offering only property management advice
  - A limited liability company holding real estate for investment purposes
  - A corporation that hires licensed agents but does not perform brokerage
key: A
explanation: The statute declares it unlawful for any partnership acting as a real estate broker to
  operate without a license, so a partnership engaged in brokerage services must be licensed. The
  sole proprietorship offering only property management advice is not acting as a broker under the
  statute, so a license is not required.
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) — Missouri Real Estate
    Commission — Statutes (RSMo Chapter 339) and Rules (20 CSR 2250) book (June 2023) — § 339.020
  url: null
  quoted_text: It shall be unlawful for any person, partnership, limited partnership, limited
    liability company, association, professional corporation, or corporation, foreign or domestic,
    to act as a real estate broker, real estate broker-salesperson, or real estate salesperson, or
    to advertise or assume to act as such without a license first procured from the commission.
