stem: An applicant for a Missouri real estate license is denied licensure by the commission. Under
  §339.080(2), what must the commission provide to the applicant in writing?
options:
  - A statement of denial reasons and info on the right to file a complaint
  - A copy of the denied application and a refund of any fees paid to the applicant
  - A notice that the denial is final and that no further action may be taken
  - A verbal explanation of the denial provided during a telephone conversation
key: A
explanation: The statute requires the commission to notify the applicant in writing, stating the
  reasons for denial and informing the applicant of the right to file a complaint. The distractor
  offering only a copy of the application and a refund is incorrect because the rule does not
  require those items as part of the written notice.
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) — Missouri Real Estate
    Commission — Statutes (RSMo Chapter 339) and Rules (20 CSR 2250) book (June 2023) — § 339.080
  url: null
  quoted_text: |-
    Any person denied a license or the right to be exam-
    ined shall be so notified by the commission in writing stating
    the reasons for denial or refusal to examine and informing
    the person so denied of his right to file a complaint with the
    administrative hearing commission in accordance with the
    applicable provisions of sections 621.015 to 621.198 and the
    rules promulgated thereunder
