stem: An applicant for a broker license lacks the standard two years of experience as a licensed
  salesperson but presents extensive documented experience managing commercial property
  transactions. Applying section 339.040, RSMo, how may the commission treat this application?
options:
  - It issues a salesperson license automatically instead
  - It refers the application to a formal hearing before an administrative law judge
  - It rejects the application until two full years have elapsed
  - It may reduce the standard experience requirement based on other proof
key: D
explanation: The statute allows the commission to waive all or part of the standard experience and
  education requirements when an applicant presents proof of other educational background or
  experience acceptable to the commission.
