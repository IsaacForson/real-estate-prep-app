stem: Under section 339.050, RSMo, what legal consequence is specified for making a **false**
  statement in a license application?
options:
  - Denial of the license application for containing false or misleading information
  - Expiration of course credit and examination results after six months
  - Penalties for making a false affidavit or declaration
  - Requirement to submit fingerprints for a state and federal background check
key: C
explanation: Under Mo. Rev. Stat. § 339.050, each license application must contain a sworn statement
  that its representations are true and correct. If a false statement is made, the applicant is
  subject to the penalties for making a false affidavit or declaration. This means the legal
  consequence is possible penalties for perjury. The statute does not mention automatic approval,
  course retake, or a temporary work permit.
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) — Missouri Real Estate
    Commission — Statutes (RSMo Chapter 339) and Rules (20 CSR 2250) book (June 2023) — § 339.050
  url: null
  quoted_text: Each application shall contain a statement that it is made under oath or affirmation
    and that its representations are true and correct to the best knowledge and belief of the person
    signing same, subject to the penalties of making a false affidavit or declaration.
