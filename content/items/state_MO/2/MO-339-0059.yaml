stem: An applicant has been issued a temporary work permit by the Missouri Real Estate Commission
  while awaiting final printing of the salesperson license. According to section 339.040, RSMo,
  under what circumstance may the commission withdraw this temporary work permit?
options:
  - The commission may withdraw the work permit only if the applicant fails continuing education
  - The commission may withdraw the work permit at any time, at its discretion
  - The commission may withdraw the work permit after six months of licensure
  - The commission may withdraw the work permit if the applicant changes employing broker
key: B
explanation: The statute says the commission may, at its discretion, withdraw the work permit at any
  time. The other options introduce conditions not found in the rule, such as continuing education
  failure, a six‑month licensure period, or a change of employing broker.
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) — Missouri Real Estate
    Commission — Statutes (RSMo Chapter 339) and Rules (20 CSR 2250) book (June 2023) — § 339.040
  url: null
  quoted_text: The commission may issue a temporary work permit pending final review and printing of
    the license to an applicant who appears to have satisfied the requirements for licenses. The
    commission may, at its discretion, withdraw the work permit at any time.
