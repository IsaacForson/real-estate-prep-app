stem: A broker-salesperson licensee ends their association with a broker. According to 20 CSR
  2250-4.050(3), what action must the broker take within seventy-two (72) hours?
options:
  - The broker must wait thirty (30) days before taking any further action regarding the licensee's
    status.
  - The broker must notify the commission and return the licensee's license to the commission within
    the required timeframe.
  - The broker must submit a new license application for the licensee to the commission without
    delay and retain a copy for their files.
  - The broker must issue a letter of recommendation to the licensee for future employment
    opportunities.
key: B
explanation: Under 20 CSR 2250‑4.050, a broker is required, within seventy‑two hours of the
  termination of a broker‑salesperson’s association, to notify the commission and to return that
  licensee’s license to the commission. The other answer choices describe actions that the rule does
  not require, such as waiting thirty days, filing a new license application, or providing a
  recommendation letter.
