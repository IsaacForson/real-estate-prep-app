stem: An individual is applying for an original Missouri real estate license in 2024. Applying 20
  CSR 2250-3.010, what must this applicant provide as part of the application?
options:
  - A copy of the applicant's most recent federal tax return
  - A signed release authorizing a civil credit check
  - A fingerprint record submitted for a background check
  - A letter from a physician certifying general good health
key: C
explanation: The rule requires individuals applying for an original license after December 31, 2010
  to provide acceptable proof of having submitted fingerprints for both a state highway patrol and
  an FBI background check.
