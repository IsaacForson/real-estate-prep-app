  url: null
  quoted_text: All individuals applying for an original Missouri real estate license after December
    31, 2010, must provide acceptable proof of having submitted fingerprints to the Missouri State
    Highway Patrol’s approved vendor for both a Missouri State Highway Patrol and a Federal Bureau
