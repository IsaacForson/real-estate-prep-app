stem: A corporation applies for a broker license. Its manager has been convicted of forgery. Under §
  339.110, may the commission refuse to issue the license to the corporation?
options:
  - Yes, because the manager is a manager of the corporation.
  - Yes, because forgery is not listed as an offense under the statute.
  - Yes, but only if the manager also holds a controlling interest as a stockholder.
  - Yes, because the manager's conviction does not affect the corporation's eligibility.
key: A
explanation: The statute permits the commission to deny a broker license to a corporation when an
  individual who serves as a manager, officer, or general partner of that corporation has been
  convicted of forgery. Therefore, the option stating that the manager's conviction allows refusal
  because the manager is a manager of the corporation is correct. The option claiming that forgery
  is not listed as an offense under the statute is incorrect because forgery is expressly listed as
  an offense. The option suggesting refusal only if the manager also holds a controlling interest as
  a stockholder is incorrect because the statute does not require a stockholding interest; any
  manager, officer, or general partner suffices. The option asserting that the manager's conviction
  does not affect the corporation's eligibility is incorrect because the statute explicitly ties the
  conviction of a manager, officer, or general partner to the corporation's eligibility.
