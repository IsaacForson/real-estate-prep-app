stem: Under §339.110, which of the following is specifically listed as an offense that may lead to
  refusal of a license?
options:
  - Forgery
  - Tax evasion
  - Trespassing
  - Bankruptcy
key: A
explanation: The statute states that the commission may refuse to issue a license to a person known
  to have been found guilty of forgery, embezzlement, obtaining money under false pretenses,
  extortion, criminal conspiracy to defraud, or other like offense. Therefore, forgery is a listed
  offense that can lead to denial. Bankruptcy is not mentioned in the statute as a basis for
  refusing a license.
