stem: A broker-salesperson terminates her association with her broker on Monday morning. By what
  deadline must the broker notify the Missouri Real Estate Commission and return the licensee's
  license?
options:
  - Within 24 hours
  - Within 48 hours
  - Within 72 hours
  - Within 96 hours
key: C
explanation: The rule states that within seventy‑two (72) hours of the termination of the
  association, the broker shall notify the commission and return the licensee’s license. The 24‑hour
  and 48‑hour options are too early, and the 96‑hour option is too late.
