stem: A real estate partnership has three general partners who actively participate in its brokerage
  business, but only two of them hold individual broker licenses. Applying section 339.030, RSMo,
  may this partnership be granted a broker's license?
options:
  - No, because every active partner needs an individual license
  - Yes, because a majority of the active partners already hold individual licenses
  - Yes, because the managing partner alone needs an individual license
  - No, because partnerships cannot hold a broker's license under this statute
key: A
explanation: The statute grants a broker's license to a partnership only when individual licenses
  have been issued to every partner or officer who actively participates in its brokerage business,
  so one unlicensed active partner defeats eligibility.
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) § 339.030
  url: null
  quoted_text: For a real estate broker individual licenses have been issued to every member, general
    partner, associate, manager, member, or officer of such partnership, limited partnership,
    limited liability company, association, professional corpora- tion, or corporation who actively
    participates in its brokerage business and to every person, partnership, limited partnership,
    limited liability company, professional corporation, or corpora- tion who acts as a salesperson
    for such partnership, limited partnership, limited liability company, association, professional
    corporation, or corporation; or
