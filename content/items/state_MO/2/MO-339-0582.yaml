stem: A corporation applies for a Missouri real estate broker license. An individual whose real
  estate salesperson license was revoked two years ago owns 15% of the corporation’s stock and holds
  no officer or management position. Under 339.080 RSMo, may the commission refuse to issue the
  broker license to this corporation?
options:
  - Yes, because the individual’s prior revocation disqualifies any corporate applicant
  - No, because the person does not have a controlling interest as a stockholder
  - Yes, because a 15% stockholding constitutes a controlling interest under the statute
  - No, because the individual’s lack of an officer position exempts them from review
key: B
explanation: The statute permits refusal only when a stockholder has a controlling interest in the
  corporation. A 15% ownership stake without controlling interest does not meet this threshold.
  Therefore, the commission may not refuse the license on this basis. The distractor claiming any
  revoked-license stockholder triggers refusal ignores the controlling-interest requirement.
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) — Missouri Real Estate
    Commission — Statutes (RSMo Chapter 339) and Rules (20 CSR 2250) book (June 2023) — § 339.080
  url: null
  quoted_text: or may refuse to issue a license to any association, partnership, corporation,
    professional corporation, limited partnership, or limited liability company of which such person
    is a manager, officer or general partner, or in which as a member, partner or associate such
    person has or exercises a controlling interest either directly or indirectly, or to any
    corporation of which such person is an officer or in which as a stockholder such person has or
    exercises a controlling interest either directly or indirectly
