stem: Under §339.110 of the Missouri Revised Statutes, the commission may refuse to issue a license
  to a corporation if an individual who has been found guilty of embezzlement serves in which
  capacity?
options:
  - A manager, officer, or general partner
  - A customer who refers clients to the corporation
  - A salaried employee with no ownership interest
  - A licensed salesperson employed by the corporation
key: A
explanation: The statute states that the commission may refuse a license to any corporation of which
  such person is a manager, officer or general partner, or in which as a stockholder such person has
  or exercises a controlling interest. Therefore, serving as a manager, officer, or general partner
  triggers refusal. A salaried employee with no ownership interest does not meet the criteria.
