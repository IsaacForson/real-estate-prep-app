stem: A licensee has completed 8 hours of approved continuing education during the first year of
  their two‑year renewal period. How many more hours must they complete before renewal to meet the
  Missouri CE requirement?
options:
  - They must complete 2 more hours of approved continuing education.
  - They must complete 4 more hours of approved continuing education.
  - They must complete 6 more hours of approved continuing education.
  - They must complete 8 more hours of approved continuing education.
key: B
explanation: The rule requires a minimum of twelve (12) hours of approved CE for renewal; having
  already earned eight (8) hours leaves four (4) hours needed, so the licensee must complete four
  more hours.
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) — Missouri Real Estate
    Commission — Statutes (RSMo Chapter 339) and Rules (20 CSR 2250) book (June 2023) — §
    2250-10.100(1)
  url: null
  quoted_text: |-
    Each real estate licensee who holds an active license
    shall complete during the two (2)-year license period prior to
    renewal, as a condition precedent to license renewal, a mini-
    mum of twelve (12) hours of real estate instruction approved
    for continuing education credit by the Missouri Real Estate
    Commission
