stem: How many of the required twelve continuing education hours must be completed in a core course
  identified by the Missouri Real Estate Commission?
options:
  - Three (3) hours of instruction
  - Six (6) hours of instruction
  - Nine (9) hours of instruction
  - Twelve (12) hours of instruction
key: A
explanation: The rule requires at least three (3) hours of the twelve (12) hours of approved
  instruction to be in a core course identified by the Commission (20 CSR 2250-10.100(3)).
  Therefore, three hours is the minimum that must be completed in a core course. The distractor of
  six hours exceeds the minimum; while a licensee may take more, the rule does not require six hours
  in a core course.
