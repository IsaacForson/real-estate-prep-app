stem: A private institution wishes to offer a Missouri‑approved salesperson pre‑license course.
  According to Missouri law, what must the institution first do to be allowed to teach the course?
options:
  - Obtain a license from the Missouri Real Estate Commission to operate as a broker
  - Apply for accreditation and show readiness to teach the prescribed curriculum
  - Provide proof that its instructors have at least five years of real estate experience
  - Submit a detailed syllabus to the Professional Testing Service for approval
key: B
explanation: Missouri law requires that any institution or organization that wants to conduct a
  school or offer a pre‑license course must first apply to the Missouri Real Estate Commission for
  accreditation and submit evidence that it is prepared to deliver the prescribed curriculum. A
  broker’s license alone does not satisfy this requirement. (§ 339.045)
citation:
  source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules) — Missouri Real Estate
    Commission — Statutes (RSMo Chapter 339) and Rules (20 CSR 2250) book (June 2023) — § 339.045
  url: null
  quoted_text: An institution or organization desiring to conduct a school or offer a course of
    instruction to prepare persons to be licensed under this chapter, or to offer post-licensure
    courses, shall apply to the commission for accreditation, and shall submit evidence that it is
    prepared to carry out a prescribed minimum curriculum in real estate principles and practices
    and can meet other standards established by the commission.
