stem: Under Missouri continuing education rules, what is the minimum amount of actual classroom
  instruction required for one hour of continuing education credit?
options:
  - At least 50 minutes of actual classroom instruction
  - At least 55 minutes of actual classroom instruction
  - At least 40 minutes of actual classroom instruction
  - At least 45 minutes of actual classroom instruction
key: A
explanation: The commission defines one hour of continuing education as a 60‑minute period, with at
  least 50 minutes devoted to actual classroom instruction. The statement that requires "At least 50
  minutes of actual classroom instruction" therefore meets the rule. Answers that require a shorter
  time do not satisfy the minimum, and answers that require a longer time exceed the minimum but are
  not the minimum required. (Mo. Rev. Stat. ch. 339; 20 CSR 2250‑10.100(1)).
