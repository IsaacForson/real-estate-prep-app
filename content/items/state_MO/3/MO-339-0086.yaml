stem: A person applying for a Missouri broker license holds a bachelor’s degree in finance and has
  three years of experience as a property manager. The applicant asks whether the commission can
  waive the pre‑license educational requirements. What may the commission do under Missouri law?
options:
  - May deny the application because waivers are not permitted
  - May waive only the continuing education requirement
  - May waive all or part of the educational requirements
  - May require the salesperson exam to be retaken first
key: C
explanation: The statute allows the commission to waive all or part of the educational requirements
  when an applicant presents proof of other educational background or experience acceptable to the
  commission. The distractor “May deny the application because waivers are not permitted” is
  incorrect because the statute expressly permits waivers under the described circumstance.
