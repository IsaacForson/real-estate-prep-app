stem: An applicant for a Missouri broker license has not been a licensed salesperson for the
  required two years but has completed a broker pre-license course from an accredited school within
  the past six months. According to Missouri law, what may the commission do?
options:
  - The commission may issue a temporary broker license to allow the applicant to wind up the
    brokerage affairs under supervision.
  - The commission may waive the experience requirement if the applicant provides proof of
    acceptable education or experience.
  - The commission must automatically deny the application because the applicant lacks the required
    salesperson experience.
  - The commission must require the applicant to retake the salesperson exam before considering the
    broker application.
key: B
explanation: The broker license rule allows the commission to waive the two‑year salesperson
  experience requirement when the applicant presents proof of other educational background or
  experience acceptable to the commission. The distractor about automatic denial ignores the waiver
  provision.
