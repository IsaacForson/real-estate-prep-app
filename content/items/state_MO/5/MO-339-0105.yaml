stem: A licensee receives a buyer's earnest money deposit but does not remit it to the seller until
  after the closing date, despite no written agreement to delay. Which ground for disciplinary
  action does this constitute under § 2250-9.050?
options:
  - This constitutes failure to maintain and deposit funds in a special account separate from
    personal accounts.
  - This constitutes making substantial misrepresentations or false promises or suppression,
    concealment or omission of material facts.
  - This constitutes failing within a reasonable time to account for or to remit any moneys,
    valuable documents or other property belonging to others.
  - This constitutes representing to any lender an amount in excess of the true and actual sale
    price of the real estate.
key: C
explanation: "Failing to remit funds belonging to others within a reasonable time, absent a written
  agreement to delay, is expressly listed as a ground for discipline under § 2250-9.050. The other
  options describe different violations: failure to maintain a special account, making
  misrepresentations or concealing facts, and misrepresenting the sale price to a lender, none of
  which match the scenario of delayed remittance."
