stem: A married couple owns a homestead that is community property. The husband wishes to sell the
  homestead without his wife's signature. Under Tex. Fam. Code § 5.001, which action is permissible?
options:
  - The sale proceeds are used to purchase money on the property
  - The homestead is located in a rural area outside municipal limits
  - The other spouse provides written consent to the sale
  - The homestead is classified as the spouse's separate property
key: C
explanation: Tex. Fam. Code § 5.001 provides that neither spouse may sell, convey, or encumber the
  homestead without the joinder of the other spouse. Therefore, the husband cannot sell the
  homestead without his wife's signature unless she gives written consent. The other options—using
  the sale proceeds to pay purchase money, locating the homestead in a rural area, or classifying
  the property as separate—do not override the joinder requirement; the statute mandates both
  spouses' agreement regardless of these circumstances.
