stem: During a divorce proceeding, a spouse asserts that a vehicle owned during marriage is separate
  property. Under Tex. Fam. Code § 3.003(b), what degree of proof must the spouse provide to
  overcome the presumption that the property is community?
options:
  - Clear and convincing evidence standard
  - Preponderance of the evidence standard
  - Beyond a reasonable doubt evidentiary standard
  - Probable cause evidentiary standard
key: A
explanation: Tex. Fam. Code § 3.003(b) states that the degree of proof necessary to establish that
  property is separate property is clear and convincing evidence. Thus, the spouse must meet that
  standard. Preponderance of the evidence is the typical civil burden but is insufficient to rebut
  the community property presumption under this statute.
