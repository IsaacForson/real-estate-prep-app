math:
  worked_solution: The shop earns 60% of its gross income from floral arrangements. The statute
    applies to businesses that derive 50% or more of gross income from floral arrangements. Since
    60% ≥ 50%, the business meets the threshold, so the misrepresentation of location is a
    violation.
