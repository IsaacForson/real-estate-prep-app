stem: A licensee advertises a flower shop that earns 60% of its gross income from floral
  arrangements as being located in Austin, Texas, but the shop is actually in Round Rock and the
  advertisement does not include a conspicuous notice of the true location. Under Tex. Bus. & Com.
  Code ch. 17, which statement is correct?
options:
  - The advertisement is permissible under the statute because the licensee provided the shop's
    telephone number and the business name in the listing.
  - The advertisement constitutes a false, misleading, or deceptive act or practice because it
    misrepresents the geographical location of a business that derives 50% or more of its gross
    income from floral arrangements.
  - The advertisement is allowed under the statute if the shop's website includes a conspicuous
    disclaimer stating the true municipality and state and the disclaimer is visible before any
    purchase.
  - The advertisement is not a violation because the shop continues to sell flowers and floral
    arrangements to customers and maintains the same telephone number.
key: B
explanation: The advertisement misrepresents the geographical location of a business that derives
  50% or more of its income from floral arrangements, which is prohibited by Sec. 17.462(a) and
  (b)(1)-(3). Providing the shop's telephone number and business name in the listing does not cure
  the misrepresentation.
citation:
  source: Tex. Bus. & Com. Code ch. 17 — Texas Business and Commerce Code Chapter 17 — Deceptive Trade
