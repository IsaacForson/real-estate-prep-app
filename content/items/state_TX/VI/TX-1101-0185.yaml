stem: According to Tex. Fam. Code § 3.001, which of the following is included in a spouse's separate
  property?
options:
  - Property acquired during marriage by purchase with community funds
  - Property acquired during marriage by gift
  - Property acquired during marriage by devise to both spouses
  - Property acquired during marriage by wages earned
key: B
explanation: Under Tex. Fam. Code § 3.001(2), a spouse's separate property includes property
  acquired during marriage by gift, devise, or descent. Therefore, property acquired during marriage
  by gift is separate property. Property acquired with community funds or wages earned during
  marriage is community property, and a devise to both spouses is not acquired by the spouse alone,
  so it is community property.
