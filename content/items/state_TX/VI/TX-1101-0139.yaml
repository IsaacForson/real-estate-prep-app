stem: A licensee convinces a seller to sign a DTPA waiver before listing a property. Later, the
  Attorney General files a lawsuit alleging deceptive trade practices under Section 17.47. Under
  Tex. Bus. & Com. Code § 17.42(e), what effect does the signed waiver have on the Attorney
  General's action?
options:
  - The waiver requires the Attorney General to first seek mediation before proceeding.
  - The waiver is not a defense to an action brought by the Attorney General under Section 17.47.
  - The waiver reduces any potential damages awarded to the consumer.
  - The waiver bars the Attorney General's action because the consumer consented.
key: B
explanation: The waiver signed by the consumer does not prevent the Attorney General from pursuing a
  deceptive‑trade‑practices lawsuit. Tex. Bus. & Com. Code § 17.42(e) provides that a consumer’s
  waiver is not a defense to an action brought by the attorney general under § 17.47. Therefore, the
  AG’s suit can proceed regardless of the waiver. The idea that the waiver requires mediation first,
  reduces damages, or bars the AG’s action is inconsistent with the statute.
