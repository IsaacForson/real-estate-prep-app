stem: Under Tex. Tax Code § 11.13(a), what is the amount of the residence homestead exemption for
  county purposes?
options:
  - $3,000 of the assessed value
  - $5,000 of the appraised value
  - $10,000 of the appraised value
  - $100,000 of the appraised value
key: A
explanation: Subsection (a) provides a $3,000 exemption from county taxes for the residence
  homestead of a family or single adult. The other amounts correspond to school district or other
  exemptions not applicable to county purposes.
