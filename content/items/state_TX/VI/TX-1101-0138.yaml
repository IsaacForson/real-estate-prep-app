stem: Under the Texas Business and Commerce Code, which statement is correct regarding the
  enforceability of this waiver?
options:
  - Valid because the waiver language matches the statutory form exactly.
  - Invalid because it lacks the required heading "Waiver of Consumer Rights" or similar language.
  - Invalid because the consumer did not receive a copy of the waiver.
  - Valid because the consumer signed it after consulting an attorney.
key: B
explanation: The waiver must be identified by the heading "Waiver of Consumer Rights" or similar
  language as required by Tex. Bus. & Com. Code § 17.42(c)(2). Because the heading is missing, the
  waiver does not satisfy the statutory requirement and is therefore invalid. The option that notes
  the missing heading correctly states the rule, while the option that relies solely on attorney
  consultation does not meet the requirement.
