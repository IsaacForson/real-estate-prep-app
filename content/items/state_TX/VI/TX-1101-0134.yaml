stem: Under Tex. Bus. & Com. Code ch. 17, which of the following is the statutory definition of a
  'pyramid promotional scheme'?
options:
  - A plan or operation by which a person gives consideration for the opportunity to receive
    compensation that is derived primarily from a person's introduction of other persons to
    participate in the plan or operation rather than from the sale of a product by a person
    introduced into the plan or operation.
  - A plan or operation by which a person gives consideration for the opportunity to receive
    compensation that is derived primarily from both a person's introduction of other persons to
    participate in the plan or operation and the sale of a product by a person introduced into the
    plan or operation.
  - A plan or operation by which a person gives consideration for the opportunity to receive
    compensation that is derived primarily from the sale of a product by a person introduced into
    the plan or operation rather than from a person's introduction of other persons to participate
    in the plan or operation.
  - A plan or operation by which a person gives consideration for the opportunity to receive
    compensation that is derived equally from the sale of a product by a person introduced into the
    plan or operation and the introduction of other persons to participate in the plan or operation.
key: A
explanation: The definition is directly from Sec. 17.461(a)(6), which states that a pyramid
  promotional scheme derives compensation primarily from recruiting others rather than product
  sales. The distractor B incorrectly reverses the primary source of compensation to product sales,
  contradicting the statute.
