stem: An applicant submitted a Texas real estate license application on March 1, 2024. According to
  Texas Occupations Code §1101.401(f), by what date must the applicant pass the required examination
  to satisfy the requirement?
options:
  - March 31, 2025.
  - April 1, 2025.
  - February 28, 2025.
  - March 1, 2025.
key: D
explanation: The rule requires the examination to be satisfied not later than one year after the
  application filing date. Adding one year to March 1, 2024 gives March 1, 2025 as the latest
  permissible date. Therefore the option stating March 1, 2025 meets the requirement. The options
  stating March 31, 2025 and April 1, 2025 fall after that deadline, while the option stating
  February 28, 2025 falls before the deadline (also satisfies the requirement but is not the latest
  date).
