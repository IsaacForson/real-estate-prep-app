stem: A sales agent decides to end her sponsorship with her broker. What must she do immediately
  according to TREC rules?
options:
  - Notify the broker in writing and terminate sponsorship using a Commission‑acceptable process
  - Notify the Commission in writing, wait for written approval, and retain proof of notification
  - Wait until the end of the month, then notify the broker in writing and keep a copy for records
  - Submit a renewal application to the Commission, retain the receipt, and keep a copy for your
    records
key: A
explanation: When a sales agent intends to terminate the sponsorship, the rule requires immediate
  written notice to the broker and termination of the sponsorship using a process acceptable to the
  Commission. The other options either involve the Commission, delay action, or omit the required
  broker notification.
