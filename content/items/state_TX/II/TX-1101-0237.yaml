stem: A Texas real estate sales agent’s license expired 100 days ago. Assuming the license holder
  wishes to renew the license, what renewal fee must be paid to the Commission?
options:
  - 1 times the required renewal fee
  - 1.5 times the required renewal fee
  - 2 times the required renewal fee
  - 2.5 times the required renewal fee
key: C
explanation: According to Texas Occupations Code §1101.451(e), a license expired for more than 90
  days but less than six months may be renewed by paying a fee equal to two times the required
  renewal fee. Since 100 days falls within that range, the correct fee is twice the standard renewal
  fee. The 1.5‑times option applies only to licenses expired 90 days or less, making it incorrect
  for this scenario.
