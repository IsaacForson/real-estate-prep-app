stem: Under Texas Occupations Code §1101.455(b), what is the minimum number of classroom hours of
  continuing education that a license holder must attend to renew a license?
options:
  - 15 classroom hours
  - 18 classroom hours
  - 12 classroom hours
  - 20 classroom hours
key: A
explanation: The statute requires the commission to prescribe at least 15 classroom hours of
  continuing education for license renewal. Therefore, 15 classroom hours is the minimum. The
  12‑hour option is below the statutory minimum, while 18 and 20 hours exceed the minimum but are
  not the required minimum.
