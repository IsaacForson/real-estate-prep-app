stem: According to Texas Occupations Code §1101.002, which of the following acts is included in the
  definition of a broker?
options:
  - A broker under Texas law may provide a written analysis of property price that is referred to as
    an appraisal.
  - A broker under Texas law may advise an owner concerning the negotiation or completion of a short
    sale.
  - A broker under Texas law may act as an on-site manager of an apartment complex while employed by
    the property owner.
  - A broker under Texas law may construct a home for personal use in accordance with the owner's
    business activities.
key: B
explanation: The definition of broker in §1101.002(1)(xii) includes advising an owner concerning the
  negotiation or completion of a short sale. The statement that a broker may provide a written
  analysis of property price that is referred to as an appraisal is incorrect because the definition
  requires that such an analysis not be called an appraisal.
