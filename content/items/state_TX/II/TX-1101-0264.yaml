stem: Under 22 Tex. Admin. Code §535.91(l), what action may the Commission take regarding a license
  renewal application if the license holder is in violation of the terms of a Commission order?
options:
  - Placement of the license on inactive status automatically
  - Denial of the renewal application due to violation
  - Approval of the renewal with a probationary period
  - Requirement to submit additional continuing education
key: B
explanation: The rule explicitly states the Commission may deny an application for renewal when the
  license holder violates a Commission order; the other options describe actions not authorized by
  this subsection.
