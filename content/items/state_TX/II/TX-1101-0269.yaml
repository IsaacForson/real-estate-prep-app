stem: A sales agent held an active Texas license that expired five months ago and now submits a new
  license application. According to Texas Occupations Code §1101.358(b), are the education
  requirements for a sales agent license waived?
options:
  - Yes, because the applicant was licensed within the six months preceding the application date.
  - No, because the license must be current at the time of application.
  - Yes, but only if the applicant also completed continuing education during the lapse.
  - No, because education requirements are typically waived for sales agent applicants.
key: A
explanation: The rule waives education requirements if the applicant has been licensed as a broker
  or sales agent within the six months preceding the application date. A license that expired five
  months ago satisfies this condition, so the requirements are waived. The claim that the license
  must be current is incorrect, as the rule does not require current licensure for the waiver.
