stem: A sales agent let their license lapse for four months. According to Texas Occupations Code
  §1101.451(e), what fee must the sales agent pay to renew the license?
options:
  - The sales agent must pay no fee; the license cannot be renewed and a new license must be
    obtained.
  - The sales agent must pay a fee equal to two times the required renewal fee.
  - The sales agent must pay a fee equal to the same amount as the original renewal fee.
  - The sales agent must pay a fee equal to one and one-half times the required renewal fee.
key: B
explanation: A license expired for more than 90 days but less than six months requires a renewal fee
  equal to two times the required renewal fee. Four months falls within this range, so the agent
  must pay double the fee. The one-and-one-half fee applies only to expirations of 90 days or less.
