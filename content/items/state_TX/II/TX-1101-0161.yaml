stem: A license holder's real estate license expired on January 15. Assuming the license holder
  filed a renewal application using an acceptable process and submitted the required fees on July
  10, is the license eligible for late renewal under 22 Tex. Admin. Code §535.91(i)(1)?
options:
  - No, because the license has been expired for more than six months
  - Yes, provided they complete continuing education before the application
  - No, unless they pay an additional penalty fee
  - Yes, because the license has been expired for less than six months
key: D
explanation: Section 535.91(i)(1)(A) allows late renewal if the license has been expired for less
  than six months. From January 15 to July 10 is under six months, making the license eligible
  assuming other requirements are met. The other options either misstate the time limit or add
  conditions not required by this subsection.
