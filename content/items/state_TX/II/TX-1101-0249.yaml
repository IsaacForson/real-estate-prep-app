stem: A person who has submitted an application for a Texas sales agent license but has not yet
  received the license shows a property to a prospective buyer for a fee. According to Texas
  Occupations Code §1101.351(b), is this permissible?
options:
  - Yes, because the application is pending with the Commission
  - No, because the person must wait until the license is received
  - Yes, if the person is sponsored by a licensed broker
  - No, unless the person is acting as a residential rental locator
key: B
explanation: The law prohibits an applicant from acting as a broker or sales agent until the license
  is received, so showing a property for a fee without the license is not allowed. The distractor
  suggesting permission if sponsored by a broker is wrong because the sponsorship exception applies
  only after licensure, not to an unlicensed applicant.
citation:
  source: Tex. Occ. Code ch. 1101 — Texas Occupations Code Chapter 1101 — Real Estate Brokers and
