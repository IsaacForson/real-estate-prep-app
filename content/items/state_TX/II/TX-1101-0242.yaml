stem: A broker who works as an employee for another broker and receives a salary but no commission
  asks whether they need to provide additional information when renewing their license. According to
  Texas Occupations Code §1101.552(g), what is the correct classification of this broker?
options:
  - The broker is classified as an associated broker
  - The broker is classified as a resident broker
  - The broker is classified as a nonresident broker
  - The broker is classified as a sales agent
key: A
explanation: Subsection (g) defines an associated broker as a broker who associates with and is paid
  through another broker under a continuous relationship, including as an employee. The scenario
  describes a broker working as an employee for another broker and receiving a salary, which matches
  this definition. A common misconception is to think the broker must be classified as a resident
  broker, but residency is unrelated to the associated broker definition.
citation:
