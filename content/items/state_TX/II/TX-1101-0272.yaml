stem: The Texas Real Estate Commission changes the expiration date for all licenses from August 31
  to January 31. A license holder whose license would have been valid for five months under the old
  schedule renews under the new schedule. Under Texas Occupations Code §1101.451(c), what portion of
  the total renewal fee must the license holder pay?
options:
  - The license holder must pay one‑half of the total renewal fee.
  - The license holder must pay five‑twenty‑fourths of the total renewal fee.
  - The license holder must pay the full total renewal fee.
  - The license holder must pay one‑third of the total renewal fee.
key: B
explanation: Under Tex. Occ. Code §1101.451(c), when the license expiration date changes, renewal
  fees are prorated monthly so each holder pays only for the months the license remains valid. A
  license that would have been valid for five months under the old schedule therefore requires
  payment of five twenty‑fourths of the total renewal fee. The option stating that the license
  holder must pay five‑twenty‑fourths of the total renewal fee correctly reflects this proration.
  The option stating the full fee is due ignores the monthly proration requirement.
citation:
  source: Tex. Occ. Code ch. 1101 — Texas Occupations Code Chapter 1101 — Real Estate Brokers and
    Sales Agents (The Real Estate License Act), official Texas Legislature Online statute page read
    via Internet Archive capture of 2025-12-07 because statutes.capitol.texas.gov now serves only a
    JavaScript shell — § 1101.451
  url: null
  quoted_text: (c) For a year in which the license expiration date is changed, renewal fees payable
    shall be prorated on a monthly basis so that each license holder pays only that portion of the
    fee that is allocable to the number of months during which the license is valid. On renewal of
    the license on the new expiration date, the total renewal fee is payable.
