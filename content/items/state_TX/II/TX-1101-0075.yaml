stem: A sales agent creates a single-member LLC that receives referral fees for directing clients to
  brokers, performs no other brokerage activities, is registered with the Commission, and is owned
  less than half by the sales agent (the remainder by an unrelated investor). Under TREC rule
  §535.5(h), is the LLC required to be licensed as a broker?
options:
  - The LLC is not required to be licensed because it performs no other brokerage acts
  - The LLC must be licensed as a broker because it receives referral fees
  - The LLC is not required to be licensed because it is registered with the Commission
  - The LLC must be licensed as a broker because it is less than 51% owned by the sales agent
key: D
explanation: The rule exempts a business entity from licensing only if it is at least 51% owned by
  the license holder; if the sales agent owns less than half, the exemption does not apply, so the
  LLC must be licensed. The distractor claiming no license is needed due to performing no other
  brokerage acts ignores the ownership requirement.
