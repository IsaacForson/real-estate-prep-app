stem: A salaried employee of a Texas limited liability company is tasked with purchasing an office
  building for the company's use. The employee negotiates price, signs the contract, and receives a
  salary but no commission. Does the employee need a real estate license?
options:
  - No, because the employee is acting for the employer to buy real property for the entity.
  - No, because the employee’s compensation is not tied to the real estate transaction.
  - Yes, because negotiating a purchase for the company requires a real estate license.
  - Yes, because the employee receives valuable consideration from the transaction.
key: A
explanation: Section 535.5(c)(1) exempts an employee employed by a business entity for the purpose
  of buying, selling, or leasing real property for that entity from licensing requirements. The
  exemption applies regardless of how the employee is compensated, so the option stating that the
  employee does not need a license because compensation is not tied to the transaction is incorrect.
