stem: A limited liability company receives compensation on behalf of a licensed sales agent for
  referral services, performs no other brokerage acts, is registered with the Texas Real Estate
  Commission, and is 60% owned by the sales agent. Under Texas Occupations Code §1101.355, is the
  LLC required to be licensed as a broker?
options:
  - Under Texas Occupations Code §1101.355, the limited liability company must be licensed as a
    broker because any entity receiving compensation must be licensed.
  - Under Texas Occupations Code §1101.355, the limited liability company is not required to be
    licensed as a broker because it meets all exceptions in subsection (d).
  - Under Texas Occupations Code §1101.355, the limited liability company must be licensed as a
    broker because it is not a corporation.
  - Under Texas Occupations Code §1101.355, the limited liability company is not required to be
    licensed as a broker only if it is owned less than fifty-one percent by the license holder.
key: B
explanation: Section 1101.355(d) provides that a business entity is not required to be licensed if
  it receives compensation on behalf of a license holder, performs no other brokerage acts, is an
  LLC or S corporation, is registered with the commission, and is at least 51% owned by the license
  holder. The LLC satisfies all these conditions, so it is exempt. The statement that any entity
  receiving compensation must be licensed is incorrect because the exemption applies despite receipt
  of compensation.
