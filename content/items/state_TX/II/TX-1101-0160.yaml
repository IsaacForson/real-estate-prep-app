stem: A license holder who is an associated broker has already submitted their mailing address,
  business address, business telephone number, and business e-mail address to the Commission.
  According to Texas Occupations Code §1101.552(e) (effective January 1, 2026), what additional
  information must the license holder provide?
options:
  - Proof of completing the required continuing education
  - A fingerprint card for background check
  - The name of the broker with whom they are associated
  - A copy of their most recent sales contract
key: C
explanation: Subsection (e) requires an associated broker to provide the name of the broker with
  whom they are associated in addition to the contact information. The other options are not
  mandated by this subsection for renewal.
