stem: An employee of a Texas limited liability company is assigned to purchase an office building
  for the company's use. The employee negotiates the purchase price, signs the contract, and
  receives a salary but no commission or other fee for the transaction. Under the Texas Occupations
  Code, is the employee required to hold a real estate license to perform these activities?
options:
  - No, because the employee receives only a salary and no commission, which automatically exempts
    them from licensing.
  - No, because negotiating a purchase price and signing a contract are acts that require a broker
    license.
  - No, because any person who negotiates a real estate transaction must be licensed regardless of
    compensation.
  - No, because the employee is acting as a financial manager of an investment in real estate, which
    is exempt from licensing.
key: D
explanation: Under Tex. Occ. Code §1101.004(b)(2), a person is not engaged in real estate brokerage
  if they are sponsoring, promoting, managing, or otherwise participating as a principal, partner,
  or financial manager of an investment in real estate. The employee negotiates the purchase and
  signs the contract while receiving a salary, acting as a financial manager for the LLC's
  investment, so no license is required. The distractor that focuses solely on receiving no
  commission is incorrect because the exemption depends on the nature of the activity, not the
  compensation form.
