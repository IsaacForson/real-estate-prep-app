key: B
explanation: Under TREC rules, an initial sales agent license requires completion of 180 hours of
  qualifying real estate courses, comprising 60 hours of Principles of Real Estate, 30 hours each of
  Law of Agency, Law of Contracts, Promulgated Contracts Forms, and Real Estate Finance. The other
  options represent incorrect totals that do not match the sum of the required course hours.
