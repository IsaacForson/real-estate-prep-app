stem: A 17‑year‑old applicant has had their disabilities of minority removed. Under Texas
  Administrative Code §535.51(b)(2), can the applicant be licensed as a real estate sales agent?
options:
  - The applicant may be licensed if they turn 18 within the next six months.
  - The applicant may be licensed because removal of disabilities of minority satisfies the age
    requirement.
  - The applicant may be licensed if they provide proof of emancipation.
  - The applicant may not be licensed because they must be at least 18 years of age.
key: D
explanation: Under Texas Administrative Code §535.51(b)(2), removal of disabilities of minority does
  not affect the age requirement; an applicant must still be at least 18 years old to be eligible
  for a real estate sales agent license. Therefore, the statement that the applicant may not be
  licensed because they must be at least 18 years of age is correct. The claim that the applicant
  may be licensed if they turn 18 within the next six months is incorrect because the rule requires
  the applicant to already be 18 at the time of application, not merely to reach that age soon. The
  claim that the applicant may be licensed because removal of disabilities of minority satisfies the
  age requirement is incorrect because the rule states that such removal does not affect the age
  requirement. The claim that the applicant may be licensed if they provide proof of emancipation is
  incorrect because emancipation does not override the statutory age minimum; the applicant must
  still be 18.
