stem: A license holder stops using an alternate name on April 2. What is the latest date the license
  holder may notify the Commission and sponsoring broker about the cessation?
options:
  - The license holder must notify the Commission and sponsoring broker by April 22.
  - The license holder must notify the Commission and sponsoring broker by April 12.
  - The license holder must notify the Commission and sponsoring broker by April 30.
  - The license holder must notify the Commission and sponsoring broker by April 10.
key: B
explanation: The rule requires notification within 10 days after stopping use; April 2 plus 10 days
  equals April 12. April 10 is only 8 days after the stop date, which does not meet the requirement.
