stem: A license holder receives a written request from the Texas Real Estate Commission for
  additional information regarding their renewal application. The license holder does not provide
  the requested information within 30 days. What is the likely consequence under 22 Tex. Admin. Code
  §535.91(a)(4)?
options:
  - The license holder's renewal application is automatically denied
  - The license holder must pay a civil penalty of five hundred dollars
  - The license holder may face possible disciplinary action
  - The license holder's license is immediately suspended by the commission
key: C
explanation: The same rule provides that failure to supply requested information within the required
  timeframe is grounds for disciplinary action, so the license holder may face possible disciplinary
  action. The distractor about paying a fine is incorrect because the rule does not specify a fine;
  it only indicates that the omission may lead to disciplinary proceedings.
