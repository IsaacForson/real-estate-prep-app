stem: A broker who lives in Oklahoma holds an active Texas real estate license and conducts all
  business remotely. Under Texas Occupations Code §1101.552, which statement is correct regarding
  the broker’s office requirement?
options:
  - The broker must maintain a fixed office in Texas.
  - The broker must designate an office address on the license.
  - The broker is not required to maintain a fixed office in Texas.
  - The broker must submit an address change within 10 days of moving.
key: C
explanation: Subsection (d) explicitly states that a nonresident licensed broker is not required to
  maintain a place of business in this state. The broker resides in Oklahoma and holds a Texas
  license, so the exemption applies. A frequent error is to assume all brokers must maintain a fixed
  office in Texas, which only applies to resident brokers under subsection (a).
