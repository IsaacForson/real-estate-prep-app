stem: A person employed by an owner in the sale of structures and land on which the structures are
  located, where the structures were erected by the owner in the course of the owner's business,
  asks whether this activity constitutes real estate brokerage under Texas Occupations Code
  §1101.005. What is the correct conclusion?
options:
  - Under Texas Occupations Code §1101.005, a person employed by an owner in the sale of structures
    is engaged in real estate brokerage because they are selling structures.
  - Under Texas Occupations Code §1101.005, a person employed by an owner in the sale of structures
    is not engaged in real estate brokerage if the structures were erected by the owner in the
    course of the owner's business.
  - Under Texas Occupations Code §1101.005, a person employed by an owner in the sale of structures
    is engaged in real estate brokerage only if they receive a commission.
  - Under Texas Occupations Code §1101.005, a person employed by an owner in the sale of structures
    is not engaged in real estate brokerage only if they hold a real estate license.
key: B
explanation: Section 1101.005(6) exempts a person employed by an owner in the sale of structures
  erected by the owner in the course of the owner's business from being considered engaged in real
  estate brokerage. Therefore, the person is not engaged in brokerage. The claim that holding a real
  estate license is required for this exemption is incorrect because the exemption applies
  regardless of licensure.
