stem: Under Texas Occupations Code §1101.355(a)(2), what is the minimum errors and omissions
  insurance limit a business entity must maintain if its designated broker owns less than 10 percent
  of the entity?
options:
  - $1,000,000
  - $750,000
  - $2,000,000
  - $500,000
key: A
explanation: The statute requires the entity to maintain errors and omissions insurance with a
  minimum annual limit of $1 million for each occurrence when the designated broker owns less than
  10 percent of the business entity. The $500,000 distractor reflects half the required amount and
  does not satisfy the statutory minimum.
