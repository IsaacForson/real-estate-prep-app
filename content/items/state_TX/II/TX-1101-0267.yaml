stem: Under Texas Occupations Code §1101.401(f), how long does an applicant have to satisfy the
  examination requirement after filing a license application?
options:
  - Six months.
  - Nine months.
  - Twelve months.
  - Eighteen months.
key: C
explanation: Under Texas Occupations Code §1101.401(f), an applicant must satisfy the examination
  requirement not later than one year after filing the license application. One year equals twelve
  months, so the correct answer is the option stating 'Twelve months.' The nine‑month option is a
  common misconception but does not match the statutory period.
