stem: A license holder attends continuing education courses that are offered in 2‑hour segments each
  day. What is the minimum number of days the license holder must attend to satisfy the total
  continuing education requirement under Texas Occupations Code §1101.455?
options:
  - 9 days
  - 7 days
  - 8 days
  - 10 days
key: C
explanation: Subsection (b) requires at least 15 classroom hours of continuing education for
  renewal. Attending 2‑hour segments each day, eight days yield 16 hours, meeting the minimum; seven
  days provide only 14 hours, which is insufficient. The distractor of seven days is tempting
  because it is close to the required total, but it falls short of the 15‑hour minimum.
