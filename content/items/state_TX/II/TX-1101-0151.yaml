stem: A license holder’s assistant contacts property owners to ask if they would like to list their
  homes for sale but does not negotiate or show the property. Does the assistant need a real estate
  license under Texas rule?
options:
  - Yes, because soliciting listings requires a license.
  - No, because the assistant is not negotiating or showing the property.
  - No, because the assistant is employed by a license holder.
  - Yes, but only if the assistant also shows the property.
key: A
explanation: Section 535.4(f) states that a license is required for a person to solicit listings or
  to negotiate in Texas for listings. Since the assistant is soliciting listings, a license is
  required regardless of whether they negotiate or show the property.
