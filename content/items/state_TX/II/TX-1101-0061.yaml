  - receive a referral fee from a lender for services.
  - advertise a property for sale on behalf of another.
key: A
explanation: Under 22 Tex. Admin. Code § 535.4(c), a person must be licensed to show a property
  unless exempted. Preparing a comparative market analysis for use is not a licensable act under
  this provision. Advertising a property for sale on behalf of another requires a license only when
  combined with accepting inquiries and referring them to the owner, so merely advertising does not
  trigger the requirement. Receiving a referral fee from a lender is not listed as a licensable act
  under this rule.
