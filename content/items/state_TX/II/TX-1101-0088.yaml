stem: A broker renews an active license on May 1 without completing the required continuing
  education, pays the deferral fee, and defers the outstanding CE. If the broker does not submit
  proof of completion by the end of the deferral period, what status will the license have according
  to 22 Tex. Admin. Code §535.91(h)(2)?
options:
  - Active license
  - Inactive status
  - Revoked license
  - Suspended license
key: B
explanation: According to 22 Tex. Admin. Code §535.91(h)(2), if the broker fails to provide evidence
  of completed continuing education within the 60‑day deferral period, the license is placed on
  inactive status. An active license would only be maintained if the proof were submitted on time.
