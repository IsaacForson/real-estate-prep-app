  Agency, 30 Law of Contracts, 30 Promulgated Contracts Forms, and 30 Real Estate Finance. Having
  completed 120 hours, the applicant needs the remaining 60 hours to reach the total. The distractor
  of 30 hours reflects only one of the two remaining courses."
