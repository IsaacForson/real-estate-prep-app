stem: An applicant for an initial Texas sales agent license has completed 60 hours of Principles of
  Real Estate, 30 hours of Law of Agency, and 30 hours of Law of Contracts. How many additional
  classroom hours must the applicant complete in the remaining required courses to meet the
  education requirement for an initial sales agent license?
