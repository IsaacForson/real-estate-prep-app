stem: An inactive sales agent in Texas wishes to show a residential property to a prospective buyer.
  According to TREC rules, what must the sales agent do before conducting the showing?
options:
  - Pay the biennial renewal fee to the commission
  - Submit a written notice to the Texas Real Estate Commission
  - Complete 30 hours of qualifying continuing education
  - Obtain sponsorship from an active Texas licensed broker
key: D
explanation: An inactive sales agent may not practice as a licensed sales agent until sponsored by
  an active Texas licensed broker. Completing CE, submitting notice, or paying fees does not satisfy
  the sponsorship requirement.
