stem: A business entity seeks a broker license. Its designated broker owns 5 percent of the entity.
  According to Texas Occupations Code §1101.355(a)(2), what is the minimum errors and omissions
  insurance limit the entity must maintain?
options:
  - $500,000
  - $1,000,000
  - $750,000
  - $2,000,000
key: B
explanation: Because the designated broker owns less than 10 percent of the entity, the statute
  mandates a minimum errors and omissions insurance limit of $1 million per occurrence. The $750,000
  distractor falls short of this requirement and would not satisfy the rule.
