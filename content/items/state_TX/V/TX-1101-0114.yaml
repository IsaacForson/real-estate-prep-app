stem: According to TREC rules, under what condition may a broker accept a net listing?
options:
  - The principal requests the net listing and appears familiar with current market values.
  - The broker obtains written consent from the principal’s attorney.
  - The broker discloses the net amount to the buyer before signing.
  - The property is appraised by a licensed appraiser within 30 days.
key: A
explanation: The rule states a broker may not take net listings unless the principal requires a net
  listing and the principal appears to be familiar with current market values of real property. The
  other options describe actions not required by the rule for a net listing.
