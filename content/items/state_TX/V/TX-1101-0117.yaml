stem: Which of the following is a ground for disciplinary action related to contract terms?
options:
  - Fails to advise a buyer in writing before closing that the buyer should have the abstract
    examined or obtain title insurance
  - Fails to provide, on request, a copy of a document relating to a real estate transaction to a
    person who signed the document
  - Fails to specify a definite termination date in a contract, other than a contract for property
    management services
  - Fails to deposit, within a reasonable time, money received as escrow or trust funds in a real
    estate transaction
key: C
explanation: >-
  The Texas Occupations Code §1101.652(b)(12) provides that failing to specify a definite
  termination date in a contract (other than a property‑management contract) is a ground for
  disciplinary action. Therefore the option stating that a licensee fails to specify a definite
  termination date in a contract, other than a contract for property management services, is
  correct.


  The other options describe different violations: advising a buyer to have the abstract examined or
  obtain title insurance relates to disclosure duties; providing a copy of a signed document on
  request concerns record‑keeping obligations; and failing to deposit escrow or trust funds promptly
  pertains to trust accounting requirements. None of these are contract‑term grounds under
  §1101.652(b)(12).
