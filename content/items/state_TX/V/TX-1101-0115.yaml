stem: A sponsoring broker authorizes a sales agent to show a property and receive offers, but the
  agent also negotiates the purchase price and prepares a purchase agreement without the broker’s
  written authorization. Under TREC rules, who is responsible for the agent’s actions?
options:
  - The broker is responsible because the agent acted beyond the authorized scope.
  - The sales agent is solely responsible because they performed the negotiation.
  - The broker is responsible only if the agent had a written contract with the buyer.
  - The sales agent and broker share responsibility equally unless the broker limited the scope in
    writing.
key: A
explanation: The rule provides that if a broker permits a sponsored sales agent to conduct
  activities beyond the scope explicitly authorized, those acts are for which the broker is
  responsible. The agent is not solely liable, and the broker’s responsibility does not depend on a
  written contract with the buyer.
