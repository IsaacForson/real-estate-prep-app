  url: null
  quoted_text: For every two experience points above the minimum 720 points, credit for one classroom
    hour of the related education will be awarded.
  secondary: []
math:
  worked_solution: |-
    800 - 720 = 80
    80 / 2 = 40
  formulas:
    - Credit hours = (Experience points - 720) / 2
