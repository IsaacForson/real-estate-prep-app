stem: An applicant for a Texas broker license has 800 qualifying experience points. How many
  classroom hours of related education credit may be awarded for points above the 720‑point minimum?
options:
  - 50 hours
  - 40 hours
  - 30 hours
  - 20 hours
key: B
explanation: For each two experience points above the 720‑point minimum, one classroom hour of
  related education credit is awarded. With 800 points, the excess is 80 points, which yields 40
  classroom hours (80 ÷ 2). The distractors result from using the wrong divisor or miscalculating
  the excess points.
