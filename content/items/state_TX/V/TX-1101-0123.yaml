stem: Under Tex. Prop. Code § 5.008(e), which of the following transfers is exempt from the seller's
  disclosure requirement?
options:
  - Transfer where the seller is a licensed real estate broker.
  - Transfer where the property is located in a floodplain.
  - Transfer pursuant to a court order or foreclosure sale.
  - Transfer of a residence previously occupied for six months.
key: C
explanation: The statute explicitly exempts transfers made pursuant to a court order or foreclosure
  sale from the seller's disclosure requirement. The other options describe transfers that are not
  listed as exemptions in subsection (e).
