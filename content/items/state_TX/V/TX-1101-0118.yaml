stem: A license holder receives an earnest money deposit of $5,000 and holds it in their personal
  account for two weeks before depositing it into an escrow account. Which ground for disciplinary
  action does this conduct violate under Tex. Occ. Code §1101.652?
options:
  - Fails to deposit, within a reasonable time, money received as escrow or trust funds in a real
    estate transaction
  - Fails to advise a buyer in writing before closing that the buyer should have the abstract
    examined or obtain title insurance
  - Fails to provide, on request, a copy of a document relating to a real estate transaction to a
    person who signed the document
  - Fails to specify a definite termination date in a contract, other than a contract for property
    management services
key: A
explanation: The key is correct because subsection (b)(30) requires license holders to deposit
  escrow or trust funds within a reasonable time; holding the deposit in a personal account for two
  weeks violates this requirement. The most tempting distractor is the option that concerns failing
  to specify a definite termination date in a contract (other than a property management contract);
  while also a ground under (b)(28), it does not pertain to the handling of escrow funds.
