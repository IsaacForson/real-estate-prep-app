stem: A license holder wishes to let a prospective tenant tour a vacant rental property without
  supervision. Under TREC rules, which of the following is required for the license holder to permit
  this unescorted access?
options:
  - The property owner signs a written consent in bold 12‑point font noting awareness of unescorted
    access and assigning damage responsibility.
  - The license holder obtains a verbal agreement from the tenant to return the keys after viewing.
  - The license holder records a video tour and shares it with the tenant instead of granting
    physical access.
  - The license holder ensures the property is occupied by a current resident to deter unauthorized
    entry.
key: A
explanation: The rule allows unescorted access only if the property owner has signed a written
  consent in bold 12‑point font stating awareness of unescorted access and specifying who is
  responsible for damage. The other options do not satisfy this requirement.
