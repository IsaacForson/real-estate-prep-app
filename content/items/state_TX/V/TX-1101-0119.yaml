stem: A license holder lists a property for sale and, without disclosing this to the buyer, also
  makes an offer to purchase the same property as an undisclosed principal. Which ground for
  disciplinary action does this conduct violate under Tex. Occ. Code §1101.652?
options:
  - Fails to avoid acting as broker and undisclosed principal in a real estate transaction
  - Fails to deposit, within a reasonable time, money received as escrow or trust funds in a real
    estate transaction
  - Fails to advise a buyer in writing before closing that the buyer should have the abstract
    examined or obtain title insurance
  - Fails to provide, on request, a copy of a document relating to a real estate transaction to a
    person who signed the document
key: A
explanation: The key is correct because Tex. Occ. Code §1101.652(b)(16) identifies acting in a dual
  capacity as broker and undisclosed principal as a ground for discipline; failing to avoid such
  conduct constitutes the prohibited act. The most tempting distractor concerns escrow deposit
  timing, which is also a ground under (b)(30) but is unrelated to dual representation.
