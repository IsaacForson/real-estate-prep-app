stem: Under TREC rules, what must a listing agreement include if a net listing is used?
options:
  - The listing agreement must assure the principal of not less than the principal's desired price
    and limit the broker to a specified maximum commission.
  - The listing agreement must allow the broker to retain any amount over the principal's desired
    price as additional commission.
  - The listing agreement must require the broker to disclose any personal interest in the property
    to the principal.
  - The listing agreement must specify that the broker's commission is a fixed percentage of the
    sale price.
key: A
explanation: >-
  According to 22 Tex. Admin. Code ch. 535 §535.16, if a net listing is used the listing agreement
  must assure the principal of receiving no less than the principal's desired price and must limit
  the broker to a specified maximum commission. The option that matches this requirement states that
  the agreement assures the principal of not less than the desired price and limits the broker to a
  specified maximum commission.


  The option suggesting the broker may retain any amount over the desired price as additional
  commission is incorrect because net listings prohibit the broker from keeping excess proceeds as
  extra commission; the agreement must cap the broker's compensation.


  The option requiring disclosure of any personal interest in the property, while a general duty, is
  not the specific rule governing net listings.


  The option stating the commission must be a fixed percentage of the sale price is incorrect
  because net listings do not use a fixed percentage; instead the commission is limited by the
  agreed maximum.
