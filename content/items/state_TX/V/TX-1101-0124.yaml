stem: A seller enters into an executory contract to sell residential property but does not provide
  the seller's disclosure notice at that time. Three days later, the seller provides the notice, and
  the purchaser receives it. According to Tex. Prop. Code § 5.008(f), what is the purchaser's right
  regarding termination?
options:
  - Yes, the purchaser may terminate the contract within seven days after receiving the notice.
  - No, the purchaser may not terminate the contract because the notice was eventually provided.
  - Yes, the purchaser may terminate the contract only if notice was given before contract signing.
  - No, the purchaser must terminate the contract before the contract signing date of the agreement.
key: A
explanation: The statute states that if a contract is entered without the seller providing the
  required notice, the purchaser may terminate for any reason within seven days after receiving the
  notice. The notice was provided late, so the purchaser still has the seven‑day window after
  receipt. The distractor incorrectly limits termination to cases where notice was given before
  contract signing.
