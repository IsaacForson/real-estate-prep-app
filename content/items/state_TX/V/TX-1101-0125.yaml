stem: A seller is aware that a previous occupant died of natural causes in the property. According
  to Tex. Prop. Code § 5.008(c), is the seller required to disclose this death to the buyer?
options:
  - No, the seller is only required to disclose deaths resulting from accidents related to the
    property's condition.
  - Yes, the seller must disclose a death by natural causes if the buyer asks about it.
  - Yes, the seller must disclose any death that occurred on the property regardless of cause.
  - No, the seller is not required to disclose a death by natural causes that occurred on the
    property.
key: D
explanation: Subsection (c) expressly states that a seller has no duty to disclose information about
  a death by natural causes on the property. Therefore, the seller is not required to disclose such
  a death. The distractor incorrectly asserts a duty to disclose any death regardless of cause,
  which the statute excludes.
citation:
