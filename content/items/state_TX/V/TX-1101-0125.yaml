    5.008(c)
  url: null
  quoted_text: A seller or seller's agent shall have no duty to make a disclosure or release
    information related to whether a death by natural causes, suicide, or accident unrelated to the
    condition of the property occurred on the property or whether a previous occupant had, may have
    had, has, or may have AIDS, HIV related illnesses, or HIV infection.
