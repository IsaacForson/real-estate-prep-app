stem: A broker who is the exclusive listing agent for a seller receives an offer on the property.
  Under Tex. Occ. Code § 1101.557, what must the broker do with that offer?
options:
  - Hold the offer until a second offer arrives for side-by-side review
  - Present the offer to the seller regardless of the broker's own opinion
  - Forward the offer to the buyer's lender before informing the seller
  - Reject the offer if the broker believes a higher offer will follow soon
key: B
explanation: Section 1101.557(b) obligates a broker who represents a party under an exclusive
  listing to present any offer to that party, regardless of the broker's personal assessment of its
  merits.
