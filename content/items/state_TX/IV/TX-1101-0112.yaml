stem: A broker receives a letter from the Texas Real Estate Commission regarding a rule change.
  Under 22 Tex. Admin. Code §535.2(k), what must the broker do with respect to sponsored sales
  agents?
options:
  - Deliver the letter to sponsored sales agents within three calendar days after receipt
  - Forward the letter to the sponsoring broker only and keep a copy for the office records
  - Post the letter on the broker's website within five business days for agents to review
  - Read the letter aloud at the next office meeting and discuss its implications with the team
key: A
explanation: The rule requires that a sponsoring broker deliver mail and other correspondence from
  the Commission to sponsored sales agents within three calendar days after receipt. Forwarding only
  to the sponsoring broker, posting online, or reading aloud at a meeting do not satisfy this
  specific delivery requirement.
