    TAC viewer, rule PDFs generated live — § 535.2"
  url: null
  quoted_text: A sponsoring broker or supervisor delegated under subsection (e) of this section shall
    deliver mail and other correspondence from the Commission to their sponsored sales agents within
    three calendar days after receipt.
