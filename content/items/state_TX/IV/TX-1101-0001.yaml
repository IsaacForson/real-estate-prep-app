stem: Under the Texas Occupations Code, when must a license holder who represents a party in a
  proposed real estate transaction disclose that representation to another party to the transaction?
options:
  - At the time of formally signing the closing documents
  - At the time of first contact with the other party or their license holder
  - At the time of depositing earnest money into an escrow trust account
  - At the time of the parties' full execution of a written residential sales contract
key: B
explanation: Section 1101.558(b) requires a representing license holder to disclose that
  representation at the time of first contact with another party or that party's license holder,
  well before a contract is signed, earnest money is handled, or closing occurs.
citation:
  source: Tex. Occ. Code § 1101.558
  url: null
  quoted_text: >-
    A license holder who represents a party in a proposed real estate transaction shall disclose,
    orally or in writing, that representation at the time of the license holder's first contact
    with:


    (1) another party to the transaction; or


    (2) another license holder who represents another party to the transaction.
