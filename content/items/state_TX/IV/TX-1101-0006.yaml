stem: A broker has agreed in a single transaction to represent both the buyer and the seller. Given
  this dual representation, what does the Texas Occupations Code require of the broker?
options:
  - The broker must agree to act as an intermediary between the buyer and the seller
  - The broker must immediately terminate representation of whichever party signed second
  - The broker must transfer the buyer's representation agreement to another brokerage
  - The broker must refund all fees already collected from both represented parties
key: A
explanation: Section 1101.561(b) requires a broker to agree to act as an intermediary whenever the
  broker agrees to represent both a buyer or tenant and a seller or landlord in the same
  transaction, rather than terminating or transferring one representation.
citation:
  source: Tex. Occ. Code § 1101.561
  url: null
  quoted_text: >-
    A broker must agree to act as an intermediary under this subchapter if the broker agrees to
    represent in a transaction:


    (1) a buyer or tenant; and


    (2) a seller or landlord.
