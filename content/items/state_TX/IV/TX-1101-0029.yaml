stem: A broker gives a sponsored sales agent written authorization to handle only residential
  leasing activities. Under 22 Tex. Admin. Code § 535.2, is the broker responsible for the agent's
  leasing activities performed within that written authorization?
options:
  - Yes, provided the broker personally supervises each leasing transaction
  - No, sponsorship does not create any broker responsibility for those acts
  - No, unless the sales agent's license had already become inactive
  - Yes, the broker is responsible for the sales agent's authorized acts
key: D
explanation: Section 535.2(a) makes a broker responsible for the authorized acts of a sponsored
  sales agent once the scope of authority has been given in writing, even though the broker need not
  directly supervise the agent.
