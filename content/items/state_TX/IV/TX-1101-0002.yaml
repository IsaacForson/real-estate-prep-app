stem: A broker expects to receive a rebate from a home warranty company after closing a sale. Before
  accepting that rebate, TREC rules require the broker to do what regarding the client?
options:
  - Wait until closing and then split the rebate evenly with the client
  - Deposit the anticipated rebate into the brokerage's general operating account
  - Disclose the intended rebate to the client and obtain the client's consent
  - Notify the warranty company that no disclosure to the client is required
key: C
explanation: Section 535.148(a) prohibits a license holder from receiving a commission, rebate, or
  fee from someone other than the person the license holder represents without first disclosing the
  arrangement to the client and obtaining the client's consent.
citation:
  source: 22 Tex. Admin. Code § 535.148
  url: null
  quoted_text: |-
    A license holder may not receive a commission, rebate, or fee in a transaction
    from a person other than the person the license holder represents without first
    disclosing to the license holder's client that the license holder intends to receive the
    commission, rebate, or fee, and obtaining the consent of the license holder's client.
