stem: A buyer agrees to pay a home inspector for the inspection service. The broker representing the
  seller wishes to accept a rebate from the inspector after closing. Under 22 Tex. Admin. Code
  §535.148(b), what must the broker do before accepting the rebate?
options:
  - The license holder must disclose the rebate to the buyer and obtain the buyer's consent
  - The license holder must disclose the rebate to the seller and obtain the seller's consent
  - The license holder must disclose the rebate to both parties and obtain consent from both
  - The license holder may accept the rebate without any disclosure because the inspector is not a
    party to the transaction
key: A
explanation: Under 22 Tex. Admin. Code §535.148(b), if a party the license holder does not represent
  agrees to pay a service provider, the license holder must obtain that party’s consent to accept a
  fee, commission, or rebate from the service provider. In this scenario the buyer pays the
  inspector and is not represented by the broker, so the broker must disclose the rebate to the
  buyer and get the buyer’s consent. The statement that the broker should disclose to the seller and
  obtain the seller’s consent is incorrect because the seller is the broker’s client and the rule
  requires consent from the non‑represented party, which is the buyer.
