stem: A broker has agreed in writing to represent both the buyer and the seller in the same sale.
  Under Tex. Occ. Code § 1101.561, what is the broker required to do?
options:
  - Agree to act as an intermediary between the buyer and the seller
  - Withdraw from representing whichever party signed the agreement last
  - Refer one of the parties to a broker at a different brokerage firm
  - Terminate both representation agreements and refund any fees paid
key: A
explanation: Section 1101.561(b) makes intermediary status mandatory once a broker agrees to
  represent both a buyer or tenant and a seller or landlord in the same transaction.
citation:
  source: Tex. Occ. Code § 1101.561
  url: null
  quoted_text: "A broker must agree to act as an intermediary under this subchapter if the broker
    agrees to represent in a transaction: (1) a buyer or tenant; and (2) a seller or landlord."
