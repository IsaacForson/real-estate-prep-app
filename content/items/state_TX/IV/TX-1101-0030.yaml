stem: Under 22 Tex. Admin. Code § 535.16, what is a 'net listing'?
options:
  - A listing where the commission equals proceeds minus an amount the owner wants
  - A listing where the commission rate is a flat percentage disclosed to the buyer
  - A listing where the broker pays the seller's closing costs from the commission
  - A listing where no commission is owed unless the sale price beats the appraisal
key: A
explanation: Section 535.16(b) defines a net listing as an arrangement where the broker's commission
  equals the difference between the sales proceeds and the amount the owner desires to receive.
citation:
  source: 22 Tex. Admin. Code § 535.16
  url: null
  quoted_text: A "net listing" is a listing agreement in which the broker's commission is the
    difference ("net") between the sales proceeds and an amount desired by the owner of the real
    property.
