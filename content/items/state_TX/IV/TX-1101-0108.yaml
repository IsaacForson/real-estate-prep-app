    TAC viewer, rule PDFs generated live — § 535.2"
  url: null
  quoted_text: A broker shall provide the name of each delegated supervisor to the Commission using a
    process acceptable to the Commission within 30 days of any such delegation that has lasted or is
    anticipated to last more than three consecutive months.
