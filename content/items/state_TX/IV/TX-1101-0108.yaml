stem: A broker delegates a sales agent to act as a supervisor for a team of three other sales
  agents, expecting the arrangement to last six months. What must the broker do regarding the
  Commission under 22 Tex. Admin. Code §535.2(e)?
options:
  - Submit a new sponsorship agreement to the Commission for approval
  - Obtain written consent from each sales agent before the delegation
  - Provide the name of the delegated supervisor to the Commission within 30 days
  - Notify the sales agents of the delegation within two calendar days
key: C
explanation: Because the delegation is anticipated to last more than three consecutive months, the
  broker must provide the name of each delegated supervisor to the Commission within 30 days.
  Obtaining consent from sales agents is not required by this rule, notifying agents within two days
  applies to a different provision, and submitting a sponsorship agreement is not specified here.
