stem: A broker acting as an intermediary wants to appoint one associated sales agent to a buyer and
  another to the seller. Under Tex. Occ. Code § 1101.560, what must the broker provide to all
  parties before the appointment takes effect?
options:
  - A revised commission agreement signed by both appointed sales agents
  - A verbal explanation of the appointment given to the appointed agents
  - A copy of each appointed agent's most recent license renewal receipt
  - Written notice of the appointment given to each party
key: D
explanation: Section 1101.560(b) requires the broker to provide written notice of the appointment to
  all parties in the transaction before an associated license holder may be appointed as an
  intermediary contact.
