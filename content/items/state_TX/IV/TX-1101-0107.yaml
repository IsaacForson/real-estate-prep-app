stem: Under 22 Tex. Admin. Code §535.2, what is a broker required to do regarding a sponsored sales
  agent's authorized activities?
options:
  - Obtain written consent from the sponsored sales agent before any activity is undertaken
  - Notify the sponsored sales agent in writing of the scope of authorized activities
  - Supervise the sponsored sales agent directly on a daily basis as required
  - Limit the sponsored sales agent's activities to residential leasing only unless otherwise
    authorized
key: B
explanation: The rule explicitly states that a broker must notify a sponsored sales agent in writing
  of the scope of the agent's authorized activities under the Act. Supervising directly is not
  required, obtaining consent is not mentioned, and limiting activities to leasing only is not a
  general requirement.
