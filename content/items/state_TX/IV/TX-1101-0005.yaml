stem: A broker acting as an intermediary wants two different sales agents from the same office to
  work separately with the buyer and the seller. What must the broker do to appoint those agents?
options:
  - File a separate brokerage license application for each appointed agent
  - Obtain a new real estate license for the transaction from the commission
  - Transfer the existing listing agreement to a newly selected sponsoring broker for each separate
    agent
  - Appoint one associated license holder to each party under the written intermediary consent
key: D
explanation: Section 1101.560(a) allows a broker who has complied with the intermediary consent
  requirements to appoint one associated license holder to communicate with and carry out the
  instructions of one party and another to do the same for the other party.
citation:
  source: Tex. Occ. Code § 1101.560
  url: null
  quoted_text: >-
    A broker who complies with the written consent requirements of Section 1101.559 may appoint:


    (1) a license holder associated with the broker to communicate with and carry out instructions
    of one party to a real estate transaction; and


    (2) another license holder associated with the broker to communicate with and carry out
    instructions of any other party to the transaction.
