stem: A sponsored sales agent, under the broker's sponsorship, begins managing rental properties for
  a client, including collecting rent and arranging repairs. According to 22 Tex. Admin. Code §
  535.2(d), what is the broker's responsibility regarding these activities?
options:
  - The broker is responsible for the property management activities because they require a real
    estate license.
  - The broker must obtain a separate property management license for the sales agent to perform
    those activities.
  - The broker is not responsible for the property management activities because the sales agent is
    acting independently.
  - The broker is responsible for the property management activities only if they exceed a certain
    dollar amount.
key: A
explanation: The broker is responsible for any property‑management activity performed by a sponsored
  sales agent that requires a real‑estate license. Collecting rent and arranging repairs are
  property‑management acts that require a license, so the broker bears responsibility for those
  acts. The claim that the broker is not responsible because the agent acts independently misstates
  the rule; sponsorship creates liability regardless of independence. The claim that a separate
  property‑management license is needed for the agent confuses licensing requirements; the agent’s
  existing real‑estate license covers the activity, and the broker’s responsibility does not hinge
  on obtaining an additional license. The claim that responsibility depends on a dollar amount adds
  a condition not found in the rule; the rule applies to any licensed property‑management activity,
  irrespective of value.
