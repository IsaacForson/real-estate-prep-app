stem: A listing broker plans to accept a rebate from a moving company that is not a party to the
  transaction. Under 22 Tex. Admin. Code § 535.148, what must the broker do before accepting the
  rebate?
options:
  - Disclose the rebate to the client and obtain the client's consent
  - Deposit the rebate into the trust account pending court instructions
  - File a written report of the rebate with the sponsoring broker's office
  - Disclose the rebate to the buyer's broker after closing occurs
key: A
explanation: Section 535.148(a) conditions a license holder's receipt of a commission, rebate, or
  fee from someone other than their own client on disclosing the payment to that client and
  obtaining the client's consent before accepting it.
citation:
  source: 22 Tex. Admin. Code § 535.148
  url: null
  quoted_text: A license holder may not receive a commission, rebate, or fee in a transaction from a
    person other than the person the license holder represents without first disclosing to the
    license holder's client that the license holder intends to receive the commission, rebate, or
    fee, and obtaining the consent of the license holder's client.
