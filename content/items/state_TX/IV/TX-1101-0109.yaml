stem: Under Tex. Occ. Code § 1101.558(c)(1), a license holder is **NOT** required to provide the
  written notice described in Subsection (b-1) if the proposed transaction is for which of the
  following?
options:
  - A. A residential lease for less than one year where a sale is also being considered.
  - B. A residential lease for less than one year and a sale is not being considered.
  - C. A commercial lease for any duration where the tenant is represented by another broker.
  - D. A residential lease for exactly one year with no sale contemplated.
key: B
explanation: The statute exempts a license holder from providing the written notice when the
  transaction is a residential lease for less than one year and a sale is not being considered. The
  option stating 'A residential lease for less than one year and a sale is not being considered'
  matches this condition exactly. The option stating 'A residential lease for less than one year
  where a sale is also being considered' does not qualify because a sale being considered removes
  the exemption.
