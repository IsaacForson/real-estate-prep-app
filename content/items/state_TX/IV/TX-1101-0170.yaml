stem: Under 22 Tex. Admin. Code § 535.2(b), what is a broker obliged to convey to the principal?
options:
  - The broker must convey only information that the principal requests in writing regarding the
    transaction.
  - The broker must convey all information known to the agent that may affect the principal's
    decision, unless prohibited by other law.
  - The broker must convey any information that could increase the broker's commission.
  - The broker must convey information about competing offers after a contract is signed.
key: B
explanation: Under 22 Tex. Admin. Code § 535.2(b) a broker has the highest fiduciary duty to the
  principal and must disclose any information the broker knows that could influence the principal’s
  decision, except when another law prohibits the disclosure. Limiting disclosure to written
  requests, to information that would raise the broker’s commission, or to competing offers after a
  contract is signed does not meet this duty.
