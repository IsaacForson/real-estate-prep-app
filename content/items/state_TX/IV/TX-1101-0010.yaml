stem: Under the Texas Occupations Code, what is a person prohibited from doing unless the person
  holds a license issued under Chapter 1101?
options:
  - Serving as a witness to the signing of a real estate sales contract
  - Owning residential real property held for personal investment purposes
  - Acting as or representing that the person is a broker or sales agent
  - Attending an open house hosted by a licensed real estate brokerage
key: C
explanation: Section 1101.351(a) provides that unless a person holds a license issued under Chapter
  1101, the person may not act as or represent that the person is a broker or sales agent, or act as
  a residential rental locator.
citation:
  source: Tex. Occ. Code § 1101.351
  url: null
  quoted_text: |-
    Unless a person holds a license issued under this chapter, the person may not:

    (1) act as or represent that the person is a broker or sales agent; or

    (2) act as a residential rental locator.
