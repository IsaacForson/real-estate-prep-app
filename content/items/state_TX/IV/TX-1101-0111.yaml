stem: A broker pays a title company for a title search that was actually performed at market rates.
  Under 22 Tex. Admin. Code § 535.148(h)(2), is this payment prohibited?
options:
  - A. Yes, because the broker did not disclose the payment to the client.
  - C. Yes, because the title company is a settlement service provider and the broker represents a
    party.
  - D. No, because the broker must obtain the client's consent before paying any settlement service
    provider.
  - B. No, because a payment at market rates for services actually performed is exempt from
    prohibition.
key: D
explanation: Subsection 535.148(h)(2) expressly excludes from prohibition any payment at market
  rates for goods actually furnished or services actually performed. Since the title search was
  performed at market rates, the payment is allowed. The option stating that the broker must obtain
  the client's consent before paying any settlement service provider is incorrect because this
  exemption does not require consent.
