stem: A broker receives an earnest money deposit from a buyer. According to 22 Tex. Admin. Code §
  535.2(c), what is the broker's responsibility regarding this trust fund?
options:
  - Deposit the funds into the broker's personal account and track them separately in the books.
  - Hold the funds in a non-interest-bearing account without any special controls.
  - Properly handle the trust funds and comply with §535.146 concerning trust money.
  - Return the funds to the buyer immediately unless the seller requests otherwise.
key: C
explanation: Under 22 Tex. Admin. Code § 535.2(c), a broker must properly handle trust funds and
  comply with §535.146 concerning trust money. Depositing the funds into the broker's personal
  account, even if tracked separately, is improper because it commingles trust money with personal
  funds. Holding the funds in a non‑interest‑bearing account without any special controls fails to
  meet the required safeguards for trust money. Returning the funds to the buyer immediately unless
  the seller requests otherwise is not required by the rule. Only the option that states the broker
  must properly handle the trust funds and follow §535.146 reflects the correct responsibility.
