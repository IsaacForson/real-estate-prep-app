stem: A broker representing a seller also accepts a fee from the buyer for the same sale, without
  telling the seller. Under Tex. Occ. Code § 1101.652, why does this conduct expose the broker's
  license to suspension or revocation?
options:
  - The broker violated a net listing agreement by capping the seller's proceeds
  - The broker failed to file a timely education report with the commission
  - The broker received compensation from more than one party without consent
  - The broker exceeded the maximum commission rate set by the commission
key: C
explanation: Section 1101.652(b)(8) lists receiving compensation from more than one party to a
  transaction without the full knowledge and consent of all parties as a ground for suspending or
  revoking a license.
