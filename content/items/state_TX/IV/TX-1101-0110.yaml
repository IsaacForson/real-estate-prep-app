stem: A broker representing a buyer signs an agreement with a mortgage broker that requires the
  broker to refer clients exclusively to that mortgage broker and not to refer to any other mortgage
  broker. Under 22 Tex. Admin. Code § 535.148(c), is this agreement permissible?
options:
  - A. Yes, because the broker disclosed the agreement to the client and obtained the client's
    consent.
  - B. Yes, because the mortgage broker is a service provider and the broker is providing services
    for it.
  - C. No, because the contract prohibits the broker from offering similar services for a competing
    service provider.
  - D. No, because the broker must obtain the client's consent before signing any agreement with a
    service provider.
key: C
explanation: Section 535.148(c) prohibits a license holder from entering into an agreement with a
  service provider when the agreement bars the license holder from offering similar services for a
  competing service provider, provided the license holder provides services for that service
  provider. The described agreement meets both conditions, so it is not permissible. The assertion
  that the broker must obtain the client's consent before signing any agreement with a service
  provider is incorrect because it overlooks the prohibition against restricting similar services
  for competing providers.
