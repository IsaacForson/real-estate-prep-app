stem: Under Tex. Occ. Code § 1101.558, at what point must a license holder representing a party in a
  proposed transaction disclose that representation?
options:
  - After the transaction has closed and commission has been paid
  - After the other party has signed a written offer to purchase
  - When a title company requests proof of representation in writing
  - At the license holder's first contact with another party
key: D
explanation: Section 1101.558(b) requires disclosure of representation, orally or in writing, at the
  time of the license holder's first contact with another party or that party's license holder, not
  at some later stage of the deal.
