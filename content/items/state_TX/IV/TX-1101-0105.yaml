stem: Under 22 Tex. Admin. Code § 535.2(a), what must a broker do regarding a sponsored sales
  agent's authorized activities?
options:
  - Submit a written scope to the Texas Real Estate Commission for approval before the agent begins
    work.
  - Allow the sales agent to determine the scope of activities based on market demand.
  - Verbally inform the sales agent of the permitted activities at the start of each month.
  - Notify the sales agent in writing of the scope of the sales agent's authorized activities.
key: D
explanation: The rule states a broker is required to notify a sponsored sales agent in writing of
  the scope of the sales agent's authorized activities under the Act. The other options either omit
  the writing requirement, delegate scope-setting to the agent, or add an unnecessary Commission
  approval step.
