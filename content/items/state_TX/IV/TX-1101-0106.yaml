stem: A broker representing a seller learns from the broker's sales agent that the property's roof
  has leaked in the past. Under 22 Tex. Admin. Code § 535.2(b), what must the broker do with this
  information?
options:
  - Only disclose the information if the buyer specifically asks about the roof.
  - Disclose the information to the seller because it may affect the seller's decision.
  - Wait until after the sale closes to inform the seller of the past leak.
  - Keep the information confidential to avoid alarming the seller.
key: B
explanation: The rule requires a broker to convey to the principal all information known to the
  agent which may affect the principal's decision, unless prohibited by other law. The past roof
  leak is information that may affect the seller's decision, so the broker must disclose it to the
  seller. The other options either withhold material information, condition disclosure on buyer
  request, or delay disclosure improperly.
