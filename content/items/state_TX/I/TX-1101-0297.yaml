stem: Under Tex. Occ. Code § 1101.701(c), what action may the Texas Real Estate Commission take
  regarding a proceeding to impose an administrative penalty?
options:
  - Combining penalty proceeding with disciplinary proceeding to suspend or revoke license
  - Ordering the licensee to pay a refund to the affected consumers
  - Requiring the licensee to attend a fair‑housing training course
  - Publishing the violation notice in a statewide newspaper publication
key: A
explanation: The statute states the commission may combine a proceeding to impose an administrative
  penalty with another disciplinary proceeding, including a proceeding to suspend or revoke a
  license. The other options are not authorized by this provision.
