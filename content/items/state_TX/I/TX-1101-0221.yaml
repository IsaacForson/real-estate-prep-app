stem: Under Tex. Occ. Code § 1101.610(a), what is the maximum amount that may be paid from the real
  estate recovery trust account for claims, including attorney's fees, interest, and court costs,
  arising out of a single transaction?
options:
  - $250,000
  - $125,000
  - $200,000
  - $500,000
key: B
explanation: The statute explicitly states that payments from the trust account for claims arising
  out of a single transaction may not exceed $125,000, regardless of the number of claimants. This
  limit applies to the total of damages, attorney's fees, interest, and court costs. The $200,000
  distractor exceeds the statutory cap and is therefore incorrect.
