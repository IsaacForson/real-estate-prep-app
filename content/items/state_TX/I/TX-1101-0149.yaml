stem: A violation of the Real Estate License Act occurred in Dallas County, but the defendant
  resides in Tarrant County. Under Tex. Occ. Code § 1101.752(b), in which county may the commission
  bring an injunctive action?
options:
  - Either Tarrant County or Tarrant County.
  - Either Dallas County or Ellis County.
  - Either Dallas County or Dallas County.
  - Either Dallas County or Tarrant County.
key: D
explanation: Tex. Occ. Code § 1101.752(b) allows the commission to bring suit in the county where
  the violation occurred or where the defendant resides, providing a choice of either venue. The
  distractor "Only in Dallas County" is wrong because the statute also permits suit in the
  defendant's county of residence.
