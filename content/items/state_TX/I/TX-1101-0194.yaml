stem: A consumer experienced alleged misconduct by a licensee on June 1, 2020, and submitted a
  signed, written complaint to the Texas Real Estate Commission on July 1, 2025. Under Tex. Occ.
  Code § 1101.204(c), may the commission investigate the licensee based on this complaint?
options:
  - The commission may not investigate because the complaint was submitted after the fourth
    anniversary of the incident.
  - The commission may investigate because the complaint was submitted within four years of the
    incident.
  - The commission may not investigate unless the licensee consents to the investigation.
  - The commission may investigate only if the consumer provides additional evidence of harm.
key: A
explanation: The complaint was submitted on July 1, 2025, which is after the fourth anniversary of
  the June 1, 2020 incident (June 1, 2024). Section 1101.204(c) prohibits investigations based on
  complaints submitted later than the fourth anniversary of the incident. The distractor claiming
  the complaint was within four years is incorrect because the dates show it exceeds that period.
citation:
  source: Tex. Occ. Code ch. 1101 — Texas Occupations Code Chapter 1101 — Real Estate Brokers and
