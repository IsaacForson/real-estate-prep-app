    JavaScript shell — § 1101.204
  url: null
  quoted_text: (c) The commission may not conduct an investigation of a person licensed under this
    chapter or Chapter 1102 in connection with a complaint submitted later than the fourth
    anniversary of the date of the incident that is the subject of the complaint.
