stem: A licensee continues to fail to return earnest money for 7 consecutive days. Under Tex. Occ.
  Code § 1101.702(a), how may the commission treat each day that the violation continues when
  calculating administrative penalties?
options:
  - As a violation only if it exceeds 30 days
  - As a violation only if reported by a consumer
  - As a single violation regardless of duration
  - As a separate violation for each day
key: D
explanation: Tex. Occ. Code § 1101.702(a) states that each day a violation continues may be
  considered a separate violation for penalty purposes, so the commission treats each day as a
  separate violation. The option describing a single violation regardless of duration contradicts
  this provision.
