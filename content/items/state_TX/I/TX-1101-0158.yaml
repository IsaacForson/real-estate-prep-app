stem: A claimant obtains a judgment of $200,000 against a license holder for a single transaction.
  Under Tex. Occ. Code § 1101.610(a), what is the maximum amount that may be paid from the trust
  account for this claim?
options:
  - $100,000.
  - $250,000.
  - $125,000.
  - $200,000.
key: C
explanation: The key is correct because § 1101.610(a) limits payments from the trust account for a
  single transaction to $125,000, regardless of the judgment amount. The option stating '$200,000.'
  is incorrect because it ignores the statutory cap and suggests the full judgment may be paid.
citation:
  source: Tex. Occ. Code ch. 1101 — Texas Occupations Code Chapter 1101 — Real Estate Brokers and
    Sales Agents (The Real Estate License Act), official Texas Legislature Online statute page read
    via Internet Archive capture of 2025-12-07 because statutes.capitol.texas.gov now serves only a
    JavaScript shell — § 1101.610
  url: null
  quoted_text: Payments from the trust account for claims, including attorney's fees, interest, and
    court costs, arising out of a single transaction may not exceed a total of $125,000
  secondary: []
math:
  worked_solution: The statute caps payment from the trust account for a single transaction at
    $125,000. Therefore, regardless of the $200,000 judgment, the maximum payable amount is
    $125,000.
  formulas:
    - Maximum payment = statutory cap = $125,000
