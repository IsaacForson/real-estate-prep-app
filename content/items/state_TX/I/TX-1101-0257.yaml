stem: A consumer files a signed, written complaint with the Texas Real Estate Commission alleging
  that a licensee failed to disclose a material defect. What must the commission provide to both the
  complainant and the licensee under Texas Occupations Code § 1101.202(b)?
options:
  - The commission must provide information about appropriate state or local agencies only to the
    license holder
  - The commission must provide both an explanation of available remedies and information about
    appropriate state or local agencies to both parties
  - The commission must provide either an explanation of available remedies or information about
    appropriate state or local agencies to both parties
  - The commission must provide an explanation of available remedies only to the complainant
key: B
explanation: The law obligates the commission to give both an explanation of available remedies and
  information about appropriate state or local agencies to each party involved in the complaint.
  This is detailed in subsection (b) of Section 1101.202. The distractor "either an explanation. or
  information" is wrong because the statute requires both items, not a choice between them.
citation:
  source: Tex. Occ. Code § 1101.202(b)
  url: null
  quoted_text: "(b) The commission shall provide to a person who files a complaint with the commission
    relating to a license holder and to the license holder against whom the complaint is filed: (1)
    an explanation of the remedies that are available to the person under this chapter; and (2)
    information about appropriate state or local agencies or officials with whom the person may file
    a complaint."
