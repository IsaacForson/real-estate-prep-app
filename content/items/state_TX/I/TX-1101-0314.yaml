stem: A licensee violates a commission rule by failing to disclose a material defect in a single
  transaction. What is the maximum administrative penalty the Texas Real Estate Commission may
  impose for this violation?
options:
  - $5,000
  - $10,000
  - $1,000
  - $2,500
key: A
explanation: Under Tex. Occ. Code § 1101.702(a), the commission may not exceed $5,000 for each
  violation, making $5,000 the correct maximum. The $10,000 option incorrectly doubles the statutory
  limit, while $2,500 and $1,000 understate the allowable penalty.
