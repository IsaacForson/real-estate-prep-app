stem: An aggrieved person gives written notice of a claim to the commission and judgment debtor on
  March 1, 2026, and files an application for payment from the trust account on March 22, 2026.
  Under Tex. Occ. Code § 1101.606(b), by what date must the person schedule a hearing to avoid
  waiver of recovery?
options:
  - March 22, 2026
  - March 1, 2027
  - March 22, 2027
  - March 21, 2027
key: D
explanation: The statute provides that recovery is waived if a hearing is not scheduled before the
  first anniversary of the date the application was filed. The application was filed March 22, 2026,
  so the first anniversary is March 22, 2027; scheduling must occur before that date, making March
  21, 2027 the latest permissible date. Scheduling on the anniversary date (March 22, 2027) would
  result in waiver.
