stem: A licensee continues to advertise properties without including the required license number in
  the advertisement for five consecutive days. Under Tex. Occ. Code § 1101.702(a), what is the
  maximum administrative penalty the commission may impose for this continuing violation?
options:
  - $15,000
  - $5,000
  - $10,000
  - $25,000
key: D
explanation: Each day a violation continues may be considered a separate violation, and the penalty
  may not exceed $5,000 per violation. Five days × $5,000 = $25,000. The distractor $15,000
  incorrectly assumes only three days constitute separate violations.
citation:
  source: Tex. Occ. Code ch. 1101 — Texas Occupations Code Chapter 1101 — Real Estate Brokers and
    Sales Agents (The Real Estate License Act), official Texas Legislature Online statute page read
    via Internet Archive capture of 2025-12-07 because statutes.capitol.texas.gov now serves only a
    JavaScript shell — § 1101.702
  url: null
  quoted_text: The amount of an administrative penalty may not exceed $5,000 for each violation. Each
    day a violation continues or occurs may be considered a separate violation for purposes of
    imposing a penalty.
