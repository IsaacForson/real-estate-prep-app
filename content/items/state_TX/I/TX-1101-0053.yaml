stem: A buyer obtains a $200,000 judgment against a licensee for misrepresentations in a single
  sale. After the judgment is satisfied only partially, the buyer seeks payment from the real estate
  recovery trust account. What is the maximum amount payable from the trust account for this claim,
  including attorney's fees and court costs?
options:
  - $200,000
  - $250,000
  - $125,000
  - $150,000
key: C
explanation: Under Tex. Occ. Code § 1101.610(a), payments from the trust account for claims arising
  out of a single transaction—including attorney's fees, interest, and court costs—may not exceed
  $125,000. Because the judgment exceeds this per‑transaction cap, the most that can be paid from
  the trust account for this claim is the statutory limit of $125,000.
