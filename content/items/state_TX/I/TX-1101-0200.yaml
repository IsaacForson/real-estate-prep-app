stem: Under Tex. Occ. Code § 1101.752(c), what may an injunctive action be brought to do?
options:
  - Revoke the license of the violator under this chapter as authorized by law
  - Abate or temporarily or permanently enjoin an act or to enforce this chapter
  - Impose administrative penalties on the violator under this chapter as authorized by law
  - Assess criminal fines for the violation under this chapter as authorized by law
key: B
explanation: "Tex. Occ. Code § 1101.752(c) provides that an injunctive action may be brought to
  abate, or to temporarily or permanently enjoin, an act, or to enforce the chapter. Consequently,
  the answer that states an injunction may be used to abate or temporarily or permanently enjoin an
  act or to enforce the chapter is the correct one. The other choices describe powers that are not
  granted by this subsection: revoking a license, imposing administrative penalties, and assessing
  criminal fines are addressed elsewhere in the code but not under the injunctive‑action provision."
