stem: A consumer submits a signed, written complaint alleging that a licensee failed to disclose a
  material defect. The complaint includes photographs of the defect. Under Texas Occupations Code §
  1101.204(b), when may the commission investigate the licensee?
options:
  - The commission may investigate only if the complaint is filed within one year of the incident.
  - The commission may investigate if the complaint and any evidence provide reasonable cause for an
    investigation.
  - The commission may investigate only after receiving an anonymous complaint.
  - The commission may investigate only if the licensee has prior disciplinary action.
key: B
explanation: The statute requires both a signed, written complaint and that the complaint and any
  evidence provide reasonable cause for an investigation before the commission must investigate. The
  correct option states that the commission may investigate if the complaint and any evidence
  provide reasonable cause for an investigation. The option stating that the commission may
  investigate only if the complaint is filed within one year of the incident is incorrect because
  the statute does not impose a one‑year filing limit; the time bar is based on the fourth
  anniversary of the incident, not one year.
