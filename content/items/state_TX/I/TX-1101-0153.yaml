stem: A consumer obtains a court judgment for $200,000 arising from a single transaction against a
  license holder for a violation covered by the real estate recovery trust account. What is the
  maximum amount that may be paid from the trust account for this claim, including attorney's fees
  and court costs?
options:
  - $200,000.
  - $250,000.
  - $0.00.
  - $125,000.
key: D
explanation: Under Tex. Occ. Code § 1101.610(a), payments from the trust account for a single
  transaction, including attorney's fees and court costs, cannot exceed a total of $125,000,
  regardless of the number of claimants or the size of the judgment. Therefore, even though the
  judgment is $200,000, the most that can be paid from the trust account for this claim is $125,000.
