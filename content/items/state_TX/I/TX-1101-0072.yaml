stem: After the Texas Real Estate Commission determines that a person has violated Chapter 1101,
  which of the following may bring an injunctive action in the name of the state to abate or enjoin
  the violation?
options:
  - The federal Department of Justice is authorized to bring the injunctive action.
  - The commission’s legal staff is authorized to bring the injunctive action.
  - The attorney general or a county or district attorney may bring the injunctive action.
  - Any licensed real estate broker may bring the injunctive action.
key: C
explanation: Under Tex. Occ. Code §1101.752(e), after the commission determines a violation, the
  attorney general or the county or district attorney in the appropriate county may bring an action
  in the name of the state. The federal Department of Justice is not authorized to bring the
  injunctive action; the commission must act through the attorney general, not its own legal staff.
citation:
  source: Tex. Occ. Code ch. 1101 — Texas Occupations Code Chapter 1101 — Real Estate Brokers and
    Sales Agents (The Real Estate License Act), official Texas Legislature Online statute page read
    via Internet Archive capture of 2025-12-07 because statutes.capitol.texas.gov now serves only a
    JavaScript shell — § 1101.752
  url: null
  quoted_text: (e) If the commission determines that a person has violated or is about to violate this
    chapter, the attorney general or the county attorney or district attorney in the county in which
    the violation has occurred or is about to occur or in the county of the defendant's residence
    may bring an action in the name of the state in the district court of the county to abate or
    temporarily or permanently enjoin the violation or to enforce this chapter.
