stem: "Under Tex. Occ. Code §1101.752(b), an injunctive action to enforce the Real Estate License
  Act may be brought in the district court of the county where:"
options:
  - the violation occurred or is about to occur, but not where the defendant resides
  - the defendant resides, regardless of where the violation occurred
  - either the violation occurred or is about to occur or the defendant resides
  - the commission's headquarters is located in Austin, Texas
key: C
explanation: Tex. Occ. Code §1101.752(b) provides that venue lies in the county where the violation
  occurred or is about to occur, or where the defendant resides. Either location satisfies the
  requirement. Limiting venue to the commission’s headquarters is incorrect because the statute does
  not list that as a permissible venue. Limiting venue to only where the violation occurred or is
  about to occur is incorrect because the statute also allows venue where the defendant resides.
  Limiting venue to only where the defendant resides is incorrect because the statute also allows
  venue where the violation occurred or is about to occur.
citation:
