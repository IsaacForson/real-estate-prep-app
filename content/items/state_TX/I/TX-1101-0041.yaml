stem: Under Tex. Occ. Code § 1101.752(a), what action may the commission, acting through the
  attorney general, bring if it determines a person has violated or is about to violate the chapter?
options:
  - The commission may require extra continuing education
  - The commission may bring an action to abate or enjoin a violation
  - The commission may impose a civil monetary penalty
  - The commission may issue a cease-and-desist order
key: B
explanation: Tex. Occ. Code § 1101.752(a) authorizes the commission, acting through the attorney
  general, to bring an action to abate or enjoin a violation or potential violation of the chapter
  or a commission rule. Therefore, the option stating that the commission may bring an action to
  abate or enjoin a violation is correct. The options describing requiring extra continuing
  education, imposing a civil monetary penalty, or issuing a cease-and-desist order are not
  authorized under this subsection; the statute does not permit those actions in this provision.
