stem: A consumer pays $3,200 to a licensee for a property‑management service. If the Texas Real
  Estate Commission orders a refund as part of an informal settlement, what is the maximum amount
  the commission may require the licensee to refund?
options:
  - $1,600
  - $2,400
  - $3,200
  - $4,000
key: C
explanation: Tex. Occ. Code § 1101.659 limits a refund ordered by the commission to no more than the
  amount the consumer actually paid for the regulated service. The consumer paid $3,200, so the
  greatest refund the commission can require is $3,200.
citation:
  source: Tex. Occ. Code ch. 1101 — Texas Occupations Code Chapter 1101 — Real Estate Brokers and
    Sales Agents (The Real Estate License Act), official Texas Legislature Online statute page read
    via Internet Archive capture of 2025-12-07 because statutes.capitol.texas.gov now serves only a
    JavaScript shell — § 1101.659
  url: null
  quoted_text: The amount of a refund ordered as provided in an agreement resulting from an informal
    settlement conference or an enforcement order may not exceed the amount the consumer paid to the
    person for a service or accommodation regulated by this commission.
  secondary: []
math:
  worked_solution: |-
    Maximum refund = amount paid for the service
    = $3,200
    Therefore the commission may require a refund of up to $3,200.
  formulas:
    - Maximum Refund = Amount Paid
