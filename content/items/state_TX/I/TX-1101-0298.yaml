stem: A licensee is found to have violated advertising rules by failing to include the required
  license number in online ads. The Texas Real Estate Commission decides to impose an administrative
  penalty. Under Tex. Occ. Code § 1101.701(c), what additional action may the commission take in
  conjunction with the penalty proceeding?
options:
  - Ordering the licensee to pay a refund to the affected consumers
  - Combining penalty proceeding with disciplinary proceeding to suspend or revoke license
  - Requiring the licensee to attend a fair‑housing training course
  - Publishing the violation notice in a statewide newspaper publication
key: B
explanation: The statute allows the commission to combine an administrative penalty proceeding with
  another disciplinary proceeding, such as a license suspension or revocation. Ordering a refund,
  requiring training, or publishing the violation are not authorized by this specific provision.
