stem: The Texas Real Estate Commission proposes to revoke a licensee's license. Under the Texas
  Occupations Code, what is the licensee entitled to?
options:
  - A hearing conducted by the State Office of Administrative Hearings.
  - An automatic suspension of the license while the appeal is pending.
  - A refund of any fees paid to the commission for licensing services.
  - A requirement to complete additional continuing education hours each year.
key: A
explanation: Section §1101.657(a) provides that a person whose license is proposed for denial,
  suspension, or revocation is entitled to a hearing conducted by the State Office of Administrative
  Hearings. Therefore, the licensee is entitled to such a hearing. An automatic suspension pending
  appeal is not provided for by the statute, making that option incorrect.
