stem: Under Tex. Occ. Code § 1101.601(b), what must be true for a license or certificate holder to
  be eligible for reimbursement from the real estate recovery trust account?
options:
  - The license or certificate holder must have held the license for five consecutive years.
  - The license or certificate holder must have been licensed for at least one year prior to the act.
  - The license or certificate holder must have no prior disciplinary actions on record.
  - The license or certificate holder must have held the license or certificate at the time the act
    was committed.
key: D
explanation: The statute explicitly states that the license or certificate holder must have held the
  license or certificate at the time the act was committed for reimbursement eligibility. The other
  options impose additional requirements not found in the law, such as a minimum licensing period or
  a clean disciplinary record, which are not conditions for trust account payments.
