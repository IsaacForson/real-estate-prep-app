stem: Under Tex. Occ. Code § 1101.151(b)(1), the commission may adopt rules necessary to administer
  this chapter and Chapter 1102. The commission proposes a new rule requiring license holders to
  include their license number in all online advertisements. Which statement best describes the
  commission's authority to adopt this rule?
options:
  - The commission may adopt the rule only after a public hearing is conducted by the commission
    staff.
  - The commission may adopt the rule only if approved by the governor and the attorney general.
  - The commission may not adopt the rule because advertising is governed by federal law.
  - The commission may adopt the rule because it is necessary to administer the chapter.
key: D
explanation: The statute expressly authorizes the commission to adopt and enforce rules necessary to
  administer this chapter and Chapter 1102, so the proposed rule falls within that authority. The
  commission does not need gubernatorial approval to adopt such a rule.
