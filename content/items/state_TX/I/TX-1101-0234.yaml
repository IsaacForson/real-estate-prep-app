stem: A licensee failed to disclose a material defect on March 15, 2023. The consumer submitted a
  signed, written complaint to the Texas Real Estate Commission on March 10, 2026. Under Tex. Occ.
  Code § 1101.204(c), may the commission investigate the licensee based on this complaint?
options:
  - Yes, the commission may investigate because the complaint was submitted before the fourth
    anniversary of the incident.
  - Yes, the commission may investigate because the complaint includes written documentation.
  - No, the commission may not investigate because the complaint was submitted after the fourth
    anniversary of the incident.
  - No, the commission may not investigate because the complaint was submitted anonymously.
key: A
explanation: The statute bars investigations only when a complaint is submitted later than the
  fourth anniversary of the incident. Here the complaint was filed about three years after the
  incident, which is within the fourth anniversary, so the commission may investigate. The
  distractor that cites the complaint’s documentation is incorrect because timeliness, not
  documentation, governs the commission’s authority to investigate.
