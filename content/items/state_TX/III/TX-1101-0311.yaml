stem: Under TREC rule §535.154, how many days after a sponsored sales agent stops using a team name
  must the broker notify the Texas Real Estate Commission?
options:
  - Five days
  - Ten days
  - Twenty days
  - Fifteen days
key: B
explanation: The rule requires the broker to notify the Commission not later than the 10th day after
  the date the sponsored sales agent stops using a team name. Therefore, the correct interval is ten
  days. The distractors represent common misinterpretations of the deadline as shorter or longer
  periods.
citation:
  source: 22 Tex. Admin. Code § 535.154(c)(4)
  url: null
  quoted_text: A broker must notify the Commission using a process acceptable to the Commission not
    later than the 10th day after the date the associated broker or a sales agent sponsored by the
    broker stops using a team name.
