    .122, .146–.148, .154–.157; as in effect 2026-09-08), official Texas Secretary of State TAC
    viewer, rule PDFs generated live — § 535.155(c)"
  url: null
  quoted_text: "(c) For an advertisement on social media or by text, the information required by this
    section may be located on a separate page or on the account user profile page of the license
    holder, if the separate page or account user profile is: (1) readily accessible by a direct link
    from the social media or text; and (2) readily noticeable on the separate page or in the account
    user profile."
