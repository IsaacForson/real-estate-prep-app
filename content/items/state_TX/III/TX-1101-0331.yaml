stem: A license holder advertises a property on Instagram, posting only a photo and caption. The
  required license holder name and broker's name are located on the license holder's Instagram
  profile page, which is accessible via a link in the bio and is clearly visible on that page. Under
  §535.155(c), is this advertisement compliant?
options:
  - No, because social media advertisements are exempt from this rule.
  - Yes, but only if the advertisement also includes the property's address.
  - No, because the required information must appear directly in the advertisement.
  - Yes, if the profile page is readily accessible by a direct link and readily noticeable on that
    page.
key: D
explanation: Subsection (c) permits the required information to be placed on a separate page or
  profile page provided it is readily accessible by a direct link and readily noticeable there. The
  scenario satisfies both conditions, making the advertisement compliant.
citation:
  source: "22 Tex. Admin. Code ch. 535 — 22 Tex. Admin. Code Chapter 535 — TREC General Provisions (19
