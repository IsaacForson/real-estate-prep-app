stem: According to 22 Tex. Admin. Code § 531.2, which of the following is required of a license
  holder acting as a fiduciary?
options:
  - To place the license holder's personal interest above that of the client
  - To withhold material facts from the client to benefit the license holder
  - To accept undisclosed compensation from a third party
  - To represent the client's interests while treating other parties fairly
key: D
explanation: Under 22 Tex. Admin. Code § 531.2, a license holder acting as a fiduciary must
  represent the client's interests while treating other parties fairly. Placing the license holder's
  personal interest above the client's interest violates the duty to subordinate personal interests.
  Withholding material facts from the client to benefit the license holder breaches the duty to
  disclose all pertinent information. Accepting undisclosed compensation from a third party
  conflicts with the duty to avoid hidden compensation that could impair loyalty to the client.
