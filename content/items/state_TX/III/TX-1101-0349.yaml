    JavaScript shell — § 1101.652(b)(22)
  url: null
  quoted_text: (22) negotiates or attempts to negotiate the sale, exchange, or lease of real property
    with an owner, landlord, buyer, or tenant with knowledge that that person is a party to an
    outstanding written contract that grants exclusive agency to another broker in connection with
    the transaction;
