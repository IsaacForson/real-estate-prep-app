stem: "A license holder knows that a seller has an exclusive listing agreement with another broker
  but still negotiates a purchase agreement directly with the seller. Under Tex. Occ. Code §
  1101.652(b)(22), this action is considered:"
options:
  - Considered permissible if the exclusive agency is disclosed
  - Considered permissible if the seller starts the negotiation
  - Considered prohibited because it ignores an existing exclusive agency
  - Considered permissible if the other broker consents in writing
key: C
explanation: The statute forbids negotiating with an owner, landlord, buyer, or tenant when the
  license holder knows that person is bound by an outstanding written contract granting exclusive
  agency to another broker. Because the license holder proceeded with negotiations despite knowing
  about the exclusive listing, the conduct is prohibited. The option suggesting permissibility if
  the exclusive agency is disclosed is incorrect because disclosure does not negate the prohibition.
