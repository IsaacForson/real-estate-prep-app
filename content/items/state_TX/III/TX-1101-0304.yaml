stem: A license holder representing a seller receives a rebate from a title company for referring
  closing business. Before accepting the rebate, what must the license holder do under 22 Tex.
  Admin. Code § 535.148(a)?
options:
  - The license holder must disclose the rebate to the client they represent and obtain the client's
    consent
  - The license holder must disclose the rebate to the closing agent and obtain the agent's consent
  - The license holder must disclose the rebate to the title company and obtain its consent
  - The license holder must disclose the rebate to the broker sponsoring them and obtain the
    broker's consent
key: A
explanation: Section 535.148(a) requires disclosure to the represented client and obtaining that
  client's consent before receiving any commission, rebate, or fee from a third party. The option
  stating that the license holder must disclose the rebate to the client they represent and obtain
  the client's consent satisfies this requirement; the other options misidentify the party whose
  consent is needed.
citation:
