    .122, .146–.148, .154–.157; as in effect 2026-09-08), official Texas Secretary of State TAC
    viewer, rule PDFs generated live — § 535.148(a)"
  url: null
  quoted_text: (a) A license holder may not receive a commission, rebate, or fee in a transaction from
    a person other than the person the license holder represents without first disclosing to the
    license holder's client that the license holder intends to receive the commission, rebate, or
    fee, and obtaining the consent of the license holder's client.
