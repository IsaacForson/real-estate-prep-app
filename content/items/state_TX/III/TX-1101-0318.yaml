stem: A Texas license holder enters into a written agreement to manage a rental property for a
  client. The agreement does not include a definite termination date. According to Tex. Occ. Code §
  1101.652(b)(12), is the license holder subject to disciplinary action for failing to specify a
  definite termination date?
options:
  - Yes, because contracts must have a definite termination date
  - No, because property management services contracts are exempt from that requirement
  - Yes, unless the client later agrees to a termination date in writing
  - No, if the agreement lasts less than six months
key: B
explanation: The rule provides an exemption for property management services contracts, so lacking a
  definite termination date does not violate the statute. Therefore, the license holder would not be
  subject to disciplinary action on that basis. The option claiming that all contracts must have a
  definite termination date ignores the statutory exemption.
