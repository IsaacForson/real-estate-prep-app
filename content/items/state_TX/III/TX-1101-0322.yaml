stem: A license holder representing a buyer receives a referral fee from a mortgage broker for
  referring a client to the mortgage broker. Before accepting the fee, what must the license holder
  do?
options:
  - Disclose the referral fee to the client they represent and obtain the client's consent
  - Obtain written consent from the sponsoring broker only
  - Accept the fee without disclosure because the mortgage broker is a service provider
  - Share the fee with the sponsoring broker before disclosing to the client
key: A
explanation: Under 22 Tex. Admin. Code § 535.148(a), a license holder may not receive a fee from a
  person other than the represented party without first disclosing the intent to receive that fee to
  the client and obtaining the client's consent. The option stating that the license holder should
  obtain written consent from the sponsoring broker only is incorrect because consent must come from
  the client, not just the sponsoring broker. The option stating that the fee can be accepted
  without disclosure because the mortgage broker is a service provider is incorrect because the rule
  applies regardless of the source of the fee; disclosure and consent are still required.
citation:
  source: 22 Tex. Admin. Code § 535.148(a)
  url: null
  quoted_text: A license holder may not receive a commission, rebate, or fee in a transaction from a
    person other than the person the license holder represents without first disclosing to the
    license holder's client that the license holder intends to receive the commission, rebate, or
    fee, and obtaining the consent of the license holder's client.
