stem: A broker employs an unlicensed assistant who only answers phones and files paperwork, does not
  engage in any activity requiring a real estate license, and does not hold themselves out as a
  broker. Under which condition may the broker share a commission with this assistant according to
  22 Tex. Admin. Code § 535.147(b)?
options:
  - Sharing a commission is permitted if the unlicensed assistant performs any act that requires a
    real estate license
  - Sharing a commission is permitted if the unlicensed assistant engages in no acts requiring a
    license and does not represent themselves as a broker
  - Sharing a commission is permitted if the unlicensed assistant receives a fixed fee instead of a
    commission share
  - Sharing a commission is permitted if the unlicensed assistant is a relative of the broker and
    performs only clerical tasks
key: B
explanation: Section 535.147(b) allows commission sharing with an unlicensed person only when they
  perform no licensed activity and do not hold themselves out as a broker. The correct option states
  that sharing a commission is permitted if the unlicensed assistant engages in no acts requiring a
  license and does not represent themselves as a broker; the other options either involve licensed
  activity or irrelevant factors.
