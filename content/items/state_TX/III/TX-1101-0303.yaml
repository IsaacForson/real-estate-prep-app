  url: null
  quoted_text: (b) An unlicensed person may share in the income earned by a business entity licensed
    as a broker or exempted from the licensing requirements under the Act if the person engages in
    no acts for which a license is required and does not lead the public to believe that the person
    is in the real estate brokerage business.
