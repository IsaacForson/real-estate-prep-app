stem: According to TREC's Canons of Professional Ethics, under what circumstance are special
  obligations imposed on a license holder?
options:
  - When a fiduciary relationship is created
  - When a service is advertised to the public
  - When a commission is received from a client
  - When a license is renewed annually
key: A
explanation: The canons state that special obligations are imposed when a fiduciary relationship is
  created, making C correct. Renewing a license, advertising, or receiving a commission do not
  trigger these special obligations.
