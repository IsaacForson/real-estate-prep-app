stem: A license holder meets a prospective buyer at an open house and provides general market trends
  without a written representation agreement. Which statement correctly reflects the fiduciary
  duties in § 531.2?
options:
  - The license holder is not required to place the buyer’s interests above all other parties
    because no fiduciary relationship exists.
  - The license holder is required to place the buyer’s interests above all other parties because
    the meeting creates a fiduciary relationship.
  - The license holder is required to treat the buyer fairly because the fiduciary obligations apply
    to all license holders regardless of representation.
  - The license holder is required to place no personal interest above that of the buyer because the
    duty applies to all license holders regardless of representation.
key: A
explanation: § 531.2 states, “A license holder, while acting as an agent for another, is a
  fiduciary,” and special obligations arise only when that relationship is created. Because the
  license holder is not acting as an agent, fiduciary duties such as placing the client’s interests
  first do not apply. The other options incorrectly extend fiduciary duties beyond their statutory
  trigger.
