stem: A sponsored sales agent stopped using a team name on August 3. By what date must the broker
  notify the Commission under TREC rule §535.154?
options:
  - August 12
  - August 13
  - August 14
  - August 23
key: B
explanation: The rule requires notification not later than the 10th day after the date the sponsored
  sales agent stops using a team name. Counting August 4 as day 1, the tenth day is August 13. Thus
  the broker must notify by August 13. The distractors arise from counting nine days, eleven days,
  or incorrectly adding twenty days.
citation:
  source: 22 Tex. Admin. Code § 535.154(c)(4)
  url: null
  quoted_text: A broker must notify the Commission using a process acceptable to the Commission not
    later than the 10th day after the date the associated broker or a sales agent sponsored by the
    broker stops using a team name.
