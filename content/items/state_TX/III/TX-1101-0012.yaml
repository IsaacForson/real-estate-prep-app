stem: According to TREC's Canons of Professional Ethics, what special obligation applies to a
  license holder in discharging professional responsibilities?
options:
  - An obligation to close every listed transaction within thirty calendar days of the initial
    listing agreement
  - An obligation to exercise integrity, including prudence and caution against misrepresentation
  - An obligation to disclose the license holder's personal net worth to clients
  - An obligation to advertise exclusively through commission-approved media
key: B
explanation: Section 531.3 imposes a special obligation on a license holder to exercise integrity in
  discharging responsibilities, which includes employing prudence and caution to avoid
  misrepresentation by acts of commission or omission.
citation:
  source: 22 Tex. Admin. Code § 531.3
  url: null
  quoted_text: |-
    A license holder has a special obligation to exercise integrity in the discharge of the
    license holder's responsibilities, including employment of prudence and caution so as
    to avoid misrepresentation, in any way, by acts of commission or omission.
