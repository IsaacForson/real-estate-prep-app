stem: A sales agent receives an earnest money check directly from a buyer. Under 22 Tex. Admin. Code
  § 535.146, what must the sales agent do with that money?
options:
  - Hold the money until the buyer's loan is fully approved by the lender
  - Immediately deliver the money to the sales agent's sponsoring broker
  - Return the money to the buyer pending the broker's later instructions
  - Deposit the money into the sales agent's own personal trust account
key: B
explanation: Section 535.146(b)(2) bars a sales agent from maintaining a trust account and requires
  the agent to immediately deliver any trust money received to the sponsoring broker.
