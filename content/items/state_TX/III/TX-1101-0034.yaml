stem: A certificate holder negotiating a pipeline easement gives the property owner a written notice
  before the owner is obligated to transfer the easement. Under Tex. Occ. Code § 1101.653, what must
  that notice include?
options:
  - A copy of the certificate holder's registration exam score report
  - A statement advising the party that the party may seek representation
  - A signed waiver releasing the certificate holder from liability claims
  - A statement guaranteeing the owner the highest price in the county
key: B
explanation: Section 1101.653(6) requires the written notice given before an easement or
  right-of-way transaction to advise the party that the party may seek representation from a lawyer
  or broker.
