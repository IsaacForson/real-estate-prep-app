stem: Which of the following is **NOT** a circumstance under which a license holder may be
  disciplined for misrepresentation, dishonesty, or fraud when selling, buying, trading, or leasing
  real property under Tex. Occ. Code § 1101.652(a‑1)(1)?
options:
  - Acting in the license holder's own name as the listed sales agent
  - Acting in the license holder's spouse's name for the transaction
  - Acting in the name of a first‑degree relative of the license holder
  - Acting in the name of a licensed real estate broker from another state
key: D
explanation: Tex. Occ. Code § 1101.652(a‑1)(1) provides that discipline is warranted when a license
  holder engages in misrepresentation, dishonesty, or fraud while acting in the name of (1) the
  license holder himself or herself, (2) the license holder’s spouse, or (3) a first‑degree
  relative. Because acting in the name of a licensed broker from another state is not one of the
  enumerated situations, it does not constitute a disciplinary ground under this provision.
