stem: A license holder stopped using an alternate name on January 12 and notified the Commission on
  January 20 but did not notify the sponsoring broker. Under 22 Tex. Admin. Code § 535.154(b)(3), is
  this notification compliant?
options:
  - The license holder’s notification is compliant because notifying one party satisfies the
    requirement.
  - The license holder’s notification is non‑compliant because notification must be made within five
    days.
  - The license holder’s notification is compliant because the Commission was notified within ten
    days.
  - The license holder’s notification is non‑compliant because the sponsoring broker was not
    notified.
key: D
explanation: The rule requires notification to both the Commission and the sponsoring broker within
  ten days after stopping use. Failing to notify the sponsoring broker violates the requirement,
  making the notification non‑compliant. The idea that notifying one party is enough contradicts the
  explicit dual‑notice mandate.
