stem: Under 22 Tex. Admin. Code § 535.154, what action triggers the requirement for a license holder
  to notify the Texas Real Estate Commission within 10 days?
options:
  - Renewing an existing alternate name registration
  - Changing the spelling of an existing alternate name
  - Ceasing to use an alternate name in advertising
  - Beginning to use an alternate name in advertising
key: C
explanation: The rule states that a license holder must notify the Commission and their sponsoring
  broker not later than the 10th day after they stop using an alternate name. Thus ceasing use of
  the name triggers the notification requirement. Beginning use, renewing registration, or merely
  changing the spelling does not trigger this duty.
