stem: Under Tex. Occ. Code § 1101.652(b)(12), which type of contract is exempt from the requirement
  to specify a definite termination date that is **NOT** subject to prior notice?
options:
  - A contract for the sale of residential real property
  - A contract for the lease of commercial real property
  - A contract to perform property management services
  - A contract for a real estate option agreement
key: C
explanation: The statute explicitly excludes contracts to perform property management services from
  the requirement to specify a definite termination date. Therefore, a property management services
  contract is the correct answer. A contract for the sale or lease of real property is not exempt,
  so those options are incorrect.
