stem: A license holder is preparing a settlement statement for a client and notices a small
  arithmetic error in the credited amounts. What must the license holder do to be scrupulous and
  meticulous in performing their functions?
options:
  - To leave the error as is and note it in the file
  - To correct the error before presenting the statement to the client
  - To ignore the error because it is insignificant
  - To inform the client that the error will be adjusted at closing
key: B
explanation: Fidelity demands being scrupulous and meticulous in performing functions, which
  requires correcting the error before presenting the statement. Ignoring the error because it is
  insignificant fails to meet the meticulous standard.
