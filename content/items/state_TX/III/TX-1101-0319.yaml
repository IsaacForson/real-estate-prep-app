stem: A license holder is hired to conduct a market analysis for a commercial property and agrees to
  provide ongoing consulting services without a set end date. The services are not related to
  property management. Under Tex. Occ. Code § 1101.652(b)(12), may the license holder be disciplined
  for **NOT** specifying a definite termination date?
options:
  - No, because consulting services are exempt like property management
  - Yes, as long as the license holder provides monthly reports to the client
  - Yes, because the exemption applies to contracts to perform property management services
  - No, unless the client verbally agrees to an open-ended arrangement
key: C
explanation: The exemption applies solely to contracts to perform property management services;
  consulting services contracts are not covered by that exception. Consequently, failing to specify
  a definite termination date in a consulting agreement could lead to disciplinary action. The
  option stating that consulting services are exempt misreads the scope of the exemption.
