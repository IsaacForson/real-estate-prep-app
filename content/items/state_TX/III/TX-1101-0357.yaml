stem: According to 22 Tex. Admin. Code § 535.155(b)(1), which of the following is **NOT** included
  in the definition of 'Advertisement'?
options:
  - A) A communication from a license holder to the license holder's current client
  - A) An email newsletter sent to prospective clients announcing new listings
  - A) A business card displaying the license holder's name and phone number
  - A) A newspaper advertisement offering a free home valuation to prospective buyers
key: A
explanation: The rule explicitly states that an advertisement does not include a communication from
  a license holder to the license holder's current client. A brochure, billboard, and social media
  advertisement are all forms of communication designed to attract the public and therefore are
  included in the definition of advertisement.
