    TAC viewer, rule PDFs generated live — § 535.155 § 535.155(b)(1)"
  url: null
  quoted_text: "Advertisement does not include: (A) a communication from a license holder to the
    license holder's current client; and (B) a directional sign that may also contain only the
    broker's name or logo."
