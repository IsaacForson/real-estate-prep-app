stem: What is the maximum number of days after a closing that an advertisement may mention the
  property without needing to include the property's current status under TREC rule §535.155(d)(15)?
options:
  - 5 days
  - 9 days
  - 10 days
  - 15 days
key: B
explanation: The rule permits advertising about a property without the current status only for fewer
  than 10 days after closing; thus the maximum allowable is 9 days. The distractor of 10 days is
  wrong because at 10 days or more the current status must be included.
