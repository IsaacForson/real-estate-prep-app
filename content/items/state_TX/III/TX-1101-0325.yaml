stem: A license holder prepares a sales contract and leaves the purchase price blank, intending to
  fill it in later. According to TREC's Canons of Professional Ethics, what must the license holder
  do to avoid misrepresentation?
options:
  - The license holder should inform the other party that the price will be negotiated later.
  - The license holder should submit the contract as is, relying on verbal agreement for the price.
  - The license holder should leave the price blank but initial the line with the client’s signature.
  - The license holder should fill in all blanks before presenting the contract to any party.
key: D
explanation: The integrity rule in §531.3 obligates a license holder to exercise prudence and
  caution to avoid misrepresentation by acts of commission or omission. Leaving a material term
  blank constitutes an omission that could mislead parties, so the license holder must complete all
  blanks before presenting the contract. Initialing the blank or relying on later negotiation does
  not satisfy the duty to avoid misrepresentation.
