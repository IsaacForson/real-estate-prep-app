stem: A broker receives trust money from a transaction and the principals have not agreed in writing
  to a different deposit schedule. Under TREC's trust money rule, by when must the broker deposit
  that money into a trust account or deliver it to an authorized escrow agent?
options:
  - Not later than the close of business on the same calendar day the trust money is actually
    received
  - Not later than the tenth calendar day after the transaction closes
  - Not later than the end of the calendar month in which the money is received
  - Not later than the close of business of the second working day after receipt
key: D
explanation: Section 535.146(b)(3) sets the default deposit deadline at not later than the close of
  business of the second working day after the broker receives the trust money, absent a different
  written agreement among the principals.
citation:
  source: 22 Tex. Admin. Code § 535.146
  url: null
  quoted_text: Unless a different time to deposit trust money is expressly agreed upon in writing by
    the principals to the transaction, any trust money received by the broker must be deposited in a
    trust account or delivered to an authorized escrow agent within a reasonable time, which the
    Commission has determined to be not later than the close of business of the second working day
    after the date the broker receives the trust money.
