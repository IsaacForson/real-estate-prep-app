stem: A license holder completes a contract form for a lease that was adopted by the commission for
  that type of transaction. Under Tex. Occ. Code § 1101.654, why is this act exempt from the
  unauthorized practice of law?
options:
  - The lease amount was too small to trigger the unauthorized practice statute
  - The license holder is presumed to hold a limited law license for the form
  - Completing this type of form is not considered practicing law by definition
  - The statute exempts a commission-adopted form from that practice
key: D
explanation: Section 1101.654(b) specifically exempts completing a contract form adopted by the
  commission for that type of transaction from the unauthorized practice of law.
citation:
  source: Tex. Occ. Code § 1101.654
  url: null
