stem: Under Tex. Occ. Code § 1101.652(a-1)(2), what must a license holder do when the commission
  requests a document related to a real estate transaction?
options:
  - Providing requested document for inspection within a reasonable time
  - Surrendering the requested document to the lawful owner without just cause
  - Notifying the commission of a conviction within 30 days
  - Considering market conditions for the specific geographic area
key: A
explanation: The statute requires the license holder to produce the requested document for
  inspection within a reasonable time when the commission asks for it. Surrendering the document to
  the owner is a different ground under subsection (a)(5) and does not apply to a commission
  request.
