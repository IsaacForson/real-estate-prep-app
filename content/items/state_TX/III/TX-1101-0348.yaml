stem: "A license holder representing a buyer receives a $500 rebate from a title company for
  referring closing business but does not disclose it to the buyer. Under Tex. Occ. Code §
  1101.652(b)(13), this action is considered:"
options:
  - Considered permissible if the buyer agrees verbally
  - Considered permissible if disclosed after closing
  - Considered permissible if the rebate is under $600
  - Considered prohibited because it is an undisclosed rebate
key: D
explanation: Under Tex. Occ. Code § 1101.652(b)(13), a license holder may not accept, receive, or
  charge an undisclosed commission, rebate, or direct profit on an expenditure made for a principal.
  Because the license holder kept the $500 rebate secret from the buyer, the rebate is undisclosed
  and therefore prohibited. The idea that the rebate could be permissible if disclosed after closing
  is irrelevant because the rebate was never disclosed.
