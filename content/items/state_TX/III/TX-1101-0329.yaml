stem: Under TREC rule §535.155(a), what two pieces of information must every advertisement include
  in a readily noticeable location?
options:
  - The license holder's phone number and email address
  - The license holder's name and the broker's name
  - The license holder's name and the property address
  - The broker's license number and the license holder's website
key: B
explanation: The rule explicitly requires the license holder’s (or team’s) name and the broker’s
  name, with the broker’s name at least half the size of the largest contact information. The other
  options substitute contact details, license numbers, or property information, which are not
  mandated by this subsection.
