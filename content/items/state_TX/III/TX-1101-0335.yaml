stem: Under 22 Tex. Admin. Code § 535.155(a)(2), what size requirement must the broker's name meet
  relative to the largest contact information in the advertisement?
options:
  - The broker's name must be twice the size of the largest contact information.
  - The broker's name must be at least half the size of the largest contact information.
  - The broker's name must be no larger than the largest contact information.
  - The broker's name must be the same size as the largest contact information.
key: B
explanation: The rule requires that the broker's name be displayed in a size that is at least half
  the size of the largest contact information (such as a sales agent's name, associated broker's
  name, or team name) appearing in the advertisement. Therefore, the correct choice is the one
  stating that the broker's name must be at least half the size of the largest contact information.
