stem: According to 22 Tex. Admin. Code § 535.154, what is the definition of a "team name"?
options:
  - A name used by a group of one or more license holders sponsored by or associated with the same
    broker that performs real estate activities under an exclusive collective name other than the
    broker's licensed name or assumed business name.
  - A name used by an individual license holder other than the name shown on the license issued by
    the Commission, such as a middle name, maiden name, or nickname.
  - A name used by a broker in business that meets the requirements of subsection (d) of this
    section, other than the name shown on the broker's license issued by the Commission, a team
    name, or an alternate name.
  - A name used by a broker that associates with and gets paid through another broker under a
    relationship that is intended to be a continuous relationship.
key: A
explanation: The definition of 'team name' is explicitly stated in §535.154(a)(5) as a name used by
  a group of one or more license holders sponsored by or associated with the same broker that
  performs real estate activities under an exclusive collective name other than the broker's
  licensed name or assumed business name. The option describing an individual license holder's name
  other than the name shown on the license (such as a middle name, maiden name, or nickname) defines
  an alternate name, which is defined separately in §535.154(a)(2).
