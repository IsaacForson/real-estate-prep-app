stem: Which of the following best defines an 'alternate name' under 22 Tex. Admin. Code §535.154(a)(2)?
options:
  - A name used by an individual license holder other than the name shown on the license, such as a
    middle name, maiden name, or nickname, excluding common derivatives like Kim for Kimberly
  - A name used by a group of license holders sponsored by the same broker that performs real estate
    activities under an exclusive collective name other than the broker's licensed name
  - Any name used in business by a broker that meets the requirements of subsection (d) of this
    section, other than the name shown on the broker's license
  - A middle name, maiden name, or nickname that is considered the same as the name shown on the
    license issued by the Commission
key: A
explanation: An alternate name is a name used by an individual license holder other than the name
  shown on the license, such as a middle name, maiden name, or nickname, and it excludes common
  derivatives like Kim for Kimberly. The option describing a team name refers to a collective name
  used by a group of license holders sponsored by the same broker, which is not an individual's
  alternate name. The option describing an assumed business name refers to a DBA used by a broker
  that meets subsection (d) requirements, which also is not an individual's alternate name. The
  option stating that a middle name, maiden name, or nickname is considered the same as the licensed
  name contradicts the definition because an alternate name must differ from the name on the
  license. See 22 Tex. Admin. Code § 535.154(a)(2).
