stem: A license holder stops using an alternate name in advertising. According to TREC rule, what
  must the license holder do regarding the Commission?
options:
  - Notify the Commission within 10 days after stopping use of the alternate name.
  - Notify the Commission immediately upon stopping use of the alternate name.
  - Submit a new application for the alternate name to the Commission within 30 days.
  - No notification is required if the alternate name was not previously registered.
key: A
explanation: Section §535.154(b)(3) requires a license holder to notify the Commission and their
  sponsoring broker not later than the tenth day after the date the license holder stops using an
  alternate name. Stating that notice must be given immediately is incorrect; requiring a new
  application within thirty days is incorrect; and claiming that no notification is needed if the
  alternate name was never registered is incorrect because notice is required irrespective of prior
  registration status.
