stem: A license holder representing a buyer in a residential transaction discovers that the property
  they are showing is also listed by another broker at a lower price. The license holder considers
  purchasing the property for themselves. According to TREC's Canons of Professional Ethics, what
  must the license holder do regarding their personal interest?
options:
  - Disclose the personal interest to the buyer and continue with the transaction
  - Place no personal interest above that of the client
  - Seek approval from the broker before making any purchase
  - Obtain written consent from the seller before proceeding
key: B
explanation: The canons require a license holder to place no personal interest above that of the
  client, making B correct. Merely disclosing the interest, seeking broker approval, or obtaining
  seller consent does not satisfy the duty to subordinate personal interest to the client's
  interest.
