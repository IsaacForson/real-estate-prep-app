stem: Under 22 Tex. Admin. Code § 531.1, which of the following best defines a “License Holder”?
options:
  - A real estate broker or sales agent licensed under Chapter 531, Texas Administrative Code.
  - A real estate broker or sales agent licensed under Chapter 1101, Texas Business and Commerce
    Code.
  - A real estate broker or sales agent licensed under Chapter 1101, Texas Occupations Code.
  - A real estate broker or sales agent licensed under Chapter 1102, Texas Occupations Code.
key: C
explanation: Section 531.1 defines a License Holder as “A real estate broker or sales agent licensed
  under Chapter 1101, Texas Occupations Code.” The other choices describe the Commission, a broader
  group, or licensing authority, none of which match the statutory definition.
