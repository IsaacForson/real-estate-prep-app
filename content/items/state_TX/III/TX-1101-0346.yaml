stem: A license holder stopped using an alternate name on April 5. Besides the Texas Real Estate
  Commission, who else must the license holder notify within 10 days under 22 Tex. Admin. Code §
  535.154?
options:
  - The buyer in the transaction
  - Their sponsoring broker only
  - The title company handling closing
  - The seller in the transaction
key: B
explanation: The rule requires the license holder to notify both the Commission and their sponsoring
  broker after stopping use of an alternate name. Therefore, besides the Commission, the sponsoring
  broker must also be notified. The buyer, seller, and title company are not required recipients of
  this notice.
