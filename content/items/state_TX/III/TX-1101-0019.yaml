stem: A broker is appointed under Section 1101.560 to act as an intermediary in a transaction. The
  seller has not given separate written instructions authorizing disclosure of price flexibility.
  What is the broker prohibited from telling the buyer or tenant?
options:
  - That the seller or landlord will accept a price less than the asking price
  - The condition of the property as disclosed in the seller's inspection report
  - The general timeline the seller has proposed for closing the transaction
  - The name and license number of the broker acting as intermediary
key: A
explanation: Section 1101.651(d)(1) prohibits a broker or sales agent acting as an intermediary from
  disclosing to the buyer or tenant that the seller or landlord will accept a price less than the
  asking price unless separately instructed in writing by the seller or landlord.
citation:
  source: Tex. Occ. Code § 1101.651
  url: null
  quoted_text: >-
    A broker and any broker or sales agent appointed under Section 1101.560 who acts as an
    intermediary under Subchapter L may not:


    (1) disclose to the buyer or tenant that the seller or landlord will accept a price less than
    the asking price, unless otherwise instructed in a separate writing by the seller or landlord;
