stem: The commission has probated the revocation of a license holder's license under reasonable
  terms. Which condition may the commission impose on that license holder during the probation
  period?
options:
  - A requirement to report regularly to the commission on matters underlying the probation
  - A requirement to surrender all real estate licenses held by the license holder's immediate
    family members
  - A requirement to forfeit any commissions earned during the prior five years
  - A requirement to relocate the license holder's brokerage to a different county
key: A
explanation: Section 1101.656(c) allows the commission to require a license holder on probation to
  report regularly to the commission on matters that are the basis of the probation, among other
  limited conditions.
