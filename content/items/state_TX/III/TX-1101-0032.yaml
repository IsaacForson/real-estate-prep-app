stem: Under 22 Tex. Admin. Code § 531.2, what is the primary duty of a license holder acting as an
  agent for a client?
options:
  - To maximize the license holder's own commission on every closed sale
  - To follow the instructions of the opposing party's broker in good faith
  - To remain neutral and avoid advocating for any party in the transaction
  - To represent the client's interests while treating others fairly
key: D
explanation: Section 531.2 states that a license holder's primary duty is to represent the client's
  interests while still dealing fairly with other parties to the transaction.
