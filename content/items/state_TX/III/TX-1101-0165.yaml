stem: A license holder receives earnest money from a client and is responsible for holding it until
  closing. According to TREC's Canons of Professional Ethics, what must the license holder do with
  respect to the trust placed in them?
options:
  - Invest the money in an interest-bearing account to earn returns for the client
  - Return the money immediately to the client upon request without delay
  - Deposit the money into their personal account for safekeeping and later return
  - Be faithful and observant to the trust and perform functions scrupulously and meticulously
key: D
explanation: The canons require the license holder to be faithful and observant to the trust and to
  be scrupulous and meticulous in performing functions, making B correct. Investing, returning, or
  depositing the money elsewhere violates the duty to safeguard the trust.
