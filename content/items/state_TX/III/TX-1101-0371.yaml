stem: According to 22 Tex. Admin. Code § 535.154(b)(3), within how many days after stopping use of
  an alternate name must a license holder notify the Commission and their sponsoring broker?
options:
  - 10 days
  - 5 days
  - 7 days
  - 14 days
key: A
explanation: The rule explicitly states that notification must be made 'not later than the 10th day
  after the date the license holder stops using an alternate name,' making ten days the correct
  period. Seven days is a common misconception but does not match the regulatory requirement.
