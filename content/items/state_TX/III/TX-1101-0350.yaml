stem: According to 22 Tex. Admin. Code § 531.2, what must a license holder make clear to all parties
  concerned in a real estate transaction?
options:
  - The license holder's commission rate
  - The license holder's position (i.e., whom they represent)
  - The license holder's years of experience
  - The license holder's personal financial status
key: B
explanation: The rule states that the license holder's position should be clear to all parties
  concerned in a real estate transaction. The commission rate, personal financial status, and years
  of experience are not mentioned as required disclosures.
