stem: According to 22 Tex. Admin. Code § 535.155(b)(1), which of the following is included in the
  definition of 'Advertisement'?
options:
  - A billboard displaying the license holder's phone number and website to attract clients
  - A personal email from a license holder to a current client discussing transaction details
  - An internal memo circulated among office staff about office supplies
  - A voicemail left for a license holder's friend about a personal matter
key: A
explanation: Under 22 Tex. Admin. Code § 535.155(b)(1), the definition of 'Advertisement' includes
  billboards as an example of electronic media designed to attract the public to use real estate
  brokerage services. Therefore, the option describing a billboard displaying the license holder's
  phone number and website to attract clients is included. The option describing a personal email
  from a license holder to a current client discussing transaction details is not included because
  communications to current clients are excluded under §535.155(b)(2)(A). The option describing an
  internal memo circulated among office staff about office supplies and the option describing a
  voicemail left for a license holder's friend about a personal matter are also not included as they
  are not listed among the forms of communication covered by the definition.
