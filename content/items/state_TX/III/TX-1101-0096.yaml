stem: A license holder represents the seller in a residential transaction. The buyer offers to pay
  the license holder a referral fee for bringing the buyer to the transaction. Before accepting the
  fee, what must the license holder do under TREC rule?
options:
  - Accept the fee without disclosure because the buyer is not the license holder's client.
  - Disclose the referral fee to both the buyer and the seller and obtain consent from both parties.
  - Disclose the referral fee to the buyer and obtain the buyer's consent before accepting it.
  - Disclose the referral fee to the seller and obtain the seller's consent before accepting it.
key: D
explanation: Under §535.148(a), a license holder may not receive a commission, rebate, or fee from a
  person other than the person they represent without first disclosing to their client and obtaining
  the client's consent. Here the license holder represents the seller, so the seller is the client
  and must be consulted. Accepting the fee without disclosure because the buyer is not the license
  holder's client is incorrect. Disclosing the referral fee to the seller and obtaining the seller's
  consent before accepting it is correct; adding a requirement to also obtain the buyer's consent is
  unnecessary.
