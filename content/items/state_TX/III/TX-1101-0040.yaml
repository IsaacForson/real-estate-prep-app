stem: A broker advertises that the broker will rebate part of the broker's compensation to buyers
  who use the broker's services, but the ad does not mention that the rebate depends on the seller's
  consent. Under 22 Tex. Admin. Code § 535.155, why does this advertisement create a problem?
options:
  - It fails to list the broker's continuing education hours for renewal
  - It omits the phone number of the title company handling the closing
  - It fails to disclose the exact square footage of every listed property
  - It omits that the rebate needs the consent of the party represented
key: D
explanation: Section 535.155(d)(16) treats an advertisement offering to rebate compensation as
  misleading when it fails to disclose that the rebate is subject to the consent of the party the
  license holder represents.
