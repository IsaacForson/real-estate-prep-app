stem: Under Tex. Occ. Code § 1101.652(a-1)(3), what may the commission do if a license holder fails
  to use a contract form required by the commission under Section 1101.155?
options:
  - The commission may impose a monetary penalty not exceeding five thousand dollars for each
    violation.
  - The commission may suspend or revoke the license or take other disciplinary action authorized by
    this chapter.
  - The commission may mandate that the license holder attend a commission-hosted ethics seminar
    within 30 days.
  - The commission may issue a written warning and require the license holder to complete additional
    training.
key: B
explanation: The subsection explicitly states that the commission may suspend or revoke the license
  or take other disciplinary action when a license holder fails to use a required contract form.
  Issuing only a warning or mandating training is not authorized by this provision, and the statute
  does not mention monetary penalties for this violation.
