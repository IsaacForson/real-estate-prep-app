stem: Under TREC rule §535.155(d)(14), how many days after a listing agreement is no longer in
  effect must a listed property be discontinued in advertising?
options:
  - 5 days
  - 7 days
  - 10 days
  - 14 days
key: C
explanation: The rule declares that offering a listed property that is not discontinued within 10
  days after the listing agreement is no longer in effect is misleading, so the required period is
  10 days. The distractor of 7 days is incorrect because the rule specifies a 10‑day limit, not a
  shorter period.
