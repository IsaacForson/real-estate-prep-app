stem: A license holder who is not an attorney drafts, for a fee, an instrument that transfers an
  interest in real property, using a document other than a commission-approved form. Based on this
  conduct, what must the commission do?
options:
  - Require only that the license holder disclose the drafting to future clients
  - Suspend or revoke the license holder's license or certificate of registration
  - Allow the license holder to correct the instrument within thirty days without penalty
  - Refer the instrument to a court for review before any brokerage action is taken
key: B
explanation: Section 1101.654(a) requires the commission to suspend or revoke the license or
  certificate of a non-attorney license holder who, for compensation, drafts an instrument other
  than a form described by Section 1101.155 that transfers or affects an interest in real property.
