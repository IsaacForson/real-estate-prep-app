stem: "A broker deposits trust money into his personal operating account to cover office rent. Under
  Tex. Admin. Code § 535.146(b)(5), this action is considered:"
options:
  - Prima facie evidence of commingling trust money with the broker's own money
  - A permissible use of trust money to pay ordinary business expenses
  - A required practice to cover bank service fees for trust accounts
  - An acceptable method if documented monthly in the broker's records
key: A
explanation: The correct answer is A because subsection (b)(5)(A) states that placing trust money in
  a broker's personal or operating account is prima facie evidence of commingling trust money with
  the broker's own money. The most tempting distractor, B, suggests the action is permissible for
  business expenses, but trust money may not be used for the broker's own expenses under the rule.
