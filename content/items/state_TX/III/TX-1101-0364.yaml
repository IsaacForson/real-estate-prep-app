stem: A license holder creates a team named 'Texas Home Associates' and advertises the team's
  services without mentioning the sponsoring broker. Under 22 Tex. Admin. Code § 535.155(d)(5), why
  is this advertisement problematic?
options:
  - A) It implies the team is offering brokerage services independent from its sponsoring broker
  - B) It fails to display the broker's name in at least half the size of the largest contact
    information
  - C) It uses a title such as CEO that implies the license holder is responsible for brokerage
    operations
  - D) It does not disclose that a rebate is contingent upon using a specified service provider
key: A
explanation: The rule prohibits advertisements that contain a team name with terms implying the team
  offers brokerage services independent from its sponsoring broker, such as 'associates'. The other
  options describe violations of different provisions (size of broker's name, improper title, rebate
  disclosure) that are not relevant to the team name issue.
