stem: A license holder representing a seller receives an offer below the asking price. The buyer
  asks the license holder to keep the seller's motivation to sell confidential. According to TREC's
  Canons of Professional Ethics, what must the license holder do?
options:
  - The license holder should present the offer to the seller and disclose the seller's motivation
    to the buyer.
  - The license holder should withhold the offer from the seller to protect the buyer's
    confidentiality.
  - The license holder should present the offer to the seller and keep the seller's motivation
    confidential.
  - The license holder should alter the offer to match the asking price before presenting it.
key: C
explanation: The fiduciary duty in §531.2 requires the license holder to represent the client's
  interests while treating other parties fairly. Presenting the offer to the seller fulfills the
  duty to the client, and keeping the seller's motivation confidential treats the buyer fairly by
  not revealing the seller's weakness. Disclosing the motivation would violate the duty to the
  client, and withholding the offer or altering the price would fail to represent the client's
  interests.
