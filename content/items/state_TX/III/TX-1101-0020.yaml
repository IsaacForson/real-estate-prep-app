stem: A sales agent wants to rebate part of the agent's commission to the buyer, a party the agent
  represents in the transaction. Before making that payment, what consent does TREC's fee-splitting
  rule require the agent to obtain?
options:
  - The informal verbal approval of the seller and the seller's broker given at the closing table
  - The written consent of the sales agent's sponsoring broker and the represented buyer
  - A ruling from the commission approving the specific rebate amount
  - The written consent of the title company handling the transaction
key: B
explanation: Section 535.147(d) allows a license holder to rebate part of a fee or commission to a
  party in the transaction only when the sales agent has the written consent of both the sponsoring
  broker and the party the license holder represents.
citation:
  source: 22 Tex. Admin. Code § 535.147
  url: null
  quoted_text: |-
    A license holder may rebate or pay a portion of the license holder's fee or
    commission to a party in the transaction when the sales agent has the written
    consent of the sales agent's sponsoring broker and the party represented by the
    license holder.
