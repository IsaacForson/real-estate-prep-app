stem: A broker stopped using an assumed business name on June 10. According to TREC rule §535.154,
  by what date must the broker notify the Texas Real Estate Commission?
options:
  - June 19
  - June 21
  - June 20
  - June 30
key: C
explanation: The rule requires notification not later than the 10th day after the date the broker
  stops using an assumed business name. Counting June 11 as day 1, the tenth day is June 20.
  Therefore, the broker must notify by June 20. The distractors result from miscounting the interval
  by one day short, one day long, or incorrectly adding twenty days.
