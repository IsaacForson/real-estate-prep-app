stem: A license holder is buying a property for the license holder's own account and is not acting
  as anyone's agent in the deal. Under 22 Tex. Admin. Code § 537.11, must the license holder use a
  commission-approved contract form for that purchase?
options:
  - No, the exception for acting solely as a principal applies
  - Yes, every real estate purchase in Texas requires an approved form
  - No, the exception applies just when the seller is also a broker
  - Yes, unless the purchase price exceeds the local median home price
key: A
explanation: Section 537.11(a)(1) excuses a license holder from the mandatory contract form
  requirement when the license holder is functioning solely as a principal rather than as an agent
  in the transaction.
