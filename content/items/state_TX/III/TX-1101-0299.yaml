stem: Under Tex. Occ. Code § 1101.652(a)(7), within how many days after a final conviction must a
  license holder notify the Texas Real Estate Commission of the conviction?
options:
  - 10 days
  - 30 days
  - 60 days
  - 15 days
key: B
explanation: The subsection requires notification not later than the 30th day after a final
  conviction, so the correct interval is 30 days. The 10‑day option is incorrect because the rule
  does not set a shorter period.
citation:
  source: Tex. Occ. Code ch. 1101 — Texas Occupations Code Chapter 1101 — Real Estate Brokers and
    Sales Agents (The Real Estate License Act), official Texas Legislature Online statute page read
    via Internet Archive capture of 2025-12-07 because statutes.capitol.texas.gov now serves only a
    JavaScript shell — § 1101.652(a)(7)
  url: null
  quoted_text: fails to notify the commission, not later than the 30th day after the date of a final
    conviction or the entry of a plea of guilty or nolo contendere, that the person has been
    convicted of or entered a plea of guilty or nolo contendere to a felony or a criminal offense
    involving fraud;
  secondary: []
math:
  worked_solution: The statute states that notice must be given not later than the 30th day after a
    final conviction. Therefore, the required number of days is 30.
  formulas:
    - Days = 30
