stem: Under Maine law, which of the following activities constitutes real estate brokerage?
options:
  - An owner selling his own property without compensation
  - An attorney-at-law drafting a deed for a client in the course of legal representation
  - A licensed auctioneer calling bids at an auction but not preparing contracts
  - A licensee negotiating a purchase and sale agreement for a buyer
key: D
explanation: "Negotiating the purchase, sale or exchange of real estate is expressly listed as a
  brokerage activity in 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act) — Maine Revised
  Statutes Title 32, Chapter 114: Real Estate Brokerage License Act §13001(2)(E). The other options
  are exceptions: owner/lessor transactions, attorney-at-law transactions, and auctioneer calling
  bids only are excluded from the definition of brokerage."
