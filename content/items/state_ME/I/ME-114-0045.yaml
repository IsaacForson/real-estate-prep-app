stem: Under the Maine Real Estate Brokerage License Act, what must the Maine Real Estate Commission
  adopt to implement this subchapter?
options:
  - Rules setting forth criteria needed to implement this subchapter
  - A standardized purchase and sale agreement form for all licensees
  - A mandatory continuing education curriculum for all licensees
  - A written company policy template for each brokerage agency
key: A
explanation: Section 13280 states that the commission shall adopt rules setting forth criteria
  necessary to the implementation of this subchapter, which makes the rules option correct. The
  written company policy is a duty imposed on each brokerage agency by section 13277, not a duty of
  the commission.
