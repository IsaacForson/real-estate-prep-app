stem: Under Maine law, what must a designated broker do regarding supervision of agency employees
  and independent contractors?
options:
  - The designated broker must supervise staff according to license status and give regular ongoing
    oversight.
  - The designated broker must assign supervision duties to the most experienced associate broker
    each quarter.
  - The designated broker must review employee performance only after receiving a written client
    complaint.
  - The designated broker must exercise reasonable supervision based on employees' qualifications
    and experience.
key: D
explanation: The designated broker must exercise a reasonable level of supervision that matches the
  qualification and experience of agency employees and independent contractors, as required by 32
  M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act) § 13179. The option stating that the
  broker must supervise staff according to license status and give regular ongoing oversight adds
  requirements not found in the statute and therefore is incorrect. The option stating that
  supervision duties should be assigned to the most experienced associate broker each quarter
  imposes a specific rotation rule that the statute does not contain. The option stating that
  performance reviews occur only after a written client complaint limits supervision to reactive
  measures, which contradicts the requirement for ongoing, reasonable supervision. The correct
  option states that the broker must exercise reasonable supervision based on employees'
  qualifications and experience, which aligns with the statutory requirement.
