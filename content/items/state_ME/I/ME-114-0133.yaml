stem: If the director receives a written complaint that does **NOT** describe a violation within the
  commission's authority, what must the director do under Maine law?
options:
  - Notify the person who submitted the complaint of that determination.
  - Immediately issue a staff petition for hearing before the commission.
  - Execute a consent agreement with the parties involved.
  - Dismiss the complaint with the commission's approval.
key: A
explanation: The law requires the director to review a written complaint and, if it does not allege
  a violation within the commission's authority, to notify the complainant of that determination.
  Issuing a staff petition, executing a consent agreement, or dismissing the complaint are actions
  taken only after an investigation finds a violation.
