    32, Chapter 114: Real Estate Brokerage License Act § 13006"
  url: null
  quoted_text: All hearings and records of hearings conducted by the grievance committee or the
    professional standards committee of any state or regional professional real estate association
    or board are confidential and are exempt from discovery.
