stem: During a disciplinary proceeding, a party requests copies of the hearing records from the Real
  Estate Commission's grievance committee. Under Maine law, are these records subject to discovery?
options:
  - They are public records accessible to any party
  - They are discoverable if the requesting party shows good cause
  - They are confidential and exempt from discovery
  - They may be disclosed only with the commission's written consent
key: C
explanation: The statute declares that all hearings and records of hearings conducted by the
  grievance committee or the professional standards committee are confidential and exempt from
  discovery. Therefore, the records are not subject to discovery. The distractor suggesting
  discoverability upon showing good cause contradicts the explicit exemption.
