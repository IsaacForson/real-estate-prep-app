stem: "A Maine real estate broker prepares a market value opinion for a seller and will receive a
  commission if the property sells. According to Maine law, this conduct is:"
options:
  - It is allowed only for designated brokers
  - It is prohibited as a conflict of interest
  - It is permitted under the conflict‑of‑interest rule
  - It is allowed with client disclosure
key: B
explanation: The correct answer is B because § 13251‑A expressly forbids a broker or associate
  broker from knowingly providing an opinion of market value when they or another licensee with the
  same agency will receive a fee for the transaction. Preparing a market value opinion while
  expecting a commission violates that prohibition. The distractor suggesting the conduct is allowed
  with client disclosure is incorrect because disclosure does not negate the statutory ban; the
  conflict‑of‑interest rule applies regardless of whether the client is informed. The other
  distractors are also incorrect as they assert permission under circumstances that the statute does
  not allow.
citation:
  source: 32 M.R.S. § 13251-A
  url: null
  quoted_text: A real estate broker or associate broker may not knowingly provide or offer an
    appraisal or opinion of market value, as set forth in section 14004, on real estate in a
    transaction where the broker or associate broker, or any other licensee licensed with the
    agency, is to receive a fee on that transaction.
