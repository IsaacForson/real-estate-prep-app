stem: A broker has held an inactive license for eight years and now wishes to return to active
  practice. What must the broker do to reinstate the license to active status under Maine law?
options:
  - To reinstate, submit an application, pay the fee, and complete no continuing education
  - To reinstate, submit an application, pay the fee, and complete 36 clock hours of continuing
    education within the previous biennium
  - To reinstate, submit an application, pay the fee, and pass the license examination designated by
    commission rule
  - To reinstate, pass the license examination designated by commission rule without submitting an
    application or paying the fee
key: C
explanation: For licenses inactive six years or more, reinstatement requires submitting an
  application, paying the fee, and passing the commission‑designated examination; continuing
  education alone is insufficient. The option stating that only an application, fee, and 36 hours of
  continuing education are required incorrectly applies the continuing education rule for shorter
  inactive periods to this scenario.
