stem: A designated broker learns that an associate broker has been terminated effective today. What
  action must the designated broker take regarding the Maine Real Estate Commission?
options:
  - Send a notice to the associate broker’s last address and to the commission about the termination
  - Place the associate broker’s license on inactive status immediately
  - File a complaint with the commission regarding the termination within 10 days
  - Notify the commission if the associate broker requests a license transfer
key: A
explanation: "Under 32 M.R.S. § 13180, when an associate broker is terminated, the designated broker
  must promptly send a notice to the associate broker’s last known address stating that the
  commission has been notified, and must also provide a copy of that notice to the commission. The
  option that matches this requirement is the one stating that the broker sends a notice to the
  associate broker’s last address and to the commission about the termination. The other options are
  incorrect: placing the license on inactive status is not required by law upon termination; filing
  a complaint with the commission is not mandated for a simple termination; and notifying the
  commission only if the associate broker requests a license transfer does not cover the required
  notice to the terminated associate broker."
citation:
