stem: A Maine broker pays an unlicensed assistant $500 for showing a property, which violates the
  Real Estate Brokerage License Act. What is the maximum civil forfeiture that may be adjudged for
  this violation under Maine law?
options:
  - $500
  - $1,000
  - $2,000
  - $2,500
key: C
explanation: The statute provides that a person who violates any provision of the chapter commits a
  civil violation for which a forfeiture of not more than $2,000 for each violation may be adjudged,
  plus the amount of compensation received. Therefore, the maximum forfeiture is $2,000, regardless
  of the $500 compensation paid. The distractor '$500' incorrectly treats the compensation amount as
  the forfeiture amount.
