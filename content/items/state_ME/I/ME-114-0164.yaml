stem: A member of the Maine Real Estate Commission was appointed on August 1, 2023. Assuming no
  removal for cause, on what date will their term end?
options:
  - August 1, 2025
  - August 1, 2027
  - July 31, 2026
  - August 1, 2026
key: D
explanation: The law provides that commission members serve three‑year terms. Adding three years to
  the August 1, 2023 appointment date yields an expiration of August 1, 2026. The July 31, 2026
  option incorrectly subtracts one day, while the one‑year‑short and one‑year‑long options misapply
  the term length.
