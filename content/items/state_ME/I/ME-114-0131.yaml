stem: A designated broker in Maine has just received the agency license for a newly opened office.
  What must the broker do with this license under Maine law?
options:
  - The designated broker must file the license with the Maine Real Estate Commission within ten
    days.
  - The designated broker must keep the license in a locked file accessible only to the broker.
  - The designated broker must conspicuously display the agency license in the broker's place of
    business.
  - The designated broker must provide a copy of the license to each sales agent in the office.
key: C
explanation: The law requires the designated broker to conspicuously display the agency license in
  the broker's place of business (32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act) §
  13181). Filing the license with the Commission, keeping it in a locked file accessible only to the
  broker, and providing a copy to each sales agent are not required.
