stem: A buyer asks a transaction broker to arrange a home inspection to evaluate the property's
  condition. How must the broker respond under Maine law?
options:
  - A transaction broker must refuse to conduct the home inspection for the benefit of any party.
  - A transaction broker must arrange the home inspection because it benefits the buyer.
  - A transaction broker may perform the home inspection only if the seller consents.
  - A transaction broker may conduct the home inspection but must disclose the findings to both
    parties.
key: A
explanation: Maine law prohibits a transaction broker from conducting an inspection, investigation,
  or analysis of a property for the benefit of any party. Consequently, the broker must refuse to
  conduct the home inspection for the benefit of any party. Arranging the inspection, performing it
  with seller consent, or conducting it and then disclosing findings would still constitute
  conducting the inspection and would violate the statute (32 M.R.S. §13283).
