stem: A real estate sales agent in Maine has held her license for 2 years and wishes to continue
  practicing. She has experienced a serious medical condition that prevents her from attending the
  required renewal exam. Under Maine law, what action may the Real Estate Commission take?
options:
  - Grant a waiver based on extenuating circumstances as defined by commission rules
  - Extend her license automatically for one year pending medical recovery
  - Require her to complete continuing education hours before any waiver can be considered
  - Deny waiver request because medical conditions do not qualify as extenuating circumstances
key: A
explanation: The law permits the commission to grant waivers based on extenuating circumstances as
  defined by its rules, which can include a serious medical condition. The option that denies the
  request is wrong because the statute does not categorically prohibit waivers for medical reasons.
