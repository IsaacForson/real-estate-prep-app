stem: A Maine real estate brokerage agency is preparing its written company policy. Under section
  13277, what must this policy identify and describe?
options:
  - The types of real estate brokerage relationships in which the designated broker and affiliated
    licensees may engage
  - The procedures for handling and disbursing trust funds held in the agency's escrow accounts on
    behalf of clients
  - The specific duties of confidentiality owed by the designated broker to former clients after
    termination of a brokerage agreement
  - The minimum continuing education hours that the designated broker and affiliated licensees must
    complete for license renewal
key: A
explanation: Section 13277 requires every real estate brokerage agency to adopt a written company
  policy that identifies and describes the types of real estate brokerage relationships in which the
  designated broker and affiliated licensees may engage. The disciplinary procedures option is wrong
  because section 13277 addresses the content of the agency policy, not commission enforcement
  procedure.
