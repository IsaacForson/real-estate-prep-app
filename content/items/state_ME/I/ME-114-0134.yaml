stem: After completing an investigation of a written complaint, which action requires the consent of
  the parties and approval of the commission and commission counsel?
options:
  - Issue a staff petition for hearing that may include a recommended disposition.
  - Dismiss the complaint after receiving the commission's approval.
  - Execute a consent agreement after obtaining parties' consent and commission approval.
  - Notify the complainant that the complaint does not describe a violation.
key: C
explanation: The statute specifies that, after an investigation, the director may execute a consent
  agreement only with the consent of the parties and subject to approval of the commission and
  commission counsel. The other actions either do not require parties' consent or are not
  post‑investigation steps.
