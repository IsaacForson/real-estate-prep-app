stem: A sales agent’s license expired on March 1 and she has not renewed it. Today is June 1. Under
  Maine law, what must she do to obtain a renewal license?
options:
  - Submit a renewal application and pay the biennial fee
  - Complete 21 clock hours of continuing education
  - Pass the license examination designated by the commission
  - Provide proof of an active license in another jurisdiction
key: C
explanation: Because the license has lapsed for more than 90 days, the director must deny renewal
  unless the applicant passes the commission‑designated examination. Submitting a renewal
  application and paying the biennial fee, or completing 21 clock hours of continuing education,
  apply only when the lapse is 90 days or less.
citation:
  source: 32 M.R.S. § 13194
  url: null
  quoted_text: The director shall deny a renewal license to any applicant whose license has lapsed for
    more than 90 days, unless the renewal license applicant passes the license examination
    designated by commission rule for this purpose.
