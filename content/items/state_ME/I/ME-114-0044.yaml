stem: "A designated broker in Maine learns that one of the agency's affiliated licensees has been
  advertising properties without the agency's authorization in violation of the brokerage license
  laws, but the broker takes no action to stop it. Under the Maine Real Estate Brokerage License
  Act, the agency and designated broker may face disciplinary action because:"
options:
  - The designated broker had prior knowledge of the violation and did not take reasonable action to
    prevent it
  - The designated broker must report the violation to the Real Estate Commission within 24 hours or
    face disciplinary action
  - The designated broker must stop the affiliated licensee's advertising after being notified of a
    violation
  - The designated broker's license may be suspended if the agency fails to supervise affiliated
    licensees adequately
key: A
explanation: An agency and its designated broker are subject to discipline for a violation by a
  person acting on the agency's behalf when the designated broker had prior knowledge and did not
  take reasonable action to prevent the violation. Liability is not automatic or without regard to
  knowledge; the statute lists specific conditions such as prior knowledge, permitting unlicensed
  activity, or failing to supervise. Reporting to a professional association's grievance committee
  is not the statutory trigger.
