stem: A licensee who violates the Maine Real Estate Brokerage License Act receives $1,200 in
  compensation from the transaction. What is the maximum total forfeiture that may be adjudged for
  this violation?
options:
  - $2,000
  - $3,200
  - $1,200
  - $4,200
key: B
explanation: Under 32 M.R.S. §§ 13001–13283 §13005, a civil violation carries a forfeiture of not
  more than $2,000 plus the amount of compensation received. Adding the $1,200 compensation yields a
  maximum total of $3,200. The $2,000 option omits the compensation component.
