stem: A transaction broker learns of a leaky roof during a showing and does not inform the buyer.
  What must the transaction broker do under Maine law?
options:
  - Disclosing the defect to the buyer promptly
  - Conducting an inspection to verify the defect
  - Promoting the buyer's interest by noting the defect
  - Withholding information about the defect
key: A
explanation: Under 32 M.R.S. § 13283(2)(B), a transaction broker must disclose in a timely manner
  all material defects of which they have actual notice or knowledge. Therefore, the broker must
  disclose the leaky roof to the buyer. Conducting an inspection to verify the defect is prohibited
  by § 13283(3)(A). Promoting the buyer's interest by noting the defect violates the prohibition
  against promoting a party's interest under § 13283(3)(C). Withholding information about the defect
  fails to satisfy the disclosure duty.
