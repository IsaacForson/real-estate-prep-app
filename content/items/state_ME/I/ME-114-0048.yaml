stem: A transaction broker receives a $5,000 earnest money deposit from a buyer at the time of
  offer. What must the broker do under Maine law?
options:
  - A transaction broker must account for the earnest money deposit in a timely manner.
  - A transaction broker may hold the earnest money deposit until closing before accounting for it.
  - A transaction broker must transfer the earnest money deposit to the seller immediately.
  - A transaction broker must disclose the earnest money deposit to the buyer's lender.
key: A
explanation: Under Maine law, a transaction broker must account for all money and property received
  in a timely manner (32 M.R.S. §§ 13001–13283, §13283). Therefore, the broker must account for the
  earnest money deposit promptly. Holding the deposit until closing before accounting for it delays
  accounting, violating the timely requirement. Transferring the deposit to the seller immediately
  does not constitute accounting for the funds, and disclosing the deposit to the buyer's lender is
  not required by this rule.
