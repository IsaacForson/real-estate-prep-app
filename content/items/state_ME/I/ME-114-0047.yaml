stem: Under Maine law, what is a transaction broker's obligation regarding latent defects in a property?
options:
  - A transaction broker is liable for failing to discover latent defects in the property.
  - A transaction broker may voluntarily discover latent defects in the property.
  - A transaction broker is not obligated to discover latent defects in the property.
  - A transaction broker must discover latent defects in the property.
key: C
explanation: Maine Revised Statutes §13283 provides that a transaction broker is not obligated to
  discover latent defects in the property. Therefore, the statement that a transaction broker is not
  obligated to discover latent defects is the correct answer. The statements that a transaction
  broker is liable for failing to discover latent defects, may voluntarily discover latent defects,
  or must discover latent defects are not supported by the statute.
