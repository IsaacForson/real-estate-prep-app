stem: A designated broker wants to use appointed agents within a firm. Under section 13278, what
  must be defined by rules adopted by the Maine Real Estate Commission?
options:
  - Methods of appointment and the role of the real estate brokerage agency and the designated broker
  - The minimum number of affiliated licensees required for a brokerage agency in the state
  - The maximum fine the commission may impose for a violation under this act
  - The required content of every brokerage agreement with clients to ensure compliance
key: A
explanation: Section 13278 provides that methods of appointment and the role of the real estate
  brokerage agency and the designated broker must be defined by rules adopted by the commission. The
  maximum fine option is wrong because section 13278 addresses appointment methods and roles, not
  monetary sanctions.
