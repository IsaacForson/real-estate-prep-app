stem: Under Maine law, what basis must the Real Estate Commission use when granting a waiver to
  allow a sales agent to remain licensed beyond the 2-year term?
options:
  - Annual sales volume as defined by commission rules
  - Completion of CE as defined by commission rules
  - Extenuating circumstances as defined by commission rules
  - Affiliation with a brokerage as defined by commission rules
key: C
explanation: The statute states that waivers shall be granted on the basis of extenuating
  circumstances as defined by rules promulgated by the commission, making that the required basis.
  The distractor about sales volume is incorrect because the law does not tie waivers to an
  applicant's sales performance.
