stem: A licensee has had a professional license suspended for disciplinary reasons within the past
  three years. Under Maine law, what action may the Real Estate Commission take regarding his
  renewal application?
options:
  - The denial of the renewal application
  - The approval of the renewal application
  - The requirement of additional education
  - The referral to the Attorney General
key: A
explanation: Section 13067-A(9) authorizes the commission to deny or refuse to renew a license if
  the applicant has had a professional or occupational license suspended or revoked for disciplinary
  reasons within the prior three years. Therefore, denial of the renewal application is permissible.
  The other options are not authorized by that subsection.
