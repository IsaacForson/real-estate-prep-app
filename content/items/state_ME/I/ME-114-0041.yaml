stem: What must every agency maintain under Maine law for earnest money deposits and other client funds?
options:
  - A state‑chartered trust account maintained at a bank authorized to do business in this State
  - A cash reserve kept in the agency’s office safe for client funds
  - A pooled investment account held with a mutual fund company registered in Maine
  - A federally insured account or accounts in a financial institution authorized to do business in
    this State
key: D
explanation: The statute requires every agency to keep client funds in a federally insured account
  or accounts at a financial institution authorized to do business in the State (or a similarly
  authorized credit union). Keeping the money in a cash reserve in the agency’s office safe does not
  satisfy the federal‑insurance requirement, so that choice is incorrect.
