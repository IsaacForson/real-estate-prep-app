stem: A real estate salesperson who was not licensed at the time she negotiated a purchase and sale
  agreement sues the buyer for her promised commission. Under Maine law, what is the likely result
  of her lawsuit?
options:
  - She cannot maintain the action because she must prove she was licensed
  - She will be awarded restitution for unjust enrichment
  - She may recover only half the commission as a penalty
  - She will recover the full commission because the contract is enforceable
key: A
explanation: The law prohibits maintaining an action for collection of compensation without first
  proving that the person was properly licensed at the time the cause of action arose. Since the
  salesperson lacked a license, she cannot maintain the action. The distractor suggesting she will
  recover the full commission ignores the licensing prerequisite.
citation:
  source: "32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act) — Maine Revised Statutes Title
    32, Chapter 114: Real Estate Brokerage License Act § 13004"
  url: null
  quoted_text: No person or entity may bring or maintain any action in the courts of this State for
    the collection of compensation for real estate brokerage services, without first proving that
    the person or entity was properly licensed by the Real Estate Commission at the time the cause
    of action arose.
