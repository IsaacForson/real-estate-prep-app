stem: A course provider wishes to change the textbook used in an approved qualifying education
  course. Under Maine Real Estate Commission rules, what must the provider do before offering the
  change?
options:
  - The provider shall submit the change to the full Commission for a hearing
  - The provider shall submit the change to the Director for approval
  - The provider shall notify the Commission within thirty days after the change
  - The provider shall implement the change if the textbook cost is comparable
key: B
explanation: The rule states that any substantial change to an approved syllabus must be reported to
  the Director and approved before being offered. Simply notifying students or updating a website
  does not meet this requirement, and the exemption for minor changes does not apply to a textbook
  substitution.
citation:
