stem: A licensee plans to request a subpoena for a witness to testify at a Commission hearing set
  for October 20. Assuming no good cause, by what date must the licensee submit the subpoena request
  to comply with Maine Real Estate Commission rules?
options:
  - October 15
  - October 18
  - October 10
  - October 12
key: C
explanation: The rule requires subpoena requests to be made at least ten days before the hearing.
  Subtracting ten days from October 20 yields October 10, which satisfies the requirement. The
  October 12 date would provide only eight days' notice, which fails to meet the ten‑day minimum.
