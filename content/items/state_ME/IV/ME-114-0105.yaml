key: A
explanation: The rule states that subpoenas shall be requested, except for good cause, at least ten
  (10) days in advance of a scheduled hearing. Therefore, ten days is the required minimum. The
  seven‑day option reflects the intervention filing deadline, which applies to intervention
  requests, not subpoenas.
