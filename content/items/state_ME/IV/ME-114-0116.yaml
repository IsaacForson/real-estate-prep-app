stem: A Commission member wishes to discuss a specific case under investigation with other
  Commission members during a meeting. Under Maine Real Estate Commission rules, what condition must
  be met for this discussion to be permissible?
options:
  - The member must obtain written approval from the Commission's Director before discussing the
    specific case with other members.
  - The member must avoid discussing the specific case unless adequate notice and opportunity for
    all parties to participate are given.
  - The member must refrain from discussing the specific case with other members until final
    Commission action and appeal rights are exhausted.
  - The member must limit the discussion to procedural status inquiries and avoid any communication
    with the Commission's attorney.
key: B
explanation: The rule prohibits discussing a specific case under investigation unless adequate
  notice and opportunity for all parties to participate are provided. The other options either
  impose incorrect restrictions (discussion only with attorney), prohibit discussion regardless of
  notice, or require unanimous consent, none of which are supported by the rule.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 4
  url: null
  quoted_text: The members shall avoid discussing, except with adequate notice and opportunity for all
    parties to participate, any specific case under investigation, or any case which may reasonably
    be expected to be the subject of investigation, until after final Commission action and the time
    for filing an appeal has lapsed or appeal rights have been exhausted.
