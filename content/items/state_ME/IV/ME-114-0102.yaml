stem: A Maine proprietary school plans to offer a new broker pre-licensure course in a live
  classroom format. It submits a complete syllabus and application to the Director on March 1. Under
  Maine Real Estate Commission rules, which action by the school complies with the approval
  requirements?
options:
  - Waiting for written approval before advertising the course as approved, enrolling students, or
    conducting classes
  - Advertising the course as approved on March 10 while awaiting the Director's decision
  - Enrolling students on March 5 on the condition that approval is expected shortly
  - Beginning classes on April 1 if no denial has been received within thirty days
key: A
explanation: Course providers may not advertise courses as approved, enroll students, or conduct
  classes for students seeking licensure credit before receiving written approval from the Director.
  Beginning classes simply because thirty days passed without a denial is wrong — the thirty-day
  period is the deadline for the Director's written notification of approval or denial, not a
  deemed-approval mechanism.
