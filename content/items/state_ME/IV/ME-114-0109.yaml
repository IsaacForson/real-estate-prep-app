stem: Under Maine Real Estate Commission rules, what must a course transcript include at a minimum
  for a student who has satisfactorily completed a qualifying education course?
options:
  - The course transcript must include the course title, student’s name, final numerical grade,
    beginning and course completion date, and be signed by the course provider.
  - The course transcript must include the course title, student’s name, final numerical grade,
    beginning and course completion date, and be signed by the student.
  - The course transcript must include the course title, student’s name, final numerical grade,
    beginning date, and be signed by the course provider.
  - The course transcript must include the course title, student’s name, final numerical grade,
    course completion date, and be signed by the course provider.
key: A
explanation: Maine Real Estate Commission rules (02‑039 C.M.R. ch. 360 § 2) require that a
  transcript for a satisfactorily completed qualifying education course include, at a minimum, the
  course title, the student’s name, the final numerical grade, both the beginning date and the
  completion date, and a signature of the course provider. A transcript that is signed by the
  student instead of the provider does not satisfy the signature requirement. A transcript that
  omits either the beginning date or the completion date fails to meet the date requirement. The
  option that leaves out the completion date while keeping the provider’s signature is also
  incomplete.
