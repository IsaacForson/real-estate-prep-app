stem: During a Maine Real Estate Commission adjudicatory hearing, after the respondent has presented
  their case, what is the next procedural step according to the Commission's rules?
options:
  - The chairperson may rule on motions and procedural questions
  - The party defending against the action may offer a closing statement
  - The party bringing the action may offer a closing statement
  - The party bringing the action may cross-examine each witness
key: D
explanation: "Chapter 350, § 5 of the Maine Real Estate Commission rules sets the hearing sequence
  as: (1) complainant opening statement, (2) respondent opening statement, (3) complainant’s case,
  (4) respondent cross‑examination, (5) respondent’s case, (6) complainant may cross‑examine each
  witness, and (7) closing statements. After the respondent has presented its case (step 5), the
  next step is step 6, which allows the party that brought the action to cross‑examine each witness.
  Thus the statement that the party bringing the action may cross‑examine each witness is correct.
  The chairperson ruling on motions and procedural questions occurs earlier in the hearing, not at
  this point. The party defending against the action cannot give a closing statement until after
  cross‑examination is completed. The party bringing the action also cannot give a closing statement
  until the final step of the hearing."
