stem: Under Maine Real Estate Commission rules, what minimum grade must a student achieve for
  satisfactory completion of a qualifying education course?
options:
  - A grade of at least 70%
  - A grade of at least 75%
  - A grade of at least 80%
  - A grade of at least 85%
key: B
explanation: Commission rules define satisfactory completion as meeting all minimum requirements set
  by the course provider and achieving a grade of at least 75%. The 70% figure is a common
  assumption borrowed from general passing-score conventions, but the rule sets the threshold at
  75%.
