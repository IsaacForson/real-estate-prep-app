stem: A designated broker asks the operator of an approved Maine pre-licensure course whether she
  may visit the virtual classroom during a session break to hand out business cards and encourage
  students to affiliate with her brokerage after they become licensed. Under Maine Real Estate
  Commission rules, what must the course provider do?
options:
  - Refuse, unless the Director has given prior written approval for the recruiting visit
  - Permit it, because the students have not yet become licensed and are not yet under any brokerage
  - Refuse, because recruiting new affiliates for any real estate brokerage company on the course
    platform is prohibited
  - Permit it, provided the broker gives equal recruiting time to any competing brokerage that
    requests it
key: C
explanation: The rules prohibit a course provider from allowing anyone to use its premises or
  classroom, including distance or virtual platforms, to recruit new affiliates for any real estate
  brokerage company. The suggestion that recruiting is acceptable because students are unlicensed is
  wrong — the prohibition is not conditioned on the students' licensure status, and no approval
  mechanism for recruiting visits exists in the rule.
