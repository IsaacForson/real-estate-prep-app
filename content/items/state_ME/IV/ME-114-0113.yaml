stem: A Commission member files a complaint against a licensee and requests an investigation. Under
  Maine Real Estate Commission rules, what must the member do regarding participation in the
  Commission's consideration of that complaint?
options:
  - The member must be disqualified from participating in consideration of the complaint and/or
    investigation.
  - The member must be allowed to participate in the discussion but not vote on the outcome.
  - The member must be required to recuse themselves only if the complaint involves a close relative.
  - The member must be permitted to discuss the issue with other members as long as they are not
    witnesses.
key: A
explanation: The rule provides that filing a complaint or requesting an investigation disqualifies
  the member from participating in the consideration of that complaint or investigation. The other
  options either allow participation, limit recusal to close relatives, or permit discussion with
  other members, all of which contradict the rule.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 3
  url: null
  quoted_text: A member of the Commission may file a complaint or request an investigation, but such
    complaint or request shall serve to disqualify the member from participating in consideration of
    the complaint and/or investigation.
