stem: A licensed broker asks the director of an approved pre-licensing school for permission to
  address students during a virtual class session about joining the broker's real estate company as
  new affiliates. Under Maine Real Estate Commission rules, what must the course provider do?
options:
  - Permit the recruiting if students give written consent
  - Allow the presentation if it occurs after instruction ends
  - Report the broker's request to the Commission within ten days
  - Refuse to allow use of the virtual platform for recruiting
key: D
explanation: The rules prohibit a course provider from allowing anyone to use its premises or
  classroom, including distance or virtual platforms, to recruit new affiliates for any real estate
  brokerage company. Because the ban expressly covers virtual platforms, allowing the presentation
  after class hours would still violate the rule.
