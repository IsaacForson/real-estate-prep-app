stem: A party wishes to intervene in a Commission proceeding. The hearing is scheduled for November
  5. Assuming no good cause shown, by what date must the party file the application for intervention
  to comply with Maine Real Estate Commission rules?
options:
  - October 29
  - October 30
  - November 1
  - November 3
key: A
explanation: The rule requires intervention applications to be filed, except for good cause, at
  least seven days before the hearing. Subtracting seven days from November 5 gives October 29,
  which meets the deadline. The October 30 date would provide only six days' notice, which is
  insufficient.
citation:
  source: ===== 02-039 C.M.R. ch. 350 ===== § 4
  url: null
  quoted_text: An application for intervention in a Commission proceeding shall be filed, except for
    good cause shown, at least seven (7) days in advance of the scheduled hearing.
