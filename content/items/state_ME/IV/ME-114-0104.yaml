stem: Under Maine Real Estate Commission rules, what must happen if a Commission member files a
  complaint requesting an investigation?
options:
  - The member must be disqualified from participating in consideration of the complaint and/or
    investigation.
  - The member may remain involved in the investigation if they abstain from voting on the outcome.
  - The member must inform the Chairperson but may still discuss the case with fellow commissioners.
  - The member must attend the hearing but is barred from voting on any related matter.
key: A
explanation: The rule states that a member who files a complaint or request for investigation is
  disqualified from participating in consideration of that complaint and/or investigation. The
  member may not discuss the issue with other members except as a witness or party until after final
  Commission action and appeal rights are exhausted. The distractor suggesting the member may remain
  involved if they abstain from voting is incorrect because participation in consideration is
  prohibited entirely, not just voting.
citation:
  source: "### 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 3"
  url: null
  quoted_text: A member of the Commission may file a complaint or request an investigation, but such
    complaint or request shall serve to disqualify the member from participating in consideration of
    the complaint and/or investigation.
