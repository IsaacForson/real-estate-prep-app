stem: A continuing education provider offers an asynchronous distance education course that does not
  include a comprehensive examination. Under the Maine Real Estate Commission rules, may the course
  be approved for continuing education credit?
options:
  - The course may be approved after the licensee completes a final examination with a passing grade.
  - The course may be approved if the provider includes a detailed syllabus with the application.
  - The course may be approved because asynchronous delivery meets the continuing education
    standards.
  - The course may not be approved because asynchronous distance education requires a comprehensive
    examination.
key: D
explanation: The rule states that asynchronous distance education may be approved only if it
  includes a comprehensive examination to be completed before a grade or credit is awarded. Offering
  such a course without the examination fails this requirement, so approval is not permitted. The
  distractor claiming approval based on asynchronous delivery alone ignores the mandatory
  examination condition.
