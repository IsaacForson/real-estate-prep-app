stem: Under Maine Real Estate Commission rules, what exception exists to the confidentiality
  requirement for offers and contracts?
options:
  - Buyer names and addresses may be disclosed without the parties' permission
  - Confidentiality does not apply to executed purchase and sale contracts
  - Licensees may disclose offer terms after the offer is withdrawn
  - Documents must be made available to the Director of the Commission upon request
key: D
explanation: Section 12 explicitly states that, notwithstanding the confidentiality provision, any
  document referenced in that section must be made available to the Director upon request. This
  overrides the general confidentiality rule. The distractor about buyer names and addresses is
  incorrect because those items are expressly prohibited from disclosure.
