stem: A licensee contacts a seller who has an exclusive written brokerage agreement with another
  brokerage and offers a free home staging service as an inducement, without disclosing any
  conditions. Under Maine Real Estate Commission rules, is this permissible?
options:
  - The offering is permissible because the inducement is a nominal service and requires no
    disclosure.
  - The offering is not permissible because the licensee is soliciting a written brokerage agreement
    despite knowing of an exclusive agreement.
  - The offering is permissible if the licensee obtains written consent from the designated broker
    before making the offer.
  - The offering is permissible if the seller initiates the contact with the licensee.
key: B
explanation: Section 10 prohibits solicitation of a written brokerage agreement when the licensee
  knows or should know of an existing exclusive agreement; offering an inducement as part of that
  solicitation is therefore not allowed. The suggestion that the offering is permissible if the
  licensee obtains written consent from the designated broker before making the offer is incorrect
  because the stem indicates the licensee initiated the contact, not the seller, so that exception
  does not apply.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 10
  url: null
  quoted_text: A licensee shall not solicit a written brokerage agreement from a seller or buyer if
    the licensee knows, or acting in a reasonable manner should have known, that the buyer or seller
    has contracted with another real estate brokerage agency for the same real estate brokerage
    services on an exclusive basis.
