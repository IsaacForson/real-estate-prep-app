stem: "A Maine brokerage agency serves as a disclosed dual agent with proper written consent from
  both the seller and the buyer. During negotiations, the buyer tells the affiliated licensee she
  would pay up to $15,000 more than her current offer if necessary. Under 32 M.R.S. § 13275, the
  dual agent:"
options:
  - Must withdraw from representing the buyer
  - Must keep that information from the seller
  - Must disclose that information to the seller
  - May share it if the seller asks directly
key: B
explanation: A disclosed dual agent may share information gained from one party that is relevant to
  the transaction, but the statute carves out specific exceptions, including the willingness or
  ability of the buyer to pay more than has been offered. The buyer's ceiling price falls squarely
  within that protected category, so it may not be revealed. Relevance to the transaction does not
  override the enumerated exceptions, and a seller's request does not create consent.
