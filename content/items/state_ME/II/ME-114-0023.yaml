stem: When do Maine real estate agency licenses expire absent a different date set by the
  Commissioner of Professional and Financial Regulation?
options:
  - On December 31st of each biennial period for which the license was issued
  - On June 30th of the calendar year that follows initial licensure
  - On the last business day of the licensee's birth month every year
  - On the anniversary date of the original license issuance every single year
key: A
explanation: Agency licenses expire on December 31st of each biennial licensing period unless the
  Commissioner designates a different expiration schedule.
