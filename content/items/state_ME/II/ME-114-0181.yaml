stem: A Maine brokerage agency wishes to advertise its services under the trade name 'Pine Tree
  Realty' but its current license is issued under the legal name 'Atlantic Brokers, Inc.' What must
  the agency do to comply with 32 M.R.S. § 13176?
options:
  - Continue using the legal name in all advertising and add the trade name only on social media
    profiles
  - Submit a written request to the Director to approve the trade name for use without changing the
    license
  - Use the trade name in advertising while keeping the existing license unchanged, as long as the
    name is not misleading
  - Obtain a new license issued under the trade name 'Pine Tree Realty' before using that name in
    any advertising
key: D
explanation: The statute allows a business to operate under a trade name only if the license is
  issued under that trade name, and the trade name must be used in all real estate brokerage related
  advertising. Therefore the agency must first obtain a license issued under the trade name before
  advertising with it. The other options either fail to secure the required license or permit
  advertising without the proper license.
citation:
  source: "32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act) — Maine Revised Statutes Title
    32, Chapter 114: Real Estate Brokerage License Act 32 M.R.S. § 13176"
  url: null
  quoted_text: Agencies may conduct business under a trade name, provided that their license is issued
    under the trade name. If an agency is licensed with a trade name, that trade name shall be used
    by the agency, its employees and independent contractors in all real estate brokerage related
    advertising.
