stem: "A Maine real estate brokerage agency begins providing brokerage services to a buyer without
  signing any written brokerage agreement. Under 32 M.R.S. § 13282, the agency is presumed to be
  acting as:"
options:
  - A transaction broker for the buyer
  - A buyer agent for the buyer
  - A disclosed dual agent in the deal
  - A subagent of the seller
key: A
explanation: The statute presumes that an agency providing brokerage services is acting as a
  transaction broker unless it has agreed in a written brokerage agreement to represent a party as a
  client. Client representation cannot be created orally or by implication, so the absence of a
  writing forecloses buyer agency. Disclosed dual agency requires informed written consent of all
  parties, which is also missing here.
