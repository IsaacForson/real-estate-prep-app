stem: A course provider submits a complete syllabus for an online qualifying education course
  (non-live format). Under Chapter 360, Section 2, how many days does the Director have to provide
  written notification of approval or denial?
options:
  - Ninety (90) days
  - Sixty (60) days
  - Forty-five (45) days
  - Thirty (30) days
key: C
explanation: The rule states that for courses provided in any format other than a live format, the
  Director must notify the provider within forty‑five (45) days of receiving a complete syllabus.
  Therefore, the correct answer is forty‑five (45) days. The thirty‑day option applies only to
  live‑format courses, making it a common distractor.
