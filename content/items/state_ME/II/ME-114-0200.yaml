stem: "A transaction broker promotes the interests of the seller to secure a higher sale price.
  Under 32 M.R.S. § 13283(3)(C), this action is:"
options:
  - This action is permitted because it is considered a ministerial act.
  - This action is prohibited unless required to comply with the section.
  - This action is required to fulfill the duty of honesty to the parties.
  - This action is allowed if disclosed to the buyer.
key: B
explanation: The statute allows a transaction broker to promote the interests of a party only when
  required to comply with this section; otherwise, promoting interests is prohibited. Promoting the
  seller’s interests to obtain a higher price is not required by the section, so it is prohibited.
  The most tempting distractor is the idea that the action is allowed if disclosed to the buyer, but
  disclosure does not override the prohibition unless the promotion is required for compliance.
