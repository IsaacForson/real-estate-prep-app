stem: Under Maine Real Estate Commission rules, which of the following is **NOT** considered a term
  of an offer?
options:
  - Buyer names and addresses
  - Closing date and possession
  - Purchase price and deposit
  - Financing amount and date
key: A
explanation: The rule explicitly states that buyer names and addresses are not terms of an offer and
  shall not be disclosed. Therefore, buyer names and addresses are not considered a term. The other
  options (purchase price, closing date, financing contingency) are typical terms of an offer and
  thus subject to confidentiality unless the parties give written permission.
