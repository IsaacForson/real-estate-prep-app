stem: A provider enters into a long‑term agreement that obligates the owner to pay a fee upon sale
  even though the sale is not the result of the provider’s brokerage service. Which provision of 32
  M.R.S. § 13177‑B does this violate?
options:
  - Subsection 2(B)
  - Subsection 2(D)
  - Subsection 2(C)
  - Subsection 2(A)
key: B
explanation: The statute prohibits obligating the owner to pay a fee when the sale is not result of
  the provider’s service, which is subsection 2(D). The distractor Subsection 2(A) concerns binding
  a future owner not a party, which does not match the scenario.
citation:
  source: 32 M.R.S. § 13177-B(2)(D)
  url: null
  quoted_text: Obligate the owner to pay a fee or commission to the provider upon a sale or transfer
    of the residential real estate when the sale or transfer is not the result of a real estate
    brokerage service provided by the provider.
