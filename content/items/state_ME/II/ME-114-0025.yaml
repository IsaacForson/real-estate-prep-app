stem: A designated broker assigns a newly licensed sales agent to handle a complex commercial lease
  without checking the agent's experience or reviewing the file. This practice conflicts with the
  statutory duty to
options:
  - Delegate every transaction file to the most senior licensee in the agency
  - Require a weekly written report from each affiliated licensee in the agency
  - Exercise supervision that matches the employee's own qualifications
  - Co-sign every listing agreement no matter the agent's experience level
key: C
explanation: The designated broker must exercise a reasonable level of supervision commensurate with
  an employee's qualification and experience, which assigning unsupervised complex work to a new
  agent fails to do.
citation:
  source: "32 M.R.S. § 13179 (Maine Revised Statutes Title 32, Chapter 114: Real Estate Brokerage
    License Act)"
  url: null
  quoted_text: >-
    The designated broker shall exercise a reasonable level of supervision commensurate with the
    level

    of qualification and experience of agency employees and independent contractors supervised, in
