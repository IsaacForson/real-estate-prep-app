stem: A person with no real estate license negotiates the sale of a neighbor's house for a fee.
  Under the license-required provision, this conduct is best described as
options:
  - Permissible, because a single transaction does not trigger licensing duties
  - Unlawful, because brokerage without a license under the chapter is barred
  - Unlawful, but limited to instances where the fee exceeds the commission rate
  - Permissible, because neighbors are exempt from real estate licensing rules
key: B
explanation: The statute makes it unlawful for any person to engage in real estate brokerage,
  including negotiating a sale for compensation, without holding a current brokerage license or
  authorization under the chapter.
