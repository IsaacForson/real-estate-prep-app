stem: A licensee executes a purchase and sale agreement on Wednesday. When must the licensee provide
  originals or true copies of the document to the designated broker under Maine Real Estate
  Commission rules?
options:
  - Zero days after
  - Five days after
  - One day after
  - Three days after
key: B
explanation: The rule requires that an affiliated licensee provide documents to the designated
  broker within five calendar days after execution. Executing on Wednesday means the deadline is
  five days later, i.e., the following Monday. Providing the documents the same day, next day, or
  two days after would be too early but still permissible; however the question asks when they must
  be provided, i.e., the latest permissible time, which is five days after execution.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 12 Section 13
  url: null
  quoted_text: An affiliated licensee must provide originals or true copies of all real estate
    brokerage documents and records prepared in a real estate transaction as listed in Chapter 400,
    Section 4 of the Commission's rules to the designated broker within five (5) calendar days after
    execution of the document or record.
