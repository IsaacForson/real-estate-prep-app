stem: A brokerage agency proposes to charge a $120 fee for processing a real estate license
  application. Under 32 M.R.S. § 13007, is this fee permissible?
options:
  - The fee is permissible if approved by the Real Estate Commission before implementation.
  - The fee is permissible because it is reasonable and necessary for the service provided.
  - The fee is impermissible because it exceeds the $100 maximum allowed for any one purpose.
  - The fee is impermissible because only the Director may set fees, not the brokerage agency.
key: C
explanation: The statute sets a cap of $100 for any one purpose fee. A $120 fee exceeds this cap,
  making it impermissible. Reasonableness, commission approval, or who sets the fee does not
  override the statutory limit.
