stem: Under Maine law, what is the basis for the commission to grant a waiver allowing a sales agent
  to remain licensed beyond the 2-year term?
options:
  - Waivers may be granted based on extenuating circumstances as defined by commission rules.
  - Waivers may be granted based on the agent being affiliated with a broker for at least 3 years.
  - Waivers may be granted based on the agent completing additional continuing education.
  - Waivers may be granted based on the agent paying a renewal fee.
key: A
explanation: The waiver provision states that waivers shall be granted on the basis of extenuating
  circumstances as defined by commission rules. Therefore, the correct basis is extenuating
  circumstances. Options referring to additional continuing education, renewal fees, or affiliation
  length are not statutory bases for a waiver.
