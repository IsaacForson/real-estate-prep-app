stem: A licensee completed a continuing education course two years ago and submitted the certificate
  of completion for a prior license renewal. The licensee wishes to renew the license again and
  wants to submit the same certificate for continuing education credit. What is the correct action
  according to Maine Real Estate Commission rules?
options:
  - By submitting the certificate along with proof of a passing grade of at least 85% for the course.
  - By retaking the course or obtaining a new certificate, because a certificate may be submitted
    only once for license renewal.
  - By submitting the certificate only if the course was completed within the preceding two years.
  - By submitting the same certificate again, as there is no limit on reusing certificates for
    renewal.
key: B
explanation: The rules state that course completion certificates may only be submitted once for the
  purpose of a license renewal; therefore, the licensee cannot reuse the same certificate and must
  retake the course or obtain a new certificate. The two‑year limitation applies to which hours may
  be used, but does not override the prohibition on resubmitting the same certificate.
