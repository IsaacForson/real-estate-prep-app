stem: A qualifying education course provider allows a local brokerage to set up a recruitment table
  in the classroom during a break to speak with students about joining their firm. Is this
  permissible under Maine Real Estate Commission rules?
options:
  - It is permissible because the provider disclosed the recruitment activity to students, obtained
    written consent, and informed the Director.
  - It is not permissible because the provider shall not allow anyone to use its premises to recruit
    new affiliates for any real estate brokerage company.
  - It is permissible because the recruitment occurred after the class session ended, the room was
    vacant, and no students were present.
  - It is permissible because the recruiter is an affiliate of the provider's own brokerage,
    presented only general career information, and did not solicit specific agreements.
key: B
explanation: The rule prohibits a course provider from allowing anyone to use its premises or
  classroom to recruit new affiliates for any real estate brokerage company. Therefore, the
  described activity is not permissible. Claims that disclosure, consent, timing, vacancy, or
  recruiter affiliation make it allowed are incorrect because the prohibition applies regardless of
  those factors.
citation:
  source: ===== 02-039 C.M.R. ch. 360 ===== Section 2
  url: null
  quoted_text: The course provider shall not allow anyone to use its premises or classroom (including
    distance or virtual platforms) to recruit new affiliates for any real estate brokerage company.
