stem: A licensee lists a multifamily property with a heating system. The seller provides the type
  and age of the heating system but does not know the name of the company that services the system.
  What must the licensee do under Maine Real Estate Commission rules?
options:
  - The licensee must request the seller to provide the name of the heating service company before
    continuing.
  - The licensee must convey in writing that the heating service company information is not
    available prior to or during preparation of an offer.
  - The licensee must disclose the heating service company information verbally to the buyer at
    closing.
  - The licensee may omit the heating service company information from the written disclosure to the
    buyer.
key: B
explanation: Section 16 requires that all pertinent heating system information be conveyed in
  writing prior to or during preparation of an offer, and that the fact that such information is not
  available must also be conveyed in writing. Therefore, the licensee must disclose in writing that
  the service company information is unavailable. The distractor suggesting the licensee should ask
  again does not satisfy the requirement to convey the unavailability.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 16
  url: null
  quoted_text: Such information and any other information obtained through different sources and means
    pertinent to the heating system(s) and/or source(s) shall be conveyed, in writing, to a buyer
    prior to or during the preparation of an offer. The fact that information pertinent to the
    heating system(s) and/or source(s) is not available shall be conveyed, in writing, when such is
    the case.
