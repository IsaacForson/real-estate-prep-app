stem: A buyer’s agent discovers that the property is subject to an undisclosed easement that could
  affect the buyer’s use of the land. According to 32 M.R.S. § 13274(1)(B)(3), what must the agent
  do?
options:
  - Disclosing the material fact to the buyer in a timely manner as required by law
  - Informing the seller’s agent only about the easement and taking no further action
  - Keeping the easement confidential to protect the buyer’s negotiating position
  - Waiting until after closing to reveal the easement and advise the buyer accordingly
key: A
explanation: The statute requires a buyer agent to disclose to the buyer material facts of which the
  agent has actual knowledge or should have known concerning the transaction. The most tempting
  distractor, informing the seller’s agent only, does not fulfill the duty to disclose to the buyer.
