stem: A licensee completed a continuing education course 25 months ago and now wishes to apply those
  hours toward license renewal. Under Section 8 of the Maine Real Estate Commission rules, may the
  licensee use those hours?
options:
  - Yes, because any continuing education completed within the last three years is acceptable.
  - No, because only clock hours accumulated during the preceding two years may be used.
  - Yes, as long as the licensee retakes the course examination.
  - No, because courses older than one year are automatically invalid.
key: B
explanation: The rule limits usable clock hours to those accumulated during the preceding two (2)
  years for renewal or reactivation. Hours from a course taken 25 months ago fall outside this
  window and therefore cannot be used. The distractor claiming a three‑year allowance contradicts
  the two‑year limitation.
