stem: An affiliated licensee has just executed a purchase and sale agreement. Under Maine Real
  Estate Commission rules, how many calendar days does the licensee have to provide the original or
  true copy of this agreement to the designated broker?
options:
  - Five (5) calendar days
  - Seven (7) calendar days
  - Three (3) calendar days
  - Ten (10) calendar days
key: A
explanation: The rule requires an affiliated licensee to provide originals or true copies of all
  real estate brokerage documents to the designated broker within five (5) calendar days after
  execution of the document or record. The five‑day period is the correct timeframe. The three‑day
  option understates the required period, while seven and ten days exceed it.
