stem: "A Maine brokerage agency's written listing agreement with a seller expires on June 30. The
  agreement contains a clause giving the agency a right to its fee for any sale to a buyer the
  agency introduced, with that right lasting nine months after expiration. Under 32 M.R.S. §
  13177-A, this clause is:"
options:
  - Enforceable only for the first six months after the agreement expires
  - Enforceable for the full nine months because the seller signed it
  - Void entirely because fee rights cannot survive expiration
  - Enforceable only if the buyer was introduced before expiration
key: A
explanation: Section 13177-A(2) provides that any brokerage agreement provision extending an
  agency's right to a fee following expiration may not extend that right beyond 6 months, so the
  clause is enforceable, if at all, only through December 30 — six months after the June 30
  expiration. The seller's signature cannot validate the extra three months because the statute caps
  the extension regardless of consent. The clause is not void entirely; the statute limits, rather
  than prohibits, post-expiration fee rights.
