stem: Under Maine Real Estate Commission rules, what percentage chance of flooding in any given year
  defines an area of special flood hazard?
options:
  - A 5% annual chance
  - A 2% annual chance
  - A 1% annual chance
  - A 0.5% annual chance
key: C
explanation: The rule defines an area of special flood hazard as land having a 1% or greater chance
  of flooding in any given year. Therefore, the threshold percentage is 1%. The distractor stating a
  0.5% annual chance is incorrect because it is below the 1% threshold.
