stem: A licensee is applying for renewal and completed 24 clock hours of approved continuing
  education 18 months ago. Under 32 M.R.S. § 13197(1), is this sufficient to meet the continuing
  education requirement for renewal?
options:
  - The licensee has met the requirement because the hours were completed within the prior 2 years
    and exceed 21 hours.
  - The licensee has not met the requirement because at least 21 clock hours must be completed
    within the 2 years prior to application.
  - The licensee has met the requirement because any continuing education completed within the last
    3 years qualifies.
  - The licensee has not met the requirement because the licensee must complete exactly 21 clock
    hours.
key: A
explanation: The rule demands 21 clock hours of CE completed within the 2 years before the renewal
  application; 24 hours finished 18 months ago satisfies both the hour and timeframe requirements.
  The distractor claiming at least 21 hours must be completed within the 2 years prior is actually
  true but leads to a “no” answer, which is wrong because the condition is met.
