stem: A licensee completes an asynchronous continuing education distance education course and
  receives a final grade of 80%. Under Section 8 of the Maine Real Estate Commission rules, may the
  licensee use this course to satisfy the continuing education requirement for license renewal?
options:
  - The licensee may use the course if it is approved by the Director.
  - The licensee may not use the course because asynchronous courses are not accepted for renewal.
  - The licensee may use the course to satisfy the continuing education requirement.
  - The licensee may not use the course because the grade is below the required 85%.
key: D
explanation: Section 8 requires a minimum grade of 85% for asynchronous distance education courses
  used for license renewal; a grade of 80% fails this requirement. The distractor suggesting
  approval by the Director is sufficient is incorrect because the grade requirement still applies.
