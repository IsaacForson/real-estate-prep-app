stem: A licensed Maine brokerage agency opens a second office across town and advertises that
  address as a place where the public can reach its agents about brokerage services. Under 32 M.R.S.
  § 13173, what must the agency do regarding that second location?
options:
  - Obtain a branch office license for the advertised second location
  - File a notice of the new address with the director within 10 days
  - Relocate its designated broker to the second location full time
  - Close its original office so only one fixed place of business remains
key: A
explanation: Section 13173(6) requires that locations other than the main office that are advertised
  as places where the public may contact the agency or its employees concerning brokerage services
  must be licensed as a branch office. Because this second office is advertised for public contact,
  it needs a branch office license. The 10-day reporting rule applies to changes of the agency's own
  address or name, not to opening an additional advertised location, and the statute does not
  require relocating the designated broker or closing the original office.
