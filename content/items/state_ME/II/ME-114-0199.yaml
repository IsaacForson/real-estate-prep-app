stem: "A transaction broker conducts an inspection of a property for the benefit of the buyer. Under
  32 M.R.S. § 13283(3)(A), this action is:"
options:
  - This action is allowed if the buyer consents to the inspection.
  - This action is prohibited as it violates the duty not to conduct inspections.
  - This action is permitted because it is considered a ministerial act.
  - This action is required to protect the buyer's interests during the transaction.
key: B
explanation: The statute prohibits a transaction broker from conducting an inspection,
  investigation, or analysis of a property for the benefit of any party. Therefore, performing such
  an inspection for the buyer’s benefit is prohibited. The most tempting distractor is the claim
  that the action is permitted as a ministerial act, but the statute explicitly forbids inspections
  regardless of their characterization.
