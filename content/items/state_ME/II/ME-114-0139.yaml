stem: "A Maine real estate sales agent’s license lapsed 100 days ago. Under 32 M.R.S. § 13194, to
  obtain a renewal license the agent must:"
options:
  - The agent must submit proof of completed continuing education only
  - The agent must pass the licensing exam and pay the renewal fee
  - The agent must obtain a letter of good standing from another state
  - The agent must wait for the next biennial renewal period to apply
key: B
explanation: The statute denies renewal for licenses lapsed over 90 days unless the applicant passes
  the required licensing exam. Thus the agent must pass the exam and pay the fee. The other options
  either omit the exam or rely on continuing education, reciprocity, or waiting, which do not
  satisfy the rule.
