stem: A licensee receives an offer on May 10 and wants to share the offer price with a friend who is
  not a party to the offer, before the offer is withdrawn, expired, or rejected in writing. Is this
  permissible under Section 12?
options:
  - The disclosure is permissible if the licensee obtains verbal permission from the parties
  - The disclosure is not permissible because prior written permission is required before disclosure
  - The disclosure is permissible after the offer is rejected in writing
  - The disclosure is not permissible unless the offer has expired
key: B
explanation: Section 12 prohibits disclosing offer terms to anyone other than the parties without
  the prior written permission of the parties prior to withdrawal, expiration or written rejection.
  Verbal permission does not satisfy the requirement.
