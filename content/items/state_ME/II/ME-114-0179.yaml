  url: null
  quoted_text: A real estate brokerage agency or affiliated licensees shall not disclose any terms of
    an offer or counteroffer to anyone other than the parties to the offer or counteroffer without
    the prior written permission of the parties prior to withdrawal, expiration or written rejection
    of the offer or counteroffer.
