stem: A licensee's employment with a brokerage agency ends on June 1. The licensee continues to
  perform brokerage services on June 15 without obtaining a new active license. Is this lawful under
  32 M.R.S. § 13180?
options:
  - The action is permissible because the licensee previously held an active license, yet prior
    licensure does not authorize continued practice after the employment relationship with the
    brokerage has ended.
  - The action is not permissible because it is unlawful for any broker, associate broker or real
    estate sales agent to perform any brokerage services without first receiving a new active
    license.
  - The action is permissible if the licensee informs clients of the employment change, but
    notification alone does not satisfy the statutory obligation to hold an active license before
    engaging in any brokerage activity.
  - The action is not permissible only if the licensee receives a commission for the services, and
    even then it would still violate the licensing requirement because performing brokerage services
    without an active license is prohibited regardless of compensation.
key: B
explanation: Under 32 M.R.S. § 13180, it is unlawful for any broker, associate broker or real estate
  sales agent to perform brokerage services without first obtaining an active license after
  employment ends. Therefore, continuing to work on June 15 without a new active license violates
  the statute, making the statement that the action is not permissible because a new active license
  is required correct. The claim that permissibility depends on receiving a commission is incorrect
  because the prohibition applies regardless of compensation. The claim that notifying clients makes
  the activity permissible is incorrect because notice does not satisfy the licensing requirement.
  The claim that prior licensure alone permits the activity is incorrect because the statute
  requires a current active license, not merely a previous one.
