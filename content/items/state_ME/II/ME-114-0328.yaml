  url: null
  quoted_text: If it appears to the director that grounds for denial of a license or renewal exists,
    the director shall deny the license or renewal and notify the applicant in writing of the basis
    for denial together with notice of the applicant's right to a hearing before the commission, if
    requested in accordance with commission rules within a 30‑day period.
