stem: Under Maine law, how many days does an applicant have to request a hearing after being denied
  a license?
options:
  - Thirty days
  - Ten days
  - Ninety days
  - Six months
key: A
explanation: The statute requires the director to notify the applicant of the right to a hearing
  before the commission, if requested in accordance with commission rules within a 30‑day period.
  Therefore the applicant has 30 days to request a hearing. The distractor “Ten days” confuses the
  hearing request period with the 10‑day period for reporting changes of address or other material
  changes.
