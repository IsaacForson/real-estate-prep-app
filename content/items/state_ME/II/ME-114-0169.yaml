stem: A director arrives at a brokerage office at 6:30 p.m. on a Thursday to inspect records. Under
  32 M.R.S. § 13184, is the brokerage required to allow the inspection?
options:
  - Yes, because the director has authority to inspect records at any time.
  - No, because inspection is required only during generally recognized business hours.
  - Yes, provided the brokerage receives 24‑hour notice.
  - No, unless the brokerage consents to after‑hours inspection.
key: B
explanation: The statute provides that records must be open for inspection during generally
  recognized business hours. An arrival at 6:30 p.m. is outside those hours, so the brokerage is not
  required to allow inspection at that time.
