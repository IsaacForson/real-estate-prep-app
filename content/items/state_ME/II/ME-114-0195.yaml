stem: Under Maine Real Estate Commission rules, how many calendar days after execution must an
  affiliated licensee provide originals or true copies of real estate brokerage documents to the
  designated broker?
options:
  - Three (3) calendar days
  - Five (5) calendar days
  - Seven (7) calendar days
  - Ten (10) calendar days
key: B
explanation: The rule requires affiliated licensees to submit originals or true copies of all real
  estate brokerage documents to the designated broker within five (5) calendar days after the
  document is executed. Therefore, the correct answer is five (5) calendar days. The three‑day
  option is incorrect because the rule specifies a five‑day period, not three.
citation:
