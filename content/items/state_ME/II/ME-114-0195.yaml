    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 13.2
  url: null
  quoted_text: An affiliated licensee must provide originals or true copies of all real estate
    brokerage documents and records prepared in a real estate transaction as listed in Chapter 400,
    Section 4 of the Commission's rules to the designated broker within five (5) calendar days after
    execution of the document or record.
