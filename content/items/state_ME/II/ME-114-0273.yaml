stem: A licensee lists a property, and the seller states that access is via a private road
  maintained by a road association. The licensee informs the buyer of this access information
  verbally during a showing on April 10, and prepares a written offer on April 11. Is this
  permissible under Maine Real Estate Commission rules?
options:
  - The licensee may disclose the access information verbally to the buyer before preparing the
    offer, as long as the buyer acknowledges it.
  - The licensee must provide the access information in writing to the buyer prior to or during
    preparation of the offer.
  - The licensee may provide the access information in writing to the buyer after the offer is
    prepared but before it is signed by the buyer.
  - The licensee is not required to disclose any access information if the seller describes the
    means as a public way.
key: B
explanation: Under Section 20 of the Maine Real Estate Commission rules, any information about
  access to the property must be conveyed in writing to the buyer prior to or during preparation of
  an offer. Because the licensee only disclosed the access information verbally, the requirement is
  not satisfied. The statement that the licensee may disclose the access information verbally to the
  buyer before preparing the offer, as long as the buyer acknowledges it, is incorrect because the
  rule mandates written disclosure, not merely verbal communication, regardless of timing.
