stem: Under Maine's Real Estate Brokerage License Act, how does the statute define "real estate" for
  licensing purposes?
options:
  - Fee simple title to residential land located within an incorporated municipality
  - A lease agreement that has been recorded at the registry of deeds for one year
  - Estates and lesser interests in land, plus a business that includes real estate
  - Land that has been improved with a structure used for commercial occupancy
key: C
explanation: The Act defines real estate broadly to cover all estates and lesser land interests, and
  it extends the definition to an existing business when real estate is part of that business.
citation:
  source: "32 M.R.S. § 13001 (Maine Revised Statutes Title 32, Chapter 114: Real Estate Brokerage
    License Act)"
  url: null
  quoted_text: |-
    "Real estate" means all estates and lesser interests in land and an existing business
    if real estate is a part of the business.
