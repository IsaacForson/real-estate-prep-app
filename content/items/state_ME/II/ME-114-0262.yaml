stem: A seller agent learns of a material fact that could negatively impact the seller’s property
  value. The seller consents in writing to the disclosure of this fact to a prospective buyer.
  According to Maine law, may the seller agent disclose the fact to the buyer?
options:
  - The agent may disclose the fact because the seller has granted consent to disclose the
    information.
  - The agent may disclose the fact because the information is required by law.
  - The agent may disclose the fact because the information has become public through the seller’s
    conduct.
  - The agent may disclose the fact because the information is considered non-material.
key: A
explanation: The confidentiality duty of a seller agent does not apply when the seller grants
  consent to disclose the information. The statute lists seller consent as an exception to the
  confidentiality obligation. The other options, while also exceptions, do not match the scenario;
  the claim that the information is non-material is not a recognized exception.
