stem: A licensee asks the seller about the private water supply of a listed single-family home. The
  seller says they do not know the date of the most recent water test. What must the licensee do
  under Section 15 of the Maine Real Estate Commission rules?
options:
  - Convey in writing that the information is not available prior to or during preparation of an
    offer
  - Provide the seller's estimate of the test date verbally to the buyer
  - Wait until after the offer is prepared to disclose the missing information
  - Assume the test was conducted within the last year and disclose that assumption
key: A
explanation: Section 15 states that if information regarding the private water supply is not
  available, the licensee must convey that fact in writing to the buyer prior to or during
  preparation of an offer. Providing a verbal estimate, waiting until after the offer, or assuming a
  date would not satisfy the written disclosure requirement.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 15
  url: null
  quoted_text: Such information and any other information obtained through different sources and means
    pertinent to the private water supply shall be conveyed, in writing, to a buyer prior to or
    during preparation of an offer. The fact that information regarding the private water supply is
    not available shall also be conveyed, in writing, when such is the case.
