stem: A sales agent whose license expired after the 2-year term requests a waiver to continue
  licensing, citing desire to earn additional income. Under Maine law, may the commission grant the
  waiver?
options:
  - The commission may grant the waiver because the agent has been affiliated with a broker for at
    least 3 years.
  - The commission may grant the waiver because the agent wants to earn additional income.
  - The commission may grant the waiver because the agent’s situation qualifies as extenuating
    circumstances as defined by commission rules.
  - The commission may grant the waiver because the agent has completed additional continuing
    education.
key: C
explanation: Waivers may be granted only on the basis of extenuating circumstances as defined by
  commission rules. A desire to earn additional income does not qualify as extenuating
  circumstances, so the waiver should not be granted. The other options describe factors that are
  not statutory bases for a waiver.
