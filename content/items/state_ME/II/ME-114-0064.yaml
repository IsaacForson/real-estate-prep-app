stem: "Under 32 M.R.S. § 13283, a transaction broker's relationship to the parties in a real estate
  transaction is best described as:"
options:
  - Representing both parties as clients and owing standard agency duties
  - Representing neither party as a client and owing no client duties
  - Representing the seller as a client and owing confidentiality obligations
  - Representing the buyer as a client and owing limited fiduciary duties
key: B
explanation: Section 13283(1) states that a transaction broker does not represent any party as a
  client and is not bound by the client duties in section 13272. Representing both parties with
  consent describes disclosed dual agency, which is a different relationship governed elsewhere in
  the subchapter, not transaction brokerage.
