stem: A licensee finishes a heating system disclosure document on Saturday, March 15. What is the
  latest day the licensee may provide the document to the designated broker to comply with the
  five-calendar-day requirement?
options:
  - March 18
  - March 19
  - March 20
  - March 21
key: C
explanation: Adding five calendar days to March 15 gives March 20 as the final permissible day
  (March 16 day 1, 17 day 2, 18 day 3, 19 day 4, 20 day 5). Providing on March 21 would be six days
  after execution, exceeding the limit.
