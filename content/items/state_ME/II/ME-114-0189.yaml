stem: Under Section 12 of the Maine Real Estate Commission rules, to whom must a brokerage make an
  offer or contract available upon request?
options:
  - The Director of the Commission
  - The designated broker of the agency
  - The buyer's attorney of the party
  - The seller's lender of the loan
key: A
explanation: The rule states that any document referenced in Section 12 shall be made available to
  the Director of the Commission upon request, making the Director the correct recipient. The
  designated broker, while entitled to receive transaction documents from the licensee, is not the
  party to whom the Commission requests the documents.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 12
  url: null
  quoted_text: Notwithstanding the confidentiality provision contained in Section 12(1) of this
    chapter, any such document referenced in this section shall be made available to the Director of
    the Commission upon request.
