stem: An applicant submits an original agency license application signed by the authorized agency
  official but omits the required fee. Under 32 M.R.S. § 13172, what is the consequence of this
  omission?
options:
  - The applicant will be automatically granted a provisional license pending fee payment.
  - The application is considered incomplete and may be denied by the director.
  - The application will be processed normally, and the fee can be paid later.
  - The director may waive the fee requirement if the applicant shows financial hardship.
key: B
explanation: The statute mandates that each original agency license application must be accompanied
  by the fee set under section 13007; omitting the fee renders the application incomplete and
  subject to denial. The statute does not provide for provisional licenses, fee waivers, or deferred
  payment in this context.
