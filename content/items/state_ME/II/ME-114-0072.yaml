stem: "According to 32 M.R.S. § 13177-B(1), a contract qualifies as a long-term agreement if it
  includes:"
options:
  - The owner’s agreement to list the residential real estate at a future date and the provider’s
    ability to perform services more than two years after the contract’s effective date
  - The owner’s agreement to sell the residential real estate immediately and the provider’s ability
    to perform services within two years
  - The owner’s agreement to lease the residential real estate at a future date and the provider’s
    ability to perform services more than two years after the contract’s effective date
  - The owner’s agreement to list the residential real estate at a future date and the provider’s
    obligation to perform services within two years
key: A
explanation: Section 13177-B(1) of Title 32 of the Maine Revised Statutes defines a long-term
  agreement as a contract where the owner agrees to list residential real estate for sale at a
  future date and any portion of the brokerage service may be performed more than two years after
  the contract becomes effective. The correct choice reflects both of these statutory requirements.
  The choice describing an immediate sale and performance within two years does not meet the
  definition because it lacks the future listing date and the extended performance period. The
  choice involving a lease is incorrect because the statute specifically refers to listing for sale.
  The choice stating an obligation to perform within two years is incorrect because the statute
  allows for performance more than two years after the effective date.
citation:
  source: "32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act) — Maine Revised Statutes Title
    32, Chapter 114: Real Estate Brokerage License Act — § 13177-B(1)"
  url: null
  quoted_text: "Long-term agreement means a contract or agreement between a provider and an owner
    under which: (1) The owner agrees to list the owner's residential real estate for sale with the
    provider at a future date; and (2) Any portion of the real estate brokerage service to be
    provided under the contract or agreement by the provider may be performed more than 2 years
    after the date the contract or agreement becomes effective."
