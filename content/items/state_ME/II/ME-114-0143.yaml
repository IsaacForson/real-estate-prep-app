stem: According to 32 M.R.S. § 13283, which duty is a transaction broker **NOT** required to perform?
options:
  - The duty to account for all money and property received
  - The duty to disclose material defects to a buyer
  - The duty to treat all parties honestly and fairly
  - The duty set forth in Maine section 13272
key: D
explanation: Subsection 1 of § 13283 states that a transaction broker is not bound by the duties set
  forth in section 13272. Therefore, the duty described in section 13272 is not required. The other
  options list responsibilities that subsection 2 imposes on transaction brokers, such as accounting
  for funds, disclosing material defects, and treating parties honestly.
