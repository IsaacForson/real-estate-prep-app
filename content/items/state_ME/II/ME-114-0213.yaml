stem: A licensee receives an earnest money deposit as part of an offer to purchase real estate that
  is accepted on Thursday, May 2. According to Maine Real Estate Commission rules, by what date must
  the licensee deposit the earnest money into the trust account?
options:
  - The deposit must be made by close of business on Thursday, May 9.
  - The deposit must be made by close of business on Friday, May 10.
  - The deposit must be made by close of business on Wednesday, May 8.
  - The deposit must be made by close of business on Tuesday, May 7.
key: A
explanation: The rule requires deposit within five business days of acceptance; counting business
  days from Thursday, May 2 gives Friday May 3 (1), Monday May 6 (2), Tuesday May 7 (3), Wednesday
  May 8 (4), and Thursday May 9 (5). The distractors either miscount weekends or give too few days.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — SECTION 3. REAL ESTATE TRUST ACCOUNTS
  url: null
  quoted_text: An earnest money deposit provided to a designated broker as trustee as part of an offer
    to purchase real estate shall be deposited within five (5) business days of acceptance of the
    offer unless otherwise specified in the purchase and sale agreement.
