stem: A licensee completes a private water supply disclosure form on Monday, April 1. By what date
  must the licensee provide the original or true copy of this form to the designated broker under
  Maine Real Estate Commission rules?
options:
  - April 2
  - April 4
  - April 6
  - April 8
key: C
explanation: Execution occurs on Monday, April 1. Counting five calendar days after that date gives
  Tuesday April 2 (1), Wednesday April 3 (2), Thursday April 4 (3), Friday April 5 (4), and
  Saturday April 6 (5). Thus the licensee must provide the form by April 6. The April 4 option only
  allows three days after execution, which does not satisfy the five‑day requirement.
