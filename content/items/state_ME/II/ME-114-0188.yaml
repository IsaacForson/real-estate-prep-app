stem: A continuing education provider holds a live seminar before receiving written approval from
  the Director. Under Section 10 of the Maine Real Estate Commission rules, what action may the
  Director take?
options:
  - Revoking or suspending approval of the continuing education course
  - Issuing a formal warning letter to the provider for noncompliance
  - Requiring the provider to resubmit the course for revised approval
  - Mandating that the provider refund all collected tuition fees
key: A
explanation: Section 10 authorizes the Director to revoke or suspend approval of a course based on a
  violation of this chapter, which includes conducting a class prior to approval as prohibited by
  Section 6. The text does not mention warning letters, making that distractor incorrect.
