stem: A licensee lists a property and asks the seller about access means on April 10. The seller
  responds that access is via a private road maintained by a road association. The licensee provides
  this information to the buyer in writing on April 12, after preparing the offer on April 11. Is
  this permissible under Maine Real Estate Commission rules?
options:
  - "The licensee's action is: permissible, because the information was provided within two days of
    receiving the seller's response."
  - "The licensee's action is: permissible, because the information was provided during preparation
    of the offer."
  - "The licensee's action is: not permissible, because access information must be disclosed only if
    the buyer requests it."
  - "The licensee's action is: not permissible, because the information must be provided prior to or
    during preparation of an offer."
key: D
explanation: The rule requires access information to be conveyed prior to or during preparation of
  an offer. Since the licensee prepared the offer on April 11 and provided the information on April
  12, the disclosure occurred after preparation, violating the rule.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) SECTION 20. Access to Property
  url: null
  quoted_text: Such information and any other information obtained through different sources and means
    pertinent to access to the property shall be conveyed, in writing, to a buyer prior to or during
    preparation of an offer.
