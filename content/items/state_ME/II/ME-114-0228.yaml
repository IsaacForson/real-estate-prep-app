stem: A sales agent license in Maine is initially issued for a two-year nonrenewable term. Under
  what condition may the licensee extend this license for an additional year?
options:
  - By completing an additional 21 clock hours of continuing education before expiration.
  - By submitting a written request for extension, including explanation and fee, subject to the
    Director's sole discretion.
  - By passing the Maine jurisprudence examination within one year of application.
  - By affiliating with a different brokerage agency and submitting a new Designated Broker’s
    Authorization form.
key: B
explanation: The rule explicitly states that the sales agent license term may be extended for one
  year, subject to the sole discretion of the Director, upon a written request with explanation and
  fee. Completing additional continuing education hours does not grant an extension; extension
  depends on the Director's discretion, not on CE hours.
