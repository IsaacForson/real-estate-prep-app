stem: A licensee is preparing to disclose flood risk information for a property. According to Maine
  Real Estate Commission rules, the flood insurance rate map used must have been issued by the
  Federal Emergency Management Agency on or after which date?
options:
  - March 4, 2002
  - July 1, 2006
  - October 1, 2005
  - January 1, 2000
key: A
explanation: The rule requires that the flood insurance rate map used for disclosure be issued by
  FEMA on or after March 4, 2002. Therefore, March 4, 2002 is the correct date. The distractor
  listing January 1, 2000 is incorrect because it precedes the required effective date.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 19
  url: null
  quoted_text: whether, at the time the seller provides the information to the purchaser, the property
    is located wholly or partly within an area of special flood hazard mapped on the effective flood
    insurance rate map issued by the Federal Emergency Management Agency on or after March 4, 2002
