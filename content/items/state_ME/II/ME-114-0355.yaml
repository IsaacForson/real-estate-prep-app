stem: A licensee lists a property, and the seller states that access is via a private road
  maintained by a road association. The licensee prepares a written purchase and sale agreement on
  April 5 and informs the buyer of the access information in writing on April 6, after the agreement
  is signed. According to Maine Real Estate Commission rules, is the licensee's conduct permissible?
options:
  - The licensee's conduct is not permissible because the information was not provided prior to or
    during preparation of an offer
  - The licensee's conduct is not permissible because the licensee must also disclose flood risk
    information
  - The licensee's conduct is permissible because the seller disclosed the access information
  - The licensee's conduct is permissible because the information was provided in writing
key: A
explanation: The rule requires that access information be conveyed in writing prior to or during
  preparation of an offer. Providing the information in writing after the purchase and sale
  agreement has been signed does not satisfy this timing requirement, making the conduct
  impermissible. The option stating that the conduct is permissible because the information was
  provided in writing incorrectly focuses only on the written form while ignoring the timing rule.
citation:
