stem: According to 32 M.R.S. § 13178, what must be deposited into a real estate trust account?
options:
  - Earnest money deposits received from buyers in a transaction
  - Earnest money deposits and any other funds held for clients
  - Agency operating funds, including office expenses and salaries
  - Funds designated as escrow by the parties involved
key: B
explanation: Under 32 M.R.S. § 13178, a real‑estate trust account may be used only for depositing
  earnest‑money deposits and any other money the agency holds for its clients. The answer that
  includes both earnest‑money deposits and other client funds therefore meets the requirement. The
  choice that mentions only earnest‑money deposits omits the additional client funds. The option
  that lists agency operating funds such as office expenses and salaries adds funds that are not
  permitted in a trust account. The answer that limits deposits to funds labeled as escrow does not
  reflect the broader requirement to hold all client‑related money.
