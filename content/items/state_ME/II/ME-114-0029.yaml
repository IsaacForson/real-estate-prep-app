stem: A provider drafts a long-term listing agreement clause stating that the obligation to list
  with the provider will bind whoever later inherits or purchases the owner's home, even if that new
  owner never signed the agreement. This clause is prohibited because the statute bars a long-term
  agreement from purporting to
options:
  - Identify the residential real estate subject to the agreement
  - Specify the method of compensation the provider will receive
  - Bind a future owner who was not a party to the agreement
  - State the date the long-term agreement becomes effective
key: C
explanation: The unfair-agreements statute lists binding a future owner who was not a party to the
  long-term agreement as one of the prohibited purposes a provider may not build into such an
  agreement.
citation:
  source: "32 M.R.S. § 13177-B (Maine Revised Statutes Title 32, Chapter 114: Real Estate Brokerage
    License Act)"
  url: null
  quoted_text: |-
    A provider may not enter into or offer to enter into a long‑term
    agreement that purports to:
    A. Bind any future owner not a party to the long-term agreement;
