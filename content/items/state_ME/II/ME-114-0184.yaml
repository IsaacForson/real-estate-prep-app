stem: "A provider enters into a long-term agreement to list a five-unit apartment building for sale.
  The agreement includes a provision that binds a future owner not a party to the agreement. Under
  32 M.R.S. § 13177-B, this agreement is:"
options:
  - Prohibited due to binding a future owner
  - Not applicable because the building has five units
  - Unenforceable under subsection 2(B) of the statute
  - Required to be recorded in the deed records
key: B
explanation: The definition of residential real estate limits coverage to properties with one to
  four units, so a five‑unit building falls outside the section’s scope and the agreement is not
  subject to its prohibitions. The distractor that labels the agreement prohibited incorrectly
  applies the rule despite the exemption.
