stem: A provider of an approved continuing education course changes the instructor for the next
  scheduled offering but does not report this change to the Director before the course is held.
  Under Maine Real Estate Commission rules, what is the likely consequence of this failure to
  report?
options:
  - The provider must submit a revised application to the Director before teaching the course again
  - The provider must refund all tuition collected from students before issuing course completion
    certificates
  - The Director may revoke or suspend approval of the course based on a violation of this chapter
  - The course completion certificates issued to participants may not be used for license renewal
key: C
explanation: Section 3 of the Maine Real Estate Commission rules requires providers to report any
  change in instruction to the Director before the course is held. Section 10 states that the
  Director may revoke or suspend a course’s approval for any violation of this chapter. Therefore,
  the likely consequence is that the Director may revoke or suspend the course’s approval. The other
  options describe outcomes that are not specified for this particular violation.
