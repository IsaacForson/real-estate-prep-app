stem: A continuing education provider advertises a new course that includes a course description and
  identifies the provider, but the advertisement does not state whether the course is approved or
  pending approval nor the number of clock hours to be awarded. According to Maine Real Estate
  Commission rules, is this advertisement permissible?
options:
  - Yes, as long as the provider submits the missing information to the Director before the course
    begins
  - Yes, because the description and provider identification satisfy the advertising requirements
  - No, because advertisements for continuing education courses are prohibited until after course
    completion
  - No, because the advertisement must also include notice of approval status and clock hours
key: D
explanation: The advertisement is missing the required notice of approval status and clock hours,
  which the rules require for all course advertisements. Therefore, the statement that the
  advertisement is not permissible is correct. Claims that the advertisement is permissible if the
  missing information is submitted later, or that providing only the description and provider
  identification is enough, do not satisfy the rule’s full disclosure requirement.
