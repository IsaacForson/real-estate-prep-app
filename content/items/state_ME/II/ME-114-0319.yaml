stem: A licensee receives a written request from the Director of the Commission for a copy of an
  executed purchase and sale agreement. The licensee refuses, asserting that confidentiality
  protects executed contracts. Is the licensee’s refusal allowed under Section 12 of the Maine Real
  Estate Commission rules?
options:
  - The licensee must provide the document because the Director exception overrides confidentiality
  - The licensee may refuse because confidentiality applies to executed contracts unless the parties
    give written permission
  - The licensee may provide the document only if the buyer and seller also consent
  - The licensee must provide the document only after the transaction has closed
key: A
explanation: The exception in Section 12 applies to any document referenced in that section,
  including executed contracts, and requires disclosure to the Director upon request. This overrides
  the confidentiality rule for executed contracts. The distractor claiming refusal is permissible
  fails to recognize the Director exception.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 12
  url: null
  quoted_text: Notwithstanding the confidentiality provision contained in Section 12(1) of this
    chapter, any such document referenced in this section shall be made available to the Director of
    the Commission upon request.
