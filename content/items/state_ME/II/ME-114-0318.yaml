stem: A licensee receives a written request from the Director of the Commission for a copy of a
  buyer's offer. The licensee refuses to provide the document, citing the confidentiality rule for
  offers. Is the licensee’s refusal permissible under Section 12 of the Maine Real Estate Commission
  rules?
options:
  - The licensee must provide the document because the Director exception overrides confidentiality
  - The licensee may refuse because confidentiality applies to offers unless the parties give
    written permission
  - The licensee may provide the document only if the buyer and seller also consent
  - The licensee must provide the document only after the offer has been withdrawn
key: A
explanation: Section 12 contains an exception that requires documents to be made available to the
  Director upon request, which overrides the confidentiality prohibition. Therefore the licensee
  must comply with the Director's request. The distractor suggesting refusal is permissible ignores
  this statutory exception.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 12
  url: null
  quoted_text: Notwithstanding the confidentiality provision contained in Section 12(1) of this
    chapter, any such document referenced in this section shall be made available to the Director of
    the Commission upon request.
