stem: Under Maine Real Estate Commission rules, how long must most brokerage records be retained
  after all funds related to a transaction have been disbursed?
options:
  - One (1) year after funds are disbursed or until the conclusion of the transaction, whichever
    occurs later
  - Thirty (30) days after the transaction closes unless otherwise agreed
  - Five (5) business days after acceptance of the offer unless otherwise specified
  - Three (3) calendar years after funds are disbursed or the transaction concludes, whichever
    occurs later
key: D
explanation: The rule states that, except for rejected offers and counteroffers (kept one year), all
  other brokerage records must be kept for three calendar years after funds are disbursed or until
  the transaction concludes, whichever occurs later. The one‑year option applies only to rejected
  offers and counteroffers, not to the general record set.
