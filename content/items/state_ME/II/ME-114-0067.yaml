stem: Under 32 M.R.S. § 13176, when may the director refuse to issue a real estate brokerage agency
  license under a particular trade name?
options:
  - When the trade name fails to include the surname of the agency's designated broker or owner
  - When the trade name has already been registered as a trademark by any other company in the state
  - When the trade name has been in use by the agency for fewer than three consecutive years
  - When the trade name is deemed misleading, deceptive, or likely to cause confusion with existing
    businesses
key: D
explanation: Section 13176 permits agencies to operate under a trade name if the license is issued
  under that name, but authorizes the director to refuse a trade name that is misleading, deceptive,
  or likely to result in confusion with other existing businesses. The statute imposes no
  requirement that the name contain the designated broker's surname, and it sets no minimum period
  of prior use. Trademark registration by others is not the statutory standard.
