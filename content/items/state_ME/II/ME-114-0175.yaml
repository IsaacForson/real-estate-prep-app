stem: According to Section 14 of the Maine Real Estate Commission rules, which statement correctly
  describes a licensee's duty regarding disclosure information?
options:
  - A licensee must obtain and provide disclosure information on private water supply, heating,
    waste disposal system, known hazardous materials, potential flood risks, and access to property
    regardless of their relationship with buyer or seller.
  - A licensee must obtain and provide disclosure information on private water supply, heating,
    waste disposal system, known hazardous materials, potential flood risks, and access to property
    only when acting as the seller's agent.
  - A licensee must obtain and provide disclosure information on private water supply, heating,
    waste disposal system, known hazardous materials, potential flood risks, and access to property
    only when the property is listed with a brokerage agency.
  - A licensee must obtain and provide disclosure information on private water supply, heating,
    waste disposal system, known hazardous materials, potential flood risks, and access to property
    only if the buyer requests it in writing.
key: A
explanation: Section 14 states that all licensees have a duty to obtain and provide disclosure
  information on the listed items regardless of their relationship with buyer or seller. The other
  options incorrectly limit the duty to specific agency relationships, listing status, or buyer
  request.
