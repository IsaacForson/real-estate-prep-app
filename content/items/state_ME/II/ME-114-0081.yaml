stem: A continuing education provider schedules and holds a live in-person seminar on property
  valuation before receiving written approval from the Director. Is this permissible?
options:
  - The provider may conduct the seminar because they advertised it as pending approval.
  - The provider may not conduct the seminar until they receive written approval from the Director.
  - The provider may conduct the seminar if they submit the approval application within 30 days.
  - The provider may conduct the seminar after providing a copy of the course outline to attendees.
key: B
explanation: Under Section 6 of the Maine Real Estate Commission rules, course providers are
  prohibited from conducting any class for which students expect continuing education credit before
  obtaining written approval from the Director. Therefore, holding a seminar prior to approval
  violates the rule, regardless of how the course is advertised. The distractor suggesting that
  advertising the course as pending approval permits the class is incorrect because the rule’s
  prohibition applies to the conduct of the class itself, not merely to its promotion.
