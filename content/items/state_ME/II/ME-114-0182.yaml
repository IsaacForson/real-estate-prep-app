stem: A Maine brokerage agency operates solely from a post office box and has no physical office
  where clients can meet the designated broker. To comply with 32 M.R.S. § 13173(5), what must the
  agency do?
options:
  - Establish a fixed and definite physical location where the designated broker and employees can
    be personally contacted without unreasonable delay
  - Continue using the post office box as the agency's official address for all correspondence and
    filings
  - Notify the director that the agency conducts business virtually and request an exemption from
    the physical office requirement
  - Allow clients to meet the designated broker only at properties listed for sale rather than at an
    office
key: A
explanation: The statute requires every agency holding an active license to maintain a fixed and
  definite place of business where its designated broker and employees may be personally contacted
  without unreasonable delay. Operating only from a post office box does not satisfy this
  requirement, so the agency must establish a suitable physical office. The other options either
  retain the inadequate arrangement or seek exemptions not provided for in the law.
