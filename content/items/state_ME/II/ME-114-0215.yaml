stem: Under Maine Real Estate Commission rules, a Commission member who has filed a complaint or
  requested an investigation may discuss the issue with other members only in which circumstance?
options:
  - When the investigation has ended
  - When the member has no involvement
  - When the member acts as witness or party
  - When the member serves as chairperson
key: C
explanation: The rule explicitly states that a member who files a complaint or requests an
  investigation is prohibited from discussing the issue with other members except as a witness or
  party. Therefore, discussion is permitted only in that capacity. The distractor suggesting
  discussion as chairperson is incorrect because the exception does not extend to the chairperson
  role.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 3
  url: null
  quoted_text: The member shall be prohibited from discussing the issue with other members, except as
    a witness or party, until after final Commission action and the time for filing an appeal has
    lapsed or appeal rights have been exhausted.
