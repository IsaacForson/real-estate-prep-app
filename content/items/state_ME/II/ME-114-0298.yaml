stem: At the commencement of a continuing education course, a licensee informs participants that the
  course has been approved for three clock hours but does not mention the Commission's invitation
  for comments. Under the Maine Real Estate Commission rules, is this sufficient to satisfy the
  advance notice requirement?
options:
  - The licensee's action satisfies the requirement because the approval statement was given.
  - The licensee's action satisfies the requirement because comments are optional.
  - The licensee's action does not satisfy the requirement because both statements must be provided.
  - The licensee's action does not satisfy the requirement because only the comment invitation is
    needed.
key: C
explanation: Section 7 requires that participants be informed of both the approval statement and the
  Commission’s invitation for comments at the start of each course. Providing only the approval
  statement omits the required comment invitation, so the advance notice requirement is not met. The
  distractor claiming the approval statement alone is sufficient disregards the mandatory second
  statement.
