stem: A licensee lists a residential property and asks the seller whether the seller has any
  knowledge of hazardous materials on the property. The seller does not respond to the question.
  What must the licensee do under Maine Real Estate Commission rules?
options:
  - The licensee must convey in writing to the buyer that information regarding hazardous materials
    is not available prior to or during preparation of an offer.
  - The licensee must ask the seller again for hazardous material information before proceeding with
    the offer as required.
  - The licensee must assume there are no hazardous materials and proceed without any disclosure
    under statute.
  - The licensee must provide a verbal warning to the buyer about possible hazardous materials at
    closing per rules.
key: A
explanation: Section 18 requires that information obtained from the seller about hazardous materials
  be conveyed in writing prior to or during preparation of an offer, and that the fact that such
  information is not available must also be conveyed in writing. Since the seller did not respond,
  the licensee must disclose in writing that the information is unavailable. The distractor
  suggesting the licensee should ask again does not fulfill the obligation to convey the lack of
  information.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 18
  url: null
  quoted_text: Such information and any other information obtained through different sources and means
    pertinent to hazardous materials shall be conveyed, in writing, to a buyer prior to or during
    preparation of an offer. The fact that information regarding hazardous materials is not
    available shall also be conveyed, in writing, when such is the case.
