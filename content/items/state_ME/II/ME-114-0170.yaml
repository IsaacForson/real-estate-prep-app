stem: Under Maine Real Estate Commission rules, what action is prohibited for a licensee who knows,
  or should have known, that a buyer or seller has an exclusive written brokerage agreement with
  another brokerage for the same services?
options:
  - A licensee shall not solicit a written brokerage agreement from that buyer or seller.
  - A licensee shall not disclose the terms of any existing offer to the buyer or seller.
  - A licensee shall not provide a free gift as an inducement to the buyer or seller.
  - A licensee shall not keep the designated broker informed of activities conducted on behalf of
    the agency.
key: A
explanation: Section 10 expressly forbids soliciting a written brokerage agreement when the licensee
  knows or should know the party already has an exclusive agreement with another brokerage.
  Disclosing offer terms relates to confidentiality rules, not solicitation; offering a gift is
  governed by inducement rules and is allowed if conditions are disclosed; keeping the designated
  broker informed is a duty, not a prohibition.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 10
  url: null
  quoted_text: A licensee shall not solicit a written brokerage agreement from a seller or buyer if
    the licensee knows, or acting in a reasonable manner should have known, that the buyer or seller
    has contracted with another real estate brokerage agency for the same real estate brokerage
    services on an exclusive basis.
