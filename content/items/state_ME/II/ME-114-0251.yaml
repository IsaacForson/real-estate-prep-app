stem: A transaction broker is informed by the seller that the roof leaks during heavy rain. The
  broker has not personally inspected the roof. According to 32 M.R.S. § 13283, what is the broker's
  obligation regarding this information?
options:
  - Disclose the defect to the buyer in a timely manner.
  - Verify the accuracy of the seller's statement before sharing it.
  - Keep the information confidential from the buyer.
  - Promote the seller's interest by downplaying the defect.
key: A
explanation: The broker must disclose material defects of which they have actual notice or
  knowledge, as required by subsection (2)(B). The most tempting distractor, verifying the seller's
  statement, is prohibited because a transaction broker may not verify the accuracy of statements
  made by parties under subsection (3)(B).
citation:
