stem: Which of the following is a duty required of a transaction broker under 32 M.R.S. § 13283(2)(B)?
options:
  - Conduct an inspection, investigation, or analysis of a property for the benefit of any party to
    the transaction.
  - Verify the accuracy or completeness of oral or written statements made by the seller, buyer, or
    any third party.
  - Promote the interests of either party to a transaction except as required to comply with this
    section.
  - Disclose in a timely manner to a buyer all material defects of which the transaction broker has
    actual notice or knowledge.
key: D
explanation: The statute requires a transaction broker to disclose in a timely manner to a buyer all
  material defects pertaining to the physical condition of the property of which the broker has
  actual notice or knowledge. This matches the duty described in subsection 2(B). The most tempting
  distractor is the option about conducting an inspection for a party’s benefit, which is actually
  prohibited under subsection 3(A).
