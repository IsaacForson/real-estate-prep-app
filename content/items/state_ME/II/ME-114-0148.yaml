key: A
explanation: The definition states that a broker is any person employed by or on behalf of an agency
  to perform brokerage and licensed by the commission as a broker. Therefore the option describing a
  person employed by or on behalf of an agency to perform brokerage and licensed by the commission
  as a broker is correct. The option that substitutes a sales agent license does not satisfy the
  broker definition.
