stem: A seller’s agent learns during a showing that the roof leaks during heavy rain. The seller has
  not informed the agent of this condition. According to 32 M.R.S. § 13273(2)(A), what must the
  agent do?
options:
  - Keeping the information confidential to protect the seller’s interests
  - Informing the prospective buyer in a timely manner as required by law
  - Waiting until after the purchase and sale agreement is signed to disclose
  - Informing the seller only and making no disclosure to any party
key: B
explanation: The statute obligates the seller agent to disclose material defects to the prospective
  buyer in a timely manner. The most tempting distractor, informing the seller only, fails to
  satisfy the duty to disclose to the buyer.
