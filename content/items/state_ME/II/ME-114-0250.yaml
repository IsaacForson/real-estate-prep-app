stem: "Under 32 M.R.S. § 13283(3)(A), a transaction broker may **not**:"
options:
  - Treat all parties honestly and may not knowingly give false information to any party.
  - Account for all money and property received in a timely manner.
  - Disclose material defects to a buyer in a timely manner.
  - Conduct an inspection, investigation or analysis of a property for the benefit of any party.
key: D
explanation: The rule explicitly prohibits a transaction broker from conducting an inspection,
  investigation, or analysis of a property for the benefit of any party. The most tempting
  distractor, disclosing material defects, is actually a duty under subsection (2)(B), not a
  prohibition.
