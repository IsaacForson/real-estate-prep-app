stem: A designated broker hires an independent contractor who holds a valid real estate license in
  another state but not a Maine license to conduct negotiations for a Maine property. According to
  32 M.R.S. § 13179, what must the designated broker do regarding this contractor?
options:
  - The designated broker must allow the contractor to perform negotiations under close supervision
    because they hold a license elsewhere
  - The designated broker must ensure the contractor obtains a Maine real estate license before
    engaging in any brokerage activity
  - The designated broker must permit the contractor to act as an unlicensed assistant as long as
    they are supervised
  - The designated broker must require the contractor to complete Maine-specific continuing
    education before starting work
key: B
explanation: §13179 prohibits permitting any person to engage in activity for which they are not
  properly licensed. Therefore the broker must ensure the contractor obtains a Maine license before
  performing brokerage work.
