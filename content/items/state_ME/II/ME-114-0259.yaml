stem: A buyer’s offer is accepted on Thursday, March 20. According to Maine Real Estate Commission
  rules, by what date must the designated broker deposit the earnest money deposit into the trust
  account, assuming no contrary agreement?
options:
  - Thursday, March 27
  - Friday, March 28
  - Wednesday, March 26
  - Monday, March 31
key: A
explanation: The rule requires an earnest money deposit to be deposited within five business days of
  acceptance of the offer. Counting five business days from Thursday, March 20 (Friday, Monday,
  Tuesday, Wednesday, Thursday) brings the deadline to the close of business on Thursday, March 27.
  Options that add weekend days or count calendar days incorrectly miss the business‑day
  requirement.
citation:
