stem: A sales agent whose license is about to expire after the initial two‑year term wishes to
  continue licensing for another year due to a serious medical condition that prevented active
  practice. Under 32 M.R.S. § 13200(5), on what basis may the commission grant a waiver to allow the
  sales agent to remain licensed beyond the two‑year term?
options:
  - Extenuating circumstances as defined by commission rules
  - Completion of 24 clock hours of approved continuing education
  - Payment of the standard license renewal fee and surcharge
  - Demonstration of five closed transactions in the prior year
key: A
explanation: The waiver provision explicitly allows the commission to grant a waiver based on
  extenuating circumstances as defined by its rules. Continuing education, fee payment, or sales
  volume are not the statutory basis for such a waiver.
