stem: A designated broker writes a check from the agency's real estate trust account to pay a
  vendor. The check includes the words "Real Estate Trust Account" but does not name the agency.
  Under 32 M.R.S. § 13178, is this check permissible?
options:
  - No, because the check must also name the subject agency.
  - No, because trust account checks must be pre‑approved by the Commission.
  - Yes, as long as the check is signed by the designated broker.
  - Yes, because the check identifies the account as a real estate trust account.
key: A
explanation: The statute requires that withdrawal orders, including checks, must name the subject
  agency and be identified as a real estate trust account. Omitting the agency name violates this
  rule, making the check impermissible.
