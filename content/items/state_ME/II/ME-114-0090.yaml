stem: A licensee lists a property with a private water supply and obtains the date of the most
  recent water test from the seller. When must the licensee convey this information to the buyer in
  writing?
options:
  - The licensee conveys the information after the offer has been accepted by both parties.
  - The licensee conveys the information at the closing of the transaction.
  - The licensee conveys the information prior to or during preparation of an offer.
  - The licensee conveys the information after the buyer's inspection period.
key: C
explanation: Section 15 requires that private water supply information be conveyed in writing to a
  buyer prior to or during preparation of an offer. Conveying after the offer is accepted, at
  closing, or after the inspection period would violate this timing requirement.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
