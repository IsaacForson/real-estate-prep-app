stem: A licensee lists a single-family residential property with a heating system. The seller
  provides the type, age, name of the service company, date of most recent service call,
  malfunctions within the past two years, and date of most recent chimney inspection, but does not
  know the annual consumption of the system. What must the licensee do under Section 16 of the Maine
  Real Estate Commission rules?
options:
  - Convey in writing that the information is not available prior to or during preparation of an
    offer
  - Estimate the annual consumption based on similar properties and disclose that estimate
  - Wait until after the offer is prepared to disclose the missing consumption figure
  - Assume the consumption is zero and disclose that assumption
key: A
explanation: Section 16 requires that any missing information about the heating system be conveyed
  in writing to the buyer prior to or during preparation of an offer. Estimating, waiting, or
  assuming a value does not meet the rule's requirement for written disclosure of unavailable data.
citation:
  source: 02-039 C.M.R. chs. 300–410 (Maine Real Estate Commission rules) — Maine Real Estate
    Commission Rules, 02-039 C.M.R. Chapters 300, 310, 340, 350, 360, 370, 390, 400, 410 (Secretary
    of State compilation, 2025) — § 16
  url: null
  quoted_text: Such information and any other information obtained through different sources and means
    pertinent to the heating system(s) and/or source(s) shall be conveyed, in writing, to a buyer
    prior to or during the preparation of an offer. The fact that information pertinent to the
    heating system(s) and/or source(s) is not available shall be conveyed, in writing, when such is
    the case.
