stem: A transaction closes and the designated broker has earned a commission that was held in the
  trust account. Under the trust account statute, the broker's withdrawal of that earned fee is
  governed by a deadline of
options:
  - 30 days after the transaction is consummated or terminated
  - 90 days after the closing statement is delivered to the client
  - 10 days after the earnest money deposit was first received
  - 60 days after the purchase and sale agreement was signed
key: A
explanation: The trust account statute requires the designated broker to withdraw earned fees from
  the trust account within 30 days after, but not before, the transaction is consummated or
  terminated.
citation:
  source: "32 M.R.S. § 13178 (Maine Revised Statutes Title 32, Chapter 114: Real Estate Brokerage
    License Act)"
  url: null
  quoted_text: >-
    The designated broker, except for an amount necessary to maintain the accounts

    not to exceed an amount prescribed by commission rule, shall withdraw from the accounts all fees
    due

    within 30 days after but not until consummation or termination of the transaction when the
    designated

    broker makes or causes to be made a full accounting to the broker's principal.
