stem: An applicant for a Maine real estate broker license currently holds an active license in New
  Hampshire and previously held a license in Vermont that expired three years ago. Under Maine Real
  Estate Commission rules, which letters of good standing must the applicant submit with the
  application?
options:
  - The applicant must submit no letters of good standing from any state.
  - The applicant must submit a letter of good standing from New Hampshire only.
  - The applicant must submit letters of good standing from both New Hampshire and Vermont.
  - The applicant must submit a letter of good standing from Vermont only.
key: C
explanation: Under 02-039 C.M.R. chs. 300–410, applicants must submit letters of good standing from
  each state where they currently hold or have ever held a real estate license. Since the applicant
  holds an active New Hampshire license and previously held a Vermont license, letters from both
  states are required. The answer stating that only a New Hampshire letter is needed is incorrect
  because it fails to include the Vermont license.
