stem: Under Maine Real Estate Commission rules, how long must a continuing education provider retain
  the roster of licensees who have successfully completed a course?
options:
  - Not less than two (2) years.
  - Not less than five (5) years.
  - Not less than four (4) years.
  - Not less than one (1) year.
key: C
explanation: The rule states that the course provider shall retain the roster of licensees
  completing the course for a period of not less than four (4) years. This retention period ensures
  records are available for review. The other options present incorrect durations that do not match
  the requirement.
