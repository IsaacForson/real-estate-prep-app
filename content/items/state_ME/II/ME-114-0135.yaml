stem: Under 32 M.R.S. § 13178, what is the sole purpose for which a real estate agency must maintain
  its trust account?
options:
  - To invest client deposits in interest-bearing accounts
  - To deposit earnest money and other agency-held funds
  - To pay brokerage commissions and referral fees
  - To cover marketing and advertising expenses only
