stem: "A brokerage agency changes its office address and fails to notify the director within ten
  days. Under 32 M.R.S. § 13175, this failure:"
options:
  - The agency's failure to notify the director within ten days is permitted if the agency updates
    its website within ten days
  - The agency's failure to notify the director within ten days is allowed because the director can
    discover the change through public records
  - The agency's failure to notify the director within ten days is a violation of the requirement to
    report any change of address, name or other material changes to the director within ten days
  - The agency's failure to notify the director within ten days is acceptable as long as the agency
    continues to operate from the old address
key: C
explanation: The statute requires that any change of address, name, or other material changes be
  reported to the director within ten days; failing to do so violates that requirement. The idea
  that the director could learn of the change from public records does not satisfy the reporting
  obligation.
