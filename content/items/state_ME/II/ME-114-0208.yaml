stem: Under Maine Real Estate Commission rules, which of the following actions is expressly
  prohibited for a continuing education course provider before receiving written approval from the
  Director?
options:
  - Submitting an application that does not include the instructor's résumé
  - Charging a fee higher than the application fee established by the Director
  - Conducting classes for which students anticipate receiving continuing education credit
  - Advertising the course while omitting a description of the subject matter
key: C
explanation: The rule explicitly prohibits conducting classes for which students expect to receive
  continuing education credit before receiving written approval from the Director. Therefore, the
  option describing conducting classes for which students anticipate receiving continuing education
  credit correctly identifies the prohibited conduct. The other options describe actions that are
  either required (such as submitting an instructor's résumé) or permissible (such as advertising
  with a course description) under the same rule.
