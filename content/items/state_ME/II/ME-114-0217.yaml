stem: A party to a Commission hearing requests a subpoena for a witness five days before the
  scheduled hearing. Under Chapter 350, Section 6, is this request permissible?
options:
  - Permitted only if good cause is shown
  - Permitted if requested within ten days
  - Not permitted if less than ten days notice
  - Permitted only if the witness agrees
key: A
explanation: Section 6 states that subpoenas shall be requested, except for good cause, at least ten
  days in advance of a scheduled hearing. A request made five days before the hearing is allowed
  only if the requesting party can show good cause. The distractor that claims permission simply
  because it is within ten days overlooks the good‑cause exception.
