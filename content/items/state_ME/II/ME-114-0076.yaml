    of State compilation, 2025) — § 2"
  url: null
  quoted_text: An investigation may be conducted based upon information other than a written complaint
    if such information provides prima facie evidence of a violation of Title 32, Chapter 114 of the
    Maine Revised Statutes or Commission rules, or if the information raises a substantial question
    regarding the qualifications of any applicant or licensee.
