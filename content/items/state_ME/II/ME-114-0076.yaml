stem: Under Maine Real Estate Commission rules, when may an investigation be initiated without a
  written complaint?
options:
  - When the information is received from a licensed broker alleging misconduct and requires
    immediate action.
  - When the information provides prima facie evidence of a violation or raises a substantial
    question about qualifications.
  - When the information is submitted anonymously via the Commission’s website and pertains to
    advertising.
  - When the information concerns a transaction that closed more than five years ago and involves
    undisclosed dual agency.
key: B
explanation: Section 2 of the Maine Real Estate Commission rules states that an investigation may be
  conducted without a written complaint if the information provides prima facie evidence of a
  violation of Title 32, Chapter 114 of the Maine Revised Statutes or Commission rules, or if the
  information raises a substantial question regarding the qualifications of any applicant or
  licensee. The option suggesting the information must come from a licensed broker or require
  immediate action is incorrect because the rule does not impose such specific source or urgency
  requirements.
citation:
