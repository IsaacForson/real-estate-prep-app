stem: A Commission member wishes to discuss an ongoing investigation with the Commission's attorney
  during a regularly scheduled meeting. Is this discussion permissible under the Commission's rules
  on prohibited communications?
options:
  - Under the rule, the discussion is prohibited unless the investigation has been closed for at
    least six months.
  - Under the rule, the discussion is permissible only if the member provides advance notice to all
    parties.
  - Under the rule, the discussion is prohibited as any talk about an ongoing investigation is
    barred until final action.
  - Under the rule, the discussion is permissible because members may confer with the Commission's
    attorney at meetings.
key: D
explanation: Section 4 explicitly permits discussion among Commission members or with the
  Commission's attorney at meetings, even regarding specific cases under investigation. The option
  claiming the discussion is permissible only with advance notice is incorrect because the rule
  carves out an exception for attorney consultations at meetings without requiring such notice.
