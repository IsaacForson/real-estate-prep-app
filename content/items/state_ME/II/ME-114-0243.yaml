stem: What event triggers the five-calendar-day period for an affiliated licensee to provide
  originals or true copies of real estate brokerage documents to the designated broker under Maine
  Real Estate Commission rules?
options:
  - Receipt of the document from client
  - Execution of the document or record
  - Approval by the designated broker today
  - Closing of the transaction paperwork
key: B
explanation: The rule states that documents must be provided to the designated broker within five
  calendar days after execution of the document or record, making execution the triggering event.
  The other options describe unrelated moments such as receipt, approval, or closing.
citation:
  source: 02-039 C.M.R. chs. 300–410 Section 13(2)
  url: null
  quoted_text: An affiliated licensee must provide originals or true copies of all real estate
    brokerage documents and records prepared in a real estate transaction as listed in Chapter 400,
    Section 4 of the Commission's rules to the designated broker within five (5) calendar days after
    execution of the document or record.
