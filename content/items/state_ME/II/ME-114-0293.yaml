stem: Under Maine law, within how many days after consummation or termination of a transaction must
  the designated broker withdraw all fees due from the trust account, assuming a full accounting has
  been made?
options:
  - The designated broker must withdraw the fees within 15 days.
  - The designated broker must withdraw the fees within 30 days.
  - The designated broker must withdraw the fees within 45 days.
  - The designated broker must withdraw the fees within 60 days.
key: B
explanation: The rule states that the designated broker shall withdraw all fees due within 30 days
  after consummation or termination of the transaction when a full accounting has been made.
  Therefore, the correct period is 30 days. The 15‑day option is too short, while the 45‑ and 60‑day
  options exceed the statutory limit.
