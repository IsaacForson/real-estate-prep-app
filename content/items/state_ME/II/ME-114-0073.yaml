stem: "A provider includes a clause in a long-term agreement that allows the provider to assign the
  real estate brokerage service to another brokerage without notifying or obtaining consent from the
  owner. Under 32 M.R.S. § 13177-B(2)(B), this clause is:"
options:
  - A clause that is required to be disclosed only after the assignment occurs
  - A clause that is prohibited because the agreement may not allow assignment without notice or
    consent
  - A clause that is allowed provided the owner receives compensation
  - A clause that is permitted because assignment is a standard industry practice
key: B
explanation: Section 13177‑B(2)(B) of the Maine Real Estate Brokerage License Act expressly
  prohibits a provider from allowing the assignment of brokerage services to another brokerage
  without the owner's notice or consent. Because the clause permits assignment without notice or
  consent, it is prohibited. The suggestion that the clause could be allowed if the owner receives
  compensation is not supported by the statute.
