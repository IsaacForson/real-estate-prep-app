stem: A Real Estate Commission member personally files a complaint against a licensee. During the
  Commission's later deliberations on that same complaint, the rule on member-initiated complaints
  requires that member to
options:
  - chair the hearing panel, since the member has direct knowledge of the facts
  - present the complaint on behalf of the Director at the hearing itself
  - vote last among the members so as not to influence the outcome
  - be disqualified from participating in consideration of the complaint
key: D
explanation: The rule provides that a member who files a complaint or requests an investigation is
  disqualified from participating in the Commission's consideration of that complaint or
  investigation.
