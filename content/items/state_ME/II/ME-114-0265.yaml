stem: A licensee lists a duplex served by a municipal waste disposal system. The seller tells the
  licensee that the system has never malfunctioned. According to Section 17(2) of the Maine Real
  Estate Commission rules, what must the licensee do with this information?
options:
  - The licensee must convey the information in writing to the buyer before preparing an offer
  - The licensee must convey the information verbally to the buyer before preparing an offer
  - The licensee must disclose the information if the buyer asks for it before preparing an offer
  - The licensee must keep the information confidential until the buyer makes an offer
key: A
explanation: Section 17(2) mandates that any information about system or line malfunction (including
  the absence of malfunction) be conveyed in writing prior to or during preparation of an offer. The
  distractor "keep the information confidential" is wrong because the rule requires disclosure to
  the buyer.
citation:
