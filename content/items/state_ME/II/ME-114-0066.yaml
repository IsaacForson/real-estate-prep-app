stem: A broker prepares an opinion of market value for a property and, in the same transaction,
  receives a commission from the seller for brokerage services. Under 32 M.R.S. § 13251‑A, is this
  conduct permissible?
options:
  - Prohibited only when the broker also serves as a disclosed dual agent for the transaction.
  - Prohibited because the broker knowingly provides an opinion of market value while receiving a
    fee.
  - Permissible because the opinion of value is not considered an appraisal under section 14004.
  - Permissible if the broker discloses the fee to the client before providing the opinion.
key: B
explanation: The statute bars a broker from knowingly providing an appraisal or opinion of market
  value when the broker or any affiliated licensee will receive a fee on that transaction. The
  statement that the conduct is prohibited only when the broker also serves as a disclosed dual
  agent is incorrect because disclosure does not remove the prohibition.
citation:
  source: 32 M.R.S. § 13251-A
  url: null
  quoted_text: A real estate broker or associate broker may not knowingly provide or offer an
    appraisal or opinion of market value, as set forth in section 14004, on real estate in a
    transaction where the broker or associate broker, or any other licensee licensed with the
    agency, is to receive a fee on that transaction.
