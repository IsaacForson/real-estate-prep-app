stem: Under Section 15 of the Maine Real Estate Commission rules, a licensee listing a single-family
  residential property with a private water supply must ask the seller for which of the following
  pieces of information?
options:
  - The annual consumption per heating source
  - The date of the most recent water test
  - The name of the company who services the heating system
  - The date of most recent inspection of chimneys and vents
key: B
explanation: Section 15 requires the licensee to ask the seller for the date of the most recent
  water test among other specific items. The heating‑service company name pertains to heating system
  disclosure, not private water supply.
