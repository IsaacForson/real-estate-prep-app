stem: A newly appointed industry member to the Real Estate Commission has been a real estate broker
  for 4 years. Under 32 M.R.S. § 13062(2), is this appointment valid?
options:
  - Yes, because they have 4 years experience
  - No, because they need at least 5 years
  - Yes, because they are a public member
  - No, because they need only 3 years as broker
key: B
explanation: The statute requires industry members to have been a real estate broker or associate
  broker for at least 5 years prior to appointment; with only 4 years of experience the appointment
  does not meet this requirement. The distractor citing 3 years is incorrect because the requirement
  is 5 years, not 3.
