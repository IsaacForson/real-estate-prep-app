stem: "A Maine buyer agent, at the seller's request, prepares an offer form and conveys it to the
  buyer, and also gives the seller the name of a moving company. The seller later claims these acts
  created a brokerage agreement between the buyer agent and the seller. Under 32 M.R.S. § 13274,
  these acts:"
options:
  - Violated the buyer agent's existing agreement with the buyer
  - Created an implied brokerage agreement obligating the agent to the seller
  - Made the buyer agent a transaction broker for the seller
  - Are ministerial acts that formed no brokerage agreement with the seller
key: D
explanation: A buyer agent may assist the seller by performing ministerial acts such as preparing
  and conveying offers and providing information about professional services unrelated to brokerage.
  The statute states that performing such acts may not be construed as forming a brokerage agreement
  with the seller or violating the buyer agent's agreement with the buyer. It also expressly
  provides that these acts do not make the buyer agent a transaction broker for the seller.
