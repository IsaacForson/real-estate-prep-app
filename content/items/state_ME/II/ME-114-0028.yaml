stem: A brokerage agency drafts a listing agreement for a seller-client and includes signature
  lines, service terms, and a compensation formula, but leaves out an expiration date. This
  agreement is deficient under the statute requiring that a brokerage agreement
options:
  - Be renewed annually no matter the transaction's completion date
  - Be written and include a stated expiration date
  - Name a single licensee, rather than the whole agency, as a party
  - Be reviewed by the commission before either party may sign the agreement
key: B
explanation: The statute requires a written brokerage agreement to include, at minimum, several
  listed elements including the date on which the agreement will expire, which the described
  agreement omits.
