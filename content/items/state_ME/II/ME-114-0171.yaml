stem: A licensee offers a buyer a $50 gift card for signing a purchase agreement but does not
  disclose any conditions or limitations of the offer in the advertisement. Under Maine Real Estate
  Commission rules, is this permissible?
options:
  - The offering is permissible as long as the gift card is delivered after closing.
  - The offering is not permissible because the offer lacks prominent disclosure of any limitations
    or conditions.
  - The offering is permissible because the gift card is considered a nominal value.
  - The offering is not permissible because the licensee must obtain prior written permission from
    the designated broker.
key: B
explanation: Section 11 requires that any limitations or conditions of an inducement be prominently
  displayed or presented; offering a gift card without such disclosure violates this rule. The other
  options incorrectly rely on nominal value, timing of delivery, or broker permission, none of which
  override the disclosure requirement.
