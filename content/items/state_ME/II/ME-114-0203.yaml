stem: A licensee has been on inactive status for 3 years and wishes to reactivate the license. Under
  32 M.R.S. § 13196(2)(B), how many clock hours of continuing education must the licensee complete
  within the previous biennium to reactivate?
options:
  - The licensee must complete 28 clock hours of continuing education within the previous biennium
  - The licensee must complete 21 clock hours of continuing education within the previous biennium
  - The licensee must complete 42 clock hours of continuing education within the previous biennium
  - The licensee must complete 36 clock hours of continuing education within the previous biennium
key: A
explanation: For inactive status between 2 and 4 years, the rule requires 28 clock hours of CE
  within the prior biennium for reactivation. The distractor of 21 hours applies only to inactivity
  up to 2 years, not 3 years.
