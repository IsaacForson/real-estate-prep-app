stem: Under Maine Real Estate Commission rules, a licensee is **NOT** required to provide a
  prospective buyer with a copy of the Real Estate Brokerage Relationships Form if the real estate
  is land with more than how many residential dwelling units?
options:
  - "1"
  - "2"
  - "3"
  - "4"
key: D
explanation: The rule exempts providing the form when the property is land with more than four (4)
  residential dwelling units, so the threshold is four units. Therefore, a licensee may withhold the
  form only if the property has more than four units. The distractor “3” is incorrect because three
  units does not exceed the four‑unit limit.
