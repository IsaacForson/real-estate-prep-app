stem: A licensee completes a purchase and sale agreement on Tuesday, April 2. By what date must the
  licensee provide the original or true copy of this agreement to the designated broker to comply
  with the five-calendar-day requirement?
options:
  - April 6
  - April 8
  - April 7
  - April 5
key: C
explanation: The rule requires delivery within five calendar days after execution. Counting April 3
  as day 1, April 4 day 2, April 5 day 3, April 6 day 4, and April 7 day 5, so the latest
  permissible date is April 7. April 6 would be only four days after execution.
