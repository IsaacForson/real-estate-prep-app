stem: A seller agent has a listing under a purchase and sale agreement that is currently executory.
  The seller asks the agent whether they must continue to seek additional purchase offers while the
  property remains under contract. According to 32 M.R.S. § 13273(B)(1), what is the agent’s
  obligation?
options:
  - Obligated to seek additional offers only after the contract expires
  - Permitted to seek additional offers only with the seller's written consent
  - Required to seek additional offers at all times regardless of contract status
  - Not required to seek additional offers unless the brokerage agreement mandates it
key: D
explanation: The rule exempts a seller agent from seeking additional offers while the property is
  under contract unless the brokerage agreement requires it. The distractor that claims an
  obligation at all times ignores this contractual exception.
citation:
  source: "32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act) — Maine Revised Statutes Title
    32, Chapter 114: Real Estate Brokerage License Act § 13273(B)(1)"
  url: null
  quoted_text: Seeking a sale at the price and terms stated in the brokerage agreement or at a price
    and terms acceptable to the seller except that the seller agent is not obligated to seek
    additional offers to purchase the property while the property is subject to a contract of sale
    unless the brokerage agreement so provides;
