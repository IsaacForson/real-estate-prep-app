stem: A licensee finishes a heating system disclosure document on Saturday, March 15. What is the
  latest day the licensee may provide the document to the designated broker to comply with the
  five-calendar-day requirement?
options:
  - March 16
  - March 18
  - March 20
  - March 22
key: C
explanation: Execution occurs on Saturday, March 15. The five‑day period after execution runs
  Sunday March 16 (1), Monday March 17 (2), Tuesday March 18 (3), Wednesday March 19 (4), and
  Thursday March 20 (5). Hence the latest permissible day is Thursday, March 20. The March 18 option
  provides only three days after execution, falling short of the required five days.
