stem: A licensee wants to intervene in a Commission adjudicatory hearing but submits the notice of
  intervention only three days before the hearing. Under Chapter 350, Section 4, is this
  intervention permitted?
options:
  - Permitted only if good cause is shown
  - Permitted because the notice was filed within seven days
  - Not permitted if filed less than seven days, even with cause
  - Permitted only if the Chairperson approves
key: A
explanation: Section 4 requires that an application for intervention be filed at least seven days in
  advance, except for good cause shown. Filing only three days before the hearing is allowed only if
  the licensee can demonstrate good cause. The distractor claiming permission simply because it is
  within seven days ignores the exception requirement.
