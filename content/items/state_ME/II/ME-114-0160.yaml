stem: According to 32 M.R.S. § 13198.1, how is a 'real estate broker' defined?
options:
  - A person employed by or on behalf of an agency to perform brokerage and licensed by the
    commission as a broker
  - A person who independently conducts brokerage without agency affiliation and lacks a broker
    license issued by the commission
  - A person licensed solely as an associate broker performing brokerage services but not employed
    by or on behalf of an agency
  - A person who provides brokerage services only to family members without holding a broker license
    and without being employed by an agency
key: A
explanation: The statute defines a real estate broker as any person who is employed by or on behalf
  of an agency to perform brokerage and who is licensed by the commission as a broker. The correct
  option states that a broker is a person employed by or on behalf of an agency to perform brokerage
  and licensed by the commission as a broker, which matches the statutory language. The option
  describing someone who provides brokerage services only to family members without a license or
  agency employment does not meet the requirement of agency employment and licensing. The option
  describing a person licensed solely as an associate broker who performs brokerage services but is
  not employed by an agency lacks the required agency affiliation. The option describing a person
  who independently conducts brokerage without agency affiliation and who lacks a broker license
  fails both the agency employment and licensing requirements.
