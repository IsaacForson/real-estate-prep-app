stem: Under 32 M.R.S. § 13006, which of the following is confidential and exempt from discovery?
options:
  - All advertising materials produced by a brokerage for a listing are confidential and exempt from
    discovery under this provision, unless disclosure is required by law.
  - All correspondence between a licensee and a client regarding a transaction is confidential and
    exempt from discovery under this provision, unless disclosure is required by law.
  - All closing statements prepared for a real estate transaction are confidential and exempt from
    discovery under this provision, unless disclosure is required by law.
  - All hearings and records of hearings conducted by the grievance committee or the professional
    standards committee of any state or regional professional real estate association or board are
    confidential and are exempt from discovery.
key: D
explanation: The statute explicitly states that all hearings and records of hearings conducted by
  the grievance committee or the professional standards committee of any state or regional
  professional real estate association or board are confidential and exempt from discovery. The
  other options describe materials not covered by this provision.
