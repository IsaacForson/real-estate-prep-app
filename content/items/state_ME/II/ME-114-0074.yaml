stem: A provider records a long-term agreement that violates subsection 2 of 32 M.R.S. § 13177-B in
  the county registry of deeds. What is the legal effect of this recording under subsection 4?
options:
  - The agreement is enforceable and provides constructive notice to subsequent purchasers
  - The agreement is unenforceable and the recording does not provide actual or constructive notice
  - The agreement is automatically void and the provider is subject to a civil penalty
  - The agreement remains valid but the owner may only seek damages for breach of contract
key: B
explanation: Under subsection 4 of 32 M.R.S. § 13177‑B, a long‑term agreement that violates
  subsection 2 is unenforceable and may not be recorded; if recorded, it does not provide actual or
  constructive notice against a bona fide purchaser or creditor. The option stating that the
  agreement is enforceable and provides constructive notice is incorrect.
