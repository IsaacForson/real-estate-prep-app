stem: A broker prepares an opinion of market value for a property at the request of a buyer and
  later receives a consulting fee from that buyer for the opinion. Under 32 M.S.R. § 13251‑A, is
  this conduct permissible?
options:
  - The conduct is not permissible because the broker knowingly provided an opinion while receiving
    a fee from the transaction.
  - The conduct is permissible because the opinion was prepared at the buyer's request.
  - The conduct is permissible because the fee was not a commission but a consulting fee.
  - The conduct is not permissible only if the broker also received a commission from the seller.
key: A
explanation: Under 32 M.R.S. § 13251‑A, a broker may not knowingly provide an opinion of market
  value when they receive any fee in the transaction. Therefore, accepting a consulting fee from the
  buyer for the opinion makes the conduct impermissible. The argument that the conduct is
  permissible because the opinion was prepared at the buyer's request fails because the rule applies
  regardless of who requested the opinion. The claim that the conduct is permissible because the fee
  was a consulting fee rather than a commission also fails because the statute covers any fee, not
  just commissions. Finally, the statement that the conduct is impermissible only if the broker also
  received a commission from the seller is incorrect; the prohibition is triggered by the receipt of
  any fee from the transaction, irrespective of additional compensation.
citation:
  source: 32 M.R.S. § 13251‑A
  url: null
  quoted_text: A real estate broker or associate broker may not knowingly provide or offer an
    appraisal or opinion of market value, as set forth in section 14004, on real estate in a
    transaction where the broker or associate broker, or any other licensee licensed with the
    agency, is to receive a fee on that transaction.
