stem: A licensee has been on inactive status for 3 years and wishes to reactivate the license.
  According to the Maine Real Estate Commission rules for inactive license reactivation, how many
  clock hours of continuing education must the licensee complete within the previous biennium?
options:
  - 21 hours
  - 24 hours
  - 28 hours
  - 36 hours
key: C
explanation: The key is correct because the rule states that for inactive status more than 2 years
  but less than 4 years, the licensee must complete 28 clock hours including a Commission approved
  core course within the previous biennium. The distractor 21 hours applies only to inactive up to 2
  years.
