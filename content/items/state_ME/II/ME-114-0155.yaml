stem: A licensee applicant has been found to have made a substantial misrepresentation by omission
  in a prior transaction. Under 32 M.R.S. § 13067-A(4), what action may the Commission take?
options:
  - Approve license
  - Deny the license
  - Impose education
  - Refer to Attorney
key: B
explanation: Under 32 M.R.S. § 13067-A(4), a substantial misrepresentation by omission or commission
  is grounds for denying a license. Therefore the Commission may deny the license. Approving the
  license, referring the matter to the Attorney General, or imposing a continuing education
  requirement are not authorized actions for this ground.
