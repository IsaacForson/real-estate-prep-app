stem: "Under 32 M.R.S. § 13273(2)(A), a seller agent must disclose to a prospective buyer:"
options:
  - All material defects pertaining to the physical condition of the property
  - The seller’s asking price as stated in the brokerage agreement
  - The agent’s commission rate as agreed upon with the client
  - The buyer’s credit score obtained from a lender during pre-approval
key: A
explanation: The statute requires a seller agent to disclose in a timely manner all material defects
  pertaining to the physical condition of the property of which the agent knew or should have known.
  The most tempting distractor, the seller’s asking price, is not a required disclosure under this
  provision.
