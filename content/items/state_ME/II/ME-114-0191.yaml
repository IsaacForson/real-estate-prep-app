stem: Under Section 18 of the Maine Real Estate Commission rules, a licensee listing a property must
  ask the seller whether the seller has any knowledge of the presence of or prior removal of
  hazardous materials or elements on the property, including which of the following?
options:
  - The presence of asbestos
  - The date of tank installation
  - The contractor who services heating
  - The heating consumption
key: A
explanation: Section 18 explicitly lists asbestos as an example of hazardous material about which
  the licensee must inquire. The date of tank installation, heating‑service contractor name, and
  heating consumption relate to waste‑disposal and heating disclosures, not hazardous‑materials
  inquiry.
