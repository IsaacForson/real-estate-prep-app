stem: During a formal adjudicatory hearing, a spectator begins shouting disruptive comments. Which
  action is within the Chairperson's authority under the Commission's adjudicatory hearing rules?
options:
  - The Chairperson may issue a subpoena for the spectator's testimony.
  - The Chairperson may take action necessary to maintain order.
  - The Chairperson may postpone the hearing indefinitely without cause.
  - The Chairperson may fine the spectator for contempt of court.
key: B
explanation: Section 2 of Chapter 350 grants the Chairperson authority to take action necessary to
  maintain order during a hearing. Issuing a subpoena for a spectator's testimony, postponing the
  hearing indefinitely without cause, and fining a spectator for contempt of court are powers not
  given to the Chairperson by this rule.
