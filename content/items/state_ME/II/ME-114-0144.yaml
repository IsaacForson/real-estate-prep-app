stem: "A transaction broker receives an email from a contractor stating the roof leaks. The broker
  does not inform the buyer before closing. Under 32 M.R.S. § 13283, the broker's failure to
  disclose is:"
options:
  - Under the statute, the broker's action is permissible because the broker did not knowingly lie
  - Under the statute, the broker's action is allowed as the broker only must account for funds
  - Under the statute, the broker's action is permissible because the broker need not discover
    latent defects
  - Under the statute, the broker's action is a violation of the duty to disclose material defects
key: D
explanation: Subsection 2(B) requires a transaction broker to disclose material defects of which
  they have actual notice or knowledge. The contractor's email gave actual notice, so silence
  violates that duty. The claim that brokers need not discover latent defects does not relieve the
  duty to disclose known defects.
