stem: A licensee meets a prospective seller face-to-face to discuss a vacant land parcel that has no
  residential dwelling unit. Under 02-039 C.M.R. chs. 300–410 § 9(3)(A), is the licensee required to
  provide the Real Estate Brokerage Relationships Form?
options:
  - The licensee is not required to provide the form because the property lacks a residential
    dwelling unit.
  - The licensee is not required to provide the form only if the seller is a principal.
  - The licensee is required to provide the form unless the communication is written.
  - The licensee is required to provide the form because the meeting was face-to-face.
key: A
explanation: Under 02-039 C.M.R. chs. 300–410 § 9(3)(A), a licensee is not required to provide the
  Real Estate Brokerage Relationships Form when the real estate is land without a residential
  dwelling unit. The scenario describes vacant land with no dwelling, so no form is required. The
  choice claiming the form is required because the meeting was face-to-face is incorrect because
  this exception overrides the general requirement triggered by face-to-face communication.
citation:
