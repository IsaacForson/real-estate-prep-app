stem: An unlicensed individual assists a friend in purchasing a commercial building and expects a
  fee. When the friend refuses to pay, the individual sues in Maine court to collect the promised
  compensation. Under the Maine Real Estate Brokerage License Act, what must the individual prove to
  maintain the action?
options:
  - A written contract for the services provided
  - Proof of proper licensure at the time of the claim
  - Documentation showing the transaction involved real estate
  - Evidence of an agreement to pay the fee
key: B
explanation: The law prohibits collecting compensation for brokerage services without proving the
  individual was properly licensed at the time the claim arose. The other options do not satisfy
  this statutory requirement.
