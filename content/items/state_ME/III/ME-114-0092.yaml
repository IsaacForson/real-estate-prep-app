stem: A licensee representing a buyer receives a written offer from the buyer to the seller. The
  licensee shares the offer price with a friend who is not involved in the transaction. Under the
  Maine Real Estate Commission rules, is this permissible?
options:
  - The licensee may not share the offer price with a friend unless the offer has been withdrawn.
  - The licensee may not share the offer price with a friend without prior written permission from
    both parties.
  - The licensee may share the offer price with a friend because confidentiality does not apply to
    friends.
  - The licensee may share the offer price with a friend if the licensee believes the friend will
    keep it confidential.
key: B
explanation: Section 12(1) forbids disclosing any terms of an offer to anyone other than the parties
  without their prior written permission. Sharing the offer price with a friend violates this rule
  unless both parties have given written consent. Belief in confidentiality or waiting for
  withdrawal does not make the disclosure permissible.
citation:
  source: 02-039 C.M.R. chs. 300–410 — § 12(1)
  url: null
  quoted_text: A real estate brokerage agency or affiliated licensees shall not disclose any terms of
    an offer or counteroffer to anyone other than the parties to the offer or counteroffer without
    the prior written permission of the parties prior to withdrawal, expiration or written rejection
    of the offer or counteroffer.
