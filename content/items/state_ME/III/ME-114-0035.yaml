stem: An agency's affiliated licensees currently choose on a case-by-case basis whether to act as
  seller agents, buyer agents, or transaction brokers, with no document describing the agency's
  overall approach. This practice falls short of the requirement that every real estate brokerage
  agency
options:
  - Obtain written client consent before adopting any relationship policy
  - File its relationship policy with the Commission for prior approval
  - Adopt a written policy identifying the relationships it may use
  - Assign each licensee to one relationship type for a whole career
key: C
explanation: The statute requires every real estate brokerage agency to adopt a written company
  policy that identifies and describes the brokerage relationships its designated broker and
  affiliated licensees may engage in.
citation:
  source: "32 M.R.S. § 13277 (Maine Revised Statutes Title 32, Chapter 114: Real Estate Brokerage
    License Act)"
  url: null
  quoted_text: >-
    Every real estate brokerage agency shall adopt a written company policy that identifies and

    describes the types of real estate brokerage relationships in which the designated broker and
    affiliated

    licensees may engage.
