stem: A designated broker verbally tells one affiliated licensee to act solely for a buyer-client,
  without any written notice to the client naming that licensee. Under the appointed-agent
  provision, this appointment is deficient because it must be
options:
  - Limited to licensees who hold an associate broker license or higher
  - Recorded with the Real Estate Commission within ten business days
  - Ratified by a vote of every other affiliated licensee in the agency
  - Made in writing to the client by the designated broker
key: D
explanation: The statute allows a real estate brokerage agency, through its designated broker, to
  appoint affiliated licensees as appointed agents only by a written appointment made to the client.
citation:
  source: "32 M.R.S. § 13278 (Maine Revised Statutes Title 32, Chapter 114: Real Estate Brokerage
    License Act)"
  url: null
  quoted_text: >-
    A real estate brokerage agency entering into a brokerage agreement may,

    through the designated broker, appoint in writing to the client those affiliated licensees
    within the real

    estate brokerage agency who will be acting as appointed agents of that client to the exclusion
    of all

    other affiliated licensees within the real estate brokerage agency.
