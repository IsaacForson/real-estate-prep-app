stem: Under Maine Real Estate Commission rules, how many calendar days does an affiliated licensee
  have to provide originals or true copies of brokerage documents to the designated broker after
  executing them?
options:
  - The licensee must provide the documents to the designated broker within five (5) calendar days
    after execution.
  - The licensee must provide the documents to the designated broker within three (3) business days
    after execution.
  - The licensee must provide the documents to the designated broker within five (5) business days
    after execution.
  - The licensee must provide the documents to the designated broker within seven (7) calendar days
    after execution.
key: A
explanation: The rule states that affiliated licensees must provide documents "within five (5)
  calendar days after execution" of the document or record. The distractor of three business days is
  incorrect because the rule specifies calendar days, not business days.
