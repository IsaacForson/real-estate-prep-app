stem: "A transaction broker agrees to perform a home inspection for the buyer to help the buyer
  assess the property's condition. Under 32 M.R.S. § 13283, this action is:"
options:
  - It is prohibited as it constitutes an inspection for the benefit of a party
  - It is permitted because it is a ministerial act
  - It is required under the duty to disclose material defects
  - It is allowed only if the broker discloses the inspection to both parties
