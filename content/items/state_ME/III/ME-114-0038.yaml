stem: A brokerage agency provides services in a transaction but never signs a written brokerage
  agreement to represent either party as a client. Absent that written agreement, the statute's
  presumption is that
options:
  - The agency is presumed to represent the buyer as its client
  - The agency is presumed to be acting as a transaction broker
  - The agency is presumed to be acting as a disclosed dual agent
  - The agency is presumed to represent the seller as its client
key: B
explanation: The statute presumes a real estate brokerage agency is acting as a transaction broker
  unless it has agreed, in a written brokerage agreement, to represent a party as its client.
citation:
  source: "32 M.R.S. § 13282 (Maine Revised Statutes Title 32, Chapter 114: Real Estate Brokerage
    License Act)"
  url: null
  quoted_text: >-
    Except as otherwise provided in this subchapter, a real estate brokerage agency providing real
    estate

    brokerage services is presumed to be acting as a transaction broker unless the real estate
    brokerage

    agency has agreed, in a written brokerage agreement, to represent one or more parties to the
    real estate

    transaction as the real estate brokerage agency's clients.
