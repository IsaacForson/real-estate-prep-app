stem: "An unlicensed individual helped a friend locate and negotiate the purchase of a commercial
  building in Maine, expecting a fee. When the friend refuses to pay, the individual sues in a Maine
  court to collect the promised compensation. Under 32 M.R.S. § 13004, the court will:"
options:
  - Award the fee if the services were actually performed despite the lack of a license
  - Dismiss the action unless the individual proves he was properly licensed when the claim arose
  - Reduce the fee to a reasonable amount set by the court even if the services were rendered
  - Refer the matter to the Real Estate Commission for arbitration before any court action may
    proceed
key: B
explanation: Section 13004 bars any person from bringing or maintaining a court action to collect
  compensation for real estate brokerage services without first proving the person was properly
  licensed by the Real Estate Commission at the time the cause of action arose. Because the
  individual was unlicensed, he cannot maintain the collection suit regardless of whether the
  services were actually performed. The statute provides for no judicial fee-reduction or
  arbitration alternative.
