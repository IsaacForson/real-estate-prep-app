stem: Which of the following activities, when performed on behalf of another for compensation, is
  included in the definition of "real estate brokerage" under Maine law?
options:
  - Conducting a home inspection for a fee
  - Appraising real estate for a fee
  - Listing real estate for sale or exchange
  - Providing property management services for a fee
key: C
explanation: The statute defines real estate brokerage to include listing real estate for sale or
  exchange, among other activities. Property management, home inspection, and appraisal are not
  listed as part of the definition. Therefore, only listing real estate for sale or exchange
  qualifies.
