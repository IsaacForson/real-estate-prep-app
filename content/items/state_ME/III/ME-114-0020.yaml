stem: A brokerage agreement between an agency and a seller has just expired. Under 32 M.R.S. §
  13281, which duty does the agency still owe the former client after this expiration?
options:
  - Paying the former client's closing costs on any later resale of the home
  - Accounting in a timely manner for money and property related to the relationship
  - Renewing the same brokerage agreement automatically for yet another term
  - Continuing to actively market and advertise the property until a new buyer is found
key: B
explanation: Section 13281 provides that an agency owes no further duty after expiration of the
  brokerage agreement except the duty of accounting in a timely manner for money and property
  related to the relationship.
citation:
  source: 32 M.R.S. § 13281
  url: null
  quoted_text: >-
    A real estate brokerage agency and an affiliated licensee owe no

    further duty or obligation after termination, expiration, completion or performance of the
    brokerage

    agreement, except the duties of:

    A. Accounting in a timely manner for all money and property related to, and received during, the

    relationship
