stem: "During a showing, a transaction broker observes water stains on the ceiling and learns from
  the seller that the roof leaks. Under 32 M.R.S. § 13283, the broker must:"
options:
  - The broker should ignore the observation because it is not a latent defect
  - The broker should disclose the leak to the buyer in a timely manner
  - The broker should repair the roof before continuing the transaction
  - The broker should advise the buyer to obtain a home inspection instead of disclosing
key: B
explanation: Subsection 2(B) requires a transaction broker to disclose in a timely manner to a buyer
  all material defects of which the broker has actual notice or knowledge. The broker’s observation
  and the seller’s statement give actual notice of a leak, triggering the disclosure duty.
