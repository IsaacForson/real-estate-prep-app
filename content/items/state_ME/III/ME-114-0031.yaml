stem: In Maine's agency-relationship subchapter, how are "ministerial acts" defined?
options:
  - Acts a licensee may perform while acting as a disclosed dual agent
  - Acts a designated broker performs after a brokerage agreement is signed
  - Acts performed for a non-client that are clerical and not active representation
  - Acts that automatically create a client relationship once performed for any party
key: C
explanation: Ministerial acts are defined as those informative or clerical acts a brokerage agency
  performs for someone who is not a client, falling short of active representation.
citation:
  source: "32 M.R.S. § 13271 (Maine Revised Statutes Title 32, Chapter 114: Real Estate Brokerage
    License Act)"
  url: null
  quoted_text: >-
    "Ministerial acts" means those acts that a real estate brokerage agency

    performs for a person who is not a client and that are informative or clerical in nature and do
    not rise

    to the level of active representation on behalf of the person.
