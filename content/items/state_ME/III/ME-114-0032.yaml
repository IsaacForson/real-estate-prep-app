stem: How does the agency-relationship subchapter treat common-law fiduciary duties that previously
  applied between an agent and a client?
options:
  - Common-law fiduciary duties remain fully controlling over any statutory duty
  - Common-law duties apply when a licensee acts as an undisclosed dual agent
  - Common-law duties are suspended for five years after the subchapter's enactment
  - The subchapter's duties supersede common law, except as to vicarious liability
key: D
explanation: The interpretation provision states the subchapter's duties supersede the parties'
  common-law duties and responsibilities, carving out an exception only for vicarious liability.
citation:
  source: "32 M.R.S. § 13276 (Maine Revised Statutes Title 32, Chapter 114: Real Estate Brokerage
    License Act)"
  url: null
  quoted_text: >-
    The provisions of this subchapter supersede the duties and responsibilities of the parties under
    the

    common law, including fiduciary responsibilities of an agent to a client or principal, except
    with regard

    to vicarious liability and except as set forth in this subchapter.
