stem: According to Maine Real Estate Commission rules, how many clock hours of continuing education
  must a licensee complete prior to applying for license renewal, and how many of those must be the
  core course?
options:
  - 24 clock hours total, with 3 core hours
  - 21 clock hours total, with 3 core hours
  - 18 clock hours total, with 3 core hours
  - 21 clock hours total, with 6 core hours
key: B
explanation: The rule states that licensees must complete twenty‑one (21) clock hours of continuing
  education before applying for renewal, and three (3) of those hours must be the core course
  approved by the Commission. The remaining eighteen hours may be any other approved continuing
  education.
