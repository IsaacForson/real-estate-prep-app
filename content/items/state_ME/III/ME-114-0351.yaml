stem: A licensee completes a purchase and sale agreement on a Thursday. According to Maine Real
  Estate Commission rules, by what date must the licensee provide the executed agreement to the
  designated broker?
options:
  - The licensee must provide the documents to the designated broker by close of business Monday.
  - The licensee must provide the documents to the designated broker by close of business Tuesday.
  - The licensee must provide the documents to the designated broker by close of business Sunday.
  - The licensee must provide the documents to the designated broker by close of business Wednesday.
key: B
explanation: The rule requires provision within five calendar days after execution; counting five
  calendar days from Thursday leads to Tuesday. The distractor Monday is incorrect because it only
  accounts for four calendar days.
