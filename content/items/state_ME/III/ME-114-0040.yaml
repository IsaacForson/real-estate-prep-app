stem: The Commission is drafting rules under its rulemaking authority over agency relationships and
  must decide what subject the rules on internal office practices should address. Based on the
  statute directing that rulemaking, those procedures must be designed to
options:
  - Limit the number of transactions an affiliated licensee handles each year
  - Require every affiliated licensee to work from one shared office location
  - Standardize the commission rate every affiliated licensee charges clients
  - Prevent the mishandling of information and undisclosed dual agency
key: D
explanation: The statute directs the Commission's rules to include procedures that prevent the
  mishandling of information and undisclosed dual agency in the representation of clients.
