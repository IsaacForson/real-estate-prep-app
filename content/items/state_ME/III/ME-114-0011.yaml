stem: Under 32 M.R.S. § 13271, which term describes acts that are informative or clerical and do
  **NOT** rise to active representation of a person who is not a client?
options:
  - Fiduciary acts of an agent
  - Ministerial acts of an agency
  - Formal disclosed dual agency acts
  - Formal brokerage agreement acts
key: B
explanation: Section 13271 defines ministerial acts as those a real estate brokerage agency performs
  for a non-client that are informative or clerical and do not rise to active representation.
citation:
  source: 32 M.R.S. § 13271
  url: null
  quoted_text: >-
    "Ministerial acts" means those acts that a real estate brokerage agency

    performs for a person who is not a client and that are informative or clerical in nature and do
    not rise

    to the level of active representation on behalf of the person
