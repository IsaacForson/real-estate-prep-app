stem: A transaction broker receives a municipal permit record showing that the property had a
  foundation repair permit issued two years ago. What must the broker do under 32 M.R.S. §
  13283(2)(B)?
options:
  - Wait to disclose the repair until after the purchase agreement is signed.
  - Verify the repair’s quality with a licensed contractor before proceeding.
  - Keep the information confidential because the repair has been completed.
  - Disclose the foundation repair to the buyer in a timely manner.
key: D
explanation: The broker has actual notice of the foundation repair via the permit record, which is a
  material defect pertaining to the physical condition of the property, and must disclose it in a
  timely manner. Verifying the repair’s quality with a licensed contractor before proceeding is
  unnecessary; the duty to disclose applies regardless of whether the repair has been completed.
