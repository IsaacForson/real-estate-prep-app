stem: A licensee discloses the terms of an offer to a friend before the offer is withdrawn, expired,
  or rejected in writing. Under 02-039 C.M.R. chs. 300–410 § 12(1), is this disclosure permitted?
options:
  - Disclosure of offer terms is permitted only after the transaction has closed.
  - Disclosure of offer terms is permitted only if the information is already public.
  - Disclosure of offer terms is permitted only with the client's verbal consent.
  - Disclosure of offer terms is permitted only after the offer has been withdrawn, expired, or
    rejected in writing.
key: D
explanation: The rule states that a brokerage or its affiliated licensees may not disclose any terms
  of an offer or counter‑offer to anyone other than the parties to the offer or counter‑offer unless
  the parties have given prior written permission. Disclosure is allowed only after the offer has
  been withdrawn, expired, or rejected in writing. Therefore, revealing the terms before those
  events is not permitted. The idea that disclosure is allowed only after the transaction closes is
  incorrect because the rule is tied to the offer’s status, not the closing of the transaction. The
  notion that public information creates an exception is also wrong; the rule does not provide a
  public‑information exception. Finally, verbal consent is insufficient because the rule requires
  written permission.
