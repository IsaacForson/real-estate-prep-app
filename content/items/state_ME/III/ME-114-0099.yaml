stem: Under 32 M.R.S. § 13001, which activity, when performed on behalf of another for compensation,
  falls within the definition of real estate brokerage?
options:
  - Preparing a deed for a closing attorney
  - Appraising a property for a mortgage lender
  - Listing real estate for sale or exchange
  - Surveying the boundaries of a parcel
key: C
explanation: The statute defines real estate brokerage as a single instance of offering, attempting
  to conduct or conducting services on behalf of another for compensation calculated to result in
  the transfer of an interest in real estate, and expressly lists listing real estate for sale or
  exchange among the included activities. Preparing a deed as an attorney, appraising, and surveying
  are not among the enumerated brokerage activities.
