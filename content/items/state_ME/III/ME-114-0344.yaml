stem: Under 32 M.R.S. § 13198, what must an applicant have done to qualify for a real estate broker
  license?
options:
  - The applicant must have been licensed as an associate broker affiliated with a real estate
    brokerage agency for 2 years within the 5 years immediately preceding the date of application
    and must satisfactorily complete the course of study meeting guidelines established by the
    commission.
  - The applicant must have been licensed as a sales agent affiliated with a real estate brokerage
    agency for 2 years within the 5 years immediately preceding the date of application and must
    pass the broker examination administered by the commission.
  - The applicant must have been licensed as an associate broker affiliated with a real estate
    brokerage agency for 3 years within the 5 years immediately preceding the date of application
    and must satisfactorily complete the course of study meeting guidelines established by the
    commission.
  - The applicant must have been licensed as a sales agent affiliated with a real estate brokerage
    agency for 3 years within the 5 years immediately preceding the date of application and must
    pass the broker examination administered by the commission.
key: A
explanation: The statute requires both two years of associate broker experience within the prior
  five years and completion of a commission‑approved course of study. The option that requires sales
  agent experience and passing a broker exam adds a requirement not found in the law.
