stem: "A designated broker appoints two different affiliated licensees to represent a seller and a
  buyer in the same transaction. Under 32 M.R.S. § 13278, the agency and designated broker become
  dual agents:"
options:
  - When one licensee personally represents both parties in that transaction
  - When appointed agents are simply named under a written office policy
  - Whenever the two clients involved in the transaction have adverse interests
  - After the transaction closes and the commissions have been fully distributed
key: A
explanation: Section 13278 provides that an agency and designated broker are not considered dual
  agents solely because of an appointment, except when one affiliated licensee personally represents
  both the seller and the buyer.
citation:
  source: 32 M.R.S. § 13278
  url: null
  quoted_text: >-
    A real estate

    brokerage agency and the designated broker are not considered

    to be dual agents solely because of an appointment under the provisions of this section, except
    that any

    affiliated licensee who personally represents both the seller and the buyer, as clients, in a
    particular

    transaction is considered to be a dual agent
