stem: A designated broker terminates the employment of a real estate sales agent. What action must
  the designated broker take immediately under 32 M.R.S. § 13180?
options:
  - Updating the agency’s internal records and informing the broker’s principal only and filing a
    termination notice
  - Sending notice to agent’s last known address stating commission notified and delivering copy to
    commission
  - Notifying the agent verbally and submitting a written notice to the commission within seven days
    and keeping a record
  - Filing a termination report with the commission within thirty days and notifying the agent in
    writing
key: B
explanation: The statute requires immediate notice to the agent’s last known address advising that
  the commission has been notified and delivering a copy of that notice to the commission; the other
  options either delay notice, omit required delivery, or add unnecessary steps.
citation:
  source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act) § 13180
  url: null
  quoted_text: When any broker, associate broker or real estate sales agent is discharged or
    terminates employment with a brokerage agency, the designated broker shall immediately send a
    communication to the last known address of the broker, associate broker or sales agent advising
    the broker, associate broker or sales agent that the commission has been notified. The
    designated broker shall deliver a copy of the communication to the commission.
