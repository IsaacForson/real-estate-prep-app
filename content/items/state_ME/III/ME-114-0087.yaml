stem: Under the Maine Real Estate Commission rules, when must an appointed agent's disclosure be
  provided to the client?
options:
  - The disclosure is provided prior to entering into a written brokerage agreement.
  - The disclosure is provided after the written brokerage agreement is signed.
  - The disclosure is provided within three business days of the first showing.
  - The disclosure is provided at the closing of the transaction.
key: A
explanation: The rule states that the appointed agent disclosure shall be provided to the client
  prior to entering into a written brokerage agreement. Therefore, providing it after the agreement
  is signed or at closing does not satisfy the requirement. The correct timing is before the
  agreement is executed.
