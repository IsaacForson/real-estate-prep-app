stem: A licensee discovers that a seller has entered into an exclusive listing agreement with
  another brokerage. The licensee wants to contact the seller to offer to list the property. Under
  the Maine Real Estate Commission rules, is the licensee permitted to solicit a written brokerage
  agreement from the seller?
options:
  - The licensee may not solicit the agreement if aware of the exclusive contract.
  - The licensee may not solicit the agreement unless the seller contacts first.
  - The licensee may solicit the agreement after disclosing the existing contract.
  - The licensee may solicit the agreement regardless of any existing contracts.
key: A
explanation: Section 10 prohibits a licensee from soliciting a written brokerage agreement when the
  licensee knows or should have known that the party has an exclusive contract with another
  brokerage. Since the licensee knows of the exclusive agreement, solicitation is not allowed.
  Disclosing the existing contract does not override the prohibition.
citation:
  source: 02-039 C.M.R. chs. 300–410 — § 10
  url: null
  quoted_text: A licensee shall not solicit a written brokerage agreement from a seller or buyer if
    the licensee knows, or acting in a reasonable manner should have known, that the buyer or seller
    has contracted with another real estate brokerage agency for the same real estate brokerage
    services on an exclusive basis.
