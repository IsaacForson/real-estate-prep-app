stem: Under Maine Real Estate Commission rules, when offering a free gift as an inducement, what
  must be prominently displayed or presented?
options:
  - The expiration date or value of the gift
  - The limitations or conditions of the offering
  - The name of the brokerage or the license number
  - The property address or the listing price
key: B
explanation: The rule states that any limitations or conditions of an inducement must be prominently
  displayed or presented. Therefore, the correct answer is the limitations or conditions. The other
  options are unrelated to the inducement disclosure requirement.
