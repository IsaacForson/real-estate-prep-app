stem: A broker licensee wishes to act as the designated broker for their real estate brokerage
  agency. Under 32 M.R.S. § 13198, may the licensee be designated by the agency to act for it?
options:
  - The broker licensee may be designated broker only after completing additional continuing
    education.
  - The broker licensee may be designated broker only if the agency is a corporation.
  - The broker licensee may be designated by the agency to act for it.
  - The broker licensee may be designated broker only if they also hold an associate broker license.
key: C
explanation: The statute expressly states that a broker license entitles the holder to perform all
  acts contemplated under the chapter, including being designated by the agency to act for it. No
  additional education, corporate form, or associate broker license is required for this
  designation.
