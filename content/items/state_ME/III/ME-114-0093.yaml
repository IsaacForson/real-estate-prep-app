stem: During a listing, a seller agent learns that the property is subject to a pending zoning
  change that could affect its use. Under 32 M.R.S. § 13273, what must the seller agent do?
options:
  - The agent should disclose the zoning change to the seller
  - The agent should disclose the zoning change to the buyer
  - The agent should disclose the zoning change to both the seller and the buyer
  - The agent should not disclose the zoning change
key: A
explanation: Under 32 M.R.S. § 13273(1)(B)(3), a seller agent must disclose to the seller any
  material facts of which the agent has actual knowledge or should have known concerning the
  transaction. The pending zoning change is a material fact concerning the transaction, so
  disclosure to the seller is required. While the seller agent also has a duty to disclose material
  defects to prospective buyers under § 13273(2)(A), that duty applies only to physical‑condition
  defects, not to transaction‑related facts such as a zoning change; therefore disclosing to the
  buyer is not required by this provision.
