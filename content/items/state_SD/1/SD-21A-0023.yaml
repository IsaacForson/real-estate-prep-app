stem: The commission has five members. If only three members attend a meeting, can they take
  official action?
options:
  - No, because at least four members must be present.
  - Only if the meeting is called by the chairperson.
  - Only if the executive director is present.
  - Yes, because three present is a majority and may act.
key: D
explanation: A majority of the commission, which is three of five members, constitutes a quorum and
  may perform all duties and powers. The distractor claiming at least four members are needed
  incorrectly imposes a supermajority requirement.
