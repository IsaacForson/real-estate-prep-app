stem: After the commission issues a decision in a contested case hearing, how many days does a party
  have to file a petition for review of that decision?
options:
  - Within thirty days after receipt
  - Within five days after receipt
  - Within fifteen days after receipt
  - Within ten days after receipt
key: D
explanation: SD Admin. R. art. 20:69:02:08 states that within 10 days after receipt of the
  commission's decision, a party to the hearing may file a petition with the commission for review
  of its decision. Therefore, the correct period is ten days. The distractor suggesting fifteen days
  exceeds the allowed timeframe.
