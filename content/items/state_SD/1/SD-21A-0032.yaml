stem: After the commission issues a decision on a contested case hearing, how many days does a party
  have to file a petition for review of that decision?
options:
  - File within 5 days
  - File within 10 days
  - File within 20 days
  - File within 30 days
key: B
explanation: The rule specifies that a party must file a petition for review within 10 days after
  receiving the commission's decision. Options of 5, 20, or 30 days do not match this timeframe,
  with the 30‑day choice likely confusing the review period with the 30‑day window for requesting a
  contested case hearing.
