stem: The investigative committee dismisses a complaint on March 10. The commission's next scheduled
  meeting is April 5. What is the latest date by which the dismissal must be reported to the agency?
options:
  - April 5
  - April 9
  - April 15
  - May 5
key: A
explanation: The law requires reporting at the next scheduled meeting or within thirty days,
  whichever is shorter. April 5 (the next meeting) precedes April 9 (thirty days after dismissal),
  so the latest permissible date is April 5.
