stem: A member of the public files a written complaint against a licensee alleging unprofessional
  conduct. The administrator informs the complainant that the complaint lacks sufficient detail to
  state a claim within the agency's jurisdiction and requests additional information. The
  complainant does not provide the requested information. Under S.D. Codified Laws § 36-1C-2, what
  action may the administrator take?
options:
  - Refer the complaint to the agency's legal counsel for review.
  - Require the complainant to provide additional information.
  - Dismiss the complaint after conducting a formal hearing.
  - Reject the complaint and take no further action at this time.
key: D
explanation: Under §36-1C-2, if a complainant fails to provide additional information requested by
  the administrator, the administrator may reject the complaint without further action. Therefore,
  the correct response is to reject the complaint and take no further action at this time. The
  distractor suggesting the administrator should again require additional information is incorrect
  because the complainant has already failed to comply, triggering the rejection provision.
