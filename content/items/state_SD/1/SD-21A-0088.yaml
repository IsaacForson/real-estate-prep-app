stem: A licensee's errors and omissions insurance coverage expires on March 31. The licensee submits
  the required certification of optional coverage to the South Dakota Real Estate Commission on
  April 2. What is the consequence under South Dakota administrative rules?
options:
  - The license is subject to a $200 late filing fee but remains active.
  - The license is automatically renewed for another biennial period.
  - The license remains active because the certification was submitted within the grace period.
  - The license is placed on inactive status effective March 31.
key: D
explanation: The rule provides that certification of optional coverage must be filed by 5:00 p.m. on
  the date of expiration of coverage, and if not filed on time the commission shall place the
  license on inactive status on that date. The distractor suggesting a grace period for late
  submission is incorrect because the rule allows no such grace period; the license becomes inactive
  as of the expiration date.
