stem: According to South Dakota law, what is the required composition of the Real Estate Commission?
options:
  - Three active real estate brokers and two public members
  - Four active real estate brokers and one public member
  - Five members all of whom must be active real estate brokers
  - Two brokers, two public members, one attorney, and one appraiser
key: A
explanation: S.D. Codified Laws § 36‑21A‑13 provides that the commission shall consist of three
  members who are active real estate brokers and two members who are members of the public.
  Therefore, the composition of three active brokers and two public members meets the statutory
  requirement. The other answer choices describe different numbers of brokers, public members, or
  additional professionals, which do not match the composition set out in the statute.
