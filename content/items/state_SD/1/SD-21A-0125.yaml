stem: A salesperson employed by a broker is asked to oversee the broker's office operations,
  including supervising other licensees and managing trust accounts. According to South Dakota
  administrative rules, is the salesperson permitted to assume these management responsibilities?
options:
  - Yes, the salesperson may assume management responsibilities if assigned by the broker.
  - No, a salesperson may not assume any management responsibilities.
  - Yes, the salesperson may assume management responsibilities only if also holding a broker
    associate license.
  - Yes, the salesperson may assume management responsibilities after completing additional training.
key: B
explanation: The rule explicitly states that a broker may assign management responsibilities to a
  broker associate, but a salesperson may not assume any management responsibilities. The
  distractors suggesting permission under various conditions contradict the rule’s prohibition.
