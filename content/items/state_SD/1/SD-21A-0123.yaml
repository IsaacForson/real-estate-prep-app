stem: Under South Dakota administrative rules, what is the timeframe within which an applicant for a
  real estate license by examination must have completed the required prelicensing education?
options:
  - Within six months before the date of application
  - Within two years before the date of application
  - Within one year before the date of application
  - Within three years before the date of application
key: B
explanation: The rule requires applicants to submit proof of completing the required education
  within the two years before the date of application. The distractor stating one year is incorrect
  because it shortens the required period, while three years and six months misstate the timeframe.
