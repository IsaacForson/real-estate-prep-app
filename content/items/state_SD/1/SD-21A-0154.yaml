stem: The commission pays $6,000 from the real estate recovery fund to satisfy a judgment against a
  licensee. What must the licensee do to be eligible for reinstatement?
options:
  - The licensee must repay the $6,000 paid from the fund
  - The licensee must repay $6,000 plus interest at the Category A rate
  - The licensee must repay $6,000 plus interest at the state statutory rate
  - The licensee must wait for the fund balance to exceed $100,000
key: B
explanation: The statute provides that a licensee may not be reinstated until the amount paid from
  the fund is repaid in full plus interest at the Category A rate. Referring to a different interest
  rate or omitting interest does not satisfy the requirement.
