stem: The South Dakota Real Estate Commission obtains an injunction against an individual who was
  practicing real estate without a license. According to § 36-21A-91, what must the court award the
  commission in this action?
options:
  - A civil penalty of up to two thousand five hundred dollars.
  - Attorney fees and costs of the investigation and proceedings.
  - The individual's license to practice real estate.
  - A requirement to complete continuing education.
key: B
explanation: The statute states that in any action where an injunction is granted, the court shall
  award the commission attorney fees and costs of the investigation and proceedings. Therefore, the
  court must award those fees and costs. The option referencing a civil penalty is not mentioned in
  this provision.
