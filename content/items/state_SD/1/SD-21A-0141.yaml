stem: An applicant completed the required prelicensing education on July 15, 2023. What is the
  latest date they may submit an application for license by examination and still satisfy the
  education requirement?
options:
  - August 15, 2025
  - July 15, 2026
  - July 15, 2025
  - July 15, 2024
key: C
explanation: SD Admin. R. art. 20:69:03:02 requires proof of education to have been completed within
  the two years before the date of application, so education finished on July 15, 2023 remains valid
  for applications submitted through July 15, 2025. The July 15, 2026 option incorrectly allows
  three years, while the August 15, 2025 option adds an extra month beyond the two‑year limit.
