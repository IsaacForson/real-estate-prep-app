stem: A licensee asks the executive director for a copy of the minutes from the last commission
  meeting. Under § 36-21A-18, what duty requires the executive director to provide this?
options:
  - Keep a record of all proceedings, transactions, communications and official acts of the
    commission
  - Prepare and distribute the commission's annual report to the Governor and post it on the agency
    website
  - Be custodian of all moneys received and maintain accurate financial records and reconcile
    accounts monthly
  - Deposit all moneys in depositories designated by the commission and ensure proper accounting
key: A
explanation: The executive director’s duty to keep a record of proceedings includes maintaining
  meeting minutes, which must be provided upon request. The distractor about being custodian of
  moneys received and maintaining financial records does not pertain to meeting minutes.
