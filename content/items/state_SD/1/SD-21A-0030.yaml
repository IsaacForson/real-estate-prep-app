stem: According to South Dakota Administrative Rules, how may the Real Estate Commission take
  official action?
options:
  - By in-person meeting at the commission office
  - By mail ballot or conference telephone call
  - By email vote with signed written consent
  - By majority vote of the executive director alone
key: B
explanation: The rule states that the commission may take any action by a mail ballot or by a
  conference telephone call, so the correct choice reflects those two methods. The option suggesting
  only an in-person meeting is incorrect because the rule explicitly allows alternative methods.
