stem: According to S.D. Codified Laws § 36-21A-13, what restriction applies to the political party
  affiliation of the members of the South Dakota Real Estate Commission?
options:
  - The Governor must appoint members from two political parties.
  - At least three members must be unaffiliated with any party.
  - Members may not all be from the same political party.
  - All members must belong to the same political party.
