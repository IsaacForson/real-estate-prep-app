stem: An applicant passed the real estate examination on June 1 and received notice of passing on
  June 5. By what date must the applicant submit the application for license by examination to be
  timely?
options:
  - By July 5.
  - By August 4.
  - By September 4.
  - By June 30.
key: B
explanation: The application must be filed within 60 days after the date of notice of having passed
  the examination. Counting 60 days from June 5 yields August 4. The distractor July 5 is only 30
  days later, while September 4 and June 30 are outside the 60‑day window.
