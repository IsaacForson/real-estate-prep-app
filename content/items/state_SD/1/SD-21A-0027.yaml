stem: Under South Dakota Administrative Rules, what constitutes a meeting of the South Dakota Real
  Estate Commission?
options:
  - A mail ballot or conference telephone call
  - A quorum of three commissioners present at meeting
  - A public hearing notice posted online
  - A written resolution copy filed electronically
key: A
explanation: The rule states that a mail ballot or conference telephone call is a meeting of the
  commission. A quorum of three commissioners is not defined as a meeting under this provision.
