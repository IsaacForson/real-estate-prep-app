stem: A buyer obtains a final judgment of $18,000 against a licensee for fraudulent practices in a
  real estate transaction. What is the maximum amount that may be paid from the real estate recovery
  fund to satisfy this judgment?
options:
  - $12,000
  - $15,000
  - $18,000
  - $20,000
key: B
explanation: The recovery fund may pay up to fifteen thousand dollars per person for actual and
  direct loss, regardless of the judgment amount. Since the judgment exceeds this cap, the maximum
  payable is $15,000. The option stating $18,000 overstates the allowable payment, the option
  stating $12,000 understates it, and the option stating $20,000 also overstates it.
citation:
  source: S.D. Codified Laws § 36-21A-104
  url: null
  quoted_text: Nothing in this chapter may obligate the fund for more than fifteen thousand dollars
    for each person.
  secondary: []
math:
  worked_solution: |-
    Step 1: Identify the statutory cap per person from the citation: $15,000.
    Step 2: Compare the judgment amount ($18,000) to the cap.
    Step 3: Because $18,000 > $15,000, the fund pays the cap amount.
    Step 4: Maximum payment = $15,000.
  formulas:
    - Payment = min(judgment amount, statutory cap)
    - Statutory cap = $15,000 per person
