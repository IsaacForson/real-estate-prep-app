stem: At a meeting of the South Dakota Real Estate Commission, only three of the five members are
  present. According to § 36-21A-15, what is the minimum number of votes required for the commission
  to take official action?
options:
  - Three votes
  - Four votes
  - One vote
  - Two votes
key: D
explanation: The law states that actions are taken upon a majority vote of those members present.
  With three members present, a majority is more than half, which is two votes. One vote is not a
  majority, three votes would be unanimous but not required, and four votes cannot occur with only
  three members present.
