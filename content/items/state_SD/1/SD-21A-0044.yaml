  quoted_text: Upon receipt of a petition for a declaratory ruling, the commission may request from
    the petitioner any other information it requires for the issuance of its ruling. Following the
    receipt of the petition, the commission shall issue its declaratory ruling and serve a copy of
    it by mail on the petitioner.
