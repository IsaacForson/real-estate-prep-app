stem: A licensee files a petition for a declaratory ruling asking whether a certain advertising
  practice is permitted under state law. After the commission receives the petition, what must it do
  next?
options:
  - Request additional information from the petitioner
  - Issue the declaratory ruling and serve a copy by mail
  - Deny the petition for lack of sufficient information
  - Schedule a contested case hearing within thirty days
key: B
explanation: Under SD Admin. R. art. 20:69:02:04, upon receipt of a petition for a declaratory
  ruling, the commission may request additional information, but following receipt it shall issue
  its declaratory ruling and serve a copy by mail on the petitioner. Thus issuing the ruling and
  mailing the copy is required. The distractor suggesting only a request for information is
  incomplete because the rule mandates the ruling and service after any requested information is
  received.
citation:
