stem: A licensee fails to provide requested information during an investigation by the South Dakota
  Real Estate Commission. According to S.D. Codified Laws § 36-1C-4, what is the consequence?
options:
  - The licensee may be automatically fined $2,500 for non‑compliance.
  - The licensee may have the complaint dismissed without further action.
  - The licensee may be subject to denial of the application or disciplinary action.
  - The licensee may be required to attend a mandatory continuing education course.
key: C
explanation: Under S.D. Codified Laws § 36-1C-4, a licensee who fails to provide requested
  information during an investigation may be subject to denial of the application or disciplinary
  action. The statute does not provide for automatic fines, dismissal of complaints, or mandatory
  continuing education as a consequence of non‑compliance.
