stem: A commission member appointed after July 1, 2005 has completed two consecutive full three‑year
  terms. The member is then appointed to fill a vacancy for the unexpired portion of a term.
  According to § 36-21A-14, how many consecutive full terms has the member served?
options:
  - One full term
  - Two full terms
  - Three full terms
  - Four full terms
key: B
explanation: The law provides that an appointment to fill a vacancy serves only the unexpired
  portion and is not considered a full term. Therefore, the member’s consecutive full‑term count
  remains two. The distractor of three full terms incorrectly treats the vacancy appointment as a
  full term.
citation:
