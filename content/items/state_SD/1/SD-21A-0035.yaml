stem: A licensee wants to attend a real estate institute conducted by the South Dakota Real Estate
  Commission. What may the commission do regarding fees for such institutes under § 36-21A-24?
options:
  - Require licensees to pay only actual instruction costs
  - Prohibit charging any fee for commission-sponsored education
  - Charge a reasonable fee for the institute
  - Provide the institute free of charge to all licensees
key: C
explanation: Under § 36-21A-24, the commission may charge a reasonable fee for courses or institutes
  it conducts. Therefore the correct answer is the option stating that the commission may charge a
  reasonable fee for the institute. The option stating that licensees must pay only actual
  instruction costs is incorrect because the statute allows a reasonable fee, not limited to actual
  costs. The option stating that the commission may not charge any fee is incorrect because the
  statute permits a reasonable fee. The option stating that the institute must be provided free of
  charge is also incorrect.
