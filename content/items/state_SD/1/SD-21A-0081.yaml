stem: The executive director of the South Dakota Real Estate Commission receives a check from a
  licensee for renewal fees. Under § 36-21A-18, what must the executive director do with the money?
options:
  - Deposit it in any bank of their choosing
  - Forward it directly to the state treasurer
  - Hold it in the commission's office safe
  - Deposit it in depositories designated by the commission
key: D
explanation: The statute requires the executive director to deposit all moneys in depositories
  designated by the commission. Depositing in any bank of their choosing ignores the designation
  requirement, holding the money in a safe violates the deposit mandate, and forwarding it to the
  state treasurer is not prescribed.
