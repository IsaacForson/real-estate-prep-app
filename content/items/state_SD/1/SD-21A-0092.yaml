stem: According to S.D. Codified Laws § 36-21A-68, what is the effect of a finding of unprofessional
  conduct on a licensee's right to set minimum fees?
options:
  - It prohibits the licensee from setting any minimum fees.
  - It allows the commission to set the licensee's minimum fees.
  - It does not impair the licensee's right to set minimum fees chargeable for his services.
  - It requires the licensee to obtain commission approval before setting fees.
key: C
explanation: The statute explicitly states that the term unprofessional conduct does not impair the
  right of a licensee to set minimum fees chargeable for his services. Therefore, a finding of
  unprofessional conduct does not affect that right. The distractor that claims it prohibits setting
  any minimum fees is incorrect because the statute removes any such impairment.
