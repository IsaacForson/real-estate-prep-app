stem: After the South Dakota Real Estate Commission pays an amount from the real estate recovery
  fund to satisfy a judgment against a licensee, what must the licensee do to be eligible for
  reinstatement?
options:
  - Repayment of the amount paid plus interest at the Category A rate
  - Repayment of the amount paid only plus interest at the standard rate
  - Repayment of the amount paid plus interest at the standard rate
  - Repayment of the amount paid plus interest at the fixed rate
key: A
explanation: Under S.D. Codified Laws § 36-21A-114, a licensee must repay in full the amount paid
  from the fund plus interest at the Category A rate before reinstatement is allowed. Repaying only
  the principal, using a different interest rate, or omitting interest does not satisfy this
  requirement.
