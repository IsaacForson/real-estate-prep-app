stem: After the South Dakota Real Estate Commission pays from the recovery fund on behalf of a
  licensee, what must the licensee do before the license can be reinstated?
options:
  - Wait six months period
  - Repay fund plus interest
  - Repay fund amount only
  - Submit license application
key: B
explanation: According to § 36-21A-114, the licensee must repay in full the amount paid from the
  fund plus interest at the Category A rate before reinstatement. Repaying only the principal amount
  is insufficient because interest is also required.
