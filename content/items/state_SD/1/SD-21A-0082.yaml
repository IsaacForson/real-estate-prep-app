stem: After receiving a properly submitted complaint, the administrator assigns an investigative
  committee to review the allegation. Which of the following must be true about the composition of
  that committee?
options:
  - The agency's legal counsel must be part of the investigative committee
  - The alleged complainant must be part of the investigative committee
  - The licensee's defense attorney must be part of the investigative committee
  - The public representative must be part of the investigative committee
key: A
explanation: The statute explicitly states that an investigative committee includes the agency's
  legal counsel. The other options describe individuals who are not required to serve on the
  committee by law.
