stem: The South Dakota Real Estate Commission imposes a $1,500 monetary penalty on a licensee for
  unprofessional conduct. Where must the commission deposit the money collected from this penalty?
options:
  - Into the real estate recovery fund.
  - Into the commission's general fund.
  - Into the state's general fund.
  - Into the fund of the commission.
key: D
explanation: Under S.D. Codified Laws § 36-21A-68, any moneys collected from a monetary penalty must
  be deposited into the fund of the commission. The real estate recovery fund is incorrect because
  the statute directs penalties to the commission's fund, not the recovery fund.
