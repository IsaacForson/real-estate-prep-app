stem: The executive director of the South Dakota Real Estate Commission receives cash from a
  licensee as part of a fine payment. According to § 36-21A-18, which duty must the executive
  director perform regarding that money?
options:
  - To keep a record of commission proceedings and official acts
  - To be custodian of all moneys received and deposited by the commission
  - To deposit all moneys in depositories designated by the commission
  - To be custodian of all records and other documents of the commission
key: C
explanation: The statute requires the executive director to deposit all moneys in depositories
  designated by the commission. The distractor about being custodian of moneys received omits the
  mandatory deposit step, which is the specific duty triggered upon receipt of funds.
