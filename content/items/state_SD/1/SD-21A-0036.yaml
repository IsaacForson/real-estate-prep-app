stem: A member of the public requests a list of all licensed real estate brokers from the South
  Dakota Real Estate Commission. What may the commission do regarding a fee for providing this list
  under § 36-21A-26?
options:
  - Charge a reasonable fee to the requester
  - Charge only the actual copying costs, not a reasonable fee
  - Refuse to provide the list to non‑licensees
  - Provide the list free of charge because it is a public record
key: A
explanation: Under § 36-21A-26, the commission may charge a reasonable fee to persons who request
  the list of licensees, which matches the option stating that a reasonable fee may be charged. The
  option stating that the commission may refuse to provide the list to non‑licensees is incorrect
  because the law permits charging a reasonable fee, not a refusal. The option stating that only
  actual copying costs may be charged is incorrect because the law allows a reasonable fee, which
  may exceed copying costs. The option stating that the list must be provided free of charge because
  it is a public record is incorrect because the law explicitly allows a reasonable fee.
