stem: What constitutes a meeting of the South Dakota Real Estate Commission under SD Admin. R. art.
  20:69:02:02?
options:
  - Mail ballot method only allowed
  - Conference call method only allowed
  - Mail ballot or conference call method allowed
  - In-person meeting method only allowed
key: C
explanation: The rule states the commission may take any action by mail ballot or conference call,
  and that such a mail ballot or conference telephone call is a meeting of the commission.
  Therefore, either method constitutes a meeting. The distractors incorrectly limit the commission
  to only one method or to in-person meetings only.
citation:
  source: S.D. Admin. R. art. 20:69:02:02
  url: null
  quoted_text: The commission may take any action by a mail ballot or by a conference telephone call.
    In case of a conference telephone call, the executive director shall participate in the call and
    take minutes of the commission action. In case of a mail ballot, the results of the mail ballot
    shall be included in the minutes. A mail ballot or conference telephone call is a meeting of the
    commission.
