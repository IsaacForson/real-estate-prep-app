stem: A nonresident salesperson licensed in South Dakota establishes residency in the state and asks
  to be exempt from completing the broker associate license requirements by the end of the current
  license term. What may the commission do?
options:
  - The commission may automatically place the license on inactive status.
  - The commission may require completion within 30 days.
  - The commission may grant a reasonable exception.
  - The commission may deny the request as the rule allows no exceptions.
key: C
explanation: The rule explicitly states that the commission may grant a reasonable exception to the
  requirement that a nonresident salesperson who establishes residency must complete broker
  associate qualifications by the end of the license term or place the license on inactive status.
  The distractor claiming the rule allows no exceptions contradicts the expressed authority to grant
  an exception.
