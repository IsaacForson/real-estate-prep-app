stem: A licensee receives a written complaint from the South Dakota Real Estate Commission. How many
  business days does the licensee have to submit a response to the administrator?
options:
  - 20 business days
  - 15 business days
  - 30 business days
  - 10 business days
key: A
explanation: Section 36-1C-3 requires the licensee to send a response within twenty business days
  after service of the complaint. Shorter periods such as 10 or 15 business days do not satisfy this
  mandatory timeframe.
