stem: If the South Dakota Real Estate Commission revokes a licensee's license, what recourse does
  the licensee have under S.D. Codified Laws § 36-21A-86?
options:
  - The licensee may request a rehearing before the commission within ten days.
  - The licensee may file an appeal as provided by chapter 1-26.
  - The licensee may immediately apply for a new license without any waiting period.
  - The licensee may seek a reduction of the monetary penalty through mediation.
key: B
explanation: The statute states that an appeal from the commission's decision may be taken as
  provided by chapter 1-26. Therefore, the licensee may file an appeal under that chapter. The
  distractor about requesting a rehearing within ten days is not supported by the cited text.
