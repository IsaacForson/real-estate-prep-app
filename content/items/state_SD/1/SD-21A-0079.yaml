stem: The executive director of the South Dakota Real Estate Commission receives $10,000 in license
  fees. What must the executive director do with this money?
options:
  - The executive director must deposit the money in a depository designated by the commission.
  - The executive director must hold the money in a personal trust account.
  - The executive director must retain the money as personal compensation.
  - The executive director must forward the money to the Governor's office.
key: A
explanation: Under S.D. Codified Laws § 36-21A-18, the executive director must be custodian of all
  moneys received and deposit them in depositories designated by the commission. Keeping the funds
  as personal compensation violates this duty.
