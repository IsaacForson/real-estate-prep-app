stem: What is the duration of a certificate of approval issued by the South Dakota Real Estate
  Commission for an approved prelicensing course?
options:
  - The certificate is valid for five years.
  - The certificate is valid for seven years.
  - The certificate is valid for three years.
  - The certificate is valid for eleven years.
key: C
explanation: S.D. Admin. R. art. 20:69:04:01.01 provides that the commission shall grant a
  certificate of approval for each approved course of study and that the certificate is valid for
  three years. Therefore, the answer stating a three‑year validity is correct; the alternatives that
  list five, seven, or eleven years are incorrect because the rule limits the certificate’s term to
  three years.
