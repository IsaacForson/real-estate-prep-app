stem: A licensee receives a written complaint alleging unprofessional conduct and does not respond
  within the required time frame. What is the consequence under South Dakota law?
options:
  - An automatic dismissal of the complaint without further action.
  - A requirement to pay a $2,500 fine to the commission.
  - A grounds for disciplinary action against the licensee.
  - A mandatory twenty‑business‑day extension to submit a response.
key: C
explanation: Under § 36-1C-3, failure to respond to a complaint within twenty business days is
  grounds for disciplinary action. The other options describe outcomes not stated in the statute for
  this failure.
