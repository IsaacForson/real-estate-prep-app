stem: Under South Dakota law, when the Real Estate Commission seeks an injunction for unprofessional
  conduct, what may this action serve as an alternate to?
options:
  - A criminal proceedings
  - B civil lawsuit
  - C administrative hearing
  - D license suspension
key: A
explanation: The statute states that the commission may commence an action for injunction for
  unprofessional conduct 'or, as an alternate to criminal proceedings, for violation of this
  chapter.' Thus the injunction may be used instead of criminal proceedings. A civil lawsuit is not
  mentioned as an alternate in the provision.
