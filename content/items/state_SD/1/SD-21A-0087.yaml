stem: A course provider submits an application to offer a distance education prelicensing course. To
  satisfy South Dakota administrative rules, what must the application include regarding student
  progress measurement?
options:
  - The course provider must provide a mechanism of individual remediation to correct any
    deficiencies identified during instruction and assessment.
  - The course provider must measure, at regular intervals, the student's progress toward and
    completion of the mastery requirement of each lesson or module covering all the required subject
    matter.
  - The course provider must demonstrate that approved instructors are available to answer student
    questions regarding course content at reasonable times and by reasonable means.
  - The course provider must require that the student pass an appropriate exam to successfully
    complete and receive credit.
key: B
explanation: The rule requires the course provider to measure, at regular intervals, the student's
  progress toward and completion of the mastery requirement of each lesson or module covering all
  the required subject matter. The distractor about providing a remediation mechanism describes a
  different requirement found elsewhere in the same subsection, not the progress measurement
  obligation.
