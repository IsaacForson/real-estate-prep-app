stem: The South Dakota Real Estate Commission has just issued a final order suspending the license
  of a responsible broker. According to § 36-21A-69.1, what must the responsible broker do regarding
  the licenses of any associate licensees?
options:
  - Allow the associate licensees to continue working
  - Return the associate licenses to the commission
  - Transfer the associate licenses to another broker
  - Retain the associate licenses with the broker
key: B
explanation: The statute requires the responsible broker to return the licenses of any associate
  licensee to the commission when the order suspending or revoking the broker's license becomes
  final. Therefore, the broker must return the licenses. The distractor 'Retain the associate
  licenses with the broker' contradicts the requirement to return them.
