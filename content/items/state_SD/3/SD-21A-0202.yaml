stem: According to South Dakota law, which of the following is included in the statutory definition
  of confidential information?
options:
  - Material facts about the physical condition of the property
  - Information given to the licensee in confidence
  - Information that is already public knowledge
  - Details obtained from a third party without the client's consent
key: B
explanation: The definition of confidential information includes any information given to the
  licensee in confidence. Material facts about the physical condition of the property are explicitly
  excluded from this definition. Therefore, the correct answer is the information given in
  confidence.
