stem: What must be included in a written agency agreement to indicate when the agreement begins
  under South Dakota law?
options:
  - Date of authorization
  - Compensation terms
  - Agency relationship type
  - Date of expiration
key: A
explanation: The statute requires that any written agency agreement include the date of
  authorization, which marks when the agreement begins. The other items, while also required, do not
  indicate the start date. Therefore, the date of authorization is the correct answer.
