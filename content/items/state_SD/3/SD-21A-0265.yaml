stem: What is the statutory definition of a limited agent under South Dakota law?
options:
  - Any licensee who represents only one party to a transaction and owes fiduciary duties solely to
    that party
  - Any licensee who assists one or more parties with a real estate transaction without being an
    agent for any party
  - Any licensee who has a written agency relationship with both the seller and the buyer in the
    same in-company transaction
  - Any licensee who has a written agency relationship with either the seller or the buyer but not
    both
key: C
explanation: Under S.D. Codified Laws § 36-21A-1(13), a limited agent is any licensee who has a
  written agency relationship with both the seller and the buyer in the same in-company transaction.
  The option stating that a licensee represents only one party and owes fiduciary duties solely to
  that party describes a single agent, not a limited agent. The option stating that a licensee
  assists one or more parties without being an agent for any party describes a transaction broker or
  facilitator, not a limited agent. The option stating that a licensee has a written agency
  relationship with either the seller or the buyer but not both also describes a single agent, not a
  limited agent.
