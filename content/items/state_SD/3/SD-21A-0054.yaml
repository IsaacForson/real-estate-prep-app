stem: An affiliated licensee employed as an independent contractor commits an act of unprofessional
  conduct. Who is responsible for the licensee's actions under South Dakota law?
options:
  - Only the affiliated licensee is liable because they are an independent contractor and therefore
    cannot be held accountable by the broker.
  - The responsible broker is responsible only if the licensee is classified as an employee even
    though the broker supervises the licensee's work.
  - The commission shall hold the brokerage firm's owner liable regardless of employment status
    under any circumstances.
  - The responsible broker is responsible for the real estate activities conducted by affiliated
    licensees, whether as employees or independent contractors.
key: D
explanation: The statute expressly states that a responsible broker is responsible for the real
  estate activities conducted by affiliated licensees, whether as employees or independent
  contractors. Therefore, the broker bears responsibility regardless of the independent contractor
  status.
