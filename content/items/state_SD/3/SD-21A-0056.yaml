stem: According to South Dakota law, which of the following is included in the statutory definition
  of an adverse material fact?
options:
  - Any increase in property value resulting from market trends or appraisal adjustments
  - Any environmental hazards affecting the property which are required by law to be disclosed
  - Any future zoning changes that have not yet been proposed, enacted, or officially considered
  - Any personal preference of the buyer concerning neighborhood amenities or school districts
key: B
explanation: The statute defines adverse material facts as including environmental hazards that must
  be disclosed by law. The other options describe positive market changes, personal preferences, or
  future zoning not yet proposed, which are not part of the definition.
