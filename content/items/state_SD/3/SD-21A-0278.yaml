stem: How long must a broker retain deposit slips and ledger sheets for special trust accounts?
options:
  - Four years from the closing date
  - Five years from the closing date
  - Two years from the closing date
  - Three years from the closing date
key: A
explanation: Under SDCL § 36-21A-82, deposit slips and ledger sheets must be kept as part of the
  broker’s records for at least four years from the closing of the transaction. The three‑year
  option is incorrect because the rule specifies a minimum of four years, not three.
