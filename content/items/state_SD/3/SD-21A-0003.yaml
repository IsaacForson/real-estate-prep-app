stem: A broker lists and markets a home for sale after a neighbor casually mentioned that the owner
  might want to sell, without ever contacting the owner. What unprofessional conduct has the broker
  committed?
options:
  - Offering the property without the owner's consent
  - Neglecting to register the branch office under the firm
  - Failing to substantiate the accuracy of the listing data
  - Refusing to remit the seller's closing statement promptly
