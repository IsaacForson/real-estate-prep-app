stem: A licensee closes her brokerage office in Sioux Falls on March 10, 2025 and opens a new office
  in Rapid City on the same day. To comply with South Dakota law, by what date must the licensee
  give written notice to the commission about the removal?
options:
  - March 20, 2025
  - March 24, 2025
  - March 10, 2025
  - March 17, 2025
key: A
explanation: Notice must be given within ten days after removal; ten days after March 10, 2025 is
  March 20, 2025. March 17 falls short of the full period, while March 24 exceeds the allowed time.
