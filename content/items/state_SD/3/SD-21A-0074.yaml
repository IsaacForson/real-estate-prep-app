stem: "A licensee meets a prospective buyer at an open house and discusses the buyer's pre-approval
  amount and desired move-in date. Under South Dakota law, this discussion constitutes:"
options:
  - A transaction brokerage arrangement permitted by regulation
  - A discussion that qualifies as substantive contact under the statute
  - A limited agency relationship requiring written consent
  - An informative act that does not constitute representation under the law
key: B
explanation: Discussing the buyer's pre-approval amount (a specific financial qualification) and
  move-in date (a buying motive) meets the definition of substantive contact, which includes
  discussion of financial qualifications or motives (§36-21A-129). The distractor about an
  informative act is wrong because informative acts are limited to those in §128 and do not cover
  such discussions.
