stem: A salesperson places a newspaper advertisement for a listed home but includes only her own
  name and phone number. What must the advertisement clearly state to comply with South Dakota's
  advertising restrictions?
options:
  - The commission rate charged on the listed property
  - The name of the firm the licensee is associated with
  - The expiration date of the licensee's current license
  - The license number assigned to the individual licensee
key: B
explanation: SDCL 36-21A-72 requires that each advertisement clearly state the name of the firm with
  which an individual licensee is associated.
