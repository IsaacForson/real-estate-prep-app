stem: A broker classifies an affiliated salesperson as an independent contractor. Which of the
  following would **NOT** support that classification under South Dakota's independent contractor
  test?
options:
  - The licensee covers the licensee's own vehicle costs
  - The broker sets general policy for the licensee's work
  - The licensee may terminate the relationship at will
  - The broker withholds social security taxes
key: D
explanation: SDCL 36-21A-124 lists compensating the licensee on the basis of work performed without
  withholding and remitting federal income and social security taxes as a condition of independent
  contractor status, so withholding those taxes is inconsistent with the test.
