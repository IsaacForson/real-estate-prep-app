stem: A buyer's agent is asked by the buyer whether a registered sex offender lives near the
  property. The agent has actual knowledge of such an offender. What must the agent do under South
  Dakota law?
options:
  - To ignore the inquiry and provide no information
  - To investigate the presence of a sex offender
  - To volunteer the information without being asked
  - To disclose the actual knowledge to the buyer
key: D
explanation: The statute states that a buyer's agent has no duty to investigate or volunteer sex
  offender information, but must disclose any actual knowledge upon inquiry by the client. Therefore
  the agent must disclose the known information when asked. Volunteering without being asked,
  investigating, or ignoring the inquiry are not required.
citation:
