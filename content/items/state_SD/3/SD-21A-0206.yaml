stem: A broker's written employment contract authorizes retention of a principal's funds until final
  settlement. The broker accepts the purchase contract on a Thursday, September 5, 2024. Assuming no
  holidays, on what date must the broker deposit the funds into a special trust account at a
  federally insured financial institution?
options:
  - September 5, 2024
  - September 7, 2024
  - September 8, 2024
  - September 6, 2024
key: D
explanation: The broker must deposit the money on the first legal banking day after contract
  acceptance. Acceptance on Thursday, September 5, 2024 makes Friday, September 6, 2024 the first
  subsequent banking day. The option September 5, 2024 is the acceptance date itself, not the day
  after.
