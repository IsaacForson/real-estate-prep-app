stem: A broker signs an agency agreement with a tenant on June 10, 2025. What must be included in
  the agreement to indicate when the agreement ends under South Dakota law?
options:
  - Date of authorization
  - Agency relationship type
  - Compensation terms
  - Date of expiration
key: D
explanation: To indicate when the agreement ends, the statute requires the inclusion of the
  expiration date. The date of authorization shows the start, while compensation and relationship
  type do not indicate timing. Thus, the date of expiration is the correct answer.
citation:
  source: S.D. Codified Laws § 36-21A-130
  url: null
