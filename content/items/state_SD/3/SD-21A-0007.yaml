  - On the final day of the month the money was received
  - Within thirty calendar days of signing the deposit
  - Within ten business days after the sale closes
key: A
explanation: SDCL 36-21A-80 requires the responsible broker to deposit the money in a special trust
  account at a federally insured institution on the first legal banking day after the acceptance of
  the contract.
