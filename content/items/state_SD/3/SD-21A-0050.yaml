stem: A real estate team advertises its services in a newspaper. To comply with South Dakota's
  advertising restrictions, what must the advertisement clearly state?
options:
  - The advertisement must state that the team offers independent brokerage services
  - The advertisement must disclose the license fee paid to the commission
  - The advertisement must state the name of the brokerage company the team is affiliated with
  - The advertisement must state the individual licensee's name
key: C
explanation: The statute mandates that any advertisement of a real estate team must clearly state
  the name of the brokerage company the team is affiliated with. Therefore, the correct answer is
  that the advertisement must state the brokerage company name. The other options either refer to
  the individual licensee's name, imply independent services, or disclose fees, which are not
  required by this provision.
