key: A
explanation: The application fee for a time-share agent's license is fixed at $225 by South Dakota
  administrative rule. This fee must be submitted with the application for licensure. The other
  amounts correspond to fees for different license types or are arbitrary values not prescribed for
  time-share agent applications.
