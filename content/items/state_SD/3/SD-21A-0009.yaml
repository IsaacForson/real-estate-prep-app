stem: Under South Dakota law, when does a responsible broker become entitled to any part of the
  compensation paid in a transaction?
options:
  - As soon as the purchase agreement is signed
  - Once the earnest money check has cleared
  - Once the deal is consummated or terminated
  - At the moment the listing agreement is executed
key: C
explanation: SDCL 36-21A-84 provides that no responsible broker is entitled to any part of the
  compensation paid in a transaction until the transaction has been consummated or terminated.
citation:
  source: S.D. Codified Laws § 36-21A-84
  url: null
  quoted_text: >-
    No responsible broker is entitled to any part of the money paid to the responsible 

    broker in any transaction as part of the responsible broker's compensation until the transaction
    has been 

    consummated or terminated.
