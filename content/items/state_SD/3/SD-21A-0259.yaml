stem: A licensee plans to close her brokerage office in Aberdeen on June 15, 2025 and open a new
  office in Pierre on the same date. To satisfy the requirement to give notice 'before the removal,'
  what is the latest calendar date on which she may give written notice to the commission?
options:
  - June 14, 2025
  - June 22, 2025
  - June 15, 2025
  - June 16, 2025
key: A
explanation: The rule requires notice to be given before the removal; therefore the latest
  permissible date is the day before the removal, June 14, 2025. June 15 is the removal date itself,
  which does not meet the 'before' requirement.
citation:
