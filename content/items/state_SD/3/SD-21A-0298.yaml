stem: A seller's agent shows a prospective buyer a property that is listed by another brokerage and
  not owned by the seller client. Under South Dakota law, does this action breach any duty to the
  seller client?
options:
  - The agent breaches the duty only if the property is priced higher than the client's property
  - The agent breaches the duty unless the seller provides written consent
  - The agent does not breach any duty because showing alternative properties is permitted
  - The agent breaches the duty of loyalty by showing a competing property
key: C
explanation: The statute expressly allows a seller's or landlord's agent to show alternative
  properties not owned by the client to prospective buyers without breaching any duty or obligation
  to the client.
citation:
  source: S.D. Codified Laws § 36-21A-135
  url: null
  quoted_text: A seller's or landlord's agent may show alternative properties not owned by the client
    to prospective buyers and may list competing properties for sale or lease without breaching any
    duty or obligation to the client.
