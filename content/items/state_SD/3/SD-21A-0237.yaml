stem: Under South Dakota law, what must a licensee do regarding compensation received for acts
  requiring a license?
options:
  - Reveal the full amount of compensation to the principal or employer
  - Keep the compensation confidential from the principal and employer
  - No disclosure is required when paid by a third party unless exempt
  - Disclose compensation only if it exceeds five hundred dollars
key: A
explanation: The statute defines as unprofessional conduct the failure to reveal to the principal or
  employer the full amount of compensation for licensed acts, so the licensee must disclose that
  amount. The distractor about keeping compensation confidential describes the prohibited behavior
  of concealing compensation from the principal.
