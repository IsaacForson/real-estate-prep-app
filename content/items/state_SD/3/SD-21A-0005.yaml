stem: Two different firms cooperate on a sale, and the buyer's agent collects the earnest money.
  Absent any other agreement between the buyer and seller, where must that earnest money be held?
options:
  - In the buyer's own account until closing is consummated
  - In the listing broker's personal safe at the office
  - In a broker's trust account unless otherwise agreed
  - In the selling broker's general operating account
key: C
explanation: SDCL 36-21A-76 requires that earnest money paid in a cooperative or cobrokerage
  transaction be held in a broker's trust account unless the buyer and seller agree otherwise.
