stem: A broker closes a real estate transaction on March 15, 2024. How long must the broker retain
  the deposit slip and ledger sheet for that transaction?
options:
  - Five years from the closing date
  - Three years from the closing date
  - Two years from the closing date
  - Four years from the closing date
key: D
explanation: The rule in SDCL § 36-21A-82 requires deposit slips and ledger sheets to be retained
  for at least four years from the closing date. Applying this to a March 15, 2024 closing means the
  broker must keep the records until March 15, 2028. The three‑year option would fall short of the
  required period.
citation:
  source: S.D. Codified Laws § 36-21A (Real Estate Licensing) — South Dakota Codified Laws Chapter
