stem: Which of the following actions constitutes substantive contact under South Dakota law?
options:
  - Responding to a phone inquiry about the price of a listed property.
  - Attending an open house and answering questions about the property's condition.
  - Discussing the buyer's specific financial qualifications with the buyer.
  - Setting an appointment to view a property for a prospective buyer.
key: C
explanation: Under South Dakota Codified Laws § 36‑21A‑129, substantive contact is any performance
  that goes beyond the initial informational acts described in § 36‑21A‑128 and specifically
  includes discussion of a buyer’s specific financial qualifications. Discussing the buyer’s
  specific financial qualifications therefore constitutes substantive contact, whereas responding to
  a price inquiry, answering general questions at an open house, or merely scheduling a viewing are
  merely informational acts and do not meet the statutory definition.
