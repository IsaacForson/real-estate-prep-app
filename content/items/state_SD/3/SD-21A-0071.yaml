stem: A licensee acting as a limited agent for both buyer and seller learns that the buyer is
  willing to pay $20,000 above the asking price. What must the licensee do with this information
  under South Dakota law?
options:
  - The licensee must disclose the information to the seller right away.
  - The licensee may disclose the information only with the buyer's written consent.
  - The licensee must keep the information confidential and not disclose it to either party.
  - The licensee may disclose the information to the seller if it aids the transaction.
key: B
explanation: Under South Dakota law, a limited agent who represents both buyer and seller may not
  reveal that a buyer is willing to pay more than the asking price unless the buyer gives informed
  written consent. Therefore, the licensee may share that information only after obtaining the
  buyer's written consent. Disclosing the information without that consent violates the prohibition,
  the buyer can authorize disclosure so keeping it secret from both parties is not required, and the
  licensee must not automatically tell the seller without the buyer's permission.
