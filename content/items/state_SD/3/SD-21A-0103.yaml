stem: What is the biennial renewal fee for a broker's license in South Dakota?
options:
  - The biennial renewal fee for a broker's license is $150.
  - The biennial renewal fee for a broker's license is $100.
  - The biennial renewal fee for a broker's license is $125.
  - The biennial renewal fee for a broker's license is $200.
key: C
explanation: South Dakota Administrative Rule 20:69 requires the biennial renewal fee for a broker's
  license, including restricted licenses, to be $125. Therefore the statement that the fee is $125
  is correct. The statements that the fee is $150, $100, or $200 are incorrect because they do not
  match the amount set by the rule.
