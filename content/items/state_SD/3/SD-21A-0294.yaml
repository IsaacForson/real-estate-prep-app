stem: A licensee acting as a limited agent for both the buyer and seller learns that the property
  has a leaking roof (an adverse material fact) and also learns that the buyer is willing to pay
  $15,000 above the asking price. According to South Dakota law, what must the licensee do?
options:
  - Disclose the leaking roof to both parties and disclose the buyer's willingness to pay more to
    both parties
  - Disclose the leaking roof to both parties but refrain from disclosing the buyer's willingness to
    pay more unless the buyer gives written consent
  - Disclose the leaking roof to both parties but keep the buyer's willingness to pay more
    confidential from both parties
  - Disclose the leaking roof to the seller only and refrain from disclosing the buyer's willingness
    to pay more to either party
key: B
explanation: The limited agent must disclose adverse material facts known to the licensee to the
  client, but may not disclose that a buyer is willing to pay more than the asking price without the
  buyer's informed written consent. The distractor that discloses the willingness to pay more
  violates the confidentiality prohibition because it lacks the required consent.
