stem: Under South Dakota law, which item must be included in the application for a subdivision
  certificate filed with the real estate commission?
options:
  - The name, address and business status of the applicant
  - A list of prospective buyers for each lot offered for sale
  - The estimated monthly rental income for each unit offered
  - A copy of the broker’s commission agreement kept on file
key: A
explanation: Section 36-21A-93(1) requires that the application contain the applicant’s name,
  address, and business status. Therefore the option that lists those items satisfies the statutory
  requirement. The other answer choices are incorrect because the statute does not require a list of
  prospective buyers, does not require estimated rental income for each unit, and does not require a
  copy of the broker’s commission agreement.
