stem: "Under South Dakota law, a responsible broker may receive compensation prior to the
  consummation or termination of a transaction only if:"
options:
  - the transaction is pending but not yet closed and the broker is acting as a limited agent
  - the South Dakota Real Estate Commission has promulgated a rule providing an exception
  - the broker has obtained written consent from the client and the principal
  - the broker is acting as a limited agent and has disclosed all adverse material facts
key: B
explanation: The statute states that the commission may promulgate rules to make reasonable
  exceptions to the rule that a broker cannot receive compensation until the transaction is
  consummated or terminated. Therefore, only the commission can create such an exception. The broker
  obtaining client consent does not override the statutory requirement.
