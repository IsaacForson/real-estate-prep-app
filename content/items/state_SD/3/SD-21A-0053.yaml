stem: A licensee who is representing a buyer wants to purchase a property that is listed with the
  licensee's own office. What must the licensee do to avoid violating unprofessional conduct
  provisions under South Dakota law?
options:
  - Disclose in writing to the owner the licensee's intention or true position regarding the
    purchase.
  - Obtain verbal consent from the owner before submitting an offer to buy.
  - Have the associate licensee prepare and submit the offer on behalf of the buyer.
  - Wait until the listing expires before making any offer to purchase.
key: A
explanation: South Dakota law defines as unprofessional conduct the failure to disclose in writing
  to the owner the licensee's intention or true position when acquiring an interest in property
  listed with the licensee's office. Providing written disclosure satisfies this requirement; the
  other options do not meet the statutory standard.
