stem: Under South Dakota law, how many days after removal from a registered place of business must a
  licensee provide written notice to the real estate commission?
options:
  - 5 days
  - 10 days
  - 7 days
  - 15 days
key: B
explanation: The statute requires written notice to be given within ten days after removal from the
  registered address. Seven days is a common misunderstanding but does not satisfy the statutory
  period.
