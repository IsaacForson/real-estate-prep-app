stem: A broker signs an agency agreement with a seller on March 1, 2025. What must be included in
  the agreement to indicate when the agreement begins under South Dakota law?
options:
  - Compensation to be paid
  - Type of agency relationship
  - Date of expiration
  - Date of authorization
key: D
explanation: Regardless of the signing date, the agreement must contain the date of authorization to
  show when the agreement begins. The date of expiration indicates when it ends, not when it begins.
  The other items are required but do not serve this purpose.
citation:
  source: S.D. Codified Laws § 36-21A-130
  url: null
  quoted_text: shall contain the proper legal description, the price and terms, the date of
    authorization, the expiration date, the type of agency relationship established, compensation to
    be paid, authorization to cooperate with or compensate other brokers, and the signatures of all
    parties.
