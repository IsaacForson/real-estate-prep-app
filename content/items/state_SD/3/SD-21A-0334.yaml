stem: "Under South Dakota law, a property management agreement may include a provision for automatic
  renewal at expiration only if it also includes:"
options:
  - a statement that the agreement is irrevocable
  - a requirement that the broker obtain the client's written consent each year
  - a clause allowing the broker to retain the deposit
  - a provision for written cancellation on terms agreeable to all parties
key: D
explanation: The statute explicitly provides that a property management agreement may include an
  automatic renewal provision only if it contains a provision for written cancellation on terms
  agreeable to all parties. The other options add conditions not mentioned in the law.
