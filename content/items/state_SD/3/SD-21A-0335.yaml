stem: According to South Dakota law, which of the following best describes a property manager for
  licensing purposes?
options:
  - Any person who negotiates purchase or sale of real estate for a fee
  - Any person who negotiates rental, exchange or leasing of real estate for a fee
  - Any person who lists real estate for sale without expectation of compensation
  - Any person who advertises real estate services without receiving compensation
key: B
explanation: The statute defines a property manager as anyone who, for a fee or expectation of a
  fee, negotiates or attempts to negotiate the rental, exchange, or leasing of real estate or its
  improvements. The correct option matches this definition exactly. The option describing
  negotiation of purchase or sale for a fee is incorrect because the definition does not cover
  purchase or sale transactions.
