stem: A licensee acting as a limited agent for both buyer and seller tells the seller that the buyer
  is willing to pay $15,000 above the asking price, without the buyer's written consent. The
  disclosure is not required by law and would not constitute misrepresentation. Which prohibited
  conduct has the licensee committed under South Dakota law?
options:
  - The disclosure of confidential information about one client to another without written authority
  - The failure to present written offers to the seller in a timely manner
  - The commingling of earnest money with personal funds in a separate account
  - The advertisement of a property without the owner's consent in a newspaper
key: A
explanation: The licensee disclosed confidential information about one client to another without the
  client's written authority, which is prohibited unless required by statute or to avoid
  misrepresentation (S.D. Codified Laws § 36-21A-142). The other options describe different
  violations not supported by the scenario.
citation:
  source: S.D. Codified Laws § 36-21A-142
  url: null
  quoted_text: Without the express written authority of a client, no limited agent may disclose to one
    client any confidential information about the other client unless the disclosure is required by
    statute or rule or failure to disclose the information would constitute misrepresentation.
