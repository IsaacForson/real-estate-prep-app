stem: An applicant completed the required 60 hours of prelicensing education on March 1, 2023. They
  submit their license application on April 1, 2025. Does the education satisfy the two‑year
  requirement?
options:
  - The education is invalid because it was completed more than two years before the application.
  - The education is valid because it was completed within two years of the application.
  - The education is invalid because the requirement is completion within one year.
  - The education is valid because it was completed after March 1, 2023.
key: A
explanation: The education must be completed within the two years before the date of application.
  Since the application is filed on April 1, 2025, the two‑year window begins on April 1, 2023;
  education finished on March 1, 2023 falls outside that window, making it invalid. The distractor
  claiming validity because the education was completed after March 1, 2023 ignores the two‑year
  cutoff date.
