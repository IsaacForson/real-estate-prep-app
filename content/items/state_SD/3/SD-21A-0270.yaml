stem: A limited agent representing both buyer and seller receives a written purchase offer from the
  buyer after the seller has already signed a purchase agreement with another buyer. What must the
  limited agent do?
options:
  - Present the written offer to the buyer only after obtaining the seller's consent
  - Present the written offer to the seller only after the current contract is terminated
  - Present the written offer to both parties simultaneously after closing
  - Present the written offer to the seller in a timely manner
key: D
explanation: Under § 36-21A-140(3), a limited agent must present all written offers to and from the
  client in a timely manner regardless of whether the client is already party to a contract.
  Therefore the offer must be presented to the seller promptly. The suggestion to present the offer
  to the buyer only after obtaining the seller's consent is incorrect because the duty is to present
  the offer to the seller, not to condition presentation on the buyer's consent.
