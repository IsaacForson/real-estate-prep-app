stem: According to South Dakota law, which of the following is included in the statutory definition
  of an adverse material fact?
options:
  - Any zoning changes approved by the local government affecting land use
  - Any future development plans announced by neighboring owners affecting property value
  - Any material defects in the title to the property which are anticipated to survive the closing
  - Any increase in property taxes assessed after closing that impacts affordability
key: C
explanation: The statute defines an adverse material fact as including any material defects in the
  title to the property which are anticipated to survive the closing (§36-21A-125). The distractor
  about zoning changes is incorrect because such changes are not listed unless they are
  environmental hazards required by law to be disclosed.
