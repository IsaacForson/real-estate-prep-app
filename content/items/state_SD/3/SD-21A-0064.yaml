stem: A broker opens a branch office in another town and wants to advertise it under the name 'South
  Dakota Premier Properties' while the parent office is registered as 'Dakota Real Estate Group'.
  According to South Dakota law, what must the broker do regarding the branch office's name?
options:
  - The broker must use any name as long as it includes the word 'Real Estate'
  - The broker must operate under the same name as the parent office
  - The broker must register a separate name with the commission before opening
  - The broker must obtain approval from the commission to use a different name
key: B
explanation: The law requires a branch office to operate under the same name as the parent office,
  so the broker must use the parent office's name. The distractor about obtaining approval is
  incorrect because the statute does not allow a different name even with commission approval.
