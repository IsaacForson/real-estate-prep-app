stem: A licensee wishes to advertise an absolute auction for a property that has an existing
  mortgage lien. Which of the following must be true for the advertisement to be permissible under
  South Dakota law?
options:
  - The licensee must ensure the auction is conducted with a reserve price equal to the outstanding
    mortgage balance.
  - The licensee must obtain written agreement from each lien holder to proceed with the absolute
    auction regardless of bid amount or bidder identity.
  - The licensee must obtain a signed waiver from the mortgage lender allowing the auction to be
    advertised as absolute and pay a processing fee to the commission.
  - The licensee must include the property's full legal description in the auction advertisement.
key: B
explanation: South Dakota rule prohibits advertising an absolute auction unless each lien holder
  agrees in writing to the auction without regard to bid amount or bidder identity. This requirement
  ensures the lien holder will not assert a claim based on the auction outcome. The option about
  setting a reserve price misstates the rule, as absolute auctions have no reserve, and the other
  options describe actions not required by the statute for absolute auction advertising.
