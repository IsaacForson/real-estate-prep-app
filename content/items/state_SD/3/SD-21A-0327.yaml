stem: A licensee receives an administrative fine of $300 on April 1, 2025. Under SDCL 36-1C-5, what
  is the last day to file a notice of appeal assuming no holidays?
options:
  - April 14, 2025
  - April 21, 2025
  - April 28, 2025
  - May 5, 2025
key: B
explanation: SDCL 36-1C-5 requires that a notice of appeal be filed within twenty calendar days
  after the fine is served. Starting from April 1, 2025 and counting twenty calendar days forward
  gives April 21, 2025 as the final day to submit the notice of appeal.
