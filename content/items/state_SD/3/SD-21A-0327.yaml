    Entry and Detainer), 43-4 (Transfer of Property, incl. §§ 43-4-37 to 43-4-57 disclosure) (SD REC
    law book, July 1, 2025) § 36-1C-5"
  url: null
  quoted_text: Any administrative fine issued under this section may be appealed by requesting a
    contested case under chapter 1-26. Notice of appeal must be submitted to the administrator
    within twenty calendar days of service of the fine.
