stem: Under South Dakota law, what is the consequence if a responsible broker receives compensation
  before a transaction is consummated or terminated?
options:
  - The broker must return the money only if the client demands it
  - The broker may retain the money if the transaction is later terminated
  - The broker may keep the money as an advance on future earnings
  - The broker is not entitled to retain the money as compensation
key: D
explanation: Per §36-21A-84, a responsible broker is not entitled to any part of the compensation
  until the transaction has been consummated or terminated; therefore receiving money earlier does
  not confer entitlement to retain it as compensation. The option stating that the broker may keep
  the money as an advance on future earnings is incorrect because the statute does not condition
  repayment on a client demand; the broker simply lacks entitlement to keep the funds.
citation:
  source: S.D. Codified Laws § 36-21A-84
  url: null
  quoted_text: No responsible broker is entitled to any part of the money paid to the responsible
    broker in any transaction as part of the responsible broker's compensation until the transaction
    has been consummated or terminated.
