stem: Under South Dakota law, how is a brokerage defined?
options:
  - The business or occupation of a real estate broker, including affiliated licensees with
    management duties
  - The act of representing clients in real estate transactions under a broker's supervision
  - The process of negotiating contracts and facilitating closings for buyers and sellers
  - The responsibility of maintaining records and handling funds for real estate transactions
key: A
explanation: The statute defines a brokerage as the business or occupation of a real estate broker
  and includes licensees associated with the broker who have been assigned management duties. The
  other options describe activities or responsibilities that are not part of this statutory
  definition.
