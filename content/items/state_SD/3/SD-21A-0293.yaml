stem: Under South Dakota law, when a licensee is appointed as an appointed agent of a client to the
  exclusion of other licensees, what is the rule regarding knowledge imputation?
options:
  - The client, brokerage, and appointed licensee are deemed to share all knowledge possessed by any
    of them
  - The appointed licensee is imputed with the knowledge of the client but not the brokerage
  - Each party possesses only actual knowledge and there is no imputation of knowledge by operation
    of law
  - The brokerage is imputed with the knowledge of the appointed licensee but not vice versa
key: C
explanation: The appointed agent rule states that each party possesses only actual knowledge and
  there is no imputation of knowledge by operation of law among the client, brokerage, and appointed
  licensee. The distractor that claims shared knowledge is incorrect because the rule expressly
  rejects any imputation.
citation:
  source: S.D. Codified Laws § 36-21A-141.1
  url: null
  quoted_text: When an agent is appointed pursuant to this section, each client, the real estate
    brokerage, and any appointed licensee is considered to possess only actual knowledge and
    information. There is no imputation of knowledge or information by operation of law among or
    between the client, the real estate brokerage, and the appointed agent.
