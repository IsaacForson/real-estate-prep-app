stem: A seller is unable to consummate a sale through no fault of the purchaser, even though the
  broker has already earned a commission on the transaction. What must the broker do with the
  purchaser's deposit?
options:
  - Keep the deposit to cover the earned commission
  - Split the deposit evenly with the seller
  - Hold the deposit pending a new buyer
  - Return the deposit to the purchaser at once
key: D
explanation: SDCL 36-21A-77 provides that when the seller cannot consummate the transaction through
  no fault of the purchaser, the broker has no right to any portion of the deposit, even though the
  commission is earned, and the deposit must be returned to the purchaser at once.
