stem: A broker representing a buyer prepares a written agency agreement. Which of the following must
  be included in the agreement under South Dakota law?
options:
  - A description of the property type and area sought by the client
  - A legal description of the property being sold in the transaction
  - A commission to be paid to the seller's agent at closing per agreement
  - A property's current market value as determined by appraisal
key: A
explanation: For buyer representation, the agency agreement must contain a description of the type
  and geographical area of property sought by the client (§36-21A-130). The distractor about a legal
  description is incorrect because that requirement applies only to agreements representing sellers
  or lessors.
citation:
  source: S.D. Codified Laws § 36-21A (Real Estate Licensing) — South Dakota Codified Laws Chapter
    36-21A — Real Estate Licensing (SD Real Estate Commission License Laws & Administrative Rules
    book, as of July 1, 2025) — § 36-21A-130
  url: null
  quoted_text: Any agency agreement in which a broker represents a buyer or tenant shall be in writing
    and shall contain a description of the type and geographical area of property sought by the
    client, the type of agency relationship established, the compensation to be paid, the date of
    authorization, the date of expiration, and the signatures of all parties.
