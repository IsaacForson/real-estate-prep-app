stem: Which of the following is a statutory ground for denial of a real estate license application
  under South Dakota law?
options:
  - The applicant has written insufficient funds checks within the calendar year before application
  - The applicant has completed a college degree program in real estate principles
  - The applicant has maintained continuous residency in a neighboring state for five years
  - The applicant has held a valid driver's license for at least two consecutive years
key: A
explanation: Under S.D. Codified Laws § 36-21A-33(1), an application may be denied if the applicant
  has written insufficient funds checks within the calendar year before application or for the
  application fee. The other options describe qualifications or circumstances that are not listed as
  grounds for denial in this statute.
