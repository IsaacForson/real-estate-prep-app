stem: Which licensee is required to file an annual certificate of coverage with the South Dakota
  Real Estate Commission under § 36-21A-122?
options:
  - A licensee who participates in the commission's group errors and omissions insurance program.
  - Only licensees who have renewed their license within the past year in South Dakota.
  - A licensee who elects not to participate in the commission's group errors and omissions
    insurance program.
  - Any licensee who holds an active broker license in South Dakota.
key: C
explanation: The law mandates an annual filing of a certificate of coverage for each licensee who
  elects not to participate in the group insurance program. Licensees who participate in the group
  program are not subject to this filing requirement.
