stem: An attorney licensed in South Dakota who also holds an active real estate salesperson license
  is renewing her license. What continuing education requirement applies to her under South Dakota
  law?
options:
  - She is exempt from the continuing education requirement.
  - She must complete six hours of continuing education.
  - She must complete twenty-four hours of continuing education.
  - She must complete twelve hours of continuing education.
key: A
explanation: S.D. Codified Laws § 36-21A-62 explicitly exempts attorneys licensed in South Dakota
  from the continuing education requirement, so the attorney has no CE obligation upon renewal. The
  twenty‑four‑hour option applies to responsible brokers, broker associates, salespersons,
  auctioneers, and property managers, not to attorneys.
