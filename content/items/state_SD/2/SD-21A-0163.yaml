stem: An applicant for a South Dakota real estate license wrote one insufficient funds check for
  rent eight months ago and has no insufficient funds checks related to the license application.
  What is the correct consequence?
options:
  - The application may be denied because of the insufficient funds check written within the
    calendar year before application
  - The application may be approved because the insufficient funds check was not for the application
    fee
  - The application may be approved if the applicant has since maintained a positive account balance
  - The application may be approved if the applicant has written a single insufficient funds check
    within the calendar year before application
key: A
explanation: Under S.D. Codified Laws § 36-21A-33(1), an application may be denied if the applicant
  has written any insufficient funds checks within the calendar year before applying, regardless of
  the purpose of the check. The option stating that the application may be denied because of the
  insufficient funds check written within the calendar year before application correctly reflects
  this rule. The option claiming approval because the check was not for the application fee is
  incorrect; the purpose of the check does not matter. The option suggesting approval if the
  applicant has since maintained a positive account balance is incorrect; a positive balance does
  not negate the statutory ground for denial. The option stating approval if the applicant has
  written a single insufficient funds check within the calendar year before application is
  incorrect; even a single such check supports denial, not approval.
