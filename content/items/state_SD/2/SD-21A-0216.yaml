stem: A person who is not licensed under South Dakota real estate law agrees to sell a neighbor's
  vacant lot for a fee and later sues the neighbor for the agreed commission. Under §36-21A-88, what
  is the likely outcome?
options:
  - The court will award half the commission and consider the matter settled.
  - The court will award the commission if the person acted in good faith.
  - The court will award the commission based on a written agreement.
  - The court will dismiss the suit and deny any recovery of compensation.
key: D
explanation: Under S.D. Codified Laws § 36-21A-88, a person who is not licensed cannot recover
  compensation for performing a licensed act; therefore the suit will be dismissed and no
  compensation awarded. The claim that the court will award the commission based on a written
  agreement is incorrect because a written agreement does not override the prohibition.
citation:
  source: S.D. Codified Laws § 36-21A (Real Estate Licensing) — South Dakota Codified Laws Chapter
    36-21A — Real Estate Licensing (SD Real Estate Commission License Laws & Administrative Rules
    book, as of July 1, 2025) — § 36-21A-88
  url: null
  quoted_text: No action or suit may be instituted, nor recovery be had, in any court of this state by
    a person for compensation for an act done or service rendered, the doing or rendering of which
    is prohibited under the provisions of this chapter, to other than persons licensed under this
    chapter, unless such person was licensed under this chapter at the time of offering to perform
    the act or service or procuring a promise to contract for the payment of compensation for the
    contemplated act or service.
