stem: A person who is not exempt under South Dakota's real estate licensing chapter attempts to
  negotiate a purchase of real property for compensation but does not hold an active license. Which
  statement is correct?
options:
  - The person may not perform the act without an active license issued by the commission
  - The person may perform the act if they are a bona fide owner managing their own property
  - The person may perform the act if they have a written agreement with the buyer
  - The person may collect compensation for the act after it is performed
key: A
explanation: Under S.D. Codified Laws § 36-21A-28, a person who is not exempt must have an active
  license to perform any act enumerated in the chapter; performing without one is prohibited. The
  statement that a bona fide owner managing their own property may perform the act is incorrect
  because the scenario specifies the person is not exempt, so that exemption does not apply.
