stem: According to S.D. Codified Laws § 36-21A-28, what is required before a person may collect
  compensation for performing an act enumerated in the real estate licensing chapter?
options:
  - The broker price opinion prepared for the transaction
  - The certificate of errors and omissions coverage
  - The active license issued by the commission
  - The agency agreement with the client
key: C
explanation: The statute states that collecting compensation requires prior compliance with the
  chapter, which includes holding an active license. An agency agreement creates a fiduciary
  relationship but does not override the licensing requirement for compensation.
citation:
  source: S.D. Codified Laws § 36-21A (Real Estate Licensing) — South Dakota Codified Laws Chapter
    36-21A — Real Estate Licensing (SD Real Estate Commission License Laws & Administrative Rules
    book, as of July 1, 2025) — § 36-21A-28
  url: null
  quoted_text: No person, unless exempted under this chapter, may offer, attempt or agree to perform,
    or perform any act enumerated within this chapter without an active license issued by the
    commission. No person may collect compensation as a licensee under this chapter without having
    first complied with the provisions of this chapter.
