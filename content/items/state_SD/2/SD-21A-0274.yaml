stem: A licensee has a written buyer agency agreement with a purchaser and also lists the seller's
  property for sale, but does not have a written listing agreement with the seller. Under South
  Dakota law, is this licensee a 'single agent'?
options:
  - The licensee is a single agent because they have a written buyer agency agreement
  - The licensee is not a single agent because they lack a written listing agreement with the seller
  - The licensee is a single agent because they only represent the buyer's interests
  - The licensee is not a single agent because they are acting for both the buyer and the seller
key: D
explanation: The definition of “single agent” limits the licensee to representing only one party to
  a transaction; acting for both buyer and seller disqualifies the licensee from being a single
  agent. The option stating the licensee is not a single agent due to missing a listing agreement
  misstates the rule, as the lack of a specific agreement does not determine single‑agent status.
