stem: A county assessor, while performing official duties, prepares a comparative market analysis
  for a parcel of land to determine its taxable value. May the assessor perform this act without a
  real estate license?
options:
  - The assessor may act without a license because public officers are exempt while performing
    official duties
  - The assessor may act without a license only if the analysis is for residential property
  - The assessor may not act without a license because preparing a CMA requires a license
  - The assessor may act without a license if they also hold a real estate license in another state
key: A
explanation: Any public officer while performing the officer's duties is exempt from licensure under
  S.D. Codified Laws § 36-21A-29(2). Preparing a comparative market analysis as part of official
  duties falls under this exemption. The statement that the assessor may not act without a license
  because preparing a CMA requires a license is incorrect, as the exemption applies.
