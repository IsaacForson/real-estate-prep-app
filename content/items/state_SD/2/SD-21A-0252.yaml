stem: A licensee receives notice of the required terms and conditions of errors and omissions
  coverage on July 20. The biennial license renewal date is August 15. Is the licensee in compliance
  with the notice requirement of § 36-21A-122?
options:
  - Yes, because the notice was given more than thirty days before the biennial renewal date.
  - No, because the notice was given fewer than thirty days before the biennial renewal date.
  - Yes, because the notice was given within the required thirty‑day period before renewal.
  - No, because the notice was given after the biennial renewal date.
key: B
explanation: The rule requires each licensee to be notified of the required terms and conditions of
  coverage at least thirty days before the biennial license renewal date. From July 20 to August 15
  is twenty‑six days, which is fewer than thirty, so the notice is insufficient. The distractor
  claiming the notice was within the required period is incorrect because the period actually spans
  less than thirty days.
