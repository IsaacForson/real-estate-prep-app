stem: An applicant for a responsible broker's license certifies refusal of association by three
  licensed responsible brokers within the past sixty days. Under what condition will the commission
  waive the two-year experience requirement?
options:
  - If the applicant agrees to relocate to associate with a broker
  - If the commission determines the refusals were made in good faith
  - If the applicant has completed twenty-four additional class hours
  - If the applicant has no felony convictions
key: B
explanation: SDCL 36-21A-32 states that the two-year experience requirement may be waived if the
  applicant certifies refusal by at least three licensed responsible brokers within sixty days,
  provided the commission determines those attempts were made in good faith. If the commission finds
  the refusals were not in good faith, the waiver is denied.
