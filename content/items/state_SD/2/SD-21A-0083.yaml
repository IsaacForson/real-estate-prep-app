stem: How many class hours of commission-approved education must a broker associate complete for
  initial licensure if the license is granted after June 30, 2009?
options:
  - 90 class hours
  - 60 class hours
  - 116 class hours
  - 30 class hours
key: B
explanation: Under SDCL § 36-21A-30.2, a broker associate receiving initial licensure after June 30,
  2009 must complete sixty class hours of education, with thirty hours in each of two active
  licensing periods. Therefore sixty class hours is correct. Thirty class hours only covers the
  first period and omits the second required segment.
