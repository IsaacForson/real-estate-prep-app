stem: Under South Dakota law, what is the licensing status of a person who owns and operates a
  cemetery and sells lots solely for use as burial plots?
options:
  - A person required to hold a license
  - A person exempt from licensing
  - A person required to obtain a broker license
  - A person required to obtain a salesperson license
key: B
explanation: Section 36-21A-29(3) exempts any person owning and operating a cemetery and selling
  lots solely for use as burial plots from licensure. Therefore, the person is exempt from
  licensing. The statement that a person is required to hold a real estate license is incorrect, as
  it contradicts the exemption.
