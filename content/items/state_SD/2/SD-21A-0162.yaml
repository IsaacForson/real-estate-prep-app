stem: An applicant submitted a South Dakota real estate license application yesterday. In the past
  ten months, the applicant wrote two insufficient funds checks for personal expenses, and yesterday
  wrote an insufficient funds check to pay the application fee. Based solely on §36-21A-33(1), what
  is the correct consequence?
options:
  - The application may be approved if the applicant provides proof of funds to cover the checks
  - The application may be denied because of the insufficient funds check for the application fee
  - The application may be approved because the insufficient funds checks were written more than six
    months ago
  - The application may be approved even if the applicant has a felony conviction
key: B
explanation: Under S.D. Codified Laws § 36-21A-33(1), an application may be denied if the applicant
  has written an insufficient funds check for the application fee, or has written any insufficient
  funds checks within the calendar year before applying. Because the applicant wrote an insufficient
  funds check to pay the fee yesterday, the application may be denied regardless of the earlier
  checks.
