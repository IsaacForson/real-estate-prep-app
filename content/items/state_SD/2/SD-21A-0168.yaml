stem: Under South Dakota law, what type of agreement must a broker have with a client to create an
  agency relationship?
options:
  - Oral agency agreement
  - Written agency agreement
  - Implied agency agreement
  - Verbal agency agreement
key: B
explanation: The definition of "Agency agreement" specifies it is a written agreement between a
  broker and a client that creates a fiduciary relationship; therefore only a written agreement
  satisfies the requirement. An oral or implied agreement does not meet the statutory definition.
