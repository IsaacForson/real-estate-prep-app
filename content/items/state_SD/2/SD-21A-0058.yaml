stem: What is a 'designated broker' under South Dakota law?
options:
  - A person who holds both a broker and salesperson license simultaneously
  - A salesperson employed by a responsible broker to perform residential rental activities
  - A broker licensee who works independently without supervision from a responsible broker
  - A broker licensee designated by a responsible broker to act for the company in the conduct of
    real estate brokerage
key: D
explanation: Under S.D. Codified Laws § 36-21A-1, a designated broker is a broker licensee
  designated by a responsible broker to act for the company in the conduct of real estate brokerage.
  The option describing a person who holds both a broker and salesperson license simultaneously is
  incorrect because the definition does not require dual licensure. The option describing a
  salesperson employed by a responsible broker to perform residential rental activities is incorrect
  because it refers to a salesperson, not a broker licensee designated to act for the company. The
  option describing a broker licensee who works independently without supervision is incorrect
  because a designated broker acts under the designation of a responsible broker, not independently.
