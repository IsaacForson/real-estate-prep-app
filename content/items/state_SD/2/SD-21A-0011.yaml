stem: Under South Dakota's licensing chapter, which activity makes a person a real estate broker?
options:
  - Managing the buyer's personal finances unrelated to any property
  - Preparing legal contracts for parties in a land title lawsuit
  - Negotiating a sale of an interest in real property for pay
  - Inspecting a home for structural defects before closing
key: C
explanation: SDCL 36-21A-6 defines a broker as a person who, for another and for compensation,
  directly or indirectly lists, sells, exchanges, or negotiates a sale, option, exchange, purchase,
  lease, or rental of an interest in real property.
citation:
