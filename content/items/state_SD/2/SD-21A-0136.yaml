stem: A broker associate who received initial licensure in South Dakota on July 1, 2010 must
  complete how many class hours of education before the second active renewal deadline, and how must
  those hours be distributed?
options:
  - Sixty class hours, with thirty completed during the initial active licensing period and thirty
    during the second active licensing period.
  - Forty class hours, with twenty completed during the initial active licensing period and twenty
    during the second active licensing period.
  - Thirty class hours, all completed during the initial active licensing period.
  - Ninety class hours, with forty-five completed during each active licensing period.
key: A
explanation: The law requires broker associates initially licensed after June 30, 2009 to complete
  sixty class hours, with thirty hours in each of the two active licensing periods before the second
  renewal deadline. The applicant’s 2010 licensure triggers this rule, so the correct distribution
  is sixty hours split evenly. The other options alter the total hours or the split.
