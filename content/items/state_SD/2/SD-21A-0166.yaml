stem: A licensee receives notice of the required terms and conditions of errors and omissions
  coverage 18 days before the biennial license renewal date. By how many days does the notice fall
  short of the required minimum?
options:
  - 12 days
  - 8 days
  - 22 days
  - 2 days
key: A
explanation: The statute requires at least thirty days notice before renewal. Receiving notice only
  eighteen days prior leaves a shortfall of thirty minus eighteen, which equals twelve days. The
  distractor "8 days" would arise from subtracting eighteen from twenty‑six, an incorrect required
  period.
