    36-21A — Real Estate Licensing (SD Real Estate Commission License Laws & Administrative Rules
    book, as of July 1, 2025) — § 36-21A-31
  url: null
  quoted_text: >-
    If the applicant for a responsible broker's license meets 

    all requirements except the requirement for twenty -four additional class hours, the commission
    or 

    executive director may approve the applicant for a responsible broker's license , conditioned on
    the 

    applicant furnishing the commission with evidence of completion of the twenty-four additional
    class hours 

    within six months of the date of the approval
