stem: An applicant for a responsible broker's license has two years of experience as a salesperson
  or broker associate but has not completed the required twenty‑four additional class hours. What
  may the commission do?
options:
  - Approve the license with conditions
  - Approve the license without conditions
  - Require the applicant to retake the exam
  - Deny the application for insufficiency
key: A
explanation: SDCL § 36-21A-31 allows the commission to approve a responsible broker applicant who
  meets all requirements except the twenty‑four additional class hours, provided the applicant
  completes those hours within six months. Thus conditional approval is appropriate. Immediate
  approval is incorrect because the outstanding education requirement must be satisfied.
citation:
