stem: A nonresident broker who holds an active license in another state wants to renew their South
  Dakota license on active status. What must they submit with the renewal application?
options:
  - The applicant must submit evidence of completing forty hours of property-management continuing
    education.
  - The applicant must submit a surety bond in the amount of fifteen thousand dollars.
  - The applicant must submit a home-state license certificate completed within 30 days before
    renewal.
  - The applicant must submit proof of passing the South Dakota real estate salesperson examination.
key: C
explanation: For renewal on active status, a nonresident licensee must submit a certificate of
  licensure from their home state that was completed within 30 days before filing the renewal
  application. Proof of passing the South Dakota exam is required for initial licensure, not for
  renewal.
