stem: A person who is not licensed prepares a broker price opinion for a seller and receives a fee
  for the service. Under South Dakota law, may this person perform this activity without a real
  estate license?
options:
  - Under South Dakota law, preparing a broker price opinion for compensation is not permitted
    unless the person is a licensed broker or salesperson.
  - Under South Dakota law, preparing a broker price opinion for compensation is permissible without
    a license because it is considered a clerical task.
  - Under South Dakota law, preparing a broker price opinion for compensation is allowed when a
    licensed broker reviews and signs the opinion.
  - Under South Dakota law, preparing a broker price opinion for compensation is allowed if the
    person discloses that the opinion is not an appraisal.
key: A
explanation: Section §36-21A-12.2 defines a broker price opinion as an estimate prepared by a
  licensed broker or salesperson. Therefore, an unlicensed person cannot lawfully prepare a broker
  price opinion for compensation. The option stating that preparing a broker price opinion for
  compensation is allowed if the person discloses that the opinion is not an appraisal is incorrect
  because disclosure does not change the licensing requirement for preparing a broker price opinion.
