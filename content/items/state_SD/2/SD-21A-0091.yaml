stem: What must the certificate of coverage demonstrate for a licensee who elects **NOT** to
  participate in the Real Estate Commission's group errors and omissions insurance program?
options:
  - Proof of payment of the group insurance premium for the licensee.
  - Evidence of compliance with the required terms and conditions of coverage.
  - Documentation of completed continuing education hours for the licensee.
  - Confirmation of active broker sponsorship for the licensee.
key: B
explanation: The statute specifies that the certificate of coverage must show compliance with the
  required terms and conditions of coverage. Proof of premium payment or continuing education is not
  required by this provision.
