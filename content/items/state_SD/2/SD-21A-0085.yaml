stem: A broker who obtained a South Dakota broker license before July 1, 1996 now applies for a
  responsible broker's license. What is true regarding the experience and education requirements?
options:
  - Exempt from both requirements
  - Approve the license with conditions
  - Approve the license immediately
  - Deny the application outright
key: A
explanation: SDCL § 36-21A-31 states that any broker licensed prior to July 1, 1996 is exempt from
  the experience and education requirements for a responsible broker's license. Therefore such a
  broker is exempt from both requirements. Immediate approval without acknowledging the exemption
  overlooks the statutory exemption.
