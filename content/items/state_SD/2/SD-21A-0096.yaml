stem: Under South Dakota law, what is a transaction broker?
options:
  - A broker who exclusively lists and sells property for the seller while maintaining a fiduciary
    duty
  - A broker who acts as a dual agent, representing both the seller and the buyer in a fiduciary
    capacity
  - A broker who solely provides appraisal services for real property without engaging in brokerage
    activities
  - A broker who assists one or more parties with a real estate transaction without being an agent
    or advocate for any party
key: D
explanation: "South Dakota Codified Laws § 36-21A-1(23) defines a transaction broker as a licensee
  who assists parties in a real estate transaction without serving as an agent or advocate for any
  specific party. The other options describe different roles: one describes dual agency, one
  describes a traditional seller's agent, and one describes a non-brokerage appraisal role."
citation:
  source: "### S.D. Codified Laws § 36-21A (Real Estate Licensing) — South Dakota Codified Laws
    Chapter 36-21A — Real Estate Licensing (SD Real Estate Commission License Laws & Administrative
    Rules book, as of July 1, 2025) — § 36-21A-1"
  url: null
  quoted_text: '"Transaction broker," a broker who assists one or more parties with a real estate
    transaction without being an agent or advocate for the interests of any party to the
    transaction. The term includes the licensees associated with the broker;'
