stem: Under South Dakota law, which of the following individuals is exempt from real estate
  licensure when selling cemetery lots solely for burial plots?
options:
  - A property manager who leases apartments in a residential building
  - An attorney who refers clients to real estate brokers occasionally
  - A licensed real estate broker who lists cemetery plots for sale
  - A person who owns a cemetery and sells burial plots only
key: D
explanation: Under S.D. Codified Laws § 36-21A-29(3), any person who owns and operates a cemetery
  and sells lots solely for burial plots is exempt from real‑estate licensure. Therefore, the
  individual who owns a cemetery and sells burial plots only qualifies for the exemption. The other
  described activities—leasing apartments, referring clients to brokers, and a broker listing
  cemetery plots—require a license because they are not covered by this exemption.
