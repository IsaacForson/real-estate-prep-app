stem: A licensee acts as a limited agent in an in-company transaction, representing both the seller
  and buyer, but only has a written agreement with the seller. The buyer is unaware of any written
  agreement. Under South Dakota law, is the licensee's limited agent status valid?
options:
  - No because limited agents are not allowed in South Dakota
  - Yes because the licensee verbally disclosed the dual role
  - No because a limited agent must have written agreements with both parties
  - Yes because the seller's written agreement alone is sufficient
key: C
explanation: The definition of "Limited agent" requires a written agency relationship with both the
  seller and the buyer in the same in-company transaction; having only a written agreement with the
  seller does not satisfy this requirement, so the limited agent status is not valid. Verbal
  disclosure does not substitute for the written agreement.
