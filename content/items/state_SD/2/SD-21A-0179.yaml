stem: What is the definition of an auctioneer under South Dakota law?
options:
  - Any person who offers, attempts, or agrees to auction real estate or business opportunities,
    regardless of licensing status
  - Any person who lists real estate for sale in a publication primarily for such purpose
  - Any person licensed under this chapter who offers, attempts, or agrees to auction real estate or
    business opportunities
  - Any person who conducts a public sale of real estate at the highest bidder without compensation
key: C
explanation: Under S.D. Codified Laws § 36-21A-1(4), an auctioneer is any person licensed under this
  chapter who offers, attempts, or agrees to auction real estate or business opportunities. The
  option that omits the licensure requirement is incorrect because a license is necessary. The
  option that defines an auctioneer as any person licensed under this chapter who offers, attempts,
  or agrees to auction real estate or business opportunities is correct. The option that describes
  listing real estate for sale in a publication primarily for such purpose is incorrect because it
  pertains to advertising, not auctioneering. The option that describes conducting a public sale of
  real estate at the highest bidder without compensation is incorrect because it describes an
  auction event, not the person who acts as an auctioneer.
