stem: A person who owns and operates a cemetery sells burial plots solely for burial purposes and
  also sells adjacent land for commercial development. Which of the following activities remains
  exempt from real estate licensure under South Dakota law?
options:
  - The activity of advertising both the cemetery plots and commercial land
  - The activity of negotiating the sale of both property types
  - The activity of selling the cemetery burial plots
  - The activity of selling the adjacent commercial land
key: C
explanation: The exemption in §36-21A-29(3) applies only to the sale of cemetery lots sold solely
  for burial plots; it does not extend to the sale of adjacent commercial land. Therefore, selling
  the cemetery burial plots remains exempt, while selling the commercial land would require a
  license. The correct answer identifies the exempt activity.
