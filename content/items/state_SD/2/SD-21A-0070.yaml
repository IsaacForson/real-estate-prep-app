stem: A person operates a website that charges a fee to list real estate properties for sale and
  collects payments from agents for each listing. May this person perform this activity without a
  real estate license?
options:
  - The person may act without a license only if the listings are for commercial property
  - The person may act without a license if they also hold a broker license in another state
  - The person may not act without a license because collecting a fee for listings requires a license
  - The person may act without a license because publishing listings for a fee is exempt
key: D
explanation: Anyone whose business practice is to collect a fee to publish real estate listings is
  exempt from licensure under §36-21A-29(9). Operating a fee-based listing website falls under this
  exemption. Stating that a license is required for collecting a fee for listings is incorrect.
