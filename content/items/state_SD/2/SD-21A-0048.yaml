stem: An applicant passes the South Dakota real estate examination and receives written notice on
  March 1. By what date must the applicant file the license application and proof of required
  education to avoid cancellation of the examination score?
options:
  - May 1
  - June 30
  - March 31
  - April 30
key: D
explanation: SDCL 36-21A-36.1 requires the applicant to file the application and proof of required
  education within sixty days of the notice date. Sixty days after March 1 is April 30. Failure to
  meet this deadline results in cancellation of the registration and all rights from the passing
  score.
