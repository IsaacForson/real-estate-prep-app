stem: Which of the following is a statutory ground for denial of a real estate license application
  under South Dakota law?
options:
  - The applicant has completed a bachelor’s degree in any field and maintains good moral character
  - The applicant has written insufficient funds checks within the calendar year before application
  - The applicant holds a valid driver’s license from any state and has no traffic violations on
    record
  - The applicant has not enrolled in a real estate prelicense course and lacks sponsorship from a
    broker
key: B
explanation: Under SDCL 36-21A-33(1), an application may be denied if the applicant has written
  insufficient funds checks within the calendar year before application or has written an
  insufficient funds check for the application. The other options are not listed as grounds for
  denial in the statute.
