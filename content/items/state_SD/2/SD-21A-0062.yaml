stem: A nonresident real estate salesperson who establishes residency in South Dakota wishes to
  upgrade to a broker associate license before the current license expires. How many hours of
  prescribed education must the applicant complete?
options:
  - Twenty class hours of commission-approved prescribed education
  - Forty class hours of commission-approved prescribed education
  - Sixty class hours of commission-approved prescribed education
  - One hundred sixteen class hours of commission-approved prescribed education
key: B
explanation: Under SDCL § 36-21A-34.1, a nonresident salesperson who becomes a South Dakota resident
  must complete forty hours of prescribed education in a commission‑approved course to upgrade to a
  broker associate license. The one‑hundred‑sixteen‑hour option applies to initial broker associate
  licensure, not to an upgrade.
