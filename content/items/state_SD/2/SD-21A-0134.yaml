stem: Under South Dakota law, what is the licensing status of an attorney admitted to practice who
  does **NOT** hold himself out as being in the real estate business or solicit real estate
  business?
options:
  - A person needing a real estate license
  - A person needing a broker license
  - A person exempt from licensing
  - A person needing a salesperson license
key: C
explanation: Under S.D. Codified Laws § 36-21A-29(7), an attorney admitted to practice is exempt
  from real estate licensure unless the attorney holds himself or herself out to be in the real
  estate business or solicits real estate business. Because the attorney does not hold out or
  solicit, the exemption applies. The other options incorrectly state that a license is required.
