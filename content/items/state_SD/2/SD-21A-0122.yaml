stem: How many class hours of commission-approved education must a broker associate complete during
  the initial active licensing period to satisfy the education requirement for initial licensure as
  a broker associate under South Dakota law?
options:
  - Ten class hours.
  - Thirty class hours.
  - Forty-five class hours.
  - Sixty class hours.
key: B
explanation: The statute requires broker associates to complete sixty class hours total, with thirty
  class hours completed during the initial active licensing period and thirty during the second
  active licensing period. Therefore, thirty class hours are required in the initial period. The
  distractor "Sixty class hours" incorrectly states the total requirement rather than the initial
  period amount.
