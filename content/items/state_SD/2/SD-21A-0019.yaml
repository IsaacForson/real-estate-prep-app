stem: A licensee holds an active license in another state and has already passed that state's real
  estate licensing examination. What must the licensee still do to obtain a similar license in South
  Dakota through examination reciprocity?
options:
  - Repeat the full prelicense education course again
  - Submit three letters of recommendation from brokers
  - Pass the state portion of the licensing exam
  - Serve a one-year probationary period under supervision
key: C
explanation: SDCL 36-21A-43 allows a licensee who has passed another state's licensing examination
  to obtain a similar level of South Dakota licensure if the licensee successfully passes the state
  portion of the examination in South Dakota.
