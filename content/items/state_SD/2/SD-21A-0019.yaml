  source: S.D. Codified Laws § 36-21A-43
  url: null
  quoted_text: >-
    An applicant who holds an active license 

    in another state and who has successfully passed the real estate licensing examination in that
    same state 

    may obtain a similar level of licensure in South Dakota if the applicant successfully passes the
