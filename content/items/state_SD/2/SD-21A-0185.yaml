stem: A lawful permanent resident of the United States who lives in South Dakota wishes to obtain a
  broker license. Is the applicant eligible for the broker license under South Dakota law?
options:
  - Yes, because South Dakota residency satisfies the citizenship-or-residency requirement for a
    broker license.
  - No, because only United States citizens may obtain a broker license.
  - Yes, but only if the applicant also obtains United States citizenship within six months.
  - No, because lawful permanent residents are not considered residents for licensing purposes.
key: A
explanation: The statute states that a broker license applicant must be either a U.S. citizen or a
  resident of South Dakota. Lawful permanent residency in South Dakota meets the residency
  requirement, making the applicant eligible. The other options incorrectly impose citizenship or
  additional conditions not found in the law.
