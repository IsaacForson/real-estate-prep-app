stem: Which person is exempt from South Dakota's real estate licensing requirement when performing
  the described act?
options:
  - A person charging a fee to publish real estate listings
  - A bona fide owner managing the owner's own rental property
  - A salesperson negotiating a lease for an unrelated landlord
  - A broker preparing a comparative market analysis for a fee
key: B
explanation: SDCL 36-21A-29 exempts a bona fide owner or lessor who performs acts described in the
  broker or salesperson definitions with reference to property the owner owns or leases, when done
  in the regular course of managing that property.
citation:
  source: S.D. Codified Laws § 36-21A-29
  url: null
  quoted_text: |-
