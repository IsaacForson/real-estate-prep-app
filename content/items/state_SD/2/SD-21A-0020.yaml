stem: A nonresident, regularly engaged in real estate as a vocation, is licensed by a state that
  extends the same reciprocal privileges to South Dakota licensees. How does South Dakota treat that
  nonresident's out-of-state license under its reciprocity provision?
options:
  - It lets the nonresident skip continuing education here
  - It requires the nonresident to open a branch office here
  - It waives the South Dakota licensing exam entirely
  - It recognizes the other state's license as valid here
key: D
explanation: SDCL 36-21A-54 states that the commission shall recognize the license issued by another
  state as qualification for a license in South Dakota when that state grants the same reciprocal
  privileges.
