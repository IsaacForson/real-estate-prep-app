stem: A buyer's licensee begins negotiating with a listing licensee over a property without first
  informing the listing licensee that a buyer agency relationship exists. Under Iowa Code section
  543B.57(5), what obligation has the buyer's licensee failed to meet?
options:
  - Filing the buyer agreement with the commission
  - Collecting a signed compensation waiver form
  - Informing the listing licensee first
  - Obtaining the seller's prior written consent
key: C
explanation: The statute requires a licensee representing a buyer to inform the listing licensee,
  verbally or in writing, of the agency relationship before any negotiations are initiated.
citation:
  source: Iowa Code § 543B.57
  url: null
  quoted_text: |-
    A licensee
    representing a buyer shall inform the listing licensee, if there is a listing licensee, either
    verbally or in writing, of the agency relationship before any negotiations are initiated.
