stem: A licensee only answers general questions about price range and location at an open house
  without eliciting any confidential financial information. Under Iowa Code section 543B.57(2)(c),
  does this conduct qualify as specific assistance requiring disclosure?
options:
  - Yes, any open house contact triggers disclosure
  - No, that conduct is not specific assistance
  - Yes, but not until the visitor makes an offer
  - No, unless the visitor is already a client
key: B
explanation: The statute defines specific assistance to exclude an open house showing and
  preliminary conversations about price range, location, and property styles.
citation:
  source: Iowa Code § 543B.57
  url: null
  quoted_text: |-
    “Specific assistance”
    does not mean an open house
    showing, preliminary conversations concerning price range, location, and property styles, or
    responding to general factual questions concerning properties which have been advertised
    for sale or lease.
