stem: Under Iowa Code § 543B.55, what must a licensee disclose in writing to each party in a transaction?
options:
  - The licensee must disclose in writing that the licensee’s financial interest in any title
    company used for closing must be disclosed.
  - The licensee must disclose in writing that the broker’s or salesperson’s agency relationship
    with the buyer or seller in the transaction.
  - The licensee must disclose in writing that the commission rate agreed upon with the client in
    the brokerage agreement.
  - The licensee must disclose in writing that the estimated closing costs the buyer will incur that
    are typically paid at closing.
key: B
explanation: "Under Iowa Code § 543B.55, licensees must disclose in writing the broker’s or
  salesperson’s agency relationship with the buyer or seller in the transaction. This requirement is
  satisfied by the option stating that the agency relationship must be disclosed. The other options
  describe disclosures that are not mandated by this section: financial interest in a title company
  (addressed elsewhere), the commission rate, and estimated closing costs."
