stem: If a licensee’s representation changes such that the initial verbal agency disclosure becomes
  incomplete, misleading, or inaccurate, what must the licensee do immediately?
options:
  - The licensee must wait until the next scheduled meeting to update the disclosure.
  - The licensee must make a new verbal disclosure immediately.
  - The licensee must provide a written disclosure only if the client requests it.
  - The licensee must ignore the change if the transaction is already under contract.
key: B
explanation: The rule requires a new verbal disclosure immediately when the initial disclosure
  becomes incomplete, misleading, or inaccurate. Waiting until a later meeting or providing written
  disclosure only upon request does not satisfy the immediate verbal disclosure obligation.
