  url: null
  quoted_text: A licensee may act as a dual agent in either of the separate transactions, or both,
    with the written permission of the parties to the specific transaction and if the broker or
    brokerage has a written company policy that includes disclosed dual agency for in-house
    transactions or same agent transactions.
