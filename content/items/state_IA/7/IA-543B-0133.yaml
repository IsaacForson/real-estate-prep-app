stem: A licensee wishes to act as a dual agent for a transaction where both buyer and seller have
  given written consent, but the brokerage’s written company policy does not mention disclosed dual
  agency. Under Iowa Admin. Code r. 481-2012, what is the licensee’s permissibility to act as dual
  agent?
options:
  - The licensee may act as dual agent after obtaining verbal consent from the parties.
  - The licensee may not act as dual agent because the broker lacks a written company policy that
    includes disclosed dual agency.
  - The licensee may act as dual agent only after the broker amends the policy to include disclosed
    dual agency.
  - The licensee may act as dual agent because the clients have given written consent.
key: B
explanation: The rule permits dual agency only with written permission of the parties and if the
  broker’s written company policy includes disclosed dual agency. Without such a policy, the
  licensee cannot act as dual agent even with client consent.
citation:
  source: Iowa Admin. Code r. 481-2012 — Iowa Administrative Code 481—Chapter 2012 — Disclosure Of
