stem: A seller who is a client of the broker refuses to sign consent to the appointed agent that the
  broker has appointed to represent the buyer in the same transaction. Under rule 481-2012.6(4),
  what is the broker prohibited from doing?
options:
  - The broker and its affiliated licensees may act as an appointed agent for the buyer if the buyer
    consents.
  - The broker and its affiliated licensees must terminate the brokerage agreement with the seller.
  - The broker and its affiliated licensees cannot act as an appointed agent for the buyer.
  - The broker and its affiliated licensees cannot act as an appointed agent for the seller.
key: C
explanation: The rule prohibits the broker from acting as an appointed agent for the other party
  when a client refuses consent to that appointed agent. The other options incorrectly allow action
  for the seller, allow action with buyer consent, or require termination.
