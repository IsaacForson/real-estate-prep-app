stem: Under Iowa Code section 543B.57(1), what must a licensee do before representing a party in a
  transaction?
options:
  - The licensee must disclose any personal interest in the property before representing them.
  - The licensee must obtain written consent from both parties before representing them.
  - The licensee must make an agency disclosure to the party or parties represented before
    representing them.
  - The licensee must provide a written brokerage agreement before representing them.
key: C
explanation: The rule states a licensee shall not represent any party unless an agency disclosure is
  made to that party. Therefore, the licensee must make the disclosure before representation begins.
  The distractor about obtaining written consent from both parties is incorrect because written
  consent for multiple representation is governed by section 543B.58, not the disclosure requirement
  in 543B.57(1).
citation:
  source: Iowa Code ch. 543B — Iowa Code Chapter 543B — Real Estate Brokers and Salespersons — § 543B.57(1)
  url: null
  quoted_text: A licensee shall not represent any party or parties to a transaction or otherwise as a
    licensee unless that licensee makes an agency disclosure to the party or parties represented by
    the licensee.
