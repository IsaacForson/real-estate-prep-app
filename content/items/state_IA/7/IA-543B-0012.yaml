stem: A licensee learns a fact about a property that the buyer could discover only through a
  reasonably diligent inspection that a reasonably prudent person would perform. Under Iowa Code
  section 543B.56(1)(b), how does this affect the licensee's disclosure duty?
options:
  - The licensee needs to disclose it within five days
  - The licensee needs to disclose it before any showing
  - The licensee owes no duty to disclose that fact
  - The licensee needs to disclose it if directly asked
key: C
explanation: The duty to disclose material adverse facts excludes facts the party could discover
  through a reasonably diligent inspection that would be discovered by a reasonably prudent person
  under similar circumstances.
