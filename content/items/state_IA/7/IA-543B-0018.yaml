stem: Under Iowa Code section 543B.57(2)(b), when must the written agency disclosure to a client be
  acknowledged by separate signatures?
options:
  - Before any offer is made or accepted
  - Within thirty days after the closing date
  - At the time the listing agreement expires
  - When the client later requests a copy
key: A
explanation: The statute requires the written disclosure to be acknowledged by separate signatures
  of the represented party prior to any offer being made or accepted by any party to a transaction.
citation:
  source: Iowa Code § 543B.57
  url: null
  quoted_text: |-
    The written disclosure shall be acknowledged by separate signatures of the party
    or parties represented by the licensee prior to any offer being made or accepted by any party
    to a transaction.
