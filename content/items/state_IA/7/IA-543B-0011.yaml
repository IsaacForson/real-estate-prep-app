stem: Under Iowa Code section 543B.56(1), which duty does a licensee owe to every party in a
  transaction, **NOT** just to the licensee's own client?
options:
  - Disclose financial interests in referred vendors
  - Treat each party with honesty and good faith
  - Fulfill every obligation in the brokerage agreement
  - Place the client's interests ahead of others
key: B
explanation: The duties-to-all-parties provision requires a licensee to treat all parties to a
  transaction with honesty and good faith, regardless of which party the licensee represents.
