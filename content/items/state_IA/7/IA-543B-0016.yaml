stem: A seller refuses to consent to a proposed disclosed dual agency arrangement offered by the
  brokerage. Under rule 481-2012.5(1), what must the licensee do?
options:
  - Transfer the listing to another firm
  - Proceed after a thirty-day waiting period
  - Not act as dual agent for that seller
  - Act as dual agent with broker approval alone
key: C
explanation: The rule provides that if a seller, landlord, buyer, or tenant rejects dual agency or
  refuses to sign consent, the licensee cannot act as a dual agent for that person.
citation:
  source: Iowa Admin. Code rule 481-2012
  url: null
  quoted_text: |-
    If any seller, landlord, buyer, or tenant rejects dual agency, or
    refuses to sign consent to dual agency, the licensee cannot act as a dual agent.
