stem: A buyer and seller have agreed in writing to potential dual agency for a property. Under rule
  481-2012.5(4)(c), when must the dual agency consent disclosure be presented to the buyer?
options:
  - The dual agency consent disclosure must be presented prior to the buyer’s signing an offer to
    purchase or a rental or lease agreement.
  - The dual agency consent disclosure must be presented after the buyer’s signing an offer to
    purchase or a rental or lease agreement.
  - The dual agency consent disclosure must be presented prior to the seller’s signing an offer to
    purchase or a rental or lease agreement.
  - The dual agency consent disclosure must be presented at the closing of the transaction.
key: A
explanation: The rule states that when parties have agreed in writing to potential dual agency, the
  consent disclosure is presented to the buyer prior to the buyer’s signing an offer to purchase or
  a rental or lease agreement. The other options misstate the timing.
