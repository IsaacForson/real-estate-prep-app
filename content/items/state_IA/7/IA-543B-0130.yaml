stem: A seller client asks the listing licensee to withhold knowledge of a leaking roof (material
  adverse fact) from potential buyers to facilitate a quick sale. Under Iowa Code section
  543B.56(2)(c), what must the licensee do?
options:
  - The licensee must refuse the request because it conflicts with the duty to disclose material
    adverse facts.
  - The licensee must fulfill the request because it is within the scope of the brokerage agreement.
  - The licensee may fulfill the request if the seller provides written consent to withhold the
    information.
  - The licensee may fulfill the request as long as they also disclose the fact to the buyer after
    the offer is accepted.
key: A
explanation: Under Iowa Code § 543B.56(2)(c), a licensee must fulfill any obligation within the
  scope of the brokerage agreement unless doing so conflicts with other duties imposed by the
  chapter or other law. Withholding a known material adverse fact violates the duty to disclose such
  facts under § 543B.56(1)(b). Therefore the licensee must refuse the seller’s request. The
  statement that the licensee must fulfill the request because it is within the scope of the
  brokerage agreement is incorrect because the rule expressly excludes obligations that conflict
  with other duties, even if they fall within the scope of the agreement.
