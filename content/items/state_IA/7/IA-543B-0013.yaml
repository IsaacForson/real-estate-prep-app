stem: A licensee representing a seller wants to accept a referral fee from a home inspector the
  licensee recommended to the buyer. Under Iowa Code section 543B.56(3)(a), what must happen before
  the licensee accepts that fee?
options:
  - Verbal notice to the seller alone
  - Approval from the inspector's employer
  - Nothing, since inspection fees are exempt
  - Written notice to every party of the fee
key: D
explanation: A licensee may not accept a fee related to a transaction from someone other than the
  licensee's client unless written notice has been provided to all parties that the fee will be
  accepted.
citation:
  source: Iowa Code § 543B.56
  url: null
  quoted_text: |-
    Accept a fee or compensation related to a transaction from a person other than
    the licensee’s client, unless the licensee has provided written notice to all parties to the
    transaction that a fee or compensation will be accepted by the licensee from such person.
