stem: A licensee representing a buyer learns that the property is subject to a pending special
  assessment that is not recorded in public records and could not be discovered through a reasonably
  diligent inspection. Under Iowa Code section 543B.56(2)(b), what must the licensee do?
options:
  - Inform the buyer’s lender about the assessment before closing and recommend the lender review
    its impact.
  - Disclose the assessment to the buyer because it is material information known to the licensee
    and not known by the buyer.
  - Advise the buyer to waive the inspection contingency to proceed with the purchase.
  - Keep the information confidential unless the seller authorizes disclosure.
key: B
explanation: Subsection 2(b) obligates a licensee to disclose to the client all information known by
  the licensee that is material to the transaction and not known by the client or discoverable
  through reasonable inspection. Informing the lender, advising a waiver, or withholding the
  information does not satisfy this duty to the buyer client.
