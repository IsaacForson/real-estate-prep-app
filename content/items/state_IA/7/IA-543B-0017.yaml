stem: A designated broker appoints one affiliated licensee to represent the seller and a different
  affiliated licensee to represent the buyer in the same transaction, and both clients consent in
  writing. Under rule 481-2012.7(3), how is the designated broker classified solely because of
  making this appointment?
options:
  - Automatically a dual agent needing new consent
  - Barred from supervising either licensee
  - Required to attend both negotiations personally
  - Not deemed a dual agent for the appointment
key: D
explanation: The rule states a designated broker cannot be considered a dual agent solely because
  the designated broker makes an appointment of separate licensees under this rule.
citation:
