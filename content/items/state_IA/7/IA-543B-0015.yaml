stem: A licensee is about to provide specific assistance to a client for the first time in a
  transaction. Under rule 481-2012.2(2), when must the verbal agency disclosure be made?
options:
  - Within ten business days after the assistance
  - Before providing that specific assistance
  - If the client requests it in writing first
  - At the closing table with other disclosures
key: B
explanation: The rule requires the verbal disclosure to be made by the licensee prior to providing
  specific assistance to the client or nonrepresented customer.
citation:
  source: Iowa Admin. Code rule 481-2012
  url: null
  quoted_text: >-
    The disclosure obligated by subrule 2012.2(1) is made verbally

    by the licensee prior to the licensee’s providing specific assistance to the client or
    nonrepresented customer.
