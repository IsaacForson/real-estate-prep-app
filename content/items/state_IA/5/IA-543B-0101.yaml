stem: A broker decides to keep the quarterly interest earned on the trust account as additional
  compensation for managing the account. Is this permissible under Iowa Code § 543B.46(1)?
options:
  - The broker's action is permissible because the broker may retain interest as compensation for
    account management
  - The broker's action is not permissible only if a written agreement exists between buyer and
    seller to the contrary
  - The broker's action is not permissible because the broker shall not benefit from interest
    received on funds of others
  - The broker's action is permissible if the interest is less than $100 per quarter
key: C
explanation: Subsection 1 explicitly states that the broker shall not benefit from interest received
  on funds of others in the broker’s possession. Retaining the interest as personal compensation
  violates this prohibition.
