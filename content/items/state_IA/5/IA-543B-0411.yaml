stem: A broker deposits $1,500 of personal funds into the trust account to cover bank service
  charges. According to Iowa Code § 543B.46(4), is this action permissible?
options:
  - The action is permissible because any amount of personal funds may be deposited.
  - The action is permissible if the funds are identified for service charges.
  - The action is impermissible because personal funds may not be deposited in a trust account.
  - The action is impermissible because the amount exceeds the $1,000 limit.
key: D
explanation: Iowa Code § 543B.46(4) permits a broker to deposit up to $1,000 of personal funds for
  service charges. Depositing $1,500 exceeds that limit, so the action is not allowed. Although
  identifying the funds for service charges is relevant, the amount still must not exceed $1,000.
