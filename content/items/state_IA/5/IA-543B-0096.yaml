stem: What is the maximum number of banking days a broker has to deposit earnest money into a trust
  account after the last signature of acceptance on a purchase agreement, according to Iowa Admin.
  Code r. 481-2013?
options:
  - Two banking days
  - Three banking days
  - Five banking days
  - Seven banking days
key: C
explanation: The rule requires that trust funds be deposited no later than five banking days after
  the date of the last signature of acceptance, unless the contract states otherwise. Therefore,
  five banking days is the correct maximum. Three banking days is incorrect because it understates
  the allowed period and would prematurely require deposit.
