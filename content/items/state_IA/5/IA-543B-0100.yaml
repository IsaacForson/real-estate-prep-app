stem: A broker deposits $500 of personal funds into the trust account to cover bank service charges
  but does not label the deposit. Is this permissible under Iowa Code § 543B.46(4)?
options:
  - The deposit is not permissible because personal funds must be specifically identified to be
    allowed
  - The deposit is permissible because the amount is under the $1,000 limit and the funds are
    intended for bank service charges
  - The deposit is not permissible because the amount exceeds the $1,000 limit
  - The deposit is permissible because bank service charges are a valid use of personal funds
key: A
explanation: Iowa Code § 543B.46(4) permits a broker to deposit up to $1,000 of personal money in
  the trust account only when the deposit is clearly identified and is intended to cover bank
  service charges. Because the broker failed to label the $500 deposit, the identification
  requirement is not satisfied, so the deposit is not permissible.
citation:
  source: Iowa Code ch. 543B — Iowa Code Chapter 543B — Real Estate Brokers and Salespersons — § 543B.46
  url: null
  quoted_text: A broker may deposit and keep a sum not to exceed one thousand dollars in the account
    from the broker’s personal funds, which sum shall be specifically identified and deposited to
    cover bank service charges relating to the trust account.
