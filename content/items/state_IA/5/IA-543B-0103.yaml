stem: A broker maintains a separate trust account solely for property management rental funds and
  does not pay interest on those funds. Is this permissible under Iowa Admin. Code r. 481-2013?
options:
  - No, because interest must be remitted to the state on a quarterly basis.
  - No, because all trust accounts must earn interest unless exempted by law.
  - Yes, because a separately maintained property management trust account need not be
    interest‑bearing.
  - Yes, but only if the broker obtains written consent from each property owner.
key: C
explanation: The rule provides that receipts from property management and rental account
  transactions may be deposited in a separate trust account, and if separately maintained, this
  account does not need to be interest‑bearing. Therefore, not paying interest on such a separate
  account is allowed. The other options incorrectly impose interest requirements that do not apply
  to separately maintained property management accounts.
