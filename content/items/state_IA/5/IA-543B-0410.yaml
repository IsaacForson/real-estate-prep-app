stem: Under Iowa Code § 543B.46(4), what is the maximum amount of a broker's personal funds that may
  be deposited in a trust account to cover bank service charges?
options:
  - One thousand dollars
  - Five hundred dollars
  - Five thousand dollars
  - Two thousand dollars
key: A
explanation: Subsection 4 permits a broker to deposit and keep up to one thousand dollars of
  personal funds in the trust account to cover service charges. Therefore, the maximum allowed
  amount is one thousand dollars. The distractor "Two thousand dollars" exceeds this limit and is
  not permissible.
