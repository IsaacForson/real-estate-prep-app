stem: Under what circumstance may a broker commingle personal funds in a trust account according to
  Iowa Admin. Code r. 481-2013?
options:
  - Authorization under Iowa Code section 543B.46(4).
  - Exceeding $1,000 in personal funds.
  - Maintaining an interest‑bearing trust account.
  - Providing 30‑days’ written notice to the commission.
key: A
explanation: The rule explicitly states that a broker cannot commingle personal funds in a trust
  account unless authorized by Iowa Code section 543B.46(4). Therefore, commingling is permissible
  only when such authorization exists. The other options describe situations not mentioned in the
  rule as allowing commingling.
