stem: A dispute over an earnest money deposit arises on March 1. No civil court action is pending
  and there is no written agreement between the parties. The broker, after determining in good faith
  that the buyer has failed to perform, wishes to disburse the deposit to the seller. According to
  Iowa Admin. Code r. 481-2013, what is the minimum amount of time that must pass from the date of
  the dispute before the broker may disburse the earnest money to the seller, assuming the broker
  will provide the required 30‑day notice?
options:
  - 2 months
  - 8 months
  - 4 months
  - 6 months
key: D
explanation: The rule provides that, absent a civil action or written agreement, a broker may
  disburse earnest money to a seller only after six months have elapsed from the date of the
  dispute, provided the broker has given the required 30‑day notice. Thus six months is the required
  waiting period. Thirty days is incorrect because it confuses the notice period with the statutory
  waiting period.
citation:
  source: Iowa Admin. Code r. 481-2013 — Iowa Administrative Code 481—Chapter 2013 — Trust Accounts
    And Closings (Real Estate Commission) 481—2013.1(8)(b)
  url: null
  quoted_text: In the absence of a pending civil action or written agreement, it is not grounds for
    disciplinary action when, upon passage of six months from the date of the dispute, a broker
    disburses the earnest money deposit to a seller or landlord in a transaction based upon a good
    faith decision that the buyer, renter, or lessee has failed to perform as agreed, but
    disbursement is made only after the broker has given 30 days’ written notice by certified mail
    to all parties concerned at their last-known addresses, setting forth the broker’s proposed
    action and grounds for the decision.
