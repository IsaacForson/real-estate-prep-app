stem: Under Iowa Admin. Code r. 481-2013, how long must a broker retain true copies of business
  books, accounts, records, contracts, closing statements, disclosures, signed documents, listings,
  offers to purchase, and all correspondence for each real estate transaction handled?
options:
  - The retention period is 7 years.
  - The retention period is 2 years.
  - The retention period is 5 years.
  - The retention period is 3 years.
key: C
explanation: The rule states that every broker must retain true copies of all specified records for
  a period of at least five years. This ensures records are available for commission inspection. The
  other options incorrectly state shorter or longer periods not supported by the rule.
