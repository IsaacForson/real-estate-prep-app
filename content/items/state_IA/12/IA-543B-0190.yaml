  url: null
  quoted_text: Every broker retains for a period of at least five years true copies of all business
    books; accounts, including voided checks; records; contracts; closing statements; disclosures;
    signed documents; the listing; any offers to purchase; and all correspondence relating to each
    real estate transaction that the broker has handled and each property managed.
