  quoted_text: When an offer to purchase is withdrawn or the acceptance is revoked without liability
    pursuant to Iowa Code chapter 558A, any earnest money deposit is promptly returned to the buyer
    without delay. The seller’s consent and agreement to release the funds is not necessary.
