stem: A buyer withdraws an offer to purchase without liability under Iowa Code chapter 558A, and the
  earnest money deposit was received by the listing broker. What must the listing broker do with the
  earnest money under Iowa Admin. Code r. 481-2013?
options:
  - The listing broker must deposit the earnest money into the broker's operating account until the
    seller agrees to release it.
  - The listing broker must retain the earnest money as liquidated damages for the withdrawn offer.
  - The listing broker must wait for the seller's written consent before returning the earnest money
    to the buyer.
  - The listing broker must return the earnest money promptly to the buyer without needing the
    seller's consent.
key: D
explanation: The rule provides that when an offer is withdrawn or acceptance revoked without
  liability, the earnest money must be promptly returned to the buyer without delay, and the
  seller's consent to release the funds is not required. The other options incorrectly impose a
  seller consent requirement, improperly divert the funds, or allow retention as damages, which the
  rule does not permit.
