stem: A broker collects monthly rent for a property management client and deposits the funds into a
  separate property management trust account. How often must the broker provide a complete
  accounting of all moneys received and disbursed from this account to the client?
options:
  - The broker must provide accounting quarterly.
  - The broker must provide accounting semi-annually.
  - The broker must provide accounting monthly.
  - The broker must provide accounting annually.
key: D
explanation: The rule requires the broker to provide a complete accounting not less often than
  annually, so an annual accounting satisfies the minimum requirement. The options stating
  quarterly, semi-annual, and monthly accounting describe more frequent intervals, which are
  permissible but not required by the rule.
