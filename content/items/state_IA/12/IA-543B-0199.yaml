stem: If a property management agreement is terminated, under Iowa Admin. Code r. 481-2015.1(5)(c),
  within how many days must the property manager provide the owner with any unobligated funds due
  the owner?
options:
  - Within 60 days after the effective date of termination
  - Within 15 days after the effective date of termination
  - Within 90 days after the effective date of termination
  - Within 30 days after the effective date of termination
key: D
explanation: Rule 481-2015.1(5)(c) requires the property manager to provide the owner with any
  unobligated funds due the owner not later than 30 days after the effective date of the
  termination. The distractor of 60 days applies to the final accounting of obligated funds, not to
  unobligated funds.
