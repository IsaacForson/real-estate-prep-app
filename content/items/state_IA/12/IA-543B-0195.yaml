stem: A licensee obtains the owner’s signature on a written property management agreement. Under
  Iowa Admin. Code r. 481-2015, what must the licensee do at that moment?
options:
  - Provide the owner with a legible copy of the agreement and ensure the broker retains a copy
  - File the agreement with the Iowa Real Estate Commission and keep a copy for the broker’s records
  - Submit the agreement to the county recorder’s office for recording and give a copy to the broker
  - Notify all current tenants of the agreement’s effective date and send a copy to the broker’s
    office
key: A
explanation: The rule requires the licensee to give the owner a legible copy of the agreement at the
  time the owner’s signature is obtained, and the broker must retain a copy. Providing the owner
  with a legible copy of the agreement and ensuring the broker retains a copy satisfies this
  requirement. Filing the agreement with the Commission is not required by this rule.
citation:
  source: Iowa Admin. Code r. 481-2015 — Iowa Administrative Code 481—Chapter 2015 — Property
    Management (Real Estate Commission) 2015.1(2)
  url: null
  quoted_text: The licensee gives the owner or the owner’s authorized agent a legible copy of every
    written property management agreement or written authorization at the time the signature of the
    owner is obtained, and the licensee’s broker retains a copy.
