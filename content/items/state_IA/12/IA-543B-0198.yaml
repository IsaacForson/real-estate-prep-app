stem: Under Iowa Admin. Code r. 481-2015.1(3), when may a licensee who is managing the leasing or
  rental of real estate act as an agent in the sale of that real estate?
options:
  - If the licensee has a written property management agreement with the owner that includes all
    terms required for property management
  - If the licensee's property management agreement grants the specific authorization and contains
    all necessary elements for a listing as set forth in rule 481-2011.1
  - If the licensee obtains written permission from the owner to act as a sales agent for the
    property and complies with all applicable state laws and regulations
  - If the licensee has been managing the property for more than six months and has completed a
    continuing education course on sales contracts
key: B
explanation: Rule 481-2015.1(3) allows a licensee managing leasing or rental to also act as a sales
  agent only when the property management agreement expressly grants that sales authority and
  includes all elements required for a listing under rule 481-2011.1, or when a separate listing
  agreement is obtained. The correct answer states that the property management agreement must grant
  the specific authorization and contain all necessary listing elements as set forth in rule
  481-2011.1. The incorrect answer that claims a mere written property management agreement is
  enough fails because it lacks the required specific sales authorization and listing elements.
