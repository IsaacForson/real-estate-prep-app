stem: According to Iowa Admin. Code r. 481-2015.1(1), which of the following must be included in
  every property management agreement?
options:
  - A clause requiring the broker to reside in the same county as the property
  - A clause requiring the broker to obtain a sales license for each property
  - A clause requiring proper identification of the property to be managed
  - A clause requiring the broker to receive a percentage of property appreciation
key: C
explanation: Rule 481-2015.1(1)(a) explicitly lists proper identification of the property to be
  managed as a required element of every property management agreement. The distractor about
  obtaining a sales license for each property is not mentioned in the rule and therefore is not a
  requirement.
