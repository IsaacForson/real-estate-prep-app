stem: A broker opens a separate trust account solely to hold property management funds received
  under written rental agreements. According to Iowa Admin. Code r. 481-2013, what is required
  regarding the Consent to Examine and Audit Trust Account form for this account?
options:
  - The broker must file the Consent to Examine and Audit Trust Account form with the commission.
  - The broker is not required to file a Consent to Examine and Audit Trust Account form.
  - The broker must file both the consent form and an affidavit with the commission.
  - The broker must file an affidavit with the commission instead of the consent form.
key: B
explanation: According to Iowa Admin. Code r. 481-2013.1(5)(c), a consent to examine is not
  necessary for a separate property management account, so the broker does not need to file the
  Consent to Examine and Audit Trust Account form. The other answer choices incorrectly require
  filing that form, an affidavit, or both, which the rule does not mandate for property management
  accounts.
