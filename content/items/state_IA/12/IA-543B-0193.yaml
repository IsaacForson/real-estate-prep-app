stem: According to Iowa Admin. Code r. 481-2015, what must a licensee's broker hold before the
  licensee may rent or lease real estate on behalf of an owner?
options:
  - A current written property management agreement signed by the owner or the owner’s authorized
    agent
  - A valid Iowa real estate broker license held by the licensee’s employing broker and current at
    the time of activity
  - A signed listing agreement that specifically authorizes the lease of the identified property
  - A completed continuing education certificate in property management issued by the Iowa Real
    Estate Commission
key: A
explanation: The rule states that a licensee cannot perform leasing activities unless the broker
  holds a current written property management agreement or other written authorization signed by the
  owner or owner's authorized agent. Therefore, the broker must have such an agreement. A valid
  broker license alone does not satisfy this requirement; the rule specifically mandates a property
  management agreement or authorization.
