stem: A licensee who is a 25% member of an LLC that owns a residential property wants to purchase
  that property from the LLC. What must the licensee do before proceeding with the purchase under
  Iowa Admin. Code r. 481-2007.8(1)?
options:
  - The licensee must obtain written consent from the employing broker.
  - The licensee must provide written disclosure of their interest to the other party.
  - The licensee must file a notice with the Iowa Real Estate Commission within five days.
  - The licensee must take no action because they are not acting as an agent.
key: B
explanation: Under Iowa Admin. Code r. 481-2007.8(1), a licensee who has any direct or indirect
  interest in a property must make written disclosure of that interest to the other party before
  acquiring the interest. Here, the licensee is a 25% member of the LLC that owns the property, so
  they have an indirect interest and must disclose it in writing to the LLC (the other party) before
  purchasing. Filing a notice with the commission or obtaining broker consent is not required by
  this rule, and taking no action would violate the disclosure requirement.
citation:
  source: Iowa Admin. Code r. 481-2007.8(1)
  url: null
  quoted_text: A licensee cannot acquire any interest in any property, directly or indirectly, nor can
    the licensee sell any interest in which the licensee, directly or indirectly, has an interest
    without first making written disclosure of the licensee’s true position clear to the other
    party.
