stem: A salesperson who owns a residential property and intends to sell it without paying any
  brokerage fee wants to advertise the property using only their personal name. Under Iowa Admin.
  Code r. 481-2010, is this permissible?
options:
  - Yes, provided the advertisement also includes the name of the brokerage they are affiliated with
  - No, because the property must be listed with a brokerage to be advertised
  - Yes, because the salesperson owns the property and no brokerage fee is involved
  - No, because the rule bars salespersons from advertising under their own names
key: C
explanation: The rule permits salespersons to advertise under their own name when they own the
  property and no brokerage fee is to be paid, making the scenario allowable. The claim that
  salespersons are barred from advertising under their own names ignores this specific exception.
