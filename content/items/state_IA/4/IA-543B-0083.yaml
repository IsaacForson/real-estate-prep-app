stem: Which of the following qualifies an individual to be approved as an instructor without needing
  to attend an instructor development workshop?
options:
  - Holding a bachelor’s degree in education
  - Holding commission approval as a guest speaker
  - Holding five years of real estate experience
  - Holding a current teaching credential
key: B
explanation: The rule exempts guest speakers who have prior commission approval from the instructor
  development workshop requirement. Therefore, holding commission approval as a guest speaker
  qualifies an individual for instructor approval without the workshop. Holding a bachelor’s degree
  in education does not provide this exemption, as the individual would still need to attend the
  workshop.
