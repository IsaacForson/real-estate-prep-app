stem: An applicant completed their sentence for a felony involving forgery four years ago. Under
  Iowa Code § 543B.15, when may the applicant be considered for licensure?
options:
  - Eligible after 0 years
  - Eligible after 1 years
  - Eligible after 2 years
  - Eligible after 5 years
key: B
explanation: For a felony involving forgery, the statute requires five years to elapse after
  completion of any incarceration, fine, or sentence before the applicant may be considered. Having
  waited four years, the applicant must wait one more year, making them eligible after 1 year. The
  option stating eligibility after 0 years is wrong because the full five‑year period has not yet
  been satisfied.
