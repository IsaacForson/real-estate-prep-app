stem: A prelicense course is taught only by a guest lecturer who is not listed as a principal
  instructor. Under Iowa Admin. Code r. 481-2016, is the course compliant with the principal
  instructor requirement?
options:
  - No, because the course must have a designated principal instructor
  - Yes, because guest lecturers may teach any portion of the course
  - No, unless the guest lecturer also provides attendance verification
  - Yes, as long as the guest lecturer holds an active real estate license
key: A
explanation: The rule requires that a course have principal instructor(s). Without a designated
  principal instructor, the course does not meet this requirement. Options suggesting that guest
  lecturers can substitute for a principal instructor are not supported by the text.
