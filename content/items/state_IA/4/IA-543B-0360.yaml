stem: An applicant knowingly overstated their years of salesperson experience on the Iowa broker
  license application. Under Iowa Code § 543B.15, what action may the commission take regarding this
  applicant?
options:
  - Require the applicant to complete additional continuing education
  - Approve the license if the overstatement is less than six months
  - Deny the license on the grounds of the false statement
  - Refer the applicant to the county attorney for prosecution
key: C
explanation: The statute provides that a person who makes a false statement of material fact on an
  application for a real estate broker’s or salesperson’s license may be denied a license by the
  commission on the grounds of the false statement or submission. Thus, the commission may deny the
  license based on the overstatement. The option "Approve the license if the overstatement is less
  than six months" is incorrect because any material false statement is grounds for denial,
  regardless of its magnitude.
citation:
  source: "### Iowa Code ch. 543B — Iowa Code Chapter 543B — Real Estate Brokers and Salespersons — §
    543B.15"
  url: null
  quoted_text: A person who makes a false statement of material fact on an application for a real
    estate broker’s or salesperson’s license, or who causes to be submitted, or has been a party to
    preparing or submitting any false application for such license, may be denied a license by the
    commission on the grounds of the false statement or submission.
