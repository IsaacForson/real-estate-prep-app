stem: An applicant completed a broker prelicense course 25 months before submitting a broker license
  application. Under Iowa Admin. Code r. 481-2016, is the applicant eligible to use that course to
  satisfy the broker prelicense requirement via substitution?
options:
  - The course does not qualify for substitution because it was completed more than 24 months prior
    to commission consideration.
  - The course qualifies for substitution because it was completed less than 24 months prior to
    commission consideration.
  - The course qualifies for substitution because it was completed exactly 24 months prior to
    commission consideration.
  - The course does not qualify for substitution because it was completed less than 12 months prior
    to commission consideration.
key: A
explanation: Iowa Admin. Code r. 481-2016.3(3) states that any course completed more than 24 months
  prior to commission consideration for approval does not qualify for substitution. Since the course
  was finished 25 months prior, it exceeds that limit and cannot be used. The distractors mistakenly
  apply the 12‑month limit or treat the 24‑month threshold as permissive.
