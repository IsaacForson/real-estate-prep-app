stem: Within how many calendar days prior to the date the license application is received must the
  criminal history check be completed for an initial broker or salesperson license applicant in
  Iowa?
options:
  - 180 days
  - 210 days
  - 240 days
  - 300 days
key: B
explanation: Iowa Code § 543B.15 requires that the criminal history check be completed within 210
  calendar days before the license application is received; otherwise the commission must reject the
  application. Therefore the required period is 210 days, and a period of 180 days does not satisfy
  the statutory requirement.
