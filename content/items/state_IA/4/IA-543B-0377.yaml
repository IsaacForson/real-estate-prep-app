stem: A licensee plans to complete 30 hours of continuing education via distance/online learning
  during a single renewal period. Under Iowa Admin. Code r. 481-2016, is this allowed?
options:
  - No, because the limit is 24 hours of distance/online learning per renewal period.
  - Yes, because distance/online learning hours are unlimited for continuing education.
  - No, because the licensee must take at least 12 hours in live instruction.
  - Yes, but only if the course is also approved as continuing education.
key: A
explanation: Rule 481—2016.4(4) states a maximum of 24 hours of continuing education may be taken by
  distance/online learning each three‑year renewal period; exceeding this limit is not permitted.
  The distractor claiming unlimited distance learning contradicts the explicit cap.
