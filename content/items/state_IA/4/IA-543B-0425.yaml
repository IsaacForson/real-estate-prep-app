stem: "Under Iowa Admin. Code r. 481-2017, an approved school may use the designation 'college' or
  'university' in its name if:"
options:
  - The school provides both online and classroom-based instruction options.
  - The school has been operating continuously for five or more years.
  - The school is accredited by a recognized regional accrediting agency.
  - The school actually satisfies the college and university standards set by the commission.
key: D
explanation: The Iowa Administrative Code rule states that an approved school may use the
  designations “college” or “university” only when it actually meets the college and university
  standards established by the commission. Consequently, the statement that the school actually
  satisfies those standards is the sole condition that permits the use of the designation. The other
  statements—providing both online and classroom instruction, having operated for five or more
  years, and being accredited by a recognized regional accrediting agency—are not mentioned in the
  rule and therefore do not grant the right to use the terms.
