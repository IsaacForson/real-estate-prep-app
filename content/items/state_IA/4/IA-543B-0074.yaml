stem: An applicant completed a commission‑approved 30‑hour salesperson prelicense course 14 months
  before scheduling the salesperson examination. Under Iowa Code § 543B.15, is the applicant
  eligible to take the examination?
options:
  - The applicant is eligible because the course was completed within the required period.
  - The applicant is not eligible because the course was completed outside the twelve‑month window.
  - The applicant is eligible because the course meets the 30‑hour minimum.
  - The applicant is not eligible because the course must be completed within six months.
key: B
explanation: Subsection 8 requires the 30‑hour salesperson course to be completed during the twelve
  months prior to taking the salesperson examination. Completing the course 14 months prior falls
  outside that window, making the applicant ineligible. The distractor claiming eligibility because
  the course was within the required period contradicts the explicit twelve‑month limit.
