stem: Under Iowa Admin. Code r. 481-2017, how many months does a licensee have from the date of
  purchase to complete all quizzes, assignments, and pass the final examination for a home-study
  continuing education course?
options:
  - Three months
  - Six months
  - Nine months
  - Twelve months
key: B
explanation: The rule states that a licensee has six months from the date of purchase to finish
  quizzes, assignments, and the final exam to earn course credit. Therefore, six months is the
  correct timeframe. The distractor of three months incorrectly halves the allowed period, while
  nine months and twelve months exceed the limit set by the regulation.
