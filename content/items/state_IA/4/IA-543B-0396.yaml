stem: A licensee purchases a home-study continuing education course on January 15. By what date must
  the licensee complete all quizzes, assignments, and pass the final examination to receive course
  credit under Iowa Admin. Code r. 481-2017?
options:
  - December 15
  - July 15
  - June 30
  - January 15
key: B
explanation: Six months after January 15 brings the deadline to July 15, as the rule requires
  completion within six months of purchase. The distractor January 15 mistakenly uses the purchase
  date itself, while June 30 falls short by half a month and December 15 exceeds the allowed period.
