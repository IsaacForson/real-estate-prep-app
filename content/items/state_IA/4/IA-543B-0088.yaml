stem: An applicant completed a commission‑approved 12‑hour course in Developing Professionalism and
  Ethical Practices 13 months before submitting the salesperson license application. Under Iowa
  Admin. Code r. 481-2016, is the applicant eligible to use this course to satisfy the salesperson
  prelicense requirement?
options:
  - The applicant is eligible because the course was completed within 12 months.
  - The applicant is ineligible because the course was completed more than 12 months prior.
  - The applicant is eligible because the course is substantially similar.
  - The applicant is ineligible because the course lacked commission approval.
key: B
explanation: The rule states that courses completed more than 12 months prior to commission
  consideration do not qualify for substitution. Since the course was finished 13 months prior, it
  cannot be used. The distractor about substantial similarity is irrelevant when the time limit is
  exceeded.
