stem: A licensee scores 75 percent on the final examination for a 2-hour home-study continuing
  education course. Does the licensee receive course credit?
options:
  - The licensee receives credit because the licensee answered enough questions correctly
  - The licensee receives credit because the score meets the minimum requirement
  - The licensee does not receive credit because the passing score is 80 percent
  - The licensee does not receive credit because the licensee must retake the entire course
key: C
explanation: The rule requires a passing score of 80 percent for course credit; a score of 75
  percent fails to meet this threshold. Therefore, the licensee does not receive credit. The option
  suggesting the licensee receives credit is incorrect because the score is below the required
  passing score.
