stem: Under Iowa Admin. Code r. 481-2017, what is the maximum allowable period between completing an
  instructor development workshop and submitting an application for instructor approval?
options:
  - Six months
  - Nine months
  - Twelve months
  - Eighteen months
key: C
explanation: The rule requires that an instructor development workshop be completed within 12 months
  preceding approval, so the maximum allowable period is twelve months. The distractor “Six months”
  confuses the required workshop attendance hours with the time limit.
citation:
  source: Iowa Admin. Code r. 481-2017 — 2017.12(1)
  url: null
  quoted_text: Individuals may be approved to teach prelicense and continuing education when they have
    shown proof of attendance of six hours at an instructor development workshop approved by the
    commission within 12 months preceding approval and have met the instructor qualification
    criteria.
