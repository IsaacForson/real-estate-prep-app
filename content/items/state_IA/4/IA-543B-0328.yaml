stem: An applicant had their cosmetology license revoked in another state 18 months ago. Under Iowa
  Code § 543B.15, what action may the commission take regarding this applicant?
options:
  - The commission may deny the license
  - The commission may wait two years
  - The commission may require extra education
  - The commission may approve the license
key: A
explanation: The statute provides that an applicant who has had a professional license of any kind
  revoked or suspended may be denied a license by the commission on those grounds. Thus the
  commission may deny the license. The option suggesting the commission may approve the license is
  incorrect because a prior revocation is a basis for denial, not automatic approval.
citation:
  source: Iowa Code ch. 543B — Iowa Code Chapter 543B — Real Estate Brokers and Salespersons — § 543B.15(4)
  url: null
  quoted_text: An applicant for a real estate broker’s or salesperson’s license who has had a
    professional license of any kind revoked or suspended or who has had any other form of
    discipline imposed, in this or any other jurisdiction, may be denied a license by the commission
    on the grounds of the revocation, suspension, or other discipline.
