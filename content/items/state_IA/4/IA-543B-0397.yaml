stem: An applicant attended a commission‑approved instructor development workshop on June 1, 2023.
  What is the latest date they may submit an application for instructor approval and still satisfy
  the requirement that the workshop attendance occurred within 12 months preceding approval under
  Iowa Admin. Code r. 481-2017?
options:
  - May 31, 2024
  - June 1, 2024
  - July 1, 2024
  - June 1, 2025
key: B
explanation: The rule requires the workshop to have been attended within the 12 months before
  approval, so the latest permissible application date is exactly one year after the workshop, June
  1, 2024. The distractor May 31, 2024 falls one day short of the full period, while July 1, 2024
  and June 1, 2025 exceed the allowed window.
