stem: A licensee purchases a home-study continuing education course on March 1. They complete all
  quizzes and assignments on August 20 and pass the final examination on August 25. Does the
  licensee receive course credit under Iowa Admin. Code r. 481-2017?
options:
  - The licensee receives course credit.
  - No credit because exam after deadline.
  - No credit because quizzes after deadline.
  - Credit only if retake after deadline.
key: A
explanation: Under Iowa Admin. Code r. 481-2017 — 2017.11(6), a licensee has six months from
  purchase to finish quizzes, assignments, and the final exam. Since the licensee finished all work
  by August 25, which is within six months of the March 1 purchase, credit is awarded. The claim
  that the final exam was taken after the deadline is false because the exam occurred on August 25,
  before the September 1 deadline.
