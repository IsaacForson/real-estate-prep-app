stem: What does the term 'Approved provider' mean under Iowa Admin. Code r. 481-2016?
options:
  - A person or an organization that has been approved by the commission to conduct continuing
    education activities pursuant to these rules.
  - A person or an organization that has been approved by the commission to conduct prelicense
    education activities pursuant to these rules.
  - A person or an organization that has been approved by the commission to conduct real estate
    brokerage activities pursuant to these rules.
  - A person or an organization that has been approved by the commission to conduct property
    management activities pursuant to these rules.
key: A
explanation: The definition of ‘Approved provider’ in Iowa Admin. Code r. 481-2016 explicitly states
  it is a person or organization approved by the commission to conduct continuing education
  activities. The other options incorrectly substitute prelicense education, brokerage, or property
  management for continuing education.
