stem: A distance learning continuing education course has received approval from the Association of
  Real Estate License Law Officials (ARELLO). Under Iowa Admin. Code r. 481-2017, how is this course
  treated for approval in Iowa?
options:
  - The course is required to undergo additional Iowa-specific review before it can be offered.
  - The course is eligible for approval only if it also includes a live instruction component.
  - The course is limited to a maximum of three credit hours per renewal period.
  - The course is automatically approved for use in Iowa without further review.
key: D
explanation: The rule states that any continuing education course that has obtained approval from
  the Association of Real Estate License Law Officials (ARELLO) is automatically approved for use in
  Iowa, so no further review is required. Therefore, the correct statement is that the course is
  automatically approved for use in Iowa without further review. The statements suggesting
  additional Iowa‑specific review, a live instruction component, or a limit of three credit hours
  per renewal period are not supported by the rule and are incorrect.
