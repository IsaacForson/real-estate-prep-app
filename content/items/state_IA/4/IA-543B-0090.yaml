stem: A continuing education course is scheduled from 8:00 a.m. to 5:00 p.m. with a one-hour lunch
  break. Does the course comply with the maximum daily classroom hour limit for an approved school
  under Iowa Admin. Code r. 481-2017?
options:
  - The course meets the maximum daily classroom hour limit without lunch.
  - The course complies with the maximum daily classroom hour limit.
  - The course exceeds the maximum daily classroom hour limit.
  - The course violates the maximum daily classroom hour limit.
key: B
explanation: The rule states there is no more than eight classroom hours in any single day of
  instruction. The course provides nine hours total minus a one-hour lunch, resulting in eight
  classroom hours, which meets the limit. The distractor claiming the course meets the limit without
  lunch is incorrect because omitting the lunch would leave nine classroom hours, exceeding the
  eight‑hour maximum.
