stem: Under Iowa Admin. Code r. 481-2002, how is an 'affiliated licensee' defined?
options:
  - A broker associate or salesperson who is under the supervision of a broker.
  - A person who holds a broker license and supervises salespersons.
  - A salesperson who works for multiple brokers simultaneously.
  - A licensee who independently contracts with clients without broker supervision.
key: A
explanation: The definition of an affiliated licensee in Iowa Admin. Code r. 481-2002 is a broker
  associate or salesperson who is under the supervision of a broker. The option that states a broker
  associate or salesperson who is under the supervision of a broker matches this definition. The
  option describing a person who holds a broker license and supervises salespersons is incorrect
  because it describes a supervisor, not someone who is supervised.
