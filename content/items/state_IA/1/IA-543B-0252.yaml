stem: A licensee learns that their real estate license was revoked by another state on August 1,
  2024. They notify the Iowa Real Estate Commission on August 20, 2024. Under Iowa Admin. Code r.
  481-2005.10(543B), what is the consequence of this delay?
options:
  - The licensee must pay a $1,000 civil penalty
  - The delay is cause for disciplinary action
  - The licensee must complete remedial education
  - The out-of-state revocation is automatically recognized in Iowa
key: B
explanation: The licensee notified the commission 19 days after the adverse action, exceeding the
  15‑day window. Failure to notify within 15 days is expressly declared cause for disciplinary
  action. The other options introduce penalties or requirements not mentioned in the rule.
