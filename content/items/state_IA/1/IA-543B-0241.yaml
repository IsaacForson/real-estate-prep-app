stem: A salesperson licensed in another state allowed their license to lapse eight months ago. They
  now wish to obtain an Iowa real estate salesperson license by passing the Iowa portion of the
  salesperson examination. Under Iowa Admin. Code r. 481-2005.3(2), what determines their
  eligibility?
options:
  - They are eligible because they have been licensed as a salesperson in another state.
  - They are eligible if they finish thirty hours of approved prelicense education.
  - They are not eligible because their license lapsed more than six months before the exam.
  - They are eligible if they pass both the national and Iowa portions of the exam.
key: C
explanation: Iowa Admin. Code r. 481-2005.3(2) requires that a nonresident salesperson seeking Iowa
  license by examination must have been actively licensed as a salesperson and that the license has
  not been inactive or expired for more than six months immediately before passing the Iowa portion
  of the exam. Because the applicant’s license lapsed eight months prior, they fail the recency
  requirement and are not eligible. The distractor asserting eligibility solely based on licensure
  in another state ignores the active‑license condition.
