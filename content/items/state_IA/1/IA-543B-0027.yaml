stem: Which of the following best describes an "affiliated licensee" under Iowa administrative rules?
options:
  - A broker associate or salesperson who works under a broker’s supervision
  - A broker who holds a primary license and supervises others
  - An applicant who has submitted a license renewal form
  - A licensee who represents both buyer and seller in the same transaction
key: A
explanation: The definition states that an affiliated licensee is a broker associate or salesperson
  under the supervision of a broker. The other choices describe a broker, an applicant, or a dual
  agent, which are not the definition of an affiliated licensee.
