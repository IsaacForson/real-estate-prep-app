stem: A broker allowed their license to expire and did not file a renewal application by the January
  30 deadline. Eighteen months later, they submit a reinstatement application. Under Iowa Admin.
  Code r. 481-2003, what additional reinstatement fee must accompany the application?
options:
  - $250
  - $350
  - $450
  - $550
key: C
explanation: The rule imposes an additional reinstatement fee of $25 for each partial or full month
  following expiration (Iowa Admin. Code r. 481-2003.6). Eighteen months × $25 = $450, making $450
  the correct fee. The distractor of $350 results from multiplying 14 months by $25, which
  undercounts the elapsed period.
