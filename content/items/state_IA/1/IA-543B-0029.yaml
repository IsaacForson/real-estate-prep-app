stem: A broker completes 50 hours of approved continuing education during a renewal period. Under
  Iowa Admin. Code r. 481-2003, how many of those hours may the broker apply toward the next renewal
  period's continuing education requirement?
options:
  - 0 hours
  - 7 hours
  - 14 hours
  - 18 hours
key: C
explanation: The broker completed 50 hours, which is 14 hours above the 36‑hour requirement. Excess
  hours may be applied up to 50 % of the required hours (18 hours), so the full 14 excess hours can
  be carried forward. The 7‑hour option mistakenly uses half of the excess, and the 18‑hour option
  incorrectly assumes the maximum allowable carryover regardless of actual excess.
