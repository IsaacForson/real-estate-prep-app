stem: Which of the following persons is expressly listed as an exemption from the licensing
  requirements in Iowa Code §543B.7?
options:
  - A licensed attorney admitted to practice in Iowa acting solely as an incident to the practice of
    law.
  - A broker who manages rental properties on behalf of clients as part of his regular business
    activities.
  - A property owner who sells his own residence without receiving any compensation for the
    transaction.
  - A real estate salesperson who has completed forty hours of continuing education requirements.
key: A
explanation: Iowa Code §543B.7(3) states that “A licensed attorney admitted to practice in Iowa
  acting solely as an incident to the practice of law” is excluded from the chapter’s licensing
  provisions. The other descriptions are not mentioned in the exemption list, so they do not qualify
  for exemption.
