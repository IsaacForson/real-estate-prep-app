stem: A partnership includes an investor who does not participate in brokerage activities. Under
  Iowa Code § 543B.2, is the investor required to hold a real estate license?
options:
  - The investor must hold a real estate broker license
  - The investor must hold a real estate salesperson license
  - The investor is not required to hold a real estate license
  - The investor must be employed by a licensed broker
key: C
explanation: The statute requires a license only for members or officers who actively participate in
  the brokerage business. Since the investor does not actively participate, the investor is not
  required to hold a license. The options stating that the investor must hold a broker license, must
  hold a salesperson license, or must be employed by a licensed broker incorrectly impose a license
  requirement regardless of participation level.
