stem: A corporation employs an unlicensed individual to show properties and collect rent. The
  individual does not hold a real estate license. Under Iowa Code § 543B.2, is the corporation
  eligible for a license?
options:
  - Yes, because showing property and collecting rent are not considered salesperson acts.
  - No, because an employee who acts as a salesperson must hold a license.
  - Yes, because the corporation's officers are licensed brokers.
  - No, because the corporation must also have at least one broker officer.
key: B
explanation: The statute requires that every employee who acts as a salesperson for a corporation
  hold a real estate broker or salesperson license. Showing property and collecting rent are
  considered salesperson acts, so employing an unlicensed individual to perform those tasks
  disqualifies the corporation from licensure. The statement that showing property and collecting
  rent are not considered salesperson acts is incorrect because those activities constitute
  salesperson acts under the statute.
