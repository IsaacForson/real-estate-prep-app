stem: Under Iowa Admin. Code r. 481-2005.10(543B), what effect does a disciplinary action taken
  against an Iowa licensee by another state have under Iowa law?
options:
  - It results in the immediate suspension of the Iowa license
  - It requires the licensee to pay a fine equal to the out-of-state penalty
  - It is considered prima facie evidence of a violation and may lead to a hearing
  - It automatically results in the same disciplinary action in Iowa
key: C
explanation: The rule states that an out-of-state disciplinary action is considered prima facie
  evidence of a violation and may lead to a hearing to determine if similar action should be taken
  in Iowa. It does not automatically impose the same penalty or void the license. The distractor
  suggesting automatic imposition is incorrect because the rule only provides for evidentiary weight
  and a possible hearing.
citation:
  source: Iowa Admin. Code r. 481-2005.10(543B)
  url: null
  quoted_text: If an Iowa licensee has a real estate license disciplined, suspended or revoked by any
    other state or jurisdiction, that disciplinary action will be considered prima facie evidence of
    violation of Iowa Code section 543B.29 or 543B.34 or both, and a hearing may be held to
    determine whether similar disciplinary action should be taken against the Iowa licensee.
