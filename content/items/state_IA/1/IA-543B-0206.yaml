key: D
explanation: The rule specifies that applicants must provide evidence of 12 hours of Developing
  Professionalism and Ethical Practices as part of the prelicense education requirement. The
  distractor of 6 hours confuses the total 60‑hour requirement with the individual subject hours,
  while 18 and 24 hours incorrectly combine multiple subject requirements.
