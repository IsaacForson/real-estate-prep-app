stem: Under Iowa Code § 543B.1, what is required for a person to engage in real estate brokerage
  activities?
options:
  - A person must complete a college degree in real estate.
  - A person must be employed by a licensed broker.
  - A person must hold a real estate license.
  - A person must pass a state examination each year.
key: C
explanation: Iowa Code § 543B.1 states that a license is mandatory for engaging in real estate
  brokerage. Therefore, holding a real estate license is required. The other options introduce
  requirements not found in the statute, such as a college degree, employment by a broker, or annual
  examinations.
