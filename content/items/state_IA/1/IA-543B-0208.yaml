stem: Under Iowa Code § 543B.7, which of the following persons is excluded from the licensing
  requirements pursuant to subsection 1?
options:
  - An auctioneer who is not a licensee and limits role to establishing the time, place, and method
    of an auction
  - A prospective purchaser who does not make repeated and successive transactions of a like
    character
  - A person acting as a receiver, trustee in bankruptcy, administrator, executor, or guardian
  - A licensed attorney admitted to practice in Iowa acting solely as an incident to the practice of
    law
key: B
explanation: Under Iowa Code § 543B.7(1), a person who is a prospective purchaser and does not
  engage in repeated and successive transactions of a like character is excluded from the licensing
  requirement. The other listed persons—an auctioneer who only sets the time, place, and method of
  an auction, a person acting as a receiver, trustee in bankruptcy, administrator, executor, or
  guardian, and a licensed attorney acting solely incident to the practice of law—are excluded under
  different subsections of the same statute, not subsection 1. Therefore the correct choice is the
  prospective purchaser who does not make repeated and successive transactions of a like character.
