stem: Under Iowa Code § 543B.2, which of the following is required for a partnership to be granted a
  real estate broker license?
options:
  - The partnership's employees need licenses, but partners may be unlicensed.
  - The partnership must have a designated broker who is not a partner.
  - Partners must hold a real estate salesperson license.
  - At least one partner must be a licensed real estate broker.
key: D
explanation: "Iowa Code § 543B.2 requires that at least one member or officer of each partnership be
  a real‑estate broker. Consequently, a partnership may receive a broker license only if at least
  one partner holds a broker license. The other statements are not required: employees may be
  licensed but partners are not required to be licensed unless they are the broker; a designated
  broker may be a partner; and partners are not limited to holding only a salesperson license."
