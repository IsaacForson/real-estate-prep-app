stem: A licensee charges a $500 fee for listing a property and a $200 fee solely for a newspaper
  advertisement. Which fee is classified as an advance fee?
options:
  - $500 listing fee
  - $200 newspaper ad fee
  - Escrow holding fee
  - Closing coordination fee
key: A
explanation: The rule defines advance fees as any fees paid in advance for services, including
  listing fees, but excludes fees paid solely for newspaper advertisement. Therefore the $500
  listing fee is an advance fee, while the newspaper ad fee and other fees are not.
citation:
  source: Iowa Admin. Code r. 481-2002
  url: null
  quoted_text: '"Advance fees" means any fees charged for services to be paid in advance of the
    rendering of such services including, without limitation, any fees charged for listing,
    advertising, or offering for sale or lease any real property, but excluding any fees paid solely
    for advertisement in a newspaper of general circulation.'
