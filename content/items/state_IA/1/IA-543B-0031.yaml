math:
  worked_solution: No arithmetic is required. The question asks which fee meets the definition of an
    advance fee. Under Iowa Admin. Code r. 481‑2002, a listing fee paid in advance qualifies as an
    advance fee, whereas a fee paid solely for a newspaper advertisement does not. Hence the $500
    listing fee is the advance fee.
