stem: A nonresident of Iowa applies for a real estate broker license. The applicant is currently
  licensed in another state that has similar licensure requirements and extends similar recognition
  and courtesies to Iowa licensed brokers. Under Iowa Code § 543B.21, what may the Real Estate
  Commission do regarding the examination requirement for this applicant?
options:
  - Require the applicant to pass the Iowa broker examination
  - Waive the requirement of an examination
  - Require the applicant to pass only the national portion of the exam
  - Deny the application due to nonresident status
key: B
explanation: Iowa Code § 543B.21 provides that the commission may waive the requirement of an
  examination in the case of a nonresident broker who is licensed under the laws of a state having
  similar requirements and where similar recognition and courtesies are extended to licensed real
  estate brokers and salespersons of Iowa. The other options contradict the specific waiver
  provision for qualifying nonresident brokers.
