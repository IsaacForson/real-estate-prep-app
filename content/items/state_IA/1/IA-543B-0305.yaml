stem: Under Iowa Code § 543B.5, what does the term "inactive license" mean?
options:
  - A license that has expired because the holder failed to complete required continuing education
  - A license that has been revoked by the Iowa Real Estate Commission for violating state laws
  - A license that is on file with the commission and the licensee may not engage in any acts
  - A license that allows the holder to perform only ministerial acts for customers without
    representation
key: C
explanation: Under Iowa Code § 543B.5, an inactive license is a license certificate that remains on
  file with the Iowa Real Estate Commission while the licensee is prohibited from performing any of
  the acts covered by this chapter. This matches the option stating that the license is on file and
  the licensee may not engage in any acts. The other options describe licenses that have expired,
  been revoked, or limited to ministerial activities, which do not match the statutory definition.
citation:
