stem: A broker allowed their license to expire and did not file a renewal application by the January
  30 deadline. Thirty-seven months later, they submit a reinstatement application. Under Iowa Admin.
  Code r. 481-2003, what must the broker do to regain licensure?
options:
  - The broker must start over and apply for a salesperson license before being eligible.
  - The broker must retake and pass the broker examination before reapplying.
  - The broker must complete 36 hours of continuing education before reapplying.
  - The broker must pay the renewal fee plus a $25 monthly penalty.
key: A
explanation: Because the broker waited more than three years (37 months) to seek reinstatement, the
  rule treats them as never having been licensed and requires them to start over as a salesperson.
  The other options describe steps for reinstatement within the three‑year window, which no longer
  applies.
