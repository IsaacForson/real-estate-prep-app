explanation: Iowa Code § 543B.15(8) explicitly states that a qualified applicant for a license as a
  real estate salesperson shall complete a commission-approved short course in real estate education
  of at least thirty hours. The sixty-hour requirement applies to broker applicants, not salesperson
  applicants.
