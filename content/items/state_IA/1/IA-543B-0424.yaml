stem: A salesperson licensed with Broker A submits the required paperwork to transfer the license to
  Broker B. When may the salesperson begin working for Broker B under Iowa Admin. Code r. 481-2004?
options:
  - The salesperson may begin working for the new broker immediately after the transfer is approved.
  - The salesperson must retake the salesperson examination before working for the new broker.
  - The salesperson must wait thirty days after the transfer before working for the new broker.
  - The salesperson must complete additional continuing education before working for the new broker.
key: A
explanation: Under Iowa Admin. Code r. 481-2004 2004.1(2), a salesperson whose license is
  transferred to a new broker may begin working for that broker immediately after the transfer is
  processed. Therefore, the salesperson does not need to wait, complete additional education, or
  retake the examination. The distractor suggesting a thirty‑day wait confuses the transfer rule
  with the renewal grace period, which applies only to license renewals, not transfers. The
  distractors about continuing education or re‑examination incorrectly apply renewal or
  reinstatement requirements to a simple license transfer.
