stem: An auctioneer who is not a licensee advertises a property, cries the property at auction, and
  also collects a deposit from a prospective buyer. Under Iowa Code § 543B.7, does the auctioneer
  need to be licensed?
options:
  - Yes, because collecting deposit money is prohibited unless the auctioneer is licensed
  - Yes, because the auctioneer’s role is limited to advertising and crying the property
  - Yes, because showing the property to prospective buyers requires a license
  - Yes, because deposit collection is permitted for unlicensed auctioneers under this section
key: A
explanation: Iowa Code § 543B.7(5)(b)(5) prohibits an unlicensed auctioneer from collecting deposit
  moneys to secure or facilitate a sale; doing so brings the auctioneer under the chapter’s
  licensing requirements. The claim that the auctioneer’s role is limited to advertising and crying
  the property ignores the deposit collection. The claim that showing the property to prospective
  buyers requires a license adds an irrelevant condition. The claim that deposit collection is
  permitted for unlicensed auctioneers under this section is false. Therefore only the statement
  that collecting deposit money is prohibited unless the auctioneer is licensed is correct.
