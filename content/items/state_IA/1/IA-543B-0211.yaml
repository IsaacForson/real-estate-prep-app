stem: Under Iowa Admin. Code r. 481-2003, what is the maximum number of continuing education hours
  from the previous renewal period that a broker may apply toward the current renewal requirement?
options:
  - 12 hours
  - 9 hours
  - 24 hours
  - 18 hours
key: D
explanation: The rule states that licensees may apply a maximum of 18 hours from the previous
  renewal period toward the current requirement (Iowa Admin. Code r. 481-2003.4(1)). The distractor
  of 12 hours incorrectly assumes half of the 24‑hour elective requirement, while 24 hours exceeds
  the allowed maximum.
