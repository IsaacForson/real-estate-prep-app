stem: A buyer offers to pay earnest money with a personal check that is not guaranteed to be
  immediately cashable. The licensee informs the seller of this arrangement before the seller signs
  the offer and includes a clause in the offer stating that the earnest money will be paid by
  personal check. Under Iowa Admin. Code r. 481-2013.2(6), is the earnest money acceptable?
options:
  - The earnest money is not acceptable because personal checks are not acceptable as earnest money.
  - The earnest money is acceptable because the seller was informed prior to acceptance and the
    method is stated in the offer.
  - The earnest money is acceptable, but only if the check is deposited into the listing broker's
    trust account within 24 hours.
  - The earnest money is acceptable, but only if the check is certified or cashier's check.
key: B
explanation: The rule permits non‑cash earnest money when the seller is informed before acceptance
  and the method is written into the offer. Since the licensee did both, the earnest money is
  acceptable. The other choices add conditions that the rule does not require.
