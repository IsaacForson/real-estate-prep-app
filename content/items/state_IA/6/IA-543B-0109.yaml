stem: A broker's trust account earned $250 of interest during the first quarter and incurred $30 of
  service charges directly attributable to maintaining the interest‑bearing account and remitting
  the interest. How much must the broker remit to the state under rule 481-2013.1(2)?
options:
  - $220.00
  - $250.00
  - $280.00
  - $30.00
key: A
explanation: The rule requires the amount remitted to the state to be the interest earned less any
  service charges directly attributable to maintaining the interest‑bearing account and remitting
  the interest. Subtracting $30 from $250 yields $220. The other options either omit the subtraction
  or add the charges.
citation:
  source: Iowa Admin. Code r. 481-2013 — Iowa Administrative Code 481—Chapter 2013 — Trust Accounts
    And Closings (Real Estate Commission) 481—2013.1(2)
  url: null
  quoted_text: The amount to be remitted to the state will be the amount of interest earned less any
    service charges directly attributable to the criteria of maintaining an interest-bearing account
    and of remitting the interest to the state.
