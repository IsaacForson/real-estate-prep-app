stem: Under rule 481-2011.1, a written brokerage agreement must include which of the following
  disclosures?
options:
  - A disclosure that the broker holds a current active license
  - A disclosure that compensation is negotiable and not set by law
  - A disclosure that the earnest money will be held in escrow
  - A disclosure that the property is free of encumbrances
key: B
explanation: The rule requires brokerage agreements to include a disclosure that compensation is
  negotiable and not set by law. This ensures clients know the fee is not fixed by statute. The
  other disclosures, while potentially useful, are not mandated by this rule.
