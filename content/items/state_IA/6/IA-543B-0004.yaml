stem: A listing broker offers to sell a seller's home and agrees to keep any amount received above a
  fixed net price the seller wants. Under rule 481-2011.1(5), how should the commission treat this
  listing?
options:
  - As a barred net listing, unprofessional conduct
  - As an open listing available to any broker
  - As a fully valid exclusive right-to-sell listing
  - As a valid listing once the seller signs it
key: A
explanation: The rule bars net listings, defined as agreements specifying a net price to the owner
  with the excess to the broker, and treats taking one as unprofessional conduct.
citation:
  source: Iowa Admin. Code rule 481-2011
  url: null
  quoted_text: |-
    No licensee makes or enters into a net listing agreement for the sale
    of real property or any interest in real property.
