stem: A buyer signs an offer to purchase a property on Monday, May 5, 2025, and the broker receives
  the earnest money check that same day. Assuming no holidays, by what date must the broker deposit
  the earnest money into the trust account to comply with Iowa Admin. Code r. 481-2013?
options:
  - The broker must deposit the earnest money by May 10, 2025.
  - The broker must deposit the earnest money by May 12, 2025.
  - The broker must deposit the earnest money by May 13, 2025.
  - The broker must deposit the earnest money by May 11, 2025.
key: B
explanation: The rule requires trust funds to be deposited no later than five banking days after the
  date of the last signature. Counting five banking days from May 5 (excluding Saturday May 10 and
  Sunday May 11) brings the deadline to the close of business on Monday, May 12. The distractor May
  10 incorrectly treats the period as five calendar days, while May 13 adds an extra banking day.
