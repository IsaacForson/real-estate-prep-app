stem: Under rule 481-2013.1(1)(a), trust funds must be deposited into the trust account no later
  than how many banking days after the date indicated on the document that the last signature of
  acceptance is obtained?
options:
  - Seven banking days
  - Ten banking days
  - Five banking days
  - Three banking days
key: C
explanation: The rule states that all trust funds are deposited into the trust account no later than
  five banking days after the date indicated on the document that the last signature of acceptance
  is obtained, unless otherwise specified in the contract. The other numbers do not match this
  requirement.
