stem: After a dispute over earnest money, six months have passed and the broker has sent a 30‑day
  certified mail notice to all parties stating the buyer failed to perform and proposing to disburse
  the earnest money to the seller. Under rule 481-2013.1(8)(b), is the broker’s action permissible?
options:
  - The broker may disburse the earnest money to the buyer after giving the required 30‑day notice.
  - The broker may disburse the earnest money to the seller after giving the required 30‑day notice.
  - The broker may disburse the earnest money to the seller only after a court judgment directs the
    disposition.
  - The broker may disburse the earnest money to the seller only after obtaining a written release
    from both parties.
key: B
explanation: The rule permits disbursement to a seller or landlord after six months from the dispute
  and after providing 30 days’ written notice, based on a good faith belief that the buyer failed to
  perform. Disbursement to the buyer, requiring a release, or waiting for a judgment are not
  authorized under this provision.
citation:
  source: Iowa Admin. Code r. 481-2013 — Iowa Administrative Code 481—Chapter 2013 — Trust Accounts
    And Closings (Real Estate Commission) 481—2013.1(8)(b)
  url: null
  quoted_text: In the absence of a pending civil action or written agreement, it is not grounds for
    disciplinary action when, upon passage of six months from the date of the dispute, a broker
    disburses the earnest money deposit to a seller or landlord in a transaction based upon a good
    faith decision that the buyer, renter, or lessee has failed to perform as agreed, but
    disbursement is made only after the broker has given 30 days’ written notice by certified mail
    to all parties concerned at their last-known addresses, setting forth the broker’s proposed
    action and grounds for the decision.
