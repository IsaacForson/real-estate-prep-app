stem: A transaction fails to close, and the broker claims part of the earnest money because a
  commission was already earned under the listing contract. Under rule 481-2013.1(9), may the broker
  withhold that portion of the earnest money?
options:
  - Yes, up to the earned commission amount
  - No, the broker cannot withhold earnest money
  - Yes, if the seller authorizes it verbally
  - No, but after the buyer formally files an objection
key: B
explanation: The rule states the broker is not entitled to withhold any portion of the earnest money
  when a transaction fails to consummate even if a commission is earned.
citation:
  source: Iowa Admin. Code rule 481-2013
  url: null
  quoted_text: |-
    Under no circumstances is the broker entitled to withhold any portion of the earnest money
    when a transaction fails to consummate even if a commission is earned.
