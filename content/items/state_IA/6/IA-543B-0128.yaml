stem: A licensee enters into a brokerage agreement with a buyer for a residential property. The
  agreement does not specify an expiration date. Under rule 481-2011.1, what is the status of this
  agreement?
options:
  - The agreement is valid and enforceable unless corrected promptly
  - The agreement is invalid due to missing expiration date
  - The agreement is valid but must be amended within thirty days
  - The agreement is valid only if the parties later agree orally
key: B
explanation: Rule 481-2011.1 mandates a definite expiration date not exceeding one calendar year for
  residential brokerage agreements. Without this term, the agreement fails to meet the statutory
  requirement and is therefore invalid. The other options incorrectly suggest the agreement could be
  saved by later action or oral agreement.
