stem: A licensee prepares two separate purchase contracts for the same parcel showing different
  prices, and does not tell the buyer's lender about the higher contract so the buyer can qualify
  for a larger loan. Under Iowa Code section 543B.45, this scheme is classified as which of the
  following?
options:
  - A fraudulent practice
  - A permitted financing method
  - A minor recordkeeping lapse
  - A standard dual listing
key: A
explanation: The statute provides that a person who violates the dual contract provisions concerning
  concealed contracts used to inflate a loan amount shall be guilty of a fraudulent practice.
