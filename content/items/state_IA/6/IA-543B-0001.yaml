stem: Under Iowa Code section 543B.56A, a brokerage agreement must specify that the broker will, at
  a minimum, do which of the following?
options:
  - Waive the client's right to review counteroffers
  - Present offers and counteroffers to the client
  - Guarantee the client a specific sale price
  - Draft the closing disclosure for the lender
key: B
explanation: The brokerage agreement statute requires the broker to accept delivery of and present
  to the client offers and counteroffers to buy, sell, rent, lease, or exchange the property.
citation:
  source: Iowa Code § 543B.56A
  url: null
  quoted_text: |-
    Accept delivery of and present to the client offers and counteroffers to buy, sell, rent,
    lease, or exchange the client’s property or the property the client seeks to purchase or lease.
