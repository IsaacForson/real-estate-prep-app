stem: A licensee negotiates a sale while representing both the buyer and the seller, but only the
  seller knows the licensee is also assisting the buyer. Under Iowa Code section 543B.34, this
  conduct exposes the licensee to sanction because it constitutes which of the following?
options:
  - Pursuing a flagrant course of false advertising acts
  - Making a substantial misrepresentation to a client
  - Failing to remit funds belonging to other parties
  - Acting for more than one party without knowledge
key: D
explanation: The commission may sanction a licensee found guilty of acting for more than one party
  in a transaction without the knowledge of all parties for whom the licensee acts.
