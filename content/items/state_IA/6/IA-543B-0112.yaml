stem: Under Iowa Admin. Code r. 481-2013.2(6), what must be true for a licensee to accept earnest
  money that is neither cash nor an immediately cashable check?
options:
  - The licensee must obtain a written guarantee from the buyer's bank.
  - The licensee must communicate the fact to the seller prior to acceptance and state it in the
    offer to purchase.
  - The licensee must deposit the earnest money into the selling broker's trust account within 24
    hours.
  - The licensee must receive written consent from the real estate commission before accepting the
    check.
key: B
explanation: The rule states that any means other than cash or an immediately cashable check are not
  accepted as earnest money unless that fact is communicated to the seller prior to the acceptance
  of the offer to purchase, and is stated in the offer to purchase. Therefore, the licensee must
  both inform the seller beforehand and include the method in the offer. The other options add
  requirements not found in the rule.
