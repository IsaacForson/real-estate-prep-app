stem: A salesperson switches from the state group errors and omissions policy to an individual
  policy during the policy term. What must the salesperson do to remain compliant with Iowa Admin.
  Code r. 481-2019?
options:
  - Notifying the commission of the change in insurance status, coverage, or provider
  - Taking no action because the state group policy remains in effect
  - Submitting proof of the new policy only to the employing broker
  - Waiting until the next renewal period to inform the commission
key: A
explanation: The rule requires each individual licensee to notify the commission when changing
  insurance status, coverage, or provider; waiting until renewal or only informing the broker does
  not satisfy this requirement. The state group policy does not remain in effect after switching to
  an individual policy.
