stem: A licensee who completed ten hours of law update continuing education during the previous
  renewal period wishes to apply those hours toward the law update requirement for the upcoming
  renewal. Is this permitted under Iowa Admin. Code r. 481-2016?
options:
  - Yes, because any continuing education hours may be carried over to the next period.
  - No, because the licensee must first submit a disability waiver to the commission.
  - No, because law update hours cannot be carried over toward the mandatory law update course.
  - Yes, but only if the licensee also completes four hours of ethics training.
key: C
explanation: The rule prohibits carrying over any hours toward the mandatory eight‑hour law update
  course nor the four‑hour ethics course, so the option stating that law update hours cannot be
  carried over toward the mandatory law update course is correct. The option claiming any continuing
  education hours may be carried over is incorrect.
