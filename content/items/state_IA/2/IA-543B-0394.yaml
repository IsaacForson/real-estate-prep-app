stem: A broker who has been licensed for four years wishes to apply 12 hours of broker prelicense
  coursework toward the continuing education requirement for license renewal. Is this permitted
  under Iowa Admin. Code r. 481-2016?
options:
  - No, because newly licensed brokers may not use prelicense coursework for continuing education.
  - Yes, because the broker is not newly licensed and may use prelicense coursework as continuing
    education.
  - No, because brokers may not count any prelicense coursework toward continuing education
    requirements.
  - Yes, because brokers may apply up to 24 hours of prelicense coursework as continuing education
    each renewal period.
key: B
explanation: Under Iowa Admin. Code r. 481-2016, a broker may take broker prelicense courses as
  continuing education, but a newly licensed broker cannot use those credits for continuing
  education. Since the broker has been licensed for four years, they are not newly licensed and may
  apply the 12 hours of prelicense coursework toward renewal. The statement that newly licensed
  brokers may not use prelicense coursework is accurate but does not affect this broker’s
  eligibility. The claim that brokers may not count any prelicense coursework toward continuing
  education contradicts the rule, which allows such use. The claim that brokers may apply up to 24
  hours of prelicense coursework each renewal period adds a limit not present in the cited rule.
