stem: A salesperson who obtained their Iowa real estate license eight months ago wishes to apply 12
  hours of salesperson prelicense coursework toward the continuing education requirement for license
  renewal. Is this permitted under Iowa Admin. Code r. 481-2016?
options:
  - No, because newly licensed salesperson cannot use prelicense coursework for first renewal
    education.
  - Yes, but only if the prelicense coursework was completed within the previous 12 months and
    approved.
  - No, because prelicense coursework is prohibited from counting toward any continuing education
    requirement for license renewal.
  - Yes, because salespersons may use up to 24 hours of prelicense coursework as continuing
    education.
key: A
explanation: Rule 481‑2016.10(1) explicitly states that a newly licensed salesperson cannot use
  credits from the salesperson prelicense course(s) to meet the continuing education criteria of the
  first renewal term. The other options misstate the rule or ignore the newcomer restriction.
