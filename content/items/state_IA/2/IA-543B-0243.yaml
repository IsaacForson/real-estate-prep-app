stem: A salesperson whose license was terminated by the broker continues to show properties and
  negotiate offers after the commission has received a copy of the terminated license. What is the
  legal status of the salesperson’s actions under Iowa Code § 543B.33?
options:
  - The salesperson's actions are permissible if the broker gives verbal permission.
  - The salesperson's actions are lawful provided they disclose the termination to clients.
  - The salesperson's actions are unlawful under authority of the license after the commission
    receives the copy.
  - The salesperson's actions are allowed if a new license application is submitted within 24 hours.
key: C
explanation: The statute makes it unlawful for a salesperson to perform any acts under authority of
  a license from and after the date the commission receives a copy of the terminated license.
  Therefore, the salesperson’s continued brokerage activity is unlawful. The option stating that the
  salesperson's actions are lawful provided they disclose the termination to clients is incorrect
  because the law provides no exception for disclosing the termination to clients; the prohibition
  applies regardless of disclosure.
citation:
  source: Iowa Code ch. 543B — Iowa Code Chapter 543B — Real Estate Brokers and Salespersons — § 543B.33
  url: null
  quoted_text: It is unlawful for any real estate salesperson to perform any of the acts contemplated
    by this chapter either directly or indirectly under authority of a license from and after the
    date of receipt of a copy of the license by the commission.
