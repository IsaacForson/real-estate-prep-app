stem: Under Iowa Admin. Code r. 481-2019, how many calendar days does a licensee have to comply with
  a commission request for proof of errors and omissions insurance before failure to comply is
  considered prima facie evidence of a violation?
options:
  - 20 calendar days
  - 15 calendar days
  - 30 calendar days
  - 10 calendar days
key: A
explanation: The rule states that failure to comply within 20 calendar days of the commission’s
  request is prima facie evidence of a violation. The other time frames are not mentioned in the
  rule.
