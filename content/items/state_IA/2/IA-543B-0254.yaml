  url: null
  quoted_text: Failure to comply with Iowa Code section 543B.47(6) within 20 calendar days of the
    commission’s request is prima facie evidence of a violation of Iowa Code sections 543B.15(5) and
    543B.47(1) and is grounds for the denial of an application for licensure, the denial of an
    application to renew a license, or the suspension or revocation of a license.
