stem: An applicant for a salesperson license completed a prelicense course 13 months ago and wishes
  to substitute it for a required course. May the course be used for substitution under the
  commission’s rules?
options:
  - The course qualifies for substitution when it is substantially similar
  - The course qualifies for substitution when completed within 24 months
  - The course does not qualify for substitution when completed more than 12 months prior
  - The course does not qualify for substitution when the applicant lacks a broker license
key: C
explanation: The commission’s rules state that courses completed more than 12 months prior to
  commission consideration do not qualify for substitution. Since the course was finished 13 months
  ago, it cannot be used, regardless of similarity or the applicant’s broker status.
