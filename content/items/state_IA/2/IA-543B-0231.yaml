stem: An applicant for a broker license completed a prelicense course 25 months ago and wishes to
  substitute it for a required broker prelicense course. May the course be used for substitution
  under the commission’s rules?
options:
  - No, because the course was completed less than 12 months ago.
  - Yes, because the course was completed within 24 months.
  - Yes, because the course was completed within 12 months.
  - No, because the course was completed more than 24 months prior.
key: D
explanation: Iowa Admin. Code r. 481-2016.3(3) states that any course completed more than 24 months
  prior to commission consideration for approval does not qualify for substitution; since 25 months
  exceeds this limit, the course may not be used. The distractor “Yes, because the course was
  completed within 24 months.” is incorrect because the course was completed 25 months ago, which is
  outside the allowable window.
