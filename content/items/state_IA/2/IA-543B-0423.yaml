stem: A licensee submits a counterfeit certificate of insurance to the Iowa Real Estate Commission
  when requested to prove errors and omissions coverage. According to Iowa Admin. Code r. 481-2019,
  what is the legal effect of this action?
options:
  - Immediate placement of the license on inactive status for noncompliance
  - Prima facie evidence of a violation of Iowa Code sections 543B.29(1) and 543B.34(1)
  - A twenty‑day cure period before any disciplinary action may be taken by the commission
  - Payment of a fine equal to twice the annual premium for the policy term
key: B
explanation: The rule states that submitting false documentation of insurance coverage is prima
  facie evidence of a violation of Iowa Code sections 543B.29(1) and 543B.34(1). The claim that the
  license is placed on inactive status applies only when proof is missing for 30 days, not when
  false documents are submitted.
