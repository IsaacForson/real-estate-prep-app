stem: A licensee changes the principal business location of their real estate activity to a new
  address within Iowa. What must the licensee do, and what will the commission do upon compliance?
options:
  - The licensee must only give notice to the commission of the change; no fee is required and the
    existing license remains valid.
  - The licensee must give notice to the commission of the change and pay the fee; the commission
    will issue a new license for the unexpired period.
  - The licensee must submit a new license application and retake the exam; the commission will
    issue a new license after passing.
  - The licensee must notify the commission within 30 days; the commission will update the address
    on the existing license without issuing a new one.
key: B
explanation: The statute requires the licensee to give notice of any change of principal business
  location and to pay the fee; the commission then issues a new license for the unexpired period.
  The statement that only notice is required with no fee and that the existing license remains valid
  is incorrect because a fee is required and the existing license is not valid after the change.
citation:
  source: Iowa Code ch. 543B — Iowa Code Chapter 543B — Real Estate Brokers and Salespersons — § 543B.32
  url: null
  quoted_text: Notice in writing, electronic or otherwise, shall be given to the real estate
    commission by each licensee of any change of principal business location, whereupon the
    commission shall issue a new license for the unexpired period upon the payment of a fee
    established by rule to cover the cost of issuing the license.
