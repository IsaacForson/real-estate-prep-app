stem: A broker relocates the principal office from Des Moines to Cedar Rapids, closing the Des
  Moines location as the principal office but keeping it open as a branch office. According to Iowa
  Code § 543B.31, what must the broker do regarding the Des Moines office?
options:
  - Notifying the commission of the change of principal business location and paying a fee for a new
    license covering the unexpired period
  - Obtaining a duplicate license for the branch office and paying the commission‑determined fee for
    each duplicate license
  - Submitting an electronic transfer application and waiting for approval from both the releasing
    and new brokers
  - Providing written notice to the commission within seventy‑two hours of opening the branch office
key: B
explanation: The rule states that if a broker maintains more than one place of business, a duplicate
  license shall be issued for each branch office and a fee shall be paid for each duplicate license.
  The Des Moines office, now a branch, therefore requires a duplicate license and fee. The other
  options describe procedures for change of location, transfer, or termination notices.
citation:
  source: Iowa Code ch. 543B — Iowa Code Chapter 543B — Real Estate Brokers and Salespersons — § 543B.31
  url: null
  quoted_text: If the real estate broker maintains more than one place of business within the state, a
    duplicate license shall be issued to such broker for each branch office maintained. A fee
    determined by the real estate commission shall be paid for each duplicate license.
