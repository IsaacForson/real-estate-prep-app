stem: A salesperson whose license expires on September 30, 2025, passes the salesperson examination
  on March 15, 2025. Can the examination score be used to satisfy continuing education requirements
  for the current license term?
options:
  - Yes, because the exam was taken within six months of expiration
  - No, because the exam was taken more than six months before expiration
  - Yes, because any passing exam score satisfies CE requirements
  - No, because only the broker exam can substitute for CE
key: B
explanation: The salesperson exam may substitute for CE only if taken within the six months
  immediately preceding license expiration; March 15 is more than six months before September 30,
  2025.
