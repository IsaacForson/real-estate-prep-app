stem: Under Iowa Admin. Code r. 481-2016, what is the duration of an individual real estate license
  term and when does it expire?
options:
  - Three years, expiring on December 31 of the third year
  - Two years, expiring on June 30 of the second year
  - Four years, expiring on December 31 of the fourth year
  - Three years, expiring on June 30 of the third year
key: A
explanation: The rule states that licenses are issued for three-year terms, counting the remaining
  portion of the year of issue as a full year, and expire on December 31 of the third year.
  Therefore, the correct duration and expiration are three years with a December 31 expiry in the
  third year. The distractor suggesting a June 30 expiry misstates the expiration date set by the
  rule. The other distractors incorrectly alter the term length.
