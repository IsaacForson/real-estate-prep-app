stem: A salesperson submits a transfer application to move to a new broker. Both the releasing and
  new brokers approve the request within 48 hours, and the commission approves and issues the
  transfer on June 10. What is the effective date of the transfer?
options:
  - The effective date is the date the new affiliating broker approves the transfer.
  - The effective date is the date the releasing broker approves the transfer.
  - The effective date is the date the salesperson submits the transfer application.
  - The effective date is the date of approval and issuance from the commission.
key: D
explanation: Iowa Admin. Code r. 481-2006 § 2006.2(2) states that the effective date of a transfer
  is the date of approval and issuance from the commission. The submission date is not effective
  because the transfer is not complete until the commission acts.
