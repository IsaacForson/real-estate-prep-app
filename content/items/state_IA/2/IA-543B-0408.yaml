math:
  worked_solution: "Step 1: Identify the statutory appropriation amount: $25 per broker license fee
    (Iowa Code § 543B.14).\\nStep 2: The broker paid a license fee of $170.\\nStep 3: The
    appropriation is a fixed amount per license, not a percentage of the fee, so the amount
    appropriated remains $25.\\nStep 4: Therefore, $25 of the $170 fee is appropriated to the
    department for the education director and compliance staff."
