stem: A broker pays the original broker license fee of $170. How much of that fee is appropriated to
  the department of inspections, appeals, and licensing for hiring a real estate education director
  and regulatory compliance personnel?
options:
  - $000.00
  - $025.00
  - $170.00
  - $145.00
key: B
explanation: Iowa Code § 543B.14 directs that $25 from each broker and salesperson license fee is
  appropriated to the department for the education director and compliance staff. Thus $25 of the
  $170 fee goes to that purpose. The $0 and $170 amounts misapply the rule, and $145 incorrectly
  subtracts the appropriation.
