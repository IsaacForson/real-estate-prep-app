stem: A broker voluntarily closes his real estate firm. What must the broker do with the licenses of
  associated licensees according to Iowa Admin. Code r. 481-2008?
options:
  - The broker must return licenses to the commission within 72 hours, noting the firm is closed.
  - The broker must retain associated licenses for 30 days before sending them to the commission.
  - The broker must destroy all licenses after notifying the commission of closure.
  - The broker must forward licenses to the new broker for each associated licensee.
key: A
explanation: Iowa Admin. Code r. 481-2008 § 2008.1(2) requires the broker to return licenses to the
  commission within 72 hours with written notice that the firm is closed. Retaining licenses for 30
  days is not permitted under this rule.
