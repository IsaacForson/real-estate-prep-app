stem: A licensee receives a written request from the Iowa Real Estate Commission for proof of errors
  and omissions insurance on June 10. By what date must the licensee provide the proof to avoid
  prima facie evidence of a violation?
options:
  - June 20
  - June 25
  - June 30
  - July 5
key: C
explanation: The rule requires compliance within 20 calendar days of the commission’s request;
  failure to do so is prima facie evidence of a violation. Adding 20 days to June 10 yields June 30.
  June 20 would be only 10 days later, and June 25 would be 15 days later, both insufficient.
