stem: A real estate broker opens a second office in a different city within Iowa. What must the
  broker do regarding licensing for the new office?
options:
  - The broker must only notify the commission of the new office address within 30 days.
  - The broker must continue using the original license for both offices without any additional
    action.
  - The broker must submit a new application for a broker license for the second office.
  - The broker must obtain a duplicate license for the new office and pay the commission‑determined
    fee.
key: D
explanation: Under Iowa Code § 543B.31, a broker who maintains more than one place of business must
  obtain a duplicate license for each additional office and pay the commission‑determined fee.
  Simply notifying the commission of the new address does not satisfy this requirement.
