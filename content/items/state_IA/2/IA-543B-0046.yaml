stem: A salesperson’s license was placed on inactive status for failure to submit continuing
  education proof. Before the commission can reactivate the license, what must the licensee do?
options:
  - Completing an additional eight‑hour law update course
  - Providing proof of completing deficient CE hours
  - Retaking and passing the real estate salesperson examination
  - Paying the required reactivation fee to the commission
key: B
explanation: The rule requires that before reactivating a license placed on inactive status for
  missing continuing education, the licensee must submit evidence that all deficient continuing
  education hours have been completed. Therefore, providing proof of completing the deficient CE
  hours is necessary for reactivation. The distractor of paying a fee is incorrect because fee
  payment alone does not satisfy the continuing education deficit. Retaking the salesperson exam or
  completing an extra law‑update course does not address the specific deficiency of missing CE
  hours.
