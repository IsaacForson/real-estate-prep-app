stem: A salesperson provides written notice to her broker requesting that her license be immediately
  returned to the commission. According to Iowa Admin. Code r. 481-2006.1(2), within how many hours
  must the broker make every reasonable effort to ensure the commission receives the electronic
  application?
options:
  - 72 hours
  - 24 hours
  - 48 hours
  - 96 hours
key: A
explanation: Under Iowa Admin. Code r. 481-2006.1(2), when a licensee terminates employment and
  requests the license be returned, the releasing broker must make every reasonable effort to ensure
  the commission receives the electronic application within 72 hours of the termination date.
  Therefore, the correct interval is 72 hours. The 48‑hour distractor reflects the time frame for
  broker approvals in a license transfer, which does not apply to termination situations. The other
  options represent incorrect intervals not mentioned in the rule.
