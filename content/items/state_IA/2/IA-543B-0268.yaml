stem: A licensee submits a renewal application that includes continuing education hours completed
  before the start of the current renewal period. How will the Iowa Real Estate Commission treat
  those hours?
options:
  - They will not be accepted for renewal credit
  - They will be accepted but reduce the required hours by half
  - They will be accepted only if the licensee pays a penalty fee
  - They will be accepted if the licensee provides a written explanation
key: A
explanation: The rule states that it is not acceptable to include continuing education that is
  outside the renewal period; such hours will not be accepted. The distractor about acceptance with
  conditions is not in the rule.
