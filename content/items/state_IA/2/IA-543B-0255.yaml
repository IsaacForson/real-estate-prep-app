stem: A licensee whose Iowa real estate license has been on inactive status for eight months wishes
  to return to active status. What must the licensee provide to the commission before the license
  can be reactivated?
options:
  - A letter of good standing from the broker
  - Proof of errors and omissions insurance
  - Proof of completed continuing education hours
  - Payment of the renewal and reinstatement fees
key: B
explanation: The rule requires receipt of proof of errors and omissions insurance before
  reactivating an inactive status license to active status. Proof of continuing education, a letter
  of good standing, or fee payment alone does not satisfy this requirement.
