stem: Under Iowa Admin. Code r. 481-2012, if a buyer's offer is accepted, how long must the broker
  retain the signed agency disclosure form?
options:
  - For two years from the date of signature
  - For three years from the date of signature
  - For five years from the date of signature
  - For seven years from the date of signature
key: C
explanation: Subrule 2012.2(12)(a) requires that when an offer is accepted, the signed or noted copy
  of the agency disclosure be retained in the closed transaction file for five years from the date
  of the signature or note. The three‑year distractor is a common misremembering of the retention
  period, but the rule clearly specifies five years.
