stem: A buyer refuses to sign the disclosed dual agency consent agreement presented by the licensee.
  According to Iowa Admin. Code r. 481-2012, what action must the licensee take?
options:
  - The licensee must continue to act as a dual agent despite the buyer's refusal.
  - The licensee must obtain the buyer's consent through verbal agreement before proceeding.
  - The licensee must not act as a dual agent for that transaction.
  - The licensee must terminate the brokerage agreement with the seller.
key: C
explanation: The licensee must not act as a dual agent for that transaction because rule 2012.5(1)
  states that if any seller, landlord, buyer, or tenant rejects dual agency or refuses to sign
  consent to dual agency, the licensee cannot act as a dual agent. The suggestion that the licensee
  can obtain the buyer's consent through verbal agreement before proceeding is incorrect because the
  rule requires a written consent agreement, not merely verbal agreement, and does not permit the
  licensee to proceed without the client’s written consent.
