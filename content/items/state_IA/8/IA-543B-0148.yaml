stem: A brokerage wants to implement an appointed agent policy. According to Iowa Admin. Code r.
  481-2012, which of the following must be included in the appointed agent disclosure to a client?
options:
  - A statement that the appointed agent will represent the client as the client’s agent and owe
    duties under Iowa Code section 543B.56(1) and 543B.56(2).
  - A statement that the appointed agent will be representing both the seller and the buyer in the
    transaction and owe fiduciary duties to each party.
  - A statement that the brokerage will disclose all known material adverse facts about the property
    to the client before closing and must also provide a copy of the disclosure statement to the
    client.
  - A statement that the appointed agent may not disclose confidential information about one client
    to the other client unless disclosure is required by law or authorized by the client.
key: A
explanation: Subrule 2012.7(1)(b) requires the appointed agent disclosure to include a statement
  that the appointed agent will be representing the client as the client’s agent and will owe the
  client duties as set forth in Iowa Code section 543B.56(1) and 543B.56(2). The other options
  either describe unrelated disclosures, add extra requirements not mandated, or misstate
  confidentiality rules.
