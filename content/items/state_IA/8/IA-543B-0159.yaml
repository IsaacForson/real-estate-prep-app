    Of Relationships (Real Estate Commission) 481—2012.2(2)"
  url: null
  quoted_text: A change in the licensee’s representation that makes the initial verbal disclosure
    incomplete, misleading, or inaccurate obligates that a new verbal disclosure be made
    immediately.
