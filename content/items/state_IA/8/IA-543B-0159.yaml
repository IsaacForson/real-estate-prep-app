stem: A licensee initially discloses representing the seller, but later decides to also represent
  the buyer in the same transaction. According to Iowa Admin. Code r. 481-2012, what must the
  licensee do?
options:
  - The licensee must provide a written disclosure immediately
  - The licensee must wait until closing to disclose the change
  - The licensee must make a new verbal disclosure immediately
  - The licensee must take no further disclosure action
key: C
explanation: When a licensee changes representation in a transaction, the initial verbal disclosure
  becomes incomplete, misleading, or inaccurate. The rule therefore requires the licensee to give a
  new verbal disclosure right away. A written disclosure may follow later, but the immediate step is
  the verbal disclosure.
citation:
