stem: Under Iowa Admin. Code r. 481-2012, what must a brokerage do before engaging in any activities
  of a dual agent if its company policy permits disclosed dual agency for in-house transactions?
options:
  - The brokerage must provide a disclosed dual agency consent agreement to the client or
    prospective client prior to engaging in any activities.
  - The brokerage must wait until after the purchase agreement is signed before disclosing the dual
    agency relationship.
  - The brokerage must obtain written consent from both parties before any property is shown to
    either client.
  - The brokerage must file a dual agency notice with the Iowa Real Estate Commission prior to the
    first showing.
key: A
explanation: The Iowa Administrative Code rule 481‑2012.5(1) states that a brokerage whose policy
  permits disclosed dual agency for in‑house transactions must give a disclosed dual agency consent
  agreement to the client or prospective client before undertaking any dual‑agent activities.
  Therefore, the brokerage must provide that agreement prior to any dual‑agent work. The option that
  suggests waiting until after the purchase agreement is signed is incorrect because the rule
  requires the agreement before any dual‑agent activity, not after a contract is executed. The
  option that calls for written consent before any property is shown adds a timing requirement that
  the rule does not impose; the rule only requires the agreement before dual‑agent activities, not
  necessarily before showings. The option that proposes filing a notice with the Iowa Real Estate
  Commission is not required by the rule; the rule’s obligation is limited to providing the consent
  agreement to the clients.
