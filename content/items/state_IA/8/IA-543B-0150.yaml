stem: A licensee representing a seller has obtained a listing, the seller has signed the property
  disclosure statement, and the licensee has delivered the statement to the buyer. The buyer refuses
  to sign and date the disclosure statement. According to Iowa Admin. Code r. 481-2014, what must
  the licensee do next?
options:
  - Obtain the buyer’s signature on a separate acknowledgment form and place it in the transaction
    file.
  - Obtain other documentation establishing delivery of the disclosure and maintain the written
    documentation in the transaction file.
  - Consider the disclosure requirement satisfied because the statement was delivered, and take no
    further action.
  - Return the disclosure statement to the seller and advise the seller to obtain the buyer’s
    signature.
key: B
explanation: The rule states that if the licensee is unable to obtain the buyer’s signature, the
  licensee must obtain other documentation establishing delivery of the disclosure and maintain that
  written documentation in the transaction file. Simply considering the requirement satisfied after
  delivery does not meet the rule’s documentation requirement.
