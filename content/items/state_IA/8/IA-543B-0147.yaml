stem: A licensee representing both a seller and a buyer in a transaction presents a disclosed dual
  agency consent agreement to the seller, who refuses to sign it. According to Iowa Admin. Code r.
  481-2012, what must the licensee do?
options:
  - The licensee must modify the consent agreement to remove the seller's signature requirement.
  - The licensee must terminate the brokerage agreement with the buyer only.
  - The licensee must refrain from acting as a dual agent in that transaction.
  - The licensee must proceed with dual agency after obtaining verbal consent from the seller.
key: C
explanation: Subrule 2012.5(1) states that if any seller, landlord, buyer, or tenant rejects dual
  agency or refuses to sign consent to dual agency, the licensee cannot act as a dual agent.
  Therefore the licensee must refrain from acting as a dual agent. The distractors are incorrect
  because verbal consent is insufficient, altering the agreement does not override the refusal, and
  terminating only the buyer’s agreement does not address the dual agency prohibition.
