stem: A licensee representing a seller has obtained a listing and the seller has signed the
  disclosure statement. According to Iowa Admin. Code r. 481-2014, when must the licensee deliver
  the executed statement to a potential buyer?
options:
  - The licensee must deliver the executed statement to the buyer at the closing of the transaction
    before possession
  - The licensee must deliver the executed statement to the buyer after the seller accepts a written
    offer to buy in writing
  - The licensee must deliver the executed statement to the buyer within three days of obtaining the
    listing or as required
  - The licensee must deliver the executed statement to a potential buyer prior to the seller’s
    making a written offer to sell or accepting a written offer to buy
key: D
explanation: The rule requires the licensee representing a seller to deliver the executed disclosure
  statement to a potential buyer, the buyer’s agent, or any third party representing a potential
  buyer before the seller makes a written offer to sell or accepts a written offer to buy. The other
  options describe timing that does not satisfy this requirement.
citation:
  source: Iowa Admin. Code r. 481-2014.1(2)(a)
  url: null
  quoted_text: A licensee representing a seller delivers the executed statement to a potential buyer,
    a potential buyer’s agent, or any other third party who may be representing a potential buyer,
    prior to the seller’s making a written offer to sell or the seller’s accepting a written offer
    to buy.
