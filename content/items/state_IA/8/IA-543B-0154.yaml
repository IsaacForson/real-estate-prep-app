stem: A licensee is acting as a disclosed dual agent for both the seller and the buyer in a
  residential transaction. During the showing, the licensee observes that the roof has active
  leakage that was not previously disclosed. According to Iowa Admin. Code r. 481-2012, what action
  must the licensee take regarding this observation?
options:
  - Inform both the seller and the buyer of the material adverse fact.
  - Wait until the buyer asks about the roof condition before providing any information.
  - Inform only the seller, as the seller is responsible for property condition disclosures.
  - Inform only the buyer, as the buyer is the party making the offer.
key: A
explanation: The rule requires a dual agent to disclose to the client all material adverse facts
  concerning the property that are actually known by the licensee. Since the dual agent represents
  both seller and buyer, the disclosure must be made to each client. Informing only one party or
  waiting for a request fails to satisfy this duty.
