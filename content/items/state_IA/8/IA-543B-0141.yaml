stem: Under Iowa Admin. Code r. 481-2014, what must a licensee representing a seller do at the time
  the licensee obtains a listing?
options:
  - The licensee must obtain a completed disclosure signed and dated by each seller represented by
    the licensee
  - The licensee must deliver the executed statement to a potential buyer prior to the seller’s
    making a written offer to sell
  - The licensee must attempt to obtain the buyer’s signature and date of signature on the statement
  - The licensee must maintain a copy of the written acknowledgment in the transaction file for a
    minimum of five years
key: A
explanation: The rule states that at the time a licensee obtains a listing, the listing licensee
  must obtain a completed disclosure signed and dated by each seller represented by the licensee.
  The other options describe duties that occur later in the transaction.
