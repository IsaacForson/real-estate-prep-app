stem: A licensee representing a buyer prepares a written offer to purchase a property. When must the
  licensee provide the written disclosure of agency to the buyer?
options:
  - The licensee must provide the written disclosure after the seller accepts the buyer's offer
  - The licensee must provide the written disclosure only if the buyer requests it in writing
  - The licensee must provide the written disclosure before the buyer signs the offer to purchase
  - The licensee must provide the written disclosure at the closing table before funds are disbursed
key: C
explanation: The rule requires written disclosure to be made to the buyer prior to any offer, lease,
  or rental agreement being made or signed by the buyer. Stating that the disclosure should be given
  after the seller accepts the buyer's offer is incorrect because it delays disclosure until after
  the offer is accepted, violating the timing requirement.
