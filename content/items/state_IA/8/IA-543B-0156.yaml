stem: A licensee who will show a property to a prospective buyer must make a verbal agency
  disclosure at which time?
options:
  - Before the licensee gets the written disclosure
  - Before the licensee presents an offer to the seller
  - Before the buyer signs a purchase agreement form
  - Before providing specific assistance to the buyer
key: D
explanation: According to subrule 2012.2(2), the verbal disclosure required by subrule 2012.2(1)
  must be made prior to the licensee’s providing specific assistance to the client or nonrepresented
  customer. Therefore, the disclosure must occur before any specific assistance is given. The
  distractor about receiving the written disclosure is incorrect because the rule ties the timing to
  assistance, not to receipt of the written disclosure.
