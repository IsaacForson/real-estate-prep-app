stem: Under Iowa Admin. Code r. 481-2012, what must every licensed sole-proprietor single broker,
  firm, partnership, limited liability company, association, or corporation have?
options:
  - Verbal disclosure agreement
  - Written company policy
  - Dual agency consent form
  - Property condition report
key: B
explanation: The rule explicitly states that every licensed sole-proprietor single broker, firm,
  partnership, limited liability company, association, or corporation has a written company policy.
  This policy must identify and describe the types of brokerage relationships offered. The
  distractor about a verbal disclosure agreement confuses the required written policy with the
  verbal disclosure obligation covered elsewhere in the rule.
