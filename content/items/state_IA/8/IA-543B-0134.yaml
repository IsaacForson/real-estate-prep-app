stem: Under Iowa Admin. Code r. 481-2014, which of the following constitutes an acceptable
  acknowledgment of receipt for electronic delivery of a property disclosure statement?
options:
  - The computer-generated read receipt
  - The facsimile delivery confirmation
  - The text message acknowledging receipt
  - The automated return message confirmation
key: C
explanation: The rule states that acceptable acknowledgment includes a text message from the
  transferee acknowledging receipt, while a computer-generated read receipt is explicitly not deemed
  acknowledgment. The most tempting distractor, a computer-generated read receipt, is incorrect
  because the rule specifies it does not satisfy the acknowledgment requirement.
citation:
  source: Iowa Admin. Code r. 481-2014 — Iowa Administrative Code 481—Chapter 2014 — Seller Property
    Condition Disclosure (Real Estate Commission) 2014.1(6)
  url: null
  quoted_text: >-
    Acceptable acknowledgment of

    receipt includes return of a fully executed copy of the property disclosure statement to the
    transferor

    by the transferee or the transferee’s agent; or a letter, electronic mail, text message, or
    other written

    correspondence to the transferor from the transferee or the transferee’s agent acknowledging
    receipt. A

    Inspections and Appeals[481]IAC 6/10/26 Ch 2014, p.1


    computer-generated read receipt, facsimile delivery confirmation, or other automated return
    message is not

    deemed acknowledgment of receipt for purposes of this rule
