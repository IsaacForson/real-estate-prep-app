stem: According to Iowa Admin. Code r. 481-2012, what must a written company policy identify and
  describe?
options:
  - The procedures for handling escrow trust accounts
  - The advertising standards required for property listings
  - The duties owed to buyers and sellers in a transaction
  - The types of real estate brokerage relationships the broker may engage in
key: D
explanation: The rule states that the written company policy identifies and describes the types of
  real estate brokerage relationships in which the broker and affiliated licensees may engage. The
  procedures for handling escrow trust accounts is a common distractor because duties are covered
  elsewhere in the rule, not in the policy requirement.
