stem: Under Iowa Code §543B.46(4), what is the maximum amount of personal funds a broker may deposit
  in a trust account to cover bank service charges?
options:
  - $500
  - $1,000
  - $1,500
  - $2,000
key: B
explanation: The statute allows a broker to deposit and keep a sum not to exceed one thousand
  dollars in the trust account from personal funds to cover bank service charges. Therefore, the
  maximum permissible amount is $1,000. The distractor $1,500 exceeds this limit and is not allowed.
