stem: Which of the following is a ground for revocation or suspension of a real estate license under
  Iowa Code § 543B.29?
options:
  - Knowingly making misleading, deceptive, untrue, or fraudulent representations in practice
  - Holding a valid broker’s license in another state without notifying the Iowa commission
  - Failing to complete continuing education requirements within the renewal period
  - Advertising a property without including the broker’s name in the advertisement
key: A
explanation: Iowa Code § 543B.29(1)(d) lists knowingly making misleading, deceptive, untrue, or
  fraudulent representations in the practice of the profession as a ground for discipline. The other
  options describe conduct not identified as a ground for revocation or suspension in that
  subsection.
