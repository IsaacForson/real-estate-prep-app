stem: Under Iowa Code §543B.35, how many days before a hearing must the commission send written
  notice containing the charges, date, and place to the applicant or licensee?
options:
  - 10 days
  - 25 days
  - 15 days
  - 20 days
key: D
explanation: The rule requires the commission to send written notice at least twenty days prior to
  the hearing date. This notice must include an exact statement of the charges and the hearing
  details. Therefore, the correct interval is twenty days. The other options represent shorter or
  longer periods not supported by the text.
