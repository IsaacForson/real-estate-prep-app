stem: Under Iowa Code §543B.15(6), when considering the denial of a license based on an applicant’s
  criminal history, which factor must the real estate commission evaluate?
options:
  - The applicant's credit score
  - The nature of the offense
  - The applicant's political view
  - The number of years resided in Iowa
key: B
explanation: The statute requires the commission to consider the nature of the offense when
  evaluating a denial based on criminal history. The applicant's credit score is not listed as a
  factor the commission must consider.
