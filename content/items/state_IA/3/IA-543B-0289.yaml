stem: An applicant for a real estate salesperson license has a misdemeanor conviction for petty
  theft that is not classified as an indictable offense. Under Iowa Code §543B.16(1), what must the
  applicant disclose on the application regarding this conviction?
options:
  - The applicant must disclose the misdemeanor conviction
  - The applicant must not disclose the misdemeanor conviction
  - The applicant must disclose the conviction only if it is a felony
  - The applicant must disclose the conviction only if it is a misdemeanor
key: B
explanation: The rule requires disclosure only of criminal convictions for crimes classified as
  indictable offenses; a non‑indictable misdemeanor need not be reported. Disclosing it would be
  unnecessary and could be mistakenly interpreted as a false statement if the applicant incorrectly
  labels it as indictable.
