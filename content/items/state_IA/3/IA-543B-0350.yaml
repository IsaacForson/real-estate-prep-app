stem: A broker deposits $800 of personal funds into the trust account to cover bank service charges.
  Later, the broker deposits an additional $300 of personal funds for the same purpose. Is the total
  deposit of $1,100 permissible under Iowa Code §543B.46(4)?
options:
  - The deposit is impermissible because the total exceeds $1,000
  - The deposit is permissible because each individual deposit is under $1,000
  - The deposit is impermissible because personal funds are prohibited in trust accounts
  - The deposit is permissible because the broker may deposit up to $1,500
key: A
explanation: Iowa Code §543B.46(4) allows a broker to deposit personal funds into a trust account
  only up to a total of one thousand dollars to cover bank service charges. The broker deposited
  $800 and later $300, for a total of $1,100, which exceeds the $1,000 limit. Therefore the deposit
  is impermissible.
