stem: A salesperson’s license was suspended by the Iowa Real Estate Commission, and the suspension
  order did not specify any terms for reinstatement. Under Iowa Admin. Code r. 481-2018.15(2), when
  may the salesperson first apply for reinstatement?
options:
  - After three years
  - After four years
  - After one year
  - After two years
key: D
explanation: The rule states that an initial application for reinstatement cannot be made until at
  least two years have elapsed from the date of the order when no terms were set. Therefore, the
  earliest the salesperson may apply is after two years. An option suggesting eligibility after one
  year contradicts the two‑year waiting period required by the provision.
