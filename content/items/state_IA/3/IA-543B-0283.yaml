stem: A wholesaler contracts to sell an equitable interest in a residential property to a buyer but
  fails to disclose that the wholesaler holds an equitable interest and may not be able to convey
  title. Under Iowa Code §543B.7(2)(a) and (c), what is the buyer’s remedy?
options:
  - The buyer may cancel the contract before closing without penalty and keep the wholesaler’s
    earnest money
  - The contract is void ab initio and the wholesaler forfeits all earnest money paid
  - The buyer must seek specific performance to compel the wholesaler to convey title
  - The wholesaler must pay a civil penalty of up to ten thousand dollars for the violation
key: A
explanation: Paragraph (c) provides that if the wholesaler fails to comply with the disclosure
  requirement under paragraph (a), the buyer may cancel the contract prior to closing without
  penalty and retain any earnest money paid. The distractor about a civil penalty is incorrect
  because the penalty is a separate sanction and not the immediate remedy for this disclosure
  failure.
citation:
  source: Iowa Code ch. 543B — Iowa Code Chapter 543B — Real Estate Brokers and Salespersons § 543B.7(2)(c)
  url: null
  quoted_text: Notwithstanding provisions to the contrary contained in a contract executed pursuant to
    this subsection, if a wholesaler fails to comply with the disclosure requirement under paragraph
    “a”, the seller or the buyer may cancel the contract at any time prior to the closing of the
    sale of the residential property without penalty, and may retain any earnest money paid by the
    wholesaler.
