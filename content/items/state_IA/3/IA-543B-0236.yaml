stem: Under Iowa Code §543B.7(4), what is the maximum civil penalty for an individual who engages in
  wholesaling in violation of that section?
options:
  - $10,000 or 10% of the sale price
  - $5,000 or 5% of the sale price
  - $20,000 or 20% of the sale price
  - $15,000 or 15% of the sale price
key: A
explanation: Iowa Code §543B.7(4) sets the penalty for wholesaling violations at the greater of
  $10,000 or 10% of the sale price of each residential property. The option stating $5,000 or 5% is
  incorrect because it reduces both the fixed amount and the percentage to half of the statutory
  values.
