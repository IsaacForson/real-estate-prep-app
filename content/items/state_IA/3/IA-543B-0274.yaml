stem: A licensee is found guilty of three separate violations of Iowa Code ch. 543B. What is the
  maximum total civil penalty that may be imposed under Iowa Code §543B.48?
options:
  - $2,500
  - $5,000
  - $7,500
  - $10,000
key: C
explanation: Section 543B.48 allows a civil penalty of up to $2,500 for each violation. For three
  violations, the maximum total is 3 × $2,500 = $7,500. The $5,000 option would only cover two
  violations, while $10,000 would correspond to four violations.
