stem: An unlicensed individual assists a buyer in negotiating the purchase of a residential property
  and receives a fee for this service. The property sells for $250,000. Under Iowa Code §543B.34(3),
  what is the maximum civil penalty that may be imposed?
options:
  - $10,000
  - $20,000
  - $25,000
  - $30,000
key: C
explanation: Under Iowa Code §543B.34(3), the civil penalty is the greater of $10,000 or 10% of the
  sale price. For a $250,000 sale, 10% equals $25,000, which is greater than $10,000, so the maximum
  penalty is $25,000. An amount of $20,000 is incorrect because it is less than 10% of the sale
  price and not the greater amount.
citation:
