math:
  worked_solution: |-
    Step 1: Calculate 10% of the sale price: 0.10 × $250,000 = $25,000.
    Step 2: Compare this to the fixed amount: $25,000 > $10,000.
    Step 3: The greater amount is $25,000, which is the maximum civil penalty.
  formulas:
