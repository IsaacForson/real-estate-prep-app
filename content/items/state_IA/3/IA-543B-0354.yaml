stem: Under Iowa Admin. Code r. 481-2018.6(1), which of the following must be included in a written
  complaint filed with the Iowa Real Estate Commission?
options:
  - The complainant’s signature, date of birth, and employer
  - The complainant’s full name, address, and telephone number
  - The complainant’s email address, phone number, and employer
  - The complainant’s mailing address, phone number, and email
key: B
explanation: The rule explicitly requires the complainant’s full name, address, and telephone number
  to be included in a written complaint. The distractor listing email address, phone number, and
  employer adds information not mandated by the rule.
