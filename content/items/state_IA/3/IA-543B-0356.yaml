stem: A complainant withdraws a written complaint before the respondent is officially notified.
  According to Iowa Admin. Code r. 481-2018.6(6), what authority does the commission retain?
options:
  - The commission must dismiss the matter and close the file immediately
  - The commission may choose to pursue the matter at its sole discretion
  - The commission must refer the matter to the district court for review
  - The commission may not take any further action once withdrawn
key: B
explanation: The rule allows the commission to pursue a matter even after a complaint has been
  withdrawn, at its sole discretion. The distractor stating the commission must dismiss the matter
  immediately is incorrect because the commission retains discretion to continue pursuit.
citation:
  source: Iowa Admin. Code r. 481-2018 — Iowa Administrative Code 481—Chapter 2018 — Investigations
    And Disciplinary Procedures (Real Estate Commission) 481—2018.6(6)
  url: null
  quoted_text: A complaint may be amended or withdrawn at any time prior to official notification of
    the respondent and thereafter at the sole discretion of the commission. The commission may
    choose to pursue a matter even after a complaint has been withdrawn.
