stem: A licensee representing a buyer learns of a pending special assessment on the property but
  does not disclose it to the buyer because the buyer did not ask. Under Iowa Code ch. 543B, this
  failure is prima facie evidence of a violation under which provision?
options:
  - Section 543B.61(1)
  - Section 543B.61(2)
  - Section 543B.56(2)(b)
  - Section 543B.57(1)
key: B
explanation: The licensee’s failure to disclose a material adverse fact violates the disclosure duty
  in Iowa Code §543B.56(2)(b). Under Iowa Code §543B.61(2), failure to act in accordance with
  disclosures made pursuant to sections 543B.56 through 543B.58 is prima facie evidence of a
  violation. The provision in Iowa Code §543B.61(1) concerns non‑compliance with sections
  543B.57‑543B.60, which does not match the scenario.
