stem: Which of the following is true regarding a licensee's attendance at an informal discussion
  under Iowa Admin. Code r. 481-2018.10(1)?
options:
  - The licensee must attend if the committee requests it.
  - The licensee may attend only with legal counsel present.
  - The licensee is not required to attend the discussion.
  - The licensee may bring a representative to the meeting.
key: C
explanation: Under Iowa Admin. Code r. 481-2018.10(1), licensees are not obligated to attend an
  informal discussion, so attendance is not required. A licensee may choose to attend with or
  without legal counsel; the rule does not limit attendance to those accompanied by counsel. The
  rule also does not mention bringing a representative, so the statement about bringing a
  representative is not supported.
