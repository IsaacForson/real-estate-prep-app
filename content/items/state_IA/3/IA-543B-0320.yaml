stem: A complaint filed with the Iowa Real Estate Commission in March 2024 is assigned the case
  number 24-057. What does the '057' portion of the case number indicate?
options:
  - The disciplinary committee assigned to the case.
  - The year the complaint was received.
  - The order in which the case file was opened.
  - The amount of civil penalty assessed.
key: C
explanation: The rule states that the second three digits of a case number represent the order in
  which the case file was opened. Therefore '057' indicates the fifty‑seventh case file opened in
  that year. The distractor about the year is incorrect because the year is shown by the first two
  digits.
