stem: A nonlicensed auctioneer conducts a public sale and, after the auction, attempts to close the
  sale of the property. Under Iowa Code §543B.7(5)(c), what civil penalty applies for this first
  offense?
options:
  - $0 penalty
  - $1,000 penalty
  - $2,000 penalty
  - $500 penalty
key: B
explanation: The statute imposes a $1,000 civil penalty for the first offense of an auctioneer
  acting beyond permitted acts. The $2,000 penalty option and the $500 penalty option do not match
  the statutory amounts for either a first or subsequent offense.
