stem: Under Iowa Code §543B.29(3), a licensee who is an owner or lessor of property may **NOT** have
  their license revoked or suspended for which of the following violations with respect to that
  property?
options:
  - Committing fraud by providing false information on a license application
  - Acting for more than one party without knowledge of all parties
  - Making misleading, deceptive, untrue, or fraudulent representations
  - Demonstrating a lack of competence in real estate practice
key: B
explanation: The exemption in §543B.29(3) excludes violations of §543B.34 subsection 1 paragraphs d,
  e, f, and i for owner‑lessor licensees; paragraph d covers acting for more than one party without
  the knowledge of all parties. The most tempting distractor, committing fraud by providing false
  information on a license application, corresponds to subsection 1 paragraph a, which is not
  exempt.
