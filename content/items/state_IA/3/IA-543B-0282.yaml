stem: Under Iowa Code §543B.7(2), what must a wholesaler disclose to parties in a wholesale transaction?
options:
  - The wholesaler must provide a copy of the deed to the buyer prior to closing
  - The wholesaler must disclose any liens on the property before signing
  - The wholesaler holds an equitable interest in the property and may not convey title
  - The wholesaler must obtain a broker’s license before entering contract
key: C
explanation: The statute requires the wholesaler to disclose that they hold an equitable interest in
  the property and may not be able to convey title. This is explicitly stated in the explanation of
  the wholesaling process. The distractor about providing a deed confuses the agency agreement
  requirement with a deed transfer.
