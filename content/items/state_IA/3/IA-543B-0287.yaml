stem: A licensee is convicted of a felony but fails to notify the commission within ten days. Under
  Iowa Code §543B.29(1), what is the consequence?
options:
  - The licensee's license is immediately suspended pending a hearing before the commission
  - The licensee's license is subject to a civil penalty of up to ten thousand dollars for the
    violation
  - The licensee's license is placed on probation for one year with mandatory continuing education
  - The licensee's license is revoked for failure to notify the commission of the felony conviction
key: D
explanation: The statute states that failure to notify the commission of a felony conviction within
  ten days is sufficient grounds for revocation of the license. Therefore the license is revoked,
  not merely suspended or penalized. The distractor suggesting immediate suspension applies only
  after notification and a hearing, not to a failure to notify.
