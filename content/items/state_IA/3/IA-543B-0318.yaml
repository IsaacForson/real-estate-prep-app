stem: A wholesaler fails to provide the required agency agreement before contracting to sell an
  equitable interest in a residential property that sells for $220,000. What is the maximum civil
  penalty that may be imposed under Iowa Code §543B.7(4)?
options:
  - $10,000
  - $22,000
  - $5,000
  - $30,000
key: B
explanation: The penalty is the greater of $10,000 or 10% of the sale price. Ten percent of $220,000
  is $22,000, which exceeds $10,000, so the maximum penalty is $22,000.
citation:
  source: Iowa Code ch. 543B — Iowa Code Chapter 543B — Real Estate Brokers and Salespersons §543B.7(4)
  url: null
  quoted_text: An individual engaged in wholesaling in violation of this section shall be subject to a
    civil penalty of up to the greater of ten thousand dollars, or ten percent of the sale price
  secondary: []
