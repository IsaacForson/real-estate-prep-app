stem: A wholesaler fails to provide a copy of the executed agency agreement to the buyer before
  executing a contract to purchase an equitable interest in a residential property. Under Iowa Code
  §543B.7(4), what is the maximum civil penalty that may be imposed for this violation if the sale
  price is $180,000?
options:
  - $25,000
  - $30,000
  - $10,000
  - $18,000
key: D
explanation: Ten percent of $180,000 is $18,000, which exceeds the $10,000 floor, so the penalty is
  the greater of the two amounts. The distractor of $10,000 incorrectly ignores the 10% of sale
  price provision.
citation:
  source: Iowa Code ch. 543B — Iowa Code Chapter 543B — Real Estate Brokers and Salespersons § 543B.7(4)
  url: null
  quoted_text: An individual engaged in wholesaling in violation of this section shall be subject to a
    civil penalty of up to the greater of ten thousand dollars, or ten percent of the sale price of
    each residential property for which the individual engaged in wholesaling in violation of this
    section.
  secondary: []
math:
  worked_solution: |-
    Calculate 10% of sale price: 0.10 × $180,000 = $18,000
    Compare to $10,000: $18,000 > $10,000
    Greater amount is $18,000
  formulas:
    - Penalty = max($10,000, 0.10 × sale price)
