stem: Under Iowa Code §543B.15(3)(a)(1), how many years must elapse after completion of
  incarceration for a felony involving forgery before an applicant may be considered for licensure?
options:
  - Five years
  - Three years
  - Four years
  - Six years
key: A
explanation: The statute specifies a five‑year waiting period for felonies that include forgery,
  embezzlement, theft, or similar offenses involving a criminal breach of fiduciary duty. The
  one‑year period applies only to offenses not described in that subparagraph that still involve
  moral turpitude.
