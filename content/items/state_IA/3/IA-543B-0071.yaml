stem: During a disciplinary hearing, a licensee refuses to provide requested documents. What power
  does the real estate commission have under Iowa Code §543B.36 to obtain the documents?
options:
  - Execute and sign a subpoena requiring the production of the documents
  - Impose a fine of $2,500 for noncompliance
  - Revoke the licensee's license immediately
  - Refer the matter to the county attorney for criminal prosecution
