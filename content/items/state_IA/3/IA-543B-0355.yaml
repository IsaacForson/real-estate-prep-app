stem: A complainant files a written complaint alleging that a licensee violated federal tax law,
  which is outside the Iowa Real Estate Commission’s jurisdiction. According to Iowa Admin. Code r.
  481-2018.6(5), what does the commission administrator do with this complaint?
options:
  - The determination of whether the allegations fall within the commission’s jurisdiction and
    whether the facts would constitute a basis for discipline
  - The notification of the respondent about the complaint and the recommended next steps for
    resolution, and outlines possible actions the commission may take
  - The scheduling of a preliminary hearing to review the complaint and inform all parties involved,
    and may include testimony from witnesses and review of evidence
  - The imposition of an administrative penalty on the licensee and notification to the complainant,
    and may include fines, license suspension, or other disciplinary measures
key: A
explanation: Under Iowa Admin. Code r. 481-2018.6(5), the administrator screens complaints to
  determine jurisdiction and whether the facts would support discipline. The distractor describing
  immediate notification of the respondent is incorrect because screening precedes any notification.
citation:
  source: Iowa Admin. Code r. 481-2018 — Iowa Administrative Code 481—Chapter 2018 — Investigations
    And Disciplinary Procedures (Real Estate Commission) 481—2018.6(5)
  url: null
  quoted_text: All written complaints received by the commission are initially screened by the
    commission’s administrator or designated staff to determine whether the allegations of the
    complaint fall within the commission’s investigatory jurisdiction and whether the facts
    presented, if true, would constitute a basis for disciplinary action against a licensee.
