stem: If a real estate broker’s license is revoked under Iowa Code §543B.29, what is the immediate
  effect on the licenses of salespersons employed by that broker?
options:
  - Automatic revocation of the licenses pending reemployment
  - Suspension of the licenses pending a new employer
  - No action required; licenses may be continued
  - Issuance of a new license to each salesperson
key: B
explanation: The statute provides that the revocation of a broker’s license automatically suspends
  every license granted to persons employed by that broker, pending a change of employer and
  issuance of a new license. Therefore, the salespersons’ licenses are suspended pending a new
  employer. The distractor “Automatic revocation of the licenses pending reemployment” is incorrect
  because the licenses are suspended, not revoked, upon the broker’s revocation.
