stem: What is the maximum civil penalty that may be imposed per violation under Iowa Code ch. 543B
  for licensee discipline?
options:
  - $1,000 per violation
  - $500 per violation
  - $5,000 per violation
  - $2,500 per violation
key: D
explanation: Iowa Code §543B.48 states that licensee discipline may include a civil penalty not to
  exceed two thousand five hundred dollars per violation. Therefore, the correct amount is $2,500
  per violation. The $1,000 figure applies to the limit for personal funds in a trust account, not
  to civil penalties.
