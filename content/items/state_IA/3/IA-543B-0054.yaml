stem: Under Iowa Code ch. 543B, what is the maximum civil penalty for an individual who engages in
  wholesaling in violation of the wholesaling disclosure requirements?
options:
  - the greater of $10,000 or 5% of the sale price
  - the greater of $10,000 or 10% of the sale price
  - the greater of $1,000 or 1% of the sale price
  - the greater of $5,000 or 5% of the sale price
key: B
explanation: Iowa Code §543B.7 provides that an individual engaged in wholesaling in violation of
  the disclosure requirement may be assessed a civil penalty of up to the greater of ten thousand
  dollars or ten percent of the sale price. Consequently, the answer choice that states the greater
  of $10,000 or 10% of the sale price is correct. The choice that states the greater of $10,000 or
  5% of the sale price is incorrect because the percentage is lower than the statutory ten percent.
  The choice that states the greater of $1,000 or 1% of the sale price is incorrect because both the
  dollar amount and percentage fall below the statutory minimums. The choice that states the greater
  of $5,000 or 5% of the sale price is incorrect because the dollar amount is less than ten thousand
  dollars.
