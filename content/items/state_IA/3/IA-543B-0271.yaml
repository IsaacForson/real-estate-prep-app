stem: A salesperson’s license is suspended by the Iowa Real Estate Commission. The licensee mails
  written notice to all clients eight days after receiving the commission’s final order. Under Iowa
  Admin. Code r. 481-2018, what is the consequence?
options:
  - Reapplication for licensure within thirty days
  - Payment of a twenty‑five hundred dollar civil penalty
  - Violation of the seven‑day notice requirement
  - Compliance with the seven‑day notice requirement
key: C
explanation: The rule mandates that notice to clients be given within seven days of receipt of the
  final order. Mailing the notice on the eighth day violates this requirement and may result in
  disciplinary action. The distractor about a civil penalty incorrectly assumes a fine applies for
  this specific notice failure.
