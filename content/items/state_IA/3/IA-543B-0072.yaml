stem: A former employee files a complaint against their former broker alleging license violations,
  and the complainant acted without malice. Under Iowa Admin. Code r. 481-2018, what is the
  complainant’s civil liability for filing the complaint?
options:
  - The complainant is not civilly liable unless the complaint was made with malice.
  - The complainant is not civilly liable under any circumstances in this proceeding.
  - The complainant is civilly liable because they are a former employee in this case.
  - The complainant is civilly liable for filing the complaint in this matter.
key: A
explanation: The rule states that a person is not civilly liable for filing a complaint unless the
  act is done with malice. Since the complainant acted without malice, they are not civilly liable.
  The distractor claiming liability regardless of intent ignores the malice exception granted by the
  rule.
