stem: A civil lawsuit subpoenas the Iowa Real Estate Commission for all complaint files related to a
  licensee. Under Iowa Admin. Code r. 481-2018.8, how may the commission respond to the subpoena?
options:
  - The commission may release only non‑confidential information.
  - The commission must notify the licensee before any release.
  - The commission may assert confidentiality and refuse to comply.
  - The commission must produce the files despite the subpoena request.
key: C
explanation: The rule declares complaint and investigative information privileged and confidential,
  not subject to discovery or subpoena, so the commission may assert confidentiality and refuse to
  comply. The distractor stating the commission must produce the files contradicts the
  confidentiality provision.
