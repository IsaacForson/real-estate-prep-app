stem: An auctioneer who is not a licensee closes the sale of a property during an auction, and this
  is the auctioneer's second violation of Iowa Code ch. 543B. What is the maximum civil penalty that
  may be imposed for this violation?
options:
  - the greater of $1,000 or 1% of the sales price
  - the greater of $10,000 or 10% of the sales price
  - the greater of $5,000 or 5% of the sales price
  - the greater of $10,000 or 5% of the sales price
key: B
explanation: For auctioneer violations, the first offense carries a $1,000 civil penalty, but each
  subsequent violation incurs a penalty of up to the greater of $10,000 or 10% of the real estate
  sales price. Since this is a second violation, the subsequent‑violation penalty applies. The
  choice stating the greater of $1,000 or 1% of the sales price reflects the first‑offense amount,
  while the choices stating the greater of $5,000 or 5% of the sales price and the greater of
  $10,000 or 5% of the sales price use incorrect percentages or dollar amounts.
