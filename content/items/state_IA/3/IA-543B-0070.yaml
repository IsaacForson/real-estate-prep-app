stem: A licensee is accused of violating Iowa Code §543B.1. What action may the real estate
  commission take regarding the complaint under Iowa Code §543B.44?
options:
  - Impose a civil penalty of up to $2,500 immediately
  - Suspend the licensee's license without a hearing
  - Refer the complaint to a court of competent jurisdiction
  - Require the licensee to complete additional continuing education
key: C
explanation: The statute expressly allows the commission to refer a complaint for violation of
  section 543B.1 to a court of competent jurisdiction. Imposing a civil penalty requires a separate
  process and is limited to $2,500 per violation under §543B.48.
