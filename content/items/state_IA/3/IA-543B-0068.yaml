stem: Under Iowa Code §543B.41, if the real estate commission determines that a licensee is guilty
  of a violation, what must the commission furnish to the licensee upon request?
options:
  - A definite statement of its findings of fact and its reason or reasons for the action
  - A copy of the hearing transcript and exhibits, along with any related documents and evidence
    presented
  - A notice of the licensee's right to appeal to district court, including the deadline and filing
    requirements
  - A refund of all licensing fees paid during the current year, including any renewal or late fees
key: A
explanation: The statute requires the commission to furnish a definite statement of its findings of
  fact and reasons for its action upon request. A copy of the hearing transcript is not mandated by
  this provision.
