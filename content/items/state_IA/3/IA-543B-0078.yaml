stem: A licensee fails to provide the written agency disclosure to a client prior to the client
  making an offer on a property. Under Iowa Code ch. 543B, this failure is prima facie evidence of a
  violation under which provision?
options:
  - Section 543B.61(1)
  - Section 543B.61(2)
  - Section 543B.57(2)(b)
  - Section 543B.58(1)
key: A
explanation: Under Iowa Code §543B.57(2)(b), a licensee must provide the written agency disclosure
  to a client before the client makes an offer. Failure to do so violates that subsection. Iowa Code
  §543B.61(1) provides that non‑compliance with any of sections 543B.57 through 543B.60 is prima
  facie evidence of a violation. Therefore, the correct provision is Section 543B.61(1). The option
  citing Section 543B.61(2) refers to a different subsection that does not cover this rule. The
  option citing Section 543B.58(1) addresses a separate duty unrelated to the pre‑offer disclosure
  requirement. The option citing Section 543B.57(2)(b) states the substantive duty but does not
  establish the prima facie evidence rule.
