stem: An applicant for a real estate broker license submits an application today. Their FBI criminal
  history check was completed 250 days ago. Under Iowa Code ch. 543B, what action must the
  commission take regarding the application?
options:
  - The commission shall process the application but hold delivery of the license until the
    background check is complete.
  - The commission shall waive the background check requirement due to the age of the check.
  - The commission shall reject and return the application to the applicant.
  - The commission shall approve the application because the check was completed within the required
    period.
key: C
explanation: Paragraph (9) of §543B.15 states that unless the criminal history check was completed
  within 210 days prior to the application date, the commission shall reject and return the
  application. Since the check was completed 250 days ago, the commission must reject and return it.
  The option about processing and holding delivery applies only when the check is within the 210‑day
  window.
