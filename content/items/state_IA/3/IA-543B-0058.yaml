stem: Under Iowa Code §543B.15(4), which of the following is specifically listed as a ground for
  denying an application for a real estate broker’s or salesperson’s license?
options:
  - An applicant who has had a professional license revoked or suspended in any jurisdiction
  - An applicant who has been convicted of a felony involving embezzlement
  - An applicant who has made a false statement of material fact on the application
  - An applicant who has not completed the required sixty contact hours of education
key: A
explanation: Paragraph (4) of §543B.15 states that an applicant who has had a professional license
  revoked or suspended or any other form of discipline imposed may be denied a license on those
  grounds. The correct option matches this language exactly. The option about a felony conviction is
  a ground for denial under paragraph (3), not paragraph (4), so it is not the specific subsection
  asked.
