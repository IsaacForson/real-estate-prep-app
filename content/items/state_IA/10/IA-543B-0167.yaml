stem: A licensee directs an unlicensed assistant to record and deposit earnest money received from a
  buyer. Under Iowa Admin. Code r. 481-2007, is this activity permitted?
options:
  - No, it is not permitted because earnest money may only be handled by individuals holding a real
    estate license.
  - Yes, it is permitted provided the assistant has received written approval from the designated
    broker.
  - No, it is not permitted because earnest money may only be handled by licensed real estate
    professionals.
  - Yes, it is permitted because recording and depositing earnest money is a permitted activity for
    unlicensed support personnel.
key: D
explanation: The rule explicitly lists recording and depositing earnest money as a permitted
  activity for unlicensed support personnel working under a licensee's supervision. The most
  tempting distractor incorrectly suggests that individual written approval from the broker is
  required, but the rule only mandates that the broker maintain a written company policy authorizing
  support personnel and provide copies of the duties, not case‑by‑case approval.
