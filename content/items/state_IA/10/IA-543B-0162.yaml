stem: A licensee directs an unlicensed assistant to type a purchase agreement for a buyer. Under
  Iowa Admin. Code r. 481-2007, is this activity permitted?
options:
  - The activity is not permitted because assistants may not handle any contract documents.
  - The activity is not permitted because preparing contracts requires discretion and judgment.
  - The activity is permitted because typing contract forms as directed is a permitted ministerial
    duty.
  - The activity is permitted only if the assistant holds a real estate license.
key: C
explanation: The rule lists typing contract forms as directed as a permitted activity for unlicensed
  support personnel. This task is considered ministerial and does not require discretion. Therefore,
  directing an assistant to type a purchase agreement is allowed.
