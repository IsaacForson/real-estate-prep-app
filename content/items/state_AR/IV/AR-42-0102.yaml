stem: What must the Arkansas Real Estate Commission maintain in writing or electronic format
  according to § 17-42-203(e)(1)?
options:
  - A list of the names and addresses of all active licensees
  - A list of the names and addresses of all inactive licensees
  - A list of the names and addresses of all brokerage firms
  - A list of the names and addresses of all real estate schools
key: A
explanation: Ark. Code Ann. § 17-42-203(e)(1) requires the commission to keep a written or
  electronic list of the names and addresses of every licensee who is currently active.
  Consequently, a list of active licensees satisfies the statutory requirement, whereas lists of
  schools, brokerage firms, or inactive licensees are not mandated by this provision.
