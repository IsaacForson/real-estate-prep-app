stem: Under Arkansas law, which of the following disqualifies an applicant from receiving a real
  estate license?
options:
  - A bankruptcy filing
  - A civil judgment for breach of contract
  - A felony listed under § 17-3-102
  - A misdemeanor traffic violation
key: C
explanation: The statute provides that a person shall not receive or hold a license if convicted of
  or pleading guilty or nolo contendere to a felony listed under § 17-3-102 or a crime involving
  violence, fraud, dishonesty, untruthfulness, or untrustworthiness. A misdemeanor traffic violation
  does not trigger this prohibition.
