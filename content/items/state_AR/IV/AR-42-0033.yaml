stem: Under Arkansas Real Estate Commission Rules, what is a licensee's duty when they obtain
  knowledge of a possible violation of the license law or commission regulations?
options:
  - The licensee must submit a written report to the Commission within five days of learning of the
    violation
  - The licensee must inform the principal broker verbally within five days of learning of the
    violation
  - The licensee must file a written report with the Commission within thirty days of learning of
    the violation
  - The licensee must wait until the next renewal period to report the violation
key: C
explanation: Rule 10.14 requires licensees to report in writing any information that is or may be a
  violation of the license law or commission regulations. The rule does not specify a five‑day limit
  or require notification to the principal broker; it mandates a written report to the Commission.
  Waiting until renewal is not permitted.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 10.14
  url: null
  quoted_text: It is the duty of each licensee to report in writing to the Commission any information
    coming to the licensee's knowledge which is or may be (1) a violation of the Arkansas Real
    Estate License Law; or (2) a violation of the Commission Regulations.
