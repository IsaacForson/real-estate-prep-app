stem: Under Arkansas Real Estate Commission Rule 10.14, what is a licensee's duty regarding
  reporting violations?
options:
  - Must report in writing to the Commission any information that is or may be a violation of the
    Arkansas Real Estate License Law or the Commission Regulations.
  - Must report in writing to the Commission only violations that the licensee directly committed,
    regardless of when they occurred.
  - Must report in writing to the Commission any suspected violations after informing their
    supervising broker, as required by Commission rule.
  - Must report in writing to the Commission only after receiving a formal complaint from a client,
    even if the complaint is anonymous.
key: A
explanation: Arkansas Real Estate Commission Rule 10.14 requires licensees to report in writing any
  information that is or may be a violation of the Arkansas Real Estate License Law or the
  Commission Regulations. Therefore the correct choice is the one stating that licensees must report
  any such information in writing. The other choices incorrectly limit the duty to only violations
  the licensee committed, require a formal complaint, or add steps such as informing a supervising
  broker, which are not required by the rule.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 10.14
  url: null
  quoted_text: It is the duty of each licensee to report in writing to the Commission any information
    coming to the licensee's knowledge which is or may be (1) a violation of the Arkansas Real
    Estate License Law; or (2) a violation of the Commission Regulations.
