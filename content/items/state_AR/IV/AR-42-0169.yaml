stem: An applicant for a real estate license had her cosmetology license revoked by the State Board
  of Cosmetology on January 10. She submits her real estate license application on March 1.
  According to Arkansas Real Estate Commission Rules, when must she submit the written report of the
  cosmetology license revocation?
options:
  - Only if requested by the Commission
  - With the real estate license application
  - Within thirty days of the revocation
  - After the cosmetology license is reinstated
key: B
explanation: Rule 10.16(c) requires an applicant who has had a professional license denied, revoked,
  suspended, or canceled to furnish the written report at the time the application is submitted if
  the action has already occurred. Since the revocation occurred before the application, the report
  must accompany the application. Reporting within thirty days of the revocation applies to new
  convictions, not prior license actions.
