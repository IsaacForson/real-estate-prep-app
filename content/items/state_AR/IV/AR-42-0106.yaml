stem: An individual seeks to register as a time-share interest transfer service provider in
  Arkansas. They have obtained a surety bond for $20,000. According to Arkansas Real Estate
  Commission Rules, is this bond sufficient for registration?
options:
  - No, because the required bond is $25,000
  - Yes, because a cash deposit may supplement the bond
  - Yes, because the minimum bond is $15,000
  - No, because the bond must be exactly $10,000
key: A
explanation: The rule sets the bond amount for a time‑share interest transfer service provider at
  $25,000, which must be met by a surety bond, corporate bond, or cash bond of that amount. A
  $20,000 bond falls short of this requirement, so it is insufficient. The other options either
  misstate the required amount or incorrectly suggest that a lesser bond is acceptable.
