stem: According to Arkansas Real Estate Commission Rule 10.16(a), which of the following must a
  licensee include in the written report of a criminal conviction (other than a traffic violation)?
options:
  - The report must include the licensee's explanation of the circumstances which led to the charge
    and conviction or plea.
  - The report must include the licensee's preferred method of communication with clients as
    required by the Commission's internal guidelines.
  - The report must include the licensee's current business address and telephone number as recorded
    in the Commission's licensee database.
  - The report must include the licensee's signature and date of submission along with a copy of the
    charging document and the judgment of conviction.
key: A
explanation: The rule explicitly requires the licensee's explanation of the circumstances leading to
  the charge and conviction or plea to be included in the report. The other options add information
  not mandated by the rule, such as preferred communication methods, business address details, or
  signature and submission date, which are not required provisions.
