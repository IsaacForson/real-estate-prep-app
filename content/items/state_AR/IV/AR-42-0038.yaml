stem: A buyer signs a time-share purchase contract on a Thursday. If the fifth day after signing
  falls on a Sunday, what is the last day the buyer may cancel the contract without penalty under
  Arkansas Real Estate Commission Rules?
options:
  - Friday
  - Saturday
  - Monday
  - Tuesday
key: C
explanation: Rule 13.4(d) provides that if the fifth day after contract execution is a Saturday,
  Sunday, or legal holiday, the cancellation period extends to the next day that is not a Saturday,
  Sunday, or legal holiday. Therefore, a Sunday fifth day pushes the deadline to Monday.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 13.4
  url: null
  quoted_text: Should the fifth day after the execution of the contract for purchase of a time-share
    interest be a Saturday, Sunday or legal holiday, then the five (5) day cancellation period shall
    not expire until the end of the next day which is not a Saturday, Sunday or legal holiday.
