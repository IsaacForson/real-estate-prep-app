stem: A licensee is convicted of a felony fraud on April 5, 2025, and pleads guilty. According to
  Arkansas Real Estate Commission Rules, which of the following must be included in the written
  report to the Commission?
options:
  - The licensee's explanation of the circumstances which led to the charge and conviction
  - The licensee's current employer name, address, and telephone number
  - The licensee's social security number, date of birth, and driver's license number
  - The licensee's favorite hobby, leisure activities, and recent travel destinations
key: A
explanation: The rule requires the report to include the licensee's explanation of the circumstances
  that led to the charge and conviction. The other items, such as employer details or personal
  hobbies, are not mandated by the regulation.
