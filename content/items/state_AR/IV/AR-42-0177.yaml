stem: Under Arkansas Real Estate Commission Rules, what information must a licensee include in a
  written report of a criminal conviction (other than a traffic violation) submitted to the
  Commission?
options:
  - The report must include the date of the offense, the licensee’s explanation of the
    circumstances, a copy of the charging document, the name of the attorney, and any other relevant
    information the licensee wishes to submit.
  - The report must include the date of the offense, the fine imposed, the court’s address, the
    licensee’s explanation of the circumstances, and any other relevant information the licensee
    wishes to submit to the Commission for consideration.
  - The report must include the date of the conviction, the type of sanction imposed, the licensee’s
    employment history, the court’s name, and any other relevant information the licensee wishes to
    provide to the Commission for consideration.
  - The report must include the date of the offense and conviction, the court’s name and address,
    the specific crime, the fine or penalty, copies of the charging document and judgment, and the
    licensee’s explanation of the circumstances.
key: D
explanation: "Arkansas Real Estate Commission Rules § 10.16(a) requires that a written report of a
  criminal conviction (other than a traffic violation) include the date of the offense and
  conviction, the name and address of the court, the specific crime, the fine or penalty imposed,
  copies of the charging document and judgment, and the licensee’s explanation of the circumstances.
  The option that lists all of these elements is the one stating: 'The report must include the date
  of the offense and conviction, the court’s name and address, the specific crime, the fine or
  penalty, copies of the charging document and judgment, and the licensee’s explanation of the
  circumstances.' The other options are incorrect because each omits at least one required element:
  one lacks the court’s address, the specific crime, and the fine or penalty; another omits the
  court’s address and the specific crime; and another replaces the court’s address and specific
  crime with employment history and omits copies of the charging document and judgment."
