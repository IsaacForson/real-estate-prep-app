stem: A licensee participates in a real estate auction and is accused of violating auction rules.
  Which entity has sole jurisdiction over the licensee's actions in the auction?
options:
  - The Auctioneer's Licensing Board
  - The Arkansas Real Estate Commission
  - The circuit court where the auction is held
  - The licensee's principal broker
key: B
explanation: The statute states that, notwithstanding the requirement for auctioneer licensing, the
  commission shall have sole jurisdiction over licensees and their actions when participating in
  real estate auctions. Therefore, the Arkansas Real Estate Commission, not the Auctioneer's
  Licensing Board, holds exclusive authority.
