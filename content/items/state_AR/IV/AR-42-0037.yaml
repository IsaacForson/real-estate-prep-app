stem: A licensee pleads guilty to a misdemeanor fraud offense (not a traffic violation) on March 10.
  According to Arkansas Real Estate Commission Rules, by what date must the licensee submit a
  written report of the conviction to the Commission?
options:
  - April 9
  - March 31
  - April 10
  - May 10
key: A
explanation: Rule 10.16(a) requires a written report within thirty (30) days after a conviction or
  plea for any crime other than a traffic violation. Adding thirty days to March 10 yields April 9.
  March 31 is too early, April 10 adds an extra day, and May 10 is far beyond the required period.
