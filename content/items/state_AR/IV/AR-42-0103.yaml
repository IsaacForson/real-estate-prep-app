stem: An applicant for a real estate license was convicted of a felony fraud offense three years
  ago, has held steady employment since the conviction, and provides character references. According
  to § 17-42-315(g)(2), which factor may the Commission consider when deciding whether to grant a
  waiver of the criminal background check prohibition?
options:
  - The applicant's credit score
  - The applicant's subsequent work history
  - The applicant's marital status
  - The applicant's favorite color
key: B
explanation: Under § 17-42-315(g)(2)(D), the Commission may consider the applicant's subsequent work
  history when deciding whether to grant a waiver of the criminal background check prohibition. The
  applicant's credit score is not listed as a factor the Commission may consider. Marital status is
  not listed as a factor the Commission may consider. Favorite color is not listed as a factor the
  Commission may consider.
