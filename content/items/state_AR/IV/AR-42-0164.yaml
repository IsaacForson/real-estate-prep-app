stem: Under Ark. Code Ann. § 17-42-203(e)(1), what must the Arkansas Real Estate Commission maintain
  in writing or electronic format?
options:
  - A list of the names and addresses of all active licensees
  - A list of the names and addresses of all sanctioned licensees
  - A list of the dates and locations of all scheduled institutes
  - A list of the procedures for conducting real estate auctions
key: A
explanation: The statute requires the commission to maintain a list of the names and addresses of
  all active licensees. The distractor about sanctioned licensees is incorrect because while the
  commission may publish names of sanctioned persons under subsection (e)(2), it is not required to
  maintain such a list.
