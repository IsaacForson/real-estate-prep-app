stem: Which qualification is required for a member of the Arkansas Real Estate Commission who
  represents consumers?
options:
  - Must be actively engaged in the real estate business
  - Must be sixty years of age or older to represent consumers
  - Must not be actively engaged in or retired from real estate
  - Must have been a licensed broker for at least five years
key: C
explanation: The law requires that the two commission members who are not actively engaged in or
  retired from the business of real estate include one who represents consumers. Therefore, the
  consumer representative must not be actively engaged in or retired from real estate. The
  distractor claiming the member must be sixty years or older describes the elderly representative,
  not the consumer representative.
