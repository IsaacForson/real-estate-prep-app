stem: The commission wishes to inform the public about disciplinary actions. Under which authority
  may it release the names of sanctioned individuals?
options:
  - Publishing the names of all persons sanctioned under § 17-42-312 in writing or electronic format.
  - Publishing the annual financial audit of the commission in writing or electronic format.
  - Publishing the minutes of every commission meeting in writing or electronic format.
  - Publishing the list of active licensees in writing or electronic format.
