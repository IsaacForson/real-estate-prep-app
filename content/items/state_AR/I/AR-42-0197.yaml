stem: After the Arkansas Real Estate Commission pays $7,500 to a consumer from the Real Estate
  Recovery Fund due to a licensee's violation, the licensee must reimburse the commission plus
  interest. What is the maximum annual interest rate that the commission may charge under Ark. Code
  Ann. § 17-42-409?
options:
  - The maximum annual interest rate is twelve percent (12%) per annum.
  - The maximum annual interest rate is fifteen percent (15%) per annum.
  - The maximum annual interest rate is eight percent (8%) per annum.
  - The maximum annual interest rate is ten percent (10%) per annum.
key: D
explanation: Under Ark. Code Ann. § 17-42-409, the interest rate on reimbursement from the Real
  Estate Recovery Fund may not exceed ten percent per annum. Therefore the commission may charge up
  to ten percent; any higher rate is not permitted.
