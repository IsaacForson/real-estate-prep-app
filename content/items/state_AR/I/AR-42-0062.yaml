stem: The Arkansas Real Estate Commission wishes to invest a portion of the Real Estate Recovery
  Fund in a certificate of deposit. According to Ark. Code Ann. § 17-42-404(b), what must the
  commission do before making this investment?
options:
  - Obtain the advice of the State Board of Finance
  - Hold a public hearing on the investment proposal
  - Submit the plan to the Arkansas Legislature for approval
  - Notify all licensees of the intended investment via email
key: A
explanation: Ark. Code Ann. § 17‑42‑404(b) provides that the commission may invest and reinvest the
  fund’s assets only after receiving the advice of the State Board of Finance. Consequently, the
  commission must obtain that advice before proceeding with the certificate of deposit investment.
  The statute does not require a public hearing, legislative approval, or notification of licensees
  for this action.
