stem: Under Arkansas Real Estate Commission Rule 9.1, what must a complaint against a licensee include?
options:
  - The complaint must be filed with the circuit court of the complainant's county.
  - The complaint must be in writing, signed under oath, dated, and filed with the director.
  - The complaint must be notarized and accompanied by a fifty-dollar filing fee.
  - The complaint must be submitted electronically to the commission within five business days.
key: B
explanation: Rule 9.1 states that complaints must be in writing, signed by the complainant under
  oath, dated, and filed with the director. The other options describe procedures not required by
  this rule.
