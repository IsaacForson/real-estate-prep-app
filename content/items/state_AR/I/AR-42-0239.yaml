stem: Under Ark. Code Ann. § 17-42-312(c), what action may the Arkansas Real Estate Commission take
  regarding sanctions it has imposed?
options:
  - Suspend the imposition of sanctions under appropriate terms
  - Increase the penalty amount above the statutory limit
  - Require the licensee to complete additional education
  - Refer the matter to the federal court for enforcement
key: A
explanation: The statute expressly allows the commission to suspend the imposition of any sanctions
  upon appropriate terms and conditions. Increasing the penalty beyond the statutory maximum is not
  permitted, referring to federal court is outside the commission’s authority, and requiring
  additional education beyond what was originally ordered is not a power granted under this
  subsection.
