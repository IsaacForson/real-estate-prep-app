stem: What limitation does Ark. Code Ann. § 17-42-404(a) place on the fees the Arkansas Real Estate
  Commission may set for the Real Estate Recovery Fund?
options:
  - The fees shall not exceed the limits set forth in § 17-42-405
  - The fees must be set at exactly twenty-five dollars per licensee
  - The fees may be adjusted only during biennial legislative sessions
  - The fees require approval from the Arkansas Governor before implementation
key: A
explanation: The statute allows the commission to set fees it deems necessary, but requires that
  those fees not exceed the maximum amount established in Ark. Code Ann. § 17‑42‑405. Thus the only
  accurate statement is that the fees shall not exceed the limits set in § 17‑42‑405. The other
  statements are incorrect because the law does not fix a specific dollar amount, does not limit
  adjustments to biennial legislative sessions, and does not require the governor’s approval.
