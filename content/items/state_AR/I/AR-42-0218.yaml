stem: A person is applying for their first real estate license in Arkansas. What is the maximum fee
  they may be required to pay to the Arkansas Real Estate Commission for the Real Estate Recovery
  Fund?
options:
  - $25.00
  - $10.00
  - $50.00
  - $0.00
key: A
explanation: Under Ark. Code Ann. § 17-42-405(b), a first-time licensee must pay a fee not to exceed
  twenty-five dollars ($25.00). The $0.00 option is incorrect because the statute requires a fee for
  the benefit of the Real Estate Recovery Fund.
