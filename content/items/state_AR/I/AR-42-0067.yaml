stem: The Arkansas Real Estate Commission needs to hire additional staff to handle increased
  licensing applications. Who has the authority to employ the executive director and necessary
  staff?
options:
  - The Governor of Arkansas who appoints commissioners
  - The Arkansas Realtors Association that advises the Governor
  - The Arkansas Real Estate Commission that employs staff
  - The Arkansas State Senate that confirms appointments
key: C
explanation: The statute states that the commission shall employ an executive director and such
  staff as necessary. The Governor appoints commissioners but does not employ staff, and the
  association and senate have no such authority.
