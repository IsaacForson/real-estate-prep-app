  source: Ark. Code Ann. § 17-42-101 et seq. — Arkansas Real Estate License Law and Time-Share Law
    (AREC compilation, August 2024) — § 17-42-202
  url: null
  quoted_text: The commission shall employ an executive director and such staff as may be necessary to
    carry out the provisions of this chapter and to put into effect the rules the commission may
    promulgate.
