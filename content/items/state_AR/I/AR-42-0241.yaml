  quoted_text: the Arkansas Real Estate Commission shall not investigate the actions of or conduct any
    disciplinary hearing regarding any real estate broker or salesperson unless the complaint is
    filed or the investigation initiated within three (3) years from the date of the actions
    complained of or concerning which an investigation is initiated.
