stem: A complainant alleges that a licensee committed violations four years ago and files a
  complaint today. The commission has not initiated any investigation prior to the complaint. May
  the Arkansas Real Estate Commission conduct a disciplinary hearing regarding these allegations
  under Ark. Code Ann. § 17-42-314(b)?
options:
  - The commission may proceed because the allegations involve serious violations
  - The commission may not proceed because the complaint was filed more than three years after the
    actions
  - The commission may proceed if the licensee waives the three‑year limitation
  - The commission may not proceed unless the complainant submits additional evidence
key: B
explanation: The statute prohibits the commission from investigating or conducting a disciplinary
  hearing unless the complaint is filed or an investigation is initiated within three years of the
  actions. The seriousness of the allegations, a waiver by the licensee, or additional evidence do
  not override this time limitation.
