stem: A complainant's written complaint against a licensee is dismissed by the Executive Director
  without a hearing. Under Ark. Code Ann. § 17-42-313(a)(1), how many days does the complainant have
  to file a written request for appeal with the commission?
options:
  - 30 days
  - 60 days
  - 90 days
  - 120 days
key: B
explanation: The rule states that a request for appeal must be in writing and received by the
  commission not later than sixty days following the date of dismissal. Thirty, ninety, and one
  hundred twenty days do not match the statutory timeframe for filing an appeal.
