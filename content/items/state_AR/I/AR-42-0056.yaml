stem: The Real Estate Recovery Fund currently has a balance of $180,000. Under Ark. Code Ann. §
  17-42-405(a), what is the maximum additional fee the Arkansas Real Estate Commission may charge
  each licensee at annual renewal?
options:
  - $35.00
  - $30.00
  - $25.00
  - $20.00
key: C
explanation: The commission may charge the lesser of $25 or the amount needed to restore the fund to
  $250,000. The shortfall is $70,000, so the lesser amount is $25. Thus the maximum permissible fee
  is $25 per renewal.
