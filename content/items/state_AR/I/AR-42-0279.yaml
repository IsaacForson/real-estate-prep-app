stem: Under Arkansas Real Estate Commission Rule 10.7(a)(1), what must a licensee do with money
  received that belongs to others in connection with a real estate transaction?
options:
  - Hold it until the closing of the transaction
  - Immediately deliver it to the principal broker
  - Deposit it in the licensee's personal account
  - Return it to the client within twenty-four hours
key: B
explanation: The rule requires a licensee to immediately deliver any money belonging to others to
  the principal broker. The distractor about depositing it in the licensee's personal account
  violates this duty to turn over client funds.
citation:
  source: "### Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate
    Commission Regulations, Time-Share Regulations (April 2024) — § 10.7(a)(1)"
  url: null
  quoted_text: A licensee shall immediately deliver to the principal broker any money or other
    consideration received in connection with a real estate transaction which belongs to others,
    such as escrow or trust funds, clients' moneys, earnest moneys, rents, advance fees, deposits,
    etc.
