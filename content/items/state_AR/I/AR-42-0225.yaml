stem: A 58-year-old individual who has been a licensed real estate broker for 7 years is nominated
  to the Arkansas Real Estate Commission. Which position could this individual fill?
options:
  - A member who must have been licensed for at least five years
  - A member who must be sixty years of age or older to serve on the commission
  - A member who must not be actively engaged in real estate
  - A member who must represent consumers in commission matters
key: A
explanation: The nominee meets the requirement of having been licensed for at least five years,
  qualifying them for one of the three member positions reserved for licensed brokers or
  salespersons. The distractor suggesting they must not be actively engaged in real estate applies
  to the two members who represent consumers and the elderly, which the nominee does not satisfy
  because they are actively engaged as a broker.
