stem: A broker receives an advance fee for advertising services but fails to obtain a written
  agreement signed by the fee owner within a reasonable time. According to Arkansas Real Estate
  Commission Rule 10.7(a)(2), what must the broker do with the advance fee?
options:
  - Deposit it in the trust account
  - Refund it to the fee owner
  - Transfer it to the recovery fund
  - Apply it to future commissions
key: B
explanation: 'The rule states: "If such written agreement is not received within a reasonable time
  after payment of the advance fee, the fee shall be refunded to the owner." Therefore the broker
  must refund the fee. The distractor "Deposit it in the trust account" is incorrect because without
  a written agreement the fee must be refunded, not retained.'
