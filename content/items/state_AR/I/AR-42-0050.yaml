stem: A disciplinary hearing results in the commission paying $5,000 to a claimant. The licensee has
  not yet repaid the amount. What action must the commission take regarding the licensee’s license?
options:
  - Issue a citation but allow the license to remain active pending repayment, subject to further
    review.
  - Revoke the license immediately, regardless of whether reimbursement is made, as a disciplinary
    sanction.
  - Place the license on probation for six months while the licensee repays the amount, with
    possible extension.
  - Suspend the license until the licensee fully reimburses the commission, plus interest not
    exceeding ten percent per annum.
key: D
explanation: Under Ark. Code Ann. § 17-42-409(3), when the commission pays a claimant and the
  licensee has not reimbursed that amount, the commission must immediately suspend the licensee’s
  license until the licensee fully reimburses the commission, plus interest that may not exceed ten
  percent per annum. Therefore the correct action is to suspend the license until full repayment
  with allowable interest.
citation:
  source: Ark. Code Ann. § 17-42-409
  url: null
  quoted_text: In addition to any other disciplinary action taken against the licensee on the merits
    of the hearing, his or her license shall be immediately suspended until he or she has completely
    reimbursed the commission for the payment, plus interest at a rate to be determined by the
    commission. The rate shall not exceed ten percent (10%) per annum.
