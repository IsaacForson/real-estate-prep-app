  quoted_text: |-
    The request for appeal must be in writing and received in the office of the commission not later
    than sixty (60) days following the date of dismissal by the executive director;
    (2) The request for appeal must be accompanied by such filing fee as the commission may require
    pursuant to § 17-42-304
