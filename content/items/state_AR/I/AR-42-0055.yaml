stem: A consumer files a written complaint against a salesperson. The Executive Director dismisses
  the complaint without a hearing. The consumer wishes to appeal the dismissal. According to Ark.
  Code Ann. § 17-42-313, what must the consumer do within 60 days of the dismissal?
options:
  - The consumer must appear before the commission to give oral testimony within thirty days.
  - The consumer must file a written request for appeal accompanied by the required filing fee.
  - The consumer must request a continuance of the dismissal hearing from the director within thirty
    days.
  - The consumer must submit a notarized affidavit and pay a fifty-dollar penalty within sixty days.
key: B
explanation: Section 17-42-313(a)(1)-(2) requires a written request for appeal received within 60
  days of dismissal, accompanied by the filing fee required by the commission. Appearing to give
  testimony, submitting an affidavit with a penalty, or requesting a continuance are not the
  prescribed steps.
citation:
  source: "### Ark. Code Ann. § 17-42-101 et seq. — Arkansas Real Estate License Law and Time-Share
    Law (AREC compilation, August 2024) — § 17-42-313"
