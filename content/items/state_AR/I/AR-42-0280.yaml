stem: A salesperson receives an earnest money deposit from a buyer while showing a property.
  According to Arkansas Real Estate Commission Rule 10.7(a)(1), what is the salesperson's immediate
  obligation regarding the deposit?
options:
  - Give the deposit to the buyer's attorney for holding
  - Deposit the money in the salesperson's trust account promptly
  - Immediately deliver the deposit to the principal broker
  - Hold the deposit until the seller signs the agreement
key: C
explanation: The rule mandates that any money received that belongs to others must be immediately
  delivered to the principal broker. The distractor suggesting deposit in the salesperson's trust
  account incorrectly allows the licensee to retain the funds.
citation:
  source: "### Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate
    Commission Regulations, Time-Share Regulations (April 2024) — § 10.7(a)(1)"
  url: null
  quoted_text: A licensee shall immediately deliver to the principal broker any money or other
    consideration received in connection with a real estate transaction which belongs to others,
    such as escrow or trust funds, clients' moneys, earnest moneys, rents, advance fees, deposits,
    etc.
