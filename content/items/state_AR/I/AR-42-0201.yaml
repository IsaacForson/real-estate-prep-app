stem: A principal broker refuses to allow commission investigators to review the firm's transaction
  records stored at the office. According to Arkansas Real Estate Commission Rule 10.7(b)(3), what
  is the correct statement regarding the broker's obligation?
options:
  - Provide access to investigators
  - Deny access to investigators
  - Charge investigators a fee
  - Allow investigators to copy records
key: A
explanation: The rule requires records to be open to inspection by and made available to the
  investigative staff. Therefore the broker must provide access. The distractor "Deny access to
  investigators" is incorrect because the rule mandates access, not denial.
