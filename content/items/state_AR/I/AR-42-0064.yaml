stem: Under Ark. Code Ann. § 17-42-312(a)(2), what action must the Executive Director take if a
  complaint fails to state a prima facie case?
options:
  - The executive director shall dismiss the complaint
  - The executive director shall issue a citation
  - The executive director shall refer the matter to circuit court
  - The executive director shall require a formal hearing
key: A
explanation: The statute requires the Executive Director to dismiss a complaint when it fails to
  state a prima facie case or when there is insufficient proof of a violation. Issuing a citation,
  referring to circuit court, or ordering a hearing are actions reserved for cases where sufficient
  proof exists or other specific conditions are met.
