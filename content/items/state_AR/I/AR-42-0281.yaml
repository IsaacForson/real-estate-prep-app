stem: A broker collects an advance fee for advertising services and obtains a written agreement
  signed by the fee owner. According to Arkansas Real Estate Commission Rule 10.7(a)(2), what must
  the broker do with the advance fee?
options:
  - Deposit the fee in the broker's trust account and disburse as agreed
  - Transfer the fee to the Arkansas Real Estate Commission today
  - Keep the fee in the broker's operating account until the advertising is completed
  - Refund the fee to the owner immediately upon written request
key: A
explanation: The rule requires advance fees to be deposited in the broker's trust account and
  disbursed only per the written agreement. The distractor about keeping the fee in the operating
  account fails to place the funds in the required trust account.
citation:
  source: "### Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate
    Commission Regulations, Time-Share Regulations (April 2024) — § 10.7(a)(2)"
  url: null
  quoted_text: A broker shall deposit all advance fees in the broker's trust account and shall
    disburse such funds only in accordance with the terms of a written agreement signed by the owner
    of the funds. If such written agreement is not received within a reasonable time after payment
    of the advance fee, the fee shall be refunded to the owner.
