stem: A licensee wants to have a witness present at an upcoming disciplinary hearing. Under Arkansas
  Real Estate Commission Rule 9.5, what must the licensee do to request the Commission's aid in
  procuring the witness?
options:
  - The licensee must submit a written petition signed and dated to the director at least ten days
    before the hearing.
  - The licensee must notify the hearing officer orally at least five days before the hearing.
  - The licensee must file a motion for continuance with the commission office before the hearing.
  - The licensee must pay a witness fee to the commission before the hearing begins and provide
    proof of payment.
key: A
explanation: Rule 9.5(b) states that a respondent may, by written petition signed and dated, invoke
  the Commission's aid to procure a witness, provided the petition is filed with the director at
  least ten days prior to the hearing. Oral notification, filing a continuance motion, or paying a
  witness fee do not satisfy this requirement.
