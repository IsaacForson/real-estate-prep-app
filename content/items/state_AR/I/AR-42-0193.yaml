stem: The director receives a complaint alleging a licensee failed to remit escrow funds. What
  action may the director take as part of the investigation?
options:
  - Revoke the licensee's license and schedule a hearing
  - Issue a subpoena duces tecum to obtain relevant documents
  - Refer the complaint to the Attorney General for prosecution
  - Require the licensee to pay a fine before any investigation
key: B
explanation: Rule 9.3 authorizes the director to utilize the Commission's subpoena powers to obtain
  documents during an investigation. Revoking a license or imposing a fine requires Commission
  action after a hearing, not the director alone.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 9.3
  url: null
  quoted_text: The director may conduct such investigation as is deemed warranted either before or
    after the answer is received, and in conducting such investigation, may take statements from any
    person thought to have any knowledge of the facts or allegations pertaining to the complaint and
    may also obtain and review any documents which may relate to the complaint. The director may
    utilize the subpoena powers of the Commission in connection with the investigation.
