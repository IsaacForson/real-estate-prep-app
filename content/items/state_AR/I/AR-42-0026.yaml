stem: A broker receives a citation for advertising in violation of the chapter and does not pay or
  dispute the citation within 30 days. What may the commission do regarding the broker's failure to
  respond?
options:
  - Dismiss the citation without hearing
  - Suspend the license immediately
  - Treat nonresponse as a violation
  - Refer the matter to counsel for review
key: C
explanation: The commission may treat the failure to respond within thirty days of a citation’s
  issuance as a violation of the chapter, punishable by the penalties in subsection (a). Thus the
  appropriate action is to treat the nonresponse as a violation. Dismissing the citation outright
  contradicts the rule that nonresponse is treated as a violation. Suspending the license promptly
  or referring the matter to counsel are not authorized responses to a simple failure to respond
  under this provision.
