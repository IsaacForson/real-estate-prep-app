stem: A licensee receives a citation for failing to complete annual education requirements. Within
  30 days, the licensee files a verified written complaint contesting the citation. What is the
  result under Ark. Code Ann. § 17-42-312(d)(5)(B)?
options:
  - The citation is dismissed and no further action is taken
  - The licensee must pay the penalty within 30 days or face additional fines
  - The licensee shall be provided a hearing before the commission under § 17-42-314
  - The commission may immediately suspend the licensee’s license pending investigation
key: C
explanation: If a licensee disputes a citation by timely filing a verified written complaint, the
  statute requires the commission to provide a hearing under § 17-42-314. The citation is not
  automatically dismissed, the licensee is not forced to pay the penalty, and the commission cannot
  impose additional sanctions such as suspension without a hearing.
