stem: Under Ark. Code Ann. § 17-42-312(d)(1)(A)(i), what is the maximum penalty that may be imposed
  by citation for a broker or salesperson who fails to complete annual education requirements?
options:
  - $100.00
  - $50.00
  - $250.00
  - $500.00
key: A
explanation: The rule provides that a citation may impose a penalty of not more than one hundred
  dollars ($100) for a broker or salesperson who fails to complete annual education requirements.
  Thus the maximum penalty is $100. The $250 distractor corresponds to the penalty for practicing
  with an expired license, which is a separate violation. The $50 and $500 amounts are not supported
  by the statute for this specific offense.
