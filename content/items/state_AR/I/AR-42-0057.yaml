stem: After the Arkansas Real Estate Commission pays a claim from the Real Estate Recovery Fund, the
  licensee must reimburse the commission plus interest. What is the maximum annual interest rate the
  commission may charge under Ark. Code Ann. § 17-42-409(3)?
options:
