stem: A licensee files a timely appeal of a dismissed complaint. The commission reviews the appeal
  and orders a hearing on the complaint. What happens to the filing fee and the cost of preparing
  the record?
options:
  - The filing fee is refunded and the cost of preparing the record is retained.
  - The filing fee and cost of preparing the record are refunded to the licensee.
  - The filing fee and cost of preparing the record are retained by the commission.
  - The filing fee is retained and the cost of preparing the record is refunded.
key: B
explanation: If the commission's review results in a hearing being ordered, both the filing fee and
  the cost of preparing the record shall be refunded to the appellant under § 17-42-313(b)(3)(B).
