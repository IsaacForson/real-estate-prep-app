stem: During a commission hearing, a licensee requests that a subpoena be issued for a witness to
  produce documents. Who is responsible for paying the fees and mileage of the officer serving the
  subpoena and the witness?
options:
  - The commission staff
  - The requesting licensee
  - The witness in the case
  - The circuit court judge
key: B
explanation: Section 17-42-205(b)(2)(B) provides that the party requesting the subpoena pays the
  fees and mileage. Since the licensee made the request, they bear the cost. The other options
  incorrectly assign payment to the commission, witness, or court.
citation:
