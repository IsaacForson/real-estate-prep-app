stem: Under Ark. Code Ann. § 17-42-312(b), what action may the Arkansas Real Estate Commission take
  if a penalty assessed under this chapter is **NOT** paid as ordered?
options:
  - The commission may file a lawsuit in Pulaski County Circuit Court or the circuit court where the
    defendant resides or does business to collect the penalty.
  - The commission may suspend the licensee's license after a hearing and require payment of the
    penalty before any reinstatement is considered.
  - The commission may issue a citation imposing an additional penalty of one hundred dollars for
    failure to pay the assessed penalty.
  - The commission may require the licensee to complete additional education and submit proof before
    the license can be renewed.
key: A
explanation: The key is correct because § 17-42-312(b) authorizes the commission to file suit to
  collect unpaid penalties. The distractor about suspending the license is not authorized under this
  subsection; suspension is a separate sanction under subsection (a)(4)(A).
