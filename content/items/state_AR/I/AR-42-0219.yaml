stem: After the commission pays $6,000 to a claimant from the Real Estate Recovery Fund due to a
  licensee's violation, what is the maximum amount the licensee could owe after one year if interest
  accrues at the maximum allowable rate?
options:
  - $6,300.00
  - $6,600.00
  - $6,000.00
  - $7,200.00
key: B
explanation: The licensee must reimburse the commission for the payment plus interest at a rate not
  exceeding ten percent per annum under Ark. Code Ann. § 17-42-409(3). At the maximum rate, interest
  on $6,000 is $600, making the total owed $6,600. The $6,000.00 option omits interest, while
  $7,200.00 incorrectly assumes a 20% rate.
