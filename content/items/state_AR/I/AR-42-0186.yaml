stem: Which of the following is a permissible use of the Real Estate Recovery Fund under Ark. Code
  Ann. § 17-42-404(c)?
options:
  - To cover the commission's office utilities
  - To pay sales commissions to real agents
  - To pay annual commission staff salaries
  - To fund educational seminars for licensees
key: D
explanation: The statute authorizes the commission to use fund assets for educational seminars and
  other educational projects for licensees. Paying sales commissions to brokers is not listed as an
  allowable use of the fund.
