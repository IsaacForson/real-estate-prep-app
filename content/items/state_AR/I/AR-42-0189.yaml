stem: Under Ark. Code Ann. § 17-42-407(a), what type of damages may the Arkansas Real Estate
  Commission award to an aggrieved party?
options:
  - Exemplary damages awarded
  - Interest on damages awarded
  - Punitive damages awarded
  - Actual compensatory damages
key: D
explanation: The statute limits the commission’s authority to actual, compensatory damages;
  therefore only that type may be awarded. Punitive, exemplary, and interest damages are expressly
  prohibited by the same subsection.
