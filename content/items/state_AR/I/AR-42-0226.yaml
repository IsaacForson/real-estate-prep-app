stem: A broker receives a payment for advertising services before the advertising is performed.
  According to Arkansas Real Estate Commission Rule 10.7(a)(3), how is this payment classified?
options:
  - The payment is considered a reimbursement
  - The payment is considered a commission
  - The payment is considered a deposit
  - The payment is considered an advance fee
key: D
explanation: Rule 10.7(a)(3) defines an advance fee as any fee charged for services to be paid in
  advance of rendering those services, including fees for listing, advertising, or offering real
  property. The distractor describing the payment as a commission incorrectly assumes the fee is
  earned upon performance, which contradicts the advance payment timing.
citation:
