stem: Under Arkansas law, how may the Arkansas Real Estate Commission handle the assets of the Real
  Estate Recovery Fund?
options:
  - To invest and reinvest the assets with the advice of the State Board of Finance.
  - To use the assets to pay the commission’s administrative salaries and operating expenses.
  - To place the assets in a separate escrow account for each real estate transaction conducted.
  - To distribute the assets as direct rebates to all licensees statewide in accordance with
    commission policy.
key: A
explanation: Under Ark. Code Ann. § 17-42-404(b), the commission may invest and reinvest the fund’s
  assets, but only with the advice of the State Board of Finance. The law does not authorize using
  the assets to pay salaries, to hold them in escrow for individual transactions, or to distribute
  them as rebates to licensees.
