stem: A salesperson continues to show properties and negotiate offers after her license expired on
  June 30. The executive director issues a citation. What is the maximum penalty that may be imposed
  by citation for performing activities that require an active real estate license while the license
  is expired?
options:
  - $500.00
  - $100.00
  - $250.00
  - $1000.00
key: C
explanation: The statute authorizes a citation penalty of not more than two hundred fifty dollars
  ($250) for a broker, salesperson, or supervising broker when a licensee performs activities
  requiring an active license while the license is expired. Therefore, the maximum penalty in this
  scenario is $250. The $100 amount applies to education failures, not to conduct with an expired
  license. The $500 and $1000 figures exceed the statutory limit for this violation.
citation:
  source: Ark. Code Ann. § 17-42-101 et seq. — Arkansas Real Estate License Law and Time-Share Law
    (AREC compilation, August 2024) — § 17-42-312
  url: null
  quoted_text: "(B) A penalty of not more than two hundred fifty dollars ($250) to a broker,
    salesperson, or the supervising broker of a broker or salesperson if a broker or salesperson:
    (i) Performs activities that require an active real estate license while his or her license is
    expired;"
