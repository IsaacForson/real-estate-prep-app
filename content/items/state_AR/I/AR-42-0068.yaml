stem: A group of licensees requests the Arkansas Real Estate Commission to host a continuing
  education seminar. What may the commission do under its powers?
options:
  - The commission may conduct or assist in conducting the seminar and pay expenses, open to all
    licensees
  - The commission may require each licensee to pay a fee to cover the seminar's costs
  - The commission may limit attendance to only those licensees who have completed their
    post‑license education
  - The commission may decline the request because the commission lacks authority to host
    educational events
key: A
explanation: The statute authorizes the commission to conduct or assist in conducting institutes and
  seminars, to pay reasonable and necessary expenses, and to keep them open to all licensees.
  Requiring licensees to pay fees or limiting attendance is not supported by this provision.
