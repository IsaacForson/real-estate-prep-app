stem: A principal broker reconciles the trust account bank statements every quarter (every three
  months). Is this practice compliant with Rule 10.8(g)(2)?
options:
  - The broker's practice is compliant as long as the broker keeps copies for three years.
  - The broker's practice is not compliant because the broker must reconcile weekly.
  - The broker's practice is not compliant because reconciliation must be performed at least monthly.
  - The broker's practice is compliant because quarterly reconciliation meets the requirement.
key: C
explanation: The rule requires trust account bank statements to be reconciled in writing at least
  monthly. Quarterly reconciliation does not meet this minimum frequency, making the practice
  noncompliant. The option suggesting compliance if copies are kept for three years confuses the
  retention period with the reconciliation frequency.
