stem: According to Arkansas Real Estate Commission Rule 10.6, what must a licensee do to avoid
  intentional or negligent misrepresentation when listing a property?
options:
  - The licensee shall exert reasonable efforts to ascertain material facts about the property
  - The licensee shall obtain a written appraisal from a licensed appraiser
  - The licensee shall rely solely on the seller's disclosures
  - The licensee shall advertise the property using only online platforms
key: A
explanation: Rule 10.6 requires a licensee to exert reasonable efforts to ascertain material facts
  about a property to avoid intentional or negligent misrepresentation. The other options either
  impose additional requirements not stated in the rule or permit reliance on insufficient sources.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 10.6
  url: null
  quoted_text: A licensee shall exert reasonable efforts to ascertain those facts which are material
    to the value or desirability of every property for which the licensee accepts the agency, so
    that in offering the property the licensee will be informed about its condition and thus able to
    avoid intentional or negligent misrepresentation to the public concerning such property.
