stem: According to Arkansas Real Estate Commission Rule 10.18(c), how is a 'Tenant' defined?
options:
  - A person who rents a property on other than a nightly basis.
  - A person who rents a property on a nightly basis.
  - A person who owns the property and resides there.
  - A person who manages the property for the owner.
