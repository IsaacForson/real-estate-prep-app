stem: Under Arkansas Real Estate Commission Rule 10.4(a)(2), what may an executive broker do when
  designated by a principal broker?
options:
  - The executive broker may prepare closing statements for clients
  - The executive broker may independently negotiate commissions with third parties
  - The executive broker may sign offer and acceptance forms as supervising broker
  - The executive broker may advertise properties under a different firm name
key: C
explanation: Rule 10.4(a)(2) explicitly states that an executive broker may sign offer and
  acceptance forms as supervising broker. The other options describe actions not authorized by this
  rule.
