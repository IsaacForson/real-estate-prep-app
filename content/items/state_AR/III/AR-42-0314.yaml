stem: A licensee receives earnest money from a buyer during a property showing. Under Arkansas Real
  Estate Commission Rule 10.7(a)(1), what must the licensee do with the earnest money?
options:
  - Hold the earnest money until the purchase contract is signed
  - Forward the earnest money to the buyer's attorney for safekeeping
  - Deliver the earnest money immediately to the principal broker
  - Deposit the earnest money into the licensee's personal escrow account
key: C
explanation: Rule 10.7(a)(1) mandates that any money belonging to others, including earnest money,
  be delivered immediately to the principal broker. The distractor suggesting deposit into a
  personal escrow account violates the prohibition against commingling trust funds with personal
  funds.
citation:
  source: Arkansas Real Estate Commission Rules § 10.7(a)(1)
  url: null
  quoted_text: A licensee shall immediately deliver to the principal broker any money or other
    consideration received in connection with a real estate transaction which belongs to others,
    such as escrow or trust funds, clients' moneys, earnest moneys, rents, advance fees, deposits,
    etc.
