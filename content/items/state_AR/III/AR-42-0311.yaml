stem: A principal broker learns on June 1, 2024 that a salesperson licensed under them has been
  engaging in real estate activities independently through another broker without permission.
  According to Arkansas Real Estate Commission Rule 10.1(a), what must the principal broker do?
options:
  - The principal broker must immediately notify the Commission in writing and forward the
    licensee's license to the Commission.
  - The principal broker must wait 24 hours before notifying the Commission in writing.
  - The principal broker must issue a written warning to the licensee and retain the license.
  - The principal broker must take no action unless a complaint is filed with the Commission.
key: A
explanation: Rule 10.1(a) imposes the duty to immediately notify the Commission in writing and
  forward the licensee's license when a licensee engages in real estate activities independently
  without permission. Waiting 24 hours, issuing a warning, or taking no action unless a complaint is
  filed does not satisfy the immediate notification requirement.
citation:
  source: Arkansas Real Estate Commission Rule 10.1(a)
  url: null
  quoted_text: If a principal broker or executive broker learns a salesperson, associate broker or
    executive broker licensed under such principal broker or executive broker has, without
    permission of the principal broker or executive broker, engaged in real estate activities
    independently or through some other broker, it is the duty of the principal broker or executive
    broker to immediately notify the Commission in writing and forward such licensee's license to
    the Commission.
