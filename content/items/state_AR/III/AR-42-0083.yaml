stem: A licensee prepares a buyer representation agreement for a client but does not include an
  expiration date. According to Rule 10.2, what must the licensee do?
options:
  - Leave the agreement open-ended for flexibility
  - Add a specific determinable duration or expiration date
  - Have the client sign a separate addendum later
  - Assume a default six-month term for the contract
key: B
explanation: Rule 10.2 requires a licensee to put a specific determinable duration or a specific
  expiration date on all written agency agreements or contracts or any extensions thereof.
  Therefore, the licensee must add a specific determinable duration or expiration date to the
  agreement. The distractor proposing to have the client sign a separate addendum later is incorrect
  because the rule demands the duration or date be included in the agreement itself, not added
  later.
