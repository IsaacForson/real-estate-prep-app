stem: A licensee obtained their Arkansas real estate license due to a clerical error by the testing
  agency, and the license was issued despite the licensee not meeting the education requirement.
  According to Ark. Code Ann. § 17-42-311(b), what is the consequence for this license?
options:
  - Subject to a small fine
  - Subject to probation
  - Subject to revocation
  - Subject to no action
key: C
explanation: The key is correct because § 17-42-311(b) states that any license obtained through
  mistake or inadvertence shall be subject to revocation. The scenario describes a license issued
  due to a clerical error, which qualifies as a mistake. Therefore the license is subject to
  revocation. The distractor suggesting a fine is incorrect because the statute prescribes
  revocation, not a monetary penalty, for this type of error.
