stem: A principal broker opens a new trust account for the firm. What information must the broker
  submit in writing to the Arkansas Real Estate Commission regarding this account?
options:
  - The broker's personal Social Security number and the account's interest rate.
  - The name and number of the account, name and address of the bank, and date the account was
    opened.
  - The total amount of trust funds deposited and the broker's commission schedule.
  - The names of all licensees who will have access to the account and the monthly service charge.
key: B
explanation: Rule 10.8(e) mandates submission of the account name and number, bank name and address,
  and the date the account was opened. The distractor about the broker's Social Security number and
  interest rate is not required by this regulation.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
