stem: Under Arkansas Real Estate Commission Rule 10.8(g)(1), within how many days after the
  execution of a real estate contract must trust funds be deposited in the trust account, delivered
  to an escrow agent, or deposited pursuant to a written agreement by the seller and buyer?
options:
  - Five (5) days
  - Three (3) days
  - Ten (10) days
  - Seven (7) days
key: B
explanation: The rule states that trust funds must be deposited no later than three (3) days
  following execution of the contract, with weekend/holiday extension. Therefore, three days is the
  correct period. The five‑day option incorrectly adds extra days not permitted by the rule.
citation:
