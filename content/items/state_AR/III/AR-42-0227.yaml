    Regulations, Time-Share Regulations (April 2024) — § 10.8(g)(1)
  url: null
  quoted_text: No later than three (3) days following the execution of a real estate contract by both
    seller and buyer, all trust funds delivered to the principal broker, shall be either deposited
    in the trust account, delivered to an escrow agent, or deposited pursuant to a written agreement
    by the seller and buyer
