stem: Maria holds a principal broker license and works full-time as a high school teacher. She
  wishes to hire a licensed salesperson to assist with real estate transactions under her broker's
  license. She can provide no evidence that her teaching job is related to real estate. According to
  Rule 10.4(e), may Maria employ the salesperson?
options:
  - Yes, because she holds a broker license and may hire any licensed salesperson.
  - Yes, if she pays the salesperson a commission based on transaction volume.
  - No, because she cannot overcome the presumption that she is engaged in a non‑real estate field.
  - Yes, as long as the salesperson works only on weekends and does not handle closings.
key: C
explanation: Rule 10.4(e) creates a presumption that a broker who works outside real estate is
  engaged in a non‑real estate field. To overcome that presumption, the broker must show that the
  outside employment is related to real estate and is conducted in the same office as the broker’s
  real estate business. Maria provides no evidence that her teaching job is related to real estate,
  so she cannot overcome the presumption and may not employ a salesperson under her broker license.
  The statement that she may hire any licensed salesperson because she holds a broker license
  ignores this presumption, while the statement that she cannot overcome the presumption correctly
  reflects the rule.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 10.4(e)
  url: null
  quoted_text: This presumption may be overcome by proof that such employment or engagement is (1) in
    a real estate related field, and (2) conducted in the same office as the broker's real estate
    business.
