stem: A property manager prepares a written property management agreement but omits any description
  of the monthly statements of accounting that will be provided to the owner. To comply with
  Arkansas Real Estate Commission Rule 10.19(a)(6), what must the property manager do?
options:
  - The property manager must prepare the monthly statements before signing the agreement
  - The property manager must obtain the owner's verbal approval of the accounting method
  - The property manager must submit the monthly statements to the Arkansas Real Estate Commission
  - The property manager must include a description of the monthly statements of accounting in the
    agreement
key: D
explanation: The rule mandates that the agreement include a description of the monthly statements of
  accounting the property manager will provide to the owner. Stating that verbal approval of the
  accounting method is required is incorrect, as the rule does not specify that.
