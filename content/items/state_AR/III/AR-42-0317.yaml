stem: A licensee prepares a broker's price opinion for a buyer who is considering making an offer on
  a property. The licensee also represents the seller in the same transaction. To comply with
  Arkansas Real Estate Commission Rule 10.15(a)(4), what must the licensee do?
options:
  - The licensee must refuse to prepare the broker's price opinion due to the conflict of interest
  - The licensee must obtain written consent from the buyer before issuing the broker's price opinion
  - The licensee must provide the broker's price opinion only to the seller, not the buyer
  - The licensee must disclose their representation of the seller in the broker's price opinion
key: D
explanation: The licensee must disclose their representation of the seller in the broker's price
  opinion. Arkansas Real Estate Commission Rule 10.15(a)(4) requires disclosure of any existing or
  contemplated interest of the licensee preparing the broker's price opinion, including representing
  the seller or lessor. Obtaining written consent from the buyer is not required by the rule.
