stem: A property manager receives funds from a prospective tenant who later decides not to rent the
  unit. According to Arkansas Real Estate Commission Rule 10.23(e), what may the property manager do
  instead of maintaining an individual tenant ledger for that prospective tenant?
options:
  - Keep a record of funds from prospective tenants who do not rent
  - Combine the funds with the owner’s ledger for the property
  - Refund the funds immediately to the prospective tenant
  - Deposit the funds into a trust account without documentation
key: A
explanation: Rule 10.23(e) permits a property manager to maintain a separate record of receipts from
  prospective tenants who do not become tenants, rather than creating an individual tenant ledger.
  The distractor suggesting an immediate refund is incorrect because the rule does not require
  refunding; it only provides an alternative recordkeeping method.
