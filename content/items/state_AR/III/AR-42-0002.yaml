stem: A salesperson negotiates a sale for a buyer and also collects a fee from the seller for the
  same transaction, without either party knowing the salesperson is acting for both. Which
  prohibited act under section 17-42-311 has occurred?
options:
  - Making a substantial misrepresentation to a party in the transaction
  - Failing to remit money belonging to another within a reasonable time
  - Advertising the transaction in a false or misleading manner
  - Acting for more than one party without the knowledge of every party
key: D
explanation: Section 17-42-311 prohibits acting for more than one party in a transaction without the
  knowledge of all parties for whom the licensee acts, or accepting consideration from anyone other
  than the licensed principal broker.
