stem: A licensee wants to purchase a property listed with her own firm for her personal investment
  portfolio. Under Rule 10.11, what must the licensee do before entering the sales contract?
options:
  - Transfer her license to an unrelated firm before submitting the offer
  - Disclose in writing that she is a licensee buying for her own account
  - Wait twelve months after the listing expires before making an offer
  - Obtain a court order approving the licensee's purchase of the property
key: B
explanation: Rule 10.11 requires a licensee who buys property for her own account to first make full
  written disclosure of the exact facts that she is a licensed broker or salesperson buying the
  property, before the sales contract is entered into.
