stem: According to Arkansas Code Ann. § 17-42-103, what is the definition of an 'associate broker'?
options:
  - An individual who has a broker's license and who is employed by a principal broker, or is
    associated with a principal broker as an independent contractor, and who performs only clerical
    tasks for the principal broker.
  - An individual who has a salesperson's license and is employed by a principal broker, or is
    associated with a principal broker as an independent contractor, and who participates in any
    activity described in subdivision (10) of this section while under the supervision of a
    principal broker or executive broker.
  - An individual who has a broker's license and who is employed by a principal broker, or is
    associated with a principal broker as an independent contractor, and who participates in any
    activity described in subdivision (10) of this section while under the supervision of a
    principal broker or executive broker.
  - An individual who has a broker's license and who is employed by a principal broker, or is
    associated with a principal broker as an independent contractor, and who supervises associate
    brokers and salespersons.
key: C
explanation: The correct answer mirrors the statutory definition of an associate broker, which
  requires a broker's license, employment or association with a principal broker, participation in
  real estate activities under supervision, and excludes supervisory authority. The most tempting
  distractor incorrectly substitutes a salesperson's license for the required broker's license.
