stem: A property manager prepares a written property management agreement but omits any mention of
  when the management fee is earned and paid. Under Arkansas Real Estate Commission Rule
  10.19(a)(5), what must the property manager do to comply?
options:
  - The property manager must submit the agreement to the Arkansas Real Estate Commission for
    approval
  - The property manager must amend the agreement to include when the management fee is earned and
    paid
  - The property manager may continue using the agreement as written because fee timing is optional
  - The property manager must collect the fee only after receiving written consent from the owner
key: B
explanation: Rule 10.19(a)(5) requires the property management agreement to specify when management
  fees are earned and paid. Omitting this term violates the rule, so the agreement must be amended
  to include the timing. The suggestion that fee timing is optional contradicts the explicit
  requirement.
