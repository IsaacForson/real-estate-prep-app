stem: A continuing education course provides fifty-five (55) minutes of actual classroom instruction
  with the instructor present. Under Arkansas Code Ann. § 17-42-103, does this instruction qualify
  as a classroom hour?
options:
  - The instruction qualifies as a classroom hour because any period of actual classroom instruction
    counts.
  - The instruction does not qualify as a classroom hour because it lasts more than sixty minutes.
  - The instruction does not qualify as a classroom hour because it lasts less than fifty minutes.
  - The instruction qualifies as a classroom hour because it lasts between fifty and sixty minutes.
key: D
explanation: Fifty-five minutes falls within the range of at least fifty minutes and no more than
  sixty minutes specified in the definition of a classroom hour. Therefore the instruction meets the
  criteria.
