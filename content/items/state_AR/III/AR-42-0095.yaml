stem: A salesperson prepares a purchase agreement for a buyer and seller without the principal
  broker's involvement. Under Arkansas Real Estate Commission Rule 10.4(d), what must be true for
  the preparation of the agreement to be compliant?
options:
  - Must be performed by or under the specific supervision of the principal broker
  - Must be filed with the Commission within 24 hours of preparation and retention
  - Must be notarized before submission to the principal broker for approval
  - Must be reviewed by the executive broker before any instruments are finalized
key: A
explanation: Rule 10.4(d) requires that preparation of instruments be performed by or under the
  specific supervision of the principal broker. The most tempting distractor is C, which suggests
  filing with the Commission within 24 hours; however the rule does not impose a filing deadline for
  instrument preparation.
