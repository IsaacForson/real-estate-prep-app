stem: A property manager wants to lease a unit he manages to a prospective tenant. According to
  Arkansas Real Estate Commission Rule 10.20(a), what must he have before proceeding with the lease?
options:
  - The property manager must obtain a signed lease addendum from the tenant before leasing the
    property.
  - The property manager must obtain a verbal promise from the tenant before leasing the property.
  - The property manager must obtain a written agreement with the tenant before leasing the property.
  - The property manager must obtain an oral agreement with the tenant before leasing the property.
key: C
explanation: Rule 10.20(a) states that a property manager shall not lease property he manages
  without a written agreement with the tenant. Therefore, a written agreement is required. An oral
  agreement or verbal promise does not satisfy the rule's requirement for a written agreement.
