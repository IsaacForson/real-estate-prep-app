stem: A property manager receives cash from a tenant for rent and security deposit and prepares a
  receipt but prints it only as a single copy. According to Arkansas Real Estate Commission Rule
  10.24(a), what must the property manager do to comply?
options:
  - Keeping the receipt in the property manager's personal file
  - Printing the receipt in at least duplicate form
  - Providing the receipt to the tenant within 24 hours
  - Handwriting the receipt instead of printing it
key: B
explanation: Rule 10.24(a) requires cash receipts to be printed in at least duplicate form, so the
  manager must produce two copies. Handwriting the receipt does not satisfy the printing
  requirement, and providing it within 24 hours or keeping it personally does not address the
  duplicate‑form mandate.
