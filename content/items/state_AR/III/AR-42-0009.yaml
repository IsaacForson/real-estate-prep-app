stem: A selling licensee wants to contact the seller directly about showing a property that is
  subject to another firm's exclusive listing contract. Under Rule 10.13, what must occur first?
options:
  - The selling licensee waits until the exclusive listing contract expires
  - The selling licensee records a competing listing contract with the seller
  - The selling licensee obtains prior permission from the listing firm
  - The selling licensee files a complaint with the Arkansas Real Estate Commission
key: C
explanation: Rule 10.13(a) provides that when a firm holds an exclusive listing contract, the
  selling licensee shall not contact the seller about showing the property or negotiating the sale
  without prior permission from the listing firm.
