stem: A property manager receives cash from a tenant for rent and security deposit but does not
  provide a receipt. Under Arkansas Real Estate Commission Rule 10.24(a), what must the property
  manager do?
options:
  - The property manager must deposit the cash into a trust account within 24 hours and notify the
    owner
  - The property manager must inform the tenant that receipts are optional for cash payments and
    obtain written waiver
  - The property manager must prepare a legible written receipt for the cash funds and keep a copy
  - The property manager may accept cash without a receipt if the amount is less than $100 and the
    tenant agrees
key: C
explanation: Rule 10.24(a) requires a legible written receipt for any cash funds received and that a
  copy be maintained in the property manager's records. The other options introduce conditions or
  actions not found in the rule.
citation:
  source: "### Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate
    Commission Regulations, Time-Share Regulations (April 2024) — § 10.24"
  url: null
  quoted_text: If a property manager chooses to accept cash, he or his designee must prepare a legible
    written receipt for any cash funds received under a property management agreement or from a
    prospective tenant. A copy of the receipt must be maintained in the property manager's records.
