stem: Under Arkansas Real Estate Commission Rule 10.7, how long must a principal broker maintain
  complete records of all real estate business handled by the firm?
options:
  - The broker must retain records for three years, or longer if state law mandates a longer period.
  - The broker must retain records for one year, unless state law requires a longer period.
  - The broker must retain records for two years, unless state law requires a longer period.
  - The broker must retain records for five years, unless state law requires a longer period.
key: A
explanation: Rule 10.7 requires records to be kept for three years or longer if law requires a
  longer period. The other options incorrectly state shorter or fixed periods that do not account
  for the 'whichever is greater' provision.
