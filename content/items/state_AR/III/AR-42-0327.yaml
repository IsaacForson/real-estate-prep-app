stem: A licensee advertises a property using only her personal cell phone number in the
  advertisement, and the advertisement clearly states she is affiliated with XYZ Realty. According
  to Rule 10.5(c), is this permissible?
options:
  - Yes, because the licensee's connection with the broker is obvious in the advertisement.
  - No, unless the licensee obtains written permission from the principal broker to use an
    individual number.
  - No, because the advertisement must include the firm's name in addition to the licensee's contact
    information.
  - Yes, but only if the advertisement also includes the licensee's email address.
key: A
explanation: Rule 10.5(c) permits a licensee to use an individual name or telephone number in public
  advertising when the licensee's connection with the broker is obvious in the advertisement.
  Because the advertisement clearly states the licensee is affiliated with XYZ Realty, that
  connection is obvious, so using her personal cell phone number is allowed. The option stating that
  the use is permissible because the connection is obvious correctly reflects this rule. The option
  claiming that written permission from the principal broker is required misstates the rule, as
  permission is not needed when the connection is obvious. The option asserting that the firm's name
  must be added regardless of an obvious connection adds a requirement not present in the rule. The
  option conditioning permissibility on also including an email address introduces an extra
  condition that the rule does not impose.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 10.5(c)
  url: null
  quoted_text: In public advertising a principal broker shall be especially careful to present a true
    picture and should not permit licensees to use individual names or telephone numbers, unless the
    licensee's connection with the broker is obvious in the advertisement.
