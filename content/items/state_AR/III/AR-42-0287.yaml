stem: A licensee prepares a broker's price opinion for a seller who is considering listing the
  property. To comply with Arkansas Real Estate Commission Rule 10.15(a)(1), what must the licensee
  include in the broker's price opinion?
options:
  - An estimate of the property's market value.
  - A brief description of the subject property.
  - An analysis of the property's zoning classification.
  - A summary of recent sales in the area.
key: B
explanation: Rule 10.15(a)(1) requires a brief description of the subject property in the broker's
  price opinion. The distractor about market value is incorrect because the rule prohibits using
  terms like “market value” in such opinions.
