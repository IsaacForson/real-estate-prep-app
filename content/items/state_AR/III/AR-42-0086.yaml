stem: A licensee prepares a purchase agreement for a buyer and seller, obtains signatures from both
  parties, but only gives the seller a copy of the signed agreement and does not provide the buyer
  with a copy. According to Arkansas Real Estate Commission Rule 10.10(a), what has the licensee
  failed to do?
options:
  - Failed to see that the exact agreement of the parties regarding real estate is in writing.
  - Failed to see that clients and other parties to the transaction receive copies of such
    agreements signed by all parties.
  - Failed to obtain written acknowledgment from the buyer and seller that they have received said
    signed copies.
  - Failed to have the agreement approved by a licensed Arkansas attorney prior to use.
key: B
explanation: Rule 10.10(a) requires the licensee to ensure that clients and other parties receive
  copies of the signed agreement. By not giving the buyer a copy, the licensee violated this duty.
  The option stating the licensee failed to see that the exact agreement is in writing is incorrect
  because the agreement was already in writing; the failure was not about the writing itself.
citation:
