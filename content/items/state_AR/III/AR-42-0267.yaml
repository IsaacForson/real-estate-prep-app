key: C
explanation: Rule 10.8(g)(2) requires that copies of trust account bank statement reconciliations be
  kept for at least three years or as required by law, whichever is greater. This ensures records
  are available for Commission inspection. The three‑year period is the minimum unless state law
  mandates a longer retention.
