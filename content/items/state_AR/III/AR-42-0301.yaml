stem: A licensee who owns a rental property and has a written agreement with the tenant allowing the
  licensee to keep the security deposit in the licensee's separate account receives a security
  deposit from the tenant. According to Arkansas Real Estate Commission Rule 10.8(h)(1), where must
  the security deposit be deposited?
options:
  - The security deposit must be deposited in the principal broker's trust account as required by
    rule
  - The security deposit must be deposited in the licensee's separate account as per the written
    agreement with the tenant
  - The security deposit must be deposited in an account designated by the tenant for the security
    deposit
  - The security deposit must be deposited in an escrow account mutually agreed upon by the parties
key: B
explanation: "Rule 10.8(h)(1) provides an exception to the general rule that security deposits go to
  the principal broker's trust account: if the property‑owning licensee has a written agreement with
  the tenant permitting the licensee to retain the deposit, the deposit may be kept in the
  licensee's separate account. The other options either ignore the exception or impose unrelated
  requirements."
