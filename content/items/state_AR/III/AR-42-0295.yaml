stem: A salesperson licensed under a principal broker shows a property and negotiates a purchase
  offer without the principal broker's knowledge or permission. According to Arkansas Real Estate
  Commission Rule 10.1(b), what is the legal presumption regarding this salesperson's conduct?
options:
  - The salesperson must obtain written permission from the principal broker first
  - The salesperson is presumed to be in violation of A.C.A. § 17-42-311 and subject to sanctions
  - The salesperson's license is automatically suspended by the Commission
  - The salesperson's actions make the principal broker liable for the transaction
key: B
explanation: The key is correct because Rule 10.1(b) expressly states that a salesperson who engages
  in real estate activities independently without permission is presumed to be in violation of
  A.C.A. § 17-42-311 and subject to appropriate sanctions. The scenario matches this description, so
  the presumption applies. The distractor suggesting the principal broker becomes liable is
  incorrect because the rule creates a presumption only against the unlicensed‑acting salesperson,
  not automatic liability for the broker.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 10.1(b)
  url: null
  quoted_text: Any salesperson, associate broker or executive broker who engages in real estate
    activities independently or through some other broker without permission from the principal
    broker or executive broker shall be presumed to be in violation of A.C.A. § 17-42-311 and
    subject to appropriate sanctions.
