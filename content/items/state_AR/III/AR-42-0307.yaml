stem: A property manager uses cash receipts numbered 101, 103, and 104 for three separate cash
  payments from tenants. According to Arkansas Real Estate Commission Rule 10.24(a), what must the
  property manager do to comply?
options:
  - Using receipts with consecutive numbers starting at 101
  - Skipping numbers only when a receipt is voided
  - Re‑issuing the missing receipt number 102 before continuing
  - Maintaining a log of missing numbers for audit purposes
key: A
explanation: The rule mandates that cash receipts be consecutively pre‑numbered, so the manager must
  use sequential numbers without gaps. Skipping numbers is only permissible if a receipt is voided,
  re‑issuing the missing number after the fact does not restore consecutiveness, and merely logging
  gaps does not correct the numbering sequence.
