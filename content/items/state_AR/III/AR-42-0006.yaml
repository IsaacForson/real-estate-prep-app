  - Custodial or fiduciary
  - General or operating
  - Trust or escrow
key: D
explanation: Rule 10.8(c) requires that the name on the trust account include either the word trust
  or the word escrow, and that the institution be insured by the FDIC or another federal insuring
  agency.
