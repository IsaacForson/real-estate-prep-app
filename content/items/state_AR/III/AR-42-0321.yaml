stem: A licensee wants to advertise a property under the trade name "QuickSell Homes" while being
  licensed with ABC Realty. According to Arkansas Real Estate Commission Rule 10.5(b), what must the
  licensee do?
options:
  - Discontinue advertising until the trade name is registered with the state
  - Advertise only under the name in which the principal broker's license has been issued
  - Obtain written permission from the Commission to use the trade name
  - Include both the trade name and the firm name in the advertisement
key: B
explanation: Rule 10.5(b) prohibits advertising under any name other than the name in which the
  principal broker's license has been issued. Therefore the licensee must advertise only under the
  firm's name. Including the trade name, seeking commission permission, or waiting for registration
  are not permitted alternatives.
