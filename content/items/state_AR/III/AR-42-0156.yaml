stem: A salesperson prepares a purchase agreement for a client without the principal broker's
  specific supervision. According to Rule 10.4(d)(1), what must occur?
options:
  - The salesperson must obtain the principal broker's written approval before presenting the
    agreement to the client.
  - The principal broker must review and sign the agreement before it is presented to the client.
  - The salesperson may proceed if the agreement is later ratified by the principal broker.
  - The preparation must be performed by or under the specific supervision of the principal broker.
key: D
explanation: Rule 10.4(d)(1) states that the preparation of instruments in connection with a real
  estate rental or sale and the closing of a sale by a licensee must be performed by or under the
  specific supervision of the principal broker. The option stating that the principal broker must
  review and sign the agreement before it is presented to the client is incorrect because the rule
  requires supervision, not merely review and signature by the principal broker.
