stem: A salesperson advertises her real estate services using only her personal name and phone
  number, without mentioning the firm name. Under Arkansas Real Estate Commission Rule 10.5(b),
  which requirement has she violated?
options:
  - Must include her license number in the advertisement
  - Must not advertise under a name other than the firm's name
  - Must include the firm name in all advertisements
  - Must use the firm's logo in any advertisement
key: B
explanation: Rule 10.5(b) prohibits advertising under any name other than the firm's name; using
  only a personal name violates this prohibition. The most tempting distractor is A, which mentions
  including the firm name; while omitting the firm name also violates 10.5(a), the question
  specifically concerns the prohibition in 10.5(b) against using a different name.
