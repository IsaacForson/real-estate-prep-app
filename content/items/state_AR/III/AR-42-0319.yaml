stem: Under Arkansas Real Estate Commission Rule 10.2, what must a licensee include in all written
  agency agreements or contracts?
options:
  - The licensee's personal contact information!!!
  - A detailed property description and price!!!
  - A specific determinable duration or a specific expiration date
  - The principal broker's signature only!!!
key: C
explanation: Rule 10.2 requires a licensee to put a specific determinable duration or a specific
  expiration date on all written agency agreements or contracts. The other options describe
  information that is not mandated by this rule.
