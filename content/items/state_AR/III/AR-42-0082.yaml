stem: A principal broker discovers that a salesperson licensed under them has shown a property and
  negotiated a purchase offer without the broker's knowledge or permission. What must the principal
  broker do under Rule 10.1(a)?
options:
  - Issue a written warning and require additional training
  - Notify the Commission in writing and forward the license
  - Require the salesperson to complete additional continuing education
  - Allow the salesperson to continue pending retroactive permission
key: B
explanation: Rule 10.1(a) states that if a principal broker learns a licensee has engaged in real
  estate activities independently without permission, it is the duty of the principal broker to
  immediately notify the Commission in writing and forward the licensee's license to the Commission.
  This makes notifying the Commission and forwarding the license the required action. The distractor
  suggesting only a warning and additional training is incorrect because the rule mandates
  Commission notification and license forwarding, not merely internal discipline.
