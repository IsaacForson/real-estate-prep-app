stem: A broker collects an advance fee for advertising a client's property, but a signed written
  agreement about how the fee will be disbursed is never received. Under Rule 10.7, what must the
  broker do with the fee?
options:
  - Convert the fee into a nonrefundable retainer for future work
  - Forward the fee directly to the Arkansas Real Estate Commission
  - Refund the fee to the owner within a reasonable time
  - Transfer the fee into the broker's personal operating account
key: C
explanation: Rule 10.7(a)(2) requires a broker to deposit advance fees in trust and, if a signed
  written agreement is not received within a reasonable time after payment, to refund the fee to the
  owner of the funds.
