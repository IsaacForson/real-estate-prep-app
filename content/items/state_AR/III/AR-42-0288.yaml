  url: null
  quoted_text: A licensee shall furnish to the Principal Broker or Designated Executive Broker with
    whom the licensee is associated, copies of all broker price opinion reports, including the cover
    letter described above, which shall be maintained on file in accordance with the record keeping
    requirements of this chapter.
