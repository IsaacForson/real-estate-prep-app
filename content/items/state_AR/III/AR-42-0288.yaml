stem: A licensee prepares a broker's price opinion for a buyer who is considering making an offer on
  a property. After completing the report, what must the licensee do to comply with Arkansas Real
  Estate Commission Rule 10.15(b)?
options:
  - The licensee must provide a copy of the report to the principal broker.
  - The licensee must submit the report to the Arkansas Real Estate Commission.
  - The licensee must keep the report confidential and not share it.
  - The licensee must include the report in the property listing advertisement.
key: A
explanation: Rule 10.15(b) obligates the licensee to furnish copies of all broker price opinion
  reports to the associated principal broker. Submitting to the Commission is not required by this
  rule.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
