stem: "According to Arkansas Real Estate Commission Rule 10.4(e), a broker who is gainfully employed
  in a non-real estate field may employ a licensee to work under the broker's license only if:"
options:
  - the broker must keep the licensee's activities strictly supervised by the principal broker at
    all times.
  - the broker must first obtain written approval from the Arkansas Real Estate Commission.
  - the broker may employ the licensee only if the licensee's duties are limited to part‑time work.
  - employment must be in a real estate related field and in the same office as the broker's
    business.
key: D
explanation: Rule 10.4(e) states that the presumption of being engaged in a non‑real estate field
  may be overcome by proof that the employment is (1) in a real estate related field and (2)
  conducted in the same office as the broker's real estate business. Therefore, the option stating
  that employment must be in a real estate related field and in the same office as the broker's
  business correctly states both requirements. The option requiring Commission approval is incorrect
  because the rule does not mandate prior approval; it relies on the broker's proof of related
  employment and same‑office location.
