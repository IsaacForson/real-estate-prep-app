stem: According to Arkansas Code Ann. § 17-42-103, which statement correctly defines a 'branch office'?
options:
  - The office where an associate broker conducts real estate activities under supervision
  - The location where an executive broker holds client trust funds for the firm
  - The principal broker's office other than his or her principal place of business
  - The place where salesperson licenses are issued and renewed by the Commission
key: C
explanation: Arkansas Code Ann. § 17-42-103 defines a branch office as a principal broker's office
  other than his or her principal place of business. The option describing an associate broker's
  office is incorrect because the statutory definition specifically pertains to the principal
  broker's office, not an associate broker's.
