stem: A property manager receives cash from a tenant for a pet fee. According to Arkansas Real
  Estate Commission Rule 10.24(a), which of the following must be included on the cash receipt?
options:
  - The identity of the property for which the cash funds were received
  - The property's zoning classification as recorded in the municipal database
  - The tenant's social security number associated with the cash payment
  - The landlord's bank account number to which the cash funds were deposited
key: A
explanation: Rule 10.24(a)(4) mandates that the cash receipt include the identity of the property
  for which the cash funds were received. The distractors are not required by the rule.
