stem: According to Arkansas Code Ann. § 17-42-103, what is the definition of a 'continuing education
  unit'?
options:
  - Postlicensure education derived from participation in courses in real estate-related subjects
    approved by the commission
  - A period of at least fifty (50) minutes to sixty (60) minutes of actual classroom instruction
  - An individual who holds any type of license issued by the Arkansas Real Estate Commission
  - A period of ten (10) contact hours of actual classroom instruction with the instructor present
key: D
explanation: The definition of a continuing education unit is explicitly stated as a period of ten
  contact hours of actual classroom instruction with the instructor present. The other options
  describe a classroom hour, continuing education, and a licensee, which are distinct definitions.
