stem: A licensee holds an unrelated full-time job in banking and also wants a separate real estate
  firm to sponsor his license. Under Rule 10.4(e), why would a broker who is gainfully employed
  elsewhere generally be barred from employing this licensee?
options:
  - Such a broker is presumed engaged in a non-real estate field absent contrary proof
  - Such a broker may supervise licensees who work exclusively on weekends
  - Such a broker is automatically stripped of principal broker status by the Commission
  - Such a broker first obtains written approval from every licensee in the firm
key: A
explanation: Rule 10.4(e) presumes a broker who is gainfully employed or engaged in a non-real
  estate field to be so engaged, and this presumption is overcome only by proof the outside work is
  real estate related and conducted from the same office.
citation:
  source: Arkansas Real Estate Commission Rule 10.4
  url: null
  quoted_text: A broker who is employed or who is engaged in any field other than real estate will be
    presumed to be gainfully employed or engaged in a non-real estate related field
