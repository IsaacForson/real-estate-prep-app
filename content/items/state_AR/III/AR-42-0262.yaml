stem: According to Arkansas Code Ann. § 17-42-103, what is the definition of a 'classroom hour'?
options:
  - A period of at least fifty (50) minutes, but not more than sixty (60) minutes, of actual
    classroom instruction with the instructor present.
  - A period of at least forty-five (45) minutes, but not more than seventy-five (75) minutes, of
    actual classroom instruction with the instructor present.
  - A period of exactly sixty (60) minutes of actual classroom instruction with the instructor
    present.
  - A period of at least fifty (50) minutes of actual classroom instruction with the instructor
    present.
key: A
explanation: The definition explicitly states that a classroom hour is a period of at least fifty
  minutes but not more than sixty minutes of actual classroom instruction with the instructor
  present. The other options either alter the time range or omit the upper limit.
