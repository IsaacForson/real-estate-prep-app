stem: A buyer withdraws an unaccepted offer to purchase real estate, and the broker who was holding
  the buyer's earnest money then disburses those funds back to the buyer. Under Rule 10.9, why is
  this disbursement proper?
options:
  - Withdrawal of an unaccepted offer is a circumstance permitting proper disbursement
  - A written court order can authorize the return of earnest money to a buyer
  - The broker may disburse trust funds at any time without regard to the underlying contract
  - Earnest money automatically becomes the broker's property once an offer is withdrawn
key: A
explanation: Rule 10.9(c)(2) lists the withdrawal of an offer not yet accepted to buy, sell, rent,
  lease, exchange, or option real estate as a circumstance under which the broker is deemed to have
  properly fulfilled the duty to disburse trust funds.
