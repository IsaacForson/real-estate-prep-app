stem: A property manager uses his own maintenance company to perform repairs on a rental property
  and charges the owner for the work. Under Arkansas Real Estate Commission Rule 10.21(b), what must
  the property manager do?
options:
  - The property manager must disclose in writing to the owner the use of the business.
  - The property manager must obtain verbal approval from the owner before using the business.
  - The property manager must record the expense in the owner's ledger only.
  - The property manager must seek approval from the Arkansas Real Estate Commission before
    proceeding.
key: A
explanation: Rule 10.21(b) requires the property manager to disclose in writing to the owner the use
  of any business in which he has a pecuniary interest to provide billable services. The other
  options either omit the written disclosure requirement or seek inappropriate approvals.
