stem: A licensee’s real estate license was revoked on March 15, 2023. According to Arkansas Code
  Ann. § 17-42-311(c), when may the licensee first apply for a new license?
options:
  - March 15, 2024.
  - March 15, 2025.
  - March 16, 2025.
  - March 16, 2026.
key: C
explanation: The statute states that a licensee whose license is revoked is eligible to apply for a
  new license after the expiration of two years from the date of revocation. Two years after March
  15, 2023 is March 15, 2025, so eligibility begins the following day, March 16, 2025.
