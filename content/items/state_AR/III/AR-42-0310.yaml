stem: According to Arkansas Code Ann. § 17-42-311(c), how long must a licensee wait after license
  revocation before being eligible to apply for a new license?
options:
  - A waiting period of six months.
  - A waiting period of two years.
  - A waiting period of one year.
  - A waiting period of three years.
key: B
explanation: The rule states that a licensee whose license is revoked shall be eligible to apply for
  a new license after the expiration of two (2) years from the date of revocation. Therefore, the
  required waiting period is two years. The distractors of one year, six months, and three years do
  not match the statutory timeframe.
