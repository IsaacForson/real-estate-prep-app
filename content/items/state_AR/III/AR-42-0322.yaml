stem: According to Arkansas Real Estate Commission Rule 10.18(b), how is an "Occupant" defined?
options:
  - A person who rents a property on a nightly basis
  - A person who rents a property on a weekly basis
  - A person who owns a property and lives in it
  - A person who manages a property for an owner
key: A
explanation: Arkansas Real Estate Commission Rule 10.18(b) defines an occupant as a person who rents
  a property on a nightly basis. The option that describes a nightly rental therefore matches the
  rule. A weekly rental, ownership with personal residence, or managing a property for an owner are
  not included in that definition, so those options are incorrect.
