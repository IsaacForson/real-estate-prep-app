stem: Under Arkansas Real Estate Commission Rule 10.5(c), what must a principal broker ensure
  regarding a licensee's use of an individual name or telephone number in public advertising?
options:
  - The principal broker must not permit licensees to use individual names or telephone numbers
    unless the licensee's connection with the broker is obvious in the advertisement.
  - The principal broker must allow licensees to use individual names or telephone numbers in any
    advertisement as long as the broker's firm name is also included.
  - The principal broker must require licensees to obtain written consent from the broker before
    using any individual name or telephone number in advertising.
  - The principal broker must ensure that all advertisements include the licensee's individual name
    and telephone number for transparency.
key: A
explanation: Rule 10.5(c) requires that a principal broker not permit licensees to use individual
  names or telephone numbers unless the licensee's connection with the broker is obvious in the
  advertisement. The statement that merely including the firm name satisfies the requirement is
  incorrect because the connection must be obvious, not just the firm name present.
citation:
