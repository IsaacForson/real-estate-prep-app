stem: Under Arkansas Real Estate Commission Rule 10.22(c), if a property manager has access to a
  separate banking or escrow account owned or controlled by the property owner pursuant to a
  property management agreement, what may the property manager maintain in lieu of an owner’s
  ledger?
options:
  - A monthly statement of accounting to the owner each month
  - A record of receipts and disbursements or a check register
  - A separate tenant ledger for each unit managed of the property
  - A written property management agreement with the owner
key: B
explanation: Rule 10.22(c) explicitly states that when a property manager has access to a separate
  banking or escrow account owned or controlled by the owner, they may maintain either a record of
  receipts and disbursements or a check register instead of an owner’s ledger. The distractor about
  a separate tenant ledger is incorrect because the rule concerns substitution of the owner’s
  ledger, not tenant ledgers.
