stem: According to Arkansas Real Estate Commission Rule 10.8(d)(1), under what condition may a
  principal broker retain the broker's own funds in a designated trust account?
options:
  - When the bank requires a minimum balance to keep the trust account open
  - When the broker wishes to earn interest on personal funds in the trust account
  - When the broker has excess funds from commissions to deposit in the trust account
  - When the broker is also designated as the escrow agent for the trust account
key: A
explanation: Rule 10.8(d)(1) expressly allows a broker to retain personal funds in the trust account
  only to meet a bank-imposed minimum balance needed to keep the account open. Retaining funds for
  personal interest, commissions, or escrow agency duties is not permitted under this provision.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 10.8(d)(1)
  url: null
  quoted_text: (1) If the bank in which the account is maintained designates a specific minimum
    balance that must be maintained in order to keep the account open, the broker may maintain that
    amount in the account designated as the broker's funds.
