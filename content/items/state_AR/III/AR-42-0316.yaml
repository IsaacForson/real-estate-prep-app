stem: According to Arkansas Real Estate Commission Rule 10.18(a), how is an "Audit trail" defined?
options:
  - A summary of monthly expenses paid by the property owner to the management company
  - A record of advertising expenses incurred by the broker for the fiscal year
  - A list of all tenants who have ever occupied the property and their lease dates
  - A documented history of a financial transaction that can be traced to its source
key: D
explanation: Arkansas Real Estate Commission Rule 10.18(a) defines an audit trail as a documented
  history of a financial transaction that can be traced to its source. A description that only
  summarizes monthly expenses paid by the property owner to the management company does not meet
  this definition.
