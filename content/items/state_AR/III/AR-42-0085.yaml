stem: According to Arkansas Real Estate Commission Rule 10.7(a)(3), how is an 'advance fee' defined?
options:
  - A fee that must be placed in an interest-bearing account unless state or federal law expressly
    permits otherwise, and the broker must disclose this to the client.
  - A fee that the broker may keep without obtaining a written agreement from the client for the
    services to be performed, even if services are not yet rendered.
  - A fee charged for services already rendered, refundable to the client if the transaction fails
    to close, regardless of any written agreement.
  - A fee charged for services to be paid in advance of the rendering of such services, including
    listing, advertising, or offering for sale or lease any real property.
key: D
explanation: Arkansas Real Estate Commission Rule 10.7(a)(3) defines an advance fee as a fee charged
  for services to be paid in advance of rendering those services, explicitly including listing,
  advertising, or offering real property for sale or lease. The option describing a fee charged
  after services are rendered contradicts this definition because an advance fee is paid before the
  services are performed.
citation:
  source: "### Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate
    Commission Regulations, Time-Share Regulations (April 2024) — § 10.7"
  url: null
  quoted_text: '"Advance fee" means any fee charged for services to be paid in advance of the
    rendering of such services, including, without limitation, any fee charged for listing,
    advertising, or offering for sale or lease any real property.'
