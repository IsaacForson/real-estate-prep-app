stem: A licensee places a 'For Sale' sign in front of a property that displays only the licensee's
  name and telephone number, with no mention of the firm name. According to Arkansas Real Estate
  Commission Rule 10.5(a), what has the licensee failed to do?
options:
  - Obtain written permission from the principal broker to advertise under a different name.
  - Include the name of the firm with whom the licensee is licensed in the advertisement or sign.
  - Display the firm name in the same size and style as the licensee's name.
  - Use only the licensee's personal name and telephone number in the advertisement or sign.
key: B
explanation: Rule 10.5(a) requires that any advertisement or sign include the name of the firm with
  whom the licensee is licensed. The licensee's sign displayed only the licensee's name and
  telephone number, omitting the firm name, which violates the rule. Options that suggest obtaining
  permission from the principal broker, displaying the firm name in the same size and style as the
  licensee's name, or using only the licensee's personal name and telephone number do not meet this
  requirement.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 10.5
  url: null
  quoted_text: A licensee may not advertise any property, including the licensee's own property, for
    sale or rent, or display a real estate sign without including in that advertisement or sign the
    name of the firm with whom that licensee is licensed.
