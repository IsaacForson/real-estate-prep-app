stem: A licensee representing the seller receives a written offer to purchase the listed property
  but waits five business days before presenting it to the seller. According to Arkansas Real Estate
  Commission Rule 10.12(a), what has the licensee failed to do?
options:
  - Failed to ensure that the supervising brokers of the selling licensee and listing licensee
    review and sign the real estate contract before submission.
  - Failed to keep a signed receipt for any funds the broker delivers to an escrow agent or to any
    third party.
  - Failed to promptly present the offer to the seller by the listing firm or other licensee
    designated by an authorized representative of the listing firm.
  - Failed to have the offer signed by the licensee who received it and by that licensee's
    supervising broker.
key: C
explanation: Rule 10.12(a) mandates that offers be promptly presented to the seller. Waiting five
  business days violates this promptness requirement. The option describing a signing requirement
  for the licensee and supervising broker is unrelated to the timing of presentation.
