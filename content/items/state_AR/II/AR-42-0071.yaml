stem: Which of the following individuals is exempt from licensing requirements under Arkansas law?
options:
  - A person who lives on the apartment complex and shows units to prospective tenants as part of
    their job as resident manager
  - A person who receives a salary for preparing lease agreements for a principal broker but also
    negotiates rent amounts with tenants
  - A person who works hourly for a corporation to lease the corporation's owned properties and
    receives no commission
  - A person who acts as an attorney in fact under a power of attorney to consummate a sale but
    expects a commission
key: A
explanation: Arkansas law exempts a resident manager who resides on the premises and performs
  leasing activities as part of employment (Ark. Code Ann. § 17‑42‑104(a)(5)). Therefore the
  individual who lives on the apartment complex and shows units to prospective tenants as a resident
  manager is exempt. An attorney in fact who expects a commission is not exempt because the
  exemption for an attorney in fact applies only when the person acts without compensation. An
  hourly employee who leases corporation‑owned properties and receives no commission is not covered
  by the employee exemption, which applies only when the employee does not receive any compensation
  for leasing activities. A salaried employee who prepares lease agreements and also negotiates rent
  amounts is not exempt, since negotiating lease terms for compensation is an act listed in
  § 17‑42‑103(10) and disqualifies the salaried‑employee exemption under § 17‑42‑104(a)(6).
