stem: A licensee moves to a new residence and updates their mailing address with the post office but
  does not inform the Arkansas Real Estate Commission. Which action is required by law?
options:
  - Simply postponing the address update until the next renewal
  - Promptly notifying the Commission of the change on a prescribed form
  - Merely updating the address with the United States Postal Service only
  - Simply delaying notification to the Commission until the next renewal
key: B
explanation: Arkansas law requires licensees to promptly notify the Commission of any change in
  address using a prescribed form. Simply updating the address with the post office does not satisfy
  this legal obligation. The Commission must be informed directly to maintain accurate records.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 7.6
  url: null
  quoted_text: Upon any change of name, address or place of business, or upon the loss or misplacement
    of a license or pocket card, the licensee shall promptly notify the Commission of such change or
    loss on a form prescribed by the Commission.
