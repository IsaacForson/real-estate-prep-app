stem: What is the definition of "Associate broker" under Arkansas law?
options:
  - An individual who has a broker's license and who is employed by a principal broker, or is
    associated with a principal broker as an independent contractor, and who participates in any
    activity described in subdivision (10) of this section without supervision;
  - An individual who has a broker's license and who is employed by a principal broker, or is
    associated with a principal broker as an independent contractor, and who participates in any
    activity described in subdivision (10) of this section while under the supervision of a
    principal broker or executive broker;
  - An individual who has a broker's license and who is employed by a principal broker, or is
    associated with a principal broker as an independent contractor, and who may supervise associate
    brokers and salespersons;
  - An individual who has a salesperson's license and who is employed by a principal broker, or is
    associated with a principal broker as an independent contractor, and who participates in any
    activity described in subdivision (10) of this section while under the supervision of a
    principal broker;
key: B
explanation: Under Ark. Code Ann. § 17‑42‑103(1)(A), an associate broker is an individual who holds
  a broker’s license, works for or is an independent contractor of a principal broker, and engages
  in any activity listed in subdivision (10) while being supervised by a principal broker or
  executive broker. A description that requires a salesperson’s license does not satisfy the
  definition, and a description that permits supervising others or that omits the supervision
  requirement is also inconsistent with the statute.
