stem: According to Arkansas law, which of the following best defines a 'licensee'?
options:
  - An individual who holds any type of license issued by the commission
  - An individual who employs salespersons to work under a broker's license
  - An individual who performs real estate activities without expecting compensation
  - An individual who owns a real estate firm but does not engage in brokerage
key: A
explanation: >-
  Ark. Code Ann. § 17-42-103(8)(A) defines a licensee as an individual who holds any type of license
  issued by the Arkansas Real Estate Commission. This includes principal brokers, executive brokers,
  associate brokers, and salespersons.


  The option stating that a licensee is an individual who owns a real estate firm but does not
  engage in brokerage is incorrect because ownership alone does not constitute licensure; a licensee
  must hold a license issued by the commission.


  The option stating that a licensee is an individual who performs real estate activities without
  expecting compensation is incorrect because the definition does not hinge on compensation; any
  individual who holds a license, regardless of whether they expect payment, qualifies as a
  licensee.


  The option stating that a licensee is an individual who employs salespersons to work under a
  broker's license is incorrect because employing salespersons describes a role of a broker, not the
  statutory definition of a licensee, which is based solely on holding a license.
