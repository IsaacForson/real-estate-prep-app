stem: An applicant has completed the required education, passed the licensing exam, and has no
  record of unprofessional conduct, but the commission has not yet received the applicant's state
  and federal criminal background check. May the commission issue a license to this applicant at
  this time?
options:
  - The commission may issue the license after meeting all other requirements.
  - The commission may withhold the license until the background check is approved.
  - The commission may issue the license after receiving the required fees.
  - The commission may issue the license after verifying the applicant's experience.
key: B
explanation: The law provides that a license shall not be issued until the commission receives and
  approves the state and federal criminal background check. Therefore, the commission must withhold
  issuance until the background check is approved. The other options describe circumstances that do
  not override this background check requirement.
