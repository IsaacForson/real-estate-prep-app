stem: An applicant with a prior conviction for an offense listed in A.C.A. §17-3-102(a) requests a
  waiver for original licensure as a salesperson. What must the applicant submit with the
  application?
options:
  - Submit the waiver request after receiving the license
  - Submit a verbal waiver request during the licensing interview
  - Submit the application fees only and omit the waiver request
  - Submit a written waiver request with the application and fees
key: D
explanation: The rule requires a waiver request to be in writing and to accompany the completed
  application and fees. The option suggesting fees only without a waiver request ignores the
  mandatory written waiver component.
