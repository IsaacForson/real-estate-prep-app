stem: Alex previously held an Arkansas real estate broker license that expired two years ago. He now
  applies for a broker license again. According to Arkansas Real Estate Commission Rule 4.1(d),
  which of the following is **NOT** required for Alex's application?
options:
  - The requirement to pay the application fee
  - The requirement to complete pre-license education
  - The requirement to submit to a state and federal criminal background check
  - The requirement to provide an affidavit of no unprofessional conduct
key: B
explanation: Under Rule 4.1(d)(1)(A), broker applicants who have previously held an Arkansas real
  estate license are exempt from completing any pre-license education previously completed. The most
  tempting distractor, submitting to a state and federal criminal background check, is still
  required because Rule 4.1(d)(2)(B) obliges such applicants to comply with subsection (c), which
  mandates the background check.
