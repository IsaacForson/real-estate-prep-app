stem: A broker who holds an inactive license changes his business address on April 5, 2024.
  According to Arkansas Real Estate Commission Rule 6.2(b), by what date must he notify the
  Commission in writing of this change?
options:
  - April 5, 2024.
  - April 12, 2024.
  - March 29, 2024.
  - April 19, 2024.
key: B
explanation: Rule 6.2(b) states that any person holding an inactive license must notify the
  Commission in writing within seven (7) days of any change of name or address. Seven days after
  April 5, 2024 is April 12, 2024. The distractor April 5, 2024 would be same‑day notice (no delay),
  April 19, 2024 is two weeks late, and March 29, 2024 precedes the address change.
