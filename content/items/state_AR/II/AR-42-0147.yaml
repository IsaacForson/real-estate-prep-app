stem: An applicant submits their application for the real estate license examination on March 1.
  According to Rule 4.1(c)(4), what is the earliest date the state and federal criminal background
  check could have been completed and still be valid?
options:
  - September 1 of the prior year.
  - December 15 of the prior year.
  - November 15 of the prior year.
  - October 15 of the prior year.
key: A
explanation: The background check must be completed within the six months immediately preceding the
  date the application is received. Six months before March 1 is September 1 of the prior year,
  making that the earliest permissible date. October 1 is too recent to be the earliest, though
  still within the window.
