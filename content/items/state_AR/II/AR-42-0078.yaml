stem: According to Arkansas law, what must a principal broker do with the licenses of licensees
  employed by or associated with him/her?
options:
  - Retaining licenses and displaying them at the broker's place of business
  - Maintaining licenses and placing them in a drawer behind the reception desk
  - Holding licenses and posting them on the broker's personal desk in the office
  - Keeping licenses and storing them in a locked file at the broker's office
key: A
explanation: Under Arkansas law, the principal broker must retain the licenses of all associated
  licensees and conspicuously display them at the place of business. This requirement ensures that
  the public can verify the credentials of everyone working in the office. Returning the licenses to
  the Commission is only required when a licensee's employment ends, not as a routine duty.
