stem: How many classroom hours of post-license education are required for a salesperson under
  Arkansas Real Estate Commission Rule 11.5(b)?
options:
  - Eighteen (18) classroom hours
  - Twelve (12) classroom hours
  - Twenty-four (24) classroom hours
  - Thirty (30) classroom hours
key: A
explanation: The rule states that salespersons shall complete an eighteen (18) classroom hour
  salesperson course for post-license education. The distractor “Thirty (30) classroom hours”
  incorrectly applies the broker requirement from Rule 11.5(c) to a salesperson.
