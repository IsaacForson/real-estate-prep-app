stem: A licensee who renewed their license as inactive for two (2) years wishes to reactivate the
  license. What is the minimum number of classroom hours of approved continuing education they must
  submit to satisfy the activation requirement under Rule 6.2(d)?
options:
  - 7 classroom hours
  - 21 classroom hours
  - 14 classroom hours
  - 28 classroom hours
key: C
explanation: Rule 6.2(d) mandates seven classroom hours of approved continuing education for each
  year the license was renewed as inactive; for two years, this totals fourteen (14) classroom
  hours. The distractor “7 classroom hours” only satisfies the requirement for a single year of
  inactive status.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 6.2
  url: null
  quoted_text: An inactive license may be activated upon submitting proof of satisfactorily completing
    seven (7) classroom hours or equivalent continuing education units or equivalent distance
    education of approved continuing education for each year renewed as inactive, not to exceed
    thirty (30) classroom hours, and such other information as the Commission may require, including
    payment of the required fee.
