stem: An applicant for a broker's license has completed 100 total education hours, of which 30 hours
  were in a commission-developed course. Does the applicant satisfy the education requirement?
options:
  - The applicant does not meet the education requirement.
  - The applicant meets the education requirement.
  - The applicant meets the experience requirement.
  - The applicant does not meet the experience requirement.
key: A
explanation: Under § 17-42-303(B), a broker applicant must complete at least forty‑five of the
  required education hours in a commission‑developed course. The applicant has only thirty such
  hours, so the education requirement is not satisfied. The claim that the applicant meets the
  education requirement ignores this forty‑five‑hour minimum.
