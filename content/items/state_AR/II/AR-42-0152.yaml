stem: Taylor, a newly licensed salesperson, received her license on March 10, 2024. By what date
  must she submit her post-license education completion certificate to the Arkansas Real Estate
  Commission to avoid her license being placed on inactive status?
options:
  - March 31, 2024
  - September 30, 2024
  - September 10, 2024
  - October 31, 2024
key: B
explanation: Rule 11.5(f) requires that documentation be received by the end of the month six months
  after the initial license date; for a March 10 license, that deadline is September 30, 2024. The
  distractor “September 10, 2024” reflects the exact six-month date but ignores the requirement to
  submit by month's end.
