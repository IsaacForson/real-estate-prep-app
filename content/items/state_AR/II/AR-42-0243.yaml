stem: A salesperson receives an earnest money deposit from a buyer and holds the funds in their
  personal checking account for ten days before depositing the money into the escrow account
  required by the brokerage. Under Arkansas law, what is the consequence of this action?
options:
  - The licensee must pay interest on the earnest money at the rate set by the Arkansas Real Estate
    Commission.
  - The licensee may be disciplined for failing to account for or remit the buyer’s earnest money
    within a reasonable time.
  - The licensee may retain the earnest money as compensation if the transaction fails to close.
  - The licensee must obtain the principal broker’s written approval before depositing the earnest
    money into any account.
key: B
explanation: The rule at Ark. Code Ann. § 17-42-311(a)(6) prohibits failing within a reasonable time
  to account for or remit any moneys coming into the licensee’s possession that belong to others.
  Holding the earnest money in a personal account for ten days before placing it in the required
  escrow account violates this requirement, making disciplinary action appropriate. The distractor
  about paying interest is incorrect because the cited statute does not impose an interest
  obligation on earnest money deposits.
