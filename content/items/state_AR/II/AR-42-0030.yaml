stem: An applicant has submitted fingerprints for a state and federal criminal background check and
  is waiting for the results. May the applicant take the licensing exam?
options:
  - The applicant may take the licensing exam while awaiting the background check results.
  - The applicant must wait for the background check results before taking the licensing exam.
  - The applicant is prohibited from taking the licensing exam if any criminal record exists.
  - The applicant may take the licensing exam after receiving a waiver from the commission.
key: A
explanation: Section 17-42-315(a)(2)(A) expressly allows an applicant to sit for the licensing
  examination while awaiting the results of a background check. Therefore, the applicant may take
  the exam during the waiting period. The statement that the applicant must wait for the results
  contradicts this provision.
