stem: Under Arkansas law, what must the commission do if an applicant fails to meet any licensing
  requirement or fails to pay the required fees?
options:
  - The commission shall deny the license.
  - The commission shall waive the fee.
  - The commission shall issue a temporary license.
  - The commission shall require additional education.
key: A
explanation: The statute states that the commission shall deny a license to any applicant who fails
  to meet the requirements or fails to pay the appropriate fees. Therefore, non‑payment or unmet
  requirements trigger mandatory denial. The distractors describe actions the commission is not
  authorized to take under this provision.
