stem: A licensee let their license expire 10 months ago and now wishes to reinstate it as active.
  What must the licensee provide before the license can be issued as active?
options:
  - Provide proof of completing continuing education
  - Provide proof of paying the annual renewal fee
  - Provide a letter of recommendation from a broker
  - Provide a copy of the expired license certificate
key: A
explanation: The rule provides that no license will be issued as active until proof of satisfactory
  completion of the continuing education requirement is submitted. Simply providing a copy of the
  expired license does not satisfy the continuing education prerequisite for active reinstatement.
