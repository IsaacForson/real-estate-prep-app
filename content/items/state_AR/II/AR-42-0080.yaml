stem: A principal broker opens a branch office and wants to issue duplicate licenses to salespersons
  working there but has not designated an executive broker. What must the broker do?
options:
  - Requesting a waiver from the Commission to issue duplicate licenses
  - Waiting for the salespersons to obtain independent licenses
  - Issuing duplicate licenses to the salespersons immediately
  - Refraining from issuing duplicate licenses without an executive broker
key: D
explanation: Arkansas regulations prohibit issuing a duplicate license at a branch office unless an
  executive broker has been designated to be in charge of that office. Therefore, the broker must
  refrain from issuing duplicate licenses until such a designation is made. Issuing them immediately
  would violate the rule and could result in disciplinary action.
