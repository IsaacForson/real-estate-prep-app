stem: Maria owns her personal residence and decides to sell it without hiring a real estate
  licensee. She advertises the property, negotiates the price, and executes the deed herself. Under
  Arkansas law, is Maria required to hold a real estate license to perform these acts?
options:
  - Maria is not required to hold a real estate license because she is the owner of the freehold
    interest.
  - Maria is required to hold a real estate license because she is negotiating the price.
  - Maria is required to hold a real estate license because she is advertising the property.
  - Maria is required to hold a real estate license because she is executing the deed.
key: A
explanation: Under Arkansas law, an owner of an individual freehold or leasehold interest is exempt
  from licensure when performing acts such as advertising, negotiating, and executing a deed for
  their own property. This exemption is found in Ark. Code Ann. § 17-42-104(a)(1)(A).
