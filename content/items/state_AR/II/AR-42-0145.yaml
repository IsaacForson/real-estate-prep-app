stem: What is the minimum number of classroom hours in basic principles of real estate required for
  a salesperson applicant under Arkansas Real Estate Commission Rule 4.1(b)(2)?
options:
  - Thirty (30) classroom hours.
  - Forty‑five (45) classroom hours.
  - Sixty (60) classroom hours.
  - Fifteen (15) classroom hours.
key: A
explanation: The rule explicitly states that of the required sixty classroom hours, at least thirty
  must be in the basic principles of real estate. The forty‑five hour option applies to the
  Commission‑developed course requirement for broker applicants, not the salesperson basic
  principles requirement.
