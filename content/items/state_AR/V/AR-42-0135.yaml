stem: A licensee representing a buyer discovers that the property is located in an area slated for a
  new public school, which could affect property values. This information is not confidential under
  any prior agency relationship. Under § 17-42-316(b)(2)(G), what must the licensee do?
options:
  - The licensee must keep the information confidential to avoid influencing the buyer's decision
  - The licensee must disclose the information about the new public school to the buyer client
    promptly
  - The licensee must use the information to advise the buyer to increase their offer price
  - The licensee must share the information only with the seller's agent to facilitate negotiation
key: B
explanation: The key is correct because § 17-42-316(b)(2)(G) obligates a licensee to disclose
  material facts they are aware of or should be aware of, provided the facts are not confidential
  under a prior agency. The most tempting distractor is C, which proposes sharing the information
  only with the seller's agent; this fails to disclose the material fact to the buyer client as
  required.
citation:
  source: Ark. Code Ann. § 17-42-101 et seq. — Arkansas Real Estate License Law and Time-Share Law
    (AREC compilation, August 2024) — § 17-42-316(b)(2)(G)
  url: null
  quoted_text: Disclose to the client material facts of the transaction that the licensee is aware of
    or should be aware of in the exercise of reasonable skill and care and that are not confidential
    information under a current or prior agency or dual agency relationship
