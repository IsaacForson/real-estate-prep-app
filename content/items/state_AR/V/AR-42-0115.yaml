stem: A licensee who represents both the seller and buyer in a sale transaction is offered a $500
  commission by the title company for referring its services. According to Rule 8.3(b), may the
  licensee accept this commission?
options:
  - Yes, because the title company is a third-party service provider
  - No, unless the commission comes from the licensed principal broker under whom the licensee is
    licensed
  - Yes, if the licensee discloses the commission to both the seller and buyer in writing
  - No, because accepting any commission from a third party is permitted with verbal agreement
key: B
explanation: Under Arkansas Real Estate Commission Rule 8.3(b), a licensee may not accept any
  commission, rebate, profit, payment, or other valuable consideration from any person or entity
  except the licensed principal broker under whom the licensee is licensed. Therefore, the licensee
  may not accept the $500 commission from the title company unless it comes from the principal
  broker.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
