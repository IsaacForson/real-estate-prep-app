  url: null
  quoted_text: Notwithstanding Regulation 8.3(a), a licensee shall not accept a commission, rebate,
    profit, payment, compensation or other valuable consideration in connection with a real estate
    transaction or real estate activity from any person or entity except the licensed principal
    broker under whom the licensee is licensed.
