stem: A buyer asks their agent to help prepare an offer to purchase a property. Under section
  17-42-318(a)(3), what must the licensee do?
options:
  - Assist the buyer by developing, communicating, and presenting offers or counteroffers
  - Assist the buyer by presenting offers prepared by the seller without developing them
  - Assist the buyer by developing offers but not communicating or presenting them to the seller
  - Assist the buyer by developing and presenting offers but refusing to communicate counteroffers
key: A
explanation: Section 17-42-318(a)(3) obligates the licensee to assist the buyer or lessee in
  developing, communicating, and presenting offers or counteroffers. Merely presenting a
  buyer‑prepared offer or only communicating it fails to meet the full duty of assistance required
  by the statute.
