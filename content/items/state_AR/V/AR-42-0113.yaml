stem: Under Rule 8.5(b) of the Arkansas Real Estate Commission Regulations, what must be true of the
  price quoted in any offering or advertisement when a licensee is acting as an agent?
options:
  - be lower than the price agreed upon with the owners to attract buyers
  - be higher than the price agreed upon with the owners to reflect market conditions
  - be the same as the price agreed upon with the owners as the offering price
  - be omitted if the licensee does not have the owner's authority
key: C
explanation: The rule states that in any offering or advertisement the price quoted must not be
  other than that agreed upon with the owners as the offering price, so the price must match the
  owners' agreed price. The distractor suggesting a lower price is incorrect because the rule
  prohibits any deviation from the agreed price, whether lower or higher.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 8.5(b)
  url: null
  quoted_text: A licensee shall not offer or advertise property without authority and in any offering
    or advertisement the price quoted must not be other than that agreed upon with the owners as the
    offering price.
