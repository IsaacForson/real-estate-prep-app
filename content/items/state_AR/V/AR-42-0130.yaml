stem: According to section 17-42-317(b), which two actions does a licensee **NOT** breach a duty to
  the seller or lessor by performing?
options:
  - The licensee may show alternative properties to a prospective buyer and act as an agent for
    other sellers
  - The licensee may disclose confidential information to the buyer and negotiate price
  - The licensee may accept dual agency without consent and present offers
  - The licensee may refuse to present offers and withhold counteroffers
key: A
explanation: Under Ark. Code Ann. § 17-42-317(b), a licensee does not breach a duty to a seller or
  lessor by showing alternative properties to a prospective buyer or by acting as an agent for other
  sellers or lessors. Therefore, the option that lists those two permissible actions is correct. The
  option that says the licensee may disclose confidential information to the buyer and negotiate
  price is wrong because disclosing confidential information to the buyer violates the duty of
  confidentiality and is not permitted under this provision.
citation:
