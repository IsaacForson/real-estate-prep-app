stem: A licensee acting solely as a seller's agent tells a prospective buyer at a showing that the
  licensee represents the seller. The licensee does not put this disclosure in writing at that time.
  According to Rule 8.1(b), what must the licensee do next to comply with the regulation?
options:
  - Reduce the oral disclosure to writing at a convenient time and maintain evidence of the
    disclosure
  - Immediately terminate the showing and reschedule it for another day at the buyer's request
  - Obtain written consent from the buyer before proceeding further and inform the seller of the
    consent obtained
  - Notify the seller's broker that the disclosure was made orally only and document the
    notification in the file
key: A
explanation: The rule requires disclosure to be in writing but allows an initial oral disclosure
  that must later be reduced to writing, with evidence maintained. Therefore the licensee must write
  down the oral disclosure and keep proof of it. The distractor about obtaining the buyer's written
  consent is wrong because the rule does not require the buyer's consent for the agency disclosure.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 8.1(b)
  url: null
  quoted_text: In all cases, disclosure shall be in writing, but may initially be made orally and
    reduced to writing at a convenient time subject to the requirements of Regulation 8.1(c).
    Evidence of the disclosure shall be maintained by the licensee.
