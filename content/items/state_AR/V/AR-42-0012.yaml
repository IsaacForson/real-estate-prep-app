stem: A licensee acting solely as a seller's agent discloses the agency relationship to a
  prospective buyer, but only after the buyer has already signed a purchase offer. Under Rule 8.1,
  what has gone wrong with the timing?
options:
  - Disclosure needs to occur once the transaction has closed successfully
  - Disclosure is required if the buyer specifically requests it in writing
  - Disclosure may be postponed indefinitely once earnest money has been deposited
  - Disclosure is required before the buyer signs any related document
key: D
explanation: Rule 8.1(c) requires that disclosure of the agency relationship must be made before the
  buyer or lessee signs any document related to the transaction, such as an offer or lease
  agreement.
