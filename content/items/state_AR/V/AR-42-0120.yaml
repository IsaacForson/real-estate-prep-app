stem: A buyer delivers earnest money to the buyer's agent to hold pending closing. Under section
  17-42-316(a)(2)(I), what must the licensee do with the earnest money?
options:
  - The licensee must deposit the earnest money into a personal account for convenience.
  - The licensee must hold the earnest money indefinitely until the client requests an accounting.
  - The licensee must use the earnest money to cover office expenses with the client's permission.
  - The licensee must account in a timely manner for all moneys and property received in which the
    client has or may have an interest.
key: D
explanation: The statute obligates the licensee to 'Account in a timely manner for all moneys and
  property received in which the client has or may have an interest.' Thus, the licensee must
  promptly account for the earnest money. The option stating that the licensee must hold the earnest
  money indefinitely until the client requests an accounting is incorrect because the duty requires
  timely accounting, not indefinite retention.
