stem: Under section 17-42-316, what is the primary duty a licensee pledges upon accepting employment
  by a client?
options:
  - Equal fidelity to protect the interests of both parties equally
  - Limited fidelity subject to the licensee's own financial interests
  - Conditional fidelity that ends once an offer is accepted
  - Absolute fidelity to protect and promote client interests
key: D
explanation: Section 17-42-316(b)(1) states that in accepting employment by a client, a licensee
  pledges a primary duty of absolute fidelity to protect and promote the interests of the client or
  clients.
