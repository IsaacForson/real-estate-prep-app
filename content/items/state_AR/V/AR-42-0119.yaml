stem: A seller has signed a purchase agreement with Buyer A. Later, Buyer B submits a written offer
  to the seller through the seller's agent. What must the licensee do with Buyer B's offer?
options:
  - The licensee must inform the buyer that the seller cannot consider new offers.
  - The licensee must withhold the offer because the seller is already under contract.
  - The licensee must present the offer only if the seller requests it.
  - The licensee must accept delivery of and present the offer to the seller in a timely manner.
key: D
explanation: The licensee must accept delivery of and present an offer to the seller or lessor in a
  timely manner, regardless of whether the property is already under contract. Therefore, the
  licensee must present Buyer B's offer promptly. The option stating that the licensee must withhold
  the offer because the seller is already under contract is incorrect because the obligation to
  present exists even when the seller is under contract.
