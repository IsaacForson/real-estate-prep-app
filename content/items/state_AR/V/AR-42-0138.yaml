stem: A licensee discloses the agency relationship to a buyer after the buyer has signed a purchase
  offer but before closing. Under Rule 8.4, what is the consequence?
options:
  - The licensee is subject to sanctions under Ark. Code Ann. § 17-42-319
  - The licensee is subject to sanctions under Ark. Code Ann. § 17-42-316
  - The licensee is not subject to any sanction because disclosure occurred before closing
  - The licensee is subject to sanctions under Ark. Code Ann. § 17-42-312
key: D
explanation: Rule 8.4 states that a licensee who fails to disclose the agency relationship in the
  required time and manner shall be subject to sanctions under Ark. Code Ann. § 17-42-312.
  Disclosing after the buyer has signed a purchase offer is untimely, constituting a failure to
  disclose as required, thus triggering those sanctions.
