stem: Under section 17-42-316(b)(G), what must a licensee disclose to the client regarding the
  transaction?
options:
  - All confidential information obtained during the agency relationship, regardless of perceived
    importance.
  - Material facts of the transaction that the licensee is aware of or should be aware of and that
    are not confidential information.
  - Any personal opinions about the property's market value or condition that the licensee may hold.
  - The licensee's commission structure for the transaction, including any referral fees.
key: B
explanation: Section 17-42-316(b)(G) requires the licensee to disclose material facts of the
  transaction that the licensee is aware of or should be aware of and that are not confidential
  information. The correct option states that the licensee must disclose material facts of the
  transaction that the licensee is aware of or should be aware of and that are not confidential
  information. The option about the licensee's commission structure for the transaction, including
  any referral fees, is incorrect because this rule does not require disclosure of commission
  structure or referral fees.
