stem: A licensee receives a referral fee from both the buyer and the seller in a transaction. Under
  Rule 8.5(d), what must the licensee do before accepting such compensation?
options:
  - Provide full written disclosure to all parties to the transaction
  - Provide verbal disclosure to both buyer and seller
  - Provide notice to the principal broker and the escrow agent
  - Provide a written receipt to the escrow agent and the principal broker
key: A
explanation: Rule 8.5(d) prohibits accepting compensation from more than one party without full
  written disclosure to all parties to the transaction. Verbal disclosure, notice to the broker, or
  providing a receipt do not meet this requirement. The correct action is to give written disclosure
  to all parties.
