stem: A client wants to waive several of the duties a licensee otherwise owes under section
  17-42-317. Under section 17-42-319, why is a signed waiver statement alone with a verbal agreement
  **NOT** sufficient?
options:
  - Verbal agreements automatically satisfy the statute as long as a witness is present
  - Any duty may be waived informally once the client reaches the age of majority
  - The statute permits waiver for lease transactions, not for sales
  - The statement lists fiduciary duties, waived duties, and boldface language
key: D
explanation: Section 17-42-319(a) requires the waiver statement to list the fiduciary duties under
  section 17-42-316, list the specific duties under section 17-42-317 or 17-42-318 being waived, and
  include required boldface language, so a verbal understanding alone does not meet the statute.
citation:
  source: Ark. Code Ann. § 17-42-319
  url: null
  quoted_text: A licensee shall perform the duties required under § 17-42-317 or § 17-42-318 unless
    the client agrees to waive these duties and signs a waiver of duties statement
