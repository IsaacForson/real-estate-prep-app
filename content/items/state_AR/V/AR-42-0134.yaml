stem: Under § 17-42-316(b)(2)(K), what must a licensee refrain from doing concerning confidential
  information?
options:
  - The licensee must refrain from disclosing confidential information to a licensee who is not an
    agent of the client
  - The licensee must disclose confidential information to any licensee who requests it
  - The licensee must share confidential information with another licensee after obtaining verbal
    client consent
  - The licensee must use confidential information to market other listings to prospective buyers
key: A
explanation: The key is correct because § 17-42-316(b)(2)(K) requires licensees to refrain from
  disclosing confidential information to a licensee who is not an agent of the client. The most
  tempting distractor is B, which suggests disclosing confidential information to any licensee upon
  request; this violates the duty of confidentiality and is prohibited unless the recipient is an
  agent of the client.
