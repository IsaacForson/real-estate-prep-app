stem: A seller asks the licensee what steps are needed to clear a title defect before closing. The
  licensee, within scope of knowledge, must answer the seller's question about steps to fulfill the
  contract. Under § 17-42-317(a)(3)(A), what must the licensee do?
options:
  - The licensee must answer the seller's question about the steps needed to clear the title defect
  - The licensee must delay answering until the seller obtains a title insurance commitment.
  - The licensee must provide a written title opinion to the seller before answering any question.
  - The licensee must ask the seller to consult a real estate attorney before discussing any steps.
key: A
explanation: The key is correct because § 17-42-317(a)(3)(A) requires licensees to answer the
  client's questions about steps to fulfill contract terms within their knowledge limits. The most
  tempting distractor is B, which advises refraining from answering because it involves legal
  advice; however, explaining procedural steps to fulfill a contract is within the licensee's
  permissible scope.
