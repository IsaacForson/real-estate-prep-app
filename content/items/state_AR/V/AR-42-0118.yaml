stem: Under Arkansas Real Estate License Law, what duty requires a licensee to keep confidential all
  confidential information obtained during the agency relationship?
options:
  - The licensee must disclose all confidential information to the client.
  - The licensee must use confidential information to market other properties.
  - The licensee must share confidential information with other licensees.
  - The licensee must keep confidential all confidential information.
key: D
explanation: Under Ark. Code Ann. § 17-42-316(a)(2)(J), a licensee must keep confidential all
  confidential information obtained during the agency relationship. Therefore, the duty described is
  to keep such information confidential. Disclosing confidential information to the client, using it
  to market other properties, or sharing it with other licensees would violate this duty.
