stem: According to Rule 8.3(b), from whom may a licensee accept a commission, rebate, profit,
  payment, compensation or other valuable consideration in connection with a real estate
  transaction?
options:
  - Accepting compensation from the licensed principal broker only
  - Accepting compensation from any party to the transaction
  - Accepting compensation from both parties with written disclosure
  - Accepting compensation from the client's attorney
key: A
explanation: Rule 8.3(b) states that a licensee shall not accept a commission, rebate, profit,
  payment, compensation or other valuable consideration from any person or entity except the
  licensed principal broker under whom the licensee is licensed. Therefore, only the principal
  broker is permitted. The distractor suggesting acceptance from any party is incorrect because the
  rule explicitly prohibits such acceptance except from the principal broker.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
