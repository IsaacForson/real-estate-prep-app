stem: A seller asks the listing licensee what steps are required to fulfill the purchase contract
  after signing. Under section 17-42-317(a)(3)(A), what may the licensee do?
options:
  - Refuse to answer because the seller should consult an attorney about contractual obligations.
  - Answer the seller's questions regarding the steps the seller must take to fulfill the terms of
    the contract.
  - Seek additional offers from other buyers before answering the seller's question about steps.
  - Wait until closing to provide any information about steps the seller must take.
key: B
explanation: Section 17-42-317(a)(3)(A) allows the licensee to answer the seller's or lessor's
  questions about the steps needed to fulfill the contract terms, as long as the answer stays within
  the licensee's knowledge. The correct option reflects this permission. Waiting until closing to
  provide such information is unnecessary because the licensee may answer earlier. Seeking
  additional offers before responding is inappropriate and not permitted. Refusing to answer and
  directing the seller to an attorney is also incorrect because the licensee may provide this
  information directly.
