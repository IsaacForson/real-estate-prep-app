stem: A licensee represents both the seller and the buyer in the same sale transaction. Under Rule
  8.3, why is written consent from both parties required before or at execution of the contract,
  rather than obtained afterward?
options:
  - Written consent afterward would automatically void the entire sales contract
  - Dual representation is otherwise treated as a felony under state law
  - Consent from every party precedes or coincides with contract execution
  - The Commission requires afterward consent for lease transactions, not sales
key: C
explanation: Rule 8.3(a) requires that all parties give written consent to dual representation prior
  to or at the time of execution of the agency contract, listing contract, or other real estate
  contract, so consent must precede the relationship rather than follow it.
