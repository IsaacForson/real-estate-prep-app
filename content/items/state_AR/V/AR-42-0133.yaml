stem: A buyer's agent receives a written counteroffer from the seller after presenting the buyer's
  offer. According to section 17-42-318(a)(4)(B), what must the licensee do with the counteroffer?
options:
  - The licensee must request the seller to improve the counteroffer before presenting
  - The licensee must accept delivery of and present the counteroffer to the buyer
  - The licensee must seek additional offers before presenting the counteroffer
  - The licensee must ignore the counteroffer because the buyer already has an offer
key: B
explanation: Section 17-42-318(a)(4)(B) obligates a buyer's agent to accept delivery of and present
  any counteroffers to the buyer. Therefore, the licensee must present the counteroffer received
  from the seller. The rule does not require the agent to seek additional offers before presenting a
  counteroffer, so suggesting that the licensee must seek additional offers before presenting the
  counteroffer is incorrect.
