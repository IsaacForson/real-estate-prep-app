stem: A licensee representing a seller shows a prospective buyer another property that is also
  listed with the same brokerage. Under section 17-42-317(b), does this action breach a duty to the
  seller?
options:
  - The action breaches the licensee's duty to the seller
  - The action is permitted under the statute
  - The action breaches duty unless the seller consents in writing
  - The action is permitted only if the property is not under contract
key: B
explanation: Section 17-42-317(b) explicitly states that a licensee does not breach a duty to a
  seller or lessor by showing alternative properties to a prospective buyer. Therefore, the action
  is permitted. The distractor suggesting a breach unless the seller consents in writing is
  incorrect because the statute provides an unconditional permission.
citation:
  source: Ark. Code Ann. § 17-42-101 et seq. — Arkansas Real Estate License Law and Time-Share Law
    (AREC compilation, August 2024) — § 17-42-317
  url: null
  quoted_text: A licensee does not breach a duty or an obligation to a seller or lessor with whom the
    licensee has an agency relationship by showing alternative properties to a prospective buyer or
    by acting as an agent or subagent for other sellers or lessors.
