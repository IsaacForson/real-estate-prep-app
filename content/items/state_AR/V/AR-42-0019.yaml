stem: A licensee managing a client's property is offered a rebate by a repair vendor for referring
  business. Under Rule 8.5, what must occur before the licensee accepts the rebate?
options:
  - Approval from a majority vote of the firm's other licensees
  - A public filing announcing the rebate with the county clerk
  - Full written disclosure to the represented party
  - Verbal notice given to the repair vendor involved
key: C
explanation: Rule 8.5(c) provides that when acting as agent in the sale or management of property, a
  licensee shall not accept any rebate or other valuable consideration from any source without full
  written disclosure to the party represented.
