stem: When representing a seller or lessor, what must a licensee do regarding offers or
  counteroffers of which the licensee has actual knowledge?
options:
  - Providing information to the seller or lessor
  - Withholding information from the seller or lessor
  - Seeking additional offers from other buyers
  - Presenting the offer to the buyer
key: A
explanation: The rule requires the licensee to provide information to the seller or lessor about any
  offers or counteroffers the licensee knows of. Withholding that information would violate the duty
  to inform, while seeking additional offers is only required if the client requests it. Presenting
  the offer to the buyer is not the licensee's role when representing the seller.
