stem: Under Rule 8.1(b), what must a licensee maintain as evidence of the agency relationship disclosure?
options:
  - The licensee must obtain a signed written disclosure from the buyer.
  - The licensee must record the oral disclosure and keep the recording.
  - The licensee must file the disclosure with the Arkansas Real Estate Commission.
  - The licensee must maintain evidence of the disclosure.
key: D
explanation: The rule requires the licensee to maintain evidence of the disclosure, making the
  option that states 'The licensee must maintain evidence of the disclosure' correct. The option
  that states 'The licensee must obtain a signed written disclosure from the buyer' is incorrect
  because the rule does not require a signed written disclosure from the buyer; it only requires the
  licensee to keep evidence of the disclosure.
