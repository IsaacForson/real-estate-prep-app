stem: A licensee represents the seller in a transaction where the buyer is unrepresented. Under
  section 17-42-108, what must the licensee clearly disclose to the buyer?
options:
  - The exact commission percentage earned on the sale
  - Which party or parties the licensee is representing
  - The licensee's personal opinion of the property's value
  - The seller's minimum acceptable purchase price
key: B
explanation: Section 17-42-108(a)(1) requires that in every real estate transaction involving a
  licensee, the licensee shall clearly disclose to all parties or their agents which party or
  parties he or she is representing.
