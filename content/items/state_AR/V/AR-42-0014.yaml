stem: A licensee representing a buyer meets the seller's agent for the first time to discuss a
  property. Under Rule 8.2, when must the licensee disclose the buyer agency relationship to the
  seller's agent?
options:
  - Within thirty days after the property is first shown
  - At the first contact with the seller or agent
  - After the buyer has made a formal written offer
  - At the closing table, once documents are signed
key: B
explanation: Rule 8.2(a)(1) requires a licensee acting solely as agent for a buyer or lessee to
  disclose the agency relationship at the first contact with the seller, lessor, or the agent of the
  seller or lessor.
