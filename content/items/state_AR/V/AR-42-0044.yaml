stem: A licensee acting as seller's agent discloses the agency relationship to the buyer's licensed
  agent. Under Rule 8.1(a)(2), what must the licensee do next?
options:
  - The licensee must terminate the agency relationship
  - The licensee must obtain written consent from the buyer
  - The licensee must convey the disclosure to the buyer in a timely manner
  - The licensee must reduce the disclosure to writing within 48 hours
key: C
explanation: Rule 8.1(a)(2) provides that when the disclosure is made to the licensed agent of the
  buyer or lessee, it is that licensee's duty to convey the disclosure to the buyer or lessee in a
  timely manner. Therefore, the licensee must convey the disclosure to the buyer. The distractor
  about obtaining written consent is incorrect because the rule does not require consent, only
  conveyance.
