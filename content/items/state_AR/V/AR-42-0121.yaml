stem: Under section 17-42-316, what duty does a licensee have regarding money or property received
  on behalf of a client?
options:
  - The duty to account for all moneys and property received in which the client has or may have an
    interest
  - The duty to obtain reasonable efforts to locate a property at an acceptable price for the client
  - The duty to disclose all material facts of the transaction to the client and to advise on
    necessary steps
  - The duty to follow lawful instructions of the client unless doing so would expose the licensee
    to liability
key: A
explanation: The statute requires licensees to account in a timely manner for all moneys and
  property received in which the client has or may have an interest. The distractor about disclosing
  material facts is also a duty but does not pertain to accounting for client funds.
