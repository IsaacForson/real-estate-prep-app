stem: A licensee acting as seller's agent meets a prospective buyer at an open house and discusses
  the buyer's motivation and financing needs before disclosing that they represent the seller. Under
  Rule 8.1(a)(1), what has the licensee failed to do?
options:
  - The licensee failed to make the disclosure in a timely manner
  - The licensee failed to obtain written consent for dual agency
  - The licensee failed to present an offer to the seller
  - The licensee failed to maintain evidence of the disclosure
key: A
explanation: Rule 8.1(a)(1) requires the licensee to disclose the agency relationship in a timely
  manner to avoid eliciting confidential information such as the buyer's motivation or financial
  situation. By discussing those topics before making the disclosure, the licensee violated the
  timing requirement. The statement that the licensee failed to obtain written consent for dual
  agency is incorrect because written consent for dual agency is not required in this scenario where
  the licensee represents only the seller.
citation:
  source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15) — Arkansas Real Estate Commission
    Regulations, Time-Share Regulations (April 2024) — § 8.1(a)(1)
  url: null
  quoted_text: Such disclosure shall be made in a timely manner under the particular circumstances so
    as to avoid to the extent possible eliciting or receiving from the prospective buyer or lessee
    information which would reasonably be expected to remain confidential and not disclosed to the
    seller or lessor, such as, for example, information concerning the real estate needs or
    motivations, negotiating strategies or tactics, or the financial situation of the potential
    buyer or lessee.
