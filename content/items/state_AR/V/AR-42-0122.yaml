stem: A seller has signed a purchase agreement, but the licensee representing the seller receives a
  second purchase offer. What must the licensee do with the second offer?
options:
  - The licensee must present the second offer to the seller in a timely manner and note all offers
  - The licensee must ignore the second offer because the seller is already under contract
  - The licensee must seek the seller's instructions before presenting any additional offer
  - The licensee must present the second offer only if it exceeds the contracted price
key: A
explanation: The rule states that a licensee must accept delivery of and present an offer to the
  seller in a timely manner, regardless of whether the property is subject to a contract. The
  distractor that the licensee should ignore the offer contradicts this requirement.
