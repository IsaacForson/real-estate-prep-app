stem: A Vermont real estate broker receives an earnest money deposit from a buyer on Monday.
  According to Vermont law, by what deadline must the broker deposit the funds into a trust or
  escrow account?
options:
  - Within five calendar days
  - Within five banking days
  - Within five fiscal days
  - Within five business days
key: B
explanation: Under §2214(a), a broker must deposit earnest money into a trust or escrow account
  within five banking days of receipt. Hence the correct answer is A. The other options misstate the
  timing or confuse calendar with banking days.
