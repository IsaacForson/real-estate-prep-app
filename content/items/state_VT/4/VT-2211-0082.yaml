stem: A broker opens a new trust account for earnest money deposits. Within how many days must the
  broker notify the Vermont Real Estate Commission of the bank where the account is located?
options:
  - Within 5 days
  - Within 10 days
  - Within 30 days
  - Within 24 hours
key: B
explanation: Under 26 V.S.A. § 2214(a), a broker must notify the Vermont Real Estate Commission of
  the bank where a trust or escrow account is held within 10 days of opening the account. Therefore,
  the correct timeframe is 10 days. The alternative of 5 days pertains to the deadline for
  depositing earnest money, not to the notification requirement.
