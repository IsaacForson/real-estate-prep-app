stem: A Vermont real estate broker opens a new trust account at a bank on June 1. What must the
  broker do within 10 days after opening the account according to Vermont law?
options:
  - Notify the Commission of bank or financial institution where account is located
  - Notify the Vermont Housing Finance Agency of the trust account location
  - Notify the buyer of the trust account details, location, and opening date
  - Notify the Office of Professional Regulation of the bank holding the trust account
key: A
explanation: Under 26 V.S.A. § 2214(a), a broker must notify the Commission within ten days after
  opening any trust or escrow account, providing the name of the bank or financial institution where
  the account is held. Therefore, the option stating that the broker must notify the Commission of
  the bank or financial institution where the account is located is correct. The other options
  incorrectly direct the notice to the Vermont Housing Finance Agency, the buyer, or the Office of
  Professional Regulation, which are not the required recipients under the statute.
citation:
  source: 26 V.S.A. ch. 41 — 26 V.S.A. Chapter 41 — Real Estate Brokers and Salespersons § 2214(a)
  url: null
  quoted_text: The broker shall notify the Commission, within 10 days after opening any trust or
    escrow account, of the bank or other financial institution in which the account is located.
