stem: A Vermont real estate licensee continues to practice after the Board issued an order to cease
  all brokerage activity. Under Vermont law, which action is the Board authorized to take?
options:
  - The board may require the licensee to complete continuing education within thirty days.
  - The board may refer the case to the Attorney General for criminal prosecution.
  - The board may immediately suspend the license pending a hearing on the alleged noncompliance.
  - The board may issue a warning or reprimand to the licensee after reviewing the violation.
key: D
explanation: The board may issue warnings or reprimands, suspend, revoke, or take other disciplinary
  actions after a hearing; immediate suspension is allowed only in emergency situations. Referring
  to the Attorney General or mandating continuing education are not authorized responses under this
  provision.
