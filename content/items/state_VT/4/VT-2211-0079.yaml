explanation: Under §2213, any violation of the chapter incurs the penalties set forth in 3 V.S.A.
  §127. Therefore, the correct answer is that penalties are those provided in 3 V.S.A. §127. The
  distractor suggesting an automatic revocation is incorrect because the statute does not mandate
  revocation for every violation; it only references the general penalty provision.
