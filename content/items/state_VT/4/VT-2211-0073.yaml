stem: "A licensee persuades an elderly client to sign a purchase agreement that will benefit the
  licensee’s sibling, exploiting the client for financial gain. Under Vermont law, this conduct is:"
options:
  - It is considered unprofessional conduct under Vermont law.
  - It is permitted if the client provides written consent.
  - It is allowed when the licensee discloses the relationship.
  - It is subject to a civil penalty under the statute.
key: A
explanation: The statute defines exercising undue influence or taking improper advantage of a person
  for financial gain as unprofessional conduct (§129(12)). Therefore the licensee’s exploitation of
  the client for the sibling’s benefit is unprofessional conduct. The distractor claiming the
  conduct is permitted with written consent is incorrect because consent does not negate the
  prohibition on undue influence.
