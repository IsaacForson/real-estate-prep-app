  url: null
  quoted_text: The temporary license shall authorize the holder to practice in Vermont until the
    termination of the declared state of emergency or 90 days, whichever occurs first, provided the
    licensee remains in good standing, and may be reissued by the board if the declared state of
    emergency continues longer than 90 days.
