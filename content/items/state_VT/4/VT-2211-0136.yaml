stem: A Vermont real estate broker licensed in good standing in another state applies for a
  temporary license to practice during a declared state of emergency. Under Vermont law, how long
  may the temporary license authorize practice before it must be reissued?
options:
  - The temporary license may authorize practice only if the licensee completes a corrective action
    plan within 90 days and pays the required fee.
  - The temporary license may authorize practice for up to 60 days before requiring renewal, unless
    the emergency ends earlier.
  - The temporary license may authorize practice until the termination of the declared state of
    emergency or 90 days, whichever occurs first.
  - The temporary license may authorize practice for the entire duration of the declared state of
    emergency without any limitation on renewal.
key: C
explanation: The statute provides that a temporary license issued during a declared state of
  emergency authorizes practice until the emergency ends or 90 days, whichever occurs first, and may
  be reissued if the emergency continues longer than 90 days. The other options either shorten the
  period, remove the limit, or add conditions not found in the rule.
citation:
  source: "3 V.S.A. ch. 5 — 3 V.S.A. Chapter 5 — Secretary of State (Subchapter 3: Office of
