stem: "A Vermont real estate salesperson is convicted of a misdemeanor in a Vermont District Court
  and fails to notify the Office of Professional Regulation within 30 days. Under Vermont law, this
  failure is:"
options:
  - It is considered unprofessional conduct under Vermont law.
  - It is subject to a civil penalty under the statute.
  - It is allowed if the conviction is unrelated to real estate.
  - It is permitted if the conviction occurred out of state.
key: A
explanation: Under §129(11), failing to report any felony or misdemeanor conviction within 30 days
  is unprofessional conduct. Therefore the licensee’s failure to report the misdemeanor conviction
  is unprofessional conduct. The distractor that claims the conduct is only subject to a civil fine
  is incorrect because the statute treats the failure to report as a disciplinary violation, not a
  mere civil penalty.
