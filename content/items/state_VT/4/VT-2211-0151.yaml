stem: Under Vermont law, within how many days after opening a trust or escrow account must a broker
  notify the Commission of the bank or financial institution where the account is located?
options:
  - Five days
  - Ten days
  - Fifteen days
  - Thirty days
key: B
explanation: Under 26 V.S.A. § 2214, a broker must notify the Commission within 10 days after
  opening any trust or escrow account. The five‑day period applies to depositing earnest money, not
  to the notification requirement.
citation:
  source: 26 V.S.A. ch. 41 — 26 V.S.A. Chapter 41 — Real Estate Brokers and Salespersons — § 2214
  url: null
  quoted_text: The broker shall notify the Commission, within 10 days after opening any trust or
    escrow account, of the bank or other financial institution in which the account is located.
