stem: Under Vermont law, under what circumstance may the interest earned on an individual
  interest-bearing trust account be disposed of differently than the default rule specified in
  subsection (b)(1)?
options:
  - The broker decides unilaterally
  - The deposit is less than $1,000
  - All parties agree in writing otherwise
  - The deposit is expected to earn minimal interest
key: C
explanation: The statute provides that interest follows the default rule unless all parties agree in
  writing to a different disposition. Therefore, a written agreement among all parties changes how
  the interest is handled. The distractor about deposit amount is incorrect because the monetary
  size of the deposit does not alter the rule.
citation:
  source: 26 V.S.A. ch. 41 — 26 V.S.A. Chapter 41 — Real Estate Brokers and Salespersons — § 2214(b)(1)
  url: null
  quoted_text: Unless otherwise agreed to in writing by all parties, the interest earned shall be
    applied to the purchase price due from the buyer if the sale is consummated, shall be returned
    to the buyer if the deposit is returned to the buyer, and shall be payable to the seller if the
    buyer defaults.
