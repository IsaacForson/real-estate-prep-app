stem: Under Vermont law, what is the consequence for a broker who draws a check against an
  uncollected earnest money deposit in an individual interest-bearing trust account?
options:
  - The broker must return the deposit to the buyer immediately.
  - The broker is subject to penalties under 3 V.S.A. § 127.
  - The broker’s license is automatically revoked.
  - The broker must pay a fine of $500 to the Vermont Real Estate Commission.
key: B
explanation: Section 2213 states that any person who violates any provision of the chapter is
  subject to the penalties provided in 3 V.S.A. § 127. Drawing a check against uncollected funds
  violates subsection 2214(b)(2), so the broker faces those penalties. The distractor about
  returning the deposit incorrectly suggests a specific remedy that the statute does not mandate for
  this violation.
