stem: According to Vermont law, what amount of a licensee's own funds may be commingled with trust
  or escrow account funds to maintain an open trust account?
options:
  - Allowed amount is nominal sums
  - Allowed amount is up to $100
  - Allowed amount is up to 5%
  - Allowed amount is any amount
key: A
explanation: The statute permits commingling only nominal sums of the licensee’s own funds to
  maintain an open trust account; any greater amount is prohibited. The distractor suggesting a
  specific dollar amount misstates the rule, which imposes no fixed limit but relies on the nominal
  sums exception.
