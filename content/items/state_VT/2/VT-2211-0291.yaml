stem: A broker receives a request from the buyer to withdraw funds from an earnest money deposit for
  repairs; the buyer and seller both provide written agreement to allow the withdrawal before the
  contract is terminated. Under Vermont law, may the broker honor this withdrawal request?
options:
  - Yes, only if the deposit has cleared
  - No, unless a court orders the withdrawal
  - Yes, because all parties agreed in writing
  - No, withdrawals are not allowed before contract ends
key: C
explanation: Section 2214(b)(3) prohibits withdrawal of contract deposits unless the contract has
  been terminated by performance, its own terms, written agreement of all parties, or court order.
  Since all parties have agreed in writing, the broker may honor the request. The distractor stating
  withdrawals are prohibited until termination ignores the written‑agreement exception.
