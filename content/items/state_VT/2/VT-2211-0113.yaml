stem: A Vermont real estate broker receives a written request from the Vermont Real Estate
  Commission to inspect the trust account records for a recent transaction. According to Vermont
  law, what must the broker do?
options:
  - Provide the records at the broker’s home office during regular business hours.
  - Provide the records at the broker’s usual place of business during regular business hours.
  - Provide the records at the broker’s principal office only after receiving a written subpoena.
  - Provide the records only if the transaction involves a residential property.
key: B
explanation: The law requires brokers to keep trust account records at their usual place of business
  and make them open for inspection by the Commission during regular business hours. Therefore, the
  broker must provide the records at the usual place of business during regular business hours. The
  distractor about needing a court order is incorrect because the statute does not condition
  inspection on a court order; it grants the Commission direct inspection rights.
citation:
  source: 26 V.S.A. ch. 41 — 26 V.S.A. Chapter 41 — Real Estate Brokers and Salespersons § 2214(a)
  url: null
  quoted_text: The broker shall maintain at the broker’s usual place of business, books, records,
    contracts, and other documents pertinent to or relating to the trust or escrow account and
    monies therein, which shall be open for inspection by the Commission and its duly authorized
    agents at the broker’s usual place of business during regular business hours.
