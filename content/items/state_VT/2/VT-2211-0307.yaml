stem: Under Vermont law, what penalty provision applies to a person who violates any provision of
  Chapter 41 concerning real estate brokers and salespersons?
options:
  - Subject to suspension of license for six months
  - Subject to mandatory continuing education hours
  - Subject to penalties provided in 3 V.S.A. § 127
  - Subject to a fine of up to $1,000 per violation
key: C
explanation: The key is correct because §2213 states that any violation of the chapter subjects the
  person to penalties under 3 V.S.A. §127. The most tempting distractor is B, which suggests a
  specific fine amount, but the statute does not set a fine; it only references the general penalty
  provision.
