stem: A buyer’s earnest money deposit is placed in an individual interest‑bearing trust account. The
  sale closes and the deposit is applied toward the purchase price. Under Vermont law, what happens
  to the interest earned on that deposit?
options:
  - The interest is applied to the purchase price due from the buyer.
  - The interest is returned to the buyer.
  - The interest is payable to the seller.
  - The interest is remitted to the Vermont Housing Finance Agency.
key: A
explanation: According to subsection 2214(b)(1), unless otherwise agreed, interest on an individual
  interest‑bearing account is applied to the purchase price due from the buyer when the sale is
  consummated. Returning the interest to the buyer applies only if the deposit is returned, paying
  it to the seller applies on buyer default, and remitting to VHFA applies to pooled accounts.
citation:
  source: 26 V.S.A. ch. 41 — 26 V.S.A. Chapter 41 — Real Estate Brokers and Salespersons § 2214(b)(1)
  url: null
  quoted_text: Unless otherwise agreed to in writing by all parties, the interest earned shall be
    applied to the purchase price due from the buyer if the sale is consummated, shall be returned
    to the buyer if the deposit is returned to the buyer, and shall be payable to the seller if the
    buyer defaults.
