stem: A Vermont broker receives an earnest money deposit, places the funds in a trust account, but
  fails to keep any deposit slips, ledger entries, or other records of the transaction. Under
  Vermont law, how should this action be classified?
options:
  - It is considered unprofessional conduct because failing to maintain records of trust account
    funds violates Vermont law.
  - It is permissible as long as the broker can also later reconstruct the transactions from memory.
  - It is allowed if the omission also occurs only once during the licensing period.
  - It is also subject only to a verbal warning from the Vermont Real Estate Commission.
key: A
explanation: Vermont law lists failing to maintain records as unprofessional conduct; the broker’s
  omission violates this requirement. The distractor suggesting memory reconstruction is sufficient
  misstates the rule, which mandates actual record retention.
