stem: A Vermont real estate licensee learns that the property being sold has a malfunctioning septic
  system after the purchase and sale agreement is signed but before closing. What must the licensee
  do under Vermont law?
options:
  - Inform the buyer that the septic system repair costs are less than $1,000
  - Inform the buyer that the septic system issue will be resolved after closing
  - Inform the buyer that the septic system is functioning adequately to avoid contract termination
  - Inform the buyer that the septic system is malfunctioning as a material fact
key: D
explanation: The licensee must inform the buyer of the malfunctioning septic system because it is a
  material fact that must be disclosed under § 2296(4). The distractor suggesting the licensee
  should claim the system is functioning adequately is incorrect because misrepresenting the
  condition violates the duty to disclose material facts.
