stem: Under Vermont law, what documentation must a broker retain when informing a depositor whether
  earnest money is placed in an individual interest‑bearing trust account or a pooled
  interest‑bearing trust account?
options:
  - an entry made in the broker's personal ledger for the trust account transaction
  - a written statement signed by the beneficial owner indicating the account type
  - a photocopy of the earnest money check provided by the buyer at closing for the transaction
  - an email confirmation sent to the Vermont Real Estate Commission regarding the account opening
key: B
explanation: Vermont law requires the broker to inform the depositor whether the earnest‑money funds
  are placed in an individual interest‑bearing trust account or a pooled interest‑bearing trust
  account and to retain a written statement of that disclosure signed by the beneficial owner of the
  account (26 V.S.A. § 2214(d)). A written statement signed by the beneficial owner indicating the
  account type therefore satisfies the documentation requirement. An entry in a personal ledger, a
  photocopy of the buyer’s check, and an email to the commission do not meet the statutory
  requirement because the statute specifically mandates a signed written statement from the
  beneficial owner.
citation:
