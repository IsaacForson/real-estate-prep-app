  url: null
  quoted_text: The broker shall inform the depositor whether funds are deposited into an individual
    account pursuant to subsection (b) of this section or in a pooled account pursuant to subsection
    (c) of this section. The broker shall retain a written statement of this disclosure signed by
    the beneficial owner of the account.
