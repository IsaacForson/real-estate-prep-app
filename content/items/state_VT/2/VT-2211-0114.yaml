stem: A Vermont Real Estate Commission investigator arrives to inspect a broker’s trust account
  records. Where must the broker make these records available for inspection?
options:
  - At the broker’s usual place of business during regular business hours.
  - At the broker’s personal residence upon request.
  - At the nearest Vermont Housing Finance Agency office.
  - At the broker’s corporate headquarters in another state.
key: A
explanation: Subsection 2214(a) states that the broker must maintain books and records at the usual
  place of business, open for inspection by the Commission during regular business hours. The other
  locations are not authorized by the statute.
citation:
  source: 26 V.S.A. ch. 41 — 26 V.S.A. Chapter 41 — Real Estate Brokers and Salespersons § 2214(a)
  url: null
  quoted_text: The broker shall maintain at the broker’s usual place of business, books, records,
    contracts, and other documents pertinent to or relating to the trust or escrow account and
    monies therein, which shall be open for inspection by the Commission and its duly authorized
    agents at the broker’s usual place of business during regular business hours.
