stem: Under Vermont law, what must a licensee disclose to a buyer concerning the licensee's
  relationship with the seller?
options:
  - The licensee must disclose to the buyer that the buyer’s financing approval is pending.
  - The licensee must disclose to the buyer that the property is subject to a zoning variance.
  - The licensee must disclose to the buyer that there exists an agency relationship between the
    licensee and the seller.
  - The licensee must disclose to the buyer that the seller has accepted another offer.
key: C
explanation: Vermont law requires a licensee to tell a buyer that the licensee has an agency
  relationship with the seller. This disclosure requirement is set out in 26 V.S.A. § 2296(5). The
  other answer choices describe disclosures that the statute does not require, such as the buyer’s
  financing status, a zoning variance, or the seller’s acceptance of another offer.
