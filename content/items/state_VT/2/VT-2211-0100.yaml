stem: Under Vermont law, how must a real estate broker maintain trust or escrow accounts relative to
  the broker’s individual or office account?
options:
  - Kept separate and apart from the broker’s account
  - Kept combined with the broker’s account
  - Kept in the broker’s personal account
  - Kept only for transactions over $10,000
key: A
explanation: The statute requires trust and escrow accounts to be maintained separate and apart from
  a broker’s individual or office account. Keeping the funds combined with the broker’s account
  would violate this rule.
