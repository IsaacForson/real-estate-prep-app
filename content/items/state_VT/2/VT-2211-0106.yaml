stem: "A Vermont broker keeps trust account records only on a personal laptop and refuses to provide
  them to the Vermont Real Estate Commission upon request. Under Vermont law, this behavior is:"
options:
  - The broker’s behavior is acceptable provided the broker submits a summary of the records to the
    commission annually.
  - The broker’s behavior is allowed if the broker notifies the clients that records are stored
    electronically.
  - The broker’s behavior is considered unprofessional conduct because the broker failed to maintain
    required trust account records.
  - The broker’s behavior is permissible as long as the records are accurate and up‑to‑date.
key: C
explanation: Vermont law defines failing to maintain trust and escrow account records as
  unprofessional conduct. Keeping records solely on a personal laptop and refusing to provide them
  to the commission violates the record‑keeping requirement in § 2296(2). The other options describe
  situations that do not satisfy the statutory duty to maintain and produce records.
