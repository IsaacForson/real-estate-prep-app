stem: A broker receives an earnest money deposit on a Monday. The broker deposits the funds into the
  trust account on the following Monday. Is the broker in compliance with Vermont’s five‑banking‑day
  deposit requirement?
options:
  - The broker is in compliance with the five‑banking‑day deposit requirement.
  - The broker must also notify the Commission within 10 days of opening the account.
  - The broker must place the deposit in an interest‑bearing trust account.
  - The broker has violated the five‑banking‑day deposit requirement.
key: A
explanation: The deposit was made on the fifth banking day after receipt (Tuesday–Friday = days 1‑4,
  following Monday = day 5), which satisfies the 'within five banking days' rule. Therefore the
  broker is compliant. The option about violating the requirement incorrectly treats the fifth day
  as late, and the other options introduce unrelated obligations.
