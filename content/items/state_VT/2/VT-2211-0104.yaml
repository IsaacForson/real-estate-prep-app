stem: A Vermont real estate broker deposits a buyer’s $5,000 earnest money check into his personal
  checking account instead of a trust account. Under Vermont law, how should this action be
  classified?
options:
  - The broker’s action constitutes commingling of client funds with personal funds and is
    considered unprofessional conduct.
  - The broker’s action is permissible provided the funds are deposited into a separate escrow
    account within three business days.
  - The broker’s action is acceptable if the broker notifies the commission within five days of the
    deposit.
  - The broker’s action is allowed provided the broker keeps a detailed ledger of the earnest money
    deposit.
key: A
explanation: Depositing earnest money into a personal account rather than a trust account is
  commingling of client funds with the broker’s own funds, which Vermont law defines as
  unprofessional conduct under § 2296(1). The other options describe scenarios that do not excuse
  the commingling.
