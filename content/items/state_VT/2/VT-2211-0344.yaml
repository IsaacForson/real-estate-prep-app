stem: Under Vermont law, a broker deposits $20 of her own money into the trust account to cover a
  monthly service fee, keeping the account open. Is this action permissible?
options:
  - Yes, because nominal sums of the licensee’s own funds may be commingled to keep the trust
    account open.
  - No, unless the broker obtains written authorization from the Vermont Real Estate Commission to
    commingle funds.
  - No, because any commingling of personal funds with trust account funds is prohibited under
    Vermont law.
  - Yes, but only if the amount deposited is deemed nominal by the Vermont Real Estate Commission.
key: A
explanation: Under 26 V.S.A. ch. 41 § 2296(1), commingling of nominal sums of the licensee’s own
  funds is permitted to keep a trust account open; a $20 deposit for a service fee qualifies as a
  nominal sum, making the action permissible.
