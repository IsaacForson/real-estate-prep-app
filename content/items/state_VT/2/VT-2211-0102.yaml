stem: A broker receives an earnest money deposit that is not expected to earn substantial interest.
  Where must the interest from the pooled trust account be directed under Vermont law?
options:
  - To the buyer as a credit toward closing costs
  - To the Vermont Housing Finance Agency
  - To the broker’s office account for administrative expenses
  - To the seller as compensation for default
key: B
explanation: When a deposit is not expected to earn substantial interest, the broker must place it
  in a pooled interest‑bearing trust account and direct that the interest be remitted to the Vermont
  Housing Finance Agency. The other options misstate the destination of the interest.
