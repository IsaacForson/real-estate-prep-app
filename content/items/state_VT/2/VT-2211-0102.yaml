  quoted_text: If a deposit is not reasonably expected to earn a substantial amount of interest, the
    broker shall place the deposit in a pooled interest-bearing trust or escrow account and direct
    that the interest be remitted to the Vermont Housing Finance Agency in accordance with the
    provisions of 8 V.S.A. § 14210.
