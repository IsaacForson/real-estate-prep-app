stem: A Vermont real estate broker opens a trust account on June 1 and notifies the Vermont Real
  Estate Commission of the account on June 15. Under Vermont law, what is the consequence for this
  failure to notify within the required time?
options:
  - Must pay a fine of $250 to the Commission
  - Subject to penalties under 3 V.S.A. §127
  - No penalty if the account is later reported
  - License automatically revoked for 30 days
key: B
explanation: Vermont law requires a broker to notify the Real Estate Commission of a newly opened
  trust account within ten days (26 V.S.A. § 2214(a)). Failure to meet this deadline is a violation
  of the chapter, and any violation incurs penalties under 3 V.S.A. § 127 (see 26 V.S.A. § 2213).
  Therefore, the broker is subject to penalties under that statute. There is no preset fine of $250;
  the Commission determines the penalty amount under 3 V.S.A. § 127. Reporting the account later
  does not erase the violation, so a penalty still applies. The law does not provide for an
  automatic 30‑day license revocation for this offense.
