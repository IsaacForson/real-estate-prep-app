stem: A broker changes the principal business address on May 5. By what date must the broker notify
  the Vermont Real Estate Commission to comply with the notice requirement?
options:
  - The broker must notify the Commission by May 30.
  - The broker must notify the Commission by June 4.
  - The broker must notify the Commission by June 5.
  - The broker must notify the Commission by June 10.
key: B
explanation: Section 2294(a) requires notice of any change in a licensee’s name or address within 30
  days after the change becomes effective. Adding 30 days to May 5 gives June 4, so the correct
  response is that the broker must notify the Commission by June 4. The broker must notify the
  Commission by May 30, which is less than the required 30‑day period, so that choice is incorrect.
