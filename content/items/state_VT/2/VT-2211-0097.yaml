stem: Under Vermont law, where must a real estate broker maintain the books, records, contracts, and
  other documents pertaining to a trust or escrow account?
options:
  - At the broker’s usual place of business
  - At the Vermont Real Estate Commission office
  - At the bank holding the account
  - At the broker’s home office
key: A
explanation: The statute requires the broker to keep trust/account records at the broker’s usual
  place of business so they are open for inspection by the Commission. Placing the records at the
  Commission office, the bank, or the broker’s home does not satisfy this location requirement.
citation:
  source: 26 V.S.A. § 2214(a)
  url: null
  quoted_text: The broker shall maintain at the broker’s usual place of business, books, records,
    contracts, and other documents pertinent to or relating to the trust or escrow account and
    monies therein
