stem: A broker receives a $10,000 earnest money deposit on a purchase contract. The deposit is
  expected to earn substantial interest. The buyer and seller agree in writing that any interest
  earned will be paid to the broker as compensation for arranging the financing. Under Vermont law,
  what happens to the interest earned on the deposit?
options:
  - it must be applied to the purchase price due from the buyer
  - it must be returned to the buyer if the deposit is returned
  - it must be paid to the seller if the buyer defaults on the contract
  - it may be paid to the broker per the written agreement of all parties
key: D
explanation: Unless otherwise agreed in writing, the interest follows the default allocation (§
  2214(b)(1)). Because the parties agreed in writing to pay the interest to the broker, that
  agreement controls. Applying the interest to the purchase price due from the buyer incorrectly
  applies the default rule despite the written agreement.
citation:
  source: 26 V.S.A. § 2214(b)(1)
  url: null
  quoted_text: Unless otherwise agreed to in writing by all parties, the interest earned shall be
    applied to the purchase price due from the buyer if the sale is consummated, shall be returned
    to the buyer if the deposit is returned to the buyer, and shall be payable to the seller if the
    buyer defaults.
