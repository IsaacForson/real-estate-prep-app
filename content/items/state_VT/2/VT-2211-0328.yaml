stem: A 17-year-old individual has passed the required salesperson exam and completed the 40-hour
  course. Under Vermont law, what is the outcome of their application for a salesperson license?
options:
  - The application is approved because the exam was passed
  - The application is denied due to insufficient age
  - The application is approved pending parental consent
  - The application is placed on hold until the applicant turns 18
key: B
explanation: The statute requires every applicant to have attained the age of majority; a
  17‑year‑old has not met this threshold, so the application must be denied. No provision allows
  approval based on parental consent or pending a birthday.
