stem: Under Vermont law, what must a real estate licensee disclose to a buyer concerning the
  property being sold?
options:
  - Disclose all material facts within the licensee's knowledge concerning the property being sold
  - Disclose the agreed purchase price, closing date, and financing terms specified in the contract
  - Disclose latent defects and encumbrances known to the licensee prior to closing
  - Disclose zoning and environmental restrictions disclosed in the public record and municipal files
key: A
explanation: Under Vermont law, a licensee must disclose all material facts within the licensee's
  knowledge concerning the property being sold, as stated in § 2296(4) which defines failure to do
  so as unprofessional conduct. The distractor that limits disclosure to latent defects only is
  incorrect because the rule requires disclosure of all material facts, not just those discovered
  before closing.
