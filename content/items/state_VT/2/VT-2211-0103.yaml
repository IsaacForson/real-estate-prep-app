stem: Which of the following actions is considered unprofessional conduct under Vermont law
  concerning trust or escrow accounts?
options:
  - The broker commingles clients’ trust funds with personal funds, except for nominal amounts
    needed to keep the trust account open.
  - The broker notifies the commission within ten days of changing the brokerage firm’s principal
    address.
  - The broker displays the real estate license in a visible location at the place of business.
  - The broker completes the required continuing education hours before license renewal.
key: A
explanation: Under Vermont law, commingling clients’ trust or escrow funds with the broker’s own
  funds (except for nominal sums needed to maintain an open trust account) is expressly defined as
  unprofessional conduct. The other options describe permissible or required actions.
