stem: A Vermont real estate broker receives a three-thousand-dollar earnest money deposit on Monday
  and deposits it into the trust account on the following Monday (six banking days later). Under
  Vermont law, what is the consequence for this action?
options:
  - Subject to penalties under 3 V.S.A. §127
  - No penalty if the funds are still held in the trust account
  - Required to pay interest to the buyer for the delay
  - Must return the deposit to the buyer immediately
key: A
explanation: Vermont law requires an earnest money deposit to be deposited into a trust account
  within five banking days. Depositing it on the sixth banking day violates that rule, and any
  violation of the real estate brokerage statutes subjects the broker to penalties under 3 V.S.A.
  §127. The idea that no penalty applies if the funds remain in the trust account is incorrect
  because the timeliness violation itself triggers penalties.
