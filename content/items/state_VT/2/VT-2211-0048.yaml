stem: A broker receives an earnest money deposit on a purchase contract. The broker determines that
  the deposit is not reasonably expected to earn a substantial amount of interest. What must the
  broker do with the deposit under Vermont law?
options:
  - Place the deposit in a separate escrow account for the buyer
  - Place the deposit in a pooled interest-bearing trust account
  - Place the deposit in the broker's trust account
  - Place the deposit in an interest-bearing trust account
key: B
explanation: Under 26 V.S.A. § 2214(c), when a deposit is not reasonably expected to earn a
  substantial amount of interest, the broker must place the deposit in a pooled interest‑bearing
  trust or escrow account and direct the interest to the Vermont Housing Finance Agency. Placing the
  deposit in an individual interest‑bearing account is permitted only when the deposit is expected
  to earn substantial interest and the depositor requests it.
