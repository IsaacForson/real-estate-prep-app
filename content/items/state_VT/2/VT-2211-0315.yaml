stem: Under Vermont law, what is the consequence for a real estate broker who fails to maintain
  books, records, contracts, and other documents pertaining to a trust or escrow account at the
  broker’s usual place of business?
options:
  - Subject to penalties under 3 V.S.A. §127
  - Required to pay a fixed fine of $500
  - Automatic suspension of the broker’s license
  - Mandatory completion of additional continuing education
key: A
explanation: The key is right because §2213 states that anyone violating any provision of the
  chapter is subject to penalties under 3 V.S.A. §127. The most tempting distractor B suggests a
  fixed fine, but the statute does not specify a set amount; penalties are governed by 3 V.S.A.
  §127.
