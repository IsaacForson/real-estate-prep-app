stem: A Vermont real estate broker informs a depositor whether earnest money is placed in an
  individual interest‑bearing trust account or a pooled interest‑bearing trust account but does not
  retain a written statement signed by the beneficial owner. Under Vermont law, what is the
  consequence for this omission?
options:
  - The broker must return the deposit to the buyer immediately.
  - The broker’s license is automatically revoked.
  - The broker is subject to penalties under 3 V.S.A. § 127.
  - The broker must pay a fine of $500 to the Vermont Real Estate Commission.
key: C
explanation: Section 2214(d) requires the broker to retain a written statement signed by the
  beneficial owner indicating the account type; omitting this violates the chapter. By § 2213, any
  violation triggers penalties under 3 V.S.A. § 127. The distractor about automatic license
  revocation overstates the penalty, as the statute provides for penalties but not automatic
  revocation.
