stem: "A Vermont real estate broker receives a $2,500 earnest money deposit from a buyer and places
  the funds in a trust account but fails to keep any records of the deposit or subsequent
  transactions. Under Vermont law, this action is considered:"
options:
  - The broker's action of failing to keep records of the trust account.
  - The broker's action of providing the buyer with a written receipt for the deposit.
  - The broker's action of depositing the funds into an interest-bearing account.
  - The broker's action of informing the buyer that the deposit will earn interest.
key: A
explanation: Under Vermont Statutes § 2296(2), failing to maintain records of trust or escrow monies
  is declared unprofessional conduct. The broker’s failure to keep any records therefore violates
  this rule. Providing a written receipt, while a good practice, is not mandated by this provision
  and thus does not constitute unprofessional conduct.
