stem: During what time of day must a broker make trust account records available for inspection by
  the Vermont Real Estate Commission?
options:
  - During regular business hours
  - During evening business hours
  - During weekend business hours
  - During lunch break period
key: A
explanation: The statute requires that trust account records be open for inspection 'during regular
  business hours.' This means the broker must make the records available during the standard workday
  when banks and offices are typically open. Options suggesting after‑hours, any time, or only
  during lunch break do not match this requirement.
