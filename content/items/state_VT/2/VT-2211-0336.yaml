stem: A broker opens a trust account on April 5. The broker notifies the Vermont Real Estate
  Commission of the bank holding the account on April 15. Is the broker in compliance with Vermont’s
  ten‑day notification requirement?
options:
  - The broker must place the deposit in a pooled interest‑bearing account.
  - The broker must also deposit earnest money within five banking days.
  - The broker has violated the ten‑day notification requirement.
  - The broker is in compliance with the ten‑day notification requirement.
key: D
explanation: Under 26 V.S.A. § 2214(a), a broker must notify the Commission within 10 days after
  opening a trust account. Counting from the day after opening (April 6) through the notification
  date (April 15) gives ten days, which satisfies the requirement. Therefore the broker is
  compliant; stating that the broker violated the rule is incorrect. The other options describe
  duties unrelated to the notification deadline.
