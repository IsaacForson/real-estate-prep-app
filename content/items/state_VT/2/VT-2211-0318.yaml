stem: Under Vermont law, what event starts the five-banking-day period within which a real estate
  broker must deposit earnest money and contract deposits into a trust account?
options:
  - The broker signs the purchase agreement with the buyer
  - The broker receives the earnest money from the buyer
  - The broker holds the earnest money or contract deposit
  - The broker deposits the earnest money into a trust account
key: C
explanation: The rule requires a broker to deposit earnest money or contract deposits held by the
  broker within five banking days; thus the period begins when the broker holds the funds. The
  distractor describing receipt of the earnest money from the buyer is incorrect because the trigger
  is the broker’s holding of the deposit, not merely its receipt.
