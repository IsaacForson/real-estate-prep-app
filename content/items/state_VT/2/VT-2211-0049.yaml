stem: A broker holds an earnest money deposit in an individual interest-bearing trust account. The
  buyer asks the broker to write a check from the account to cover inspection fees before the
  deposit has cleared. What must the broker do under Vermont law?
options:
  - Writing the check immediately
  - Waiting for deposit collection
  - Transferring funds to office account
  - Returning the deposit to buyer
key: B
explanation: The statute prohibits drawing checks against uncollected deposits in a trust or escrow
  account. Therefore the broker must wait until the deposit is collected before writing any check.
  Transferring funds to an office account or returning the deposit would violate the requirement to
  keep trust funds separate and available.
