stem: A Vermont real estate broker receives an earnest money deposit that is not expected to earn
  substantial interest, places the funds in a pooled interest‑bearing trust account, and later fails
  to remit the earned interest to the Vermont Housing Finance Agency. Under Vermont law, what is the
  consequence for this action?
options:
  - The broker must return the deposit to the buyer immediately.
  - The broker is subject to penalties under 3 V.S.A. § 127.
  - The broker must pay a fine of $500 to the Vermont Real Estate Commission.
  - The broker’s license is automatically revoked.
key: B
explanation: Under § 2214(c), interest from pooled accounts must be remitted to the Vermont Housing
  Finance Agency; failing to do so violates the chapter. Section 2213 then makes the broker subject
  to penalties under 3 V.S.A. § 127 for any violation. The distractor about returning the deposit
  confuses the remedy for a defaulting buyer with the duty to remit interest.
