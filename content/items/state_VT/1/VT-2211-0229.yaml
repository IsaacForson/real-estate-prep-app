stem: Under 3 V.S.A. § 129(a)(3), when may the Vermont Office of Professional Regulation immediately
  suspend a license without a prior hearing?
options:
  - When a client complaint is received
  - When a felony conviction occurs
  - When continuing education is not completed
  - When emergency action is required
key: D
explanation: The key is correct because §129(a)(3) authorizes immediate suspension 'in cases
  requiring emergency action.' The most tempting distractor, 'When a client complaint is received,'
  is incorrect because the statute requires a hearing or other process before suspension based on a
  complaint; immediate suspension is reserved for emergency situations only.
