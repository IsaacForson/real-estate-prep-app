stem: Under Vermont law, what must the Real Estate Commission ensure when designing examinations for
  licensure?
options:
  - Ensuring that examinations are waived for applicants with five years of experience under Vermont
    law
  - Ensuring that examinations are designed to limit the number of licensees in the state to protect
    public interest
  - Ensuring that examinations are fair and reasonable and designed to license applicants who
    demonstrate minimal occupational qualifications
  - Ensuring that examinations are administered exclusively by independent testing services approved
    by the Commission
key: C
explanation: Subsection 2292a(b) requires examinations to be fair and reasonable and designed to
  license applicants who demonstrate minimal occupational qualifications consistent with public
  health, safety, and welfare. The distractor suggesting examinations should limit the number of
  licensees conflicts with the explicit prohibition against designing examinations for that purpose.
