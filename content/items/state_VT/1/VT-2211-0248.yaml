stem: An applicant is an active-duty member of the U.S. Armed Forces assigned to duty in Vermont and
  has submitted a complete application for full licensure. Under 3 V.S.A. § 130(a)(3), is the
  applicant eligible for a 90‑day provisional license?
options:
  - No, because provisional licenses are limited to out‑of‑state verification
  - Yes, but only if the applicant’s spouse is also on active duty
  - No, because the applicant must also satisfy a background check requirement
  - Yes, because the applicant meets the active‑duty military criterion
key: D
explanation: The statute grants eligibility for a 90‑day provisional license to an active‑duty
  member assigned to duty in Vermont or the spouse of such a member. Since the applicant meets the
  active‑duty criterion, they are eligible. The distractor that adds a background‑check requirement
  is incorrect because that condition applies only to the alternative eligibility path, not to the
  active‑duty path.
