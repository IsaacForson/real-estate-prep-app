stem: A licensee submits a report of disciplinary action to the Office of Professional Regulation.
  If the Office decides to treat that report as a complaint, what provision applies under 3 V.S.A. §
  129a(c)?
options:
  - The report remains confidential and is not subject to further action unless the Office
    determines otherwise
  - The licensee is automatically subject to a $1,000 civil penalty if the Office finds a violation
    of reporting requirements
  - The report must be forwarded to the National Practitioner Data Bank within the timeframe
    established by federal law
  - The provisions of section 131 of this title apply regarding complaint handling and
    confidentiality procedures
key: D
explanation: The rule states that information provided to the Office under this section shall be
  confidential unless the Office decides to treat the report as a complaint, in which case the
  provisions of section 131 of this title apply. The option claiming the report remains confidential
  ignores the exception.
