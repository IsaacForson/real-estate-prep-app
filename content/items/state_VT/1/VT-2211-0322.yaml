stem: Under Vermont law, which of the following individuals is exempt from real estate licensing
  requirements when acting under a duly executed power of attorney?
options:
  - A person who holds a power of attorney to sell property owned by a bank, where the bank employee
    is acting within duties.
  - A person who holds a power of attorney to sell the owner's vacation home, a one-time
    transaction, and intends to avoid licensing requirements.
  - A person who holds a power of attorney to manage rental properties on an ongoing basis for the
    owner.
  - A person who holds a power of attorney to lease commercial space for the owner, a one-time lease.
key: B
explanation: Vermont statutes exempt a person who, in good faith, holds a duly executed power of
  attorney that authorizes a final consummation of a sale, purchase, or exchange of real estate,
  when the transaction is not recurrent and the person’s purpose is to avoid the licensing
  requirement (26 V.S.A. ch. 41 § 2211(b)(5)). The scenario that satisfies all of those elements is
  the individual who has a power of attorney to sell the owner’s vacation home in a one‑time
  transaction and who intends to evade licensing. The person with a power of attorney to sell
  property owned by a bank is acting on behalf of a bank employee and does not involve the intent to
  evade licensing. The individual with a power of attorney to manage rental properties is performing
  a recurring management activity, not a sale, purchase, or exchange. The person with a power of
  attorney to lease commercial space is conducting a lease, which is not covered by the exemption
  for sale, purchase, or exchange.
citation:
