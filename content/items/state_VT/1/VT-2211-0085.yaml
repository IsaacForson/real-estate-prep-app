stem: A nonlicensed employee of a Vermont real estate broker answers a telephone inquiry from a
  member of the public about a property listing. Under 26 V.S.A. § 2211(a)(4)(G), what must the
  employee do when providing information?
options:
  - The employee must complete a continuing education course before providing any listing details.
  - The employee must disclose they are not licensed and advise confirmation by a licensee.
  - The employee must transfer the call to a licensed salesperson before answering.
  - The employee may give the information as long as they mention the brokerage name.
key: B
explanation: The statute permits a nonlicensed employee to respond to public inquiries only if they
  make it clear they are not licensed and that any information provided should be confirmed by a
  licensed person. Therefore, the employee must disclose their unlicensed status and advise the
  caller to seek confirmation from a licensee. Providing information without disclosure violates
  this requirement.
