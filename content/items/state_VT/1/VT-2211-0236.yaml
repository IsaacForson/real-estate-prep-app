stem: A board member is appointed to fill a vacancy with two months remaining in the term. Under 3
  V.S.A. §129b(b), does this appointment count toward the two‑consecutive‑term limit?
options:
  - It counts as a full term
  - It does not count as a term
  - It counts as half a term
  - It counts as a term after six
key: B
explanation: The statute specifies that members appointed to fill a vacancy before the term ends are
  not deemed to have served a term, so the appointment does not count toward the limit. The
  distractor “It counts as a full term” incorrectly treats the vacancy appointment as a full term,
  which contradicts the explicit provision.
