stem: An attorney licensed in Vermont is handling the sale of a decedent's home as part of estate
  administration. Under 26 V.S.A. § 2211(b)(2), does the attorney need a real estate license to
  conduct this sale?
options:
  - The attorney must obtain a real estate license.
  - The attorney is exempt from licensing requirements.
  - The attorney may act only if supervised by a broker.
  - The attorney must first complete a salesperson course.
key: B
explanation: The statute exempts attorneys admitted to practice in Vermont who are handling sales of
  real estate in the course of estate or guardianship administration from licensing requirements.
  Therefore, the attorney does not need a real estate license for this activity. The other options
  incorrectly impose licensing, supervision, or education requirements that do not apply under this
  exemption.
