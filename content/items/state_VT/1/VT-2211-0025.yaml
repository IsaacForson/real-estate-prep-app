stem: A licensee lists a friend's vacant land for sale and receives a commission from the friend.
  Under 26 V.S.A. § 2211(a)(4), which statement best describes the licensee's activity?
options:
  - The licensee is not acting as a broker because the land is vacant
  - The licensee is acting as a real estate broker because they listed real estate for another for a
    fee
  - The licensee is exempt from broker licensing because the transaction is a gift
  - The licensee is acting as a real estate salesperson because they are employed by a broker
key: B
explanation: The licensee listed vacant land for a friend and received a commission, which satisfies
  the definition of a real estate broker under 26 V.S.A. § 2211(a)(4)(A) – anyone who lists real
  estate or any interest therein for another for a fee. Therefore the licensee is acting as a
  broker. The statement that the licensee is not acting as a broker because the land is vacant is
  incorrect because the definition covers any interest in land, including vacant land. The claim
  that the licensee is exempt because the transaction is a gift is wrong; receiving a commission
  makes it a fee‑based service, not a gift. The assertion that the licensee is acting as a
  salesperson employed by a broker is also incorrect; the activity described meets the broker
  definition, and a salesperson must work under a broker but the licensing determination here is
  based on the broker definition.
