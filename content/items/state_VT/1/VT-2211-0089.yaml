stem: An applicant for a Vermont real estate license discloses a prior misdemeanor conviction and
  asks whether this will automatically disqualify them. Under 3 V.S.A. § 123(3), what must the
  Office of Professional Regulation tell the applicant?
options:
  - The conviction is not considered an absolute bar to licensure.
  - The applicant must wait at least five years before reapplying.
  - The conviction is considered an absolute bar to licensure.
  - The applicant must expunge any conviction before applying.
key: A
explanation: The statute requires that applicants be notified that criminal convictions are not an
  absolute bar to licensure. Thus the Office must inform the applicant that the conviction does not
  automatically disqualify them. Stating that it is an absolute bar directly opposes the statutory
  language. The suggestions of a waiting period or expungement are not mentioned in the provision
  and therefore incorrect.
citation:
  source: 3 V.S.A. § 123(3)
  url: null
  quoted_text: (3) Applicants subject to background checks shall be notified that a check is required,
    if fingerprints will be retained on file, and that criminal convictions are not an absolute bar
    to licensure, and shall be provided such other information as may be required by federal law or
    regulation.
