stem: A salesperson's initial license is issued 60 days before the Office of Professional
  Regulation's set biennial renewal date for that license category. Applying section 123, what
  should the salesperson do about renewal?
options:
  - Apply for an entirely new license instead of renewing this one
  - Pay a prorated fee covering just the remaining 90-day gap period
  - Wait until the end of the first full biennial period to renew
  - Renew the license again within the following 30 days regardless
key: C
explanation: Section 123(a)(12)(B) provides that a person whose initial license is issued within 90
  days before the set renewal date need not renew until the end of the first full biennial licensing
  period.
