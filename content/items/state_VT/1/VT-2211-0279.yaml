stem: A complainant submits a complaint against a licensee to the Vermont Office of Professional
  Regulation. After investigating the complaint, the board finds no basis for a stipulation. Under 3
  V.S.A. § 129(d), what must the board provide to the complainant?
options:
  - Provide the complainant with a copy of the investigative file and a notice of a hearing for the
    board
  - Provide the complainant with a written notice of the result of the investigation regarding the
    complaint
  - Provide the complainant with a request to submit additional evidence within ten days to the board
  - Provide the complainant with a summary of the board's deliberations and notice of future action
key: B
explanation: The statute requires the board to notify complainants in writing of the result of any
  disciplinary investigation made with reference to their complaint. Providing a copy of the
  investigative file and a hearing notice is not required by this provision.
citation:
  source: "### 3 V.S.A. ch. 5 — 3 V.S.A. Chapter 5 — Secretary of State (Subchapter 3: Office of
    Professional Regulation, incl. § 129a Unprofessional conduct) — § 129(d)"
  url: null
  quoted_text: A board or the Director shall also notify complainants in writing of the result of any
    disciplinary investigation made with reference to a complaint brought by them to the board or
    Director.
