stem: A Vermont homeowner discovers that an unlicensed individual is advertising real estate
  services and files a complaint with the Office of Professional Regulation. Under 3 V.S.A. §
  127(a), what action must the Office take regarding the complaint?
options:
  - The Office may seek an injunction and assess a civil penalty of up to $5,000
  - The Office may assess a civil penalty but cannot seek an injunction
  - The Office may only refer the complaint to investigators and prosecutors
  - The Office may seek an injunction but cannot assess a civil penalty
key: C
explanation: Subsection 127(a) states that when the Office receives a complaint of unauthorized
  practice, the Director shall refer the complaint to Office investigators and prosecutors. Only
  complaints from the Attorney General, a State’s Attorney, or an assigned attorney can lead to
  injunction or civil penalty under subsection (b)(1). The distractor assuming any complaint can
  trigger injunction and penalty ignores this limitation on who may file such a complaint.
