stem: An insurer receives a judgment for professional negligence against a licensee on April 5. By
  what date must the insurer report this judgment to the Office of Professional Regulation?
options:
  - 05/05
  - 05/15
  - 04/15
  - 04/25
key: A
explanation: The insurer must report within 30 days of the judgment, making May 5 (05/05) the
  correct deadline. April 15 (04/15) and April 25 (04/25) fall short of the 30‑day window, while May
  15 (05/15) exceeds it.
