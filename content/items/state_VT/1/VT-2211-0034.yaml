stem: A licensee checks the Vermont State Archives and Records Administration website to confirm the
  appointing authority of the Vermont Real Estate Commission. According to 3 V.S.A. § 116a(a)(2)(A),
  what information must the registry include for each State board and commission?
options:
  - Names of members and their contact information including phone and email
  - Budget and meeting schedule of the board including annual review
  - Names of members, term length and expiration, and appointing authority
  - Disciplinary actions and penalties imposed by the board including fines and suspensions
key: C
explanation: According to 3 V.S.A. § 116a(a)(2)(A), the registry must include the names of each
  board's members, their term length and expiration, and their appointing authority. The option
  stating 'Names of members, term length and expiration, and appointing authority' matches this
  requirement. The other options refer to budget and meeting schedules, contact information, or
  disciplinary actions, which are not required by this provision.
