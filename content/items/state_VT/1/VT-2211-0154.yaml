stem: Under 26 V.S.A. § 2211(a)(2), how is the term 'Person' defined for the purposes of this chapter?
options:
  - It means and includes individuals, corporations, partnerships, trusts, associations,
    cooperatives, or other firms or entities, foreign or domestic.
  - It means and includes individuals, corporations, partnerships, trusts, associations,
    cooperatives, or other firms or entities, domestic only.
  - It means and includes individuals, corporations, partnerships, trusts, associations,
    cooperatives, or other firms or entities, foreign only.
  - It means and includes individuals, corporations, partnerships, trusts, associations,
    cooperatives, or other firms or entities, limited to Vermont.
key: A
explanation: The statute defines “Person” as individuals, corporations, partnerships, trusts,
  associations, cooperatives, or other firms or entities, foreign or domestic. An answer that limits
  the definition to domestic entities only, or to foreign entities only, or to Vermont alone does
  not match the statutory language and is therefore incorrect.
