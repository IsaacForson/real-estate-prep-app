stem: Which act is expressly excluded from the definition of a real estate broker under 26 V.S.A. § 2211?
options:
  - Negotiating the sale of real estate for another.
  - Leasing real estate or any interest therein.
  - Advertising oneself as engaged in buying and selling real estate.
  - Assisting in procuring prospects for sale or exchange.
key: B
explanation: The statute excludes leasing activities from the broker definition in subsection
  (b)(8). Negotiating sales, advertising, and prospecting are included as broker acts under
  subsection (a)(4).
citation:
