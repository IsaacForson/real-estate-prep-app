stem: A real estate broker let their license lapse for four years and now wishes to renew it.
  According to 3 V.S.A. § 135(a), what may be used to infer readiness to practice?
options:
  - Completion of continuing education that would have been required if the license had been
    maintained
  - Completion of a state-approved real estate sales examination administered within the last two
    years
  - Completion of a recent background check conducted by the Vermont Criminal Information Center
  - Completion of a documented sales transaction log covering at least twelve months of activity
key: A
explanation: After a four‑year lapse, readiness to practice may be inferred from completing the
  continuing education that would have been required during the absence, as stated in § 135(a).
  Suggesting that a refresher course, a new application, or a background check suffices misstates
  the rule, which ties inference specifically to the missing continuing education.
