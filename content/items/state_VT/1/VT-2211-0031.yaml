stem: Under the Vermont Office of Professional Regulation statutes, which of the following best
  describes a 'licensee'?
options:
  - Any person who has applied for a license but not yet received it
  - Any person to whom a license has been issued by a board or the Director
  - Any person who holds a temporary permit only, without having been issued a full license
  - Any person who has completed the required education but not yet taken the exam
key: B
explanation: According to 3 V.S.A. ch. 5 § 121(3)(B), a licensee is any person to whom a license has
  been issued by a board or the Director. The option stating that a licensee is any person to whom a
  license has been issued by a board or the Director is correct. The option describing a person who
  has applied for a license but not yet received it describes an applicant, not a licensee, because
  the license has not yet been issued.
