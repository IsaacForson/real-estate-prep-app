stem: A Vermont real estate broker is found after a disciplinary hearing to have committed
  unprofessional conduct. According to 3 V.S.A. § 129(a)(3), what additional financial obligation
  must the broker fulfill?
options:
  - Pay a disciplinary action surcharge pursuant to subdivision 125(b)(11)
  - Pay a fine to the state treasury equal to twice the biennial renewal fee
  - Pay the complainant for any actual damages suffered
  - Pay for an additional eight hours of continuing education
key: A
explanation: The rule states that after a finding of unprofessional conduct, the respondent must pay
  a disciplinary action surcharge under subdivision 125(b)(11). Therefore, the broker must pay that
  surcharge. The distractor about paying a fine to the state treasury is incorrect because the
  statute specifies a surcharge deposited into the Professional Regulatory Fee Fund, not a fine to
  the treasury.
