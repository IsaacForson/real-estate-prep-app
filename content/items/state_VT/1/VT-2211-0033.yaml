stem: An applicant for a Vermont real estate broker license has a prior misdemeanor conviction.
  Under the Office of Professional Regulation statutes, may the Office inquire into this applicant's
  criminal background history as part of the licensure process?
options:
  - The Office may inquire into the applicant's criminal background history as part of the licensure
    process.
  - The Office may not inquire into the applicant's criminal background history as brokers are not
    listed.
  - The Office may inquire into the applicant's criminal background history only if the conviction
    is a felony.
  - The Office may not inquire into the applicant's criminal background history unless the applicant
    discloses it.
key: B
explanation: The statute limits criminal background inquiries to the professions listed in
  subsection (j)(1), and real estate brokers are not among them, so the Office may not inquire.
  Therefore, the statement that the Office may not inquire into the applicant's criminal background
  history as brokers are not listed is correct. The statement that the Office may inquire into the
  applicant's criminal background history as part of the licensure process is incorrect because the
  statute does not allow such inquiries for brokers.
citation:
