stem: Under 3 V.S.A. § 129(d), after a disciplinary investigation results in a stipulation filed
  with the board, what must the board provide to the complainant?
options:
  - Provide the complainant with a copy of the investigative file and a request to submit additional
    evidence
  - Provide the complainant with a written notice of the investigation's initiation and the
    investigator's name
  - Provide the complainant with a summary of the board's deliberations and notice of possible
    future action
  - Provide the complainant with a copy of the stipulation and notice of the stipulation review
    scheduled before the board
key: D
explanation: The statute requires the board to give the complainant a copy of the stipulation and
  notice of the stipulation review when a stipulation is filed. The option about the investigative
  file and a request for evidence is not mandated by this provision.
citation:
