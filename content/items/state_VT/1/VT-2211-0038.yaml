stem: A veteran applying for a real estate salesperson license qualifies for a fee waiver. Under 3
  V.S.A. § 125(d), what may the Office do?
options:
  - The Office may waive the application fee for veterans
  - The Office may reduce the application fee for veterans
  - The Office may defer the application fee for veterans
  - The Office may waive the application fee for spouses if veteran is deceased
key: A
explanation: Section 125(d) of the Vermont Statutes allows the Office, upon request, to waive
  application fees for qualified military members and their spouses. The statute does not authorize
  a reduction or deferral of the fee, nor does it limit a waiver for spouses to the veteran’s death.
  Therefore only a waiver for veterans is permitted.
