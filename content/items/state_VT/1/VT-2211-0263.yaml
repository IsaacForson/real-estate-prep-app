stem: An applicant has been a licensed salesperson for two years and has completed six separate and
  unrelated closed transactions. Under 26 V.S.A. § 2292(a)(2), does the applicant meet the
  experience requirement for a broker license?
options:
  - Passing the broker examination satisfies the requirement
  - At least eight separate and unrelated closed transactions are required
  - Two years of experience satisfies the requirement
  - Completion of the required 40‑hour course satisfies the requirement
key: B
explanation: The rule requires at least eight separate and unrelated closed transactions in addition
  to two years’ experience. Six transactions fails the transaction count, so the applicant does not
  qualify. The distractor about two years’ experience ignores the transaction requirement.
