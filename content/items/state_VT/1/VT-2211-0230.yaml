stem: A Vermont real estate licensee fails to submit the required continuing education completion
  certificates to the Office of Professional Regulation, a requirement that does not involve client
  care. Under 3 V.S.A. § 129(a)(3), what may the board order as a consequence?
options:
  - Imposition of a monetary civil penalty
  - Imposition of a warning or reprimand
  - Imposition of a suspension of the license
  - Imposition of a revocation of the license
key: A
explanation: The key is correct because §129(a)(3) allows the board to order a monetary civil
  penalty for administrative noncompliance unrelated to client care, and such penalty does not
  constitute a finding of unprofessional conduct. The most tempting distractor, 'Imposition of a
  warning or reprimand,' is incorrect because warning or reprimand constitutes disciplinary action
  for unprofessional conduct, which is not triggered by mere administrative noncompliance under this
  provision.
