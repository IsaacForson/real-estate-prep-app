stem: A veteran who has completed military logistics training applies for a Vermont real estate
  salesperson license. Under the Office of Professional Regulation statutes, what must the Office do
  regarding the veteran's military training?
options:
  - Establish uniform procedures to recognize the training toward licensure requirements
  - Disregard the training because only civilian education counts toward licensure
  - Automatically issue the license without further examination
  - Require the veteran to repeat the training in a civilian program before consideration
key: A
explanation: "The Office of Professional Regulation must establish uniform procedures to recognize a
  veteran's military training, education, or service when it applies toward licensure requirements.
  Therefore, the correct response is that the Office establishes uniform procedures to recognize the
  training toward licensure requirements. The other responses are incorrect: the Office cannot
  ignore the training because civilian education is not the only acceptable source, it cannot
  automatically issue the license without further examination, and it cannot require the veteran to
  repeat the training in a civilian program before consideration. (see 3 V.S.A. ch. 5 §
  123(g)(1)(A))"
