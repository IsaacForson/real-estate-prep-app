stem: A licensee has been found after a disciplinary hearing to have committed unprofessional
  conduct. Under 3 V.S.A. § 129(a)(3), what action may the board take regarding the licensee's
  renewal?
options:
  - The board may impose a monetary civil penalty
  - The board may require continuing education
  - The board may issue a warning or reprimand
  - The board may deny renewal of the license
key: D
explanation: The key is correct because §129(a)(3) expressly authorizes the board to deny or prevent
  renewal of a license after a disciplinary hearing for unprofessional conduct. The most tempting
  distractor, 'The board may issue a warning or reprimand,' is incorrect because while a warning or
  reprimand is also authorized, the question asks specifically about an action concerning renewal,
  which is addressed by the denial or prevention of renewal provision.
