stem: A Vermont licensee changes their email address on April 10. Under 3 V.S.A. §129a(14), by what
  date must the licensee report this change to the Office of Professional Regulation to avoid
  unprofessional conduct?
options:
  - May 20
  - May 10
  - April 17
  - April 10
key: B
explanation: The rule requires reporting a change of email within 30 days to avoid unprofessional
  conduct. Adding 30 days to April 10 yields May 10 as the deadline. The distractor of April 17 only
  allows one week, which does not satisfy the 30‑day requirement.
