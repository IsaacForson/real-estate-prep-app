stem: Under 3 V.S.A. §129(c), who bears the burden of proof in a disciplinary action against a licensee?
options:
  - The complainant must prove the alleged unprofessional conduct.
  - The licensee must prove the alleged unprofessional conduct.
  - The officer must prove the alleged unprofessional conduct.
  - The State must prove the alleged unprofessional conduct.
key: D
explanation: The rule places the burden of proof on the State to show by a preponderance of the
  evidence that the person engaged in unprofessional conduct. The distractor that the licensee must
  prove innocence incorrectly shifts the burden to the licensee.
citation:
  source: "3 V.S.A. ch. 5 — 3 V.S.A. Chapter 5 — Secretary of State (Subchapter 3: Office of
    Professional Regulation, incl. § 129a Unprofessional conduct) — § 129(c)"
  url: null
  quoted_text: (c) The burden of proof in a disciplinary action shall be on the State to show by a
    preponderance of the evidence that the person has engaged in unprofessional conduct.
