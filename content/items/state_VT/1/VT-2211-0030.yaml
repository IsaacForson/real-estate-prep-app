stem: A licensed broker sells their own personal residence. Under 26 V.S.A. § 2211(b)(1), what is
  the effect of the exemption for bona fide owners?
options:
  - The broker must keep a license because the exemption excludes licensees
  - The broker is exempt from licensing requirements when selling own property
  - The broker is exempt from licensing requirements as the owner
  - The broker must retain a license when selling personal property
key: A
explanation: Subsection (b)(1) provides an exemption for bona fide owners but explicitly states that
  this subdivision does not apply to licensees. Hence a licensed broker remains subject to licensing
  requirements. The statement that the broker is exempt from licensing requirements when selling own
  property is incorrect because the exemption does not override the licensee exclusion.
