stem: An applicant is 19 years old, has passed the required examination, has completed a 40‑hour
  approved course, and is employed by a brokerage firm. Under 26 V.S.A. § 2292(b), does the
  applicant meet the eligibility requirements for a salesperson license?
options:
  - The applicant meets all requirements.
  - The applicant must be at least 21 years old.
  - The applicant must have completed 80 hours of education.
  - The applicant must have been employed for at least two years.
key: A
explanation: The statute requires a salesperson applicant to be at least 18 years old, which the
  19‑year‑old satisfies along with the other stated qualifications. The distractor claiming a
  21‑year minimum misstates the age requirement.
