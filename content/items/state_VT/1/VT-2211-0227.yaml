stem: A Vermont real estate brokerage wants to advertise and conduct business under the trade name
  'Green Valley Homes' in addition to its registered legal name. Under 3 V.S.A. § 133(2), what must
  the brokerage do to comply with the law?
options:
  - The brokerage shall take no additional steps to use the trade name.
  - The brokerage shall obtain a separate license for the trade name.
  - The brokerage shall file the trade name with the Secretary of State.
  - The brokerage shall register the trade name with the Office.
key: D
explanation: The law requires the business entity to separately register with the Office each name
  under which it will conduct business, register licensees, and advertise. Therefore, the brokerage
  must register the trade name with the Office. The distractor suggesting filing with the Secretary
  of State is incorrect because registration is with the Office, not the Secretary of State's
  Business Services Division for this purpose.
