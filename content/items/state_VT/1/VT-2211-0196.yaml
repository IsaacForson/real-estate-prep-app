stem: The Vermont Agency of Transportation transfers a parcel of land to a private developer for a
  highway access point via a deed. Under 3 V.S.A. § 103(b), what must happen to the deed after it is
  prepared?
options:
  - Neither the original nor duplicate need be filed with the Secretary of State.
  - Only the original deed must be given to the developer; no duplicate copy is required.
  - The original deed must be given to the developer and a duplicate copy filed with the Secretary
    of State.
  - The duplicate copy must be given to the developer and the original filed with the Secretary of
    State.
key: B
explanation: The statute exempts transportation rights‑of‑way from the duplicate‑filing requirement;
  the original is delivered to the grantee and no duplicate is filed.
