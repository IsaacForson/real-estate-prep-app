  - Three years
  - Two years
  - One years
key: C
explanation: The Professional Regulatory Fee Fund may be used to offset up to two years of the costs
  incurred by the board or profession. Thus, excess revenue can cover a maximum of two future years.
  The distractor of One years is incorrect because the rule explicitly allows up to two years, not
  just one.
