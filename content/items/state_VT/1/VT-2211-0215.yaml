stem: A licensee keeps their real estate license in a locked desk drawer rather than displaying it
  in their place of business. Under 26 V.S.A. § 2295, what is the consequence?
options:
  - The licensee is subject to a penalty fee
  - The licensee is compliant with the display rule
  - The licensee is violating the display requirement
  - The licensee is required to retake the licensing examination
key: C
explanation: The statute mandates that all licenses be conspicuously displayed within the licensee’s
  place of business. Keeping the license in a locked drawer fails to meet this display requirement,
  so the licensee is violating the rule. The distractor suggesting compliance ignores the
  conspicuous display mandate.
