stem: According to 26 V.S.A. § 2211(a)(3), which of the following is excluded from the definition of
  'real estate' for licensing purposes?
options:
  - Residential rental properties
  - Commercial office buildings
  - Oil and gas leases
  - Agricultural land
key: C
explanation: The statute explicitly states that the definition of real estate shall not include oil,
  gas, or mineral leases. Therefore, oil and gas leases are excluded from the definition.
  Residential rental properties, commercial office buildings, and agricultural land are interests in
  land and thus included within the definition of real estate.
