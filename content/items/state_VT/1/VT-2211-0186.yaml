stem: Under 3 V.S.A. §129a(9), what is the required retention period for client records unless a
  shorter period is allowed by law?
options:
  - The licensee must retain client records for five years.
  - The licensee must retain client records for seven years.
  - The licensee must retain client records for ten years.
  - The licensee must retain client records for no specified period.
key: B
explanation: The rule defines unprofessional conduct as failing to retain client records for seven
  years unless another law permits a shorter period. Therefore the default retention period required
  by Vermont law is seven years. The five‑year option is incorrect because the statute specifies
  seven years as the baseline; a shorter period would only apply if a different law explicitly
  allows it.
