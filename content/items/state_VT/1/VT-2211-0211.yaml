stem: A licensee is assessed a $3,000 administrative penalty for an unprofessional conduct
  violation. Where must this money be deposited according to 3 V.S.A. §129a(d)(2)(A)?
options:
  - Returned to the licensee as a credit toward future fees.
  - Deposited into the Professional Regulatory Fee Fund.
  - Paid directly to the complainant as restitution.
  - Held in a trust account pending the outcome of any appeal.
key: B
explanation: Under 3 V.S.A. §129a(d)(2)(A), any money received under subsection (d) must be
  deposited in the Professional Regulatory Fee Fund for the education and training of board members
  and advisor appointees. The distractor suggesting payment to the complainant confuses penalties
  with restitution, which is not required by this provision.
