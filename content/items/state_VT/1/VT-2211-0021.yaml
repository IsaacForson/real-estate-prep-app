stem: Under 26 V.S.A. § 2211(a)(4), which activity is listed first in the definition of a real
  estate broker?
options:
  - The act of selling, exchanging, or purchasing real estate or any interest therein
  - The act of negotiating, or offering, attempting, or agreeing to negotiate the sale, exchange, or
    purchase of real estate
  - The act of listing, offering, attempting, or agreeing to list real estate for sale or exchange
  - The act of advertising or holding oneself out as being engaged in the business of buying,
    selling, or exchanging real estate
key: C
explanation: The definition in 26 V.S.A. § 2211(a)(4) lists several activities that constitute
  acting as a real estate broker. The first activity listed is the act of listing, offering,
  attempting, or agreeing to list real estate for sale or exchange. The other activities described
  in the definition—selling, exchanging, or purchasing real estate; negotiating or offering to
  negotiate the sale, exchange, or purchase of real estate; and advertising or holding oneself out
  as engaged in the business of buying, selling, or exchanging real estate—appear later in the list
  and therefore are not the first listed activity.
