  quoted_text: Licenses shall be renewed every two years without examination and on payment of the
    required fees, provided that the person applying for renewal completes at least 24 hours of
    instruction for brokers and 16 hours of instruction for salespersons, approved by the
    Commission, during the preceding two-year period.
