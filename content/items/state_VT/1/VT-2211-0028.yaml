stem: A broker seeking renewal has completed 20 hours of approved continuing education during the
  preceding two-year period. Under 26 V.S.A. § 2293, can the broker renew the license?
options:
  - The broker can renew the license because they have completed some continuing education
  - The broker cannot renew the license because brokers must complete at least 24 hours
  - The broker can renew the license because the missing hours can be made up later
  - The broker cannot renew the license because they must pass an examination
key: B
explanation: Renewal requires brokers to complete at least 24 hours of approved continuing
  education; 20 hours is insufficient, so the broker cannot renew. The distractor suggesting the
  broker can renew because they have completed some continuing education is wrong because the
  minimum threshold is 24 hours, not any amount.
