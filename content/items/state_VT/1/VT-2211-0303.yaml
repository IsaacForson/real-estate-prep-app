stem: An applicant submits a license application accompanied by a personal check for the fee. The
  check is later returned by the bank for insufficient funds. Under 3 V.S.A. § 129(a)(11), how must
  the Office treat the application?
options:
  - The Office must automatically deny the application due to financial irresponsibility
  - The Office must waive the fee and proceed with the application
  - The Office must process the application normally and notify the applicant to resubmit payment
  - The Office must treat the application as incomplete and not proceed until a valid payment is
    received
key: D
explanation: The rule provides that an application submitted with a check subsequently returned for
  insufficient funds must be treated as incomplete. Consequently, the Office must not proceed with
  the application until a valid payment is received. The distractor suggesting normal processing
  ignores the incompleteness requirement, while the distractors proposing denial or fee waiver add
  actions not authorized by this provision.
