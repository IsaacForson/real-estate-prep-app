stem: Under 3 V.S.A. §129(a)(3), after a board finds that a licensee has engaged in unprofessional
  conduct, what must the respondent pay?
options:
  - A civil penalty not exceeding five thousand dollars payable to the state treasury
  - An additional license renewal fee equal to twice the biennial renewal amount
  - Reimbursement of the board's actual investigative and hearing expenses
  - A disciplinary action surcharge pursuant to subdivision 125(b)(11) of this title
key: D
explanation: The statute directs that after a finding of unprofessional conduct the respondent shall
  pay a disciplinary action surcharge under subdivision 125(b)(11). The civil‑penalty distractor is
  incorrect because the law specifies a surcharge, not a civil penalty, for this circumstance.
