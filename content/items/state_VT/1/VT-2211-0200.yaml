stem: A licensee is found to have committed four distinct violations of unprofessional conduct in a
  single disciplinary proceeding. What is the maximum total administrative penalty that could be
  imposed under 3 V.S.A. § 129a(d)(1)?
options:
  - $15000
  - $5000
  - $10000
  - $20000
key: D
explanation: Since the penalty is $5,000 per violation, four violations yield a maximum total of 4 ×
  $5,000 = $20,000. The distractor $15,000 is incorrect because it corresponds to only three
  violations.
