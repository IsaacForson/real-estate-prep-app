stem: An applicant receives a 90‑day provisional license pending a background check. After 90 days,
  the background check is still incomplete. Under 3 V.S.A. §130(e), what action may the Director
  take?
options:
  - May extend the provisional license beyond the initial 90‑day period.
  - Must convert the provisional license to a full license.
  - Must revoke the provisional license immediately.
  - May issue a second 90‑day provisional license.
key: A
explanation: The statute allows the Director to extend a provisional license beyond the initial
  90‑day period if the reason for issuing the license has not been resolved. Therefore, extension is
  permissible. The distractor that mandates immediate revocation is incorrect because the statute
  does not require revocation in this circumstance.
