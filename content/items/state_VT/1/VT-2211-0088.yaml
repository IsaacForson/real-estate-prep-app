stem: A qualified veteran requests a waiver of application fees when applying for a Vermont real
  estate salesperson license. Under 3 V.S.A. § 125(d), what must the Office of Professional
  Regulation do?
options:
  - The Office shall deny the waiver request and retain fees.
  - The Office shall charge a reduced fee equal to 50% of the standard.
  - The Office shall waive the application fees upon request.
  - The Office shall require extra training before waiving fees.
key: C
explanation: Section 125(d) states that the Office shall waive application fees upon request for
  qualified military members and military spouses. Therefore, the Office must grant the waiver when
  the veteran qualifies and requests it. Denying the waiver contradicts the mandatory language of
  the statute. Charging a reduced fee or imposing extra training adds conditions not present in the
  rule.
