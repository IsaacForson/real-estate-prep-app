stem: An applicant for a Vermont real estate broker license does not have a Social Security number
  but provides a federal employer identification number. Under 3 V.S.A. § 139(b), is this
  permissible?
options:
  - Yes, but the applicant must also provide an individual taxpayer identification number
  - Yes, unless federal law requires a Social Security number
  - No, a Social Security number is required regardless of federal law
  - No, federal employer identification numbers are not accepted for real estate licenses
key: B
explanation: The statute permits an applicant to submit a federal employer identification number, an
  individual taxpayer identification number, or a Social Security number, and only mandates a Social
  Security number when federal law requires it. Hence providing a FEIN alone is permissible absent
  such a federal requirement. The distractor asserting that an SSN is always required ignores the
  conditional provision in the statute.
citation:
  source: "3 V.S.A. ch. 5 — 3 V.S.A. Chapter 5 — Secretary of State (Subchapter 3: Office of
