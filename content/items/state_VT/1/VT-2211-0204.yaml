  url: null
  quoted_text: the applicant may provide a federal employer identification number, an individual
    taxpayer identification number, or a Social Security number; provided, however, that an
    applicant shall provide a Social Security number if a federal law or an interstate compact of
    which the State is a member requires that an applicant provide a Social Security number to
    obtain or maintain a professional license.
