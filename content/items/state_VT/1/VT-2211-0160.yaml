stem: A licensee needs a certified copy of a deed previously recorded with the Secretary of State.
  According to 3 V.S.A. § 113, what must the licensee do to obtain such a copy?
options:
  - The licensee must tender legal fees to receive a photostatic or photographic copy.
  - The licensee must submit a written request to the Governor's office.
  - The licensee must publish a notice in a newspaper of general circulation.
  - The licensee must wait for the biennial legislative session to conclude.
key: A
explanation: The statute allows the Secretary to give photostatic or photographic copies upon tender
  of legal fees; the other actions are not authorized by this provision.
citation:
  source: "3 V.S.A. ch. 5 — 3 V.S.A. Chapter 5 — Secretary of State (Subchapter 3: Office of
    Professional Regulation, incl. § 129a Unprofessional conduct) § 113"
  url: null
  quoted_text: The Secretary of State may record by photostatic or photographic method any instrument,
    paper, or document required by law to be recorded by him or her, and he or she may give
    photostatic or photographic copies of the same, required by law to be filed or recorded with him
    or her, upon tender of his or her legal fees.
