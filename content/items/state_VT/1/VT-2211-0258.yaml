stem: A salesperson has not engaged in real estate practice for six years and seeks to renew an
  expired license. Under 3 V.S.A. § 135(b), what may the Director determine if the salesperson has
  **NOT** demonstrated retention of all required professional competencies?
options:
  - The Director may require the salesperson to be reexamined or to reapply as a new applicant
  - The Director may waive the renewal fee due to extended absence
  - The Director may require the salesperson to complete additional continuing education hours
  - The Director may determine that the salesperson has demonstrated retention of required
    competencies
key: A
explanation: When a licensee has been absent for five or more years and has not retained all
  required competencies, the Director may determine that the applicant must be reexamined or reapply
  as a new applicant per § 135(b). The option claiming the Director may find demonstrated retention
  describes the opposite situation, while requiring extra education or waiving fees are not
  authorized by this provision.
