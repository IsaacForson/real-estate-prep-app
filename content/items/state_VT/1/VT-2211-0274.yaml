stem: A hearing officer concludes a disciplinary hearing on May 2. Assuming no extension is granted,
  by what date must the officer submit the report of findings to the board?
options:
  - 07/01
  - 08/01
  - 07/15
  - 07/30
key: A
explanation: The report must be made within 60 days of the hearing’s conclusion, which lands on July
  1 (07/01). July 15 (07/15) and July 30 (07/30) are later than the 60‑day limit, and August 1
  (08/01) exceeds it.
