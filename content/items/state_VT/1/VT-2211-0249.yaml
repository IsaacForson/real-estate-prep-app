stem: A licensee who is also a registered nurse in Vermont provides legally protected health care
  activity in another state and is disciplined there solely for that activity. Under 3 V.S.A. §
  129a(f)(1)(B), may the Vermont Office of Professional Regulation take disciplinary action against
  the licensee’s Vermont license based solely on that out‑of‑state action?
options:
  - Yes, but only if the licensee fails to report the action within 30 days
  - No, unless the activity violates Vermont’s health care laws
  - Yes, because any disciplinary action elsewhere triggers Vermont review
  - No, because the exemption bars action based solely on legally protected health care activity
key: D
explanation: The rule provides that a health care provider licensed in Vermont shall not be subject
  to disciplinary action based solely on a disciplinary action in another state that is based solely
  on providing legally protected health care activity. Therefore the Vermont OPR may not take action
  based solely on that out‑of‑state discipline. The distractor suggesting action is permissible
  unless the activity violates Vermont law is incorrect because the exemption applies regardless of
  Vermont law when the action is based solely on the protected activity.
