stem: A broker receives an earnest money deposit that is not expected to earn substantial interest.
  Where must the interest earned on this deposit be remitted?
options:
  - To the broker's client trust account.
  - To the Vermont Housing Finance Agency.
  - To the seller as liquidated damages.
  - To the buyer as a closing cost credit.
key: B
explanation: Under 26 V.S.A. § 2214(c), when a deposit is not reasonably expected to earn
  substantial interest, the broker must place it in a pooled interest‑bearing trust account and
  direct that the interest be remitted to the Vermont Housing Finance Agency. Therefore the interest
  goes to the VHFA, not to the broker, buyer, or seller. The other options misstate the destination
  of the interest.
