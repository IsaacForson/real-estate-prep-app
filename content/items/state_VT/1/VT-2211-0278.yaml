stem: An applicant for a Vermont real estate license is denied licensure based on a finding of
  unprofessional conduct under 3 V.S.A. § 129(e)(1). According to that provision, what must the
  written notice of denial include and what action may the applicant take within 30 days?
options:
  - Include a statement of the reasons for the denial and advise that the applicant may file a
    petition for review with the board or Director within 30 days of mailing
  - Include a statement of the reasons for the denial and advise that the applicant may submit a new
    application immediately
  - Include a statement of the reasons for the denial and advise that the applicant may request a
    hearing within 15 days
  - Include a statement of the reasons for the denial and advise that the applicant may appeal the
    decision to the Vermont Supreme Court within 30 days
key: A
explanation: The rule directs the board to include a statement of reasons and advise the applicant
  of the right to file a petition for review within 30 days of mailing the notice. The option
  suggesting an immediate new application is not authorized by this subsection.
citation:
  source: "### 3 V.S.A. ch. 5 — 3 V.S.A. Chapter 5 — Secretary of State (Subchapter 3: Office of
    Professional Regulation, incl. § 129a Unprofessional conduct) — § 129(e)(1)"
  url: null
  quoted_text: The notice shall include a statement of the reasons for the action and shall advise the
    applicant that the applicant may file a petition within 30 days after the date on which the
    notice is mailed with the board or the Director for review of the board’s or Director’s
    preliminary decision.
