stem: Under 26 V.S.A. § 2252(b)(3), what action must the Commission take when it receives a
  complaint about a salesperson failing to disclose known defects?
options:
  - The Commission must refer the complaint to the Attorney General
  - The Commission must investigate suspected unprofessional conduct
  - The Commission must issue a subpoena for records
  - The Commission must conduct a hearing on the matter
key: B
explanation: The statute requires the Commission to investigate suspected unprofessional conduct
  upon receiving a complaint. Referring to the Attorney General or issuing a subpoena are subsequent
  steps, not the initial mandated action.
