stem: A licensee knows they have been diagnosed with a condition that causes severe panic attacks
  during client showings, yet they continue to conduct showings without seeking treatment or
  accommodation. Under 3 V.S.A. §129a, this conduct is most directly addressed by which subsection?
options:
  - The act of practicing while medically or psychologically unfit
  - The act of delegating responsibilities to an unqualified person
  - The act of failing to make records available upon request
  - The act of failing to retain client records for seven years
key: A
explanation: The scenario describes practicing while medically or psychologically unfit, which
  corresponds to subsection (5) of 3 V.S.A. §129a(a). The option about delegating responsibilities
  to an unqualified person is incorrect because the licensee is not delegating tasks; the issue is
  the licensee’s own fitness to practice.
