stem: A person conducts a sale of land at an auction advertised as a bona fide public auction and
  receives a commission from the seller. Under 26 V.S.A. § 2211(b)(3), is the person required to
  hold a real estate license?
options:
  - The person is exempt because the sale was advertised as a bona fide public auction.
  - The person is required to hold a license because they received a commission for the transaction.
  - The person is exempt because they are not the owner and the auction was open to the public.
  - The person is required to hold a license because auctions are considered brokerage activities.
key: A
explanation: The auctioneer exemption applies when the sale is advertised as a bona fide public
  auction, regardless of receiving a commission. Thus the person is exempt and need not hold a
  license. The distractor focusing on the commission overlooks this specific exemption.
