stem: If a standard of unprofessional conduct in 3 V.S.A. § 129a conflicts with a standard in a
  specific board’s statute or rule, which standard governs?
options:
  - The standard that was enacted most recently
  - The standard that is most protective of the public
  - The standard set forth in the specific board’s statute or rule
  - The standard that is least restrictive for licensees
key: B
explanation: The rule states that when a conflict arises, the standard most protective of the public
  governs. Therefore the correct answer is the standard that is most protective of the public. The
  distractor that cites the board’s own standard is incorrect because the rule explicitly gives
  precedence to the more protective public standard, not the board’s rule.
