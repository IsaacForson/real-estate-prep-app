stem: During a declared state of emergency, the Vermont Real Estate Commission may issue a temporary
  license to a practitioner who is currently licensed in good standing in another jurisdiction.
  Under 3 V.S.A. § 129(10)(B), what is the maximum number of days such a temporary license may
  authorize practice in Vermont if the emergency continues?
options:
  - 30 days
  - 60 days
  - 90 days
  - 120 days
key: C
explanation: The rule provides that a temporary license issued under a declared state of emergency
  authorizes practice until the termination of the emergency or 90 days, whichever occurs first.
  Therefore, if the emergency persists, the license is valid for up to 90 days. The 30‑day and
  60‑day options understate the limit, while 120 days exceeds the statutory maximum.
citation:
  source: "3 V.S.A. ch. 5 — 3 V.S.A. Chapter 5 — Secretary of State (Subchapter 3: Office of
