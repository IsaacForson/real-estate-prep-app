stem: According to 26 V.S.A. § 2291(a), what limitation does a real estate license place on the
  number of persons who may perform the licensed activities listed in § 2211?
options:
  - It authorizes any number of persons employed by the same brokerage firm.
  - It authorizes the licensee and any supervising broker to perform those activities.
  - It authorizes only one person to perform those activities.
  - It authorizes the licensee and one unlicensed assistant to perform those activities.
key: C
explanation: The statute provides that a real estate license shall not be authority for more than
  one person to perform the activities listed in section 2211 of this chapter. Therefore only one
  person may act under a given license. The correct option states that only one person may perform
  those activities. The other options incorrectly allow multiple persons to act under the license,
  which contradicts the rule.
