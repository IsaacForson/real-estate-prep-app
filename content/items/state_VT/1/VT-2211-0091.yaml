stem: An insurer receives a settlement of a professional negligence claim against a Vermont‑licensed
  real estate broker. Under 3 V.S.A. § 127(b), within how many days must the insurer report this
  information to the Office of Professional Regulation?
options:
  - 20 days
  - 15 days
  - 30 days
  - 10 days
key: C
explanation: Subsection (b) mandates that insurers report judgments or settlements involving a claim
  of professional negligence within 30 days, regardless of any pending appeal. The 30‑day period is
  directly stated in the rule. The shorter periods confuse this requirement with the 10‑day deadline
  for disciplinary action reports.
