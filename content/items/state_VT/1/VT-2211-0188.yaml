stem: A licensee is convicted of a felony in a federal court on January 10. Under 3 V.S.A.
  §129a(11), does failing to report this conviction to the Office within 30 days constitute
  unprofessional conduct?
options:
  - Under 3 V.S.A. §129a(11), failing to report the conviction does not constitute unprofessional
    conduct because only misdemeanor convictions must be reported.
  - Under 3 V.S.A. §129a(11), failing to report the conviction does not constitute unprofessional
    conduct because convictions in federal court are exempt from reporting.
  - Under 3 V.S.A. §129a(11), failing to report the conviction does not constitute unprofessional
    conduct because the licensee has 60 days to report the conviction.
  - Under 3 V.S.A. §129a(11), failing to report the conviction constitutes unprofessional conduct
    because the rule requires reporting any felony or misdemeanor conviction within 30 days.
key: D
explanation: The rule explicitly provides that failing to report any felony or misdemeanor
  conviction within 30 days is unprofessional conduct. The licensee’s failure to report a federal
  felony conviction therefore violates this provision. The distractor claiming only misdemeanors
  must be reported is incorrect because the rule includes felonies; the distractor asserting federal
  court exemptions is wrong as the rule covers federal court convictions; and the distractor about a
  60‑day deadline contradicts the 30‑day requirement.
