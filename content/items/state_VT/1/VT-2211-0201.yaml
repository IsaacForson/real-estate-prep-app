stem: A profession regulated by the Office of Professional Regulation has 750 active licensees.
  According to 3 V.S.A. § 129b(g)(2), how many times per year must the Office hold an open meeting
  that includes advisors for that profession?
options:
  - One time per year
  - Two times per year
  - Three times per year
  - Four times per year
key: B
explanation: The rule requires at least twice per year for professions with more than 500 active
  licensees; since 750 exceeds 500, the Office must hold two meetings. The distractor "One time per
  year" is incorrect because it applies only to professions with 500 or fewer licensees.
citation:
  source: 3 V.S.A. § 129b(g)(2)(B)
  url: null
  quoted_text: (B) at least twice per year for each profession with more than 500 active licensees;
  secondary: []
math:
  worked_solution: >-
    Step 1: Identify the number of active licensees: 750.

    Step 2: Compare this number to the threshold of 500: 750 > 500.

    Step 3: Apply the rule from 3 V.S.A. § 129b(g)(2)(B), which states that for professions with
    more than 500 active licensees, the Office must hold at least twice per year.

    Step 4: Therefore, the required number of meetings per year is 2.
  formulas:
    - "Comparison: licensees > 500"
    - Meetings per year = 2 if licensees > 500 else 1
