stem: A Vermont real estate licensee is convicted of a misdemeanor in a Vermont Superior Court on
  March 1. Under 3 V.S.A. § 129a(11), by what date must the licensee report the conviction to the
  Office of Professional Regulation?
options:
  - Report the conviction by March 31.
  - Report the conviction by May 1.
  - Report the conviction by April 1.
  - Report the conviction by April 15.
key: A
explanation: Under 3 V.S.A. §129a(11), a licensee must report any felony or misdemeanor conviction
  to the Office within 30 days. Counting 30 days from March 1 gives a deadline of March 31.
  Reporting by April 1 would be after the 30‑day period, as would reporting by April 15 or May 1, so
  those dates do not satisfy the requirement.
