stem: An applicant for a Vermont real estate license has two years of recent practice in good
  standing in another state and seeks endorsement under 3 V.S.A. § 136a(a). What does the law
  require regarding the applicant’s practice duration?
options:
  - The applicant must have exactly three years of practice in good standing.
  - The applicant must have no more than three years of practice in good standing.
  - The applicant must have less than one year of practice in good standing.
  - The applicant must have at least three years of practice in good standing.
key: B
explanation: The endorsement process requires not more than three years of practice in good standing
  in another jurisdiction, so two years satisfies the requirement. The distractor 'at least three
  years' is incorrect because the rule sets a maximum, not a minimum, of three years.
