stem: An applicant has been a licensed salesperson for 24 months and has closed six separate and
  unrelated transactions. Under 26 V.S.A. § 2292(a)(2), does the applicant meet the experience
  requirement for a broker license?
options:
  - The applicant meets the requirement because they have two years' experience
  - The applicant does not meet the requirement because they need at least eight separate
    transactions
  - The applicant meets the requirement because the experience requirement is only two years
  - The applicant does not meet the requirement because they need to be at least 18 years old
key: B
explanation: The rule requires at least eight separate and unrelated closed transactions in addition
  to two years' experience; the applicant has only six transactions, so they do not qualify. The
  distractor claiming the applicant meets the requirement because they have two years' experience
  ignores the transaction count requirement.
