stem: A State agency conveys a parcel of land to a private buyer. Under 3 V.S.A. § 103(b), what must
  happen to the deed after it is prepared?
options:
  - The original deed is given to the buyer and a duplicate copy is filed with the Secretary of State
  - Both original and duplicate deeds are given to the buyer for recording
  - The deed is filed with the town clerk where the land is located
  - The deed is retained by the State agency and not provided to the buyer
key: A
explanation: Under 3 V.S.A. § 103(b), deeds conveying land from the State as grantor must be
  prepared in duplicate, with the original given to the buyer and the duplicate copy filed with the
  Secretary of State. The correct choice describes that the original deed goes to the buyer and a
  duplicate is filed with the Secretary of State. The other choices incorrectly state that both
  original and duplicate go to the buyer, that the deed is filed with the town clerk, or that the
  deed is retained by the State agency.
citation:
  source: "3 V.S.A. ch. 5 — 3 V.S.A. Chapter 5 — Secretary of State (Subchapter 3: Office of
    Professional Regulation, incl. § 129a Unprofessional conduct) § 103(b)"
  url: null
  quoted_text: (b) All deeds, contracts of sale, leases, and other documents conveying land or an
    interest in land from the State as grantor, except for transportation rights-of-way, leases, and
    conveyances, shall be made out in duplicate by the authorized agent of the State. The original
    shall be delivered to the grantee and the duplicate copy, so marked, shall be filed in the
    Office of the Secretary of State.
