stem: A broker completes 24 hours of approved continuing education during the renewal period, but
  none of the hours cover legislation or other topics specified by the Commission. Under 26 V.S.A. §
  2293, can the broker renew the license?
options:
  - The broker may renew the license if the missing hours are made up within the next renewal period.
  - The broker may not renew the license because brokers must complete 30 hours of continuing
    education.
  - The broker may renew the license because the total hour requirement is satisfied.
  - The broker may not renew the license because at least four hours must address legislation or
    other specified topics.
key: D
explanation: Section 2293 requires that at least four of the continuing education hours address
  legislation or other topics specified by the Commission for each renewal period. Because the
  broker’s 24 hours contain no such content, the requirement is not satisfied. The idea that the
  broker could renew the license by making up the missing hours later does not meet the
  legislation‑hour requirement for the current period.
