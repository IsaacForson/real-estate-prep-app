stem: A brokerage firm submits its registration application to the Vermont Real Estate Commission
  but does not name an individual to serve as principal broker. Under 26 V.S.A. § 2291(b), what is
  required for the application to be complete?
options:
  - The application must include the designation of an individual to serve as principal broker.
  - The application may be accepted if the firm later designates a principal broker after
    registration.
  - The application can be processed without a principal broker if the firm has a managing broker.
  - The application must be accompanied by a certificate of good standing from the firm's home state.
key: A
explanation: Section 2291(b) requires a registered brokerage firm to designate in its application
  the individual who is to serve as the principal broker under the brokerage firm registration. Thus
  the application must include that designation to be complete. The suggestion that the firm could
  add the designation later does not satisfy the requirement, because the designation must be part
  of the initial application.
