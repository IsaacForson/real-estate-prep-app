  url: null
  quoted_text: Whenever a licensed broker desires to be licensed under a different name, the broker
    shall pay the fee established under section 2255 of this chapter. Notice of any change in the
    names and addresses of the licensees shall be given to the Commission within 30 days after the
    change becomes effective.
