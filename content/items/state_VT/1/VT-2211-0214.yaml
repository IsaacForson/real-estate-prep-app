stem: A broker changes the name under which they are licensed and notifies the Vermont Real Estate
  Commission 45 days after the change becomes effective. Under 26 V.S.A. § 2294(a), what is the
  status of the broker's compliance?
options:
  - The broker is compliant because notice was eventually given
  - The broker is noncompliant due to notice after the 30‑day period
  - The broker is subject to a late‑filing penalty fee
  - The broker is required to retake the licensing examination
key: B
explanation: The law requires notice of a name change to be given to the Commission within 30 days
  after the change becomes effective. Providing notice after 45 days violates this requirement,
  making the broker noncompliant. The distractor claiming compliance because notice was eventually
  given ignores the 30‑day deadline.
