  source: 3 V.S.A. § 129
  url: null
  quoted_text: Adopt rules governing the issuance of licenses to practice, to persons licensed and in
    good standing to practice in another jurisdiction, that authorize the holder of the license to
    practice in this State for no more than 10 days or 80 hours in any calendar year upon payment of
    the required fee.
