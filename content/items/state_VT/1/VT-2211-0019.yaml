stem: An out-of-state broker who is licensed and in good standing elsewhere wants to perform limited
  brokerage work in Vermont under rules adopted pursuant to section 129 without obtaining a Vermont
  license. What limit governs how much such practice is allowed in a calendar year?
options:
  - Up to 30 days in a calendar year with no hourly restriction
  - An unlimited number of days as long as fewer than 80 hours are worked
  - Up to 10 days per calendar month with no annual cap whatsoever
  - Up to 10 days or 80 hours in a calendar year, whichever comes first
key: D
explanation: Section 129(a)(8) authorizes rules letting a licensee in good standing elsewhere
  practice in Vermont for no more than 10 days or 80 hours in any calendar year upon payment of the
  required fee.
