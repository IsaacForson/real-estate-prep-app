stem: A licensee fails to comply with a board order to cease advertising a property as 'newly
  renovated' when the renovations are incomplete. Under 3 V.S.A. §129a(a)(4), does this constitute
  unprofessional conduct?
options:
  - Yes, because the order pertained to advertising language, which is not a license condition
  - Yes, because the board’s order is only binding if issued after a formal hearing
  - Yes, because the licensee must first appeal the order before any violation can be found
  - Yes, because failing to comply with an order of the board constitutes unprofessional conduct
    under §129a(a)(4)
key: D
explanation: Section 129a(a)(4) explicitly lists failing to comply with an order of the board as
  unprofessional conduct, so the licensee’s noncompliance satisfies the definition. The distractor
  suggesting an appeal is required is wrong because the statute does not condition the violation on
  prior appeal; the act itself is sufficient.
