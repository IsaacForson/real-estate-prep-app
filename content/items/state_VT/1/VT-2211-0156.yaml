stem: A loan officer of a Vermont bank sells a parcel of land owned by the bank to a third party for
  a fee. Under 26 V.S.A. § 2211(b)(4), is the loan officer required to hold a real estate license to
  conduct this sale?
options:
  - The loan officer is required to hold a license because the bank is not a licensed real estate
    entity.
  - The loan officer is exempt because the transaction involves real estate owned by the bank.
  - The loan officer is required to hold a license because they received a commission for the
    transaction.
  - The loan officer is exempt as a bank employee performing duties regarding bank-owned real estate.
key: D
explanation: The exemption for bank employees applies when they perform brokerage activities
  concerning real estate owned by their bank. Therefore the loan officer is exempt and need not hold
  a license. The distractor claiming a license is required because a commission was received ignores
  this statutory exemption.
