stem: An insurer receives a judgment or settlement involving a claim of professional negligence by a
  licensee. Under 3 V.S.A. § 127(b), within how many days must the insurer report such information
  to the Office?
options:
  - 60 days
  - 30 days
  - 20 days
  - 10 days
key: B
explanation: The statute sets a 30‑day deadline for insurers to report judgments or settlements
  involving professional negligence by a licensee to the Office. The 10‑day and 20‑day options are
  too short, while 60 days exceeds the required period.
citation:
  source: 3 V.S.A. ch. 5 § 127(b)
  url: null
  quoted_text: Within 30 days of any judgment or settlements involving a claim of professional
    negligence by a licensee, any insurer of the licensee shall report such information to the
    Office, regardless of whether the action is the subject of a pending appeal.
