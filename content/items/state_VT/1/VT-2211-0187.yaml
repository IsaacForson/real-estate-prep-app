stem: A Vermont licensee publishes an online advertisement stating that a listed property has 'newly
  installed roof and HVAC systems' when the licensee knows the roof is five years old and the HVAC
  system is original and malfunctioning. Under 3 V.S.A. §129a(2), does this advertisement constitute
  unprofessional conduct?
options:
  - Under 3 V.S.A. §129a(2), the advertisement does not constitute unprofessional conduct because it
    was published online rather than in print.
  - Under 3 V.S.A. §129a(2), the advertisement does not constitute unprofessional conduct because
    the property is residential rather than commercial.
  - Under 3 V.S.A. §129a(2), the advertisement constitutes unprofessional conduct because it is
    intended or has a tendency to deceive or mislead.
  - Under 3 V.S.A. §129a(2), the advertisement does not constitute unprofessional conduct because
    the licensee later corrected the advertisement.
key: C
explanation: The rule states that advertising that is intended or has a tendency to deceive or
  mislead is unprofessional conduct. The licensee knowingly misrepresented the condition of the roof
  and HVAC, making the advertisement deceptive. Therefore the advertisement violates §129a(2). The
  distractor about the medium (online versus print) is irrelevant because the rule applies to any
  advertising regardless of where it appears.
