stem: A Vermont real estate broker receives an earnest money deposit from a buyer on a Thursday.
  Assuming no intervening holidays, by what deadline must the broker deposit the funds into a trust
  or escrow account under 26 V.S.A. § 2214(a)?
options:
  - The broker must deposit the funds within five banking days
  - The broker must deposit the funds by the end of the next business day
  - The broker must deposit the funds within ten calendar days
  - The broker must deposit the funds by the end of the same day
key: A
explanation: Section 2214(a) requires every broker to deposit earnest money within five banking
  days. Counting five banking days from Thursday leads to the following Thursday, so the correct
  deadline is 'within five banking days.' The option stating 'within ten calendar days' incorrectly
  uses calendar days instead of the banking‑day requirement.
