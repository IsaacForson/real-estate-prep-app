stem: A licensee assists a client in purchasing a parcel of land owned by the State. After preparing
  the contract of sale, what must the licensee ensure happens to the duplicate copy of the contract
  under 3 V.S.A. § 103(b)?
options:
  - The duplicate copy must be filed in the Office of the Secretary of State.
  - The duplicate copy must be retained by the licensee.
  - The duplicate copy must be recorded in the town land records.
  - The duplicate copy must be delivered to the grantee.
key: A
explanation: The statute requires the duplicate copy, so marked, to be filed in the Office of the
  Secretary of State; the original goes to the grantee. Retention by the licensee or recording in
  town land records is not required by this provision.
citation:
  source: "3 V.S.A. ch. 5 — 3 V.S.A. Chapter 5 — Secretary of State (Subchapter 3: Office of
    Professional Regulation, incl. § 129a Unprofessional conduct) § 103(b)"
  url: null
  quoted_text: (b) All deeds, contracts of sale, leases, and other documents conveying land or an
    interest in land from the State as grantor, except for transportation rights-of-way, leases, and
    conveyances, shall be made out in duplicate by the authorized agent of the State. The original
    shall be delivered to the grantee and the duplicate copy, so marked, shall be filed in the
    Office of the Secretary of State.
