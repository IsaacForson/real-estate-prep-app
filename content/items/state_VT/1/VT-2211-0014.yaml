stem: A licensed salesperson serving as the Commission's salesperson member passes the broker
  examination and becomes a licensed broker mid-term. Under section 2251, what happens to that
  member's Commission seat?
options:
  - The member is required to resign from the Commission at once
  - The member keeps the salesperson seat until the current term ends
  - The member becomes ineligible to keep serving as salesperson member
  - The member automatically fills the next open attorney seat instead too
key: C
explanation: Section 2251(b) provides that if a salesperson becomes a broker while serving on the
  Commission, that person becomes ineligible to continue serving as the salesperson member.
