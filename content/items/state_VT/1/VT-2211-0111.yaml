stem: A broker appointed to the Vermont Real Estate Commission is a member of a professional real
  estate association at the time of appointment but resigns after two months; the other two broker
  members have never been members of the association. Is the Commission in compliance with the
  requirement that at **LEAST** one broker member shall not be a member of a professional real
  estate association at the time of appointment or during tenure?
options:
  - The Commission is not in compliance because the broker never rejoined after resigning two months
    into his term
  - The Commission is in compliance because at least one broker member never held association
    membership
  - The Commission is in compliance only if all three broker members never become members of the
    association
  - The Commission is not in compliance because the appointed broker was never removed from the
    association during his tenure
key: B
explanation: The statute states that at least one broker member must not be a member of a
  professional real‑estate association at the time of appointment or at any time during tenure. In
  the described scenario, two of the three broker members have never been members of such an
  association, which satisfies the requirement. Consequently, the statement that the Commission is
  in compliance because at least one broker member never held association membership correctly
  reflects the rule.
citation:
