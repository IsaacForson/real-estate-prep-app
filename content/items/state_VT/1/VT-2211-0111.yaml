  url: null
  quoted_text: Three members of the Commission shall be licensed real estate brokers whose vocations
    shall have been that of real estate broker for at least four years. At least one of the broker
    members shall not be a member of a professional real estate association at the time of
    appointment or at any time during tenure as a member.
