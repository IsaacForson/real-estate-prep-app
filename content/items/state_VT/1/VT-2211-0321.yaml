stem: A Vermont real estate licensee legally changes their name after marriage. Under 3 V.S.A. §
  129a(14), when must the licensee notify the Office of Professional Regulation of this change?
options:
  - Within 30 days of the name change.
  - Within 60 days of the name change.
  - Within 90 days of the name change.
  - Within 10 days of the name change.
key: A
explanation: The rule requires a licensee to report any change of name, email, or mailing address to
  the Office within 30 days. Therefore, the licensee must notify the Office within 30 days of the
  name change. The 60‑day option is incorrect because the statute specifies a 30‑day period, not a
  longer interval.
