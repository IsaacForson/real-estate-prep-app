stem: A licensee receives a written request from a client for copies of their file but fails to
  provide them. Under 3 V.S.A. § 129a(a)(8), what is the consequence?
options:
  - The licensee's action is considered unprofessional conduct under §129a(a)(8) for failing to make
    records available upon written request.
  - The licensee's action is not a violation because the records are stored electronically today.
  - The licensee's action is permissible if the licensee retains the records for seven years before
    disposal now.
  - The licensee's action is allowed because the client did not pay for copying fees today.
key: A
explanation: "Section 129a(a)(8) defines failing to make records available promptly upon a written
  request as unprofessional conduct. The other options describe scenarios not excused by the rule:
  retention period, payment for copies, or electronic storage do not override the duty to provide
  records when requested."
citation:
  source: "3 V.S.A. ch. 5 — 3 V.S.A. Chapter 5 — Secretary of State (Subchapter 3: Office of
    Professional Regulation, incl. § 129a Unprofessional conduct) — § 129a(a)(8)"
  url: null
  quoted_text: Failing to make available promptly to a person using professional health care services,
    that person’s representative, or succeeding health care professionals or institutions, upon
    written request and direction of the person using professional health care services, copies of
    that person’s records in the possession or under the control of the licensed practitioner, or
    failing to notify patients or clients how to obtain their records when a practice closes.
