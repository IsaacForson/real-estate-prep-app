stem: A broker assigns an unlicensed assistant to negotiate purchase agreements with clients,
  knowing the assistant has no real estate license or training. Under 3 V.S.A. § 129a(a)(6), what is
  the consequence?
options:
  - It is permissible because the broker supervises the assistant’s work on all client transactions.
  - It is unprofessional conduct because the broker delegated duties to an unlicensed assistant.
  - It is allowed if the assistant receives training from the broker under supervision.
  - It is unprofessional conduct only if the assistant’s actions cause harm to the client.
key: B
explanation: The rule prohibits delegating professional responsibilities to a person whom the
  licensee knows or has reason to know is not qualified by training, experience, education, or
  licensing credentials. Since the broker knowingly assigned an unlicensed assistant to negotiate,
  the conduct is unprofessional. The option suggesting it is allowed if the assistant receives
  training is incorrect because training does not confer the required licensure or qualification to
  perform negotiated acts.
