  quoted_text: Delegating professional responsibilities, including the delivery of health care
    services, to a person whom the licensed professional knows, or has reason to know, is not
    qualified by training, experience, education, or licensing credentials to perform them, or
    knowingly providing professional supervision or serving as a preceptor to a person who has not
    been licensed or registered as required by the laws of that person’s profession.
