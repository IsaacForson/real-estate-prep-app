stem: An auctioneer advertises and conducts a public auction of a farm on behalf of the owner. Under
  section 2211, what licensing treatment applies to the auctioneer for this sale?
options:
  - No license is required, since the sale is a bona fide public auction
  - A salesperson license is required unless the auctioneer is properly bonded
  - No license is required if the farm happens to sell below market value
  - A broker license is required, because auctioneers sell for a fee
key: A
explanation: Section 2211 excludes from the broker and salesperson definitions any person selling
  real estate as an auctioneer, provided the sale is advertised as a bona fide public auction.
citation:
  source: 26 V.S.A. § 2211
  url: null
  quoted_text: Any person selling real estate as an auctioneer, provided such sale is advertised as a
    bona fide public auction.
