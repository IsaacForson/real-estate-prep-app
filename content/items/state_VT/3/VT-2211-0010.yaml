stem: A newly registered brokerage firm wants to operate without naming a specific licensee as
  responsible for overseeing its brokerage activity. What does section 2291 require of the firm's
  registration application?
options:
  - Name in its application the person who is to be principal broker
  - Leave the principal broker position vacant for an indefinite period
  - Rotate the principal broker designation every single calendar year
  - Designate an entirely unlicensed manager as its principal broker
key: A
explanation: Section 2291(b) requires a registered brokerage firm to designate in its application
  the individual who is to serve as the principal broker under the firm's registration.
citation:
  source: 26 V.S.A. § 2291
  url: null
  quoted_text: A registered brokerage firm shall designate in its application the individual who is to
    serve as the principal broker under the brokerage firm registration.
