stem: "According to 26 V.S.A. § 2211(a)(5), a person is considered a real estate salesperson when they:"
options:
  - A person who, for a fee, manages rental units and collects rent for owners without a broker’s
    license.
  - A person who, for a fee, provides loan counseling and prepares closing documents for residential
    buyers.
  - A person who, for a fee, independently lists, offers, and negotiates real estate transactions
    without broker supervision.
  - A person who, for a fee, works for a licensed broker to perform any act listed in subdivision
    (4) on the broker’s behalf.
key: D
explanation: "Under 26 V.S.A. § 2211(a)(5), a real estate salesperson is someone who, for a fee, is
  employed by or associated with a licensed real estate broker to perform any act listed in
  subdivision (4) on behalf of that broker. The correct option describes exactly that: a person who,
  for a fee, works for a licensed broker to perform any act listed in subdivision (4) on the
  broker’s behalf. The other options are incorrect because they describe activities that either do
  not require broker association (managing rentals independently, providing loan counseling, or
  listing and negotiating transactions without supervision) or involve acts that are not performed
  on behalf of a broker."
