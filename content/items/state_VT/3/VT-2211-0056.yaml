stem: A salesperson renewing their license for the next biennial period must complete how many hours
  of continuing education?
options:
  - The salesperson must complete 24 hours of approved instruction
  - The salesperson must complete 8 hours of approved instruction
  - The salesperson must complete 4 hours of approved instruction
  - The salesperson must complete 16 hours of approved instruction
key: D
explanation: Section 2293 of 26 V.S.A. Chapter 41 requires that a salesperson, when renewing a
  license, complete at least 16 hours of Commission‑approved instruction during the preceding
  two‑year period, with four of those hours covering legislation. Brokers are required to complete
  24 hours, so the statement that a salesperson must complete 24 hours is incorrect. The statements
  that a salesperson must complete 8 hours or 4 hours are also incorrect because the statute sets
  the requirement at 16 hours. Consequently, the correct answer is the statement that the
  salesperson must complete 16 hours of approved instruction.
citation:
  source: 26 V.S.A. ch. 41 — 26 V.S.A. Chapter 41 — Real Estate Brokers and Salespersons § 2293
  url: null
  quoted_text: Licenses shall be renewed every two years without examination and on payment of the
    required fees, provided that the person applying for renewal completes at least 24 hours of
    instruction for brokers and 16 hours of instruction for salespersons, approved by the
    Commission, during the preceding two-year period. Four hours of this continuing education
    instruction shall address legislation and other topics specified by the Commission for each
    renewal period.
