stem: If the Vermont Real Estate Commission has five members present, how many votes are required to
  pass a motion under 26 V.S.A. § 2253(d)?
options:
  - Four votes
  - Three votes
  - Five votes
  - Seven votes
key: B
explanation: A majority of the members present and voting is required for action. With five members
  present, a majority is three votes. Two votes constitute only a minority and would not satisfy the
  majority requirement.
