stem: A regular employee of a corporate owner shows a property to prospective buyers. Does the
  employee need a real estate license under Vermont law?
options:
  - The employee must obtain a real estate salesperson license before showing the property to the
    buyer.
  - The employee must obtain a real estate broker license before showing the property to the buyer.
  - The employee does not need a license because they are a regular employee of the owner performing
    management acts.
  - The employee needs a license only if they receive a commission for the showing to the buyer.
key: C
explanation: Under 26 V.S.A. § 2211(b)(1), a regular employee of a bona fide owner who performs any
  of the acts listed in § 2211(a)(4) in the regular course of managing the owner’s property is
  exempt from licensing requirements. Showing the property to prospects constitutes assisting in
  procuring prospects, which is an act under subdivision (a)(4)(G). Therefore, no license is
  required, making the other options incorrect because they incorrectly impose a license obligation
  on the employee.
citation:
  source: 26 V.S.A. ch. 41 — 26 V.S.A. Chapter 41 — Real Estate Brokers and Salespersons — § 2211(b)(1)
  url: null
  quoted_text: Any person, partnership, association, or corporation who as a bona fide owner performs
    any of the acts set forth in subdivision (a)(4) of this section with reference to property owned
    by them, nor shall it apply to regular employees thereof, when such acts are performed in the
    regular course of or as an incident to the management of such property and the investment
    therein.
