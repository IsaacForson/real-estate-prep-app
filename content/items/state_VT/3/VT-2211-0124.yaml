stem: Under 26 V.S.A. § 2211(a)(4)(G), what may a nonlicensed employee of a licensee do regarding
  public inquiries?
options:
  - The employee may prepare purchase agreements for clients without supervision and may also host
    open houses.
  - The employee may negotiate the sale price on behalf of the licensee without disclosing their
    unlicensed status and may also show properties.
  - The employee may advertise the licensee's services as if they were a licensed broker and may
    also solicit listings.
  - The employee may respond to inquiries from the public if they state they are not licensed and
    advise confirmation by a licensed person.
key: D
explanation: The rule explicitly allows a nonlicensed employee to respond to public inquiries
  provided they disclose their unlicensed status and advise that information should be confirmed by
  a licensed person. Negotiating sale prices, preparing agreements, or advertising as a broker are
  acts requiring a license and are not permitted for unlicensed employees.
