stem: Two individuals who jointly own a small brokerage attempt to perform brokerage activities
  under a single real estate license issued to only one of them. How does section 2291 treat this
  arrangement?
options:
  - Valid, because the Commission permits informal license sharing
  - Valid, because spouses may freely share a single real estate license
  - Invalid, since one license may not authorize two people to act
  - Invalid, merely because both individuals lack sales experience
key: C
explanation: Section 2291(a) provides that a real estate license shall not be authority for more
  than one person to perform the activities listed in section 2211, so the arrangement is invalid.
