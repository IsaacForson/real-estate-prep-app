stem: A buyer deposits earnest money with a broker, and the parties agree in writing that the
  interest will go to the broker’s office account. The deposit is expected to earn substantial
  interest. If the sale closes, where must the interest be applied according to 26 V.S.A. §
  2214(b)(1)?
options:
  - The interest must be applied to the purchase price due from the buyer.
  - The interest must be returned to the buyer upon termination of the contract.
  - The interest must be payable to the seller if the buyer defaults on the contract.
  - The interest must be deposited into the broker’s office account as agreed in writing.
key: D
explanation: Section 2214(b)(1) provides that earnest money interest defaults to the purchase price,
  return to buyer, or payment to seller, but only unless otherwise agreed to in writing by all
  parties. Because the parties agreed in writing that the interest goes to the broker’s office
  account, that agreement controls. Returning the interest to the buyer upon termination of the
  contract reflects the default rule and is incorrect because the written agreement overrides it.
citation:
  source: "### 26 V.S.A. ch. 41 — 26 V.S.A. Chapter 41 — Real Estate Brokers and Salespersons § 2214(b)(1)"
