stem: A licensed broker dies, and the Commission issues a temporary license to the broker's legal
  representative under section 2299 so pending transactions can be completed. What limits apply to
  that temporary license?
options:
  - It lasts indefinitely until the deceased broker's estate is settled
  - It runs up to one year, but no new brokerage agreements can be signed
  - It converts automatically into a permanent license after 90 days
  - It authorizes the legal representative to sign new listings right away
key: B
explanation: Section 2299 permits the temporary licensee to continue the business for a period not
  to exceed one year but bars entering into new brokerage service agreements.
citation:
  source: 26 V.S.A. § 2299
  url: null
  quoted_text: Such temporary licensee may continue to transact said real estate business for a period
    not to exceed one year. A temporary licensee shall not enter into new brokerage service
    agreements.
