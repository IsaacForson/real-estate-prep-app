stem: A Vermont real estate broker opens a trust account at a state-chartered bank on March 3. Under
  26 V.S.A. § 2214(a), by what date must the broker notify the Vermont Real Estate Commission of the
  bank where the account is located?
options:
  - A) March 8
  - B) March 13
  - C) March 18
  - D) March 25
key: B
explanation: Under 26 V.S.A. § 2214(a), a broker must notify the Vermont Real Estate Commission
  within ten days after opening any trust or escrow account. Counting ten days from March 3 gives
  March 13 as the deadline. The other options reflect incorrect time frames, such as the
  five‑banking‑day rule or periods longer than ten days.
