stem: A licensee has passed the real estate broker examination, has worked as a licensed salesperson
  for 24 months with eight separate and unrelated closed transactions, and has completed a 20‑hour
  Commission‑approved course of instruction. Does this person qualify for a real estate broker
  license under 26 V.S.A. ch. 41 — 26 V.S.A. Chapter 41 — Real Estate Brokers and Salespersons §
  2292(a)?
options:
  - No, they have not completed the required 40‑hour approved course of instruction.
  - Yes, but they need to obtain additional salesperson experience.
  - Yes, they satisfy all requirements for a broker license.
  - No, they have not passed the broker examination.
key: A
explanation: The statute requires a broker applicant to complete at least 40 hours of approved
  coursework. The applicant has only 20 hours, so they do not meet the education requirement. The
  option stating that they need additional salesperson experience is incorrect because the stem
  indicates the applicant has already passed the broker examination.
