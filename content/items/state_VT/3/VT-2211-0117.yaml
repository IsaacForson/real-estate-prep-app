stem: According to 26 V.S.A. § 2294(c), what must a branch office designate?
options:
  - The branch office must designate a biennial renewal fee of $400.
  - The branch office must designate a different registered name from the main office.
  - The branch office must designate a licensed broker in charge for each branch office.
  - The branch office must designate a separate trust account for each location.
key: C
explanation: Section 2294(c) requires each branch office to use the same registered brokerage firm
  name as the main office and to designate a licensed broker in charge for that branch.
  Consequently, the only statement that reflects the statute is the one saying the branch must
  designate a licensed broker in charge. The statements about a $400 biennial renewal fee, a
  different registered name, and a separate trust account are not required by the provision.
