stem: Section 2296 incorporates the grounds in 3 V.S.A. § 129a as additional unprofessional conduct
  for real estate licensees. A broker knowingly ignores a rule the Real Estate Commission has
  adopted governing brokerage practice. How should this be analyzed under 129a?
options:
  - No violation, because 129a reaches unrelated criminal convictions
  - No violation, because following adopted practice rules is discretionary
  - Unprofessional conduct, but after a client files a written complaint
  - Unprofessional conduct, since ignoring an adopted rule is a ground
key: D
explanation: 129a(3) lists failing to comply with provisions of federal or State statutes or rules
  governing the practice of the profession as unprofessional conduct, and 2296 pulls that ground
  into the real estate chapter.
