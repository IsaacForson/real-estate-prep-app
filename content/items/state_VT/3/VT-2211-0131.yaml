stem: A real estate salesperson conducts business from a home office and keeps the license in a
  locked file cabinet. A prospective buyer visits the office and asks to see the license. The
  salesperson says the license is available upon request. Under 26 V.S.A. § 2295, which statement is
  correct?
options:
  - The salesperson may keep the license in the cabinet as long as it is available within 24 hours.
  - The salesperson is exempt from display requirements when working from a home office.
  - The salesperson is compliant because the license is accessible upon request.
  - The salesperson must display the license conspicuously in the place of business.
key: D
explanation: The rule requires that a license be conspicuously displayed in the licensee’s place of
  business, so keeping it in a locked cabinet does not satisfy the requirement. Therefore, the
  salesperson must display the license conspicuously. The statement that the license is available
  upon request does not satisfy the requirement, because the rule requires conspicuous display, not
  just accessibility.
