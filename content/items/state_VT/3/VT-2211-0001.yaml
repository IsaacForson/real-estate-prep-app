stem: Under 26 V.S.A. § 2296, commingling a client's funds with a licensee's own money is
  unprofessional conduct unless the funds are used for which purpose?
options:
  - Using client escrow money to cover the brokerage's office rent
  - Using trust funds to advance repairs on a listed property
  - Using escrow money to pay the licensee's own income tax
  - Using nominal licensee funds to keep the trust account open
key: D
explanation: Section 2296 bars commingling except to the extent nominal sums of the licensee's own
  funds are needed to keep an open trust account, a narrow carve-out for account maintenance.
