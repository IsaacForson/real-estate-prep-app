stem: Under the Louisiana Administrative Code definitions for property management, what is a
  "property manager"?
options:
  - one who manages real estate for a fee, collecting rents
  - a tenant who arranges repairs in exchange for lower rent
  - an inspector hired to evaluate a rental unit before move-in
  - any licensee who lists a residence for sale for an owner
key: A
explanation: The rule defines a property manager as one who, for a fee, commission, or other
  valuable consideration, manages real estate, including collecting rents and supervising property
  maintenance.
citation:
  source: La. Admin. Code tit. 46, pt. LXVII, § 2601
  url: null
  quoted_text: Property Manager—one who, for a fee, commission, or other valuable consideration,
    manages real estate, including the collection of rents, supervision of property maintenance, and
    accounting for fees received for another.
