stem: A buyer and seller fully execute and both accept a contract to buy and sell real estate, and
  the resident broker will receive funds under it. Into which account must the broker deposit those
  funds?
options:
  - the sales escrow checking account
  - a personal account of the qualifying broker
  - the broker's general operating account
  - the rental trust checking account
key: A
explanation: The rule requires that all funds received by a broker in connection with the sale of
  real estate be deposited into the sales escrow checking account once a written contract to buy and
  sell has been fully executed and accepted by both parties.
