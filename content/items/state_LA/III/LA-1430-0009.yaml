stem: A dispute arises over funds held in a sales escrow checking account, and the parties will not
  agree on disbursement. Which action satisfies the broker's obligation within 60 days of the
  scheduled closing or of learning of the dispute?
options:
  - keeping the funds in escrow indefinitely until the parties settle
  - returning the funds to whichever party paid the earnest money
  - placing the funds into a court registry through a concursus proceeding
  - transferring the funds to the broker's operating account for safekeeping
key: C
explanation: Among the options the rule allows for resolving an escrow dispute within 60 days is
  placing the funds into the registry of a court of competent jurisdiction through a concursus
  proceeding.
