stem: A licensed salesperson wants to work real estate transactions for two different sponsoring
  brokers at the same time. Under the Louisiana Administrative Code, is this arrangement permitted?
options:
  - yes, so long as the two brokers share one trust account
  - no, a salesperson cannot be sponsored by two brokers
  - yes, provided the commission is notified of the arrangement
  - yes, if both sponsoring brokers give written consent to it
key: B
explanation: The rule states that associate brokers and salespersons shall not be sponsored by more
  than one sponsoring broker, so working for two brokers at once is not permitted regardless of
  consent or notice.
