stem: Under Louisiana license law, a licensee who acts for more than one party in the same real
  estate transaction commits a cause for discipline unless the licensee first obtains what?
options:
  - verbal permission from the listing broker alone
  - clearance obtained from the local real estate board
  - written acknowledgment from every party to the deal
  - a signed waiver from the buyer's chosen mortgage lender
key: C
explanation: The statute lists acting for more than one party in a transaction without the written
  acknowledgment of all parties as a cause for censure, suspension, or revocation, so obtaining that
  acknowledgment is what avoids discipline.
