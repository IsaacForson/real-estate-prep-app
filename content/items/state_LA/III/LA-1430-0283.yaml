stem: A licensee places her license on inactive status and does not engage in any real estate
  activity. Under Louisiana Real Estate License Law, is she required to maintain errors and
  omissions insurance?
options:
  - Yes, because it applies to active licensees
  - Yes, but she needs coverage before reactivating
  - No, inactive licensees need not maintain coverage
  - No, but she must obtain a tail policy today
key: C
explanation: The errors‑and‑omissions insurance requirement does not apply to licensees who place
  their license on inactive status; they may renew without the coverage. Hence, an inactive licensee
  is not required to maintain the policy. The other options incorrectly impose a condition or
  suggest an unnecessary tail policy.
citation:
