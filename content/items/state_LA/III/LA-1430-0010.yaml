stem: A licensee learns that a prior occupant of a listed home died by suicide there years earlier.
  Under Louisiana law, how should this fact be treated in the transaction?
options:
  - it must be disclosed only if the buyer specifically asks
  - it must be disclosed to the lender but not the buyer
  - it must be disclosed in writing before every showing occurs
  - it is not a material fact or defect that must be disclosed
key: D
explanation: The statute provides that the fact or suspicion that a property was the site of a
  suicide is not a material fact or material defect regarding the condition of real estate that must
  be disclosed.
