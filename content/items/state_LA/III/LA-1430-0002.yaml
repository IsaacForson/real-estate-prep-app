stem: Under the Louisiana Administrative Code, what is the regulatory definition of a real estate
  "team" or "group"?
options:
  - a partnership formed between two brokerage firms to co-list a single property today
  - a franchise deal that licenses a trademark to brokers across a whole region
  - a panel the commission appoints to review advertising complaints and fines
  - a name used by two or more licensees to present as one entity under one broker
key: D
explanation: The rule defines a team or group as a collective name used by two or more licensees who
  present themselves to the public as one entity performing real estate activities under the same
  sponsoring broker.
citation:
  source: La. Admin. Code tit. 46, pt. LXVII, § 1901
  url: null
  quoted_text: team or group shall mean a collective name used by two or more real estate licensees,
