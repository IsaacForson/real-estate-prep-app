stem: A licensee delivers the mold informational pamphlet to a buyer. The pamphlet contains an
  omission regarding a specific mold hazard. The omission was based on information provided by the
  Louisiana Real Estate Commission, and the licensee exercised ordinary care in obtaining and
  transmitting the information. Under Louisiana law, is the licensee liable for the omission?
options:
  - The licensee is not liable because the omission came from commission info and ordinary care was
    used.
  - The licensee is not liable because the licensee delivered the pamphlet before contract signing.
  - The licensee is liable because the licensee failed to personally verify the pamphlet's
    information.
  - The licensee is liable because the pamphlet contained an omission regarding mold hazards.
key: A
explanation: Under La. R.S. 37:1470, a licensee is not liable for errors, inaccuracies, or omissions
  that are based on information provided by the commission when the licensee exercises ordinary care
  in obtaining and transmitting that information. The option stating that the licensee is not liable
  because the omission came from commission-provided information and ordinary care was used
  correctly reflects this exemption. The option claiming the licensee is not liable because the
  pamphlet was delivered before contract signing is incorrect; the timing of delivery does not
  affect liability under this provision. The option asserting liability because the licensee failed
  to personally verify the pamphlet's information is incorrect because the statute does not require
  personal verification of commission-provided information when ordinary care is exercised. Finally,
  the option stating liability simply because the pamphlet contained an omission regarding mold
  hazards is incorrect; liability does not automatically follow from an omission if the statutory
  conditions of La. R.S. 37:1470 are satisfied.
citation:
  source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law) — Louisiana Real Estate License
