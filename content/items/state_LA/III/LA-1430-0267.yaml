    pamphlet; liability of licensees
  url: null
  quoted_text: The error, inaccuracy, or omission was based on information provided to the licensee by
    the commission, a public agency, or by other persons providing relevant information by delivery
    of a report or opinion prepared by an expert dealing with matters within the relevant scope of
    his professional license, and ordinary care was exercised by the licensee in obtaining and
    transmitting such information.
