stem: Under La. R.S. 37:1437.1(E), what is the required bond amount for a nondeveloper timeshare
  sales registrant in Louisiana?
options:
  - Five thousand dollars
  - Fifteen thousand dollars
  - Ten thousand dollars
  - Twenty thousand dollars
key: C
explanation: The statute explicitly requires a bond in the amount of ten thousand dollars for
  nondeveloper timeshare sales registrants. The other amounts are incorrect because they do not
  match the statutory requirement.
