stem: A salesperson performs a real estate activity and wants to be paid for it. From whom may an
  active licensee accept a commission for that activity?
options:
  - from the buyer directly at the closing table
  - from any broker who requests the licensee's help
  - from the licensee's own sponsoring broker
  - from any party who benefits from the deal
key: C
explanation: The statute states that an active licensee shall not accept a commission or other
  valuable consideration for a licensed act from anyone except the sponsoring or qualifying broker.
citation:
  source: La. R.S. 37:1446 (§ 1446)
  url: null
  quoted_text: >-
    An active real estate licensee shall not accept a commission or other valuable consideration for

    the performance of any act herein specified, or for performing any act relating thereto, from
    any

    person, except their sponsoring or qualifying broker.
