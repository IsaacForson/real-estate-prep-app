stem: A Louisiana broker advises a seller to enter into an agreement where the broker’s commission
  is any amount received above a minimum price for the sale of a single-family home. Under Louisiana
  license law, is this practice permissible?
options:
  - Under Louisiana license law, the practice is permitted because net listing agreements are
    allowed for commercial property
  - Under Louisiana license law, the practice is permitted if the seller agrees in writing
  - Under Louisiana license law, the practice is not permitted because net listing agreements are
    unlawful for residential real estate
  - Under Louisiana license law, the practice is permitted only if the broker discloses the
    arrangement to the buyer
key: C
explanation: The statute expressly prohibits a broker from advising or encouraging a seller to enter
  into a net listing agreement for the sale of residential real estate property. Since the property
  is a single-family home, the practice is unlawful regardless of seller consent or disclosure. The
  other options incorrectly suggest circumstances under which the practice might be allowed.
citation:
  source: La. R.S. 37:1430 et seq. (Louisiana Real Estate License Law); La. Admin. Code tit. 46, pt.
    LXVII (Real Estate) § 1448.3
  url: null
  quoted_text: It is unlawful for any real estate broker to advise or encourage a seller in relation
    to, or to enter into, a net listing agreement as described in R.S. 37:1431, for the sale of
    residential real estate property or any land as defined in R.S. 47:2302.
