stem: A licensee holds a buyer's earnest money deposit after the purchase agreement falls through
  and refuses to return the funds to the buyer. Under Louisiana law, this act is a cause for
  discipline because it constitutes which of the following?
options:
  - Failure to properly disburse money which belongs to others upon its coming into his possession
  - Failure to account for any money coming into his possession belonging to others
  - Commingling the money or other property of his principals with his own
  - Failure to obtain a written acknowledgment from every party to the deal
key: A
explanation: "The licensee’s refusal to return the earnest money after the deal falls through is a
  failure to disburse funds that belong to another party when they come into the licensee’s
  possession, which is prohibited by La. R.S. 37:1455(5). The other choices describe different
  violations: commingling the licensee’s own funds with those of a principal, failing to obtain a
  written acknowledgment from every party to the transaction, and failing to account for money
  received on behalf of others. None of those actions occurred in this scenario, so they are not
  grounds for discipline here."
