stem: A licensed real estate broker wants to serve as the qualifying broker for two different
  corporations formed under Louisiana law. Is this permissible under the Louisiana Real Estate
  License Law?
options:
  - Not allowed; a broker may serve as qualifying broker for only one entity
  - Allowed, as the broker may serve as qualifying broker for more than one entity
  - Allowed only if the entities are under common ownership
  - Allowed only if the broker obtains a separate license for each entity
key: B
explanation: The law explicitly states that an individual real estate broker may serve as a
  qualifying broker for more than one corporation, limited liability company, or partnership (La.
  R.S. 37:1430–1470 — § 1437.2(B)(1)). No additional license or common ownership is required.
