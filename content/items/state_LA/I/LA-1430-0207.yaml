stem: A sponsoring broker wishes to allow a newly hired associate broker to start showing properties
  while the associate broker's license application is still pending with the commission. Under the
  Louisiana Real Estate License Law, what must the sponsoring broker do to permit this activity?
options:
  - The sponsoring broker must submit the associate broker's fingerprints to the commission for
    approval.
  - The sponsoring broker must ensure the associate broker completes an additional 30 hours of
    education before starting.
  - The sponsoring broker must notify the commission in writing within five days of the associate
    broker's start date.
  - The sponsoring broker must obtain written authorization from the commission authorizing the
    activity pending license issuance.
key: D
explanation: A sponsoring broker may permit a pending‑license associate broker to show properties
  only after the commission has issued written authorization for that activity. The commission’s
  written authorization lifts the general prohibition on conducting real‑estate activities before a
  license is issued. Submitting fingerprints, requiring extra education, or merely notifying the
  commission are not sufficient to allow the associate to show properties. La. R.S. 37:1430‑1470;
  La. Admin. Code tit. 46, pt. LXVII § 1439(G)(2).
