stem: A licensed real estate appraiser enters into a written agreement to perform valuation services
  for an appraisal management company that is not licensed under the Louisiana Appraisal Management
  Company Licensing and Regulation Act. According to the Louisiana Administrative Code, what is the
  status of this agreement?
options:
  - The agreement is prohibited because the appraisal management company lacks a Louisiana license
  - The agreement is allowed provided the appraiser supervises no more than three trainees
  - The agreement is valid if the appraiser discloses the arrangement to the client in writing
  - The agreement is permissible if the appraiser includes the AMC's license number in all appraisal
    reports
key: A
explanation: The rule states it is unlawful for a licensee to enter into an agreement with an
  appraisal management company unless that company is licensed under the state’s AMC licensing act.
  Including the AMC’s license number in reports is only permitted when the AMC is licensed.
  Supervision limits and client disclosure do not override the licensing requirement.
citation:
  source: La. Admin. Code tit. 46, pt. LXVII — Louisiana Administrative Code Title 46, Part LXVII -
    Real Estate (LREC rules); Division of Administration docx, Internet Archive capture 2026-01-23
    §10701.A
  url: null
  quoted_text: It shall be unlawful for a licensee or certificate holder to enter into an agreement to
    perform valuation services, written or otherwise, with an appraisal management company, or a
    person, corporation, partnership, sole proprietorship, subsidiary, unit, or other business
    entity that engages, or attempts to engage, in the activities of an appraisal management
    company, as defined in R.S. 37:3415.2(a)-(b), unless the appraisal management company, person,
    corporation, partnership, sole proprietorship, subsidiary, unit, or other business entity is
    licensed in accordance with the Louisiana Appraisal Management Company Licensing and Regulation
    Act.
