stem: An appraisal management company licensee requests that an independent appraiser correct
  factual errors in an appraisal report. Under Louisiana Administrative Code for real estate
  appraisers, is this activity prohibited?
options:
  - The activity is prohibited because it involves altering the appraisal report
  - The activity is not prohibited as it is specifically exempted by the rules
  - The activity is prohibited unless the appraiser agrees in writing
  - The activity is prohibited because it requires the appraiser to admit fault
key: B
explanation: The rules expressly exempt requests for correction of factual errors in an appraisal
  report from prohibited activities. Therefore, the licensee’s request is allowed. The suggestion
  that the activity is prohibited because it alters the report is incorrect; requesting a correction
  does not constitute alteration by the licensee.
