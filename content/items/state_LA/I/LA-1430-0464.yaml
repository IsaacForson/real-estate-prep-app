stem: On June 10, 2005, a licensee gives a buyer the mold informational pamphlet; the buyer and
  seller sign the purchase agreement on June 15, 2005. Under Louisiana Real Estate License Law, is
  the licensee in compliance with the delivery timing requirement?
options:
  - Yes, because the licensee delivered the pamphlet after the contract was entered into.
  - No, because the licensee must deliver the pamphlet on the same day the contract is signed.
  - Yes, because the licensee delivered the pamphlet before the contract was entered into.
  - No, because the licensee must deliver the pamphlet after the contract is entered into.
key: C
explanation: Subsection (A)(2) requires that the mold informational pamphlet be delivered at or
  before the time a contract for sale is entered into. Delivering the pamphlet five days prior to
  the contract satisfies this requirement. The claim that delivery must occur on the same day is not
  supported by the statute and thus incorrect.
