stem: Under Louisiana Real Estate License Law, a licensee is **NOT** held liable for an error,
  inaccuracy, or omission in the mold informational pamphlet if which of the following is true?
options:
  - The licensee obtained the pamphlet from a private contractor.
  - The licensee disclosed all known material defects of the property.
  - The error, inaccuracy, or omission was not within the licensee’s personal knowledge.
  - The licensee delivered the pamphlet after the contract was signed.
key: C
explanation: The correct answer reflects subsection C(1), which exempts liability when the error was
  not within the licensee’s personal knowledge. The distractor about delivery timing is irrelevant
  to liability under this subsection.
