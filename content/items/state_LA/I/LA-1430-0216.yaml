stem: A licensee delivers the mold informational pamphlet to a buyer. Later, the buyer discovers
  that the pamphlet contained an omission regarding mold hazards. The omission was not within the
  licensee’s personal knowledge and the licensee obtained the pamphlet from the commission. Under
  Louisiana Real Estate License Law, is the licensee liable for the omission?
options:
  - Yes, because the licensee is liable for pamphlet content.
  - Yes, because the licensee should have verified the pamphlet.
  - No, because the omission was not within the licensee’s personal knowledge.
  - No, because the commission approved the pamphlet.
key: C
explanation: Under La. R.S. §1470(C)(1), a licensee is not liable for any error, inaccuracy, or
  omission in the mold informational pamphlet when the mistake was not within the licensee’s
  personal knowledge. Because the omission was unknown to the licensee, liability does not attach.
citation:
  source: La. R.S. 37:1430–1470 § 1470(C)(1)
  url: null
  quoted_text: "The licensee shall not be held liable for any error, inaccuracy, or omission of any
    information contained in the mold informational pamphlet delivered pursuant to this Section, if
    either of the following applies: (1) The error, inaccuracy, or omission was not within the
    personal knowledge of the licensee."
