stem: After the Louisiana Real Estate Commission issues an order suspending a licensee's license on
  February 5, 2024, the licensee submits an application for recovery from the real estate recovery
  fund on August 10, 2024. Under Louisiana Real Estate License Law, what is the consequence?
options:
  - The claim is valid because notice was given within 180 days of the order.
  - The claim is barred because the application was submitted after 180 days from the effective date
    of the order.
  - The claim is barred because the licensee did not wait for the commission's intervention.
  - The claim is valid because the application was submitted within 180 days of notice.
key: B
explanation: The right to recover under the recovery fund is forever barred unless application is
  made within one hundred eighty days from the effective date of the order; submitting on August 10
  exceeds that period.
citation:
