stem: Under the Louisiana Administrative Code for real estate appraisers, what is the maximum period
  for which an education provider's approval is valid before it must be renewed?
options:
  - Indefinitely, subject to annual review
  - One year, expiring annually on December 31
  - Six months, expiring semi-annually on June 30
  - Two years, expiring biennially on June 30
key: B
explanation: The rule states that upon approval by the board, education providers are approved for a
  period of one year, expiring annually on December 31. The other options incorrectly state longer
  or shorter periods or indefinite approval.
