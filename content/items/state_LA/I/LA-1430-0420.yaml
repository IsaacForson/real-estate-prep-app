stem: What is the required surety bond amount, in dollars, that an applicant for licensing as an
  appraisal management company must submit to the Louisiana Real Estate Appraisers Board?
options:
  - $25,000
  - $15,000
  - $10,000
  - $20,000
key: D
explanation: The rule mandates a $20,000 surety bond for appraisal management company applicants, as
  stated in §30302.A. The other amounts do not satisfy the statutory requirement. Choosing a lower
  or higher bond amount would fail to meet the licensing condition.
