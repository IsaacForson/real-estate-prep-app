stem: A licensee who holds a client’s earnest money deposit learns that the client has filed a
  voluntary personal bankruptcy petition. Under the Louisiana Real Estate License Law, what action
  must the licensee take regarding this bankruptcy?
options:
  - Notify the commission in writing by registered or certified mail or hand delivery within ten
    days, providing a listing that identifies the owner, amount, financial institution, and account
    number.
  - Notify the commission in writing by registered or certified mail or hand delivery within five
    days, providing only the amount of funds held and the name of the financial institution.
  - No report is required because bankruptcy proceedings are not considered legal actions pertaining
    to real estate activities under the Louisiana Real Estate License Law.
  - Notify the commission via email within ten days, including a listing that identifies the owner
    of the funds, the amount, the financial institution, and the account number.
key: A
explanation: Under La. R.S. 37:1450(B), a licensee who holds client funds must report the
  institution of bankruptcy proceedings to the commission in writing by registered or certified mail
  or hand delivery within ten days, and the report must include a listing identifying the owner of
  the funds, the amount, the financial institution, and the account number. The correct answer
  states that the licensee must notify the commission in writing by registered or certified mail or
  hand delivery within ten days, providing a listing that identifies the owner, amount, financial
  institution, and account number. One incorrect answer states that notification must be made within
  five days and only includes the amount and the name of the financial institution, which omits
  required details and shortens the timeframe. Another incorrect answer claims that no report is
  required because bankruptcy proceedings are not considered legal actions pertaining to real estate
  activities, which contradicts the statutory duty to report. The final incorrect answer suggests
  notifying the commission via email within ten days, but the law requires written notice by
  registered or certified mail or hand delivery, not email.
citation:
  source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law); La. Admin. Code tit. 46, pt.
