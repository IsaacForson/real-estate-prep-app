  url: null
  quoted_text: B. It shall be the duty of every licensee, registrant, and certificate holder who is
    the custodian of client funds to report the institution of bankruptcy proceedings to the
    commission, in writing and by registered or certified mail or hand delivery within ten days of
    institution of such proceedings.
