stem: A licensee delivers the mold informational pamphlet to a buyer and later the buyer discovers a
  known leaky roof that the licensee failed to disclose. Under Louisiana Real Estate License Law,
  does delivering the mold informational pamphlet relieve the licensee of liability for failing to
  disclose the known leaky roof?
options:
  - No, because Section D preserves the duty to disclose known material defects.
  - No, because the pamphlet satisfies all disclosure obligations.
  - No, if the licensee had no personal knowledge of the roof defect.
  - No, unless the licensee obtained the pamphlet from the commission.
key: A
explanation: Subsection D makes clear that the mold pamphlet does not alter existing disclosure
  duties, including the duty to disclose known material defects. The distractor claiming the
  pamphlet satisfies all obligations contradicts this preservation of duties.
citation:
  source: La. R.S. 37:1470(D)
  url: null
  quoted_text: Nothing in this Section shall alter or affect the existing disclosure duties of any
    party to a real estate transaction, or their agents, including but not limited to the duty of a
    licensee to disclose any known material defect regarding the condition of the property.
