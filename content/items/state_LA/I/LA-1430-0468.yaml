stem: An applicant for certified residential appraiser licensure seeks experience credit for 900
  hours, of which 500 hours were earned by reviewing appraisal reports. Under the Louisiana
  Administrative Code, is this amount of review credit permissible?
options:
  - Permitted because review hours under half total requirement
  - Not permitted; review credit exceeds fifty percent limit
  - Permitted; review credit allowed up to sixty percent
  - Not permitted; review credit barred for residential
key: B
explanation: The rule caps review credit at fifty percent of total experience hours; 500/900 exceeds
  that limit, so the credit is not allowed. The distractor claiming the review hours are under half
  is wrong because 500 hours is actually more than half of 900 hours.
