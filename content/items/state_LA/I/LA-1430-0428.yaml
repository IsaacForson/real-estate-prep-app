stem: Under the Louisiana Real Estate License Law, within how many calendar days must a sponsoring
  broker submit a form attesting to the termination of an associate broker's sponsorship to the
  Louisiana Real Estate Commission after the termination occurs?
options:
  - The required period is three (3) calendar days
  - The required period is five (5) calendar days
  - The required period is seven (7) calendar days
  - The required period is ten (10) calendar days
key: B
explanation: The law requires the terminating party to submit the termination form to the commission
  within five calendar days of the termination (La. R.S. 37:1441(A)(1)). Therefore, five calendar
  days is correct. Three calendar days is too short, while seven and ten exceed the required period.
