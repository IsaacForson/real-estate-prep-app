stem: A sponsoring broker terminates an associate broker's sponsorship on March 1. By what date must
  the broker submit the termination form to the commission to comply with the Louisiana Real Estate
  License Law?
options:
  - March 6
  - March 5
  - March 7
  - March 8
key: A
explanation: La. R.S. 37:1441.A requires the terminating party to submit a termination form to the
  commission within five calendar days of the sponsorship ending. Starting from March 1, five
  calendar days later is March 6, so the form must be submitted by that date. The distractor “March
  5” reflects only four days, while “March 7” and “March 8” allow too much time.
