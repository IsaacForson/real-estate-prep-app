stem: A sponsoring broker dies. Under Louisiana Real Estate License Law, what authority does the
  commission have regarding the deceased broker's pending real estate contracts?
options:
  - The commission shall take no action unless a licensed broker files a formal complaint and
    provide written notice to all affected parties
  - The commission shall require the estate to settle all of the deceased broker's open contracts
    and ensure compliance with state regulations
  - The commission shall appoint an associate broker or salesperson to complete the deceased
    broker's real estate activities
  - The commission shall automatically transfer the deceased broker's license to the designated
    successor broker
key: C
explanation: The Louisiana Real Estate License Law provides that upon the death of a sponsoring
  broker, the commission must be notified and may appoint an active licensed associate broker or
  salesperson to finish any pending real estate business, including contracts. The correct option
  reflects this appointment authority. The option stating the commission takes no action unless a
  complaint is filed is incorrect because the law grants the commission proactive authority to
  appoint a replacement. The option placing the duty on the estate to settle contracts is incorrect
  because responsibility lies with the commission, not the estate. The option about automatically
  transferring the license is incorrect because the law does not provide for automatic transfer; the
  commission may appoint a substitute to complete activities.
citation:
  source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law); La. Admin. Code tit. 46, pt.
    LXVII (Real Estate) La. R.S. 37:1451
  url: null
  quoted_text: The commission shall be notified in writing when a sponsoring broker dies and shall
    have the authority to appoint an active licensed associate broker or salesperson to complete,
    carry out, and enforce any incomplete real estate business activities of the deceased sponsoring
    broker, including real estate contracts left pending at the time of the death.
