stem: According to Louisiana Real Estate License Law, how often must a licensee file verification of
  independent errors and omissions insurance with the commission?
options:
  - Biennially
  - Quarterly
  - Annually
  - Monthly
key: C
explanation: The statute requires the licensee to file a form verifying independent coverage with
  the annual license renewal, so the frequency is annual. The biennial option is incorrect because
  the rule specifies annual, not biennial, filing.
