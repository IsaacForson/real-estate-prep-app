stem: An active licensee who is applying for inactive status wishes to renew their license. Under
  the Louisiana Real Estate License Law, what is the requirement regarding errors and omissions
  insurance for this renewal?
options:
  - The paying of a $500 fee to waive the errors and omissions insurance requirement
  - The renewing of a license without the required errors and omissions coverage
  - The providing of proof of errors and omissions coverage meeting commission minimums
  - The obtaining of errors and omissions insurance through the commission's group plan
key: B
explanation: The statute explicitly states that active licensees applying for inactive status and
  those renewing while in an inactive status may do so without the required errors and omissions
  coverage mandated by the section. The other options incorrectly impose insurance or fee
  requirements that do not apply to inactive status renewals.
