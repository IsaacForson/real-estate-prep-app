stem: Under Louisiana Real Estate License Law, who is required to provide the parties to a real
  estate transaction with an agency disclosure informational pamphlet?
options:
  - The licensee representing the seller only.
  - The licensee representing the buyer only.
  - The broker's supervising officer.
  - The licensee involved in the transaction.
key: D
explanation: The statute states that a licensee who fails to provide the parties with an agency
  disclosure informational pamphlet is subject to censure, suspension, or revocation. This duty
  applies to any licensee involved in the transaction, not limited to representing only one party or
  to a broker's officer.
