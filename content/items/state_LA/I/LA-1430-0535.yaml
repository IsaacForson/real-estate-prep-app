stem: A licensee receives an earnest money deposit from a buyer and deposits the funds into his
  personal checking account. Under the Louisiana Real Estate License Law, which of the following is
  true regarding potential disciplinary action?
options:
  - The commission may take no action regarding the deposit.
  - The commission may censure, suspend, or revoke the license.
  - The commission may impose a fine up to five hundred dollars.
  - The commission must automatically revoke the license upon verification.
key: B
explanation: Depositing earnest money into a personal account constitutes failure to account for
  money belonging to others, which is a cause for censure, suspension, or revocation under La. R.S.
  37:1455(A)(4). The other options misstate the commission’s authority.
