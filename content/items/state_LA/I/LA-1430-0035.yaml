stem: According to Louisiana Real Estate License Law, what must occur before a terminated affiliate
  timeshare sales registrant's registration can be reinstated after termination by the developer?
options:
  - The commission must receive a written notice of affiliation with a new developer and the
    prescribed fees must be remitted.
  - The registrant must complete additional continuing education courses approved by the commission.
  - The developer must file a new public offering statement with the commission within the required
    timeframe.
  - The registrant must submit a new application to the commission along with the required fees.
key: A
explanation: According to the statute, a terminated timeshare sales registration remains ineffective
  until the commission receives written notice of the registrant’s affiliation with a new developer
  and the prescribed fees are remitted. The option stating that the registrant must complete
  additional continuing education courses is incorrect because no education requirement is mentioned
  for reinstatement.
citation:
  source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law); La. Admin. Code tit. 46, pt.
    LXVII (Real Estate) § 1441
  url: null
  quoted_text: When an affiliate timeshare sales registrant is terminated by a registered timeshare
    developer, such sales registration shall no longer be in force or effect, until such time that
    the commission receives a written notice that the timeshare sales registrant is affiliated with
    a new developer and the prescribed fees have been remitted.
