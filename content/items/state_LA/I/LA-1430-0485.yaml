stem: A vendor changes the instructor for a continuing education course scheduled for May 15, 2025.
  The vendor notifies the executive director of the change on May 9, 2025. Is this notice compliant
  with the law?
options:
  - No, because the notice was given after the course date.
  - No, because the notice was given less than seven days before the course.
  - Yes, because the notice was given at least seven days before the course.
  - Yes, because the notice was given exactly seven days before the course.
key: B
explanation: May 9 is only six days before May 15, which is fewer than the required seven days. The
  law mandates notice at least seven days prior to the course, so the notice is untimely.
