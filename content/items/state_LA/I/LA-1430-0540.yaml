stem: A licensee submits a renewal fee by personal check that is later returned due to insufficient
  funds. After receiving notice of the returned check by certified mail, how many days does the
  licensee have to remit a certified check, cashier's check, or money order for the amount of the
  returned check plus a $25 processing fee?
options:
  - 20 days
  - 10 days
  - 5 days
  - 15 days
key: B
explanation: Under La. Admin. Code tit. 46, pt. LXVII §10305(E), a licensee who receives notice of a
  returned check by certified mail must remit a certified check, cashier's check, or money order for
  the amount of the returned check plus a $25 processing fee within 10 days of the mailing of the
  notice. Therefore, the correct answer is 10 days; 5 days is too short, and 15 or 20 days are too
  long.
citation:
  source: La. Admin. Code tit. 46, pt. LXVII §10305(E)
  url: null
  quoted_text: Persons issuing checks that are returned by financial institutions will be notified of
    the return of the check by certified mail to the address registered with the board. Within 10
    days from the mailing of the notification, the person issuing the check shall remit a certified
    check, cashier's check or money order payable to the Louisiana Real Estate Appraisers Board in
    the amount of the returned check plus a $25 processing fee.
