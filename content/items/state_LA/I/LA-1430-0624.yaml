stem: Who is required to maintain records of appraisal service requests, fees collected from
  borrowers, and payments to appraisers under Louisiana Administrative Code for real estate
  appraisers?
options:
  - The borrower involved in the transaction
  - The appraisal management company licensee
  - The independent appraiser performing the service
  - The Louisiana Real Estate Commission staff
key: B
explanation: The rule explicitly states that licensees shall maintain records of appraisal service
  requests, fees collected from borrowers or clients, and payments made to appraisers. Therefore,
  the appraisal management company licensee must keep these records. The independent appraiser is
  not required to retain these particular records under the cited provision.
citation:
  source: La. Admin. Code tit. 46, pt. LXVII — Louisiana Administrative Code Title 46, Part LXVII -
    Real Estate (LREC rules); Division of Administration docx, Internet Archive capture 2026-01-23
    §30501.A
  url: null
  quoted_text: "Licensees shall maintain the following records in a complete and accurate manner: 1.
    all requests for appraisal services that have been referred to state certified real estate
    appraisers by the appraisal management company; 2. the amount of fees collected from borrowers
    or clients by the appraisal management company; 3. all payments made by the appraisal management
    company to any state licensed real estate appraiser;"
