stem: A broker completed a real estate transaction on June 15, 2022. According to Louisiana Real
  Estate License Law, what is the last date by which the broker must retain the transaction's escrow
  records?
options:
  - June 15, 2027
  - June 15, 2028
  - June 15, 2025
  - June 15, 2026
key: A
explanation: Records must be kept for a period of five years. Adding five years to June 15, 2022
  gives June 15, 2027 as the final date for retention. The other options reflect incorrect addition
  of fewer or more years.
citation:
  source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law); La. Admin. Code tit. 46, pt.
    LXVII (Real Estate) § 1449(D)(1)
  url: null
  quoted_text: "Individual real estate brokers shall retain all of the following records, readily
    available and properly indexed, for a period of five years:"
