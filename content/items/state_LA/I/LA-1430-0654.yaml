stem: A Louisiana licensee obtains independent errors and omissions insurance to satisfy the
  mandatory coverage requirement. According to Louisiana Real Estate License Law, when must the
  licensee file the verification of independent coverage with the commission?
options:
  - With the annual license renewal
  - With the biennial continuing education report
  - With the initial license application
  - With the quarterly trust account audit
key: A
explanation: The statute states that the verification must be filed with the annual license renewal,
  so the licensee files it at that time. Filing with the initial license application is incorrect
  because the requirement is tied to renewal, not the initial application.
citation:
  source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law); La. Admin. Code tit. 46, pt.
    LXVII (Real Estate) § 1466(F)
  url: null
  quoted_text: F. An active licensee that elects to obtain independent errors and omissions insurance
    shall file a form verifying that they have independent coverage, as prescribed by the
    commission, with the annual license renewal.
