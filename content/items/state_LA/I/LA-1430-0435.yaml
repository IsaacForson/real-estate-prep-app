stem: Under Louisiana Administrative Code for real estate appraisers, within how many business days
  must an appraisal management company notify the board if a document on file with the board becomes
  inaccurate or incomplete?
options:
  - Seven business days
  - Five business days
  - Fifteen business days
  - Ten business days
key: D
explanation: The rule requires the appraisal management company to notify the board in writing
  within 10 business days when a document on file becomes inaccurate or incomplete. Options of five
  or seven days are too short, and fifteen days exceeds the required timeframe.
citation:
  source: La. Admin. Code tit. 46, pt. LXVII — Louisiana Administrative Code Title 46, Part LXVII -
    Real Estate (LREC rules); Division of Administration docx, Internet Archive capture 2026-01-23
    §30501
  url: null
  quoted_text: At any time that a document or information on file with the board becomes inaccurate or
    incomplete, the appraisal management company shall notify the board in writing within 10
    business days.
