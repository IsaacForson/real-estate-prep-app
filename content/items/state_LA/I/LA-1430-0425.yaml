stem: A licensee submits a renewal fee payment by personal check, which is later returned by the
  bank due to insufficient funds. According to the Louisiana Administrative Code, what action may
  the board take regarding the licensee's license?
options:
  - The board may issue a warning and allow the licensee to resubmit the check without penalty
  - The board may require the licensee to submit a money order for the fee within ten days
  - The board may impose a fine equal to the amount of the returned check plus a $25 processing fee
  - The board may cancel the fee transaction and/or suspend or revoke the license
key: D
explanation: The rule provides that a returned check due to non-fault of the bank is grounds for
  cancellation of the transaction and/or suspension or revocation of the license. Imposing a fine
  plus processing fee is not a board action but a requirement for the licensee to remedy the
  returned check. Requiring a money order or issuing a warning are not specified as disciplinary
  measures for this violation.
citation:
  source: La. Admin. Code tit. 46, pt. LXVII — Louisiana Administrative Code Title 46, Part LXVII -
    Real Estate (LREC rules); Division of Administration docx, Internet Archive capture 2026-01-23
    §10305.D
  url: null
  quoted_text: Payment of any fee with a check that is returned by a financial institution, wherein
    the reason for not paying the check is not the fault of the financial institution, shall be
    grounds for the cancellation of the transaction for which the fee was submitted and/or the
    suspension or revocation of a license or certificate.
