stem: Under the Louisiana Administrative Code for real estate appraisers, which of the following
  actions is grounds for refusal of a license?
options:
  - Making a false statement of material fact on an initial or renewal license application
  - Failing to submit the renewal application fee within the required timeframe
  - Advertising appraisal services without displaying the assigned license number
  - Supervising more than three licensed appraiser trainees simultaneously in any jurisdiction
key: A
explanation: The rule states that a false statement of material fact on an application may itself be
  grounds for refusal of a license. Failing to submit renewal fees on time is not cited as a ground
  for refusal; it only places responsibility on the applicant. Advertising without a license number
  and supervising more than three trainees are not mentioned as refusal grounds in this section.
citation:
