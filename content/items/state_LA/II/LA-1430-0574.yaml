stem: According to La. Admin. Code tit. 46, pt. LXVII, what is the minimum number of classroom hours
  of pre‑license instruction that must include the Louisiana Real Estate License Law, the
  commission’s rules and regulations, and Louisiana Civil Law that every applicant for a Louisiana
  real estate license must provide?
options:
  - 30 hours
  - 45 hours
  - 15 hours
  - 20 hours
key: A
explanation: The rule requires every applicant to show at least 30 classroom hours of pre‑license
  instruction that covers the license law, commission rules, and Louisiana Civil Law. Forty‑five
  hours refers to the post‑license education requirement for initial licensees, not the pre‑license
  minimum.
