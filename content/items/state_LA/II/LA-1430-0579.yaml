stem: A vendor seeks approval for a live course offered once a year in conjunction with a real
  estate conference. The vendor submits the required information to the executive director by email
  thirty days before the course is scheduled. According to La. R.S. 37:1460.1(C)(1), is the vendor’s
  submission timely?
options:
  - The submission is timely because it was made at least forty‑five days prior
  - The submission is untimely because it was made less than forty‑five days prior
  - The submission is timely because the course qualifies for the conference exemption
  - The submission is untimely because the vendor omitted instructor qualifications
key: B
explanation: The rule requires submission at least forty‑five days prior to the planned date;
  submitting only thirty days beforehand fails this requirement, making the submission untimely. The
  distractor claiming timeliness due to a conference exemption is wrong because the exemption
  pertains to the approval process, not the timing deadline.
