stem: A relocation company threatens to withhold an employee's relocation bonus unless the
  employee's agent pays a referral fee for referring a buyer to the agent. The agent has no prior
  relationship with the relocation company and no written contract. Under La. R.S. 37:1447(B), is
  this conduct unlawful?
options:
  - The relocation company's threat constitutes unlawful interference because reasonable cause for
    the referral fee does not exist.
  - The relocation company's threat is lawful because it concerns relocation benefits, not a
    referral fee.
  - The relocation company's threat is lawful unless the agent actually pays the referral fee.
  - The relocation company's threat is lawful because relocation companies are exempt from referral
    fee rules.
key: A
explanation: The statute makes it unlawful for a third party to threaten to withhold relocation
  benefits in order to obtain a referral fee when there is no reasonable cause for the fee.
  Therefore, the option stating that the relocation company's threat constitutes unlawful
  interference because reasonable cause for the referral fee does not exist is correct. The option
  claiming the threat is lawful because it concerns relocation benefits, not a referral fee, is
  incorrect because the law does not distinguish between types of benefits; any threat to withhold
  benefits to generate a referral fee without reasonable cause is prohibited. The option asserting
  the threat is lawful unless the agent actually pays the referral fee is incorrect because
  liability arises from the threat itself, not from actual payment; the threat is unlawful even if
  no fee is paid. The option arguing the threat is lawful because relocation companies are exempt
  from referral fee rules is incorrect because the statute does not exempt relocation companies; it
  applies to any third party.
