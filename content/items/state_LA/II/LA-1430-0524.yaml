stem: Under La. R.S. 37:1455, what must a licensee provide to the parties to a real estate
  transaction concerning agency disclosure?
options:
  - Providing a verbal explanation of the agency relationship and any potential conflicts of interest
  - Providing a signed contract that outlines the agreed-upon commission rate and fees, and any
    additional charges agreed upon in writing
  - Providing a written property disclosure form for residential sales and leases as required by
    state law
  - Providing an agency disclosure informational pamphlet and, where applicable, a dual agency
    disclosure form
key: D
explanation: The statute requires licensees to give each party an agency disclosure informational
  pamphlet and, where applicable, a dual agency disclosure form. This ensures parties understand the
  representation relationship. The most tempting distractor confuses agency disclosure with property
  disclosure, which is a separate requirement.
