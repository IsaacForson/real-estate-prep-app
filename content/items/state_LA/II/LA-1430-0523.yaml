stem: A licensee delivers the mold informational pamphlet that contains an error regarding mold
  hazards. The error was based on a report provided by the Louisiana Department of Health, and the
  licensee exercised ordinary care in obtaining and transmitting the report. According to La. R.S.
  37:1470(C)(2), is the licensee liable for the error?
options:
  - The licensee is liable because the licensee should have verified the report’s accuracy before
    distribution.
  - The licensee is not liable, but only if the licensee also provided a separate written disclaimer
    about the error.
  - The licensee is liable because any error in the pamphlet makes the licensee liable regardless of
    the source.
  - The licensee is not liable because the error was based on information from a public agency and
    the licensee exercised ordinary care.
key: D
explanation: Under subsection (C)(2), a licensee is not liable for errors based on information from
  a public agency when ordinary care is exercised. The distractor claiming liability for any error
  ignores this statutory exemption.
