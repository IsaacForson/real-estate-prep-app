stem: An applicant for experience credit assisted on an appraisal report but did not sign it and did
  not disclose their assistance. According to La. Admin. Code tit. 46, pt. LXVII, what is the effect
  on experience credit for that assignment?
options:
  - Full credit may be claimed as a co-signer on the report.
  - No credit will be granted if professional assistance was not disclosed.
  - The report must be submitted to the board for review.
  - Proportional credit may be requested based on contributor count.
key: B
explanation: The rule states that credit will not be granted if professional assistance was not
  disclosed. The distractor about requesting proportional credit only applies when the assistance is
  properly disclosed.
