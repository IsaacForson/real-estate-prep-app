stem: A nonresident real property appraiser licensed in another state wishes to obtain a Louisiana
  license. According to La. Admin. Code tit. 46, pt. LXVII, what must the applicant submit with the
  application?
options:
  - An endorsement letter from the supervising appraiser.
  - An irrevocable consent to service of process in this state.
  - An assurance bond amounting to ten thousand dollars.
  - An affidavit of continuing education completion from the prior year.
key: B
explanation: The rule requires a nonresident appraiser to submit an irrevocable consent to service
  of process in Louisiana along with the completed application and fees. The distractor about
  continuing education credits is not mentioned as a requirement for nonresident applicants.
