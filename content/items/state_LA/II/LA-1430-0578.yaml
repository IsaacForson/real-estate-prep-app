stem: Under La. R.S. 37:1460.1(C)(1)(a)(i), what information must a vendor submit to the executive
  director by electronic mail at **LEAST** forty‑five days prior to the planned date of a continuing
  education course?
options:
  - The date, location, and time the course will be provided
  - The course syllabus, instructor qualifications, and credit hours
  - The course title, number of credit hours, and instructor name
  - The vendor’s business license, tax ID, and contact phone number
key: A
explanation: The rule explicitly requires the vendor to submit the date, location, and time the
  course will be provided at least forty‑five days prior to the course. The distractor listing
  syllabus, qualifications, and credit hours is incorrect because those items are not mandated for
  the initial submission under this subsection.
