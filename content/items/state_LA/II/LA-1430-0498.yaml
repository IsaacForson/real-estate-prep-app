stem: A licensee’s unlicensed assistant helps prepare a purchase agreement and receives a gift card
  from the buyer for the assistance. According to La. R.S. 37:1459(D), may the assistant retain the
  gift card as compensation for the service rendered?
options:
  - No, because the commission may impose a civil penalty but does not affect the assistant’s right
    to keep the gift card.
  - No, because the assistant may keep the gift card if it is less than $100.
  - No, because the statute prohibits an unlicensed person from receiving compensation for real
    estate activity.
  - No, because the assistant can retain the gift card if the buyer agrees in writing.
key: C
explanation: The law provides that no person engaged in real estate activity without a currently
  valid license shall have the right to receive any compensation for services so rendered, so the
  assistant cannot keep the gift card.
