stem: A licensee delivers the mold informational pamphlet that contains an error regarding mold
  hazards. The error was not within the licensee's personal knowledge. According to La. R.S.
  37:1470(C)(1), is the licensee liable for the error?
options:
  - No, the licensee is not liable for the error.
  - Yes, the licensee is liable for the error.
  - No, the licensee is liable only if the error was known to the buyer.
  - Yes, the licensee is liable only if the error was intentional.
key: A
explanation: Under subsection C(1), the licensee is not held liable for errors in the pamphlet when
  the error was not within the licensee’s personal knowledge. Hence the licensee bears no liability
  in this situation. The option asserting liability ignores the personal‑knowledge exemption
  provided by the statute.
citation:
