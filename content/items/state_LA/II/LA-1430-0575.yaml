stem: A salesperson applicant passes the Louisiana real estate examination on March 1 but does not
  submit the Affidavit of Sponsorship Form to the commission until June 1 of the same year.
  According to La. Admin. Code tit. 46, pt. LXVII, what is the status of the applicant’s license?
options:
  - An inactive license is issued because the applicant failed to pay the required sponsorship fee.
  - An inactive license is issued because the affidavit was not received within 90 days.
  - An active license is issued because the affidavit was submitted within 90 days.
  - A temporary permit is granted because the affidavit was not received within 90 days.
key: B
explanation: If the Affidavit of Sponsorship Form is not received within the prescribed 90 days, an
  inactive license is issued and an active license will not be granted until the Transfer to Active
  Status Form is submitted. Since the affidavit was filed three months after the exam, the 90‑day
  window was missed.
citation:
  source: La. Admin. Code tit. 46, pt. LXVII — Louisiana Administrative Code Title 46, Part LXVII -
    Real Estate (LREC rules); Division of Administration docx, Internet Archive capture 2026-01-23
    §303(C)
  url: null
  quoted_text: If the Affidavit of Sponsorship Form (Part B) is not received within the prescribed 90
    days, an inactive license shall be issued to the salesperson applicant who shall then be subject
    to the Louisiana Real Estate License Law and the commission rules and regulations regarding
    inactive licensees. An active license shall not be issued until such time as the Transfer to
    Active Status Form prescribed by the commission is received.
