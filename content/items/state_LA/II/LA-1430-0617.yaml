stem: Under La. R.S. 37:1455(7), what is required of a licensee who receives a commission, rebate,
  or direct profit from a principal in a real estate transaction?
options:
  - Share it equally with the broker
  - Disclose it to the other party
  - Place it in an escrow account
  - Hide it from the other party
key: B
explanation: The statute declares it unlawful to accept, give, or charge any undisclosed commission,
  rebate, or direct profit; therefore the licensee must disclose such compensation. Keeping it
  confidential would violate the rule, while giving half to the commission or placing it in escrow
  are not required by the provision.
