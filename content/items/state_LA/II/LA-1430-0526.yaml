stem: A licensee receives a referral fee from a lender for arranging financing and does not disclose
  this compensation to the buyer or seller in writing. Under La. R.S. 37:1455, what is the
  consequence?
options:
  - The licensee is in violation because written disclosure of compensation from any source is
    required
  - The licensee is not in violation because referral fees are exempt from disclosure
  - The licensee is in violation only if the fee exceeds $500
  - The licensee is not in violation because the disclosure can be made verbally
key: A
explanation: The statute requires written disclosure to all parties of any compensation received
  from any source in connection with the transaction. Failure to do so is a violation. The
  distractor wrongly suggests that verbal disclosure suffices, which the rule does not allow.
