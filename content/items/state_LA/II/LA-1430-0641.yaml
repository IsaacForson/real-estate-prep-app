stem: Under La. R.S. 37:1460.1(C)(1)(c), what must a vendor submit regarding instructors for a
  continuing education course seeking approval?
options:
  - The qualifications of each instructor but not their names or contact info
  - The name and qualifications of the lead instructor only, excluding assistants
  - The brief summary of each instructor’s teaching experience and credentials
  - The name and qualifications of every instructor involved in conducting the course
key: D
explanation: La. R.S. 37:1460.1(C)(1)(c) requires vendors to submit the name and qualifications of
  every instructor involved in conducting the course. The option that limits disclosure to the lead
  instructor only and excludes assistants does not satisfy this requirement.
