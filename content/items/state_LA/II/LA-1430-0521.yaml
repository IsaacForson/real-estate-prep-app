stem: Under La. R.S. 37:1470(A)(1), by what date must the Louisiana Real Estate Commission approve
  the mold informational pamphlet?
options:
  - The commission must approve the pamphlet by January 1, 2005.
  - The commission must approve the pamphlet by April 1, 2004.
  - The commission must approve the pamphlet by July 1, 2004.
  - The commission must approve the pamphlet by October 1, 2003.
key: B
explanation: The statute requires the commission to approve the mold informational pamphlet by April
  1, 2004, as stated in subsection (A)(1). The distractor citing July 1, 2004 incorrectly uses the
  date when the pamphlet may first be distributed to buyers, not the approval deadline.
