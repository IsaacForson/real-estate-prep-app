stem: An individual has held an active real estate license for a total of four years, but only one
  of those years occurred immediately before submitting a broker license application. According to
  La. Admin. Code tit. 46, pt. LXVII, is the applicant eligible for a broker license?
options:
  - Yes, because the total active‑license period meets the four‑year requirement.
  - No, because fewer than two of the four years occurred immediately before the application.
  - Yes, because the applicant can substitute education hours for the missing experience.
  - No, because the applicant must have five years of active licensure.
key: B
explanation: The broker‑license applicant must have been licensed as an active real estate licensee
  for four years, with two of those four years occurring immediately before the application. Having
  only one recent year does not satisfy this requirement, even though the total equals four years.
