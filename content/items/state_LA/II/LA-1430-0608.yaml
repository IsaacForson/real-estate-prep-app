    Law, La. R.S. Title 37, Chapter 17 (LREC compilation, Aug. 2026) La. R.S. 37:1460.1(D)(2)
  url: null
  quoted_text: If a course described in Paragraph (A)(1) of this Section has not been approved for
    renewal before the expiration of the three-year time period, it shall not be acceptable for use
    as continuing education credit.
