stem: A vendor obtained approval three years ago for a continuing education course that prepares
  students for a National Association of REALTORS certification. The vendor did not seek renewal
  before the three‑year period ended. According to La. R.S. 37:1460.1(D)(2), may licensees earn
  continuing education credit for completing this course now?
options:
  - Licensees may not earn continuing education credit for the course.
  - Licensees may earn continuing education credit for the course.
  - Licensees may earn continuing education credit if the vendor renews the course.
  - Licensees may earn continuing education credit only if they retake the course.
key: A
explanation: Under La. R.S. 37:1460.1(D)(2), a course approved under Paragraph (A)(1) that has not
  been renewed before the three‑year expiration is not acceptable for continuing education credit.
  Thus licensees cannot earn CE credit from the course. The idea that renewal after expiration would
  restore eligibility is incorrect; renewal must occur before the expiration date.
citation:
