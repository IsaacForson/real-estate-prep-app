stem: A licensee delivers the mold informational pamphlet to a buyer two days after the parties sign
  a purchase agreement. According to La. R.S. 37:1470, is the licensee in compliance with the
  delivery timing requirement?
options:
  - The licensee is compliant because the pamphlet was delivered before closing.
  - The licensee is not compliant because delivery occurred after the contract was entered into.
  - The licensee is compliant as long as the buyer acknowledges receipt.
  - The licensee is not compliant unless the pamphlet includes an expert report.
key: B
explanation: The licensee is not compliant because La. R.S. 37:1470(A)(2) requires delivery at or
  before contract entry, and delivering after the contract violates this rule. The distractor
  claiming compliance due to pre‑closing delivery is wrong because the statute does not use closing
  as the timing benchmark.
citation:
