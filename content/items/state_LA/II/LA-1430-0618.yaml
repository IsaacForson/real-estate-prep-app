stem: A licensee representing a buyer accepts a rebate from the seller for closing costs incurred on
  the buyer’s behalf and does not inform the buyer of the rebate. According to La. R.S. 37:1455(7),
  is the licensee in violation?
options:
  - Yes, but only if the rebate is disclosed to the buyer in writing.
  - No, because the licensee may keep the rebate if it is placed in escrow.
  - Yes, because accepting an undisclosed rebate from a principal is prohibited.
  - No, because rebates from sellers are allowed when applied to closing costs.
key: C
explanation: The statute prohibits accepting any undisclosed rebate from a principal; failure to
  disclose makes the rebate undisclosed, thus a violation. The suggestion that rebates are allowed
  when used for closing costs contradicts the disclosure requirement.
