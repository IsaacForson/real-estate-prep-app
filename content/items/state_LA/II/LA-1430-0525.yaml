stem: A licensee represents both the buyer and seller in a residential transaction and provides the
  buyer with an agency disclosure pamphlet but does not give the seller any disclosure paperwork.
  According to La. R.S. 37:1455, is the licensee in violation?
options:
  - The licensee is not in violation because pamphlets are optional for residential transactions
  - The licensee is not in violation because the buyer received the pamphlet
  - The licensee is in violation because both parties must receive the agency disclosure pamphlet
  - The licensee is in violation only if dual agency is involved
key: C
explanation: The rule mandates that the licensee provide the pamphlet to all parties to the
  transaction. Omitting the seller violates this requirement. The distractor incorrectly assumes
  that giving the pamphlet to only one party satisfies the rule.
