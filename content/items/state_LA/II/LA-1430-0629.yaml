stem: According to La. R.S. 37:1470(A)(1), beginning what date may licensees distribute the mold
  informational pamphlet to buyers in connection with a real estate transaction?
options:
  - July 1, 2004.
  - April 1, 2004.
  - January 1, 2005.
  - October 1, 2004.
key: A
explanation: The statute states that the mold informational pamphlet may be distributed to buyers in
  connection with any real estate transaction entered into on or after July 1, 2004, making that the
  correct start date. The April 1, 2004 date refers to the commission’s approval deadline, not the
  distribution start date.
