stem: What document(s) must a licensee give to both parties in a residential real estate transaction
  under La. R.S. 37:1467?
options:
  - The licensee must provide an agency disclosure informational pamphlet and, where applicable, a
    dual agency disclosure form.
  - The licensee must provide an agency disclosure informational pamphlet only, with no dual agency
    disclosure form required.
  - The licensee must provide a dual agency disclosure form only, with no agency disclosure
    informational pamphlet required.
  - The licensee must provide no disclosure, as neither pamphlet is required for this transaction.
key: A
explanation: Under La. R.S. 37:1467(A), licensees shall provide the parties to a real estate
  transaction with an agency disclosure informational pamphlet and, where applicable, a dual agency
  disclosure form. The distractor omitting the dual agency form is incorrect because the form must
  be provided when applicable.
