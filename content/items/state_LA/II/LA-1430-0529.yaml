stem: A licensee's license is automatically revoked under La. R.S. 37:1463(G) after the commission
  pays a claim from the recovery fund to satisfy a judgment. The licensee subsequently receives a
  discharge in bankruptcy. According to La. R.S. 37:1463(G), what is the effect of the bankruptcy
  discharge on the license revocation?
options:
  - The bankruptcy discharge does not relieve the licensee from the penalties and disabilities.
  - The bankruptcy discharge automatically reinstates the license upon commission approval.
  - The bankruptcy discharge reduces the revocation period to six months before reapplication is
    allowed.
  - The bankruptcy discharge requires the licensee to pay administrative fines and renewal fees.
key: A
explanation: The statute expressly provides that a discharge of bankruptcy does not relieve a person
  from the penalties and disabilities imposed under this section. Therefore, the revocation remains
  in effect despite the bankruptcy discharge.
citation:
