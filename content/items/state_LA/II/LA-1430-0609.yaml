stem: A vendor changes the instructor for a continuing education course five days before the course
  is scheduled and submits the new instructor's name and qualifications to the executive director.
  According to La. R.S. 37:1460.1(F)(2), is the vendor compliant?
options:
  - The vendor is compliant because the instructor's qualifications were submitted.
  - The vendor is not compliant because the change was reported less than seven days prior.
  - The vendor is not compliant because the executive director was not notified.
  - The vendor is compliant because the change was reported before the course.
key: B
explanation: The rule requires the vendor to provide the new instructor's name and a statement of
  qualifications at least seven days prior to the course. Reporting the change only five days before
  fails to meet this timing requirement, making the vendor non‑compliant. Simply reporting the
  change before the course is insufficient; the seven‑day threshold is mandatory.
