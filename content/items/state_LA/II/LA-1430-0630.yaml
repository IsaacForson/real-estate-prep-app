stem: A licensee delivers the mold informational pamphlet to a buyer and also provides a verbal
  warning about mold observed in the basement. According to La. R.S. 37:1470(B), is the licensee
  required to provide any additional information concerning mold?
options:
  - Yes, the licensee must provide additional information concerning mold.
  - No, the licensee may provide additional information only if the buyer asks.
  - No, the licensee is not required to provide additional information concerning mold.
  - Yes, the licensee must also provide a written mold inspection report.
key: C
explanation: Subsection B provides that when the licensee delivers the pamphlet, no additional
  information concerning mold is required because the pamphlet is deemed adequate. Therefore the
  licensee is not obligated to give further details. The option stating that additional information
  must be provided incorrectly adds a duty that the statute removes.
