stem: Under La. R.S. 37:1470, when must a licensee deliver the mold informational pamphlet to a
  buyer in connection with a real estate transaction?
options:
  - The licensee shall deliver the pamphlet at or before the lease, rental agreement, or contract is
    entered into.
  - The licensee shall deliver the pamphlet only for properties constructed prior to 1990.
  - The licensee shall deliver the pamphlet after the contract is signed but before the closing date.
  - The licensee shall deliver the pamphlet only if the buyer specifically requests it.
key: A
explanation: The correct answer reflects the requirement in La. R.S. 37:1470(A)(2) that the pamphlet
  be delivered at or before the time a lease, rental agreement, or contract for sale is entered
  into. The distractor about delivery after contract signing but before closing is incorrect because
  the rule ties the timing to contract entry, not to closing.
citation:
  source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law) — Louisiana Real Estate License
