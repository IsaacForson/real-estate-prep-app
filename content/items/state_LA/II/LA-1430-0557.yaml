stem: Under La. R.S. 37:1460.1(D)(1), how long is a continuing education course approved under
  Paragraph (A)(1) valid for continuing education credit?
options:
  - One year from the date of approval or renewal.
  - Five years from the date of approval or renewal.
  - Two years from the date of approval or renewal.
  - Three years from the date of approval or renewal.
key: D
explanation: Under La. R.S. 37:1460.1(D)(1), an approved continuing education course remains valid
  for three years from the date of approval or renewal. Therefore, the option stating three years is
  correct. The options stating one year, two years, and five years are incorrect because the statute
  specifies a three‑year validity period.
