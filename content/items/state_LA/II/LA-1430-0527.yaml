stem: Under La. R.S. 37:1463(G), what is the effect on a licensee's license when the Louisiana Real
  Estate Commission pays a claim from the recovery fund to satisfy a judgment against the licensee?
options:
  - The licensee's license shall be automatically revoked.
  - The licensee's license shall be required to pay a fine.
  - The licensee's license shall be subject to discretionary suspension.
  - The licensee's license shall be placed on inactive status.
key: A
explanation: The statute states that upon payment of any amount from the recovery fund to satisfy a
  judgment, the license of the broker or salesperson is automatically revoked. A discretionary
  suspension is not authorized; the revocation is mandatory.
citation:
  source: § 1463. Payment from the fund, LA R.S. 37:1463(G)
  url: null
  quoted_text: Upon payment of any amount from the recovery fund in settlement of a claim in
    satisfaction of a judgment against a licensed broker or salesperson, the license of such broker
    or salesperson shall be automatically revoked.
