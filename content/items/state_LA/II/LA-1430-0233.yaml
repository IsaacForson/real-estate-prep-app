stem: A licensee places their Louisiana real estate license on inactive status and renews the
  license during the renewal period. According to La. R.S. 37:1466, is errors and omissions
  insurance required for this renewal?
options:
  - No, errors and omissions insurance is required only if the licensee is an active broker
  - No, errors and omissions insurance is required regardless of license status or activity
  - No, errors and omissions insurance is required only for property management licensees
  - No, errors and omissions insurance is not required for inactive license renewal or reinstatement
key: D
explanation: The statute explicitly states that active licensees applying for inactive status and
  those renewing while inactive may do so without the required coverage. Therefore, no E&O insurance
  is needed for an inactive renewal. The distractor suggesting coverage is required regardless of
  status contradicts the exemption for inactive licensees.
