stem: An appraisal management company licensee submits a renewal application that includes an
  inaccurate statement about the company's current address. According to La. Admin. Code tit. 46,
  pt. LXVII, what is the possible outcome?
options:
  - The licensee must pay a fine but the renewal will be processed.
  - The board may refuse to renew the license based on the false statement.
  - The renewal license will be automatically granted with a warning.
  - The licensee will receive a temporary license while the board investigates.
key: B
explanation: The rule states that a false statement of material fact on a renewal application may
  itself be grounds for refusal of the license. The option claiming the renewal will be processed
  despite the false statement is incorrect because the rule allows the board to refuse renewal on
  that basis.
