stem: A Louisiana salesperson offers to pay a valuable consideration to an unlicensed individual for
  conducting property showings that require a license. According to La. R.S. 37:1446(C), is the
  salesperson's action permissible?
options:
  - The salesperson's action is prohibited only if the individual actually performs the showings.
  - The salesperson's action is prohibited because salespersons may not pay valuable consideration
    for acts requiring a license.
  - The salesperson's action is permissible because the individual is not a licensee.
  - The salesperson's action is permissible if the payment is made after the showings are completed.
key: B
explanation: La. R.S. 37:1446(C) states that associate brokers, salespersons, and timeshare interest
  salespersons shall not pay or offer to pay any commission or valuable consideration for the
  performance of any act herein specified. Therefore, offering payment for unlicensed showings is
  prohibited regardless of when payment is made. The claim that permissibility depends on the
  individual's license status misreads the rule, which bans the payment itself.
