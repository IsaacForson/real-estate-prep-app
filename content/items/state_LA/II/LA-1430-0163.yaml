stem: Under La. R.S. 37:1439(B), what information must be included in a broker license issued to an
  individual, partnership, limited liability company, association, corporation, or other legal
  entity?
options:
  - The business name, street address, and mailing address only
  - The business name, street address, and license number only
  - The business name, street address, and mailing address if different
  - The business name, street address, mailing address, and license number only
key: C
explanation: The statute requires a broker license to include the business name, the street address
  of the business, and the mailing address of the business if it differs from the street address.
  The option that states the business name, street address, and mailing address if different matches
  this requirement exactly. The other options either add unnecessary elements like a license number
  or omit the conditional mailing address rule.
