stem: A licensee enters into a lease agreement for a warehouse on May 15, 2004, and provides the
  mold informational pamphlet to the tenant. According to La. R.S. 37:1470, is the licensee
  permitted to distribute the pamphlet for this transaction?
options:
  - The licensee is not permitted because the transaction is a lease rather than a sale.
  - The licensee is permitted to distribute the pamphlet to the tenant.
  - The licensee is not permitted because the commission had not yet approved the pamphlet.
  - The licensee is not permitted because distribution is allowed only for transactions on or after
    July 1, 2004.
key: D
explanation: The statute authorizes distribution of the mold informational pamphlet only in
  connection with real estate transactions entered into on or after July 1, 2004. A lease entered
  into on May 15, 2004, predates that date, so distribution is not permitted. The commission’s
  approval date (April 1, 2004) and the pamphlet’s applicability to leases do not override the July
  1, 2004 cutoff.
citation:
  source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law) — Louisiana Real Estate License
    Law, La. R.S. Title 37, Chapter 17 (LREC compilation, Aug. 2026) La. R.S. 37:1470
  url: null
  quoted_text: (1) By April 1, 2004, the commission shall, by rule, in accordance with the
    Administrative Procedure Act, approve a mold informational pamphlet, which may be distributed to
    buyers by licensees in connection with any real estate transaction entered into on or after July
    1, 2004.
