stem: Under La. R.S. 37:1467(A), what must a licensee provide to the parties to a real estate
  transaction?
options:
  - An agency disclosure pamphlet and, where applicable, a dual agency disclosure form
  - A written brokerage agreement signed by both parties
  - A copy of the licensee's errors and omissions insurance policy
  - A list of all properties the licensee has sold in the past year
key: A
explanation: The statute requires licensees to give parties an agency disclosure informational
  pamphlet and, when needed, a dual agency disclosure form. This matches the correct option. The
  distractor about a written brokerage agreement is incorrect because the section does not mandate
  such an agreement for disclosure purposes.
