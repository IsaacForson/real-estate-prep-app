stem: A licensee representing a seller client receives two offers on the same day. Under La. R.S.
  9:3893, what must the licensee do with those offers?
options:
  - present the offers to the client's attorney instead of the client
  - wait until the listing period ends to present any offer
  - timely present every offer to and from the client
  - present just the highest offer to the client
