stem: Under La. R.S. 37:1467(B), who has the authority to prescribe agency disclosure forms or
  pamphlets for use in Louisiana real estate transactions?
options:
  - The Louisiana Real Estate Commission
  - The Louisiana State Legislature
  - Individual brokerage firms
  - The American Association of Realtors
key: A
explanation: The statute grants the Louisiana Real Estate Commission the authority to prescribe
  agency disclosure forms or pamphlets as it deems necessary. The distractor attributing this power
  to the state legislature is incorrect because the legislature has not been given this rulemaking
  role in this section.
