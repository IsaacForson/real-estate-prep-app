stem: A licensee who is the custodian of client funds receives notice that the client has filed a
  voluntary bankruptcy petition. Under La. R.S. 37:1430–1470 § 1450(B), what must the licensee do?
options:
  - Notify the commission within ten days by registered or certified mail
  - Wait until the bankruptcy is discharged before notifying the commission
  - Inform only the client's attorney of the bankruptcy filing
  - Take no action regarding the bankruptcy filing
key: A
explanation: The rule requires the licensee to report the institution of bankruptcy proceedings to
  the commission in writing and by registered or certified mail or hand delivery within ten days.
  Waiting for discharge or informing only the attorney does not satisfy this duty. Taking no action
  is prohibited.
