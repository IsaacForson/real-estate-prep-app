stem: Under La. R.S. 9:3891, how is the term "customer" defined?
options:
  - A person who is being represented by a licensee in an immovable property transaction.
  - A person who obtains confidential information from a licensee during a brokerage agreement.
  - A person who is not being represented by a licensee but for whom the licensee is performing
    ministerial acts.
  - A person who engages the professional advice and services of a licensee as his agent.
key: C
explanation: The statute defines a customer as a person who is not being represented by a licensee
  but for whom the licensee is performing ministerial acts. This matches that description. The other
  options describe a client, a licensee's agent, or someone receiving confidential information,
  which are incorrect.
