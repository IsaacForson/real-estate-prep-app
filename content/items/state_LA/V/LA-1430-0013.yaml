stem: Under La. R.S. 9:3898, how may a subagency relationship be created between a broker and
  another broker?
options:
  - by a written agreement between the two brokers
  - by joint membership in a multiple listing service
  - by an oral understanding between the two brokers
  - automatically whenever a listing is co-marketed
key: A
explanation: The statute states that subagency can only be created by a written agreement, and that
  mere membership in a multiple listing service does not make a licensee a subagent.
