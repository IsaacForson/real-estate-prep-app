stem: A licensed real estate broker in Louisiana is asked to serve as the qualifying broker for two
  different LLCs. According to La. R.S. 37:1437.2, is this permissible?
options:
  - The prohibition against a broker serving as qualifying broker for more than one entity without
    commission approval
  - The condition that the LLCs must be under common ownership for multiple qualifying brokerages
  - The permission granted by the statute allowing an individual broker to serve as qualifying
    broker for more than one entity
  - The requirement of a special waiver from the commission for multiple qualifying brokerages
key: C
explanation: The statute allows an individual broker to serve as qualifying broker for more than one
  corporation, limited liability company, or partnership, so serving two LLCs is permissible without
  additional approval. The distractor claiming a prohibition is incorrect because the law explicitly
  authorizes multiple qualifying brokerages.
