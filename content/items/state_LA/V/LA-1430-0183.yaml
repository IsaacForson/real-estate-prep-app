stem: A Louisiana buyer seeks to lease a home with the assistance of a licensee. Under La. R.S.
  37:1448.4(B)(1), is a buyer agreement required?
options:
  - A buyer agreement is not required only for leases under one year in duration
  - A buyer agreement is required for all real estate transactions involving a licensee
  - A buyer agreement is not required for home lease transactions under this section
  - A buyer agreement is required unless the buyer compensates the broker directly
key: C
explanation: The statute explicitly states that this section does not apply when a person leases or
  seeks to lease a home with the services of a real estate licensee. Therefore, no buyer agreement
  is required for a home lease transaction. The most tempting distractor, that a buyer agreement is
  required for all transactions involving a licensee, overlooks this specific exemption for home
  leases.
