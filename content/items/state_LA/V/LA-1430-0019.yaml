stem: In a disclosed dual agency, one client refuses to consent to the arrangement. If the licensee
  withdraws from representing that client, what happens to the licensee's representation of the
  other client under La. R.S. 9:3897?
options:
  - the licensee also withdraws from representing the other client
  - the licensee refers both clients to an entirely different brokerage firm
  - the licensee may continue representing the other client in the deal
  - the licensee converts the other client into a paying customer
key: C
explanation: The statute provides that a licensee may withdraw without liability from representing a
  client who has not consented to a disclosed dual agency, and that withdrawal does not prejudice
  the licensee's ability to continue representing the other client in the transaction.
citation:
  source: La. R.S. 9:3897 (§ 3897)
  url: null
  quoted_text: |-
    a licensee may without liability withdraw from representing a
    client who has not consented to a disclosed dual agency. The withdrawal shall not
    prejudice the ability of the licensee to continue to represent the other client in the
    transaction
