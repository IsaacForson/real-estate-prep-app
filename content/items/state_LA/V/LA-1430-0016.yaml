stem: A licensee representing a seller answers a walk-in customer's questions about the listed
  property's features. Under La. R.S. 9:3894, what is the legal effect of performing these
  ministerial acts for the customer?
options:
  - a brokerage agreement is formed with the customer
  - the existing brokerage agreement with the seller is voided
  - the licensee becomes a dual agent for the seller and customer
  - no brokerage agreement is formed with the customer
key: D
explanation: The statute states that performing ministerial acts for a customer shall not be
  construed in a manner that forms a brokerage agreement with that customer.
