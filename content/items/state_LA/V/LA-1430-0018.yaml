stem: A buyer client discloses financial details to a licensee, who later passes those details to a
  customer on the other side of the deal without the buyer's permission. Under La. R.S. 9:3897, is
  this disclosure permitted for a dual agent?
options:
  - yes, because financial details are not treated as confidential
  - no, confidential information cannot be shared without that client's consent
  - yes, because dual agents may freely share information between both clients today
  - yes, as long as the disclosure happens after the closing
key: B
explanation: The statute states that a dual agent shall not disclose confidential information that
  the licensee may know about either client without that client's permission.
