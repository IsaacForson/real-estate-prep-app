stem: A licensee delivers the mold informational pamphlet to the buyer three days after the parties
  sign a purchase agreement. Under La. R.S. 37:1430–1470 § 1470(A)(2), is the licensee’s delivery
  timing compliant?
options:
  - The licensee’s delivery is compliant because the buyer received the pamphlet before moving in
  - The licensee’s delivery is compliant because the licensee acted in good faith
  - The licensee’s delivery is noncompliant because the pamphlet was delivered after the contract
    was entered into
  - The licensee’s delivery is compliant because the pamphlet was delivered before closing
key: C
explanation: The statute requires the pamphlet be delivered at or before the time a lease, rental
  agreement, or contract for sale is entered into. Delivering it after the contract is signed
  violates this timing requirement. Therefore, the delivery is noncompliant.
