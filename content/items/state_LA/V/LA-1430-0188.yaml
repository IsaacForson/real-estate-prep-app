stem: A broker terminates the sponsorship of a salesperson. Under La. R.S. 37:1441(A)(1), what must
  the terminating party do within five calendar days of such termination?
options:
  - Submit a termination form to the commission
  - Pay a termination fee to the commission promptly
  - Notify the salesperson in writing of termination
  - Return the salesperson's license to the commission
key: A
explanation: The statute requires the terminating party to submit a form attesting to the
  termination to the commission within five calendar days. It does not require immediate return of
  the license, notification to the salesperson, or payment of a fee. The distractor about returning
  the license is incorrect because the license ceases to be in force upon submission of the form,
  not upon its return.
citation:
  source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law); La. Admin. Code tit. 46, pt.
    LXVII (Real Estate)) § 1441(A)(1)
  url: null
  quoted_text: When the sponsorship of an associate broker or salesperson is terminated for any
    reason, the terminating party shall submit a form attesting to the termination to the
    commission, within five calendar days of such termination.
