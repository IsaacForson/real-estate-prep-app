stem: A licensee works with a buyer but signs no written agreement describing the relationship and
  performs more than ministerial acts for the buyer. Under La. R.S. 9:3892, what relationship is
  presumed to exist?
options:
  - the licensee is a subagent of the listing broker
  - the licensee is the buyer's designated agent
  - the licensee is a customer of the buyer
  - the licensee is a dual agent for the buyer and seller
key: B
explanation: The statute provides that a licensee engaged in a real estate transaction is considered
  to represent the person he is working with as a designated agent unless a written agreement states
  a different relationship or the licensee performs only ministerial acts.
citation:
  source: La. R.S. 9:3892 (§ 3892)
  url: null
  quoted_text: |-
    a licensee engaged in any real estate transaction shall be considered
    to be representing the person with whom he is working as a designated agent unless
    there is a written agreement between the broker and the person providing that there is
    a different relationship
