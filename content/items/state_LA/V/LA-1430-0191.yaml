stem: A licensee who holds client funds in a trust account receives notice that the client has filed
  a voluntary bankruptcy petition. Under La. R.S. 37:1450, what must the licensee do?
options:
  - The licensee must report the bankruptcy to the commission in writing by registered or certified
    mail or hand delivery within ten days.
  - The licensee must report the bankruptcy to the commission in writing by registered or certified
    mail or hand delivery within thirty days.
  - The licensee must report the bankruptcy to the commission if the bankruptcy is involuntary.
  - The licensee must refrain from reporting the bankruptcy to the commission because bankruptcy
    proceedings are not reportable.
key: A
explanation: The statute requires a licensee who holds client funds to report any bankruptcy
  proceeding—voluntary or involuntary—to the commission in writing by registered or certified mail
  or hand delivery within ten days of the filing. The option that sets a thirty‑day deadline is
  incorrect because the law specifies ten days. The option that limits the duty to involuntary
  bankruptcies is incorrect because the requirement applies to both voluntary and involuntary cases.
  The option that says no report is needed contradicts the explicit duty to report.
citation:
  source: La. R.S. 37:1430–1470 § 1450
  url: null
  quoted_text: It shall be the duty of every licensee, registrant, and certificate holder who is the
    custodian of client funds to report the institution of bankruptcy proceedings to the commission,
    in writing and by registered or certified mail or hand delivery within ten days of institution
    of such proceedings.
