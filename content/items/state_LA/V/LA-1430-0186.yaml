stem: A licensee representing a buyer client fails to obtain a property inspection before advising
  the client to make an offer. Under La. R.S. 9:3893(A)(3), has the licensee breached a duty to the
  client?
options:
  - No, because the licensee is only required to present offers timely.
  - Yes, because the licensee failed to exercise reasonable skill and care.
  - Yes, because the licensee violated the confidentiality requirement.
  - No, because the licensee’s duty is limited to accounting for funds.
key: B
explanation: The licensee must exercise reasonable skill and care in performing brokerage services.
  Failing to obtain a property inspection before advising an offer constitutes a lack of reasonable
  skill and care, thus breaching the duty. The distractors cite other duties (presenting offers,
  accounting, confidentiality) that are not the specific duty at issue.
