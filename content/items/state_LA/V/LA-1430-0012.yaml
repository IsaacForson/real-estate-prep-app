stem: Under La. R.S. 9:3891, what does the term "confidential information" cover regarding a client
  during a brokerage agreement?
options:
  - any information about the physical condition of the property
  - the client's name and mailing address on file with the broker
  - information the client already shared with the other party's agent
  - information a client made confidential that could harm the client
key: D
explanation: The statute defines confidential information as information obtained from a client that
  was made confidential by written request or instruction, or whose disclosure could materially harm
  the client's position.
citation:
  source: La. R.S. 9:3891 (§ 3891)
  url: null
  quoted_text: |-
    "Confidential information" means information obtained by a licensee from a
    client during the term of a brokerage agreement that was made confidential by the
    written request or written instruction of the client or is information the disclosure of
    which could materially harm the position of the client
