stem: A brokerage agreement between a broker and a client has just expired. Under La. R.S. 9:3895,
  which duties, if any, continue after that expiration?
options:
  - accounting for money and property, plus confidentiality
  - no duties continue once the agreement has expired
  - the duty to continue marketing the property for a year
  - the duty to renegotiate the agreement on identical terms today
key: A
explanation: The statute provides that after expiration of the brokerage agreement, the broker and
  affiliated licensee still must account for all monies and property relating to the transaction and
  keep confidential information confidential.
citation:
  source: La. R.S. 9:3895 (§ 3895)
  url: null
  quoted_text: |-
    neither a broker nor any licensee affiliated with the broker owes any further duties to
    the client after termination, expiration, or completion of performance of the brokerage
    agreement, except to account for all monies and property relating to the transaction and
    to keep confidential all confidential information received during the course of the
    brokerage agreement
