stem: A broker renews her license on time but forgets to attach the continuing education
  certification. What does Colorado law require the commission to do with the renewal application?
options:
  - The commission will accept the application and waive the CE requirement for that cycle
  - The commission will place the application on hold until the broker completes additional education
  - The commission will reject the application because the certification is missing
  - The commission will process the renewal and notify the broker to submit the certification within
    30 days
key: C
explanation: Colorado law requires that the continuing‑education certification be submitted with the
  renewal application. When the certification is missing, the application is considered incomplete
  and must be rejected (Colo. Rev. Stat. § 12-10-212(4)(a)(II)). The answer stating that the
  commission will place the application on hold until additional education is completed is incorrect
  because the statute provides no grace period or hold provision.
citation:
  source: Colo. Rev. Stat. § 12-10-212(4)(a)(II)
  url: null
  quoted_text: For persons renewing or reinstating an active license, written certification verifying
    completion for the previous licensing period of the continuing education requirements set forth
    in section 12-10-213 must accompany and be submitted to the commission with the application for
    renewal or reinstatement.
