stem: Under Colorado law, if a buyer or tenant refuses to sign the required disclosure
  acknowledgment, what action must the broker take?
options:
  - File a complaint with the real estate commission regarding the refusal
  - Obtain a written waiver from the buyer or tenant before proceeding
  - Note the refusal on a copy of the disclosure and retain that copy
  - Return the disclosure to the buyer or tenant and mark it unsigned
key: C
explanation: The rule requires the broker to note the refusal on a copy of the disclosure and retain
  that copy when the buyer or tenant does not sign. Returning the disclosure or seeking a waiver is
  not mandated by the statute.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-201(2)(c)(II)
  url: null
  quoted_text: If the buyer or tenant does not sign the disclosure, the broker shall note that fact on
    a copy of the disclosure and retain the copy.
