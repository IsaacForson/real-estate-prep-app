stem: A broker whose license expired eight months ago submits a reinstatement application but does
  not include any continuing education documentation. According to Colorado statute, what is the
  likely outcome?
options:
  - The application will be denied because written certification of continuing education completion
    must accompany the reinstatement application
  - The application will be accepted after payment of the standard reinstatement fee only as
    required by rule
  - The application will be accepted if the broker provides a letter of explanation for the missing
    documents to the commission
  - The application will be placed on hold pending completion of a new continuing education course
    within the required timeframe
key: A
explanation: A broker whose license has expired must include written certification of continuing
  education completion when applying for reinstatement; failure to provide this documentation
  results in denial of the application. (Colo. Rev. Stat. § 12-10-212(4)(a)(II))
