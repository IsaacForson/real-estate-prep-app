stem: Under Colo. Rev. Stat. § 12-10-224, what may the commission, the director, or an
  administrative law judge issue in connection with an investigation or hearing?
options:
  - A subpoena compelling attendance of witnesses and production of records and documents
  - A notice of hearing scheduled before the administrative law judge
  - A cease-and-desist order prohibiting further violations of the license law
  - A letter of admonition sent via certified mail to the licensee
key: A
explanation: The statute explicitly authorizes the commission, director, or administrative law judge
  to issue a subpoena compelling attendance and production of records. A cease‑and‑desist order,
  letter of admonition, or notice of hearing are not provided for in this section.
