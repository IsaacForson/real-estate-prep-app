stem: An applicant has completed forty‑eight hours of real estate law and practice, forty‑eight
  hours of understanding and preparation of Colorado real estate contracts, and seventy‑two hours of
  instruction in real estate closings, current legal issues, and practical applications (with no
  hours in trust accounts and record keeping). Does this applicant satisfy the broker license
  education requirement?
options:
  - No, because trust accounts and record keeping must be completed separately.
  - No, because the applicant still needs additional hours of law and practice.
  - Yes, because the rule only requires a total of seventy‑two hours from the listed areas.
  - No, because the seventy‑two hours must include at least twenty‑four hours of trust accounts.
key: C
explanation: The statute requires a total of seventy‑two hours from the listed areas; it does not
  mandate a specific amount in each subarea, so completing the hours in closings, legal issues, and
  practical applications satisfies the requirement. The distractor that insists on a separate
  trust‑accounts component misreads the rule.
