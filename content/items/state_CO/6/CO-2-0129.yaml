stem: A witness refuses to obey a subpoena issued by the commission to produce trust account
  records. What may the commission do next under Colo. Rev. Stat. § 12-10-224?
options:
  - Petition the district court for issuance of a subpoena
  - Issue a letter of admonition for refusing to comply
  - Impose an administrative fine for contempt of subpoena
  - Revoke the witness's real estate license for noncompliance
key: A
explanation: The statute allows the commission to petition the district court for issuance of a
  subpoena when a person refuses to obey one. Imposing a fine, revoking a license, or issuing a
  letter of admonition are not authorized actions in this section.
citation:
  source: Colo. Rev. Stat. § 12-10-224
  url: null
  quoted_text: If a person fails or refuses to obey a subpoena issued by the commission, the director,
    or the appointed administrative law judge, the commission may petition the district court having
    jurisdiction for issuance of a subpoena in the premises, and the court shall, in a proper case,
    issue its subpoena.
