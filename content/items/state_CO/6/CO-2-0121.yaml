stem: Under Colorado law, what must a broker submit with the application for license renewal?
options:
  - A certified statement verifying successful completion of continuing education courses
  - A copy of the broker's sales logs for the past year submitted to the commission
  - A letter of recommendation from the employing broker submitted with the renewal application
  - A notarized affidavit of no disciplinary actions filed with the division of real estate
key: A
explanation: The rule requires a broker applying for renewal to include a certified statement
  verifying successful completion of real estate courses (Colo. Rev. Stat. § 12‑10‑213(1)). That
  description matches the correct answer. The other answer choices describe requirements—sales logs,
  a recommendation letter, or a notarized affidavit of no disciplinary actions—that the statute does
  not mandate for renewal.
