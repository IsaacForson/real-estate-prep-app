stem: A broker receives an earnest money deposit from a buyer during a purchase agreement that later
  fails to close. After the engagement ends, what duty does the broker have regarding that deposit
  under Colorado law?
options:
  - Account for all money and property received during the engagement
  - Return the earnest money to the buyer immediately upon termination
  - Keep the earnest money as compensation for services rendered
  - Deposit the earnest money into the broker's personal account
key: A
explanation: The statute requires the broker to account for all money and property related to and
  received during the engagement after termination. Simply returning, keeping, or depositing the
  money personally does not satisfy this accounting duty.
