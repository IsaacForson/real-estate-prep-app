stem: An applicant has completed forty‑eight hours of real estate law and practice, forty‑eight
  hours of understanding and preparation of Colorado real estate contracts, and sixty hours of
  instruction in the areas of trust accounts and record keeping, real estate closings, current legal
  issues, and practical applications. How many additional hours from those listed areas must the
  applicant complete to satisfy the broker license education requirement?
options:
  - 18 hours
  - 12 hours
  - 24 hours
  - 6 hours
key: B
explanation: The rule demands a total of seventy‑two hours from the listed areas; subtracting the
  sixty hours already completed leaves twelve hours needed. The six‑hour distractor results from
  mistakenly subtracting the forty‑eight‑hour law‑and‑practice requirement instead of the list
  requirement.
