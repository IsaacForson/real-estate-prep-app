stem: A Colorado broker includes a clause in a broker engagement contract that purports to create a
  recordable lien on the residential property. What is the legal effect of that clause under
  Colorado law?
options:
  - The lien is enforceable only if the broker records it with the county clerk.
  - The lien becomes valid after the broker obtains the client’s written consent.
  - The lien is void and unenforceable, regardless of whether it is recorded or consented to.
  - The lien may be enforced if the broker provides consideration to the client.
key: C
explanation: The statute expressly states that any lien, encumbrance, or other real property
  security interest in a broker engagement contract is void and unenforceable. The distractor
  suggesting the lien is enforceable only if recorded is wrong because the void status applies
  irrespective of recording or consent.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
