stem: A broker who was not licensed before December 31, 1996 wishes to employ another broker but has
  not completed any brokerage administration instruction. According to Colorado law, what must the
  broker do before employing another broker?
options:
  - Pass the broker examination on behalf of a partnership, fulfilling all state-mandated testing
    requirements
  - Serve actively as a licensed real estate broker for at least two years, maintaining active
    status with the division
  - Obtain a temporary license from the director after meeting all provisional licensing criteria
    established by the commission
  - Complete twenty-four clock hours of brokerage administration instruction approved by the
    commission
key: D
explanation: The statute prohibits such a broker from employing another broker without first
  completing twenty-four clock hours of instruction in brokerage administration. The other options
  pertain to independent practice, partnership licensing, or temporary licenses, which do not
  satisfy the employment requirement.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-201(c)(II)
  url: null
  quoted_text: |-
    No such broker shall employ another broker without first having completed twenty-
    four clock hours of instruction, or the equivalent in correspondence hours, as
    approved by the commission, in brokerage administration
