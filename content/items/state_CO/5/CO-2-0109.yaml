stem: For a broker who did **NOT** hold a current and valid broker’s license on December 31, 1996,
  what is required before engaging in an independent brokerage practice?
options:
  - Completion of twenty-four clock hours of brokerage administration instruction
  - Active service as a real estate broker for at least two years
  - Passing the broker examination on behalf of a partnership
  - Designation as a qualified, active broker by a corporation
key: B
explanation: The statute states that such a broker shall not engage in an independent brokerage
  practice without first having served actively as a real estate broker for at least two years. The
  other options describe requirements for employing another broker, partnership licensing, or
  designation, which are not the condition for independent practice.
