stem: A broker's engagement agreement with a buyer does not set an expiration date and is never
  terminated or completed. Under Colorado law, when does the relationship end?
options:
  - Thirty days after the buyer stops responding
  - One year after the date of the engagement
  - One calendar year after the closing date
  - Six months after the agreement was signed
key: B
explanation: When an engagement agreement is not performed, completed, or otherwise terminated, the
  relationship ends at the earliest of an agreed expiration date, a termination by the parties, or
  one year after the engagement date.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-409
  url: null
  quoted_text: (I) Any date of expiration agreed upon by the parties; (II) Any termination or
    relinquishment of the relationship by the parties; or (III) One year after the date of the
    engagement.
