stem: What must an Attorney Form used by a Colorado real estate broker state on its face?
options:
  - That the form was filed with the Division of Real Estate
  - That the form supersedes any Commission-Approved Form
  - That the form has not been approved by the Commission
  - That the form was reviewed by the listing brokerage firm
key: C
explanation: Rule 7.1.B requires an Attorney Form to contain language stating that the form has not
  been approved by the Colorado Real Estate Commission, along with the names of the preparing
  attorney and the broker.
citation:
  source: 4 CCR 725-1, Rule 7.1.B
  url: null
  quoted_text: "The form must contain the language that says: “This form has not been approved by the
    Colorado Real Estate Commission”. The form must also include: the name of the attorney or law
    firm that prepared the Attorney Form and the name of the Broker, Employing Broker, or the
    Brokerage Firm for whom the form was prepared."
