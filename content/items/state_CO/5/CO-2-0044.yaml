stem: A broker wishes to hire another broker to work under them. Under Colorado law, what must be
  true for the hiring broker to be considered an 'employing broker'?
options:
  - Being recorded as the broker who sponsors the other broker's license
  - Being shown in commission records as employing or engaging another broker
  - Being listed as the sponsoring broker on the other broker's license application
  - Being named as the supervising broker in the office's policy manual
key: B
explanation: The statute defines an employing broker as a broker who is shown in commission records
  as employing or engaging another broker. A written contract, payment of salary or commission, or
  length of licensure are not part of this definition.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-201(2), C.R.S.
  url: null
  quoted_text: “Employing real estate broker” or “employing broker” means a broker who is shown in
    commission records as employing or engaging another broker
