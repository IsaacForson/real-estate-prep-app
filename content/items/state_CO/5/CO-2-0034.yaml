stem: A broker intends to use a Colorado Bar Association Form for a residential purchase transaction
  in which a Commission-Approved Form is available and suitable for the deal. Under Colorado rule,
  what is the broker permitted to do?
options:
  - The broker may not use the Colorado Bar Association Form and must instead use the
    Commission-Approved Form.
  - The broker may use the Colorado Bar Association Form as long as the parties agree to its use.
  - The broker may modify the Colorado Bar Association Form to include additional clauses before use.
  - The broker may submit the Colorado Bar Association Form to the Commission for prior approval.
key: A
explanation: Under the rule, a broker may only use a Colorado Bar Association Form when a
  Commission-Approved Form does not exist or is not appropriate for the transaction. Since a
  suitable Commission-Approved Form is available, using the Colorado Bar Association Form is not
  permitted. The suggestion that party agreement allows use of the Colorado Bar Association Form is
  incorrect, as the rule does not permit override by mutual consent. Modifying the form or seeking
  prior approval from the Commission are also not allowed under this provision.
