stem: A license applicant has a prior misdemeanor conviction. What may the applicant do before
  completing the licensing requirements?
options:
  - Requesting a preliminary advisory opinion from the Commission
  - Delaying application for two years after conviction
  - Disclosing the conviction to the employing broker before licensure
  - Undertaking additional continuing education courses before application
key: A
explanation: The statute allows applicants with a past civil judgment or criminal conviction to
  request a preliminary advisory opinion regarding the likelihood of receiving a license before
  finishing the application requirements. Waiting two years applies to reciprocity recognition, not
  to conviction disclosures, and the other actions are not specified as permissible pre‑application
  steps.
