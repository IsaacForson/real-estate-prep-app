stem: A broker passes the real estate examination on June 1, 2024, but does not submit the
  application for licensure until June 15, 2025. What is the result under Colorado law?
options:
  - The application is accepted with a late fee and must be processed.
  - The examination is automatically cancelled and the passing score is terminated.
  - The broker must retake only the national portion of the examination.
  - The broker may still be licensed if they pay a penalty to the commission.
key: B
explanation: The statute provides that failure to file the appropriate broker’s application within
  one year of passing the examination automatically cancels the examination and terminates all
  rights to a passing score. Since the application was filed after one year, the examination is
  cancelled and the passing score terminated.
