stem: According to Colorado statute, which of the following activities is included in the definition
  of 'real estate broker'?
options:
  - Managing a real estate investment trust
  - Providing legal advice on real estate transactions
  - Conducting property tax assessments for a fee
  - Negotiating the purchase, sale, or exchange of real estate
key: D
explanation: The statute defines a real estate broker as anyone who, for compensation, negotiates
  the purchase, sale, or exchange of real estate or interests therein. Therefore, negotiating the
  purchase, sale, or exchange of real estate is expressly included. Conducting property tax
  assessments, providing legal advice, and managing a real estate investment trust are not listed as
  brokerage activities under this definition.
