stem: A designated broker represents a seller as a single agent and wants to cooperate with an
  unrelated brokerage on a showing. Under Colorado law, what is the designated broker permitted to
  do?
options:
  - Cooperate with the other broker without creating a subagency
  - Cooperate with the other broker by first creating a subagency
  - Delegate the seller relationship to the cooperating broker
  - Refuse to cooperate with brokers outside the firm
key: A
explanation: A designated broker acting as a seller's agent may cooperate with other brokers but may
  not engage or create any subagents, so cooperation must occur without forming a subagency
  relationship.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-404
  url: null
  quoted_text: A designated broker acting as a seller’s or landlord’s agent may cooperate with other
    brokers but may not engage or create any subagents.
