stem: The parties negotiate the removal of a paragraph from a Commission-Approved Contract to Buy
  and Sell Real Estate. How must the broker make this deletion on the printed form?
options:
  - White out the deleted portion so it cannot be read
  - Retype the entire form without the deleted portion
  - Cut the deleted paragraph out of the printed page
  - Strike through the deleted text in a legible way
key: D
explanation: Rule 7.2.C requires that any deletion resulting from negotiation be made directly on
  the printed body of the form by striking through the deleted portion in a legible manner that does
  not obscure the deletion.
citation:
  source: 4 CCR 725-1, Rule 7.2.C
  url: null
  quoted_text: Any deletion or modification to the printed body of a Commission- Approved Form must
    result from negotiations or the instruction(s) of a party to the transaction. Any deletion must
    be made directly on the printed body of the form by striking through the deleted portion in a
    legible manner that does not obscure the deletion that has been made.
