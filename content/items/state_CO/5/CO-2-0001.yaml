stem: Which provision is a broker engagement contract for a residential premises prohibited from
  including under Colorado law?
options:
  - A clause stating the term of the engagement period
  - A clause creating a lien against the property
  - A clause naming the brokerage firm as escrow holder
  - A clause describing the broker's marketing duties
key: B
explanation: The statute states that a broker engagement contract must not purport to create a
  recordable lien, encumbrance, or other real property security interest, and any such interest is
  void and unenforceable.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-403.5
  url: null
  quoted_text: Purport to create a recordable lien, encumbrance, or other real property security
    interest. Any such lien, encumbrance, or other real property security interest is void and
    unenforceable.
