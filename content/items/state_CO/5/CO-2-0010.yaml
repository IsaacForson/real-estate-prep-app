stem: A broker who is not a principal party to a transaction wants to add language to a Standard
  Form. Which addition is consistent with Rule 7.4.B?
options:
  - An exculpatory clause favoring the broker's brokerage firm
  - A provision limiting the broker's own duties to the client
  - Commission language negotiated by the principal parties
  - A personal disclaimer shielding the broker from liability
key: C
explanation: Rule 7.4.B bars a nonparty broker from inserting personal disclaimers or exculpatory
  language into a Standard Form, but allows commission payment language when it is a term negotiated
  between the principal parties themselves.
citation:
  source: 4 CCR 725-1, Rule 7.4.B
  url: null
  quoted_text: A Broker who is not a principal party to the contract may not have personal provisions,
    personal disclaimers, or exculpatory language in favor of the Broker, Employing Broker, or
    Brokerage Firm inserted into a Standard Form. A Broker may, at the direction of a principal
    party, include language regarding the payment of the Broker’s or Brokerage Firm’s commission if
    this is a negotiated term between the principal parties of the Commission- Approved “Contract to
    Buy and Sell Real Estate” Form.
