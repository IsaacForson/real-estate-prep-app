stem: Under Colorado law, what must accompany each application for licensure?
options:
  - The proper fee shall accompany each application for licensure.
  - A written certification of continuing education must accompany each application for licensure.
  - A background check must be submitted with each application for licensure.
  - A letter of recommendation from a sponsoring broker must accompany each application for
    licensure.
key: A
explanation: Under Colorado law, the proper fee must accompany each application for licensure (Colo.
  Rev. Stat. § 12-10-212(2)). The other options describe a written certification of continuing
  education, a background check, or a letter of recommendation from a sponsoring broker, none of
  which are required by this statute for the initial application.
