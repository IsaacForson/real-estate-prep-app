stem: A homebuilder requires a buyer to use the homebuilder's own purchase contract instead of a
  Commission-Approved Form. What must the buyer's broker do before the buyer signs?
options:
  - Send the buyer written advice to seek legal counsel first
  - Ask the homebuilder to switch to a Commission-Approved form
  - Refuse to represent the buyer in the transaction
  - Retype the contract using Commission-Approved form language
key: A
explanation: Because a non-Commission-approved purchase contract carries potential for significant
  financial harm, Rule 7.5 requires the broker to send the consumer a written communication advising
  the consumer to seek legal advice from a licensed attorney before signing.
