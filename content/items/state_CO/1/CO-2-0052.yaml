stem: A written complaint alleging a potential license law violation is filed against a Colorado
  real estate broker. What must the Division of Real Estate do upon receiving the complaint?
options:
  - Dismiss the complaint without review
  - Investigate the complaint
  - Await a preliminary advisory opinion
  - Forward the complaint to the district attorney
key: B
explanation: The statute provides that if a written complaint alleging a potential license law
  violation is filed, the office is compelled to investigate. Thus, the Division must investigate
  the complaint. The distractor "Dismiss the complaint without review" is contrary to the mandatory
  investigation requirement.
