stem: What must an applicant for a Colorado real estate broker license submit before submitting the
  license application?
options:
  - A copy of a college diploma in real estate accompanied by transcripts of completed coursework
    and a letter of recommendation
  - A set of fingerprints submitted to the Colorado Bureau of Investigation for a state and national
    fingerprint-based criminal history record check
  - A name-based judicial record check obtained from the district court where the arrest occurred
    and signed by the presiding judge
  - A surety bond posted with the Colorado Real Estate Commission in the amount of ten thousand
    dollars
key: B
explanation: The statute requires each applicant to submit a set of fingerprints to the Colorado
  Bureau of Investigation for a state and national fingerprint-based criminal history record check
  before applying. The diploma option is incorrect because education proof is required later in the
  application process, not as a pre‑submission fingerprint requirement.
