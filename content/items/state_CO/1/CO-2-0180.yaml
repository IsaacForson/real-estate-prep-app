stem: An applicant for a Colorado real estate broker license who has no criminal history must still
  submit fingerprints. According to Colorado statute, what is the purpose of this fingerprinting?
options:
  - To satisfy the statutory mandate for truthfulness, honesty, good moral character, and general
    fitness
  - To verify the applicant’s employment history and confirm they have stable work experience in
    real estate
  - To check for any outstanding traffic violations and verify the applicant’s driving record is
    clear
  - To confirm the applicant’s educational qualifications and verify they finished state‑approved
    pre‑licensing education
key: A
explanation: The statute requires fingerprinting to safeguard the mandate for truthfulness, honesty,
  good moral character, and general fitness. The other options describe purposes not mentioned in
  the law.
