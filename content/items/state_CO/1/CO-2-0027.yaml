stem: For a partnership seeking a Colorado real estate broker license, which individual must submit
  the required fingerprints?
options:
  - The person designated to act as broker for the partnership
  - The managing partner with the largest ownership interest
  - The partnership's attorney-in-fact acting under a power of attorney
  - The partnership's accountant who handles financial records
key: A
explanation: The statute defines 'applicant' as an individual, or any person designated to act as
  broker for any partnership, limited liability company, or corporation pursuant to subsection (6).
  Therefore, the designated broker‑designate must submit fingerprints. The managing partner is not
  automatically the designated broker unless so appointed.
