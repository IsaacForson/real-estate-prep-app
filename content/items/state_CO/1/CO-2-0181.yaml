    Real Estate) § 12-10-201(6)(a)(VII)
  url: null
  quoted_text: (VII) Buying, selling, offering to buy or sell, or otherwise dealing in options on real
    estate, or interest therein, or improvements affixed thereon, or acting as an “option dealer”;
