stem: A person obtains an option to lease a retail space with the intention of selling that option
  to another investor. Under Colorado statute, does this person need a real estate broker license?
options:
  - The person needs a license because dealing in options on real estate is included in the
    definition of real estate broker
  - The person does not need a license because option dealers are exempt from licensing requirements
  - The person needs a license only if they also receive a commission from the tenant
  - The person does not need a license unless the option is for a residential property
key: A
explanation: The broker definition includes buying, selling, or otherwise dealing in options on real
  estate, or acting as an option dealer. Therefore the person is engaged in brokerage and must be
  licensed. The other options incorrectly assert exemptions or conditions not present in the
  statute.
