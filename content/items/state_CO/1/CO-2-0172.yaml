stem: According to Colorado statute, what does the term 'Division' mean in the Real Estate Broker
  License Law?
options:
  - The division of real estate
  - The office of the director
  - The real estate commission
  - The regulatory agency department
key: A
explanation: The definition of 'Division' appears in §12-10-101(2) as 'the division of real estate.'
  The real estate commission is defined separately in §12-10-201(1). The division is part of, but
  not identical to, the department of regulatory agencies. The office of the director is defined in
  §12-10-101(1).
