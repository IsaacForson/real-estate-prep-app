stem: Which of the following individuals is exempt from needing a Colorado real estate broker
  license when acting under a power of attorney?
options:
  - An attorney-in-fact acting for a corporation under a power of attorney
  - An attorney-in-fact acting without compensation under a power of attorney
  - An attorney-in-fact receiving compensation for services under a power of attorney
  - An attorney-in-fact acting under a power of attorney that is not duly executed
key: B
explanation: Under Colo. Rev. Stat. § 12‑10‑201(6)(b)(I), an attorney‑in‑fact who performs
  real‑estate activities without receiving compensation and who holds a power of attorney that has
  been properly executed by the property owner is exempt from the broker‑license requirement. The
  exemption does not apply when the attorney‑in‑fact is paid for the services or when the power of
  attorney is not duly executed.
