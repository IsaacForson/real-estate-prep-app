stem: Maria, who does not hold a Colorado real estate broker license, agrees to help her neighbor
  sell his house by showing the property, negotiating the price, and receiving a $5,000 fee upon
  closing. Under Colorado law, what is the status of Maria's conduct?
options:
  - It is permissible because she receives no commission from a broker.
  - It is allowed provided she discloses her unlicensed status to the parties.
  - It is considered unlicensed brokerage activity and is therefore unlawful.
  - It is exempt under the attorney-in-fact provision in this scenario.
key: C
explanation: Under Colo. Rev. Stat. § 12-10-202, it is unlawful for any person to engage in the
  business or capacity of a real estate broker without first obtaining a license. Maria's
  actions—showing the property, negotiating the price, and receiving a fee—constitute engaging in
  brokerage without a license, so her conduct is unlawful. The idea that disclosure makes the
  activity allowed is incorrect because disclosure does not cure the lack of a required license.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-202
  url: null
  quoted_text: It is unlawful for any person, firm, partnership, limited liability company,
    association, or corporation to engage in the business or capacity of real estate broker in this
    state without first having obtained a license from the commission.
