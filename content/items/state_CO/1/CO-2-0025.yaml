stem: An applicant for a Colorado real estate broker license has a prior arrest that never resulted
  in a conviction. What additional record must the commission obtain before processing the
  application?
options:
  - A federal fingerprint-based criminal history record check from the FBI
  - A copy of the arrest report from the local police department
  - A character reference letter from three community leaders
  - A name-based judicial record check as defined in section 22-2-119.3(6)(d)
key: D
explanation: The statute directs the commission to acquire a name-based judicial record check, as
  defined in section 22-2-119.3(6)(d), for any applicant with an arrest without disposition. The FBI
  fingerprint check is already required for all applicants and does not satisfy this specific
  additional requirement.
