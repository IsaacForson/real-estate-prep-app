stem: Under Colorado law, what happens to a licensee's license if they change their business address
  or employment without notifying the commission?
options:
  - It is revoked after a thirty‑day waiting period.
  - It is suspended pending a commission hearing and review.
  - It remains active but the licensee may be fined.
  - It is automatically inactivated by the commission.
key: D
explanation: The statute states that a change of business address or employment without notification
  to the commission shall automatically inactivate the licensee’s license. The distractor suggesting
  a fine is incorrect because the law provides for automatic inactivation, not a discretionary fine.
