stem: A Colorado real estate broker receives a letter of admonition via certified mail with return
  receipt requested and signs for it on March 3. To preserve the right to have the matter heard in
  formal disciplinary proceedings, the broker must submit a written request for formal proceedings
  no later than which date?
options:
  - March 13
  - March 30
  - April 2
  - March 23
key: D
explanation: Under Colo. Rev. Stat. § 12-10-201 et seq. (7), a licensee who receives a letter of
  admonition must request formal disciplinary proceedings in writing within twenty days after proven
  receipt. Counting twenty days from March 3 gives a deadline of March 23, so the broker must submit
  the request by that date. The March 13 option incorrectly counts only ten days, while March 30 and
  April 2 exceed the twenty‑day limit.
