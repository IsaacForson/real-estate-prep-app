stem: A license applicant in Colorado has a prior misdemeanor conviction and wants to know if they
  will likely be granted a license before finishing education requirements. According to Colorado
  rule, what may they request?
options:
  - A request for a waiver of the education and experience requirements
  - A preliminary advisory opinion regarding likelihood of licensure
  - A submission of a reciprocity application from another jurisdiction
  - A petition for a temporary license while the investigation proceeds
key: B
explanation: Commission Rule 3.8 allows applicants with a past civil judgment or criminal conviction
  to request a preliminary advisory opinion on licensure likelihood before completing requirements.
  The distractor about a waiver is not authorized by this rule.
