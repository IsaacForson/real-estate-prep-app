stem: A licensee disposed of all records related to a transaction three years after closing. Upon
  request from the commission, the licensee cannot produce the documents. Is this a violation?
options:
  - The licensee did not violate the rule; no request after three years
  - The licensee violated the rule based on a five‑year requirement
  - The licensee did not violate the rule; only three years passed
  - The licensee violated the four‑year record‑keeping requirement
key: D
explanation: Records must be maintained for four years and produced upon commission request.
  Disposing after three years violates this requirement. The option claiming no violation because
  only three years have passed ignores the four‑year rule.
