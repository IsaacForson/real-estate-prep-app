    Real Estate) § 12-10-217(1)(k)
  url: null
  quoted_text: Failing to maintain possession, for future use or inspection by an authorized
    representative of the commission, for a period of four years, of the documents or records
    prescribed by the rules of the commission or to produce the documents or records upon reasonable
    request by the commission or by an authorized representative of the commission;
