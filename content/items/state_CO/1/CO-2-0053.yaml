stem: After an administrative law judge issues an initial decision of revocation against a licensee,
  and the licensee files written objections with the Commission within the required time, what
  action may the Commission take?
options:
  - The Commission may impose a fine after a brief hearing and review of the record
  - The Commission may dismiss the case after a preliminary review
  - The Commission may enforce the judge's decision pending further appeal
  - The Commission may adopt, modify, or refer the matter back for rehearing
key: D
explanation: The statute states that if written objections are filed, the Commission may adopt the
  findings and initial decision of the administrative law judge, modify the disciplinary action, or
  refer the matter back for rehearing. Therefore, the Commission has those options. The distractor
  "The Commission may automatically enforce the judge's decision" is incorrect because the
  Commission retains discretion and is not bound to enforce the decision automatically.
