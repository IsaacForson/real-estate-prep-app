stem: A Colorado broker’s license is suspended by the commission. The broker employs a salesperson
  who continues to work under the broker’s supervision. Under Colorado statute, what is the effect
  on the salesperson’s license?
options:
  - It is automatically inactivated by the commission.
  - It remains active because the salesperson is not the broker.
  - It is revoked after a thirty‑day waiting period.
  - It is suspended pending a commission hearing.
key: A
explanation: The statute provides that the suspension, expiration, or revocation of a broker’s
  license automatically inactivates every license of a person shown in commission records to be in
  the employ of that broker. The distractor claiming the salesperson’s license remains active is
  incorrect because inactivation occurs regardless of the employed person’s role.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-211(5)
  url: null
  quoted_text: The suspension, expiration, or revocation of a real estate broker’s license shall
    automatically inactivate every real estate broker’s license where the holder of the license is
    shown in the commission records to be in the employ of the broker whose license has expired or
    has been suspended or revoked pending notification to the commission by the employed licensee of
    a change of employment.
