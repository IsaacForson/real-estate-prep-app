stem: A Colorado real estate salesperson’s employment with their employing broker ended yesterday.
  Today, the salesperson shows a property to a prospective buyer. Under Colorado statute, what is
  the legal status of this action?
options:
  - It is lawful because the salesperson’s license remains active.
  - It is unlawful because performing licensed acts after employment termination is prohibited.
  - It is lawful if the salesperson obtains written permission from the broker.
  - It is unlawful only if the salesperson receives a commission for the showing.
key: B
explanation: The statute makes it unlawful for a licensee to perform any acts authorized under the
  license on or after the date that employment has been terminated. The distractor claiming the
  action is lawful if the license remains active ignores the explicit prohibition on performing
  licensed acts after termination.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-211(4)
  url: null
  quoted_text: It is unlawful for any such licensee to perform any of the acts authorized under the
    license in pursuance of this part 2, either directly or indirectly, on or after the date that
    employment has been terminated.
