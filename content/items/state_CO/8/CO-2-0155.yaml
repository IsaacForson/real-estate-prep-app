stem: "According to Colo. Rev. Stat. § 12-10-218(1)(a), an affiliated business arrangement exists when:"
options:
  - A provider of settlement services has an affiliate relationship or over 1% ownership in another
    provider and refers settlement business to that provider
  - A provider of settlement services employs a family member who directly refers settlement
    business to another provider
  - A provider of settlement services shares office space with another provider but does not
    directly refer business
  - A provider of settlement services receives a referral fee directly from another provider for
    settlement services
key: A
explanation: Under Colo. Rev. Stat. § 12-10-218(1)(a), an affiliated business arrangement requires
  both (1) the provider to have an affiliate relationship with or a direct beneficial ownership
  interest of more than one percent in another settlement‑service provider, and (2) the provider or
  its associate to refer settlement‑service business to that other provider or to affirmatively
  influence its selection. The option stating that a provider has an affiliate relationship or over
  1% ownership in another provider and refers settlement business to that provider satisfies both
  conditions, so it is correct. The option about employing a family member who refers business lacks
  the ownership/affiliate threshold, so it is insufficient. The option about receiving a referral
  fee lacks the ownership/affiliate threshold and does not involve a referral from the provider, so
  it is insufficient. The option about sharing office space without referring business lacks both
  the ownership/affiliate threshold and the referral component, so it is insufficient.
