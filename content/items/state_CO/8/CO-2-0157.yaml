    Real Estate) § 12-10-217(1)(h)
  url: null
  quoted_text: Failing to account for or to remit, within a reasonable time, any money coming into the
    licensee’s possession that belongs to others, whether acting as real estate brokers or
    otherwise, and failing to keep records relative to the money;
