stem: "A salesperson receives a $5,000 earnest money check from a buyer and keeps it in their
  personal checking account for 10 days before transferring it to the broker's trust account. Under
  Colo. Rev. Stat. § 12-10-217(1)(h), this conduct is:"
options:
  - This conduct is permissible because the funds were eventually deposited into the trust account.
  - This conduct is permissible because the amount was less than $10,000.
  - This conduct is a violation because the licensee failed to remit the funds within a reasonable
    time.
  - This conduct is a violation only if the funds were actually misappropriated.
key: C
explanation: Subsection (h) requires licensees to account for and remit others’ money within a
  reasonable time and to keep appropriate records. Holding earnest money in a personal account for
  ten days fails the timely remittance requirement, regardless of eventual deposit or amount. The
  violation does not depend on actual misappropriation.
