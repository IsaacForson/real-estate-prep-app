stem: "Under Colo. Rev. Stat. § 12-10-410(5), before a buyer’s agent may propose to the seller’s
  agent that the buyer’s agent be compensated by sharing the seller‑paid commission, the buyer’s
  agent must:"
options:
  - Obtain written approval from the buyer or tenant.
  - Submit a written notice to the real estate commission.
  - Obtain written approval from the seller or landlord.
  - Provide written disclosure of the proposed sharing to all parties.
key: A
explanation: The rule explicitly states that a buyer’s or tenant’s agent must obtain the written
  approval of the buyer or tenant before proposing compensation sharing paid by the seller or
  landlord. Approval from the seller or landlord does not satisfy this requirement.
