stem: A broker employed by Broker X begins working for Broker Y but does not notify the commission
  of the change in employment. According to Colo. Rev. Stat. § 12-10-211(1), what is the effect on
  the broker's license?
options:
  - The automatic inactivation of the license
  - The license remaining active with a required renewal fee
  - The license being suspended pending a hearing
  - The license being revoked and requiring reissuance
key: A
explanation: Under Colo. Rev. Stat. § 12-10-211(1), a change of employment without notifying the
  commission automatically inactivates the license. Therefore, the correct outcome is that the
  license is automatically inactivated. The license is not suspended pending a hearing, nor does it
  remain active with a required renewal fee, nor is it revoked requiring reissuance.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-211(1)
  url: null
  quoted_text: A change of business address or employment without notification to the commission shall
    automatically inactivate the licensee’s license.
