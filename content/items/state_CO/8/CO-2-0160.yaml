stem: An employed broker who is currently working for another broker attempts to act as the broker
  for a limited liability company. Under Colo. Rev. Stat. § 12-10-211(2), is this permitted?
options:
  - The prohibition of the employed broker acting as broker for a partnership, limited liability
    company, or corporation during employment
  - The employed broker acting as broker for a partnership with written consent from the employing
    broker
  - The employed broker acting as broker for a partnership while holding an active independent
    broker license
  - The employed broker terminating employment before acting as broker for a partnership
key: A
explanation: The statute states that an employed broker may not act on behalf of the broker or serve
  as broker for a partnership, limited liability company, or corporation while employed.
  Consequently, the statement that the employed broker is prohibited from acting as broker for a
  partnership, limited liability company, or corporation during employment is the correct answer.
  The other choices describe scenarios—terminating employment, having an independent license, or
  obtaining written consent—that the statute does not permit as exceptions, so they are incorrect.
