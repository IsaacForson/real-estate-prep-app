stem: Under Colo. Rev. Stat. § 12-10-217(1)(k), a licensee must keep which of the following for at
  **LEAST** four years?
options:
  - The licensee must retain documents or records prescribed by the commission.
  - The licensee must retain all advertising materials used in the past year.
  - The licensee must retain closing statements for each transaction.
  - The licensee must retain lists of prospective buyers.
key: A
explanation: Subsection (k) requires licensees to retain documents or records prescribed by the
  commission for four years and to produce them upon request. Advertising materials, closing
  statements, and buyer lists are not specifically mandated for that retention period. Therefore,
  only the documents or records prescribed by the commission satisfy the rule.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-217(1)(k)
  url: null
  quoted_text: Failing to maintain possession, for future use or inspection by an authorized
    representative of the commission, for a period of four years, of the documents or records
    prescribed by the rules of the commission or to produce the documents or records upon reasonable
    request by the commission or by an authorized representative of the commission;
