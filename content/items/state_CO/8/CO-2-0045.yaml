stem: Under Colo. Rev. Stat. § 12-10-201(6)(b), which of the following persons is exempt from the
  definition of 'real estate broker'?
options:
  - A licensed real estate salesperson who receives a share of commission
  - An attorney-in-fact acting without compensation under a power of attorney
  - A property manager who leases residential units for a fee on behalf of the owner
  - A person who negotiates a purchase of land for a developer and receives a fee
key: B
explanation: The statute expressly exempts an attorney-in-fact acting without compensation under a
  power of attorney from the definition of real estate broker. A licensed salesperson who receives a
  share of commission is not listed as exempt and would therefore need a broker license.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-201(6)(b)(I)
  url: null
  quoted_text: (I) Any attorney-in-fact acting without compensation under a power of attorney, duly
    executed by an owner of real estate, authorizing the consummation of a real estate transaction;
