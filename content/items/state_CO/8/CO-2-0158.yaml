stem: Under Colo. Rev. Stat. § 12-10-211(2), what is the employing broker's responsibility regarding
  the employed broker's license?
options:
  - The employing broker shall share commissions with the employed broker
  - The employing broker may terminate the employed broker’s license at any time
  - The employing broker shall have the control and custody of the employed broker’s license
  - The employing broker must renew the employed broker’s license annually
key: C
explanation: The statute requires the employing broker to have control and custody of the employed
  broker’s license (Colo. Rev. Stat. § 12-10-211(2)). The option stating that the employing broker
  shall share commissions is incorrect because commission sharing is a matter of agreement, not a
  statutory duty. The option claiming the employing broker may terminate the employed broker’s
  license at any time is wrong; only the Division of Real Estate can suspend or revoke a license.
  The option asserting the employing broker must renew the employed broker’s license annually is
  also incorrect; license renewal is the responsibility of the individual licensee.
