stem: Under Colo. Rev. Stat. § 12-10-201(6)(c)(I)(A), which of the following must be included in the
  written disclosure to a buyer or tenant when the broker is acting as agent for the seller or
  landlord?
options:
  - A statement that the broker is an agent for the seller or landlord and is not an agent for the
    buyer or tenant.
  - A list of the tasks that the agent intends to perform for the buyer or tenant.
  - A statement that the buyer or tenant shall be vicariously liable for the acts of the agent.
  - A disclosure that the brokerage relationship extends to the employing broker or firm.
key: A
explanation: The statute requires the disclosure to include a statement that the broker is an agent
  for the seller or landlord and is not an agent for the buyer or tenant. The other options either
  misstate the party for whom tasks are listed, incorrectly impose vicarious liability, or add an
  unrelated disclosure about the employing broker.
