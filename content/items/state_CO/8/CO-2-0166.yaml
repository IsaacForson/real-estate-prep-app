stem: "Under Colo. Rev. Stat. § 12-10-410(6), before entering into a listing agreement, a broker
  must disclose to the seller:"
options:
  - The identity of any party that will pay the broker’s compensation or commission.
  - The exact amount of commission that the seller agrees to pay in the listing agreement.
  - The broker’s license number, expiration date, issuing authority, and contact information.
  - The name, address, telephone number, and email of the broker’s employing broker.
key: A
explanation: The statute requires disclosure of the identity of any party paying compensation or
  commission prior to entering into an agreement. Disclosing the commission amount, license details,
  or employing broker’s contact information does not fulfill this specific requirement.
