stem: A regularly salaried employee of an apartment complex owner performs customary on-site
  management duties, including showing units to prospective tenants and collecting rent. Under Colo.
  Rev. Stat. § 12-10-201(6)(b)(XII), does this employee need a real estate broker license?
options:
  - The employee must obtain a broker license unless they also hold a real estate salesperson
    license.
  - The employee is exempt only if they also receive a commission for lease negotiations.
  - The employee must obtain a broker license because any leasing activity requires licensure.
  - The employee is exempt from licensing as a salaried employee performing customary on-site
    management duties.
key: D
explanation: The statute exempts a regularly salaried employee of an apartment owner who acts as an
  on-site manager performing customary duties for the employer. The exemption applies regardless of
  leasing activities as long as the duties are customary on-site management, so a license is not
  required.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-201(6)(b)(XII)
  url: null
  quoted_text: (XII) A regularly salaried employee of an owner of an apartment building or complex who
    acts as an on-site manager of such an apartment building or complex. This exemption applies only
    in respect to the customary duties of an on-site manager performed for his or her employer.
