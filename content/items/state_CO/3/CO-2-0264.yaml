stem: According to Colorado statute, what must a written disclosure provided to a buyer or tenant by
  a broker acting as an agent for the seller or landlord include?
options:
  - "The broker must provide a written disclosure that includes: a statement that the broker is an
    agent for the seller or landlord and is not an agent for the buyer or tenant; a list of tasks
    the agent intends to perform for the seller or landlord with the buyer or tenant; and a
    statement that the buyer or tenant shall not be vicariously liable for the acts of the agent
    unless the buyer or tenant approves, directs, or ratifies those acts."
  - "The broker must provide a written disclosure that includes: a statement that the broker is an
    agent for the buyer or tenant and is not an agent for the seller or landlord; a list of tasks
    the agent intends to perform for the buyer or tenant with the seller or landlord; and a
    statement that the seller or landlord shall not be vicariously liable for the acts of the agent
    unless the seller or landlord approves, directs, or ratifies those acts."
  - "The broker must provide a written disclosure that includes: a statement that the broker is a
    transaction‑broker; a list of tasks the broker intends to perform for both parties; and a
    statement that neither party shall be liable for the acts of the broker and that the broker owes
    no fiduciary duty to either party."
  - "The broker must provide a written disclosure that includes: a statement that the broker will
    receive compensation from both parties; a list of marketing activities the broker intends to
    perform; and a statement that the broker may disclose confidential information only with the
    written consent of the involved parties and must account for any funds received."
key: A
explanation: "The correct answer lists the three required elements for a broker acting as an agent
  for the seller or landlord: (1) a statement that the broker represents the seller or landlord and
  not the buyer or tenant, (2) a list of tasks the broker intends to perform for the seller or
  landlord with the buyer or tenant, and (3) a statement that the buyer or tenant will not be
  vicariously liable for the broker’s acts unless they approve, direct, or ratify those acts, as
  required by Colo. Rev. Stat. § 12-10-201(2)(c)(I). A common incorrect choice reverses the
  representation, claiming the broker acts for the buyer or tenant, which contradicts the statute."
citation:
