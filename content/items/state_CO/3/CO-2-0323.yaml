stem: Under Colorado law, what is the transaction-broker's obligation regarding disclosure of
  adverse material facts to prospective buyers or tenants?
options:
  - The transaction-broker shall disclose only adverse material facts that are required by law to be
    disclosed.
  - The transaction-broker shall disclose adverse material facts only after obtaining the buyer's
    written consent.
  - The transaction-broker shall disclose adverse material facts only if they pertain to the
    property's title.
  - The transaction-broker shall disclose all adverse material facts actually known by the broker.
key: D
explanation: The rule requires a transaction-broker to disclose all adverse material facts actually
  known by the broker to prospective buyers or tenants, not just those required by law. The
  distractor that limits disclosure to legally required facts is incorrect because the statute
  imposes a broader disclosure duty.
citation:
  source: Colo. Rev. Stat. § 12-10-407(2)(b)(VI)
  url: null
  quoted_text: Disclosing to all prospective buyers or tenants any adverse material facts actually
    known by the broker including but not limited to adverse material facts pertaining to the title,
    the physical condition of the property, any defects in the property, and any environmental
    hazards affecting the property required by law to be disclosed.
