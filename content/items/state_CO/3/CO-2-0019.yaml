stem: A broker represents both the buyer and the seller in the same transaction. Under Colorado's
  disciplinary statute, when does this dual representation become grounds for Commission action?
options:
  - When the transaction involves residential property
  - When it occurs without the knowledge of all parties
  - When the broker earns a commission from both sides
  - When the broker discloses the arrangement in writing
key: B
explanation: The statute lists acting for more than one party in a transaction without the knowledge
  of all parties to it as grounds for commission discipline, meaning informed dual representation is
  treated differently.
