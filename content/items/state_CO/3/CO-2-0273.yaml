stem: A broker's license expired on January 15, 2022. The broker submits a reinstatement application
  on August 10, 2024. If the regular renewal fee is $200, what total fee must the broker pay under
  Colorado law?
options:
  - $200
  - $300
  - $400
  - $500
key: C
explanation: The license expired more than one year but within three years prior to reinstatement,
  so the broker must pay the regular renewal fee plus a reinstatement fee equal to the regular
  renewal fee ($200 + $200 = $400).
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-212(4)(a)(III)(C)
  url: null
  quoted_text: (C) If proper application is made more than one year but within three years after the
    date of expiration, by payment of the regular renewal fee and payment of a reinstatement fee
    equal to the regular renewal fee.
  secondary: []
math:
  worked_solution: Regular renewal fee = $200. Since application is made more than one year but within
    three years after expiration, reinstatement fee = regular renewal fee = $200. Total fee = $200 +
    $200 = $400.
  formulas:
    - Total fee = regular renewal fee + reinstatement fee
