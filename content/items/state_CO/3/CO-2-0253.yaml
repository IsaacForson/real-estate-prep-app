stem: A broker’s license was issued on June 15, 2022 and expires December 31, 2024. Under Colorado
  law, how many commission-developed continuing education hours must the broker complete to renew
  the license?
options:
  - 24 hours
  - 12 hours
  - 8 hours
  - 4 hours
key: C
explanation: For a license that expires less than three years after issuance, the rule requires a
  minimum of twenty‑four hours of credit, at least eight of which must be commission‑developed. The
  broker must therefore complete at least eight commission‑developed hours. The distractor of
  twenty‑four hours is the total credit requirement, not the commission‑developed portion.
