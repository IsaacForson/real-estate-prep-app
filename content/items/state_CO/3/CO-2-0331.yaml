stem: A broker is preparing to use a form drafted by a licensed Colorado attorney representing the
  broker for a residential purchase contract. A Commission-Approved Form exists and is appropriate
  for the transaction. What disclosure must the broker make to the parties under Colorado Real
  Estate Commission rules?
options:
  - The broker must obtain written approval from the Colorado Bar Association before using any
    non-Commission form, even if an attorney drafted it
  - The broker must replace the form with a Commission-Approved Form and provide a copy of the
    attorney's credentials to the parties
  - The broker must take no disclosure action because the form is drafted by an attorney and is
    considered equivalent to a Commission-Approved Form
  - The broker must advise the parties that the form has important legal consequences and that they
    should consult legal counsel before signing
key: D
explanation: When using an attorney-drafted form (a standard form under subsection 4(b)(II)), the
  broker must advise the parties that the form has important legal consequences and that they should
  consult legal counsel before signing, as required by § 12-10-403(4)(c). The other options either
  omit the required advice, add unnecessary approvals, or incorrectly mandate replacement.
citation:
