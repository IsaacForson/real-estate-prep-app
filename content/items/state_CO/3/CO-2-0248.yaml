stem: A broker's license was revoked on January 15, 2024. Under Colorado law, on what date may the
  broker first submit a new application for licensure that will be considered by the Commission?
options:
  - February 15, 2025
  - January 16, 2025
  - January 15, 2025
  - January 14, 2025
key: C
explanation: The statute bars consideration of an application until one year has passed since
  revocation; thus the application may be considered on the anniversary date, January 15, 2025.
  January 14, 2025 is too early, as the full year has not yet elapsed.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-201(9)
  url: null
  quoted_text: Any application for licensure from a person whose license has been revoked shall not be
    considered until the passage of one year from the date of revocation.
