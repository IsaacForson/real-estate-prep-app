stem: The Commission issues a subpoena compelling a witness to testify in a disciplinary hearing.
  Under Colorado law, how must this subpoena be served?
options:
  - By certified mail with return receipt requested
  - Through personal delivery by a licensed process server
  - By posting notice at the Commission's office
  - In the same manner as a district court subpoena
key: D
explanation: The statute requires Commission subpoenas to be served in the same manner as subpoenas
  issued by district courts, without discrimination between public and private parties.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-224
  url: null
  quoted_text: The commission, the director, or the administrative law judge appointed for hearings
    may issue a subpoena compelling the attendance and testimony of witnesses and the production of
    books, papers, or records pursuant to an investigation or hearing of the commission. The
    subpoenas shall be served in the same manner as subpoenas issued by district courts
