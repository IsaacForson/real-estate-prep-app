stem: A licensee enters into a new affiliated business arrangement with a mortgage lender on March
  1, 2026. Under Colorado law, what must the licensee disclose and when?
options:
  - Disclosure of the names and physical locations of all affiliated business arrangements at the
    time of entering into the arrangement
  - Disclosure of only the name of the new affiliated business arrangement within five days to the
    commission
  - Disclosure of the names and physical locations of all affiliated business arrangements to the
    commission annually
  - Disclosure of the physical locations of all affiliated business arrangements after the
    transaction closes
key: A
explanation: Subsection (3) requires a licensee to disclose the names and physical locations of all
  affiliated business arrangements at the time of entering into or changing an arrangement.
  Disclosing only the new arrangement's name within five days does not satisfy the timing or
  completeness requirements.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) — § 12-10-218(3)
  url: null
  quoted_text: a licensee shall disclose at the time the licensee enters into or changes an affiliated
    business arrangement, in a form and manner acceptable to the commission, the names of all
    affiliated business arrangements to which the licensee is a party. The disclosure shall include
    the physical locations of the affiliated businesses.
