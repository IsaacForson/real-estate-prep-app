stem: "A licensee is convicted of a misdemeanor theft offense but does not inform the Colorado Real
  Estate Commission in writing. Under Colorado law, this omission is prohibited because it:"
options:
  - A licensee who makes a promise they do not intend to keep.
  - A licensee who violates or aids in the violation of the Colorado or federal fair housing laws.
  - A licensee who fails to immediately notify the commission of a conviction.
  - A licensee who represents a broker other than their employer without consent.
key: C
explanation: The correct answer is C because the licensee failed to notify the commission of a
  conviction, which is prohibited under subsection (1)(p). The most tempting distractor, A,
  describes a false promise, which is addressed by subsection (1)(b) and does not apply to
  conviction reporting.
