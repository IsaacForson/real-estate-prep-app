stem: Under Colorado law, which of the following statements is true regarding engaging in real
  estate brokerage activities?
options:
  - It is allowed for attorneys‑in‑fact acting under power of attorney.
  - It is allowed for public officials performing official duties.
  - It is permissible if the person is supervised by a licensed broker.
  - It is unlawful unless the person first obtains a license from the commission.
key: D
explanation: Colorado law makes it unlawful for any person to engage in the business or capacity of
  a real estate broker unless that person holds a license issued by the Colorado Real Estate
  Commission. Therefore the statement that a person must first obtain a license from the commission
  is correct. A power of attorney does not create an exemption; an attorney‑in‑fact still must be
  licensed. Public officials performing their official duties are not exempt from the licensing
  requirement. Supervision by a licensed broker does not satisfy the statutory requirement that the
  individual themselves be licensed. (Colo. Rev. Stat. § 12‑10‑202)
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-202
  url: null
  quoted_text: It is unlawful for any person, firm, partnership, limited liability company,
    association, or corporation to engage in the business or capacity of real estate broker in this
    state without first having obtained a license from the commission.
