stem: An employing broker's associate commits an unlawful act without the employing broker's
  involvement. Under Colorado law, when can the employing broker still face disciplinary action for
  that act?
options:
  - If the associate later admits fault to the Commission
  - If the associate's license was inactive at the time
  - If the broker had actual knowledge or was negligent
  - If the transaction ultimately closes successfully
key: C
explanation: The statute shields an employing broker from discipline for an employee's unlawful act
  unless the broker had actual knowledge of the violation or had been negligent in supervising the
  employee.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-222
  url: null
  quoted_text: Any unlawful act or violation of any of the provisions of this part 2 upon the part of
    an employee, officer, or member of a licensed real estate broker shall not be cause for
    disciplinary action against a real estate broker, unless it appears to the satisfaction of the
    commission that the real estate broker had actual knowledge of the unlawful act or violation or
    had been negligent in the supervision of employees.
