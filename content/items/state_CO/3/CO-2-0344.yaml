stem: Under Colorado law, before a broker may establish a single agency relationship with a party,
  what must the broker do?
options:
  - Enter into a written agency agreement with the party to be represented.
  - Obtain verbal consent from the party before proceeding.
  - File a notice of the agreement with the Real Estate Commission.
  - Provide a written disclosure form signed by the party.
key: A
explanation: The statute requires a written agency agreement before establishing a single agency
  relationship. Providing a written disclosure applies only when acting as an agent for the seller
  or landlord, not for establishing a single agency relationship.
citation:
  source: Colo. Rev. Stat. § 12-10-201(b)
  url: null
  quoted_text: (b) Prior to engaging in any of the activities enumerated in section 12-10-201 (6), a
    broker intending to establish a single agency relationship with a seller, landlord, buyer, or
    tenant shall enter into a written agency agreement with the party to be represented.
