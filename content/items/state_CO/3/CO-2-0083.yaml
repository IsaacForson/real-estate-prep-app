stem: A Colorado broker changes their business address but fails to notify the commission. What is
  the immediate effect on the broker’s license under Colorado law?
options:
  - The license is placed on inactive status
  - The license is revoked immediately
  - The license remains active but fined
  - The license is suspended pending a hearing
key: A
explanation: The law states that a change of business address or employment without notification to
  the commission automatically inactivates the licensee’s license. Thus, the license becomes
  inactive immediately upon the unnotified change. The distractor 'The license is revoked
  immediately' is incorrect because revocation requires disciplinary action, not mere failure to
  notify.
