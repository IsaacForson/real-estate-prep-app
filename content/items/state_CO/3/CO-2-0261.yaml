stem: Which of the following acts is specifically prohibited for a Colorado real estate licensee
  under §12-10-217(1)(o)?
options:
  - A licensee who represents a broker other than their employer without consent.
  - A licensee who fails to immediately notify the commission of a conviction.
  - A licensee who makes a promise they do not intend to keep.
  - A licensee who violates or aids in the violation of the Colorado or federal fair housing laws.
key: D
explanation: The correct answer is A because subsection (1)(o) expressly prohibits violating or
  aiding in the violation of Colorado or federal fair housing laws. The most tempting distractor, B,
  describes a false promise, which is prohibited under subsection (1)(b), not (1)(o).
