stem: What is a Commission-Approved Form under Colorado Real Estate Commission rules?
options:
  - A form prescribed by a governmental agency or lender for the deal
  - A form provided by a party to the transaction for completion
  - A form promulgated by the Commission for current use by brokers
  - A form drafted by a licensed Colorado attorney for the broker
key: C
explanation: "A Commission-Approved Form is a form promulgated by the Colorado Real Estate
  Commission for current use by brokers, as defined in 4 Colo. Code Regs. § 725-1 § 6. The other
  options describe forms that are not Commission‑Approved: a form required by a governmental agency
  or lender, a form supplied by a party to the transaction, and a form drafted by a licensed
  Colorado attorney."
