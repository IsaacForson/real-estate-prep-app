stem: A licensee tells a buyer that they must use a specific title insurance company that is
  affiliated with the licensee's brokerage in order to receive the broker's services. Under Colorado
  law, is this permissible?
options:
  - No, unless the licensee obtains written consent from the buyer to use the affiliated title
    insurance company.
  - No, because requiring the use of an affiliated business arrangement as a condition of obtaining
    services is prohibited.
  - Yes, because the licensee has disclosed the affiliated business arrangement to the buyer in
    writing.
  - Yes, if the title insurance company pays the licensee a return on investment for the referral.
key: B
explanation: Under subsection 12-10-218(2)(c), a licensee shall not require the use of an affiliated
  business arrangement or a particular provider of settlement services as a condition of obtaining
  services. The statement that disclosure makes the requirement permissible is incorrect because
  disclosure does not override this prohibition.
