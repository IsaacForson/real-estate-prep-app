stem: Under Colorado law, when a licensee or employing broker is part of an affiliated business
  arrangement and an offer to purchase real property is fully executed, what must the licensee do
  regarding disclosure to the parties?
options:
  - Send the disclosure to the employing broker via email
  - Provide a written disclosure signed by all parties to the transaction
  - File the disclosure with the Colorado Commission
  - Give a verbal notice to the buyer only in writing
key: B
explanation: The statute requires that the disclosure be written and signed by all parties to the
  real estate transaction when an offer is fully executed and the licensee or employing broker is
  part of an affiliated business arrangement. A verbal notice alone does not satisfy this
  requirement.
