stem: Which of the following statements accurately describes a disclosure requirement under Colorado
  law for a licensee involved in an affiliated business arrangement when an offer to purchase real
  property is fully executed?
options:
  - The licensee must provide a contract or receipt to the prospective tenant that includes the
    commission’s address and telephone number in prominent letters.
  - The licensee must submit a copy of any lawsuit complaint to the commission within ten days of
    service.
  - The licensee must keep all commission investigative files closed to public inspection unless a
    stipulation is filed.
  - The licensee must disclose the existence of the arrangement in writing, signed by all parties to
    the transaction.
key: D
explanation: Colorado law requires that when a licensee or the employing broker is part of an
  affiliated business arrangement at the moment an offer to purchase real property is fully
  executed, the licensee must disclose the existence of that arrangement in writing and obtain the
  signatures of all parties to the transaction. This written disclosure requirement is set out in
  Colo. Rev. Stat. § 12‑10‑218(2)(b). The other statements describe duties that apply to different
  situations, such as rental‑location agents or filing obligations, and therefore do not satisfy the
  disclosure rule for affiliated business arrangements.
citation:
  source: Colo. Rev. Stat. § 12-10-218(2)(b)
  url: null
  quoted_text: If a licensee or the employing broker of a licensee is part of an affiliated business
    arrangement when an offer to purchase real property is fully executed, the licensee shall
    disclose to all parties to the real estate transaction the existence of the arrangement. The
    disclosure shall be written, shall be signed by all parties to the real estate transaction, and
    shall comply with the federal “Real Estate Settlement Procedures Act of 1974”, as amended, 12
    U.S.C. sec. 2601 et seq.
