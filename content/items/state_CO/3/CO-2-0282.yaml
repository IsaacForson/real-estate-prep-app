stem: A licensee who is part of an affiliated business arrangement with a title insurance company
  receives a payment from the title insurance company for services actually performed in issuing a
  title insurance policy. Under Colorado law, may the licensee accept this payment?
options:
  - No, because any payment received from an affiliated business arrangement is prohibited
    regardless of the service provided.
  - Yes, because the payment is for services actually performed and falls under an exception to the
    prohibition on fees from affiliated business arrangements.
  - No, unless the licensee discloses the payment to all parties to the real estate transaction in
    writing.
  - Yes, but only if the payment is structured as a return on the licensee’s investment in the title
    insurance company.
key: B
explanation: Under Colo. Rev. Stat. § 12-10-218(2)(e)(II), a title insurance company may pay its
  duly appointed agent for services actually performed in issuing a title insurance policy.
  Therefore, a licensee who performs such services may accept the payment; the prohibition on fees
  from affiliated business arrangements does not apply when the payment is for actual services
  rendered.
