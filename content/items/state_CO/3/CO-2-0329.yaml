stem: Under Colorado law, when a broker acts as a transaction-broker in a real estate transaction,
  what must the broker disclose to the parties involved?
options:
  - The broker's general duties and obligations
  - The broker's license number information
  - The broker's affiliated business arrangements
  - The broker's commission rate details
key: A
explanation: The broker must disclose their general duties and obligations arising from the
  relationship, as required by § 12-10-403(1). The commission rate, license number, and affiliated
  business arrangements are not specified disclosure duties for transaction-brokers under this rule.
citation:
