    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-403(1)
  url: null
  quoted_text: The broker’s general duties and obligations arising from that relationship shall be
    disclosed to the seller and the buyer or to the landlord and the tenant pursuant to section
    12-10-408.
