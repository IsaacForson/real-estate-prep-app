stem: A Colorado broker agrees to receive a commission from both the buyer and the seller in a
  residential sale. According to Colorado law, what must occur before the broker enters into the
  purchase contract?
options:
  - Written consent from both the buyer and the seller
  - Approval from the Colorado Real Estate Commission
  - Verbal agreement from both the buyer and the seller
  - Disclosure of the commission amounts to the parties
key: A
explanation: The statute requires written consent from both parties prior to entering into a
  contract for multiple compensation; verbal agreement or mere disclosure does not meet this
  requirement.
citation:
  source: Colo. Rev. Stat. § 12-10-410(7)
  url: null
  quoted_text: A broker may be compensated by more than one party for services in a transaction if
    those parties have consented in writing to such multiple payments prior to entering into a
    contract to buy, sell, or lease.
