stem: An associate broker receives an earnest money check made payable to the employing broker.
  Under Colorado law, what must the associate broker do with the check?
options:
  - Place it in the employing broker's custody promptly
  - Return the check to the buyer for safekeeping
  - Deposit the check into the associate broker's own account
  - Hold the check personally until closing occurs
key: A
explanation: The statute treats failure to place deposit money received in the course of a
  transaction into the custody of the licensed broker-employer, as soon after receipt as
  practicable, as grounds for disciplinary action.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-217
  url: null
  quoted_text: In the case of a broker registered as in the employ of another broker, failing to
    place, as soon after receipt as is practicably possible, in the custody of that licensed
    broker-employer any deposit money or other money or fund entrusted to the employee by any person
    dealing with the employee as the representative of that licensed broker-employer;
