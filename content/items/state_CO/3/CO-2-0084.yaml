stem: A person passes the Colorado real estate broker examination but does not submit a license
  application within one year. What happens to their examination results under Colorado law?
options:
  - The person may still apply for a license but must retake the exam
  - The examination score is retained for two years before expiring
  - The examination is automatically canceled and the passing score is terminated
  - The examination score is transferred to a salesperson license application
key: C
explanation: The statute provides that failure to file the appropriate broker’s application within
  one year of passing the exam automatically cancels the examination and terminates all rights to a
  passing score. Therefore, the candidate must retake the exam to obtain a new score. The distractor
  'The examination score is retained for two years before expiring' contradicts the explicit
  cancellation rule.
citation:
