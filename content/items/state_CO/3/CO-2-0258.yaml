stem: Under Colorado law, a broker who did **NOT** hold a current and valid broker’s license on
  December 31, 1996, must serve actively as a real estate broker for at least how many years before
  engaging in an independent brokerage practice?
options:
  - 1 year
  - 2 years
  - 3 years
  - 4 years
key: B
explanation: The statute requires that a broker who lacked a current and valid license on December
  31, 1996, must have served actively as a real estate broker for at least two years before engaging
  in independent brokerage practice. The two‑year service period is a prerequisite for independent
  practice under subsection (c)(I).
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) — § 12-10-208(c)(I)
  url: null
  quoted_text: (I) No such broker shall engage in an independent brokerage practice without first
    having served actively as a real estate broker for at least two years. The commission shall
    adopt rules requiring an employing broker to ensure that a high level of supervision is
    exercised over such a broker during the two-year period.
