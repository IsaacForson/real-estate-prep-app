stem: According to Colorado statute, which of the following best describes an "option dealer"?
options:
  - An individual who oversees a homeowners' association and its property
  - An individual who lists real estate properties for sale or lease
  - An individual who secures an option to purchase or lease real estate
  - An individual who conducts residential and commercial property appraisals
key: C
explanation: Colorado Rev. Stat. § 12‑10‑201(4) defines an option dealer as any person, firm,
  partnership, limited liability company, association, or corporation that directly or indirectly
  takes, obtains, or uses an option to purchase, exchange, rent, or lease real property—or any
  interest therein—with the intent to buy, sell, exchange, rent, or lease that property to another.
  The description that the individual secures an option to purchase or lease real estate matches
  this definition. The other choices describe a homeowners’ association manager, a listing broker,
  and an appraiser, none of which involve taking or using an option as required by the statute.
citation:
