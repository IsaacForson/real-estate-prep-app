    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-213(4)
  url: null
  quoted_text: (4) A licensee applying for renewal of a license that expires on December 31 of the
    year in which it was issued is not subject to the education requirements set forth in subsection
    (1) of this section.
