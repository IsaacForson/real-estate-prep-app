stem: Under Colorado law, which of the following describes a circumstance in which a broker is
  exempt from the continuing education requirement for license renewal?
options:
  - When the license expires on December 31 of the year it was issued
  - When the license has been inactive for more than one year
  - When the broker has completed twelve hours of commission-developed CE
  - When the broker is employed by a partnership or corporation
key: A
explanation: The statute explicitly states that a licensee applying for renewal of a license that
  expires on December 31 of the year in which it was issued is not subject to the continuing
  education requirements. The other options describe situations that still require continuing
  education.
