stem: A transaction-broker agrees to also conduct a home inspection for the buyer, which is not a
  duty listed in §12-10-407. What must the broker do under Colorado law?
options:
  - Provide a verbal disclosure of the additional obligation to the parties.
  - Obtain written consent only from the buyer for the additional obligation.
  - Disclose the additional obligation in writing signed by the involved parties.
  - File a notice of the additional obligation with the Real Estate Commission.
key: C
explanation: The statute requires any extra obligations to be disclosed in a writing signed by the
  involved parties. A verbal disclosure does not satisfy the writing and signature requirement.
citation:
  source: Colo. Rev. Stat. § 12-10-201(2)(c)(III)
  url: null
  quoted_text: (III) If the transaction-broker undertakes any obligations or responsibilities in
    addition to or different from those set forth in section 12-10-407, the obligations or
    responsibilities shall be disclosed in a writing that shall be signed by the involved parties.
