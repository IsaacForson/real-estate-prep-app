stem: The Real Estate Commission sets a licensee's errors and omissions insurance renewal date for
  October 15. On what date must the commission notify the licensee of the required terms and
  conditions at the latest to satisfy the statutory requirement?
options:
  - September 1
  - September 15
  - September 30
  - November 15
key: B
explanation: The commission must give notice at least thirty days prior to the renewal date; with an
  October 15 renewal, the latest permissible notice date is September 15. The distractor of October
  1 is too late because it falls within the thirty‑day window and would violate the "at least thirty
  days" rule.
