stem: Under Colorado law, if a transaction-broker assumes responsibilities beyond those set forth in
  §12-10-407, what must the broker do?
options:
  - Verbal consent obtained from all parties involved
  - Written disclosure signed by the involved parties
  - Notice filed with the Colorado Real Estate Commission
  - Separate commission agreement prepared for each party
key: B
explanation: The statute requires that any additional obligations be disclosed in a writing signed
  by the involved parties; verbal consent is insufficient because the rule mandates a signed
  writing.
citation:
  source: Colo. Rev. Stat. § 12-10-201(2)(c)(III)
  url: null
  quoted_text: If the transaction-broker undertakes any obligations or responsibilities in addition to
    or different from those set forth in section 12-10-407, the obligations or responsibilities
    shall be disclosed in a writing that shall be signed by the involved parties.
