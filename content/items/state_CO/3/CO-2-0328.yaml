stem: A natural person who is a manager of a limited liability company owns 25% of the LLC and is
  authorized to sell property owned by the LLC. Under Colorado law, which statement is correct
  regarding whether this person needs a real estate broker license to perform those sales?
options:
  - The person must obtain a broker license because ownership below twenty percent requires
    licensing.
  - The person is exempt from licensing requirements because they own twenty percent or more of the
    LLC.
  - The person must obtain a broker license because managing an LLC does not qualify for any
    exemption.
  - The person is exempt only if they also receive no additional compensation for the activity.
key: B
explanation: Under Colo. Rev. Stat. § 12-10-203(6)(b)(VII), a natural person who is a manager of a
  limited liability company or owns twenty percent or more of the LLC is exempt from needing a real
  estate broker license when selling property owned by the LLC. The person in the stem is both a
  manager and owns 25% of the LLC, which exceeds the 20% threshold, so they are exempt. The
  distractor that claims exemption requires no additional compensation is incorrect because the
  exemption does not include that condition.
