stem: A broker is acting as a designated broker for both the seller and the buyer in the same
  residential transaction, serving as a transaction-broker for each party. What disclosure is
  required under Colorado law?
options:
  - The broker must take no disclosure action because the broker is acting as a transaction-broker
  - The broker must disclose in writing the designated broker relationship to the seller and buyer
    in a timely manner
  - The broker must obtain written consent from both parties to act as a dual agent in the
    transaction
  - The broker must disclose only to the seller that they represent the buyer as well and withhold
    this information from the buyer
key: B
explanation: The designated broker relationship must be disclosed in writing to the seller or
  landlord and buyer or tenant in a timely manner, per § 12-10-403(6)(d). The other options either
  omit required written disclosure, confuse dual agency with transaction-broker, or limit disclosure
  to one party.
