    Real Estate) § 12-10-403(6)(d)
  url: null
  quoted_text: The applicable designated broker relationship shall be disclosed in writing to the
    seller or landlord and buyer or tenant in a timely manner pursuant to rules promulgated by the
    real estate commission.
