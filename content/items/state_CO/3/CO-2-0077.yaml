stem: Under Colorado law, how often must a real estate broker renew their license?
options:
  - Every eleven years
  - Every five years
  - Every three years
  - Every two years
key: C
explanation: The statute requires brokers to renew their license on or before December 31 of every
  third year after issuance. Therefore, the correct interval is every three years. The distractor
  'Every two years' incorrectly assumes a biennial renewal period not stated in the law.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-212(4)(a)(I)
  url: null
  quoted_text: The commission shall require that any person licensed under this part 2, whether on an
    active or inactive basis, renew the license on or before December 31 of every third year after
    issuance
