stem: Under Colorado Real Estate Commission rules, when must a broker use a Commission-Approved Form?
options:
  - When the client provides a form and the broker acts as a single agent
  - When the broker prefers to use a form drafted by an attorney
  - When the form is prescribed by a governmental agency
  - When a Commission-Approved Form exists and is appropriate for the transaction
key: D
explanation: The rule states that a broker must use a Commission-Approved Form when such form exists
  and is appropriate for the transaction. The option suggesting use when the client provides a form
  and the broker acts as a single agent describes a situation where a Client Form, not a
  Commission-Approved Form, would be used.
