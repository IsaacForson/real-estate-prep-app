stem: Broker X, who was not licensed as a broker in Colorado before January 1, 1997, has been
  actively licensed for 18 months and wishes to open her own brokerage firm. According to Colorado
  law, may Broker X proceed with opening the independent brokerage?
options:
  - Broker X may open the independent brokerage because she has been licensed for more than one year.
  - Broker X may not open the independent brokerage because she must have at least two years of
    active service before independent practice.
  - Broker X may open the independent brokerage if she completes an additional 24 hours of brokerage
    administration instruction.
  - Broker X may not open the independent brokerage unless she obtains a waiver from the commission.
key: B
explanation: The law bars independent brokerage practice until the broker has served actively for at
  least two years; 18 months does not satisfy this requirement. The distractor about completing 24
  hours of instruction refers to employing another broker, not to starting an independent practice.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) — § 12-10-208(c)(I)
  url: null
  quoted_text: (I) No such broker shall engage in an independent brokerage practice without first
    having served actively as a real estate broker for at least two years. The commission shall
    adopt rules requiring an employing broker to ensure that a high level of supervision is
    exercised over such a broker during the two-year period.
