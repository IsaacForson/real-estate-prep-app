stem: A broker is acting as a single agent for a seller, and the seller provides a purchase
  agreement form. What may the broker do with this Client Form under Colorado Real Estate Commission
  rules?
options:
  - The broker may alter the form to reflect additional terms negotiated by the parties.
  - The broker may insert transaction-specific information within the form.
  - The broker may use the form for any other client without obtaining new confirmation.
  - The broker may discard the form and draft a new one without retaining confirmation.
key: B
explanation: The rule limits a broker’s use of a Client Form to inserting transaction-specific
  information within the form. The option stating the broker may alter the form to reflect
  additional terms contradicts the prohibition on alteration beyond completing blanks.
