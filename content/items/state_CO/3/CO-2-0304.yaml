stem: An applicant for a Colorado broker license who holds a current real estate salesperson license
  in another state must complete how many hours of commission‑approved coursework?
options:
  - The applicant must complete one hundred forty‑four hours of commission‑approved coursework.
  - The applicant must complete one hundred eight hours of commission‑approved coursework.
  - The applicant must complete ninety‑six hours of commission‑approved coursework.
  - The applicant must complete one hundred twenty hours of commission‑approved coursework.
key: D
explanation: Under §12-10-208(4)(c), a salesperson licensee from another jurisdiction must complete
  the coursework listed in (4)(a)(II) (forty‑eight hours of contracts) and (4)(a)(III) (seventy‑two
  hours from the specified areas), for a total of forty‑eight plus seventy‑two equals one hundred
  twenty hours. The distractor “ninety‑six hours” omits twenty‑four hours, while “one hundred eight
  hours” mistakenly adds only sixty hours.
