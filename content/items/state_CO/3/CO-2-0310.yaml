stem: An employing broker must disclose the names and physical locations of all affiliated business
  arrangements to which the broker is a party how often under Colorado law?
options:
  - Disclosure required quarterly unless no changes occur to the commission
  - Disclosure required only when a new arrangement is formed to the commission and the licensee
  - Disclosure required at least annually for all affiliated business arrangements
  - Disclosure required monthly for each new affiliated business arrangement
key: C
explanation: Subsection (4) mandates that an employing broker disclose at least annually the names
  and physical locations of all affiliated business arrangements. Quarterly disclosure unless no
  changes occur is not supported by the statute.
