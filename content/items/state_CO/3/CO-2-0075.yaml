stem: A broker wants to use an Attorney Form for a transaction, but a Commission-Approved Form
  exists and is appropriate for that transaction. Under Colorado Real Estate Commission rules, may
  the broker use the Attorney Form?
options:
  - No, the broker may not use the Attorney Form because a Commission-Approved Form exists and is
    appropriate for the transaction.
  - Yes, the broker may use the Attorney Form as long as it includes the required disclaimer.
  - Yes, the broker may use the Attorney Form after obtaining written confirmation from the client.
  - No, the broker may not use the Attorney Form unless the broker alters the form to suit the
    transaction.
key: A
explanation: The rule permits an Attorney Form only when a Commission-Approved Form does not exist
  or is not appropriate for the transaction. The option suggesting the broker may use the Attorney
  Form as long as it includes the disclaimer incorrectly adds a condition not found in the rule.
