stem: What penalty classification applies to a person who willfully fails to obey a subpoena issued
  in a Commission investigation?
options:
  - A civil fine, capped at a single administrative penalty
  - A class 1 felony, regardless of the number of days involved
  - A class 2 misdemeanor, charged once per investigation
  - A petty offense, with each day of refusal a new offense
key: D
explanation: The statute makes willful failure to obey a subpoena a petty offense, and it specifies
  that each day a person continues to refuse or neglect constitutes a separate offense.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-225
  url: null
  quoted_text: Any person who willfully fails or neglects to appear and testify or to produce books,
    papers, or records required by subpoena, duly served upon him or her in any matter conducted
    under parts 2 and 5 of this article 10 commits a petty offense. Each day a person so refuses or
    neglects constitutes a separate offense.
