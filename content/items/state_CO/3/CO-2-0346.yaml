stem: A broker intends to work with a prospective buyer as an agent for the seller in a residential
  sale. When must the broker provide the written disclosure required under Colorado law?
options:
  - Before engaging in any brokerage activities listed in the statute.
  - After the buyer signs the purchase contract and receives the keys.
  - At the closing of the transaction when funds are disbursed.
  - Upon the buyer's request for the disclosure before any showings.
key: A
explanation: The statute mandates the disclosure prior to engaging in any of the activities
  enumerated in section 12-10-201 (6). Providing it after contract signing or at closing is too
  late.
