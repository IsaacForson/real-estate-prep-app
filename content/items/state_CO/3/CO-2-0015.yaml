stem: A licensed broker in Colorado wants to operate solely through a mobile phone and email with no
  physical office anywhere in the state. Absent an applicable exception, what does Colorado law
  require of the broker?
options:
  - The broker operates without any place of business
  - The broker maintains a place of business within the state
  - The broker registers a virtual office with a title company
  - The broker relocates to the county of licensure
key: B
explanation: Colorado law requires every licensed real estate broker to maintain a place of business
  within the state, except as otherwise provided by statute.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-203
  url: null
  quoted_text: Every real estate broker licensed under this part 2 shall maintain a place of business
    within this state, except as provided in section 12-10-208. In case a real estate broker
    maintains more than one place of business within the state, the broker shall be responsible for
    supervising all licensed activities originating in the offices.
