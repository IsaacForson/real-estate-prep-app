stem: A licensee receives a letter of admonition via certified mail on March 10 and signs for
  receipt on March 11. Under Colorado law, what is the last date on which the licensee may submit a
  written request for formal disciplinary proceedings to have the letter vacated?
options:
  - March 20
  - March 25
  - March 30
  - March 31
key: D
explanation: The rule requires the request to be made within twenty days after proven receipt;
  counting twenty days from March 11 gives March 31 as the final permissible date. March 30 is
  incorrect because it falls one day short of the twenty‑day period.
