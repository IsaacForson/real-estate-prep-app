stem: Under Colorado law, how many days does a licensee have to request formal disciplinary
  proceedings after receiving a letter of admonition to have the letter vacated?
options:
  - Twenty days
  - Fifteen days
  - Thirty days
  - Ten days
key: A
explanation: The statute provides that a licensee may request formal disciplinary proceedings within
  twenty days after proven receipt of a letter of admonition to have the letter vacated; making
  twenty days correct. Fifteen days is incorrect because the law specifies twenty days, not fifteen.
