stem: A broker agrees to represent both the landlord and the tenant in the same lease transaction,
  hoping to earn commissions from both parties. Under Colorado law, is this arrangement allowed?
options:
  - The broker may represent both the landlord and the tenant if written consent is obtained from
    both parties.
  - The broker may not represent both the landlord and the tenant in the same transaction.
  - The broker may represent both the landlord and the tenant as long as the dual relationship is
    disclosed to both parties.
  - The broker may not represent both the landlord and the tenant unless also acting as a
    transaction-broker.
key: B
explanation: Colorado law flatly forbids a broker from establishing dual agency with any seller,
  landlord, buyer, or tenant. Consequently, representing both landlord and tenant in the same lease
  is not allowed regardless of consent or disclosure. The distractor suggesting allowance with
  consent is wrong because consent does not override the statutory prohibition.
