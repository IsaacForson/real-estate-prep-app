stem: Under Colo. Rev. Stat. § 12-10-304(3), what is the maximum monetary remedy a prevailing party
  may recover in a civil action for a violation of the referral‑fee provisions?
options:
  - Actual damages plus up to three times actual damages plus reasonable attorney fees
  - Actual damages plus triple damages plus legal fees and court costs
  - Actual damages only, with no additional penalties, fines, or other relief
  - Actual damages plus up to two times actual damages plus fees plus court costs
key: A
explanation: The prevailing party is entitled to actual damages and the court may award up to three
  times actual damages plus reasonable attorney fees under §12-10-304(3). The distractor that offers
  only up to two times actual damages omits the statutory multiplier and the attorney‑fee component.
