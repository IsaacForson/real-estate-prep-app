stem: If the Real Estate Commission published the first‑quarter passing‑rate data on January 31, by
  what date must it publish the second‑quarter data to meet the quarterly disclosure requirement?
options:
  - March 31
  - April 30
  - May 31
  - June 30
key: B
explanation: The commission must publish the passing‑rate data quarterly, i.e., once every three
  months. If the Q1 report was issued on January 31, the Q2 report is due by April 30. The
  distractor of May 31 exceeds the quarterly interval and would delay disclosure beyond the required
  frequency.
