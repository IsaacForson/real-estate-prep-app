stem: A Colorado broker has a written buyer agency agreement with a buyer and is showing the buyer a
  property listed by another broker. According to Colorado law, when must the broker advise the
  listing broker of the existing buyer agency relationship?
options:
  - Advising the listing broker prior to making an offer
  - Advising the listing broker as soon as possible
  - Advising the listing broker following offer acceptance
  - Advising the listing broker only upon mutual agreement
key: B
explanation: The rule requires the broker to advise other potential parties at the earliest
  reasonable opportunity; waiting until an offer is made or relying on mutual agreement does not
  satisfy this duty.
citation:
  source: Colo. Rev. Stat. § 12-10-201(2)(d)
  url: null
  quoted_text: A broker who has already established a relationship with one party to a proposed
    transaction shall advise at the earliest reasonable opportunity any other potential parties or
    their agents of the established relationship.
