stem: A broker’s license expired on March 1, 2023. The broker submits a reinstatement application on
  September 15, 2023. If the regular renewal fee is $250, what total fee must the broker pay under
  Colorado law?
options:
  - $250
  - $300
  - $375
  - $500
key: C
explanation: An application made more than thirty‑one days but within one year after expiration
  requires the regular renewal fee plus a reinstatement fee equal to one‑half of that fee. Half of
  $250 is $125, so the total is $250 + $125 = $375. The distractor of $300 would result from
  incorrectly adding only a flat $50, while $500 mistakenly doubles the regular fee.
citation:
