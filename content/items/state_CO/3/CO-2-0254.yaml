math:
  worked_solution: |-
    Regular renewal fee = $250
    Reinstatement fee = 0.5 × $250 = $125
    Total fee = $250 + $125 = $375
  formulas:
    - Total fee = regular renewal fee + (0.5 × regular renewal fee)
    - Total fee = 1.5 × regular renewal fee
