stem: Before proposing to the seller's agent that the buyer's agent be compensated by sharing
  commission paid by the seller, what must the buyer's agent do first under Colorado law?
options:
  - Before proposing to the seller's agent that the buyer's agent be compensated by sharing
    commission paid by the seller, the buyer's agent must obtain the written approval of the buyer
    or tenant.
  - Before proposing to the seller's agent that the buyer's agent be compensated by sharing
    commission paid by the seller, the buyer's agent must obtain the written approval of the seller
    or landlord and also inform the employing broker of the intended split.
  - Before proposing to the seller's agent that the buyer's agent be compensated by sharing
    commission paid by the seller, the buyer's agent must obtain the written approval of the
    employing broker and notify the buyer or tenant of the proposed arrangement.
  - Before proposing to the seller's agent that the buyer's agent be compensated by sharing
    commission paid by the seller, the buyer's agent must first review the commission agreement with
    the employing broker and then secure written consent from all parties involved.
key: A
explanation: The statute requires a buyer’s or tenant’s agent to obtain the written approval of the
  buyer or tenant before proposing that the agent be compensated by sharing commission paid by the
  seller or landlord. The option that seeks approval from the seller or landlord and informs the
  employing broker is incorrect because the rule does not require that step.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
