    Real Estate) § 12-10-410(5)
  url: null
  quoted_text: A buyer’s or tenant’s agent shall obtain the written approval of the buyer or tenant
    before the agent may propose to the seller’s or landlord’s agent that the buyer’s or tenant’s
    agent be compensated by sharing compensation paid by the seller or landlord.
