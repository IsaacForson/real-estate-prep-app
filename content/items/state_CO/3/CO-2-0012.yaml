explanation: A person who violates the license law by acting as a real estate broker without having
  obtained a license commits a class 2 misdemeanor under the statute.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-223
  url: null
  quoted_text: Any natural person, firm, partnership, limited liability company, association, or
    corporation violating the provisions of this part 2 by acting as real estate broker in this
    state without having obtained a license or by acting as real estate broker after the broker’s
    license has been revoked or during any period for which the license may have been suspended
    commits a class 2 misdemeanor.
