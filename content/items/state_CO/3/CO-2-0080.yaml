stem: Broker A is listed in the Commission's records as employing Broker B. Under Colorado law, what
  is Broker A's status?
options:
  - Broker A is an employing broker
  - Broker A is a sponsoring broker
  - Broker A is an associate broker
  - Broker A is a temporary broker
key: A
explanation: The statute defines an employing broker as a broker shown in commission records as
  employing or engaging another broker. Because Broker A appears in the records as employing Broker
  B, Broker A meets this definition. The option describing an associate broker refers to the
  employed party, not the employer.
