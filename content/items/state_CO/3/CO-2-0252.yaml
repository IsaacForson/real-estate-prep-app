stem: Under Colorado law, if an initial real estate broker license is issued on or after January 14,
  when does it expire?
options:
  - On the last day of the month following issuance.
  - December 31 of the year it was issued.
  - Three years from the date of issuance.
  - June 30 of the year following issuance.
key: B
explanation: The statute states that an initial license issued on or after January 14 expires at
  midnight on December 31 of the year it was issued. This exception overrides the standard
  three‑year renewal cycle for initial licenses. The distractor stating three years from issuance
  applies only after the initial period, not to the initial license itself.
