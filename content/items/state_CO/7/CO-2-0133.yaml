stem: What specific language must an Attorney Form contain according to 4 CCR 725-1 § 6?
options:
  - 'The form must contain the language: "This form has been approved by the Colorado Real Estate
    Commission".'
  - 'The form must contain the language: "This form has not been approved by the Colorado Real
    Estate Commission".'
  - 'The form must contain the language: "This form is approved by the Colorado Bar Association".'
  - 'The form must contain the language: "This form is provided by the client in the transaction".'
key: B
explanation: The rule for Attorney Forms explicitly requires the statement that the form has not
  been approved by the Colorado Real Estate Commission. Options stating the opposite approval or
  referencing other entities do not match this requirement.
