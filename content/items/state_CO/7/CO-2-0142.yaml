stem: Under Colorado law, what must a broker acting as a seller’s agent do with respect to
  presenting offers to the seller?
options:
  - Present all offers to the seller in a timely manner regardless of whether the property is under
    contract.
  - Present offers only if the seller requests them, otherwise withhold them until asked.
  - Present only offers that are higher than the asking price, ignoring lower offers.
  - Present offers only after the property is no longer under contract, unless the seller instructs
    otherwise.
key: A
explanation: Under Colo. Rev. Stat. § 12-10-404(1)(c)(II), a seller’s agent must present all offers
  to the seller in a timely manner, regardless of whether the property is under contract. Limiting
  presentation to only high‑priced offers, to only those requested by the seller, or to only after
  the property is no longer under contract are incorrect because the duty is unconditional.
