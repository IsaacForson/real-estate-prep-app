stem: According to 4 CCR 725-1 §6, when a Commission-Approved Form exists and is appropriate for a
  transaction, what must a broker do?
options:
  - Use the Commission-Approved Form and may advise the parties as to its effects
  - Use an Attorney Form regardless of the Commission-Approved Form's availability
  - Use a Client Form without retaining written confirmation
  - Use a Government/Lender Form and alter it as needed
key: A
explanation: The rule states that a broker must use a Commission-Approved Form when such form exists
  and is appropriate for the transaction and may advise the parties as to its effects. Using an
  Attorney Form in this situation is incorrect because an Attorney Form is permissible only when no
  Commission-Approved Form exists or the existing form is not appropriate.
