stem: A broker acting as single agent for a buyer receives a purchase agreement form from the buyer.
  The broker fills in the price and closing date but does not retain a copy of the buyer’s email
  providing the form. Is the broker in compliance with the rules for Client Forms?
options:
  - The broker may use the form for any party regardless of agency relationship.
  - The broker must obtain approval from the Colorado Real Estate Commission before using the form.
  - The broker may alter the form as needed to reflect the transaction details.
  - The broker must retain written confirmation that the form was provided by the client.
key: D
explanation: For a Client Form, the broker must retain written confirmation that the form was
  provided by the party and may only insert transaction‑specific information. Failing to keep that
  confirmation violates the rule. The distractor suggesting the broker may alter the form is
  incorrect because the form may not be changed beyond filling blanks.
