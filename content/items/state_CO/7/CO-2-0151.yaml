stem: According to Colorado law, what must a broker do after the termination or expiration of a
  brokerage agreement regarding money and property received during the engagement?
options:
  - Accounting for all money and property related to and received during the engagement
  - Transferring the money to the employing broker for disposition after closing
  - Keeping the money as compensation for services rendered to the client
  - Returning all money to the client immediately after termination
key: A
explanation: The statute requires the broker to account for all money and property received during
  the engagement after termination or expiration. Returning the money, keeping it as compensation,
  or transferring it to the employing broker does not satisfy this accounting duty.
