stem: A broker enters into a listing agreement with a seller but does not disclose that the buyer
  will also be paying part of the commission. According to Colorado law, what is the broker's
  violation?
options:
  - Failing to obtain written consent for dual agency
  - Failing to disclose the identity of parties paying compensation
  - Failing to keep confidential information received during the engagement
  - Failing to account for all money and property related to the engagement
key: B
explanation: The statute mandates that the identity of parties paying compensation be disclosed to
  the transaction parties prior to entering into a brokerage or listing agreement. Failing to
  disclose this identity violates the rule, whereas the other options concern unrelated duties such
  as dual agency consent, confidentiality, or accounting.
citation:
  source: Colo. Rev. Stat. § 12-10-410(6)
  url: null
  quoted_text: Prior to entering into a brokerage or listing agreement or a contract to buy, sell, or
    lease, the identity of those parties, persons, or entities paying compensation or commissions to
    any broker shall be disclosed to the parties to the transaction.
