stem: A broker who represents a buyer wants to propose that the buyer’s agent be compensated by
  sharing a portion of the commission paid by the seller. What must the broker do before making this
  proposal?
options:
  - Filing a notice with the real estate commission
  - Disclosing the proposal to the closing agent
  - Obtaining written approval from the buyer
  - Obtaining written approval from the seller
key: C
explanation: The law requires a buyer’s or tenant’s agent to obtain the written approval of the
  buyer or tenant before proposing compensation sharing paid by the seller or landlord. Approval
  from the seller, disclosure to the closing agent, or filing a notice with the commission does not
  meet this requirement.
