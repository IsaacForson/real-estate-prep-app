stem: A broker who is the designated broker for a corporation ceases to be the designated broker.
  The corporation wants to avoid a lapse in licensure. What is the maximum initial period for which
  the director may issue a temporary license to prevent hardship?
options:
  - 30 days
  - 60 days
  - 90 days
  - 120 days
key: C
explanation: The statute allows the director to issue a temporary license for a period not to exceed
  ninety days to prevent hardship when the designated broker ceases. The distractor of 120 days
  exceeds this initial limit; extensions are possible only after showing good cause but not as the
  initial period.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-201(6)(c)
  url: null
  quoted_text: If the person ceases to be the designated broker of the partnership, limited liability
    company, or corporation, the director may issue a temporary license to prevent hardship for a
    period not to exceed ninety days to the licensed person so designated.
