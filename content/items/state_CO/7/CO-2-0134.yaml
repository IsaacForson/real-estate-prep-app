stem: A broker wants to use a form drafted by an attorney for a transaction where a
  Commission‑Approved Form exists and is appropriate for the transaction. Is the broker permitted to
  use the Attorney Form?
options:
  - The broker is permitted to use the Attorney Form because the attorney drafted it, even if the
    attorney is licensed in Colorado.
  - The broker is not permitted to use the Attorney Form because a Commission‑Approved Form exists
    and is appropriate for the transaction.
  - The broker is permitted to use the Attorney Form provided the form includes the language “This
    form has not been approved by the Colorado Real Estate Commission”.
  - The broker is not permitted to use the Attorney Form unless the client provides written
    confirmation that the form was provided by the client.
key: B
explanation: The rule states a broker may only use an Attorney Form if a Commission‑Approved Form
  does not exist or is not appropriate for the transaction. Since a suitable Commission‑Approved
  Form is available, using the Attorney Form is prohibited. The distractor that focuses only on the
  required language ignores this precondition.
