stem: A licensee provides the purchaser and seller with a closing statement and a signed duplicate
  copy of the listing contract, but does not provide the contract of sale or a preliminary
  agreement. Under Colo. Rev. Stat. § 12-10-217(1)(j), is the licensee in violation?
options:
  - The licensee is in violation only if they also failed to retain records for four years
  - The licensee is not in violation because providing the listing contract satisfies the requirement
  - The licensee is in violation because they failed to provide the contract of sale or preliminary
    agreement
  - The licensee is not in violation because they provided the closing statement and listing contract
key: C
explanation: The statute requires licensees to provide both a closing statement and a signed
  duplicate copy of the listing contract and the contract of sale or preliminary agreement. Omitting
  the contract of sale or preliminary agreement violates this requirement, even if the other
  documents are supplied.
