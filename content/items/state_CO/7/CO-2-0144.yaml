stem: What must a licensee provide to the purchaser and seller of a real estate transaction at
  closing according to Colo. Rev. Stat. § 12-10-217(1)(j)?
options:
  - Providing a closing statement containing information as may be prescribed by the commission
  - Providing only a signed duplicate copy of the listing contract and withholding the closing
    statement
  - Providing only a preliminary agreement to sell and omitting the closing statement
  - Providing a verbal summary of the transaction terms instead of a closing statement
key: A
explanation: The statute requires licensees to provide a closing statement containing information as
  may be prescribed by the commission’s rules. Providing only a listing contract or a preliminary
  agreement, or substituting a verbal summary, fails to meet this requirement because the closing
  statement with the prescribed information is mandatory.
