stem: A newly formed LLC seeks a Colorado real estate broker license and designates a broker who has
  not yet taken the state broker exam. What must occur before the LLC can be issued a license?
options:
  - The LLC must submit a renewal application to the commission
  - The designated broker must pass the broker examination
  - The LLC must employ at least three licensed agents
  - The LLC must file a surety bond with the state
key: B
explanation: The law requires that the designated broker pass the examination before a license can
  be issued to the LLC. The distractor about a temporary license request is incorrect because
  temporary licenses are issued only when the designated broker ceases, not for initial licensing.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-201(6)(b)
  url: null
  quoted_text: No license shall be issued to any partnership, limited liability company, or
    corporation unless and until the broker so designated by the partnership, limited liability
    company, or corporation submits to and passes the examination required by this part 2 on behalf
    of the partnership, limited liability company, or corporation.
