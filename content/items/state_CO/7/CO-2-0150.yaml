stem: A licensee tells a buyer that they must use the lender's affiliated title insurance company to
  obtain the loan; which statement is correct under Colorado law?
options:
  - The licensee may require the use of the affiliated title company as a condition of the loan and
    the buyer must agree to use it for the loan to be approved
  - The licensee must disclose the affiliation but may still require its use if the buyer consents
    in writing
  - The licensee shall not require the use of an affiliated business arrangement as a condition of
    obtaining settlement services
  - The licensee may accept a fee from the title company for the referral and disclose that fee to
    the buyer
key: C
explanation: Colorado law prohibits a licensee from requiring a consumer to use an affiliated
  business arrangement as a condition for obtaining settlement services. The correct answer states
  that prohibition directly. The answer that suggests disclosure permits required use is wrong
  because the law forbids conditioning the service on use of an affiliated provider even when the
  affiliation is disclosed.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. § 12-10-218
  url: null
  quoted_text: A licensee shall not require the use of an affiliated business arrangement or a
    particular provider of settlement services as a condition of obtaining services from that
    licensee for any settlement service.
