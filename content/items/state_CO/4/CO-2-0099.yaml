stem: A Colorado licensee who is part of an affiliated business arrangement has just had an offer to
  purchase real property fully executed. What must the licensee do?
options:
  - The licensee must provide an oral disclosure of the arrangement to the buyer and seller.
  - The licensee must provide a written disclosure signed by all parties to the transaction.
  - The licensee must notify only the employing broker of the arrangement in writing.
  - The licensee must take no action because the arrangement is considered a sham.
key: B
explanation: Colo. Rev. Stat. § 12-10-218(2)(b) requires a written disclosure signed by all parties
  when an offer is fully executed. Oral disclosure or notice to only the employing broker does not
  satisfy the requirement.
citation:
  source: Colo. Rev. Stat. § 12-10-218(2)(b)
  url: null
  quoted_text: If a licensee or the employing broker of a licensee is part of an affiliated business
    arrangement when an offer to purchase real property is fully executed, the licensee shall
    disclose to all parties to the real estate transaction the existence of the arrangement. The
    disclosure shall be written, shall be signed by all parties to the real estate transaction, and
    shall comply with the federal “Real Estate Settlement Procedures Act of 1974”, as amended, 12
    U.S.C. sec. 2601 et seq.
