stem: A buyer’s agent wishes to propose that the buyer’s agent be compensated by sharing a
  commission paid by the seller. Under Colorado law, what must the buyer’s agent do before making
  this proposal?
options:
  - File a notice with the Colorado Real Estate Commission.
  - Notify the seller’s agent of the proposed sharing arrangement.
  - Obtain verbal approval of the buyer or tenant.
  - Obtain written approval of the buyer or tenant.
key: D
explanation: The law states that a buyer’s or tenant’s agent must obtain the written approval of the
  buyer or tenant before proposing to be compensated by sharing compensation paid by the seller or
  landlord. Verbal approval, notifying the seller’s agent, or filing with the commission do not
  satisfy this requirement.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-410(5)
  url: null
  quoted_text: A buyer’s or tenant’s agent shall obtain the written approval of the buyer or tenant
    before the agent may propose to the seller’s or landlord’s agent that the buyer’s or tenant’s
    agent be compensated by sharing compensation paid by the seller or landlord.
