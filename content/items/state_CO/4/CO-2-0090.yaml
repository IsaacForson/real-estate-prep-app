stem: A salaried employee of an apartment building owner performs on-site management duties,
  including showing vacant units to prospective tenants, collecting applications, and preparing
  lease agreements. The employee does not receive additional compensation beyond their regular
  salary for these activities. Under Colorado law, is the employee required to hold a real estate
  broker license to perform these leasing activities?
options:
  - An obligation to obtain a real estate broker license.
  - An exemption from the real estate broker license requirement.
  - An obligation to obtain a salesperson license from the commission.
  - An obligation to complete continuing education.
key: B
explanation: Subsection (6)(b)(XII) provides that a regularly salaried employee of an apartment
  owner who acts as an on-site manager is exempt from broker licensing for customary duties
  performed for the employer. Leasing units as part of on-site management qualifies as a customary
  duty, so no license is required. The distractor claiming an obligation to obtain a broker license
  overlooks this specific exemption.
citation:
  source: Colo. Rev. Stat. § 12-10-201(6)(b)(XII)
  url: null
  quoted_text: (XII) A regularly salaried employee of an owner of an apartment building or complex who
    acts as an on-site manager of such an apartment building or complex. This exemption applies only
    in respect to the customary duties of an on-site manager performed for his or her employer.
