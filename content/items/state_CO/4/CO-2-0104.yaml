stem: A broker includes a clause in a broker engagement contract that allows the broker to assign
  the right to provide services to another broker without obtaining the owner's notice or agreement.
  Under Colorado law, is this clause enforceable?
options:
  - The clause is void and unenforceable because assignment requires owner notice
  - The clause is enforceable if the broker notifies the owner after assignment
  - The clause is enforceable if the assignee is a licensed broker and the owner consents
  - The clause is enforceable if the owner receives consideration for the assignment
key: A
explanation: The statute expressly prohibits assignment of the right to provide service without
  notice and agreement of the owner, rendering such a clause void and unenforceable. Notifying the
  owner after assignment does not satisfy the requirement of prior notice and agreement.
