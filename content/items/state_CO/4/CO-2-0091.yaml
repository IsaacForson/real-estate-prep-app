stem: A broker who did not hold a current and valid broker’s license on December 31, 1996, wishes to
  engage in an independent brokerage practice. What must this broker first do according to Colorado
  law?
options:
  - The broker must demonstrate experience and knowledge sufficient to employ and supervise other
    brokers
  - The broker must obtain a temporary license from the director
  - The broker must serve actively as a real estate broker for at least two years
  - The broker must complete twenty-four clock hours of brokerage administration instruction
key: C
explanation: Under subsection (c)(I), a broker lacking a license on the cutoff date may not engage
  in independent practice without first having served actively as a real estate broker for at least
  two years. The other options describe requirements for employing another broker or acting as an
  employing broker, which are covered in subsections (c)(II) and (c)(III).
citation:
