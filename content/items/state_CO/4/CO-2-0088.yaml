stem: Which of the following individuals is exempt from the definition of "real estate broker" under
  Colorado law?
options:
  - A property manager leasing units for a fee on behalf of the owner.
  - A mortgage loan originator negotiating loans for a residential buyer.
  - An attorney-in-fact acting without compensation under a power of attorney.
  - A licensed real estate salesperson working for a broker in Colorado.
key: C
explanation: Under subsection (6)(b)(I) of Colo. Rev. Stat. § 12-10-201, an attorney-in-fact acting
  without compensation under a power of attorney is expressly excluded from the definition of a real
  estate broker. Therefore, such a person does not need a broker license. The distractor describing
  a licensed real estate salesperson is incorrect because salespersons must be licensed or work
  under a broker and are not exempt.
