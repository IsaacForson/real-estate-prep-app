stem: Under Colorado regulations, what is required for seller and landlord listing contracts before
  a broker may perform any real estate brokerage services?
options:
  - The contract must be in writing.
  - The contract must be recorded with the county.
  - The contract must be approved by the broker.
  - The contract must be notarized.
key: A
explanation: The rule explicitly states that all seller and landlord listing contracts must be in
  writing prior to performing any real estate brokerage services. Therefore, a written contract is
  required. Notarization is not mandated by this provision, making that option incorrect.
