stem: A broker’s listing agreement with a seller has expired. The broker still holds an earnest
  money deposit received during the engagement. Under Colorado law, what is the broker obligated to
  do with this deposit?
options:
  - Return the deposit to the seller immediately upon expiration.
  - Account for all money and property related to and received during the engagement.
  - Hold the deposit in escrow until a new agreement is signed.
  - Transfer the deposit to the broker’s business operating account.
key: B
explanation: The statute requires the broker to account for all money and property related to and
  received during the engagement after termination or expiration. Returning, transferring to a
  business account, or holding in escrow are not the specific duty imposed.
