stem: A licensee allowed her license to expire on December 31, 2022. She submits a reinstatement
  application on March 15, 2024 (more than one year but within three years after expiration). What
  fees must she pay to reinstate her license?
options:
  - Pay the regular renewal fee plus a reinstatement fee equal to twice the regular renewal fee
    under Colorado law
  - Pay the regular renewal fee plus fifty percent of the regular renewal fee under Colorado law
  - Pay the regular renewal fee with no additional charges or penalties under Colorado law at this
    time
  - Pay the regular renewal fee plus a reinstatement fee equal to the regular renewal fee under
    Colorado law
key: D
explanation: For reinstatement more than one year but within three years after expiration, the
  statute requires the regular renewal fee plus a reinstatement fee equal to the regular renewal
  fee. The distractor with half the fee applies only to the thirty‑one‑day to one‑year window.
