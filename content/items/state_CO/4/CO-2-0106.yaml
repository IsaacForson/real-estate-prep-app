    Real Estate) § 12-10-212(4)(a)(III)(C)
  url: null
  quoted_text: If proper application is made more than one year but within three years after the date
    of expiration, by payment of the regular renewal fee and payment of a reinstatement fee equal to
    the regular renewal fee.
