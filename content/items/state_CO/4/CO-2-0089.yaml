stem: A manufacturing corporation's vice president, a regularly salaried employee, negotiates the
  sale of a vacant lot owned by the corporation to facilitate factory expansion. The corporation's
  primary business is manufacturing industrial equipment, not land transactions. Under Colorado law,
  what is the licensing requirement for the vice president regarding this transaction?
options:
  - An obligation to obtain a real estate broker license.
  - An exemption from the real estate broker license requirement.
  - An obligation to obtain a salesperson license from the commission.
  - An obligation to complete continuing education.
key: B
explanation: Subsection (6)(b)(VIII) exempts corporate officers or regularly salaried employees when
  they act for the corporation's non-real-estate business and the acts are incidental and necessary.
  Since the corporation's business is manufacturing and the sale is incidental to its factory
  expansion, the vice president is exempt. The distractor suggesting an obligation to obtain a
  broker license ignores this exemption.
citation:
  source: Colo. Rev. Stat. § 12-10-201(6)(b)(VIII)
  url: null
  quoted_text: (VIII) A corporation with respect to property owned or leased by it, acting through its
    officers or regularly salaried employees, when the acts are incidental and necessary in the
    ordinary course of the corporation’s business activities of a non-real-estate nature (but only
    if the corporation is not engaged in the business of land transactions), except as provided in
    subsection (4) of this section.
