stem: A licensed attorney in Colorado wishes to obtain a real estate broker license. The attorney
  has not yet completed any classroom instruction in trust accounts, record keeping, and real estate
  closings. What must the attorney do before taking the broker examination?
options:
  - The attorney must complete twelve hours of classroom instruction or equivalent correspondent
    hours in trust accounts, record keeping, and real estate closings
  - The attorney must file a certificate of coverage with the commission and undergo a background
    check before any examination eligibility
  - The attorney must submit proof of active malpractice insurance covering errors and omissions and
    also provide a bond to the commission
  - The attorney must serve as an employing broker for at least two years and complete additional
    continuing education credits
key: A
explanation: Subsection (10) expressly requires a licensed attorney to complete twelve hours of
  classroom instruction (or equivalent) in trust accounts, record keeping, and real estate closings
  before taking the broker examination. The other options describe unrelated requirements such as
  malpractice insurance, employing broker experience, or filing a coverage certificate, which are
  not prerequisites for the exam under this provision.
citation:
  source: Colo. Rev. Stat. § 12-10-201(10)
  url: null
  quoted_text: A licensed attorney shall take and pass the examination referred to in this section
    after having completed twelve hours of classroom instruction or equivalent correspondent hours
    in trust accounts, record keeping, and real estate closings.
