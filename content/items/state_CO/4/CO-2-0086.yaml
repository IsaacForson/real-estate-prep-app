stem: A broker representing a buyer wants to use an attorney‑drafted purchase agreement form. The
  Colorado Real Estate Commission has promulgated a Commission‑Approved purchase agreement form that
  is appropriate for the transaction. Under Colorado regulations, what must the broker do?
options:
  - The broker should use either form.
  - The broker should get client approval for the Attorney Form.
  - The broker should use the Attorney Form.
  - The broker should use the Commission‑Approved Form.
key: D
explanation: The rule provides that a broker may only use an Attorney Form when no
  Commission‑Approved Form exists or the existing form is not appropriate for the transaction.
  Because a suitable Commission‑Approved Form is available, the broker must use that form. Using the
  Attorney Form in this circumstance would violate the regulation.
