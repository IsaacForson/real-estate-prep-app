stem: A broker’s listing agreement with a seller expired six months ago. The agreement contained a
  clause entitling the broker to a commission if the seller later sold the property to a buyer the
  broker had shown the property to during the term. The broker never submitted the buyer’s name in
  writing to the seller during the term. Under Colorado regulations, is the broker entitled to the
  commission under the holdover clause?
options:
  - The broker is entitled to the commission.
  - The broker is not entitled to the commission.
  - The broker may receive a reduced commission.
  - The broker needs a new written agreement to claim commission.
key: B
explanation: For a holdover commission provision to be enforceable, the rule requires that the
  buyer’s name or address be submitted in writing to the consumer during the term of the agreement.
  Because the broker did not provide this written submission, the clause does not apply and the
  broker is not entitled to the commission. The option suggesting entitlement ignores this mandatory
  written requirement.
