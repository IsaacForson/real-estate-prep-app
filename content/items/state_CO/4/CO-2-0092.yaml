stem: A limited liability company seeks a Colorado real estate broker license. The company
  designates one of its members, who is a licensed broker, to be responsible for management and
  supervision. The designated broker passes the broker examination on behalf of the company.
  Assuming all other requirements are met, what is the outcome?
options:
  - The commission issues a broker license only to the designated broker individually
  - The commission issues a broker license to the limited liability company bearing the designated
    broker’s name
  - The commission denies the license because the designated broker must also be a partner in the
    company
  - The commission issues a temporary license pending further review
key: B
explanation: Subsection (6)(b) states that no license shall be issued to a partnership, LLC, or
  corporation until the designated broker passes the examination on behalf of the entity; upon
  passing and compliance, the commission issues a broker’s license to the entity bearing the
  designated broker’s name. The incorrect options misstate who receives the license or add
  conditions not required by the statute.
citation:
  source: Colo. Rev. Stat. § 12-10-201(6)(b)
  url: null
  quoted_text: No license shall be issued to any partnership, limited liability company, or
    corporation unless and until the broker so designated by the partnership, limited liability
    company, or corporation submits to and passes the examination required by this part 2 on behalf
    of the partnership, limited liability company, or corporation.
