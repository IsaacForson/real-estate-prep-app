stem: If a buyer or tenant refuses to sign the broker's written disclosure, what action must the
  broker take according to Colorado law?
options:
  - File the disclosure with the commission and keep a copy for records.
  - Destroy the disclosure after 30 days and notify the parties involved.
  - Note that fact on a copy of the disclosure and retain the copy.
  - Return the disclosure to the party and request a signature.
key: C
explanation: The statute requires the broker to note the refusal on a copy of the disclosure and
  retain that copy when the buyer or tenant does not sign. Returning, filing, or destroying the
  disclosure are not mandated actions.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-201(2)(c)(II)
  url: null
  quoted_text: If the buyer or tenant does not sign the disclosure, the broker shall note that fact on
    a copy of the disclosure and retain the copy.
