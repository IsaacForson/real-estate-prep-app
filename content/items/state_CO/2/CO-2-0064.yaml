stem: A limited liability company seeks to obtain a Colorado real estate broker license. According
  to Colo. Rev. Stat. § 12-10-201(6)(b), what must the company do before the commission will issue
  the license?
options:
  - Designate a qualified broker who passes the exam for the company
  - Submit fingerprints to the Colorado bureau of investigation and pay the fee
  - Complete forty‑eight hours of classroom instruction in real estate practice
  - Obtain errors and omissions insurance meeting state requirements
key: A
explanation: The statute states that no license shall be issued to a partnership, LLC, or
  corporation until the designated broker submits to and passes the required examination on behalf
  of the entity. The distractor about fingerprints is unrelated to this licensing requirement for
  entities.
citation:
  source: "### Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 -
    Real Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division
    of Real Estate) § 12-10-201(6)(b)"
  url: null
  quoted_text: No license shall be issued to any partnership, limited liability company, or
    corporation unless and until the broker so designated by the partnership, limited liability
    company, or corporation submits to and passes the examination required by this part 2 on behalf
    of the partnership, limited liability company, or corporation.
