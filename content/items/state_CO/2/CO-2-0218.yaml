stem: A broker who ceased to be the designated broker of a corporation received a temporary license
  valid for ninety days. Upon expiration, the broker seeks another temporary license. Under Colo.
  Rev. Stat. § 12-10-201(6)(c), what is true about obtaining a second temporary license?
options:
  - A second temporary license may be granted if the applicant shows good cause to the director
  - A second temporary license may be granted only after waiting ninety days
  - A second temporary license may be granted only by the commission regardless of cause
  - A second temporary license may not be granted after the first expires without commission approval
key: A
explanation: The director may extend a temporary license for one additional period not to exceed
  ninety days upon proper application and a showing of good cause. If the director refuses, only the
  commission may grant further extension, so the option stating that a second temporary license may
  be granted only after waiting ninety days is incorrect.
