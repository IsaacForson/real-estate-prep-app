stem: According to Colo. Rev. Stat. § 12-10-201(2)(c)(II), what must the written disclosure to a
  buyer or tenant contain?
options:
  - A signature block for the buyer or tenant to acknowledge receipt of the disclosure
  - A copy of the broker's current license and expiration date
  - A statement of the broker's commission rate and fee structure
  - A list of all properties the broker has listed in the past year
key: A
explanation: The statute requires the written disclosure to include a signature block for the buyer
  or tenant to acknowledge receipt of the disclosure. The other options describe information that
  the statute does not mandate in the disclosure.
