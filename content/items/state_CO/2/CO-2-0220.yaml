stem: A broker who did not complete the required continuing education for the current licensing
  cycle wishes to submit a renewal application. What must the broker do before submitting the
  application under 4 CCR 725-1?
options:
  - Requesting a waiver from the Commission’s executive director
  - Completing a make‑up course within thirty days of the deadline
  - Paying an additional penalty fee equal to half the renewal fee
  - Providing written notification to the Division of the non‑compliance
key: D
explanation: The rule requires a broker who did not comply with the continuing education requirement
  to provide written notification to the Division prior to submitting a renewal, activation, or
  reinstatement application. The other options describe actions not mandated by the rule.
