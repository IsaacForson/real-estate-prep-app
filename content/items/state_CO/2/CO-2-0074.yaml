  url: null
  quoted_text: Every person licensed pursuant to section 12-10-201 (6)(a)(X) shall give a prospective
    tenant a contract or receipt; and the contract or receipt shall include the address and
    telephone number of the commission in prominent letters and shall state that the regulation of
    rental location agents is under the purview of the commission.
