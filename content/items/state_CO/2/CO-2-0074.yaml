stem: Under Colo. Rev. Stat. § 12-10-217(2), what must a licensee provide to a prospective tenant?
options:
  - A contract or receipt that includes the commission's address and telephone number in prominent
    letters and states that regulation of rental location agents is under the purview of the
    commission.
  - A copy of the licensee's current broker license, a record of continuing education hours
    completed, and a signed acknowledgment of receipt of the commission's rules.
  - A signed agency agreement, a copy of the property's title report, a receipt for any earnest
    money deposited, and a copy of the seller's property disclosure statement.
  - A written disclosure of the licensee's commission structure, a copy of the listing agreement,
    and a statement of any known material defects.
key: A
explanation: The statute requires that a licensee give a prospective tenant a contract or receipt
  that contains the commission’s address and telephone number in prominent letters and states that
  regulation of rental location agents is under the commission’s purview. The other answer choices
  describe disclosures such as a copy of the broker license and continuing‑education record, a
  signed agency agreement with title report and earnest‑money receipt, or a written disclosure of
  commission structure and listing agreement; none of these are required by the cited provision.
citation:
