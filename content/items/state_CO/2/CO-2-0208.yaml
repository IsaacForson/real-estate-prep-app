stem: A broker’s license expired on March 1, 2024. The broker submits a reinstatement application on
  March 20, 2024. What fees must be paid to reinstate the license under Colorado law?
options:
  - Only the regular renewal fee
  - Renewal fee plus half fee
  - Renewal fee plus full fee
  - No fee if reinstated within 31 days
key: A
explanation: The rule states that if a reinstatement application is made within thirty‑one days
  after expiration, only the regular renewal fee is required. Submitting on March 20 falls within
  that window, so no additional reinstatement fee is due. The distractor adding a half renewal fee
  mistakenly applies the provision for applications made more than thirty‑one days but within one
  year of expiration.
