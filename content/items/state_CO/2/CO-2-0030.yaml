stem: Before submitting an application for a Colorado broker license, what must an applicant do
  regarding fingerprints under Colo. Rev. Stat. § 12-10-203(1)(b)(I)?
options:
  - Applicants must submit fingerprints to the Federal bureau of investigation only
  - Applicants must submit fingerprints after the application is filed
  - Applicants must submit a name-based judicial record check instead of fingerprints
  - Applicants must submit fingerprints to the Colorado bureau of investigation and pay the
    associated fee
key: D
explanation: The statute requires applicants to submit a set of fingerprints to the Colorado bureau
  of investigation for a state and national fingerprint‑based criminal history check and to pay the
  fee established by that bureau. Submitting fingerprints to only the federal bureau, substituting a
  name‑based check, or delaying submission until after filing does not meet the requirement.
