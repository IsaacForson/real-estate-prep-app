    Real Estate) § 12-10-203(1)(b)(I)
  url: null
  quoted_text: Prior to submitting an application for a license pursuant to subsection (1)(a) of this
    section, each applicant shall submit a set of fingerprints to the Colorado bureau of
    investigation for the purpose of conducting a state and national fingerprint-based criminal
    history record check
