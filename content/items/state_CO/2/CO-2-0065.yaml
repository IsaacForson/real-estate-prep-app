stem: A broker who did not hold a current and valid broker’s license on December 31, 1996, wishes to
  engage in independent brokerage practice. Under Colo. Rev. Stat. § 12-10-201(c)(I), what must the
  broker first have done?
options:
  - Demonstrated experience to employ and supervise other brokers
  - Obtained errors and omissions insurance meeting state requirements
  - Served actively as a real estate broker for at least two years
  - Completed twenty‑four clock hours of brokerage administration instruction
key: C
explanation: The statute requires such a broker to have served actively as a real estate broker for
  at least two years before engaging in independent practice. The distractor about twenty‑four hours
  refers to employing another broker, not independent practice.
citation:
  source: "### Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 -
    Real Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division
    of Real Estate) § 12-10-201(c)(I)"
  url: null
  quoted_text: No such broker shall engage in an independent brokerage practice without first having
    served actively as a real estate broker for at least two years.
