stem: A broker licensed under the name "John Smith & Associates" advertises her services under the
  name "Smith Realty Group". Under Colo. Rev. Stat. § 12-10-201(9), is this permissible?
options:
  - It is permissible because the broker remains the same individual regardless of business name
    used.
  - It is permissible provided the advertisement includes the broker's licensed name together with
    the trade name.
  - It is not permissible because the broker may conduct business only under the licensed name.
  - It is permissible if the broker files a fictitious name statement with the commission each year.
key: C
explanation: The rule states that a person shall conduct or promote a real estate brokerage business
  only under the name under which the person is licensed; using any other name violates this
  prohibition. The distractor that suggests including the licensed name alongside a trade name is
  incorrect because the statute requires exclusive use of the licensed name, not merely its
  inclusion.
citation:
  source: Colo. Rev. Stat. § 12-10-201(9)
  url: null
  quoted_text: (9) No person shall be licensed as a real estate broker under more than one name, and
    no person shall conduct or promote a real estate brokerage business except under the name under
    which the person is licensed.
