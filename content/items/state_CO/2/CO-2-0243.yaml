stem: A broker authorizes a third party to post their listings on an external website. The broker’s
  listing contract expired on June 1. The broker submitted a written request to the third party to
  remove the expired listing on June 5. According to 4 CCR 725-1, is the broker compliant?
options:
  - No, because the broker did not authorize the third party to post listings.
  - Yes, because the broker submitted the request before the listing contract expired.
  - No, because the broker submitted the request after the three-day deadline.
  - Yes, because the broker submitted the request within three days.
key: C
explanation: The rule requires the written request to be submitted within three days of expiration;
  submitting on June 5 for a June 1 expiration is four days later, violating the rule. The option
  stating that the request was submitted within three days is incorrect because the request was
  submitted after the deadline.
citation:
  source: 4 Colo. Code Regs. § 725-1 (4 CCR 725-1) 2
  url: null
  quoted_text: The Broker must submit a written request to any third party syndicators to have all
    expired listings removed from Electronic Media within three (3) days of a Listing Contract
    expiring.
