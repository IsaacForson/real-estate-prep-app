stem: Under Colo. Rev. Stat. § 12-10-201(6)(a)(X), which activity is exempt from the definition of
  “real estate broker”?
options:
  - The activity of charging a fee to a landlord for finding a tenant for residential rental property
  - The activity of charging a fee to a prospective tenant for providing information about available
    apartments
  - The activity of negotiating a purchase price for a buyer in a residential real estate transaction
  - The activity of listing a property for sale in the residential real estate market
key: B
explanation: The statute exempts soliciting a fee from a prospective tenant for furnishing
  information about the availability of real property, including apartment housing. Charging a fee
  to a prospective tenant for providing such information falls within this exemption. Charging a fee
  to a landlord for finding a tenant is not covered by the exemption, so a license would be
  required.
