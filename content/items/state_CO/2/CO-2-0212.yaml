stem: A licensee receives a letter of admonition via certified mail on April 3, 2025, and signs for
  receipt the same day. By what date must the licensee submit a written request to initiate formal
  disciplinary proceedings to avoid the letter being vacated?
options:
  - April 13, 2025
  - April 23, 2025
  - April 30, 2025
  - April 20, 2025
key: B
explanation: The statute requires the request to be made within twenty days after proven receipt of
  the letter of admonition. Proven receipt is April 3, 2025; adding twenty days yields April 23,
  2025 as the final day to submit the request. April 20, 2025 falls only seventeen days after
  receipt, which does not satisfy the twenty‑day requirement.
