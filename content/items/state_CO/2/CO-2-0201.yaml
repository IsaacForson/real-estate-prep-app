stem: Under Colorado law, what is the legal status of a broker who is engaged as a transaction-broker?
options:
  - An agent for the buyer only
  - Not an agent for either party
  - An agent for the seller only
  - A dual agent for both parties
key: B
explanation: The statute defines a transaction-broker as a broker who is not an agent for either
  party. Therefore, the correct answer is that the broker is not an agent for either party. The
  distractors suggesting agency for one party or dual agency are incorrect because the statute
  expressly denies any agency role.
