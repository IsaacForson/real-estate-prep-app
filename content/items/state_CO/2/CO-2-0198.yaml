stem: A broker who is currently employed by another broker wants to obtain a Colorado real estate
  broker license through a limited liability company. Under Colo. Rev. Stat. § 12-10-201(8), what
  condition must be satisfied for the commission to issue the license?
options:
  - The broker must have completed twenty-four clock hours of brokerage administration
  - The broker must have served actively as a broker for at least two years
  - The broker must be a married woman electing to use her birth name
  - The broker must have passed the broker examination on behalf of the LLC
key: C
explanation: The statute prohibits issuing a license to a partnership, LLC, or corporation for a
  broker registered as being in the employ of another broker, except that a married woman may elect
  to use her birth name. Therefore, the broker must be a married woman using her birth name to
  qualify. The other options describe requirements unrelated to this exception.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-201(8)
  url: null
  quoted_text: No license for a broker registered as being in the employ of another broker shall be
    issued to a partnership, a limited liability company, or a corporation or under a fictitious
    name or trade name; except that a married woman may elect to use her birth name.
