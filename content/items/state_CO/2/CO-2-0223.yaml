stem: Under 4 CCR 725-1 § 5.7.A, how many business days does a broker have to deposit property
  management funds received for rental receipts into a trust or escrow account?
options:
  - 1 business day.
  - 3 business days.
  - 5 business days.
  - 7 business days.
key: C
explanation: The rule states that property management funds must be deposited no later than five
  business days after receipt or lease execution, making five days correct. Three business days
  applies only to other money belonging to others, not property management funds.
citation:
  source: 4 Colo. Code Regs. § 725-1 (4 CCR 725-1) — 4 CCR 725-1 Rules Regarding Real Estate Brokers
    (eff. 01/30/2026) § 5.7.A
  url: null
  quoted_text: All Money Belonging to Others received by a Brokerage Firm for Property Management must
    be deposited in the Brokerage Firm’s appropriate Trust or Escrow Account no later than five (5)
    business days following receipt of funds or mutual execution of a lease, whichever is later.
