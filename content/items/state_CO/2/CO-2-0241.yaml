stem: Under 4 CCR 725-1, how many days does a broker have to remove expired listings from Electronic
  Media after a listing contract expires?
options:
  - Seven days.
  - Five days.
  - Three days.
  - One day.
key: C
explanation: The rule states that any expired listings must be removed from the Broker’s Electronic
  Media within three (3) days of a Listing Contract expiring. Therefore, three days is the correct
  timeframe. The distractor "One day" is incorrect because the rule specifies three days, not one.
