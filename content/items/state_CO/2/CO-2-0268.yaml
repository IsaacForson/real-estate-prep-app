stem: Under 4 CCR 725-1 § 5.7.B, how many business days does a broker have to deposit other money
  belonging to others received by a brokerage firm into a trust or escrow account?
options:
  - One (1) business days
  - Three (3) business days
  - Five (5) business days
  - Seven (7) business days
key: B
explanation: The rule states that other money must be deposited no later than three (3) business
  days after receipt of funds or mutual execution of a contract, whichever is later. Therefore three
  business days is the correct period. Five business days applies only to property management funds,
  making that distractor incorrect.
