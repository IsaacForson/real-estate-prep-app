stem: A broker obtained an initial Colorado real estate license on February 10, 2024. The license
  expires on December 31, 2024. The broker submits a renewal application on December 15, 2024. What
  is the minimum continuing education requirement for this renewal?
options:
  - Twenty-four hours with twelve hours commission-developed
  - No continuing education is required
  - Twelve hours commission-developed credits
  - Twenty-four hours with eight hours commission-developed
key: B
explanation: The statute exempts from continuing education any licensee renewing a license that
  expires on December 31 of the year in which it was issued. Since the license was issued in
  February 2024 and expires at the end of that same year, no CE is needed. The distractor requiring
  twenty‑four hours total applies to standard three‑year renewals and does not recognize the
  exemption.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-213(4)
  url: null
  quoted_text: (4) A licensee applying for renewal of a license that expires on December 31 of the
    year in which it was issued is not subject to the education requirements set forth in subsection
    (1) of this section.
