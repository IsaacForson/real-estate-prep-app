  url: null
  quoted_text: All Money Belonging to Others accepted by a Broker or Brokerage Firm must be kept
    separate from other money belonging to the Broker or Brokerage Firm and must be deposited into
    one or more of the Broker’s or Brokerage Firm’s Trust or Escrow Accounts.
