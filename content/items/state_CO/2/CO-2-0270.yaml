stem: A broker deposits personal funds into the trust account used for client earnest money. Under 4
  CCR 725-1 § 5.2, is this permissible?
options:
  - No, unless the broker obtains written consent from the client.
  - Yes, if the broker records the deposit as a loan.
  - Yes, as long as the funds are returned within 24 hours.
  - No, because trust accounts must hold only money belonging to others.
key: D
explanation: The rule requires that money belonging to others be kept separate from the broker’s own
  money and deposited only into trust or escrow accounts. Depositing personal funds commingles the
  accounts, which is prohibited. The distractor suggesting it is allowed if recorded as a loan
  incorrectly assumes a loan exception that the rule does not provide.
