stem: A transaction-broker in Colorado learns that a prospective buyer is willing to pay more than
  the listed price. The broker wants to inform the seller to strengthen negotiating position. What
  must the broker do before disclosing this information to the seller?
options:
  - Obtain the seller's written consent only.
  - No consent is required because the information is material.
  - Obtain informed consent of all parties to the transaction.
  - Obtain the buyer's written consent only.
key: C
explanation: The statute lists specific information that a transaction-broker may not disclose
  without the informed consent of all parties, including a buyer’s willingness to pay more than the
  offered price. Thus, the broker must obtain consent from all parties before disclosing that
  information. The distractor suggesting only the buyer’s consent is insufficient because the rule
  requires consent from all parties.
