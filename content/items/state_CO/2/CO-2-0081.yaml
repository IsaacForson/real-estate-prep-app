stem: A licensee gives a prospective tenant a written receipt that includes the commission's
  telephone number but omits the address. According to Colo. Rev. Stat. § 12-10-217(2), is this
  compliant?
options:
  - Yes, because providing the telephone number fulfills the statutory requirement for contact
    information and the statement about rental regulation.
  - No, because the contract or receipt must include both the address and telephone number of the
    commission in prominent letters.
  - Yes, as long as the receipt states that regulation of rental location agents is under the
    purview of the commission.
  - No, because the licensee must also provide a copy of the listing agreement and a signed agency
    disclosure.
key: B
explanation: Colo. Rev. Stat. § 12‑10‑217(2) requires that a contract or receipt given to a
  prospective tenant contain the commission’s address and telephone number in prominent letters and
  state that the regulation of rental location agents is under the commission’s purview. The
  suggestion that providing only the telephone number satisfies the requirement is therefore
  incorrect because the address is also mandatory.
