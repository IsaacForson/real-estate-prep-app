stem: A licensee receives a $500 kickback from a title company for referring clients, which violates
  § 12-10-218. What penalty must the Colorado Real Estate Commission assess under §
  12-10-217(z)(II)?
options:
  - Five hundred dollars
  - Two hundred fifty dollars
  - One thousand dollars
  - Seven hundred fifty dollars
key: A
explanation: For a violation of § 12-10-218, the commission must assess a penalty equal to the
  amount of remuneration improperly paid and transmit it to the state treasurer (§
  12-10-217(z)(II)). The $500 kickback is that amount; the other figures do not match the improper
  remuneration.
