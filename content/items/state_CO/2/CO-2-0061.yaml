stem: An applicant holds a bachelor's degree in business administration with a minor in real estate.
  Under Colo. Rev. Stat. § 12-10-203(4)(a), does this satisfy the education requirement for a
  Colorado broker license?
options:
  - The requirement is not satisfied because the degree lacks a major course of study in real estate
    as required.
  - The requirement is not satisfied because the applicant must finish the forty‑eight‑hour law and
    practice coursework regardless of degree.
  - The requirement is satisfied because any accredited college degree meets the education standard
    for a broker license.
  - The requirement is satisfied because a real estate minor qualifies as a major course of study
    under the statute.
key: A
explanation: Colo. Rev. Stat. § 12-10-203(4)(a) allows an applicant to meet the education
  requirement either by holding a degree with a major course of study in real estate or by
  completing commission‑approved coursework. A minor in real estate does not constitute a major
  course of study, so the bachelor's degree with a real‑estate minor does not satisfy the
  requirement. The statement that the applicant must still complete the forty‑eight‑hour law and
  practice coursework regardless of the degree is incorrect because the degree option would be
  sufficient only if it included a real‑estate major.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-203(4)(a)
  url: null
  quoted_text: "The applicant must furnish proof satisfactory to the commission that the applicant has
