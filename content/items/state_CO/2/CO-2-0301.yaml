stem: A person conducts real estate brokerage activities in Colorado without holding a broker's
  license. Under Colo. Rev. Stat. § 12-10-223, what is the penalty for this violation?
options:
  - A petty offense by law
  - A felony under state law
  - A class 2 misdemeanor
  - A class 1 misdemeanor
key: C
explanation: Under Colo. Rev. Stat. § 12-10-223, a person who acts as a real estate broker without a
  license commits a class 2 misdemeanor. Therefore, the correct answer is a class 2 misdemeanor. The
  distractor asserting a class 1 misdemeanor is incorrect because the statute specifies class 2, not
  class 1, for this violation.
