stem: How many days does a licensee have to request formal disciplinary proceedings after receiving
  a letter of admonition under Colorado law?
options:
  - Twenty days
  - Thirty days
  - Ten days
  - Fifteen days
key: A
explanation: Under Colo. Rev. Stat. § 12-10-201(7), a licensee may request in writing, within twenty
  days after proven receipt of a letter of admonition, that formal disciplinary proceedings be
  initiated. The twenty‑day period begins when the licensee proves receipt of the letter. Fifteen
  days is insufficient because the statute specifies twenty days, not fifteen.
