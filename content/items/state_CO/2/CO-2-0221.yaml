stem: After receiving a written notification from the Commission requesting proof of continuing
  education completion, a broker fails to provide the proof within the time set by the Commission.
  What is the result under 4 CCR 725-1?
options:
  - Receiving an automatic extension of six months after receiving the Commission’s notice
  - Facing grounds for disciplinary action unless the Commission has granted an extension
  - Having the license suspended indefinitely after failing to provide proof
  - Being required to retake the pre‑licensing education course after failing to comply
key: B
explanation: The rule states that failure to provide the requested proof within the prescribed time
  is grounds for disciplinary action unless the Commission has granted an extension. The other
  options describe outcomes not specified in the rule.
