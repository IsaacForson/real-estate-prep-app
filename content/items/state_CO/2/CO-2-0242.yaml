stem: A broker’s listing contract for a property expired on May 10. The broker removed the expired
  listing from their website on May 14. According to 4 CCR 725-1, is the broker in compliance?
options:
  - Yes, because the broker removed the listing within three days.
  - No, because the broker removed the listing after the three-day deadline.
  - Yes, because the broker removed the listing before the listing contract expired.
  - No, because the broker lacked authority to advertise the property.
key: B
explanation: The listing expired on May 10; removal on May 14 is four days later, exceeding the
  three‑day limit, so the broker is not compliant. The distractor "Yes, because the broker removed
  the listing within three days" is wrong because the removal occurred after the deadline.
