stem: A broker’s license expired on March 1, 2024. The broker submits a reinstatement application on
  November 15, 2024. What fees must be paid to reinstate the license under Colorado law?
options:
  - The regular renewal fee plus a reinstatement fee equal to one-half the regular renewal fee
  - The regular renewal fee plus a reinstatement fee equal to the regular renewal fee
  - The regular renewal fee plus a reinstatement fee equal to one-quarter the regular renewal fee
  - The regular renewal fee plus a reinstatement fee equal to twice the regular renewal fee
key: A
explanation: Reinstatement made more than thirty-one days but within one year after expiration
  requires the regular renewal fee plus a reinstatement fee equal to one-half of that fee. The
  distractor suggesting a full renewal fee as the reinstatement amount applies to applications made
  more than one year but within three years after expiration.
