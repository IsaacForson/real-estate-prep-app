stem: Before entering into a listing agreement to sell a property, what must a broker disclose to
  the parties regarding compensation?
options:
  - The broker's license number, expiration date, and continuing education completion status
  - The identity of those parties, persons, or entities paying compensation or commissions to the
    broker
  - The exact amount of the broker's commission, including any splits or referral fees
  - The broker's education, experience, professional credentials, and any special designations held
key: B
explanation: The statute requires disclosure of the identity of those paying compensation or
  commissions to the broker. The exact commission amount, license details, or education and
  experience are not required disclosures under this provision.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-410(6)
  url: null
  quoted_text: Prior to entering into a brokerage or listing agreement or a contract to buy, sell, or
    lease, the identity of those parties, persons, or entities paying compensation or commissions to
    any broker shall be disclosed to the parties to the transaction.
