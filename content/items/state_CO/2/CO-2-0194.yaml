stem: An associate broker who lives in Colorado but conducts all business from a home office in
  another state asks whether they must maintain a physical office in Colorado. Under 4 CCR 725-1
  Rule 3.10, is this permissible?
options:
  - The associate broker must maintain a physical office in Colorado
  - The associate broker is exempt from maintaining a physical office in Colorado
  - The associate broker must obtain a waiver from the Commission to work out‑of‑state
  - The associate broker may only work if employed by an employing broker
key: B
explanation: Rule 3.10 requires independent and employing brokers residing in Colorado to maintain a
  place of business, but expressly exempts associate brokers (and inactive brokers) from this
  requirement. Therefore the associate broker may operate without a Colorado office. The other
  options incorrectly impose the requirement or add unnecessary conditions.
