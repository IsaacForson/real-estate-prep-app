stem: A broker who did not hold a current and valid broker’s license on December 31, 1996 wishes to
  employ another broker as an employee. Under Colo. Rev. Stat. § 12-10-201(c)(II), what must the
  broker have completed before employing the other broker?
options:
  - Completion of twenty-four clock hours of instruction in brokerage administration
  - Completion of two years of active brokerage experience as a real estate broker
  - Completion of the broker licensing examination administered by the commission
  - Completion of a temporary license application submitted to the director
key: A
explanation: The statute requires that such a broker complete twenty-four clock hours of instruction
  (or equivalent) in brokerage administration before employing another broker. Two years of
  experience is required for independent practice, not for employing another broker, making that
  option incorrect.
citation:
  source: Colo. Rev. Stat. § 12-10-201(c)(II)
  url: null
  quoted_text: |-
    No such broker shall employ another broker without first having completed twenty-
    four clock hours of instruction, or the equivalent in correspondence hours, as
    approved by the commission, in brokerage administration
