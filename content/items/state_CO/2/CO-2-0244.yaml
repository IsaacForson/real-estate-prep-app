stem: A broker has entered into a buyer agency agreement with a buyer. Before showing the property
  to another prospective buyer, what must the broker do?
options:
  - Advise at the earliest reasonable opportunity any other potential parties or their agents of the
    established relationship
  - Obtain a new written agency agreement with the second buyer before showing any property
  - Disclose the broker's commission split and fee arrangement to the first buyer in writing
  - Terminate the first buyer agency agreement and provide written notice to the buyer
key: A
explanation: The statute requires the broker to advise at the earliest reasonable opportunity any
  other potential parties or their agents of the existing relationship. Obtaining a new agreement or
  terminating the first agreement is not required before showing the property.
citation:
  source: Colo. Rev. Stat. § 12-10-201 et seq. — Colorado Real Estate Manual 2026, Chapter 1 - Real
    Estate Broker License Law (C.R.S. Title 12, Art. 10, Pts. 1-2 as compiled by the Division of
    Real Estate) § 12-10-201(2)(d)
  url: null
  quoted_text: A broker who has already established a relationship with one party to a proposed
    transaction shall advise at the earliest reasonable opportunity any other potential parties or
    their agents of the established relationship.
