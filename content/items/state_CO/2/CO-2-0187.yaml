stem: According to 4 CCR 725-1, how long must a broker retain transaction files after the
  consummation of a transaction?
options:
  - The retention period is four (4) years.
  - The retention period is three (3) years.
  - The retention period is five (5) years.
  - The retention period is two (2) years.
key: A
explanation: The rule states that both a broker and brokerage firm must retain transaction files for
  a period of four (4) years beginning from the consummation date. The three‑year option is
  incorrect because the regulation specifies four years, not three.
