stem: Under Colo. Rev. Stat. § 12-10-201(9), how many names may a real estate broker be licensed under?
options:
  - One name
  - Two names
  - Three names
  - Unlimited names
key: A
explanation: The statute explicitly states that no person shall be licensed as a real estate broker
  under more than one name. Therefore a broker may hold only one license name. The distractor
  suggesting two names contradicts the plain language of the rule.
