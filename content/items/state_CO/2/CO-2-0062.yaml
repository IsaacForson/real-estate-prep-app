stem: A Colorado‑licensed broker operates solely from a home office in Nebraska and conducts all
  brokerage activities for Colorado clients via email and phone. Under Colo. Rev. Stat.
  § 12‑10‑203(2), is this permissible?
options:
  - It is permissible because the broker conducts all activities remotely and maintains no physical
    office in Colorado.
  - It is permissible because the broker’s Nebraska office qualifies as a place of business under an
    exception to the place‑of‑business requirement.
  - It is not permissible because every broker must maintain a place of business within Colorado
    unless an exception applies.
  - It is not permissible because the broker must also maintain a secondary office in Colorado for
    client meetings.
key: C
explanation: Colorado law requires a broker to maintain a place of business in the state, and only
  the specific exceptions listed in the statute allow a broker to operate without one. Because the
  facts do not show any of those exceptions, a broker cannot rely solely on a Nebraska office.
  Therefore the statement that the broker may operate remotely without a Colorado office is
  incorrect, and the claim that the Nebraska office qualifies under an exception is also
  unsupported. (Colo. Rev. Stat. § 12‑10‑203(2))
