stem: An applicant with a past misdemeanor conviction wants to know whether they are likely to
  obtain a Colorado real estate license before finishing the required education. What may they
  request under Colorado law?
options:
  - A waiver of the education requirement based on their criminal history
  - A preliminary advisory opinion from the Commission regarding the likelihood of receiving a
    license
  - A temporary license that allows them to practice while completing education
  - Automatic approval of their license application after submitting fingerprints
key: B
explanation: "Under § 12-10-202, applicants with a past civil judgment or criminal conviction may
  request a preliminary advisory opinion regarding the likelihood of receiving a license before
  completing the requirements to apply for a license. The other options are not supported: no waiver
  of education is mentioned, fingerprinting does not guarantee approval, and a temporary license for
  this purpose is not provided for in the statute."
