stem: A licensed securities broker‑dealer, whose primary business is trading stocks, negotiates the
  sale of a manufacturing company that includes ownership of a warehouse building. Under Colo. Rev.
  Stat. § 12-10-201(6)(a)(IX), is this person required to hold a Colorado real estate broker license
  for this negotiation?
options:
  - The person is required to hold a Colorado real estate broker license only if the warehouse is
    leased.
  - The person is required to hold a Colorado real estate broker license.
  - The person is not required to hold a Colorado real estate broker license.
  - The person is not required to hold a Colorado real estate broker license as it involves only
    personal property.
key: C
explanation: The statute excludes from the broker definition any negotiation of a business sale that
  includes real estate when performed by a broker‑dealer licensed under article 51 of title 11 who
  is engaged generally in securities business. Because the securities broker‑dealer meets this
  condition, no real estate broker license is required. The distractor asserting that any
  real‑estate‑related negotiation requires a license overlooks this specific exemption.
citation:
  source: Colo. Rev. Stat. § 12-10-201(6)(a)(IX)
  url: null
  quoted_text: (IX) Negotiating or attempting or offering to negotiate the listing, sale, purchase,
    exchange, or lease of a business or business opportunity or the goodwill thereof or any interest
    therein when the act or transaction involves, directly or indirectly, any change in the
    ownership or interest in real estate, or in a leasehold interest or estate, or in a business or
    business opportunity that owns an interest in real estate or in a leasehold unless the act is
    performed by any broker-dealer licensed under the provisions of article 51 of title 11 who is
    actually engaged generally in the business of offering, selling, purchasing, or trading in
    securities or any officer, partner, salesperson, employee, or other authorized representative or
    agent thereof;
