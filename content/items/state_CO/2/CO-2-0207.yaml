stem: A broker receives an initial Colorado real estate license issued on February 10, 2024. Under
  Colorado law, when must this license first be renewed?
options:
  - February 10, 2027
  - December 31, 2024
  - December 31, 2025
  - February 10, 2025
key: B
explanation: The statute provides that an initial license issued on or after January 14 expires at
  midnight on December 31 of the year it was issued, creating an exception to the usual three‑year
  renewal cycle. Therefore the February 10, 2024 license must be renewed by December 31, 2024. The
  distractor stating February 10, 2027 incorrectly applies the standard three‑year rule without the
  exception.
