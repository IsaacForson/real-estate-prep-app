stem: A member of the public requests to inspect records held by the Colorado Real Estate
  Commission. Under Colo. Rev. Stat. § 12-10-216(1), what determines the time and manner in which
  the inspection must be allowed?
options:
  - The state legislature's annual appropriations bill that funds the division's operations.
  - The commission's rules formulated under its authority governing public access.
  - The federal Freedom of Information Act schedule applicable to state agencies.
  - The licensee's internal office procedures for handling public record requests.
key: B
explanation: Colo. Rev. Stat. § 12-10-216(1) mandates that records kept in the commission's office
  be open to public inspection at times and in manners prescribed by rules formulated by the
  commission. Consequently, the commission's rules govern the inspection process, while legislative
  appropriations, federal FOIA schedules, and licensee internal procedures do not determine this
  specific statutory requirement.
citation:
  source: Colo. Rev. Stat. § 12-10-216(1)
  url: null
  quoted_text: All records kept in the office of the commission or department, under authority of
    parts 2 and 5 of this article 10, must be open to public inspection at such time and in such
    manner as may be prescribed by rules formulated by the commission.
