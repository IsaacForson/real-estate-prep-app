stem: A broker obtained a Colorado license on June 1, 2023 and is renewing it on May 30, 2025 (less
  than three years after issuance). What is the minimum continuing education requirement for this
  renewal?
options:
  - Twenty hours total, ten of which must be commission-developed credits
  - Thirty hours total, twelve of which must be commission-developed credits
  - Twenty-four hours total, twelve of which must be commission-developed credits
  - Twenty-four hours total, eight of which must be commission-developed credits
key: D
explanation: For licenses expiring less than three years after issuance, the rule mandates
  twenty-four hours of continuing education credit, with at least eight hours being
  commission-developed credits. The distractor using twelve commission-developed credits applies
  only to three-year license renewals.
