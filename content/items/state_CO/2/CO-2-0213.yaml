stem: An employing broker last filed the required annual disclosure of affiliated business
  arrangements on August 10, 2024. Assuming the broker continues to be party to such arrangements,
  by what date must the broker submit the next annual disclosure to comply with Colorado law?
options:
  - August 31, 2025
  - July 10, 2025
  - September 10, 2024
  - August 10, 2025
key: D
explanation: Colo. Rev. Stat. § 12-10-218(4) mandates that an employing broker shall at least
  annually disclose the names of all affiliated business arrangements. The disclosure must occur no
  later than one year after the previous filing, so the next disclosure is due by August 10, 2025.
  August 31, 2025 exceeds the one‑year interval, while September 10, 2024 precedes the required
  annual period.
