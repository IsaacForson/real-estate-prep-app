stem: Party X files an original transcript designation on May 1. Under 4 CCR 725-1 § 9.5.B.2.b, by
  what date must Party Y file a supplemental designation if it wishes to add additional transcript
  portions?
options:
  - May 11.
  - May 21.
  - May 31.
  - June 10.
key: A
explanation: A supplemental designation must be filed within ten (10) days after the date the
  original designation was filed. Ten days after May 1 is May 11, making that the correct deadline.
  May 21 would be twenty days after, which exceeds the allowed period.
citation:
  source: 4 Colo. Code Regs. § 725-1 (4 CCR 725-1) — 4 CCR 725-1 Rules Regarding Real Estate Brokers
    (eff. 01/30/2026) 9.5.B.2.b
  url: null
  quoted_text: The supplemental designation must be filed with the Commission and served on the other
    party within ten (10) days after the date on which the original designation was filed.
