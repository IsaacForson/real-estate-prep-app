stem: A person’s real estate broker license was revoked in another state for fraud within the last
  five years. What effect does this have under Colo. Rev. Stat. § 12-10-217(aa)(II)?
options:
  - The person is denied authorization to practice as a real estate broker or salesperson in Colorado
  - The person may still practice as a real estate broker after completing additional education
  - The person is automatically granted a Colorado license upon application
  - The person must pay a fine of two thousand five hundred dollars before licensure
key: A
explanation: The statute provides that discipline for fraud, deceit, etc., within the last five
  years denies the person authorization to practice as a real estate broker or salesperson (§
  12-10-217(aa)(II)). The other options are not supported by the text.
