stem: A person charges a fee to a landlord for providing a list of prospective tenants for a rental
  unit. Under Colo. Rev. Stat. § 12-10-201(6)(a)(X), is this person required to hold a real estate
  broker license?
options:
  - The person is required to hold a real estate broker license because the exemption only applies
    when the fee is solicited from a prospective tenant.
  - The person is not required to hold a real estate broker license because any fee for tenant
    placement is exempt.
  - The person is required to hold a real estate broker license unless the landlord also holds a
    broker license.
  - The person is not required to hold a real estate broker license because providing tenant
    information is not a real estate activity.
key: A
explanation: The exemption applies only when the fee is solicited from a prospective tenant; a fee
  received from a landlord does not qualify for the exemption. Therefore the person must be licensed
  as a real estate broker to perform this activity. The distractor claiming any fee for tenant
  placement is exempt ignores the limitation to prospective‑tenant fees.
