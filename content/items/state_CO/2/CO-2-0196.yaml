stem: Under Colo. Rev. Stat. § 12-10-201(6)(c), what is the maximum initial period for a temporary
  license that the director may issue to a designated broker who has ceased to serve in that role to
  prevent hardship?
options:
  - Up to sixty days
  - Up to ninety days
  - Up to one hundred twenty days
  - Up to one hundred eighty days
key: B
explanation: The statute states that the director may issue a temporary license to prevent hardship
  for a period not to exceed ninety days. Therefore, the maximum initial period is ninety days.
  Options suggesting sixty or more than ninety days are not supported by the text.
