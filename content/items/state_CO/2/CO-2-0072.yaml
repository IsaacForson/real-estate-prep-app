stem: Under Colo. Rev. Stat. § 12-10-201(2)(b), before a broker can establish a single agency
  relationship with a seller, what must the broker do first?
options:
  - A. Enter into a written agency agreement with the seller
  - B. Provide the seller with a written disclosure of the broker's agency duties
  - C. Obtain the seller's written consent to share the commission with another broker
  - D. Give the seller a copy of the broker's current license
key: A
explanation: The statute requires a written agency agreement with the party to be represented prior
  to engaging in any activities enumerated in § 12-10-201(6). The other actions are not
  prerequisites for establishing the relationship.
citation:
