stem: What is the immediate consequence for an active Colorado broker who fails to provide proof of
  continuous errors and omissions coverage upon expiration of the current policy?
options:
  - The broker's license is subject to a $2,500 fine.
  - The broker's license is placed on Inactive status.
  - The broker's license is automatically revoked.
  - The broker's license requires continuing education.
key: B
explanation: Under 4 CCR 725-1 § D, any active broker who fails to obtain errors and omissions
  coverage or provide proof of continuous coverage will be placed on Inactive status immediately
  upon expiration if certification is not provided. The $2,500 fine is not mentioned in this rule as
  a consequence for this violation.
