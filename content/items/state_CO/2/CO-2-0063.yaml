stem: Under Colo. Rev. Stat. § 12‑10‑201(10), how many hours of classroom instruction must a
  licensed attorney complete before taking the real estate broker examination?
options:
  - Twelve hours of classroom instruction
  - Eight hours of classroom instruction
  - Two hours of classroom instruction
  - Twenty‑four hours of classroom instruction
key: A
explanation: Colorado Rev. Stat. § 12‑10‑201(10) requires a licensed attorney to complete twelve
  hours of classroom instruction (or the equivalent in correspondence hours) covering trust
  accounts, record keeping, and real estate closings before taking the broker examination.
