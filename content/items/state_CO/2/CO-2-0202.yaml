stem: A Colorado broker wants to represent both the buyer and the seller in the same transaction by
  acting as their agent. According to Colorado statute, what is the broker permitted to do?
options:
  - The broker may act as dual agent if both parties give written consent.
  - The broker may act as dual agent only if the transaction is commercial.
  - The broker may not establish dual agency with any party.
  - The broker may act as dual agent after obtaining a special license from the commission.
key: C
explanation: The statute prohibits a broker from establishing dual agency with any seller, landlord,
  buyer, or tenant. Consequently, the broker may not act as dual agent regardless of consent or
  license. The distractors that allow dual agency under certain conditions contradict the outright
  prohibition.
