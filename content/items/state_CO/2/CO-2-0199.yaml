stem: According to 4 CCR 725-1, what is the definition of an 'Active' license?
options:
  - A license that is valid for exactly three years from the date of issuance unless renewed before
    the expiration date.
  - A license that has been renewed within the past twelve months and permits the holder to collect
    commissions from clients.
  - A current, valid License that allows a person or entity to engage in Real Estate Brokerage
    Services.
  - A license issued by the Commission that authorizes the holder to act exclusively as an Employing
    Broker in the state of Colorado.
key: C
explanation: The definition of 'Active' in 1.1 is a current, valid License that allows a person,
  firm, partnership, limited liability company, association, or corporation to engage in Real Estate
  Brokerage Services. The option that matches this description is the one that is a current, valid
  License that allows a person or entity to engage in Real Estate Brokerage Services. The other
  options add conditions not present in the rule, such as tying Active status to a specific renewal
  period, limiting the holder to acting exclusively as an Employing Broker, or specifying a fixed
  three‑year term.
