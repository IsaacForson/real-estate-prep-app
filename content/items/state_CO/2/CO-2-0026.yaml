stem: An applicant who has submitted a preliminary advisory opinion request due to a prior civil
  judgment must still complete which of the following steps before licensure?
options:
  - Pre-licensing investigations and fingerprinting
  - Only pass the state portion of the licensing exam
  - Obtain a sponsorship from an employing broker
  - Complete two years of licensed experience in another state
key: A
explanation: Both preliminary advisory applicants and license applicants must undergo pre-licensing
  investigations and fingerprinting to ensure truthfulness, honesty, good moral character, and
  general fitness (Colo. Rev. Stat. § 12-10-203(3)). Therefore, completing pre-licensing
  investigations and fingerprinting is required before licensure. The other options—obtaining a
  sponsoring broker, completing two years of licensed experience in another state, or only passing
  the state portion of the exam—are not universally required for all applicants.
