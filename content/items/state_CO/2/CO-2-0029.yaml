    Real Estate) § 12-10-203(4)(b)
  url: null
  quoted_text: (b) An applicant for a broker’s license who has been licensed as a real estate broker
    in another jurisdiction shall be required to complete only the course of study comprising the
    subject matter areas described in subsections (4)(a)(II) and (4)(a)(III)(B) of this section.
