stem: An applicant who holds a current real estate broker license in another state and wishes to
  obtain a Colorado broker license must complete which of the following educational requirements
  under Colo. Rev. Stat. § 12-10-203(4)(b)?
options:
  - Applicants must complete seventy‑two hours of instruction in trust accounts and record keeping
  - Applicants must complete real estate closings and also pass a state-specific law exam
  - Applicants must complete the understanding and preparation of Colorado real estate contracts only
  - Applicants must complete both the understanding and preparation of Colorado real estate
    contracts and real estate closings
key: D
explanation: Subsection (4)(b) states that an out‑of‑state broker need only complete the coursework
  described in subsections (4)(a)(II) and (4)(a)(III)(B), which are understanding and preparation of
  Colorado real estate contracts and real estate closings. Completing only one of those areas or
  unrelated coursework does not satisfy the requirement.
citation:
