stem: "Under 4 CCR 725-1 Rule 4.1.B, a broker who obtained a Colorado license on September 1, 2024
  and is applying for renewal on December 15, 2024:"
options:
  - The broker must submit proof of continuing education from the previous year
  - The broker must complete 24 hours of continuing education before renewal
  - The broker must complete only the Annual Commission Update course
  - The broker is exempt from the continuing education requirement for this renewal
key: D
explanation: Rule 4.1.B provides an exemption from continuing education for brokers renewing a
  license that expires in the same calendar year it was issued. Since the license was issued in
  September 2024 and expires December 31, 2024, the broker qualifies for this exemption. The other
  options incorrectly impose CE requirements that do not apply.
