stem: Under N.C. Gen. Stat. § 93A-3(a), how are the terms of the North Carolina Real Estate
  Commission members structured?
options:
  - Commission members serve three-year terms, with the terms of three members expiring each year.
  - Commission members serve two-year terms, with all members' terms expiring simultaneously.
  - Commission members serve four-year terms, with the terms of two members expiring each two years.
  - Commission members serve one-year terms, with all members' terms expiring annually.
key: A
explanation: The statute states that commission members serve three-year terms arranged so that the
  terms of three members expire each year. Therefore, the correct description is that members serve
  three-year terms with three members' terms expiring annually. The option claiming two-year terms
  is incorrect because the statute specifies three-year terms, not two.
citation:
  source: N.C. Gen. Stat. ch. 93A — N.C. General Statutes Chapter 93A - Real Estate License Law;
