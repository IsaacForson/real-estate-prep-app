stem: Under N.C. Gen. Stat. § 93A-6(c), what action may the Commission take to prevent violations of
  this Chapter or Commission rules?
options:
  - Impose monetary fines on the licensee
  - Appear in superior court for injunctive relief
  - Revoke the licensee's license immediately
  - Require the licensee to complete continuing education
key: B
explanation: The statute authorizes the Commission to appear in superior court to seek injunctive
  relief against anyone violating the Chapter or Commission rules. This power is preventive and does
  not require a prior disciplinary finding. The distractor about imposing monetary fines is not
  mentioned in this subsection as a preventive action the Commission may take directly.
