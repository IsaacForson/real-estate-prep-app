stem: A broker expects to receive a bonus from the title company handling the closing, apart from
  compensation the broker's principal has agreed to pay. Under 21 NCAC 58A .0109(c)(2), what must
  the broker do about the anticipated bonus?
options:
  - Deposit the bonus directly into the transaction's escrow account
  - Give full and timely disclosure of the bonus to the principal
  - Decline the bonus unless the title company is licensed
  - Report the bonus in the closing disclosure statement instead
key: B
explanation: Rule.0109(c)(2) requires a broker to provide full and timely disclosure of any bonus or
  other consideration from another party, confirmed in writing before the principal makes or accepts
  an offer to buy or sell.
citation:
  source: 21 NCAC 58A Rule .0109(c)(2)
  url: null
  quoted_text: from any other party or person unless the broker provides full and timely disclosure of
    the incentive, bonus, rebate, or other consideration, or the promise or expectation thereof to
    the broker's principal. The disclosure may be made orally, but must be confirmed in writing
    before the principal makes or accepts an offer to buy or sell.
