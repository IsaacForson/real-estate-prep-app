stem: A broker receives a check payable to the seller as payment for a due diligence fee. The option
  contract is accepted on Thursday. Under 21 NCAC 58A .0116(b)(4), what is the maximum time the
  broker may retain the check before delivering it to the seller or returning it to the buyer?
options:
  - No more than three business days after acceptance of the option contract.
  - No more than three calendar days after acceptance of the option contract.
  - No more than five business days after acceptance of the option contract.
  - No more than one business day after acceptance of the option contract.
key: A
explanation: The rule states that a broker shall not retain an instrument for more than three
  business days after the acceptance of the option or other sales contract. Therefore the maximum
  retention period is three business days. Using calendar days or a different number of days does
  not match the rule.
