stem: A vacancy occurs on the North Carolina Real Estate Commission due to a member's resignation.
  The vacancy is not a legislative appointment. Under N.C. Gen. Stat. § 93A-3(a), who has the power
  to fill this vacancy?
options:
  - The General Assembly of North Carolina
  - The Governor of North Carolina
  - The Speaker of the House of Representatives
  - The President Pro Tempore of the Senate
key: B
explanation: The statute gives the Governor authority to fill all vacancies on the Commission,
  except those that are legislative appointments, which are filled under G.S. 120-122. The General
  Assembly only fills legislative vacancies, making it incorrect for this scenario.
