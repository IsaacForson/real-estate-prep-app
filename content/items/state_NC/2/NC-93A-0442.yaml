stem: A broker affiliated with Firm X begins negotiating with a buyer while also secretly
  representing Firm Y in the same transaction without Firm X's knowledge or consent. Under N.C. Gen.
  Stat. § 93A-6(a)(6), what action may the Commission take?
options:
  - Issue a written warning and require probationary supervision for six months.
  - Take disciplinary action for representing another broker without consent.
  - Impose a monetary fine and suspend the license for thirty days.
  - Require the broker to complete additional ethics training within ninety days.
key: B
explanation: Subsection (a)(6) authorizes disciplinary action when a licensee represents another
  broker without the express knowledge and consent of their associated broker. The most tempting
  distractor, imposing a fine and suspension, describes possible penalties but the statute’s primary
  authority is to take disciplinary action, which may include those penalties only as part of a
  broader disciplinary decision.
