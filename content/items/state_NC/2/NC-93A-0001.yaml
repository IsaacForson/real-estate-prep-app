stem: Under 21 NCAC 58A .0104(c), when must a broker give a prospective buyer or seller the "Working
  with Real Estate Agents" publication?
options:
  - Within ten days after the listing agreement is signed
  - At the closing of the completed real estate transaction
  - At first substantial contact with the buyer or seller
  - After the buyer or seller has already signed an offer
key: C
explanation: Rule.0104(c) requires the broker to provide the publication, review it, and determine
  agency status at first substantial contact with a prospective buyer or seller, not at a later
  stage of the transaction.
citation:
  source: 21 NCAC 58A Rule .0104(c)
  url: null
  quoted_text: In every real estate sales transaction, a broker shall, at first substantial contact
    with a prospective buyer or seller, provide the prospective buyer or seller with a copy of the
    publication "Working with Real Estate Agents," set forth the broker's name and license number
    thereon, review the publication with the buyer or seller, and determine whether the agent will
    act as the agent of the buyer or seller in the transac tion.
