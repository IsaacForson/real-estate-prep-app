stem: Which of the following is specifically prohibited under N.C. Gen. Stat. § 93A-6(a)(12)?
options:
  - Acting for more than one party in a transaction without the knowledge of all parties for whom he
    or she acts, including representing both buyer and seller secretly.
  - Accepting a commission or valuable consideration as a provisional broker from anyone other than
    the broker-in-charge or employing broker.
  - Making any willful or negligent misrepresentation or any willful or negligent omission of
    material fact concerning property conditions or price.
  - Commingling the money or other property of principals with the licensee's own or failure to
    maintain and deposit in a trust or escrow account.
key: D
explanation: "Under N.C. Gen. Stat. § 93A-6(a)(12), a licensee may not commingle the licensee's own
  money with principals' funds or fail to deposit such money in a trust or escrow account. The
  option that describes this conduct is the correct choice. The other options describe different
  prohibited acts: acting for multiple parties without disclosure, accepting compensation from
  someone other than the employing broker, and making willful or negligent misrepresentations or
  omissions of material fact, which are covered elsewhere in the statute."
