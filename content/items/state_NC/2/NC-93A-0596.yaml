stem: A licensee surrenders their real estate license to the Commission for a period of one year
  with the Commission's consent and approval. According to N.C. Gen. Stat. § 93A-6(e), may the
  licensee submit an application for licensure six months after the surrender?
options:
  - Permission to reapply after six months of surrender
  - Continued ineligibility to apply during the surrender period
  - Requirement to obtain Commission permission before reapplying
  - Obligation to complete additional education before reapplying
key: B
explanation: The statute states that a licensee who surrenders a license shall not be eligible to
  submit any application for licensure during the period of license surrender. Therefore, six months
  into a one-year surrender, the licensee remains barred from reapplying. The distractor suggesting
  permission to reapply after six months contradicts the explicit prohibition on applying during the
  surrender period.
