stem: A firm's dual agency arrangement designates one broker to represent only the seller. Under 21
  NCAC 58A .0104(k), which piece of information may this designated broker disclose to the buyer's
  designated broker without the seller's permission?
options:
  - The seller's underlying motivation for selling the property
  - Confidential information the seller has identified as private
  - That the seller would accept price terms other than those listed
  - Publicly recorded information about the property's tax value
key: D
explanation: Rule.0104(k) bars the seller's designated broker from disclosing the seller's
  willingness to accept different terms, the seller's motivation, or information the seller has
  flagged as confidential, without the seller's permission, leaving other information disclosable.
