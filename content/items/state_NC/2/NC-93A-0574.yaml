math:
  worked_solution: "Start date: March 1. March has 31 days. Days remaining in March after March 1 = 31
    - 1 = 30. Remaining days to add = 45 - 30 = 15. Adding 15 days to April 1 gives April 15."
  formulas:
    - End date = Start date + 45 days
