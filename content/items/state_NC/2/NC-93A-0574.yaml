stem: A broker executes a lease agreement on March 1 for a rental property. Under 21 NCAC 58A
  .0106(b)(3), by what date must the broker deliver an accounting of the lease to the property
  owner?
options:
  - April 15
  - March 30
  - April 10
  - April 30
key: A
explanation: The rule requires the broker to deliver an accounting within 45 days after executing
  the lease. Starting from March 1, March has 31 days, so 30 days remain in March after March 1;
  adding the remaining 15 days reaches April 15. The distractor "April 10" is wrong because it only
  adds 40 days, falling short of the required 45-day period.
citation:
  source: 21 NCAC 58A .0101–0120 — 21 N.C. Admin. Code 58A Section .0100 — General Brokerage (Rules
    .0101 to .0120; NC OAH compilation).0106(b)(3)
  url: null
  quoted_text: "(3) delivers to the property owner an accounting within 45 days following the date of
    execution of the lease or rental agreement that identifies:"
