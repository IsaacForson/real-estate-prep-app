stem: Under N.C. Gen. Stat. § 93A-6(a)(5), a provisional real estate broker may accept a commission
  or valuable consideration from which of the following sources without violating the statute?
options:
  - The broker's broker-in-charge
  - Any third-party buyer or tenant
  - A mortgage lender providing financing
  - A licensed attorney not affiliated
key: A
explanation: The statute permits a provisional broker to receive commission or valuable
  consideration only from the broker-in-charge or the licensed broker by whom the broker is
  employed. Accepting such compensation from any other source, including a buyer, tenant, mortgage
  lender, or attorney not affiliated with the brokerage, is prohibited. Therefore, only the
  broker-in-charge is an allowable source.
citation:
