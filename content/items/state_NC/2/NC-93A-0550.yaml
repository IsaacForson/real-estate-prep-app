  url: null
  quoted_text: Accepting a commission or valuable consideration as a real estate broker on provisional
    status for the performance of any of the acts specified in this Article or Article 4 of this
    Chapter, from any person except his or her broker-in-charge or licensed broker by whom he or she
    is employed.
