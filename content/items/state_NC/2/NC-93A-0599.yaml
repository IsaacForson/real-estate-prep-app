stem: A broker who manages vacation rental properties maintains a subsidiary ledger for each
  property to track all funds collected and disbursed. Under 21 NCAC 58A .0108(f), what must the
  broker do with these subsidiary ledgers each month?
options:
  - Close subsidiary ledgers monthly
  - Administrate subsidiary ledgers monthly
  - Reconcile subsidiary ledgers monthly
  - Submit subsidiary ledgers monthly
key: C
explanation: The rule states that if a broker maintains a subsidiary ledger, the broker shall
  reconcile the subsidiary ledgers to the corresponding property or property owner ledger on a
  monthly basis. A distractor of 'Submit subsidiary ledgers monthly' incorrectly suggests a
  reporting requirement that is not imposed by this rule.
