stem: A broker working directly with a buyer as the seller's agent has her first substantial contact
  with that buyer in person. Under 21 NCAC 58A .0104(e), what must the broker do at that meeting?
options:
  - Wait until closing to identify who the broker represents
  - Refer the buyer to a different brokerage firm entirely
  - Disclose in writing that the broker represents the seller
  - Ask the buyer to sign a buyer agency agreement immediately
key: C
explanation: Rule.0104(e) requires a broker working directly with a prospective buyer as the
  seller's agent to disclose in writing at first substantial contact that the broker represents the
  seller's interests.
