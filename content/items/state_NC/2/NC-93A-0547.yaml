stem: What is the minimum number of Commission members who must be persons **NOT** involved directly
  or indirectly in the real estate or real estate appraisal business?
options:
  - The Commission must include at least one member who is not involved directly or indirectly in
    the real estate or real estate appraisal business.
  - The Commission must include at least two members who are not involved directly or indirectly in
    the real estate or real estate appraisal business.
  - The Commission must include at least three members who are not involved directly or indirectly
    in the real estate or real estate appraisal business.
  - The Commission must include at least four members who are not involved directly or indirectly in
    the real estate or real estate appraisal business.
key: B
explanation: The statute requires that at least two members of the Commission be persons who are not
  involved directly or indirectly in the real estate or real estate appraisal business. Therefore,
  the minimum number required is two. The statement that only one such member is required
  understates the minimum, and the statement that three such members are required overstates the
  minimum.
