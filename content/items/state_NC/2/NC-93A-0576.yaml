stem: Under 21 NCAC 58A .0118(a), what type of funds are considered trust money when collected,
  maintained, disbursed or otherwise controlled by a broker?
options:
  - Funds of a property owners' association
  - Earnest money deposits from buyers
  - Security deposits from residential tenants
  - Commission payments received from clients
key: A
explanation: The rule explicitly states that funds of a property owners' association, when
  collected, maintained, disbursed or otherwise controlled by a broker, are trust money and must be
  treated as such. The other options describe funds that may also be trust money under other
  provisions but are not the specific definition in.0118(a).
