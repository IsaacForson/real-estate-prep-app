stem: A broker already representing a seller wants to also represent the buyer in the same sale.
  Under 21 NCAC 58A .0104(d), what must the broker obtain before undertaking to represent the buyer?
options:
  - A verbal agreement from the buyer alone
  - The written authority of each party involved
  - A separate license endorsement from the Commission
  - Approval from the buyer's mortgage lender
key: B
explanation: Rule.0104(d) provides that a broker representing one party may not undertake to
  represent another party in the transaction without the written authority of each party.
