stem: Under 21 NCAC 58A .0108, what must a broker do if the trial balance, journal balance, and
  reconciled bank statement balance do **NOT** agree as of the cutoff date?
options:
  - Investigate the reason for any variation and make the necessary corrections to bring the
    balances into agreement.
  - Immediately Close the trust account and open a new one to reset the balances.
  - Ignore the discrepancy if the difference is less than one percent of the total trust account
    balance.
  - File a discrepancy report with the North Carolina Real Estate Commission within five business
    days.
key: A
explanation: The rule requires the broker to investigate the reason for any variation and make the
  necessary corrections to bring the balances into agreement. The distractor about filing a report
  with the Commission is not required by the rule; the rule only mandates internal correction.
