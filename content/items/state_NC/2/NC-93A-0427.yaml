stem: Under 21 NCAC 58A .0101(a), what must a broker retain as evidence of licensure?
options:
  - The pocket card issued by the Commission annually
  - A copy of the broker's sales contract
  - The broker's continuing education certificate
  - A letter of good standing from the local Realtor association
key: A
explanation: The rule states that the pocket card issued by the Commission annually to each broker
  shall be retained by the broker as evidence of licensure. The other options describe documents not
  mentioned in the rule as proof of licensure.
