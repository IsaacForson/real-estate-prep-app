stem: Under 21 NCAC 58A .0104(a), by what point must an agreement for brokerage services between a
  broker and a buyer or tenant be put in writing and signed?
options:
  - Within thirty days of the first meeting with the client
  - Before the broker shows any property to the buyer
  - At the closing of the resulting purchase or lease
  - Not later than the time one party makes an offer
key: D
explanation: Rule.0104(a) states that a brokerage services agreement with a buyer or tenant must be
  express and in writing not later than the time one of the parties makes an offer to purchase,
  sell, rent, lease, or exchange real estate.
