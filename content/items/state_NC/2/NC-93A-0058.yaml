stem: A broker deposits her personal funds into the same trust account used for clients' earnest
  money deposits. Under N.C. Gen. Stat. § 93A-6(a)(12), what constitutes grounds for disciplinary
  action?
options:
  - Engaging in failure to deliver a purchase agreement to the buyer and seller within a reasonable
    time.
  - Engaging in acceptance of a commission from a party other than the broker-in-charge while on
    provisional status.
  - Engaging in commingling of personal funds with clients' trust account funds.
  - Engaging in representation of both parties in a transaction without the knowledge of all parties.
key: C
explanation: The key is correct because § 93A-6(a)(12) prohibits commingling of principals' money
  with the broker's own or failure to maintain trust account. The distractors refer to other
  subsections (a)(13), (a)(5), and (a)(4) respectively.
