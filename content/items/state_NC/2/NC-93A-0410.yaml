stem: A broker who is compensated to manage two different property owners' associations receives
  trust money for each association. Under 21 NCAC 58A .0118(a), how must the broker handle these
  trust funds?
options:
  - The broker may commingle the funds and allocate them based on monthly disbursement needs.
  - The broker may commingle the funds as long as separate ledgers are kept for each association.
  - The broker must keep the funds in separate dedicated trust accounts for each association.
  - The broker may commingle the funds if both associations provide written consent.
key: C
explanation: The rule requires trust money for a single property owners' association to be deposited
  in a trust account dedicated exclusively to that association and prohibits commingling with funds
  belonging to other associations. The distractor suggesting commingling with written consent is not
  permitted by the rule.
citation:
  source: 21 NCAC 58A 0101–0120 — 21 N.C. Admin. Code 58A Section .0100 — General Brokerage (Rules
    .0101 to .0120; NC OAH compilation) 21 NCAC 58A .0118
  url: null
  quoted_text: Such trust money shall be deposited into and maintained in a trust or escrow account
    dedicated exclusively for trust money belonging to a single property owners' association and
    shall not be commingled with funds belonging to other property owners' associations or other
    persons or parties.
