stem: Under N.C. Gen. Stat. § 93A-6(a)(4), what constitutes grounds for disciplinary action?
options:
  - Acting for more than one party in a transaction without the knowledge of all parties for whom he
    or she acts.
  - Failing to account for or remit client funds within a reasonable time.
  - Accepting a commission or valuable consideration from a client for services rendered.
  - Making any willful or negligent misrepresentation or omission of material fact.
key: A
explanation: The statute lists acting for more than one party in a transaction without the knowledge
  of all parties as a specific ground for disciplinary action. The most tempting distractor, making
  a willful or negligent misrepresentation, is also a prohibited act but corresponds to subsection
  (1), not the conduct described in subsection (4).
