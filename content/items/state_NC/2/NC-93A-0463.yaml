stem: A firm designates one broker to represent the seller and another broker to represent the buyer
  in a dual agency transaction. Under 21 NCAC 58A .0104(m), by when must the designated brokers
  disclose the identity of all designated brokers to both the buyer and the seller?
options:
  - The disclosure must occur before the first substantial contact with either party
  - The disclosure must occur at the time the listing agreement is signed
  - The disclosure must occur no later than the presentation of the first offer to purchase or sell
  - The disclosure must occur after the contract is ratified but before closing
key: C
explanation: The rule requires that the disclosure of the identity of all designated brokers take
  place no later than the presentation of the first offer to purchase or sell. Therefore, timing
  tied to the first offer is correct, while earlier timing such as before first substantial contact
  is not mandated by the rule.
