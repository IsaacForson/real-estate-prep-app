stem: A broker deposits earnest money into an interest-bearing trust account after obtaining written
  authorization from the principals that the deposit may earn interest and that any interest will be
  disbursed to them. Under N.C. Gen. Stat. § 93A-6(a)(12), is this allowed?
options:
  - No, unless the broker also obtains separate Commission approval for the interest-bearing account.
  - Yes, because the principals authorized in writing and provided for disbursement of interest.
  - Yes, only if the bank is federally insured and the broker notifies the Commission.
  - No, because trust accounts may not bear interest under the statute.
key: B
explanation: The statute prohibits trust accounts from bearing interest unless the principals
  authorize in writing and provide for disbursement of the interest accrued. When those conditions
  are met, an interest-bearing account is permissible. The other options either ignore the written
  authorization requirement or add irrelevant conditions.
