stem: A broker representing a buyer makes initial contact with the seller's agent to discuss a
  property. Under 21 NCAC 58A .0104(f), what must the buyer's broker disclose at that contact?
options:
  - The commission split the buyer's broker expects to receive
  - The buyer's personal reasons for wanting the property
  - The buyer's maximum approved mortgage loan amount
  - That the broker represents the buyer's interests
key: D
explanation: Rule.0104(f) requires a broker representing a buyer to disclose at the initial contact
  with the seller or seller's agent that the broker represents the buyer's interests.
