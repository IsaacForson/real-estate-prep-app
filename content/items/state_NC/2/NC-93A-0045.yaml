stem: Under 21 NCAC 58A .0115, what action is prohibited concerning a party's offer to purchase real
  property?
options:
  - Disclosing the price or material terms to a competing party without the offering party's express
    authority.
  - Disclosing the price or material terms to the offering party's attorney without the offering
    party's express authority.
  - Disclosing the price or material terms to a competing party after obtaining the offering party's
    express authority.
  - Disclosing the existence of an offer to a competing party without the offering party's express
    authority.
key: A
explanation: The rule prohibits disclosing the price or other material terms of a party's offer to a
  competing party without that party's express authority. Therefore, disclosing such information
  without authority is prohibited. Disclosing the same information after obtaining authority is
  permitted, making it an incorrect choice for a prohibited action.
citation:
  source: 21 NCAC 58A 0101–0120 — 21 N.C. Admin. Code 58A Section .0100 — General Brokerage (Rules
    .0101 to .0120; NC OAH compilation) .0115
  url: null
  quoted_text: A broker shall not disclose the price or other material terms contained in a party's
    offer to purchase, sell, lease, rent, or to option real property to a competing party without
    the express authority of the offering party.
