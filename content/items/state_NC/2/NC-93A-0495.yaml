stem: A broker designated to represent the buyer in a dual agency transaction learns that the buyer
  needs to purchase quickly due to a job relocation. Under 21 NCAC 58A .0104(l)(2), may the broker
  disclose this motivation to the seller's designated broker without the buyer's permission?
options:
  - No, unless the seller's broker asks
  - No, unless the buyer consents in writing
  - No, unless contract requires disclosure
  - No, unless disclosure required by rule
key: D
explanation: The rule prohibits a designated buyer's broker from revealing the buyer's motivation
  unless disclosure is mandated by law or regulation. Therefore, without such a legal requirement,
  the broker may not share the relocation reason. The option citing buyer permission is incorrect
  because permission does not override the statutory limitation.
