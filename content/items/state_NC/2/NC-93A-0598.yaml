stem: Under 21 NCAC 58A .0118(a), how frequently must a broker provide periodic statements to a
  property owners' association at minimum?
options:
  - Every 30 days
  - Every 60 days
  - Every 90 days
  - Every 120 days
key: C
explanation: The rule requires statements to be made 'not less frequently than every 90 days,'
  establishing 90 days as the maximum allowable interval; therefore the broker must provide
  statements at least every 90 days. A distractor of 'Every 60 days' describes a more frequent
  interval than required, which satisfies the rule but does not represent the minimum frequency
  mandated.
