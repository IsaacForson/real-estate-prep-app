stem: A broker designated to represent the seller in a dual agency transaction learns that the
  seller needs to sell quickly due to a job transfer. Under 21 NCAC 58A .0104(k)(2), may the broker
  disclose this motivation to the buyer's designated broker without the seller's permission?
options:
  - The broker may disclose the seller's motivation because it is not confidential information
  - The broker may disclose the seller's motivation only with the seller's written permission
  - The broker may not disclose the seller's motivation unless disclosure is otherwise required by
    statute or rule
  - The broker may disclose the seller's motivation after obtaining verbal consent from the seller
key: C
explanation: The rule prohibits disclosing the seller's motivation without the seller's permission,
  except when disclosure is otherwise required by statute or rule. Therefore, the broker may not
  disclose the motivation unless such an exception applies. The distractor that suggests written
  permission is sufficient omits the statutory exception, making it incorrect.
