stem: A broker's trust account records are inspected by the Commission without prior notice as part
  of a routine periodic review. Under N.C. Gen. Stat. § 93A-6(d), what authority allows the
  Commission to conduct this inspection?
options:
  - The Commission's power to inspect records periodically without prior notice
  - The Commission's authority to impose fines for recordkeeping violations
  - The Commission's right to require brokers to submit monthly trust account statements
  - The Commission's ability to suspend a license for inadequate record maintenance
key: A
explanation: The statute expressly permits the Commission to inspect a broker's records periodically
  without prior notice, and also when pertinent to a specific complaint. This directly authorizes
  the described routine inspection. The distractor about imposing fines is not cited in this
  subsection as an authority for conducting inspections.
