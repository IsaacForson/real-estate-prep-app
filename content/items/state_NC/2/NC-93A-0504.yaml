stem: A broker holds a deposit from a buyer that is disputed by the seller; the deposit is not a
  residential tenant security deposit. Under 21 NCAC 58A .0116(d), what must the broker do with the
  deposit while the dispute is unresolved?
options:
  - Retain the deposit in trust until release or court order
  - Deposit the disputed funds with the Clerk of Superior Court
  - Disburse the deposit to the claimant immediately
  - Return the deposit to the payer upon request
key: A
explanation: The rule requires the broker to retain the deposit in a trust or escrow account until a
  written release is obtained or a court orders disbursement. Therefore, retaining the deposit in
  trust until release or court order is correct. The distractor of disbursing the deposit to the
  claimant immediately violates the requirement to hold the deposit until the dispute is resolved.
