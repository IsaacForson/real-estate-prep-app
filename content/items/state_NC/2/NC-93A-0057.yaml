stem: A provisional real estate broker receives a commission payment directly from a buyer for
  assisting in the purchase of a property, without involving her broker-in-charge. Under N.C. Gen.
  Stat. § 93A-6(a)(5), what may the Commission do?
options:
  - The Commission may take disciplinary action against the broker.
  - The Commission may issue a warning but take no further action.
  - The Commission may require the broker to return the commission to the buyer.
  - The Commission may allow the broker to keep the commission if disclosed to the broker-in-charge.
key: A
explanation: The key is correct because § 93A-6(a)(5) prohibits provisional brokers from accepting
  commission from any person except the broker-in-charge or employing broker; violation subjects the
  broker to disciplinary action. The distractor about requiring return of commission is not
  specified in the statute as a remedy; the statute authorizes discipline.
citation:
  source: N.C. Gen. Stat. ch. 93A — N.C. General Statutes Chapter 93A - Real Estate License Law;
