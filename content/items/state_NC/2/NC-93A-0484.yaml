stem: Under 21 NCAC 58A .0118(a), what information must a broker's periodic statements to a property
  owners' association include?
options:
  - The association's meeting minutes and voting results from the last quarter
  - The list of all vendors and contract amounts for the fiscal year
  - The association's annual budget and reserve study requirements
  - The balance of association trust money and an accounting of receipts and disbursements
key: D
explanation: The rule requires statements to report the balance of association trust money and
  account for the trust money received and disbursed on behalf of the association. Distractor B
  mentions budget and reserve study, which is not required by the rule.
