stem: Under N.C. Gen. Stat. § 93A-6(a)(7), what constitutes grounds for disciplinary action?
options:
  - Failing to disclose representation of multiple parties to all parties involved.
  - Failing to account for or remit client funds within a reasonable time.
  - Failing to maintain trust account records as required by the Commission.
  - Failing to deliver a closing statement after the transaction is consummated.
key: B
explanation: The key is correct because § 93A-6(a)(7) specifically lists failing to account for or
  remit others' monies within a reasonable time as grounds for discipline. The most tempting
  distractor, failing to deliver a closing statement, is addressed under subsection (a)(14) and not
  the cited provision.
