stem: Under 21 NCAC 58A .0119(d), what must a broker do when representing a party in a transaction
  involving mineral and oil and gas rights?
options:
  - Provide the buyer with a copy of the Mineral and Oil and Gas Rights Mandatory Disclosure
    Statement before closing.
  - Inform each client of the client's rights and obligations under G.S. Chapter 47E.
  - Obtain written consent from both parties to act as a dual agent in the transaction.
  - Deposit any trust funds received into a separate escrow account for the property owners'
    association.
key: B
explanation: The broker must tell each client what rights and duties the client has under the North
  Carolina mineral and oil and gas statutes (G.S. Chapter 47E), as required by 21 NCAC 58A .0119(d).
  Supplying the mandatory disclosure statement to the buyer is required in a different subsection,
  not under (d).
