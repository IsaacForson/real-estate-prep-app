stem: A broker begins negotiating on behalf of both the buyer and the seller in the same sale, but
  neither party learns that the broker is also assisting the other side. Which outcome follows under
  N.C. Gen. Stat. § 93A-6(a)(4)?
options:
  - The buyer forfeits any earnest money already deposited
  - The broker's license is renewed without any Commission review
  - The Commission may discipline the broker for the dual role
  - The transaction becomes automatically void under contract law
key: C
explanation: Section 93A-6(a)(4) authorizes the Commission to discipline a licensee who acts for
  more than one party in a transaction without the knowledge of all parties for whom the licensee
  acts.
