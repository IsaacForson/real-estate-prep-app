stem: Under N.C. Gen. Stat. § 93A-3(a), for what reasons may the Governor remove a member of the
  North Carolina Real Estate Commission?
options:
  - For misconduct, incompetency, or willful neglect of duty
  - For failing to attend Commission meetings
  - For lacking a real estate license
  - For holding another state office without approval
key: A
explanation: N.C. Gen. Stat. § 93A‑3(a) provides that the Governor may remove any commission member
  for misconduct, incompetency, or willful neglect of duty. Thus removal is permitted only for those
  three reasons. Reasons such as failure to attend meetings, not holding a real estate license, or
  holding another state office without approval are not listed as grounds for removal.
