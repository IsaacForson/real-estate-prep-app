stem: A broker receives an earnest money check (non-currency) from a buyer on Tuesday in connection
  with a pending purchase offer. The offer is accepted on Wednesday. Under 21 NCAC 58A .0116(b)(3),
  by what date must the broker deposit the earnest money into a trust or escrow account?
options:
  - By the close of business on the third banking day following acceptance.
  - By the close of business on the same day as acceptance.
  - By the close of business on the third calendar day following acceptance.
  - By the close of business on the fifth calendar day following acceptance.
key: C
explanation: The rule requires earnest money paid by non‑currency means to be deposited no later
  than three days following acceptance of the offer. Thus the broker must deposit by the close of
  the third calendar day after acceptance. Using banking days is incorrect because the rule
  specifies calendar days for this exception.
citation:
  source: 21 NCAC 58A 0101–0120 — 21 N.C. Admin. Code 58A Section .0100 — General Brokerage (Rules
    .0101 to .0120; NC OAH compilation) .0116(b)(3)
  url: null
  quoted_text: >-
    Earnest money or tenant security deposits paid by means other than currency and received by a 

    broker in connection with a pending offer to purchase or lease shall be deposited in a trust or 

    escrow account no later than three days following acceptance of the offer to pu rchase or lease;
    the 

    date of acceptance of the offer or lease shall be set forth in the purchase or lease agreement
