stem: A provisional broker assists a buyer in purchasing a property and receives a commission check
  from her broker-in-charge. According to N.C. Gen. Stat. § 93A-6(a)(5), is this permissible?
options:
  - Yes, because the commission came from her broker-in-charge.
  - No, because provisional brokers may not accept commission.
  - Yes, only if the buyer also consents to the arrangement.
  - No, unless the broker-in-charge is also licensed as an attorney.
key: A
explanation: Under N.C. Gen. Stat. § 93A-6(a)(5), a provisional broker may accept commission from
  the broker‑in‑charge or the employing licensed broker. Therefore, receiving a commission check
  from the broker‑in‑charge is permissible. The option claiming that provisional brokers may never
  accept commission is incorrect because the statute allows such acceptance from the
  broker‑in‑charge. The option requiring the buyer’s consent adds a condition the statute does not
  impose. The option requiring the broker‑in‑charge to also be an attorney introduces a requirement
  that the statute does not contain.
citation:
  source: N.C. Gen. Stat. § 93A-6(a)(5)
  url: null
  quoted_text: Accepting a commission or valuable consideration as a real estate broker on provisional
    status for the performance of any of the acts specified in this Article or Article 4 of this
    Chapter, from any person except his or her broker-in-charge or licensed broker by whom he or she
    is employed.
