stem: A licensee tells a buyer that the seller will definitely accept an offer below the asking
  price, knowing the seller has not agreed to that price. Under N.C. Gen. Stat. § 93A-6(a)(2), what
  action may the Commission take?
options:
  - Taking disciplinary action for making false promises likely to influence, persuade, or induce.
  - Taking disciplinary action for commingling personal funds with clients' trust account funds.
  - Taking disciplinary action for failing to account for or remit client funds within a reasonable
    time.
  - Taking disciplinary action for acting for more than one party in a transaction without the
    knowledge of all parties.
key: A
explanation: Subsection (a)(2) of N.C. Gen. Stat. § 93A-6 prohibits making false promises that are
  likely to influence, persuade, or induce. Therefore, the Commission may take disciplinary action
  against a licensee who makes such a false promise.
