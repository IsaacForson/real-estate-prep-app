stem: A broker receives an earnest money check from a buyer and wants to use a preprinted offer form
  that does not include the name of the escrow agent. According to 21 NCAC 58A .0112(a), what must
  the broker do?
options:
  - The broker may use the form as is because the parties can fill in the escrow agent later
  - The broker may complete the preprinted form only after the parties authorize the omission
  - The broker may alter the preprinted form to add the escrow agent name before presenting it to
    the parties
  - The broker shall not use the preprinted form unless it already contains the escrow agent name
key: D
explanation: Under 21 NCAC 58A .0112(a), a broker must not use a preprinted offer or sales contract
  form unless the form already describes or specifically requires the entry of earnest money
  information, including the name of the escrow agent. Therefore the broker cannot use the form
  as‑is, cannot complete it after the parties agree to omit the escrow agent, and may not alter the
  form to add the escrow agent name unless the parties direct the change. The only permissible
  action is to refrain from using the form unless it already contains the escrow agent name.
