stem: Under N.C. Gen. Stat. § 93A-6(a)(7), what constitutes grounds for disciplinary action
  concerning a licensee’s handling of client funds?
options:
  - Failing to involve the broker-in-charge when accepting a commission directly from a client
  - Failing to obtain the knowledge of all parties before representing both buyer and seller in a
    transaction
  - Failing, within a reasonable time, to account for or remit any monies coming into the licensee's
    possession which belong to others
  - Failing to disclose a dual agency arrangement to all parties involved in a transaction
key: C
explanation: The rule explicitly lists failing, within a reasonable time, to account for or remit
  client monies as grounds for disciplinary action. The most tempting distractor, failing to
  disclose a dual agency arrangement, is not covered by this subsection but by other provisions.
