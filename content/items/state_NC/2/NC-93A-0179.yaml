stem: According to N.C. Gen. Stat. § 93A-3(a), what is the minimum number of Commission members who
  must be persons **NOT** involved directly or indirectly in the real estate or real estate
  appraisal business?
options:
  - Four members
  - Two members
  - One member
  - Three members
key: B
explanation: The statute explicitly states that at least two Commission members must be persons who
  are not involved directly or indirectly in the real estate or real estate appraisal business. The
  option "Three members" incorrectly raises the minimum, while the text only requires a minimum of
  two such members.
