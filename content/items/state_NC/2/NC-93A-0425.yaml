stem: A licensee receives earnest money from a buyer on Monday and does not account for or remit the
  funds to the broker-in-charge until the following Monday. Under N.C. Gen. Stat. § 93A-6(a)(7),
  what action may the Commission take?
options:
  - May impose a monetary fine of five hundred dollars for the delay
  - May issue a written warning only if the funds are eventually returned to the client
  - May require the licensee to complete additional continuing education hours
  - May take action for failing to account for client funds within a reasonable time
key: D
explanation: The statute authorizes the Commission to take disciplinary action when a licensee fails
  within a reasonable time to account for or remit client funds. The distractor suggesting a warning
  only if funds are returned adds a condition not present in the rule.
