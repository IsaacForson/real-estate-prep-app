stem: A property owner requests a copy of a lease agreement on April 10. Under 21 NCAC 58A .0106(c),
  by what date must the broker deliver the copy to the owner?
options:
  - April 14
  - April 15
  - April 10
  - April 12
key: B
explanation: The rule states that upon request, the broker must deliver a copy of the lease or
  rental agreement within five days. Adding five days to April 10 yields April 15. The distractor
  "April 14" is wrong because it adds only four days, which does not satisfy the five‑day
  requirement.
citation:
  source: 21 NCAC 58A .0101–0120 — 21 N.C. Admin. Code 58A Section .0100 — General Brokerage (Rules
    .0101 to .0120; NC OAH compilation).0106(c)
  url: null
  quoted_text: Paragraph (b) of this Rule notwithstanding, upon the request of a property owner, a
    broker shall deliver a copy of any lease or rental agreement within five days.
