stem: Under N.C. Gen. Stat. § 93A-6(a)(1), what constitutes grounds for disciplinary action?
options:
  - Failing, within a reasonable time, to account for or to remit any monies coming into his or her
    possession which belong to others.
  - Making any willful or negligent misrepresentation or any willful or negligent omission of
    material fact.
  - Acting for more than one party in a transaction without the knowledge of all parties for whom he
    or she acts.
  - Making any false promises of a character likely to influence, persuade, or induce.
key: B
explanation: The statute explicitly lists making a willful or negligent misrepresentation or
  omission of material fact as a ground for disciplinary action under subsection (a)(1). The most
  tempting distractor, making false promises, is also a ground but appears in subsection (a)(2) and
  does not match the specific language asked for.
