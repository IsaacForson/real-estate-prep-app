stem: A Commission member is found to have engaged in willful neglect of duty. Under N.C. Gen. Stat.
  § 93A-3(a), what action may the Governor take?
options:
  - The Governor may fine the member for the neglect
  - The Governor may remove the member from the Commission
  - The Governor may require the member to attend additional training
  - The Governor may refer the member to the Attorney General for prosecution
key: B
explanation: Under N.C. Gen. Stat. § 93A-3(a), the Governor may remove a Commission member for
  willful neglect of duty. The correct answer reflects this authority. The other options describe
  actions that the statute does not authorize the Governor to take.
