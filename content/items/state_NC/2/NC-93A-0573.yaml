stem: A broker who owns 20 percent of a commercial property wishes to represent a buyer in the sale
  of that property. According to 21 NCAC 58A .0101(o), what is required for the broker to represent
  the buyer?
options:
  - Less than 20 percent
  - Less than 25 percent
  - Less than 10 percent
  - Less than 30 percent
key: B
explanation: The rule allows a broker to represent a buyer only if the broker's ownership interest
  in the commercial property is less than 25 percent and the buyer consents after full written
  disclosure. Therefore, the broker must have less than 25 percent interest. The distractor "Less
  than 20 percent" is incorrect because the threshold is 25 percent, not 20 percent.
