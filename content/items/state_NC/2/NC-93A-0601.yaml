stem: A licensee closes a residential sale but fails to deliver to the client a detailed and
  accurate closing statement showing the receipt and disbursement of all monies relating to the
  transaction. Under N.C. Gen. Stat. § 93A-6(a)(14), what action may the Commission take?
options:
  - May impose a monetary fine not exceeding $500
  - May issue a written warning to the licensee
  - May take disciplinary action against the licensee
  - May require the licensee to complete extra education
key: C
explanation: The statute states that failing, at the time a sales transaction is consummated, to
  deliver to the broker's client a detailed and accurate closing statement showing receipt and
  disbursement of all monies is grounds for disciplinary action. Therefore, the Commission may take
  disciplinary action. The other options are possible sanctions but are not specified in this
  provision.
