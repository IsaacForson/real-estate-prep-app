stem: A broker who is a property owner in a residential subdivision serves as an unpaid officer of
  the subdivision's property owners' association and collects association dues. Under 21 NCAC 58A
  .0118(b), which action remains prohibited for the broker?
options:
  - Keeping separate records of the association's trust money
  - Depositing the dues into a trust account dedicated exclusively for the association
  - Using the association dues to pay the broker's personal expenses
  - Providing the association with a statement of receipts and disbursements every 90 days
key: C
explanation: Under 21 NCAC 58A .0118(b), a broker who serves as an unpaid officer of a subdivision’s
  property owners’ association may keep separate records, deposit dues in a trust account for the
  association, and provide regular statements of receipts and disbursements, but the broker may not
  use the association’s dues to pay personal expenses or otherwise convert the association’s trust
  money to personal use.
citation:
