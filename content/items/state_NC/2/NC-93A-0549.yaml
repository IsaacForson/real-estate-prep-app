stem: The North Carolina Real Estate Commission is considering a rule that would set a standard
  commission rate for all residential sales. Under N.C. Gen. Stat. § 93A-3(c), what is the correct
  statement regarding the Commission's authority to adopt such a rule?
options:
  - The Commission may not adopt the rule as it would regulate commissions charged by licensees.
  - The Commission may adopt the rule if it applies only to commercial transactions.
  - The Commission may adopt the rule because it has general rulemaking authority.
  - The Commission may adopt the rule only after obtaining approval from the Governor.
key: A
explanation: Under N.C. Gen. Stat. § 93A-3(c), the Commission shall not make rules or regulations
  regulating commissions, salaries, or fees to be charged by licensees. Therefore, the Commission
  lacks authority to adopt a rule setting a standard commission rate.
