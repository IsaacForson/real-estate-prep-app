stem: A broker manages a property owners' association and receives compensation for this service.
  Under 21 NCAC 58A .0118(a), what is the minimum frequency at which the broker must provide
  periodic statements to the association?
options:
  - Statements must be provided every 90 days.
  - Statements must be provided every 60 days.
  - Statements must be provided every 180 days.
  - Statements must be provided every 30 days.
key: A
explanation: The rule states that statements must be made not less frequently than every 90 days,
  meaning at least once every 90 days. The distractor suggesting every 30 days imposes a stricter
  frequency than required, while every 180 days would violate the minimum.
