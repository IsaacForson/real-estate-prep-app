stem: A brokerage firm represents both the buyer and the seller in a residential sale. Under 21 NCAC
  58A .0104(i), what must the firm do?
options:
  - The firm must submit a dual agency notice to the Real Estate Commission
  - The firm must provide the Working with Real Estate Agents publication to the buyer
  - The firm must obtain written consent from both the buyer and seller
  - The firm must disclose its dual agency to the parties
key: D
explanation: The rule states that a firm representing more than one party in the same transaction is
  a dual agent and must disclose its dual agency to the parties. Obtaining written consent is not
  required by.0104(i); that requirement appears elsewhere in the dual agency provisions.
