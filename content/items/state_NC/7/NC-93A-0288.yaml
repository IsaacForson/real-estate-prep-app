stem: A broker who has obtained the property owner's prior written authority to retain copies of
  lease agreements receives a request from the owner for a copy of a lease. According to 21 NCAC 58A
  .0106, within how many days must the broker deliver the copy?
options:
  - Three days
  - Five days
  - Seven days
  - Ten days
key: B
explanation: Paragraph (c) of the rule states that, notwithstanding any prior authority, a broker
  must deliver a copy of a lease or rental agreement within five days of a property owner's request.
citation:
  source: 21 NCAC 58A 0101–0120 — 21 N.C. Admin. Code 58A Section .0100 — General Brokerage (Rules
    .0101 to .0120; NC OAH compilation) .0106(c)
  url: null
  quoted_text: Paragraph (b) of this Rule notwithstanding, upon the request of a property owner, a
    broker shall deliver a copy of any lease or rental agreement within five days.
