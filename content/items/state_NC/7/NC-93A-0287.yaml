stem: Under 21 NCAC 58A .0106(a), within how many days must a broker deliver a copy of a written
  agency agreement to a client after receiving the executed document?
options:
  - Three days
  - Five days
  - Seven days
  - Ten days
key: A
explanation: The rule requires delivery within three days of receipt of the executed document. The
  five‑day period applies only when a property owner requests a copy of a lease or rental agreement.
citation:
  source: 21 NCAC 58A 0101–0120 — 21 N.C. Admin. Code 58A Section .0100 — General Brokerage (Rules
    .0101 to .0120; NC OAH compilation) .0106(a)
  url: null
  quoted_text: Except as provided in Paragraph (b) of this Rule, every broker shall deliver a copy of
    any written agency agreement, contract, offer, lease, rental agreement, option, or other related
    transaction document to their customer or client within three days of the broker's receipt of
    the executed document.
