stem: A broker's agency agreement for a rental transaction terminates six months before all funds
  are disbursed to the parties. Under 21 NCAC 58A .0108(a), how long must the broker retain records
  related to this transaction?
options:
  - Three years after earlier of termination or disbursement
  - Three years after the agency agreement terminates
  - Three years after later of termination or disbursement
  - Three years after all funds are disbursed
key: C
explanation: The rule requires retention for three years after the later of funds disbursement or
  agency agreement termination. Since funds are disbursed later, the three‑year period runs from
  that date.
citation:
  source: 21 NCAC 58A 0101–0120 — 21 N.C. Admin. Code 58A Section .0100 — General Brokerage (Rules
    .0101 to .0120; NC OAH compilation) .0108(a)
  url: null
  quoted_text: The broker shall retain records for three years after all funds held by the broker in
    connection with the transaction have been disbursed to the proper party or parties or the
    conclusion of the transaction, whichever occurs later.
