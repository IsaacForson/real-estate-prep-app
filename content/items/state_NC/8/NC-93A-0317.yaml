stem: Under North Carolina Real Estate Education and Recovery Fund rules, when may the Commission
  **NOT** spend money from the fund for educational purposes?
options:
  - The Commission may not use fund money for educational purposes if the expenditure would reduce
    the balance below $25,000.
  - The Commission may not use fund money for educational purposes if the expenditure would reduce
    the balance below $50,000.
  - The Commission may not use fund money for educational purposes if the expenditure would reduce
    the balance below $100,000.
  - The Commission may not use fund money for educational purposes if the expenditure would reduce
    the balance below $200,000.
key: D
explanation: The statute provides that the Commission shall make no expenditures from the fund for
  educational purposes if the expenditure will reduce the balance below two hundred thousand dollars
  ($200,000). Therefore, spending is prohibited when it would drop the fund under $200,000. The
  distractor citing $100,000 incorrectly lowers the threshold; the rule sets the floor at $200,000.
citation:
  source: N.C. Gen. Stat. ch. 93A — N.C. General Statutes Chapter 93A - Real Estate License Law;
