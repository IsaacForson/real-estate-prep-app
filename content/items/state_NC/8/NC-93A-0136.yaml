stem: Under North Carolina administrative rules governing brokerage fees and compensation, what does
  the term 'nominal value' mean?
options:
  - Any amount under five dollars in value.
  - Of insignificant, token, or merely symbolic worth.
  - A fee not exceeding one percent of the transaction price.
  - A refundable deposit returned at closing.
key: B
explanation: The rule defines nominal value as 'of insignificant, token, or merely symbolic worth.'
  This definition is found in 21 NCAC 58A.0109(e). The distractor that ties nominal value to a
  specific dollar amount is incorrect because the rule does not set any monetary threshold.
