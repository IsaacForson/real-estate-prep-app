stem: A licensee’s judgment was obtained after a full trial on the merits. Under §93A-19(b) of the
  North Carolina Real Estate License Law, what effect does this judgment have regarding the
  conversion of trust funds in a recovery fund proceeding?
options:
  - It creates a rebuttable presumption of conversion of trust funds
  - It establishes conclusive proof of conversion of trust funds
  - It shifts the burden of producing evidence to the Commission
  - It requires the applicant to prove conversion of trust funds beyond a reasonable doubt
key: A
explanation: If the judgment is not obtained by default, stipulation, consent, or via a trustee in
  bankruptcy, the statute creates a rebuttable presumption of conversion of trust funds, affecting
  the burden of producing evidence. The other options incorrectly describe the effect as conclusive,
  shifting burden to the Commission, or requiring a criminal standard of proof.
