stem: An aggrieved person who is the spouse of a judgment debtor applies for payment from the Real
  Estate Education and Recovery Fund within eight months after the judgment becomes final, having
  satisfied all other requirements of §93A-18. According to §93A-18(1), is the applicant eligible
  for a hearing?
options:
  - Yes, because the one‑year time limit has not been exceeded.
  - No, because the applicant has not diligently pursued remedies.
  - No, because the applicant is the spouse of the judgment debtor.
  - Yes, because the applicant has made reasonable searches for assets.
key: C
explanation: Under §93A-18(1), an applicant must show they are not a spouse of the judgment debtor
  or a person representing the spouse; being the spouse disqualifies the applicant regardless of
  other compliance. The distractor that focuses on the one‑year time limit is incorrect because
  satisfying the time limit does not overcome the spouse prohibition.
