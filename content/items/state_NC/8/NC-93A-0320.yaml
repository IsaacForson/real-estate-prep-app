stem: Under §93A-18 of the North Carolina Real Estate License Law, what must an aggrieved person
  demonstrate regarding the timing of an application for payment from the Real Estate Education and
  Recovery Fund?
options:
  - That the application is made after the judgment debtor has received a discharge in bankruptcy
    proceedings under federal law
  - That the application is made only after the judgment debtor has been formally notified of the
    hearing under Commission rules
  - That the application is made not more than one year after termination of all judicial
    proceedings, including appeals, in connection with the judgment
  - That the application is made within six months of the date the judgment becomes final and
    enforceable under North Carolina law
key: C
explanation: The statute requires the aggrieved person to show that the application is made not more
  than one year after termination of all judicial proceedings, including appeals, in connection with
  the judgment. The other options alter the time frame or add conditions not required by the
  provision.
