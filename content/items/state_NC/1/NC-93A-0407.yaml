stem: According to 21 NCAC 58A .0101(a), what must a broker retain as evidence of licensure?
options:
  - The pocket card issued by the Commission annually
  - The broker's license certificate displayed in the office
  - The firm's trade name registration
  - The written request for a duplicate license
key: A
explanation: The rule explicitly states that the pocket card issued annually by the Commission must
  be retained by the broker as evidence of licensure. The distractor about displaying the license
  certificate confuses retention with the display requirement in.0101(b), which applies to the
  firm's office, not the broker's personal evidence.
