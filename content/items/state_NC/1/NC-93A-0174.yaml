stem: Under 21 NCAC 58A .1802(1)(a), which of the following uses qualifies a property as commercial
  real estate for the purpose of limited nonresident commercial licensing?
options:
  - A multifamily building with four units
  - A personal vehicle used for transport
  - A warehouse used for storage facility
  - A single-family residence with offices
key: C
explanation: The rule defines commercial real estate as property lawfully used primarily for sales,
  office, research, institutional, warehouse, manufacturing, industrial or mining purposes, or for
  multifamily residential purposes involving five or more dwelling units. A warehouse used for
  storage satisfies the warehouse use criterion. The single-family residence with offices does not
  meet the primary use requirement, the multifamily building with only four units falls short of the
  five-unit threshold, and a personal vehicle is not real property.
