stem: What is the maximum amount the North Carolina Real Estate Commission may set for the real
  estate broker application fee by rule?
options:
  - One hundred twenty dollars ($120.00)
  - One hundred thirty dollars ($130.00)
  - One hundred dollars ($100.00)
  - One hundred ten dollars ($110.00)
key: A
explanation: The statute states that the application fee is $100 unless the Commission sets a higher
  amount by rule, but the Commission may not exceed $120. Therefore the maximum permissible fee is
  $120. The $130 option exceeds the statutory cap and is incorrect.
