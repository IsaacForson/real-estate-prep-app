stem: A provisional broker who receives a license on March 1, 2024, must complete the required
  90‑hour postlicensing education within 18 months to avoid inactive status. If the broker fails to
  meet this requirement, on what date will the license be placed on inactive status?
options:
  - September 1, 2025
  - August 31, 2025
  - October 1, 2025
  - September 1, 2024
key: A
explanation: A provisional broker must complete the 90‑hour postlicensing education within 18 months
  of initial licensure; failure to do so results in the license being placed on inactive status at
  the end of that period. Adding 18 months to a March 1, 2024, license date yields September 1,
  2025. The other dates represent miscalculations of the 18‑month window.
