stem: A broker receives a license on August 15, 2024. Assuming the Commission has not set a
  different expiration date, what is the license expiration date under N.C. Gen. Stat. § 93A-4(c)?
options:
  - June 30, 2025
  - May 31, 2025
  - June 30, 2024
  - July 31, 2025
key: A
explanation: The statute provides that licenses expire on the June 30 following issuance unless the
  Commission sets another date. A license issued August 15, 2024 therefore expires June 30, 2025.
  The June 30, 2024 distractor incorrectly uses the same year as issuance, ignoring the 'following
  issuance' rule.
