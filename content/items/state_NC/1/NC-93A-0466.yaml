stem: A qualifying broker changes the broker‑in‑charge at the firm’s main office. According to 21
  NCAC 58A .0502(g)(6), what action must the qualifying broker take regarding the firm’s trust
  account records?
options:
  - Retain the trust account records only if the firm’s trust account balance exceeds $5,000 and the
    qualifying broker provides written consent.
  - Destroy the trust account records after 30 days unless the new broker‑in‑charge requests them in
    writing within ten days.
  - Secure and preserve trust account records and notify the Commission if they are out of balance
    or not reconciled per Rule .0117.
  - Submit the trust account records to the Commission within 10 days of the change and retain a
    copy for three years as required by Rule .0108.
key: C
explanation: The rule requires the qualifying broker to secure and preserve the firm's trust account
  records and to notify the Commission if those records are out of balance or not reconciled when a
  broker‑in‑charge changes, per Rule .0117. The correct option states that action. The other options
  either add conditions not in the rule, suggest destruction or submission timelines that are not
  required, or misstate the retention period.
