stem: A provisional broker who was issued a license on January 10, 2023, fails to complete the
  required 90‑hour postlicensing education by January 10, 2025. What is the status of the broker's
  license under N.C. Gen. Stat. § 93A-4(a1)?
options:
  - Revoked
  - Suspended
  - Active
  - Inactive
key: D
explanation: The law states that a provisional broker who does not finish the 90‑hour postlicensing
  requirement within 18 months of licensure must have the license placed on inactive status. Since
  the broker missed the deadline, the license becomes inactive, not active or subject to revocation.
  The 'Revoked' distractor is incorrect because revocation requires disciplinary action, not merely
  failure to complete education.
