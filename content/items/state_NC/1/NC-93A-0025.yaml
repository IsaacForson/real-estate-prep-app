stem: A broker's license expires on June 30, 2024. On May 1, 2024, the broker submits a renewal
  application and pays the $45 renewal fee. Is the renewal timely under North Carolina law?
options:
  - The renewal is timely because it was submitted within the 45-day window before expiration.
  - The renewal is timely because it was submitted more than 45 days before expiration.
  - The renewal is not timely because it was submitted within the 45-day window before expiration.
  - The renewal is not timely because it was submitted more than 45 days before expiration.
key: D
explanation: Under N.C. Gen. Stat. § 93A-4(c), a license may be renewed starting 45 days before its
  expiration date. Submitting a renewal earlier than that 45‑day window is not permitted. May 1,
  2024 is 60 days before June 30, 2024, which is outside the allowed period, so the renewal is not
  timely. The statement that the renewal is timely because it was submitted within the 45‑day window
  before expiration is incorrect because the submission occurred earlier than the permitted window.
citation:
