    ncleg.gov PDF, Internet Archive capture 2026-04-19 — § 93A-4(c)
  url: null
  quoted_text: A license may be renewed 45 days prior to the expiration date by filing an application
    with and paying to the Executive Director of the Commission the license renewal fee.
  secondary: []
math:
  worked_solution: Calculate the number of days between May 1, 2024 and June 30, 2024. May has 31
    days, so days remaining in May after May 1 = 31 - 1 = 30 days. Add the full month of June (30
    days). Total = 30 + 30 = 60 days.
  formulas:
    - Date difference = (Expiration date - Submission date)
