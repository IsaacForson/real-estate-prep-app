stem: Under N.C. Gen. Stat. § 93A-4(a2), what fee must a certified real estate education provider
  pay to the Commission for each licensee completing a postlicensing education course conducted by
  the school?
options:
  - $15.00
  - $20.00
  - $5.00
  - $10.00
key: D
explanation: The statute requires a certified real estate education provider to pay a fee of ten
  dollars ($10.00) to the Commission for each licensee who completes a postlicensing education
  course conducted by the school. This fee is specified in subsection (a2) of § 93A-4. The $5.00
  amount applies to duplicate license fees, not provider fees.
