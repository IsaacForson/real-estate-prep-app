stem: Under North Carolina administrative code, what must a provisional broker do to engage in
  licensed real estate activities?
options:
  - Complete postlicensing education within six months.
  - Submit a license activation form to the Commission.
  - Hold an active license and be supervised by a broker-in-charge.
  - Obtain a written acknowledgment from the Commission.
key: C
explanation: Under 21 NCAC 58A.0506(a) a provisional broker may engage in licensed activities only
  while the license is on active status and the broker is supervised by a broker‑in‑charge. Holding
  an active license and being supervised therefore satisfies the requirement. Submitting a license
  activation form to the Commission does not by itself grant authority because supervision and
  active status are still required. Completing post‑licensing education or obtaining a written
  acknowledgment from the Commission are also insufficient conditions.
citation:
  source: "### 21 NCAC 58A 0501–0616 — 21 N.C. Admin. Code 58A Section .0500 — Licensing (Rules .0501
    to .0616; NC OAH compilation) 21 NCAC 58A .0506(a)"
  url: null
  quoted_text: >-
    A provisional broker may engage in or hold himself or herself out as engaging in activities
    requiring a real estate 

    license only while his or her license is on active status pursuant to Rule .0504 of this Section
    and he or she is 

    supervised by the bro ker-in-charge of the real estate firm or office with which the provisional
    broker is affiliated
