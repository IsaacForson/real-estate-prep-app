stem: What is the base application fee for a real estate broker license in North Carolina unless the
  Commission sets a higher amount by rule?
options:
  - The base application fee is one hundred dollars ($100.00).
  - The base application fee is one hundred twenty dollars ($120.00).
  - The base application fee is forty-five dollars ($45.00).
  - The base application fee is sixty dollars ($60.00).
key: A
explanation: The statute provides that the application fee shall be one hundred dollars ($100.00)
  unless the Commission sets a higher amount by rule, and the Commission may not set a fee that
  exceeds one hundred twenty dollars ($120.00). Thus the default fee is $100. The choice stating the
  fee is one hundred twenty dollars treats the maximum allowable fee as the base fee, which is
  incorrect.
