stem: A person who receives a real estate broker license in North Carolina on May 1, 2024, will
  initially be classified as what?
options:
  - Provisional broker
  - Broker-in-charge
  - Active broker
  - Inactive broker
key: A
explanation: Under § 93A-4(a1), anyone issued a broker license on or after April 1, 2006 is
  initially classified as a provisional broker. This status remains until the required 90‑hour
  postlicensing education is completed. Therefore, a licensee licensed in May 2024 starts as a
  provisional broker.
