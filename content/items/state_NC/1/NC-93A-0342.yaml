stem: Under N.C. Gen. Stat. § 93A-4(b), how is a criminal record report submitted by an applicant
  for a real estate broker license treated with respect to public records under Chapter 132 of the
  General Statutes?
options:
  - No, it is not considered a public record.
  - Only if the license is renewed.
  - Yes, it is considered a public record.
  - Only if the applicant fails the exam.
key: A
explanation: The statute explicitly states that criminal record reports obtained in connection with
  the application process are not considered public records under Chapter 132. Therefore, such a
  report remains confidential and is not subject to public‑record disclosure. The option stating it
  is a public record contradicts this provision.
