stem: Under N.C. Gen. Stat. § 93A-3(c), the Commission is prohibited from making rules or
  regulations that regulate which of the following?
options:
  - Regulating commissions, salaries, or fees to be charged by licensees
  - Regulating minimum education requirements for license applicants
  - Regulating broker-in-charge qualifications and supervisory duties
  - Regulating fees for Commission publications and educational materials
key: A
explanation: Under N.C. Gen. Stat. § 93A-3(c), the Commission may not make rules regulating
  commissions, salaries, or fees charged by licensees. Therefore, the option stating that the
  Commission may not regulate commissions, salaries, or fees to be charged by licensees correctly
  identifies the prohibited subject. The option about minimum education requirements is incorrect
  because the statute does not prohibit the Commission from setting such requirements; it may
  regulate education as part of its licensing functions. The option concerning broker-in-charge
  qualifications and supervisory duties is incorrect because the statute does not forbid the
  Commission from regulating those matters. The option regarding fees for Commission publications
  and educational materials is incorrect because the statute does not prohibit the Commission from
  setting fees for its own publications and materials.
