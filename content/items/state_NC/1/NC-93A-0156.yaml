stem: A provisional broker who was licensed on January 15, 2023, must complete the required 90‑hour
  postlicensing education program by what date to avoid having the license placed on inactive
  status?
options:
  - January 15, 2025
  - July 15, 2025
  - January 15, 2024
  - July 15, 2024
key: D
explanation: The statute requires provisional brokers to finish the 90‑hour postlicensing education
  within 18 months of initial licensure. Eighteen months after January 15, 2023 is July 15, 2024.
  Failure to meet this deadline results in the license being placed on inactive status.
