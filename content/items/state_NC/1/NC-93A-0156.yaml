  url: null
  quoted_text: Each person who is issued a real estate broker license on or after April 1, 2006, shall
    initially be classified as a provisional broker and shall, within 18 months following initial
    licensure, satisfactorily complete, through a real estate education provider certified by the
    Commission, a postlicensing education program consisting of 90 hours of instruction
