stem: Under N.C. Gen. Stat. § 93A-2(a), which of the following activities, when performed for
  compensation, is included in the definition of a real estate broker?
options:
  - Conducting an auction of real estate for a fee.
  - Providing property appraisal services for a fee.
  - Offering legal advice on real estate transactions for a fee.
  - Arranging mortgage loans for real estate purchases for a fee.
key: A
explanation: The statute defines a broker as anyone who, for compensation, auctions or offers to
  auction real estate (excluding a mere crier of sales). Therefore, conducting an auction of real
  estate for a fee meets this definition. Providing appraisal, legal advice, or mortgage loan
  origination services are not listed as broker activities in the statute.
