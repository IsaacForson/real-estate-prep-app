stem: Maria owns her personal residence and decides to sell it without hiring a real estate broker.
  Under N.C. Gen. Stat. § 93A-2(c)(7), is Maria required to hold a real estate broker license to
  conduct the sale?
options:
  - Maria must obtain a broker license from the North Carolina Real Estate Commission before listing
    the property for sale.
  - Maria is exempt from licensure under the owner‑exemption because she is personally selling her
    own property.
  - Maria must hold a provisional broker license and be supervised by a broker‑in‑charge to complete
    the sale.
  - Maria may only sell the property if she acts under the supervision of a licensed
    broker‑in‑charge.
key: B
explanation: Section 93A-2(c)(7) exempts any individual owner who personally leases or sells the
  owner's own property from licensure. Maria, as the owner selling her own property, falls under
  this exemption and does not need a license. The other options incorrectly impose licensing
  requirements that the statute does not apply to owners selling their own property.
