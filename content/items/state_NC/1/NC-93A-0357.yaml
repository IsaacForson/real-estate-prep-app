stem: John holds a durable power of attorney from his aunt, authorizing him to sell her beach condo.
  John proceeds to market the property, negotiate the price, and execute the deed on her behalf.
  Under N.C. Gen. Stat. § 93A-2(c)(2), is John required to have a real estate broker license to
  perform these acts?
options:
  - John must obtain a broker license from the Commission before he can negotiate the sale of the
    beach condo.
  - John is exempt from licensure because he is acting under a duly executed power of attorney from
    the owner.
  - John must hold a provisional broker license and be supervised by a broker‑in‑charge to complete
    the transaction.
  - John may perform these acts if he is a licensed attorney admitted to the North Carolina State
    Bar.
key: B
explanation: Section 93A-2(c)(2) exempts any person acting as an attorney-in-fact under a duly
  executed power of attorney from the owner authorizing the final consummation of a real estate
  contract. John, acting under such a power of attorney, is exempt from licensure. The other options
  incorrectly impose licensing or supervision requirements that do not apply to this exemption.
citation:
  source: N.C. Gen. Stat. ch. 93A — N.C. General Statutes Chapter 93A - Real Estate License Law;
