stem: A provisional broker was issued a license on January 10, 2024. As of July 11, 2025, the broker
  has not completed the required 90-hour postlicensing education. What is the status of the broker's
  license?
options:
  - The broker's license will be placed on inactive status.
  - The broker's license will stay active as a provisional broker.
  - The broker's license will be automatically renewed.
  - The broker's license will be cancelled.
key: A
explanation: Under N.C. Gen. Stat. § 93A‑4(a)(1), a provisional broker who does not finish the
  required 90‑hour postlicensing education within 18 months must have the license placed on inactive
  status. Because July 11, 2025 is beyond the 18‑month window from the January 10, 2024 issuance,
  the license becomes inactive. A statement that the license will be cancelled is incorrect because
  cancellation occurs only after six months of failure to seek reinstatement, not immediately. The
  license does not remain active with a provisional designation, and it is not automatically
  renewed.
