stem: What is the base license renewal fee for a real estate broker license in North Carolina unless
  the Commission sets a higher amount by rule?
options:
  - $50.00
  - $55.00
  - $45.00
  - $60.00
key: C
explanation: The statute sets the base renewal fee at forty‑five dollars ($45.00) unless the
  Commission raises it by rule, but it may not exceed sixty dollars. Therefore $45.00 is the correct
  base amount. The $55.00 distractor incorrectly assumes a midpoint between the base and the
  statutory maximum.
