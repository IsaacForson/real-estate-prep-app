stem: Under N.C. Gen. Stat. § 93A-3, who appoints the Commission member that is selected upon the
  recommendation of the Speaker of the House of Representatives?
options:
  - The Attorney General.
  - The General Assembly.
  - The Governor of NC.
  - The Senate President.
key: B
explanation: The statute provides that one member is appointed by the General Assembly upon the
  recommendation of the Speaker of the House of Representatives, making the General Assembly the
  appointing authority. The option “The Governor of NC.” is incorrect because the Governor appoints
  the seven other members, not this specific seat.
