  url: null
  quoted_text: The term broker-in-charge within the meaning of this Chapter means a real estate broker
    who has been designated as the broker having responsibility for the supervision of brokers on
    provisional status engaged in real estate brokerage at a particular real estate office and for
    other administrative and supervisory duties as the Commission shall prescribe by rule.
