stem: According to N.C. Gen. Stat. § 93A-2(a1), what is the role of a broker‑in‑charge?
options:
  - A broker who exclusively lists and sells properties for clients and provides market analysis to
    buyers and sellers.
  - A broker who owns the real estate office and employs all licensees and handles day‑to‑day
    operations.
  - A broker who manages the escrow accounts for all transactions at the office and ensures
    compliance with trust account rules.
  - A broker who supervises provisional brokers and performs administrative and supervisory duties
    as prescribed by the Commission.
key: D
explanation: The statute defines a broker‑in‑charge as a real estate broker designated to supervise
  brokers on provisional status and to carry out other administrative and supervisory duties that
  the Commission may prescribe. The answer that describes a broker who supervises provisional
  brokers and performs administrative and supervisory duties as prescribed by the Commission matches
  that definition. The other choices describe activities such as exclusive listing, office
  ownership, or escrow management, which are not part of the statutory definition.
citation:
