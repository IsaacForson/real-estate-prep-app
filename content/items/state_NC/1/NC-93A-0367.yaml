stem: Under 21 NCAC 58A .0507, what is the consequence if a check submitted to the Commission for
  fees is returned unpaid?
options:
  - It requires the licensee to submit a new application within thirty days
  - It triggers an automatic renewal of the license for one year
  - It results in a fine of fifty dollars payable to the Commission
  - It is considered cause for license denial, suspension, or revocation
key: D
explanation: The rule states that checks, credit cards, and other forms of payment given the
  Commission for fees due which are returned unpaid shall be considered cause for license denial,
  suspension, or revocation. The distractor about a fine of fifty dollars is incorrect because the
  rule does not specify a monetary penalty for returned payments.
