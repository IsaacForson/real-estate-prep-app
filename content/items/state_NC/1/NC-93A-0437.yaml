stem: An LLC converts to a corporation on May 12. By what date must the entity provide the required
  information to the Commission in writing, as mandated by 21 NCAC 58A .0502(b)?
options:
  - May 22
  - May 17
  - May 31
  - May 12
key: A
explanation: The rule states that after a business form change not described in G.S. 55 Article 11A,
  the entity must provide the required information in writing to the Commission within 10 days of
  the conversion. Adding ten days to May 12 yields May 22 as the deadline. The distractor of May 17
  is incorrect because it reflects only a five‑day interval, which falls short of the ten‑day
  obligation.
