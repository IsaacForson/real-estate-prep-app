stem: Under 21 NCAC 58A .0105(i), which of the following will cause a broker's BIC Eligible status
  to terminate?
options:
  - Timely renewal of the broker license pursuant to Rule .0503 of this Subchapter.
  - Completion of the Broker-in-Charge Update Course and a four credit hour elective course.
  - Accurate statements made in the BIC Eligible status application.
  - Failure to complete the 12-hour Broker-in-Charge Course pursuant to Paragraph (e) of this Rule.
key: D
explanation: The rule states that a broker's BIC Eligible status terminates if the broker fails to
  complete the 12-hour Broker-in-Charge Course pursuant to Paragraph (e) of this Rule. The
  distractor describing completion of the Update Course and elective course is incorrect because
  fulfilling those requirements maintains, rather than terminates, eligibility.
