stem: A broker's sales transaction closes and all funds held in connection with it are disbursed on
  that same day. Under 21 NCAC 58A .0108(a), how long must the broker retain records of that
  transaction?
options:
  - One year from the date the listing agreement expired
  - Until the buyer sells the property to someone else
  - Three years from the date the funds were disbursed
  - Six months from the date the offer was accepted
key: C
explanation: Rule.0108(a) requires a broker to retain transaction records for three years after all
  funds held in connection with the transaction have been disbursed or the transaction concluded,
  whichever is later.
citation:
  source: 21 NCAC 58A Rule .0108(a)
  url: null
  quoted_text: The broker shall retain records for three years after all funds held by the broker in
    connection with the transaction have been disbursed to the proper party or parties or the
    conclusion of the transaction, whichever occurs later.
