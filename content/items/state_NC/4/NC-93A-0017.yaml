stem: A broker is selecting a preprinted sales contract form to use with a buyer and seller. Under
  21 NCAC 58A .0112(a), which item must the form describe or require the parties to enter?
options:
  - The names of the buyer and the seller
  - The buyer's employer and annual salary history
  - The listing broker's advertising budget for the property
  - The seller's original purchase price for the home
key: A
explanation: Rule.0112(a) lists required content for a preprinted offer or sales contract form,
  beginning with a requirement that the form describe or specifically require entry of the names of
  the buyer and seller.
citation:
  source: 21 NCAC 58A Rule .0112(a)
  url: null
  quoted_text: "A broker acting as an agent in a real estate transaction shall not use a preprinted
    offer or sales contract form unless the form describes or specifically requires the entry of the
    following information: (1) the names of the buyer and seller;"
