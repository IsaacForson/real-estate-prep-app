stem: A broker enters into an oral agreement with a property owner to list the owner's house for
  sale. Under 21 NCAC 58A .0104(a), what is required for this agreement to be enforceable?
options:
  - Reducing the agreement to writing and having both parties sign it after mutual consent
  - Reducing the agreement to writing and having only the broker sign it at the time of formation
  - Reducing the agreement to writing and having both parties sign it within three days
  - Reducing the agreement to writing and having both parties sign it at the time of formation
key: D
explanation: The rule mandates that every brokerage agreement between a broker and a property owner
  must be in writing and signed by the parties at the time of its formation. Merely signing within
  three days or only the broker signing does not meet this requirement, and an oral agreement is
  insufficient regardless of mutual consent.
citation:
  source: 21 NCAC 58A 0101–0120 — 21 N.C. Admin. Code 58A Section .0100 — General Brokerage (Rules
