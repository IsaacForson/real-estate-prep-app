stem: Under 21 NCAC 58A .0103(c), what must a broker do before advertising or operating under a name
  different from the name on the broker's license?
options:
  - Wait ninety days after a new pocket card is requested
  - Obtain a second broker license under the new name
  - Post notice of the name change at the courthouse
  - File an assumed name certificate with the Commission
key: D
explanation: Rule.0103(c) requires a broker who advertises or operates under an assumed name to
  first file an assumed name certificate and notify the Commission in writing of the use of that
  name.
