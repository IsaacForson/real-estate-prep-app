stem: A broker who has been serving as the designated broker-in-charge of an office decides to
  resign from that role. Under 21 NCAC 58A .0105(g)(8), by when must the broker notify the
  Commission in writing of this change?
options:
  - Within 5 days following the change.
  - Within 10 days following the change.
  - Within 30 days following the change.
  - Within 15 days following the change.
key: B
explanation: The rule requires the designated BIC to notify the Commission in writing that he or she
  is no longer serving as BIC of a particular office within 10 days following any such change. The
  distractor proposing 5 days is incorrect because the rule specifies a 10‑day period, not a shorter
  one.
