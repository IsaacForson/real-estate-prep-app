stem: A licensee represents a seller and, upon learning of an existing utility easement that affects
  the property, fails to disclose the easement to the buyer before closing. Which ground for
  disciplinary action does this conduct violate under N.C. Gen. Stat. § 93A-6(a)(1)?
options:
  - Failing to deliver a completed copy of a purchase agreement within a reasonable time.
  - Acting for more than one party in a transaction without the knowledge of all parties.
  - Making any willful or negligent misrepresentation or any willful or negligent omission of
    material fact.
  - Accepting a commission for acts performed in violation of this Chapter.
key: C
explanation: Failing to disclose a known utility easement is a negligent omission of a material
  fact, which falls under the same statutory ground of willful or negligent misrepresentation or
  omission (§ 93A-6(a)(1)). The distractor about accepting commissions for violations corresponds to
  § 93A-6(a)(9) and is unrelated to the omission of property information.
