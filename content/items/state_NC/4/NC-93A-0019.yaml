stem: A broker holding an earnest money deposit wants to transfer it to the closing attorney well
  ahead of the anticipated settlement date, and later wants to release part of it to the seller
  before settlement for an unrelated purpose. Under 21 NCAC 58A .0116(e), which combination of
  actions is permitted?
options:
  - Transfer at any time before settlement, and disburse early without informing the parties
  - Transfer on the day of settlement, and disburse early upon oral notice to the parties
  - Transfer within ten days of settlement, and disburse early with written consent
  - Transfer within thirty days of settlement, and disburse early at the broker's own discretion
key: C
explanation: Rule.0116(e) permits transferring an earnest money deposit to the closing attorney no
  more than ten days before the anticipated settlement date, and bars disbursing earnest money early
  for any other purpose without the written consent of the parties.
