stem: A seller completes a Residential Property and Owners' Association Disclosure Statement for a
  property that has a private road abutting it. Under 21 NCAC 58A .0114(a)(6), what must the seller
  disclose about the private road?
options:
  - The existence of any private road(s) abutting or adjoining the property and the maintenance
    agreements, if applicable.
  - The existence of any private road(s) abutting or adjoining the property and the maintenance
    agreements, regardless of applicability.
  - The existence of any private road(s) abutting or adjoining the property only.
  - The maintenance agreements for any private road(s) abutting or adjoining the property only.
key: A
explanation: The rule requires disclosure of the existence of any private road(s) abutting or
  adjoining the property and the maintenance agreements, if applicable. The distractor that mentions
  only the existence of the road is incorrect because it omits the required disclosure of
  maintenance agreements when they exist.
