stem: Under 21 NCAC 58A .0101(a), what must a broker do with the pocket card issued annually by the
  Commission?
options:
  - Submitting the pocket card to the Commission for renewal every six months and retaining a copy
    for the broker's records
  - Returning the pocket card to the Commission upon a client's request and providing a written
    explanation for the return
  - Retaining the pocket card as evidence of licensure and producing it when requested while engaged
    in real estate brokerage
  - Displaying the pocket card prominently in the broker's office and keeping it available for
    inspection at all times
key: C
explanation: The rule requires the broker to retain the pocket card as evidence of licensure and to
  produce a legible form whenever requested while engaging in real estate brokerage. Simply
  displaying the card in the office does not satisfy the production requirement. Submitting or
  returning the card is not mandated by this rule.
citation:
  source: 21 NCAC 58A 0101–0120 — 21 N.C. Admin. Code 58A Section .0100 — General Brokerage (Rules
