stem: Under 21 NCAC 58A .0105(b), what must a broker's advertisement of property for sale include so
  it is **NOT** a prohibited blind ad?
options:
  - A photograph of the listing broker in every advertisement
  - The seller's asking price rounded to the nearest thousand
  - An indication that the ad is from a broker or firm
  - A written statement that the property is sold as-is
key: C
explanation: Rule.0105(b) requires that every advertisement indicate it is the advertisement of a
  broker or firm and prohibits confining an ad to bare contact information, which is what makes an
  ad a prohibited blind ad.
