stem: A broker changes her residence address and telephone number. Under 21 NCAC 58A .0103(b),
  within how many days must she notify the Commission in writing of these changes?
options:
  - 5 days
  - 15 days
  - 30 days
  - 10 days
key: D
explanation: The rule explicitly states that a broker must notify the Commission in writing of any
  change within 10 days of the change. Five days is too short and reflects a confusion with other
  reporting periods, while fifteen or thirty days exceed the required timeframe.
