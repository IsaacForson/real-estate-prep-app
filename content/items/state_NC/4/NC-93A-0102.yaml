stem: Under 21 NCAC 58A .0104(a), what must be true for a written agreement for brokerage services
  between a broker and the owner of property to be the subject of a transaction?
options:
  - It must be notarized and recorded with the county
  - It must be in writing and signed by the parties at the time of its formation
  - It must include a penalty for early termination clause
  - It must be approved by the broker-in-charge before signing
key: B
explanation: 21 NCAC 58A .0104(a) requires that every agreement for brokerage services between a
  broker and an owner of the property to be the subject of a transaction be in writing and signed by
  the parties at the time of its formation. The answer stating that the agreement must be in writing
  and signed by the parties at the time of its formation satisfies this requirement. The other
  choices add requirements—such as notarization and recording, a penalty clause, or broker‑in‑charge
  approval—that the rule does not impose.
