stem: Under 21 NCAC 58A .1801(d)(1), what must a provisional broker do to activate a license that
  was placed on inactive status?
options:
  - To satisfy the continuing education requirements for license activation described in Rule .1703
  - To file an activation form with the Commission pursuant to Rule .0504
  - To complete all three Postlicensing Courses described in Paragraph (a) within the previous two
    years
  - To pay the fifty-dollar renewal fee for license renewal before the expiration date
key: C
explanation: The rule explicitly lists completing the three postlicensing courses within the prior
  two years as a prerequisite for activation. The option about satisfying continuing education
  requirements refers to a different subsection (.1801(d)(2)) and is not the requirement specified
  in.1801(d)(1).
