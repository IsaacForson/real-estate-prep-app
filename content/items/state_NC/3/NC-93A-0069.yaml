stem: A real estate broker licensed in Georgia wants to act as a broker in North Carolina for the
  sale of an office building. According to 21 NCAC 58A .1807(a), what must the broker do before
  performing any act requiring licensure in this state?
options:
  - The broker must obtain a North Carolina resident broker license before acting, unless affiliated.
  - The broker must enter into a brokerage cooperation agreement and declaration of affiliation with
    a resident North Carolina broker.
  - The broker must file a notice with the Commission within ten days of starting activity and pay
    the required fee.
  - The broker must complete a 90-hour postlicensing education course and pass the state exam.
key: B
explanation: The rule requires that a nonresident broker first enter into a brokerage cooperation
  agreement and declaration of affiliation with a resident North Carolina broker before performing
  any act requiring licensure. Obtaining a North Carolina license, filing a notice, or completing
  postlicensing education are not prerequisites under this provision.
citation:
  source: "### 21 NCAC 58A 1801–1905 — 21 N.C. Admin. Code 58A Section .1800 — Limited Nonresident
    Commercial Licensing (Rules .1801 to .1905; NC OAH compilation) .1807"
  url: null
  quoted_text: No person licensed under G.S. 93A -9(b) shall enter North Carolina to perform any act
    or service for which licensure as a real broker is required unless he or she has first entered
    into a brokerage cooperation agreement and declaration of affiliation with an individual who is
    a resident in North Carolina licensed as a North Carolina real estate broker.
