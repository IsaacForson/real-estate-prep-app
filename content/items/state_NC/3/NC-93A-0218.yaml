stem: A provisional broker has been a licensed North Carolina attorney practicing real estate
  matters for the two years immediately preceding application, working 40 hours per week. According
  to 21 NCAC 58A .1905(a)(3), what must the broker do to obtain a waiver of the 90‑hour
  postlicensing education requirement?
options:
  - To complete the three 30‑hour postlicensing courses within the previous two years
  - To submit the required attorney experience documentation to the Commission
  - To obtain a broker license in another state for five of the last seven years
  - To pay a waiver fee to the Commission before submitting the application
key: B
explanation: Under.1905(a)(3), equivalent experience as a licensed NC attorney practicing real
  estate for two years qualifies for a waiver, provided the required documentation is submitted.
  Completing the postlicensing courses is the standard route, not a waiver pathway.
