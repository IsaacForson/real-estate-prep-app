stem: A nonresident commercial broker receives earnest money from a buyer while facilitating a
  commercial lease in North Carolina. Under 21 NCAC 58A .1808, what must the broker do with the
  money received?
options:
  - The broker must hold the money in an escrow account until closing, without delivering it to the
    resident broker.
  - The broker must deliver the money to the affiliated resident North Carolina broker for deposit
    in a trust account.
  - The broker must remit the money to the Commission within five business days, instead of
    delivering it to the affiliated resident broker.
  - The broker must deposit the money directly into his or her own trust account, bypassing the
    resident broker.
key: B
explanation: The rule requires the nonresident commercial broker to deliver all money belonging to
  others received in connection with brokerage activities to the affiliated resident North Carolina
  broker, who then deposits the funds in a trust account per Rule.0116. Depositing directly, holding
  in escrow, or remitting to the Commission are not permitted under this provision.
citation:
  source: "### 21 NCAC 58A 1801–1905 — 21 N.C. Admin. Code 58A Section .1800 — Limited Nonresident
    Commercial Licensing (Rules .1801 to .1905; NC OAH compilation) .1808"
  url: null
  quoted_text: A nonresident commercial broker acting as real estate broker in North Carolina shall
    deliver to the North Carolina resident broker with whom he or she is affiliated all money
    belonging to others received in connection with the nonresident commercial broker's acts or
    services as a broker. Upon receipt of the funds, the resident North Carolina broker shall cause
    the funds to be deposited in a trust account in accordance with the provisions of Rule .0116 of
    this Subchapter.
