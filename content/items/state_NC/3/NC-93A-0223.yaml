stem: What is the minimum amount of full-time real estate brokerage experience required within the
  previous five years for a broker to qualify as broker-in-charge under N.C. Gen. Stat. § 93A-4.2?
options:
  - One year of full-time experience
  - Two years of full-time experience
  - Three years of full-time experience
  - Four years of full-time experience
key: B
explanation: The rule states a broker must "possess at least two years of full-time real estate
  brokerage experience or equivalent part-time real estate brokerage experience within the previous
  five years" to be qualified. Therefore, two years is the minimum required; one year is
  insufficient, while three or four years exceed the minimum but are not the minimum requirement.
