stem: A provisional broker submitted postlicensing education documentation that contained incorrect
  course completion dates. According to 21 NCAC 58A .1904(a)(1), what action may the Commission
  take?
options:
  - To allow the broker additional time to submit corrected documentation
  - To deny or withdraw the postlicensing education credit claimed
  - To suspend the broker’s license pending a formal hearing
  - To require the broker to retake the postlicensing courses immediately
key: B
explanation: The Commission may deny or withdraw postlicensing credit when incorrect or incomplete
  information is provided, as stated in.1904(a)(1). Granting an extension is addressed in a
  different rule (.1903) and does not apply to cases of inaccurate documentation.
