stem: During a showing, a prospective buyer asks a broker to see proof of current licensure.
  According to 21 NCAC 58A .0101(a), what must the broker do?
options:
  - The broker must display the firm's license certificate in the office where the showing occurs.
  - The broker must provide the buyer with a copy of the 'Working with Real Estate Agents'
    publication.
  - The broker must submit a written request to the Commission for a duplicate license.
  - The broker must produce a legible form of the pocket card as proof of licensure.
key: D
explanation: The rule requires a broker to produce a legible form of the pocket card as proof of
  licensure whenever requested while engaging in real estate brokerage. Displaying the firm's
  license certificate satisfies the office display requirement under.0101(b) but does not fulfill
  the request for personal proof. Submitting a written request applies only to obtaining a
  replacement license, and providing the agency publication is a separate disclosure duty
  under.0104(c).
