stem: A licensee who holds a provisional broker license wishes to be named broker-in-charge of a new
  office. Under N.C. Gen. Stat. § 93A-4.2, what is the correct determination?
options:
  - The licensee may serve as broker-in-charge after successfully completing the required education
    program.
  - The licensee may serve as broker-in-charge with two years of full-time experience.
  - The licensee may not serve as broker-in-charge because provisional brokers cannot hold that
    designation.
  - The licensee may serve as broker-in-charge after completing an equivalent education program.
key: C
explanation: The statute explicitly states that a provisional broker may not be designated as a
  broker-in-charge. This prohibition applies regardless of the licensee's experience or education.
  Therefore the licensee cannot serve in that role, while the other options incorrectly suggest that
  experience, education, or program completion can override the ban.
