stem: A licensee is ordered to pay a fine by the Ohio real estate commission. According to Ohio Adm.
  Code § 5-1-18(B)(1), when must the fine payment be received by the division to avoid automatic
  suspension of the license?
options:
  - within 10 days of the commission's order
  - within 15 days of the commission's order
  - within 30 days of the commission's order
  - within 60 days of the commission's order
key: C
explanation: The rule states that payment of any fine must be received by the division within thirty
  days of the commission's finding and order imposing the fine, unless an extension is granted.
  Failure to meet this thirty‑day limit triggers automatic suspension of the license. The
  fifteen‑day option reflects a common misunderstanding of the timeline but is not supported by the
  rule.
