stem: A provider renews a distance education course approval on January 15 of the following year.
  What fee must the provider pay for this renewal under Ohio Adm. Code 1301:5-7-08(K)?
options:
  - $100.00
  - $200.00
  - $30.00
  - $60.00
key: D
explanation: Renewal filed on or before January 31 requires a nonrefundable fee of sixty dollars;
  filings after January 31 are treated as new applications requiring a two‑hundred‑dollar fee. Since
  January 15 is before January 31, the fee is $60.00.
