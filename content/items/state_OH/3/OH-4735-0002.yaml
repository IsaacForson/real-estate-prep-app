stem: A salesperson places a print advertisement for a listed property and includes her own name. To
  comply with R.C. 4735.16, how must the brokerage name be treated in that advertisement?
options:
  - Display the brokerage name in smaller print than the salesperson's name
  - Omit the brokerage name whenever the salesperson's name already appears
  - Display the brokerage name on the office sign but leave it out of the ad
  - Give the brokerage name equal prominence with the salesperson's name
key: D
explanation: R.C. 4735.16 requires the name of the brokerage to be displayed in equal prominence
  with the name of the salesperson in the advertisement.
