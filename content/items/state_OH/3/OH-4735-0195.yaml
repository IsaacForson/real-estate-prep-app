stem: Under Ohio Adm. Code 1301:5-7-06(B)(1), what penalty applies when a new continuing education
  course offering is submitted less than forty‑five days but **NOT** less than fifteen days prior to
  the offering date?
options:
  - A fee of ten dollars per credit hour per attendee
  - A fee of twenty dollars per credit hour per attendee
  - A fee of two dollars per credit hour per attendee
  - A fee of five dollars per credit hour per attendee
key: C
explanation: The rule explicitly states that a new CE course offering submitted less than 45 days
  but not less than 15 days before the offering incurs a penalty of two dollars per credit hour per
  attendee. The distractor of five dollars per credit hour per attendee incorrectly substitutes the
  fee for an initial course approval, which is unrelated to late‑submission penalties.
