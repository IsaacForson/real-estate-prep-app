stem: A team of four licensees advertises under the name 'Happy Homes Team'. The advertisement
  includes a photograph of the team members but does not disclose the names of any members.
  According to Ohio Adm. Code Rule 1301:5-1-21, is this permissible?
options:
  - Not permissible because names must be disclosed
  - Permissible only if the advertisement is printed in a newspaper
  - Permissible only if the team includes at least five members
  - Permissible if the requirements of paragraph (A) of the rule are met
key: D
explanation: Under Ohio Adm. Code Rule 1301:5-1-21, a team advertisement may include a photograph of
  members without naming them, as long as the requirements of paragraph (A) are satisfied. Since the
  scenario shows no violation of those requirements, the advertisement is allowed. The statement
  that names must be disclosed conflicts with the rule's permission for unnamed photographs.
