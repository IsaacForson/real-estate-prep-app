stem: A licensee receives a citation that includes fifteen separate violations of the advertising
  rule. Under Ohio Rev. Code § 4735.16(C)(1), what is the maximum fine that may be assessed for this
  citation?
options:
  - $1,800.
  - $2,500.
  - $1,200.
  - $3,000.
key: B
explanation: Each violation carries a $200 fine, so fifteen violations would total $3,000. However
  the rule caps the fine per citation at $2,500, so the assessable fine is limited to $2,500. The
  $3,000 option ignores the cap.
