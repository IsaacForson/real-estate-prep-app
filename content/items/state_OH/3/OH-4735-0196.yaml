stem: A provider submits a new 4‑credit‑hour continuing education course offering for 25 attendees
  thirty days before the course date. What penalty must the provider pay under Ohio Adm. Code
  1301:5-7-06(B)(1)?
options:
  - $200.00
  - $150.00
  - $250.00
  - $300.00
key: A
explanation: The penalty is calculated as $2 per credit hour per attendee. Multiplying
  2 × 4 credit hours × 25 attendees yields $200. The distractor of $150 results from using
  3 credit hours instead of 4, a common mis‑calculation.
citation:
  source: "Ohio Adm. Code ch. 1301:5-7 — Ohio Administrative Code Chapter 1301:5-7 — Real Estate
    Division: Continuing Education / Miscellaneous, official Ohio Laws chapter page read via
    Internet Archive capture of 2026-03-09 Rule 1301:5-7-06"
  url: null
  quoted_text: "New continuing education course offering submitted less than forty-five days prior to
    the offering date, but not less than fifteen days prior to the offering: two dollars per credit
    hour per attendee;"
  secondary: []
math:
  worked_solution: |-
    Rate = $2 per credit hour per attendee
    Credit hours = 4
    Attendees = 25
    Penalty = 2 × 4 × 25 = 200
    Result = $200.00
  formulas:
