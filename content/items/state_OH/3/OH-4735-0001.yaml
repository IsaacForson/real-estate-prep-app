stem: Under R.C. 4735.16, what must a licensed real estate broker erect or maintain on the business
  premises?
options:
  - A sign stating the licensee's total years of real estate experience
  - A sign stating the average sale price of nearby properties
  - A sign stating that the licensee is a real estate broker
  - A sign stating the broker's license renewal date
key: C
explanation: The statute requires every licensed broker to erect or maintain a sign on the business
  premises plainly stating that the licensee is a real estate broker, and to do the same at each
  branch office.
