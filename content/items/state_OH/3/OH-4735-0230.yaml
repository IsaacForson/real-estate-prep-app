stem: A licensee wants to advertise a property on a third‑party classifieds website that the
  licensee does not own or control. The website’s terms of use prevent the licensee from adjusting
  the size or prominence of any text. According to Ohio Adm. Code 1301:5-1-02(D)(2), what must the
  licensee do to comply with the rule?
options:
  - Refrain from posting any property listings on third‑party sites
  - Request permission from the website host to modify text formatting
  - Provide a link to a compliant display on every viewable web page
  - Increase the brokerage name font size above the salesperson's name
key: C
explanation: The rule states that when advertising on an internet website not owned or controlled by
  the licensee or a brokerage with which the licensee is affiliated and that website's terms of use
  limit the licensee's ability to comply with paragraph (D) of this rule, the licensee must provide
  a direct link to a display that is in compliance with paragraph (D) on every viewable web page of
  the website. Therefore the licensee must provide a link to a compliant display. The other options
  either contradict the rule or are not required.
