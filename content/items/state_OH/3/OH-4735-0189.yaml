stem: Under Ohio Adm. Code Rule 1301:5-1-22, what is the renewal fee for a three-year real estate
  license relative to the one-year renewal fee?
options:
  - The same as the one-year renewal fee
  - One-third of the one-year renewal fee
  - Two times the one-year renewal fee
  - Three times the one-year renewal fee
key: D
explanation: The rule states that licenses renewed on a timely basis are renewed for a three-year
  period for a fee that is three times the renewal fee for one year. Therefore, the correct answer
  is three times the one-year renewal fee. The distractor 'one-third' incorrectly inverts the ratio.
