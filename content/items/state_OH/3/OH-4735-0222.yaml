stem: A broker includes the name 'Smith Realty, Inc.' on their license but advertises using only
  'Smith Realty' in a flyer. Under Ohio Adm. Code Rule 1301:5-1-02(C)(3), is this advertisement
  compliant?
options:
  - The advertisement is compliant because the words 'Inc.' are not required to appear in advertising
  - The advertisement is noncompliant because the broker must include the legal suffix 'Inc.' in all
    advertising
  - The advertisement is noncompliant because the broker must use the exact name as it appears on
    the license
  - The advertisement is noncompliant because the broker must add 'Realty' to the name if it is
    missing
key: A
explanation: The rule states that words or abbreviations indicating the legal framework, such as
  'Inc.' or 'Co.', are not required to appear in advertising. Omitting 'Inc.' is therefore
  permissible. The distractor insisting the suffix must be included contradicts the rule.
