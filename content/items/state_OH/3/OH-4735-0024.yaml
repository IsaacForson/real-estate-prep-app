stem: A salesperson advertises a property listed with her brokerage but does not disclose her own
  name or the brokerage's name in the ad. Which requirement under Ohio Rev. Code § 4735.16 has she
  failed to meet?
options:
  - Identifying herself by name and naming her affiliated brokerage
  - Listing the property's full tax parcel number in the ad
  - Obtaining the seller's notarized signature before advertising it publicly
  - Filing the ad copy with the superintendent before it runs
key: A
explanation: Section 4735.16 requires a licensee who advertises property the licensee does not own
  to be identified by name and to indicate the name of the affiliated brokerage in the
  advertisement.
citation:
  source: Ohio Rev. Code § 4735.16
  url: null
  quoted_text: Any licensed real estate broker or salesperson who advertises to buy, sell, exchange,
    or lease real estate, or to engage in any act regulated by this chapter, with respect to
    property the licensee does not own, shall be identified in the advertisement by name and
    indicate the name of the brokerage with which the licensee is affiliated.
