stem: Under Ohio Rev. Code § 4735.13(C), what action may the superintendent take if a licensee fails
  to notify the superintendent within fifteen days of a felony conviction?
options:
  - The superintendent must revoke the license immediately.
  - The superintendent shall issue a written warning only.
  - The superintendent shall refer the case to the attorney general.
  - The superintendent may suspend the license.
key: D
explanation: Under Ohio Rev. Code § 4735.13(C), if a licensee does not notify the superintendent
  within fifteen days of a felony conviction, the superintendent has the authority to suspend the
  license. The statute does not require revocation, a written warning, or referral to the attorney
  general; those actions are not authorized by this provision.
