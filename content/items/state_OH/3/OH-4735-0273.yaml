stem: A broker verifies an affiliated licensee's eligibility under Ohio Rev. Code § 4735.20(C)(4) on
  June 1, 2024. Until what date must the broker retain the verification record to satisfy the
  three‑year retention requirement?
options:
  - June 1, 2027
  - June 1, 2025
  - June 1, 2026
  - June 1, 2028
key: A
explanation: The regulation requires keeping the verification record for three years after the date
  of verification, so June 1, 2024 plus three years yields June 1, 2027. The option of June 1, 2026
  reflects only two years and therefore does not meet the requirement.
