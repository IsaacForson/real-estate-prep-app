stem: According to Ohio Rev. Code § 4735.20(J), how is an 'affiliated licensee' defined?
options:
  - A person who holds a valid and active license issued under this chapter and is associated with
    the broker that is paying a fee, commission, or other compensation at the time that fee,
    commission, or other compensation is earned.
  - A person who holds a valid and active license issued under this chapter and works independently
    of any broker, receiving no compensation from the broker, per statute.
  - A person who holds a valid and active license issued under this chapter and receives a salary
    from the broker for performing brokerage activities, per policy.
  - A person who holds a valid and active license issued under this chapter and may refer clients to
    any broker for a fee, subject to broker approval, per rule.
key: A
explanation: The definition in subdivision (J) explicitly states that an affiliated licensee is a
  person who holds a valid and active license under the chapter and is associated with the broker
  paying the fee, commission, or other compensation at the time it is earned. The other options
  either omit the association requirement, add unrelated conditions, or introduce privileges not
  found in the statute.
