stem: Which of the following best fits the statutory definition of a real estate broker in Ohio Rev.
  Code § 4735.01?
options:
  - A person who inspects a home for structural defects pre-closing
  - A person who appraises a property's fair market value for a lender
  - A person who negotiates a real estate sale for another for a fee
  - A person who surveys a parcel of land to fix its legal boundary
key: C
explanation: Section 4735.01 defines a real estate broker as a person who, for another and for a
  fee, commission, or other valuable consideration, sells, exchanges, or negotiates the sale of real
  estate.
