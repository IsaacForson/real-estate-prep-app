stem: A broker divides a commission with a person who is not licensed as a real estate broker or
  salesperson and who does not qualify for any exception in R.C. 4735.20. How should this payment be
  evaluated under R.C. 4735.18?
options:
  - This is permitted because the payment was disclosed to both parties
  - This is permitted because the recipient assisted with the transaction
  - This is disciplinable because the recipient later obtains a license
  - It is disciplinable because no exception under R.C. 4735.20 applies
key: D
explanation: R.C. 4735.18 makes it disciplinable to pay or divide commissions or fees with anyone
  not licensed under the chapter, except as permitted under R.C. 4735.20; without a qualifying
  exception, the payment is misconduct.
