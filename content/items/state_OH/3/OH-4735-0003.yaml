stem: A broker obtains a seller's signature on a listing agreement. Under R.C. 4735.16, what must
  the broker do with respect to that document?
options:
  - Furnish a copy of the signed agreement to the party right away
  - Furnish a copy of the agreement within ninety days of signing
  - Furnish a copy of the agreement after the party requests one
  - Furnish a copy of the agreement to the party at the closing table
key: A
explanation: R.C. 4735.16 requires a broker or salesperson obtaining a party's signature on a
  listing or other agreement to furnish a copy of it to the party immediately after obtaining the
  signature.
citation:
  source: Ohio Rev. Code § 4735.16
  url: null
  quoted_text: A real estate broker or salesperson obtaining the signature of a party to a listing or
    other agreement involved in a real estate transaction shall furnish a copy of the listing or
    other agreement to the party immediately after obtaining the party's signature.
