stem: Under Ohio Adm. Code § 5-1-02(D), what must be disclosed on every viewable web page of a
  licensee's website that advertises real estate services?
options:
  - The property's current listing price
  - The date of the last website update
  - The licensee's personal telephone number
  - The name of the brokerage displayed
key: D
explanation: The rule states that all internet advertising of real estate services shall disclose
  the name of the brokerage on every viewable web page of the website. Therefore the correct answer
  is the brokerage name. The distractors incorrectly suggest other information such as a personal
  phone number, listing price, or website update date, which the rule does not require.
