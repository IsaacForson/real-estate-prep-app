stem: A provider of an already approved continuing education course wants to change the instructor
  and submits the change request two days before the offering. Under Ohio Adm. Code
  1301:5-7-06(B)(3), what penalty must be paid to request a waiver of the three‑day notification
  requirement?
options:
  - One dollar per credit hour per attendee
  - Two dollars per credit hour per attendee
  - Five dollars per credit hour per attendee
  - Ten dollars per credit hour per attendee
key: B
explanation: The rule requires a penalty of two dollars per credit hour per attendee when a change
  to the instructor (or location, time, or content) is submitted less than three days before the
  offering. Therefore the correct option states that penalty amount.
citation:
  source: "Ohio Adm. Code ch. 1301:5-7 — Ohio Administrative Code Chapter 1301:5-7 — Real Estate
    Division: Continuing Education / Miscellaneous, official Ohio Laws chapter page read via
    Internet Archive capture of 2026-03-09 Rule 1301:5-7-06(B)(3)"
  url: null
  quoted_text: "Change of location, time, instructor, or change of course content of a course approved
    for that calendar year, submitted less than three days prior to the offering date: two dollars
    per credit hour per attendee;"
