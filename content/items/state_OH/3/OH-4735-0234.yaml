stem: A broker manages rental properties for an owner and provides a written accounting of the
  property management trust account to the owner every six months. Under Ohio Adm. Code
  1301:5-5-11(E), is the broker's compliance with the accounting requirement?
options:
  - The broker's accounting practice is not compliant because accounting must be provided at least
    quarterly.
  - The broker's accounting practice is compliant because the owner receives an accounting every six
    months.
  - The broker's accounting practice is not compliant because accounting must be provided monthly.
  - The broker's accounting practice is compliant because accounting may be provided annually if
    agreed in writing.
key: A
explanation: The broker's accounting practice is not compliant because Ohio Adm. Code 1301:5-5-11(E)
  requires that an accounting be provided to each owner on a regular basis and in no event less than
  quarterly. Providing an accounting only every six months does not meet this minimum frequency, so
  the broker fails to satisfy the rule.
