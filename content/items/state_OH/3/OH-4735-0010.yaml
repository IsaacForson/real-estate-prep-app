stem: A broker rents a post office box, lists it as the only business address on file with the
  division, and conducts all client meetings elsewhere without a fixed office. How does this
  arrangement measure against the location requirement of R.C. 4735.13?
options:
  - It satisfies the requirement as long as annual license fees are paid
  - It fails because a post office box is not a definite place of business
  - It satisfies the requirement because the box is registered with the division
  - It fails because the broker also lacks a sign at the mailbox location
key: B
explanation: R.C. 4735.13 requires a broker to maintain a definite place of business and expressly
  states that a post office box address is not a definite place of business for purposes of the
  section.
