stem: A continuing education provider wishes to offer a new course and submits the application for
  initial approval 18 days before the scheduled offering date. To obtain a waiver of the forty‑five
  day notification requirement under Ohio Adm. Code 1301:5-7-06(B), what penalty must the provider
  pay?
options:
  - Two dollars per credit hour per attendee
  - One dollar per credit hour per attendee
  - Ten dollars per credit hour per attendee
  - Five dollars per credit hour per attendee
key: A
explanation: For a new course offering submitted less than forty‑five days but not less than fifteen
  days prior to the offering, Ohio Adm. Code 1301:5-7-06(B)(1) imposes a penalty of two dollars per
  credit hour per attendee to request the waiver. Therefore the option stating 'Two dollars per
  credit hour per attendee' is correct. The other options list different amounts and are incorrect.
