stem: An attorney negotiates the sale of a client's home purely as part of representing that client
  in the underlying legal matter. Does Ohio Rev. Code § 4735.01 require the attorney to hold a real
  estate license for this act?
options:
  - Yes, an attorney handling any real estate matter is required to hold a license
  - No, an attorney acting within the attorney's legal duties is exempt
  - No, the exemption instead covers accountants doing similar work
  - Yes, the exemption covers attorneys who personally own the property
key: B
explanation: Section 4735.01 exempts a person acting as an attorney at law in the performance of the
  attorney's duties from the definitions of real estate broker and real estate salesperson.
