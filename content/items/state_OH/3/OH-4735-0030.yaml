stem: A broker deposits earnest money into an interest-bearing account that also holds the broker's
  personal funds. Under Ohio Rev. Code § 4735.18, which requirement for the trust account has the
  broker violated?
options:
  - Reporting the trust account balance to the seller every single quarter
  - Insuring the account through a private title company
  - Keeping the account noninterest-bearing and apart from personal funds
  - Converting the account into a certificate of deposit after a year
key: C
explanation: Section 4735.18 requires a broker's trust account to be noninterest-bearing and
  separate and distinct from any personal or other account of the broker.
