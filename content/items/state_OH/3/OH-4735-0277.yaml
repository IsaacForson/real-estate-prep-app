stem: A licensee's real estate license is automatically suspended for failure to pay a fine as
  ordered by the commission. Under Ohio Adm. Code § 5-1-18(B)(4), within what period must the
  licensee reactivate the license to avoid revocation?
options:
  - within 12 months of the license suspension
  - within 6 months of the license suspension
  - within 9 months of the license suspension
  - within 18 months of the license suspension
key: A
explanation: The rule provides that reactivation of a license suspended for nonpayment of a fine
  must occur within twelve months of the date of license suspension, subject to meeting other
  conditions. If reactivation does not happen within that twelve‑month window, the license is
  revoked automatically. The nine‑month option is a typical distractor that confuses the
  reactivation period with the fine‑payment period.
