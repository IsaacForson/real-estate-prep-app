stem: A broker maintains a special account for escrow funds received from clients but pays the
  interest earned into her personal operating account. Under R.C. 4735.18, what feature must that
  special account have?
options:
  - The special account can be interest-bearing if the broker discloses the rate
  - The special account can be combined with the broker's operating account
  - The account is noninterest-bearing and kept apart from the broker's funds
  - The special account is closed as soon as the transaction is finalized
key: C
explanation: R.C. 4735.18 requires the special or trust account used for escrow funds to be
  noninterest-bearing and separate and distinct from any personal or other account of the broker.
