stem: Under the rule that allows the superintendent to waive the forty‑five day notification
  requirement for an original application for continuing education course approval, under what
  condition may the waiver be granted?
options:
  - One dollar per credit hour per attendee
  - Two dollars per credit hour per attendee
  - Five dollars per credit hour per attendee
  - Ten dollars per credit hour per attendee
key: B
explanation: Under Ohio Adm. Code 1301:5-7-06(B), the superintendent may waive the forty‑five day
  notification requirement when a penalty of two dollars per credit hour per attendee is paid.
  Penalties of other amounts do not meet this condition. Therefore the correct answer is the option
  stating 'Two dollars per credit hour per attendee'.
