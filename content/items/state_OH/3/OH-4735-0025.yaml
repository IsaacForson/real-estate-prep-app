stem: A broker obtains a seller's signature on a listing agreement on Monday but does not give the
  seller a copy until the following month. Which duty under Ohio Rev. Code § 4735.16 has the broker
  violated?
options:
  - Filing the agreement with the real estate commission in a year
  - Furnishing the seller a copy right after taking the signature
  - Recording the listing agreement with the county within ten days
  - Translating the listing agreement into another language
key: B
explanation: Section 4735.16 requires a broker who obtains a party's signature on a listing or other
  agreement to furnish a copy of that agreement to the party immediately after obtaining the
  signature.
citation:
  source: Ohio Rev. Code § 4735.16
  url: null
  quoted_text: A real estate broker or salesperson obtaining the signature of a party to a listing or
    other agreement involved in a real estate transaction shall furnish a copy of the listing or
    other agreement to the party immediately after obtaining the party's signature.
