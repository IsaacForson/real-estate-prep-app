stem: A group of five agents affiliated with the same brokerage advertises together under the name
  "The Summit Sellers." Under Ohio Adm. Code Rule 1301:5-1-21, what must the team name include?
options:
  - The word "group" or "team"
  - The word "realty" or "associates"
  - The word "exclusive" or "premier"
  - The word "licensed" or "certified"
key: A
explanation: Rule 1301:5-1-21 requires a team name to include the term "group" or "team" and
  separately prohibits use of the terms "realty" or "associates" in a team name.
