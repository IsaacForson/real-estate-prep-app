stem: Under R.C. 4735.18(A)(26), what must a broker do with the name, account number, and location
  of the special trust account used for escrow funds?
options:
  - Post it conspicuously at the brokerage office
  - Submit it in writing to the superintendent
  - Include it in every client contract
  - Publish it on the broker's website
key: B
explanation: The rule requires the broker to submit the name, account number, and location of the
  trust account in writing to the superintendent. Simply posting the information at the office or
  publishing it online does not satisfy this specific submission requirement.
