stem: Under Ohio Rev. Code § 4735.13(C), within how many days must a licensee notify the
  superintendent in writing of a felony conviction?
options:
  - Ten days after the conviction.
  - Five days after the conviction.
  - Thirty days after the conviction.
  - Fifteen days after the conviction.
key: D
explanation: The rule requires licensees to notify the superintendent in writing within fifteen days
  of a felony conviction. The ten‑day option is incorrect because the statute specifies fifteen
  days, not ten.
