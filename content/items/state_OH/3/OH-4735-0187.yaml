stem: A licensee posts a property advertisement on Twitter, which limits posts to 280 characters,
  and cannot fit the brokerage name within the tweet. According to Ohio Adm. Code § 5-1-02(D)(1),
  what must the licensee do to comply?
options:
  - Omit the brokerage name due to platform character limits
  - Include the brokerage name even if it exceeds the limit
  - Provide a direct link to a display that complies with paragraph (D) of this rule
  - Seek prior approval from the division to skip disclosure
key: C
explanation: The rule requires that when advertising in electronic messages of limited information
  or characters, the licensee must provide a direct link to a display that complies with the
  brokerage-name disclosure requirement. Therefore providing such a link is the correct action.
  Omitting the brokerage name or seeking approval to skip disclosure violates the rule, and simply
  including the name despite the character limit does not satisfy the link requirement.
