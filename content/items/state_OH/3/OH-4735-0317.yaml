stem: If the one-year renewal fee for a salesperson license is $45, what is the total fee for a
  three-year renewal under Ohio Adm. Code Rule 1301:5-1-22?
options:
  - $135.00
  - $180.00
  - $90.00
  - $105.00
key: A
explanation: The rule states that a three‑year renewal fee is three times the one‑year fee.
  Multiplying $45 by 3 yields $135.00, making that option correct. The $105.00 option incorrectly
  adds $60 to the one‑year fee instead of tripling it.
