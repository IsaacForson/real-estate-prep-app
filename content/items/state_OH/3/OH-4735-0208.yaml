stem: Which of the following is considered advertising under Ohio Adm. Code Rule 1301:5-1-02(H)?
options:
  - A private email to a client about a property listing
  - A blog post offering property management services
  - A voicemail left for a friend about a house for sale
  - A password-protected site showing listings to client
key: B
explanation: A blog post is advertising because Rule 1301:5-1-02(H) includes blogs as a
  manner/method to make known services requiring a license to the general public. A private email is
  excluded as private communication initiated at client request under Rule 1301:5-1-02(I).
