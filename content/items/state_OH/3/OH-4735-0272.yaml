stem: Under Ohio Rev. Code § 4735.20(G)(2), what is the maximum amount of valuable consideration an
  owner may receive in any twelve‑consecutive‑month period for referring a prospective buyer of
  foreign real estate?
options:
  - Five hundred dollars
  - Seven hundred fifty dollars
  - One thousand dollars
  - One thousand five hundred dollars
key: C
explanation: The rule explicitly caps the consideration at $1,000 for any twelve‑consecutive‑month
  period, so one thousand dollars is the maximum allowed. The distractor of one thousand five
  hundred dollars exceeds this limit and therefore violates the provision.
