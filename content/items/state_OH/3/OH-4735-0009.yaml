stem: An individual is associated with a licensed real estate broker and performs acts comprehended
  by the definition of a real estate broker in exchange for compensation. Under R.C. 4735.01, what
  is that individual called?
options:
  - A licensed salesperson associated with that broker for pay
  - A real estate broker regardless of any brokerage affiliation
  - A foreign real estate dealer operating outside of Ohio
  - An independent contractor exempt from real estate licensure
key: A
explanation: R.C. 4735.01 defines a real estate salesperson as any person associated with a licensed
  real estate broker to do or deal in any acts or transactions comprehended by the definition of a
  real estate broker, for compensation or otherwise.
