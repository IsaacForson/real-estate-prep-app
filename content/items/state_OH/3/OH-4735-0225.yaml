stem: A broker publishes an advertisement that overstates the square footage of a listed property.
  Which provision of R.C. 4735.18 subjects the broker to disciplinary sanctions for this misleading
  advertising?
options:
  - (A)(9) Having violated or failed to comply with any provision of sections 4735.51 to 4735.74 of
    the Revised Code or having willfully disregarded or violated any other provisions of this
    chapter
  - (A)(21) Having published advertising, whether printed, radio, display, or of any other nature,
    which was misleading or inaccurate in any material particular, or in any way having
    misrepresented any properties, terms, values, policies, or services of the business conducted
  - (A)(22) Having knowingly withheld from or inserted in any statement of account or invoice any
    statement that made it inaccurate in any material particular
  - (A)(25) Failure of a real estate broker or salesperson to furnish all parties involved in a real
    estate transaction true copies of all listings and other agreements to which they are a party,
    at the time each party signs them
key: B
explanation: The broker's misleading advertisement violates (A)(21), which prohibits publishing
  advertising that is misleading or inaccurate in any material particular. Although the act also
  constitutes a violation of advertising rules under sections 4735.51-4735.74, the specific
  prohibition on misleading advertising is found in (A)(21).
