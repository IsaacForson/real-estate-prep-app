stem: A team of three licensees advertises under the name 'Elite Realty Associates' and includes the
  names of all members. According to Ohio Adm. Code Rule 1301:5-1-21, what is the likely consequence
  of this advertisement?
options:
  - The advertisement is permissible because the licensees disclosed their names in the
    advertisement as required by paragraph (A).
  - The advertisement is prima facie evidence of a violation of division (A)(21) of section 4735.18
    of the Revised Code.
  - The advertisement is permissible because the team name includes the required term 'group' or
    'team' as mandated by the rule.
  - The advertisement is subject to a disciplinary action that may include fines or license
    suspension.
key: B
explanation: Ohio Administrative Code Rule 1301:5-1-21(A)(5) prohibits a team from using the words
  'realty' or 'associates' in its name. Because the advertisement uses 'Elite Realty Associates', it
  violates that rule and therefore constitutes prima facie evidence of a violation of division
  (A)(21) of Ohio Revised Code section 4735.18.
