stem: A broker moves her office to a new address and does not notify the superintendent or obtain
  new licenses. Under Ohio Rev. Code § 4735.13(D), how is this conduct treated?
options:
  - It is considered prima-facie evidence of misconduct under division (A)(6) of section 4735.18.
  - It results in an automatic fine of five hundred dollars.
  - It requires the broker to complete additional continuing education.
  - It permits the broker to continue operating without penalty if the move is within the same city.
key: A
explanation: Changing a business location without giving the required notice and without obtaining
  new licenses is considered prima‑facie evidence of misconduct under division (A)(6) of section
  4735.18 of the Ohio Revised Code. The claim that it results in an automatic fine of five hundred
  dollars is incorrect because the cited provision does not specify such a fine. The claim that it
  requires the broker to complete additional continuing education is incorrect because no
  continuing‑education requirement is triggered by a mere change of address. The claim that it
  permits the broker to continue operating without penalty if the move is within the same city is
  incorrect because the statute makes no exception for moves within the same city.
