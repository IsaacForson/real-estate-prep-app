  url: null
  quoted_text: "(1) New continuing education course offering submitted less than forty-five days prior
    to the offering date, but not less than fifteen days prior to the offering: two dollars per
    credit hour per attendee;"
  secondary: []
math:
  worked_solution: 2 × 3 = 6; 6 × 20 = 120; therefore the penalty is $120.00.
