stem: A provider submits a new 3‑credit‑hour continuing education course offering for 20 attendees
  twenty‑two days before the course date. What penalty must the provider pay to obtain a waiver of
  the forty‑five day notification requirement under Ohio Adm. Code 1301:5-7-06(B)(1)?
options:
  - $60.00
  - $90.00
  - $120.00
  - $150.00
key: C
explanation: The penalty is two dollars per credit hour per attendee for a new course offering
  submitted less than 45 days but not less than 15 days prior; 22 days falls in that range, so $2 ×
  3 × 20 = $120.00.
citation:
  source: "Ohio Adm. Code ch. 1301:5-7 — Ohio Administrative Code Chapter 1301:5-7 — Real Estate
    Division: Continuing Education / Miscellaneous, official Ohio Laws chapter page read via
