stem: Under Ohio Rev. Code § 4735.24(C)(1), if parties dispute the disbursement of earnest money and
  the purchase agreement contains the provision described in division (B) of that section, by what
  date must the broker return the earnest money to the purchaser unless the parties have provided
  written instructions or notice of a court action?
options:
  - The broker must return the earnest money within thirty days of the dispute, as required by the
    statute.
  - The broker must return the earnest money by the first day of September after the two‑year
    anniversary of deposit.
  - The broker must return the earnest money within two years of the date of deposit, as required by
    the statute.
  - The broker must return the earnest money within sixty days of the deposit, as required by the
    statute.
key: B
explanation: The statute requires the broker to return the earnest money not later than the first
  day of September following the two‑year anniversary of the deposit, unless the broker receives
  written instructions or notice of a court action. Options that specify a different deadline—such
  as within thirty days of the dispute, within two years of the deposit, or within sixty days of the
  deposit—do not satisfy this requirement.
