stem: A licensee's website contains information about a property that sold six months ago. The
  licensee has not updated the site. According to Ohio Adm. Code § 5-1-02(E), what must the licensee
  do?
options:
  - Update the outdated info within fourteen days and note the change date
  - Remove the outdated information within seven calendar days
  - Maintain the information posted and add a note about accuracy
  - Notify the division within ten days that the content is outdated
key: A
explanation: The rule requires that outdated or expired information on a licensee's website be
  updated within fourteen days of becoming outdated and that the website disclose the date of the
  most recent update. Therefore updating within fourteen days and noting the change date satisfies
  the requirement. The distractors either use an incorrect timeframe, misdirect the notice to the
  division, or fail to update the information as required.
citation:
  source: Ohio Adm. Code ch. 1301:5-1 — § 5-1-02(E)
  url: null
  quoted_text: Information on an internet website maintained by a licensee which becomes outdated or
    expired, shall be updated within fourteen days of the information becoming outdated or expired.
    Each website maintained by a licensee shall disclose the date upon which the information
    contained therein was most recently updated.
