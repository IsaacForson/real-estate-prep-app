stem: Under Ohio Adm. Code Rule 1301:5-7-02(D), which licensees seventy years of age or older are
  exempt from the continuing education requirements specified in paragraph (E) of this rule?
options:
  - Licensees who are seventy years or older and have an inactive license or broker license on
    deposit
  - Licensees who are seventy years or older and hold an active salesperson license
  - Licensees who are seventy years or older and have completed thirty hours in the prior period
  - Licensees who are seventy years or older and actively practice as a broker
key: A
explanation: The rule explicitly states that a licensee who is seventy years or older and has an
  inactive license or a broker license on deposit is exempt from the paragraph (E) continuing
  education requirements. An active salesperson license does not qualify for this exemption.
