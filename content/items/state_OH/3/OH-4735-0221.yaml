stem: A broker who has received superintendent approval to conduct business under the trade names
  'Lakeview Properties' and 'Riverfront Realty' places a newspaper advertisement for a listing that
  includes only the name 'Lakeview Properties'. Under Ohio Adm. Code Rule 1301:5-1-02(C)(2), is this
  advertisement compliant?
options:
  - The advertisement is compliant because the broker used an approved trade name
  - The advertisement is noncompliant because both approved trade names must be used in every
    advertisement
  - The advertisement is noncompliant because the broker must also include the brokerage's legal name
  - The advertisement is noncompliant because the trade name must contain the word 'Realty'
key: A
explanation: The rule requires the broker to advertise in at least one of the approved trade names;
  using 'Lakeview Properties' meets this requirement. The distractor claiming both trade names must
  be used is incorrect because the rule only mandates at least one approved trade name.
