stem: Under Ohio Rev. Code § 4735.13, which of the following satisfies the requirement that a broker
  maintain a definite place of business?
options:
  - A storage unit rented to hold the broker's client files
  - A virtual mailing address with no physical office
  - A post office box registered under the broker's name
  - A physical office location where business is conducted
key: D
explanation: Section 4735.13 requires every broker to maintain a definite place of business in the
  state and specifically states that a post office box address is not a definite place of business
  for purposes of the section.
citation:
  source: Ohio Rev. Code § 4735.13
  url: null
  quoted_text: Every real estate broker licensed under this chapter shall have and maintain a definite
    place of business in this state. A post office box address is not a definite place of business
    for purposes of this section.
