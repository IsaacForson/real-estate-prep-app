stem: A salesperson submits her fingerprint card to the Ohio Bureau of Criminal Identification and
  Investigation on the eleventh day after receiving a request from the superintendent. According to
  Ohio Adm. Code Rule 1301:5-1-23, what is the likely consequence?
options:
  - Automatic suspension of the licensee's license
  - Just cause to close the file and forfeit the application fee
  - Prima facie evidence of a violation under 4735.18(A)(6)
  - No violation because the deadline is fifteen days
key: C
explanation: The rule provides that failure to timely comply with the superintendent's request may
  be considered prima facie evidence of a violation of division (A)(6) of section 4735.18.
  Submitting on the eleventh day misses the ten-day deadline, so this consequence applies. The
  distractor about just cause applies to applicants who fail to comply, not licensees who are late.
