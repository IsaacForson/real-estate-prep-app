stem: Under Ohio Adm. Code Rule 1301:5-1-02(C)(2), if a broker is approved to conduct business under
  more than one trade name, what must the broker do in advertising?
options:
  - The licensee must advertise in at least one of the approved trade names as it appears on the
    license or addendum
  - The licensee must include the word 'Inc.' or 'Co.' in all advertising materials
  - The licensee must use the broker's personal name rather than any trade name when conducting
    business
  - The licensee must change the trade name every six months to remain compliant and maintain
    licensure
key: A
explanation: Under Ohio Adm. Code Rule 1301:5-1-02(C)(2), a broker approved for multiple trade names
  must advertise using at least one of those exact trade names as shown on the license or addendum.
  Using any one of the approved trade names satisfies the requirement; the rule does not require
  adding corporate suffixes, changing names periodically, or using the broker's personal name.
