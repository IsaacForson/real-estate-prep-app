  url: null
  quoted_text: The term advertising or advertisement does not include forms of private communication
    between a licensee and a client, customer or prospective client, including but not limited to
    the dissemination of information about properties available for purchase or lease, private mail,
    voicemail, email, password protected websites or facsimile transmissions, provided such
    communications are initiated at the request of a client, customer or prospective client.
