stem: Under Ohio Adm. Code 1301:5-1-02(I), which of the following is **NOT** considered advertising?
options:
  - A television spot promoting brokerage services
  - A newspaper advertisement for a listed property
  - A billboard advertisement for a listed property
  - A private email to a client at client's request
key: D
explanation: The rule states that advertising does not include forms of private communication
  between a licensee and a client, customer or prospective client, including private mail,
  voicemail, email, etc., provided such communications are initiated at the request of a client,
  customer or prospective client. Therefore a private email sent at client's request is not
  advertising. The newspaper ad, TV commercial, and billboard sign are all forms of advertising.
citation:
