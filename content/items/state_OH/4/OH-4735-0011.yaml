stem: Under R.C. 4735.62, what role does a licensee occupy when representing a client in an agency
  relationship?
options:
  - A general agent who follows the client's verbal directions
  - A neutral facilitator who stays equally loyal to both parties
  - A fiduciary who works to further the client's interest
  - An independent contractor with no listing duties
key: C
explanation: R.C. 4735.62 states that in representing a client in an agency or subagency
  relationship, the licensee shall be a fiduciary of the client and shall use the licensee's best
  efforts to further the client's interest.
