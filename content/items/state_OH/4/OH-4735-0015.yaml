stem: A licensee wants to represent both the seller and the purchaser in the same transaction as a
  dual agent. Under R.C. 4735.71, what must occur before the licensee may do so?
options:
  - The seller alone gives verbal consent to this dual agency arrangement
  - The brokerage certifies consent without a signature from either party
  - Both parties give informed written consent to the dual agency
  - The purchaser alone signs a consent form before the offer is presented
key: C
explanation: R.C. 4735.71 prohibits a licensee from participating in a dual agency relationship
  unless both the seller and the purchaser have full knowledge of the dual representation and
  consent to it in writing.
citation:
  source: Ohio Rev. Code § 4735.71
  url: null
  quoted_text: No licensee or brokerage shall participate in a dual agency relationship described in
    section 4735.70 of the Revised Code unless both the seller and the purchaser in the transaction
    have full knowledge of the dual representation and consent in writing to the dual representation
