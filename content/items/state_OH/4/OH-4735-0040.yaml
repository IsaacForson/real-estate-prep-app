stem: A seller lies to her listing agent about the age of the roof, and the agent repeats that false
  information to the buyer without knowing it was untrue. Under Ohio Rev. Code § 4735.68, is the
  agent liable to the buyer?
options:
  - No, unless the agent knew the info was false or ignored the truth recklessly
  - Yes, an agent remains liable for any information that a client later calls false
  - No, an agent bears no liability for a client's own statements
  - Yes, an agent is liable no matter what the agent knew or believed
key: A
explanation: Section 4735.68 provides that a licensee is not liable for false information a client
  provided that the licensee passed on to another party, unless the licensee had actual knowledge
  the information was false or acted with reckless disregard for the truth.
citation:
  source: Ohio Rev. Code § 4735.68
  url: null
  quoted_text: A licensee is not liable to any party for false information that the licensee's client
    provided to the licensee and that the licensee in turn provided to another party in the real
    estate transaction, unless the licensee had actual knowledge that the information was false or
    acted with reckless disregard for the truth.
