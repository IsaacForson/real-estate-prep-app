stem: A listing agent shows a prospective purchaser several other sellers' properties in addition to
  her own seller's listing. Under Ohio Rev. Code § 4735.63, has the agent breached her duty to her
  seller client?
options:
  - No, showing alternative properties to a purchaser does not breach the duty
  - No, the duty to the seller ends as soon as another property is shown
  - Yes, showing alternative properties requires the seller's prior written consent
  - Yes, showing a competing property to any purchaser breaches the duty automatically
key: A
explanation: Section 4735.63 provides that a licensee does not breach any duty or obligation to a
  seller client by showing alternative properties to a prospective purchaser or by acting as an
  agent for other sellers.
citation:
  source: Ohio Rev. Code § 4735.63
  url: null
  quoted_text: A licensee does not breach any duty or obligation to a seller with whom the licensee
    has an agency relationship by showing alternative properties to a prospective purchaser or by
    acting as an agent or subagent for other sellers.
