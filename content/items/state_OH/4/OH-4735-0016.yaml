stem: A salesperson is affiliated with the same brokerage as the listing agent but did not help form
  the agency relationship, received no confidential information, holds no management duties, and was
  never appointed by the client. Under R.C. 4735.53, what is that salesperson's status toward the
  client?
options:
  - The salesperson is automatically an agent because of the shared brokerage
  - The salesperson becomes an agent once the transaction closes
  - The salesperson becomes an agent if the client later objects
  - The salesperson is not an agent of the client under R.C. 4735.53
key: D
explanation: R.C. 4735.53 provides that, except for the specific circumstances listed in the
  section, another licensee affiliated with the same brokerage is not an agent of that client.
citation:
  source: Ohio Rev. Code § 4735.53
  url: null
  quoted_text: Except as otherwise provided in divisions (B)(1) to (4) of this section, another
    licensee who is affiliated with the same brokerage as the licensee is not an agent of that
    client.
