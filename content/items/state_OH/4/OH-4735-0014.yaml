stem: Under R.C. 4735.70, which of the following is defined as a dual agent?
options:
  - A licensee who merely refers a purchaser to another brokerage
  - A licensee representing both the seller and the purchaser as clients
  - A licensee who represents the purchaser alone in a single transaction
  - A licensee who assists an unrepresented seller with paperwork tasks
key: B
explanation: R.C. 4735.70 defines a dual agent to include a licensee who represents both the
  purchaser and the seller as clients in the same real estate transaction.
