stem: A buyer's agent is preparing offers to purchase the same property on behalf of two different
  purchaser clients. Before preparing a contemporaneous offer, what must the licensee do under R.C.
  4735.65?
options:
  - Disclose that fact to each client for whom offers are being prepared
  - Disclose that fact to the seller receiving the competing offers
  - Withhold the fact from those clients until after closing occurs
  - Disclose the fact once a client specifically requests the information
key: A
explanation: R.C. 4735.65 requires that, prior to preparing a contemporaneous offer, the licensee
  disclose that fact to all clients for whom the licensee is preparing, presenting, or has prepared
  or presented contemporaneous offers to purchase or lease the same property.
