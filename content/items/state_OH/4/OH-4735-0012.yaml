  - Seek the highest possible price regardless of the seller's stated terms
  - Seek a purchase offer after the seller signs a brand-new listing form
  - Seek a purchase offer at a price and terms acceptable to the seller
key: D
explanation: R.C. 4735.63 requires a licensee representing a seller to seek a purchase offer at a
  price and with terms acceptable to the seller.
