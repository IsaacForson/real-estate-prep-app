stem: A buyer's agent is preparing purchase offers for two different clients on the same property at
  the same time. Under Ohio Rev. Code § 4735.65, what must the agent do before preparing the second
  offer?
options:
  - Cancel one client's pending purchase offer to avoid a scheduling conflict
  - Represent the client who signed with the agent earlier
  - Disclose the contemporaneous offers and offer a referral if asked
  - Wait for the first offer to be accepted before starting the next
key: C
explanation: Section 4735.65 requires a licensee to disclose contemporaneous offers to all affected
  clients before preparing them and to refer to another licensee any client who requests a referral.
citation:
  source: Ohio Rev. Code § 4735.65
  url: null
  quoted_text: Prior to preparing a contemporaneous offer, a licensee shall disclose that fact to all
    clients for whom the licensee is preparing, presenting, or has prepared or presented
    contemporaneous offers to purchase or lease the same property and shall refer to another
    licensee any client that requests such referral.
