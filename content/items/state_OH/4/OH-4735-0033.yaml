stem: Under Ohio Rev. Code § 4735.62, what standard applies to a licensee representing a client in
  an agency relationship?
options:
  - The licensee is a subagent who answers to the listing broker alone
  - The licensee is a fiduciary who uses best efforts for the client
  - The licensee is a neutral party owing both sides equal duties
  - The licensee is an independent contractor owing the client nothing
key: B
explanation: Section 4735.62 states that in representing any client, the licensee shall be a
  fiduciary of the client and shall use the licensee's best efforts to further the interest of the
  client.
citation:
  source: Ohio Rev. Code § 4735.62
  url: null
  quoted_text: In representing any client in an agency or subagency relationship, the licensee shall
    be a fiduciary of the client and shall use the licensee's best efforts to further the interest
    of the client
