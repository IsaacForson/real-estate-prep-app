stem: A licensee is unaware of a hidden structural defect that a diligent inspection would not
  reveal but does know of a visible material fact about the property. Reconciling R.C. 4735.67's
  disclosure duty with its limits on discovering latent defects, what must the licensee disclose to
  the purchaser?
options:
  - Disclosing every possible defect regardless of the licensee's actual knowledge
  - Disclosing nothing unless the seller first authorizes the disclosure
  - Disclosing defects that the purchaser's own inspector later finds
  - Disclosing known material facts that a diligent inspection would miss
key: D
explanation: R.C. 4735.67 requires disclosure of material facts of which the licensee has actual
  knowledge that a reasonably diligent inspection would not reveal, while separately providing that
  a licensee need not discover latent defects beyond the scope of required knowledge.
citation:
  source: Ohio Rev. Code § 4735.67
  url: null
  quoted_text: A licensee shall disclose to any purchaser all material facts of which the licensee has
    actual knowledge pertaining to the physical condition of the property that the purchaser would
    not discover by a reasonably diligent inspection
