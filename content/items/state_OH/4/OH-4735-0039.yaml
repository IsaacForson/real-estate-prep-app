stem: A licensee represents both the buyer and seller in the same transaction but never obtains
  either party's written consent to the dual representation. Under Ohio Rev. Code § 4735.71, is this
  dual agency lawful?
options:
  - Yes, verbal consent from either party is enough to proceed
  - Yes, a dual agency relationship may proceed with no disclosure whatsoever
  - No, dual agency needs written consent from the buyer alone
  - No, dual agency needs written consent from both parties after disclosure
key: D
explanation: Section 4735.71 prohibits a licensee from participating in a dual agency relationship
  unless both the seller and the purchaser have full knowledge of the dual representation and
  consent to it in writing.
citation:
  source: Ohio Rev. Code § 4735.71
  url: null
  quoted_text: No licensee or brokerage shall participate in a dual agency relationship described in
    section 4735.70 of the Revised Code unless both the seller and the purchaser in the transaction
    have full knowledge of the dual representation and consent in writing to the dual representation
    on the agency disclosure statement described in section 4735.57 of the Revised Code.
