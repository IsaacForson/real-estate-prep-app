stem: Two licensees affiliated with the same brokerage each represent a separate client in the same
  transaction. Under R.C. 4735.72, what duty does each licensee owe regarding whom they serve?
options:
  - Serve as the agent for the party who first contacted the brokerage
  - Serve as the agent for both parties once the transaction is under contract
  - Act exclusively as agent for the party the licensee agreed to represent
  - Serve as the agent for whichever party pays the licensee's commission
key: C
explanation: R.C. 4735.72 requires each affiliated licensee in that situation to serve as the agent
  of only the party in the transaction the licensee agreed to represent.
