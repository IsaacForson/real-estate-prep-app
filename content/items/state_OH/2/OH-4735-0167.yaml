stem: A complainant files a signed written complaint against a licensee, but neither party requests
  an informal mediation meeting. Under Ohio Rev. Code § 4735.051(C), within how many business days
  must the superintendent notify the parties and begin an investigation after determining that no
  informal mediation meeting will be held?
options:
  - Five business days.
  - Ten business days.
  - Fifteen business days.
  - Twenty business days.
key: A
explanation: The statute requires the superintendent to notify the complainant and licensee and to
  investigate within five business days of determining that no informal mediation meeting will be
  held. The ten‑business‑day option reflects the period for requesting such a meeting, not the
  notification deadline.
citation:
  source: Ohio Rev. Code § 4735.051(C)
  url: null
  quoted_text: If the complainant and licensee fail to agree to an informal mediation meeting or fail
    to reach an accommodation the superintendent shall, within five business days of such
    determination, so notify the complainant and licensee and shall investigate the conduct of the
    licensee against whom the complaint is filed.
