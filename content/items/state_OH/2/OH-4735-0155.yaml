stem: A provider seeks approval for a distance education course. According to Ohio Adm. Code
  1301:5-7-08(D)(1), which of the following must be included in the application?
options:
  - A detailed outline of the course topics and learning objectives
  - A summary of the course design methods ensuring active student participation
  - A complete copy of the course on the medium that is to be utilized
  - A description of the instructor's qualifications and teaching experience
key: C
explanation: Under Ohio Adm. Code 1301:5-7-08(D)(1), the application must include a complete copy of
  the course on the medium to be utilized. The other options describe useful information but are not
  required by this provision.
