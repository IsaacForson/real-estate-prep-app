stem: A broker moves her office to a new location on March 10, 2025. By what date must she give
  notice to the superintendent to avoid prima-facie evidence of misconduct?
options:
  - April 9, 2025
  - April 10, 2025
  - March 31, 2025
  - May 10, 2025
key: A
explanation: Ohio Rev. Code § 4735.13(D) requires a broker to give notice to the superintendent
  within thirty days after a change of business location. Adding thirty days to March 10, 2025
  yields April 9, 2025 as the deadline. The distractor of April 10, 2025 would be one day late,
  violating the deadline.
