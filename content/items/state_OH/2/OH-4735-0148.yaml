stem: A licensee who has been representing a seller wishes to start representing the buyer in the
  same transaction after an agency disclosure statement has been signed. According to Ohio Rev. Code
  § 4735.59, what must the licensee do?
options:
  - Obtain written consent from the party originally represented to represent another party in the
    transaction.
  - Obtain verbal consent from the seller to switch representation to the buyer without any written
    agreement.
  - Notify the broker and continue without obtaining any additional consent from the involved
    parties.
  - Proceed with dual agency representation without obtaining any additional consent from the
    parties.
key: A
explanation: The statute requires written consent from the party originally represented before a
  licensee can represent another party in the same transaction. Therefore, obtaining only verbal
  consent, as described in the option that suggests obtaining only verbal consent without a written
  agreement, does not satisfy the requirement under Ohio Rev. Code § 4735.59.
citation:
  source: Ohio Rev. Code ch. 4735 — Ohio Revised Code Chapter 4735 — Real Estate Brokers, official
    Ohio Laws (codes.ohio.gov) chapter page read via Internet Archive capture of 2026-05-14 because
    codes.ohio.gov times out for scripts § 4735.59
  url: null
  quoted_text: To change the party a licensee represents in a real estate transaction after an agency
    disclosure statement has been signed and dated, following verbal disclosure of the agency
    relationship, or following an agency agreement under section 4735.55 of the Revised Code, the
    licensee shall obtain written consent from the party originally represented to represent another
    party in the transaction.
