stem: When a broker provides a purchaser with only two licensed home‑inspector names, which
  statutory requirement has been violated?
options:
  - the requirement that the broker provide the buyer with the names of at least three licensed home
    inspectors
  - the requirement that the broker endorse one of the listed home inspectors
  - the requirement that the broker disclose any financial interest in the home inspectors
  - the requirement that the broker obtain written consent from the buyer before naming any home
    inspector
key: A
explanation: Section 4735.22 mandates that a broker or salesperson must give the buyer or seller the
  names of at least three licensed home inspectors. Providing fewer than three names violates this
  requirement; endorsement, disclosure, or consent are not required by the statute.
