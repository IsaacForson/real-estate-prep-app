stem: Under Ohio Adm. Code 1301:5-1-18(B)(1), within how many days must a licensee pay a fine
  imposed by the real estate commission?
options:
  - The licensee must pay the fine within 120 days.
  - The licensee must pay the fine within 90 days.
  - The licensee must pay the fine within 60 days.
  - The licensee must pay the fine within 30 days.
key: D
explanation: The rule specifies that payment of any fine must be received by the division within
  thirty days of the commission's order imposing the fine. Therefore, the correct timeframe is
  thirty days. The sixty‑day option is incorrect because the rule does not allow an automatic
  extension for fine payment unless the superintendent grants an extended payment period under
  paragraph (B)(2), which is not assumed in the question.
