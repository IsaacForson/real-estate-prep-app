stem: Under Ohio Adm. Code 1301:5-1-10(A)(2)(e)(ii), who is entitled to the interest earned on a
  property management trust account unless otherwise specified in a written contract?
options:
  - The brokerage.
  - The property owner.
  - The real estate recovery fund.
  - The state treasury.
key: B
explanation: The rule provides that interest earned on property management trust accounts maintained
  in the name of the property owner or the broker shall be payable to the property owner unless
  otherwise specified in a written contract. Therefore, absent a contrary agreement, the property
  owner receives the interest. The brokerage would receive interest only if the contract directs it
  there.
