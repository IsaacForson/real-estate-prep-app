stem: A licensee’s license has been suspended. The renewal fee for the license is $80. If the
  licensee reactivates the license within twelve months of suspension, what total amount must be
  paid to the superintendent?
options:
  - "080"
  - "100"
  - "120"
  - "140"
key: C
explanation: The rule requires payment of the renewal fee plus a penalty fee equal to fifty percent
  of the renewal fee for reactivation within twelve months of suspension. Fifty percent of $80 is
  $40, so the total is $80 + $40 = $120.
citation:
  source: Ohio Rev. Code ch. 4735 — Ohio Revised Code Chapter 4735 — Real Estate Brokers, official
    Ohio Laws (codes.ohio.gov) chapter page read via Internet Archive capture of 2026-05-14 because
    codes.ohio.gov times out for scripts § 4735.14(C)
  url: null
  quoted_text: A suspended license may be reactivated within twelve months of the date of suspension,
    provided that the renewal fee plus a penalty fee of fifty per cent of the renewal fee is paid to
    the superintendent.
