stem: An applicant failed the foreign real estate dealer examination on March 1 and again on April
  15. Assuming no other failures, what is the earliest month/day the applicant may re‑take the
  examination?
options:
  - 10/15
  - 12/15
  - 06/15
  - 09/01
key: A
explanation: After two examination failures, Ohio Rev. Code § 4735.27(D) requires a six‑month
  waiting period before retaking the exam. Six months after the second failure on April 15 is
  October 15. The other dates result from using the first failure date, mis‑adding months, or
  incorrectly applying the waiting period.
