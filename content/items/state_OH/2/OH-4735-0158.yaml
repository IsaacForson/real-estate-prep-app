stem: An out-of-state commercial broker receives a $12,000 earnest money deposit from a buyer for a
  commercial property purchase in Ohio. The broker is working under a written cooperation agreement
  with an Ohio-licensed broker. What must the out-of-state broker do with the deposit?
options:
  - Deposit the $12,000 in the out-of-state broker's own escrow account
  - Return the $12,000 to the buyer if the transaction fails to close
  - Deposit the $12,000 in a trust or special account maintained by the Ohio broker
  - Hold the $12,000 in escrow until closing then remit to the Ohio broker
key: C
explanation: Under Ohio Rev. Code § 4735.022(A)(6), escrow funds must be deposited in a trust or
  special account maintained by the Ohio broker with whom the out‑of‑state broker cooperates.
  Depositing the money in the out‑of‑state broker’s own account, holding it until closing, or
  returning it to the buyer violates that requirement.
