stem: A broker receives a written request from the superintendent for notification that a
  salesperson has left the brokerage. According to Ohio law, within how many business days must the
  broker notify the superintendent by electronic mail?
options:
  - 1 days
  - 3 days
  - 5 days
  - 7 days
key: B
explanation: The correct answer is 3 days because §4735.13(B) requires the broker to notify the
  superintendent within three business days of receiving a written request; failure to do so is
  prima‑facie evidence of misconduct. The distractor 5 days mistakenly uses the 15‑day period for
  other notification requirements under §4735.13(C).
citation:
  source: Ohio Rev. Code ch. 4735 — Ohio Revised Code Chapter 4735 — Real Estate Brokers, official
    Ohio Laws (codes.ohio.gov) chapter page read via Internet Archive capture of 2026-05-14 because
    codes.ohio.gov times out for scripts — § 4735.13(B)
  url: null
  quoted_text: The failure of a broker to notify the superintendent of real estate in writing of a
    real estate salesperson or broker who leaves or who is terminated, via electronic mail, within
    three business days of the receipt of a written request from the superintendent for such
    notification, is prima-facie evidence of misconduct under division (A)(6) of section 4735.18 of
    the Revised Code.
