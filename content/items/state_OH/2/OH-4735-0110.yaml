stem: A brokerage fails to submit its annual brokerage assessment and fee by the June 30 deadline.
  According to Ohio Adm. Code 1301:5-1-20(D), what is the automatic consequence of this failure?
options:
  - Exemption from next year's assessment
  - Double the assessment amount
  - Suspension of the license
  - A warning letter from the division
key: C
explanation: The rule states that failure to file the annual brokerage assessment along with the
  requisite fee on or before June thirtieth shall result in the suspension of the license.
  Therefore, the license is suspended. A warning letter, double fee, or exemption are not mentioned
  as automatic consequences for missing the deadline.
