stem: A licensee working with a purchaser as the buyer's agent first discusses making an offer via
  email. What must the licensee do regarding the brokerage policy on agency?
options:
  - Wait for a signed agency agreement before providing the policy to the purchaser.
  - Provide the policy only when the purchaser refuses to sign the disclosure statement.
  - Provide the policy before discussing the offer and obtain the purchaser’s signature.
  - Disclose the agency relationship via email and provide the policy at the first meeting after
    that disclosure.
key: D
explanation: Because the earliest communication is by email, Ohio Rev. Code § 4735.56(E) requires
  the licensee to disclose the agency relationship by that same medium and to provide the brokerage
  policy at the first meeting after that disclosure. The option that says to wait for a signed
  agency agreement before providing the policy to the purchaser is incorrect because the policy does
  not need to be withheld until an agreement is signed. The option that says to provide the policy
  only when the purchaser refuses to sign the disclosure statement is incorrect because the policy
  must be provided regardless of the purchaser’s willingness to sign. The option that says to
  provide the policy before discussing the offer and obtain the purchaser’s signature is incorrect
  because the rule does not require providing the policy prior to discussing the offer or obtaining
  a signature at that time.
