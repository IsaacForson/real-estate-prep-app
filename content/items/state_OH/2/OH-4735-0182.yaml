stem: A provider submits an application for a new continuing education course offering 18 days
  before the scheduled offering date. According to Ohio Adm. Code 1301:5-7-06(B)(1), what penalty
  must the provider pay per credit hour per attendee to request a waiver of the notification
  requirement?
options:
  - The penalty is two dollars per credit hour per attendee.
  - The penalty is one dollar per credit hour per attendee.
  - The penalty is ten dollars per credit hour per attendee.
  - The penalty is five dollars per credit hour per attendee.
key: A
explanation: According to Ohio Adm. Code 1301:5-7-06(B)(1), a provider that submits a new continuing
  education course offering less than forty‑five days but not less than fifteen days before the
  offering must pay a penalty of two dollars per credit hour per attendee to obtain a waiver. The
  penalty is not one dollar per credit hour per attendee; it is specifically two dollars.
