stem: A brokerage's team advertises using the name 'Realty Associates' without including the term
  'group' or 'team' in the team name. According to Ohio Adm. Code 1301:5-1-21, what is the
  consequence?
options:
  - The failure constitutes prima facie evidence of a violation of division (A)(21) of section
    4735.18 of the Revised Code.
  - The advertisement is permissible only if photos of all team members are clearly included.
  - The brokerage must pay an annual fine equal to fifty percent of the commission earned.
  - The team must promptly rename within ten days to avoid disciplinary action from the division.
key: A
explanation: The rule provides that failure to advertise as required is prima facie evidence of a
  violation of division (A)(21) of section 4735.18 of the Revised Code. The distractors incorrectly
  suggest permissibility with photos, a fine based on commission, or a mandatory rename deadline,
  none of which are stated in the rule.
