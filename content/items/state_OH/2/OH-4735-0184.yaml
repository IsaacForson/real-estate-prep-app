stem: A broker whose license has been placed in permanently resigned status wishes to return to
  active practice. What must the broker do?
options:
  - Pay the nonrefundable reactivation fee and await automatic reinstatement of the license.
  - Request the superintendent to remove the permanently resigned status without further action.
  - Apply for a new license meeting the initial licensing requirements under section 4735.07 or
    4735.09 or the commission's rules.
  - Submit proof of completion of the required thirty hours of continuing education to the
    superintendent.
key: C
explanation: The rule states that a broker with a permanently resigned license who wants an active
  or inactive license must apply for a new license meeting the initial licensing requirements under
  section 4735.07 or 4735.09 or the commission's rules. The correct option reflects this
  requirement. The option that suggests paying a nonrefundable reactivation fee leads to automatic
  reinstatement is incorrect because the statute requires a new application; there is no automatic
  reinstatement.
