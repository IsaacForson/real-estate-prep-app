  source: Ohio Rev. Code ch. 4735 — Ohio Revised Code Chapter 4735 — Real Estate Brokers, official
    Ohio Laws (codes.ohio.gov) chapter page read via Internet Archive capture of 2026-05-14 because
    codes.ohio.gov times out for scripts § 4735.142(C)
  url: null
  quoted_text: If a person whose license is in a permanently resigned status pursuant to a request
    made under this section wishes to obtain an active or inactive license, the person shall apply
    for such a license in accordance with the requirements specified in section 4735.07 or 4735.09
    of the Revised Code, as applicable, or in the rules adopted by the commission pursuant to
    division (A) of section 4735.10 of the Revised Code.
