stem: If a licensee holds both an inactive salesperson license and an inactive broker license, which
  renewal fee must the licensee pay when renewing under Ohio Adm. Code 1301:5-1-19?
options:
  - The salesperson license fee
  - No fee is required
  - The broker license fee
  - The sum of both fees
key: C
explanation: The rule states that when both broker and sales licenses are inactive, the licensee
  shall pay the renewal fee for the broker license. Therefore, the broker license fee applies. The
  salesperson fee is incorrect because it applies only when that license is active. Paying both fees
  or no fee is not permitted.
