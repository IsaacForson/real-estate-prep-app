stem: Under Ohio Rev. Code § 4735.022(A)(6), what must an out-of-state commercial broker do with
  escrow funds, security deposits, or other money received in connection with a commercial real
  estate transaction?
options:
  - Deposit the funds in the out-of-state broker's own trust account
  - Deposit the funds in trust or special accounts maintained by the cooperating Ohio broker
  - Return the funds to the buyer if the transaction fails
  - Hold the funds in escrow until closing then remit to the Ohio broker
key: B
explanation: The rule requires the out‑of‑state broker to deposit all escrow funds, security
  deposits, and other money received in a trust or special account maintained by the cooperating
  Ohio broker. Depositing the money in the out‑of‑state broker’s own account, holding it until
  closing, or returning it prematurely violates that requirement.
