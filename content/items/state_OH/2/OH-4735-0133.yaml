stem: Under Ohio Adm. Code 1301:5-1-21, what is the legal effect of failing to advertise a real
  estate team in accordance with the rule?
options:
  - It requires the team to cease all advertising until the violation is corrected.
  - It leads to the automatic suspension of the broker's license pending review.
  - It results in an automatic fine of five hundred dollars for the first violation.
  - It constitutes prima facie evidence of a violation of division (A)(21) of section 4735.18 of the
    Revised Code.
key: D
explanation: The rule explicitly states that failure to advertise as provided shall be prima facie
  evidence of a violation of division (A)(21) of section 4735.18 of the Revised Code. The
  distractors incorrectly suggest automatic fines, required cessation of advertising, or automatic
  suspension, which are not stated in the rule.
