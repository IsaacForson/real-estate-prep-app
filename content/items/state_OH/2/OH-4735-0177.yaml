stem: Under Ohio Adm. Code 1301:5-1-19(C), what is the consequence if a licensee fails to reactivate
  a suspended license within twelve months of the suspension date?
options:
  - Revocation of the licensee's license.
  - A fine of $2,500 per violation.
  - Mandatory completion of continuing education.
  - Suspension of the license for six months.
key: A
explanation: The rule states that a license shall be revoked for failure to reactivate a suspended
  license within twelve months of the suspension date. The other options describe penalties or
  requirements not mentioned in this provision.
