stem: After scheduling a hearing for a licensee disciplinary case, the superintendent receives
  additional evidence and withdraws the notice of hearing. Under Ohio Rev. Code § 4735.051(D), what
  action must the superintendent take regarding the complainant and licensee upon withdrawal?
options:
  - Impose a civil penalty of up to two thousand five hundred dollars and close the file.
  - Refer the case to the attorney general for prosecution and request a contempt hearing.
  - Notify the complainant and licensee of the determination and basis.
  - Schedule a new hearing within seven business days and notify the parties.
key: C
explanation: Upon withdrawal of a hearing notice, the superintendent must notify the complainant and
  licensee of the determination and basis for that determination. Scheduling a new hearing is not
  required by the rule after withdrawal.
