stem: An out-of-state commercial broker provides the required documentation to the cooperating Ohio
  broker for a commercial transaction. According to Ohio Rev. Code § 4735.022(A)(7), for how long
  must the Ohio broker retain that documentation and related records?
options:
  - Seven years
  - Four years
  - Five years
  - Three years
key: D
explanation: The rule states that the Ohio broker must retain the documentation provided by the
  out‑of‑state broker and related transaction records for a period of three years after the date the
  documentation is provided or the transaction occurred, as appropriate. A two‑year retention period
  does not satisfy this requirement.
