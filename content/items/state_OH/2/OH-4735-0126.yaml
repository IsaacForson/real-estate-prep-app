stem: Under Ohio law, which act is prohibited when seeking qualification as a foreign real estate
  salesperson?
options:
  - Not providing a written agency agreement to a client upon request
  - Accepting a referral fee from a mortgage lender without disclosure
  - Knowingly making a false representation concerning a material fact
  - Failing to submit the renewal application before the expiration date
key: C
explanation: Ohio Rev. Code § 4735.30 prohibits knowingly making a false representation concerning a
  material and relevant fact for the purpose of securing qualification as a foreign real estate
  salesperson. The other options describe renewal timing, agency agreements, and referral fees,
  which are governed by different statutes and are not prohibited acts under § 4735.30.
citation:
  source: Ohio Rev. Code ch. 4735 — Ohio Revised Code Chapter 4735 — Real Estate Brokers, official
    Ohio Laws (codes.ohio.gov) chapter page read via Internet Archive capture of 2026-05-14 because
    codes.ohio.gov times out for scripts § 4735.30
  url: null
  quoted_text: No person shall knowingly make or cause to be made any false representation concerning
    a material and relevant fact, in any oral statement or in any description, application, or
    written statement, for the purpose of securing the qualification of any foreign real estate
    under section 4735.25 of the Revised Code.
