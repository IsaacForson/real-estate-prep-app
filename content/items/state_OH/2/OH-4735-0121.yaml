stem: Under Ohio Revised Code section 4735.06(B)(4), what must a brokerage do after receiving
  approval to use a trade name?
options:
  - Using only the approved trade name in all advertising
  - Using both the legal name and the trade name in advertising
  - Using any name other than the approved trade name in advertising
  - Using the approved trade name only in print advertising
key: A
explanation: The rule states that approved trade names shall be the only identifying names used by
  the brokerage in all advertising, so using only the approved trade name in all advertising is
  required. Using both the legal name and the trade name in advertising violates this requirement
  because it introduces an additional identifying name.
