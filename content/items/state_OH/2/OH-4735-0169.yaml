stem: What is the nonrefundable fee for reactivation or transfer of a real estate salesperson's
  license in Ohio?
options:
  - $34.00
  - $20.00
  - $68.00
  - $182.00
key: A
explanation: The correct answer is $34.00 because §4735.15(A)(2) states that reactivation or
  transfer of a license by a real estate salesperson is thirty-four dollars. The most tempting
  distractor is $20.00, which applies to a branch office license under §4735.15(B)(1), not to
  salesperson reactivation.
