stem: Under Ohio Rev. Code § 4735.24(A), what type of account must a broker use to hold earnest
  money connected to a real estate purchase agreement?
options:
  - A trust or special account
  - A personal checking account
  - A title company escrow account
  - A broker’s savings account
key: A
explanation: The statute requires that earnest money be maintained in a trust or special account
  until the purchase agreement terms are satisfied. Placing the money in a personal checking account
  violates this requirement.
