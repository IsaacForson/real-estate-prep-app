stem: Under Ohio Rev. Code § 4735.051(A), who is required to acknowledge receipt of a signed written
  complaint against a licensee and send a notice to the licensee describing the acts complained of?
options:
  - The complainant
  - The licensee
  - The superintendent
  - The hearing examiner
key: C
explanation: The statute states that within five business days after a complaint is filed, the
  superintendent of real estate shall acknowledge receipt and send a notice to the licensee
  describing the acts complained of. The complainant, licensee, and hearing examiner are not
  assigned this duty by the provision.
