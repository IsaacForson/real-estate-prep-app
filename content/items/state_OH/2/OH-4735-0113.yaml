  url: null
  quoted_text: Within five business days after a person files a signed written complaint against a
    licensed real estate broker or licensed real estate salesperson with the division of real
    estate, the superintendent of real estate shall acknowledge receipt of the complaint and send a
    notice to the licensee describing the acts complained of.
