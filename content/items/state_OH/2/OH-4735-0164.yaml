stem: A licensee receives a notice of pending revocation sent via regular mail on July 1, stating
  that the license will be revoked on September 1 and that the reason is failure to pay renewal
  fees. The notice does not include the procedure to reactivate. According to Ohio Adm. Code
  1301:5-1-19(D), is the notice compliant?
options:
  - No, because it was sent fewer than sixty days before revocation
  - Yes, because it includes the revocation date and reason
  - Yes, because regular mail is an authorized delivery method
  - No, because it omits the reactivation procedure
key: D
explanation: The notice must specify the reactivation procedure; omitting it makes the notice
  noncompliant. The timing is actually sufficient because July 1 is more than sixty days before
  September 1.
