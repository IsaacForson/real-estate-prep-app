stem: According to Ohio Adm. Code 1301:5-7-09(E), what is the minimum percentage of course time a
  licensee must be physically present to have their attendance certified?
options:
  - At least eighty per cent
  - At least eighty-five per cent
  - At least ninety-five per cent
  - At least ninety per cent
key: D
explanation: The rule explicitly states that a provider may not certify attendance unless the
  licensee was physically present for at least ninety per cent of the course. Options with lower
  percentages do not meet this threshold, while higher percentages exceed the minimum but are not
  the standard set by the rule. Hence the correct answer is the ninety per cent option.
