stem: A licensee's license was suspended on January 1, 2025 for disciplinary reasons. The licensee
  submits a reactivation application on March 1, 2026. What is the status of the license under Ohio
  Adm. Code 1301:5-1-19(C)?
options:
  - The license has been revoked due to failure to reactivate within twelve months.
  - The licensee must retake the salesperson examination.
  - The license remains suspended until reactivation is completed.
  - The license is automatically reinstated after paying a late fee.
key: A
explanation: More than twelve months have elapsed between the suspension date (January 1, 2025) and
  the reactivation attempt (March 1, 2026). The rule mandates revocation when reactivation does not
  occur within twelve months of suspension.
