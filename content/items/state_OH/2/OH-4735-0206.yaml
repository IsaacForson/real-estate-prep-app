stem: A broker provides the required pamphlet to a client. What must the pamphlet contain according
  to Ohio Rev. Code?
options:
  - A summary of the broker’s commission rates and fees.
  - The same statement that is required on the displayed fair housing statement.
  - A list of all current property listings in the broker’s inventory.
  - A copy of the broker’s license and salesperson licenses.
key: B
explanation: Under Ohio Rev. Code ch. 4735 § 4735.03, the pamphlet must contain the same statement
  as the displayed fair housing statement. The distractor about commission rates is incorrect
  because the pamphlet does not require fee disclosure.
