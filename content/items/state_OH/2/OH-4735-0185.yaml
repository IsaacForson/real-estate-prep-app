stem: An applicant who has not disclosed any criminal offense satisfies all other requirements for
  licensure. According to Ohio Rev. Code § 4735.143(C), what status may the applicant receive before
  the superintendent receives the results of the criminal records check?
options:
  - Receive a permanent license immediately after passing the examination, pending the criminal
    records check.
  - Be issued a provisional license allowing performance of acts requiring a real estate license
    while awaiting the criminal records check results.
  - Be required to wait for the criminal records check results before being eligible to take the
    real estate examination.
  - Automatically be denied licensure if any criminal offense is later discovered, regardless of
    evidence of rehabilitation.
key: B
explanation: Under Ohio Rev. Code § 4735.143(C), an applicant who has not disclosed any criminal
  offense and satisfies all other licensure requirements may take the real estate examination before
  the superintendent receives the criminal records check results. If the applicant passes the
  examination, the superintendent shall issue a provisional license pending those results, allowing
  the licensee to perform acts that require a real estate license. Therefore, the correct choice is
  the one stating that the applicant may be issued a provisional license allowing performance of
  acts requiring a real estate license while awaiting the criminal records check results. The option
  stating that the applicant must wait for the check results before being eligible to take the
  examination is incorrect because the rule permits the exam prior to receipt of the results. The
  option claiming automatic denial of licensure if any criminal offense is later discovered,
  regardless of rehabilitation, misstates the rule, which only provides a provisional license
  pending the check and does not mandate automatic denial. The option describing receipt of a
  permanent license immediately after passing the examination, pending the check, is wrong because
  the license issued under this provision is provisional, not permanent.
citation:
  source: Ohio Rev. Code ch. 4735 — Ohio Revised Code Chapter 4735 — Real Estate Brokers, official
    Ohio Laws (codes.ohio.gov) chapter page read via Internet Archive capture of 2026-05-14 because
    codes.ohio.gov times out for scripts § 4735.143(C)
  url: null
  quoted_text: Persons who have indicated on the application that they have not been convicted of any
    criminal offense shall, if all other requirements for licensure have been satisfied, be
    permitted to take the real estate examination for which the applicant has applied prior to the
    superintendent's receipt of the results of the criminal records check. If the applicant receives
    a passing score on the examination and meets the other requirements for the license, the
    superintendent shall issue a provisional license pending the results of the criminal records
    check.
