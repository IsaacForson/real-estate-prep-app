stem: A licensee’s license was suspended for a second offense under Ohio Rev. Code §
  4735.18(A)(7)(b). After serving one month of the suspension, how many more months must the
  licensee serve to satisfy the minimum suspension period?
options:
  - 1 month.
  - 0 months.
  - 3 months.
  - 2 months.
key: A
explanation: The rule imposes a minimum suspension of two months for a second offense. After serving
  one month, one month remains to meet the minimum. Choosing two months would incorrectly treat the
  remaining time as the full minimum.
