stem: A foreign real estate dealer employs five salespersons. What is the renewal fee for the
  dealer's license?
options:
  - $150.00
  - $180.00
  - $203.00
  - $233.00
key: C
explanation: The fee is thirty dollars per salesperson employed, but not less than two hundred three
  dollars. Five salespersons yield $150, which is below the minimum, so the fee defaults to $203.
  The $180.00 option assumes six salespersons, and $233.00 adds an arbitrary amount to the
  per‑salesperson total.
citation:
  source: Ohio Rev. Code § 4735.15(B)(5)
  url: null
  quoted_text: Foreign real estate dealer's license and each renewal of the license, thirty dollars
    per salesperson employed by the dealer, but not less than two hundred three dollars;
  secondary: []
math:
  worked_solution: |-
    Multiply number of salespersons (5) by $30 per salesperson: 5 × 30 = 150.
    Since 150 is less than the minimum of $203, the fee is $203.
  formulas:
    - fee = max(num_salespersons × 30, 203)
