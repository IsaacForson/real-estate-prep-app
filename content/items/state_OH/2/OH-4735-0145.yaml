stem: Under Ohio Rev. Code § 4735.621, which statement correctly describes the waiver of fiduciary
  duties?
options:
  - A client may waive all fiduciary duties under section 4735.62 by signing a waiver.
  - A licensee may waive the duty to account for moneys received if the client agrees.
  - The duties required under section 4735.62 may not be waived by a client.
  - A licensee may perform waived duties on behalf of the client if another licensee agrees.
key: C
explanation: Under Ohio Rev. Code § 4735.621, the duties required of a licensee under section
  4735.62 may not be waived by a client. Therefore, the statement that a client may waive all
  fiduciary duties under that section is incorrect, as is the claim that a licensee may waive the
  duty to account for moneys received if the client agrees, and the claim that a licensee may
  perform waived duties on behalf of the client if another licensee agrees.
