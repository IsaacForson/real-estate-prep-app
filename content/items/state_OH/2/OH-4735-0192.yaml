  url: null
  quoted_text: "Each licensee who is seventy years of age or older, within a continuing education
    reporting period, shall submit proof satisfactory to the superintendent of real estate that the
    licensee has satisfactorily completed both of the following: (1) A total of nine hours of
    continuing education, including instruction in Ohio real estate law; recently enacted state and
    federal laws affecting the real estate industry; municipal, state, and federal civil rights law;
    and canons of ethics for the real estate industry as adopted by the commission ;"
