stem: A salesperson's three-year renewal fee is $182. If the salesperson files the renewal within
  twelve months after the renewal date, what total amount must be paid?
options:
  - $364.00
  - $182.00
  - $243.00
  - $273.00
key: D
explanation: A late filing within twelve months incurs an additional penalty of fifty percent of the
  required three‑year fee. Fifty percent of $182 is $91, which added to the base $182 equals $273.
  The $243.00 amount is the broker renewal fee, and $364.00 would be double the base fee.
citation:
  source: Ohio Rev. Code § 4735.15(B)(4)
  url: null
  quoted_text: Renewal of a real estate broker's or salesperson's license filed within twelve months
    after the licensee's renewal date, an additional late filing penalty of fifty per cent of the
    required three-year fee;
