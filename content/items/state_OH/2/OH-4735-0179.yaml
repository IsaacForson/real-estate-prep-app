stem: Under Ohio Adm. Code 1301:5-1-19(D), the superintendent sends a notice of pending license
  revocation on August 1 stating the license will be revoked on September 1. Is this notice
  compliant with the rule?
options:
  - Yes, because the notice was sent more than sixty days before revocation.
  - No, because the notice was sent less than sixty days before revocation.
  - Yes, because the notice included the reason for revocation.
  - No, because the notice was sent via regular mail instead of electronic mail.
key: B
explanation: The rule requires the notice to be sent no later than sixty days prior to revocation.
  August 1 is only thirty-one days before a September 1 revocation, which fails this timing
  requirement.
