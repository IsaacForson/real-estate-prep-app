  quoted_text: (D) The superintendent shall provide a licensee suspended for failing to renew pursuant
    to section 4735.14 of the Revised Code notice of pending license revocation, no later than sixty
    days prior to revocation, and specify in such notice the date the license will be revoked, the
    reason for pending license revocation and the procedure by which the licensee may reactivate the
    license.
