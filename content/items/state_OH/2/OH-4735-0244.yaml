stem: Under Ohio Rev. Code § 4735.09(B), what is the nonrefundable fee that must accompany an
  application for a real estate salesperson's license?
options:
  - $81.00
  - $100.00
  - $150.00
  - $200.00
key: A
explanation: The statute explicitly states that a fee of eighty‑one dollars shall accompany the
  application, which includes the fee for the initial year of the licensing period if a license is
  issued. The $100.00 distractor incorrectly substitutes a round‑dollar amount for the statutorily
  prescribed eighty‑one dollars.
