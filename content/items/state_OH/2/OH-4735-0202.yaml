stem: A person, not associated with any broker, negotiates the sale of a house for a friend and
  receives a commission. According to Ohio Rev. Code § 4735.01, what is required?
options:
  - They must be licensed as a real estate broker.
  - They do not need a license because they are acting for a friend.
  - They must be licensed as a real estate salesperson.
  - They need a license only if they also list the property.
key: A
explanation: The definition of a real estate broker includes any person who, for another, negotiates
  the sale of real estate for a fee or commission. Because the individual is not affiliated with a
  broker, they cannot be licensed as a salesperson; they must hold a broker license. The option
  stating they do not need a license because they are acting for a friend is incorrect because a
  salesperson must be sponsored by a licensed broker. The options stating they must be licensed as a
  real estate salesperson and that they need a license only if they also list the property are
  incorrect because the law does not exempt transactions with friends nor require listing activities
  for licensing.
