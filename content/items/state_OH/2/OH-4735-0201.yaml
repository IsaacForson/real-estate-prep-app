stem: Which of the following correctly defines 'foreign real estate' under Ohio Rev. Code § 4735.01?
options:
  - Real estate not situated in this state and any interest in real estate not situated in this
    state.
  - Real estate situated in this state and any interest in real estate situated in this state.
  - Real estate not situated in this state, excluding any interest in real estate not situated in
    this state.
  - Real estate situated in this state, including any interest in real estate not situated in this
    state.
key: A
explanation: Ohio Rev. Code § 4735.01 defines foreign real estate as real estate not situated in
  this state and any interest in real estate not situated in this state. The option that reads 'Real
  estate not situated in this state and any interest in real estate not situated in this state'
  matches this language exactly. The option that states 'Real estate not situated in this state,
  excluding any interest in real estate not situated in this state' incorrectly excludes interests,
  which is not the definition. The option that says 'Real estate situated in this state and any
  interest in real estate situated in this state' describes domestic real estate rather than foreign
  real estate. The option that reads 'Real estate situated in this state, including any interest in
  real estate not situated in this state' mixes situs and is not the statutory definition.
