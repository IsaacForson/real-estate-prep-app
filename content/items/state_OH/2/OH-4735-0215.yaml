stem: A broker who also acts as a management level licensee has completed thirty hours of continuing
  education for the current three-year reporting period, but none of the hours are in a course on
  the duties of a principal broker. According to Ohio Adm. Code 1301:5-7-02(A), what is the
  licensee's compliance status?
options:
  - The licensee is noncompliant because the broker‑duties course was omitted from the thirty hours.
  - The licensee is noncompliant only if they are over seventy years of age each year.
  - The licensee is compliant if they submit proof of the broker‑duties course separately annually.
  - The licensee is compliant because the total hours satisfy the requirement.
key: A
explanation: The rule requires that any licensee who is a broker, broker on deposit, or acts as a
  management level licensee must include a three‑hour course on the duties of a principal broker
  within the required thirty hours of continuing education. Omitting that specific course makes the
  licensee noncompliant even though the total hour count is met. The distractor claiming compliance
  based solely on total hours ignores the mandatory course requirement.
citation:
  source: Ohio Adm. Code ch. 1301:5-7 — § 5-7-02(A)
  url: null
  quoted_text: If a licensee is licensed as a broker, broker on deposit, or acts as a management level
    licensee, a three hour course on the duties of a principal broker and other issues involved in
    operating a real estate brokerage must be included within the required thirty hours of
    continuing education courses.
