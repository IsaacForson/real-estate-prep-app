stem: A licensee changes their mailing address six months after being notified of eligibility to
  take the real estate salesperson examination. According to Ohio Adm. Code 1301:5-1-05(A), what
  must the licensee do?
options:
  - The licensee must notify the division only in writing.
  - The licensee must notify the sponsoring principal broker only in writing.
  - The licensee must notify both the division and the sponsoring principal broker in writing.
  - The licensee must take no action until the examination date.
key: C
explanation: The rule requires written notification to both the division and the sponsoring
  principal broker for any change in application status during the eligibility period. The
  distractor "The licensee must notify the sponsoring principal broker only in writing" omits the
  required notice to the division.
