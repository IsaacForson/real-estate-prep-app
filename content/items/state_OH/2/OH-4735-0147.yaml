stem: Under Ohio Rev. Code § 4735.01, what is the definition of a 'disabled licensee'?
options:
  - A person licensed pursuant to this chapter who is unable to attend any continuing education
    course due to a temporary illness.
  - A person licensed pursuant to this chapter who is under a severe disability which prevents
    attendance at any instruction lasting at least three hours.
  - A person licensed pursuant to this chapter who has been diagnosed with any disability by a
    physician.
  - A person licensed pursuant to this chapter who has a physical impairment that limits property
    showings.
key: B
explanation: The definition of a disabled licensee in Ohio Rev. Code § 4735.01(J) is a person
  licensed under this chapter who has a severe disability that prevents attendance at any
  instruction lasting at least three hours. The correct option matches this description exactly. The
  option describing a temporary illness that blocks continuing education is incorrect because the
  definition requires a severe disability, not a temporary condition, and it applies to any
  instruction of three hours or more, not just continuing education. The option stating any
  disability diagnosed by a physician is too broad; the definition requires the disability to be
  severe enough to block attendance at instruction of at least three hours. The option citing a
  physical impairment that limits property showings is incorrect because the definition concerns
  ability to attend instruction, not property showings.
