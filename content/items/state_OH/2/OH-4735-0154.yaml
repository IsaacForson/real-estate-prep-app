stem: Which of the following qualifications satisfies the requirement for approval as a continuing
  education instructor under Ohio Adm. Code 1301:5-7-07(A)(3)?
options:
  - Five years full-time experience in a profession, trade, or technical occupation in the
    applicable field
  - Five years full-time experience in a profession, trade, or technical occupation
  - Five years full-time experience in a profession, trade, or technical occupation in the
    applicable field plus college education
  - Five years full-time experience in a profession, trade, or technical occupation in the
    applicable field or related area
key: A
explanation: Under Ohio Adm. Code 1301:5-7-07(A)(3), a continuing education instructor must have
  five years of full‑time experience in a profession, trade, or technical occupation in the
  applicable field. Options that lack the phrase 'in the applicable field' or add extra conditions
  such as college education or a related area do not meet this specific requirement. Therefore only
  the option stating 'Five years full-time experience in a profession, trade, or technical
  occupation in the applicable field' satisfies the rule.
