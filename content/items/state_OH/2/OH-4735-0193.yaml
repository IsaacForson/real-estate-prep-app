stem: A broker changes the business location of the brokerage on April 1. By what date must the
  broker give notice to the superintendent to comply with the thirty‑day requirement?
options:
  - May 10
  - May 15
  - May 1
  - May 2
key: C
explanation: The rule requires a broker to give notice to the superintendent within thirty days
  after changing the business location. Adding thirty days to April 1 yields May 1 as the latest
  permissible date.
