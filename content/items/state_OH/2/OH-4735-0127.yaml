stem: A licensee applying for foreign real estate salesperson licensure knowingly overstates their
  years of experience on the application. Six months later, the superintendent discovers the false
  statement. What action may the superintendent take under Ohio law?
options:
  - Issue a warning and require additional continuing education
  - Refer the matter to the county prosecutor for criminal charges
  - Suspend or revoke the license based on the false representation
  - Impose a monetary fine but allow the license to remain active
key: C
explanation: Under Ohio Rev. Code § 4735.30, a knowingly false representation made to obtain
  qualification as a foreign real estate salesperson is prohibited and may result in suspension or
  revocation of the license. While fines or warnings might be possible in other contexts, the
  statute specifically authorizes suspension or revocation for this violation; allowing the license
  to remain active is not permitted.
citation:
  source: Ohio Rev. Code ch. 4735 — Ohio Revised Code Chapter 4735 — Real Estate Brokers, official
