stem: Under Ohio Adm. Code 1301:5-1-20(C), the superintendent sends the annual brokerage assessment
  to a brokerage on May 5. Is the superintendent compliant with the mailing deadline?
options:
  - No, because the assessment must be sent by electronic mail
  - No, because the assessment was sent after the April 30 deadline
  - Yes, because the deadline applies to the brokerage’s filing
  - Yes, because the superintendent may send it anytime before June 30
key: B
explanation: The rule requires the superintendent to send the assessment no later than April
  thirtieth; sending on May 5 misses that deadline. The deadline governs the superintendent’s
  mailing, not just the brokerage’s filing.
