stem: A licensee maintains a real estate website that includes property listing information. If the
  information becomes outdated, what two actions must the licensee take under Ohio Adm. Code
  1301:5-1-02(E)?
options:
  - The licensee must update the information within fourteen days and notify the division in writing.
  - The licensee must update the information within thirty days and add a disclaimer that the data
    may be outdated.
  - The licensee must update the information within fourteen days and disclose the date of the most
    recent update.
  - The licensee must update the information within seven days and remove the outdated content.
key: C
explanation: The rule mandates that outdated website information be updated within fourteen days and
  that the date of the most recent update be disclosed. The distractor "The licensee must update the
  information within seven days and remove the outdated content" incorrectly shortens the update
  period and adds an unsupported removal requirement.
