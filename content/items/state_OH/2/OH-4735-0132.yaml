stem: A broker deposits a $5,000 earnest money deposit into his personal checking account. According
  to Ohio Rev. Code § 4735.24(A), what requirement has the broker violated?
options:
  - Failure to maintain the earnest money in a trust or special account
  - Failure to provide the buyer with a written receipt for the deposit
  - Failure to deposit the earnest money within three business days
  - Failure to pay interest on the earnest money held in trust
key: A
explanation: Under Ohio Rev. Code § 4735.24(A), a broker must keep earnest money connected to a real
  estate purchase agreement in a trust or special account until the agreement is terminated or the
  funds are disbursed as directed. Depositing the $5,000 earnest money into a personal checking
  account violates that requirement because the money is not kept in the required trust or special
  account.
