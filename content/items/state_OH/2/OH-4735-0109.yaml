stem: A licensee’s license was inactivated due to military service. The licensee received an
  honorable discharge four months ago and wishes to reactivate the license. According to Ohio Adm.
  Code 1301:5-1-19(A)(2), what must the licensee present to satisfy the reactivation requirement?
options:
  - A letter from the commanding officer confirming good conduct
  - Evidence of having filed a renewal application within the last year
  - Proof of completion of continuing education courses
  - A copy of the DD-214 showing honorable discharge within the past six months
key: D
explanation: The rule requires presentation of satisfactory evidence of honorable discharge or
  separation under honorable conditions within six months of such discharge or separation. A DD-214
  showing honorable discharge within the past six months meets this requirement. Continuing
  education proof, a commanding officer’s letter, or prior renewal evidence do not satisfy the
  specific military service reactivation condition.
