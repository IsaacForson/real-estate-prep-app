stem: A broker whose license has been suspended due to noncompliance with continuing education
  requirements submits proof of compliance and requests reactivation of the broker's license. The
  broker also has an associated real estate salesperson whose license was suspended as a result of
  the broker's suspension. Under Ohio Rev. Code ch. 4735 § 4735.141(1), what is the status of the
  salesperson's license and any fee for reactivation?
options:
  - The salesperson's license remains suspended and a reactivation fee of thirty‑four dollars must
    be paid.
  - The salesperson's license is reactivated and no fee is charged for that reactivation.
  - The salesperson's license requires a separate reactivation application and payment of the
    standard fee.
  - The salesperson's license can be reactivated only after the broker's license is returned to the
    superintendent.
key: B
explanation: The rule states that when a broker submits proof of compliance and requests
  reactivation, the associated salesperson's suspended license shall be reactivated and no fee shall
  be charged or collected for that reactivation. Therefore the salesperson's license is reactivated
  without fee. The statement that a reactivation fee of thirty‑four dollars must be paid contradicts
  the explicit “no fee shall be charged” provision.
