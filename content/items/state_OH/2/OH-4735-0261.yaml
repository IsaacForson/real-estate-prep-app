  url: null
  quoted_text: The suspended license of the associated real estate salesperson shall be reactivated
    and no fee shall be charged or collected for that reactivation if that broker subsequently
    submits proof to the superintendent that the broker has complied with the requirements of this
    section and requests that the broker's license as a real estate broker be reactivated, and the
    superintendent then reactivates the broker's license as a real estate broker.
