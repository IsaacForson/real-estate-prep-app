  quoted_text: Failure to timely comply with the superintendent's request may be considered prima
    facie evidence of a violation by a licensee of division (A)(6) of section 4735.18 of the Revised
    Code or, in the case of an applicant for licensure, may constitute just cause for the
    superintendent to close the applicant's file and impose a forfeiture of any application fee
    pursuant to division (B) of sections 4735.06 and 4735.09 of the Revised Code.
