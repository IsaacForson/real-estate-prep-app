stem: A salesperson applicant fails to submit fingerprints to the Ohio Bureau of Criminal
  Identification within 30 days of the superintendent's request. According to Ohio Adm. Code
  1301:5-1-23, what may result?
options:
  - The applicant's license will be automatically denied by the division.
  - The applicant must pay a civil penalty of one thousand dollars.
  - The applicant must retake the pre-licensing examination within sixty days.
  - The applicant's file may be closed and the application fee forfeited.
key: D
explanation: For an applicant, failure to timely comply with the superintendent's request may
  constitute just cause for the superintendent to close the applicant's file and impose a forfeiture
  of any application fee. The distractors describe penalties or requirements not specified for
  applicants in the rule.
