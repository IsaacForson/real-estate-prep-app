stem: Under Ohio Adm. Code 1301:5-7-08(K), how is a renewal for a distance education course treated
  if it is filed after January thirty-first?
options:
  - It is considered a new course requiring a new application and fee.
  - It is considered automatically approved without additional fees.
  - It is considered valid for the next calendar year only.
  - It is considered invalid and must be retaken by licensees.
key: A
explanation: Under Ohio Adm. Code 1301:5-7-08(K), any renewal for a distance‑education course filed
  after January thirty‑first is treated as a new course and must be submitted with a new course
  application and the nonrefundable fee. The option stating that the renewal is automatically
  approved without additional fees is incorrect because the rule requires a new application and fee.
  The option stating that the renewal is valid for the next calendar year only is incorrect because
  the rule does not grant limited‑term validity; it requires a full new approval. The option stating
  that the renewal is invalid and must be retaken by licensees is incorrect because the rule does
  not invalidate the renewal; it simply requires a new application and fee.
