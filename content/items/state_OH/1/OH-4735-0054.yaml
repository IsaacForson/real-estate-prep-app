math:
  worked_solution: "Determine the daily maximum penalty: $1,000. Identify the number of days the
    violation continued: 5 days. Multiply the daily maximum by the number of days: 1,000 × 5 =
    5,000."
  formulas:
    - total penalty = daily maximum penalty × number of days
