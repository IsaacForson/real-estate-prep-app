stem: A licensee continues to engage in prohibited advertising for five consecutive days after being
  ordered to stop. Under Ohio Rev. Code § 4735.052(C)(4), if the commission assesses the maximum
  penalty for each day, what is the total civil penalty?
options:
  - $1,000
  - $2,000
  - $3,000
  - $5,000
key: D
explanation: Each day a violation occurs or continues is a separate violation, and the commission
  may assess up to $1,000 per violation. Five days × $1,000 per day equals $5,000. The $1,000
  distractor applies only to a single day.
