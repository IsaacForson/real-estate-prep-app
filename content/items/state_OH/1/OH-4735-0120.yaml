stem: A broker wants to pay a commission to a broker licensed in Indiana for a referral transaction.
  The broker has not reviewed any rules adopted by the Ohio real estate commission pursuant to
  section 4735.10. Under Ohio Rev. Code 4735.20(B), is the broker permitted to make this payment?
options:
  - The broker is permitted because the out‑of‑state broker holds a valid license and the
    transaction is otherwise lawful
  - The broker is permitted because the referral was for a single transaction and no other
    conditions apply
  - The broker is not permitted unless the payment complies with rules adopted by the Ohio real
    estate commission under section 4735.10
  - The broker is not permitted because Indiana brokers are not recognized by Ohio law and no
    reciprocity exists
key: C
explanation: Ohio Rev. Code 4735.20(B) allows an interstate commission payment only when it follows
  rules adopted by the Ohio real estate commission under section 4735.10. Because the broker has not
  ensured compliance with those rules, the payment is not permitted. Statements that the broker is
  permitted because the referral involved a single transaction or because the out‑of‑state broker
  holds a valid license are incorrect, as the rule requires adherence to the commission‑adopted
  regulations regardless of transaction type or license status.
