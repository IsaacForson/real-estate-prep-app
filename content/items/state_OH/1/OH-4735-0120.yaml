  url: null
  quoted_text: A licensed real estate broker or licensed foreign real estate dealer may pay a
    commission to a licensed real estate broker or licensed foreign real estate dealer of another
    state or country and may receive a commission from a licensed real estate broker or licensed
    foreign real estate dealer of another state or country, but only when done in accordance with
    rules adopted by the Ohio real estate commission pursuant to section 4735.10 of the Revised
    Code.
