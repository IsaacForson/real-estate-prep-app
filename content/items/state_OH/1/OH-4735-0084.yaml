stem: A licensee enters the armed forces and places the license on deposit with the Ohio real estate
  commission. Under Ohio Rev. Code § 4735.13(G)(1), when is the licensee required to renew the
  license?
options:
  - The licensee is required to renew the license on the renewal date that follows the date of
    discharge from the armed forces.
  - The licensee is required to renew the license annually while on active duty.
  - The licensee is required to renew the license within thirty days of entering the armed forces.
  - The licensee is required to renew the license only after completing active duty service.
key: A
explanation: Under Ohio Rev. Code § 4735.13(G)(1), a licensee who places the license on deposit due
  to armed forces service is not required to renew until the renewal date that follows discharge.
  Therefore, the licensee must renew on the renewal date after discharge. The statement that the
  licensee must renew annually while on active duty is incorrect because the statute suspends the
  renewal obligation during service. The statement that the licensee must renew within thirty days
  of entering the armed forces is incorrect because no such deadline exists. The statement that the
  licensee must renew only after completing active duty service is incorrect because renewal is
  required on the first renewal date after discharge, not only after service ends.
