stem: An applicant seeks to qualify a foreign real estate subdivision consisting of 1,200 lots. What
  is the total filing fee due to the superintendent under Ohio Rev. Code § 4735.25(D)?
options:
  - $1,700.00
  - $2,500.00
  - $500.00
  - $1,200.00
key: A
explanation: The statute requires a $500 base fee plus $1 for each lot, unit, parcel, or interest,
  with the total not exceeding $2,500. For 1,200 lots, the per‑lot charge is $1,200, so the subtotal
  is $1,700, which is below the cap. The $1,200 distractor omits the $500 base fee, and the $2,500
  distractor incorrectly applies the maximum cap regardless of the lot count.
