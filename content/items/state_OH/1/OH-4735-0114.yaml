math:
  worked_solution: |-
    Base fee = $500
    Per‑lot charge = $1 × 1,200 = $1,200
    Subtotal = $500 + $1,200 = $1,700
    Maximum allowed fee = $2,500; since $1,700 ≤ $2,500, the fee remains $1,700
  formulas:
