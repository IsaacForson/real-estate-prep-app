stem: Under Ohio Rev. Code § 4735.052(C)(4), what is the maximum civil penalty the commission may
  assess for each violation?
options:
  - $500 per violation
  - $1,000 per violation
  - $2,000 per violation
  - $5,000 per violation
key: B
explanation: The statute states that the commission may assess a civil penalty in an amount it
  determines, not to exceed one thousand dollars per violation. Therefore the maximum per violation
  is $1,000. The $500 option is a common misunderstanding but not supported by the text.
