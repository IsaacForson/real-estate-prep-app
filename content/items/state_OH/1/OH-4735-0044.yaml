stem: According to Ohio Rev. Code § 4735.03, what is the minimum number of years a person must have
  been engaged as a licensed real estate broker in Ohio to be eligible for appointment to the Ohio
  real estate commission?
options:
  - Five years
  - Eight years
  - Ten years
  - Twelve years
key: C
explanation: The statute requires four commission members to have been engaged as licensed brokers
  for ten years immediately preceding appointment; thus the minimum is ten years. The eight‑year
  option reflects a common misconception about the term length but does not satisfy the eligibility
  rule.
