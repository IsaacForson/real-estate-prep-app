stem: A broker wishes to resign her license. According to Ohio Rev. Code § 4735.10(A)(1)(d), what
  must the commission's rules specify for the broker to resign?
options:
  - The commission must allow resignation only after completing continuing education.
  - The commission must require a waiting period of one year before resignation.
  - The commission must set a fixed fee for license resignation.
  - The commission must specify the process by which a licensee may resign the license.
key: D
explanation: Subsection (d) requires the commission to specify the process by which a licensee may
  resign the license. The other options introduce requirements—fees, waiting periods, or continuing
  education—that are not mentioned in this subsection.
