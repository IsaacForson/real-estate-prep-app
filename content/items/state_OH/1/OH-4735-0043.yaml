stem: A broker agrees to represent both the buyer and the seller in a residential transaction
  without obtaining written consent from either party. Which action constitutes a violation under
  Ohio Rev. Code § 4735.18?
options:
  - The broker's action of representing both buyer and seller without written consent.
  - The broker's action of charging a flat fee for transaction coordination.
  - The broker's action of providing a buyer with a list of comparable sales.
  - The broker's action of using a trade name that is not registered.
key: A
explanation: Division (A)(4) prohibits acting for more than one party in a transaction except as
  permitted by and in compliance with section 4735.71, which requires written consent for dual
  agency. Representing both buyer and seller without such consent violates this provision. Providing
  a list of comparable sales is not prohibited under this section, making that option incorrect.
