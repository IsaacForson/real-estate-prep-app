stem: On May 1, 2023, the superintendent determines there is reasonable evidence of a violation of
  section 4735.02. Assuming no holidays, by what date must the superintendent send the written
  notice to the party?
options:
  - May 22, 2023
  - May 17, 2023
  - May 15, 2023
  - May 19, 2023
key: D
explanation: Fourteen business days after May 1, 2023 (a Monday) ends on May 19, 2023, counting only
  weekdays. The distractor of May 15 assumes ten business days, while May 17 assumes twelve business
  days, and May 22 incorrectly adds calendar days.
