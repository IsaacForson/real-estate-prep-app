stem: A licensee who represents a purchaser in a real estate transaction must first disclose to
  which party that they represent the purchaser?
options:
  - The seller's broker only
  - The seller's agent or the seller
  - The buyer's lender only
  - The closing agent only
key: B
explanation: Under Ohio Rev. Code § 4735.60(A), a licensee representing a purchaser must disclose to
  the licensee representing the seller, or if the seller is not represented, disclose to the seller,
  that the licensee represents the purchaser. The correct option states that disclosure is made to
  the seller's agent or the seller. The other options are incorrect because they limit disclosure to
  only the seller's broker, the buyer's lender, or the closing agent, which does not satisfy the
  requirement.
