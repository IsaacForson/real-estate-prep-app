stem: A broker collects monthly rent for an owner‑managed property. Under Ohio Adm. Code
  1301:5-5-11(E), how often must the broker provide an accounting to the owner?
options:
  - The broker must provide an accounting to the owner each month
  - The broker must provide an accounting to the owner twice a year
  - The broker must provide an accounting to the owner once a year
  - The broker must provide an accounting to the owner at least once every three months
key: D
explanation: The rule requires brokerages engaged in property management to provide an accounting to
  each owner on a regular basis, but in no event less than quarterly. Thus the minimum required
  frequency is once every three months; more frequent accountings are permissible but not mandated.
