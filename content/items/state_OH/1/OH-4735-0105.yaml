stem: Under Ohio Rev. Code § 4735.58(C), what is the legal consequence if a licensee fails to
  provide the agency disclosure statement as required?
options:
  - It triggers an immediate temporary suspension of the license for forty-five days.
  - It results in an automatic civil penalty of five hundred dollars per violation.
  - It constitutes prima-facie evidence of misconduct under division (A)(6) of section 4735.18.
  - It requires the licensee to attend a mandatory remedial training course within thirty days.
key: C
explanation: The statute states that failure to comply with the disclosure requirement constitutes
  prima-facie evidence of misconduct in violation of division (A)(6) of section 4735.18. Therefore,
  the correct answer identifies this consequence. The distractor about an automatic fine is
  incorrect because the text does not specify any monetary penalty for this violation.
