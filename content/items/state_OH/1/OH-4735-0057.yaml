stem: "A brokerage manages a rental property for an owner under a written contract. Under Ohio Rev.
  Code § 4735.10(A)(2)(e)(i), the brokerage may exercise signatory authority for withdrawals from
  the property management account if:"
options:
  - The brokerage has a verbal agreement with the property owner
  - The brokerage has a written contract with the property manager
  - The brokerage has a written contract with the property owner
  - The brokerage has a written contract with the tenant
key: C
explanation: The rule permits a brokerage managing property for another to exercise signatory
  authority for withdrawals from property management accounts when acting pursuant to a written
  contract with the property owner. Verbal authorization, account naming, or withdrawal amount do
  not satisfy this requirement. Thus, only a written contract with the owner authorizes the
  authority.
