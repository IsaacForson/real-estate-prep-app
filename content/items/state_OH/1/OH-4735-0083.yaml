stem: A salesperson submits an application to the superintendent to leave the association of Broker
  A and associate with Broker B. Under Ohio Rev. Code § 4735.13(H), is Broker A required to notify
  the superintendent of the salesperson's departure?
options:
  - Broker A must notify the superintendent and keep a copy of the notification for three years.
  - Broker A must notify the superintendent if the salesperson's license is not returned to the
    superintendent.
  - Broker A must notify the superintendent within three business days after the salesperson leaves.
  - Broker A is not required to notify the superintendent of the salesperson's departure.
key: D
explanation: Under Ohio Rev. Code § 4735.13(H), when a salesperson files an application to leave one
  broker and associate with another, the broker who holds the salesperson's license is not required
  to notify the superintendent of the departure. Therefore, Broker A does not have to notify the
  superintendent, making the option that states Broker A is not required to notify the
  superintendent the correct choice.
