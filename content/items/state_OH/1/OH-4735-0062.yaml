stem: Under Ohio Rev. Code § 4735.10(A)(1)(g), what authority does the Ohio real estate commission
  grant to a broker regarding brokerage affiliation?
options:
  - To act as principal broker for more than one brokerage.
  - To place an existing broker's license on deposit indefinitely.
  - To define any additional license status the commission deems necessary.
  - To resign the license without commission approval.
key: A
explanation: The rule explicitly permits a broker to act as principal broker for more than one
  brokerage. The other options describe authorities covered elsewhere in the statute, such as
  placing a license on deposit, defining additional license statuses, or resigning a license, which
  are not the permission granted by subsection (g).
