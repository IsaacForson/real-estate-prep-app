stem: A licensee who has already been disciplined twice for unlawful discriminatory practices in
  real estate transactions commits a third such offense. Under Ohio Rev. Code § 4735.18(A)(7)(b),
  what action must the commission take?
options:
  - Revocation of the license
  - Suspension of the license
  - A fine of one thousand dollars
  - Probation for six months
key: A
explanation: The rule states that for any subsequent offense of an unlawful discriminatory practice,
  the commission shall revoke the license. Therefore, revocation is the required action. The
  distractor proposing suspension is incorrect because the provision mandates revocation, not
  suspension, for a third or later offense.
