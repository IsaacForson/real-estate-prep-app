stem: Under Ohio Rev. Code § 4735.052(A), when is the superintendent prohibited from initiating an
  investigation?
options:
  - When the person held an active license on the date of the alleged violation
  - When the person held a suspended or inactive license on the date of the alleged violation
  - When the person held a license that was expired but renewable on the date of the alleged
    violation
  - When the person held a license in another state on the date of the alleged violation
key: B
explanation: Subsection (A) explicitly states that the superintendent shall not initiate an
  investigation of any person who held a suspended or inactive license on the date of the alleged
  violation. Therefore, the correct condition is when the license is suspended or inactive. The
  distractor describing an active license is incorrect because the prohibition does not apply to
  active licensees.
