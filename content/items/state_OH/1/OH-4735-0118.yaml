stem: Under Ohio Rev. Code 4735.20(G), what is the maximum amount of fee, commission, or other
  valuable consideration that an owner of foreign real estate may receive for referring a
  prospective buyer without being considered as engaging in referral in the ordinary course of
  business?
options:
  - The maximum amount is two thousand dollars
  - The maximum amount is five thousand dollars
  - The maximum amount is five hundred dollars
  - The maximum amount is one thousand dollars
key: D
explanation: The rule states that any fee, commission, or other valuable consideration promised or
  collected during any period of twelve consecutive months may not exceed one thousand dollars,
  making $1,000 the correct limit. The $2,000 option exceeds this limit and therefore is not
  permitted under the provision.
