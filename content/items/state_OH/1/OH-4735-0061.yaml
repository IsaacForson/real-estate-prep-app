stem: A licensee is found to have violated section 4735.023 of the Revised Code. May the Ohio real
  estate commission impose disciplinary sanctions for this violation?
options:
  - Yes, but the commission may impose sanctions if the violation also involved fraud or
    misrepresentation.
  - Yes, the commission may impose disciplinary sanctions for a violation of section 4735.023.
  - No, the commission may impose disciplinary sanctions for violations of section 4735.02, but not
    for violations of section 4735.023.
  - No, the commission lacks authority to impose sanctions for any violation of the Revised Code.
key: B
explanation: The commission may impose disciplinary sanctions only for violations of sections
  4735.02 or 4735.023, so a violation of 4735.023 is sanctionable (quoted text). The distractor
  claiming sanctions are limited to section 4735.02 misreads the rule, while the fraud condition
  adds an unsupported requirement.
