stem: Under Ohio Rev. Code § 4735.10(A)(2)(e)(ii), to whom is the interest earned on a property
  management trust account payable, unless otherwise specified in a written contract?
options:
  - The state commission receiving interest
  - The licensee receiving interest
  - The managing broker receiving interest
  - The property owner receiving interest
key: D
explanation: The statute states that interest earned on property management trust accounts shall be
  payable to the property owner unless otherwise specified in a written contract. Therefore, the
  correct recipient is the property owner. The distractor suggesting the broker receives the
  interest is incorrect because the rule explicitly directs the interest to the owner absent a
  contrary agreement.
