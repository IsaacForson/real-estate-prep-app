stem: "Under Ohio Rev. Code § 4735.10(A)(2)(d), a sponsoring organization may offer its members a
  reasonable reduction in fees for a continuing education class if:"
options:
  - The reduction is prohibited entirely
  - The reduction is reasonable
  - The reduction is available to all licensees
  - The organization is a brokerage
key: B
explanation: The statute requires that continuing education classes be open to all licensees and
  allows sponsoring organizations to offer members a reasonable reduction in fees. The reduction
  must be reasonable; it is not prohibited, need not be extended to all licensees, and the sponsor's
  status as a brokerage is irrelevant. Hence, the condition is that the reduction is reasonable.
