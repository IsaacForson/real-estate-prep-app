stem: What is the minimum disciplinary sanction the commission must impose for a second offense
  under Ohio Rev. Code § 4735.18(A)(7)(b)?
options:
  - Suspension for at least two months
  - Revocation of the license
  - A fine of one thousand dollars
  - Completion of mandatory continuing education
key: A
explanation: Under Ohio Rev. Code § 4735.18(A)(7)(b), for a second offense the commission must
  either suspend the license for at least two months or revoke it. The minimum mandatory sanction is
  therefore a suspension of at least two months. While revocation is also allowed, it is not
  required as the minimum; the rule establishes the floor at a two‑month suspension.
