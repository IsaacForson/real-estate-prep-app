stem: Under Ohio Rev. Code § 4735.021(A), if a licensee charges a prospective tenant a $25 referral
  fee for a rental listing and the tenant does **NOT** obtain a suitable rental, what is the
  earliest number of days after the contract is entered into that the licensee may refund the excess
  amount upon demand?
options:
  - 60 days
  - 30 days
  - 15 days
  - 45 days
key: B
explanation: The rule requires that any fee over ten dollars be refunded, but only after at least
  thirty days have passed since the contract was entered. The excess amount here is fifteen dollars,
  and the earliest permissible refund is therefore thirty days. The fifteen‑day distractor
  incorrectly applies the excess amount as a waiting period.
citation:
  source: Ohio Rev. Code § 4735.021(A)
  url: null
  quoted_text: Any fee charged in excess of ten dollars shall be repaid or refunded to the prospective
    tenant, upon demand, but no sooner than thirty days after the contract has been entered into and
    no later than sixty days after the contract has been entered into, if he does not obtain a
    rental conforming to his specifications through the listing furnished by the licensee.
  secondary: []
math:
  worked_solution: The statute states that a refund may be made no sooner than thirty days after the
    contract is entered into. Thus the earliest permissible refund is 30 days.
