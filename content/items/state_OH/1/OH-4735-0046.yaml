stem: During an audit under Ohio Rev. Code § 4735.05, an investigator obtains a licensee’s
  transaction records. May the investigator share those records with the Division of Financial
  Institutions?
options:
  - Yes, for purposes relating to the administration of Revised Code chapters enforced by that
    division
  - No, because all information obtained from licensees must remain confidential at all times
  - Yes, but only after obtaining the licensee’s written consent
  - No, unless the records are first submitted to the court as evidence
key: A
explanation: Ohio Rev. Code § 4735.05 provides that the division may release information about
  licensees to the division of financial institutions, the division of securities, and the division
  of industrial compliance when the disclosure is needed for the administration of the Revised Code
  chapters those divisions enforce. Because the sharing described fits that purpose, the
  investigator may provide the records without the licensee’s consent. A rule that all licensee
  information must remain confidential is overridden by this specific statutory exemption.
