  quoted_text: (J) Not earlier than the date of issue of a real estate salesperson's license to a
    licensee, but not later than twelve months after the date of issue of a real estate salesperson
    license to a licensee, the licensee shall submit proof satisfactory to the superintendent, on
    forms made available by the superintendent, of the completion of twenty hours of instruction
    that shall be completed in schools, seminars, and educational institutions approved by the
    commission.
