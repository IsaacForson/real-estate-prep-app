stem: A salesperson receives her license on June 1, 2024. What is the latest date by which she must
  submit proof of completion of the required twenty hours of continuing education to avoid automatic
  suspension under Ohio Rev. Code § 4735.09(J)?
options:
  - May 31, 2025
  - June 1, 2025
  - June 30, 2025
  - July 1, 2025
key: B
explanation: The rule states that the salesperson must submit proof not earlier than the date of
  issue and not later than twelve months after the date of issue. Twelve months after June 1, 2024
  is June 1, 2025, which is the latest date that still avoids suspension. The distractor May 31,
  2025 is wrong because it is not the latest permissible date; submitting after May 31 but before
  June 2 would still comply, but the latest allowable date is June 1, 2025.
