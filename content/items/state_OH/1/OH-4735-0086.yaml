stem: A licensee obtains a final judgment against a broker on June 10, 2023, and all appeals are
  exhausted on September 30, 2023. By what date must the licensee file an application for payment
  from the real estate recovery fund to be eligible?
options:
  - September 30, 2024.
  - June 10, 2024.
  - September 30, 2025.
  - June 10, 2025.
key: A
explanation: Under Ohio Rev. Code § 4735.12(B)(4)(e), an application for payment from the real
  estate recovery fund must be filed not more than one year after termination of all proceedings,
  including appeals. Since the appeals ended on September 30, 2023, the latest filing date is
  September 30, 2024. The other options either use the judgment date or exceed the one‑year limit.
