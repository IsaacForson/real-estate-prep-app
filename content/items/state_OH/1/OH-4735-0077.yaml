stem: Under Ohio Rev. Code § 4735.99(B), what is the maximum additional fine that may be imposed for
  a violation of section 4735.25 or 4735.30?
options:
  - The violation is classified as a misdemeanor of the first degree, and the court may impose an
    additional fine of not more than two thousand five hundred dollars.
  - The violation is classified as a felony of the fifth degree, and the court may impose an
    additional fine of not more than two thousand five hundred dollars.
  - The violation is classified as a felony of the fifth degree, and the court may impose an
    additional fine of not more than zero dollars.
  - The violation is classified as a misdemeanor of the first degree, and the court may impose an
    additional fine of not more than zero dollars.
key: B
explanation: The statute states that whoever violates section 4735.25 or 4735.30 is guilty of a
  felony of the fifth degree, and the court may impose an additional fine of not more than two
  thousand five hundred dollars. Therefore the maximum additional fine is $2,500. The misdemeanor
  options are incorrect because they misstate the offense level.
