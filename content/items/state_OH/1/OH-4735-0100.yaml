stem: A brokerage changes its principal broker on April 5. By what date must the brokerage report
  this change to the superintendent under Ohio Rev. Code § 4735.081(B)?
options:
  - April 5
  - April 15
  - April 20
  - April 25
key: C
explanation: The rule requires the brokerage to report any change in designation as a principal
  broker not later than fifteen days after the change occurs. Adding fifteen days to April 5 gives
  April 20, which is the latest permissible date. The distractor April 15 is incorrect because it is
  only ten days after the change, which does not satisfy the fifteen‑day requirement.
