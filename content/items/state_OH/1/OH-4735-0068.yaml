stem: What must a brokerage that manages property for another establish under Ohio Adm. Code
  1301:5-5-11(A)?
options:
  - A separate trust account designated as a property management trust account
  - A designated savings account used for brokerage operating expenses
  - A single pooled trust account for all tenant security deposits
  - An individual escrow account held under the broker's personal name
key: A
explanation: Under Ohio Adm. Code 1301:5-5-11(A), brokerages managing property for another must
  establish a separate trust account designated as a property management trust account for deposits
  of security deposits, rents, and owner money. The other options describe commingled or personal
  accounts, which violate the requirement to keep funds separate.
