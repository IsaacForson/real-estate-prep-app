stem: The commission wants to create a new license status called 'limited broker' for certain
  activities. Under Ohio Rev. Code § 4735.10(A)(1)(e), what must the commission do to establish this
  new status?
options:
  - The commission must set a separate examination for the new license status and define its
    specific scope.
  - The commission must automatically convert all existing licenses to the new status after one year
    of adoption.
  - The commission must define the additional license status and establish the process by which a
    licensee places the license in that status.
  - The commission must limit the new status to brokers with at least ten years of experience and a
    clean record.
key: C
explanation: Ohio Rev. Code § 4735.10(A)(1)(e) requires the commission to define any additional
  license status it deems necessary and to establish the process by which a licensee places the
  license in that status. The other options introduce requirements—such as separate examinations,
  automatic conversion, or experience limits—that are not mandated by this provision.
