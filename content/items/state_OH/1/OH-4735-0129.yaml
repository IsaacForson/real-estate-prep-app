stem: A broker lists her business address as a post office box on her license application and in all
  advertising. Under Ohio Rev. Code § 4735.13(A), what must the broker do to comply with the
  requirement for a definite place of business?
options:
  - The broker must continue using the post office box as long as she also maintains a physical
    office elsewhere
  - The broker must obtain a physical street address for her place of business and display the
    license there
  - The broker must submit a written waiver to the Ohio real estate commission allowing the post
    office box
  - The broker must keep the post office box but add a suite number to make it a definite place
key: B
explanation: The statute requires every broker to have and maintain a definite place of business in
  the state and explicitly states that a post office box address is not a definite place of
  business. Therefore the broker must replace the PO box with a physical street address and display
  the license at that location. The distractor suggesting the broker may keep the PO box if she also
  has another physical office is incorrect because the licensee may only do business from the
  location specified on the license, and a PO box does not satisfy the definite place requirement.
citation:
  source: Ohio Rev. Code § 4735.13(A)
  url: null
  quoted_text: Every real estate broker licensed under this chapter shall have and maintain a definite
    place of business in this state. A post office box address is not a definite place of business
    for purposes of this section.
