stem: According to Ohio Rev. Code § 4735.03, what is the minimum required real‑estate experience for
  four of the five members of the Ohio real estate commission?
options:
  - Eight years as a licensed real estate broker
  - Ten years as a licensed real estate broker
  - Five years as a licensed real estate broker
  - No prior experience is necessary
key: B
explanation: The statute explicitly requires four members to have been engaged as licensed brokers
  for ten years immediately before appointment. The distractor citing five or eight years misstates
  the required duration, while the claim that no experience is needed contradicts the statutory
  requirement.
