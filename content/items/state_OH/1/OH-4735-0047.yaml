stem: Under Ohio Adm. Code 1301:5-5-11(A), what must a brokerage that manages property for another
  establish and maintain?
options:
  - A single escrow account used for all brokerage transactions, including sales and rentals
  - A personal checking account opened by the broker for routine business expenses
  - A separate trust account designated as a property management trust account
  - A savings account that earns interest for the brokerage’s general operating funds
key: C
explanation: Ohio Administrative Code §1301:5-5-11(A) requires brokerages that manage property for
  another to establish and maintain a separate trust account designated as a property management
  trust account for security deposits, rents, and owner‑directed funds. Any other type of account,
  such as a single escrow account, a personal checking account, or a general savings account, does
  not satisfy this requirement.
