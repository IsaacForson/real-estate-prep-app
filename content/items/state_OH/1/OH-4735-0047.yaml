  quoted_text: (A) All brokerages engaging in the management of property for another shall establish
    and maintain a separate trust account(s), to be designated as property management trust
    account(s), for the deposit of security deposits, rents, and money received from the owner(s) or
    on the owner's(s') behalf for payment of expenses related to the management of property.
