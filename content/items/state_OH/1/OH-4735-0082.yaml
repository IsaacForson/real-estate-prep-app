stem: Which of the following statements is true regarding continuing education requirements for
  licensees who are seventy years of age or older under Ohio Rev. Code § 4735.141?
options:
  - A licensee who is seventy years of age or older and whose license is in an inactive status is
    exempt from the continuing education requirements.
  - A licensee who is seventy years of age or older must complete nine hours of continuing education
    each year if the license is active.
  - A licensee who is seventy years of age or older is exempt from continuing education only if they
    have a disability.
  - A licensee who is seventy years of age or older must complete thirty hours of continuing
    education every three years regardless of license status.
key: A
explanation: "The statute exempts licensees who are seventy years of age or older and have an
  inactive license from continuing education requirements. The other statements are incorrect: the
  statute does not require nine hours annually for active licensees seventy or older, does not limit
  exemption to those with a disability, and does not require thirty hours every three years
  regardless of status."
