stem: A broker receives a license on January 1, 2024 and fails to submit proof of the required ten
  hours of continuing education by January 1, 2025. What is the status of the broker's license under
  Ohio Rev. Code § 4735.08(G)(1)?
options:
  - The license remains active because the broker can submit the proof at any time
  - The license is suspended automatically for failure to submit proof within twelve months
  - The license is revoked automatically upon missing the twelve‑month deadline
  - The license is placed on probation pending submission of the required proof
key: B
explanation: Under Ohio Rev. Code § 4735.08(G)(1), a broker’s license is suspended automatically if
  proof of the required ten hours of continuing education is not submitted to the superintendent
  within twelve months of the license issuance date. Therefore, the statement that the license is
  suspended automatically for failure to submit proof within twelve months is correct. The claim
  that the license remains active because proof can be submitted at any time is wrong because the
  law sets a firm twelve‑month limit; missing that limit triggers suspension. The claim that the
  license is revoked automatically upon missing the deadline is incorrect because revocation only
  occurs after the license has remained suspended for another twelve months without proof, not
  immediately. The claim that the license is placed on probation pending submission is incorrect
  because the statute provides for an automatic suspension, not probation.
