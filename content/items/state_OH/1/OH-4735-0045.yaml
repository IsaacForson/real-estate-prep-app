stem: A licensee receives a subpoena from the Ohio real estate commission via certified mail, return
  receipt requested, but refuses to accept delivery. When is the subpoena deemed served under Ohio
  Rev. Code § 4735.04?
options:
  - On the date the certified mail is successfully delivered
  - On the date the licensee signs the return receipt
  - On the date the licensee refused to accept delivery
  - On the date the commission files the subpoena to the court
key: C
explanation: The statute states that service is deemed made on the date delivery is made or the date
  the person refused to accept delivery; therefore, refusal triggers service on that refusal date.
  The option about signing the receipt is incorrect because receipt signing only matters when
  delivery is accepted.
