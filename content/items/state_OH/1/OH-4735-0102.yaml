stem: A broker's license is suspended for failing to submit proof of continuing education. The
  broker later submits satisfactory proof and requests reactivation. The associated salesperson
  wishes to remain with the broker and is otherwise compliant with this chapter. What happens to the
  salesperson's license under Ohio Rev. Code § 4735.08(G)(2)?
options:
  - The salesperson's license stays suspended until the salesperson submits CE proof
  - The salesperson's license is automatically reactivated with no fee charged
  - The salesperson's license is revoked by the superintendent
  - The salesperson's license requires the salesperson to pay a reactivation fee
key: B
explanation: The rule provides that if the broker submits satisfactory proof and requests
  reactivation, the associated salesperson's license shall be reactivated and no fee shall be
  charged or collected for that reactivation, provided the salesperson intends to remain associated
  and is otherwise compliant. The distractor claiming the license remains pending the salesperson's
  own proof is incorrect because reactivation occurs automatically when the broker complies and the
  salesperson meets the conditions.
