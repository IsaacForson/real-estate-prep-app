stem: Which of the following is required for an applicant to qualify for a real estate broker's
  license under Ohio Rev. Code § 4735.08(E)(1)?
options:
  - Worked as a broker for at least two of the five years before application
  - Submitted proof of ten hours of continuing education within twelve months
  - Completed at least ten real estate transactions as a broker in Ohio
  - Passed an examination on Ohio real estate law as required by rule
key: A
