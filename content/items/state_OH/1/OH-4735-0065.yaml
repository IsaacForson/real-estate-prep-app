stem: What is the length of each member's term of office on the Ohio real estate commission
  according to Ohio Rev. Code § 4735.03?
options:
  - Two years
  - Three years
  - Five years
  - Seven years
key: C
explanation: The statute states that terms of office shall be for five years, commencing on the
  first day of July and ending on the thirtieth day of June, making a five‑year term the correct
  answer. The three‑year option is a common misconception that might be confused with other
  licensing periods, but the law explicitly sets the term at five years.
