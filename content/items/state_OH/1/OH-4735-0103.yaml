stem: Under Ohio Rev. Code § 4735.18(A)(27), what must a broker who manages real property for owners
  do with the name, account number, and location of the special trust account used for rents,
  security deposits, and escrow funds?
options:
  - Submit it in writing to the superintendent
  - Post it conspicuously in the brokerage office
  - Provide it to each tenant annually
  - File it with the county recorder
key: A
explanation: The rule requires the broker to submit the name, account number, and location of the
  depository in writing to the superintendent. The other options describe actions not mandated by
  the statute.
