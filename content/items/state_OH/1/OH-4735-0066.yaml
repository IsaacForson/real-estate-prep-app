stem: Two witnesses subpoenaed by the Ohio real estate commission travel to the hearing in the same
  car. How is the mileage fee handled under Ohio Rev. Code § 4735.04?
options:
  - Each witness receives the full mileage fee for travel.
  - One witness gets the mileage fee; others may share it.
  - The mileage fee is split equally between the two witnesses.
  - No mileage fee is paid when witnesses share the same vehicle.
key: B
explanation: The law provides that when two or more witnesses travel together in the same vehicle,
  the mileage fee shall be paid to only one of those witnesses, but the witnesses may agree to
  divide the fee among themselves in any manner. Therefore, the fee is paid to one witness who may
  share it. The option stating the fee is split equally between the two witnesses is incorrect
  because the statute does not require an automatic split; division only occurs if the witnesses
  agree.
