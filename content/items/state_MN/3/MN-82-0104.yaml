stem: A licensee discovers that the property is subject to airport zoning regulations. According to
  Minn. Stat. § 82.68 Subd. 3(d), what must the licensee do?
options:
  - The notice of airport zoning info at county recorder
  - The notice of airport zoning data at town office
  - The notice of airport zoning ordinance at county clerk
  - The notice of airport zoning rules at city hall
key: A
explanation: The rule provides that a licensee has no duty to disclose airport zoning information if
  they timely provide a written notice that the regulations can be reviewed or obtained at the
  county recorder's office. Disclosing specific zoning details is not required under this provision.
citation:
  source: Minn. Stat. § 82.68 Subd. 3(d)
  url: null
  quoted_text: (d) A licensee or employee of the licensee has no duty to disclose information
    regarding airport zoning regulations if the broker or salesperson, in a timely manner, provides
    a written notice that a copy of the airport zoning regulations as adopted can be reviewed or
    obtained at the office of the county recorder where the zoned area is located.
