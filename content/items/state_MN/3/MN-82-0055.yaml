stem: Under Minn. Stat. § 82.68 Subd. 3(e), a 'qualified third party' for the purpose of a written
  report includes which of the following?
options:
  - A) A federal, state, or local governmental agency
  - D) The seller's attorney who has not inspected the property
  - B) The licensee's sibling who has no inspection experience
  - C) A friend of the buyer who offers opinions on paint colors
key: A
explanation: The definition in Subd. 3(e) explicitly includes a federal, state, or local
  governmental agency as a qualified third party. The licensee's sibling lacking inspection
  experience does not meet the expertise requirement, making that option incorrect.
