stem: A licensee receives a home inspection report stating that the roof is in good condition. The
  licensee personally observed a leak in the attic during a showing. According to Minn. Stat. §
  82.68 Subd. 3(f), what must the licensee do?
options:
  - The licensee must disregard the leak because the inspection report was prepared by a qualified
    third party.
  - The licensee must disclose the leak to the parties because it contradicts the inspection report.
  - The licensee must disclose the leak only if the buyer specifically asks about the roof condition.
  - The licensee must obtain a second inspection report before disclosing any information about the
    roof.
key: B
explanation: Minn. Stat. § 82.68 Subd. 3(f) requires a licensee to disclose any known facts that
  contradict information in a written report when a copy of the report is provided. The licensee
  personally observed a leak in the attic, which contradicts the inspection report stating the roof
  is in good condition. Therefore, the licensee must disclose the leak to the parties. Ignoring the
  leak because the report came from a qualified third party, waiting for the buyer to ask, or
  obtaining a second inspection before disclosing are not permitted under the rule.
