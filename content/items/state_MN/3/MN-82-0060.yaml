stem: Under Minn. Stat. § 82.68 Subd. 4, what must the listing agent do immediately after being
  informed by the buyer that they have decided **NOT** to proceed with the purchase?
options:
  - The agent must disclose the buyer's intent not to perform to the seller.
  - The agent must inform the buyer of the obligation to disclose before making any disclosure.
  - The agent must disclose to the seller and inform the buyer of the obligation before acting.
  - The agent must wait for a written notice before disclosing anything.
key: A
explanation: Subd. 4 mandates that upon notice of a party's intent not to perform, the licensee must
  immediately disclose that fact to the other party. Informing the buyer of the disclosure
  obligation is secondary and only required if reasonably possible before disclosure. Therefore, the
  immediate duty is to disclose the buyer's intent to the seller.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
