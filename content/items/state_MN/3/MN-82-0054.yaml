stem: During a transaction, the seller tells the listing agent that they will not be able to provide
  a marketable title because of an undisclosed mechanic's lien. The agent must immediately disclose
  this fact to the buyer. This obligation arises from which subdivision of Minn. Stat. § 82.68?
options:
  - Subdivision 2(a) – Financial interests disclosure; licensee
  - Subdivision 4 – Nonperformance of party
  - Subdivision 3(b) – Items not considered material facts
  - Subdivision 1 – Agent of broker disclosure
key: B
explanation: Subd. 4 requires immediate disclosure when a licensee learns that a party will not
  perform per the purchase agreement. The seller's inability to deliver marketable title constitutes
  nonperformance. Subd. 2(a) concerns the licensee's own interest in the property, not a party's
  failure to perform.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.68 Subd. 4
  url: null
  quoted_text: If a licensee is put on notice by a party to a real estate transaction that the party
    will not perform according to the terms of a purchase agreement or other similar written
    agreement to convey real estate, the licensee shall immediately disclose the fact of that
    party's intent not to perform to the other party or parties to the transaction.
