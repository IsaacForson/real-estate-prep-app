stem: A licensee discovers that the property is subject to airport zoning regulations. To avoid a
  duty to disclose this information under Minn. Stat. § 82.68 Subd. 3(d), what must the licensee do?
options:
  - A) Provide a written notice that a copy of the airport zoning regulations can be reviewed at the
    county recorder's office
  - B) Disclose the zoning restrictions to the buyer regardless of whether a written notice is
    provided
  - C) Obtain a signed waiver from the buyer that exempts the licensee from disclosing the airport
    zoning regulations
  - D) Ignore the airport zoning regulations and proceed with the transaction without any notice to
    the buyer
key: A
explanation: Subd. 3(d) states that a licensee has no duty to disclose airport zoning information if
  they provide a timely written notice that the regulations can be reviewed at the county recorder's
  office. Simply disclosing regardless or ignoring the requirement does not satisfy the exemption.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.68 Subd. 3(d)
  url: null
  quoted_text: A licensee or employee of the licensee has no duty to disclose information regarding
    airport zoning regulations if the broker or salesperson, in a timely manner, provides a written
    notice that a copy of the airport zoning regulations as adopted can be reviewed or obtained at
    the office of the county recorder where the zoned area is located.
