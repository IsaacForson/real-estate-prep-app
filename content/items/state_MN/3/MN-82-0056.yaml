stem: A licensee learns that the buyer intends to back out of the purchase agreement before closing.
  According to Minn. Stat. § 82.68 Subd. 4, what must the licensee do?
options:
  - A) Immediately disclose the buyer's intent not to perform to the seller
  - B) Wait until the closing date to inform the seller
  - C) Advise the buyer to seek financing elsewhere before disclosing
  - D) Keep the information confidential to avoid jeopardizing the deal
key: A
explanation: Subd. 4 requires the licensee to immediately disclose a party's intent not to perform
  upon receiving notice. Waiting to disclose or keeping it confidential violates the immediate
  disclosure obligation.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.68 Subd. 4
  url: null
  quoted_text: If a licensee is put on notice by a party to a real estate transaction that the party
    will not perform according to the terms of a purchase agreement or other similar written
    agreement to convey real estate, the licensee shall immediately disclose the fact of that
    party's intent not to perform to the other party or parties to the transaction.
