stem: A licensee learns that a registered predatory offender resides adjacent to a property they are
  listing. The licensee provides the buyer with a written notice that information about the
  predatory offender registry may be obtained by contacting local law enforcement. What is the
  licensee's duty regarding disclosure of this offender information under Minn. Stat. § 82.68 Subd.
  3(c)?
options:
  - The licensee has no duty to disclose the offender information because the written notice was
    provided.
  - The licensee must disclose the offender information to the buyer.
  - The licensee must disclose the offender information after the transaction is completed.
  - The licensee must disclose the offender information only if the buyer asks.
key: A
explanation: Subd. 3(c) provides that a licensee has no duty to disclose offender registry
  information if they timely provide a written notice directing the person to law enforcement or the
  Department of Corrections. Since the licensee gave the required written notice, no further
  disclosure is required. The other options incorrectly impose a disclosure duty despite the notice.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.68 Subd. 3(c)
  url: null
  quoted_text: A licensee or employee of the licensee has no duty to disclose information regarding an
    offender who is required to register under section 243.166 , or about whom notification is made
    under that section, if the broker or salesperson, in a timely manner, provides a written notice
    that information about the predatory offender registry and persons registered with the registry
    may be obtained by contacting local law enforcement where the property is located or the
    Department of Corrections
