stem: Under Minnesota law, if a purchase agreement does **NOT** specify when earnest money must be
  deposited, within how many business days must the listing broker deposit the earnest money after
  receipt or final acceptance, whichever is later?
options:
  - Six business days
  - Eight business days
  - Four business days
  - Three business days
key: D
explanation: The rule states that when the written agreement is silent on timing, the listing broker
  must deposit earnest money within three business days of receipt or final acceptance, whichever is
  later. The other options incorrectly state different timeframes that are not supported by the
  statute.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.75 Subd. 5(c)
  url: null
  quoted_text: If the written agreement between the parties is silent as to the timing of the deposit
    of earnest money, the listing broker shall deposit the earnest money within three business days
    of either receipt of the earnest money or final acceptance of the purchase agreement, whichever
    is later.
