stem: A broker does not ensure that salespersons deposit earnest money into the trust account,
  resulting in a buyer losing their deposit. What action may the commissioner take against the
  broker?
options:
  - The commissioner may issue a cease and desist order only
  - The commissioner may deny, suspend, or revoke the broker's license
  - The commissioner may require the broker to complete additional education
  - The commissioner may impose a $1,000 fine per violation
key: B
explanation: Minn. Stat. § 82.82, Subd. 1(d) authorizes the commissioner to deny, suspend, or revoke
  a license (or censure) for failing to reasonably supervise brokers or salespersons so as to cause
  injury or harm to the public. The scenario describes inadequate supervision causing financial
  harm, which triggers this authority. Requiring additional education or imposing a fine are not
  specified as sanctions in this subdivision.
