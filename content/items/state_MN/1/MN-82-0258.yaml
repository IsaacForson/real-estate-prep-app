stem: A broker wishes to act as a dual agent in a residential transaction. According to Minn. Stat.
  § 82.67, Subd. 3, paragraph III, what must the broker obtain before proceeding?
options:
  - Obtaining informed consent of all parties to the transaction
  - Securing a written buyer representation contract
  - Acquiring a signed agency disclosure form from the consumer
  - Getting a boxed format disclosure in the purchase agreement
key: A
explanation: Minn. Stat. § 82.67 Subd. 3 paragraph III requires that a broker obtain the informed
  consent of all parties before acting as a dual agent. Securing a written buyer representation
  contract pertains to buyer representation, not dual agency consent. Acquiring a signed agency
  disclosure form from the consumer provides a disclosure but does not satisfy the informed consent
  requirement. While Subd. 4 specifies a boxed format for consent, paragraph III mandates the
  consent itself, not the particular format.
