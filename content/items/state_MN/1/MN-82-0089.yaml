stem: A licensee acting as a facilitator is working with a seller and accepts a showing of the
  property by a buyer who is also represented by the facilitator. Under Minn. Stat. § 82.67, Subd.
  3, paragraph IV, what must the licensee do?
options:
  - The licensee may continue as a facilitator
  - The licensee must act as a buyer's broker
  - The licensee must act as a seller's broker
  - The licensee must obtain dual agency consent
key: B
explanation: The statute provides that if a facilitator working with a seller accepts a showing by a
  buyer represented by the facilitator, the facilitator must act as a buyer's broker. The distractor
  about continuing as a facilitator is incorrect because the facilitator's role changes upon
  accepting the showing.
