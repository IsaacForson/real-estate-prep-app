stem: A licensee lists a residential property and includes an override clause that lasts nine months
  after the listing agreement expires. Under Minn. Stat. § 82.66(c), is this provision permissible?
options:
  - Permitted only if a protective list is provided within 72 hours
  - Permitted because the parties agreed to the length
  - Prohibited as it exceeds six‑month limit for residential
  - Permitted if the property is later sold to a business
key: C
explanation: The statute prohibits override clauses longer than six months after expiration for
  residential listings. The nine‑month clause exceeds this limit, making it impermissible regardless
  of a protective list. The exception for up to two years applies only when the clause is used with
  the purchase or sale of a business.
