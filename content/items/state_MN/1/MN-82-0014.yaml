stem: An unlicensed person sells real estate as principal in six transactions within a 12-month
  period and is not represented by a licensed broker or salesperson. Under Minnesota law, this
  pattern creates what?
options:
  - A presumption that the person is engaged in the real estate business
  - An automatic exemption from licensure for isolated personal sales
  - A requirement that the person register as a subdivided land developer
  - A rebuttable finding that the person is a rental service operator
key: A
explanation: The law presumes a person is engaged in the business of selling real estate when that
  person engages as principal in five or more transactions during any 12-month period without being
  represented by a licensee.
citation:
  source: Minn. Stat. § 82.55
  url: null
  quoted_text: A person shall be presumed to be engaged in the business of selling real estate if the
    person engages as principal in five or more transactions during any 12-month period, unless the
    person is represented by a licensed real estate broker or salesperson.
