stem: Under Minn. Stat. § 82.70 Subd. 2(b)(4), what is the maximum amount that may be offered or
  paid for a referral fee involving timeshare or other recreational lands without being subject to
  the general prohibition on compensation?
options:
  - The maximum permissible amount is $100.
  - The maximum permissible amount is $200.
  - The maximum permissible amount is $150.
  - The maximum permissible amount is $50.
key: C
explanation: Subd. 2(b)(4) explicitly exempts referral fees for timeshare or other recreational
  lands when the amount does not exceed $150 and the payment is not contingent on a sale. The other
  dollar amounts are not supported by the statute.
