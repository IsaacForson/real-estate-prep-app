stem: A licensee acting as a facilitator shows a buyer a property that the licensee themselves
  listed. According to Minn. Stat. § 82.67 Subd. 3, paragraph IV, what must the licensee do?
options:
  - To act as a seller's broker
  - To act as a facilitator
  - To act as a buyer's broker
  - To obtain consent for dual agency
key: A
explanation: The rule requires a facilitator who shows a buyer a property that the facilitator
  themselves listed to act as a seller's broker. Thus, the licensee must act as a seller's broker.
  The distractor "To act as a facilitator" is wrong because the facilitator must switch roles when
  showing their own listing to a buyer.
citation:
  source: Minn. Stat. § 82.67 Subd. 3, paragraph IV
  url: null
  quoted_text: In the event a facilitator broker or salesperson, working with a Buyer, shows a
    property listed by the facilitator broker or salesperson, then the facilitator broker or
    salesperson must act as a Seller's Broker (see paragraph I above).
