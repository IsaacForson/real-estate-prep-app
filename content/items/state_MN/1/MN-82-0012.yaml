stem: A single licensee represents both the buyer and the seller in the same transaction. Under
  Minnesota law, this arrangement is classified as what?
options:
  - Transaction brokerage, since no fiduciary duty is owed here
  - Designated agency, since each party signs a separate agreement
  - Dual agency, since one duty runs to more than one party
  - Subagency, since the licensee works for the listing broker
key: C
explanation: Dual agency is defined as a situation in which a licensee owes a duty to more than one
  party to the transaction, which describes a single licensee representing both sides.
