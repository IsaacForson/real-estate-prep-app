stem: A salesperson passes the salesperson examination but does not submit a license application
  within one year of passing. What must the salesperson do to obtain a license?
options:
  - The salesperson must wait six months before reapplying
  - The salesperson must complete additional continuing education
  - The salesperson must submit the application with a late fee
  - The salesperson must retake the salesperson examination
key: D
explanation: The rule requires that an applicant who passes the salesperson exam must file an
  application and obtain the license within one year or take a second examination. Failing to apply
  within that period necessitates retaking the exam. The distractor about submitting with a late fee
  is incorrect because the statute provides no late‑fee option; the only remedy is a second exam.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.58(Subd. 5)
  url: null
  quoted_text: An applicant who obtains an acceptable score on a salesperson's examination must file
    an application and obtain the license within one year of the date of successful completion of
    the examination or a second examination must be taken to qualify for the license.
