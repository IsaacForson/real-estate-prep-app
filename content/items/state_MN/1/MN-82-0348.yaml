stem: A broker renews her license after the commissioner has determined the fund is below the needed
  level and set an assessment of $60. In addition to the regular renewal fee and the $20 fund fee,
  what amount must the broker pay?
options:
  - $60
  - $20
  - $40
  - $80
key: A
explanation: When the fund is below the level the commissioner believes is necessary, the
  commissioner may assess an amount not to exceed $100. That assessment is paid in addition to the
  regular renewal fee and the $20 fund fee required by § 82.86. Here the commissioner set the
  assessment at $60, so the broker must pay that amount in addition to the other fees.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.86
  url: null
  quoted_text: If the amount in the fund is at any time less than the commissioner believes is
    necessary to carry out the purposes of this section every licensee, when renewing a license,
    shall pay, in addition to the annual renewal fee and the fee set forth in subdivision 3, an
    assessment not to exceed $100, said sum having been reasonably determined by the commissioner to
    be necessary to restore a balance in the fund
  secondary: []
math:
  worked_solution: The commissioner’s assessment is $60. The broker must pay this assessment in
    addition to the renewal fee and the $20 fund fee. Therefore the additional amount required is
    $60.
