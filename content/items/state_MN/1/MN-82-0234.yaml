stem: A licensee meets a prospective buyer at an open house and discusses the property's features.
  When must the licensee provide the agency disclosure form?
options:
  - After the buyer signs agreement
  - Prior to the open house starting
  - Within one business day after meeting
  - At the first substantive contact
key: D
explanation: The rule requires the agency disclosure form to be provided at the first substantive
  contact with a consumer in a residential transaction; providing it earlier or later does not
  satisfy the requirement. The distractor "Within one business day after meeting" adds a time period
  not specified in the statute, making it incorrect.
