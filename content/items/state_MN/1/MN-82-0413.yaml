stem: A licensee represents both the buyer and the seller in a residential transaction. Under Minn.
  Stat. § 82.55, Subd. 6, does this constitute dual agency?
options:
  - This situation constitutes dual agency because one licensee represents both buyer and seller
  - This situation does not constitute dual agency because the licensee represents only one party in
    the transaction
  - This situation constitutes dual agency if the licensee also acts as the closing agent for the
    parties
  - This situation does not constitute dual agency because the buyer and seller are represented by
    different brokers
key: A
explanation: Under Minn. Stat. § 82.55, Subd. 6, dual agency means a situation in which a licensee
  owes a duty to more than one party to the transaction, such as representing both the buyer and the
  seller. Therefore, the statement that this situation constitutes dual agency because one licensee
  represents both buyer and seller is correct. The statement that the situation does not constitute
  dual agency because the licensee represents only one party is incorrect because the licensee in
  fact represents two parties. The statement that dual agency occurs only if the licensee also acts
  as the closing agent is incorrect because the statute defines dual agency solely by owing a duty
  to more than one party, regardless of any additional role. The statement that the situation does
  not constitute dual agency because the buyer and seller are represented by different brokers is
  incorrect because the scenario specifies that a single licensee represents both parties.
