math:
  worked_solution: "Step 1: Each judgment of $130,000 is less than the $150,000 per claimant limit, so
    each claimant may recover the full $130,000. Step 2: Sum the claim amounts: $130,000 + $130,000
    = $260,000. Step 3: Apply the licensee limit: the fund may not obligate more than $250,000 per
    licensee. Step 4: The payable amount is the lesser of the sum ($260,000) and the licensee limit
    ($250,000), which is $250,000."
  formulas:
    - Payable = min(Σ Claim_i, Licensee_limit) where Σ Claim_i = $130,000 + $130,000 = $260,000 and
      Licensee_limit = $250,000.
