stem: A licensee has two separate judgments from different claimants arising from the same
  transaction, each for $130,000. What is the maximum amount the real estate education, research and
  recovery fund may pay for these claims under Minn. Stat. § 82.86, Subd. 7?
options:
  - $130,000
  - $260,000
  - $250,000
  - $150,000
key: C
explanation: Each claim is below the $150,000 per‑claimant limit, so the full $130,000 for each
  claimant would be payable, but the fund may not obligate more than $250,000 per licensee
  regardless of the number of claims. The sum of the two claims ($260,000) exceeds the licensee
  limit, so the fund pays the lesser amount, $250,000. The distractor $260,000 incorrectly ignores
  the per‑licensee cap.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.86, Subd. 7
  url: null
  quoted_text: provided that nothing in this chapter shall be construed to obligate the fund for more
    than $150,000 per claimant, per transaction, subject to the limitations set forth in subdivision
    14, regardless of the number of persons aggrieved or parcels of real estate involved in the
    transaction, provided that regardless of the number of claims against a licensee, nothing in
    this chapter may obligate the fund for more than $250,000 per licensee.
