stem: Under Minn. Stat. § 82.55, subd. 15, what does the term 'primary broker' mean for a
  corporation licensed as a real estate broker?
options:
  - The sole shareholder who holds the corporation's real estate broker license and oversees
    operations
  - Each officer of the corporation who is individually licensed to act as broker for the corporation
  - The limited liability company manager who oversees all trust accounts and coordinates
    transactions
  - The partnership partner who manages the corporation's salespersons and supervises agents
key: B
explanation: Minn. Stat. § 82.55, subd. 15 defines 'primary broker' for a corporation as each
  officer of the corporation who is individually licensed to act as broker for the corporation. The
  option describing the sole shareholder is incorrect because the statute does not limit the
  definition to shareholders. The options describing an LLC manager or a partnership partner are
  incorrect because they refer to different entity types not applicable to a corporation's statutory
  definition of primary broker.
