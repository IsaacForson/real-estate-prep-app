stem: Under Minn. Stat. § 82.82 Subdivision 9(a), what is the threshold amount of delinquent taxes
  that may prevent issuance or renewal of a license?
options:
  - $1,000.00
  - $100.00
  - $500.00
  - $250.00
key: C
explanation: The statute states that the commissioner may not issue or renew a license if the
  licensee owes the state delinquent taxes in the amount of $500 or more. Therefore, $500.00 is the
  correct threshold. The distractor $250.00 is incorrect because the law specifies $500, not a lower
  amount.
