stem: A broker realizes that they will be representing both the seller and the buyer in a
  residential transaction. According to Minn. Stat. § 82.67 Subd. 4, what must the broker do before
  proceeding?
options:
  - Obtain approval from the Minnesota commissioner before proceeding with the transaction.
  - Obtain verbal agreement from both parties before showing any property.
  - Obtain a signed facilitator services agreement from the buyer and seller.
  - Obtain written consent of all parties in the purchase agreement using the boxed format.
key: D
explanation: Subdivision 4 requires the broker to make full disclosure and obtain the consent of all
  parties in the purchase agreement using the boxed format specified in the statute. The distractor
  suggesting a verbal agreement is incorrect because the statute demands written consent in the
  purchase agreement in the boxed format, not merely verbal agreement.
