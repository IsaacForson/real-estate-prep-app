stem: Under Minn. Stat. § 82.75 Subd. 4, what is a broker, salesperson, or closing agent prohibited
  from doing with trust account funds?
options:
  - Commingle personal funds with trust funds
  - Deposit personal funds to cover service charges or minimums
  - Deposit earnest money within three business days of receipt
  - Maintain a separate record for each beneficiary or transaction
key: A
explanation: Subd. 4 prohibits commingling personal funds with trust funds in a trust account,
  except that personal funds may be deposited to pay service charges or satisfy minimum balance
  requirements. Therefore, commingling personal funds is the prohibited act. Depositing personal
  funds to cover service charges is permitted under the exception, making it an incorrect answer for
  what is prohibited.
