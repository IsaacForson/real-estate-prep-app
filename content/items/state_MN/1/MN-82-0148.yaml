stem: A licensee uses a computer program that automatically sends email responses to inquiries about
  listings without human review. Under Minn. Stat. § 82.55, subd. 7, this program is considered
  what?
options:
  - Electronic record
  - Protective list
  - Electronic signature
  - Electronic agent
key: D
explanation: Subdivision 7 defines an electronic agent as a computer program or an electronic or
  other automated means used independently to initiate an action or respond to electronic records or
  performances, in whole or in part, without review or action by an individual. The described
  program that automatically sends email responses fits this definition, making it an electronic
  agent. The distractor calling it an electronic record is wrong because an electronic record is the
  data created or stored electronically, not the program that uses it.
