stem: Under Minn. Stat. § 82.70 Subd. 6, when must a closing agent disclose a fee in writing to a
  borrower to avoid prohibition on charging the fee at settlement?
options:
  - Disclosure of the fee in writing is required on the same day as settlement
  - Disclosure of the fee in writing is required at least three business days before settlement
  - Disclosure of the fee in writing is not required under this subdivision
  - Disclosure of the fee in writing is required at least one business day before settlement
key: D
explanation: The rule states that a closing agent may not charge a fee if it was not previously
  disclosed in writing at least one business day before settlement. Therefore, disclosure must occur
  at least one business day prior. The distractor suggesting three business days is incorrect
  because the statute only requires one business day, not three.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.70 Subd. 6
  url: null
  quoted_text: A real estate closing agent may not charge a fee for closing services to a borrower,
    and a borrower may not be required to pay such a fee at settlement, if the fee was not
    previously disclosed in writing at least one business day before the settlement.
