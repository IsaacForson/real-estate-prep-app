stem: Under Minn. Stat. § 82.66, Subd. 1(d)(1), when may a licensee seek to enforce an override
  clause after a listing agreement expires?
options:
  - After obtaining a new listing agreement from the seller
  - After furnishing a protective list to the seller within 72 hours
  - After receiving verbal consent from the seller in writing
  - After waiting six months following the expiration date
key: B
explanation: The statute provides that a licensee shall not seek to enforce an override clause
  unless a protective list has been furnished to the seller within 72 hours after the expiration of
  the listing agreement. Simply obtaining a new listing agreement does not meet this protective list
  requirement.
