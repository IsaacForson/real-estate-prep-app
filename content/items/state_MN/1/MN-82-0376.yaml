stem: A broker has made full disclosure to both parties about dual agency in a residential
  transaction. According to Minn. Stat. § 82.67 Subd. 4, how must the broker present this disclosure
  in the purchase agreement?
options:
  - As a separate attachment to the agreement
  - In a boxed format set off to draw attention
  - Verbally disclosed at the closing table
  - In the financing addendum only, not elsewhere
key: B
explanation: The statute requires that the dual agency disclosure be set off in a boxed format to
  draw attention to it. Therefore, the broker must present the disclosure in a boxed format within
  the purchase agreement. The distractor suggesting a separate attachment is incorrect because the
  rule does not permit the disclosure to be provided as an attachment; it must be boxed within the
  agreement.
