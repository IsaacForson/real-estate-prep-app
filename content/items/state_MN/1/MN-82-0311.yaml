stem: What duty does a facilitator owe to a party in a residential real property transaction under
  Minn. Stat. § 82.67 Subd. 3, paragraph IV?
options:
  - Loyalty and obedience only
  - Confidentiality only
  - Full fiduciary duties
  - No duty owed to any party
key: B
explanation: The rule states that a facilitator owes no fiduciary duties except confidentiality
  unless a written facilitator services agreement includes those duties. Therefore, the correct
  answer is confidentiality only. The distractor "Loyalty and obedience only" is incorrect because
  the facilitator does not owe those fiduciary duties absent a written agreement.
