stem: A licensee acting as a facilitator shows a buyer a property that the licensee's own brokerage
  has listed. Under Minn. Stat. § 82.67, Subd. 3, paragraph IV, what must the licensee do?
options:
  - The licensee must act as a seller's broker
  - The licensee must act as a buyer's broker
  - The licensee may continue as a facilitator
  - The licensee must obtain dual agency consent
key: A
explanation: The statute states that if a facilitator working with a buyer shows a property listed
  by the facilitator, the facilitator must act as a seller's broker. The distractor about continuing
  as a facilitator is incorrect because the role changes upon showing the facilitator's own listing.
