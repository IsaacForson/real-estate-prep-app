stem: A broker seeks to enforce an override clause after a listing agreement expires. The broker's
  protective list includes a person who only received a mailed flyer about the property and another
  person who contacted the broker by phone. According to Minn. Stat. § 82.66 Subd. 1(e), which
  person(s) satisfy the broker's burden of demonstrating an affirmative showing of interest?
options:
  - Only the person who received the mailed flyer
  - Only the person who contacted the broker
  - Both the flyer recipient and the caller
  - Neither the flyer recipient nor the caller
key: B
explanation: The statute requires that each person on the protective list have made an affirmative
  showing of interest by responding to an advertisement, contacting the broker, or being physically
  shown the property; mere mailing of literature does not count. Therefore, only the person who
  contacted the broker satisfies the burden, while the person who only received a flyer does not.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.66 Subd. 1(e)
  url: null
  quoted_text: For the purpose of this section, the mere mailing or other distribution by a licensee
    of literature setting forth information about the property in question does not, of itself,
    constitute an affirmative showing of interest in the property on the part of a subsequent
    purchaser.
