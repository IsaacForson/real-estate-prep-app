stem: A licensee has a buyer's broker agreement that expired on June 1. The licensee furnished the
  buyer with a protective list on June 4. The licensee now seeks to enforce an override clause in
  the agreement. Is the licensee permitted to enforce the override clause?
options:
  - No, because override clauses are not enforceable.
  - No, because override clauses are not allowed.
  - Yes, because the list was furnished within 72 hours.
  - No, because the list was furnished after 72 hours.
key: C
explanation: Under Minn. Stat. § 82.66 Subd. 2(d)(1), a licensee may seek to enforce an override
  clause only after furnishing a protective list to the buyer within 72 hours of the agreement's
  expiration. Here the agreement expired on June 1 and the list was furnished on June 4, which is
  within the 72‑hour period, so the licensee may enforce the override clause. If the list were
  furnished after 72 hours, enforcement would not be permitted.
