stem: Which statement correctly distinguishes a broker price opinion (BPO) from an automated
  valuation model under Minnesota law?
options:
  - A BPO is a formal appraisal certified by a state licensing board
  - A BPO is an estimate of probable selling price prepared by a broker
  - A BPO is a computerized valuation generated without any human review
  - A BPO is a lender-issued disclosure required before closing
key: B
explanation: A broker price opinion is defined as an estimate of probable selling price prepared by
  a real estate broker, salesperson, or licensed appraiser, unlike a computer-generated automated
  valuation model.
