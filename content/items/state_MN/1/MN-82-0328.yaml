explanation: Minnesota Statute § 82.60(2)(c)(1)(iii)(B) lists the prohibition of fraudulent,
  deceptive, or dishonest practices as a substantive topic in Course I. That topic defines conduct
  that is prohibited, such as making false statements about a property's size. The other answer
  choices describe unrelated subjects like licensing requirements, penalties, and oversight
  procedures.
