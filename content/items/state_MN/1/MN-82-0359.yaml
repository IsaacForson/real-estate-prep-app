stem: Which of the following statements accurately reflects the prohibition on undisclosed
  compensation under Minn. Stat. § 82.70 Subd. 3?
options:
  - A licensee shall not accept, give, or charge any disclosed compensation or realize any direct or
    indirect remuneration that benefits the licensee on an expenditure made for a principal.
  - A licensee shall not accept, give, or charge any undisclosed compensation or realize any direct
    or indirect remuneration that benefits the licensee on an expenditure made for a principal.
  - A licensee shall not accept, give, or charge any undisclosed compensation or realize any direct
    or indirect remuneration that benefits the licensee on an expenditure made for a third party.
  - A licensee shall not accept, give, or charge any undisclosed compensation or realize any direct
    or indirect remuneration that benefits the principal on an expenditure made for the licensee.
key: B
explanation: The correct answer restates the rule from Minn. Stat. § 82.70 Subd. 3, which forbids a
  licensee from accepting undisclosed compensation or realizing any direct or indirect remuneration
  that benefits the licensee on an expenditure made for a principal. The most tempting distractor
  suggests that disclosure after closing makes the compensation permissible, but the statute
  prohibits undisclosed compensation regardless of when or whether it is later disclosed.
