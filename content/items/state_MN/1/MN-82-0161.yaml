stem: In an even-numbered year, the commissioner prepares the report on September 30. Is this
  compliant with the deadline for filing the report under Minn. Stat. § 82.86 Subd. 19?
options:
  - The report filed on September 30 is non‑compliant because it must be filed by October 1.
  - The report filed on September 30 is non‑compliant because the deadline is September 15.
  - The report filed on September 30 is compliant only if the fund balance exceeds $4,000,000.
  - The report filed on September 30 is compliant with the filing deadline.
key: D
explanation: The statute requires the commissioner to prepare and file the report on or before
  October 1 in each even-numbered year. Filing on September 30 meets this deadline, making the
  report compliant. The other options either misstate the deadline or add irrelevant conditions.
