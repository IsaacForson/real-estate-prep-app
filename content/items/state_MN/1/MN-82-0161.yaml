  quoted_text: The commissioner shall, on or before October 1 in each even-numbered year, prepare and
    file in the Office of the Governor for the preceding two fiscal years ending June 30 a report on
    the activities of the real estate education, research and recovery fund; noting the amount of
    money received by the fund, the amount of money expended and the purposes therefor.
