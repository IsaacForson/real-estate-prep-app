stem: Under Minn. Stat. § 82.81, Subd. 1, what must a person do before acting as a real estate
  broker or salesperson in Minnesota?
options:
  - Joining a local real estate association
  - Being licensed as provided in this chapter
  - Obtaining a college degree in real estate
  - Completing a background check
key: B
explanation: Subdivision 1 explicitly states that no person may act as a real estate broker or
  salesperson unless licensed as provided in this section. Therefore, being licensed is required.
  The other options, such as obtaining a college degree, are not mandated by this subdivision.
