stem: A licensee receives notice from the Minnesota Department of Revenue that they owe $800 in
  delinquent taxes and has not obtained a tax clearance certificate. What action may the
  commissioner take regarding the licensee's license renewal?
options:
  - The commissioner may renew the license if the licensee pays half the amount
  - The commissioner may renew the license but must impose a $500 fine
  - The commissioner may not renew the license without a tax clearance certificate
  - The commissioner may renew the license after 30 days if no payment is made
key: C
explanation: Under Minn. Stat. § 82.82, Subd. 9(a), the commissioner may not issue or renew a
  license if the licensee owes $500 or more in delinquent taxes unless a tax clearance certificate
  is obtained. Since the licensee owes $800, which exceeds the $500 threshold, renewal is not
  allowed without the certificate. The other options propose conditions—such as paying half the
  amount, imposing a fine, or waiting 30 days without payment—that are not authorized by the
  statute.
