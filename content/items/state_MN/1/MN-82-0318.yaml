math:
  worked_solution: |-
    1. Total of approved accelerated claims = $45,000.
    2. Statutory limit for accelerated claims = $50,000.
    3. Since $45,000 ≤ $50,000, the commissioner may pay the full $45,000.
    Maximum payable amount = $45,000.
