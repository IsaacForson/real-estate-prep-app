stem: A licensee has three approved accelerated claims totaling $45,000 arising from separate
  transactions. Under Minn. Stat. § 82.86, Subd. 8, what is the maximum amount the commissioner may
  pay under the accelerated claims process?
options:
  - The commissioner may pay none of the claims because the total exceeds the limit.
  - The commissioner may pay $45,000 and retain any excess for later payment.
  - The commissioner may pay up to $50,000, the accelerated process limit.
  - The commissioner may pay the full $45,000 amount for the claims.
key: D
explanation: Subdivision 8 of Minn. Stat. § 82.86 authorizes the commissioner to pay accelerated
  claims whose combined amount does not exceed $50,000. Because the three approved claims total
  $45,000, which is less than the $50,000 ceiling, the commissioner may pay the entire $45,000. The
  limit only caps the maximum payable amount; it does not require payment beyond the actual claim
  total.
citation:
