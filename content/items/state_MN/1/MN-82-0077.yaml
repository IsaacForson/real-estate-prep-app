stem: Under Minn. Stat. § 82.86, subd. 16, what is the legal classification of knowingly filing a
  false document with the commissioner? (**NOT** a trick question.)
options:
  - A gross misdemeanor offense
  - A petty misdemeanor offense
  - A civil violation offense
  - A felony offense classification
key: A
explanation: Minnesota Statutes § 82.86, subdivision 16 provides that the conduct constitutes a
  gross misdemeanor. Therefore the choice describing the act as a gross misdemeanor offense is the
  correct answer. The alternatives describing the act as a petty misdemeanor, a civil violation, or
  a felony are incorrect because the statute does not assign those classifications.
