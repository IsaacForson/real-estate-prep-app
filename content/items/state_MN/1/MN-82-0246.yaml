stem: A licensee includes an arbitration clause in a purchase agreement that addresses the broker’s
  rights and liabilities. Under Minn. Stat. § 82.81, Subd. 5, when is this clause permissible?
options:
  - If the buyer agrees to the clause in writing before closing.
  - If the clause is limited to disputes over earnest money only.
  - If the broker discloses the clause to the buyer before signing.
  - If the broker is a principal in the transaction.
key: D
explanation: Subd. 5 prohibits arbitration clauses that address the rights or liabilities of
  licensed persons unless that person is a principal in the transaction. When the broker is a
  principal, the clause is allowed. The other options describe circumstances that do not meet the
  statutory exception.
