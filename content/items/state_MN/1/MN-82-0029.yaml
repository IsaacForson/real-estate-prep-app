stem: May a Minnesota real estate salesperson be licensed to act on behalf of two different brokers
  during the same period of time?
options:
  - No, unless the two brokers share the same business entity license
  - Yes, provided each broker consents in writing to the arrangement
  - Yes, provided the salesperson discloses the arrangement to clients
  - No, a salesperson may act on behalf of a single broker at a time
key: D
explanation: The statute requires a salesperson to be licensed to act on behalf of a licensed broker
  and prohibits being licensed to act on behalf of more than one broker in the state during the same
  period of time.
