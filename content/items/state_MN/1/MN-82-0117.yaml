  url: null
  quoted_text: An applicant for a broker's license must successfully complete a course of study in the
    real estate field consisting of 30 hours of instruction approved by the commissioner, of which
    three hours shall consist of training in state and federal fair housing laws, regulations, and
    rules. The course must have been completed within 12 months prior to the date of application for
    the broker's license.
