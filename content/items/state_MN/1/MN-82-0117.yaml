stem: An applicant for a broker's license must complete 30 hours of instruction approved by the
  commissioner, of which three hours must be training in state and federal fair housing laws, and
  this course must have been completed within how many months prior to the date of application?
options:
  - 6 months
  - 12 months
  - 18 months
  - 24 months
key: B
explanation: The statute specifies that the 30‑hour broker pre‑license course, including three hours
  of fair‑housing training, must be completed within 12 months before applying for the broker
  license. The 6‑month distractor understates the allowed period, while 18‑ and 24‑month options
  exceed it.
