stem: A broker offers a $120 referral fee to an unlicensed individual for referring a client who
  later purchases a timeshare week. The payment will be made only if the client completes the
  purchase. Is this referral fee permissible under Minn. Stat. § 82.70 Subd. 2(b)(4)?
options:
  - The fee is not permissible because the amount exceeds the statutory limit.
  - The fee is not permissible because only licensed persons may receive it.
  - The fee is permissible because the broker is bound by the recipient's representations.
  - The fee is permissible because the payment is made solely for the referral.
key: B
explanation: Under Minn. Stat. ch. 82 § 82.70 Subd. 2(b)(4), a referral fee for a timeshare
  transaction is permissible only if it is paid to a licensed person, the amount does not exceed
  $150, and the payment is not contingent on a sale. Here the fee is offered to an unlicensed
  individual, so it is not permissible regardless of the amount or the contingency. The other
  options incorrectly focus on the amount, the broker’s reliance on the recipient’s statements, or
  the nature of the payment.
