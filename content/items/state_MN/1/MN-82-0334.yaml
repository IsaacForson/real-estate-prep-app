math:
  worked_solution: |-
    1) Statutory limit for a permissible referral fee: $150.
    2) Offered fee amount: $120.
    3) Compare: $120 ≤ $150, so the amount does not exceed the limit.
    4) Compute difference (optional): $150 - $120 = $30.
    5) Because the recipient is unlicensed, the fee is not permissible irrespective of the amount.
  formulas:
    - "Comparison: amount ≤ limit"
    - "Subtraction: limit - amount = difference"
