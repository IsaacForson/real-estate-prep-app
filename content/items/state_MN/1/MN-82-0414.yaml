stem: A licensee receives a damage deposit from a tenant for a rental property. Under Minn. Stat. §
  82.55, Subd. 26, is this amount considered trust funds?
options:
  - The amount is considered trust funds because damage deposits are explicitly included in the
    definition
  - The amount is not considered trust funds because only earnest money deposits qualify
  - The amount is considered trust funds only if the licensee holds a broker's license
  - The amount is not considered trust funds because it is received after the transaction is
    terminated
key: A
explanation: Under Minn. Stat. § 82.55 Subd. 26, damage deposits are included in the definition of
  trust funds, so the amount received is trust funds. The other options are incorrect because they
  incorrectly limit trust funds to earnest money only, condition trust funds on the licensee holding
  a broker's license, or claim that funds received after a transaction ends are not trust funds.
