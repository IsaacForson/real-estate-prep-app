stem: A licensee is helping a buyer purchase a five-unit apartment building that will be rented out.
  Under Minn. Stat. § 82.67 Subd. 3, footnote (1), is the licensee required to provide the agency
  disclosure form?
options:
  - The licensee must provide the agency disclosure form because the property is residential.
  - The licensee must provide the agency disclosure form unless the buyer signs a waiver.
  - The licensee must not provide the agency disclosure form only if the property is owner-occupied.
  - The licensee must not provide the agency disclosure form because the property is intended for
    more than four families.
key: D
explanation: Footnote (1) limits the agency disclosure requirement to property occupied or intended
  to be occupied by one to four families as a residence; a five-unit apartment building exceeds this
  limit, so disclosure is not required. The distractor asserting disclosure is required because the
  property is residential is incorrect because the statute restricts the requirement to one-to-four
  family residential property, not all residential property.
