stem: A licensee uses an automated chatbot on their website to respond to consumer inquiries about
  property listings without any human review. Under Minn. Stat. § 82.55, subd. 7, this chatbot is
  best described as which of the following?
options:
  - An electronic agent
  - An electronic record
  - An electronic signature
  - A protective list
key: A
explanation: The statute defines an "electronic agent" as a computer program or electronic means
  used independently to initiate an action or respond to electronic records without review or action
  by an individual. The chatbot fits this definition, whereas the other options refer to different
  concepts.
