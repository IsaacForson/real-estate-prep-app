  - Yes, because revocations in other states do not affect Minnesota eligibility
  - Yes, because six months have passed since the revocation occurred
  - No, because a revocation of any age bars examination eligibility
key: A
explanation: The statute bars an applicant from examination eligibility if a license was revoked in
  Minnesota or any other state within two years of the date of application.
