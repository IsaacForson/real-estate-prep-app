  url: null
  quoted_text: Withdrawal from the status of licensee or withdrawal of the license application becomes
    effective 30 days after receipt of a request to withdraw or within a shorter period the
    commissioner determines unless a revocation, suspension, or denial proceeding is pending when
    the request to withdraw is filed
