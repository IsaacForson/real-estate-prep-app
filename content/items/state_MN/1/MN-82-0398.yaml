stem: A licensee submits a written request to withdraw their real estate license to the
  commissioner. No revocation or suspension proceeding is pending at the time of the request. Under
  Minn. Stat. § 82.63, Subd. 15, when does the withdrawal become effective?
options:
  - Effective immediately upon the commissioner's receipt
  - Effective 30 days after the commissioner's receipt
  - Effective after the commissioner approves the request
  - Effective one year after the commissioner's receipt
key: B
explanation: The statute provides that a withdrawal becomes effective 30 days after the commissioner
  receives the request unless a revocation or suspension proceeding is pending. Therefore, the
  correct timing is 30 days after receipt. The distractor suggesting immediate effectiveness is
  incorrect because the rule imposes a 30‑day waiting period when no proceeding is pending.
