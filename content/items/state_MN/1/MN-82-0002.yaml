stem: In Minnesota license law, what does an override clause in a listing agreement allow a broker
  to do after that agreement expires?
options:
  - Extend the listing agreement automatically for another full term
  - Convert the listing into a signed buyer's representation agreement
  - Transfer the listing file to another broker without the seller's consent
  - Receive compensation if the property sells to a buyer the broker showed
key: D
explanation: An override clause lets a broker collect compensation after expiration when the buyer
  is someone the broker or a salesperson had already shown or negotiated with before the listing
  ended.
citation:
  source: Minn. Stat. § 82.55, subd. 13
  url: null
  quoted_text: a provision in a listing agreement or similar instrument allowing the broker to receive
    compensation when, after the listing agreement has expired, the property is sold to persons with
    whom a broker or salesperson had negotiated or shown the property prior to the expiration of the
    listing agreement
