stem: "A licensee receives an earnest money check from a buyer. To satisfy the trust account
  requirement under Minn. Stat. § 82.55 Subd. 25, the licensee must:"
options:
  - Cash the check and keep the proceeds in a fire‑proof safe on premises.
  - Endorse the check over to the broker’s personal operating account.
  - Hold the check in a locked drawer until the closing date arrives.
  - Deposit the check into a trust account as defined in Minn. Stat. § 82.55 Subd. 25.
key: D
explanation: The statute requires that trust funds be deposited into an account that segregates them
  from other funds, which is a trust account as defined. Holding the check, endorsing it to a
  personal account, or cashing it fails to segregate the funds. Therefore, depositing the check into
  a trust account satisfies the requirement.
citation:
