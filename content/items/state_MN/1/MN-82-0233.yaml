stem: Under Minn. Stat. § 82.81, Subd. 12(11), a licensee must account for or remit money belonging
  to another within what time frame?
options:
  - Immediately upon receipt
  - Within 24 hours of receipt
  - Within a reasonable time
  - Within 30 days of receipt
key: C
explanation: The statute requires that a licensee not fail within a reasonable time to account for
  or remit money belonging to another, meaning the duty is to act within a reasonable time. The
  distractor "Within 24 hours of receipt" imposes a specific deadline not found in the rule, so it
  is incorrect.
