stem: What is the maximum amount that may be offered or paid for a referral fee in a timeshare or
  other recreational lands transaction under Minn. Stat. § 82.70 Subd. 2(b)(4)?
options:
  - $200.00
  - $150.00
  - $100.00
  - $50.00
key: B
explanation: The rule states that for timeshare or other recreational lands the amount offered or
  paid must not exceed $150 and must not be conditioned on a sale. Therefore $150 is the highest
  permissible amount. The $100 distractor is under the limit but not the maximum.
