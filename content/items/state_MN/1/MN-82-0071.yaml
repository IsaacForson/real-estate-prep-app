stem: Under Minnesota law, a real estate broker may establish an interest-bearing trust account for
  receiving deposits pursuant to which statutory provision?
options:
  - Under Minnesota Statutes section 462A.201.
  - Under Minnesota Statutes section 504B.178.
  - Under Minnesota Statutes section 82.75.
  - Under Minnesota Statutes section 82.55.
key: B
explanation: The statute explicitly permits brokers to establish interest-bearing trust accounts for
  receiving deposits in accordance with section 504B.178. The other sections cited pertain to
  housing trust fund agency, license fees, and general brokerage requirements, none of which
  authorize interest-bearing trust accounts for deposits.
citation:
