stem: A salesperson terminates her activity with Broker X on April 1. Broker X notifies the
  commissioner of the termination on April 12. The salesperson wishes to work with Broker Y.
  According to Minn. Stat. § 82.63, Subd. 6, what is the earliest point at which the salesperson may
  be licensed with Broker Y?
options:
  - The salesperson may only be licensed with Broker Y after Broker X has notified the commissioner
    within ten days of the termination
  - The salesperson may apply for transfer of the license to active status with Broker Y at any time
    during the remainder of the license period
  - The salesperson may only be licensed with Broker Y after the license period has expired and she
    submits a new license application
  - The salesperson may only be licensed with Broker Y after completing a new prelicense education
    course approved by the commissioner
key: B
explanation: Under Minn. Stat. § 82.63, Subd. 6, a salesperson’s license becomes ineffective upon
  termination, but the salesperson may apply for transfer to another broker at any time during the
  remainder of the license period. The broker’s late notification does not affect the salesperson’s
  ability to transfer. The distractor suggesting that licensing with Broker Y depends on the
  broker’s timely notice is incorrect because the statute ties transfer eligibility to the
  salesperson’s application, not the broker’s notification.
