stem: Under Minn. Stat. § 82.67, Subd. 3, paragraph IV, what duty does a facilitator owe to a party
  in a residential real property transaction?
options:
  - Fiduciary duties, subject to a written facilitator services agreement
  - Disclosure of material facts, subject to a written facilitator services agreement
  - Confidentiality, subject to a written facilitator services agreement
  - Loyalty and obedience, subject to a written facilitator services agreement
key: C
explanation: The statute provides that a facilitator owes no fiduciary duties except
  confidentiality, unless those duties are included in a written facilitator services agreement.
  Thus, the facilitator's duty is limited to confidentiality under those conditions.
