stem: A broker maintains a pooled interest-bearing trust account for client funds. Under Minnesota
  law, what must the broker do with the interest earned on this account, after deducting reasonable
  transaction costs, unless the parties have a written agreement stating otherwise?
options:
  - The broker must pay the interest to the Minnesota Housing Finance Agency
  - The broker must retain the interest for the broker's office expenses
  - The broker must distribute the interest equally to the buyer and seller
  - The broker must credit the interest to the client's individual trust account
key: A
explanation: The statute provides that interest accruing on the trust account, less reasonable
  transaction costs, must be paid to the Minnesota Housing Finance Agency for deposit in the housing
  trust fund account unless an expressed written agreement between the parties directs otherwise.
  Retaining the interest for office expenses is not permitted absent such an agreement.
