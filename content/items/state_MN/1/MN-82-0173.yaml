stem: Which of the following must be included in every listing agreement under Minn. Stat. § 82.66(b)?
options:
  - A definite expiration date
  - A statement of broker’s fees
  - A copy of the property address
  - A list of recent transactions
key: A
explanation: The rule requires a definite expiration date in all listing agreements. A statement of
  broker’s fees is not the specific required item; while compensation must be disclosed, the rule
  mandates the amount or basis of compensation, not a fee statement.
