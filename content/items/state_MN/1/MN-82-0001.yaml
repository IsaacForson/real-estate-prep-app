stem: Under Minnesota real estate brokerage license law, dual agency exists when a licensee is in
  what kind of relationship with the parties to a transaction?
options:
  - One where the licensee cancels the listing agreement before it expires
  - One where the licensee holds trust funds for two unrelated clients
  - One where the licensee owes a duty to more than one transaction party
  - One where the licensee supervises salespersons at more than one office
key: C
explanation: The statute defines dual agency as existing whenever a licensee owes a duty to more
  than one party to the same transaction, regardless of how many licensees are involved.
