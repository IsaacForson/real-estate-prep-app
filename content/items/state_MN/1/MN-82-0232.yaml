stem: A broker wants to share part of the commission with a buyer's broker who exclusively
  represents the buyer. Under Minn. Stat. § 82.70, is this allowed?
options:
  - The sharing is prohibited unless the buyer and seller agree to a separate arrangement.
  - The sharing is allowed only if the commission exceeds one hundred fifty dollars.
  - The sharing is allowed only if the buyer's broker holds a multistate license.
  - The sharing is allowed when the seller authorizes it in the listing agreement.
key: D
explanation: Subd. 4 expressly permits the seller to authorize the seller's broker to disburse part
  of the broker's compensation to other brokers, including buyer's brokers solely representing the
  buyer, via the listing agreement. Without such authorization, sharing is not permitted. The $150
  limit applies to timeshare referral fees under Subd. 2(b)(4), not to commission splits.
