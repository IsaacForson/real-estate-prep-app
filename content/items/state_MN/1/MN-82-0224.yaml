stem: A Minnesota real estate broker offers a $200 referral fee to an unlicensed acquaintance for
  referring a client interested in purchasing a timeshare week. The payment is not contingent on a
  sale and is made solely for the referral. Under Minn. Stat. § 82.70 Subd. 2(b)(4), is this
  permissible?
options:
  - The fee is permissible because it is not contingent on a sale and involves a timeshare referral
  - The fee is not permissible because the amount exceeds the $150 limit for timeshare referral fees
  - The fee is not permissible because referral fees are prohibited unless the recipient is a
    licensed broker
  - The fee is permissible because the acquaintance is unlicensed and the fee is a referral fee
key: B
explanation: Under Minn. Stat. § 82.70 Subd. 2(b)(4), a referral fee for timeshare or recreational
  lands is allowed only if the amount does not exceed $150 and is not contingent on a sale. Because
  the offered fee is $200, it exceeds the $150 limit, making the payment impermissible regardless of
  the lack of contingency.
