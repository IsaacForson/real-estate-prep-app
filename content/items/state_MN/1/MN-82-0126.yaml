stem: A salesperson wishes to be licensed to act on behalf of an individual who holds a limited real
  estate broker's license that authorizes only negotiations of mortgage loans other than residential
  mortgage loans. Under Minn. Stat. § 82.63, Subd. 13, what is the correct outcome?
options:
  - The salesperson may not be licensed to act on behalf of an individual holding a limited broker's
    license under any circumstances
  - The salesperson may be licensed to act on behalf of an individual holding a limited broker's
    license that includes residential mortgage loan negotiations
  - The salesperson may be licensed to act on behalf of an individual holding a limited broker's
    license after completing an additional eight-hour closing agent course approved by the
    commissioner
  - The salesperson may be licensed to act on behalf of an individual holding a limited broker's
    license if the individual also holds a standard real estate broker's license
key: A
explanation: Minn. Stat. § 82.63, Subd. 13, expressly provides that a salesperson may not be
  licensed to act on behalf of an individual holding a limited broker's license, regardless of the
  license’s scope. Thus, the salesperson cannot be licensed for that role. The distractor suggesting
  that adding residential mortgage loan negotiations would permit the arrangement is incorrect
  because the prohibition applies to any limited broker's license.
