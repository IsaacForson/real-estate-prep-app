stem: A licensee keeps a written list of prospective buyers they have shown properties to before the
  listing agreement expires. Under Minnesota law, this list is known as which of the following?
options:
  - Electronic record of client communications
  - Override clause for expired listings
  - Trust account for earnest money deposits
  - Protective list of prospective buyers
key: D
explanation: Minnesota Statutes § 82.55 Subd. 16 defines a protective list as the written list of
  names and addresses of prospective buyers with whom a licensee has negotiated the sale or rental
  of the property or to whom a licensee has exhibited the property before the expiration of the
  listing agreement. The other choices refer to trust accounts, override clauses, and electronic
  records, which are distinct concepts not defined by this statute.
