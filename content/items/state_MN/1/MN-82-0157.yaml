stem: A Minnesota licensee submits a trust account reconciliation report to the commissioner that
  contains a material misstatement of the funds held. Under Minn. Stat. § 82.86, Subd. 16, how is
  this conduct classified?
options:
  - A petty misdemeanor
  - A felony
  - A civil infraction
  - A gross misdemeanor
key: D
explanation: Section 82.86, Subd. 16 explicitly states that knowingly filing any notice, statement,
  or other document required under the section that contains a material misstatement of fact
  constitutes a gross misdemeanor. The scenario describes a material misstatement in a required
  document, fitting this classification.
