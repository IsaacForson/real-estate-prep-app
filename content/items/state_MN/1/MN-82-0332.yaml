stem: Under Minn. Stat. § 82.70 Subd. 5, who is considered a “sole owner” of the entity to which a
  broker may direct compensation?
options:
  - The licensed broker or salesperson and their attorney-in-fact.
  - The licensed broker or salesperson and the broker’s spouse.
  - The licensed broker or salesperson and a salaried employee.
  - The licensed broker or salesperson and a corporate co-owner.
key: B
explanation: The statute defines “sole owner” as the licensed real estate broker or salesperson and
  may include the broker’s or salesperson’s spouse. The other choices are not mentioned in the
  definition.
