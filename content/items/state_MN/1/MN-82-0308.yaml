stem: Under Minn. Stat. § 82.63, Subd. 6, how many days does a broker have to notify the
  commissioner after a salesperson terminates activity on behalf of the broker?
options:
  - Five days
  - Seven days
  - Ten days
  - Fifteen days
key: C
explanation: The statute requires the broker to notify the commissioner within ten days of the
  salesperson's termination. Therefore, ten days is the correct timeframe. Five days is insufficient
  because the rule specifies a ten‑day period, not a shorter one.
