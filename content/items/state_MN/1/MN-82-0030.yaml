stem: "Under Minn. Stat. § 82.60 Subd. 5, the required course for real estate brokers must consist of:"
options:
  - Course I, Course II, and Course III together.
  - The subject hours in paragraphs (a) through (j).
  - A 30‑hour course chosen from Course III.
  - The trust account requirements module only.
key: B
explanation: Minnesota Statutes § 82.60, subdivision 5 requires that the broker pre‑licensing course
  include the subject hours listed in paragraphs (a) through (j). The choice describing Course I,
  Course II, and Course III together reflects the salesperson pre‑license requirement, not the
  broker requirement. Selecting a 30‑hour course from Course III provides only a portion of the
  required hours, and the trust‑account module alone also covers only part of the mandated
  curriculum.
