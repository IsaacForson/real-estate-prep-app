stem: A Minnesota salesperson applicant has completed the 30-hour Course I. Before filing a license
  application, what additional coursework must this applicant complete?
options:
  - A 45-hour course including five hours of trust account training
  - A 30-hour broker course including three hours of fair housing training
  - A 15-hour course including one hour of ethics training
  - A 60-hour course covering fair housing and agency disclosure topics
key: D
explanation: The statute requires an additional 60-hour course before filing a license application,
  including three hours of fair housing training and two hours of agency representation and
  disclosure training.
citation:
  source: Minn. Stat. § 82.59
  url: null
  quoted_text: An applicant for a salesperson's license shall be required to successfully complete an
    additional course of study in the real estate field consisting of 60 hours of instruction
    approved by the commissioner, of which three hours shall consist of training in state and
    federal fair housing laws, regulations, and rules, and of which two hours must consist of
    training in laws and regulations on agency representation and disclosure, before filing an
    application for the license.
