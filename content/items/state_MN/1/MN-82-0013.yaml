stem: A salesperson collects a fee from a borrower before a loan closes, intended in part as payment
  for finding the loan. How does Minnesota law classify this fee?
options:
  - A pass-through fee, because it merely reimburses a third-party cost
  - A trust deposit, because it is held pending the loan's consummation
  - A commitment fee, because it locks in an interest rate for the borrower
  - An advance fee, since the charge precedes the loan's closing
key: D
explanation: The statute defines an advance fee as a fee paid before the closing of a loan that is
  intended in whole or in part as payment for finding or attempting to find a loan for a borrower.
citation:
  source: Minn. Stat. § 82.55
  url: null
  quoted_text: an "advance fee" means a commission, fee, charge, or compensation of any kind paid
    before the closing of a loan, that is intended in whole or in part as payment for finding or
    attempting to find a loan for a borrower.
