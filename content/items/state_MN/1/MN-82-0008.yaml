stem: A salesperson passes the broker's examination but then stops working as a licensee for an
  extended stretch before applying for the broker's license. How does this affect the application
  deadline?
options:
  - The one-year window is extended automatically for every salesperson
  - There is no deadline once the examination has been passed
  - The window does not apply if the salesperson stays active
  - The salesperson has to reapply for the exam within thirty days
key: C
explanation: The statute gives an applicant one year from the exam date to apply for a broker's
  license unless the person remained continuously active in the real estate field as a licensee.
citation:
  source: Minn. Stat. § 82.58, subd. 3
  url: null
  quoted_text: After successful completion of the real estate broker's examination, an individual
    shall have one year from the date of the examination to apply for a broker's license, unless the
    individual is a salesperson who remains continuously active in the real estate field as a
    licensee.
