stem: Which requirement applies to a trust account maintained by a Minnesota real estate licensee?
options:
  - It must be closed and reopened at the start of each license period
  - It must bear interest at the highest current passbook savings rate
  - It must be co-signed by the commissioner before funds are deposited
  - It must hold funds only from a single client at any given time
key: B
explanation: The statute requires a trust account to be an interest-bearing account paying the
  highest current passbook savings account rate of interest available.
citation:
  source: Minn. Stat. § 82.55
  url: null
  quoted_text: A trust account must be an interest-bearing account paying the highest current passbook
    savings account rate of interest and must not allow the financial institution a right of set off
    against money owed it by the licensee.
