stem: A facilitator broker, while working with a buyer, shows a property that the facilitator
  themselves listed. According to Minn. Stat. § 82.67 Subd. 3, what must the facilitator do?
options:
  - Disclose all material facts to the buyer promptly
  - Obtain written consent for dual agency from both parties
  - Act as the seller's broker in the transaction
  - Continue to act as a facilitator for the buyer
key: C
explanation: The statute states that when a facilitator shows a property listed by themselves, they
  must act as a seller's broker. Continuing as facilitator or seeking dual agency consent would be
  incorrect.
citation:
  source: Minn. Stat. ch. 82 § 82.67 Subd. 3
  url: null
  quoted_text: In the event a facilitator broker or salesperson, working with a Buyer, shows a
    property listed by the facilitator broker or salesperson, then the facilitator broker or
    salesperson must act as a Seller's Broker.
