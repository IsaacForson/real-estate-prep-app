stem: A salesperson terminates their activity with Broker A on March 1. Broker A does not notify the
  commissioner of the termination until March 15. The salesperson does not apply to transfer the
  license to another broker before the license expires on June 30. Under Minn. Stat. § 82.63, Subd.
  6, what must the salesperson do to regain active licensing status?
options:
  - Obtain a temporary broker's permit from the commissioner
  - Complete eight hours of approved instruction
  - Submit a request for withdrawal of the license
  - File an application for a new license to practice
key: D
explanation: Subd. 6 states that if an application for transfer is not made within the license
  period, the commissioner shall require that an application for a new license be filed. Since the
  salesperson missed the transfer deadline, they must apply for a new license. The other options
  describe actions that are not required or applicable under this subdivision.
