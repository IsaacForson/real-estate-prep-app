stem: Under Minn. Stat. § 82.55, subd. 1a, an automated valuation model is best described as which
  of the following?
options:
  - A computerized model valuing mortgaged dwelling collateral
  - A written appraisal signed by a licensed real estate broker
  - A visual inspection report completed by a closing agent
  - A printed comparable sales list mailed to a mortgage lender
key: A
explanation: The statute defines an automated valuation model as a computerized model used by
  mortgage originators and secondary market issuers to determine the collateral worth of a mortgaged
  dwelling.
