stem: If the commissioner determines that the real estate education, research and recovery fund is
  insufficient, what is the maximum additional amount a licensee may be required to pay when
  renewing a license?
options:
  - An additional fee of $20.
  - An additional fee of $50.
  - An additional fee of $100.
  - An additional fee of $150.
key: C
explanation: Subdivision 4 of § 82.86 allows the commissioner to impose an assessment not to exceed
  $100 when the fund is insufficient. The $20 amount is the standard renewal fund fee, not the
  assessment.
