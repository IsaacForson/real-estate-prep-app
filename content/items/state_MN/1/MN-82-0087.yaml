stem: A licensee receives a purchase agreement via email and saves it on their computer. Under
  Minnesota law, this saved email is considered what?
options:
  - The electronic record
  - The electronic agent
  - The electronic signature
  - The printed document
key: A
explanation: Under Minn. Stat. § 82.55, subd. 8, an electronic record is a record created,
  generated, sent, communicated, received, or stored by electronic means. An email saved on a
  computer meets this definition. The electronic agent is a computer program that initiates actions
  without human review, not a record.
