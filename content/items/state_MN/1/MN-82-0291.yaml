stem: A broker fails to adequately supervise its salespersons, and a client suffers financial loss
  due to a salesperson's misrepresentation. Under Minn. Stat. § 82.82, Subdivision 1(d), what action
  may the commissioner take?
options:
  - Issue a written warning only, without further penalty
  - Deny, suspend, or revoke the license, or censure the broker
  - Impose a monetary fine and require continuing education
  - Refer the case to the county attorney for further investigation
key: B
explanation: When a broker fails to reasonably supervise brokers, salespersons, or closing agents
  and that failure causes injury or harm to the public, the commissioner is authorized to deny,
  suspend, or revoke the broker’s license, or to issue a censure. Lesser actions such as a simple
  warning are not permitted under this subdivision of Minn. Stat. § 82.82, Subd. 1(d).
