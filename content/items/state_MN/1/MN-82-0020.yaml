stem: A salesperson passes the real estate broker's examination but does not remain continuously
  active as a licensee. How long does Minnesota law give this person to apply for a broker's license
  before reexamination is required?
options:
  - Two years from the date of the examination
  - Six months from the date of the examination
  - One year from the date of the examination
  - Ninety days from the date of the examination
key: C
explanation: The statute gives an individual one year from the date of the broker's examination to
  apply for a broker's license, unless the individual remains continuously active as a licensee.
citation:
  source: Minn. Stat. § 82.58
  url: null
  quoted_text: After successful completion of the real estate broker's examination, an individual
    shall have one year from the date of the examination to apply for a broker's license, unless the
    individual is a salesperson who remains continuously active in the real estate field as a
    licensee.
