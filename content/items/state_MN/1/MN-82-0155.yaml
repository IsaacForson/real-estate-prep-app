stem: Under Minn. Stat. § 82.86, Subd. 17, what legal right does the commissioner acquire after
  paying a judgment creditor from the recovery portion of the fund?
options:
  - The right to garnish the personal assets of the licensee for the amount paid
  - The right to subrogation to the rights of the judgment creditor
  - The right to suspend the license of the judgment creditor for the amount paid
  - The right to impose a civil penalty on the claimant for the amount paid
key: B
explanation: Section 82.86, Subd. 17 states that when the commissioner pays a sum to a judgment
  creditor from the recovery portion of the fund, the commissioner shall be subrogated to all of the
  rights of the judgment creditor to the extent of the amount paid. The other options describe
  enforcement mechanisms not provided for in this specific subsection.
