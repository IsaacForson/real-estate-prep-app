stem: A business entity brokerage has a responsible person who holds only a salesperson's license
  rather than a broker's license. What authority can this person exercise over the brokerage's
  operations?
options:
  - Supervisory authority over the broker but no trust account authority
  - Both trust account authority and supervisory authority over the broker
  - Signing authority over the trust account but no supervisory role
  - Neither trust account nor supervisory authority over the broker
key: D
explanation: A responsible person who holds only a salesperson's license may not exercise authority
  over any trust account the broker administers and may not be given supervisory authority over the
  broker.
citation:
  source: Minn. Stat. § 82.58, subd. 4
  url: null
  quoted_text: No responsible person who maintains a salesperson's license may exercise any authority
    over any trust account administered by the broker nor may they be vested with any supervisory
    authority over the broker.
