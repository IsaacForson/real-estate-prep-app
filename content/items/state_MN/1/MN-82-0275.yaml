stem: Under Minn. Stat. § 82.86, Subd. 6, which of the following is an authorized use of the real
  estate education, research and recovery fund?
options:
  - Promote the advancement of education and research in the field of real estate
  - Pay attorney's fees incurred in defending actions against the fund
  - Provide low-interest loans to licensed brokers for business expansion
  - Fund political campaigns supporting real estate legislation
key: A
explanation: The statute expressly authorizes the commissioner to use fund money to promote the
  advancement of education and research in the field of real estate for the benefit of licensees.
  Paying attorney's fees is excluded from authorized expenditures, and providing loans or funding
  political campaigns are not listed as permissible uses.
