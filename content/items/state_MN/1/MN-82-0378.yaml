stem: Under Minn. Stat. § 82.81, Subd. 1, what is required for a person to act as a real estate
  broker or salesperson in Minnesota?
options:
  - The person must complete 30 hours of continuing education annually.
  - The person must be a resident of Minnesota.
  - The person must be employed by a licensed brokerage.
  - The person must hold a valid real estate license.
key: D
explanation: Subd. 1 explicitly states that no person may act as a broker or salesperson without
  being licensed as provided in the chapter. Holding a license is therefore mandatory; mere
  employment by a brokerage does not satisfy the requirement.
