stem: A facilitator broker is working with a seller and arranges a showing of the property to a
  buyer who is also represented by the facilitator. According to Minn. Stat. § 82.67 Subd. 3
  paragraph IV, what must the facilitator do?
options:
  - Stay, no fiduciary duty
  - Consent for dual agency
  - Act as a seller's broker
  - Act as a buyer's broker
key: D
explanation: When a facilitator broker working with a seller arranges a showing to a buyer who is
  also represented by the facilitator, the facilitator must act as the buyer's broker under Minn.
  Stat. § 82.67 Subd. 3 paragraph IV. Acting as a seller's broker in this situation would be
  incorrect because the facilitator's duty shifts to represent the buyer once the buyer is
  represented by the same facilitator.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.67 Subd. 3
  url: null
  quoted_text: In the event a facilitator broker or salesperson, working with a Seller, accepts a
    showing of the property by a Buyer being represented by the facilitator broker or salesperson,
    then the facilitator broker or salesperson must act as a Buyer's Broker (see paragraph III
    above).
