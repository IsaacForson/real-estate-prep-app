stem: A broker fails to adequately supervise salespersons, resulting in a client losing money due to
  misrepresentation. What action may the commissioner take under Minn. Stat. § 82.82, Subdivision
  1(d)?
options:
  - The commissioner may issue a written warning and require remedial action.
  - The commissioner may deny, suspend, or revoke the broker's license, or censure the broker.
  - The commissioner may impose a fine of five hundred dollars.
  - The commissioner may require the broker to complete additional continuing education.
key: B
explanation: Failure to reasonably supervise brokers, salespersons, or closing agents so as to cause
  injury or harm to the public is grounds for denial, suspension, revocation, or censure. Therefore,
  the commissioner may take any of those disciplinary actions. The distractor proposing a specific
  $500 fine is not supported by the statute, which does not set a fine amount for this violation.
