stem: A licensee represents both the buyer and seller in a residential transaction without informing
  either party of the conflict of interest. Under Minn. Stat. § 82.82, Subdivision 1(g), what may
  the commissioner do?
options:
  - Refer the case to the county attorney for further investigation
  - Deny, suspend, or revoke the license, or censure the licensee
  - Impose a monetary fine and require continuing education
  - Issue a written warning and require remedial education
key: B
explanation: The statute authorizes the commissioner to deny, suspend, or revoke a license, or
  censure the licensee when the licensee acts on behalf of a party while having an undisclosed
  conflict of interest. Issuing a warning with education is not a sanction specified in this
  subdivision for that violation.
