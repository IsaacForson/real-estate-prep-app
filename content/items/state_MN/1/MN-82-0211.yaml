stem: Under Minnesota law, what is a buyer's broker?
options:
  - A licensee who represents a buyer under a signed buyer's broker agreement and owes fiduciary
    duties to the buyer
  - A licensee who represents a seller under a signed seller's broker agreement and owes fiduciary
    duties to the seller
  - A licensee who provides closing services incident to the sale, trade, lease, or loan of
    residential real estate
  - A licensee who negotiates or offers to negotiate a loan secured by a mortgage on real estate for
    an advance fee
key: A
explanation: Under Minn. Stat. § 82.55 Subd. 3a, a buyer's broker is a licensee who represents a
  buyer under a signed buyer's broker agreement and owes fiduciary duties to the buyer. The option
  describing a licensee who represents a seller under a signed seller's broker agreement and owes
  fiduciary duties to the seller defines a seller's broker, which is a separate term.
