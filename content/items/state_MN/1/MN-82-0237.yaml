stem: A licensee acts as principal in four real estate transactions in the past 12 months and is not
  represented by a broker. Under Minn. Stat. § 82.55, Subd. 19(g), is the licensee presumed to be
  engaged in the business of selling real estate?
options:
  - No, because the licensee must have a broker to be presumed engaged.
  - No, because fewer than five transactions were completed.
  - Yes, because any transaction triggers the presumption.
  - Yes, because the licensee acted as principal in each transaction.
key: B
explanation: The presumption applies only when the licensee completes five or more transactions as
  principal in a 12‑month period; with four transactions the threshold is not met, so no presumption
  arises. The statement that any transaction triggers the presumption is incorrect, as it
  contradicts the five‑transaction requirement.
