stem: A broker has made full disclosure to both parties about dual agency but has not obtained their
  written consent. May the broker proceed as a dual agent in a residential transaction under Minn.
  Stat. § 82.67 Subd. 4?
options:
  - The broker may proceed because disclosure alone is sufficient
  - The broker may not proceed without written consent of both parties
  - The broker may proceed if the broker believes the parties will not object
  - The broker may proceed with only the seller’s consent
key: B
explanation: The statute requires the broker to obtain the consent of all parties after making full
  disclosure; proceeding without consent is not permitted. The other options misstate the consent
  requirement.
