stem: A broker authorizes an unlicensed assistant to show listed properties and present purchase
  offers to potential buyers. Under Minn. Stat. § 82.81, Subd. 4, is this permissible?
options:
  - Under Minnesota law, the broker's action is considered permissible if the assistant receives no
    compensation and does not negotiate offers
  - Under Minnesota law, the broker's action is considered not permissible because only a licensed
    person may act as broker or salesperson
  - Under Minnesota law, the broker's action is considered permissible because the assistant is
    supervised without the buyer's consent
  - Under Minnesota law, the broker's action is considered not permissible unless the assistant
    obtains a temporary permit
key: B
explanation: Subdivision 4 forbids a broker from engaging or authorizing any unlicensed person to
  act as a broker, salesperson, or closing agent on the broker's behalf. Authorization of an
  unlicensed assistant is therefore impermissible regardless of supervision or compensation. The
  option claiming permissibility due to supervision is incorrect because the statute does not allow
  such an exception.
citation:
