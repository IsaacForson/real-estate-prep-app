stem: A broker asks an unlicensed assistant to show properties to prospective buyers and negotiate
  offers. Is this permissible under Minn. Stat. § 82.81, Subd. 4?
options:
  - The broker's action is permissible because the assistant is supervised.
  - The broker's action is permissible if the assistant obtains a temporary permit.
  - The broker's action is permissible because the assistant is not compensated.
  - The broker's action is prohibited because the assistant is unlicensed.
key: D
explanation: Subd. 4 forbids a broker from engaging or authorizing any unlicensed person to act as a
  broker, salesperson, or closing agent on the broker's behalf. Supervision or lack of compensation
  does not override this prohibition.
