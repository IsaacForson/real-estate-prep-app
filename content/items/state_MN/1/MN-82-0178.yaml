  url: null
  quoted_text: A licensed real estate broker or salesperson may assign or direct that commissions or
    other compensation earned in connection with a real estate or business opportunity transaction
    be paid to a corporation, limited liability company, or sole proprietorship of which the
    licensed real estate broker or salesperson is the sole owner.
