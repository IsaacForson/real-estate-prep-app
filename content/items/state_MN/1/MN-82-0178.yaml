stem: A Minnesota real estate salesperson who is the sole owner of a limited liability company
  wishes to have the commission from a residential sale paid directly to the LLC. Under Minn. Stat.
  § 82.70 Subd. 5, is this permissible?
options:
  - No, because commissions must be paid to the individual licensee.
  - Yes, provided the salesperson is the sole owner of the LLC.
  - Yes, but only if the broker authorizes the payment in writing.
  - No, unless the LLC is also licensed as a real estate broker.
key: B
explanation: Subd. 5 allows a licensee to direct commissions to a corporation, LLC, or sole
  proprietorship of which they are the sole owner; no broker authorization is required. The
  statement that broker authorization is needed is not required by the statute.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
