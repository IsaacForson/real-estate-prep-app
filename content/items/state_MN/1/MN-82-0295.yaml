stem: Following the death of a broker, a salesperson with two years of experience as a licensed real
  estate salesperson applies for a 45‑day temporary broker’s permit. Under Minn. Stat. § 82.63,
  Subd. 12, is the salesperson eligible for the permit?
options:
  - The salesperson is eligible because they have at least two years of experience as a licensed
    salesperson.
  - The salesperson is eligible because they have made a good faith effort to obtain a broker's
    license.
  - The salesperson is not eligible because they lack three years of experience as a licensed
    salesperson.
  - The salesperson is eligible because the commissioner may issue a permit upon death of a broker.
key: C
explanation: The statute requires a minimum of three years actual experience as a licensed real
  estate salesperson for a temporary broker's permit. The salesperson has only two years of
  experience, so they do not meet this requirement. The distractor citing two years of experience is
  incorrect because the threshold is three years, not two.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.63, Subd. 12
  url: null
  quoted_text: In the event of death, incapacity, or loss of license of a broker, the commissioner may
    issue a 45-day temporary permit to an individual who has had a minimum of three years actual
    experience as a licensed real estate salesperson and who is otherwise reasonably qualified to
    act as a broker.
