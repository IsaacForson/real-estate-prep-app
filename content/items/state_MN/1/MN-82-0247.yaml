stem: A licensee represents the seller in a sale of real estate and wishes to arrange for the sale
  of the existing mortgage on the property to a third party, receiving no additional compensation
  beyond the brokerage commission. Under Minn. Stat. § 82.81, Subd. 7, is this permissible?
options:
  - The action is permissible because the licensee represents the seller and receives no additional
    compensation.
  - The action is not permissible because the licensee receives additional compensation from the
    third party.
  - The action is not permissible because the licensee represents the buyer, not the seller.
  - The action is not permissible because the licensee is arranging the sale of a mortgage, which is
    prohibited.
key: A
explanation: Subd. 7 permits a licensee to arrange the sale of a mortgage or similar evidence of
  indebtedness when there is no extra compensation and the licensee represents a party to the real
  estate transaction. Here the licensee represents the seller and receives no additional
  compensation, so the action is allowed. The other options either misstate the prohibition or add
  conditions not present in the statute.
citation:
