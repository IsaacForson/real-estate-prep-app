stem: A licensee owes $600 in delinquent taxes to the state, has no payment agreement, and requests
  a license renewal. What action must the commissioner take regarding the licensee's license
  application under Minn. Stat. § 82.82 Subdivision 9(a)?
options:
  - To issue the license
  - To deny the license
  - To renew the license
  - To suspend the license
key: B
explanation: Under Minn. Stat. § 82.82 Subdivision 9(a), the commissioner may not issue or renew a
  license if the licensee owes $500 or more in delinquent taxes. Since the licensee owes $600 and
  has no payment agreement, the commissioner must deny the license application. Renewing the license
  would violate this prohibition.
