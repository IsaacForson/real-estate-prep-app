math:
  worked_solution: >-
    1) Identify the statutory threshold for delinquent taxes: $500.

    2) Note the licensee's delinquent tax amount: $600.

    3) Compare the amount owed to the threshold: $600 ≥ $500, so the condition is satisfied.

    4) Because the condition is met, the commissioner may not issue or renew the license; the
    required action is to deny the license.
