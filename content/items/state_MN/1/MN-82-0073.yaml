stem: A broker terminates a real estate transaction on June 1. The purchase agreement is silent on
  disbursement timing. The broker disburses the trust funds eleven business days after termination.
  Is the broker compliant with Minnesota law?
options:
  - No, because the broker should have disbursed the funds within five business days.
  - Yes, because the broker disbursed the funds on the eleventh day, which is permissible under the
    statute.
  - No, because the disbursement occurred after the tenth business day following termination.
  - Yes, because the disbursement occurred within ten business days of termination.
key: C
explanation: Subdivision 5(d) requires disbursement within ten business days following termination
  when the agreement is silent. Disbursing on the eleventh business day exceeds this limit, making
  the broker noncompliant. The other options misstate the timeframe or incorrectly allow the
  eleventh day.
citation:
