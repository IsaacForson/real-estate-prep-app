stem: A broker receives a stock certificate as earnest money and intends to act as the escrow agent.
  What must the broker obtain before holding the stock certificate in escrow?
options:
  - Deposit of the stock certificate with an authorized escrow agent
  - Written authority from the buyer and seller to hold the item in escrow
  - A receipt issued to the buyer for the value of the stock certificate
  - A record of the item in the broker's trust account records
key: B
explanation: Subd. 3 states that if the broker acts as the escrow agent, the broker must obtain
  written authority from the buyer and seller to hold such items in escrow. While issuing a receipt
  and keeping records are also required, the specific prerequisite for acting as escrow agent is
  obtaining that written authority. Simply depositing with another escrow agent contradicts the
  broker’s role as the escrow agent.
