stem: A broker’s protective list includes a person who only received a mailed flyer about the
  property. According to Minn. Stat. § 82.66 Subd.1(e), does this satisfy the broker’s burden of
  demonstrating an affirmative showing of interest?
options:
  - The broker’s burden is satisfied because any communication counts
  - The broker’s burden is not satisfied because mere mailing is insufficient
  - The broker’s burden is satisfied if the flyer includes a phone number
  - The broker’s burden is not satisfied unless the person visited the property
key: B
explanation: The correct answer is that the broker’s burden is not satisfied because mere mailing of
  literature does not constitute an affirmative showing of interest under Minn. Stat. § 82.66
  Subd.1(e). The statute requires the broker to show that the person responded to an advertisement,
  contacted the broker, or was physically shown the property. The distractor suggesting that
  including a phone number on the flyer satisfies the requirement is wrong because the mailing
  itself still lacks the requisite affirmative action.
citation:
