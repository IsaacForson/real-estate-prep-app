stem: Under Minn. Stat. § 82.82, Subdivision 2, what is the effect on a real estate salesperson's
  license when the broker's license under which they are acting is suspended?
options:
  - The salesperson's license may still be used to earn commissions.
  - The salesperson's license is automatically revoked.
  - The salesperson's license remains fully effective.
  - The salesperson's license is not effective during the suspension period.
key: D
explanation: The rule explicitly states that a salesperson's license is not effective during any
  period for which the broker's license is suspended or revoked. Therefore, the salesperson cannot
  act while the broker's license is suspended. The distractor claiming the license remains effective
  contradicts the statutory language.
citation:
  source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons) — Minnesota Statutes Chapter 82 —
    Real Estate Brokers and Salespersons (full chapter) — § 82.82 Subdivision 2.
  url: null
  quoted_text: The license of a salesperson is not effective during any period for which the license
    of the broker on whose behalf the salesperson is acting is suspended or revoked.
