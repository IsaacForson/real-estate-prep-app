stem: A seller delivers a quitclaim deed to a buyer while the seller's tenant remains in possession
  of the land, claiming title by adverse possession. Is the conveyance void under Wis. Stat. §
  706.10(2)?
options:
  - Under Wis. Stat. § 706.10(2), yes, because adverse possession voids any conveyance
  - Under Wis. Stat. § 706.10(2), no, the conveyance is not void merely because the land is in
    adverse possession at delivery
  - Under Wis. Stat. § 706.10(2), yes, unless the buyer obtains a court order ejecting the possessor
  - Under Wis. Stat. § 706.10(2), no, but the buyer must first record the deed to protect against
    the claim
key: B
explanation: Under Wis. Stat. § 706.10(2), a conveyance is not void simply because the land is in
  adverse possession of another at the time of delivery. The option stating that the conveyance is
  not void merely because the land is in adverse possession at delivery correctly reflects this
  rule. The option claiming that adverse possession automatically voids the conveyance is incorrect
  because the statute expressly denies that adverse possession alone voids a conveyance.
