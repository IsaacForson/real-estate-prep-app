stem: A developer agrees to build a detached garage for a buyer’s use as part of the sale, and the
  deed does not specify any contrary provision. Under Wis. Stat. § 706.10(7), what implied covenant
  arises from this agreement?
options:
  - An implied covenant that the improvement will be completed within six months of conveyance.
  - An implied covenant that the improvement will match the architectural style of existing
    structures.
  - An implied covenant that the improvement will be free of any liens or encumbrances.
  - An implied covenant that the improvement will be performed in a workmanlike manner and be
    reasonably adequate for the intended use.
key: D
explanation: Subsection (7) implies a covenant that improvements will be performed in a workmanlike
  manner and be reasonably adequate to equip the premises for the grantee’s specified use and
  occupancy. The distractor claiming a lien‑free improvement is not part of this implied covenant.
