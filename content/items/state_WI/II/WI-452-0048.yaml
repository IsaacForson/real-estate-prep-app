stem: A seller conveys land to a buyer using a warranty deed. According to Wis. Stat. § 706.10(5),
  which covenant is automatically included for the benefit of the buyer unless the deed provides
  otherwise?
options:
  - A covenant that the grantor will not subdivide the land without consent.
  - A covenant that the grantor will pay all property taxes on the land.
  - A covenant that the grantor is lawfully seized of the land.
  - A covenant that the grantor will maintain the land in good condition.
key: C
explanation: Subsection (5) provides that a warranty deed includes the covenant that the grantor is
  lawfully seized of the land and has good right to convey it. The distractor suggesting a duty to
  maintain the land is not a statutory covenant and therefore incorrect.
