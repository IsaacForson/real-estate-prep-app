stem: A licensee prepares a deed using a newly designed, concise format that includes all required
  statutory language but was not in common use in Wisconsin before July 1, 1971. Under Wis. Stat. §
  706.10(1), is the deed valid?
options:
  - Under Wis. Stat. § 706.10(1), the deed is valid because the statute permits other concise forms
    that conform to this chapter.
  - Under Wis. Stat. § 706.10(1), the deed is invalid because only forms in common use before July
    1, 1971 are authorized.
  - Under Wis. Stat. § 706.10(1), the deed is valid only if it replicates a form expressly
    authorized by law.
  - Under Wis. Stat. § 706.10(1), the deed is invalid unless the chapter expressly provides to the
    contrary and the form conforms to chapter requirements.
key: A
explanation: Subsection (1) expressly allows the adoption of other, different or more concise forms
  that conform to the chapter’s requirements, so a newly designed concise deed is valid. The
  distractor claiming only pre‑1971 forms are authorized ignores the statute’s permission for new
  forms that meet the chapter’s standards.
