stem: Under Wis. Stat. § 706.10(4), what is the legal effect of a quitclaim deed?
options:
  - A quitclaim deed that passes all interest the grantor could lawfully convey and warrants the
    title against all claims.
  - A quitclaim deed that passes only the surface rights and warrants freedom from any encumbrances.
  - A quitclaim deed that passes all interest the grantor could lawfully convey but does not warrant
    the existence, quantity, or quality of that interest.
  - A quitclaim deed that passes all interest the grantor could lawfully convey and includes
    covenants for quiet possession.
key: C
explanation: Subsection (4) states that a quitclaim deed passes all interest the grantor could
  lawfully convey but does not warrant or imply the existence, quantity, or quality of any such
  interest. The distractor that claims the deed warrants freedom from encumbrances incorrectly adds
  a warranty that the statute expressly excludes.
citation:
  source: Wis. Stat. ch. 706 — Wisconsin Statutes Chapter 706, official Wisconsin Legislature PDF read
