    from this network — § 706.10(4)
  url: null
  quoted_text: |-
    A quitclaim deed shall pass all of the interest in or appur-
    tenant to the land described which the grantor could lawfully
    convey, but shall not warrant or imply the existence, quantity or
    quality of any such interest
