stem: Under Wis. Stat. § 706.10(6), what is the general rule regarding implied warranties or
  covenants in a conveyance?
options:
  - Under Wis. Stat. § 706.10(6), a warranty or covenant is implied only for commercial transactions
  - Under Wis. Stat. § 706.10(6), no warranty or covenant shall be implied except as otherwise
    provided by law or in sub. (7)
  - Under Wis. Stat. § 706.10(6), a warranty or covenant may be implied only if the deed includes
    special warranties
  - Under Wis. Stat. § 706.10(6), a warranty or covenant is automatically implied in every conveyance
key: B
explanation: Wis. Stat. § 706.10(6) provides that no warranty or covenant is implied in a conveyance
  unless the law or subsection (7) specifically provides otherwise. Therefore, the correct answer is
  the statement that no warranty or covenant shall be implied except as otherwise provided by law or
  in sub. (7). The option claiming that a warranty is implied only for commercial transactions is
  incorrect because the statute makes no distinction based on the type of transaction; it bars
  implied warranties in all conveyances unless an exception applies. The option stating that a
  warranty may be implied only if the deed includes special warranties is incorrect because the
  statute says that even if a deed contains special warranties, no implied warranty arises unless
  the law or subsection (7) provides for it. The option asserting that a warranty is automatically
  implied in every conveyance is incorrect because the statute expressly rejects any automatic
  implication of warranties or covenants.
