stem: Under Wis. Stat. § 706.10(3), what is required to convey a fee simple interest in land?
options:
  - Court order approving the conveyance
  - Express statement of intent to convey a fee simple
  - No words of inheritance are necessary
  - Inclusion of the words 'heirs and assigns'
key: C
explanation: The statute states that words of inheritance are not necessary to create or convey a
  fee, so no such words are required. The distractor suggesting an express statement of intent is
  incorrect because while an express intent may be present, it is not required by the statute.
