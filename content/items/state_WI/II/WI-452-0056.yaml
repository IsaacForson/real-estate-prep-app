stem: A buyer receives a warranty deed for property that is subject to a recorded utility easement.
  The deed does not mention the easement. Under Wis. Stat. § 706.10(5), which covenant is **NOT**
  automatically included for the buyer's benefit because of the easement exception?
options:
  - The covenant that the grantor has good right to convey the land.
  - The covenant that the grantor will guarantee and defend the title.
  - The covenant that the land is free from any encumbrance whatsoever.
  - The covenant that the grantor is lawfully seized of the land.
key: C
explanation: Subsection (5) provides that a warranty deed includes covenants of seizure, right to
  convey, freedom from encumbrances, and defense of title, except where claims arise out of open and
  notorious rights of easement. Because the utility easement is such an easement, the covenant that
  the land is free from all encumbrance does not apply. The other covenants remain unaffected by the
  easement exception.
