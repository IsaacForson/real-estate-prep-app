stem: A seller delivers a warranty deed to a buyer that includes the clause 'This conveyance does
  not include any covenant against encumbrances.' Under Wis. Stat. § 706.10(5), what is the effect
  of this clause on the deed’s covenants?
options:
  - The covenant against encumbrances remains implied by law despite the clause
  - The deed conveys only a quitclaim interest because the covenant is omitted
  - The covenant against encumbrances is excluded because the deed expressly provides otherwise
  - The deed is invalid because it conflicts with statutory covenant requirements
key: C
explanation: The statute states that a warranted deed includes the statutory covenants except as the
  terms of the conveyance may otherwise provide, so an express exclusion removes that covenant. The
  distractor that the covenant remains implied is incorrect because the statute allows the deed’s
  terms to override the implied covenants.
