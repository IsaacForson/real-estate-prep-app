stem: "A licensee obtains a written radon test report from a state-certified radon measurement
  professional and provides a copy to the prospective buyer. Under Wis. Stat. § 452.23(2)(b), the
  licensee:"
options:
  - a duty to disclose the radon results to the buyer
  - a obligation to disclose the radon results to the buyer
  - a requirement to disclose the radon results to the buyer
  - a lack of obligation to disclose the radon results to the buyer
key: D
explanation: When a written report disclosing information has been prepared by a qualified 3rd party
  and provided to the person, the licensee is not required to disclose that information. The
  distractor describing a duty to disclose is incorrect because the rule explicitly removes that
  obligation.
