stem: "A licensee informs a prospective buyer that the neighborhood has many churches and would be
  ideal for someone seeking a faith‑based community. Under Wis. Stat. § 452.23(1), this action is:"
options:
  - a permitted action if the buyer asks about the neighborhood
  - a prohibited action because it may constitute unlawful discrimination
  - a allowed practice when disclosed in writing
  - a required disclosure under fair‑housing laws
key: B
explanation: The statute prohibits a licensee from disclosing information that constitutes unlawful
  discrimination, including statements that could be interpreted as steering based on religion. The
  distractor suggesting it is permitted if the buyer asks is incorrect because the prohibition
  applies regardless of the buyer’s request.
