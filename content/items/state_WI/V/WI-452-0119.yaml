stem: After hiring a qualified third‑party inspector and receiving a written report, what must a
  licensee do under REEB 24.07(5)?
options:
  - Withholding the report from all parties until closing
  - Submitting the report to the state board for approval
  - Delivering a copy of the report to all parties
  - Charging the buyer for the inspection report
key: C
explanation: The licensee may rely on third‑party results only if a written report is obtained and a
  copy is delivered to all parties in a timely manner. Keeping the report confidential violates the
  duty to share, submitting to the board is not required, and charging the seller for the fee is not
  mentioned.
