stem: A licensee receives a request from a prospective buyer asking whether a neighboring property’s
  owner is required to register as a sex offender. The licensee has actual knowledge that the owner
  is registered. To be immune from liability for disclosing this information, what must the licensee
  do?
options:
  - Provide written notice that includes the department of corrections telephone number and Internet
    site.
  - Provide oral notice that includes the department of corrections telephone number and Internet
    site.
  - Provide written notice that includes the actual registry information obtained from the
    department of corrections.
  - Provide written notice that omits the department of corrections telephone number and Internet
    site.
key: A
explanation: Under Wis. Stat. § 452.24(2), a licensee is immune from liability for disclosing sex
  offender registry information only if they timely provide written notice that includes the
  appropriate telephone number and Internet site of the department of corrections. The oral notice
  option fails because immunity requires written notice. Providing the actual registry information
  or omitting the contact details does not satisfy the statutory notice requirement.
