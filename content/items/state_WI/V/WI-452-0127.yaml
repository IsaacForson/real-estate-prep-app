stem: Under Wis. Stat. § 452.24(1), when does a licensee have a duty to disclose information about
  the sex offender registry to a person receiving brokerage services?
options:
  - When the licensee receives a request and possesses actual knowledge of the information
  - When the licensee receives a request, irrespective of any knowledge of the information
  - When the licensee believes the person may be required to register as a sex offender
  - When the licensee is providing brokerage services in any real estate transaction
key: A
explanation: The statute states that a licensee has a duty to disclose such information if the
  licensee has actual knowledge of the information. Without actual knowledge, no duty arises.
  Therefore, the correct condition is receipt of a request coupled with actual knowledge. The other
  options either ignore the knowledge requirement or add unsupported conditions.
