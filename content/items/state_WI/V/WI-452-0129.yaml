stem: A purchaser receives all required condominium disclosure documents on a Friday. Under Wis.
  Stat. § 703.33(4)(a), what is the latest day by which the purchaser may deliver a written
  rescission without stating any reason?
options:
  - By the close of business on the following Monday
  - By the close of business on the following Tuesday
  - By the close of business on the following Wednesday
  - By the close of business on the following Friday
key: D
explanation: The statute allows rescission within 5 business days after receipt of all required
  documents. Starting with Friday as day zero, the fifth business day is the following Friday.
  Therefore, the purchaser may rescind by the close of business on that Friday. Earlier days, such
  as Wednesday, fall short of the five‑day period.
citation:
  source: Wis. Stat. § 703.33(4)(a)
  url: null
  quoted_text: |-
    Any purchaser may at any time within 5 business days following
    receipt of all of the documents required under sub. (1) and within
    5 business days following receipt of any amendment required un-
    der sub. (3m), rescind in writing a contract of sale without stating
    any reason and without any liability on his or her part
