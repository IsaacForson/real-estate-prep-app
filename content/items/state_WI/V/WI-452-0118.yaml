stem: A licensee learns that the roof may have leaks, which suggests a possible material adverse
  fact. According to REEB 24.07(3), which action must the licensee take?
options:
  - Obtaining a third‑party inspection report
  - Waiting for the parties to request disclosure
  - Charging the buyer for expert assistance
  - Disclosing the information in writing
key: D
explanation: The rule requires the licensee to disclose information suggesting possible material
  adverse facts to the parties in writing and in a timely fashion. Obtaining a third‑party report is
  not required, waiting for a request violates the timely duty, and charging the buyer for expert
  assistance is not authorized.
