stem: A buyer purchases land, unaware that a prior owner had granted an easement to a neighbor via a
  private, unrecorded agreement that is not referenced in any recorded instrument. The easement
  agreement has existed for 12 years but never recorded. The buyer had no actual or constructive
  notice of the easement. Under Wis. Stat. § 706.09(1)(b), what is the effect of the easement claim
  on the buyer's title?
options:
  - The easement claim remains valid and may be enforced against the buyer.
  - The easement claim is barred only if the easement was recorded within the past 5 years.
  - The easement claim is barred only if the buyer had actual notice of the easement.
  - The easement claim is barred, and the buyer takes title free of the easement.
key: D
explanation: Under Wis. Stat. § 706.09(1)(b), a purchaser without notice takes title free of any
  adverse claim that depends on a conveyance outside the chain of title unless that conveyance is
  identified by definite reference in a recorded instrument. Because the easement was never recorded
  and not referenced in any recorded instrument, the buyer’s title is free of the easement claim.
  The claim that the easement remains valid and may be enforced against the buyer incorrectly
  asserts enforceability, overlooking the statutory protection for purchasers without notice.
