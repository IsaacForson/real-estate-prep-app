stem: A mortgage is executed to the United States and recorded on March 1. On March 10, a judgment
  lien is filed under ss. 292.31(8)(i). Which has priority under Wis. Stat. § 706.11(1)?
options:
  - The judgment lien under ss. 292.31(8)(i) has priority over the mortgage.
  - Both the mortgage and the judgment lien share equal priority.
  - Neither the mortgage nor the judgment lien affects priority.
  - The mortgage has priority over the judgment lien under ss. 292.31(8)(i).
key: A
explanation: Under Wis. Stat. § 706.11(1), a mortgage's priority is subject to certain exceptions,
  including liens filed under ss. 292.31(8)(i). Therefore, the judgment lien filed on March 10 takes
  precedence over the mortgage recorded on March 1. The option claiming that the mortgage retains
  priority despite this exception is incorrect.
