stem: A lender records a mortgage to a federal savings bank on January 1. On July 1 of the same
  year, the county files a tax lien for unpaid property taxes on the same property. Under Wis. Stat.
  § 706.11(1), which of the following statements is correct regarding priority?
options:
  - The mortgage has priority over the tax lien.
  - The tax lien has priority over the mortgage.
  - The priority is equal and payment is split pro rata.
  - The mortgage is invalid and carries no priority.
key: B
explanation: Under Wis. Stat. § 706.11(1), a duly recorded mortgage to a federal savings bank has
  priority over all liens except tax and special assessment liens filed after the mortgage’s
  recording. Because the county’s tax lien was filed after the mortgage was recorded, it falls
  within the exception and thus has priority over the mortgage. The distractor claiming the mortgage
  has priority ignores this statutory exception.
