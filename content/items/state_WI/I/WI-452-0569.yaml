stem: A married couple purchases a home in 1992. The Wisconsin Marital Property Act (ch. 766) does
  **NOT** apply to the property. The deed lists them as husband and wife with no other language.
  Under Wis. Stat. § 700.19(2), how do they hold title?
options:
  - As joint tenants with right of survivorship.
  - As tenants in common with equal shares each.
  - As tenants in common with unequal shares each.
  - As community property with right of survivorship.
key: A
explanation: Because ch. 766 does NOT apply, subsection (2) governs and makes the husband and wife
  joint tenants unless the deed expresses an intent to create a tenancy in common. No such intent is
  present, so they hold as joint tenants. The distractor suggesting a tenancy in common with equal
  shares mistakenly ignores the statutory default for married couples when subsection (2) applies.
