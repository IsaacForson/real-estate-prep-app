stem: Under Wis. Stat. § 706.09(4), how is the term 'chain of title' defined?
options:
  - The term “chain of title” means instruments, actions and proceedings discoverable by reasonable
    search of the public records and indexes affecting real estate in the offices of the register of
    deeds and in probate courts; a tract index shall be deemed an index where the same is publicly
    maintained.
  - The term “chain of title” means instruments, actions and proceedings discoverable by reasonable
    search of the public records and indexes affecting real estate in the offices of the register of
    deeds; a tract index shall be deemed an index where the same is publicly maintained.
  - The term “chain of title” means instruments, actions and proceedings discoverable by reasonable
    search of the public records and indexes affecting real estate in the offices of the register of
    deeds and in clerks of courts; a tract index shall be deemed an index where the same is publicly
    maintained.
  - The term “chain of title” means instruments, actions and proceedings discoverable by reasonable
    search of the public records and indexes affecting real estate in the offices of the register of
    deeds and in probate and of clerks of courts of the counties in which the real estate is
    located; a tract index shall be deemed an index where the same is publicly maintained.
key: D
explanation: Chain of title means instruments, actions and proceedings discoverable by reasonable
  search of the public records and indexes affecting real estate in the offices of the register of
  deeds and in probate and of clerks of courts of the counties where the real estate is located; a
  tract index shall be deemed an index where publicly maintained (Wis. Stat. § 706.09(4)). An option
  that limits the search to the register of deeds and probate courts omits clerks of courts, making
  it incomplete. An option that limits the search to the register of deeds and clerks of courts
  omits probate courts, making it incomplete. An option that limits the search to the register of
  deeds only omits both probate and clerks of courts, making it incomplete.
