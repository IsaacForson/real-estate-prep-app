stem: A will names two siblings as co‑personal representatives of the decedent’s estate, and the
  deed transferring the decedent’s house lists them as owners. Under Wis. Stat. § 700.19(4), how do
  they hold title?
options:
  - They hold title as joint tenants under Wisconsin law
  - They hold title as tenants in common with equal shares under Wisconsin law
  - They hold title as tenants in common unless otherwise agreed under Wisconsin law
  - They hold title as tenants in common if shares unequal under Wisconsin law
key: A
explanation: Under Wis. Stat. § 700.19(4), co‑personal representatives and cotrustees hold title as
  joint tenants regardless of any contrary intent. This rule overrides the default presumption of
  equal tenancy in common shares. Therefore, the siblings hold the property as joint tenants. The
  distractor suggesting equal tenancy in common shares ignores the specific statutory rule for
  co‑fiduciaries.
