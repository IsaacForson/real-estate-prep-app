stem: Under Wis. Stat. § 700.19(5), what common law requirements for creating a joint tenancy have
  been abolished in Wisconsin?
options:
  - Unity of title and time
  - Unity of title and interest
  - Unity of possession and time
  - Unity of possession and interest
key: A
explanation: The statute explicitly states that the common law requirements of unity of title and
  time for creation of a joint tenancy are abolished. The distractor ‘unity of title and interest’
  incorrectly substitutes interest for time, which is not mentioned as abolished.
