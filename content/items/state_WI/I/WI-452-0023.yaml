stem: A deed conveys property to “John and Jane, husband and wife” but also states they hold the
  property “as tenants in common.” Under Wis. Stat. § 700.19(2), what is the resulting ownership?
options:
  - They are joint tenants with right of survivorship.
  - They are tenants in common holding equal undivided interests.
  - They are joint tenants unless the deed states otherwise.
  - They are tenants in common only if a written agreement exists.
key: B
explanation: Under Wis. Stat. § 700.19(2), persons described as husband and wife are presumed joint
  tenants unless the deed expresses an intent to create a tenancy in common. The deed’s language “as
  tenants in common” expresses that intent, overriding the presumption. Consequently, they hold the
  property as tenants in common. In the absence of a specified share, § 700.20 presumes equal
  undivided interests, making the statement that they are tenants in common holding equal undivided
  interests correct.
