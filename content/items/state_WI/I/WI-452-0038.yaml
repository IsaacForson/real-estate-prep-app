stem: A lender records a signed certificate stating that a mortgage has been paid in full,
  authenticated under s. 706.06. Under Wis. Stat. § 706.05(8), what is the effect of this recorded
  certificate?
options:
  - The recorded certificate creates a new encumbrance on the property.
  - The recorded certificate is sufficient to satisfy the mortgage of record.
  - The recorded certificate must be accompanied by a release deed to be effective.
  - The recorded certificate satisfies the mortgage when the borrower signs an acknowledgment.
key: B
explanation: The statute provides that a duly recorded certificate of payment or satisfaction,
  properly authenticated, is sufficient to satisfy the mortgage or other interest of record. Thus
  the recorded certificate satisfies the mortgage without needing a release deed or borrower
  acknowledgment. The claim that a release deed is required is incorrect, as the statute does not
  mandate a release deed.
citation:
