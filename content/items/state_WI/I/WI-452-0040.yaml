stem: Under Wis. Stat. § 706.11(1), which of the following mortgages is granted priority over all
  liens except tax and special assessment liens filed after recording and liens under ss.
  292.31(8)(i) and 292.81?
options:
  - A mortgage executed to a private individual.
  - A mortgage executed to a federal savings and loan association.
  - A mortgage executed to a foreign government.
  - A mortgage executed to a real estate broker.
key: B
explanation: The statute provides that a mortgage executed to a federal savings and loan association
  (or a state or federal savings bank) is given priority over all liens except tax and
  special‑assessment liens filed after recording and the liens described in ss. 292.31(8)(i) and
  292.81. Because the entity named in that choice matches the statutory category, it receives the
  priority. Mortgages to a private individual, a foreign government, or a real‑estate broker are not
  listed in the statute, so they do not obtain that priority.
