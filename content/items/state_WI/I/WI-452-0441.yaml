stem: A deed from Alex to Alex and Bailey conveys property to Alex and Bailey as joint tenants, with
  Alex serving as both grantor and grantee. Under Wis. Stat. § 700.19(5), what is the effect of this
  conveyance?
options:
  - The deed creates a valid joint tenancy between Alex and Bailey.
  - The deed does not create a joint tenancy because a grantor cannot also be a grantee.
  - The deed creates a tenancy in common between Alex and Bailey.
  - The deed creates a joint tenancy only if Alex and Bailey are married.
key: A
explanation: The statute abolishes the common law rule that a grantor cannot also be a grantee in a
  deed creating a joint tenancy. Therefore, the deed creates a valid joint tenancy between Alex and
  Bailey. The distractor claiming no joint tenancy is created relies on the abolished common law
  requirement and is therefore incorrect.
