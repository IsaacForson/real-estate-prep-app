stem: Under Wis. Stat. § 706.05(6), which statement is true regarding the acceptance of an
  instrument for record?
options:
  - The instrument may be denied acceptance for record if it is missing a proper venue designation.
  - The instrument may be denied acceptance for record if it does not bear a seal on its face.
  - The instrument shall not be denied acceptance for record due to lack of venue, seals, witnesses
    or other form.
  - The instrument may be denied acceptance for record if it lacks the required number of witnesses.
key: C
explanation: Wis. Stat. § 706.05(6) provides that, except as expressly provided otherwise, an
  instrument cannot be refused recording because it is missing venue, a seal, witnesses, or any
  other matter of form. Consequently, any statement that allows denial of acceptance when a witness
  is absent, when a seal is not present, or when venue is omitted is contrary to the statute. The
  true statement reflects that the instrument shall not be denied acceptance for record due to those
  missing formalities.
