stem: Which of the following phrases, if included in a deed, constitutes an expression of intent to
  create a joint tenancy under Wis. Stat. § 700.19(1)?
options:
  - The phrase “as tenants in common”.
  - The phrase “in equal shares”.
  - The phrase “as joint tenants”.
  - The phrase “subject to a mortgage”.
key: C
explanation: Under Wis. Stat. § 700.19(1), a deed that includes the phrase “as joint tenants”
  expresses the intent to create a joint tenancy. The statute lists that phrase among those that
  constitute such an expression. Therefore, the presence of that language establishes a joint
  tenancy. The phrase “as tenants in common” indicates a tenancy in common, not a joint tenancy,
  making it incorrect.
