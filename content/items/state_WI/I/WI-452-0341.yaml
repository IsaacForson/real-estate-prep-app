stem: How may interests in property be owned concurrently?
options:
  - As joint tenants or as tenants in common
  - As joint tenants only with right of survivorship
  - As tenants in common only with right of survivorship
  - As sole ownership only with right of survivorship
key: A
explanation: Under Wis. Stat. § 700.17(1), interests in property may be owned concurrently as joint
  tenants or as tenants in common. The options that limit ownership to only one form (joint tenants
  only with right of survivorship, or tenants in common only with right of survivorship) are
  incorrect, and the option that introduces sole ownership with right of survivorship is incorrect
  because sole ownership is not a concurrent interest. Therefore, the option stating that interests
  may be owned concurrently as joint tenants or as tenants in common is correct.
citation:
