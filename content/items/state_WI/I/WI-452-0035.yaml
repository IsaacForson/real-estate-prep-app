stem: A married homeowner executes and records a warranty deed conveying his homestead to a buyer.
  The deed states that the grantor is 'single' and has been recorded for six years. The buyer had no
  actual or constructive notice of the spouse's homestead interest. Under Wis. Stat. § 706.09(1)(e),
  what is the effect of the spouse's homestead interest?
options:
  - The spouse's homestead interest is barred, and the buyer takes title free of that interest.
  - The spouse's homestead interest remains valid and may be enforced against the buyer.
  - The spouse's homestead interest is barred only if the buyer had actual notice of the interest.
  - The spouse's homestead interest is barred only if the conveyance was a quitclaim deed.
key: A
explanation: Under Wis. Stat. § 706.09(1)(e), a purchaser who takes a conveyance stating the
  transferor is single and that has been of record for five years takes title free of the spouse’s
  homestead interest, unless the interest is described as held in joint tenancy or marital property
  with the transferor. Since the deed states the grantor is single and has been recorded for six
  years, the buyer takes free of the homestead interest. The option stating that the spouse's
  homestead interest remains valid and may be enforced against the buyer incorrectly claims the
  interest remains valid, ignoring the statutory bar.
