stem: Under Wis. Stat. § 700.19(5), if a deed conveys property to two persons as joint tenants but
  one acquired the interest months before the other, what form of ownership do they hold?
options:
  - As joint tenants with right of survivorship
  - As tenants in common with right of survivorship
  - As tenants in common with equal shares
  - As tenants in common with unequal shares
key: A
explanation: The statute abolishes the common law requirement of unity of time, so a joint tenancy
  can be created even when the co‑owners acquire their interests at different times. Thus the deed’s
  language creates a joint tenancy with right of survivorship. The distractor asserting tenants in
  common with equal shares is incorrect because the abolished time rule does not default the
  ownership to a tenancy in common when joint tenancy language is present.
