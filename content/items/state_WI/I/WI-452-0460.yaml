stem: Under Wis. Stat. § 700.19(5), what is the effect of the abolition of the common law
  requirement that a grantor **cannot** also be a grantee in a deed creating a joint tenancy?
options:
  - The requirement still applies to domestic partners in Wisconsin
  - The deed is void when the grantor is also the grantee
  - A grantor must be a different person from the grantee in a joint tenancy deed
  - A grantor may also be a grantee in a deed creating a joint tenancy
key: D
explanation: Wis. Stat. § 700.19(5) provides that the common‑law rule barring a grantor from also
  being a grantee in a joint‑tenancy deed has been abolished, so a grantor may be a grantee in such
  a deed. The distractor stating a grantor must be a different person reflects the outdated
  common‑law rule and is therefore incorrect.
