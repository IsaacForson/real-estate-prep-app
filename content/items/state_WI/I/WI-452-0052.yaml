stem: A buyer purchases land. Twenty‑eight years before the purchase, a mortgage was recorded that
  merely states ‘Mortgage granted to Bank’ without specifying the property, amount, or date. The
  buyer had no actual or constructive notice of the mortgage. Under Wis. Stat. § 706.09(2)(b), does
  the buyer have notice of the mortgage?
options:
  - The buyer does not have notice because the recorded mortgage does not satisfy the definiteness
    requirement of sub. (1)(b).
  - The buyer does not have notice because the buyer lacked actual or constructive notice.
  - The buyer has notice because any recorded instrument within 30 years automatically constitutes
    notice.
  - The buyer has notice because the mortgage appears of record within 30 years prior to the
    purchase.
key: A
explanation: Under subsection (2)(b), notice of record within 30 years requires an instrument
  appearing of record within 30 years that also affords affirmative and express notice meeting the
  definiteness requirement of subsection (1)(b). The mortgage lacks definiteness, so the buyer does
  not have notice. The claim that the buyer has notice because the mortgage appears of record within
  30 years prior to the purchase incorrectly ignores the definiteness requirement.
