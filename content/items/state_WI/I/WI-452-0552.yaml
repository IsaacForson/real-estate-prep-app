stem: What are the two forms of concurrent ownership recognized under Wis. Stat. § 700.17(1)?
options:
  - Joint tenants as a form of ownership
  - Joint tenants and tenants in common
  - Sole ownership and tenancy in common
  - Tenants in common as a form of ownership
key: B
explanation: The statute explicitly states that interests in property may be owned concurrently by
  two or more persons as joint tenants or as tenants in common. Therefore the correct answer lists
  both joint tenancy and tenancy in common as the two recognized forms. An answer that mentions only
  one of these forms is incomplete, and an answer that includes sole ownership is not a concurrent
  ownership form.
