stem: Under Wis. Stat. § 700.19(2), if a married couple acquires property on or after January 1,
  1986 and ch. 766 applies to the property, does this subsection apply?
options:
  - Yes, the subsection applies and they are joint tenants unless intent to create tenancy in common
    is expressed
  - No, the subsection does not apply, so the general rules of joint tenancy creation govern
  - Yes, but only if the owners are domestic partners under chapter 770 of the Wisconsin Statutes
  - No, the subsection applies only to property acquired before January 1, 1986, regardless of ch.
    766 status
key: B
explanation: The subsection only applies to property acquired before January 1, 1986, or to property
  acquired on or after that date when ch. 766 does NOT apply; when ch. 766 applies, the subsection
  does not govern, so the general joint tenancy creation rules apply. The most tempting distractor
  is “Yes, the subsection applies and they are joint tenants unless intent to create tenancy in
  common is expressed,” which mistakenly assumes the subsection applies regardless of ch. 766
  status.
