stem: A licensee records a mortgage to a state bank on January 1. On February 15, a tax lien is
  filed against the property. Which has priority under Wis. Stat. § 706.11(1)?
options:
  - Both the mortgage and the tax lien share equal priority.
  - Neither the mortgage nor the tax lien affects priority.
  - The mortgage has priority over the tax lien.
  - The tax lien has priority over the mortgage.
key: D
explanation: Under Wis. Stat. § 706.11(1), a tax lien filed after a mortgage is recorded is excepted
  from the mortgage's priority, giving the tax lien priority over the earlier mortgage. The option
  stating that both the mortgage and the tax lien share equal priority is incorrect.
