stem: According to Wis. Stat. § 706.10(4), what is the effect of a quitclaim deed?
options:
  - It passes all of the interest the grantor could lawfully convey and warrants the quantity and
    quality of that interest.
  - It passes all of the interest the grantor could lawfully convey but does not warrant existence,
    quantity, or quality.
  - It passes only the interest explicitly described in the deed and warrants the title against all
    prior claims.
  - It passes all of the interest the grantor could lawfully convey and includes a covenant for
    further assurance.
key: B
explanation: Under Wis. Stat. § 706.10(4), a quitclaim deed transfers whatever interest the grantor
  can lawfully convey but does not warrant or imply the existence, quantity, or quality of that
  interest. Therefore, the correct answer is that the deed does not warrant existence, quantity, or
  quality. The option stating that the deed passes only the interest explicitly described and
  warrants the title against all prior claims is incorrect because it adds a warranty that the
  statute does not provide.
