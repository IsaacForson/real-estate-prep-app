stem: A seller executes a warranty deed that includes the standard covenants of seizure, right to
  convey, freedom from encumbrances, and quiet enjoyment. Under Wis. Stat. § 706.10(5), which of the
  following is true regarding those covenants?
options:
  - Under Wis. Stat. § 706.10(5), the covenants include a promise that the grantor will forever
    guarantee and defend the title and quiet possession against all lawful claims originating prior
    to the conveyance, except for claims arising from open and notorious easements or public
    building, zoning, or use restrictions.
  - Under Wis. Stat. § 706.10(5), the covenants include a promise that the grantor will forever
    guarantee and defend the title and quiet possession against all lawful claims, including those
    arising after the conveyance, and they also waive any duty to defend against prior claims.
  - Under Wis. Stat. § 706.10(5), the covenants are limited to the grantee only and do not extend to
    the grantee’s heirs, successors, or assigns, and they do not require the grantor to guarantee
    title against any prior claims.
  - Under Wis. Stat. § 706.10(5), the covenants require the grantor to warrant that the land is free
    from all encumbrances, but they do not include a covenant of seizure or a right to convey, and
    they omit any guarantee of title.
key: A
explanation: Subsection (5) provides that the warranty deed contains covenants for the benefit of
  the grantee, his or her heirs, successors, and assigns, including seizure, right to convey,
  freedom from encumbrance, and a promise to forever guarantee and defend title and quiet possession
  against lawful claims that arose before the conveyance, except for claims arising from open and
  notorious easements or public building, zoning, or use restrictions. The statement that the
  covenants are limited to the grantee only and do not extend to heirs, successors, or assigns is
  incorrect.
