stem: Under Wisconsin law, if a deed conveying property to two or more persons as tenants in common
  does **NOT** specify the size of each owner's interest, what is the presumed ownership share?
options:
  - Ownership shares determined by the order of names
  - Interests proportional to each owner's contribution
  - Equal undivided interests for each owner
  - Unequal shares unless the deed states otherwise
key: C
explanation: The statute states that when no intent is expressed in the deed, tenants in common are
  presumed to own equal undivided interests for the duration of the tenancy. Therefore, the correct
  answer is equal undivided interests for each owner. The distractor suggesting interests
  proportional to each owner's contribution is incorrect because the law does not look to
  contribution unless the parties expressly agree otherwise. The other distractors propose unequal
  shares or ownership based on name order, which the statute does not support absent expressed
  intent.
