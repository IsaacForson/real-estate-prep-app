stem: A lessor signs a mineral lease on March 1 and records it in the register of deeds office on
  April 15. Under Wis. Stat. § 706.08(1)(b), what is the effect of this conveyance?
options:
  - The conveyance remains valid and enforceable despite being recorded after the 30‑day period.
  - The conveyance is void because it was not recorded within 30 days after signing.
  - The conveyance is valid if the lessee had actual notice of the lease.
  - The conveyance is void if the land is situated in a county with a population exceeding 100,000.
key: B
explanation: The statute provides that a conveyance of mineral interests that is not recorded in the
  register of deeds within 30 days after the lessor signs it is void. Because the lease was signed
  on March 1 and recorded on April 15, 45 days elapsed, so the conveyance is void. A statement that
  the conveyance remains valid despite being recorded after the 30‑day period is incorrect because
  the statute does not allow validation after the deadline.
