stem: Under Wis. Stat. § 700.19(1), which of the following phrases included in a document of title
  constitutes an expression of intent to create a joint tenancy?
options:
  - With right of partition
  - As joint tenants
  - As tenants in common
  - As separate owners
key: B
explanation: Wis. Stat. § 700.19(1) explicitly lists "as joint tenants" as a phrase that constitutes
  an expression of intent to create a joint tenancy. The phrase "as tenants in common" creates a
  tenancy in common, not a joint tenancy. The other phrases are not listed in the statute as
  expressions of intent to create a joint tenancy.
citation:
  source: Wis. Stat. ch. 700 § 700.19(1)
  url: null
  quoted_text: "Any of the following constitute an expression of intent to create a joint tenancy: “as
    joint tenants”, “as joint owners”, “jointly”, “or the survivor”, “with right of survivorship”"
