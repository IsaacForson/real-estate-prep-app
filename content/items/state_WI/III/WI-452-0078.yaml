stem: A married homeowner in Wisconsin obtains a refinance mortgage on their homestead (not a
  purchase money loan). The homeowner signs the mortgage, but the spouse does not. Under Wis. Stat.
  § 706.02(1)(f), what is the effect on the mortgage?
options:
  - The mortgage is valid under the statute
  - The mortgage is unenforceable under the statute
  - The mortgage is void under the statute
  - The mortgage is voidable under the statute
key: C
explanation: For a conveyance that alienates a homestead interest, the statute requires the mortgage
  to be signed by or on behalf of each spouse, unless it is a purchase money mortgage. A refinance
  mortgage is not a purchase money mortgage, so the missing spouse signature renders the mortgage
  void. The distractor claiming the mortgage is valid incorrectly treats the refinance as exempt
  under the purchase money mortgage provision.
citation:
  source: Wis. Stat. § 706.02(1)(f)
