stem: A married buyer obtains a purchase money mortgage to finance the purchase of their Wisconsin
  homestead. The buyer signs the mortgage, but the spouse refuses to sign. Under Wis. Stat. §
  706.02(1)(f), what is the effect on the mortgage?
options:
  - The mortgage is void under the statute
  - The mortgage is voidable under the statute
  - The mortgage is valid under the statute
  - The mortgage is unenforceable under the statute
key: C
explanation: The statute expressly states that for a purchase money mortgage pledging a homestead as
  security, only the purchaser need sign the mortgage. Therefore, the mortgage remains valid and
  enforceable despite the non‑signing spouse. The distractor claiming the mortgage is void
  incorrectly applies the general homestead signature requirement, which is exempted for purchase
  money mortgages.
