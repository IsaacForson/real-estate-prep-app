stem: A parcel of land is currently idle but could be used for growing crops (capable of productive
  use). Under Wisconsin property tax law, is the land eligible for the 50-percent assessment
  reduction for nonproductive land?
options:
  - The land is eligible for the 50-percent assessment reduction because it is not currently
    producing.
  - The land is not eligible for the 50-percent assessment reduction because it is capable of
    productive use.
  - The land is eligible for the 50-percent assessment reduction because it is currently idle.
  - The land is not eligible for the 50-percent assessment reduction because it is classified as
    agricultural.
key: B
explanation: Under sub. (2)(c)4., land is nonproductive only when it is neither producing nor
  capable of productive use; therefore, land that remains capable of productive use does not qualify
  for the 50‑percent reduction under sub. (4). The distractor claiming eligibility because the land
  is not currently producing ignores the capability requirement.
