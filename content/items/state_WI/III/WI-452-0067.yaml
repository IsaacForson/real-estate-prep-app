stem: A taxpayer submits a written objection to her property assessment on a plain sheet of paper
  that is not the approved form. Under Wisconsin property tax law, what may the board of review do?
options:
  - Hold a hearing regardless of form
  - May deny the taxpayer a hearing
  - Accept objection and hold hearing
  - Refer objection to Department of Revenue
key: B
explanation: Under Wisconsin law, a board of review may deny a hearing if the taxpayer’s objection
  is not submitted on the approved form; the board is not required to accept the objection in
  another format. Therefore, the board may deny the hearing in this case.
