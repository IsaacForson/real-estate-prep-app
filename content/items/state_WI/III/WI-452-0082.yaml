stem: A Wisconsin licensee prepares a warranty deed to transfer a married couple's homestead to a
  buyer. The deed is signed only by the husband; the wife does not sign. Under Wis. Stat. §
  706.02(1)(f), what is the effect of the deed regarding the wife's homestead interest?
options:
  - The deed transfers the wife's interest because the husband signed for both spouses
  - The deed is void entirely because both spouses must sign the deed to be valid
  - The deed does not transfer the wife's interest; her interest remains unaffected
  - The deed transfers the wife's interest only if the buyer records it within one year
key: C
explanation: Under Wis. Stat. § 706.02(1)(f), a conveyance that alienates a married person's
  homestead interest must be signed by each spouse. Because the wife did not sign the deed, her
  homestead interest is not transferred; it remains with her. The deed may still be effective as to
  the husband's interest, but it does not affect the wife's share. Recording the deed does not cure
  the missing signature.
citation:
