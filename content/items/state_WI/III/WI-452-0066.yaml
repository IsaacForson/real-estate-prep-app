stem: Under Wisconsin property tax law, which of the following is **NOT** a basis for certiorari
  review of a board of review decision?
options:
  - Whether the board acted within its jurisdiction
  - Whether the board acted according to law
  - Whether the board acted arbitrarily, oppressively, or unreasonably
  - Whether the board considered the taxpayer's income level
key: D
explanation: The statute specifies that certiorari review is limited to whether the board acted
  within its jurisdiction, according to law, arbitrarily or unreasonably, or without evidence to
  support its determination. The taxpayer's income level is not mentioned as a basis for review,
  making it the correct choice. The other three options are expressly listed as valid grounds for
  review.
citation:
  source: Wis. Stat. ch. 70 § 70.47
  url: null
  quoted_text: |-
    On certiorari review of a board of review decision only whether the board acted:
    1) within its jurisdiction; 2) according to law; 3) arbitrarily, oppressively, or unrea-
    sonably; or 4) without evidence to make the order or determination in question is
    considered
