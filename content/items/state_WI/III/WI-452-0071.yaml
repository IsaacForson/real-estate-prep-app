stem: According to the Wisconsin Property Assessment Manual, how many factors does it direct
  assessors to consider when determining if property owner's actions are consistent with intent for
  residential use?
options:
  - One factor
  - Seven factors
  - Three factors
  - Five factors
key: B
explanation: The manual states that considering the owner’s actions is only one of seven factors it
  directs assessors to consider. Therefore, the correct answer is seven factors. A distractor
  stating five factors incorrectly reduces the number of factors cited in the manual.
