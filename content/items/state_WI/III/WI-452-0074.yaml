    from this network — § 70.32
  url: null
  quoted_text: The value of a subject property is determined by dividing its NOI by the applicable
    capitalization rate.
  secondary: []
math:
  worked_solution: |-
    NOI = $48,000
    CapRate = 6% = 0.06
    Value = $48,000 / 0.06 = $800,000
  formulas:
    - Value = NOI / CapRate
