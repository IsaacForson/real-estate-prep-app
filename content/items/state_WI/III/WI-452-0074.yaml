stem: A rental property generates a net operating income (NOI) of $48,000 per year. If the
  applicable capitalization rate is 6%, what is the estimated property value using the income
  approach under Wis. Stat. ch. 70 § 70.32?
options:
  - $720,000
  - $800,000
  - $864,000
  - $960,000
key: B
explanation: Under Wis. Stat. ch. 70 § 70.32, property value equals net operating income divided by
  the capitalization rate. For a $48,000 NOI and a 6% rate, the value is $800,000. The option
  stating $800,000 is correct. The option stating $960,000 results from mistakenly using a 5%
  capitalization rate.
citation:
  source: Wis. Stat. ch. 70 — Wisconsin Statutes Chapter 70, official Wisconsin Legislature PDF read
