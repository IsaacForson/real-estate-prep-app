stem: Under Wis. Stat. § 706.02(1)(d), a conveyance of real property must be signed by or on behalf
  of which party?
options:
  - The grantee only
  - Each of the grantors
  - The attesting witness
  - Either the grantor or grantee
key: B
explanation: Under Wis. Stat. § 706.02(1)(d), a conveyance must be signed by or on behalf of each
  grantor; therefore each of the grantors must sign the instrument. The distractor "The grantee
  only" is incorrect because subsection (1)(d) imposes the signing requirement on grantors, not on
  the grantee receiving the conveyance.
