stem: A taxpayer wishes to challenge her property tax assessment directly in circuit court without
  first filing an objection with the board of review. The property is taxable and located within the
  taxing district. Under Wisconsin property tax law, what is required before the taxpayer can
  proceed to court?
options:
  - The taxpayer must first file an objection with the board of review
  - The taxpayer may file a complaint directly with the Department of Revenue
  - The taxpayer must obtain a written waiver from the municipal clerk
  - The taxpayer must pay the disputed tax before filing any objection
key: A
explanation: The Hermann case held that exhaustion of remedies before the board of review is
  required unless the property is exempt or lies outside the taxing district. Because the property
  is taxable and within the district, the taxpayer must first file an objection with the board of
  review before seeking judicial review. The option allowing direct court access ignores the
  exhaustion requirement, and the other options introduce conditions not mentioned in the statute.
