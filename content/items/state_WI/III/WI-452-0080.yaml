stem: A licensee prepares a deed for a married couple selling their Wisconsin homestead. The deed is
  signed by both spouses but has not yet been delivered to the buyer. Under Wis. Stat. §
  706.02(1)(g), what is required for the conveyance to be effective?
options:
  - Recording with the register of deeds
  - Delivery to the grantee
  - Acknowledgement before a notary
  - Execution of a power of attorney
key: B
explanation: Subsection (1)(g) states that a conveyance must be delivered to be effective; mere
  recording or acknowledgment does not satisfy this requirement. The distractor "Recording with the
  register of deeds" is wrong because delivery, not recording, is the act that completes the
  conveyance under the statute.
