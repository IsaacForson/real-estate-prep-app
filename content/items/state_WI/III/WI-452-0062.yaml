stem: Under Wisconsin property tax law, when a taxpayer objects to an assessment based on the
  classification of the property, who bears the burden of proof?
options:
  - The taxpayer
  - The assessor
  - The board of review
  - The municipality
key: A
explanation: Under Wis. Stat. § 70.47, a taxpayer who objects to an assessment on the basis of
  property classification must prove that the classification is erroneous. Therefore the taxpayer
  bears the burden of proof. The assessor does not carry this burden; the board of review evaluates
  the evidence but is not required to prove the classification.
