stem: A buyer receives a deed subject to an oral condition that the seller will retain a life
  estate. The buyer records the deed two years later. Under Wis. Stat. § 706.02, when must a legal
  action to enforce that oral condition be commenced to be effective?
options:
  - Within 10 years following the conditional delivery
  - Only after the grantor's death, regardless of deed
  - At any time before the grantee transfers the property
  - Within 5 years following the conditional delivery
key: D
explanation: The statute provides that a conveyance delivered upon an oral condition remains subject
  to that condition only if an action to enforce it is commenced within five years of the
  conditional delivery. Hence the action must be brought within five years. The distractor "Only
  after the grantor's death, regardless of deed" is incorrect because that rule applies only when
  the condition itself is the grantor's death, not to a generic oral condition.
