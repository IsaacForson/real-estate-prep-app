stem: Under Wisconsin property tax law, how is 'nonproductive land' defined for the purpose of the
  50-percent assessment reduction?
options:
  - It is land that is neither producing nor capable of productive use.
  - It is land that is currently producing agricultural crops but not livestock.
  - It is land that is zoned for industrial use regardless of actual use.
  - It is land that is temporarily idle but capable of being farmed next season.
key: A
explanation: The statute defines nonproductive land as land that is neither producing nor capable of
  productive use, which qualifies for the 50-percent assessment reduction under sub. (4). The
  distractor describing land that is currently producing agricultural crops but not livestock is
  incorrect because productive use disqualifies the land from being nonproductive.
