stem: A buyer asks a licensee to submit a written purchase offer that the licensee personally
  believes is too low. The seller has given no written instructions about which offers to submit.
  Under Wis. Admin. Code section REEB 24.13(1), may the licensee refuse to submit the offer?
options:
  - No, a licensee may not refuse to submit the written proposal here
  - Yes, a licensee may refuse offers below the original listing price
  - No, a licensee should route written proposals through an attorney
  - Yes, a licensee may refuse any offer considered too low personally
key: A
explanation: Wis. Admin. Code section REEB 24.13(1) states that licensees shall not refuse to draft
  or submit any written proposal unless the terms of the proposal are contrary to specific written
  instructions of the other party, and no such instructions exist here.
