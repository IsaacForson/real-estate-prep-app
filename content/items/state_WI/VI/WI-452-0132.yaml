stem: A licensee receives three written purchase offers for a property and decides to present only
  the highest offer to the seller, believing it saves time. Under Wis. Admin. Code ch. REEB 24 §
  REEB 24.13(3)(a), is the licensee’s action permissible?
options:
  - Yes, as long as the licensee informs the seller that other offers exist but are not being shown.
  - No, because licensees must present written proposals objectively and without bias.
  - Yes, because presenting the highest offer alone is efficient and still serves the seller’s
    interests.
  - No, unless the seller gave specific written instructions to limit the presentation.
key: B
explanation: Wis. Admin. Code ch. REEB 24 § REEB 24.13(3)(a) requires licensees to present all
  written proposals in an objective and unbiased manner to their clients and customers. Showing only
  the highest offer does not satisfy that requirement, so the licensee’s conduct is not permissible.
