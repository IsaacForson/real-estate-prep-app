stem: A licensee overstates a property's likely market value in order to persuade a homeowner to
  sign a listing agreement with the licensee's firm. Under Wis. Admin. Code section REEB 24.09, has
  the licensee violated this rule?
options:
  - No, the homeowner made the independent decision to sign the listing
  - No, market value estimates are simply subjective professional opinions
  - Yes, though appraisers typically provide the final market value figure
  - Yes, a licensee may not mislead a potential client about market value
key: D
explanation: Wis. Admin. Code section REEB 24.09 provides that a licensee may not mislead a
  potential client regarding the market value of real estate to be sold under an agency agreement,
  so overstating the value to secure the listing violates the rule.
