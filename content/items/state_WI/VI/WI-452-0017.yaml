stem: A property is listed with a firm. A licensee associated with that firm knows the terms of a
  pending offer on the property and wants to submit a personal written offer to purchase it. Under
  Wis. Admin. Code section REEB 24.13(3)(b), what does this rule say about the licensee's personal
  offer?
options:
  - The licensee may submit the offer through a separate buyer's agent
  - The licensee may not submit the personal offer under these facts
  - The licensee may submit the offer after disclosing it to the seller
  - The licensee may submit the offer if it exceeds the pending terms
key: B
explanation: Wis. Admin. Code section REEB 24.13(3)(b) prohibits a licensee associated with the
  listing firm from submitting a personal written offer to purchase a listed property if the
  licensee has knowledge of the terms of any pending offer.
citation:
  source: Wis. Admin. Code § REEB 24.13(3)(b), Wisconsin Administrative Code ch. REEB 24
  url: null
  quoted_text: no licensee associated with the listing firm, including a licensed individual broker
    acting as a sole proprietor and licensed broker business entity, or listing firm, may submit a
    personal written proposal or offer to purchase a property, if the licensee has knowledge of the
    terms of any pending offer
