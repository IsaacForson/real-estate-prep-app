stem: Which type of listing entitles the listing firm to a commission if the property is sold by the
  owner, by the firm, or by anyone else during the listing period?
options:
  - A one-party listing contract for a single buyer
  - An open listing arrangement with multiple firms
  - An exclusive agency listing type of contract
  - An exclusive right to sell listing
key: D
explanation: Wis. Admin. Code section REEB 16.02 defines an exclusive right to sell listing as a
  written listing contract making a firm the exclusive agent for the sale of property for a specific
  period of time and entitling the listing firm to a commission no matter who sells the property.
