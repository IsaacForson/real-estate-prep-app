stem: A buyer asks a licensee to explain what a contingency clause in the offer to purchase legally
  means for the buyer's rights if the sale falls through. Under Wis. Admin. Code section REEB
  16.05(1), what must the licensee do?
options:
  - Draft a written legal opinion and attach it to the offer to purchase
  - Explain the buyer's legal rights fully, since forms are the licensee's specialty
  - Decline to give an opinion on the buyer's legal rights under the clause
  - Refer the buyer to the real estate examining board for a legal ruling
key: C
explanation: Wis. Admin. Code section REEB 16.05(1) bars a licensee from providing advice or
  opinions concerning the legal rights or obligations of parties to a transaction or the legal
  effect of a specific contract, so the licensee must decline to interpret the buyer's legal rights.
citation:
