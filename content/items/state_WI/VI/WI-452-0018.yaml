stem: A buyer's agent knows that a seller has an unexpired written listing contract granting another
  firm the exclusive right to sell the property. Under Wis. Admin. Code section REEB 24.13(5), with
  whom must the buyer's agent conduct negotiations?
options:
  - With the seller directly, bypassing the firm holding the listing
  - With the real estate examining board before any offer is made
  - With the firm holding the exclusive right to sell the property
  - With whichever party responds first to the written proposal
key: C
explanation: Wis. Admin. Code section REEB 24.13(5) requires that negotiations be conducted with the
  firm holding the exclusive right to sell, lease, or negotiate once a licensee knows the party has
  an unexpired written contract granting another licensee that right, rather than with the party
  directly.
