stem: A property was once the site of a widely reported event, but the event had no effect on the
  physical condition of the property or its structures. Under Wis. Stat. section 452.23(2)(a), must
  the licensee disclose this fact to a buyer?
options:
  - No, disclosure of this fact is not required under this provision
  - Yes, disclosure is required because the buyer inquired about it directly
  - Yes, disclosure is required within ten days after the offer is signed
  - No, disclosure is prohibited because it could violate fair housing law
key: A
explanation: Wis. Stat. section 452.23(2)(a) provides that a licensee is not required to disclose
  that a property was the site of a specific act or occurrence if that act or occurrence had no
  effect on the physical condition of the property or any structures on it.
