stem: A licensee receives a written request from the other party’s firm for a statement showing the
  date and time a purchase offer was presented. According to Wis. Admin. Code ch. REEB 24, what must
  the licensee do?
options:
  - Written statement with date and time of offer presentation
  - Written statement not required unless offer accepted
  - Written statement with date only of offer presentation
  - Written statement provided after broker approval
key: A
explanation: The rule requires the licensee to immediately provide a written statement that includes
  both the date and the time when the written proposal was presented. A statement that is only
  required if the offer is accepted omits the requirement to respond to a request. A statement that
  includes only the date lacks the required time element. A statement that is provided only after
  broker approval adds an unauthorized condition.
