stem: A licensee is convicted of a misdemeanor theft unrelated to real estate. Under Wis. Admin.
  Code ch. REEB 24 § REEB 24.17(1), what must the licensee do within 48 hours after the judgment of
  conviction?
options:
  - The licensee shall send a copy of the complaint/judgment to the board
  - The licensee shall notify the broker of the conviction
  - The licensee shall file a disciplinary complaint with the court
  - The licensee shall wait for the board to request the information
key: A
explanation: The rule requires licensees convicted of a crime to send to the board, within 48 hours
  after judgment, a copy of the complaint or other information describing the nature of the crime
  and judgment. The other actions are not mandated by this provision.
