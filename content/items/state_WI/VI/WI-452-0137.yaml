    convicted of a crime, shall send to the board, within 48 hours af-
    ter the judgment of conviction, a copy of the complaint or other
    information that describes the nature of the crime and the judg-
    ment of conviction in order that the board determine whether the
    circumstances of the crime of which the licensee was convicted
    are substantially related to the practice of a real estate licensee
