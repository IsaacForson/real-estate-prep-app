stem: Under Wis. Admin. Code ch. REEB 24 § REEB 24.08, what is required of a licensee regarding
  listing contracts, buyer agency agreements, and offers to purchase?
options:
  - They must be notarized before submission to the broker.
  - They must be put in writing showing the exact agreement of the parties.
  - They must be reviewed by an attorney before signing the contract.
  - They must be filed with the county register of deeds office.
key: B
explanation: Wis. Admin. Code ch. REEB 24 § REEB 24.08 requires a licensee to put in writing all
  listing contracts, buyer‑agency agreements, offers to purchase and other transaction documents,
  and the writing must express the exact agreement of the parties. Consequently, the statement that
  the documents “must be put in writing showing the exact agreement of the parties” is correct. The
  other statements—filing with the register of deeds, notarization, or attorney review—are not
  required by this rule.
