stem: A married individual owns a homestead in Wisconsin and wants to convey an interest in it to a
  buyer, in a transaction that is not a conveyance between spouses. Under Wis. Stat. section
  706.02(1)(f), whose signature does this conveyance generally require?
options:
  - The signature of the conveying spouse and two witnesses
  - The signature of the conveying spouse and the buyer's attorney
  - The signature of the conveying spouse and a notary public
  - The signature of the conveying spouse and of the other spouse
key: D
explanation: Wis. Stat. section 706.02(1)(f) requires a conveyance that alienates any interest of a
  married person in a homestead to be signed, or joined in by separate conveyance, by or on behalf
  of each spouse, except for conveyances between spouses.
