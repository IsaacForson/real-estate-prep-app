stem: Under Wis. Admin. Code REEB 24.08, which of the following must be in writing?
options:
  - A written buyer agency agreement
  - A verbal referral fee arrangement document
  - An informal talk about market conditions
  - A text confirming a showing appointment
key: A
explanation: Under Wis. Admin. Code REEB 24.08, a licensee must put in writing all buyer agency
  agreements. Therefore, a written buyer agency agreement must be in writing. The other options—a
  text confirming a showing appointment, an informal talk about market conditions, and a verbal
  referral fee arrangement—are not required to be in writing by this rule.
