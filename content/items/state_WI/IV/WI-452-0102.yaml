stem: A licensee representing a buyer learns that the property has a cracked foundation that the
  seller knows about but is not visible during a routine inspection. The licensee must disclose this
  fact to the buyer. According to Wis. Stat. § 452.133(1)(c), how must the disclosure be made?
options:
  - In writing before the buyer makes an offer
  - In writing after the purchase agreement is signed
  - Orally at the time of the showing
  - Only if the buyer asks for it
key: A
explanation: Wis. Stat. § 452.133(1)(c) requires timely written disclosure of material adverse facts
  known to the firm and not discoverable by the party; therefore the disclosure must be in writing
  before the buyer makes an offer. Oral disclosure does not satisfy the requirement.
