stem: A licensee is representing a buyer-client and also owns a title company that could provide
  services in the transaction. The licensee wishes to refer the buyer-client to the title company.
  What must the licensee do first under Wis. Stat. § 452.133(3)(c)?
options:
  - Obtain written consent from the buyer-client only
  - Disclose in writing the potential compensation or interest to the buyer-client
  - Obtain written consent from all parties to the transaction
  - Refer the buyer-client without any disclosure if the fee is nominal
key: B
explanation: Under Wis. Stat. § 452.133(3)(c), a licensee who owns or has an interest in a title
  company must first disclose in writing any potential compensation or interest to the buyer‑client
  before referring the client to that company. The statute does not require obtaining consent from
  all parties or from the buyer‑client alone; written disclosure is the prerequisite.
