stem: A firm is representing both parties in a multiple representation relationship, and one client
  has withdrawn consent to designated agency. Under Wis. Stat. section 452.134(4), how must the firm
  and its licensees conduct the negotiations from this point forward?
options:
  - Without placing either client's interests ahead of the other
  - By assigning one single licensee to negotiate for both clients
  - By favoring whichever client signed the agency agreement first
  - By terminating both clients' agency agreements at once
key: A
explanation: Wis. Stat. section 452.134(4) provides that once a client withdraws consent to
  designated agency in a multiple representation relationship, the firm and its licensees may not
  place the interests of any client ahead of the interests of any other in the negotiations.
