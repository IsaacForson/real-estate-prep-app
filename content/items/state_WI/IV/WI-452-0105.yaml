stem: Under Wis. Stat. § 452.139(1), how do a firm's statutory duties relate to its common law
  duties when they conflict?
options:
  - The firm's statutory duties supersede conflicting common law duties.
  - The firm must follow common law duties unless they are less restrictive than statutory duties.
  - The firm may elect to apply either statutory or common law duties as it chooses.
  - The firm's statutory duties are added to any existing common law duties.
key: A
explanation: The statute says that a firm's duties specified in the chapter or rules supersede
  common law duties to the extent they are inconsistent. Therefore, statutory duties override
  conflicting common law duties. The distractor that statutory duties are added to common law duties
  is incorrect because the statute does not allow both to apply simultaneously when they conflict.
citation:
  source: Wis. Stat. § 452.139(1)
  url: null
  quoted_text: |-
    The duties of a firm specified in this chapter or in rules
    promulgated under this chapter shall supersede duties or obliga-
    tions under common law to the extent that those common law du-
    ties or obligations are inconsistent with the duties specified in
    this chapter or in rules promulgated under this chapter
