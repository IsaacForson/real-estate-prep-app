stem: A firm represents both the buyer and the seller in the same transaction. Under Wis. Stat.
  section 452.134(2), what must occur before the firm may provide brokerage services in this
  multiple representation relationship?
options:
  - Both clients must retain separate attorneys before the closing
  - The firm must lower its commission for both represented clients
  - The firm must first notify the real estate examining board
  - All clients in the relationship must consent in writing
key: D
explanation: Wis. Stat. section 452.134(2) prohibits a firm from providing brokerage services in a
  multiple representation relationship unless all of the firm's clients in that relationship have
  consented to the multiple representation relationship in writing.
citation:
  source: Wis. Stat. § 452.134(2), Wisconsin Statutes ch. 452 (Real Estate Practice)
  url: null
  quoted_text: A firm and any licensees associated with the firm may not provide brokerage services in
    a multiple representation relationship unless all of the firm[s clients in the multiple
    representation relationship have consented to a multiple representation relationship in writing.
