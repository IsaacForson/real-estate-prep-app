stem: A buyer gives a licensee a $5,000 earnest money check to hold until closing. According to Wis.
  Stat. § 452.133(1)(f), what must the licensee do with this money?
options:
  - Deposit the earnest money in the broker's designated trust account.
  - Return the earnest money to the buyer immediately without holding it.
  - Keep the earnest money in the licensee's personal checking account.
  - Use the earnest money to cover office expenses until closing.
key: A
explanation: Under Wis. Stat. § 452.133(1)(f), a licensee must safeguard trust funds by depositing
  them in the broker’s designated trust account. Keeping the money in a personal account or using it
  for office expenses would violate the duty to safeguard and could constitute commingling. The
  money must not be returned to the buyer before closing unless the transaction falls through.
