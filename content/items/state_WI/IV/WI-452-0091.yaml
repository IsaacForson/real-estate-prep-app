stem: A buyer-client is unaware that her brokerage firm's licensee falsely stated that the roof was
  replaced last year. The buyer had no reason to know the statement was false. Under Wis. Stat. §
  452.139(2)(a), is the buyer liable for the misrepresentation?
options:
  - Yes, because the firm made the misrepresentation regardless of the buyer's knowledge.
  - No, unless the buyer knew or should have known of the misrepresentation made by the licensee.
  - Yes, because the buyer benefited from the false statement about the roof in the transaction.
  - No, if the buyer suffered no damages and the misrepresentation was immaterial to the decision.
key: B
explanation: Under Wis. Stat. § 452.139(2)(a), a client is not liable for a misrepresentation made
  by the firm or its licensee unless the client knows or should have known of the misrepresentation.
  Because the buyer had no knowledge and no reason to know, she is not liable. The option claiming
  liability arises because the buyer benefited from the false statement is incorrect, as benefit
  alone does not create liability. The option stating liability if the firm made the
  misrepresentation regardless of the buyer's knowledge is also incorrect, as the statute requires
  client knowledge. The option saying no liability unless the buyer suffered no damages and the
  misrepresentation was immaterial is incorrect because the statute does not condition liability on
  damages or materiality but on the client's knowledge.
