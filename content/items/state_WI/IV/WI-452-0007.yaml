stem: A firm wants to negotiate directly on behalf of a buyer during a transaction. Under Wis. Stat.
  section 452.134(1), for which buyer may the firm do so?
options:
  - A buyer who has simply toured the property with the firm
  - A buyer who is the firm's own client in this transaction
  - A buyer referred to the firm by a cooperating out-of-state broker
  - Any buyer who informally requests negotiation help
key: B
explanation: Wis. Stat. section 452.134(1)(b) permits a firm to negotiate on behalf of a party to a
  transaction only when that party is the firm's own client or a client of a principal firm that
  engaged the firm as a subagent, not merely someone the firm has shown property to or an informal
  requester.
