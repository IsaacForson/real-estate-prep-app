stem: If a licensee is associated with a firm under Wis. Stat. § 452.19(2), where must all fees or
  commissions for performing any act specified in chapter 452 be paid?
options:
  - Paid directly to the licensee who performed the service, regardless of firm affiliation.
  - Paid to the firm with which the licensee is associated for distribution.
  - Paid to the client receiving the brokerage services as a referral fee.
  - Paid to the state real estate examining board for regulatory compliance.
key: B
explanation: Under Wis. Stat. § 452.19(2), when a licensee is associated with a firm, all fees or
  commissions for performing any act specified in chapter 452 must be paid to the firm; paying the
  licensee directly or to any other party violates this requirement.
