  url: null
  quoted_text: |-
    b) A firm that is providing brokerage services to a client and
    that retains another firm to provide brokerage services as a sub-
    agent is not liable for a misrepresentation made by the subagent
    or any licensee associated with the subagent, unless the firm
    knew or should have known of the misrepresentation or the sub-
    agent or licensee is repeating a misrepresentation made to by the
    firm or any licensee associated with the firm
