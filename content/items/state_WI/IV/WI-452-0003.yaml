stem: Under Wis. Stat. section 452.133(1), which duty must a firm provide to every party in a
  transaction regarding conditions in the market?
options:
  - The duty to guarantee the property's future appreciation rate
  - The duty to give accurate information on market conditions
  - The duty to predict long-term market trends after closing
  - The duty to disclose every competing firm's commission rate
key: B
explanation: Wis. Stat. section 452.133(1)(e) requires a firm to provide accurate information about
  market conditions affecting the transaction within a reasonable time after a request, which is
  different from guaranteeing appreciation, forecasting future trends, or revealing other firms'
  commissions.
