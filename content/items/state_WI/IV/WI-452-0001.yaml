stem: Under Wisconsin's real estate practice law, which party is described as having an agency
  agreement with a firm for brokerage services?
options:
  - An out-of-state broker
  - A firm's customer
  - A firm's subagent
  - A firm's client
key: D
explanation: Wis. Stat. section 452.01 defines a client as a party to a transaction who has an
  agency agreement with a firm for brokerage services, while a customer receives services without
  such an agreement and a subagent or out-of-state broker are licensees rather than parties holding
  the agreement.
