stem: A firm is representing a seller-client and is also considering purchasing the same property
  for its own investment portfolio. Which duty under Wis. Stat. section 452.133(2) most directly
  governs this conflict?
options:
  - The duty to disclose market conditions affecting the sale
  - The duty to provide brokerage services with skill and care
  - The duty to place client interests ahead of the firm's
  - The duty to safeguard trust funds held for this sale transaction
key: C
explanation: Wis. Stat. section 452.133(2)(a) requires a firm to loyally represent a client by
  placing the client's interests ahead of the interests of the firm itself, which directly addresses
  a firm considering buying its own client's property.
