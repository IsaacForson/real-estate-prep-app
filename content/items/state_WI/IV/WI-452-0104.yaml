stem: A licensee is negotiating the purchase price of a home for a customer who has not signed a
  buyer agency agreement. According to Wis. Stat. § 452.135, what must the licensee do before
  continuing negotiations?
options:
  - Provide the customer with a written disclosure statement of duties to customers
  - Obtain written consent from the customer's spouse or legal representative
  - Present a purchase offer to the seller on behalf of the firm without disclosure
  - Confirm the customer's loan pre-approval status with the lending institution
key: A
explanation: The statute requires that when a firm negotiates on behalf of a party who is not the
  firm's client, the firm must provide that party a copy of the written disclosure statement titled
  'DISCLOSURE TO CUSTOMERS'. The other options are not required by this provision.
