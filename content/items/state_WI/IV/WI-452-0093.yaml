stem: Under Wis. Stat. § 452.133(2)(a), what must a firm do when representing a client?
options:
  - Place the client's interests ahead of the firm's interests
  - Place the firm's interests ahead of the client's interests
  - Place the client's interests ahead of all other parties in the transaction
  - Place the client's interests ahead of the firm's and other non-client parties
key: D
explanation: The statute requires the firm to place the client's interests ahead of the firm's and
  ahead of persons in the transaction who are not the firm's clients. The correct answer states that
  the firm must place the client's interests ahead of the firm's and ahead of other non‑client
  parties, while the other options are incomplete or incorrect.
