stem: A licensed broker wants to pay part of a commission to a friend who is not licensed under Wis.
  Stat. chapter 452, for referring a buyer to the broker. Under Wis. Stat. section 452.19, when is
  this payment permitted?
options:
  - When the friend held a real estate license at the time of referral
  - When the buyer consents in writing to the referral payment being made
  - When the friend later becomes licensed within a year of the referral
  - When the total commission earned stays below a set dollar amount
key: A
explanation: Wis. Stat. section 452.19(1) bars paying a commission or referral fee to a person who
  is not licensed under the chapter unless that person was licensed under the chapter when the
  referral fee arrangement was made or the commission was earned.
citation:
  source: Wis. Stat. § 452.19(1), Wisconsin Statutes ch. 452 (Real Estate Practice)
  url: null
  quoted_text: No licensee may pay a fee or a commission or any part thereof for performing any act
    specified in this chapter or as compensation for a referral or as a finder[s fee to any person
    who is not licensed under this chapter
