stem: Which party is described as receiving brokerage services from a firm and its associated
  licensees, without having an agency agreement with the firm?
options:
  - A customer who has no agency agreement
  - A subagent engaged by a principal firm
  - A listing firm hired to market a property
  - A client who has signed an agency agreement
key: A
explanation: Wis. Stat. section 452.01 defines a customer as a party to a transaction who is
  provided brokerage services by a firm and its associated licensees but who is not a client,
  distinguishing the customer from a client, a subagent, or a listing firm.
