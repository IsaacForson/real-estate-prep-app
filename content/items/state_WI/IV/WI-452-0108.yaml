stem: A seller and buyer prepare a written purchase agreement themselves, without involvement of any
  licensee. Later, a licensee is hired to assist with the closing. According to Wis. Admin. Code
  REEB 24.08, does the licensee need to put this agreement in writing?
options:
  - No, because the section does not apply when the writing is completed by the parties or their
    attorneys.
  - Yes, because all agreements related to a real estate transaction must be in writing regardless
    of who prepared them.
  - No, but only if the licensee attaches a copy of the agreement to the file within 48 hours.
  - Yes, unless the parties later sign a separate written agency agreement with the licensee.
key: A
explanation: Under Wis. Admin. Code REEB 24.08, the writing requirement does not apply if the
  agreement is prepared by the parties themselves or their attorneys. Therefore, a licensee hired
  later for closing is not required to put the agreement in writing. The other options are incorrect
  because they either impose a writing requirement that the rule does not mandate or add conditions
  not present in the rule.
