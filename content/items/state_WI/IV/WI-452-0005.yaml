stem: A licensee wants to accept a referral fee from a home inspector for recommending the inspector
  to a buyer-client, without telling anyone else involved in the transaction. Under Wis. Stat.
  section 452.133(3), what must the licensee first obtain?
options:
  - The verbal approval of the licensee's supervising broker
  - The buyer-client's after-the-fact ratification of the fee
  - The formal written approval of the real estate examining board
  - The prior written consent of every transaction party
key: D
explanation: Wis. Stat. section 452.133(3)(a) prohibits a licensee from accepting a fee related to
  the transaction from anyone other than the licensee's client, principal firm, or firm, without the
  prior written consent of all parties to the transaction.
