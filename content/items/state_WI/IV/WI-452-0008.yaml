stem: A firm agrees with a seller-client that the firm will provide brokerage services only to that
  seller in the transaction. Under Wis. Stat. section 452.138, where must this exclusivity agreement
  appear?
options:
  - In a public notice posted on the multiple listing service
  - In a separate letter mailed to the real estate examining board
  - In a statement contained within the agency agreement
  - In a verbal disclosure made at the initial listing appointment
key: C
explanation: Wis. Stat. section 452.138 states that if a firm and a client agree the firm will
  provide brokerage services only to that client, the agency agreement itself must contain a
  statement of that agreement, rather than a verbal disclosure, a posted notice, or a separate board
  filing.
