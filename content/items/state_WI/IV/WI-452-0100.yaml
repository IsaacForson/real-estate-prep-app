stem: Under Wisconsin Admin. Code REEB 24.08, which of the following agreements must a licensee put
  in writing?
options:
  - Written listing contracts required
  - Oral agreements with clients
  - Verbal promises to refer business
  - Casual talks about market trends
key: A
explanation: REEB 24.08 requires licensees to put in writing all listing contracts, guaranteed sales
  agreements, buyer agency agreements, offers to purchase, property management agreements, options,
  financial obligations and any other written proposals regarding transactions. Oral agreements,
  verbal promises, and informal discussions are not required to be in writing.
