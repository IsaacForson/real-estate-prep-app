  url: null
  quoted_text: |-
    A licensee
    shall put in writing all listing contracts, guaranteed sales agree-
    ments, buyer agency agreements, offers to purchase, property
    management agreements, options, financial obligations and any
    other written proposals regarding transactions, expressing the ex-
    act agreement of the parties
