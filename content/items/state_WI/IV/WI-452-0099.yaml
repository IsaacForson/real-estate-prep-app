stem: A licensee enters into an oral listing agreement with a seller to market the seller's
  property. According to Wis. Admin. Code REEB 24.08, what must the licensee do to comply with the
  rule?
options:
  - The licensee must reduce the listing agreement to writing because REEB 24.08 requires listing
    contracts to be in writing.
  - The licensee may rely on the oral agreement as long as the seller later confirms it in writing
    and the licensee documents the confirmation.
  - The licensee is exempt from the writing requirement only if the agreement is for a residential
    property and the seller signs a written acknowledgment.
  - The licensee must attach the oral agreement to a standard purchase offer form to satisfy the
    writing requirement.
key: A
explanation: REEB 24.08 obligates licensees to put all listing contracts in writing; an oral
  agreement does not satisfy this requirement. The rule does not permit reliance on an oral
  agreement even with later written confirmation.
citation:
