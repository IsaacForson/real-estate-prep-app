stem: How is the term 'advertise' defined for real estate licensees?
options:
  - It includes only newspaper and magazine advertisements placed by the brokerage for property
    sales.
  - It includes all forms of representation, promotion, and solicitation for any real estate
    brokerage activity.
  - It refers exclusively to signs placed on property indicating the property is for sale or lease.
  - It is limited to online posts and social media promotions directed at consumers seeking real
    estate.
key: B
explanation: The rule defines 'advertise' as all forms of representation, promotion, and
  solicitation for any real estate brokerage activity, disseminated in any manner and by any means
  of communication. Therefore the correct option is the one stating that advertising includes all
  forms of representation, promotion, and solicitation for any real estate brokerage activity. The
  other options are incorrect because they limit advertising to only newspaper and magazine ads,
  only property signs, or only online posts and social media, which are too narrow, as defined in
  N.D. Admin. Code § 70-02-03-02.1.
citation:
  source: N.D. Admin. Code ch. 70-02-03 — North Dakota Administrative Code Chapter 70-02-03, Licensee
    Responsibilities — § 70-02-03-02.1
  url: null
  quoted_text: As used in this section, the terms "advertise", "advertising", and "advertisement"
    include all forms of representation, promotion, and solicitation disseminated in any manner and
    by any means of communication for any purpose related to real estate brokerage activity
