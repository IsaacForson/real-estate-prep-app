stem: A licensee repeats a misrepresentation that the client originally made, and the client had no
  way of knowing the statement was false. Under N.D. Cent. Code § 43-23-12.2, is the client shielded
  from liability for that misrepresentation?
options:
  - Yes, because a court may not hold a client liable for a licensee's acts
  - No, because a subagency relationship removes a client's liability protection
  - Yes, because the statute protects clients from a licensee's statements
  - No, because the licensee is repeating a misrepresentation the client made
key: D
explanation: Section 43-23-12.2 removes a client's liability shield when the licensee is only
  repeating a misrepresentation that the client itself made in the transaction.
