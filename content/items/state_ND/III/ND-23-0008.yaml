stem: A buyer views homes with a licensee but has not signed any agency agreement with that
  licensee's firm, so the buyer remains a customer rather than a client. Under N.D. Cent. Code §
  43-23-12.1, which duty does the firm's licensee owe that buyer as a nonagent?
options:
  - Negotiating the lowest possible purchase price on the buyer's own behalf
  - Preparing a comparative market analysis exclusively for the buyer
  - Disclosing adverse facts about title or condition known to the licensee
  - Advising the buyer on the financing terms offered by local lenders
key: C
explanation: Section 43-23-12.1 requires a real estate brokerage firm's licensees to disclose to an
  unrepresented customer any adverse material facts actually known to the licensee that pertain to
  the property's title or physical condition.
citation:
  source: N.D. Cent. Code § 43-23-12.1
  url: null
  quoted_text: |-
    the real estate brokerage firm and the real estate brokerage firm's
    licensees are nonagents that owe the following legal duties: to perform customary acts
    typically performed by real estate licensees in assisting a transaction to the
    transaction's closing or conclusion if these acts are to assist the customer for which
    the services are directly provided; to perform these acts with honesty and good faith;
    and to disclose to the customer any adverse material facts actually known by the
    licensee which pertain to the title of the real property, the physical condition of the real
    property, and defects in the real property.
