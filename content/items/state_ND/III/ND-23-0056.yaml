stem: According to N.D. Admin. Code § 70-02-03-15.1, how is "dual agency" defined?
options:
  - A situation where a licensee represents both the buyer and the seller in a transaction
  - A situation where a licensee owes a duty to more than one party to the real estate transaction
  - A situation where two licensees from different brokers each represent a party
  - A situation where a licensee acts as a subagent for both parties
key: B
explanation: The rule defines dual agency as a situation where a licensee owes a duty to more than
  one party to the transaction, which includes representing both buyer and seller or two licensees
  from the same broker each representing a party. The option stating that a licensee represents both
  the buyer and the seller in a transaction is incorrect because it omits the latter scenario and
  thus does not capture the full definition.
