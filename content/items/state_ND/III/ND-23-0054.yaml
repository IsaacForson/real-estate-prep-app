stem: A salesperson leaves her broker's office and wishes to continue using the marketing brochures
  that belonged to the brokerage. Under North Dakota Administrative Code § 70-02-01-10, what must
  she do with those brochures?
options:
  - She may use the brochures if she gives credit to the broker
  - She may keep the brochures if she alters the content
  - She may keep the brochures if she paid for them
  - She must return the brochures to the former broker
key: D
explanation: The rule requires that all materials and records belonging to the former broker be
  returned upon leaving the office. Therefore, the salesperson must return the brochures. The
  distractor suggesting she may keep them if she paid for them is incorrect because ownership does
  not change the return requirement.
