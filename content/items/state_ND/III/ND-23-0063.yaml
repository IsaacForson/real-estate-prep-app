stem: Under N.D. Admin. Code § 70-02-03-17, what must an appointed agent do before entering into a
  brokerage agreement with a client?
options:
  - Obtaining verbal consent from the client before signing
  - Disclosing in writing the appointment to the client
  - Submitting the agreement to the commission for approval
  - Providing a copy of the broker's license to the client
key: B
explanation: The rule requires an appointed agent to disclose the appointment in writing to the
  client before entering into a brokerage agreement. This written disclosure must include specific
  provisions such as the agent's name and fiduciary duties. Keeping the disclosure verbal or
  delaying it until after the agreement does not satisfy the requirement.
