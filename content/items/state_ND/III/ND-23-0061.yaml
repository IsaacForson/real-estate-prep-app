stem: A North Dakota licensee has just met a prospective seller at an open house and begins
  discussing the seller's motivation and price expectations. When must the licensee provide the
  affirmative written disclosure of agency representation under N.D. Admin. Code § 70-02-03-15.1?
options:
  - After the buyer's broker agreement is executed
  - Prior to the signing of a listing agreement
  - Immediately after the open house concludes
  - At the time the purchase offer is presented
key: B
explanation: "Under N.D. Admin. Code § 70-02-03-15.1, a licensee representing a seller must provide
  the affirmative written disclosure of agency representation before the seller signs a listing
  agreement. Therefore, the correct timing is prior to the signing of a listing agreement. The other
  choices describe times that do not satisfy this requirement: after a buyer's broker agreement is
  executed, immediately after an open house ends, or at the time a purchase offer is presented."
