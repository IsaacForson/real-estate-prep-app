stem: A licensee receives a written offer to purchase from a buyer but waits two days before
  delivering it to the seller. Under N.D. Admin. Code § 70-02-03-06, is the licensee's action
  permissible?
options:
  - Under the rule, the licensee may hold the offer confidential at the buyer's request.
  - Under the rule, the licensee may delay delivery if the offer includes a financing contingency.
  - Under the rule, the licensee must promptly tender the written offer to the seller.
  - Under the rule, the licensee may wait until after obtaining the seller's acceptance before
    delivering the offer.
key: C
explanation: Under N.D. Admin. Code § 70-02-03-06, a licensee must promptly tender every written
  offer to the seller. Holding the offer for two days violates this requirement. The option
  suggesting the licensee may hold the offer confidential at the buyer's request is not permitted.
  The option suggesting the licensee may delay delivery if the offer includes a financing
  contingency is not permitted. The option suggesting the licensee may wait until after obtaining
  the seller's acceptance before delivering the offer is not permitted.
