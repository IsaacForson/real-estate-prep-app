stem: Under North Dakota Administrative Code § 70-02-01-18, what is the commission's position
  regarding agreements to set uniform commission rates?
options:
  - The commission neither recommends nor recognizes any agreement to fix or impose uniform rates of
    commission
  - The commission requires brokers to disclose the agreed commission rate in writing to clients
  - The commission recommends uniform commission rates to ensure fairness in all deals
  - The commission recognizes that fixing commission rates is a common industry practice among
    brokers
key: A
explanation: The rule states that the commission neither recommends nor recognizes any agreement to
  fix or impose uniform rates of commission. Therefore, the correct answer reflects that stance. The
  distractor suggesting the commission recommends uniform rates is incorrect because the rule
  explicitly prohibits such recommendations.
