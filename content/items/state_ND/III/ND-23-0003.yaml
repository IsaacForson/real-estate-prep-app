stem: Under North Dakota Administrative Code § 70-02-03-10, whose consent is required before a
  for-sale sign may be placed on a listed property?
options:
  - The regional multiple listing service administrator
  - The property owner or the owner's duly authorized agent
  - The county assessor or the county's designated deputy clerk
  - The buyer's broker or an assistant to that broker
key: B
explanation: Rule 70-02-03-10 states that no sign advertising a property for sale or lease may be
  placed without the consent of the owner or a person the owner has duly authorized to act on the
  owner's behalf.
citation:
  source: N.D. Admin. Code § 70-02-03-10
  url: null
  quoted_text: >-
    No signs shall be placed on any property for its sale or lease without the consent of the owner,
    or

    the owner's duly authorized agent.
