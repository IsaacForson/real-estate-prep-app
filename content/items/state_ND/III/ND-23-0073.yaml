stem: A North Dakota broker who does not currently maintain a trust account receives an earnest
  money deposit from a buyer. What must the broker do under N.D. Cent. Code § 43-23-14.1?
options:
  - Returning the earnest money to the buyer immediately
  - Depositing the earnest money in an interest-bearing account
  - Keeping the earnest money in the broker's personal account
  - Placing the earnest money in a separate trust account
key: D
explanation: The statute requires a broker who receives trust funds but lacks a trust account to
  open a designated trust account and deposit the funds. Simply keeping the money in a personal
  account or returning it violates the rule. The account must be noninterest-bearing, so placing it
  in an interest-bearing account is also incorrect.
