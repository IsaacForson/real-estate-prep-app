stem: A salesperson leaves a broker's office and wants to keep using listing agreements that were
  secured through that office. Under rule 70-02-01-10, when may the salesperson do this?
options:
  - Anytime within thirty days after leaving the brokerage
  - When the former broker specifically authorizes that use
  - Whenever the new broker consents to the arrangement
  - Immediately, since the agreements belong to the salesperson
key: B
explanation: Rule 70-02-01-10 provides that a licensee leaving a broker may not take or use
  agreements secured through the former office unless the former broker specifically authorizes that
  use.
citation:
  source: N.D. Admin. Code § 70-02-01-10
  url: null
  quoted_text: >-
    Any licensee leaving a broker shall not take nor use any agreements

    secured through the office or through licensees of the former broker unless specifically
    authorized by

    the former broker.
