stem: Under North Dakota Administrative Code § 70-02-03-02.1, what is a real estate team prohibited
  from doing in its advertising?
options:
  - Including the names of individual team members in an advertisement
  - Using the sponsoring brokerage's official logo in an advertisement
  - Listing the team's designated broker on marketing materials
  - Suggesting the team is an independent real estate brokerage firm
key: D
explanation: North Dakota rule 70-02-03-02.1 bars a real estate team from advertising in a way that
  suggests it operates as its own independent brokerage, since a team must operate under a
  sponsoring broker.
