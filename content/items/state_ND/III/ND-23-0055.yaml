stem: A licensee shows homes to a prospective buyer who has not signed any agency agreement. The
  property is a single-family residence. Under North Dakota Administrative Code § 70-02-03-05.1, may
  the licensee continue to act as the buyer's representative?
options:
  - Yes, as long as the licensee informs the buyer verbally, clearly
  - No, a signed buyer's broker agreement is required before performing any act as buyer's
    representative
  - Yes, if the licensee obtains a written agreement after showing the first home
  - No, unless the buyer is purchasing a multi-family property with five or more units
key: B
explanation: The rule mandates a signed buyer's broker agreement before any act as buyer's
  representative for one‑to‑four‑family residential property. Thus, showing homes without such an
  agreement is not permitted. The distractor suggesting verbal notice suffices is incorrect because
  the agreement must be signed and obtained prior to any representative act.
