stem: A licensee representing a buyer learns that the buyer is willing to pay $20,000 more than the
  offer price. Under N.D. Admin. Code § 70-02-03-15.1, may the licensee disclose this information to
  the seller without the buyer's written consent?
options:
  - The licensee may disclose the information if the licensee believes it will help negotiations.
  - The licensee may disclose the information because it is not considered confidential.
  - The licensee may not disclose the information because the rule requires confidentiality.
  - The licensee may not disclose the information unless the buyer has already made it public.
key: C
explanation: Subsection 3a classifies the buyer's willingness to pay more than the offered price as
  confidential information that may not be disclosed without informed written consent. The statement
  that the licensee may disclose the information because it is not considered confidential is
  incorrect because the rule expressly treats this information as confidential.
