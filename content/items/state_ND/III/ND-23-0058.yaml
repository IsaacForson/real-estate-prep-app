stem: According to N.D. Admin. Code § 70-02-03-08, what should a licensee recommend when the
  interest of either party requires it?
options:
  - Recommend that title be examined and legal counsel be obtained.
  - Recommend that the buyer obtain a home inspection before closing.
  - Recommend that the parties agree to a fixed closing date.
  - Recommend that the seller disclose any known property defects.
key: A
explanation: Under N.D. Admin. Code § 70-02-03-08, a licensee must recommend that title be examined
  and legal counsel be obtained whenever the interest of either party requires it. The correct
  option states exactly that recommendation. The other options suggest actions—such as obtaining a
  home inspection, agreeing on a fixed closing date, or requiring the seller to disclose known
  defects—that are not mandated by this rule.
