stem: Under N.D. Admin. Code § 70-02-01-15, what is the maximum amount of personal funds a broker
  may deposit in a trust account to cover service charges?
options:
  - Up to one hundred dollars.
  - Up to two hundred fifty dollars.
  - Up to five hundred dollars.
  - Up to one thousand dollars.
key: C
explanation: The rule allows a broker to deposit and keep a sum not exceeding five hundred dollars
  from personal funds to cover trust account service charges. Therefore, the maximum permissible
  amount is five hundred dollars. The distractor suggesting two hundred fifty dollars is incorrect
  because the rule sets an upper limit of five hundred, not a lower cap.
