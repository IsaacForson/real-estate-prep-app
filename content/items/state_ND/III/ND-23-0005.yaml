stem: A licensee has not obtained any written agreement establishing a different agency relationship
  in a covered transaction. Under rule 70-02-03-15, whom does the licensee represent by default?
options:
  - Neither party, until a written agreement designates an agent
  - Both parties equally, as an automatic dual agent
  - The buyer, because licensees default to representing purchasers
  - The seller, unless every party agrees otherwise in writing
key: D
explanation: Rule 70-02-03-15 states that in a covered real estate transaction the licensee is the
  agent of the seller unless every party otherwise agrees in writing.
citation:
  source: N.D. Admin. Code § 70-02-03-15
  url: null
  quoted_text: >-
    In all real estate transactions the licensee is the agent of the seller unless all parties
    otherwise

