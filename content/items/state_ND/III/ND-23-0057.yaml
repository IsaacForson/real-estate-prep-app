stem: A licensee advertises a residential property as having a 'new roof' when the roof was only
  repaired five years ago and shows visible wear. Under North Dakota Administrative Code §
  70-02-03-02.1, is this advertisement permissible?
options:
  - Yes, because the licensee believed the statement to be true at the time of publication.
  - No, because advertising must be free from deception and shall not misrepresent the terms of the
    sale.
  - No, unless the property is priced below market value to offset the misrepresentation.
  - Yes, if the advertisement includes a disclaimer that buyers should verify roof condition.
key: B
explanation: The rule prohibits advertising that contains deception or misrepresents the terms of
  the sale. Stating that a roof is new when it has only been repaired and shows wear is a
  misrepresentation, so the advertisement is not allowed. The idea that the licensee believed the
  statement to be true does not excuse a false claim.
