stem: A salesperson creates a flyer that displays the salesperson's name in 24-point font while the
  brokerage's trade name appears in 18-point font. Under North Dakota Administrative Code §
  70-02-03-02.1, is this advertisement permissible?
options:
  - Yes, provided the salesperson adds the words 'Owner/Licensed Salesperson' after their name.
  - No, unless the advertisement is limited to online media where size requirements do not apply.
  - Yes, because the flyer also includes the brokerage's contact information as required by the rule.
  - No, because the trade name must be equal to or greater in size and visibility than any
    salesperson's name.
key: D
explanation: The rule requires that a brokerage's trade name be equal to or greater in size and
  visibility than any salesperson's name in the advertisement. Since the salesperson's name is
  larger, the advertisement violates this requirement. Adding the words 'Owner/Licensed Salesperson'
  after the salesperson's name does not override the size-and-visibility rule.
citation:
