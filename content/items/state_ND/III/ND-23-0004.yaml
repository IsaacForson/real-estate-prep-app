stem: A broker decides to personally purchase a home that the owner listed with the broker's firm.
  Under rule 70-02-03-13, what must the broker do before buying the property?
options:
  - Pay the owner double the property's current appraised market value today
  - Transfer the listing to a different brokerage before making any offer
  - Make the broker's true position as a buyer clearly known to the owner
  - Wait for the multiple listing service to remove the active listing
key: C
explanation: Rule 70-02-03-13 requires a broker who wants to buy property listed with the broker to
  first make the broker's true position as a prospective buyer clearly known to the owner.
citation:
  source: N.D. Admin. Code § 70-02-03-13
  url: null
  quoted_text: >-
    A broker shall not, either directly or indirectly, buy for oneself property listed with the
    broker or

    as to which the broker has been approached by the owner to act as broker, nor shall the

    broker acquire interest in any other property therein, either directly or indirectly, without
    first

    making the broker's true position clearly known to the owner.
