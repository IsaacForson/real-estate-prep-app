stem: A licensee helps a buyer alter a loan application to show higher income so the buyer can
  qualify for a larger loan than the true sales price would allow. Under N.D. Admin. Code §
  70-02-03-09, what is the consequence for the licensee?
options:
  - The licensee may be subject to suspension or revocation of license or assessment of fines.
  - The licensee may be issued a formal warning letter from the commission.
  - The licensee may be required to complete additional continuing education.
  - The licensee may be allowed to continue practicing if the buyer qualifies for the loan.
key: A
explanation: Under N.D. Admin. Code § 70-02-03-09, using false documents to obtain a larger loan is
  misconduct that may result in suspension or revocation of the license or assessment of fines.
  Allowing the licensee to continue practicing if the buyer qualifies for the loan is not a
  consequence outlined in the rule. Issuing a formal warning letter from the commission is not
  prescribed by the rule for this conduct. Requiring additional continuing education is not
  specified as the outcome for this violation.
