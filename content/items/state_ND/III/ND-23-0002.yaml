stem: A North Dakota broker wants to share a commission with an out-of-state broker who never enters
  North Dakota and never communicates with anyone in the state about the deal. Under rule
  70-02-03-03, is this commission split permitted?
options:
  - Yes, because the out-of-state broker did not negotiate within the state
  - No, interstate commission splits require a formal written reciprocity agreement
  - No, an out-of-state broker cannot share in a North Dakota commission
  - Yes, but the state commission needs to approve the split beforehand
key: A
explanation: Rule 70-02-03-03 allows a North Dakota broker to divide a commission with a broker
  licensed in another state as long as that broker carries on no negotiations in North Dakota, in
  person or electronically.
citation:
  source: N.D. Admin. Code § 70-02-03-03
  url: null
  quoted_text: >-
    A licensed broker in this state may divide or share a real estate commission with a licensed
    broker

    in another state if the latter broker does not carry on any of the negotiations in this state
    either by

    physically entering the state or by communicating with the broker electronically or through
    other media.
