stem: Under North Dakota rule 70-02-01-21, what must a designated broker maintain regarding the
  types of agency relationships the brokerage may engage in?
options:
  - A written policy identifying and describing those relationships
  - A public online registry listing every past agency relationship
  - A quarterly report submitted directly to the state legislature each year
  - A verbal briefing delivered to new licensees during orientation
key: A
explanation: Rule 70-02-01-21 requires the designated broker to have a written company policy that
  identifies and describes the types of agency relationships the agency may engage in.
