stem: A licensee lists a four-unit apartment building and begins advertising the property before
  obtaining a signed listing agreement from the seller. Under ND Admin Code 70-02-03-04, is this
  permissible?
options:
  - No, unless the property is classified as commercial real estate with five or more units.
  - Yes, as long as the advertisement includes the correct price and commission amount.
  - Yes, if the licensee has a written note from the seller confirming the intent to list.
  - No, because a signed listing agreement must be secured before any advertising.
key: D
explanation: The rule requires a signed listing agreement with a definite expiration date to be
  obtained before the property is advertised or offered for sale. Advertising before securing such
  an agreement violates this requirement. The distractor that focuses only on including price and
  commission in the ad omits the prerequisite of a signed agreement.
citation:
