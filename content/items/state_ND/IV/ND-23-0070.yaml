stem: According to N.D. Admin. Code § 70-02-03-07, when a real estate closing is conducted by an
  attorney, what is the broker's responsibility?
options:
  - The broker must prepare the closing statement personally and provide it to the parties.
  - The broker must ensure the parties receive a complete detailed closing statement and retain true
    copies of it.
  - The broker may delegate the responsibility for the closing statement to the attorney conducting
    the closing.
  - The broker is not responsible for the closing statement when an attorney conducts the closing.
key: B
explanation: The rule states the broker must see the parties receive a complete detailed closing
  statement and retain true copies of it. Preparing the statement personally is not required; the
  broker only must ensure the parties receive it and keep copies.
