stem: "Under N.D. Cent. Code ch. 43-23 § 43-23-14.1, a broker who receives a $5,000 earnest money
  deposit must:"
options:
  - Place the earnest money in a noninterest-bearing trust account
  - Place the earnest money in an interest-bearing escrow account
  - Place the earnest money in the broker's personal checking account
  - Place the earnest money in a title company's trust account
key: A
explanation: Under N.D. Cent. Code ch. 43-23 § 43-23-14.1, a broker must place all funds that are
  not the broker's own and that come into the broker's possession into a separate,
  noninterest-bearing trust account in the broker's or firm's name. Therefore the earnest money
  deposit must be placed in a noninterest-bearing trust account. Placing the funds in an
  interest-bearing account would violate the requirement that the account be noninterest-bearing.
