stem: "Under N.D. Cent. Code ch. 43-23 § 43-23-14.1, a broker who receives a $2,000 earnest money
  deposit must:"
options:
  - The broker must deposit the funds into the broker's personal checking account and track them
    separately.
  - The broker must place the funds in a separate noninterest-bearing trust account immediately.
  - The broker must hold the funds in the broker's escrow account at the title company without
    recording them.
  - The broker must deposit the funds into a trust account but may commingle up to $1,000 of
    personal funds for service charges.
key: B
explanation: N.D. Cent. Code ch. 43-23 § 43-23-14.1 requires brokers to deposit all nonpersonal
  funds into a separate noninterest-bearing trust account immediately and prohibits commingling
  personal funds except for a small specified amount. Depositing into a personal account violates
  the commingling prohibition.
