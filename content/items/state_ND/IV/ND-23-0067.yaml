  url: null
  quoted_text: Except as otherwise provided in this section, every broker, at all times, shall
    maintain in the broker's name or firm name, a separate, noninterest-bearing trust account
    designated as such in a federally insured financial institution in this state in which the
    broker immediately shall place as a demand deposit all funds not the broker's own coming into
    the broker's possession.
