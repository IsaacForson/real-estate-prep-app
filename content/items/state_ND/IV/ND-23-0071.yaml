stem: A North Dakota resident sells her own single-family home without engaging a real estate
  broker. According to N.D. Cent. Code ch. 43-23, which statement is correct regarding licensing
  requirement?
options:
  - Under N.D. Cent. Code ch. 43-23, the transaction requires a license unless the property is
    leased for at least one year.
  - Under N.D. Cent. Code ch. 43-23, the transaction does not require a license because the seller
    is a bona fide owner.
  - Under N.D. Cent. Code ch. 43-23, the transaction requires a license unless the seller is a
    licensed real estate broker.
  - Under N.D. Cent. Code ch. 43-23, the transaction does not require a license if the property is
    classified as agricultural.
key: B
explanation: The statute exempts a bona fide owner who performs acts with reference to property they
  own from the licensing requirement. Therefore no license is needed for the owner’s sale of their
  own home. The distractor claiming all sales require a license ignores this owner exemption.
