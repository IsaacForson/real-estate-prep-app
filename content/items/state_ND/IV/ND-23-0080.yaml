stem: A North Dakota real estate salesperson is notified by the Commission that a statewide and
  nationwide criminal history record check is required as part of a license investigation. According
  to N.D. Cent. Code ch. 43-23 § 43-23-08.4, who is responsible for paying all costs associated with
  obtaining the background check?
options:
  - Payment must be made by the employing broker
  - Payment must be made by the state agency
  - Payment must be made by the Commission
  - Payment must be made by the salesperson
key: D
explanation: The statute places the cost of a background check on the applicant or licensee, so the
  salesperson must pay. The Commission does not bear the expense, nor does the employing broker or
  the state agency unless they are the applicant. Therefore, only the salesperson is responsible.
