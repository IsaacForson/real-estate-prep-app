stem: "Under N.D. Admin. Code § 70-02-01-14, a salesperson may handle the closing of a real estate
  transaction when:"
options:
  - The salesperson may handle the closing when the salesperson has obtained verbal permission from
    the buyer.
  - The salesperson may handle the closing when the salesperson has completed a closing seminar.
  - The salesperson may handle the closing when the salesperson is under the direct supervision of a
    licensed officer.
  - The salesperson may handle the closing when the salesperson works for a broker who is not
    present at the closing.
key: C
explanation: The rule permits a salesperson to handle closing only if under the direct supervision
  of a broker, licensed officer, or licensed partner, or if authorized by their broker. Simply
  completing a closing seminar does not satisfy the supervision requirement.
citation:
  source: N.D. Admin. Code ch. 70-02-01 — North Dakota Administrative Code Chapter 70-02-01,
    Licensing, Trust Accounts, and Complaints — § 70-02-01-14
  url: null
  quoted_text: A salesperson shall not handle the closing of any real estate transaction (unless
    authorized by the salesperson's broker), except under the direct supervision of the broker, a
    licensed officer, or a licensed partner of the corporation or partnership under whom the
    salesperson is licensed.
