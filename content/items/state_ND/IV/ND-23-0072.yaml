stem: An applicant for a North Dakota real estate salesperson license has completed 80 hours of
  commission-approved coursework. According to N.D. Cent. Code ch. 43-23, what is the status of the
  applicant's eligibility for licensure?
options:
  - The applicant is eligible because experience can substitute for the required education.
  - The applicant is not eligible because the 90‑hour education requirement has not been met.
  - The applicant is eligible if the licensing examination is passed.
  - The applicant is not eligible unless the applicant also has two years of salesperson experience.
key: B
explanation: The statute requires a salesperson applicant to furnish evidence of completing at least
  ninety hours of approved coursework before a license may be issued. Having only eighty hours fails
  this prerequisite, so the applicant is not eligible. The distractor suggesting eligibility upon
  passing the exam is incorrect because education completion is mandatory regardless of exam
  results.
