stem: According to N.D. Cent. Code ch. 43-23 § 43-23-08.2, which group of licensees is exempt from
  the continuing education requirements?
options:
  - Licensees who have held a real estate license for fifteen continuous years on January 1, 1984
  - Licensees who are currently serving on active military duty
  - Licensees who have earned a bachelor’s degree in real estate studies from an accredited
    institution
  - Licensees who have not been subject to any disciplinary proceeding
key: A
explanation: The statute explicitly states that licensees who have held a real estate license for
  fifteen continuous years on January 1, 1984, are exempt from the continuing education
  requirements. This exemption is based solely on the length of licensure and the specific date. The
  other options describe situations that are not mentioned as exemptions in the provision.
  Therefore, only the fifteen‑year‑on‑January‑1‑1984 group qualifies.
