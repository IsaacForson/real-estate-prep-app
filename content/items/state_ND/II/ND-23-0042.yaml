stem: Alex, a licensed salesperson, wants to form an LLC that will provide marketing services to
  real estate brokers but will not engage in any real estate transactions. Under N.D. Cent. Code §
  43-23-05.1, which condition must be satisfied for the LLC to be eligible for a license?
options:
  - The LLC must include at least one licensed broker as a member.
  - The LLC must pay a one-time license fee to the commission.
  - The LLC must be owned solely by Alex and his spouse.
  - The LLC must not advertise or portray itself as a real estate brokerage.
key: D
explanation: Section 43-23-05.1(c) explicitly states that an organization seeking a license must not
  advertise or otherwise portray to the public that it is a real estate broker or brokerage firm.
  This condition is independent of ownership structure or the inclusion of a licensed broker. While
  the LLC must also meet ownership and activity restrictions, the advertising prohibition is a
  distinct mandatory condition. Paying a one-time fee is permissive, not a condition for
  eligibility.
