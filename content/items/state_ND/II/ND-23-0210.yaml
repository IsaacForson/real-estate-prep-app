stem: By what date must a licensee submit a renewal application to avoid late fees and ensure timely
  renewal in North Dakota?
options:
  - November fifteenth of each year
  - December thirty-first of each year
  - January fifteenth of each year
  - October thirty-first of each year
key: A
explanation: Under N.D. Admin. Code § 70-02-01-04, a renewal application must be submitted on or
  before November 15 to be considered timely. Submitting after this date results in late fees and
  possible loss of commission rights after December 31. Therefore, the correct deadline is November
  fifteenth of each year. The distractor of December thirty-first is incorrect because that is the
  expiration date, not the filing deadline.
citation:
  source: N.D. Admin. Code ch. 70-02-01 — North Dakota Administrative Code Chapter 70-02-01,
