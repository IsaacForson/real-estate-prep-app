stem: Tom has held a real estate salesperson license for twelve years and is applying for license
  renewal. He has no health issues, military service, or other good cause. Which of the following is
  true about his continuing education obligation?
options:
  - They must submit proof of participation in approved continuing education as determined by the
    commission.
  - They need not submit any proof of continuing education if they have active sales.
  - They are exempt from continuing education because they have held a license for more than ten
    years.
  - They are exempt from continuing education due to documented health issues verified by a
    physician.
key: A
explanation: Subsection 1 of § 43-23-08.2 requires renewal applicants to submit proof of approved
  continuing education as set by the commission. Exemptions for health, military service, or good
  cause do not apply, and the fifteen‑year exemption is limited to those licensed continuously since
  January 1, 1984.
