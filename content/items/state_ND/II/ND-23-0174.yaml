stem: A broker submits her renewal application on November 10, includes the required fee, and a
  certificate of completion for a continuing education course. However, the course is not on the
  commission's approved list. According to N.D. Cent. Code § 43-23-08.2, what is the status of her
  application?
options:
  - Application is considered proper because the fee was submitted
  - Application is not proper because proof must be from an approved course
  - Application is proper but the broker must pay an additional fee
  - Application is proper but the broker must retake the course
key: B
explanation: The commission must approve continuing education courses, and proof must be from an
  approved course; if the course is not approved, the application lacks proper proof and is not
  considered proper. The most tempting distractor is Application is proper but the broker must pay
  an additional fee because no provision allows a fee to substitute for unapproved course proof.
