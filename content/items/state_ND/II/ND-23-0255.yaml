stem: Jane, who does not hold a real estate license, helps a friend sell a house and receives a
  $4,500 commission. What is the legal consequence under N.D. Cent. Code § 43-23-05 regarding her
  entitlement to that commission?
options:
  - She may retain the commission as payment for her help.
  - She must return the commission to the friend.
  - She is not entitled to collect the commission.
  - She may keep the commission if she later becomes licensed.
key: C
explanation: Under N.D. Cent. Code § 43-23-05, a person is not entitled to collect any fees,
  compensation, or commission as a real estate broker or salesperson without first meeting licensing
  requirements. Therefore, Jane has no legal right to keep the $4,500 commission. The option
  suggesting she must return the commission introduces a remedy not stated in the statute, while the
  other options incorrectly imply she may retain the commission under certain conditions.
