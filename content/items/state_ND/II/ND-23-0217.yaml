stem: A broker associate affiliated with a supervising broker conducts a showing for a prospective
  buyer without obtaining the supervising broker's consent. Is this permissible under N.D. Admin.
  Code § 70-02-01-09?
options:
  - No, unless the prospective buyer is a close relative of the broker associate and the transaction
    is exempt from agency disclosure.
  - Yes, if the broker associate holds a separate broker's license in another state and maintains
    active status there.
  - Yes, as long as the broker associate discloses the showing to the supervising broker within 24
    hours and documents the disclosure in writing.
  - No, because a broker associate must not perform any real estate service without full consent and
    knowledge of the supervising broker.
key: D
explanation: The rule states that a broker associate must not perform any real estate service
  without full consent and knowledge of the supervising broker (see N.D. Admin. Code § 70-02-01-09).
  Therefore, conducting a showing without prior consent is impermissible. The option suggesting that
  the broker associate may disclose the showing within 24 hours and document it in writing is
  incorrect because after-the-fact disclosure does not satisfy the prior consent requirement.
citation:
  source: N.D. Admin. Code ch. 70-02-01 — North Dakota Administrative Code Chapter 70-02-01,
    Licensing, Trust Accounts, and Complaints — § 70-02-01-09
  url: null
  quoted_text: A real estate broker who does not have an office under the broker's own name, but is
    affiliated with another licensed broker and performs service similar to that of a salesperson,
    must not at any time act independently as a broker, and shall not perform any real estate
    service without full consent and knowledge of the broker's supervising broker.
