stem: What is the definition of a 'designated broker'?
options:
  - A person that has entered a written agency agreement with a real estate brokerage firm for
    representation in transactions.
  - A buyer, prospective buyer, seller, lessee, or lessor that is not represented by that real
    estate brokerage firm in a real property transaction.
  - A licensee appointed by a designated broker to act solely for a client of that brokerage firm to
    the exclusion of other licensees of that brokerage firm.
  - A licensee designated by a real estate brokerage firm to act on behalf of the brokerage firm in
    all brokerage activities.
key: D
explanation: "The definition of 'designated broker' is a licensee designated by a real estate
  brokerage firm to act on behalf of the brokerage firm in all brokerage activities, as defined in
  N.D. Cent. Code § 43-23-06.1. The other options describe different roles: a person who has entered
  a written agency agreement with a brokerage firm for representation; a buyer, prospective buyer,
  seller, lessee, or lessor not represented by that firm; and a licensee appointed by a designated
  broker to act solely for a client of that brokerage firm to the exclusion of other licensees."
