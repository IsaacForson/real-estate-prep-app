stem: Which of the following describes a situation that complies with the requirement for a real
  estate broker's place of business under N.D. Cent. Code § 43-23-12?
options:
  - A broker who conducts all transactions exclusively online with no physical office in North
    Dakota.
  - A broker who maintains a physical office in North Dakota where real estate business is
    transacted.
  - A broker who uses a friend's office in another state as the place of business for North Dakota
    clients.
  - A broker who lists a post office box in North Dakota as the place of business without a physical
    office.
key: B
explanation: The rule requires every broker to have and maintain a definite place of business within
  the state for transacting real estate business. Maintaining a physical office in North Dakota
  satisfies this requirement. Conducting business exclusively online with no physical office, using
  an out‑of‑state office, or listing only a post office box do not fulfill the definite
  place‑of‑business mandate.
