stem: A licensee has written agency agreements with two different buyers who both want to make an
  offer on the same property. According to N.D. Cent. Code § 43-23-12.1(5), what must the licensee
  do regarding the competing offers?
options:
  - Tell each buyer about the other's competing written offer
  - Keep the competing offers secret unless both buyers agree
  - Inform the broker only about the competing offers
  - Submit both offers at once without revealing them
key: A
explanation: The rule requires the licensee to disclose to competing buyer clients that a competing
  written offer has been submitted by another buyer client of that licensee. Keeping the offers
  secret or only informing the broker fails to meet this disclosure duty.
citation:
  source: N.D. Cent. Code § 43-23-12.1(5)
  url: null
  quoted_text: However, if an individual licensee has a written agency agreement with two or more
    buyers that desire to make an offer for the purchase or lease of the same real property, that
    licensee shall disclose to those competing buyer clients the fact that a competing written offer
    has been submitted by another buyer client of that licensee.
