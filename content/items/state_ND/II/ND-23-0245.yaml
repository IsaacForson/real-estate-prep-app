stem: Under N.D. Cent. Code § 43-23-10, what happens to a salesperson's license if they change
  brokers without notifying the commission?
options:
  - The license is automatically cancelled.
  - The license remains active but requires a fine.
  - The license is placed on inactive status.
  - The license is suspended for thirty days.
key: A
explanation: The rule states that a change of broker by a licensed salesperson without notice to the
  commission automatically cancels that person's license. Therefore, the license is cancelled, not
  merely fined or placed on inactive status. The distractor about a fine is incorrect because the
  statute provides for automatic cancellation, not a monetary penalty.
