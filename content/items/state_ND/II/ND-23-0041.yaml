stem: According to N.D. Cent. Code § 43-23-05, a person is **NOT** entitled to collect any fees,
  compensation, or commission as a real estate broker or salesperson without having first done what?
options:
  - Completed a prelicensing education course.
  - Obtained a license from the real estate commission.
  - Passed the state real estate examination.
  - Joined a brokerage firm as an associate.
key: B
explanation: Under N.D. Cent. Code § 43-23-05, a person may not collect fees, compensation, or
  commission as a broker or salesperson without first complying with the chapter’s licensing
  requirements, which include obtaining a license from the real estate commission. Therefore,
  obtaining a license is the prerequisite for earning compensation. Completing a prelicensing course
  or passing the exam alone does not satisfy the statutory requirement to be licensed. Joining a
  brokerage firm does not override the need for an individual license.
