stem: A licensee wishes to transfer to a new broker, but the current broker refuses to agree to the
  transfer without providing a justified reason. According to N.D. Admin. Code § 70-02-01-08, what
  is the outcome?
options:
  - The transfer will be denied because the current broker refused.
  - The transfer will be automatically approved without any forms.
  - The transfer will require a new license application.
  - The transfer will be pending until the transfer form and fee are submitted.
key: D
explanation: Unless the current broker provides sufficient justification for refusal, the license
  will be transferred pending receipt of the transfer form and fee. Since the broker refused without
  offering a justified reason, there is insufficient justification, so the transfer proceeds once
  the form and fee are submitted. The option claiming automatic approval ignores the required form
  and fee, and the option claiming denial contradicts the provision that lack of justification does
  not block the transfer.
