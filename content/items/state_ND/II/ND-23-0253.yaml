stem: A broker terminates a salesperson's supervision on Monday but does not notify the commission
  in writing until Thursday. Under N.D. Cent. Code § 43-23-10, is the broker's action permissible?
options:
  - C) Yes, as long as the salesperson does not perform any licensed acts.
  - B) No, because the broker must notify the commission immediately.
  - D) No, unless the broker obtains a written waiver from the commission.
  - A) Yes, because the broker has up to five days to notify.
key: B
explanation: The rule requires the broker to notify the commission "immediately" upon termination of
  supervision. Waiting three days violates this immediate notice requirement. The distractor about
  five days incorrectly applies the notice period for broker changes to this situation.
