stem: A salesperson's license has been on inactive status for one full continuing education period.
  To reactivate the license, how many hours of continuing education must the salesperson complete,
  assuming the standard requirement is twelve hours per period?
options:
  - Twenty-four hours of continuing education
  - Six hours of continuing education
  - Twelve hours of continuing education
  - Thirty-six hours of continuing education
key: C
explanation: N.D. Admin. Code § 70-02-01-05 requires that to reactivate an inactive license, the
  licensee must complete the continuing education hours for each period the license was inactive,
  subject to a three‑period cap. For one inactive period, this equals twelve hours. Therefore,
  twelve hours of continuing education are needed. The option of six hours is incorrect because it
  does not meet the hourly requirement per period.
