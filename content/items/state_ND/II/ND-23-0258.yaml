stem: An applicant for a broker's license has never worked as a licensed salesperson because there
  are no real estate firms in their remote area. Under N.D. Cent. Code § 43-23-08(5), what may the
  commission do regarding the experience requirement?
options:
  - The commission requires the applicant to complete additional education instead of experience.
  - The commission may deny the application because the applicant lacks salesperson experience.
  - The commission may waive the experience requirement due to local employment conditions.
  - The commission may reduce the required experience period to one year.
key: C
explanation: The statute permits the commission to waive the experience requirement if the applicant
  cannot obtain salesperson employment due to area conditions; it does not mandate denial,
  substitute education, or reduce to a specific period.
citation:
  source: N.D. Cent. Code § 43-23-08(5)
  url: null
  quoted_text: If the commission finds an applicant could not acquire employment as a licensed real
    estate salesperson because of conditions existing in the area where the salesperson resides, the
    experience requirements established in subdivisions a and b of subsection 3 may be waived by the
    commission.
