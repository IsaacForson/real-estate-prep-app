stem: A salesperson's supervision by their broker ends on Friday, but the salesperson continues to
  conduct open houses on Saturday without obtaining a new broker's supervision. According to N.D.
  Cent. Code § 43-23-10, is the salesperson's action permissible?
options:
  - The salesperson's action is permissible as long as no commission is collected.
  - The salesperson's action is unlawful until the license is reissued to a new broker.
  - The salesperson's action is permissible because the license remains active.
  - The salesperson's action is allowed if they have written permission from the former broker.
key: B
explanation: The statute makes it unlawful for a salesperson to perform any acts contemplated by the
  chapter after supervision by a broker has been terminated, until the license is reissued to a new
  broker. Thus, conducting open houses without new supervision is prohibited. The distractor
  claiming permissibility due to an active license ignores the supervision requirement.
citation:
  source: N.D. Cent. Code § 43-23-10
  url: null
  quoted_text: It is unlawful for any real estate salesperson to perform any of the acts contemplated
    by this chapter either directly or indirectly after that person's supervision by a broker has
    been terminated, until the license has been reissued by the commission to a new broker.
