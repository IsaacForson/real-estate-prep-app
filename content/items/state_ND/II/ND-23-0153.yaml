stem: What must be submitted with a license renewal application to demonstrate compliance with
  continuing education requirements?
options:
  - Pay the renewal fee and provide no further documentation
  - Obtain a new sponsoring broker and pay the renewal fee
  - Submit proof of continuing education completion for the inactive period
  - Retake the prelicensing examination and submit proof of education
key: C
explanation: The renewal application must be accompanied by certification showing fulfillment of
  continuing education requirements; without it, the license may not be renewed. Paying the fee
  alone is insufficient because the certification is also mandatory.
