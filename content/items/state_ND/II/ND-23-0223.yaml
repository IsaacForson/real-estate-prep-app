stem: Under N.D. Cent. Code § 43-23-08(1), which individual is eligible to apply for a real estate
  license in North Dakota?
options:
  - A. A person whose license was revoked 6 months ago and is applying today.
  - B. A person whose license was revoked 18 months ago and is applying today.
  - C. A person whose license was revoked 30 months ago and is applying today.
  - D. A person whose license was revoked 12 months ago and is applying today.
key: C
explanation: The statute bars licensure for anyone whose real estate license has been revoked within
  two years before the application date. A revocation 30 months prior falls outside that two‑year
  window, so the person is eligible. The other options describe revocations within the two‑year
  period, which disqualify the applicant.
