  url: null
  quoted_text: The application for renewal must be accompanied by such certification as required by
    this chapter and rules of the commission to show compliance with the educational requirements of
    sections 43-23-08 and 43-23-08.2, and must be submitted to the commission with the appropriate
    fee no later than the application deadline set by the commission.
