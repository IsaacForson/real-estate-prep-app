stem: A broker submits her renewal application on November 10, includes the required fee, but
  forgets to attach the continuing education certificate. According to N.D. Cent. Code § 43-23-13.1,
  what is the status of her application for the upcoming license period?
options:
  - License not renewed timely because application lacks required certification
  - License renewed timely because fee submitted before November fifteenth
  - License renewed but broker may not charge commission after December thirty-first
  - License automatically canceled and must reapply for licensure
key: A
explanation: The renewal application must be accompanied by certification showing compliance with
  continuing education and submitted by the deadline; without that certification the application is
  not proper, so the license will not be renewed timely. The most tempting distractor is License
  renewed timely because fee submitted before November fifteenth because timely fee submission alone
  does not satisfy the certification requirement.
citation:
