stem: Which of the following licensees is exempt from the continuing education requirement under
  N.D. Cent. Code § 43-23-08.2?
options:
  - A licensee who has held a license for ten continuous years as of January 1, 1984.
  - A licensee who has held a license for fifteen continuous years as of January 1, 1984.
  - A licensee who has held a license for fifteen continuous years as of January 1, 2000.
  - A licensee who has held a license for twenty continuous years as of January 1, 1984.
key: B
explanation: The statute exempts licensees who have held a real estate license for fifteen
  continuous years on January 1, 1984 from continuing education requirements. Therefore, only the
  licensee meeting that fifteen‑year threshold as of that date is exempt. The option citing ten
  years fails to meet the required duration, while the option citing twenty years exceeds the
  specific fifteen‑year specification.
