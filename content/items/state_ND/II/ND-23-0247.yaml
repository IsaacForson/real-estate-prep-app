stem: A person advertises their services as a real estate broker in North Dakota but does not hold a
  license. According to N.D. Cent. Code § 43-23-05, is this action permissible?
options:
  - The action is permissible after providing a disclaimer of unlicensed status.
  - The action is permissible if advertising only, with no brokerage acts performed.
  - The action is prohibited because a license is required to act as a broker.
  - The action is permissible if no compensation is received and no brokerage acts are performed.
key: C
explanation: The law prohibits a person from acting as or advertising as a real estate broker
  without a license. Advertising broker services without a license is therefore not allowed,
  regardless of compensation or disclaimers. The distractor suggesting that advertising only is
  permissible misreads the ban on advertising as a broker.
citation:
  source: N.D. Cent. Code § 43-23-05
  url: null
  quoted_text: A person may not act as a real estate broker or real estate salesperson, or advertise
    or assume to act as a real estate broker or real estate salesperson, without a license issued by
    the real estate commission.
