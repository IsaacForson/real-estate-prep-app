stem: A licensee leaves Broker X and later uses a listing agreement obtained while at Broker X to
  represent a client, without specific authorization from Broker X. Under N.D. Admin. Code §
  70-02-01-10, is this permitted?
options:
  - Under the rule, the licensee's action is permissible because the agreement was obtained during
    employment.
  - Under the rule, the licensee's action is permissible if the licensee informs the new broker.
  - Under the rule, the licensee's action is not permissible because use of former broker's
    agreements requires specific authorization.
  - Under the rule, the licensee's action is permissible if the agreement is for a different
    property type.
key: C
explanation: The rule explicitly forbids a licensee from using agreements secured through a former
  broker unless specifically authorized by that former broker, so using the listing agreement
  without authorization is prohibited. Merely informing the new broker does not satisfy the
  authorization requirement.
