stem: Which of the following is required for a person to act as a real estate broker in North Dakota?
options:
  - A license issued by the real estate commission
  - A bachelor's degree in business administration
  - A membership in the local Realtors association
  - A two-year experience as a licensed salesperson
key: A
explanation: Under N.D. Cent. Code § 43-23-05, a person may not act as a real estate broker or
  salesperson without a license issued by the real estate commission. This establishes the licensing
  requirement. The distractor about a bachelor's degree is incorrect because the statute does not
  mention educational prerequisites for licensure.
