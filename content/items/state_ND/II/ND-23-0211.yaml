stem: A broker fails to submit a renewal application by the commission's established late renewal
  date. According to N.D. Cent. Code § 43-23-13.1, what is the status of the broker's license?
options:
  - The license is renewed after a late fee is paid
  - The license is canceled without notice or opportunity for hearing
  - The license is placed on inactive status pending renewal
  - The broker may continue practicing while awaiting review
key: B
explanation: According to N.D. Cent. Code § 43-23-13.1, if a license is not renewed by the
  commission's late renewal date, it must be canceled. The cancellation occurs without notice or
  opportunity for a hearing. Thus, the broker's license is canceled under those circumstances. The
  option suggesting automatic renewal with a late fee is incorrect because renewal is not possible
  after the late date.
