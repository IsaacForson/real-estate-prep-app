stem: What must a licensee do if their license has been canceled for failure to renew it when due in
  order to be licensed again?
options:
  - Complete twelve hours of continuing education and pay a penalty fee
  - Request a hearing before the commission to reinstate the license
  - Pay only the renewal fee and submit continuing education proof
  - Submit a new application with fees and pass the examinations
key: D
explanation: According to N.D. Admin. Code § 70-02-01-04, any person whose license has been canceled
  for failure to renew must submit a new application with the fees and pass the examinations to be
  licensed again. The other options omit either the application, fees, or examination requirement.
