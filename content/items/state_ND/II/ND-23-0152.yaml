stem: Under N.D. Admin. Code § 70-02-01-09, a broker associate must **NOT** at any time act
  independently as a broker unless what condition is met?
options:
  - The broker associate must have received full consent and knowledge of the supervising broker.
  - The broker associate must have obtained a separate broker's license.
  - The broker associate must have notified the commission in writing.
  - The broker associate must have completed additional continuing education hours.
key: A
explanation: The rule states a broker associate shall not perform any real estate service without
  full consent and knowledge of the supervising broker, so acting independently as a broker requires
  that consent and knowledge. Obtaining a separate broker's license is not required by this
  provision.
