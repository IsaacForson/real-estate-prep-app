stem: A salesperson has kept their license on inactive status for four continuing education periods.
  To reactivate the license, how many hours of continuing education must the salesperson complete,
  given that the requirement is twelve hours per period but **NOT** more than the equivalent of
  three periods?
options:
  - A continuing education requirement of 36 hours
  - A continuing education requirement of 24 hours
  - A continuing education requirement of 48 hours
  - A continuing education requirement of 12 hours
key: A
explanation: N.D. Admin. Code § 70-02-01-05 requires that to reactivate an inactive license, the
  licensee must complete continuing education hours for each inactive period, but not more than the
  hours required for the three periods prior to reactivation. With twelve hours per period, three
  periods equal 36 hours. Although the license was inactive for four periods, the maximum required
  is 36 hours.
citation:
  source: N.D. Admin. Code ch. 70-02-01 — North Dakota Administrative Code Chapter 70-02-01,
