stem: Maria has been a licensed real estate salesperson in North Dakota for 20 months and is
  applying for a broker license. According to N.D. Cent. Code § 43-23-08(3), which statement is
  correct about her eligibility?
options:
  - She must complete an additional sixty hours of coursework before she can be considered.
  - She may qualify if the commission finds her experience substantially equal to two years of
    salesperson experience.
  - She does not qualify because she has less than two years of salesperson experience.
  - She qualifies because she has been actively engaged as a licensed salesperson for at least two
    years.
key: B
explanation: Under N.D. Cent. Code § 43-23-08(3), a broker applicant may qualify either by having
  two years of salesperson experience or by demonstrating experience that the commission finds
  substantially equal to two years. Maria’s 20 months of experience may meet the commission’s
  substantial‑equality standard, so the statement that she may qualify if the commission finds her
  experience substantially equal to two years is correct. The statement that she does not qualify
  because she has less than two years of experience is incorrect because the commission can accept
  experience that is substantially equal to two years.
