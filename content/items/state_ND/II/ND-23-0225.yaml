stem: Thomas first obtained his North Dakota real estate license on March 1, 1969 and has maintained
  it continuously without lapse. As of January 1, 1984, is Thomas exempt from the continuing
  education requirement under N.D. Cent. Code § 43-23-08.2(3)?
options:
  - A. Yes, because he had held the license for fifteen continuous years as of January 1, 1984.
  - B. Yes, because the commission may exempt licensees for health or military service.
  - C. No, because he must first complete ninety hours of salesperson education.
  - D. No, because he had held the license for less than fifteen continuous years as of January 1,
    1984.
key: D
explanation: The statute exempts only those who have held a real estate license for fifteen
  continuous years on January 1, 1984. Thomas’s license tenure from March 1, 1969 to January 1, 1984
  is 14 years and 10 months, which is under the fifteen‑year threshold, so he is not exempt. The
  option stating that he is exempt because he had held the license for fifteen continuous years as
  of January 1, 1984 is incorrect, as is the option stating that he is exempt because the commission
  may exempt licensees for health or military service. The option stating that he is not exempt
  because he must first complete ninety hours of salesperson education introduces an unrelated
  requirement.
