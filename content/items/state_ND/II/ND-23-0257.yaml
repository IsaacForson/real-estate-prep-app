stem: A licensee has a serious health condition that prevents them from attending continuing
  education courses. Under N.D. Cent. Code § 43-23-08.2(3), what is the most accurate statement
  regarding their continuing education requirement for license renewal?
options:
  - The commission may waive the continuing education requirement for any licensee citing health
    issues.
  - The commission may exempt the licensee from the continuing education requirement for health
    reasons.
  - The licensee is required to complete the continuing education requirement regardless of health
    status.
  - The licensee is permanently exempt from continuing education due to health condition.
key: B
explanation: The statute allows the commission to exempt licensees for health, military service, or
  other good cause; it does not mandate automatic waiver, nor does it guarantee exemption. The
  option stating that the commission may exempt the licensee from the continuing education
  requirement for health reasons correctly reflects this discretionary authority.
