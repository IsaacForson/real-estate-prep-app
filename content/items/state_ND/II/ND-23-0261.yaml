stem: A licensee is notified by the commission to submit a statewide criminal history record check
  as part of a licensure investigation. Who is responsible for the costs associated with obtaining
  the background check under N.D. Cent. Code § 43-23-08.4?
options:
  - The employing broker who supervises the licensee
  - The state of North Dakota that oversees the commission
  - The commission that issued the license
  - The licensee who is subject to the investigation
key: D
explanation: The statute explicitly states that all costs associated with obtaining a background
  check are the responsibility of the applicant or licensee. Therefore, the licensee bears the cost.
  The commission does not assume these expenses under this provision.
