stem: According to N.D. Admin. Code § 70-02-01-07, what must the designated broker do upon release
  of a license due to cancellation, transfer, suspension, or revocation?
options:
  - The designated broker must destroy the license and remove the licensee's name and number from
    the broker's website, and if the license is that of a broker, also release all licensees
    associated with the broker.
  - The designated broker must forward the license to the commission for reissuance, notify the
    licensee of the renewal deadline, and submit a duplicate copy for record.
  - The designated broker may retain the license for personal records, inform the licensee verbally
    of the cancellation, and file a notice with the county clerk.
  - The designated broker must sell the license to another licensee, submit a transfer fee to the
    commission, and provide a written affidavit of compliance.
key: A
explanation: The designated broker must destroy the physical license and remove the licensee's name
  and number from the broker's website; if the license belongs to a broker, the broker must also
  release all licensees associated with the broker. No refund is permitted. Suggesting that the
  designated broker forward the license to the commission for reissuance is not required by the
  rule.
citation:
  source: N.D. Admin. Code ch. 70-02-01 — North Dakota Administrative Code Chapter 70-02-01,
    Licensing, Trust Accounts, and Complaints — § 70-02-01-07
  url: null
  quoted_text: Upon release of license or upon notice of suspension, revocation, or cancellation of
    the license, the designated broker shall destroy the license and remove the licensee's name and
    licensee's number from the broker's website. If the license is that of a broker, the broker
    shall also release all licensees associated with the broker. No refund will be made upon any
    license when released.
