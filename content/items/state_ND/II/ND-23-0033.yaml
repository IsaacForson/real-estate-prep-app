stem: Under N.D. Cent. Code § 43-23-05.1, which condition must be met for an organization owned
  solely by a licensed salesperson to be eligible for a license?
options:
  - The organization must employ at least one unlicensed assistant to perform brokerage duties
  - The organization must advertise as a brokerage firm to attract clients in the state
  - The organization must not engage in real estate transactions requiring a license under this
    chapter
  - The organization must be owned by at least two licensed brokers in the same firm
key: C
explanation: "The statute requires that an organization owned solely by a licensed salesperson may
  be licensed only if it does not conduct any real‑estate transactions that would require a license,
  such as acting as a third‑party agent. That is why the statement that the organization must not
  engage in real‑estate transactions requiring a license satisfies the code. The other answer
  choices describe requirements that are not found in the statute: employing an unlicensed
  assistant, advertising as a brokerage firm, or being owned by two licensed brokers."
