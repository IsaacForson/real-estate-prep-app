stem: Jordan owns a single-family home and advertises it for lease, handling all inquiries and
  showing the property personally. According to N.D. Cent. Code § 43-23-07(1)(a), which statement is
  correct regarding Jordan's need for a real estate broker's license?
options:
  - Jordan is required to hold a broker's license because advertising a lease is a real estate
    brokerage activity.
  - Jordan is not required to hold a broker's license because residential lease activities are
    exempt from licensing requirements.
  - Jordan is not required to hold a broker's license because Jordan is a bona fide owner performing
    acts incident to the management of owned property.
  - Jordan is required to hold a broker's license unless Jordan hires a licensed property manager to
    handle the lease.
key: C
explanation: The North Dakota Century Code exempts a bona fide owner who performs acts that are
  incident to the management of owned property from the broker‑license requirement. Since Jordan is
  the owner and is handling the lease advertising and showings himself, those acts are considered
  incident to management, so Jordan does not need a broker’s license. The statement that advertising
  a lease always requires a license is incorrect because it overlooks this owner exemption.
citation:
  source: N.D. Cent. Code § 43-23-07(1)(a)
  url: null
  quoted_text: Any person, partnership, association, corporation, or limited liability company who is
    a bona fide owner or lessor or who accepts or markets leasehold interests in residential or
    agricultural property and performs any of the aforesaid acts with reference to property owned or
    leased by them, nor does it apply to regular employees thereof, when the acts are performed in
    the regular course of or as an incident to the management of the property and the investment
    therein.
