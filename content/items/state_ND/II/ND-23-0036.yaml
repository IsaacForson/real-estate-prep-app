stem: What must an applicant for a nonresident broker license in North Dakota first possess
  according to N.D. Admin. Code § 70-02-01-06?
options:
  - The applicant must hold a currently valid broker's license in the home state and obtain
    certification of good standing
  - The applicant must complete a state-approved North Dakota prelicensure course before applying
  - The applicant must have a reciprocal agreement with North Dakota from their home state
  - The applicant must maintain an active place of business in North Dakota for conducting brokerage
    activities
key: A
explanation: N.D. Admin. Code § 70-02-01-06(2) requires the applicant to hold a currently valid
  broker's or salesperson's license in the state of principal place of business and have that state
  certify good standing and no pending complaints. This matches the requirement that the applicant
  hold a currently valid broker's license in the home state and obtain certification of good
  standing. The claim that the applicant must have a reciprocal agreement with North Dakota from
  their home state is incorrect because the rule does not require such an agreement. The claim that
  the applicant must complete a state-approved North Dakota prelicensure course before applying is
  incorrect because the rule waives the prelicensure course for those already licensed in another
  state. The claim that the applicant must maintain an active place of business in North Dakota for
  conducting brokerage activities is incorrect because the rule does not mandate a physical place of
  business in the state.
