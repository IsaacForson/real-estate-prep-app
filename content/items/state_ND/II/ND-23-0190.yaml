stem: What is the definition of a 'client' in the context of real estate brokerage?
options:
  - A person that has entered a written agency agreement with a real estate brokerage firm.
  - A person that is represented by a real estate brokerage firm in a transaction.
  - A person that has entered an oral agency agreement with a real estate brokerage firm.
  - A person that has entered a written agency agreement with a licensed real estate salesperson.
key: A
explanation: The statute defines a client as a person who has entered a written agency agreement
  with a real estate brokerage firm. The option stating that a client is a person represented by a
  firm in a transaction omits the written agreement requirement, which is essential for the
  definition.
