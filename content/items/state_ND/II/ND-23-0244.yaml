stem: What is the maximum number of continuing education periods for which a licensee must complete
  continuing education to reactivate an inactive license in North Dakota?
options:
  - 4 periods
  - 3 periods
  - 2 periods
  - 1 periods
key: B
explanation: According to N.D. Admin. Code § 70-02-01-05, when reactivating an inactive license the
  licensee must complete continuing education for each inactive period but not more than the
  equivalent of three periods. This establishes three periods as the maximum required. Choosing four
  periods would exceed the limit set by the rule.
