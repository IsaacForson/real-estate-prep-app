  url: null
  quoted_text: To reactivate an inactive license, a licensee must meet the continuing education hours
    as required by section 70-02-04-02 for each continuing education period the licensee's license
    was inactive, not to exceed the number of hours required for the three continuing education
    periods prior to reactivation.
