stem: "According to N.D. Admin. Code § 70-02-01-09, a broker associate who is affiliated with
  another licensed broker must **not** at any time:"
options:
  - Share commissions with unlicensed assistants who refer clients without authorization.
  - Act independently as a broker without the supervising broker's consent and knowledge.
  - Perform real estate services without first obtaining a separate broker's license.
  - Advertise services under a name different from the supervising broker's firm name.
key: B
explanation: Under N.D. Admin. Code § 70-02-01-09, a broker associate affiliated with another broker
  must not act independently as a broker and must not perform any real estate service without the
  supervising broker's full consent and knowledge. Therefore, acting independently as a broker
  without that consent and knowledge is prohibited. The associate does not need a separate broker's
  license to perform services under supervision, nor is sharing commissions with unlicensed
  assistants addressed by this specific provision; advertising under a different name is also not
  covered by this rule.
