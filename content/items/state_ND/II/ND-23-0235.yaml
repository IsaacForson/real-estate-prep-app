stem: Within how many days must a licensed real estate salesperson provide written notice to the
  North Dakota Real Estate Commission when changing brokers?
options:
  - Three days
  - Five days
  - Seven days
  - Ten days
key: B
explanation: The statute requires prompt notice in writing within five days of a broker change;
  failure to do so results in automatic cancellation of the license. The other options are incorrect
  because the law specifies five days, not three, seven, or ten.
