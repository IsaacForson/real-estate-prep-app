stem: What is the maximum fee that the North Dakota Real Estate Commission may set for an individual
  broker's license application or renewal?
options:
  - A fee of $150
  - A fee of $200
  - A fee of $250
  - A fee of $300
key: B
explanation: Under N.D. Cent. Code § 43-23-13(1), the commission may set a fee of not more than two
  hundred dollars for a broker's license application and each annual renewal. Therefore, the maximum
  allowable fee is $200. The $150 option is below the statutory maximum, while $250 and $300 exceed
  the limit.
