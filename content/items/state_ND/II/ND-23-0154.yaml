stem: A salesperson starts showing properties for a broker on Monday, but the broker has not yet
  received notification of the salesperson's licensure from the commission. Under N.D. Admin. Code §
  70-02-01-10, is the salesperson's action permissible?
options:
  - Under the rule, the salesperson's action is permissible if the salesperson acts only as a
    customer service representative.
  - Under the rule, the salesperson's action is not permissible because work may not begin before
    broker notification.
  - Under the rule, the salesperson's action is permissible if the salesperson has completed the
    required education.
  - Under the rule, the salesperson's action is permissible because the broker can supervise
    retroactively.
key: B
explanation: The rule prohibits a salesperson from commencing work until the broker receives
  notification of licensure from the commission, so starting work before that notification is not
  allowed. Completing required education does not override this notification requirement.
citation:
  source: "### N.D. Admin. Code ch. 70-02-01 — North Dakota Administrative Code Chapter 70-02-01,
    Licensing, Trust Accounts, and Complaints — § 70-02-01-10"
  url: null
  quoted_text: A salesperson shall not commence work until the salesperson's broker receives
    notification of licensure from the commission.
