stem: What happens to a firm license when the designated broker places their individual license on
  inactive status and no other broker is designated?
options:
  - The firm license is placed on inactive status alongside the broker's license.
  - The firm license must be renewed with a continuing education certificate.
  - The firm license is automatically canceled unless another broker is designated.
  - The firm license remains active and requires no further action.
key: C
explanation: Under N.D. Admin. Code ch. 70-02-01 - § 70-02-01-05, when a designated broker's license
  is placed on inactive status and no other broker is designated, the firm license is automatically
  canceled. The firm license does not stay on inactive status with the broker's license; it is
  canceled if no replacement broker is named. It does not need renewal with continuing education;
  its status depends on having an active designated broker. The firm license does not remain active
  without action; it is canceled.
