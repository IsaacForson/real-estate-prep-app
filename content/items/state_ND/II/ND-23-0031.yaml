stem: A licensee submits their renewal application on November 20. According to N.D. Admin. Code §
  70-02-01-04, what is the consequence for the upcoming license period?
options:
  - The license will be renewed on time and the licensee may charge commissions for the entire
    period.
  - The license will be renewed but the licensee may not charge a commission and may face
    prosecution after December thirty-first.
  - The license will be renewed and the licensee may charge commissions but must pay a late fee.
  - The license will be canceled and the licensee must submit a new application and pass the exam.
key: B
explanation: The rule states that applications must be submitted on or before November fifteenth for
  timely renewal; failing to do so results in loss of the right to charge a commission and possible
  prosecution for unlicensed activity after December thirty-first. Submitting on November twenty
  misses the deadline, triggering those penalties. The other options either ignore the penalty or
  incorrectly describe the outcome.
citation:
  source: N.D. Admin. Code ch. 70-02-01 — North Dakota Administrative Code Chapter 70-02-01,
    Licensing, Trust Accounts, and Complaints — § 70-02-01-04
  url: null
  quoted_text: Persons desiring to continue in business must make proper application for renewal on or
    before November fifteenth of each year in order for the respective license to be renewed on a
    timely basis for the following license period. Failing to do this subjects such persons to loss
    of the right to charge a commission and also prosecution for doing business without a license
    after December thirty-first.
