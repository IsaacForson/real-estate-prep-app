stem: Under N.D. Cent. Code § 43-23-11.1(1)(q), from whom may a real estate salesperson accept a
  commission or valuable consideration for performing acts specified in this chapter?
options:
  - The buyer or seller directly
  - Any party to the transaction
  - Any licensed broker in the state
  - The employing broker only
key: D
explanation: The rule states a salesperson may accept commission only from the employing broker, not
  from any other person. The distractor suggesting any licensed broker is incorrect because the
  statute limits the source to the specific broker under whom the salesperson is licensed.
citation:
  source: N.D. Cent. Code § 43-23-11.1(1)(q)
  url: null
  quoted_text: Accepting a commission or valuable consideration as a real estate salesperson for the
    performance of any of the acts specified in this chapter, or by rule or regulation of the
    commission, from any person except the licensed real estate broker under whom the individual is
    licensed as a salesperson.
