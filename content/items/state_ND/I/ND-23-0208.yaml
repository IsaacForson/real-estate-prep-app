stem: A salesperson receives a $500 gift card from a title company after referring a buyer who
  purchased a property through the title company's escrow service. The salesperson did not inform
  their employing broker about the gift card. Under N.D. Cent. Code § 43-23-11.1(1)(q), what has the
  salesperson done?
options:
  - The salesperson failed to deposit earnest money into the broker's trust account within 24 hours.
  - The salesperson showed a property without obtaining the owner's written authorization.
  - The salesperson accepted valuable consideration from a person other than their employing broker.
  - The salesperson refused to provide copies of a contract to a party whose signature was on the
    document.
key: C
explanation: Subsection (q) forbids a salesperson from accepting any commission or valuable
  consideration from anyone except their employing broker. The gift card constitutes valuable
  consideration from a third party, violating this rule. The other options describe unrelated
  violations such as trust‑account mishandling, unauthorized showings, or refusal to provide
  documents.
citation:
  source: N.D. Cent. Code ch. 43-23 — North Dakota Century Code Chapter 43-23, State Real Estate
    Commission — § 43-23-11.1(1)(q)
  url: null
  quoted_text: q. Accepting a commission or valuable consideration as a real estate salesperson for
    the performance of any of the acts specified in this chapter, or by rule or regulation of the
    commission, from any person except the licensed real estate broker under whom the individual is
    licensed as a salesperson.
  secondary: []
math:
  worked_solution: No calculation is required; the gift card amount is $500.
