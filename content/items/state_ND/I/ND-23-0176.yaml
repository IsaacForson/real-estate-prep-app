stem: A broker represents both buyer and seller in a transaction. At closing, the broker provides
  the parties with a copy of the purchase agreement and the earnest money receipt but does not
  provide a detailed closing statement showing all receipts and disbursements. What has the broker
  done?
options:
  - The broker violated the rule by failing to deliver a detailed closing statement
  - The broker complied because the purchase agreement serves as the closing statement
  - The broker violated the rule only if the transaction exceeds $100,000
  - The broker committed no violation since the parties received the purchase agreement
key: A
explanation: Under N.D. Cent. Code § 43-23-11.1(1)(o), a broker must deliver a detailed closing
  statement at consummation showing all receipts and disbursements handled for the parties.
  Providing only the purchase agreement and earnest money receipt does not meet this requirement, so
  the broker violated the rule.
