stem: A salesperson receives trust money on a Monday, and the broker's depository is closed Tuesday
  due to a state holiday. Under N.D. Cent. Code § 43-23-11.1(1)(s), by when must the money be
  deposited?
options:
  - By the end of the business day on Tuesday.
  - By the close of business on Wednesday.
  - By the close of business on Thursday.
  - By the end of the business day on Monday.
key: C
explanation: The rule states that if trust money is received on a day before a holiday or a day when
  the depository is closed, it must be deposited during the next business day of the depository.
  Since Tuesday is closed, the next business day is Wednesday. Depositing on Tuesday would violate
  the rule because the depository is not open.
