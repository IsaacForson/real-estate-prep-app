stem: Under N.D. Cent. Code § 43-23-11.1(4), what is the maximum fine the commission may direct a
  licensee to pay in a disciplinary proceeding?
options:
  - A fine of up to $1,000
  - A fine of up to $5,000
  - A fine of up to $10,000
  - A fine of up to $2,500
key: B
explanation: The statute allows the commission to direct a licensee to pay a fine not exceeding five
  thousand dollars plus actual costs. Therefore, a fine of up to $5,000 is permissible. The
  distractor of $10,000 exceeds the statutory limit and is not authorized.
