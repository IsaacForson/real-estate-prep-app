stem: Under N.D. Cent. Code § 43-23-11.1(1)(r), a broker allows an unlicensed assistant to show
  properties and negotiate offers on behalf of the broker. What has the broker done?
options:
  - Refused to show property based on protected class
  - Made a willful misrepresentation about property
  - Failed to deposit earnest money within 24 hours
  - Allowed unlicensed person to do regulated acts
