stem: Under N.D. Admin. Code § 70-02-01-16(1), what must a complaint to be investigated by the real
  estate commission be?
options:
  - A complaint must be in writing on forms furnished by the commission.
  - A complaint must be submitted verbally to the commission's investigator.
  - A complaint must be accompanied by a notarized affidavit from the complainant.
  - A complaint must be filed within five days of the alleged violation.
key: A
explanation: The rule explicitly states that all complaints must be in writing on forms furnished by
  the commission. A verbal complaint does not satisfy the writing requirement, and a notarized
  affidavit or five‑day filing deadline are not mentioned in this subsection.
