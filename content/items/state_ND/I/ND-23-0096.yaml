stem: Under N.D. Cent. Code § 43-23-11.1(1), what must the commission do upon receiving a verified
  complaint in writing from any person?
options:
  - Shall investigate the activities of any licensee or person assuming to act as such
  - Shall refer the complaint to the attorney general for further legal review
  - Shall require the complainant to attend a mediation session within seven days
  - Shall order the licensee to cease and desist pending investigation and notify the broker
key: A
explanation: The statute states that upon a verified complaint in writing, the commission shall
  investigate the activities of any licensee or person assuming to act in such capacity. This
  establishes a mandatory duty to investigate. The other options describe permissive or incorrect
  actions not supported by the text.
