stem: Under N.D. Cent. Code § 43-23-11.1(2), after receiving a request for a hearing on a denied
  license application, the commission must schedule the hearing within how many days?
options:
  - 20 days
  - 30 days
  - 45 days
  - 60 days
key: D
explanation: The statute requires the commission to fix the hearing date within sixty days of
  receiving the request, making sixty days correct. The twenty‑day option reflects the applicant’s
  deadline to request a hearing, not the commission’s scheduling deadline.
