stem: After a hearing, the commission finds a licensee guilty of making a material false statement
  in a license application. Under N.D. Cent. Code § 43-23-11.1(4), what is the maximum fine the
  commission may impose?
options:
  - The commission may impose a fine of up to five thousand dollars plus actual costs.
  - The commission may impose a fine of up to ten thousand dollars.
  - The commission may impose a fine of up to one thousand dollars.
  - The commission may impose a fine of up to twenty-five hundred dollars.
key: A
explanation: The statute allows the commission to direct the licensee to pay a fine not exceeding
  five thousand dollars and actual costs, including attorney's fees, incurred in the investigation
  and prosecution. The other amounts exceed or omit the authorized limit.
