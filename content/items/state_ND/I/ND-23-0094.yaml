stem: A broker pays a referral fee to an unlicensed friend who helped locate a buyer for a property.
  Under N.D. Cent. Code § 43-23-11.1(1)(l), what has the broker done?
options:
  - Making a material false statement in a license application
  - Failing to disclose a dual agency relationship to a client
  - Paying compensation or commission to an unlicensed person for real estate services
  - Commingling trust funds with personal business accounts
key: C
explanation: Paying compensation or commission to an unlicensed person for real estate services is
  prohibited by N.D. Cent. Code § 43-23-11.1(1)(l). The broker’s payment of a referral fee to an
  unlicensed friend therefore violates that provision.
