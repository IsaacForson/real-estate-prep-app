stem: A commissioner has just completed two consecutive five-year terms on the real estate
  commission and wishes to be reappointed immediately to a third consecutive term. Under N.D. Cent.
  Code § 43-23-02, may the governor reappoint this commissioner right away?
options:
  - No, because a commissioner may not serve more than two consecutive five-year terms
  - Yes, because there is no statutory limit on how many terms a commissioner may serve
  - No, because each term is limited to three years rather than five
  - Yes, because reappointment is automatic once a vacancy is declared
key: A
explanation: Section 43-23-02 caps a commissioner's service at two consecutive five-year terms, so
  immediate reappointment to a third consecutive term is not allowed.
