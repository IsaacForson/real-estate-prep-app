stem: A broker who has obtained a waiver from the North Dakota Real Estate Commission to not
  maintain a trust account later receives earnest money from a buyer in a real estate transaction.
  What must the broker do under N.D. Cent. Code § 43-23-14.1?
options:
  - Opening a designated trust account and depositing the earnest money
  - Maintaining the waiver and not opening a trust account
  - Depositing the earnest money directly with the title company and taking no further action
  - Informing the commission but retaining the funds in a personal account
key: A
explanation: The statute requires a broker who does not maintain a trust account but later receives
  trust funds to open a designated trust account and deposit those funds. Maintaining the waiver
  does not exempt the broker from this duty when trust funds are received.
