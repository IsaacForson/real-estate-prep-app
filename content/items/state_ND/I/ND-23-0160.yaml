stem: "Under N.D. Cent. Code § 43-23-14.1, a broker is exempt from the requirement to maintain a
  designated trust account if:"
options:
  - The broker maintains a trust account in a federally insured financial institution.
  - The broker deposits personal funds not exceeding five hundred dollars to cover service charges.
  - The broker does not accept trust funds and has obtained a waiver from the commission.
  - The broker maintains records of all trust transactions for at least six years.
key: C
explanation: The statute explicitly exempts a broker who does not accept trust funds and has
  received a waiver from maintaining a designated trust account. Depositing up to $500 of personal
  funds is merely an allowance to cover service charges and does not eliminate the trust account
  requirement.
