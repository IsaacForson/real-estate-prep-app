stem: Under N.D. Cent. Code § 43-23-11.1(1)(t), what must a licensee do when a prospective purchaser
  requests that an offer be submitted to the seller?
options:
  - Verbally communicate the offer to the seller
  - Reduce the offer to writing and submit it to the seller
  - Wait until the seller accepts before writing the offer
  - Ignore the request if the offer price is low
key: B
explanation: Under N.D. Cent. Code § 43-23-11.1(1)(t), a licensee must put any offer that a
  prospective buyer asks to be presented to the seller into writing and deliver it to the seller.
  Simply telling the seller the offer verbally does not meet this requirement.
