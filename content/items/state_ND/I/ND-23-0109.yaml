stem: A salesperson receives earnest money from a buyer on a Wednesday. Under N.D. Cent. Code §
  43-23-11.1(1)(s), within how many hours must the salesperson deposit the money with the employing
  broker for deposit in the broker's trust account?
options:
  - Within 72 hours
  - Within 24 hours
  - Within 12 hours
  - Within 48 hours
key: B
explanation: The rule requires a salesperson to place trust money with the employing broker for
  deposit within twenty‑four hours of receipt. Therefore the correct timeframe is 24 hours. The
  other options propose intervals that are not supported by the statute.
