  source: N.D. Cent. Code ch. 43-23 — North Dakota Century Code Chapter 43-23, State Real Estate
    Commission — § 43-23-14.1 § 43-23-22
  url: null
  quoted_text: A certificate of coverage, showing compliance with the required terms and conditions of
    coverage, must be filed annually with the real estate commission by each licensee who elects not
    to participate in the group insurance program administered by the real estate commission.
