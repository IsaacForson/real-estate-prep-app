stem: According to N.D. Cent. Code § 43-23-22, what must a licensee who does **NOT** participate in
  the group insurance program do regarding a certificate of coverage?
options:
  - file a certificate of coverage annually
  - file a certificate of coverage monthly
  - file a certificate of coverage quarterly
  - file a certificate of coverage biennially
key: A
explanation: The statute requires each licensee who elects not to participate in the group insurance
  program to file a certificate of coverage annually with the real estate commission. The other
  frequencies are not prescribed by the rule.
