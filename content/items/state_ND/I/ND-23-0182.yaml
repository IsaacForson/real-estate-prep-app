stem: Under N.D. Cent. Code § 43-23-03, what authority does the commission have regarding the
  executive director and staff?
options:
  - The commission may fix the salary of the executive director, employ other employees as
    necessary, fix salaries and prescribe duties of employees, and make other expenditures as
    necessary to carry out the provisions of this chapter.
  - The commission may set the executive director's annual salary, hire additional staff as needed,
    and approve all expenditures related to license issuance and renewal.
  - The commission may require the executive director to maintain records of all commission
    meetings, prepare biennial reports, and oversee the deposit of license fees.
  - The commission may establish the executive director's job description, conduct performance
    evaluations, and authorize payments for commission travel expenses.
key: A
explanation: Under N.D. Cent. Code § 43-23-03, the commission has the authority to fix the executive
  director's salary, employ other employees as necessary, fix salaries and prescribe duties of
  employees, and make other expenditures needed to carry out the chapter. The option that matches
  this language correctly states those powers. The option that limits the commission to setting the
  salary, hiring staff, and approving only certain expenditures omits the authority to fix employee
  salaries and duties and to make other expenditures. The options that add responsibilities such as
  establishing job descriptions, conducting performance evaluations, authorizing travel payments,
  maintaining meeting records, preparing biennial reports, or overseeing deposit of fees describe
  duties not granted by this statute.
