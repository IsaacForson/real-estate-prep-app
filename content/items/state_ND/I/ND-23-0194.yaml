stem: The North Dakota Real Estate Commission plans to file an injunction against an unlicensed
  individual practicing real estate. Under N.D. Cent. Code § 43-23-18, is the commission required to
  post a bond when commencing this action?
options:
  - No bond required for commission action
  - No bond required unless court orders
  - No a bond equal to damages is required
  - No bond needed if defendant asks
key: A
explanation: Section 43-23-18 explicitly states that the commission is not required to give any bond
  for commencing an injunction action. Therefore, no bond is required. The other options incorrectly
  impose a bond requirement not found in the statute.
