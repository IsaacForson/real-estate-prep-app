stem: Under N.D. Cent. Code § 43-23-02, how are the terms of commission members staggered?
options:
  - So that one member's term expires each year
  - So that all members' terms expire every five years
  - So that two members' terms expire each year
  - So that the commission's terms expire every two years
key: A
explanation: The statute requires that terms be staggered so the term of one member expires each
  year, ensuring continuity on the commission. The distractor suggesting all members' terms expire
  every five years is incorrect because that would have all terms end simultaneously, not staggered.
