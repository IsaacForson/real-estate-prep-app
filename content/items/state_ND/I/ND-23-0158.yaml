stem: A broker moves their place of business to a new location. Under N.D. Cent. Code § 43-23-12(1),
  by when must the broker apply to the commission for a new license?
options:
  - Within 20 days after removal
  - Within 15 days after removal
  - Within 10 days after removal
  - Within 5 days after removal
key: D
explanation: The rule requires the licensee to make application before the removal or within five
  days after the removal. Applying within five days after removal satisfies this requirement.
  Applying within ten days after removal is too late because it exceeds the five‑day limit.
citation:
  source: N.D. Cent. Code § 43-23-12(1)
  url: null
  quoted_text: In case of removal from the designated broker, the licensee shall make application to
    the commission before the removal or within five days after the removal, designating the new
    location of such office, whereupon the commission immediately shall issue a new license for the
    new location for the unexpired period.
