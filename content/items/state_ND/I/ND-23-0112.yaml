stem: What is the maximum amount of a broker's personal funds that may be deposited in a trust
  account to cover service charges under North Dakota law?
options:
  - One thousand dollars
  - Five hundred dollars
  - Seven hundred fifty dollars
  - Two hundred fifty dollars
key: B
explanation: The rule permits a broker to deposit and keep a sum not to exceed five hundred dollars
  in the trust account from the broker's personal funds to cover service charges. Therefore, five
  hundred dollars is the correct maximum. The distractor of one thousand dollars exceeds the allowed
  limit and would violate the prohibition on commingling personal funds beyond the specified amount.
