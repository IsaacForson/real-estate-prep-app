stem: A complainant files a complaint against a salesperson but omits the broker employer's name and
  address. Under N.D. Admin. Code § 70-02-01-16(1), is the complaint valid?
options:
  - The complaint is valid as long as it is verified and signed.
  - The complaint is invalid because it lacks the broker employer's name and address.
  - The complaint is invalid unless it also includes the salesperson's license number.
  - The complaint is valid because it includes the salesperson's name and address.
key: B
explanation: The rule requires that a complaint against a salesperson include the broker employer's
  name and address. Omitting this information makes the complaint invalid. The distractor asserting
  the complaint is valid because it includes the salesperson's name and address ignores the
  mandatory broker employer detail.
