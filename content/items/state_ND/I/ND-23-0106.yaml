stem: Under N.D. Admin. Code § 70-02-01-16(1), what must a written complaint to the commission
  include regarding the complainant and respondent?
options:
  - The complainant's and respondent's full names and addresses
  - The broker's license number and the salesperson's continuing education hours
  - The complainant's social security number and the respondent's employer's phone number
  - The date of the alleged violation and the complainant's driver's license number
key: A
explanation: The rule requires the complaint to include the full name and address of the person
  making the complaint (complainant) and the full name and address of the person against whom the
  complaint is made (respondent). The other options introduce information not mandated by the rule,
  such as social security numbers or employer phone numbers.
