stem: A broker continues to practice after license revocation. The commission seeks an injunction in
  district court. Under N.D. Cent. Code § 43-23-18, what may the district court do upon a showing
  that the broker has engaged in a violation?
options:
  - The district court may enjoin the broker's activity and make any order necessary to conserve,
    protect, and disburse any funds involved.
  - The district court may award compensatory damages to clients for losses resulting from the
    broker's unlicensed activities.
  - The district court may impose a civil penalty of up to five thousand dollars on the broker for
    each violation.
  - The district court may order the broker to cease all real estate activities and attend a
    commission‑approved remedial education program.
key: A
explanation: Upon showing a violation, the statute allows the district court to enjoin the offending
  act and to make any order needed to conserve, protect, and disburse funds involved. This matches
  the statement that the district court may enjoin the broker's activity and make any order
  necessary to conserve, protect, and disburse any funds involved. The alternative that the court
  may award compensatory damages to clients for losses resulting from the broker's unlicensed
  activities is not authorized by the statute in an injunction action.
