stem: A broker moves the trust account to a different bank and opens a new account. According to
  N.D. Admin. Code § 70-02-01-15, what must the broker do within ten days of the change?
options:
  - Notifying the commission of the new bank and account
  - Notifying the commission of the change in writing only
  - Notifying the commission after the transaction closes
  - Notifying the commission of the new office address
key: A
explanation: The administrative rule requires the broker to notify the commission of the new
  institution and account name using the provided forms and to file the form within ten days. The
  other options describe actions not mandated by the rule.
citation:
  source: N.D. Admin. Code ch. 70-02-01 — North Dakota Administrative Code Chapter 70-02-01,
    Licensing, Trust Accounts, and Complaints — § 70-02-01-15
  url: null
  quoted_text: |-
    Each broker shall notify the commission of the name of the institution in
    which the trust account or accounts are maintained and also the name of the accounts
    on forms provided therefore. A new form shall be filed with the commission each time a
    broker changes the real estate trust account in any manner whatsoever, including
    change of depository, change of account number, change of business name, or change
    7

    of method of doing business. The form shall be filed with the commission within ten days
    after the aforementioned change takes place
