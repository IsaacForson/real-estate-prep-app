stem: A real estate salesperson changes brokers on June 1. What must the salesperson do within five
  days of the change?
options:
  - Provide written notice to the commission of the change and the name of the new broker
  - Submit a renewal application to the commission within five days of changing brokers
  - Inform the previous broker in writing of the change within five days of the transaction
  - File a complaint with the commission against the former broker within five days
key: A
explanation: The rule requires prompt written notice within five days to the commission, including
  the new broker's name. The other options describe actions not required by the rule within that
  timeframe.
