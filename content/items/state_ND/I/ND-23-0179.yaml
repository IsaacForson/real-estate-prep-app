stem: A salesperson receives earnest money from a buyer and deposits the funds into their personal
  checking account instead of the broker's trust account. Which prohibited act has the salesperson
  committed under N.D. Cent. Code § 43-23-11.1(1)(e)?
options:
  - A material false statement in the licensee's application for a license
  - Acting for both buyer and seller without disclosure
  - Failing to account for or remit money belonging to others
  - Refusing to show property based on protected class
key: C
explanation: The licensee failed to account for or remit the earnest money belonging to the buyer,
  instead commingling it with personal funds, which violates the requirement to keep such funds in
  an escrow or trust account. This conduct is expressly prohibited under subsection (e). Acting for
  both parties without disclosure pertains to dual agency, not mishandling of trust funds.
citation:
  source: N.D. Cent. Code § 43-23-11.1(1)(e)
  url: null
  quoted_text: Failing to account for or to remit, within a reasonable time, any moneys coming into
    the licensee's possession belonging to others; commingling funds of others with the licensee's
    own, failing to keep such funds of others in an escrow or trust account with a bank or other
    recognized depository in this state, or keeping records relative to the deposit, which must
    contain such information as may be prescribed by the rules and regulations of the commission
    relative thereto.
