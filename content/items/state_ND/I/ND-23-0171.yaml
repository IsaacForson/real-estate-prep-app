stem: A licensee deposits a client's earnest money into the licensee's personal checking account to
  earn interest, intending to transfer it back before closing. Under N.D. Cent. Code §
  43-23-11.1(1)(e), what has the licensee done?
options:
  - Properly held funds in an escrow account
  - Commingled funds of others with the licensee's own
  - Provided a timely closing statement to the client
  - Made a material false statement in the license application
key: B
explanation: The statute lists commingling funds of others with the licensee's own as a ground for
  discipline. Depositing client money into a personal account constitutes commingling. The
  distractor about properly holding funds in an escrow account is incorrect because the funds were
  not placed in an escrow or trust account.
