stem: A broker receives earnest money that is deposited directly with a title company and never
  comes into the broker's possession. Under N.D. Cent. Code § 43-23-14.1, what must the broker still
  do regarding these funds?
options:
  - Maintaining a journal of all receipts and disbursements
  - Maintaining a record tracking the earnest money
  - Maintaining monthly bank statements on file
  - Maintaining a separate trust account for all funds
key: B
explanation: The statute requires a broker to maintain a record tracking the earnest money
  associated with all transactions even if the funds are deposited directly with the title company
  and the broker does not take possession of the funds. The other options describe different
  record-keeping duties that do not satisfy this specific requirement.
