stem: Under N.D. Cent. Code § 43-23-11.1(1)(o), what must a broker deliver to the parties
  represented in a real estate transaction at the time the transaction is consummated?
options:
  - A copy of the listing agreement for the property
  - A closing statement of receipts and disbursements
  - A copy of the purchase agreement for the property
  - A copy of the earnest money receipt for the property
key: B
explanation: Under N.D. Cent. Code § 43-23-11.1(1)(o), brokers must deliver a complete detailed
  closing statement showing receipts and disbursements at the time a transaction is consummated. The
  correct answer is the option that states a closing statement of receipts and disbursements. The
  other options list documents that are not required to be delivered at closing under this rule.
