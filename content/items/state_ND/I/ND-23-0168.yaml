stem: A licensee lists a residential property for sale on an online platform without obtaining the
  owner's written authorization. The licensee then shows the property to prospective buyers. Under
  N.D. Cent. Code § 43-23-11.1, which prohibited act has the licensee committed?
options:
  - Acting for more than one party without knowledge and consent of all parties
  - Making a false promise to induce a party to a real estate transaction
  - Making a substantial and willful misrepresentation injurious to a party
  - Offering real property for sale without the knowledge and consent of the owner
key: D
explanation: The key is correct because the licensee offered real property for sale without the
  owner's knowledge and consent, which violates N.D. Cent. Code § 43-23-11.1(1)(i). The distractor
  describing a substantial and willful misrepresentation is incorrect because the licensee did not
  make any false statement about the property; the violation stems solely from lacking the owner's
  consent.
