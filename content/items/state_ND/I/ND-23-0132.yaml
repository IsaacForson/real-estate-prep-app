stem: Under N.D. Cent. Code § 43-23-15(2), what may the commission do to assist libraries, real
  estate brokers, real estate salespersons, and institutes and foundations?
options:
  - The commission may provide financial aid or otherwise, in providing texts, sponsoring studies,
    surveys, and programs for the benefit of real estate and the elevation of the real estate
    business.
  - The commission may offer direct loans to brokers for purchasing office equipment, technology,
    and marketing materials to support their real estate practices.
  - The commission may require mandatory continuing education courses for all licensees each renewal
    period, covering ethics, law, and practice standards.
  - The commission may supply legal representation to licensees in disputes with clients over
    commissions, including mediation and arbitration services.
key: A
explanation: The statute allows the commission to assist libraries, brokers, salespersons, and
  institutes by providing financial aid or otherwise for supplying texts, sponsoring studies,
  surveys, and programs that benefit real estate and raise the standards of the business. The
  correct option reflects this authority. The option about requiring mandatory continuing education
  is not authorized by this provision. The option about supplying legal representation in commission
  disputes is not granted by this statute. The option about offering direct loans for office
  equipment is not permitted under this rule.
