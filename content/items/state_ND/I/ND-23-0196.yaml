stem: A licensee receives an oral offer from a buyer and tells the seller verbally but does not put
  it in writing. Under N.D. Cent. Code § 43-23-11.1(1)(t), what is the licensee's violation?
options:
  - Failing to submit all offers to the seller before acceptance
  - Failing to deposit earnest money within twenty-four hours
  - Failing to reduce the offer to writing when requested
  - Failing to disclose a dual agency relationship to the parties
key: C
explanation: Under N.D. Cent. Code § 43-23-11.1(1)(t), a licensee who receives an oral offer must
  put it in writing when the buyer requests that the offer be submitted to the seller. Failing to do
  so is a violation. The option stating that the licensee failed to reduce the offer to writing when
  requested is therefore correct. The option concerning earnest‑money deposit timing is incorrect
  because it addresses a different requirement.
