stem: The commission sends notice of a hearing on a denied license application to the applicant on
  June 10, scheduling the hearing for June 30. Under N.D. Cent. Code § 43-23-11.1(2), is this notice
  timely?
options:
  - Yes, because the notice provides at least twenty days.
  - No, because notice must be given at least thirty days.
  - No, because notice must be given within ten days.
  - Yes, because notice must be given no later than five days before hearing.
key: A
explanation: N.D. Cent. Code § 43‑23‑11.1(2) requires that at least twenty days' notice be given to
  the applicant before a hearing. Sending the notice on June 10 for a hearing on June 30 provides
  exactly twenty days, so the notice is timely. The other choices describe incorrect notice periods.
