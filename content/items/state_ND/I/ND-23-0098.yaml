stem: A licensee chooses not to participate in the group errors and omissions insurance program
  administered by the commission. What must the licensee do annually to remain compliant?
options:
  - File an annual certificate of coverage
  - Submit monthly trust account reconciliation
  - Renew the broker's license biennially
  - Complete six hours of continuing education
key: A
explanation: Under N.D. Admin. Code § 70-02-01-22, each licensee who opts out of the group plan must
  file a yearly certificate of coverage showing compliance. The distractor about monthly trust
  account reconciliation confuses E&O requirements with trust-account recordkeeping rules.
