stem: Under N.D. Cent. Code § 43-23-01, how is the chairman of the commission selected?
options:
  - By appointment of the governor
  - By election of the commission members
  - By seniority of service among members
  - By lot drawing at the annual meeting
key: B
explanation: The statute states that the commission shall organize by the election of a chairman, so
  the chairman is elected by the commission members. The distractor suggesting gubernatorial
  appointment is incorrect because the governor appoints commission members, not the chairman.
