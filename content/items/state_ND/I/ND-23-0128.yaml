stem: A broker removes a salesperson from the designated office on July 10. What must the
  salesperson do regarding the commission?
options:
  - Apply to the commission before the removal or within five days after the removal, designating
    the new office location
  - Immediately return the license to the commission for cancellation and request a duplicate
    license be issued
  - Continue to act under the broker's supervision until a new license is issued, even if the
    removal has already taken place
  - Notify the commission only if the removal occurs after a holiday and the salesperson has not yet
    found a new employing broker
key: A
explanation: The rule states that in case of removal from the designated broker, the licensee shall
  apply to the commission before removal or within five days after removal, designating the new
  office location. The other options either misstate the requirement or add conditions not in the
  rule.
