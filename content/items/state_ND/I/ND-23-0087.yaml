stem: What must the executive director maintain under N.D. Cent. Code § 43-23-16?
options:
  - publish quarterly newsletters to all licensees about market trends
  - keep a physical binder of all license applications received each year
  - submit annual reports to the governor detailing commission expenditures
  - maintain a list online of the names and addresses of all licensees licensed by the board
key: D
explanation: The statute requires the executive director to maintain a list online of the names and
  addresses of all licensees licensed by the board, plus other enforcement-related information as
  the board may deem of interest to the public. The other options describe actions not mandated by
  the statute.
