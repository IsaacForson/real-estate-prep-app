stem: An individual advertises themselves as a real estate broker, shows properties, and negotiates
  sales, but holds no license. Under N.D. Cent. Code § 43-23-11.1(1), may the commission investigate
  this individual?
options:
  - The commission may investigate the individual only if a verified complaint is filed
  - The commission may not investigate the individual unless the transaction involves earnest money
  - The commission may investigate the individual because the person assumes to act as a licensee
  - The commission may not investigate the individual because the person lacks a real estate license
key: C
explanation: The statute authorizes the commission to investigate activities of any licensee or any
  person that assumes to act in such capacity within the state. Since the individual holds
  themselves out as a broker without a license, they are a person assuming to act as a licensee and
  thus subject to investigation. The other options incorrectly limit the commission's authority to
  licensed persons, require a complaint, or tie jurisdiction to earnest money.
