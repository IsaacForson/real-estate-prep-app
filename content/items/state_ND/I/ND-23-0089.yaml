stem: A commissioner resigns effective June 30, leaving two years remaining in the term. Under N.D.
  Cent. Code § 43-23-02, who appoints the successor and for what length of term?
options:
  - The remaining commissioners appoint a successor for the unexpired term
  - The successor is chosen by a special election of licensees
  - The governor appoints a successor for a full five‑year term
  - The governor appoints a successor for the unexpired term
key: D
explanation: The statute requires the governor to appoint a member for the unexpired term when a
  vacancy occurs, so the governor fills the remainder of the term. The distractor that gives a full
  five‑year term misreads the provision, which limits the appointment to the unexpired portion.
