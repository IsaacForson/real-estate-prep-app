stem: Under N.D. Admin. Code § 70-02-01-15(3)(g), how long must a broker retain permanent records of
  funds and property of others received in real estate transactions?
options:
  - Six years from receipt
  - One year from receipt
  - Indefinite from receipt
  - Three years from receipt
key: A
explanation: The rule explicitly states that brokers must keep permanent records of all funds and
  property of others received for not less than six years from the date of receipt. The three‑year
  and one‑year options contradict the six‑year minimum, and indefinite retention is not required by
  the rule.
