stem: A salesperson receives trust money on a Thursday, and the broker's depository is closed Friday
  for a holiday. Under N.D. Cent. Code § 43-23-11.1(1)(s), by when must the money be deposited?
options:
  - By end of day Thursday
  - By end of day Friday
  - By end of day Monday
  - By end of day Tuesday
key: C
explanation: "The statute requires deposit within twenty‑four hours, but provides an exception: if
  the money is received on a day before a holiday or before the depository is closed, it must be
  deposited during the next business day. Since Friday is a holiday, the next business day is
  Monday."
