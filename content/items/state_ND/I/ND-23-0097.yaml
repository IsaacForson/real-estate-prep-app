stem: Under N.D. Cent. Code § 43-23-19, which licensees are required to carry errors and omissions
  insurance?
options:
  - Salespersons with active licenses
  - Brokers with active licenses
  - Active salespersons and brokers
  - Inactive salespersons and brokers
key: C
explanation: The statute requires all real estate salespersons and brokers, except those holding
  inactive licenses, to carry errors and omissions insurance. Therefore active licensees must be
  covered. The distractor 'Salespersons with active licenses' is incorrect because it omits brokers
  who also must carry the coverage.
