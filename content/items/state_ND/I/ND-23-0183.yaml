stem: A licensee consistently fails to return phone calls from clients within a reasonable time,
  which the commission determines falls below the generally accepted standard of expertise and
  professional ability. What is the maximum disciplinary action the commission may take under N.D.
  Cent. Code § 43-23-11.1(1)(v)?
options:
  - The commission may issue a letter of reprimand to the licensee and place it in the licensee's
    file
  - The commission may suspend the licensee's license for a period not exceeding one year
  - The commission may revoke the licensee's license and impose a permanent ban on real estate
    practice
  - The commission may impose a fine of up to five thousand dollars plus actual costs
key: A
explanation: Under N.D. Cent. Code § 43-23-11.1(1)(v), conduct that fails to meet the generally
  accepted standard of expertise, care, or professional ability may only result in the commission
  issuing a letter of reprimand and placing it in the licensee's file. The option describing
  revocation of the license and a permanent ban is incorrect because the statute limits disciplinary
  action for this subdivision to a letter of reprimand and does not authorize revocation or a ban.
  The option describing a fine of up to five thousand dollars plus actual costs is incorrect because
  the statute does not permit fines or cost recovery for violations limited to this subsection. The
  option describing suspension of the license for up to one year is also incorrect because
  suspension is not authorized under this subdivision; only a letter of reprimand may be issued.
citation:
  source: N.D. Cent. Code § 43-23-11.1(1)(v)
  url: null
  quoted_text: Any conduct that in the determination of the commission does not meet the generally
    accepted standard of expertise, care, or professional ability expected of real estate brokers or
    salespersons, provided that any disciplinary measures by the commission under this subdivision
    must be limited to the issuance of a letter of reprimand to the offending licensee.
