stem: A licensee who does **NOT** participate in the group errors and omissions insurance program
  must be notified of the required terms and conditions of coverage when?
options:
  - The licensee must be notified at the time of license application.
  - The licensee must be notified immediately after receiving a complaint.
  - The licensee must be notified at least thirty days before the annual license renewal date.
  - The licensee must be notified within ten days after the annual license renewal date.
key: C
explanation: The statute requires that each licensee be notified of the required errors and
  omissions insurance coverage terms at least thirty days before the annual license renewal date.
  Any other timing—such as at application, after a complaint, or after renewal—does not meet this
  requirement.
