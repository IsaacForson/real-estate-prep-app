stem: A wholesaler fails to disclose in writing that they hold an equitable interest in the property
  they are selling. Under N.D. Cent. Code § 43-23-24, what remedy is available to the seller?
options:
  - The seller may sue the wholesaler for breach of contract and recover damages
  - The seller may cancel the contract and retain the earnest money paid by the wholesaler
  - The seller may request a price reduction, terminate the agreement, and keep the deposit
  - The seller must accept the wholesaler’s offer and return any deposit received
key: B
explanation: The statute provides that if a wholesaler violates the disclosure requirement, the
  seller may cancel the contract before close of escrow without penalty and retain any earnest money
  paid by the wholesaler. Suing for breach is not the statutory remedy; the law gives the seller the
  cancellation and retention option.
