stem: Under N.D. Cent. Code § 43-23-01, how is the chairman of the North Dakota Real Estate
  Commission selected?
options:
  - Selection by the executive director
  - Election by the commission members
  - Choice by the majority of licensees
  - Appointment by the governor
key: B
explanation: The statute states that the commission shall organize by the election of a chairman,
  meaning the chairman is elected by the commission members. The distractor suggesting appointment
  by the governor is incorrect because the governor appoints commission members, not the chairman.
