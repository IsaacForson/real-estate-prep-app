stem: A broker accepts earnest money from a buyer but instructs the title company to hold the funds
  until closing. Under N.D. Cent. Code § 43-23-14.1, what must the broker do regarding the earnest
  money?
options:
  - The broker must deposit the earnest money into the broker's own trust account within twenty-four
    hours.
  - The broker must maintain a record tracking the earnest money associated with the transaction.
  - The broker may rely on the title company's records and is not required to keep any earnest money
    documentation.
  - The broker must return the earnest money to the buyer immediately because third‑party holding is
    prohibited.
key: B
explanation: The statute requires a broker to maintain a record tracking the earnest money
  associated with all transactions even if the funds are deposited directly with the title company
  and the broker does not take possession of the funds. Relying solely on the title company's
  records does not satisfy this duty.
