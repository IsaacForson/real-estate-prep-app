stem: A licensee fails to account for or remit, within a reasonable time, moneys coming into the
  licensee's possession belonging to others. Under N.D. Cent. Code § 43-23-11.1(1)(e), which
  sanction may the commission impose?
options:
  - The commission may impose a criminal fine of up to five thousand dollars.
  - The commission may require the licensee to pay restitution to the aggrieved party.
  - The commission may require the licensee to attend a remedial education course.
  - The commission may order the licensee to complete 100 hours of community service.
key: C
explanation: The statute explicitly lists requiring course attendance as one of the sanctions the
  commission may impose for violations such as failing to account for or remit others' money.
  Imprisonment, mandatory arbitration, and driver's license revocation are not authorized sanctions
  under this provision.
