stem: A broker's trust account had no activity during the month of March. Under N.D. Admin. Code §
  70-02-01-15(2)(f), is the broker required to reconcile the trust account for March?
options:
  - The broker must reconcile the trust account because reconciliation is required monthly
  - The broker is not required to reconcile the trust account because there was no activity
  - The broker must reconcile the trust account only if the balance exceeds $1,000
  - The broker is not required to reconcile the trust account unless the commission requests it
key: B
explanation: The rule states that trust accounts must be reconciled monthly except when there has
  been no activity during the month. Because March had no activity, reconciliation is not required.
  The other options either ignore the exception, add an unrelated balance threshold, or incorrectly
  tie the requirement to a commission request.
