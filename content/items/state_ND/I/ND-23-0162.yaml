stem: A broker who previously obtained a waiver from the commission to not maintain a trust account
  later receives earnest money from a buyer in a real estate transaction. What must the broker do
  under N.D. Cent. Code § 43-23-14.1?
options:
  - The broker must open a designated trust account and deposit the earnest money in accordance with
    commission rules.
  - The broker may continue to operate without a trust account because the waiver remains valid.
  - The broker may deposit the earnest money directly into the broker's personal account and label
    it as trust funds.
  - The broker must notify the commission that the waiver is still applicable and retain the earnest
    money pending approval.
key: A
explanation: The statute states that if a broker does not maintain a trust account and later
  receives trust funds, the broker shall open a designated trust account as required and deposit any
  trust funds in accordance with commission rules. The waiver only applies when no trust funds are
  accepted.
