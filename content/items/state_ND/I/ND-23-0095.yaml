stem: A broker conducts real estate business from a home office but does not display the broker
  license or any salesperson licenses in the office or on the broker’s website. Under N.D. Cent.
  Code § 43-23-12(1), what is the broker required to do?
options:
  - Completing continuing education hours each renewal period
  - Maintaining a definite place of business and prominently displaying licenses
  - Submitting quarterly trust account reports to the commission
  - Renewing licenses annually with the commission
key: B
explanation: Under N.D. Cent. Code § 43-23-12(1), a broker must keep a definite place of business
  and display the broker and each salesperson’s license prominently in that office, or list the
  licensee’s name and number on the broker’s website. This matches the option stating that the
  broker must maintain a definite place of business and prominently display licenses.
citation:
  source: N.D. Cent. Code § 43-23-12(1)
  url: null
  quoted_text: Every individual, partnership, association, corporation, or limited liability company
    licensed as a real estate broker is required to have and maintain a definite place of business
    within this state, for the transaction of real estate business, except as provided in section
    43-23-10. The license as broker and the license of each real estate salesperson licensed under
    that broker must be prominently displayed in said office or the licensee's name and license
    number listed on the broker's website.
