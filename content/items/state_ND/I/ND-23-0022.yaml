stem: A licensee receives a written complaint from the North Dakota Real Estate Commission.
  According to N.D. Admin. Code § 70-02-01-16(2), what must the licensee do within twenty days of
  receiving the complaint?
options:
  - The licensee must file an answer on commission-provided affidavit forms.
  - The licensee must attend a mandatory hearing before the commission.
  - The licensee must pay a fine of $500 to the commission.
  - The licensee must provide a list of all clients served in the past year.
key: A
explanation: The rule requires the licensee to file an answer on commission‑provided affidavit forms
  within twenty days of receiving a complaint. Attending a hearing, paying a fine, or providing a
  client list are not mandated within that timeframe.
citation:
  source: N.D. Admin. Code § 70-02-01-16(2)
  url: null
  quoted_text: The licensee against whom a complaint has been filed must, within twenty days from
    receipt of complaint, file the licensee's answer on forms furnished by the commission. This
    answer must be in affidavit form, properly certified, and contain a factual response to the
    allegations set out in the complaint.
