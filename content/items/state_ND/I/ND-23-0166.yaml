stem: A licensee holds earnest money in the broker's trust account for 15 days after closing before
  disbursing the funds to the seller. Under N.D. Cent. Code § 43-23-11.1(1)(e), what violation has
  occurred?
options:
  - Commingling others' funds with the licensee's personal funds.
  - Failing to keep required records of the trust deposit.
  - Depositing trust money in an account not approved by the commission.
  - Failing to remit money belonging to others within a reasonable time.
key: D
explanation: The rule prohibits failing to account for or remit, within a reasonable time, money
  belonging to others. Holding the funds for 15 days before disbursement constitutes a failure to
  remit within a reasonable time. Commingling is not present because the funds remained in the trust
  account.
