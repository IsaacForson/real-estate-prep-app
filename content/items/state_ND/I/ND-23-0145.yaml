stem: A broker is accused of conducting real estate transactions without a license. The North Dakota
  Real Estate Commission seeks an injunction to stop the activity. Under N.D. Cent. Code § 43-23-18,
  what must the commission demonstrate to the district court to obtain the injunction?
options:
  - Proof that the broker caused financial harm to clients through misrepresentation
  - Proof that the broker acted with intent to deceive in advertising
  - Proof that the broker engaged in an act violating the chapter or commission rules
  - Proof that the broker has been previously disciplined by the commission
key: C
explanation: The law requires the commission to show that the person has engaged in an act violating
  the chapter or commission rules before the court may issue an injunction. Showing financial harm
  is not a statutory prerequisite for injunctive relief.
citation:
  source: N.D. Cent. Code § 43-23-18
  url: null
  quoted_text: Upon a showing that the person or entity has engaged in any act or practice in
    violation of this chapter or rules adopted by the commission, the district court may enjoin the
    act or practice and may make any order necessary to conserve, protect, and disburse any funds
    involved.
