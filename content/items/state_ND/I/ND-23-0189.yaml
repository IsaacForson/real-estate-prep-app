stem: A licensed real estate salesperson receives a $200 referral fee from a title company for
  directing clients to that company's closing services. Under N.D. Cent. Code § 43-23-11.1(1)(q), is
  this permissible?
options:
  - The salesperson may accept the referral fee because the fee is not paid to an unlicensed person.
  - The salesperson may accept the referral fee because referral fees are customary in real estate.
  - The salesperson may not accept the referral fee because a salesperson may accept commission only
    from the employing broker.
  - The salesperson may not accept the referral fee because the title company is not a licensed real
    estate broker.
key: C
explanation: The key is correct because subsection (q) prohibits a salesperson from accepting any
  commission or valuable consideration for performing licensed acts except from the employing broker
  under whom the salesperson is licensed. The most tempting distractor is the idea that referral
  fees are customary in real estate; however, customary practice does not override the statutory
  limitation that the only permissible source of such compensation is the employing broker.
citation:
  source: N.D. Cent. Code ch. 43-23 — North Dakota Century Code Chapter 43-23, State Real Estate
