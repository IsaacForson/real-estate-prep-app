stem: At a commission meeting, three of the five members are present. Under N.D. Cent. Code §
  43-23-02, may the commission conduct official business?
options:
  - The commission may conduct official business because a majority is present
  - The commission may not conduct official business because all five members must be present
  - The commission may conduct official business only to adjourn the meeting
  - The commission may not conduct official business because at least four members are required
key: A
explanation: The statute provides that a majority of the commission in a duly assembled meeting may
  perform and exercise all duties and powers, so three members suffice. The distractor claiming all
  five must be present incorrectly imposes a unanimity requirement not found in the law.
