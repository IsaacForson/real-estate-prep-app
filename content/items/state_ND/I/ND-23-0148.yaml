stem: A licensee decides to purchase errors and omissions insurance from a private insurer instead
  of the commission’s group program. Under N.D. Cent. Code § 43-23-20, what condition must the
  licensee’s independent coverage satisfy to be acceptable?
options:
  - It must comply with the minimum requirements established by the commission
  - It must be cheaper than the overall group policy
  - It must be approved by the licensee’s current employing broker
  - It must provide coverage for at least one million dollars
key: A
explanation: The statute explicitly allows independent errors and omissions insurance only when the
  coverage complies with the minimum requirements set by the commission. Cost, broker approval, or a
  specific dollar amount are not mentioned as conditions.
