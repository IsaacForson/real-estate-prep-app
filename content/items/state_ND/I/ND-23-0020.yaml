stem: A broker considers opening an interest-bearing account for client trust funds so the interest
  can offset banking fees. Under North Dakota rule 70-02-01-15, is this arrangement permitted?
options:
  - No, because trust accounts are required to be noninterest bearing
  - Yes, if the broker fully discloses the arrangement to the commission
  - Yes, if interest earned is shared equally among the clients
  - No, unless the depository bank waives its standard fees
key: A
explanation: Rule 70-02-01-15 requires that all trust accounts maintained by a broker be noninterest
  bearing, so an interest-bearing trust account is not permitted regardless of disclosure.
