stem: A licensee receives an oral offer from a prospective buyer to purchase a listed property. The
  licensee tells the buyer they will submit the offer to the seller but does not put the offer in
  writing before doing so. Later, the licensee submits the oral offer to the seller in writing after
  the seller verbally accepts. Under N.D. Cent. Code § 43-23-11.1(1)(t), what violation has
  occurred?
options:
  - The licensee failed to disclose the licensee's own interest in the property to the seller
  - The licensee failed to deposit the earnest money within twenty‑four hours of receiving the offer
  - The licensee failed to reduce an offer to writing when a proposed purchaser requested the offer
    be submitted to the seller
  - The licensee failed to submit all offers to a seller when multiple offers were received before
    the seller accepted an offer in writing
key: C
explanation: Under N.D. Cent. Code § 43-23-11.1(1)(t), a licensee must reduce an offer to writing
  when a prospective purchaser requests that the offer be submitted to the seller. Failing to do so
  violates the rule.
