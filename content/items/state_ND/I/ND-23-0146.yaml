stem: Under N.D. Cent. Code § 43-23-02, what is the maximum number of consecutive five-year terms a
  commissioner may serve on the North Dakota Real Estate Commission?
options:
  - One term
  - Four terms
  - Two terms
  - Three terms
key: C
explanation: The statute states that a commissioner may not serve more than two consecutive
  five‑year terms. Therefore the maximum allowable consecutive service is two terms. A distractor of
  three terms incorrectly allows an extra term beyond the statutory limit, while one term
  understates the permitted duration and four terms exceeds the limit.
