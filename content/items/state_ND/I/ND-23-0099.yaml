stem: If the real estate commission is unable to obtain errors and omissions insurance coverage at a
  reasonable premium for a given year, what is the effect on the insurance requirement for licensees
  that year?
options:
  - The licensee must seek independent coverage immediately
  - The commission must suspend all licenses until coverage is obtained
  - The requirement is waived for that year
  - The requirement still applies but with reduced limits
key: C
explanation: The statute explicitly states that if the commission cannot obtain coverage at a
  reasonable premium, the errors and omissions insurance requirement does not apply for that year.
  The distractor suggesting the requirement still applies with reduced limits contradicts the clear
  waiver provision.
