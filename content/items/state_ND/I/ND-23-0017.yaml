stem: A seller has not yet accepted any offer in writing, and the listing broker has not yet learned
  of any acceptance. A second offer arrives on the property. Under N.D. Cent. Code § 43-23-11.1,
  what must the licensee do with the second offer?
options:
  - Wait for the first offer's financing contingency to be removed
  - Submit the offer to the seller because no acceptance has occurred yet
  - Discard the offer because a first offer is already under active review
  - Return the offer directly to the second buyer unopened
key: B
explanation: Section 43-23-11.1 requires a licensee to submit all offers to a seller when they are
  received before the seller accepts an offer in writing and before the broker knows of any
  acceptance.
