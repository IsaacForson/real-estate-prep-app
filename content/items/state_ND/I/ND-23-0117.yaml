stem: Under N.D. Cent. Code § 43-23-11.1(1)(m), a licensee, acting as a buyer's agent, secretly
  purchases a property listed with their own office without informing the owner. What has the
  licensee done?
options:
  - Failed to disclose intent to buy listed property
  - Commingled trust funds with personal money
  - Made a false statement in license application
  - Accepted commission from unlicensed individual
key: A
explanation: The rule prohibits failing to disclose to an owner the licensee's intention to purchase
  property listed with the licensee's office. The distractor about commingling funds describes a
  different violation under subsection (e) and does not match the undisclosed purchase scenario.
citation:
  source: N.D. Cent. Code § 43-23-11.1(1)(m)
  url: null
  quoted_text: Failing to disclose to an owner the licensee's intention or true position if the
    licensee directly or indirectly through a third party purchases for the licensee or acquires or
    intends to acquire any interest in or any option to purchase property that has been listed with
    the licensee's office for sale or lease.
