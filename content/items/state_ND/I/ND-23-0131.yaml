stem: The commission plans to hold a real estate institute and intends to charge a $50 fee to
  attendees. Under N.D. Cent. Code § 43-23-15, is this permissible?
options:
  - No, because licensees must pay a fee to cover course materials.
  - No, because courses must be open to any licensee without any charge or fee.
  - No, because the commission may charge a fee if it covers actual expenses.
  - No, because only brokers are required to attend the institute without charge.
key: B
explanation: The statute requires that any real estate courses or institutes conducted by the
  commission must be open to any licensee without any charge or fee (N.D. Cent. Code § 43-23-15).
  Charging a $50 fee violates this requirement. The distractor suggesting that the commission may
  charge a fee to cover expenses misapplies the provision about expenses, ignoring the mandatory
  free access rule.
