stem: A licensee receives a complaint on Monday, April 1. They file their answer on Friday, April
  26. Under N.D. Admin. Code § 70-02-01-16(2), is this answer timely?
options:
  - The answer is untimely because it was filed after 20 calendar days.
  - The answer is untimely because it must be filed within 10 days.
  - The answer is timely because weekends do not count toward the deadline.
  - The answer is timely because it was filed within 20 business days.
key: A
explanation: The rule mandates that the answer be filed within twenty days of receipt of the
  complaint. Filing on April 26 for an April 1 complaint exceeds twenty calendar days, making it
  untimely. The distractor claiming timeliness because weekends do not count is wrong because the
  rule counts calendar days, not business days.
