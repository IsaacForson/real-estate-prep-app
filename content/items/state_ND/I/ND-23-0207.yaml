stem: A broker enters into a written listing agreement with a seller to sell a farm property, but
  the agreement does not specify an expiration date and the broker does not leave a copy with the
  seller. Under N.D. Cent. Code § 43-23-11.1(1)(n), what has the broker done?
options:
  - The broker failed to include a fixed expiration date in the written listing agreement and did
    not leave a copy with the seller.
  - The broker failed to disclose that they were representing both the buyer and the seller in the
    transaction.
  - The broker paid a referral fee to an unlicensed friend who helped locate the buyer.
  - The broker deposited the buyer's earnest money into their personal checking account.
key: A
explanation: Subsection (n) prohibits failing to include a fixed date of expiration in a written
  listing agreement and failing to leave a copy with the principal. The scenario matches both
  elements, constituting a violation. The other options describe different prohibited acts not
  implicated by the facts given.
