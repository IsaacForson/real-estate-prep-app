stem: After an investigation finds that a complaint may justify disciplinary action, under N.D.
  Admin. Code § 70-02-01-16(4), how far in advance must notice of the hearing be given?
options:
  - 5 days
  - 20 days
  - 30 days
  - 10 days
key: B
explanation: The rule requires that notice of the hearing be given at least twenty days in advance.
  Therefore, twenty days is the minimum required notice. Ten days is insufficient because it does
  not meet the twenty‑day minimum.
