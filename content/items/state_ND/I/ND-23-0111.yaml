stem: An applicant receives notice that the commission has declined to approve their license
  application. Under N.D. Cent. Code § 43-23-11.1(2), how many days does the applicant have to file
  a request for a hearing after receiving the notice?
options:
  - Within 5 days
  - Within 10 days
  - Within 15 days
  - Within 20 days
key: D
explanation: The statute states that a request for a hearing must be filed within twenty days after
  receipt of the notice of denial. Therefore the applicant has 20 days to request a hearing. The
  other options specify shorter periods that are not authorized.
