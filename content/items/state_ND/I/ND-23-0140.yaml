stem: A licensee receives a verified complaint on June 1. They submit their answer on June 15, but
  the answer is a simple letter not notarized. Under N.D. Admin. Code § 70-02-01-16(2), is the
  answer compliant?
options:
  - The answer is compliant because it was filed within twenty days
  - The answer is compliant because it was submitted in writing
  - The answer is not compliant because it was not filed within twenty days
  - The answer is not compliant because it is not in affidavit form and not properly certified
key: D
explanation: The rule requires the answer to be in affidavit form and properly certified; a simple
  letter that is not notarized fails this requirement. The distractor that focuses only on
  timeliness or writing alone ignores the mandatory affidavit and certification elements.
