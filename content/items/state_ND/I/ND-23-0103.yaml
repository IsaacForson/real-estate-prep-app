stem: A complainant files a written complaint against a real estate salesperson. According to N.D.
  Admin. Code § 70-02-01-16(1), what must the complaint include regarding the salesperson's
  employer?
options:
  - The name and address of the broker employing the salesperson
  - The salesperson's personal telephone number
  - The name of the real estate company employing the salesperson
  - The salesperson's license number alone
key: A
explanation: The rule requires that if the respondent is a salesperson, the complaint must include
  the full name and address of the broker employer. Providing only the salesperson's telephone
  number, only the company name, or only the license number does not satisfy this requirement.
