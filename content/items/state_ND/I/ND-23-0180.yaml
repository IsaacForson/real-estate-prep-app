stem: A licensee represents both the buyer and the seller in a transaction without informing either
  party of the dual representation. Which prohibited act has the licensee committed under N.D. Cent.
  Code § 43-23-11.1(1)(d)?
options:
  - Failing to include a fixed date in a written listing agreement
  - A willful misrepresentation that injures a party
  - Acting for both buyer and seller without disclosing dual agency
  - Paying commission to an unlicensed individual for services
key: C
explanation: The licensee acted for more than one party in the transaction without the knowledge and
  consent of all parties, which is expressly prohibited by subsection (d). Failing to include an
  expiration date in a listing agreement relates to listing contract requirements, not dual agency.
  Therefore, the correct answer is the undisclosed dual agency.
