stem: Under Kan. Stat. Ann. § 58-3050(d)(2)(E), which of the following must a licensee disclose to a
  client or customer to avoid the failure being considered an aggravating circumstance?
options:
  - Local zoning ordinances affecting the property such as permitted land use and any pending
    changes to zoning regulations
  - The licensee's personal financial history including credit score and outstanding debts as part
    of the transaction review
  - The commission's procedures for filing a complaint including required forms timelines and
    contact information for the real estate division
  - All adverse material facts known about the property's environmental hazards physical condition
    title defects or the client's ability to perform under the agreement
key: D
explanation: "The correct answer lists the specific disclosures required by subsection (d)(2)(E):
  adverse material facts about environmental hazards required by law, physical condition, material
  defects, title defects, and the client's ability to perform under the agreement. The other options
  describe information not mandated by this provision. Failure to disclose any of the listed items
  intentionally can be treated as an aggravating circumstance."
