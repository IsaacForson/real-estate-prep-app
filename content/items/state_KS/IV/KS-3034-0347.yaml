stem: Under Kan. Stat. Ann. § 58-3050(h)(1), what is the maximum time allowed to commence a
  complaint alleging a violation of this act, assuming the violation is reasonably ascertainable?
options:
  - Three years
  - Seven years
  - Nine years
  - Eleven years
key: A
explanation: The statute states that no complaint shall be commenced more than three years from the
  date of the occurrence, so the maximum allowable period is three years. Two years is insufficient
  because the law allows up to three years, not a shorter limit.
