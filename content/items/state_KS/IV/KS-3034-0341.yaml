stem: A licensee pleaded guilty to a misdemeanor involving theft of client funds. Under Kan. Stat.
  Ann. § 58-3050(a)(2), what action may the commission take?
options:
  - The commission may require the licensee to complete additional continuing education.
  - The commission may impose a civil fine not exceeding $1,000 for each violation.
  - The commission may issue a letter of warning to the licensee when appropriate.
  - The commission may refuse to grant or renew the license based on the violation.
key: D
explanation: The statute allows the commission to refuse to grant or renew a license when the
  licensee has been convicted of a misdemeanor reflecting on honesty or trustworthiness. The notion
  that a civil fine may be imposed for this violation under this subsection is incorrect.
