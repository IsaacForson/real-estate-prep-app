stem: A buyer sues a licensee for damages alleging a violation of Kan. Stat. Ann. § 58-3062. Under
  Kan. Stat. Ann. § 58-3062(h), what is the effect on the buyer's ability to recover damages?
options:
  - The buyer is barred from any legal action regarding the violation
  - The buyer must first file a complaint with the commission before suing
  - No right of action under this section, but other statutes may allow damages
  - The buyer may recover damages directly under this section
key: C
explanation: Under Kan. Stat. Ann. § 58-3062(h), the law does not grant a private right of action
  for damages, but it also does not take away any right to sue under other statutes or common law.
  Therefore, the buyer cannot recover damages directly under this section, though other legal
  avenues may be available.
