stem: A licensee knows that the property has a leaking roof (a material defect in the physical
  condition) but does not inform the buyer before closing. The commission determines that the
  licensee's failure to disclose was intentional and that aggravating circumstances exist. Under
  Kan. Stat. Ann. § 58-3050, what is the maximum civil fine that may be imposed for this violation?
options:
  - $500 per violation.
  - $1,000 per violation.
  - $5,000 per violation.
  - $10,000 per violation.
key: C
explanation: Because the licensee intentionally failed to disclose a known physical defect and
  aggravating circumstances exist, the fine may reach the $5,000 maximum allowed by subsection
  (d)(2). The $1,000 limit applies only when no aggravating circumstances are present.
