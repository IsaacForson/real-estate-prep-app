stem: Under Kan. Stat. Ann. § 58-3062(b)(1)(A), a salesperson may accept a commission from a
  licensee who employs them as a personal assistant only if which two conditions are met?
options:
  - The licensee and the salesperson are supervised by the same broker, and the supervising broker
    agrees in writing that the personal assistant may be paid by the licensee.
  - The licensee and the salesperson are supervised by the same broker, and the salesperson has been
    employed for at least six months.
  - The licensee and the salesperson are supervised by the same broker, and the personal assistant
    receives a flat fee from the licensee.
  - The licensee and the salesperson are supervised by the same broker, and the supervising broker
    provides verbal approval for the payment.
key: A
explanation: The rule explicitly requires that the licensee and the salesperson be under the same
  supervising broker and that the supervising broker give written consent for the personal assistant
  to be paid by the licensee. The other options either omit the written consent requirement or add
  unrelated conditions such as employment duration or flat fees, which are not mentioned in the
  statute.
