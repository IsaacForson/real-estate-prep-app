stem: A licensee committed a violation on August 3, 2021. The violation was reasonably ascertainable
  at the time. Under Kan. Stat. Ann. § 58-3050(h)(1), what is the latest date a complaint may be
  filed?
options:
  - August 3, 2022
  - August 3, 2024
  - August 3, 2023
  - August 3, 2025
key: B
explanation: The limitation period runs three years from the date of occurrence, so August 3, 2021
  plus three years equals August 3, 2024. August 3, 2023 is only two years later, which does not use
  the full period allowed by the statute.
citation:
  source: Kan. Stat. Ann. § 58-3050(h)(1)
  url: null
  quoted_text: Except as provided by paragraph (2) of this subsection, no complaint alleging violation
    of this act or rules and regulations adopted hereunder, or the brokerage relationships in real
    estate transactions act or rules and regulations adopted thereunder, shall be commenced more
    than three years from the date of the occurrence which is the subject of the complaint.
