stem: A supervising broker signs an agreement allowing the broker to use a mortgage company's name
  in all advertising. Under Kan. Stat. Ann. § 58-3086(g), what must the supervising broker do with
  this agreement?
options:
  - The supervising broker must file a copy of the agreement with the commission
  - The supervising broker must renew the agreement annually with the commission
  - The supervising broker must get commission approval before using the name
  - The supervising broker must include the mortgage company's name in every advertisement
key: A
explanation: The statute mandates that any agreement authorizing a supervising broker to use
  another's name or trade name in real estate business must be filed with the commission. The option
  that says the supervising broker must file a copy of the agreement with the commission states this
  filing requirement. The option that says the supervising broker must get commission approval
  before using the name is incorrect because the law does not require prior commission approval,
  only filing of the agreement.
citation:
  source: Kan. Stat. Ann. § 58-3086(g)
  url: null
  quoted_text: Each supervising broker who enters into an agreement that authorizes the supervising
    broker to utilize the name or trade name of any person or entity in the conduct of the
    supervising broker's real estate business shall file a copy of the agreement with the
    commission.
