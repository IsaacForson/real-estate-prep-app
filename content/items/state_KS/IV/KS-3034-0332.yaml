stem: Under Kan. Stat. Ann. § 58-3062(a)(4), is it permissible for a licensee to pay a referral fee
  to another licensed broker if the licensee knows that the broker will give a rebate to the client?
options:
  - Under the rule, the action is not permissible because paying a referral fee that will result in
    a rebate is prohibited.
  - Under the rule, the action is permissible because the referral fee is paid to a licensed broker.
  - Under the rule, the action is permissible provided the referral fee is less than fifty dollars.
  - Under the rule, the action is permissible because the rebate will be disclosed to the client.
key: A
explanation: The statute prohibits paying a referral fee to a licensed person when the licensee
  knows that payment will result in a rebate from that person. Therefore, the action is not
  permissible regardless of disclosure or fee amount. The other options incorrectly suggest
  permissibility based on the broker's licensure, rebate disclosure, or a fee threshold, none of
  which override the prohibition.
citation:
  source: Kan. Stat. Ann. § 58-3062(a)(4)
  url: null
  quoted_text: Pay a referral fee to a person who is properly licensed as a broker or salesperson in
    Kansas or another jurisdiction or who holds a corporate real estate license in another
    jurisdiction if the licensee knows that the payment of the referral fee will result in the
    payment of a rebate by the Kansas or out-of-state licensee.
