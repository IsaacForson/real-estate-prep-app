stem: A licensee’s associate broker submits to the Kansas Real Estate Commission a
  continuing‑education report that contains a material misstatement of fact. Under Kan. Stat. Ann. §
  58-3073, what criminal penalty applies to this violation?
options:
  - A class A misdemeanor
  - A class B misdemeanor
  - A class C misdemeanor
  - A civil fine of $500
key: A
explanation: Because the associate broker is acting as the licensee’s agent, filing a false
  statement triggers the same penalty as if the licensee had filed it directly. The statute defines
  any such violation as a class A misdemeanor. The other misdemeanor classes and the civil fine
  amount are not supported by the text.
