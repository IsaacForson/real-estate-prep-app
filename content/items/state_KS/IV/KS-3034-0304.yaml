stem: A licensee wishes to purchase a property for personal use and does not have a buyer's agency
  agreement. The licensee places an advertisement stating 'Looking to buy single-family homes in
  this area; contact me.' Under Kan. Stat. Ann. § 58-3086(f), what must the advertisement include?
options:
  - The advertisement must include the supervising broker's trade name in a readable manner
  - The advertisement must clearly inform the public that a real estate licensee is involved in
    soliciting potential sellers
  - The advertisement must state the licensee's maximum purchase price for the property
  - The advertisement must be submitted to the supervising broker for approval before publishing
key: B
explanation: Under Kan. Stat. Ann. § 58-3086(f), any advertisement that solicits property for
  purchase on behalf of a licensee who lacks a buyer's agency agreement must clearly disclose that a
  real estate licensee is involved in the solicitation. The correct choice states this disclosure
  requirement. The other options add details—such as including the broker's trade name, stating a
  maximum price, or obtaining prior broker approval—that are not required by this statute.
