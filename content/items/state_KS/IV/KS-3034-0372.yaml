stem: Under Kan. Stat. Ann. § 58-3050(h)(2), if a violation of subsection (a)(4) or (a)(5) is
  **NOT** reasonably ascertainable, how long does the commission have to commence a complaint after
  the violation is ascertained?
options:
  - Seven years
  - Three years
  - Four years
  - Five years
key: B
explanation: The statute states that if a violation of subsection (a)(4) or (a)(5) is not reasonably
  ascertainable, complaints must be commenced within three years from the date the violation is
  ascertained by the commission. Therefore, the correct period is three years. The distractor “Two
  years” incorrectly halves the period prescribed by law.
