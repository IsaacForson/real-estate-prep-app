  - Amount of one hundred dollars
  - Amount of two hundred dollars
  - Amount of five hundred dollars
key: B
explanation: The statute explicitly allows a broker to keep up to $100 in the trust account for
  account expenses. Therefore, the correct amount is one hundred dollars. The distractor of fifty
  dollars is incorrect because the limit is higher, and two hundred dollars exceeds the permitted
  amount.
