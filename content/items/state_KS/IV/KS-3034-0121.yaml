stem: A licensee advertises a property that is listed with a broker but omits the supervising
  broker's trade name from the advertisement. Under Kan. Stat. Ann. § 58-3086, which statement best
  describes this situation?
options:
  - Advertising a property listed with a broker without including the supervising broker's trade name
  - Advertising a property using a slogan that does not confuse the public
  - Advertising a personally owned property without including the supervising broker's trade name
  - Advertising a personally owned property while clearly stating the licensee is the owner
key: A
explanation: Subsection (b)(B) requires all advertising to include the supervising broker's trade
  name prominently. Omitting that name when the property is broker‑listed violates that requirement.
  The other options describe actions that are either exempt or expressly allowed by the rule.
