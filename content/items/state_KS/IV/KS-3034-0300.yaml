stem: Under Kan. Stat. Ann. § 58-3062(a)(3), what is a licensee prohibited from doing regarding
  rebates or commissions?
options:
  - Accepting, giving, or charging any rebate or undisclosed commission is prohibited.
  - Accepting a commission that is disclosed to the client is prohibited.
  - Giving a gift of nominal value to a client as a thank‑you is prohibited.
  - Charging a fee for administrative services that is disclosed in the contract is prohibited.
key: A
explanation: The statute explicitly forbids a licensee from accepting, giving, or charging any
  rebate or undisclosed commission. Accepting a commission that is disclosed to the client is not
  prohibited; the statute only bans undisclosed commissions or any rebate.
