stem: A licensee includes a photograph of their home office in an advertisement, but that office is
  not designated as a primary or branch office with the commission. Under Kan. Stat. Ann. §
  58-3086(a)(3), what is the status of this advertisement?
options:
  - The advertisement is permitted because the office is privately owned
  - The advertisement is prohibited because the office is not commissioned-designated
  - The advertisement is allowed if the advertisement also shows the supervising broker's name
  - The advertisement is permitted if the licensee works from that office full-time
key: B
explanation: The key is correct because §58-3086(a)(3) forbids including in an advertisement any
  office where real estate activity is conducted that is not designated as a primary or branch
  office with the commission. The most tempting distractor is “The advertisement is permitted
  because the office is privately owned,” which incorrectly assumes ownership overrides the
  designation requirement, but the rule makes no exception for private offices.
