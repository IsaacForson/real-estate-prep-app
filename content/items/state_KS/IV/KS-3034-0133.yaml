stem: A licensee pays an unlicensed assistant to conduct property showings and negotiate purchase
  offers. Under Kan. Stat. Ann. § 58-3062(a)(10), is this action permissible?
options:
  - The action is permissible if the assistant holds a license from another state
  - The action is permissible because the assistant works under the licensee's supervision
  - The action is not permissible because paying an unlicensed person to perform licensed acts is
    prohibited
  - The action is permissible if the assistant receives a fixed fee for services
key: C
explanation: The statute forbids paying any unlicensed person for performing activities that require
  a license, regardless of supervision or payment method. Therefore, paying an unlicensed assistant
  to conduct showings and negotiate offers is not allowed. The suggestion that supervision makes the
  action permissible is incorrect because the prohibition applies irrespective of the assistant's
  relationship to the licensee.
