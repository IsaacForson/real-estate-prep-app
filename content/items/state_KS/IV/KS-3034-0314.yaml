stem: Which of the following brokers is exempt from the requirement to maintain a trust account
  under Kan. Stat. Ann. § 58-3061(f)?
options:
  - A broker whose license is on deactivated status
  - A broker who actively handles earnest money deposits for clients
  - A broker who is the supervising broker of a corporation's office
  - A broker who holds a current active license and performs residential sales
key: A
explanation: The statute explicitly exempts brokers whose licenses are on deactivated status from
  the trust account requirement. The other options describe brokers who are actively handling trust
  funds, serving as supervising brokers, or holding active licenses, none of which qualify for the
  exemption.
