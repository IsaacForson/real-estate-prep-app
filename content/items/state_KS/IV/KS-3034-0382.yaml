stem: Under Kan. Stat. Ann. § 58-3062(a)(2), which action is prohibited regarding a licensee's trust
  account?
options:
  - Depositing earnest money within five business days of receipt
  - Providing a detailed closing statement to the seller after closing
  - Commingling the licensee's own money with trust account funds
  - Keeping up to one hundred dollars in the trust account for expenses
key: C
explanation: The statute prohibits a licensee from commingling the money or other property of
  principals with the licensee's own money or property in a trust account. Keeping up to $100 for
  account expenses is expressly allowed, so it is not prohibited. Depositing earnest money within
  five business days and providing a closing statement are separate requirements unrelated to the
  commingling ban.
