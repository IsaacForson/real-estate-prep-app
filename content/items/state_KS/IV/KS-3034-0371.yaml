stem: "During a pre‑listing inspection, a licensee discovers active termite damage in the crawl
  space. The licensee proceeds to list the property without mentioning the termite damage to
  prospective buyers. Under Kan. Stat. Ann. § 58-3050(d)(2)(E), the licensee's conduct may be
  considered an aggravating circumstance because the licensee:"
options:
  - Failed to disclose the licensee's personal credit score.
  - Failed to disclose a material defect in the real property.
  - Failed to disclose the property's annual property tax amount.
  - Failed to disclose the broker's commission split.
key: B
explanation: The statute lists material defects in the real property as an adverse material fact
  that must be disclosed; omitting such a fact can constitute an aggravating circumstance. The
  licensee's personal credit score is not a required disclosure under this provision.
