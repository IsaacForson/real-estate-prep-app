stem: Under Kan. Stat. Ann. § 58-3062(a)(19), how many business days does a licensee have to deposit
  earnest money received from a buyer after the purchase agreement is signed by all parties, unless
  a written agreement specifies a different date?
options:
  - Seven business days
  - Three business days
  - Five business days
  - Ten business days
key: C
explanation: The statute requires deposit within five business days after the agreement is signed,
  unless a written agreement provides otherwise. The three‑business‑day option is incorrect because
  the law sets a five‑day period, not three.
