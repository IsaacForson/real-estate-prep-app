stem: A salesperson receives an earnest money check from a buyer on Wednesday. The purchase
  agreement is signed by all parties that day. Under Kan. Stat. Ann. § 58-3062(b)(2), by when must
  the salesperson place the check in the custody of the broker?
options:
  - As soon after receipt as practicable
  - Within five business days of receipt
  - Within three business days of receipt
  - Within one business day of receipt
key: A
explanation: The rule requires a salesperson to place any deposit money entrusted to them in the
  broker's custody as soon after receipt as practicable. The five‑business‑day deadline applies to
  earnest money deposited by a licensee, not to the salesperson’s duty to turn funds over to the
  broker. The shorter time frames are not mandated by the statute.
citation:
  source: Kan. Stat. Ann. § 58-3062(b)(2)
  url: null
  quoted_text: Fail to place, as soon after receipt as practicable, any deposit money or other funds
    entrusted to the salesperson or associate broker in the custody of the broker whom the
    salesperson or associate broker represents.
