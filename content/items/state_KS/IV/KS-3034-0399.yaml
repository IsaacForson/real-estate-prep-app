stem: A licensee files with the Kansas Real Estate Commission a change‑of‑address form that falsely
  states the brokerage’s primary office location. Under Kan. Stat. Ann. § 58-3073, what is the
  criminal penalty for this action?
options:
  - A class B misdemeanor
  - A civil fine of $250
  - A class C misdemeanor
  - A class A misdemeanor
key: D
explanation: Submitting a false document to the commission violates § 58-3073 regardless of the
  document’s purpose, and the violation is punishable as a class A misdemeanor. The civil fine
  amount is not mentioned in the statute, and the law does not differentiate between classes B or C
  for this offense.
