stem: A broker, acting as the listing agent, places a yard sign advertising a property for sale
  before obtaining the seller's written consent. Under Kan. Stat. Ann. § 58-3062(a)(7), is this
  action permissible?
options:
  - Yes, because the sign is temporary and does not affect the property's value or marketability.
  - No, because written consent is required before placing a sign offering property for sale or
    lease.
  - Yes, provided the broker informs the seller verbally after placing the sign and obtains
    retroactive approval.
  - No, unless the sign is removed within one business day and the seller provides written consent
    afterward.
key: B
explanation: The statute forbids placing a sign offering property for sale or lease without the
  owner's written consent. The claim that the sign is temporary and does not affect the property's
  value or marketability is incorrect because the prohibition does not depend on those factors.
