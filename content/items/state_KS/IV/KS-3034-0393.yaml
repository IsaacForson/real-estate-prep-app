stem: A broker's trust account is found to have insufficient funds to cover client earnest money
  deposits, and the commission has reasonable cause to believe the account is in unsound condition.
  Under Kan. Stat. Ann. § 58-3050(j), what may the commission do?
options:
  - The commission may issue a cease‑and‑desist order requiring the broker to stop all real estate
    activity.
  - The commission may refer the matter to the county prosecutor for criminal charges.
  - The commission may use emergency adjudicative proceedings to summarily suspend the broker's
    license.
  - The commission may impose a civil fine of up to $5,000 per violation for the unsound condition.
key: C
explanation: Under subsection (j), the commission may use emergency adjudicative proceedings to
  summarily suspend a license when it has reasonable cause to believe the trust account is in
  unsound condition. Issuing a cease‑and‑desist order, imposing a fine, or referring to a prosecutor
  are not authorized by this subsection.
