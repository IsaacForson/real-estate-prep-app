stem: A broker closes a sale on Friday. The broker must deliver to the seller a complete, detailed
  closing statement showing all receipts and disbursements handled by the broker for the seller.
  Under Kan. Stat. Ann. § 58-3062(c)(2), when must this be delivered?
options:
  - Within ten business days after closing
  - Upon request from the seller after closing
  - At the time the transaction is closed
  - Within five business days after closing
key: C
explanation: The statute requires the broker to deliver the closing statement to the seller at the
  time the transaction is closed. Delivering within five or ten business days or only upon request
  does not satisfy the immediate‑at‑closing requirement.
