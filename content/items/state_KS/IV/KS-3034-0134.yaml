stem: Under Kan. Stat. Ann. § 58-3073, which of the following actions is unlawful?
options:
  - Filing a truthful statement required under K.S.A. 58-3066 to 58-3071
  - Filing a false statement required under K.S.A. 58-3066 to 58-3071
  - Filing any statement not required under K.S.A. 58-3066 to 58-3071
  - Filing a statement after the statutory deadline set by the commission
key: B
explanation: The statute makes it unlawful to file with the commission any false or untrue statement
  containing a material misstatement of fact that is required under K.S.A. 58-3066 through 58-3071.
  Therefore, filing a false statement required under those sections is prohibited. Filing a truthful
  statement, while not prohibited, is not the unlawful act described.
citation:
  source: Kan. Stat. Ann. § 58-3073
  url: null
  quoted_text: It shall be unlawful for any person or such person's agent to file with the commission
    any statement or other document, required under the provisions of K.S.A. 58-3066 to 58-3071 ,
    inclusive, and amendments of such sections, which is false or untrue or contains any material
    misstatement of fact.
