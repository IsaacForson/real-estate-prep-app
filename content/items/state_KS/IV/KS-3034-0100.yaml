stem: Under Kan. Stat. Ann. § 58-3061(d), when may a broker receive earnest money as part of the
  broker's commission?
options:
  - After the broker receives written consent from the seller unless otherwise agreed in writing
  - After the transaction is consummated or terminated unless otherwise agreed in writing
  - After thirty days have passed since the deposit unless otherwise agreed in writing
  - After the closing agent releases the funds unless otherwise agreed in writing
key: B
explanation: The statute prohibits a broker from being entitled to earnest money as commission until
  the transaction has been consummated or terminated unless otherwise agreed in writing by all
  parties. The other options are not permitted by the rule.
citation:
  source: Kan. Stat. Ann. § 58-3061(d)
  url: null
  quoted_text: A broker shall not be entitled to any part of the earnest money or other money paid to
    the broker in connection with any real estate transaction as part or all of the broker's
    commission or fee until the transaction has been consummated or terminated unless otherwise
    agreed in writing by all parties to the transaction.
