stem: A licensee receives an earnest money check from a buyer on Monday. The purchase agreement is
  signed by all parties that day and contains no written agreement altering the deposit deadline.
  Under Kan. Stat. Ann. § 58-3062(a)(19), by what deadline must the licensee deposit the check?
options:
  - Within three business days after the agreement is signed
  - Within ten calendar days after the agreement is signed
  - Within five business days after the agreement is signed
  - Within one business day after the agreement is signed
key: C
explanation: The rule requires deposit of earnest money within five business days after the
  agreement is signed, unless a written agreement specifies another date. Since no such agreement
  exists, the five‑business‑day deadline applies. The distractor of one business day is too short
  and not supported by the statute.
citation:
  source: Kan. Stat. Ann. § 58-3062 — K.S.A. Kan. Stat. Ann. § 58-3062 — Prohibited acts (a)(19)
  url: null
  quoted_text: Fail to deposit any check or cash received as an earnest money deposit or as a deposit
    on the purchase of a lot within five business days after the purchase agreement or lot
    reservation agreement is signed by all parties, unless otherwise specifically provided by
    written agreement of all parties to the purchase agreement or lot reservation agreement, in
    which case the licensee shall deposit the check or cash received on the date provided by such
    written agreement.
