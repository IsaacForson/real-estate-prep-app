stem: A salesperson creates and runs an online advertisement for a listing without the direct
  supervision of their supervising broker. Under Kan. Stat. Ann. § 58-3086(b)(A), what is the status
  of this advertisement?
options:
  - The advertisement is permitted if it includes the broker's contact information
  - The advertisement is prohibited because it lacks direct supervision
  - The advertisement is allowed if the supervising broker later approves it
  - The advertisement is permitted because the salesperson is licensed
key: B
explanation: The key is correct because §58-3086(b)(A) requires all advertising by a licensee to be
  conducted under the direct supervision of the supervising broker or branch broker. The most
  tempting distractor is “The advertisement is permitted because the salesperson is licensed,” which
  mistakenly thinks individual licensing suffices, but the rule mandates broker supervision
  regardless of the salesperson’s license status.
