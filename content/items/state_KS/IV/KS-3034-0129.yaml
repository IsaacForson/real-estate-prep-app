stem: Under Kan. Stat. Ann. § 58-3062(g), what is required for a branch broker to be employed by
  more than one supervising broker?
options:
  - The branch broker must obtain verbal consent from each supervising broker and notify the
    commission within ten days.
  - The branch broker must obtain written consent of each supervising broker on a
    commission-provided form and file it with the commission.
  - The branch broker may work for multiple supervising brokers without any consent if the brokers
    are in the same office.
  - The branch broker must obtain written consent from only the primary supervising broker and keep
    it on file.
key: B
explanation: Kan. Stat. Ann. § 58-3062(g) requires that a branch broker obtain written consent from
  each supervising broker on a commission-provided form and file that form with the commission
  before the multiple employment is effective. The option suggesting verbal consent is incorrect
  because the statute mandates written consent on a commission form, not merely verbal consent.
citation:
  source: Kan. Stat. Ann. § 58-3062(g)
  url: null
  quoted_text: A branch broker shall not be employed by or associated with more than one supervising
    broker at any one time unless each supervising broker who employs or associates with the branch
    broker consents to such multiple employment or association. Such consent shall be on a form
    provided by the commission and shall not be effective until a signed copy of the completed form
    has been filed with the commission.
