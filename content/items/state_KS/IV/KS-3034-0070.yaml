stem: A licensee entered a guilty plea to a felony before July 1, 2007 and disclosed it on the
  license application. Under Kan. Stat. Ann. § 58-3050(c), what is the effect on the licensee's
  eligibility?
options:
  - The imposition of a five thousand dollar fine
  - The ineligibility for any real estate license
  - The continued eligibility for real estate licensure
  - The automatic revocation of the license
key: C
explanation: Subsection (c) provides an exception to the automatic suspension/revocation for felony
  convictions if the licensee disclosed the conviction on or before July 1, 2007. Therefore, the
  licensee remains eligible for licensure. The other options describe consequences that do not apply
  due to this exception.
citation:
  source: "### Kan. Stat. Ann. § 58-3050 — K.S.A. Kan. Stat. Ann. § 58-3050 — section (c)"
  url: null
  quoted_text: >-
    (c) The provisions of subsection (b) shall not apply to any person who:
     (1) Is currently licensed under this act;
     (2) has entered a plea of guilty or nolo contendere to, or has been convicted of any offense specified in subsection (b); and
     (3) has disclosed such plea or conviction in such person's application for any license or renewal thereof on or before July 1, 2007, prior to the commission's action on such application.
