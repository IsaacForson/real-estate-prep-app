stem: Under Kan. Stat. Ann. § 58-3086(a)(2), which action is prohibited in any advertisement?
options:
  - Using a competitor's logo without permission
  - Displaying the supervising broker's trade name prominently
  - Including a slogan that mentions the property price
  - Providing contact information for the licensee
key: A
explanation: The rule forbids using any trademark, logo, or similar mark of another organization
  without authorization. Displaying the supervising broker's trade name is actually required under
  subsection (b)(B), and including a slogan or contact information is permitted under other
  subsections.
