stem: A licensee, acting as a transaction broker, receives a $75 gift card from a title insurance
  agent after referring a client for a title policy. Under Kan. Stat. Ann. § 58-3062(a)(23), is this
  action permissible?
options:
  - No, unless the licensee has a written agreement with the title insurance agent.
  - Yes, provided the licensee discloses the gift card to the client.
  - No, because accepting any special favor from a title insurance agent is prohibited.
  - Yes, because the gift card is less than $100 and therefore exempt.
key: C
explanation: The statute prohibits a licensee from knowingly receiving any special favor or
  advantage from a title insurance agent related to title insurance. The statement that the licensee
  may accept the gift card if there is a written agreement with the title insurance agent is
  incorrect because the $100 exemption applies only to trust account expenses, not to gifts from
  title agents.
