stem: Under Kan. Stat. Ann. § 58-3062(a)(1), what action is a licensee prohibited from taking
  regarding money that belongs to others and comes into their possession?
options:
  - Failing to account for and remit the money
  - Commingling the money with personal funds in a trust account
  - Depositing the money after five business days
  - Accepting non-cash earnest money without owner consent
key: A
explanation: The statute explicitly prohibits a licensee from failing to account for and remit any
  money that comes into their possession and belongs to others. Commingling funds is addressed
  separately in subsection (a)(2), so it is not the conduct barred by subsection (a)(1).
