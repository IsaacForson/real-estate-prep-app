stem: A licensee advertises a residential property they personally own for sale, and the property is
  not listed with any broker. Under Kan. Stat. Ann. § 58-3086, what must the advertisement include?
options:
  - Both the broker's trade name and ownership info
  - The licensee's contact information and phone
  - The supervising broker's trade name displayed
  - A statement that the licensee owns the property
key: D
explanation: Because the property is owned by the licensee and not listed with a broker, subsection
  (e) requires the advertisement to clearly inform the public that the licensee is the owner or has
  an interest in the property. The distractors either impose unrelated requirements or combine them
  incorrectly.
