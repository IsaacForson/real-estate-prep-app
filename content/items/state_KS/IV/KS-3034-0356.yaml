stem: Under Kan. Stat. Ann. § 58-3062(a)(15), what must a licensee disclose to a purchaser or lessee
  regarding the real estate being sold or leased?
options:
  - The interest the licensee has in the real estate sold or leased
  - The name of the escrow agent holding the funds must be provided to the parties
  - The requirement to disclose whether earnest money is cash or non‑cash
  - The approximate amount of closing costs that must be paid at settlement
key: A
explanation: The rule requires licensees to disclose any personal interest they have in the property
  to buyers or lessees. The option stating that the licensee must disclose the interest they hold in
  the real estate being sold or leased correctly reflects this requirement. The other options
  describe different disclosure duties (such as providing the escrow agent's name, disclosing
  whether earnest money is cash or non‑cash, or stating approximate closing costs) which are not
  required by subsection (a)(15).
