stem: A licensee receives an earnest money check on Tuesday. The purchase agreement, signed by all
  parties that day, includes a written agreement stating that the earnest money must be deposited on
  the date specified in the agreement, which is two business days after signing. Under Kan. Stat.
  Ann. § 58-3062(a)(19), by what date must the licensee deposit the earnest money?
options:
  - On the following Friday
  - On the following Thursday
  - On the following Saturday
  - On the following Wednesday
key: B
explanation: When a written agreement provides a deposit date, the licensee must deposit on that
  date. Two business days after Tuesday is Thursday, so the deposit is due Thursday. The Wednesday
  option assumes only one business day, which contradicts the written agreement.
