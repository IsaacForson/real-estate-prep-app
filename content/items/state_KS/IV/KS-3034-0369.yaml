stem: Under Kan. Stat. Ann. § 58-3050(d)(2), what is the maximum civil fine the commission may
  impose for a single violation if aggravating circumstances are found?
options:
  - $500 per violation.
  - $1,000 per violation.
  - $5,000 per violation.
  - $10,000 per violation.
key: C
explanation: The statute authorizes a civil fine not exceeding $5,000 per violation when the
  commission finds aggravating circumstances. The $1,000 amount applies only when no aggravating
  circumstances are found under subsection (d)(1).
