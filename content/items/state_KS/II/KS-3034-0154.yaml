stem: Under the Kansas Real Estate Brokers' and Salespersons' License Act, what does the term
  "advance listing fee" include?
options:
  - Any fee charged for listing in a publication where inquiries are directed to unlicensed persons
    who publish the listing.
  - Any fee charged for services related to promoting the sale or lease of real estate and paid in
    advance of the rendering of such services.
  - Any fee charged for listing real estate after the services have been fully rendered.
  - Any fee paid solely for advertisement in a publication issued for the sole purpose of promoting
    the sale or lease of real estate.
key: B
explanation: Kansas law defines an advance listing fee as any fee charged for services related to
  promoting the sale or lease of real estate and paid before those services are performed (Kan.
  Stat. Ann. § 58‑3035(b)). The option that describes a fee for such promotional services paid in
  advance therefore meets the definition. Options that describe fees tied to a publication where
  inquiries go to unlicensed persons, fees charged after services are rendered, or fees solely for
  advertisement do not match the statutory definition and are therefore incorrect.
