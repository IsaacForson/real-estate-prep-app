stem: A salesperson who is not licensed under the Kansas Real Estate Brokers' and Salespersons'
  License Act shows a property to a prospective buyer and later demands a commission from the buyer.
  Under K.S.A. 58-3038(a), what is the likely outcome if the salesperson sues for the commission?
options:
  - The salesperson may recover commission if they had a verbal agreement even if such agreement
    exists.
  - The salesperson can recover commission if they later obtain a license before filing suit even
    after obtaining licensure later.
  - The salesperson cannot recover compensation because they were unlicensed at the time of offering
    to perform the service.
  - The salesperson will recover the commission because the buyer benefited under any circumstances.
key: C
explanation: K.S.A. 58-3038(a) prohibits recovery of compensation for any act requiring a license
  unless the person was duly licensed at the time of offering to perform the service or procuring a
  promise to pay. Since the salesperson was unlicensed when showing the property, they cannot
  recover compensation. The option stating that the salesperson may recover commission if they had a
  verbal agreement is incorrect because even a verbal agreement does not override the licensure
  requirement.
citation:
  source: Kan. Stat. Ann. § 58-3038(a)
  url: null
  quoted_text: Except as provided by subsection (b), no action shall be instituted or recovery be had
    in any court of this state by any person for compensation for any act or service, the
    performance of which requires a license under this act, unless such person was duly licensed
    under this act at the time of offering to perform any such act or service or procuring any
    promise to contract for the payment of compensation for any such contemplated act or service.
