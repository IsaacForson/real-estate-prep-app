stem: Under Kansas law, when must a renewal application be filed to avoid automatic expiration of
  the license?
options:
  - Within 30 days after the expiration date
  - On or before the expiration date
  - Within six months after the expiration date
  - After the commission sends a renewal notice
key: B
explanation: The statute explicitly states that a license is renewable upon filing a renewal
  application on or before the expiration date. Filing after that date results in automatic
  expiration unless the license is reinstated under subsection (c). The distractor suggesting a
  six‑month window confuses the renewal deadline with the reinstatement grace period.
