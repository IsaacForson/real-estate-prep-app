stem: An applicant passed the Kansas state portion of the real estate examination seven months ago
  and has now submitted an application for a salesperson license. According to Kan. Stat. Ann. §
  58-3039(f)(3), what is the status of the examination results?
options:
  - The examination results remain valid for another five months
  - The examination results are still valid for the general portion only
  - The examination results are expired and cannot be used for licensure
  - The examination results must be retaken for the state portion only
key: C
explanation: Subsection (f)(3) states that no license shall be issued if any exam portion was
  administered more than six months before the application is received. Since seven months have
  passed, the results are expired and cannot be used. The distractor "The examination results remain
  valid for another five months" is incorrect because the six‑month limit is measured from the exam
  date to the application receipt date, not forward from the present.
