stem: An applicant for a Kansas broker license has been licensed as a salesperson in Kansas for 10
  months and has completed a commission-approved real estate broker pre-licensing course of 60
  hours. The commission determines that the combination of the applicant's salesperson experience
  and education qualifies the applicant to act as a broker. According to K.S.A. 58-3039(e), what is
  the effect of this determination?
options:
  - The applicant is automatically eligible for a broker license regardless of experience.
  - The applicant must still complete two years of active salesperson experience before being
    eligible for a broker license.
  - The applicant must retake the salesperson examination before applying for a broker license.
  - The applicant may be considered to have satisfied the experience requirement for a broker
    license, in whole or in part.
key: D
explanation: The statute allows the commission to accept a combination of experience and education
  as equivalent to all or part of the required experience for a broker license. Therefore, the
  applicant may satisfy the experience requirement partially or fully, not necessarily needing two
  more years of experience.
citation:
  source: Kan. Stat. Ann. § 58-3039(e)
  url: null
  quoted_text: The commission may accept proof of experience in the real estate or a related business
    or a combination of such experience and education which the commission believes qualifies the
    applicant to act as a broker as being equivalent to all or part of the experience required by
    subsection (d).
