stem: Under K.S.A. 58-3038(a), what is the legal consequence for a person who seeks compensation in
  court for performing an act that requires a real estate license when they were **NOT** licensed at
  the time of offering to perform the act?
options:
  - No action may be instituted or recovery be had in any court for such compensation.
  - They may recover compensation if they obtain a license before filing the lawsuit.
  - They may recover compensation only if the client agrees to pay after the lawsuit is filed.
  - They may recover compensation if the act was performed under the supervision of a licensed
    broker.
key: A
explanation: The statute plainly states that no action may be instituted or recovery be had for
  compensation unless the person was duly licensed at the time of offering to perform the act or
  procuring a promise to pay. Therefore, seeking compensation without meeting that timing
  requirement is barred. The distractor suggesting recovery if supervised by a licensed broker is
  incorrect because the statute does not provide an exception for supervision; the licensing
  requirement applies to the person seeking compensation.
citation:
  source: Kan. Stat. Ann. § 58-3038(a)
  url: null
  quoted_text: Except as provided by subsection (b), no action shall be instituted or recovery be had
    in any court of this state by any person for compensation for any act or service, the
    performance of which requires a license under this act, unless such person was duly licensed
    under this act at the time of offering to perform any such act or service or procuring any
    promise to contract for the payment of compensation for any such contemplated act or service.
