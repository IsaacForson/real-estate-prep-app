stem: What is the maximum allowable time between taking a real estate examination portion and
  submitting an application for an original Kansas real estate license?
options:
  - Twelve months
  - Six months
  - Nine months
  - Three months
key: B
explanation: Under K.S.A. 58-3039(f)(3), a license shall not be issued if any examination portion
  was administered more than six months before the application is received. Therefore, the maximum
  allowable time is six months. The three‑month option is incorrect because the rule allows up to
  six months, not a stricter three‑month limit.
