stem: If a supervising broker’s license expires and no prior notification is given to the
  commission, within how many calendar days must the licenses of the broker’s associated licensees
  be placed on inactive status?
options:
  - Ten calendar days
  - Five calendar days
  - Three calendar days
  - Seven calendar days
key: A
explanation: Section 58-3080(a) specifies that associated licenses become inactive within five
  calendar days after written notice, unless prior notification is provided. The other time frames
  are not authorized by the statute.
