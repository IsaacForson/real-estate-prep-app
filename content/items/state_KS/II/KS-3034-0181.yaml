stem: A supervising broker’s license is set to expire, but the broker notifies the commission in
  writing before the expiration date that another broker will assume the supervising role. What
  happens to the licenses of the salespersons associated with that supervising broker?
options:
  - They go on inactive status five days after expiration
  - They must move to another broker within five days to stay active
  - They stay active with no further action needed
  - They become inactive only if the commission rejects the substitute
key: C
explanation: Because the broker gave prior notice that another broker would assume the supervisory
  role, the exception in the statute prevents the automatic placement of associated licensees on
  inactive status. The distractor that says licenses go on inactive status ignores this statutory
  exception.
