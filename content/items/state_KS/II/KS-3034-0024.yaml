stem: A Kansas resident who holds a valid real estate broker's license in Oklahoma but does not hold
  a Kansas license negotiates the sale of a residential property in Topeka for a commission. Can
  this individual recover the commission in a Kansas court?
options:
  - Yes, because the individual is licensed in another jurisdiction
  - Yes, because the individual acted as a broker in the transaction
  - No, because the individual was not licensed in Kansas at the time of the service
  - No, because the individual failed to designate a supervising broker
key: C
explanation: Under Kan. Stat. Ann. § 58-3038(a), no recovery can be had for compensation for acts
  requiring a license unless the person was duly licensed under the Kansas act at the time of
  offering to perform the act. The individual was not licensed in Kansas, so they cannot recover the
  commission. The exception in subsection (c) applies only to referral fees, not to the commission
  for negotiating the sale itself.
