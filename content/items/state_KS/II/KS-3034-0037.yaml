stem: An applicant has been actively licensed as a salesperson in Kansas for 18 months and wants to
  apply for a broker license. According to Kan. Stat. Ann. § 58-3039(d)(1), what additional
  condition must the applicant meet to qualify for the broker license?
options:
  - Have completed four years of active real estate experience regardless of when it was obtained
  - Have completed two years of active real estate experience within the three years before applying
  - Have completed one year of active real estate experience within the two years before applying
  - Have completed three years of active real estate experience within the five years before applying
key: B
explanation: Subsection (d)(1) requires at least two years of active real estate experience during
  the three years immediately preceding the application. With 18 months of experience, the applicant
  needs an additional six months within that three‑year window. The distractor "Have completed three
  years of active real estate experience within the five years before applying" is wrong because the
  statute specifies a three‑year, not five‑year, look‑back period and requires only two years of
  activity.
citation:
