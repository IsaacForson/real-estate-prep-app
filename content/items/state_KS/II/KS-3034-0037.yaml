  url: null
  quoted_text: (d) (1) In addition to the requirements of subsection (c), except as provided in
    subsection (e), each applicant for an original license as a broker shall have been licensed as a
    salesperson in this state or as a salesperson or broker in another state, and shall have been
    actively engaged in any of the activities described in K.S.A. 58-3035 (f), and amendments
    thereto, for a period of at least two years during the three years immediately preceding the
    date of the application for a license.
