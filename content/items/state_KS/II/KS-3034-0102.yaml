stem: A licensee submits fingerprints to the Kansas Bureau of Investigation for a criminal history
  check as part of a license renewal. According to Kansas Administrative Regulations, what fee must
  the licensee pay to the commission for this service?
options:
  - $70
  - $100
  - $15
  - $20
key: A
explanation: K.A.R. 86-1-5(c)(1) requires a $70 fee for fingerprint submission to cover the KBI and
  commission costs. The $15 option is the application fee for an original salesperson license, $20
  is the fee for licensee course approval, and $100 is the fee for opening a branch office.
citation:
  source: Kan. Admin. Regs. § 86-1-5(c)(1)
  url: null
  quoted_text: Each applicant shall pay a fee of $70 to the commission for the cost of submitting the
    applicant's fingerprints to the Kansas bureau of investigation (KBI) for the purpose of
    obtaining a criminal history check conducted by the KBI and the federal bureau of investigation
    and for the commission's reasonable costs of administering the criminal history check program.
