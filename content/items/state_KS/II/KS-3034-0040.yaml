stem: According to Kansas Statutes Annotated § 58-3035, what is the definition of an "advance
  listing fee"?
options:
  - A fee charged for services related to promoting the sale or lease of real estate and paid in
    advance of rendering those services.
  - A fee paid solely for advertising in a publication that promotes real estate and directs
    inquiries to the owner.
  - A fee charged after services are completed for listing real estate or assisting with a lease.
  - A fee paid to an unlicensed person who publishes a real estate listing in a newspaper or
    magazine.
key: A
explanation: Kansas law defines an advance listing fee as any fee charged for services related to
  promoting the sale or lease of real estate and paid before those services are performed, but it
  excludes fees that are solely for advertising in a publication where inquiries are directed to the
  owner or broker. The statement that describes a fee charged for services related to promoting the
  sale or lease of real estate and paid in advance of rendering those services therefore matches the
  statutory definition. The other statements describe fees that are only for advertising, paid to an
  unlicensed person, or paid after services are completed, all of which are excluded by the statute.
