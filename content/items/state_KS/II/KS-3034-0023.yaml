stem: Under the Kansas Real Estate Brokers' and Salespersons' License Act, which entity is
  prohibited from being granted a real estate license?
options:
  - An individual licensed as an associate broker
  - A limited liability company
  - An individual licensed as a broker
  - An individual licensed as a salesperson
key: B
explanation: Kansas Statute Ann. § 58-3042(b) explicitly states that no license shall be granted to
  a limited liability company. Licenses are issued only to individuals, such as brokers,
  salespersons, and associate brokers, who must then be employed by or associated with the entity to
  perform licensed acts.
