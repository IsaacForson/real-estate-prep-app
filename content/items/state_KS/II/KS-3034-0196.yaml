stem: A licensee completes a commission‑approved real estate appraisal course on November 10 during
  their renewal period that ends December 31. How many elective hours of credit may the licensee
  apply toward the 12‑hour additional instruction requirement?
options:
  - One elective hour, because appraisal courses are limited to one hour per renewal period.
  - Two elective hours, as appraisal courses count as half‑credit toward the elective requirement.
  - Three elective hours, which is the maximum allowed for appraisal courses in any renewal period.
  - Four elective hours, since appraisal courses are treated the same as other elective courses.
key: C
explanation: K.A.R. §86-1-11(f)(3) limits appraisal‑course elective credit to a maximum of three
  hours per renewal period; therefore the licensee may claim up to three hours from the completed
  course.
