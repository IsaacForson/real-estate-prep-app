stem: A salesperson licensed in Nebraska wants to collect a referral fee in Kansas for referring a
  client to a Kansas broker. Under the Kansas Real Estate Brokers' and Salespersons' License Act, is
  this allowed?
options:
  - The salesperson may collect a referral fee only after completing a Kansas-specific continuing
    education course.
  - The salesperson may not collect a referral fee because Kansas law requires a Kansas license to
    receive any referral fee.
  - The salesperson may not collect a referral fee unless the referral fee is paid by a
    Kansas-licensed broker.
  - The salesperson may collect a referral fee because they are licensed as a broker or salesperson
    in another jurisdiction.
key: D
explanation: K.S.A. 58-3038(c) provides that a person who is properly licensed as a broker or
  salesperson in another jurisdiction may collect a referral fee, so the Nebraska-licensed
  salesperson may do so in Kansas. The statement that the salesperson may collect a referral fee
  only after completing a Kansas-specific continuing education course is incorrect because the
  statute does not impose any continuing‑education requirement for referral fees. The claim that the
  salesperson may not collect a referral fee because Kansas law requires a Kansas license to receive
  any referral fee is incorrect because the statute expressly permits out‑of‑state licensees to
  receive referral fees. The assertion that the salesperson may not collect a referral fee unless
  the referral fee is paid by a Kansas-licensed broker is also incorrect because the statute does
  not condition the fee on who pays it.
