stem: A Kansas real estate licensee teaches a commission‑approved real estate principles course for
  4 hours during their renewal period. How many hours of credit may the licensee receive for this
  instruction?
options:
  - The licensee may receive 1 hour of credit.
  - The licensee may receive 2 hours of credit.
  - The licensee may receive 4 hours of credit.
  - The licensee may receive 6 hours of credit.
key: C
explanation: Under Kansas Administrative Regulation 86-1-11(f)(5), an instructor receives credit
  equal to the number of hours taught, provided the credit is taken only once per course per renewal
  period. Therefore, teaching a 4‑hour course earns 4 hours of credit. The 2‑hour option incorrectly
  assumes a fixed minimum or confuses the limit for appraisal courses.
citation:
  source: Kan. Admin. Regs. § 86-1-11(f)(5)
  url: null
  quoted_text: Any licensee who is an instructor of a course approved by the commission to meet a
    requirement of K.S.A. 58-3046a, and amendments thereto, may receive credit for the number of
    hours taught by the instructor.
