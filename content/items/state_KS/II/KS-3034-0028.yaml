stem: A member of a Kansas limited liability company regularly negotiates purchase agreements for
  real estate on behalf of the LLC. Under the Kansas Real Estate Brokers' and Salespersons' License
  Act, what must be true for this member to legally perform these activities?
options:
  - The member must hold a broker's license issued to the LLC.
  - The member must be individually licensed as a broker or salesperson.
  - The member may rely on the LLC's corporate license to perform brokerage acts.
  - The member may perform the acts unlicensed if the LLC registers with the commission.
key: B
explanation: The statute prohibits granting a license to any LLC, corporation, partnership, or
  similar entity; each individual who performs acts requiring a license must be individually
  licensed as a broker or salesperson. Therefore the LLC member must hold an individual license. The
  distractor that suggests the LLC can be licensed is incorrect because the law explicitly bars
  licenses to such entities.
citation:
