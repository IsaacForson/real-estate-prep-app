stem: According to Kansas Statute §58-3035(b), how is an 'advance listing fee' defined?
options:
  - any fee charged for services related to promoting the sale or lease of real estate and paid in
    advance of the rendering of such services, including any fees charged for listing, advertising
    or offering for sale or lease any real estate, but excluding any fees paid solely for
    advertisement or for listing in a publication issued for the sole purpose of promoting the sale
    or lease of real estate wherein inquiries are directed to the owner of the real estate or to
    real estate brokers and not to unlicensed persons who publish the listing.
  - any fee charged solely for advertisement or for listing in a publication issued for the sole
    purpose of promoting the sale or lease of real estate wherein inquiries are directed to the
    owner of the real estate or to real estate brokers and not to unlicensed persons who publish the
    listing, and paid in advance of the rendering of such services.
  - any fee charged for services related to promoting the sale or lease of real estate and paid in
    advance of the rendering of such services, excluding any fees charged for listing, advertising
    or offering for sale or lease any real estate, but including any fees paid solely for
    advertisement or for listing in a publication issued for the sole purpose of promoting the sale
    or lease of real estate wherein inquiries are directed to the owner of the real estate or to
    real estate brokers and not to unlicensed persons who publish the listing.
  - any fee charged for services related to promoting the sale or lease of real estate and paid
    after the services are rendered, including any fees charged for listing, advertising or offering
    for sale or lease any real estate, but excluding any fees paid solely for advertisement or for
    listing in a publication issued for the sole purpose of promoting the sale or lease of real
    estate wherein inquiries are directed to the owner of the real estate or to real estate brokers
    and not to unlicensed persons who publish the listing.
key: A
explanation: The correct definition states that an advance listing fee is any fee charged for
  services related to promoting the sale or lease of real estate and paid in advance of rendering
  those services, including fees for listing, advertising, or offering the property, but excluding
  fees paid solely for advertisement or for listing in a publication where inquiries go to the owner
  or broker and not to unlicensed publishers.
