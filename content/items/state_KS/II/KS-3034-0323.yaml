stem: A supervising broker’s license is scheduled to be deactivated on April 10. The broker has not
  notified the commission that another broker will assume the supervising role. According to Kan.
  Stat. Ann. § 58-3083(a), by what date must the broker advise all clients and customers that they
  will be unable to perform existing brokerage agreements after the deactivation?
options:
  - By April 20
  - By April 10
  - By April 15
  - By April 30
key: B
explanation: The statute requires the broker to advise clients on or before the expiration or
  deactivation date of the license when no replacement broker has been nominated. Therefore, the
  advice must be given by April 10, the deactivation date. The distractor "By April 15" incorrectly
  applies the five‑day rule for inactive status, which does not govern this disclosure requirement.
citation:
  source: Kan. Stat. Ann. § 58-3083(a)
  url: null
  quoted_text: the supervising broker or branch broker whose license expires or is deactivated, on or
    before the expiration date or deactivation date of the license, shall advise all clients and
    customers that the supervising broker or branch broker and any licensees that are employed by or
    associated with the supervising broker or branch broker will be unable to perform the terms and
    conditions contained in the listing or brokerage agreement with the client or customer after the
    expiration or deactivation of the supervising broker's or branch broker's license.
