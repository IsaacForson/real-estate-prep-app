stem: A salesperson’s license expired eight months ago. What must the licensee do to regain licensure?
options:
  - Submit a renewal application with the late fee
  - Submit a certificate for twelve CE hours
  - Submit a request for a fee waiver to the commission
  - Submit a new application for an original license
