stem: Under the Kansas Real Estate Brokers' and Salespersons' License Act, what is the minimum
  education requirement for an applicant to be eligible for a broker or salesperson license?
options:
  - A high school diploma or its equivalent
  - Two years of college coursework
  - A bachelor's degree in real estate
  - Completion of a 60-hour prelicense course
key: A
explanation: Subsection (c) of Kan. Stat. Ann. § 58-3039 requires a high school diploma or its
  equivalent for licensure as a broker or salesperson. The distractor "Two years of college
  coursework" is incorrect because the statute does not mandate any college education; it only
  requires the high school diploma or equivalent.
