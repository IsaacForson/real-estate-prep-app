stem: What must accompany an application for an original license as a salesperson or associate
  broker under the Kansas Real Estate Brokers' and Salespersons' License Act?
options:
  - A recommendation from the supervising broker or branch broker certifying the applicant’s
    honesty, trustworthiness, and good reputation
  - Proof of completion of the 60-hour pre-license education course approved by the Kansas Real
    Estate Commission
  - A copy of the applicant’s high school diploma or GED certificate showing completion of secondary
    education
  - A receipt showing payment of the state and federal fingerprinting fee required for the
    background check
key: A
explanation: The statute requires that an application for an original license as a salesperson or
  associate broker be accompanied by a recommendation from the supervising broker or branch broker
  certifying the applicant’s honesty, trustworthiness, and good reputation. The other options, while
  related to licensing, are not specified as accompanying the application in this subsection.
citation:
  source: Kan. Stat. Ann. § 58-3039(h)
  url: null
  quoted_text: An application for an original license as a salesperson or associate broker shall be
    accompanied by the recommendation of the supervising broker or branch broker with whom the
    salesperson or associate broker is to be associated, or by whom the salesperson or associate
    broker is to be employed, certifying that the applicant is honest, trustworthy and of good
    reputation.
