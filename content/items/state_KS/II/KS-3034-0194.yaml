stem: How long after the expiration date may a licensee submit a late renewal application to be
  eligible for reinstatement of an expired Kansas real estate license?
options:
  - Within three months following the date of expiration.
  - Within six months following the date of expiration.
  - Within nine months following the date of expiration.
  - Within twelve months following the date of expiration.
key: B
explanation: Under Kan. Stat. Ann. § 58-3045(c), a licensee may submit an application for late
  renewal within six months following the date of expiration to be eligible for reinstatement; after
  that period, the license cannot be renewed via late renewal and requires a new original
  application.
