stem: Which statement about the transferability of a Kansas real estate license is correct according
  to K.S.A. 58-3042(a)?
options:
  - The license can be used by any employee of the brokerage.
  - The license may be transferred to a family member upon death.
  - The license gives authority only to the person to whom it is issued.
  - The license can be leased to another broker for a fee.
key: C
explanation: K.S.A. 58-3042(a) states that no real estate license shall give authority to any person
  other than the person to whom the license is issued, meaning the license is nontransferable and
  only the named licensee may act under it. The statement that the license gives authority only to
  the person to whom it is issued reflects this rule. The statement that the license can be used by
  any employee of the brokerage is incorrect because the license does not extend to employees.
