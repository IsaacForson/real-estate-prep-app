stem: A course provider submits three different courses for approval to the Kansas Real Estate
  Commission. What total fee must be paid?
options:
  - $75.00
  - $225.00
  - $300.00
  - $150.00
key: B
explanation: Each course approval requires a fee of $75 under K.A.R. 86-1-5(e). For three courses,
  the total is 3 × $75 = $225. The $150.00 option results from mistakenly calculating the fee for
  only two courses.
citation:
