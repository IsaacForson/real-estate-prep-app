stem: Under Kansas law, what is a transaction broker prohibited from doing?
options:
  - Acting as an agent for either party in the transaction
  - Charging a commission for services rendered to the client
  - Showing competing properties to prospective buyers
  - Receiving earnest money deposits into a trust account
key: A
explanation: Kan. Stat. Ann. § 58-30,113(a) provides that a broker engaged as a transaction broker
  shall not act as an agent for either party. The statute does not prohibit a transaction broker
  from charging a commission, showing competing properties, or receiving earnest money deposits into
  a trust account.
