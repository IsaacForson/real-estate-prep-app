stem: A Kansas broker agrees to pay a referral fee to an out-of-state broker for referring a client.
  Under Kansas law, what must the broker do when paying the referral fee?
options:
  - Provide verbal consent from the client and document the conversation in the transaction file.
  - Provide written disclosure to the client of any financial interest the broker has in the
    receiving brokerage firm.
  - Provide a referral fee that does not exceed twenty percent of the total commission earned.
  - Provide a record of the referral fee in the escrow account and retain it for three years.
key: B
explanation: Under Kan. Stat. Ann. § 58-30,105, a broker who pays a referral fee to an out‑of‑state
  broker must provide the client with a written disclosure of any financial interest the broker has
  in the brokerage that will receive the fee. Verbal consent does not meet this requirement, and the
  statute does not impose a percentage cap or a specific escrow‑record rule for referral fees.
