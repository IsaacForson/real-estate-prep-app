stem: A salesperson lists a home after the seller informs them that the roof was replaced two years
  ago. The salesperson has no personal knowledge of the roof's actual age and relies on the seller's
  statement. Later, the buyer discovers the roof is original and sues for negligent
  misrepresentation. Under Kan. Stat. Ann. § 58-30,111(c), what is the likely outcome?
options:
  - The salesperson is liable because they failed to verify the seller's statement
  - The salesperson is liable only if the seller intended to deceive
  - The salesperson is liable because they have a duty to inspect the roof
  - The salesperson is not liable because they lacked personal knowledge of the error
key: D
explanation: The salesperson is not liable because they lacked personal knowledge of the error.
  Under Kan. Stat. Ann. § 58-30,111(c), a licensee shall not be liable for an innocent or negligent
  misrepresentation when they have no personal knowledge of the error. Here the salesperson relied
  on the seller's statement and had no personal knowledge of the roof's age, so the statutory shield
  applies. The law does not impose a duty to verify client statements unless the licensee personally
  knows the information is incorrect.
