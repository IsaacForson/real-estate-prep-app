stem: A broker begins working with a buyer to find a home. The buyer signs an offer to purchase a
  property on June 1, but the broker and buyer have not yet signed a written agency agreement. Under
  Kansas law, what is the status of the broker’s relationship with the buyer at the time the offer
  is signed?
options:
  - The broker is considered a transaction broker because no agency relationship has been
    established.
  - The broker has an agency relationship with the buyer because the offer to purchase satisfies the
    written agreement requirement.
  - The broker is acting as a subagent of the seller because the buyer viewed the property.
  - The broker must terminate all dealings with the buyer until a written agency agreement is signed.
key: A
explanation: Subsection (e) requires a written agency agreement no later than the signing of an
  offer to establish an agency relationship. Since no written agreement exists, no agency
  relationship is formed. Under subsection (c), the broker is then presumed to be a transaction
  broker. The claim that the offer itself satisfies the written agreement requirement is incorrect.
citation:
