stem: Under K.A.R. 86-3-22, when a broker deposits earnest money in the broker's trust account
  before contract acceptance, what must the broker do?
options:
  - The broker must assign a unique transaction number only for residential lease agreements.
  - The broker must assign a unique transaction number only if the earnest money exceeds $1,000.
  - The broker must assign a unique transaction number only when acting as the listing broker.
  - The broker must assign a unique transaction number to the offer.
key: D
explanation: The rule explicitly states that if a broker deposits earnest money in the trust account
  before contract acceptance, the broker shall assign a unique transaction number to the offer. The
  incorrect option about a $1,000 threshold adds a condition not present in the regulation.
