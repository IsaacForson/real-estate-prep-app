stem: A licensee receives a telephone call from a prospective buyer asking the listing price of a
  home advertised online. The licensee provides the price. Under the Kansas Brokerage Relationships
  in Real Estate Transactions Act, how is this action classified?
options:
  - The licensee's action requires a written transaction brokerage agreement.
  - The licensee's action is an act of active representation requiring an agency agreement.
  - The licensee's action is a violation of confidentiality rules.
  - The licensee's action is a ministerial act because it is a response to a telephone inquiry about
    price.
key: D
explanation: Providing the listing price in response to a telephone inquiry is a ministerial act
  under the statute, not an act requiring a written transaction brokerage agreement or active
  representation. Kan. Stat. Ann. § 58-30,102(p)(2) defines responding to telephone inquiries about
  price or location as a ministerial act. The claim that the act requires a written transaction
  brokerage agreement misstates the rule, and the characterization of the act as active
  representation requiring an agency agreement is also incorrect.
