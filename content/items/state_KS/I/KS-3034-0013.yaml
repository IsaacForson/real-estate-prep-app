stem: An applicant's license application is denied by the Kansas real estate commission solely
  because the applicant failed the required licensing examination. Is the applicant entitled to
  written notice and a hearing under the Kansas administrative procedure act?
options:
  - Yes, because every single denial requires a formal administrative hearing first
  - No, because that denial is excepted from the notice-and-hearing requirement
  - No, because the commission has no duty to explain any denial
  - Yes, but only if the applicant requests a hearing within 24 hours
key: B
explanation: K.S.A. 58-3044(a) requires notice and an opportunity to be heard under the Kansas
  administrative procedure act for a license denial, unless the denial is solely because the
  applicant failed to pass a required examination.
