stem: A Kansas real estate licensee enters a plea of guilty to a felony charge unrelated to real
  estate practice. Compared with a licensee who commits a misdemeanor reflecting on honesty or
  trustworthiness, how does Kansas law treat the felony plea?
options:
  - The felony plea only permits discretionary action, while a qualifying misdemeanor instead
    requires automatic and mandatory revocation of the license
  - Neither offense affects licensure unless a court separately orders suspension of the license
  - Both offenses trigger the same discretionary review by the commission before any action
  - The commission must suspend or revoke the license for the felony plea, while a qualifying
    misdemeanor only permits discretionary action
key: D
explanation: K.S.A. 58-3050(b) requires the commission to suspend or revoke the license of any
  licensee who has entered a plea of guilty or nolo contendere to, or been convicted of, any felony,
  a mandatory consequence that contrasts with the commission's discretionary authority over
  qualifying misdemeanors under subsection (a).
