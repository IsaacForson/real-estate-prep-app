stem: Maria holds a broker's license but works under another broker as an independent contractor,
  performing the sales activities the act assigns to a broker. What is Maria's status under Kansas
  law?
options:
  - An associate broker under the license act
  - A branch broker under the license act
  - A salesperson under the license act
  - A supervising broker under the license act
key: A
explanation: K.S.A. 58-3035(c) defines an associate broker as an individual who has a broker's
  license and who is employed by, or associated as an independent contractor with, another broker
  while participating in the activities described for a broker.
