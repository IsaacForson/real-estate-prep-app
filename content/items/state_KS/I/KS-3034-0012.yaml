stem: A Kansas licensee lost a disciplinary hearing and was assessed hearing costs by the
  commission, but the licensee has yet to pay them by the time the license comes up for renewal.
  What happens to the renewal under Kansas law?
options:
  - The license may not be renewed until the costs are paid
  - The license renews automatically regardless of unpaid costs
  - The renewal is granted but the license is placed on probation
  - The unpaid costs are waived once the renewal fee is paid
key: A
explanation: K.S.A. 58-3056 provides that no license shall be reinstated, renewed or issued if an
  assessment for costs has not been paid by the holder of or applicant for the license.
