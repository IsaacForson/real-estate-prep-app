stem: After the state treasurer deposits fees and penalties remitted by the Kansas real estate
  commission's director, how must that deposit generally be divided under Kansas law?
options:
  - Twenty-five percent to county governments and the remaining balance to the state treasury
  - The entire deposit retained in the commission's private operating account
  - Ten percent to the general fund and the balance to the real estate fee fund
  - Fifty percent to the recovery fund and the balance returned to the licensee
key: C
explanation: K.S.A. 58-3074(a) requires that ten percent of each such deposit be credited to the
  state general fund, with the balance credited to the real estate fee fund.
