stem: A supervising broker's license is suspended while several real estate closings are still
  pending, and the commission has yet to authorize a replacement broker. Under Kansas law, what must
  happen to those pending closings, and whose approval is required for the transfer of that
  responsibility?
options:
  - Responsibility transfers to another broker, attorney, financial institution, or escrow company,
    with only after-the-fact commission ratification
  - Responsibility transfers to another broker, attorney, financial institution, or escrow company,
    with written approval from all parties
  - Responsibility stays with the suspended broker if all parties consent to it orally
  - Responsibility ends, and the pending transactions must be restarted under new contracts
key: B
explanation: K.S.A. 58-3084(a) bars a suspended supervising broker from personally finalizing
  pending closings and requires that responsibility be given to another broker, an attorney, a
  financial institution or an escrow company; K.S.A. 58-3084(b) further requires the written
  approval of all parties to the transaction when the commission has not authorized a replacement
  broker.
citation:
  source: Kan. Stat. Ann. § 58-3084
  url: null
  quoted_text: A supervising broker or branch broker whose license is expired or is suspended,
    deactivated or revoked may not personally finalize any pending closings. This responsibility
    must be given to another broker, an attorney, a financial institution or an escrow company.
