stem: Under Kansas law, through what legal mechanism may a person aggrieved by a real estate
  commission order seek appellate relief?
options:
  - By requesting a new hearing before the same commission panel
  - By appealing in accordance with the Kansas judicial review act
  - By petitioning the governor's office for administrative clemency
  - By filing a private arbitration demand with the state bar
key: B
explanation: K.S.A. 58-3058 provides that any person aggrieved by a commission order may appeal in
  accordance with the Kansas judicial review act.
