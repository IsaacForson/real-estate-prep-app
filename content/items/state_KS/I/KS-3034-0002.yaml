stem: Kansas law requires the real estate commission to publicize which of the following regarding
  consumer protection?
options:
  - The average commission rates charged by licensed brokers across the state
  - The personal disciplinary history of the commission's own staff members
  - The existence of the real estate recovery fund and how to file a claim
  - The commission's internal budget allocations for the current fiscal year
key: C
explanation: K.S.A. 58-3048(e) directs the commission to publicize the existence of the recovery
  fund, the acts for which recovery is allowed, and the claims-filing process, so consumers know how
  to seek recovery.
citation:
  source: Kan. Stat. Ann. § 58-3048
  url: null
  quoted_text: The commission shall publicize (1) the existence of the real estate recovery revolving
    fund and the availability of recovery therefrom, (2) the acts for which recovery may be allowed
    and (3) information regarding the filing of claims for payments, including the conditions and
    limitations to which the filing of claims and recovery are subject under the provisions of the
    real estate brokers' and salespersons' license act.
