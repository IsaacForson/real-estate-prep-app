stem: A consumer wants to file a complaint against a Kansas licensee for a violation of the license
  act that occurred several years ago. Under the general rule in Kansas law, within what period must
  the complaint be commenced?
options:
  - Within three years from the date of the occurrence
  - Within one year from the date of the occurrence
  - Within five calendar years from the date of the occurrence
  - Within six years from the date of the occurrence
key: A
explanation: K.S.A. 58-3050(h)(1) provides that, as a general rule, no complaint alleging a
  violation of the act may be commenced more than three years from the date of the occurrence that
  is the subject of the complaint.
