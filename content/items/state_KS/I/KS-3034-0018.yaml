stem: A Kansas licensee under investigation for misconduct voluntarily surrenders the license before
  the investigation concludes. What authority does the commission retain under Kansas law?
options:
  - No further authority once a license has been surrendered
  - Only the power to refer the matter to a county prosecutor
  - The power to revoke the license despite the surrender
  - Only the power to place a note in the licensee's public file
key: C
explanation: K.S.A. 58-3050(f) gives the commission the power to revoke the license of a licensee
  who voluntarily surrenders the license, or who fails to renew it, while an investigation or
  charges of misconduct are pending or anticipated.
