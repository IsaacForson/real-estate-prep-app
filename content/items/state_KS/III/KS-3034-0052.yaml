stem: What must occur for a branch broker to be employed by more than one supervising broker under
  Kansas law?
options:
  - The branch broker must obtain written consent from each supervising broker and file a signed
    copy of the consent form with the commission.
  - The branch broker must obtain consent from at least one supervising broker and file the consent
    form with the commission.
  - The branch broker must obtain written consent from each supervising broker but may keep the form
    on file at the office instead of filing with the commission.
  - The branch broker must obtain consent from each supervising broker and renew the consent
    annually regardless of filing with the commission.
key: A
explanation: Subsection (g) states that a branch broker shall not be employed by more than one
  supervising broker unless each supervising broker consents and a signed copy of the consent form
  is filed with the commission. Therefore, written consent from each supervising broker and filing
  of the signed form are required. The other options either reduce the consent requirement, omit the
  filing, or add an annual renewal not mentioned in the statute.
citation:
  source: Kan. Stat. Ann. § 58-3062(g)
  url: null
  quoted_text: A branch broker shall not be employed by or associated with more than one supervising
    broker at any one time unless each supervising broker who employs or associates with the branch
    broker consents to such multiple employment or association. Such consent shall be on a form
    provided by the commission and shall not be effective until a signed copy of the completed form
    has been filed with the commission.
