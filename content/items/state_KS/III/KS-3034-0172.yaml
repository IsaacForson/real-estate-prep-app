stem: Jane is an officer and shareholder of XYZ Realty, Inc., a corporation, but she is not the
  supervising broker of the office. She receives earnest money from a buyer. Under Kansas law, is
  she required to maintain a trust account?
options:
  - She must deposit the earnest money into a trust account.
  - She is exempt from maintaining a trust account because she is an officer of the corporation.
  - She may keep the earnest money in her personal account if she obtains written consent from the
    buyer.
  - She must obtain approval from the commission to use a trust account.
key: B
explanation: The trust account requirement does not apply to a broker who is an officer, member,
  partner, shareholder or employee of a corporation and is not the supervising broker of that
  corporation's office. Therefore Jane is exempt. The distractor suggesting she must deposit the
  money ignores this exemption.
