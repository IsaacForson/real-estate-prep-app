stem: A branch broker in Kansas has obtained written consent from Supervising Broker X to work for
  both Broker X and Broker Y, but has not obtained consent from Broker Y. The branch broker begins
  working for both supervising brokers. Under Kansas law, is this permissible?
options:
  - Yes, as long as the broker files the consent form with the commission
  - No, because consent from each supervising broker is required
  - No, unless the broker also obtains approval from the commission
  - Yes, because consent from one supervising broker is sufficient
key: B
explanation: The statute requires consent from each supervising broker; lacking consent from Broker
  Y makes the arrangement impermissible.
citation:
  source: Kan. Stat. Ann. § 58-3062(g)
  url: null
  quoted_text: A branch broker shall not be employed by or associated with more than one supervising
    broker at any one time unless each supervising broker who employs or associates with the branch
    broker consents to such multiple employment or association. Such consent shall be on a form
    provided by the commission and shall not be effective until a signed copy of the completed form
    has been filed with the commission.
