stem: A broker's license expires on April 5. The broker removes all advertising bearing the broker's
  name on April 9. Under Kansas law, is this action permissible?
options:
  - Yes, because the broker also notified clients of the expiration.
  - No, because advertising must be removed within three days after expiration.
  - No, because advertising must be removed on the expiration date.
  - Yes, because the removal occurred within the required five‑day period.
key: D
explanation: The rule mandates that advertising be removed or covered within five calendar days
  after the license expiration date; April 9 falls within that window. The distractors either impose
  an incorrect deadline or add an unnecessary requirement.
