stem: A licensee violates § 58-3062(g) by working for two supervising brokers without the required
  consents. A buyer sues the licensee for damages, alleging a violation of this section. Under
  Kansas law, may the buyer recover damages based solely on this statutory violation?
options:
  - Under Kansas law, the buyer may recover damages only if the licensee acted knowingly and
    intentionally.
  - Under Kansas law, the buyer may recover damages because the statute creates a private right of
    action.
  - Under Kansas law, the buyer must first obtain a written commission order before suing.
  - Under Kansas law, the buyer may not recover damages, but may sue under other theories.
key: D
explanation: Because § 58-3062(h) states that the section does not grant a private right of action
  for damages, the buyer cannot recover damages based solely on a violation of this provision. The
  buyer may, however, pursue remedies available under other statutes or common law.
