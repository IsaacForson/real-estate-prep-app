stem: A supervising broker wants to operate under the trade name 'River City Realty'. Under Kansas
  law, what must the broker do before using that name?
options:
  - The supervising broker must renew the trade name every two years.
  - The supervising broker must use the trade name only in print advertising.
  - The supervising broker must file a notice with the county clerk.
  - The supervising broker must obtain approval from the commission for the trade name.
key: D
explanation: The statute requires a supervising broker who wishes to use a trade name to register
  and obtain approval from the commission. The distractor about filing with the county clerk is
  incorrect because approval comes from the commission, not local officials.
citation:
  source: Kan. Stat. Ann. § 58-3079 — K.S.A. Kan. Stat. Ann. § 58-3079 — Supervising broker; use of
    trade name § 58-3079(a)
  url: null
  quoted_text: Each supervising broker who desires to do business under a trade name or business name
    other than the supervising broker's own name shall register with and obtain approval from the
    commission for use of the trade name or business name.
