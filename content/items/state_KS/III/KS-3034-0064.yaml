stem: A branch broker in Kansas receives consent from only one of two supervising brokers to work
  for both. The broker begins working for both supervising brokers without obtaining consent from
  the second. Under Kansas law, is this permissible?
options:
  - Permission granted with consent from one supervising broker
  - Permission granted after the branch broker notifies the commission
  - Permission granted only when each supervising broker consents
  - Permission granted after the broker files a notice with the commission
key: C
explanation: The key is correct because the statute requires consent from each supervising broker
  who employs or associates with the branch broker; consent from only one is insufficient. The
  option stating that permission is granted after the branch broker notifies the commission is
  incorrect because notifying the commission does not substitute for the required consent from each
  supervising broker.
citation:
  source: Kan. Stat. Ann. § 58-3062(g)
  url: null
  quoted_text: A branch broker shall not be employed by or associated with more than one supervising
    broker at any one time unless each supervising broker who employs or associates with the branch
    broker consents to such multiple employment or association.
