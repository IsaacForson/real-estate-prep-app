stem: A licensee makes an offer on a property but does not inform the buyer of the approximate
  closing costs at that time. Under Kansas law, is this permissible?
options:
  - It is a prohibited act under §58-3062(a)(16).
  - It is permissible if the buyer is informed later.
  - It is allowed if the closing costs are under $500.
  - It is subject to a commission warning.
key: A
explanation: The statute requires a licensee to inform both the buyer at the time an offer is made
  and the seller at the time an offer is presented of the approximate closing costs that must be
  paid. Failing to do so is a prohibited act under §58-3062(a)(16). The distractor suggesting
  permissibility if the buyer is informed later is incorrect because the disclosure must occur at
  the time the offer is made, not afterward.
