stem: Under Kansas law, what must a broker do with closing statements at the time a real estate
  transaction is closed?
options:
  - Delivering a detailed closing statement to the seller and buyer
  - Retaining copies of the closing statement in the broker's files
  - Obtaining written consent from the escrow agent before delivery
  - Taking no action if an escrow agent provides the statements
key: A
explanation: The statute requires the broker to deliver to the seller a detailed closing statement
  showing receipts and disbursements and to the buyer a statement showing money received and how
  disbursed, or retain copies, unless an escrow agent furnishes the statements. Therefore,
  delivering the statements to both parties satisfies the duty. Retaining copies alone does not
  fulfill the obligation to provide statements to the parties.
citation:
  source: Kan. Stat. Ann. § 58-3062(c)(2)
  url: null
  quoted_text: Fail to deliver to the seller in every real estate transaction, at the time the
    transaction is closed, a complete, detailed closing statement showing all of the receipts and
    disbursements handled by the broker for the seller, or fail to deliver to the buyer a complete
    statement showing all money received in the transaction from such buyer and how and for what the
    same was disbursed
