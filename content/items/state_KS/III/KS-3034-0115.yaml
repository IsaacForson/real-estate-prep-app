stem: A licensee places a 'For Sale' sign on a residential property without obtaining written
  consent from the owner. Under Kansas law, is this action permissible?
options:
  - Under Kansas law, placing the sign without written consent is not permissible because written
    consent from the owner is required
  - Under Kansas law, placing the sign without written consent is not permissible unless the
    property is vacant
  - Under Kansas law, placing the sign without written consent is permissible if the owner is
    notified verbally
  - Under Kansas law, placing the sign without written consent is permissible if the sign is removed
    within 24 hours
key: A
explanation: Kansas law prohibits placing a sign offering property for sale or lease without the
  written consent of the owner or the owner's authorized agent. Therefore, the action is not
  permissible. The distractor suggesting verbal notice is sufficient is wrong because the statute
  requires written consent, not merely verbal notification.
citation:
