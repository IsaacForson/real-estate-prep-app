stem: A Kansas branch broker enters into a broker cooperation agreement with a foreign licensee to
  sell a commercial office building. The agreement includes all required provisions and the property
  is not improved with a single-family residence. Under Kansas law, is the branch broker permitted
  to share commissions with the foreign licensee?
options:
  - The branch broker may share commissions because the property is commercial and the agreement
    meets requirements
  - The branch broker may not share commissions because the foreign licensee is not licensed in
    Kansas
  - The branch broker may not share commissions because the agreement lacks required provisions
  - The branch broker may not share commissions because the property is a single-family residence
key: A
explanation: The statute permits sharing commissions with a foreign licensee for commercial real
  estate when the property is not a single-family residence and a broker cooperation agreement
  meeting all requirements is executed. The scenario satisfies both conditions, so sharing is
  allowed. The distractors incorrectly assert a prohibition based on lack of Kansas license, missing
  provisions, or property type, which are not present.
citation:
  source: Kan. Stat. Ann. § 58-3077(b)
  url: null
  quoted_text: "(b) A branch broker or supervising broker may cooperate with and share commissions or
    other compensation for services related to commercial real estate with a foreign licensee and
    such foreign licensee shall be permitted to perform services requiring a license under K.S.A.
    58-3034 et seq., and amendments thereto, with respect to commercial real estate in this state
    even though such foreign licensee is not licensed thereunder if: (1) The real estate is not
    improved with a single family residence; and (2) the foreign licensee agrees to cooperate with a
    branch broker or supervising broker of this state in any commercial real estate transaction, as
    evidenced by execution of and compliance with a broker cooperation agreement which shall
