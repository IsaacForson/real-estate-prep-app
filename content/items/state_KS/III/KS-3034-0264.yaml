stem: Under Kansas law, if a purchase agreement specifies that earnest money be held by an escrow
  agent other than a real estate broker and includes a written agreement that the deposit shall be
  made on the closing date, what is the licensee's obligation regarding the five‑business‑day
  deposit rule?
options:
  - The licensee may deposit the earnest money on the closing date as specified in the written
    agreement.
  - The licensee must deposit the earnest money immediately upon receipt from the buyer.
  - The licensee must deposit the earnest money within three business days regardless of the written
    agreement.
  - The licensee must still deposit the earnest money within five business days of signing the
    purchase agreement.
key: A
explanation: Under Kan. Stat. Ann. § 58-3062(a)(19), a licensee must deposit earnest money within
  five business days after the purchase agreement is signed, unless the parties’ written agreement
  provides a different deposit date. When such an agreement exists, the licensee must deposit the
  money on the date specified in that written agreement. The correct option reflects this rule by
  allowing deposit on the closing date as the parties agreed. The other options are wrong because
  they impose immediate deposit, a three‑day deadline, or a five‑day deadline from signing, none of
  which are permitted when the parties have contractually set a different date.
citation:
  source: Kan. Stat. Ann. § 58-3062(a)(19)
  url: null
  quoted_text: Fail to deposit any check or cash received as an earnest money deposit or as a deposit
    on the purchase of a lot within five business days after the purchase agreement or lot
    reservation agreement is signed by all parties, unless otherwise specifically provided by
    written agreement of all parties to the purchase agreement or lot reservation agreement, in
    which case the licensee shall deposit the check or cash received on the date provided by such
    written agreement.
