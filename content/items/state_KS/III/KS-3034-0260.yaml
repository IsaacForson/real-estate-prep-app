stem: Under Kansas law, if an officer of a corporation performs acts that require a real estate
  license, what must the corporation have?
options:
  - A registered trade name with the commission
  - A primary office with a supervising broker
  - A trust account held in the corporation's name
  - A branch office with a supervising broker
key: B
explanation: The statute requires a primary office and a supervising broker when an owner, officer,
  or member performs licensed acts; a branch office alone does not satisfy this requirement.
citation:
  source: Kan. Stat. Ann. § 58-3042(c)
  url: null
  quoted_text: If any person who is an owner, officer or member of an association, corporation,
    limited liability company, limited liability partnership or professional corporation performs
    any act described in subsection (f) of K.S.A. 58-3035 , and amendments thereto, a primary office
    shall be established and a supervising broker shall be designated pursuant to K.S.A. 58-3060 ,
    and amendments thereto, to supervise the office and any employed or associated salespersons or
    associate brokers and the supervising broker shall obtain approval for the supervising broker's
    business name or trade name pursuant to K.S.A. 58-3079 , and amendments thereto.
