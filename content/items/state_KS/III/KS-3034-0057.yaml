stem: A licensee is selling a property that they own personally but does not disclose their
  ownership interest to the buyer. Under Kansas law, is this permissible?
options:
  - Yes, it is permissible because the property is listed under the broker's name, not the
    licensee's.
  - No, it is not permissible because the licensee must disclose any personal interest in the
    property being sold.
  - No, it is not permissible because the licensee must first obtain the broker's written consent.
  - Yes, it is permissible because the licensee's ownership interest does not affect the transaction.
key: B
explanation: The statute requires a licensee to make known any interest they have in the real estate
  they are selling or leasing. Failing to disclose a personal ownership interest violates this duty,
  regardless of whether the interest affects the transaction or the property is listed under the
  broker's name.
