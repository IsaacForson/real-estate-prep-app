stem: Under Kansas law, what is the consequence of a licensee failing to deposit earnest money
  received from a buyer within five business days after the purchase agreement is signed, unless
  otherwise agreed in writing?
options:
  - It is subject to an automatic fine of $500.
  - It is permissible if the broker notifies the commission.
  - It is allowed if the earnest money is less than $1,000.
  - It is a prohibited act under §58-3062(a)(19).
key: D
explanation: The statute explicitly prohibits failing to deposit earnest money within five business
  days after the purchase agreement is signed by all parties, unless a written agreement specifies a
  different date. Therefore, the consequence is that the act is prohibited under §58-3062(a)(19).
  The distractor suggesting permissibility if the broker notifies the commission is incorrect
  because the statute provides no such exception; notification does not cure the violation.
