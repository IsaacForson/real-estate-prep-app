stem: A licensee receives an earnest money check of $4,000 on Tuesday. The purchase agreement,
  signed by all parties, states that the earnest money shall be delivered to the named escrow agent
  on the tenth business day after signing. Under Kansas law, when must the licensee deposit the
  check?
options:
  - On the tenth business day after signing
  - Within three business days of signing the agreement
  - Within five business days of receipt
  - Immediately upon receiving the check
key: A
explanation: Under Kansas law a licensee must deposit an earnest‑money check within five business
  days after receipt, unless the purchase agreement contains a written provision that sets a
  different deadline. When such a provision exists, the licensee must deposit the funds on the date
  specified in that provision. Because the agreement requires delivery to the escrow agent on the
  tenth business day after signing, the licensee must wait until that tenth business day to make the
  deposit. Kan. Stat. Ann. § 58‑3062(a)(19).
