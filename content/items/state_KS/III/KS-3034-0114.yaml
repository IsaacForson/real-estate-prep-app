stem: Under Kansas law, within how many business days must a licensee deposit earnest money received
  from a buyer?
options:
  - Three business days
  - Five business days
  - Seven business days
  - Ten business days
key: B
explanation: The statute requires a licensee to deposit earnest money within five business days
  after the purchase agreement is signed, unless the parties agree otherwise. Therefore, five
  business days is correct. The distractor of three business days is incorrect because the law
  specifies a five‑day period, not three.
citation:
  source: Kan. Stat. Ann. § 58-3062(a)(19)
  url: null
  quoted_text: Fail to deposit any check or cash received as an earnest money deposit or as a deposit
    on the purchase of a lot within five business days after the purchase agreement or lot
    reservation agreement is signed by all parties, unless otherwise specifically provided by
    written agreement of all parties to the purchase agreement or lot reservation agreement, in
    which case the licensee shall deposit the check or cash received on the date provided by such
    written agreement.
