stem: According to Kansas statute § 58-3062(a)(3), which of the following actions is prohibited for
  a licensee?
options:
  - Sharing marketing expenses with a fellow licensee
  - Receiving a salary from the employing broker
  - Charging a reasonable administrative fee
  - Accepting an undisclosed rebate or commission
key: D
explanation: The statute expressly prohibits a licensee from accepting, giving, or charging any
  rebate or undisclosed commission. Charging a reasonable administrative fee, receiving a salary
  from the employing broker, and sharing marketing expenses are not prohibited by this provision.
