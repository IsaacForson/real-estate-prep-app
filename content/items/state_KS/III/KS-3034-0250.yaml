stem: A licensee purchases a dwelling that is subject to a mortgage in default at the time of
  purchase. The licensee gives written notice of the purchase to the mortgage holder on the
  nineteenth day after the purchase. Under Kansas law, is this action permissible?
options:
  - It is permissible because the licensee also notified the judgment creditor.
  - It is permissible because notice was given within the 20‑day deadline.
  - It is not permissible because the licensee failed to notify the judgment creditor.
  - It is not permissible because notice was given after the 20‑day deadline.
key: B
explanation: Notice given on the 19th day satisfies the 20‑day requirement, so the action is
  permissible. The distractor claiming impermissibility due to missing the judgment creditor is
  wrong because the statute only requires notice to the mortgage holder in this scenario.
