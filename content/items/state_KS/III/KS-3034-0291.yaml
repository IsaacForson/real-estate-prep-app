stem: A licensee deposits $250 of personal money into the broker's trust account to cover a
  temporary shortfall, intending to repay the amount later. Under Kansas law, is this action
  permissible?
options:
  - The action is permissible as long as the amount is repaid within thirty days of deposit
  - The action is impermissible unless the broker secures prior written approval from the commission
  - The action is impermissible because commingling personal funds with trust funds is prohibited
  - The action is permissible because the funds are intended to be temporary and will be repaid
    promptly
key: C
explanation: Under Kan. Stat. Ann. § 58-3062(a)(2), a licensee may not commingle personal funds with
  trust funds, except that a broker may keep up to $100 in the trust account for account expenses.
  Depositing personal money, even if intended to be temporary or repaid, is prohibited commingling.
  Therefore the action is not permissible.
