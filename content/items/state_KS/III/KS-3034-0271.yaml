stem: A seller receives notice of cancellation of a real estate purchase agreement on June 1. The
  seller makes a written demand for forfeiture of the earnest money deposit on June 30. Under Kansas
  law, is this demand permissible?
options:
  - No, because the demand was made after the 45‑day period.
  - Yes, because the demand was made within the 30‑day period.
  - No, because the demand was made before the 15‑day period.
  - Yes, because the demand was made within the 14‑day period.
key: B
explanation: Under Kansas law, a written demand for return or forfeiture must be made within 30 days
  of notice of cancellation to be effective; a demand on June 30 falls within that window, so it is
  permissible. The distractor claiming the demand was made after the 30‑day period is incorrect
  because June 30 is still within 30 days of June 1.
