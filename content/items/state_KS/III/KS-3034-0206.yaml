stem: Under Kansas law, what must be true about the trade name used by a branch office of a real
  estate brokerage?
options:
  - It must be the same as the primary office's trade name
  - It must include the supervising broker's personal name
  - It must be approved by the commission separately for the branch
  - It must be different from the primary office's trade name
key: A
explanation: The statute requires that a branch office use the same trade name or business name as
  the primary office. This ensures consistency and prevents public confusion. The other options
  either contradict the rule or add requirements not found in the law.
citation:
  source: Kan. Stat. Ann. § 58-3079(b)
