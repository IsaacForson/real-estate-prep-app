stem: Under Kansas law, a real estate license is nontransferable and may only be used by the
  individual to whom it is issued.
options:
  - A real estate license may be transferred to another individual with commission approval.
  - A real estate license may be used by any employee of the licensee's firm.
  - A real estate license is nontransferable and may only be used by the individual to whom it is
    issued.
  - A real estate license may be leased to a brokerage for a fee.
key: C
explanation: The statute explicitly states that a license does not give authority to any person
  other than the licensee, making the license nontransferable and personal. The distractor
  suggesting transfer with commission approval contradicts the plain prohibition on authority for
  any other person.
