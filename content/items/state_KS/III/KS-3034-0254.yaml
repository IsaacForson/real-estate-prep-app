stem: Under Kansas law, when a broker pays a referral fee to another broker (licensed in Kansas or
  another jurisdiction), what written disclosure must be made to the client?
options:
  - The broker must disclose any financial interest the broker has in the referral brokerage.
  - The broker must disclose the client's right to cancel the referral agreement.
  - The broker must disclose the referral brokerage's license number to the client.
  - The broker must disclose the amount of the referral fee to the client.
key: A
explanation: Kansas law requires that a broker give the client written disclosure of any financial
  interest the broker has in the brokerage firm receiving the referral fee (Kan. Stat. Ann.
  § 58‑30,105(d)(3)). The other statements are not mandated by the statute; the client’s right to
  cancel, the referral brokerage’s license number, and the amount of the fee are not required
  disclosures.
