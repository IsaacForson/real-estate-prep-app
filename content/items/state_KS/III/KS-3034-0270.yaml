stem: Under Kansas law, within how many days must a buyer or seller make a written demand for return
  or forfeiture of an earnest money deposit after notice of cancellation of the agreement?
options:
  - 7 days
  - 10 days
  - 30 days
  - 60 days
key: C
explanation: The statute provides that a failure to make written demand for return or forfeiture of
  an earnest money deposit within 30 days of notice of cancellation constitutes consent to
  distribution of the earnest money, implying the demand must be made within that 30‑day window. The
  seven‑day period applies only to responding to a certified letter, not to making a demand for
  return or forfeiture.
