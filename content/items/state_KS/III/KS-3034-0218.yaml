stem: A broker keeps $150 in the trust account to pay office expenses. Under Kansas law, is this
  permissible?
options:
  - It is prohibited because the amount exceeds $100 for trust expenses.
  - It is allowed if the broker obtains written commission consent.
  - It is permissible because the funds are used for office expenses.
  - It is permissible if the funds are returned within 30 days.
key: A
explanation: Kansas law permits a broker to retain no more than $100 in the trust account for
  expenses related to the account’s use and maintenance. Keeping $150 exceeds this $100 cap, so the
  practice is prohibited. The distractor stating that the funds are used for office expenses is
  incorrect because the $100 limit applies regardless of purpose.
citation:
  source: Kan. Stat. Ann. § 58-3062(a)(2)
  url: null
  quoted_text: except that nothing herein shall prohibit a broker from having funds in an amount not
