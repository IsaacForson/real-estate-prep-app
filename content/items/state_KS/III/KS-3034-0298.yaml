stem: A branch broker in Kansas has obtained written consent from both supervising brokers and filed
  the signed consent form with the commission. The branch broker begins working for both supervising
  brokers. Under Kansas law, is this permissible?
options:
  - Under Kansas law, this is permissible because the required consents were obtained and filed.
  - Under Kansas law, this is impermissible because a branch broker may not work for more than one
    supervising broker.
  - Under Kansas law, this is permissible only if the broker also notifies the commission within 24
    hours.
  - Under Kansas law, this is impermissible because consent must be obtained annually.
key: A
explanation: Under Kan. Stat. Ann. § 58-3062(g), a branch broker may not be employed by more than
  one supervising broker unless each supervising broker consents and the consent is filed. When both
  consents are obtained and the signed form is filed, the exception applies and the arrangement is
  permissible.
