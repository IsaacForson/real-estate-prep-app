stem: A licensee purchases a dwelling that is subject to a right of redemption due to foreclosure.
  The licensee provides written notice of the purchase to the mortgage holder on the twenty‑first
  day after the purchase. Under Kansas law, is this action permissible?
options:
  - It is permissible because the licensee believed the deadline was longer.
  - It is not permissible because the notice was provided after the 20‑day deadline.
  - It is permissible because the notice was provided within the required timeframe.
  - It is not permissible because the licensee omitted to notify the judgment creditor.
key: B
explanation: The rule mandates that notice be given within 20 days; providing notice on the 21st day
  violates this requirement, making the action impermissible. The distractor suggesting
  permissibility based on the licensee’s belief is incorrect because good faith does not override
  the statutory deadline.
