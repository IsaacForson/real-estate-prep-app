stem: Under Kansas statute § 58-3042(b), which type of entity is prohibited from being issued a real
  estate license?
options:
  - A licensed salesperson
  - An individual broker
  - A sole proprietorship
  - A corporation
key: D
explanation: The statute states that no license shall be granted to an association, corporation,
  limited liability company, limited liability partnership, partnership or professional corporation.
  Therefore a corporation cannot be issued a license. The distractor 'A sole proprietorship' is
  incorrect because the statute does not prohibit sole proprietorships from being licensed.
