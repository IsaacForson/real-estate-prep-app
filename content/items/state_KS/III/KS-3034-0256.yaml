stem: A broker wishes to receive compensation from both the seller and the buyer in a residential
  transaction. Under Kansas law, what must occur for this to be permissible?
options:
  - The parties must consent in writing to the multiple payments at or before entering into the
    contract.
  - The parties must file a notice with the Kansas Real Estate Commission prior to receiving any
    compensation.
  - The parties must agree verbally to split the commission equally before closing.
  - The parties must obtain a court order authorizing dual compensation from a district court.
key: A
explanation: "Under Kan. Stat. Ann. § 58-30,105(c), a broker may receive compensation from more than
  one party only if the parties consent in writing to the multiple payments at or before entering
  into the contract. Therefore, the correct answer is the option stating that the parties must
  consent in writing to the multiple payments at or before entering into the contract. The other
  options are incorrect: requiring a notice filed with the Kansas Real Estate Commission is not
  required; verbal agreement does not satisfy the writing requirement; and a court order is not
  necessary."
