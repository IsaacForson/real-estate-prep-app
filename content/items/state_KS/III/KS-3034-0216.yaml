stem: Under Kansas regulation, which of the following would be considered an advertisement for real
  estate purposes?
options:
  - A licensee's business card showing their name and phone number
  - A licensee's handwritten note to themselves about a property showing
  - A licensee's internal email to the office manager about commission splits
  - A licensee's personal text message to a friend about a weekend trip
key: A
explanation: The regulation defines advertisement to include business cards; the other options are
  either personal communications not related to licensed real estate activity or are not listed in
  the definition.
citation:
  source: Kan. Admin. Regs. § 86-3-7(a)
  url: null
  quoted_text: These terms shall include business cards, signs, insignias, letterheads, telephone or
    electronic mail, radio, television, newspaper and magazine advertisements, internet advertising,
    web sites, social media or social networking, display or group advertisements in telephone
    directories, and billboards.
