stem: A branch broker in Kansas is employed solely by Supervising Broker Alpha and has no
  association with any other supervising broker. Under Kansas law, is the branch broker required to
  obtain consent from any other supervising broker to continue this employment?
options:
  - The branch broker must file a consent form with the commission regardless of the number of
    supervising brokers
  - The branch broker must obtain written consent from Supervising Broker Alpha
  - The branch broker is not required to obtain consent from any other supervising broker
  - The branch broker must obtain consent from each supervising broker with whom it is associated
key: C
explanation: The prohibition in § 58-3062(g) applies only when a branch broker is employed by or
  associated with more than one supervising broker; if the broker works for only one supervising
  broker, no consent is needed. The option stating that consent must be filed regardless of number
  misapplies the rule, which ties the filing requirement to the consent for multiple employment.
citation:
  source: Kan. Stat. Ann. § 58-3062(g)
  url: null
  quoted_text: A branch broker shall not be employed by or associated with more than one supervising
    broker at any one time unless each supervising broker who employs or associates with the branch
    broker consents to such multiple employment or association.
