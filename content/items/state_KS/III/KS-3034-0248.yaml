stem: Under Kansas law, within how many days must a licensee give written notice of the purchase of
  a dwelling subject to a right of redemption pursuant to foreclosure to the mortgage holder or
  judgment creditor?
options:
  - 10 days
  - 15 days
  - 20 days
  - 30 days
key: C
explanation: The statute requires notice to be given within 20 days after purchase of a dwelling
  under a right of redemption. Therefore, 20 days is correct. The distractor of 30 days incorrectly
  applies the reporting period for advance listing fees, which is unrelated to this notice
  requirement.
