stem: Under Kansas law, what must a branch broker obtain to be employed by more than one supervising
  broker at the same time?
options:
  - Approval from the Kansas Real Estate Commission only, without any consent from supervising
    brokers
  - Written consent from at least one supervising broker, even if the others object
  - Written consent from each supervising broker on a commission-provided form filed with the
    commission
  - No consent is required if the brokers are affiliated, regardless of commission rules
key: C
explanation: The statute requires consent from each supervising broker on a commission-provided
  form, and that consent is not effective until a signed copy is filed with the commission.
citation:
  source: Kan. Stat. Ann. § 58-3062(g)
  url: null
  quoted_text: A branch broker shall not be employed by or associated with more than one supervising
    broker at any one time unless each supervising broker who employs or associates with the branch
    broker consents to such multiple employment or association. Such consent shall be on a form
    provided by the commission and shall not be effective until a signed copy of the completed form
    has been filed with the commission.
