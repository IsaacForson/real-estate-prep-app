stem: Under Kansas law, within how many calendar days after the effective date of an order of
  suspension, deactivation or revocation must a supervising broker or branch broker advise all
  clients and customers that they will be unable to perform the terms of any listing or brokerage
  agreement after that effective date?
options:
  - Three calendar days.
  - Five calendar days.
  - Seven calendar days.
  - Ten calendar days.
key: B
explanation: The statute requires the broker to advise clients within five calendar days after the
  effective date of the suspension, deactivation or revocation order. The other time periods are not
  supported by the language of the rule.
citation:
  source: Kan. Stat. Ann. § 58-3083(b)
  url: null
  quoted_text: within five calendar days after the effective date of the order of suspension,
    deactivation or revocation, shall advise all clients and customers that the supervising broker
    or branch broker and any licensees that are employed by or associated with the supervising
    broker or branch broker will be unable to perform the terms and conditions contained in the
    listing or brokerage agreement with the client or customer after the effective date of the
    suspension, deactivation or revocation.
