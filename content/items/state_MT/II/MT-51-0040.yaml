stem: A Montana licensee intends to begin showing residential properties to a prospective buyer with
  the goal of assisting the buyer in making an offer. What must the licensee do before performing
  these buyer‑agent activities?
options:
  - The licensee must obtain a written buyer broker agreement before performing any buyer‑agent acts.
  - The licensee must obtain a written buyer broker agreement only if the buyer requests it.
  - The licensee must obtain a written buyer broker agreement only after submitting an offer on
    behalf of the buyer.
  - The licensee must obtain a written buyer broker agreement after the first property showing.
key: A
explanation: Under Mont. Code Ann. § 37-51-313(10), a licensed broker or salesperson must obtain an
  appropriate written buyer broker agreement prior to performing the acts of a buyer agent.
  Therefore, the licensee must have the written agreement in place before any buyer‑agent activity
  such as showing property. The distractor suggesting the agreement can be obtained after the first
  showing is incorrect because the rule requires the agreement beforehand, not after initial
  contact.
