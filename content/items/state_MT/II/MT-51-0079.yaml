stem: Which of the following must be included in the initial written disclosure required by
  § 37-51-314(6)?
options:
  - a description of the duties owed by the broker and the salesperson as set forth in 37-51-313
  - a copy of the broker's current real estate license, including any endorsements
  - the property's full legal description, including lot and block numbers
  - a list of all comparable sales in the area, including sale price and date
key: A
explanation: Montana Code Annotated § 37‑51‑314(6)(a) requires the initial written disclosure to
  contain a description of the duties owed by the broker and the salesperson as set forth in
  § 37‑51‑313. A copy of the broker’s license, a list of comparable sales, and the property’s legal
  description are not listed as required elements.
