stem: A Montana statutory broker begins searching for residential properties to show a prospective
  buyer. When must the broker provide the initial written disclosure required by Montana law?
options:
  - After the buyer signs a written purchase offer.
  - Before the broker shows any property to the buyer.
  - When the broker first seeks property for the buyer.
  - After the broker and buyer sign a buyer broker agreement.
key: C
explanation: Under Mont. Code Ann. § 37-51-314(4)(a), a statutory broker must make the initial
  written disclosure to the buyer at the time the broker first endeavors to locate property for the
  buyer. The scenario describes the broker beginning to search for properties, which is when the
  duty to disclose arises. Therefore, the correct timing is when the broker first seeks property for
  the buyer. The distractor suggesting disclosure before showing any property is incorrect because
  the rule ties the disclosure to the commencement of locating property, not to the first showing.
