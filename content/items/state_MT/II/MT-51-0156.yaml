stem: A broker who is acting as a seller subagent has just begun negotiations with a buyer. When
  must the broker make the subsequent disclosure required by Montana law?
options:
  - At the time the listing agreement is executed with the seller
  - At the time negotiations commence with the buyer or buyer agent
  - At the time the purchase offer is accepted by both parties
  - At the time the property is first shown to the prospective buyer
key: B
explanation: According to § 37-51-314(2)(b), a seller subagent must make the subsequent disclosure
  to the seller at the time negotiations commence. The timing of the listing agreement execution
  relates to the initial disclosure, not the subsequent one.
