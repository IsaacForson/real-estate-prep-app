stem: An applicant passes the real estate principles portion of the Montana salesperson examination
  but fails the law portion. How long does the applicant have to pass the law portion without being
  required to retake the principles portion?
options:
  - 6 months
  - 12 months
  - 18 months
  - 24 months
key: B
explanation: The rule states that if an applicant passes one subject portion of the examination,
  they are not required to repeat that portion if they pass the remaining portion within 12 months.
  Therefore the applicant has 12 months to pass the law portion. The 6‑month option is incorrect
  because the statute specifies a 12‑month window, not six months.
