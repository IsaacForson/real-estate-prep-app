  url: null
  quoted_text: Prior to entering into a for-sale-by-owner personal transaction, the salesperson shall
    disclose in writing to the other party that the transaction is a for-sale-by-owner personal
    transaction with respect to the salesperson and that the transaction does not involve the
    salesperson's supervising broker or real estate firm.
