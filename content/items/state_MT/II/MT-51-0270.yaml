stem: A Montana-licensed salesperson decides to sell his own residential property without involving
  his supervising broker. What must the salesperson do before entering into the transaction
  according to Montana law?
options:
  - File a notice with the department of labor and industry regarding the personal sale
  - Pay a fee to the board equal to ten percent of the sale price and submit receipt
  - Provide written disclosure to the other party that it is a for-sale-by-owner personal transaction
  - Obtain written approval from the supervising broker before proceeding with the sale
key: C
explanation: Under Montana law, a salesperson must disclose in writing to the other party that the
  transaction is a for-sale-by-owner personal transaction and that it does not involve the
  salesperson's supervising broker or real estate firm prior to entering into the transaction.
  Obtaining written approval from the supervising broker is not required for such personal
  transactions, as the broker bears no responsibility or liability for the salesperson's
  for-sale-by-owner activities.
