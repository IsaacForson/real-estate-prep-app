stem: Which of the following must be included in the initial written disclosure required by §
  37-51-314(6)?
options:
  - a copy of the listing agreement signed by both parties and dated
  - a requirement to disclose the buyer's financing details to the seller
  - a statement that the broker may act as a dual agent without written consent
  - a definition of the term 'adverse material fact' as used in this chapter
key: D
explanation: Under § 37-51-314(6)(c), the initial disclosure must contain a definition of 'adverse
  material fact'. The statement that a broker may act as a dual agent without written consent is
  incorrect because written consent is required for dual agency.
