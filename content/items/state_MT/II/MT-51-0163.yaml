stem: A person residing in Idaho regularly posts online advertisements offering to help Montana
  residents buy vacation homes in Montana and receives a commission for successful transactions.
  Under Montana law, what must this person do before engaging in this activity?
options:
  - Obtain a Montana broker or salesperson license
  - File a written consent allowing service of summons on the department
  - Partner with a licensed Montana broker to sponsor their activities
  - No action is required because activity occurs outside Montana
key: A
explanation: Montana Code Annotated § 37‑51‑301(1) makes it unlawful for any person to engage in or
  advertise real‑estate brokerage activities in Montana without a license. Soliciting Montana
  residents online therefore requires a Montana broker or salesperson license. Filing an irrevocable
  consent is only for nonresident licensees who already hold a license, and working under a licensed
  broker does not replace the licensing requirement.
citation:
