stem: When must a seller agent make the initial written disclosure to the seller under Montana law?
options:
  - At the time the property is first advertised
  - At the time the buyer broker agreement is executed
  - At the time negotiations commence with the buyer
  - At the time the listing agreement is executed
key: D
explanation: Under § 37-51-314(2)(a), the initial disclosure must be made to the seller at the time
  the listing agreement is executed. The distractor about negotiations confuses the initial
  disclosure with the subsequent disclosure required when negotiations begin.
citation:
