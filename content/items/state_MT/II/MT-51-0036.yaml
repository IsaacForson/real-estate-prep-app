stem: Under Montana law, what is the legal effect of a written disclosure that complies with §
  37-51-102(11) regarding broker‑salesperson relationships?
options:
  - It is considered sufficient only for residential transactions
  - It is considered sufficient only if the buyer signs it
  - It is considered merely advisory and does not create any obligations
  - It is considered sufficient disclosure and conclusively establishes the owed obligations
key: D
explanation: Under Mont. Code Ann. § 37-51-102(11), a written disclosure that meets the statutory
  requirements is deemed a sufficient disclosure of the broker‑salesperson relationship and
  conclusively establishes the obligations owed by the broker or salesperson to the buyer or seller.
  Therefore, the statement that such a disclosure is sufficient and conclusively establishes the
  owed obligations is correct, while the claims that it is only sufficient for residential
  transactions, only sufficient if signed by the buyer, or merely advisory are incorrect.
citation:
  source: Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons) — Montana Code
    Annotated 2025, Title 37, Chapter 51 — Real Estate Brokers and Salespersons (all parts) — §
    37-51-102(11)
  url: null
  quoted_text: A written disclosure that complies with the provisions of this section must be
    construed as a sufficient disclosure of the relationship between a broker or salesperson and a
    buyer or seller and must be construed as conclusively establishing the obligations owed by a
    broker or salesperson to a buyer or seller in a real estate transaction.
