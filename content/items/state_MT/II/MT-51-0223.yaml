stem: Under Montana law, when is a party to a real estate transaction liable for a misrepresentation
  made by that party's agent or subagent?
options:
  - The party is liable only if the party has actual knowledge of the misrepresentation.
  - The party is liable if the party has actual knowledge of the misrepresentation or the
    agent/subagent is repeating a misrepresentation made by the party.
  - The party is liable only if both the party has actual knowledge and the agent/subagent is
    repeating a misrepresentation made by the party.
  - The party is liable only if the agent/subagent is repeating a misrepresentation made by the
    party.
key: B
explanation: Under Montana law, a party to a real estate transaction is liable for a
  misrepresentation made by that party's agent or subagent if the party actually knows about the
  misrepresentation, or if the agent/subagent repeats a misrepresentation that the party themselves
  made. This is based on Mont. Code Ann. § 37-51-315(1), which provides that liability arises only
  when either the party has actual knowledge of the misrepresentation or the agent/subagent is
  repeating a misrepresentation made by the party. The option stating that the party is liable if
  the party has actual knowledge of the misrepresentation or the agent/subagent is repeating a
  misrepresentation made by the party correctly reflects this rule.
citation:
  source: Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons) § 37-51-315
  url: null
  quoted_text: "(1) A party to a real estate transaction is not liable for a misrepresentation made by
    the party's agent or subagent unless: (a) the party has actual knowledge of the
    misrepresentation; or (b) the agent or subagent is repeating a misrepresentation made by the
    party."
