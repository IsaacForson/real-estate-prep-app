stem: According to Montana law, what must the Board of Realty Regulation ensure when adopting a
  schedule of fees for the real estate industry?
options:
  - That the fees must be approved by the legislature each biennium
  - That the fees must be uniform across all license types annually
  - That the fees must be reasonably related to regulatory costs in the state
  - That the fees must be the lowest possible to encourage participation
key: C
explanation: The statute requires that fees charged by the board be reasonably related to the cost
  incurred in regulating the real estate industry. Options suggesting the lowest possible fees,
  uniform fees, or legislative approval are not supported by the text.
