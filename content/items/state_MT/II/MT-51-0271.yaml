stem: Under Montana law, what must a broker or salesperson obtain before acting as a dual agent for
  a property?
options:
  - A license amendment from the Montana department
  - A verbal agreement from the Montana seller only
  - A signed, written consent of both the seller and the buyer
  - A disclosure statement to the Montana buyer only
key: C
explanation: Before a broker or salesperson can act as a dual agent for a property under Montana
  law, they must obtain the signed, written consent of both the seller and the buyer. This
  requirement is set forth in Mont. Code Ann. § 37-51-309(6)(b). The other options are incorrect
  because they lack the written requirement, limit consent to only one party, or suggest an
  unrelated license amendment.
