stem: A broker manages rental properties for an owner and fails to inform a prospective tenant about
  the broker's contractual relationship with the owner. Under Montana law, is this permissible?
options:
  - No, it is not permissible because the broker must obtain written consent from the tenant before
    managing the property.
  - No, it is not permissible because the broker must disclose the contractual relationship to all
    customers and clients.
  - No, it is not permissible because the broker must first provide an adverse material fact
    disclosure.
  - No, it is not permissible because the broker must wait until a lease is signed to disclose the
    relationship.
key: B
explanation: The statute requires a broker or salesperson who is managing properties for owners to
  disclose the contractual relationship to all customers and clients. Failing to make this
  disclosure violates the law. The other options incorrectly impose requirements such as written
  consent from the tenant, adverse material fact disclosure, or waiting until a lease is signed,
  which are not mandated by this provision.
citation:
  source: Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons) — Montana Code
    Annotated 2025, Title 37, Chapter 51 — Real Estate Brokers and Salespersons (all parts) — §
    37-51-309(8)
  url: null
  quoted_text: A broker or salesperson, while managing properties for owners, shall disclose to all
    customers and clients the contractual relationship of the broker or salesperson.
