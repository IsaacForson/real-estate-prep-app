stem: A broker decides to relocate her office to a new building. What must she do under Montana law?
options:
  - The broker must notify the department before removal or within ten days after removal and pay
    the required fee.
  - The broker must update her advertising materials with the new address and notify the department
    of the change.
  - The broker must obtain a temporary permit from the department allowing operation at the new
    address.
  - The broker must wait for the department to issue a revised license before beginning business at
    the new location.
key: A
explanation: The statute states that upon removal from the designated address, the broker must
  notify the department before removal or within ten days after removal, designating the new
  physical address and paying the required fee. The distractor suggesting only updating advertising
  materials is insufficient because statutory notice and fee payment are required.
