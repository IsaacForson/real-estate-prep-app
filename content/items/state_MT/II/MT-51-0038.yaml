stem: A real estate agent lists a home for sale. The seller informs the agent that the basement has
  never flooded, but the agent later learns from a neighbor that the basement flooded last year. The
  agent does not disclose this to the buyer. Under Montana law, is the agent liable for
  misrepresenting the basement condition?
options:
  - The agent is not liable because the misrepresentation was made by the principal
  - The agent is not liable because the agent lacked actual knowledge of the misrepresentation
  - The agent is liable because the agent should have investigated the basement condition
  - The agent is liable because the agent repeated the seller's statement
key: B
explanation: Under Mont. Code Ann. § 37-51-315(3), an agent is not liable for a misrepresentation
  made by the principal unless the agent has actual knowledge of the misrepresentation. Here, the
  agent lacked actual knowledge at the time of the representation, so the agent is not liable. The
  claim that the agent is not liable because the misrepresentation was made by the principal is
  incorrect because merely repeating the principal's statement does not create liability without
  knowledge.
