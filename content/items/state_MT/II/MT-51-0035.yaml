stem: A licensed broker moves the office to a new location. What must the broker do regarding
  notification to the department and any fee?
options:
  - The broker must notify the department before removal or within 10 days after removal and pay the
    required fee
  - The broker must notify the department only after 30 days of removal and pay no fee
  - The broker must notify the department before removal but no fee is required
  - The broker must notify only the broker's sponsoring broker before removal
key: A
explanation: Mont. Code Ann. § 37-51-308 requires the broker to notify the department before moving
  the office or within ten days after moving and to pay the required fee. The option stating that
  notification is only required after thirty days and that no fee is needed is incorrect because the
  law sets a ten‑day window and mandates a fee. The option saying notification must occur before
  moving but no fee is required is incorrect because a fee is required. The option saying the broker
  need only notify the sponsoring broker before moving is incorrect because the department must be
  notified, not just the sponsoring broker.
