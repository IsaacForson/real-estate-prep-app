stem: Applicant A completed 72 hours of approved prelicensing education 22 months ago and seeks a
  salesperson license. Applicant B completed 55 hours of approved prelicensing education 10 months
  ago and seeks a broker license. Which applicant satisfies the education requirement for the
  license they are seeking?
options:
  - Neither applicant
  - Applicant A only
  - Both applicants
  - Applicant B only
key: B
explanation: For a salesperson, subsection (8)(a) requires 70 hours of education within the 24
  months preceding application; 72 hours at 22 months meets this. For a broker, subsection (9)(a)
  requires 60 hours within the 18 months preceding application; 55 hours at 10 months falls short,
  so only Applicant A qualifies.
