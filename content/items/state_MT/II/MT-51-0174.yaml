stem: A broker pays a $200 licensing fee to the Montana Department of Labor and Industry. Where must
  that fee be deposited?
options:
  - Into the state special revenue fund for the use of the board
  - Into the broker's escrow account pending commission disbursement
  - Into the municipality's general fund where the broker's office is located
  - Into a private trust account managed by the brokerage
key: A
explanation: Mont. Code Ann. § 37-51-311 requires that fees prescribed by the board be paid into the
  state special revenue fund for the use of the board. Therefore, the $200 licensing fee must be
  deposited into that fund. Depositing the fee into a broker's escrow account or a municipal fund
  would violate this requirement.
