stem: A salesperson wants to switch supervising brokers and has found a new broker who has accepted
  supervision. What must the salesperson do before the change can take effect under Montana law?
options:
  - The salesperson must wait thirty days after notifying the department before changing association.
  - The salesperson must notify the department promptly in writing and pay the required fee.
  - The salesperson must obtain a written endorsement from the new supervising broker only.
  - The salesperson must submit a new salesperson application to the department.
key: B
explanation: The statute requires the salesperson to notify the department promptly in writing and
  pay the required fee when changing association to another supervising broker. The distractor that
  only an endorsement from the new broker is needed omits the mandatory department notification and
  fee.
citation:
  source: Mont. Code Ann. § 37-51-309(2)(a)
  url: null
  quoted_text: If a licensed salesperson desires to change association or contractual relationship
    from one supervising broker to another, the salesperson shall notify the department promptly in
    writing and pay the required fee.
