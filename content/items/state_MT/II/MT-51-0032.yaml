stem: Under Montana law, which statement correctly defines an 'adverse material fact'?
options:
  - A fact that should be recognized as significant enough to affect a person's decision to enter
    into a contract and that materially affects the value, affects the structural integrity, or
    presents a documented health risk to occupants of the property.
  - A fact that the seller believes is insignificant but could influence the buyer's decision and
    therefore does not meet the statutory threshold for disclosure, even though the test is whether
    a reasonable person would consider it significant.
  - A fact that the property was previously used for agricultural purposes and has no impact on
    value, structural integrity, or occupant health, even though prior agricultural use might still
    be relevant if it affects those aspects.
  - A fact that the buyer's financing approval is pending and the transaction may still be
    terminated without penalty, even though such a financing condition does not constitute an
    adverse material fact under Montana law.
key: A
explanation: The definition of adverse material fact includes any fact that should be recognized as
  significant enough to affect a person's decision to enter into a contract and that materially
  affects value, structural integrity, or presents a documented health risk (37-51-102(1)(a)(i)).
  The option that bases significance on the seller's belief is incorrect because the statutory
  definition does not rely on the seller's belief.
citation:
  source: Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons) — Montana Code
    Annotated 2025, Title 37, Chapter 51 — Real Estate Brokers and Salespersons (all parts) — §
    37-51-102
  url: null
  quoted_text: "'Adverse material fact' means a fact that should be recognized by a broker or
    salesperson as being significant enough to affect a person's decision to enter into a contract
    to buy or sell real property and may be a fact that: (i) materially affects the value, affects
    the structural integrity, or presents a documented health risk to occupants of the property;"
