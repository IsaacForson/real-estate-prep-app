stem: A Montana salesperson notifies the department in writing that she is leaving her supervising
  broker but does not yet have another supervising broker who has accepted supervision. What is the
  immediate effect on her salesperson license under Montana law?
options:
  - The license remains active until she secures a new supervising broker.
  - The license is automatically placed on inactive status and she may not practice.
  - The license is revoked and she must submit a new application.
  - The license is suspended for thirty days and she may not practice.
key: B
explanation: The statute provides that when a salesperson changes association without another
  supervising broker accepting supervision, the license is automatically placed on inactive status
  and the salesperson may not practice. The distractor suggesting the license remains active is
  incorrect because the statute mandates automatic inactive status, not continued activity.
