stem: Under Montana law, what is the consequence if a licensee fails to obtain a written buyer
  broker agreement before performing buyer‑agent acts?
options:
  - The licensee is not obligated to fulfill any buyer‑agent duties
  - The licensee must stop all real estate activity until a written agreement is obtained
  - The licensee must comply with the chapter’s requirements even without the agreement
  - The licensee may still act as a buyer agent but must disclose the omission later
key: C
explanation: Section 37-51-313(10) states that a licensee acting without a written buyer broker
  agreement is nevertheless obligated to comply with the requirements of this chapter. Therefore,
  the licensee remains bound by the duties despite lacking the agreement.
