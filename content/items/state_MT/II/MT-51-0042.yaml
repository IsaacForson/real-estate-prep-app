stem: A broker licensed in another state wishes to list a Montana property for sale. What must the
  broker do before engaging in real estate business in Montana?
options:
  - Obtain a temporary permit from the Montana Board of Real Estate Regulators before listing.
  - File an irrevocable written consent allowing service of summons on the department.
  - Pay a filing fee to the Montana Department of Revenue.
  - Submit a certificate of errors and omissions insurance to the state board.
key: B
explanation: Mont. Code Ann. § 37-51-306(2) requires a nonresident licensee to file an irrevocable
  written consent that legal actions may be commenced against them and that service of summons may
  be served on the department.
citation:
  source: Mont. Code Ann. § 37-51-306(2)
  url: null
  quoted_text: A nonresident licensee shall file an irrevocable written consent that legal actions
    arising out of a commenced or completed transaction may be commenced against the nonresident
    licensee in a county of this state that may be appropriate and designated by Title 25, chapter
    2, part 1. The consent must provide that service of summons in this action may be served on the
    department for and on behalf of the nonresident licensee, and this service is sufficient to give
    the court jurisdiction over the licensee conducting a transaction in a county.
