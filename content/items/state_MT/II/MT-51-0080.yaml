stem: A broker lists a property for sale but does not have a written listing agreement with the
  seller. Under Montana law, what is the broker's obligation?
options:
  - The broker is not obligated to comply with duties because no written agreement exists.
  - The broker must still comply with the requirements of this chapter.
  - The broker must cease all activities until a written agreement is obtained.
  - The broker may only act as a statutory broker under Montana law.
key: B
explanation: "Under Mont. Code Ann. § 37-51-103(10), a broker who acts as a seller agent without a
  written listing agreement remains obligated to comply with the requirements of this chapter. The
  other options misstate the rule: suggesting the broker must stop activity, has no duties, or may
  only act as a statutory broker are incorrect."
citation:
  source: Mont. Code Ann. § 37-51-103(10)
  url: null
  quoted_text: A licensed broker or salesperson must obtain an appropriate written buyer broker
    agreement or written listing agreement prior to performing the acts of a buyer agent or a seller
    agent. A licensed broker or salesperson who is acting as a buyer agent or a seller agent without
    a written buyer broker agreement or written listing agreement is nevertheless obligated to
    comply with the requirements of this chapter.
