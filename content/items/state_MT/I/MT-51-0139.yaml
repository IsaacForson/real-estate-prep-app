stem: Under Montana law, who may issue a citation to a broker for failure to comply with trust
  account maintenance requirements?
options:
  - The broker's supervising salesperson
  - The employee of the department
  - The licensed real estate broker
  - The customer of the brokerage
key: B
explanation: The statute provides that an employee of the department may issue a citation for trust
  account violations. Thus, the correct answer is the employee of the department. The distractor
  about a licensed real estate broker is incorrect because only department employees, not brokers,
  are authorized to issue such citations under this provision.
