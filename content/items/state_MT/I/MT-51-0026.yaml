    Rules of Montana, Title 24, Chapter 210 — Board of Realty Regulation (all effective rules) — §
    24.210.643"
  url: null
  quoted_text: A licensee who receives a citation has five business days from the receipt of the
    citation to either pay the fee or file a written dispute.
