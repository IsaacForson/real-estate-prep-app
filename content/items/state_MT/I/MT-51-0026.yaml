stem: A licensee receives a citation via certified mail on Thursday, March 7. Assuming no holidays,
  what is the last business day the licensee may pay the fine or file a written dispute?
options:
  - March 12
  - March 13
  - March 14
  - March 15
key: C
explanation: The rule provides five business days from receipt to pay or dispute. Counting five
  business days after March 7 (Friday March 8, Monday March 11, Tuesday March 12, Wednesday March
  13, Thursday March 14) makes March 14 the final day. March 12 only counts three business days,
  March 13 counts four, and March 15 would be the sixth business day.
citation:
