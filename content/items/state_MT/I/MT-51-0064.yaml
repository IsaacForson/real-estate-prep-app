stem: The Board of Realty Regulation wants to conduct a real estate clinic for licensees. What
  authority allows the board to do this?
options:
  - The board may set the minimum commission rates for sales transactions in the state of Montana
  - The board may require licensees to submit monthly sales reports to the board for review
  - The board may conduct, hold, or assist in conducting or holding real estate clinics, meetings,
    courses, or institutes
  - The board may appoint a state attorney to prosecute violations of real estate law
key: C
explanation: Montana Code Annotated § 37-51-204 authorizes the board to conduct, hold, or assist in
  conducting or holding real estate clinics, meetings, courses, or institutes. The statute does not
  grant the board power to set commission rates, require monthly sales reports, or appoint a state
  attorney for prosecutions.
