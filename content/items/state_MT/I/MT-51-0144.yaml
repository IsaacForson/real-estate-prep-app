stem: According to Montana law, what power does the Board of Realty Regulation have regarding the
  issuance of licenses?
options:
  - Regulate license issuance for brokers
  - Set education requirements for applicants
  - Approve real estate advertising statewide
  - Manage the state's real estate trust funds
key: A
explanation: The board may regulate the issuance of licenses under Mont. Code Ann. § 37-51-202,
  which directly grants this authority. Setting education requirements for applicants is governed by
  § 37-51-302, which is outside the scope of this section.
