stem: The Board of Realty Regulation receives a $5,000 donation earmarked for board operations, but
  there is no specific statutory provision dictating where this money should be deposited. Where
  must the board deposit this money according to Montana law?
options:
  - The money must be deposited in the state general fund for board operations
  - The money must be deposited in the real estate recovery fund for board use
  - The money must be deposited in the board's operating account for board expenses
  - The money must be deposited in the state special revenue fund for board use
key: D
explanation: Section 37-51-208 directs that money received for the board’s use with no specific
  deposit provision must go into the state special revenue fund for the board’s use. The distractor
  suggesting the board’s operating account is incorrect because the statute does not authorize that
  deposit absent a specific provision.
