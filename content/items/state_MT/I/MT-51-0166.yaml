stem: A firm's professional liability insurance policy sets a deductible of $15,000 per claim.
  According to Montana law, what must the firm do to comply with the deductible requirement?
options:
  - The firm must reduce the deductible to $10,000
  - The firm must increase the deductible to $20,000
  - The firm must take no further action
  - The firm must obtain written board approval
key: D
explanation: Montana law allows a professional liability deductible of up to $10,000 per claim
  without any additional approval. When the deductible is greater than $10,000 but does not exceed
  $100,000, the firm must first obtain written approval from its board of directors. Because the
  policy’s deductible is $15,000, which is above the $10,000 threshold, the firm must secure written
  board approval before the policy complies with the statute. Reducing the deductible to $10,000
  would eliminate the need for approval but is not required, and increasing it to $20,000 still
  requires board approval. Taking no action would leave the firm out of compliance.
citation:
  source: Mont. Code Ann. § 37-51-325(7)(c)(ii)
