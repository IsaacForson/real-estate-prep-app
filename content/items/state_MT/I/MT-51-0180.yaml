stem: A supervising broker notifies the salesperson of termination of supervision but fails to
  notify the board. According to Montana law, when does the termination of supervision become
  effective?
options:
  - Effective upon salesperson notification only
  - Effective upon board notification only
  - Effective after a five‑business‑day delay
  - Effective only after both parties agree
key: B
explanation: The termination of supervision is not effective until the supervising broker has
  notified both the salesperson and the board. Since the board was not notified, the termination
  does not become effective until that occurs; the other options incorrectly base effectiveness on
  the salesperson alone, a fixed delay, or mutual agreement.
citation:
