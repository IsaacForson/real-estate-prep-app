stem: According to Montana Administrative Rule 24.210.201, what procedural rules does the Board of
  Realty Regulation adopt?
options:
  - The procedural rules of the Office of the Governor as listed in chapter 1 of this title
  - The procedural rules of the Department of Labor and Industry as listed in chapter 2 of this title
  - The procedural rules of the Department of Justice as listed in chapter 5 of this title
  - The procedural rules of the Montana Supreme Court as listed in title 25
key: B
explanation: The rule states the Board adopts and incorporates the procedural rules of the
  Department of Labor and Industry as listed in chapter 2 of this title. Therefore, the correct
  answer is the procedural rules of the Department of Labor and Industry as listed in chapter 2 of
  this title. The distractor referencing the Montana Supreme Court is incorrect because the rule
  does not mention that source.
