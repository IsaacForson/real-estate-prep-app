stem: A Montana real estate brokerage wants to charge a new administrative fee to license holders.
  According to the statute, what must the Board of Realty Regulation ensure when adopting a schedule
  of fees?
options:
  - Be applied equally to all licensees
  - Be established by the state legislature
  - Be related to the cost of regulation
  - Be limited to fifty dollars annually
key: C
explanation: Under 37-51-207, fees charged by the board must be reasonably related to the cost
  incurred in regulating the real estate industry, making the cost‑related option correct. The
  option suggesting the legislature sets the fee schedule is wrong because the board, not the
  legislature, adopts the fee schedule.
