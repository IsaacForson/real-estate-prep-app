stem: Which of the following is considered unprofessional conduct under Montana law?
options:
  - Failing to maintain continuous professional liability insurance coverage as required by 37-51-325
  - Charging a reasonable commission for services rendered to a client in a real estate transaction
  - Providing an accurate property description to a prospective buyer during the showing process
  - Accepting a nominal gift from a client valued under twenty-five dollars at closing
key: A
explanation: Under Montana law, failing to maintain continuous professional liability insurance
  coverage that meets the requirements of 37-51-325 is expressly listed as unprofessional conduct.
  Charging a reasonable commission for services rendered is permissible and not prohibited by the
  statute.
