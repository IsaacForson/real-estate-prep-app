stem: A Montana salesperson signs contracts to work under two different supervising brokers at the
  same time, without a temporary arrangement. According to Montana law, what is the status of this
  situation?
options:
  - Allowed if the salesperson limits work to part-time for each broker and receives separate
    commissions
  - Allowed if the salesperson informs both brokers about the dual association and believes it is
    permissible
  - Allowed if the salesperson holds a broker's license and thinks that permits working for two
    supervising brokers
  - Prohibited because a salesperson may not be associated with more than one supervising broker
    except on a temporary basis
key: D
explanation: The statute limits a salesperson to association with one supervising broker unless the
  association is temporary; working for two brokers simultaneously violates this rule.
citation:
  source: "### Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons) — Montana
    Code Annotated 2025, Title 37, Chapter 51 — Real Estate Brokers and Salespersons (all parts) — §
    37-51-309"
  url: null
  quoted_text: A salesperson may not be associated with, be under contract to, or perform services for
    more than one supervising broker, except on a temporary basis as provided in 37-51-302 .
