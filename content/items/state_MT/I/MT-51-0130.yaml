stem: A Montana real estate salesperson completes an online continuing education course approved by
  the board. The salesperson and the instructor are not in the same location during the instruction.
  What action may the Board of Realty Regulation take regarding this salesperson's compliance with
  the continuing education requirement?
options:
  - Requiring the salesperson to retake the course in a classroom
  - Requiring the salesperson to pay an additional processing fee
  - Requiring the salesperson to meet board-set performance standards
  - Requiring the salesperson to submit a paper certificate of completion
key: C
explanation: When a licensee completes CE remotely, the board may require specified performance
  levels to ensure comprehension (Mont. Code Ann. § 37-51-204(3)). Thus requiring the salesperson to
  meet board‑set performance standards is appropriate. Requiring a classroom retake goes beyond the
  board’s authority; the board cannot mandate a specific delivery format.
citation:
  source: Mont. Code Ann. § 37-51-204(3)
  url: null
  quoted_text: The board may require specified performance levels of a licensee with respect to the
    subject matter of a continuing education course required by the board when the licensee and the
    instructor of the course are not physically present in the same facility at the time the
    licensee receives the instruction.
