stem: A Montana broker receives an earnest money deposit of $5,000 on a Wednesday. Assuming no
  alternative agreement, by the end of which business day must the broker deposit the funds into a
  trust account under Montana Administrative Rule 24.210.427?
options:
  - Thursday
  - Friday
  - Monday
  - Tuesday
key: C
explanation: The rule requires deposit within three business days of receipt. Counting Wednesday as
  day zero, the third business day falls on Monday. Depositing by Thursday would satisfy only one
  business day, not the required three.
