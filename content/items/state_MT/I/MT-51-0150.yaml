stem: Under Montana law, which of the following specific acts by a licensed broker is prohibited and
  may lead to disciplinary action?
options:
  - Employing an unlicensed person to perform real estate brokerage activities
  - Displaying the broker's license at the broker's office
  - Renewing the broker's license every two years
  - Completing continuing education courses approved by the board
key: A
explanation: Mont. Code Ann. § 37‑51‑306 makes it a violation for a broker to employ or compensate
  anyone who is not a licensed broker, salesperson, or property manager to perform real‑estate
  brokerage activities. Displaying the broker’s license at the office, renewing the license every
  two years, and completing board‑approved continuing‑education courses are permitted or required
  under the licensing rules.
citation:
