stem: When the Board of Realty Regulation receives money that has no specific provision for its
  deposit or disposition, where must that money be deposited according to Montana law?
options:
  - Be deposited in the state special revenue fund
  - Be placed in the board's operating account
  - Be transferred to the state general fund
  - Be returned to the payer immediately
key: A
explanation: According to 37-51-208, money lacking a specific deposit provision must be deposited in
  the state special revenue fund for the board's use, so depositing it there is correct. The option
  about placing the money in the board's operating account is incorrect because the statute directs
  it to the state special revenue fund, not a board‑operated account.
