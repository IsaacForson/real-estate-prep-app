stem: Under Montana law, what may the Board of Realty Regulation require of a licensee who completes
  a continuing education course that is **NOT** delivered in a face-to-face format?
options:
  - Requiring the licensee to complete a supplemental assessment
  - Requiring the licensee to meet board-set performance standards
  - Requiring the licensee to pay an extra processing fee
  - Requiring the licensee to retake the course in a classroom
key: B
explanation: The board may require specified performance levels for continuing education when the
  licensee and instructor are not physically present (Mont. Code Ann. § 37-51-204(3)). Requiring the
  licensee to meet board‑set performance standards is therefore permissible. Requiring an extra
  processing fee is not authorized by this provision; fee schedules must be related to regulatory
  costs, not imposed as a condition of CE completion.
citation:
  source: Mont. Code Ann. § 37-51-204(3)
  url: null
  quoted_text: The board may require specified performance levels of a licensee with respect to the
    subject matter of a continuing education course required by the board when the licensee and the
    instructor of the course are not physically present in the same facility at the time the
    licensee receives the instruction.
