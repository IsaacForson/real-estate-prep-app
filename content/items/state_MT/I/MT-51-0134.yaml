stem: A broker fails to deposit trust funds within the required time frame, which is deemed a
  deficiency under 37-1-321(1)(a) through (e) MCA. Under the board’s authorization, what action may
  the department take regarding this deficiency?
options:
  - Administrative disqualification
  - Administrative suspension
  - Administrative penalty
  - Administrative revocation
key: B
explanation: The board authorizes the department to administratively suspend licenses for
  deficiencies set forth in 37-1-321(1)(a) through (e) MCA. Thus, the department may impose an
  administrative suspension for the trust‑fund deposit deficiency. The distractor of issuing a
  warning letter is not authorized by this rule; the rule specifically provides for administrative
  suspension as the authorized action.
