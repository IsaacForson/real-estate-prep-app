stem: The Board of Realty Regulation adopts a new schedule of fees for license holders. Where must
  the fees deposited be according to Montana statute?
options:
  - The fees must be deposited in the local county treasury office
  - The fees must be deposited in the state special revenue fund for the use of the board
  - The fees must be deposited in the broker's separate escrow account
  - The fees must be deposited in the general fund of the state government
key: B
explanation: The statute requires that fees adopted by the board be paid into the state special
  revenue fund for the use of the board, as stated in Mont. Code Ann. § 37-51-207. Depositing fees
  into the general fund, county treasury, or escrow account would not satisfy this requirement.
