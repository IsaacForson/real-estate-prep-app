  - Raise the per‑claim limit to $200k
  - Renew the policy with current insurer
  - Cancel the group policy entirely
key: A
explanation: The statute allows the board to place the contract out for bid at the end of any policy
  period. Renewing with the same insurer without bidding is not required, making that option
  incorrect.
