stem: Under Montana law, what power does the Board of Realty Regulation have regarding license issuance?
options:
  - The power to regulate the issuance of licenses
  - The power to revoke or suspend licenses
  - The power to set educational course requirements
  - The power to collect licensing fees
key: A
explanation: The board may regulate the issuance of licenses under Mont. Code Ann. § 37-51-202,
  which states the board may regulate the issuance of licenses and revoke or suspend licenses. This
  makes regulating issuance a core power. The power to revoke or suspend licenses, while also
  listed, is a distinct disciplinary action not the power over issuance.
