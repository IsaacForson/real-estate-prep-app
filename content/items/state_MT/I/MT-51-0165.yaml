math:
  worked_solution: |-
    Start with the minimum annual aggregate limit: $300,000.
    Subtract the amount already incurred in claims: $300,000 - $120,000 = $180,000.
  formulas:
    - Remaining coverage = Aggregate limit - Incurred claims
