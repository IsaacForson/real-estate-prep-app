stem: A real estate broker maintains a professional liability insurance policy with the minimum
  annual aggregate limit of $300,000. During the policy term, the broker has already incurred
  $120,000 in covered claims. What is the remaining amount available for additional claims under the
  policy?
options:
  - $240,000
  - $180,000
  - $120,000
  - $60,000
key: B
explanation: The rule sets the minimum annual aggregate limit at $300,000. Subtracting the $120,000
  already paid in claims leaves $180,000 of coverage. The $120,000 distractor incorrectly uses the
  incurred claims amount as the remaining coverage, while $60,000 and $240,000 result from erroneous
  subtraction or addition.
citation:
  source: Mont. Code Ann. § 37-51-325(6)(b)
  url: null
