stem: A Montana real estate broker receives a citation for failing to maintain trust account
  requirements and decides to dispute the citation. What happens next under Montana Administrative
  Rule 24.210.643?
options:
  - The broker must pay the fine within five days
  - The broker's license is suspended immediately
  - The citation is dismissed automatically
  - The citation and dispute go to the screening panel
key: D
explanation: Montana Administrative Rule 24.210.643 provides that when a licensee disputes a
  citation, the citation and the dispute are forwarded to the screening panel for consideration.
  Consequently, the statement that the citation and dispute go to the screening panel is the correct
  response. The other statements are incorrect because the rule does not require immediate payment
  of a fine, does not impose an automatic suspension, and does not dismiss the citation without
  panel review.
