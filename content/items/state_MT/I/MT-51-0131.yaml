stem: The Board of Realty Regulation obtains electronic records of a licensee's continuing education
  completion from an approved provider. According to Montana law, how may the board use this
  electronic information?
options:
  - To evaluate the licensee's adherence to advertising standards and disclosure requirements
  - To determine whether the licensee has satisfied the board's education requirements
  - To verify the licensee's errors and omissions insurance policy is active
  - To calculate the licensee's renewal fee based on the board's published schedule
key: B
explanation: Electronic education information may be used solely to determine compliance with the
  board’s education requirements (Mont. Code Ann. § 37-51-204(4)). Using it to evaluate advertising
  compliance exceeds the statutory limitation. The other options describe purposes not authorized by
  this provision.
citation:
  source: Mont. Code Ann. § 37-51-204(4)
