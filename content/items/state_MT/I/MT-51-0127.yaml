stem: A licensee receives a citation for failing to maintain trust account requirements and does not
  pay the fine or file a written dispute within five business days. What is the result?
options:
  - The licensee is required to attend a mandatory ethics refresher course
  - The failure is considered unprofessional conduct and subject to board discipline
  - The citation is automatically dismissed after ten business days
  - The licensee must immediately surrender their license to the board
key: B
explanation: Montana Administrative Rule 24.210.643(2) states that failure to either pay the fine or
  file a written dispute within five business days is unprofessional conduct and subject to board
  discipline. The citation is not automatically dismissed, nor does the licensee have to surrender
  the license solely for this failure.
