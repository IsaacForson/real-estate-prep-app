stem: A citation is issued to a broker for failing to maintain trust account requirements. According
  to Montana law, which of the following must be included in the citation?
options:
  - The broker's personal bank account details
  - The broker's social security number
  - The name of the broker's sponsoring broker
  - The time and date on which the citation is issued
key: D
explanation: The statute requires that a citation include the time and date on which the citation is
  issued. Hence, the correct answer is the time and date on which the citation is issued. The
  distractor about the broker's social security number is incorrect because the statute does not
  require that information in a citation.
