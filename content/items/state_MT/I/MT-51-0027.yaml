stem: A licensee refuses to sign and accept a citation but does not file a written dispute.
  According to Montana law, what is the consequence?
options:
  - The licensee may be assessed additional fines but cannot face disciplinary action for refusing
    to sign.
  - The licensee is demonstrating unprofessional conduct and may be subject to board discipline for
    refusing to sign.
  - The licensee must pay the fine immediately and forfeit the right to dispute the citation.
  - The licensee may ignore the citation entirely, as refusal to sign nullifies the violation.
key: B
explanation: The statute provides that a person who refuses to sign and accept a citation but does
  not file a written dispute is demonstrating unprofessional conduct, which can lead to board
  discipline. Therefore, the correct answer is that the licensee is demonstrating unprofessional
  conduct and may be sanctioned. The distractor suggesting additional fines but no disciplinary
  action misstates the consequence, as the refusal itself constitutes unprofessional conduct.
