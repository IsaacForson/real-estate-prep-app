stem: A Montana broker hires an unlicensed assistant to show properties and negotiate purchase
  offers on behalf of clients. According to Montana law, what is the status of this arrangement?
options:
  - Permitted if the assistant receives a salary or hourly wage for showing properties
  - Permitted if the assistant works under the broker's direct supervision daily
  - Prohibited because the broker may not employ or compensate an unlicensed person to perform
    regulated acts
  - Permitted only if the assistant obtains a state-issued salesperson's license within 30 days
key: C
explanation: Under Mont. Code Ann. § 37-51-306, a broker may not employ or compensate an unlicensed
  person to perform regulated acts, regardless of how the assistant is paid or supervised.
citation:
  source: "### Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons) — Montana
    Code Annotated 2025, Title 37, Chapter 51 — Real Estate Brokers and Salespersons (all parts) — §
    37-51-306"
  url: null
  quoted_text: A licensed broker may not employ or compensate, directly or indirectly, a person for
    performing the acts regulated by this chapter who is not a licensed broker, a licensed
    salesperson, or a licensed property manager.
