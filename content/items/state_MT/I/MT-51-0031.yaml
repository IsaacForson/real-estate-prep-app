stem: Who must charge the fees that the Board of Realty Regulation prescribes for real estate
  licensing activities in Montana?
options:
  - The board
  - The municipality
  - The department
  - The licensee
key: C
explanation: The statute states that the fees prescribed by the board must be charged by the
  department, so the department is responsible for charging those fees. The board’s role is limited
  to prescribing the fees, not charging them. Therefore, the correct answer is the department. The
  distractor “the board” is incorrect because the board only prescribes, does not charge.
