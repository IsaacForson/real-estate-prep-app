stem: How many business days does a licensee have to either pay a citation fee or file a written
  dispute after receiving a citation from the Montana Board of Realty Regulation?
options:
  - 10 business days
  - 5 business days
  - 3 business days
  - 7 business days
key: B
explanation: The rule states that a licensee who receives a citation has five business days from
  receipt to either pay the fee or file a written dispute. Therefore, the correct answer is five
  business days. The distractor of three business days undercounts the allowed period, while seven
  and ten business days overcount it.
