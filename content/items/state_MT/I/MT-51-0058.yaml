stem: Where must the fees prescribed by the Board of Realty Regulation be deposited according to
  Montana law?
options:
  - Into the local municipality’s treasury where the brokerage operates
  - Into the department’s operating account for licensing services
  - Into the state general fund for public education
  - Into the state special revenue fund for the use of the board
key: D
explanation: Montana law directs that any fees set by the Board of Realty Regulation must be paid
  into the state special revenue fund that is designated for the board’s use (Mont. Code Ann.
  § 37‑51‑311). Consequently, the fees are not deposited in a local municipality’s treasury, nor in
  the department’s operating account, and they are not placed in the general fund for public
  education.
