stem: A Montana real estate broker receives an administrative suspension from the Board of Realty
  Regulation for failing to deposit trust funds within three business days. Under Montana
  Administrative Rule 24.210.440, how is this administrative suspension classified?
options:
  - As a disciplinary action requiring federal reporting
  - As a non-disciplinary action not reportable under federal law
  - As a disciplinary action that may be appealed to the board
  - As a non-disciplinary action that still counts as prior offense
key: B
explanation: An administrative suspension is explicitly defined as not a disciplinary action and is
  not reportable under federal law. The distractor describing it as a disciplinary action requiring
  federal reporting is wrong because the rule states it is neither disciplinary nor reportable.
citation:
  source: Mont. Admin. R. 24.210.101–24.210.1005 (Board of Realty Regulation) — Administrative Rules
    of Montana, Title 24, Chapter 210 — Board of Realty Regulation (all effective rules) — §
    24.210.440
  url: null
  quoted_text: An administrative suspension is not a negative, adverse, or disciplinary action under
    Title 37, MCA, and is not reportable under federal law and regulations implementing the
    Healthcare Practitioner Databank or the department's licensee lookup and license verification
    databank.
