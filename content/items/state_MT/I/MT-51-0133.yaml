  url: null
  quoted_text: An administrative suspension is not a negative, adverse, or disciplinary action under
    Title 37, MCA, and is not reportable under federal law and regulations implementing the
    Healthcare Practitioner Databank or the department's licensee lookup and license verification
    databank.
