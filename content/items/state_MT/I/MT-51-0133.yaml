stem: A licensee receives an administrative suspension from the Montana Department of Labor and
  Industry for a deficiency identified under 37-1-321 MCA. What is the effect of this administrative
  suspension regarding federal reporting requirements?
options:
  - It is considered a disciplinary action under Title 37 MCA.
  - It is not reportable under federal law.
  - It is reported to the federal Healthcare Practitioner Databank.
  - It results in automatic revocation after 30 days.
key: B
explanation: The rule specifies that an administrative suspension is not a negative, adverse, or
  disciplinary action under Title 37 MCA and is not reportable under federal law, including the
  Healthcare Practitioner Databank. Therefore, the suspension does not trigger federal reporting.
  The distractor that it is considered a disciplinary action under Title 37 MCA is incorrect because
  the rule explicitly states it is not a disciplinary action.
citation:
