stem: The Board of Realty Regulation proposes a new license renewal fee that would generate revenue
  exceeding the actual cost of processing renewals by 20%. Based on Montana statute, is this fee
  permissible?
options:
  - The fee is permissible as long as the fee is approved by the legislature
  - The fee is not permissible because fees must be reasonably related to the cost incurred in
    regulating the industry
  - The fee is not permissible because fees must be lower than the cost to encourage compliance
  - The fee is permissible because the board may set any fee it deems necessary
key: B
explanation: Under 37-51-207, any fee adopted by the board must be reasonably related to the cost of
  regulating the industry; a fee that exceeds cost by 20% violates this requirement. The distractor
  claiming the board may set any fee it deems necessary ignores the statutory limitation tying fees
  to regulatory costs.
citation:
  source: Mont. Code Ann. § 37-51-207
  url: null
  quoted_text: The fees charged must be reasonably related to the cost incurred in regulating the real
    estate industry.
  secondary: []
math:
  worked_solution: Let C = cost of processing renewals. The proposed fee generates revenue that
    exceeds C by 20%. Revenue = C + (20% of C) = C × (1 + 0.20) = 1.20C. The excess amount = Revenue
    – C = 0.20C, which is 20% above cost.
  formulas:
    - "Percentage increase: New Value = Original Value × (1 + percent/100)"
    - Excess amount = Original Value × (percent/100)
