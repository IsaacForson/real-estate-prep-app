stem: What is the maximum contract period allowed between the insurer and the board for the group
  professional liability policy under Montana law?
options:
  - Seven consecutive policy terms
  - Five consecutive policy terms
  - Three consecutive policy terms
  - One policy term per year
key: A
explanation: Under Mont. Code Ann. § 37-51-325(4)(a), the maximum contract period between the
  insurer and the board is seven consecutive policy terms, although the board may place the contract
  out for bid at the end of any policy period. The other options incorrectly state shorter periods
  that are not supported by the statute.
