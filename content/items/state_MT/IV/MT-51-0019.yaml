stem: Under Montana's statute limiting actions for compensation, what must a person acting as a
  broker or salesperson allege and prove before a court will allow a suit to collect a commission?
options:
  - That the person was a duly licensed broker or salesperson when the claim arose
  - That the person filed a formal written complaint with the licensing board before suing
  - That the commission owed to the person exceeds five hundred dollars in value
  - That the opposing party admitted the debt in a signed writing
key: A
explanation: The statute bars a person from maintaining an action to collect compensation without
  first alleging and proving that the person was duly licensed at the time the claim arose.
