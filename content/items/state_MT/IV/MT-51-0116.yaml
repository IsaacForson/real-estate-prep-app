stem: A Montana licensee has maintained continuous professional liability insurance coverage for the
  past five years. When obtaining a new policy, what must the policy include regarding prior acts
  coverage?
options:
  - No prior acts coverage because the licensee has continuous coverage
  - Prior acts coverage for acts before the new policy's inception
  - Prior acts coverage only for claims made during the policy period
  - Prior acts coverage only if the licensee pays an additional premium
key: B
explanation: The statute requires that policies offer prior acts coverage to an insured who
  maintains continuous past insurance coverage. Therefore, the new policy must include prior acts
  coverage for acts before the policy's inception.
