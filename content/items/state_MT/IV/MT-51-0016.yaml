stem: Under Montana law, a real estate firm's professional liability policy may carry a deductible
  above the standard per-claim cap, up to a higher ceiling set by rule, only if which condition is
  met?
options:
  - The firm has operated continuously in Montana for at least ten years
  - The board has given written approval based on proof of financial ability
  - Every broker at the firm individually co-signs the insurance policy
  - The firm's designated broker alone personally guarantees the full deductible amount
key: B
explanation: A higher firm deductible is allowed only with the board's written approval, granted
  when the firm shows it is financially able to pay the difference above $10,000.
