stem: Under Montana law, how is the term 'extended reporting period' defined for professional
  liability insurance?
options:
  - The policy provides a designated period after expiration or cancellation during which a claim
    may be made and reported as if it had been made during the policy period
  - The policy provides coverage for claims that occurred before the retroactive date if reported
    during the policy period under the policy
  - The policy automatically provides a 60-day period to report a claim if canceled for any reason
    other than nonpayment of premium under the policy
  - The policy offers coverage only for claims first made and reported during the policy period
    under the policy
key: A
explanation: The key is correct because subsection (9)(c) defines extended reporting period as a
  designated period after expiration or cancellation of a claims-made and reported policy during
  which a claim may be made and reported as if it had been made during the policy period. The most
  tempting distractor is B, which incorrectly describes coverage for claims that occurred before the
  retroactive date; that describes the retroactive date limitation, not the extended reporting
  period.
citation:
  source: Mont. Code Ann. § 37-51-325(9)(c)
  url: null
  quoted_text: '"Extended reporting period" means a designated period of time after expiration or
    cancellation of a claims-made and reported policy during which a claim may be made and reported
    as if the claim had been made and reported during the policy period.'
