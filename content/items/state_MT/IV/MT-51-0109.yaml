stem: The Board of Realty Regulation seeks to establish the group professional liability policy for
  the upcoming licensing year but determines that no insurer offers commercially reasonable terms.
  What is the effect on the insurance requirement for real estate licensees during that year?
options:
  - The insurance requirement remains in effect and requires individual policies
  - The insurance requirement is modified to allow a higher deductible
  - The insurance requirement does not apply during the licensing period
  - The insurance requirement is waived for the licensing period
key: C
explanation: Subsection (5) states that if the board cannot obtain a commercially reasonable policy
  as described in subsection (4), the requirements of this section do not apply to the licensing
  period for which the policy is sought. Therefore, the requirement does not apply, rather than
  being waived or modified.
