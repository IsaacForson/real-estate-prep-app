stem: Under the Board of Realty Regulation's rule on liability insurance deductibles, what must a
  real estate firm submit to obtain approval for a policy whose deductible exceeds the standard
  per-claim cap?
options:
  - A copy of the firm's most recent federal tax return
  - A letter from a qualified accountant showing the firm can pay the difference
  - A surety bond filed directly with the Montana Department of Labor and Industry
  - A notarized statement from the firm's designated broker alone
key: B
explanation: The rule requires the firm to submit a letter from a qualified accountant stating that
  the firm is financially able to pay the difference between the policy's deductible and $10,000.
