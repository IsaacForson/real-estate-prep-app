stem: A Montana real estate salesperson’s professional liability policy expires on June 30. She
  wants to purchase an optional extended reporting period. What is the minimum length she can buy,
  and by when must she request and pay for it?
options:
  - She can purchase an extended reporting period of at least 180 days, and must request and pay
    within 60 days after expiration.
  - She can purchase an extended reporting period of at least 30 days, and must request and pay
    within 30 days after expiration.
  - She can purchase an extended reporting period of at least 365 days, and must request and pay
    within 30 days after expiration.
  - She can purchase an extended reporting period of at least 365 days, and must request and pay
    within 60 days after expiration.
key: D
explanation: The statute requires that an optional extended reporting period be not less than 365
  days, and that the insured request it and pay any additional premium within 60 days after
  expiration or cancellation of the policy (Mont. Code Ann. § 37-51-325(3)(d)). The option stating a
  minimum of 180 days is incorrect because the minimum length must be at least 365 days; the option
  stating a minimum of 30 days is incorrect for the same reason; the option stating a 30‑day request
  window is incorrect because the insured must request and pay within 60 days after expiration.
