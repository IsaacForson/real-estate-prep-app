stem: A Montana real estate firm wants its professional liability policy to have a deductible of
  $15,000 per claim. What must the firm do to obtain board approval for this deductible amount?
options:
  - The firm must submit a letter from a qualified accountant stating that the firm is financially
    able to pay the difference between the deductible and $10,000.
  - The firm must obtain written consent from each affiliated licensee before the deductible can
    exceed the $10,000 threshold.
  - The firm must reduce the deductible to $10,000 or lower to avoid any board review of the
    professional liability policy.
  - The firm must provide documentation showing that it has not had any claims exceeding $5,000
    during the previous five-year period.
key: A
explanation: Under the Board’s rule, a firm may adopt a deductible between $10,000 and $100,000 per
  claim only with board approval, which requires a letter from a qualified accountant showing the
  firm can pay the amount of the deductible above $10,000 (Mont. Admin. R. 24.210.438(2)). The other
  options describe consent from licensees, reducing the deductible, or claim history, which are not
  required for approval.
