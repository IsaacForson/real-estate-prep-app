stem: A Montana real estate salesperson purchases a professional liability policy from an insurer
  that is not licensed under Title 33 to provide professional liability insurance. According to
  Montana law, is this policy acceptable to satisfy the licensee's insurance requirement?
options:
  - The policy is not acceptable because it must be issued by an insurer licensed under Title 33
  - The policy is not acceptable unless the licensee obtains written approval from the Board of
    Realty Regulation
  - The policy is acceptable if the licensee also obtains prior acts coverage from another source
  - The policy is acceptable if it meets the minimum per-claim and aggregate limits required by
    Montana law
key: A
explanation: Montana law requires that a professional liability policy be issued by an insurer
  licensed under Title 33 to provide such coverage. Consequently, a policy purchased from an insurer
  not licensed under Title 33 does not satisfy the licensee's insurance requirement, even if the
  policy meets the minimum limits, includes prior acts coverage from another source, or has board
  approval.
