stem: Under Montana law, what does the term 'claims-made and reported policy' mean in the context of
  professional liability insurance for real estate licensees?
options:
  - A policy that covers claims for acts occurring before the retroactive date if reported during
    the policy period and does not require the claim to be first made during the policy period
  - A policy that covers claims first made against the insured and first reported during the policy
    period for acts occurring after the retroactive date
  - A policy that only covers claims reported after the policy period ends and does not cover claims
    made during the policy period for any acts
  - A policy that provides coverage for any claim made during the policy period regardless of when
    the act occurred and does not require the claim to be first made or first reported during the
    policy period
key: B
explanation: According to subsection (9)(b), a claims-made and reported policy provides coverage for
  claims first made against the insured and first reported during the policy period for acts,
  errors, or omissions occurring after the retroactive date. The correct option states that the
  policy covers claims first made against the insured and first reported during the policy period
  for acts occurring after the retroactive date. The incorrect option that says the policy provides
  coverage for any claim made during the policy period regardless of when the act occurred omits the
  requirements that the claim must be first made and first reported during the policy period and
  that the acts must occur after the retroactive date. The incorrect option that says the policy
  only covers claims reported after the policy period ends is wrong because coverage requires the
  claim to be both first made and first reported during the policy period. The incorrect option that
  says the policy covers claims for acts occurring before the retroactive date if reported during
  the policy period is wrong because coverage is limited to acts occurring after the retroactive
  date.
citation:
  source: Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons) — Montana Code
    Annotated 2025, Title 37, Chapter 51 — Real Estate Brokers and Salespersons (all parts) — §
    37-51-325(9)(b)
  url: null
  quoted_text: Claims-made and reported policy means an insurance policy written on a claims-made and
    reported basis, which provides coverage for claims first made against the insured and first
    reported to the insurer during the insured's policy period for acts, errors, or omissions that
    occur after the insured's retroactive date.
