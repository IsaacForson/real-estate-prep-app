stem: Under Montana law, what does the term 'aggregate limit' mean in the context of professional
  liability insurance for real estate licensees?
options:
  - It is a provision that limits the maximum payout for a single claim under the policy.
  - It is a provision that limits the maximum liability of an insurer for a series of losses in a
    given time period.
  - It is a provision that extends the reporting period for claims after policy cancellation.
  - It is a provision that requires the insurer to cover prior acts without additional premium.
key: B
explanation: The statute defines 'aggregate limit' as a provision limiting the insurer's maximum
  liability for a series of losses during a given time period, such as a policy term (Mont. Code
  Ann. § 37-51-325(9)(a)). The other options describe a per‑claim limit, an extended reporting
  period, or prior acts coverage, which are defined elsewhere.
