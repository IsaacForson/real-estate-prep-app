stem: What must be true of the insurer issuing a professional liability insurance policy for a
  Montana real estate licensee under state law?
options:
  - The insurer must have a minimum financial rating of A- from a recognized agency
  - The insurer must be approved by the Board of Realty Regulation before issuing the policy
  - The insurer must be domiciled in Montana and maintain a local office
  - The insurer must be licensed under Title 33 to provide professional liability insurance
key: D
explanation: Subsection (3)(a) of Mont. Code Ann. § 37-51-325 requires that the policy be issued by
  an insurer licensed under Title 33 to provide professional liability insurance. The board’s
  approval is required only for the group policy, not for the insurer itself, making the other
  options incorrect.
