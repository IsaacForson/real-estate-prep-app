stem: A licensee’s professional liability policy has expired. To obtain the optional extended
  reporting period of **NOT** less than 365 days, what must the licensee do?
options:
  - Request extension and pay premium within 60 days
  - Request extension and pay premium after 60 days
  - Request extension and pay premium within 90 days
  - Request extension and pay premium within 30 days
key: A
explanation: According to Mont. Code Ann. § 37-51-325(3)(d), the policy must offer an optional
  extended reporting of not less than 365 days if the insured requests the extended reporting period
  and pays any additional premium for the extended reporting period within 60 days after expiration
  or cancellation of the policy. The other options describe unrelated requirements such as board
  approval for deductibles or waiting for automatic extension.
