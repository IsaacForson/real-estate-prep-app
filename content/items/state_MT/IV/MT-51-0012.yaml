stem: If a licensee's professional liability policy is canceled or **NOT** renewed for a reason
  other than nonpayment of premium or a deductible, what reporting period must the policy
  automatically provide?
options:
  - A three-hundred-sixty-five-day mandatory waiting period to file a claim
  - A sixty-day extended reporting period to report a claim
  - A ninety-day notice period before the board may suspend the license
  - A thirty-day grace period to renew the same policy terms
key: B
explanation: The statute requires policies to provide an automatic sixty-day extended reporting
  period to report a claim when the policy is canceled or not renewed for reasons other than
  nonpayment.
