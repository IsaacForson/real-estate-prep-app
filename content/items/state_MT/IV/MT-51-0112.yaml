stem: A Montana real estate broker has maintained continuous professional liability insurance
  coverage for the past three years. She now purchases a new individual professional liability
  policy. According to Montana law, what must the new policy include regarding prior acts coverage?
options:
  - The policy is prohibited from offering prior acts coverage to the broker
  - The policy must offer prior acts coverage to the broker
  - The policy may optionally include prior acts coverage for the broker
  - The policy must exclude prior acts coverage for the broker
key: B
explanation: The key is correct because subsection (3)(b) requires policies to offer prior acts
  coverage to an insured who maintains continuous past insurance coverage. The most tempting
  distractor is C, which suggests the coverage is optional; however the rule mandates offering prior
  acts coverage when continuous past coverage exists.
