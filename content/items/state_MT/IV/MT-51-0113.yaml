stem: A Montana real estate salesperson's professional liability policy is canceled due to
  nonpayment of premium. She wishes to purchase an optional extended reporting period of not less
  than 365 days. What must she do to obtain this coverage?
options:
  - She must request and pay any additional premium within 60 days after cancellation
  - She must request and pay any additional premium within 30 days after cancellation
  - She automatically receives the extended reporting period without additional action
  - She is ineligible for any extended reporting period due to nonpayment of premium
key: A
explanation: The rule provides that an optional extended reporting period of not less than 365 days
  is available if the insured requests it and pays any additional premium within 60 days after
  expiration or cancellation of the policy. Therefore, the salesperson must request and pay any
  additional premium within 60 days after cancellation. The option stating that she must request and
  pay any additional premium within 30 days after cancellation is incorrect because the required
  timeframe is 60 days, not 30.
