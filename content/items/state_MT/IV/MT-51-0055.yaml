stem: If a licensee's professional liability policy is canceled due to nonpayment of premium, what
  automatic extended reporting period, if any, must the policy provide?
options:
  - A 60‑day extended reporting period
  - No automatic extended reporting period
  - An optional extended reporting period
  - A 365‑day extended reporting period
key: B
explanation: Mont. Code Ann. § 37-51-325(3)(c) provides an automatic 60‑day extended reporting
  period only if the policy is canceled or not renewed for any reason other than nonpayment of
  premium or a deductible. Since the cancellation is for nonpayment of premium, the condition is not
  met and no automatic period applies. The 365‑day period is optional and requires a request and
  payment.
