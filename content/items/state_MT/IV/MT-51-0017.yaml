stem: Under Montana's insurance definitions for real estate licensees, what does 'prior acts
  coverage' mean?
options:
  - Coverage that automatically renews the professional liability policy at the end of each term
  - Coverage limited to claims reported within thirty days of the alleged act
  - Coverage for claims arising from services rendered before the current policy period began
  - Coverage that pays the licensee's legal defense costs during a board investigation
key: C
explanation: Prior acts coverage means coverage for claims arising from acts, errors, or omissions
  in services rendered by the insured prior to the inception of the current policy period.
citation:
  source: Mont. Code Ann. § 37-51-325
  url: null
  quoted_text: '"Prior acts coverage" means coverage under a policy for claims made against the
    insured and reported to the insurer that arise from acts, errors, or omissions in services
    rendered by an insured prior to inception of the current policy period'
