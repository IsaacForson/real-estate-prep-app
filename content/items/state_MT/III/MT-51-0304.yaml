stem: What must the initial written relationship disclosure contain regarding adverse material facts
  under Montana law?
options:
  - A statement that no adverse material facts exist.
  - A definition of 'adverse material fact'.
  - A list of all known adverse material facts about the property.
  - A copy of the most recent property inspection report.
key: B
explanation: The initial written disclosure must include a definition of 'adverse material fact' as
  required by subsection (6)(c) of Montana’s relationship disclosure statute. A list of known facts
  or a statement that none exist goes beyond the required definition and is not mandated by the
  rule.
