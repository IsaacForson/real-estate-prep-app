stem: A Montana broker moves the office from the designated address on June 1. By what date must the
  broker notify the department of the new address to comply with the statute?
options:
  - June 1
  - June 10
  - June 11
  - July 1
key: C
explanation: The broker must notify the department within 10 days after removal, so June 1 plus 10
  days is June 11. Notifying on June 10 would be within the period but the latest allowable day is
  June 11; June 1 is the removal date itself, which is allowed only if notice is given before
  removal. Since the move already occurred, the notice must be given by June 11. The other dates
  fall outside the allowed window.
citation:
