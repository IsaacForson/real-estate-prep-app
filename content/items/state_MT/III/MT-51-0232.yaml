stem: A person seeking a Montana salesperson license has completed 55 classroom hours in an approved
  course. According to Montana law, what is the status of this applicant's education requirement?
options:
  - The applicant satisfies the minimum education requirement.
  - The applicant must complete an additional 20 hours to reach the maximum of 80 hours.
  - The applicant does not meet the education requirement because fewer than 60 hours were completed.
  - The applicant may substitute equivalent experience for the missing hours.
key: C
explanation: The statute requires salesperson applicants to complete between 60 and 80 classroom or
  equivalent hours. With only 55 hours, the applicant falls short of the minimum and does not
  satisfy the requirement.
