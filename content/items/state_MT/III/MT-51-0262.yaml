stem: A Montana real estate broker is unable to produce proof of professional liability insurance
  when requested by the board. Under Montana law, what action may the board take?
options:
  - Impose a $50 fine per violation
  - Issue a citation for trust account violation
  - Require the broker to retake the salesperson exam
  - Administratively suspend or discipline the broker
key: D
explanation: The statute provides that a licensee who fails to produce proof of coverage on request
  by the board or its designee is subject to administrative suspension or disciplinary action as
  determined by the board. Therefore, the board may suspend or discipline the broker. The distractor
  of issuing a citation for trust account violation applies to trust account noncompliance, not
  proof of insurance.
