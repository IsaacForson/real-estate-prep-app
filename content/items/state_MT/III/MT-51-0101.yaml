stem: A county clerk, as part of her official duties, lists and sells surplus county-owned land.
  Under Montana law, is she required to hold a real estate license?
options:
  - Yes, but only if she receives a fee or commission for the sale of the property.
  - No, because public officials on official duty are exempt from licensing.
  - No, but she must still complete continuing education hours each year.
  - Yes, because she is conducting a real estate transaction for compensation.
key: B
explanation: Mont. Code Ann. § 37-51-103(1)(f) exempts public officials acting in the conduct of
  their official duties from licensing requirements. The county clerk's actions are part of her
  official duties, so no license is needed. The option stating that a license is required only if
  she receives a fee or commission incorrectly assumes that any real estate transaction for
  compensation requires a license, ignoring the public official exemption.
