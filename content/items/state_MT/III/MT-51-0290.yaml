stem: An agent shows a property and tells a buyer that the foundation is sound, relying on
  information provided by the seller. The agent did not know the foundation was cracked. Under
  Montana law, is the agent liable for the misrepresentation?
options:
  - No, because the seller, not the agent, made the misrepresentation
  - Yes, because the agent is responsible for all statements made during the showing
  - No, unless the agent had actual knowledge of the misrepresentation
  - Yes, because the agent repeated information given by the principal
key: C
explanation: Under 37-51-315(3), an agent is not liable for a misrepresentation made by the
  principal unless the agent has actual knowledge of the misrepresentation. Since the agent lacked
  actual knowledge, there is no liability.
