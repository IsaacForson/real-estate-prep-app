stem: A Montana broker wants to pay a referral commission to a broker licensed only in Wyoming who
  performed no brokerage service in Montana for this transaction. Under the nonresident-transactions
  statute, is the payment permitted?
options:
  - No, because a Montana broker cannot pay compensation to any out-of-state broker
  - Yes, because the nonresident broker performed no compensable service in Montana
  - No, because the nonresident broker did not complete a reciprocity examination
  - Yes, because referral fees of this kind are exempt from Montana's licensing chapter
key: B
explanation: A licensed broker may pay a commission to a broker of another state if that nonresident
  broker has not conducted and does not conduct in Montana a service for which a fee is paid.
