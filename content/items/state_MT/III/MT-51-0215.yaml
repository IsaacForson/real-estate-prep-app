stem: Under Montana Administrative Rule 24.210.428(2)(c), when is licensee identification **NOT**
  required in internet advertising?
options:
  - In instant or audible messaging if the identification was provided via another format before
    offering licensable services.
  - In banner ads when a link to a web page with licensee identification is provided, and the
    identification must be visible.
  - In multimedia advertising messages such as web-based emails, where the licensee's name must
    appear prominently.
  - In any internet advertisement that includes a link to the licensee's name and brokerage,
    regardless of the advertising format used.
key: A
explanation: Under Mont. Admin. R. 24.210.428(2)(c), licensee identification is not required in
  instant or audible messaging when the identification has already been provided via another format
  before offering licensable services. The banner‑ads option is wrong because identification does
  not need to be visible in the banner itself if a link to a page with that information is supplied.
  The multimedia‑messages option is wrong because identification is required in web‑based emails and
  similar formats, not exempt. The final option is wrong because the exemption applies only to
  instant or audible messaging, not to all internet advertisements.
