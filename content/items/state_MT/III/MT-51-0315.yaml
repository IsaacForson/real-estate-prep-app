stem: A salesperson was licensed when they referred a buyer to a broker, but let their license
  expire before the broker paid the referral fee. The salesperson sues the broker for the unpaid
  referral fee. Under Montana law, what is the likely result?
options:
  - dismiss the action because the person was not licensed at the time the claim arose.
  - allow the person to recover because they were licensed when the referral was made.
  - allow the person to recover because the broker benefited from the referral.
  - allow the person to recover because the fee was agreed upon in writing.
key: A
explanation: The statute bars recovery unless the plaintiff was licensed at the time the claim
  arose. Because the salesperson’s license had expired before the claim for the referral fee arose,
  they cannot sue for compensation. The distractor that focuses on licensure at the time of the
  referral is incorrect because the rule ties the requirement to the moment the claim arose, not to
  when services were performed.
citation:
