stem: A broker receives a citation for three separate trust account violations. What is the total
  civil fine under Montana law?
options:
  - The total civil fine is $50.
  - The total civil fine is $100.
  - The total civil fine is $150.
  - The total civil fine is $200.
key: C
explanation: Under Mont. Code Ann. § 37-51-324(3), the civil fine is $50 for each cited violation.
  Multiplying $50 by three violations yields a total fine of $150. The $50 option applies to a
  single violation, $100 to two violations, and $200 to four violations, none of which match the
  scenario.
