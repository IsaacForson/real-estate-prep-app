stem: A buyer agent has just begun negotiations with a seller after the buyer broker agreement was
  signed earlier today. According to Montana law, when must the buyer agent make the subsequent
  written relationship disclosure to the seller or seller agent?
options:
  - At the time of buyer broker agreement execution
  - At the time of initial buyer contact
  - At the time of negotiation commencement
  - At the time of purchase offer submission
key: C
explanation: The subsequent disclosure for a buyer agent to the seller or seller agent must be made
  at the time negotiations commence, per § 37-51-314(3)(c). The distractor stating 'At the time of
  buyer broker agreement execution' is incorrect because that timing governs the buyer agent's
  initial disclosure, not the subsequent disclosure.
