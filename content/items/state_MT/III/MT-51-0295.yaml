stem: Under Montana law, the agency relationship of a buyer agent, seller agent, or dual agent
  continues until the earliest of which of the following?
options:
  - The agent's performance is completed, the agreement expires, or an authorized termination occurs.
  - The agent's performance is completed, the agreement expires, or the parties mutually agree to
    end the relationship.
  - The agent's performance is completed, the agreement expires, or the broker decides to withdraw.
  - The agent's performance is completed, the agreement expires, or the client files a complaint.
key: A
explanation: Montana Code Annotated § 37‑51‑313(11)(a) provides that the agency relationship
  continues until the earliest of (i) the agent’s completion of performance, (ii) the expiration
  date set in the agreement, or (iii) an authorized termination of the agreement. A termination that
  simply results from the parties’ mutual agreement is not listed among the authorized terminations
  unless the agreement itself permits such a termination.
citation:
  source: Mont. Code Ann. § 37-51-313(11)(a)
  url: null
  quoted_text: "(11) (a) The agency relationship of a buyer agent, seller agent, or dual agent
    continues until the earliest of the following dates: (i) completion of performance by the agent;
    (ii) the expiration date agreed to in the listing agreement or buyer broker agreement; or (iii)
    the occurrence of any authorized termination of the listing agreement or buyer broker
    agreement."
