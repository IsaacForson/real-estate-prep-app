stem: An applicant for a Montana broker's license resides in a remote area where no real estate
  firms are hiring salespersons and has only eight months of salesperson experience. Under Montana
  law, what may the board do regarding the 2‑year experience requirement?
options:
  - May accept the eight months as equivalent to two years.
  - May waive the experience requirement due to local employment conditions.
  - Must deny the application because the experience is insufficient.
  - Must require the applicant to complete an additional 60 classroom hours.
key: B
explanation: The statute allows the board to waive the two‑year experience requirement when the
  applicant cannot obtain employment as a salesperson due to local conditions. The other options
  either impose additional requirements or incorrectly treat eight months as sufficient.
citation:
