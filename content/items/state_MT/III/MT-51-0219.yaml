stem: A plaintiff files a lawsuit seeking a real estate commission but does not allege that they
  were licensed at the time the services were performed. Under Mont. Code Ann. § 37-51-401, what is
  the likely procedural outcome?
options:
  - The court will award damages based on the contract
  - The court will dismiss the action for failure to allege licensure
  - The court will require the plaintiff to obtain a license before proceeding
  - The court will reduce the commission by 50 percent
key: B
explanation: Because the statute prohibits bringing or maintaining an action for compensation
  without first alleging and proving licensure at the time the cause of action arose, a complaint
  that fails to allege licensure subject to dismissal. The court will not award damages, reduce the
  commission, or condition the suit on obtaining a license.
