stem: A seller informs their agent that the roof does not leak, believing it to be true. The agent
  later tells a prospective buyer that the roof does not leak, relying on the seller’s statement.
  The roof actually leaks, and the buyer sues the seller for misrepresentation. Under Montana law,
  is the seller liable for the misrepresentation?
options:
  - Yes, because the agent repeated a misrepresentation made by the seller.
  - No, because the agent acted independently without the seller’s knowledge.
  - No, because the seller had no actual knowledge of the misrepresentation.
  - Yes, because the seller had actual knowledge of the misrepresentation.
key: A
explanation: Under § 37-51-315(1), a party is liable for an agent’s misrepresentation if the agent
  is repeating a misrepresentation made by the party, regardless of the party’s actual knowledge.
  Here the agent repeated the seller’s statement, so the seller is liable. The ‘no actual knowledge’
  distractor is incorrect because liability can arise under the repetition rule even without the
  party’s knowledge.
