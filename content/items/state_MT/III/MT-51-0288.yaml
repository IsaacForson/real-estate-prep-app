stem: A broker has no actual knowledge of any sexual or violent offender registration information
  pertaining to a property they are listing. Under Montana law, what is the broker's disclosure
  responsibility regarding this information?
options:
  - The broker or salesperson must disclose all public records related to the property, including
    offender registration information, upon request.
  - The broker or salesperson must disclose the fact that the information may be maintained and by
    whom.
  - The broker or salesperson must disclose any known sexual or violent offender registration
    information that pertains to the property, regardless of source.
  - The broker or salesperson must disclose only if the buyer specifically requests information
    about sexual or violent offender registration.
key: B
explanation: Under Mont. Code Ann. § 37-51-105, a broker who has no actual knowledge of sexual or
  violent offender registration information need only disclose that such information may be
  maintained and by whom. Requiring disclosure of all public records or specific offender data,
  mandating disclosure of any known offender information regardless of source, or making disclosure
  contingent on a buyer’s request goes beyond the limited duty imposed by the statute.
