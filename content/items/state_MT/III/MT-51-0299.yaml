stem: A salesperson notifies the department in writing of a change of association to a new
  supervising broker who has accepted supervision. According to Montana law, when may the
  salesperson begin working for the new supervising broker?
options:
  - Immediately after notifying the department
  - After the department issues a new license to the salesperson
  - After the salesperson pays the required fee
  - After the successor broker notifies the department of acceptance
key: B
explanation: The law states that after the department receives written acceptance from the successor
  supervising broker, it issues a new license to the salesperson, and the salesperson may not work
  for the new broker until that license is issued. Simply notifying the department or receiving
  broker acceptance is insufficient; the license must be issued first.
citation:
  source: "### Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons) — Montana
    Code Annotated 2025, Title 37, Chapter 51 — Real Estate Brokers and Salespersons (all parts) — §
    37-51-309"
  url: null
  quoted_text: After the department receives written acceptance of the salesperson from the successor
    supervising broker, the department shall issue a new license to the salesperson and a new
    endorsement to the supervising broker. A salesperson may not directly or indirectly work for or
    with a supervising broker until the salesperson has been issued a license to work for or with
    that supervising broker.
