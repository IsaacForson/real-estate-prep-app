stem: A Montana licensee enters into a listing agreement with a seller and does not conduct a title
  search or obtain a title report at the initial listing. According to Montana administrative rule,
  is this considered unprofessional conduct?
options:
  - The licensee's conduct is considered unprofessional because failing to verify ownership is
    unprofessional.
  - The licensee's conduct is considered unprofessional because the licensee must verify ownership
    via a title search.
  - The licensee's conduct is not considered unprofessional because the rule does not require a
    title search at the initial listing.
  - The licensee's conduct is not considered unprofessional because the seller waived the
    verification requirement in writing.
key: C
explanation: The rule states that a licensee may, but is not required to, conduct a title search or
  obtain a title report at the initial listing (Mont. Admin. R. 24.210.641(1)(f)). Therefore,
  failing to do so is not unprofessional conduct. The claim that failing to verify ownership is
  always unprofessional is incorrect because the rule does not impose such a requirement. The
  assertion that the licensee must verify ownership via a title search contradicts the rule, which
  only permits but does not require such a search. The statement that the licensee's conduct is not
  unprofessional because the rule does not require a title search at the initial listing aligns with
  the rule. The suggestion that a seller can waive the verification requirement in writing is not
  supported by the rule.
