stem: A salesperson receives a $5,000 earnest money deposit from a buyer on Monday morning. When
  must the salesperson place this money with the supervising broker according to Montana law?
options:
  - The salesperson must place the money with the supervising broker by the end of the business day.
  - The salesperson must place the money with the supervising broker as soon as practicably possible
    after receipt.
  - The salesperson must place the money with the supervising broker within 24 hours of receipt.
  - The salesperson must place the money with the supervising broker only if the transaction is
    personal.
key: B
explanation: Mont. Code Ann. § 37-51-321(r) requires a salesperson to place deposit money in the
  custody of the supervising broker as soon after receipt as is practicably possible, unless the
  money is part of the salesperson's personal transaction. The rule does not set a specific time
  frame such as 24 hours or end of day, so those options are incorrect. The personal‑transaction
  exception does not apply to earnest money received from a buyer.
