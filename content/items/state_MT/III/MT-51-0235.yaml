stem: A seller agent learns that the roof of a listed property leaks during a showing. According to
  Montana law, what must the seller agent do regarding this adverse material fact?
options:
  - Disclose the leak to the buyer or buyer agent
  - Disclose the leak to the seller's representative
  - Disclose the leak to the seller's attorney
  - Disclose the leak to the buyer's lender
key: A
explanation: Mont. Code Ann. § 37-51-313(3)(a) requires a seller agent to disclose to the buyer or
  buyer agent any adverse material facts known to the agent. Disclosing only to the seller or to
  third parties does not satisfy this duty to the buyer.
