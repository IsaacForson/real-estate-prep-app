stem: A licensee hires a plumbing company to repair a leaky faucet in a rental property. Under
  Montana Administrative Rule 24.210.301, how is the plumbing company classified?
options:
  - The plumbing company is considered a maintenance service.
  - The plumbing company is considered a third‑party.
  - The plumbing company is considered a principal.
  - The plumbing company is considered an agent.
key: A
explanation: The rule defines maintenance service as any entity hired to perform repairs or
  maintenance on the property. The plumbing company hired to fix a faucet fits this definition.
  While the company is also a third‑party, the rule’s more specific classification is maintenance
  service.
