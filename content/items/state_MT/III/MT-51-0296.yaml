stem: A licensee begins showing properties to a prospective buyer before signing a written buyer
  broker agreement. Under Montana law, what is the licensee's obligation regarding the duties owed
  to the buyer?
options:
  - The licensee owes no duties to the buyer until a written buyer broker agreement is signed.
  - The licensee must only disclose adverse material facts and need not obey the buyer's
    instructions.
  - The licensee must comply with the duties owed to the buyer as set forth in this chapter.
  - The licensee must terminate the relationship with the buyer immediately.
key: C
explanation: Mont. Code Ann. § 37-51-313(10) requires a licensee acting without a written buyer
  broker agreement to comply with the duties set forth in this chapter. The statement that the
  licensee must only disclose adverse material facts and need not obey the buyer's instructions is
  incorrect because the licensee still owes the full range of duties to the buyer even before a
  written agreement is signed.
