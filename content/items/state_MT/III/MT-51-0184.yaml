stem: Under Montana's vicarious liability statute (37-51-315), a broker is liable for a
  misrepresentation made by the broker's subagent if which condition exists?
options:
  - The broker employs the subagent as an independent contractor
  - The broker has actual knowledge of the misrepresentation
  - The broker provides written disclosure to the client
  - The broker receives a commission from the transaction
key: B
explanation: The statute provides that a broker is not liable for a subagent's misrepresentation
  unless the broker has actual knowledge of the misrepresentation. Therefore, actual knowledge makes
  the broker liable. The distractor claiming liability based on employing an independent contractor
  is incorrect because the statute limits liability to employee subagents, not independent
  contractors, unless another condition applies.
