stem: Under Montana law, what must a statutory broker disclose to a buyer or buyer agent concerning
  the property?
options:
  - Disclosure of any adverse material facts concerning the property that are known to the statutory
    broker.
  - Disclosure of all material facts about the property, regardless of the broker's knowledge.
  - Disclosure of any facts that the seller has previously shared with the broker.
  - Disclosure of any facts that the buyer requests in writing regarding the property.
key: A
explanation: Montana law requires a statutory broker to disclose any adverse material facts
  concerning the property that are known to the broker. This duty is found in § 37-51-302(6)(a)(i).
  The option stating that the broker must disclose any adverse material facts concerning the
  property that are known to the statutory broker correctly reflects this requirement. The option
  requiring disclosure of all material facts regardless of the broker's knowledge goes beyond the
  statutory duty and is therefore incorrect.
citation:
