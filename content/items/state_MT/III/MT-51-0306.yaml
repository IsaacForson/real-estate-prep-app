stem: A licensee is acting solely as a property manager for an owner and does not engage in any
  brokerage activities. According to Montana law, what disclosure satisfies the relationship
  disclosure requirement?
options:
  - A disclosure that complies with subsection (8) regarding the contractual relationship.
  - A copy of the property management contract provided to the owner.
  - A verbal disclosure of the property’s rental history to the tenant.
  - A written disclosure containing the duties owed under subsection (6).
key: A
explanation: Subsection (9) states that when acting only as a property manager, a disclosure that
  complies with subsection (8) is sufficient to satisfy the relationship disclosure requirement. A
  disclosure of duties or a verbal statement does not meet this specific provision.
citation:
  source: Mont. Code Ann. § 37-51-314(9)
  url: null
  quoted_text: When a broker or salesperson is acting only as a property manager, another relationship
    disclosure is not required and a disclosure that complies with subsection (8) must be construed
    as a sufficient disclosure of the contractual relationship.
