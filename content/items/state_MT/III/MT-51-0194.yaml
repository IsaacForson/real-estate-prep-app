stem: A Montana real estate broker allows their professional liability insurance policy to lapse for
  two months while still holding an active license. Under Montana law, this conduct is best
  described as which violation?
options:
  - Unprofessional conduct for failing to maintain required professional liability insurance
  - Unprofessional conduct for failing to disclose a dual agency relationship to the client
  - Unprofessional conduct for accepting an undisclosed commission or rebate in a transaction
  - Unprofessional conduct for making false promises of a character likely to influence a client
key: A
explanation: The statute defines failure to maintain continuous professional liability insurance as
  unprofessional conduct. The distractor about failing to disclose a dual agency relationship
  describes a different violation that does not apply to the lapse of insurance coverage.
