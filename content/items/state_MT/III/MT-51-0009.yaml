stem: A seller agent wants to list a second property that will compete directly with an existing
  seller-client's listing. Under Montana's broker-duties statute, when may the agent do this without
  breaching the duty to act solely in the seller's best interests?
options:
  - After giving the seller written disclosure and obtaining written consent
  - After the competing listing has been active on the market for ten days
  - After transferring the original listing to a different agent in the firm
  - After verbally informing the seller and waiting a reasonable time for objection
key: A
explanation: The statute allows a seller agent to list a competing property only after written
  disclosure to the seller and with the seller's written consent, without breaching the duty of
  loyalty.
