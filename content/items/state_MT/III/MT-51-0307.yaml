stem: According to Montana law, when must a seller agent make the initial written relationship
  disclosure to the seller?
options:
  - At the time of earnest money deposit
  - At the time of buyer agency agreement execution
  - At the time of listing agreement execution
  - At the time of property showing arrangement
key: C
explanation: The initial disclosure for a seller agent must be made to the seller at the time the
  listing agreement is executed, as stated in § 37-51-314(2)(a). The distractor stating 'At the time
  of negotiation commencement' is incorrect because that timing applies to the subsequent
  disclosure, not the initial disclosure.
