stem: A licensee who manages a foreclosed property to preserve its value before a bank sells it is
  performing which activity defined under Montana law?
options:
  - Asset management
  - Property appraisal
  - Title examination
  - Escrow administration
key: A
explanation: Under Mont. Code Ann. § 37-51-102(2), asset management means management, oversight, or
  direct actions taken to maintain or transfer real property before a foreclosure sale or in
  preparation for liquidation. This matches the described activity of preserving a foreclosed
  property's value. Property appraisal is unrelated to foreclosure preservation and is not defined
  in this section.
