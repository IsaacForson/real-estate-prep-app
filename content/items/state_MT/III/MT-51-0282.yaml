stem: A salesperson currently holds an active license with a supervising broker. How many additional
  active licenses may the salesperson hold concurrently under Montana law?
options:
  - Zero additional licenses
  - One additional license
  - Two additional licenses
  - Three additional licenses
key: A
explanation: Mont. Code Ann. § 37-51-309(5) states that only one license issued to a salesperson is
  in effect at one time. Therefore, the salesperson cannot hold any additional active licenses. The
  distractor of one additional license incorrectly assumes the salesperson can hold two licenses
  total.
