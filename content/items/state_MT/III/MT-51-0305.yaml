stem: A Montana broker is hired to manage a rental property for an owner. According to Montana law,
  what must the broker disclose to prospective tenants who inquire about the property?
options:
  - The broker’s license number between the broker and the owner.
  - The contractual relationship between the broker and the owner.
  - The owner’s contact information between the broker and the owner.
  - The property’s zoning classification between the broker and the owner.
key: B
explanation: Subsection (8) requires a broker managing properties for owners to disclose the
  contractual relationship with the owner to all customers and clients. Disclosing the broker’s
  license number or the owner’scontact information is not specified by this rule.
citation:
  source: Mont. Code Ann. § 37-51-314(8)
  url: null
  quoted_text: A broker or salesperson, while managing properties for owners, shall disclose to all
    customers and clients the contractual relationship of the broker or salesperson.
