stem: A person who has completed seventy classroom hours, passed the salesperson examination, is
  nineteen years old, and holds a high school diploma wishes to apply for a Montana salesperson
  license. What must accompany the application?
options:
  - The applicant must submit a recommendation from a licensed broker with supervising broker
    endorsement
  - The applicant must submit proof of completion of sixty classroom hours in real estate finance
  - The applicant must submit a certificate of errors and omissions insurance coverage
  - The applicant must submit a sworn statement of personal net worth exceeding twenty‑five thousand
    dollars
key: A
explanation: The statute requires that a salesperson license application be accompanied by a
  recommendation from a licensed broker who holds a supervising broker endorsement. The distractor
  about proof of sixty classroom hours confuses the salesperson requirement with the additional
  hours needed for a broker license.
