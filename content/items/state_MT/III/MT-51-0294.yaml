stem: A broker assisted a seller in listing a property and earned a commission. The broker's license
  was active at the time of the listing agreement but was suspended two months after closing. The
  broker sues the seller six months after closing for the unpaid commission. Under Montana law, what
  is the likely result?
options:
  - The court will dismiss the action because the person's license was suspended at the time the
    claim arose
  - The court will allow the person to recover because they were a duly licensed real estate broker
    at the time the claim arose
  - The court will allow the person to recover because they were a resident of Montana at the time
    the claim arose
  - The court will dismiss the action because the person did not have a written contract at the time
    the claim arose
key: B
explanation: Mont. Code Ann. § 37-51-401 permits recovery if the person was duly licensed at the
  time the claim arose. The broker's license was active during the listing agreement, so they may
  sue for the commission despite later suspension. The distractors incorrectly focus on post‑closing
  suspension, lack of a written contract, or residency, which are irrelevant to the statutory
  requirement.
