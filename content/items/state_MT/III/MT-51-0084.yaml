stem: A Montana licensee posts an internet advertisement for a residential property that is listed
  by another brokerage. The listing agreement includes the owner's consent for internet advertising,
  but the advertisement does not mention that the property is listed with another licensee. Under
  Montana Administrative Rule 24.210.428, this conduct is best described as which violation?
options:
  - It violates the requirement to state that the property is listed by another licensee and name
    that licensee.
  - It violates the requirement to secure the owner's written consent before advertising.
  - It violates the requirement to provide a truthful, accurate, and detailed property description.
  - It violates the requirement to display the licensee's name in the advertisement.
key: A
explanation: Rule 24.210.428(3)(c) mandates that internet advertising disclose when a property is
  listed by another licensee and identify that licensee. Failing to do so violates that requirement.
  The other options refer to different obligations (description, licensee name, owner consent) that
  are satisfied in the scenario.
