stem: A Montana real estate salesperson was licensed and helped a client purchase a home, earning a
  commission. Six months after closing, the salesperson's license lapsed due to non-renewal. The
  salesperson then sues the client for the unpaid commission. Under Montana law, what is the likely
  result?
options:
  - The salesperson may not recover because the license was not current at the time of suit
  - The salesperson may recover if they renew the license before the court hearing
  - The salesperson may recover because they were licensed at the time the claim arose
  - The salesperson may recover only if the client agrees to pay after the lawsuit
key: C
explanation: Under Mont. Code Ann. § 37-51-401, the right to sue depends on licensure at the time
  the claim arose, not at the time of suit. Since the salesperson was licensed when the claim arose,
  they may recover. The option stating that the salesperson may not recover because the license was
  not current at the time of suit is incorrect because a lapsed license after the claim does not bar
  recovery.
