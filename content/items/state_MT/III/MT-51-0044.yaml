stem: Which of the following must be included in the initial written disclosure required under
  Montana law for a seller agent or buyer agent?
options:
  - A description of the duties owed by the broker and salesperson per 37-51-313
  - A copy of the executed listing agreement signed by both parties in the transaction
  - A list of all properties the licensee has sold in the previous twelve months
  - A statement of the licensee's commission rates and fees applicable to the transaction
key: A
explanation: The initial disclosure must include a description of the duties owed by the broker and
  salesperson as set forth in 37-51-313, as specified in subsection (6). The statement about
  commission rates is not required by this subsection.
