stem: A Montana salesperson decides to leave one supervising broker to associate with another. What
  must the salesperson do under the change-of-association statute?
options:
  - File a new license examination application with the testing vendor
  - Wait thirty days before beginning to work with the new supervising broker
  - Obtain written consent from the former supervising broker's clients
  - Notify the department promptly in writing and pay the required fee
key: D
explanation: A salesperson changing association must notify the department promptly in writing and
  pay the required fee before the change takes effect.
