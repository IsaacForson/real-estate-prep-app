stem: A supervising broker’s endorsement has terminated because the broker failed to complete the
  required continuing education. What must the broker do to regain the supervising broker
  endorsement?
options:
  - Submit a reinstatement request and pay the delinquency penalty
  - Complete the pre-endorsement course and submit proof of completion
  - Meet the current requirements to obtain the endorsement again
  - Apply for a temporary waiver from the board due to hardship
key: C
explanation: The rule provides that a terminated supervising broker endorsement cannot be
  reinstated; the broker must meet the current requirements to obtain the endorsement again. The
  other options describe actions that are not sufficient for reinstatement after termination.
