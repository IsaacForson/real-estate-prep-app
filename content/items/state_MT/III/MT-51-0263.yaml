stem: A Montana real estate broker's claims-made professional liability policy is canceled effective
  June 1 for reasons other than nonpayment of premium. On July 20, a claim is made against the
  broker for an error that occurred during the policy period. Under Montana law, is the claim
  covered?
options:
  - Yes, because the claim is made within the automatic 60-day extended reporting period.
  - Yes, only if the broker purchased an optional extended reporting period.
  - No, because the error occurred before cancellation but the claim must be made during the policy
    period.
  - No, because the policy was canceled and no coverage extends after cancellation.
key: A
explanation: The statute requires policies to provide an automatic 60-day extended reporting period
  to report a claim if the policy is canceled or not renewed for any reason other than nonpayment of
  premium or a deductible. Since the claim was made on July 20, within 60 days of the June 1
  cancellation, it is covered. The distractor that claims-made policies provide no coverage after
  cancellation ignores the statutory extended reporting period.
