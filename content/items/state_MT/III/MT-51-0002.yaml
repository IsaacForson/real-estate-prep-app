  - Accepting an undisclosed commission, rebate, or profit on expenditures made for a principal
  - Pursuing a continued and flagrant course of misrepresentation through an agent
  - Guaranteeing or authorizing a client a specific future resale profit on a property
key: B
explanation: Accepting, giving, or charging an undisclosed commission, rebate, or profit on
  expenditures made for a principal is listed as unprofessional conduct in the statute.
