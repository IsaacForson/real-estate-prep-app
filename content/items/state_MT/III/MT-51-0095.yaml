stem: An unlicensed individual assists a landlord in locating a tenant for a rental unit, negotiates
  the lease terms, and expects a leasing fee. After the lease is executed, the individual sues the
  landlord for the fee. Under Montana law, what is the likely result?
options:
  - The individual may recover because the landlord benefited from the services
  - The individual may recover if they obtain a license before filing suit
  - The individual may recover only if the lease agreement includes a fee clause
  - The individual may not recover because they were not licensed at the time the claim arose
key: D
explanation: Under Mont. Code Ann. § 37-51-401, a person must allege and prove they were a duly
  licensed broker or salesperson at the time the claim arose to recover compensation. Because the
  individual was unlicensed at that time, they may not recover. The suggestion that the individual
  may recover if they obtain a license before filing suit is incorrect because licensing must be
  held at the time the claim arose, not after.
