stem: A salesperson sells their own house to a buyer and fails to provide the required written
  disclosure about the for-sale-by-owner personal transaction. Under Montana law, is the supervising
  broker liable for this failure?
options:
  - Yes, but only if the salesperson is also acting as a buyer agent actually.
  - No, unless the salesperson received a commission from the transaction really.
  - Yes, the supervising broker is liable because they must supervise all salesperson activities
    indeed.
  - No, the supervising broker is not responsible or liable for the salesperson's failure to provide
    the disclosure.
key: D
explanation: The statute explicitly states that a supervising broker or real estate firm is not
  responsible or liable for the failure of a salesperson to provide the disclosure required for
  for-sale-by-owner personal transactions. The other options incorrectly impose liability or add
  conditions not present in the law.
