stem: Which item must be included in a citation issued by the department for a trust account
  maintenance violation under Montana law?
options:
  - The name of the buyer's lender
  - The amount of the broker's annual commission
  - The time and date on which the citation is issued
  - The broker's social security number
key: C
explanation: Under Mont. Code Ann. § 37-51-324(2)(a), a citation must include the time and date on
  which it is issued. The broker's social security number, commission amount, and buyer's lender
  name are not required elements of the citation.
