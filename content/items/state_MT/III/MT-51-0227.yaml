stem: Within how many days after removing from the designated office address must a Montana broker
  notify the department of the new address?
options:
  - 15 days
  - 30 days
  - 5 days
  - 10 days
key: D
explanation: The statute requires a broker to notify the department before removal or within 10 days
  after removal from the designated address. This timeline ensures the department can update records
  for the broker's office location. The other options do not match the statutory period.
