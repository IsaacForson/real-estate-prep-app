stem: What is the extent of a broker's or salesperson's responsibility regarding sexual or violent
  offender registration information under Montana law?
options:
  - The broker or salesperson must disclose the fact that the information may be maintained and by
    whom, and any actual knowledge they have of such information pertaining to the property.
  - The broker or salesperson must disclose any known sexual or violent offender registration
    information that pertains to the property, regardless of source.
  - The broker or salesperson must disclose only if the buyer specifically requests information
    about sexual or violent offender registration.
  - The broker or salesperson must disclose all public records related to the property, including
    offender registration information, upon request.
key: A
explanation: Under Mont. Code Ann. § 37-51-105, a broker or salesperson's responsibility is limited
  to disclosing (1) the fact that the information may be maintained and by whom, and (2) any actual
  knowledge they have of such information pertaining to the property. The correct answer states both
  required disclosures. The statement that the broker must disclose any known sexual or violent
  offender registration information regardless of source omits the requirement to disclose that the
  information may be maintained and by whom. The statement that the broker must disclose only if the
  buyer specifically requests information incorrectly limits disclosure to a buyer request. The
  statement that the broker must disclose all public records related to the property, including
  offender registration information, upon request incorrectly requires disclosure of all public
  records.
