stem: Under Montana Code Ann. § 37-51-401, what must a person allege and prove to bring an action
  for compensation for real estate services?
options:
  - That they were a duly licensed real estate broker or salesperson at the time of closing.
  - That they were a duly licensed real estate broker or salesperson at the time they first
    advertised the property.
  - That they were a duly licensed real estate broker or salesperson at the time the claim arose.
  - That they were a duly licensed real estate broker or salesperson at the time the contract was
    signed.
key: C
explanation: The statute requires the plaintiff to allege and prove licensure at the time the claim
  arose. Therefore the correct allegation concerns licensure when the claim arose. The distractor
  that focuses on the time the contract was signed is incorrect because the rule does not require
  proving licensure at that earlier moment.
