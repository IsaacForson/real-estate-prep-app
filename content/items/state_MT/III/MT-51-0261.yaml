stem: Under Montana law, how long does a person who receives a citation for a trust account
  violation have to pay the fine or file a written dispute of the violation?
options:
  - 15 calendar days
  - 5 business days
  - 3 business days
  - 10 calendar days
key: B
explanation: The statute states that the person who is issued a citation may pay the fine or file a
  written dispute with the board within 5 business days of the date of issuance. Therefore, the
  correct period is 5 business days. The distractor of 3 business days is incorrect because the law
  specifies 5 days, not 3.
