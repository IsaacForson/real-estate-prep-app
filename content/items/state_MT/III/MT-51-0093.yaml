stem: Under Montana law, what must a person allege and prove to maintain a court action for
  compensation for real estate services?
options:
  - That they were employed by a licensed broker at the time of the transaction
  - That they were a duly licensed broker or salesperson at the time the claim arose
  - That they have completed the required continuing education hours
  - That they have a written agreement with the client
key: B
explanation: Under Mont. Code Ann. § 37-51-401, a person must allege and prove they were a duly
  licensed real estate broker or salesperson at the time the claim arose to sue for compensation.
  The option stating that the person was employed by a licensed broker is incorrect because
  employment by a licensed broker does not satisfy the specific licensing requirement for
  maintaining an action for compensation.
