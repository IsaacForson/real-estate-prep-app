stem: Under Montana law, when must a licensed broker notify the department of a change of the
  broker's designated physical address?
options:
  - Notify the department before removal or within 10 days after removal.
  - Notify the department within 5 business days after removal.
  - Notify the department within 30 days after removal.
  - Notify the department only after the department requests the information.
key: A
explanation: The statute requires the broker to notify the department before removal or within 10
  days after removal when changing the designated physical address. This timeline ensures the
  department can issue a license for the new location. Failure to meet this deadline means the
  broker cannot obtain a license for the new address until proper notice is given.
citation:
  source: Mont. Code Ann. § 37-51-308(3)
  url: null
  quoted_text: In case of removal from the designated address, the broker shall notify the department
    before removal or within 10 days after removal, designating the new physical address and paying
    the required fee.
