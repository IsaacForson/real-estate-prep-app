stem: Under Montana Administrative Rule 24.210.641(gg), what must a licensee do regarding continuing
  education?
options:
  - The licensee must comply with the board's continuing education completion and reporting
    requirements
  - The licensee must complete only the core real estate courses each year
  - The licensee must submit proof of education only upon license renewal annually
  - The licensee must attend at least eight hours of education annually
key: A
explanation: The rule states that failing to comply with all completion and reporting requirements
  for continuing education is unprofessional conduct, so licensees must meet those requirements. The
  distractor about attending eight hours annually focuses only on a minimum hour count, which does
  not satisfy the full completion and reporting obligation.
