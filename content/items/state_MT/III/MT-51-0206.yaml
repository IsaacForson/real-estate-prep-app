stem: Within how many calendar days must a supervising broker notify all principals in a
  salesperson's listings or transactions that the supervision has terminated, according to Montana
  Administrative Rule 24.210.607?
options:
  - Three calendar days
  - Ten calendar days
  - Five calendar days
  - Seven calendar days
key: C
explanation: The rule requires the supervising broker to notify principals within five calendar days
  of the termination. The three‑day option confuses this with the temporary‑transfer notice
  deadline, while the seven‑ and ten‑day options exceed the required period.
