stem: An agent shows a property and tells a buyer that the property has no easements, relying on
  information provided by the seller. The agent did not know about an existing easement. Under
  Montana law, is the agent liable for the misrepresentation?
options:
  - Under Montana law, the agent is not liable because the seller is liable for the
    misrepresentation.
  - Under Montana law, the agent is liable because the agent should have verified the information.
  - Under Montana law, the agent is not liable because the agent lacked actual knowledge of the
    misrepresentation.
  - Under Montana law, the agent is liable because the agent repeated the seller’s statement.
key: C
explanation: Under § 37-51-315(3), an agent is not liable for a principal’s misrepresentation unless
  the agent had actual knowledge of it. Since the agent lacked such knowledge, there is no
  liability. The claim that the seller’s liability absolves the agent is incorrect because merely
  repeating the seller’s statement does not create liability without actual knowledge.
