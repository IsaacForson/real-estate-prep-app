stem: An applicant passes one subject portion of the Montana salesperson examination on March 15. By
  what date must the applicant pass the remaining portion to avoid having to retake the passed
  portion?
options:
  - April 15 of the following year
  - March 15 of the following year
  - March 14 of the following year
  - March 16 of the following year
key: B
explanation: The statute allows an applicant who has passed one subject portion to skip retaking
  that portion if the remaining portion is passed within 12 months. Twelve months after March 15 is
  March 15 of the following year, which is the final day to satisfy the requirement. Passing on
  March 14 would be early but still within the period; however the latest permissible date is March
  15. The other options fall outside the 12‑month window.
citation:
  source: Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons) — Montana Code
    Annotated 2025, Title 37, Chapter 51 — Real Estate Brokers and Salespersons (all parts) — §
    37-51-303
  url: null
  quoted_text: If the applicant passes one subject portion of the examination, the applicant is not
    required to repeat that portion of the examination if the applicant passes the remaining portion
    within 12 months.
