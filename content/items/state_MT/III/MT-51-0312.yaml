stem: A statutory broker has just begun negotiations with a seller after first endeavoring to locate
  property for the buyer earlier this week. According to Montana law, when must the statutory broker
  make the subsequent written relationship disclosure to the seller or seller agent?
options:
  - At the time of initial property search
  - At the time of buyer broker agreement execution
  - At the time of purchase offer submission
  - At the time of negotiation commencement
key: D
explanation: The statutory broker's subsequent disclosure to the seller or seller agent must be made
  at the time negotiations commence, as required by § 37-51-314(4)(b). The distractor stating 'At
  the time of buyer broker agreement execution' is incorrect because that timing pertains to the
  buyer agent's initial disclosure, not the statutory broker's subsequent disclosure.
