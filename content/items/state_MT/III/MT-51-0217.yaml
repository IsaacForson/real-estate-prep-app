stem: A broker pays a referral fee to an unlicensed acquaintance who helped locate a buyer for a
  listed property. No exemption applies. Under Montana Code Ann. § 37-51-321(p), is this conduct
  permissible?
options:
  - No, because paying a commission to an unlicensed person is prohibited unless exempted.
  - Yes, because the broker disclosed the payment to the buyer.
  - Yes, because the unlicensed person did not perform any licensed brokerage activities.
  - No, unless the broker obtains a written referral agreement from the acquaintance.
key: A
explanation: Montana Code Ann. § 37-51-321(p) prohibits paying a commission to an unlicensed person
  unless an exemption applies; therefore, paying a referral fee to an unlicensed acquaintance is not
  permissible. Disclosure of the payment does not make it permissible.
