stem: A subagent who is an independent contractor, not an employee, makes a misrepresentation to a
  buyer that the broker did not know about and did not originate. Under Montana's
  vicarious-liability statute, is the broker liable for that misrepresentation?
options:
  - Yes, because independent-contractor status is irrelevant to broker liability
  - No, because none of the statute's conditions for broker liability are met
  - Yes, because the broker is presumed to have authorized the misrepresentation
  - No, because subagents are not covered by the broker-duties statute
key: B
explanation: A broker is not liable for a subagent's misrepresentation unless the broker had actual
  knowledge, the subagent was an employee rather than an independent contractor, or the subagent was
  repeating the broker's own misrepresentation.
citation:
  source: Mont. Code Ann. § 37-51-315
  url: null
  quoted_text: "A broker is not liable for a misrepresentation made by the broker's subagent unless:
    (a) the broker has actual knowledge of the misrepresentation; (b) the subagent making the
    misrepresentation is an employee of the broker and not an independent contractor"
