stem: A salesperson wishes to change association to a new supervising broker but does not have
  another broker who has accepted supervision. After notifying the department, the salesperson's
  license is placed on inactive status. What fee may the department charge for this change in
  status?
options:
  - "10.00"
  - "5.00"
  - "0.00"
  - "15.00"
key: C
explanation: When a salesperson changes association without another supervising broker accepting
  supervision, the statute states the department may not charge a fee for the change in status, so
  the fee is $0.00. The distractor "5.00" is wrong because it presumes a fee is required, contrary
  to the statutory prohibition on any fee for this change.
