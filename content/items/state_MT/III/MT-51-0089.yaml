stem: An applicant for a Montana broker's license lives in an area where no real estate firms are
  hiring salespersons and has only eight months of salesperson experience. What may the board do
  regarding the experience requirement?
options:
  - The board may deny the application because the experience is insufficient
  - The board may require the applicant to complete an additional sixty classroom hours
  - The board may waive the two‑year experience requirement due to local employment conditions
  - The board may require the applicant to obtain a supervising broker endorsement first
key: C
explanation: The law allows the board to waive the two‑year experience requirement if the applicant
  cannot obtain employment as a salesperson because of local area conditions. The distractor
  claiming the board must require additional classroom hours misstates the waiver provision.
