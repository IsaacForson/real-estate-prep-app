stem: A buyer agent wishes to also represent the seller in the same transaction, becoming a dual
  agent. What must the buyer agent do before or at the time the dual agency arises under Montana
  law?
options:
  - Disclosing the potential or actual dual agency relationship to the buyer and seller and
    obtaining their written consent
  - Disclosing the potential dual agency relationship only to the buyer and obtaining their written
    consent
  - Disclosing the potential dual agency relationship only to the seller and obtaining their written
    consent
  - Disclosing no information because the buyer agent already disclosed the relationship earlier in
    the transaction
key: A
explanation: Subsection (5) requires the agent to disclose the potential or actual dual agency
  relationship to both the buyer and seller and receive their consent prior to or at the time the
  dual agency arises. Disclosing to only one party or making no disclosure does not satisfy this
  requirement.
citation:
  source: Mont. Code Ann. § 37-51-314(5)
  url: null
  quoted_text: A buyer agent or seller agent who contemplates becoming or subsequently becomes a dual
    agent shall disclose the potential or actual relationship to the buyer and seller and receive
    their consent prior to the time or at the time that the dual agency arises.
