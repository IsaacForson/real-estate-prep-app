stem: Under Montana law, when must a statutory broker make the initial written disclosure to a buyer?
options:
  - The initial disclosure must be made at the time of closing the real estate transaction.
  - The initial disclosure must be made at the time negotiations commence with the seller during the
    real estate transaction.
  - The initial disclosure must be made at the time the statutory broker first endeavors to locate
    property for the buyer.
  - The initial disclosure must be made at the time the purchase offer is presented to the parties
    involved.
key: C
explanation: The initial disclosure must be made at the time the statutory broker first endeavors to
  locate property for the buyer, as stated in subsection (4)(a). This timing triggers the duty to
  provide the written disclosure before any property search begins. The most tempting distractor,
  that the disclosure is due when negotiations commence, actually applies to the subsequent
  disclosure owed to the seller or seller agent under subsection (4)(b).
