stem: An individual who never obtained a real estate license assists a friend in selling a house and
  expects a referral fee. After the sale, they sue the friend for the fee. Under Montana law, what
  is the likely result?
options:
  - allow the person to recover because they performed valuable services.
  - dismiss the action because the person was not licensed at the time the claim arose.
  - allow the person to recover because the friend agreed to pay the fee.
  - allow the person to recover because the sale closed successfully.
key: B
explanation: To recover compensation, the plaintiff must allege and prove they were a licensed
  broker or salesperson at the time the claim arose. Since the individual was never licensed, they
  cannot meet this requirement and the court will dismiss the action. The distractor that relies on
  the value of services performed is wrong because licensure is a prerequisite regardless of the
  services rendered.
citation:
  source: Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons) — Montana Code
