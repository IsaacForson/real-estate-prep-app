stem: A licensee completes an online continuing education course, and the board uses the electronic
  education information to verify compliance with continuing education requirements. Under Montana
  law, is this review considered an audit for purposes of compliance with 37-1-306?
options:
  - The board's use of the electronic education information is considered an audit under 37-1-306.
  - The board's use of the electronic education information is not considered an audit under
    37-1-306.
  - The board's use of the electronic education information requires a separate audit under 37-1-306.
  - The board's use of the electronic education information is only an audit if the course is
    in-person.
key: B
explanation: The statute states that the use of electronically obtained education information may
  not be considered an audit for purposes of compliance with 37-1-306. Therefore, the board's review
  of such information is not an audit. The distractor claiming it is considered an audit directly
  contradicts this exemption.
