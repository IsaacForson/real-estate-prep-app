stem: What is the definition of 'Advertising' in Montana Administrative Rule 24.210.301?
options:
  - Information, in whatever form, used to promote real property for sale or lease only, and
    includes the dissemination of property data to an individual prospective buyer or seller at the
    individual's request
  - Information, in whatever form, used to promote real property for sale, lease, rent, exchange, or
    purchase, or to promote the brokerage or sales services of a licensee, but does not include the
    dissemination of property data to an individual prospective buyer or seller at the individual's
    request
  - Information, in whatever form, used to promote real property for sale, lease, rent, exchange, or
    purchase, or to promote the brokerage or sales services of a licensee, and includes the
    dissemination of property data to an individual prospective buyer or seller at the individual's
    request
  - Information, in whatever form, used to promote the brokerage or sales services of a licensee,
    but does not include any promotion of real property for sale, lease, rent, exchange, or purchase
key: B
explanation: The rule defines advertising as information, in whatever form, used to promote real
  property for sale, lease, rent, exchange, or purchase, or to promote the brokerage or sales
  services of a licensee, but does not include the dissemination of property data to an individual
  prospective buyer or seller at the individual's request. The option that limits advertising to
  sale or lease only and includes dissemination of property data to an individual at that
  individual's request is incorrect. The option that matches the rule's definition—information used
  to promote real property for sale, lease, rent, exchange, or purchase, or to promote brokerage
  services, while excluding dissemination of property data to an individual at that individual's
  request—is correct.
