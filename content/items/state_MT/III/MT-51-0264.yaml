stem: Under Montana law, what must a nonresident licensee file with the department to consent to
  legal process arising from a real estate transaction?
options:
  - The certificate of authority to conduct real estate business in Montana issued by the real
    estate commission, including all required endorsements and renewals
  - The written agreement to pay any fines imposed by the board for violations of licensing statutes
  - The irrevocable written consent allowing legal actions against the nonresident licensee in an
    appropriate Montana county and authorizing service on the department
  - The sworn affidavit stating the nonresident licensee maintains a physical office in Montana
key: C
explanation: The statute requires a nonresident licensee to file an irrevocable written consent that
  legal actions arising out of a commenced or completed transaction may be commenced against the
  licensee in an appropriate Montana county and that service of summons may be served on the
  department. This consent establishes jurisdiction over the nonresident licensee. The other options
  describe unrelated documents or agreements not mandated by this provision.
citation:
  source: Mont. Code Ann. § 37-51-306(2)
  url: null
  quoted_text: A nonresident licensee shall file an irrevocable written consent that legal actions
    arising out of a commenced or completed transaction may be commenced against the nonresident
    licensee in a county of this state that may be appropriate and designated by Title 25, chapter
    2, part 1.
