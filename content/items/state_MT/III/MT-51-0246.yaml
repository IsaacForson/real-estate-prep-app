stem: Under Montana Administrative Rule 24.210.641(f), what must a licensee do when entering into a
  listing agreement regarding verification of ownership?
options:
  - Promptly verify that the principal listing the property is the owner or authorized by the owner.
  - Obtain a title report before signing the listing agreement unless the buyer requests otherwise.
  - Wait until after the listing agreement is signed to verify ownership unless the seller waives
    the requirement.
  - Rely on the seller's verbal assurance of ownership unless the buyer provides contradictory
    evidence.
key: A
explanation: The rule defines failing to promptly verify ownership as unprofessional conduct, so the
  licensee must promptly verify that the principal listing the property is the owner or authorized.
  The distractor about obtaining a title report is not required; verification may be accomplished by
  other means.
