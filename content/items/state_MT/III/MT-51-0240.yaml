stem: Under Montana Code Ann. § 37-51-301(4)(a), which of the following activities is considered to
  be occurring 'within this state' for licensing purposes?
options:
  - Marketing a Wyoming property to an Oregon resident.
  - Marketing a Utah property to a Nevada resident.
  - Marketing a Montana property to an Oregon resident.
  - Marketing a Wyoming property to an Idaho resident.
key: C
explanation: Under Mont. Code Ann. § 37-51-301(4)(a), 'within this state' means marketing or dealing
  with any interest in real estate situated in Montana. Therefore, marketing a Montana property to
  an Oregon resident meets this definition because the property is located in Montana, regardless of
  where the prospective buyer resides. Marketing a Wyoming property to an Oregon resident does not
  involve Montana real estate, so it does not meet the definition. Marketing a Utah property to a
  Nevada resident likewise lacks a Montana‑situated property. Marketing a Wyoming property to an
  Idaho resident also lacks a Montana‑situated property.
