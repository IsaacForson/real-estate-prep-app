stem: A licensee posts an internet advertisement for a property listed by another brokerage. The
  listing agreement includes the owner’s consent for internet advertising, but the advertisement
  does not mention that the property is listed with another licensee. Under Montana Administrative
  Rule 24.210.428(3)(c), what must the licensee’s internet advertising advise?
options:
  - The advertisement must advise that the property is available for immediate occupancy.
  - The advertisement must advise that the property data may be altered as long as a disclaimer is
    included.
  - The advertisement must advise that the licensee has exclusive rights to sell the property.
  - The advertisement must advise that the property is listed with another licensee and identify the
    listing agent or brokerage company.
key: D
explanation: The rule requires that internet advertising for a property listed by another licensee
  must advise that the property is listed with another licensee and identify that licensee or
  brokerage. The distractor about immediate occupancy is unrelated to this requirement.
