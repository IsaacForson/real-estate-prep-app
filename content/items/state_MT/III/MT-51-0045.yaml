stem: A seller agent has just signed a listing agreement with a seller. When must the seller agent
  make the initial written disclosure to the seller under Montana law?
options:
  - At the time the buyer's loan application is submitted to the lender
  - At the time the purchase agreement is signed between the seller and the buyer
  - At the time the listing agreement is executed between the seller and the licensee
  - At the time the property is first shown to prospective buyers during the marketing period
