stem: Under Montana law, when must a statutory broker make the initial written disclosure to the buyer?
options:
  - At the time the statutory broker first endeavors to locate property for the buyer.
  - At the time the closing occurs and ends, after all financing and title work have been completed.
  - At the time negotiations between buyer and seller begin and end, regardless of any subsequent
    steps.
  - At the time the purchase agreement is signed by the parties, even if the transaction later falls
    through.
key: A
explanation: Montana law requires the statutory broker to give the buyer the initial written
  disclosure when the broker first begins to look for property for the buyer (Mont. Code Ann.
  § 37‑51‑314(4)(a)).
citation:
  source: Mont. Code Ann. § 37-51-314(4)(a)
  url: null
  quoted_text: The initial disclosure, as provided in subsection (6), must be made to the buyer at the
    time the statutory broker first endeavors to locate property for the buyer.
