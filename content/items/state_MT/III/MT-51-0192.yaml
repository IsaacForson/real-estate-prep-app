stem: An unlicensed individual assists a client in leasing a timeshare week, negotiates the lease
  terms, and expects a leasing fee. After the lease is executed, the individual sues the client for
  the fee. Under Montana law, what is the likely result?
options:
  - The individual may recover because a timeshare lease is not considered real estate under the
    statute.
  - The individual may not recover because they were not licensed at the time the claim arose.
  - The individual may recover because the statute only applies to sales, not leases.
  - The individual may recover if they had a written agreement with the client.
key: B
explanation: The statute covers lease of real estate and requires licensure or authorization at the
  time the claim arose; since the individual was unlicensed, recovery is barred. The claim that a
  timeshare lease is not real estate or that the statute only applies to sales misstates the
  statute's scope, and the claim that a written agreement would allow recovery incorrectly suggests
  that such an agreement overrides the licensure requirement.
