stem: A supervising broker oversees a salesperson who has been licensed for three years and has
  completed more than ten transaction sides in the past year. Which of the following actions must
  the supervising broker provide as part of reasonable supervision under Montana rule?
options:
  - Provide review and assistance in preparing contracts for transactions involving residential
    property
  - Provide monitoring of transactions from contract to closing including earnest money handling and
    title coordination
  - Provide a written office policy describing the duties and responsibilities of licensees
  - Provide specific training in office policies and procedures for new licensees
key: C
explanation: Reasonable supervision for salespersons with two or more years of experience includes
  maintaining a written office policy describing the duties and responsibilities of licensees
  affiliated with the broker. The other options describe activities required for high-level
  supervision of less experienced salespersons.
