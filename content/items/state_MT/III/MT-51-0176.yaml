stem: Under Montana Administrative Rule 24.210.428(2)(a), what must licensee identification be in
  internet advertising that uses multimedia messages?
options:
  - Licensee identification must be shown in banner ads only.
  - Licensee identification must be visible in a multimedia advertising message.
  - Licensee identification must be omitted from all internet advertising.
  - Licensee identification must be provided in instant or audible messaging.
key: B
explanation: The rule requires licensee identification to be visible in a multimedia advertising
  message. The requirement is not limited to banner ads only; a link to a web page may also satisfy
  the rule.
