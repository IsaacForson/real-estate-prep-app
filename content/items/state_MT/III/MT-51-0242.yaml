stem: A broker applies for a supervising broker endorsement and asks whether the board will charge a
  fee for obtaining or renewing the endorsement. According to Montana law, what is the correct
  response?
options:
  - The board may assess a fee only if the applicant also holds a broker license.
  - The board may charge a fee for renewal but not for obtaining.
  - The board may charge a fee for obtaining the endorsement but not for renewal.
  - The board may not assess a licensing fee for obtaining or renewing the endorsement.
key: D
explanation: Montana law prohibits the board from assessing a licensing fee for obtaining or
  renewing a supervising broker endorsement. Therefore, the correct response is that the board may
  not assess such a fee. The other options are incorrect because they suggest the board may charge a
  fee for obtaining, for renewal, or only under a condition that the applicant also holds a broker
  license, none of which are permitted by the statute.
