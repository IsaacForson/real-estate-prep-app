stem: A broker's independent contractor subagent tells a buyer that the property includes a garage
  when it does not. The broker knew the subagent was making this false statement before it was made.
  Under Montana law, is the broker liable for the misrepresentation?
options:
  - The broker is liable because the broker had actual knowledge of the misrepresentation
  - The broker is not liable because the subagent is an independent contractor
  - The broker is liable if the misrepresentation came from the broker
  - The broker is not liable because the buyer suffered no harm
key: A
explanation: The statute makes a broker liable for a subagent's misrepresentation when the broker
  has actual knowledge of the misrepresentation, regardless of the subagent's employee or
  independent contractor status. Here the broker's actual knowledge triggers liability. The
  distractor that claims no liability because the subagent is an independent contractor is
  incorrect; independent contractor status does not exempt the broker when the broker knows of the
  false statement.
