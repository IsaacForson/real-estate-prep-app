stem: Under N.M. Stat. Ann. § 61-29-13, what must the New Mexico Real Estate Commission do before
  suspending or revoking a license?
options:
  - To require the licensee to complete additional continuing education courses
  - To provide the licensee with a written warning and require remedial action
  - To impose a monetary fine, place the license on probation, and order corrective action
  - To set the matter down for a hearing pursuant to the Uniform Licensing Act
key: D
explanation: The statute requires the commission to set the matter down for a hearing pursuant to
  the Uniform Licensing Act before any suspension or revocation. The most tempting distractor, "To
  provide the licensee with a written warning and require remedial action," is incorrect because the
  law does not limit the commission to only a warning; it mandates a hearing first.
