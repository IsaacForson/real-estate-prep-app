stem: According to 16.61.36.9 NMAC, what must the commission do before the 10-working-day response
  period begins for a person under investigation?
options:
  - Give the person under investigation the opportunity to answer the complaint made against them
    orally and to produce relevant documentary evidence.
  - Give the person under investigation the opportunity to answer the complaint made against them in
    writing and to produce relevant documentary evidence.
  - Give the person under investigation the opportunity to produce relevant documentary evidence
    only.
  - Give the person under investigation the opportunity to answer the complaint made against them in
    writing only.
key: B
explanation: The rule states that in conducting an investigation, the commission shall give the
  person under investigation the opportunity to answer the complaint in writing and to produce
  relevant documentary evidence. This must occur before the 10‑working‑day response period starts.
  The other options change the required manner of response or omit one of the two required actions.
