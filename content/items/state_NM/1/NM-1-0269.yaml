stem: A licensee is under investigation and the investigation finds that the complaint involves a
  violation of the Real Estate License Law. According to 16.61.36.9 NMAC, what may the commission
  do?
options:
  - The commission may issue a notice of contemplated action immediately after reviewing the
    evidence and notifying the respondent
  - The commission may dismiss the complaint and advise the parties that no further action is
    required under the law
  - The commission may take no further action and close the case without any penalty, requiring the
    respondent to pay restitution
  - The commission may refer the complaint to the attorney general’s office or offer the respondent
    a pre‑NCA settlement
key: D
explanation: Subsection B allows the commission to either refer the complaint to the attorney
  general’s office for an NCA or offer a pre‑NCA settlement, with the understanding that rejection
  leads to referral for an NCA. The most tempting distractor is C, which suggests issuing an NCA
  immediately after reviewing evidence, but the rule requires either referral or a settlement offer
  before an NCA can be issued.
citation:
  source: 16.61 NMAC § 16.61.36.9
  url: null
  quoted_text: If the investigation reveals that the complaint does involve a violation of the Real
    Estate License Law or the commission rules, the commission may refer the complaint to the
    attorney general’s office and request that a notice of contemplated action (NCA) be issued to
    the respondent, or offer the respondent a pre-NCA settlement with the understanding that if the
    respondent does not accept the settlement offer, the complaint will be referred to the attorney
    general’s office for the issuance of an NCA.
