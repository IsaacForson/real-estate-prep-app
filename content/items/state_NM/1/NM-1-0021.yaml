stem: Under New Mexico Real Estate Commission rules, how must a trust account be designated on the
  financial institution’s records?
options:
  - It must be designated as "trust account" and include the trade name of the brokerage as
    registered with the commission.
  - It must be designated as "escrow account" and include the broker’s license number on the monthly
    statement.
  - It must be designated as "client funds account" and include the property address for
    identification on the deposit slip.
  - It must be designated as "brokerage account" and include the qualifying broker’s name and
    contact on the bank statement.
key: A
explanation: The rule explicitly states that trust accounts must be designated as "trust account"
  and include the brokerage's trade name as registered with the commission. This ensures clear
  identification of client funds. The other options incorrectly describe designation requirements
  such as using an escrow account or personal name.
