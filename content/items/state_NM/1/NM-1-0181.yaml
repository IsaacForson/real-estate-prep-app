stem: "A qualifying broker uses trust account funds to pay his personal credit card bill before the
  related real estate transaction has closed. Under 16.61.23.11 NMAC, this action constitutes:"
options:
  - An allowed commingling under a written sharing agreement
  - A permissible exception for paying bank fees
  - A wrongful disbursement for personal use
  - A proper disbursement of commission splits
key: C
explanation: Disbursing trust funds for personal use of the qualifying broker is expressly
  prohibited as a wrongful disbursement. The exception for paying bank fees applies only to
  non‑trust funds, not to trust account money used for personal expenses.
