stem: A licensee performed an act in June 2011 that would violate the provision added by the 2011
  amendment to N.M. Stat. Ann. §61-29-12. According to the statute, is the licensee subject to
  discipline for that act?
options:
  - The licensee is subject to discipline because the amendment applies to any conduct after its
    passage
  - The licensee is not subject to discipline because the amendment did not take effect until July
    1, 2011
  - The licensee is subject to discipline because the commission may apply amendments retroactively
  - The licensee is not subject to discipline because the commission may discipline for acts
    occurring after the amendment's effective date
key: B
explanation: The 2011 amendment became effective July 1, 2011, so conduct in June 2011 predates the
  change and is not subject to the new provision. The statement that the licensee is subject to
  discipline because the amendment applies to any conduct after its passage mistakenly assumes the
  amendment applies immediately after passage.
citation:
