  url: null
  quoted_text: The 2011 amendment, effective July 1, 2011, substituted ‘‘as provided in Section 61
    -29-16.1 NMSA 1978’’ for ‘‘provided further that the nonresident broker shall not conduct in
    this state any of the negotiations for which a fee, compensation or commission is paid except in
    cooperation with a licensed qualifying broker of this state’’ in (A)(7).
