stem: Two members of the New Mexico Real Estate Commission currently reside in Sandoval County. A
  vacancy occurs on the commission. According to N.M. Stat. Ann. § 61-29-4, can the governor appoint
  a new member from Sandoval County to fill the vacancy?
options:
  - The governor may appoint a new member from Sandoval County.
  - The governor may not appoint a new member from Sandoval County.
  - The governor must appoint a new member from a different county.
  - The governor must wait until the next election to fill the vacancy.
key: B
explanation: The law provides that not more than one commission member may come from any one county.
  With two members already from Sandoval County, appointing another would violate this restriction.
