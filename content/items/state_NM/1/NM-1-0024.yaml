stem: "According to N.M. Stat. Ann. § 61-29-12(A)(5), a licensee who receives money belonging to
  others must:"
options:
  - Hold the money in a safe deposit box and provide a receipt to the parties
  - Deposit the money into the licensee’s personal checking account until the transaction closes
  - Account for or remit the money within a reasonable time and keep the funds in an escrow or
    trustee account
  - Commingle the funds with the licensee’s own money to simplify bookkeeping
key: C
explanation: The statute requires a licensee to account for or remit others’ money within a
  reasonable time and to keep those funds in an escrow or trustee account. Failing to do so is
  grounds for discipline. The distractor that suggests depositing the money into the licensee’s
  personal account would violate the requirement to keep funds separate in an escrow or trustee
  account.
