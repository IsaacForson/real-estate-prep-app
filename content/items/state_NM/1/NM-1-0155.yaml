stem: According to N.M. Stat. Ann. § 61-29-17.2, what is the maximum civil penalty per violation
  that the New Mexico Real Estate Commission may impose for unlicensed real estate activity?
options:
  - Five hundred dollars per violation
  - One thousand dollars per violation
  - One thousand five hundred dollars per violation
  - Two thousand dollars per violation
key: B
explanation: The statute states the commission may impose a civil penalty not to exceed one thousand
  dollars ($1,000) for each violation. Therefore, the maximum per violation is $1,000. The
  distractor "Five hundred dollars per violation" incorrectly applies the misdemeanor fine limit
  from § 61-29-17(A) to commission penalties.
