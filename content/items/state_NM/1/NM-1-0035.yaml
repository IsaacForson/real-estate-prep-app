stem: A qualifying broker’s management agreement with an owner requires financial statements to be
  provided quarterly. According to NMAC rule, what must the broker do?
options:
  - Provide a monthly report of receipts and disbursements
  - Provide a quarterly report per the management agreement
  - Provide a semi‑annual report regardless of the agreement
  - Provide a report only upon written request from the owner
key: B
explanation: The rule requires the broker to provide the owner with a report of receipts and
  disbursements monthly or as required by the management agreement. Because the agreement specifies
  quarterly reports, the broker must comply with that schedule. The distractor incorrectly insists
  on a monthly frequency, which the agreement overrides.
