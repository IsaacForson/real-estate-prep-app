stem: A buyer delivers an earnest money check to a qualifying broker for a residential purchase.
  According to NMAC rules, what must the broker do with the earnest money?
options:
  - The broker must hold the earnest money in the broker’s personal account until closing.
  - The broker must invest the earnest money in an interest-bearing account without party agreement.
  - The broker must deposit the earnest money into the proper trust or custodial account per the
    written agreement of the parties.
  - The broker must deposit the earnest money into a property management trust account regardless of
    the transaction type.
key: C
explanation: The rule requires that all funds of others pertaining to a real estate transaction be
  deposited into the proper trust or custodial account per the written agreement of the parties.
  Depositing earnest money into a personal account or investing it without agreement violates
  commingling prohibitions. Property management trust accounts are reserved for management funds,
  not earnest money.
