stem: On July 1, 2005, the balance in the New Mexico real estate recovery fund exceeded $250,000.
  According to N.M. Stat. Ann. § 61-29-19.1(C), what must happen with the excess amount?
options:
  - It must be used to pay administrative costs of the commission.
  - It must be returned to the contributing licensees.
  - It must be transferred to the real estate education and training fund.
  - It must remain in the recovery fund until the next fiscal year.
key: C
explanation: The statute requires that on July 1, 2005 any balance in excess of $250,000 in the
  recovery fund shall be transferred to the real estate education and training fund. Keeping the
  excess in the recovery fund contradicts the mandatory transfer provision.
