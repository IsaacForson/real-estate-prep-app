  quoted_text: Notwithstanding the provisions of Sections 61-29-21 and 61-29-22 NMSA 1978, on July 1,
    2005, the balance in excess of two hundred fifty thousand dollars ($250,000) in the real estate
    recovery fund shall be transferred to the real estate education and training fund.
