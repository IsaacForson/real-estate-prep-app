stem: According to N.M. Stat. Ann. § 61-29-4, what is the required professional background of four
  of the five members of the New Mexico Real Estate Commission?
options:
  - Are associate brokers or qualifying brokers licensed in New Mexico
  - Are licensed real estate salespersons active in the state
  - Are attorneys licensed in New Mexico real estate brokerage
  - Are public members who have not been licensed in New Mexico
key: A
explanation: The statute requires that four of the five commission members be associate brokers or
  qualifying brokers licensed in New Mexico, while the fifth member must be a public member who has
  never been licensed as an associate or qualifying broker. Therefore, the correct answer is the
  option stating that four members are associate brokers or qualifying brokers licensed in New
  Mexico. The other options are incorrect because they describe salespersons, attorneys, or public
  members.
