stem: Under N.M. Stat. Ann. § 61-29-12(A)(8), which individual is required to place deposit money
  received in a real estate transaction into a trust account?
options:
  - Qualifying broker
  - Salesperson
  - Unlicensed assistant
  - Associate broker
key: A
explanation: The statute subjects a qualifying broker to discipline for failing to place deposit
  money in a trust account as soon as practicably possible after receiving signatures, establishing
  that duty on the qualifying broker. An associate broker must deliver deposit money to the
  qualifying broker, not directly to a trust account.
citation:
