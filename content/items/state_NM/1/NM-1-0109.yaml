stem: A qualifying broker receives property management fees from managing a rental property. Where
  may the broker deposit those fees?
options:
  - Personal brokerage account
  - Property management trust account
  - Brokerage trust account
  - Special trust account
key: B
explanation: The rule states that a brokerage trust account shall be used for money belonging to
  others related to a real estate sales transaction and that property management funds may not be
  placed in this account; property management fees must go to a property management trust account.
  The distractor 'Brokerage trust account' is incorrect because property management funds are
  prohibited from being placed there.
