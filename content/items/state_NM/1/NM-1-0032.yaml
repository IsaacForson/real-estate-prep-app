stem: Under 16.61.12.9(A), when must a qualifying broker surrender a license that has been suspended
  or revoked by the commission?
options:
  - The broker must surrender the license within ten days of receiving the order, unless the broker
    requests an extension approved by the commission
  - The broker must surrender the license within thirty days of the order, as stipulated in the
    commission's notice.
  - The broker must surrender the license upon delivery of the order to the broker by the
    commission, or on the effective date of the order.
  - The broker must surrender the license after a hearing confirms the suspension and the broker has
    been given an opportunity to appeal.
key: C
explanation: Subsection A requires the broker to surrender the license upon delivery of the order by
  the commission, or on the effective date of the order. The other timeframes are not specified in
  the rule.
citation:
  source: "### 16.61 NMAC — New Mexico Real Estate Commission Rules, 16.61 NMAC (Title 16, Chapter 61)
