  url: null
  quoted_text: Any qualifying broker’s or associate broker’s license suspended or revoked by an order,
    stipulated agreement or settlement agreement approved by the commission shall be surrendered to
    the commission by the broker upon the delivery of the order to the broker by the commission, or
    on the effective date of the order.
