stem: The commission president wishes to call a special meeting to discuss a proposed rule change.
  According to N.M. Stat. Ann. § 61-29-6, what must the president do before holding the meeting?
options:
  - publish notice of the proposed action in the official publication before the meeting
  - ensure a quorum of at least three members is present and obey open meeting laws
  - give five days' written notice to each commission member as required by law
  - hold the meeting at least thirty days before a final vote on the rule change
key: C
explanation: "The statute requires the commission president to give five days' written notice to
  each commission member before a special meeting. The other statements describe different
  requirements: ensuring a quorum and following open meeting laws is about conducting business, not
  about calling the meeting; publishing notice in the official publication pertains to rulemaking
  hearings, not special meetings; holding the meeting thirty days before a final vote relates to
  timing for final action on rule changes, not the notice needed to call a special meeting."
citation:
  source: N.M. Stat. Ann. § 61-29 — New Mexico Real Estate Brokers and Salesmen Act, NMSA 1978 §§
    61-29-1 to 61-29-29 — NMREC License Law and Rules book, 2021 web edition — § 61-29-6
  url: null
  quoted_text: special meetings may be held upon five days’ written notice to each of the commission
    members by the commission president.
