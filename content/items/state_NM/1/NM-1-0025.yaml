stem: A qualifying broker in New Mexico receives an earnest money deposit from a buyer after both
  parties have signed the purchase agreement. What must the qualifying broker do with the deposit
  under N.M. Stat. Ann. § 61-29-12(A)(8)?
options:
  - Place the deposit in the qualifying broker’s personal account to avoid bank fees
  - Place the deposit in a custodial trust or escrow account promptly after signatures
  - Place the deposit in the qualifying broker’s office safe until closing for security
  - Place the deposit with the buyer’s attorney for safekeeping until closing of the transaction
key: B
explanation: The rule obligates a qualifying broker to place deposit money in a custodial, trust, or
  escrow account as soon as practicable after securing signatures of all parties. Failing to do so
  is grounds for discipline. The distractor that suggests placing the deposit in the broker’s
  personal account would violate the requirement to keep funds in a proper trust or escrow account.
citation:
  source: N.M. Stat. Ann. § 61-29 — New Mexico Real Estate Brokers and Salesmen Act, NMSA 1978 §§
    61-29-1 to 61-29-29 — NMREC License Law and Rules book, 2021 web edition — § 61-29-12
  url: null
  quoted_text: Failed, if a qualifying broker, to place as soon after receipt as is practicably
    possible, after securing signatures of all parties to the transaction, any deposit money or
    other money received by the qualifying broker in a real estate transaction in a custodial, trust
    or escrow account
