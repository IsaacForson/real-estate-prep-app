stem: Under N.M. Stat. Ann. § 61-29-17(C), if a court finds a person has willfully engaged in a
  violative act, what is the maximum civil penalty per violation that may be recovered on behalf of
  the state?
options:
  - $5,000
  - $500
  - $1,000
  - $10,000
key: A
explanation: Subsection C allows the state to recover a civil penalty not exceeding $5,000 per
  violation for willful violations. Hence the option stating "$5,000" is correct. The distractor
  "$1,000" is plausible because it mirrors the per‑violation limit in subsection B, but subsection C
  raises the ceiling to $5,000 for willful acts.
