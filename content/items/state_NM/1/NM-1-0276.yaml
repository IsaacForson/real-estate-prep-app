stem: Under N.M. Stat. Ann. § 61-29-12(A)(8), what exception allows a qualifying broker to deposit
  non-trust funds into a trust account without the deposit being considered commingling?
options:
  - Up to five percent of the total trust account balance.
  - Up to the amount needed to meet the bank's minimum balance requirement.
  - Up to the total amount of earnest money received in the transaction.
  - Any amount as long as the broker records the deposit in the account ledger.
key: B
explanation: The statute allows a qualifying broker to deposit non‑trust funds up to the amount
  needed to meet the bank's minimum‑balance requirement; such deposits are not considered
  commingling. A limit of five percent of the trust account balance is not authorized by the
  statute.
