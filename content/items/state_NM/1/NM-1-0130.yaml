stem: "According to N.M. Stat. Ann. § 61-29-12(A)(3), a licensee may pay a commission to an
  unlicensed person only if:"
options:
  - The unlicensed person is a family member of the licensee and agrees to accept the payment for
    services
  - The unlicensed person holds a real estate license from another state and consents to receive the
    payment
  - The unlicensed person is a party to the transaction and the licensee provides written consent
    for the payment
  - The unlicensed person is the licensee's principal and the principal provides written consent for
    the payment
key: D
explanation: Under N.M. Stat. Ann. § 61-29-12(A)(3), a licensee may pay a commission to an
  unlicensed person only when that person is the licensee’s principal or another party to the
  transaction, and only with that principal’s written consent. An option stating that the unlicensed
  person is a family member of the licensee and agrees to accept the payment for services is
  incorrect because the person is neither the licensee’s principal nor a party to the transaction
  and there is no written consent from the principal. An option stating that the unlicensed person
  holds a real estate license from another state and consents to receive the payment is incorrect
  because the person must be the licensee’s principal or a party to the transaction, and the
  required written consent must come from the principal, not from the unlicensed person. An option
  stating that the unlicensed person is a party to the transaction and the licensee provides written
  consent for the payment is incorrect because the written consent must be obtained from the
  principal, not from the licensee.
citation:
