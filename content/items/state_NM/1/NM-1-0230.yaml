stem: According to N.M. Stat. Ann. § 61-29-5, who is entitled to inspect the commission's record of
  proceedings and the register of licensed associate brokers and qualifying brokers at any
  reasonable time?
options:
  - Only the president
  - Any licensed broker
  - The general public
  - Only the governor
key: C
explanation: The statute states that the record shall be open to public inspection at all reasonable
  times, meaning any member of the public may review it. The other options incorrectly limit
  inspection to specific officials or licensees only.
