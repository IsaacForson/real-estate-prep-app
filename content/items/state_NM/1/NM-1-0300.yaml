stem: Under N.M. Stat. Ann. § 61-29-12(A)(8), what is the maximum amount of non‑trust funds a
  qualifying broker may deposit in a trust account to meet bank minimum balance requirements?
options:
  - The broker may deposit up to ten percent of the balance
  - The broker may deposit up to five hundred dollars
  - The broker may deposit up to the required minimum balance
  - The broker may deposit any amount, provided it is recorded
key: C
explanation: Under N.M. Stat. Ann. § 61‑29‑12(A)(8) a qualifying broker may place non‑trust funds in
  a trust account only to the extent needed to satisfy the bank’s required minimum balance. The
  statement that the broker may deposit up to the required minimum balance is therefore correct. The
  alternatives that limit the deposit to ten percent of the balance, to five hundred dollars, or
  allow any amount as long as it is recorded are not supported by the statute.
citation:
  source: N.M. Stat. Ann. § 61-29 — New Mexico Real Estate Brokers and Salesmen Act, NMSA 1978 §§
    61-29-1 to 61-29-29 — NMREC License Law and Rules book, 2021 web edition — § 61-29-12
  url: null
  quoted_text: Nothing in this paragraph prohibits a qualifying broker from depositing non-trust funds
    in an amount not to exceed the required minimum balance in each trust account so as to meet the
    minimum balance requirements of the bank necessary to maintain the account and avoid charges.
