stem: A person conducts real estate brokerage in New Mexico without holding a license issued by the
  commission. According to N.M. Stat. Ann. § 61-29-17(A), how is this offense classified?
options:
  - The offense is classified as a misdemeanor.
  - The offense is classified as a petty misdemeanor.
  - The offense is classified as a fourth degree felony.
  - The offense is classified as a third degree felony.
key: C
explanation: Subsection A states that engaging in business as an associate or qualifying broker
  without a license is a fourth degree felony. The misdemeanor classification applies only to
  violations of other provisions of the chapter, not to unlicensed brokerage.
citation:
  source: "### N.M. Stat. Ann. § 61-29 — New Mexico Real Estate Brokers and Salesmen Act, NMSA 1978 §§
    61-29-1 to 61-29-29 — NMREC License Law and Rules book, 2021 web edition — § 61-29-17"
  url: null
  quoted_text: Any person who engages in the business or acts in the capacity of an associate broker
    or a qualifying broker within New Mexico without a license issued by the commission is guilty of
    a fourth degree felony.
