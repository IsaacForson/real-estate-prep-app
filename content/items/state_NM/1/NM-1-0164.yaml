stem: Under N.M. Stat. Ann. § 61-29-7, a commission member receives a monthly stipend for serving as
  the commission’s chairperson in addition to the per diem and mileage allowed by law. Is this
  stipend permissible?
options:
  - No, because the Per Diem and Mileage Act allows additional stipends for leadership roles.
  - Yes, because only the commission secretary is eligible for additional compensation.
  - Yes, because the stipend compensates for extra duties beyond regular meetings.
  - No, because members shall receive no other compensation, perquisite, or allowance besides per
    diem and mileage.
key: D
explanation: The statute provides that commission members shall receive per diem and mileage and
  shall receive no other compensation, perquisite, or allowance. Therefore a monthly stipend for
  serving as chairperson is not allowed. The option citing the Act allowing additional stipends
  contradicts the text.
