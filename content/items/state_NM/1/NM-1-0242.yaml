stem: A licensee is found through an administrative proceeding to have engaged in unlicensed real
  estate activity. Under N.M. Stat. Ann. § 61-29-17.2, what additional amount may the New Mexico
  Real Estate Commission assess besides the civil penalty per violation?
options:
  - Administrative costs
  - Additional civil penalty
  - Attorney fees for licensee
  - Payment to recovery fund
key: A
explanation: The statute allows the commission to assess administrative costs for any investigation
  and administrative or other proceedings against the person, in addition to the civil penalty. The
  other options either duplicate the civil penalty, refer to attorney fees (which the commission
  does not assess), or misstate where money is deposited.
