stem: A commission member receives written notice of a special meeting only three days before the
  meeting is scheduled to begin. According to N.M. Stat. Ann. § 61-29-6, is the notice sufficient?
options:
  - The notice is insufficient per rule.
  - The notice is given five days prior.
  - The notice is given two days prior.
  - The notice is sufficient per rule.
key: A
explanation: The rule requires special meetings to be held upon five days’ written notice to each
  commission member. Notice given only three days in advance does not meet this requirement, making
  it insufficient. The option stating the notice is sufficient per rule contradicts the five‑day
  notice mandate.
