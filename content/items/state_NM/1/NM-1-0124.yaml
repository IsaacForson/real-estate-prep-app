stem: According to 16.61.36.9 NMAC, within how many working days must a person under investigation
  respond to a complaint in writing?
options:
  - Fifteen working days.
  - Ten working days.
  - Twenty working days.
  - Five working days.
key: B
explanation: The rule states that if the person under investigation fails to respond within 10
  working days of having been provided with a copy of the complaint and being informed in writing
  that a complaint has been filed, the investigation may proceed without that person's response.
  This establishes the 10‑working‑day response period. The other options do not match the time frame
  specified in the rule.
