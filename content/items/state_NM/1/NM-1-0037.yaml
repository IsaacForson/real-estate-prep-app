stem: A vacancy occurs on the New Mexico Real Estate Commission due to a member's resignation. What
  action must the governor take under N.M. Stat. Ann. § 61-29-4?
options:
  - Appoint a new member for a full term
  - Leave the vacancy unfilled until next cycle
  - Appoint a member to finish the unexpired term
  - Call a special election among licensees
key: C
explanation: The law states that in the event of vacancies, the governor shall appoint members to
  complete unexpired terms. Therefore, the governor must fill the vacancy by appointing someone to
  serve the remainder of the term. Leaving the vacancy open, appointing for a full term, or holding
  an election are not authorized by this provision.
