stem: Under N.M. Stat. Ann. § 61-29-12(A)(5), what action must a licensee take regarding listing and
  sales contracts?
options:
  - Furnish legible copies of all listing and sales contracts to all parties
  - Retain the original contracts for at least five years after closing
  - File the contracts with the county clerk within ten days of execution
  - Provide a verbal summary of the contract terms to all parties involved
key: A
explanation: The statute explicitly requires a licensee to furnish legible copies of all listing and
  sales contracts to all parties executing them; failure to do so is grounds for disciplinary
  action. Providing only a verbal summary does not satisfy this requirement.
