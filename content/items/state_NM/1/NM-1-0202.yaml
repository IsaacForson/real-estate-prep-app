stem: A person pays a civil penalty and administrative costs to the New Mexico Real Estate
  Commission after being found guilty of unlicensed real estate activity. According to N.M. Stat.
  Ann. § 61-29-17.2, where must the commission deposit the money collected?
options:
  - The money must be deposited into the state’s general fund.
  - The money must be deposited into the real estate education and training fund.
  - The money must be returned to the person who paid it.
  - The money must be deposited into the real estate recovery fund.
key: D
explanation: The statute directs that any money collected by the commission under this section shall
  be deposited into the real estate recovery fund. Depositing into the general fund or the education
  and training fund is not authorized, and the money is not returned to the payor. Therefore, the
  correct destination is the real estate recovery fund.
