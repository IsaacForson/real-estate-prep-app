  url: null
  quoted_text: "Registration fee: Every application for time share project registration must be
    accompanied by a certified check made payable to the New Mexico real estate commission in the
    amount of twenty dollars ($20.00) per time share interest to be sold, to a maximum of one
    thousand five hundred dollars ($1,500.00)."
