  - $40.00
key: B
explanation: The rule specifies a fee of twenty dollars ($20.00) per time share interest to be sold,
  subject to a maximum of $1,500.00. Therefore the correct per‑interest amount is $20.00. The $10.00
  distractor mistakenly halves the statutory rate, while $30.00 and $40.00 incorrectly increase it.
