stem: A commission currently has three associate brokers and one public member. According to N.M.
  Stat. Ann. § 61-29-4, how many more associate brokers must be appointed to meet the requirement
  that four members be associate brokers or qualifying brokers?
options:
  - The commission must appoint zero additional associate brokers.
  - The commission must appoint two additional associate brokers.
  - The commission must appoint three additional associate brokers.
  - The commission must appoint one additional associate broker.
key: D
explanation: The statute requires four commission members to be associate brokers or qualifying
  brokers. With three associate brokers already serving, one more associate broker (or qualifying
  broker) is needed to reach the required four.
citation:
  source: N.M. Stat. Ann. § 61-29 — New Mexico Real Estate Brokers and Salesmen Act, NMSA 1978 §§
    61-29-1 to 61-29-29 — NMREC License Law and Rules book, 2021 web edition — § 61-29-4
  url: null
  quoted_text: four of whom shall have been associate brokers or qualifying brokers
