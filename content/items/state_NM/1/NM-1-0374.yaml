stem: Under N.M. Stat. Ann. § 61-29-17(A), what is the criminal classification for engaging in the
  business as an associate broker or qualifying broker without a license?
options:
  - Fourth degree felony
  - Simple misdemeanor
  - Petty misdemeanor
  - Civil infraction
key: A
explanation: The statute provides that a person who acts as an associate broker or qualifying broker
  without a license commits a fourth‑degree felony. Therefore the answer is the choice that states
  “Fourth degree felony.” The other choices describe lesser offenses, which the statute does not
  apply to for this conduct.
