stem: An associate broker for a registered time share project sells a time share interest directly
  to a buyer without routing the sale through the project's qualifying broker. Under 16.61.25.13(B)
  NMAC, is this permissible?
options:
  - The sale is permitted if the associate broker obtains written consent from the developer
  - The sale is permitted if the qualifying broker is temporarily unavailable
  - The sale is prohibited because all sales must be through the qualifying broker
  - The sale is permitted if the commission is paid directly to the associate broker
key: C
explanation: The rule requires that all sales of time share interests by associate brokers be made
  through the qualifying broker and that commissions be disbursed by that broker. Selling directly
  violates this requirement, regardless of developer consent or the qualifying broker's
  availability.
citation:
  source: "### 16.61 NMAC — New Mexico Real Estate Commission Rules, 16.61 NMAC (Title 16, Chapter 61)
