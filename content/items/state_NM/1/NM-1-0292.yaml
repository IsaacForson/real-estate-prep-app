stem: A licensee associated with Qualifying Broker X attempts to represent Qualifying Broker Y in a
  transaction without X's knowledge or consent. Under N.M. Stat. Ann. § 61-29-12(A)(4), is this
  permissible?
options:
  - It is permissible if the licensee is also a qualifying broker.
  - It is not permissible because it violates § 61-29-12(A)(4).
  - It is permissible if Qualifying Broker Y provides written consent.
  - It is permissible if the licensee discloses the arrangement to the client.
key: B
explanation: The statute lists representing or attempting to represent a different qualifying broker
  without the associated broker's express knowledge and consent as a ground for disciplinary action.
  The distractor suggesting permissibility with disclosure to the client is wrong because the
  required consent is from the associated broker, not the client.
