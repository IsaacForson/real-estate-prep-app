stem: Under 16.61.24.12(A), which item must be included in the monthly owner statement of receipts
  and disbursements?
options:
  - Number of units managed
  - Previous balance
  - Property tax assessment
  - Broker's commission percentage
key: B
explanation: The rule requires the owner statement to show the previous balance, funds deposited by
  category, funds disbursed by category, and the ending balance. Therefore, the previous balance
  must be included. The number of units managed is not listed in the rule and is not required.
