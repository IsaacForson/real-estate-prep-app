stem: The New Mexico Real Estate Commission president schedules meetings for January, April, July,
  and October each year. According to N.M. Stat. Ann. § 61-29-6, does this schedule satisfy the
  commission’s meeting requirement?
options:
  - Yes, because the commission must meet at least once each quarter-year
  - Yes, because the commission must meet exactly every three months
  - Yes, provided the meetings are held in the commission’s official publication
  - Yes, but the secretary must attend each meeting for it to count
key: A
explanation: The rule requires the commission to meet at least once each quarter-year; scheduling
  meetings in January, April, July, and October meets that minimum. The distractor claiming meetings
  must be exactly every three months adds a requirement not present in the statute.
