stem: A licensee under investigation by the New Mexico Real Estate Commission does not respond to
  the complaint within the required time frame. According to 16.61.36.9 NMAC, what may happen next?
options:
  - The licensee is immediately issued a notice of contemplated action.
  - The complaint is automatically dismissed.
  - The investigation may proceed without the licensee's response.
  - The commission must refer the case to the attorney general.
key: C
explanation: The rule provides that when a person under investigation fails to respond within 10
  working days after receiving the complaint and written notice of its filing, the investigation may
  proceed without the benefit of that person's response. This allows the commission to continue the
  investigation despite the lack of response. The other options describe actions not authorized by
  the rule under these circumstances.
