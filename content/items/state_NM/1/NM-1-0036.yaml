stem: According to N.M. Stat. Ann. § 61-29-4, what is the minimum residency requirement for a person
  to be appointed to the New Mexico Real Estate Commission?
options:
  - Five consecutive years residency
  - Three consecutive years residency
  - Seven consecutive years residency
  - One consecutive years residency
key: B
explanation: The statute specifies that commission members must have been residents of the state for
  three consecutive years immediately prior to their appointment. This directly supports the answer
  of three consecutive years of residency. The other options reflect shorter or longer periods that
  are not required by the law.
