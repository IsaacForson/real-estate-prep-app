stem: A qualifying broker receives an earnest money check on Monday, obtains all parties' signatures
  that same day, but waits until Thursday to deposit the funds into the trust account. Under N.M.
  Stat. Ann. § 61-29-12(A)(8), is this permissible?
options:
  - The broker's action is permissible because the delay was only three business days.
  - The broker's action is not permissible because the funds must be deposited as soon after receipt
    as is practicably possible.
  - The broker's action is permissible because the broker obtained all parties' signatures before
    depositing.
  - The broker's action is not permissible because the broker failed to provide written notice to
    the commission.
key: B
explanation: The rule mandates that deposit money be placed in a trust account as soon after receipt
  as practicably possible after signatures are obtained. A three‑day delay without justification
  fails this timeliness requirement, even though signatures were secured.
