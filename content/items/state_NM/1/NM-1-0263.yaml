stem: According to N.M. Stat. Ann. § 61-29-19.1(C), what amount must the balance in the real estate
  recovery fund exceed before the excess is transferred to the real estate education and training
  fund?
options:
  - It is $100,000
  - It is $150,000
  - It is $250,000
  - It is $500,000
key: C
explanation: The statute states that on July 1, 2005, the balance in excess of two hundred fifty
  thousand dollars ($250,000) in the real estate recovery fund shall be transferred to the real
  estate education and training fund. Therefore, the threshold is $250,000. The distractor $150,000
  reflects a common mis‑remembered figure but is not supported by the text.
