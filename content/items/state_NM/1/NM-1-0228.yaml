stem: A qualifying broker collects a security deposit from a tenant and deposits it into the
  property management trust account. According to 16.61.24.12(A), how must the broker show this
  security deposit in the monthly owner statement?
options:
  - Funds deposited by category
  - Funds disbursed by category
  - Previous balance
  - Ending balance
key: A
explanation: The rule mandates that the owner statement list funds deposited by category. A security
  deposit is a type of deposit, so it must appear under that heading. Funds disbursed by category
  refers to outflows, not the deposit itself.
