math:
  worked_solution: The honorarium offered is $500. According to N.M. Stat. Ann. § 61-29-7, commission
    members may receive only per diem and mileage and no other compensation. Since $500 is greater
    than zero, it constitutes prohibited compensation. Therefore, the member may not accept the
    honorarium.
  formulas:
    - Compensation = Honorarium amount
    - If Compensation > 0 then prohibited
