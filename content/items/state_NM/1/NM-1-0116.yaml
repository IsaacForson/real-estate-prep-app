stem: A commission member has been absent from three consecutive quarterly meetings without excuse.
  Under N.M. Stat. Ann. § 61-29-4, what action may the governor take regarding this member?
options:
  - remove the member for cause and declare the position vacant
  - appoint a new member to fill the vacancy immediately
  - reduce the member’s per diem and mileage reimbursement
  - call a special meeting of the commission within five days
key: A
explanation: Under N.M. Stat. Ann. § 61-29-4, the governor may remove a commission member for cause,
  which includes unexplained absences from meetings; therefore removing the member for cause and
  declaring the position vacant is the proper action. The governor does not have authority to
  appoint a replacement instantly; appointments are limited to filling unexpired terms after a
  vacancy occurs, not to replace a member removed for cause. The governor also cannot unilaterally
  alter the per‑diem or mileage reimbursement that the statute sets for commission members. Calling
  a special commission meeting within five days is a power of the commission itself, not a
  gubernatorial power.
