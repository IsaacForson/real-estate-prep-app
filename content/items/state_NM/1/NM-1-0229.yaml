stem: When preparing a written residential management agreement for a client, what must the
  qualifying broker do under 16.61.24.13(D)?
options:
  - The requirement to obtain written confirmation only
  - The requirement to provide a copy and obtain confirmation
  - The requirement to provide a written copy only
  - The requirement to provide neither a copy nor confirmation
key: B
explanation: The rule requires the broker to include a copy of the Uniform Owner-Resident Relations
  Act with every written residential management agreement and to obtain separate written
  confirmation that the client received the copy. Providing only the copy or only the confirmation
  does not satisfy both obligations.
citation:
  source: 16.61 NMAC — New Mexico Real Estate Commission Rules, 16.61 NMAC (Title 16, Chapter 61) —
    NMREC License Law and Rules book, 2021 web edition — § 16.61.1.7 § 16.61.24.13(D)
  url: null
  quoted_text: The qualifying broker shall include with every written residential management agreement
    a copy, either in hard copy form or electronically, of the New Mexico Uniform Owner-Resident
    Relations Act.
