stem: A broker whose license expired on June 1 wants to request a late fee exemption. What must the
  broker do before submitting the late renewal application?
options:
  - The broker must pay the late fee promptly before renewal
  - The broker must contact staff and submit proof
  - The broker must finish the basics course before renewal
  - The broker must show proof of CE hours before renewal
key: B
explanation: To obtain a late fee exemption, a broker must first contact commission staff before
  submitting the late renewal application and must submit a letter of explanation with supporting
  documentation. Therefore, the broker must contact staff and submit proof (documentation). The
  distractor suggesting the broker must pay the late fee first is wrong because the exemption
  process requires staff contact and documentation before any payment is considered.
