stem: During a hearing under Part 35, the commission presents a statement of non‑compliance. The
  broker then provides a subsequent statement of compliance from HSD. What effect does this have on
  the commission’s ability to act?
options:
  - The commission must still take action because the statement of non‑compliance remains conclusive.
  - The commission may take action only if the broker also admits guilt.
  - The commission is precluded from taking any action based solely on the prior statement of
    non‑compliance.
  - The broker must pay a fine before the statement of compliance is accepted.
key: C
explanation: The rule provides that a statement of non‑compliance is conclusive evidence requiring
  the commission to take action unless the broker provides a subsequent statement of compliance,
  which shall preclude the commission from taking any action based solely on the prior statement of
  non‑compliance. Thus providing the subsequent statement blocks action based on the earlier
  statement. The distractor that the commission must still take action ignores the ‘unless’ clause.
citation:
  source: 16.61 NMAC § 16.61.35.12
  url: null
  quoted_text: A statement of non‑compliance is conclusive evidence that requires the commission to
    take the appropriate action under Section 8 of Part 35 of Chapter 61 unless; B. The broker or
    broker applicant provides the commission a subsequent statement of compliance which shall
    preclude the commission from taking any action based solely on the prior statement of
    non‑compliance.
