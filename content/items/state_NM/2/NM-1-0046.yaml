stem: An out-of-state applicant who holds a current real estate broker license in another state and
  has completed sixty classroom hours of prelicensing education approved by that state wishes to
  take the New Mexico broker examination. What must the applicant still complete to be eligible to
  take the state portion of the New Mexico broker examination?
options:
  - Complete the commission-approved thirty-hour real estate law class
  - Complete the commission-approved thirty-hour national exam prep class
  - Complete the commission-approved thirty-hour broker basics class
  - Complete the commission-approved thirty-hour state law review class
key: C
explanation: The statute allows the commission to waive sixty hours of the ninety-hour prelicensing
  education and the national portion of the exam for out-of-state applicants, but requires
  completion of the commission-approved thirty-hour broker basics class to be eligible for the state
  portion. The other courses do not satisfy this specific requirement.
