stem: Under New Mexico rule, which of the following describes a person who holds an associate broker
  license but is **NOT** affiliated with a qualifying broker?
options:
  - A person holding a New Mexico associate broker license who works independently
  - A person holding a New Mexico associate broker license who is affiliated with a qualifying broker
  - A person holding a New Mexico associate broker license who is not affiliated with a qualifying
    broker
  - A person holding a New Mexico qualifying broker license who supervises associate brokers
key: C
explanation: The definition of an associate broker requires the person to be affiliated with a New
  Mexico qualifying broker. Holding the license without that affiliation does not meet the
  definition, so such a person is not considered an associate broker. A person who is affiliated
  with a qualifying broker would meet the definition, while a qualifying broker or an independently
  working licensee does not.
