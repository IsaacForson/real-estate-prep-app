stem: Under 16.61.35.10, what is the maximum period a broker has to submit a statement of compliance
  after being informally notified that their name appears on the certified list?
options:
  - Ten days.
  - Twenty days.
  - Thirty days.
  - Sixty days.
key: C
explanation: The rule states that for current brokers only, the commission shall informally notify
  the broker that the broker’s name is on the certified list, and that the broker must provide the
  commission with a subsequent statement of compliance from HSD by the earlier of the application
  for license renewal or a specified date not to exceed thirty (30) days. Therefore the maximum
  period is thirty days. The distractor ‘Twenty days’ reflects the hearing request deadline in the
  notice of contemplated action, which does not apply here.
