stem: What must a broker provide to the commission to avoid formal proceedings after being
  informally notified that their name appears on the certified list?
options:
  - A. A statement of compliance from HSD
  - B. A renewal application fee
  - C. A letter requesting a hearing
  - D. Proof of continuing education
key: A
explanation: The rule states that a broker who is informally notified must provide the commission
  with a subsequent statement of compliance from HSD to avoid formal proceedings. Submitting a
  letter requesting a hearing is only relevant after a notice of contemplated action, not after
  informal notice.
