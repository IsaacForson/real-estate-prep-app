stem: An associate broker who offers property management services for others has completed eight
  hours of approved continuing education in property management during the current three-year
  licensing cycle. Is this sufficient to meet the continuing education requirement under New Mexico
  rule?
options:
  - Yes, because eight hours exceeds the six‑hour minimum.
  - Yes, because associate brokers must complete twelve hours each cycle.
  - Yes, because the hours must be earned each year, not each cycle.
  - Yes, but only if the associate broker also attended a commission meeting.
key: A
explanation: The rule requires associate brokers offering property management services to complete a
  minimum of six hours of approved continuing education in property management during each
  three-year licensing cycle; eight hours satisfies this minimum. The distractor incorrectly states
  a twelve‑hour requirement, which applies to qualifying brokers.
