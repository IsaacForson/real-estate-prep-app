  quoted_text: As a condition of offering property management services, in addition to the course
    requirement in paragraph A above, associate brokers shall complete a minimum of six hours of
    approved continuing education courses in property management selected from the commission’s most
    current approved course catalogue during each three-year licensing cycle.
