stem: A qualifying broker’s license is lost and cannot be delivered to the commission office.
  According to 16.61.9.8(C), when does inactivation of the license occur?
options:
  - Submitting a new qualifying broker application with fees
  - Paying a commission to the associate broker promptly
  - Receiving a written notice from the qualifying broker
  - Notifying the associate broker in writing promptly
key: C
explanation: When a license is lost or unavailable for delivery, inactivation occurs at the time the
  commission receives and stamps a written notification from the qualifying broker that the
  associate broker is no longer affiliated. The other options describe unrelated actions.
citation:
  source: 16.61 NMAC — New Mexico Real Estate Commission Rules, 16.61 NMAC (Title 16, Chapter 61) —
    NMREC License Law and Rules book, 2021 web edition — § 16.61.9.8
  url: null
  quoted_text: In the event that a license is lost, or otherwise unavailable for delivery by the
    qualifying broker to the commission office, inactivation of the license will take place at the
    time the commission receives and stamps a written notification from the qualifying broker that
    the associate broker is no longer affiliated with the brokerage.
