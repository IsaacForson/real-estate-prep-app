stem: A qualifying broker’s license is suspended by commission order. What is the status of any
  associate broker licenses that are associated with that qualifying broker?
options:
  - Active and usable for brokerage activities
  - Inactive pending appointment of a new qualifying broker
  - Revoked and cannot be used for any activity
  - Surrendered to the commission and held inactive
key: B
explanation: The statute provides that associate broker licenses associated with a qualifying broker
  whose license is suspended or revoked shall be automatically placed on inactive status until a new
  qualifying broker or qualifying broker in charge is designated. The other options describe active
  status, revoked status, or surrendered status, which are not correct under the rule.
