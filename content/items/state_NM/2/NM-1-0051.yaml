stem: Under the New Mexico Real Estate Brokers and Salesmen Act, when must a person be licensed to
  maintain a lawsuit for a commission?
options:
  - The person must be licensed within thirty days after the transaction closes
  - The person must be licensed at the time the commission contract is signed
  - The person must be licensed at the time the cause of action arose
  - The person must be licensed at any time before filing the lawsuit
key: C
explanation: The New Mexico Real Estate Brokers and Salesmen Act provides that a commission claim
  may be brought only if the claimant was a duly licensed qualifying or associate broker at the time
  the alleged cause of action arose. Consequently, the licensing requirement must exist at the
  moment the cause of action accrues. A statement that the person must be licensed within thirty
  days after the transaction closes is incorrect because the statute does not tie the requirement to
  a post‑closing time frame; the license must be in place when the cause of action arises, not
  merely after the transaction. (N.M. Stat. Ann. § 61‑29‑16)
citation:
  source: N.M. Stat. Ann. § 61-29-16
  url: null
  quoted_text: No action for the collection of a commission or compensation earned by any person as a
    qualifying broker or an associate broker required to be licensed under the provisions of Chapter
    61, Article 29 NMSA 1978 shall be maintained in the courts of the state unless such person was a
    duly licensed qualifying broker or associate broker at the time the alleged cause of action
    arose.
