stem: A New Mexico landowner owns a tract that has been subdivided into 150 parcels and decides to
  sell one of the parcels without a real estate professional. Under the New Mexico Real Estate
  Brokers and Salesmen Act, which statement is correct regarding licensing requirements?
options:
  - The landowner must obtain an associate broker’s license before selling the parcel.
  - The landowner must obtain a qualifying broker’s license before selling the parcel.
  - The landowner is exempt from licensing requirements because she is the owner selling her own
    property.
  - The landowner must register with the commission but does not need a license.
key: A
explanation: Although owners are generally exempt under Subsection C(1), that exemption does not
  apply when the sale or offering for sale is part of a subdivision containing 100 or more parcels.
  Because the land is subdivided into 150 parcels, the owner must hold a license to sell a parcel,
  making an associate broker’s license required.
citation:
  source: N.M. Stat. Ann. § 61-29 — New Mexico Real Estate Brokers and Salesmen Act, NMSA 1978 §§
    61-29-1 to 61-29-29 — NMREC License Law and Rules book, 2021 web edition — § 61-29-2
  url: null
  quoted_text: (1) A person who as owner performs any of the activities included in this section with
    reference to property owned by the person, except when the sale or offering for sale of the
    property constitutes a subdivision containing one hundred or more parcels;
