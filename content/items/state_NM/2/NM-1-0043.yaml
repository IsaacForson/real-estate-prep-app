stem: A New Mexico homeowner decides to sell her own single-family residence without the assistance
  of a real estate professional. Under the New Mexico Real Estate Brokers and Salesmen Act, which
  statement is correct regarding licensing requirements?
options:
  - The homeowner must file a notice with the commission but is not required to hold any license.
  - The homeowner is exempt from licensing requirements as the owner selling her own property.
  - The homeowner must obtain a temporary broker’s permit before listing the property.
  - The homeowner must obtain a real estate salesperson’s license before listing the property.
key: B
explanation: The exemption in Subsection C(1) allows an owner to perform real estate activities on
  their own property without a license, unless the sale is part of a subdivision of 100 or more
  parcels. Selling a single-family home owned by the seller falls within this exemption, so no
  license is required.
citation:
  source: N.M. Stat. Ann. § 61-29 — New Mexico Real Estate Brokers and Salesmen Act, NMSA 1978 §§
    61-29-1 to 61-29-29 — NMREC License Law and Rules book, 2021 web edition — § 61-29-2
  url: null
  quoted_text: (1) A person who as owner performs any of the activities included in this section with
    reference to property owned by the person, except when the sale or offering for sale of the
    property constitutes a subdivision containing one hundred or more parcels;
