stem: Under 16.61.9.8(A), what action must the qualifying broker or broker in charge take within 48
  hours when a broker requests that their license be placed on inactive status?
options:
  - Returning the license to the commission
  - Submitting a renewal application
  - Providing proof of continuing education
  - Notifying the associate broker's clients
key: A
explanation: The rule states that the qualifying broker or broker in charge must return the license
  to the commission within 48 hours of the request for inactive status. The other options describe
  actions not required by this subsection.
