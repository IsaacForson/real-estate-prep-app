stem: Which of the following individuals meets the definition of a 'Broker' under New Mexico rule?
options:
  - A person holding a current New Mexico associate broker license
  - A person holding an inactive New Mexico real estate license
  - A person holding only a real estate license from another state
  - A person who completed prelicensing but has not passed the state exam
key: A
explanation: Under New Mexico rule, a broker is any person holding a current New Mexico associate
  broker's or qualifying broker's real estate license. Therefore, a person holding a current New
  Mexico associate broker license satisfies this definition. A person with an inactive license does
  not hold a current license, and a person who only completed prelicensing or holds only an
  out‑of‑state license lacks the required current New Mexico license.
