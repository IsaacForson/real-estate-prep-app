stem: An applicant who holds a current real estate broker’s license from another state wishes to
  take the New Mexico broker’s examination. According to 16.61.3.9(B)(5), what must they attach to
  their examination application?
options:
  - The applicant must attach a letter of pre‑licensing education waiver from the commission and a
    certificate of completion of the 30‑hour broker basics course.
  - The applicant must attach only a certificate of completion of the 30‑hour broker basics course.
  - The applicant must attach a certified license history and a waiver from taking the national
    portion of the broker’s exam.
  - The applicant must attach proof of completion of the real estate principles and practice and
    real estate law courses from their home state.
key: A
explanation: The rule requires applicants exempted from the principles and practice and law courses
  due to a current out‑of‑state broker license to submit both a commission‑issued pre‑licensing
  education waiver and a certificate of completion of the 30‑hour broker basics course. The other
  options either omit the waiver or include irrelevant documents.
