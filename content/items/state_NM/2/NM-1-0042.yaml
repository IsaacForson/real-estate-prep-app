stem: According to the New Mexico Real Estate Brokers and Salesmen Act, what must a person have to
  lawfully engage in the business of an associate broker in New Mexico?
options:
  - A valid qualifying broker’s license issued by the commission.
  - An associate broker’s license issued by the commission.
  - A real estate salesperson’s license issued by the commission.
  - A case where no license is needed for an employee of a brokerage.
key: B
explanation: The statute defines a license as either a qualifying broker’s license or an associate
  broker’s license issued by the commission. To act as an associate broker, a person must hold an
  associate broker’s license. The other options either describe a qualifying broker’s license, a
  salesperson license (not recognized in this act), or a situation where no license is needed, which
  is incorrect for associate broker activity.
