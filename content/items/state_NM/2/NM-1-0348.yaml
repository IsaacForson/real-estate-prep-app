stem: A qualifying broker wishes to operate under the trade name “Desert Sands Realty” for his
  brokerage. What must he do before using this trade name?
options:
  - File a fictitious name statement with the county clerk instead of the commission.
  - Register the trade name with the commission before using it for brokerage operations.
  - Obtain a separate license for each associate broker who will use the trade name.
  - Use the trade name immediately and notify the commission within ten days of first use.
key: B
explanation: The rule states that prior to using any trade name for the operation of a brokerage,
  the qualifying broker must register that trade name with the commission. Using the name first and
  notifying later violates the prior‑use requirement.
