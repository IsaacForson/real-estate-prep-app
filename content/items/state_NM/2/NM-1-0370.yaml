stem: A broker receives informal notice that their name appears on the certified list and, within 20
  days, mails a certified letter requesting a hearing. What must the commission do before taking any
  action against the broker’s license?
options:
  - A. Commence a formal proceeding immediately
  - B. Schedule a hearing as requested
  - C. Renew the broker’s license automatically
  - D. Close the case without further action
key: B
explanation: The commission may take action only if the broker neither requests a hearing within 20
  days nor provides a statement of compliance within 30 days. Since a hearing request was made
  timely, the commission must schedule that hearing before any action. Commencing a proceeding
  immediately would violate the rule.
