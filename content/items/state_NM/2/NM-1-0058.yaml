stem: Which of the following satisfies the requirement for an 'express written agreement' under New
  Mexico rule?
options:
  - An executed contract for property management services between the parties
  - An oral agreement for property management services between the parties
  - An email confirmation for property management services between the parties
  - An implied agreement for property management services between the parties
key: A
explanation: An express written agreement must be a written agreement signed by all parties
  pertaining to a real estate transaction or the provision of real estate services. An oral
  agreement confirmed by email is not a written agreement signed by all parties, thus it does not
  satisfy the requirement. A signed contract for property management services is a written agreement
  signed by all parties and therefore meets the definition.
