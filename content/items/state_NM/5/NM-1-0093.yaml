stem: A qualifying broker tells a broker verbally that they will represent a seller client as the
  exclusive agent in an upcoming transaction. No written designation is made. Under 16.61.19.8 NMAC,
  is this broker a designated agent?
options:
  - The broker is not a designated agent because the designation must be in writing.
  - The broker is a designated agent because they represent the client exclusively.
  - The broker is not a designated agent because the broker is not the qualifying broker.
  - The broker is a designated agent because the qualifying broker made the designation.
key: A
explanation: A designated agent must be designated in writing by the qualifying broker to represent
  a client as an exclusive agent. A verbal designation does not satisfy the writing requirement, so
  the broker is not a designated agent. The claim that the broker is not a designated agent because
  the broker is not the qualifying broker is incorrect; the writing requirement applies regardless
  of who makes the designation.
