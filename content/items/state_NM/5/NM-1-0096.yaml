stem: A qualifying broker designates a broker in writing to represent a client exclusively in a real
  estate transaction. Under 16.61.19.8, how is this broker classified?
options:
  - An agent who is part of a policy chosen by the qualifying broker that discloses to a client that
    the broker representing them is their only representative.
  - An agent who is part of an express written agreement that modifies existing exclusive agency
    agreements to provide that the brokerage acts as a facilitator.
  - An agent who is designated in writing by their qualifying broker to represent a client
    exclusively in a real estate transaction.
  - An agent who is a qualifying broker, associate broker or brokerage that provides real estate
    services without entering into an agency relationship.
key: C
explanation: The rule defines a designated agent as a broker who is designated in writing by their
  qualifying broker to represent a client exclusively in a real estate transaction. This matches the
  description that the broker is designated in writing by their qualifying broker to represent a
  client exclusively. The other descriptions refer to a policy disclosure about exclusive
  representation, a written agreement modifying exclusive agency to make the brokerage a
  facilitator, and a broker or brokerage providing services without entering into an agency
  relationship; none of these match the definition.
