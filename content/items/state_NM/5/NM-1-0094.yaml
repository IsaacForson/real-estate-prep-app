stem: Under 16.61.19.8, how is a 'custodial account' defined?
options:
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of an owner.
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of a buyer.
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of a tenant.
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of a seller.
key: A
explanation: The rule defines a custodial account as an account at an acceptable financial
  institution established by the qualifying broker to hold money of an owner, which may be
  interest‑bearing. The other options incorrectly describe the account as holding money of a buyer,
  a tenant, or a seller, which is not consistent with the definition.
