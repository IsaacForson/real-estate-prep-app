stem: According to 16.61.19.8 NMAC, what is a 'custodial account'?
options:
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of a tenant.
  - An account at an acceptable financial institution established by the associate broker for the
    purpose of holding money of an owner.
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of a buyer.
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of an owner.
key: D
explanation: The rule defines a custodial account as an account at an acceptable financial
  institution established by the qualifying broker to hold money of an owner. The option stating
  that the account is established by the associate broker for the purpose of holding money of an
  owner incorrectly substitutes associate broker for qualifying broker.
