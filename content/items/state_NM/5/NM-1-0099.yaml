stem: A qualifying broker provides a written designation naming Broker Alex to represent Buyer
  Taylor as their exclusive agent in a purchase transaction. Which statement correctly identifies
  Alex’s role?
options:
  - Alex is a designated agent because they are designated in writing by the qualifying broker to
    represent a client as their exclusive agent
  - Alex is a dual agent because they facilitate transaction for both buyer and seller as defined by
    law
  - Alex is a transaction broker because they provide services without entering into an agency
    relationship under these circumstances
  - Alex is a subagent because they act for the agent in performing functions for the principal in
    this context
key: A
explanation: The definition of "designated agent" in 16.61.19.8 R is a broker who is designated in
  writing by their qualifying broker to represent a client of the brokerage as their exclusive agent
  in a real estate transaction. This exactly matches the scenario. The option stating that Alex is a
  dual agent because they facilitate transaction for both buyer and seller is incorrect because a
  dual agent acts as a facilitator for both parties, not as an exclusive agent for one client.
