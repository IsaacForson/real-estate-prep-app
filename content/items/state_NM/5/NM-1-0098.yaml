stem: A qualifying broker opens an interest‑bearing account at a bank to hold earnest money
  deposited by a seller (the owner) under the broker’s control, with the account titled in the
  seller’s name. How should this account be classified?
options:
  - It is a trust account because it holds money of others received in such a transaction
  - It is a property management trust account because it holds money belonging to others received
    during the management of real property
  - It is a custodial account because it is established by the qualifying broker to hold money of an
    owner in the owner's name under broker's control
  - It is a special trust account because it holds money of a named party to such a transaction
key: C
explanation: Under 16.61.19.8 P, a custodial account is an account at an acceptable financial
  institution established by the qualifying broker to hold money of an owner in the owner’s name
  under the broker’s control, and it may be interest bearing. This matches the scenario where the
  broker opens an interest‑bearing account in the seller’s name to hold the seller’s earnest money.
  The description of a trust account as holding money of others received in a transaction does not
  fit because the funds belong to the owner, not to others generally. The property management trust
  account description applies to funds received during management of real property, which is not the
  case here. The special trust account description applies to money of a named party to a
  transaction, but the rule specifically defines a custodial account for owner’s funds under the
  broker’s control.
