stem: Which of the following best describes a "client" under the New Mexico Real Estate Commission rules?
options:
  - a person who uses real estate services without entering into an express written agreement with a
    brokerage subject to the jurisdiction of the commission
  - a person who is recognized and held responsible by law as the owner of real property, including
    real property held by any legally recognized entity in which the owner has an interest of ten
    percent or more
  - a person who has entered into an express written agreement with a brokerage for real estate
    services subject to the jurisdiction of the commission
  - a person who is a broker designated in writing by their qualifying broker to represent a client
    of the brokerage as their exclusive agent in a real estate transaction
key: C
explanation: The definition of "client" in 16.61.19.8 K states that a client is a person who has
  entered into an express written agreement with a brokerage for real estate services subject to the
  jurisdiction of the commission. This matches the option describing a person who has entered into
  such an express written agreement. The option describing a person recognized as the owner of real
  property does not meet that definition because it lacks the express written agreement.
