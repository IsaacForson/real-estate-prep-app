stem: A qualifying broker receives earnest money from a buyer and deposits it into an account at a
  bank. Under 16.61.19.8, what type of account is this?
options:
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of an owner.
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of others received in a transaction.
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money belonging to others received during the management of real property for
    others.
  - An account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of a named party to a transaction.
key: B
explanation: Earnest money from a buyer is money of others received in a transaction, which the rule
  defines as a trust account. The description of an account for holding an owner’s money does not
  apply, nor do the descriptions for accounts used in property‑management or for a named party to a
  transaction, because earnest money involves neither an owner’s funds, a management relationship,
  nor a specifically named party.
