stem: A licensee enters into an express written agreement to represent a buyer in a residential
  purchase. Under 16.61.19.8 NMAC, how is the buyer classified?
options:
  - The buyer is classified as a principal.
  - The buyer is classified as a party to the transaction.
  - The buyer is classified as a customer.
  - The buyer is classified as a client.
key: D
explanation: Because the buyer has signed an express written agreement with the licensee's
  brokerage, the buyer meets the definition of a 'Client' under subsection K. A 'Customer' lacks
  such an agreement, while 'Party to the transaction' is a broader category that includes both
  clients and customers. 'Principal' refers to someone who authorizes another to act on their
  behalf, which is not the buyer's role in this scenario.
