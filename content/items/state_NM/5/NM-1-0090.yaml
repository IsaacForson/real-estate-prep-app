stem: A qualifying broker designates one broker to represent the buyer exclusively and another to
  represent the seller exclusively in the same transaction, and discloses this arrangement to both
  parties. What is this practice called under 16.61.19.8?
options:
  - A policy whereby the qualifying broker discloses that each broker represents only one client in
    the same transaction
  - A written agreement that modifies existing exclusive agency agreements to have the brokerage act
    as a facilitator for both parties
  - A broker who provides services without entering into an agency relationship
  - A broker designated in writing by the qualifying broker to represent a client exclusively
key: A
explanation: This scenario matches the definition of designated agency, which involves disclosing
  that each broker represents only one client in the same transaction. Under 16.61.19.8 NMAC,
  designated agency is a policy chosen by the qualifying broker of a brokerage that discloses to a
  client that the broker representing them is their only representative in the brokerage. The
  alternative description describes dual agency, where the brokerage acts as a facilitator for both
  parties.
