stem: According to 16.61.19.8 NMAC, what is the definition of a 'Client'?
options:
  - A person who has entered into an express written agreement with a brokerage for real estate
    services subject to the jurisdiction of the commission.
  - A person who uses real estate services without entering into an express written agreement with a
    brokerage subject to the jurisdiction of the commission.
  - A person who is recognized and held responsible by law as the owner of real property, including
    real property held by any legally recognized entity in which the owner has an interest of ten
    percent or more.
  - A broker who is designated in writing by their qualifying broker to represent a client of the
    brokerage as their exclusive agent in a real estate transaction.
key: A
explanation: The definition of 'Client' in subsection K explicitly states that a client is a person
  who has entered into an express written agreement with a brokerage for real estate services
  subject to the commission's jurisdiction. The option describing a person who uses services without
  such an agreement defines a 'Customer', not a client. The other options describe an owner and a
  designated agent, which are distinct terms.
