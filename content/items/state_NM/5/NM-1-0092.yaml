stem: A qualifying broker receives funds from a property owner to hold pending closing and deposits
  the funds into a brokerage trust account titled in the brokerage’s name. According to 16.61.19.8
  NMAC, is this account a custodial account?
options:
  - The account is a custodial account because the qualifying broker holds money for an owner.
  - The account is not a custodial account because the account is not established in the owner’s
    name.
  - The account is a custodial account because the account may be interest bearing.
  - The account is not a custodial account because the money was not received from a tenant.
key: B
explanation: The definition requires the account to be established in the owner’s name under the
  qualifying broker’s control. Placing funds in an account titled in the brokerage’s name fails this
  requirement, so the account is not a custodial account. The option that claims the account is a
  custodial account because it may be interest bearing omits the required owner‑name condition.
