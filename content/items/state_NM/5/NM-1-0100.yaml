stem: A buyer and seller each have exclusive agency agreements with ABC Brokerage. The brokerage
  then enters into an express written agreement to act as a facilitator for both parties in the same
  transaction. How is this relationship classified under 16.61.19.8 NMAC?
options:
  - It is considered a designated agency arrangement.
  - It is considered a transaction broker.
  - It is considered a dual agency arrangement.
  - It is considered a subagency arrangement.
key: C
explanation: Under 16.61.19.8 NMAC, dual agency is defined as an express written agreement that
  modifies existing exclusive agency agreements so the brokerage acts as a facilitator rather than
  as an exclusive agent for either party. The scenario describes exactly such an agreement, making
  it a dual agency. The distractor describing a designated agency is incorrect because designated
  agency requires a written disclosure that each broker represents only one client, not a
  facilitator role for both.
