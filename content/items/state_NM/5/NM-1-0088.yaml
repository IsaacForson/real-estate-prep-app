stem: Under New Mexico rule 16.61.19.8, how is a 'client' defined?
options:
  - A person who has entered into an express written agreement with a brokerage for real estate
    services subject to the jurisdiction of the commission
  - A person who uses real estate services without entering into an express written agreement with a
    brokerage subject to the jurisdiction of the commission
  - A broker who is designated in writing by their qualifying broker to represent a client of the
    brokerage as their exclusive agent in a real estate transaction
  - A policy whereby the qualifying broker discloses that a broker representing a client is that
    client's only representative in the brokerage
key: A
explanation: The rule defines a client as a person who has entered into an express written agreement
  with a brokerage for real estate services subject to the commission’s jurisdiction. This matches
  the option stating that a person has such an express written agreement. The alternative describing
  a person who uses services without an express written agreement describes a customer, not a
  client.
