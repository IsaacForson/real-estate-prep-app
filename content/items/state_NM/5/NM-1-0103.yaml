stem: A qualifying broker opens an account at a bank, places the account in the owner's name, and
  uses it to hold money received from that owner for a property sale. Under 16.61.19.8 NMAC, what
  type of account is this?
options:
  - The account is considered a custodial account for the brokerage.
  - The account is considered a special trust account for the brokerage.
  - The account is considered a property management trust account for the brokerage.
  - The account is considered a trust account for the brokerage.
key: A
explanation: Subsection P defines a custodial account as an account at an acceptable financial
  institution established by the qualifying broker for the purpose of holding money of an owner,
  established in the owner's name under the broker's control, which matches the scenario exactly. A
  trust account is a broader category that includes other types of accounts, while special trust and
  property management trust accounts serve different purposes not described here.
