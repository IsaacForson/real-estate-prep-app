stem: Under 16.61.24.9 NMAC, what is the minimum continuing education requirement for an associate
  broker who offers property management services each three-year licensing cycle?
options:
  - Twelve hours of approved continuing education in property management
  - Six hours of approved continuing education in property management
  - Twenty-four hours of approved continuing education in property management
  - No continuing education is required for property management services
key: B
explanation: The rule states that an associate broker must complete a minimum of six hours of
  approved continuing education courses in property management each three-year licensing cycle. The
  twelve‑hour option applies to qualifying brokers, not associate brokers.
