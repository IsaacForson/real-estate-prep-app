stem: A brokerage receives earnest money from a buyer on Monday. The written agreement between the
  parties states that earnest money shall be deposited within two business days. The brokerage
  deposits the funds on Wednesday. Under 16.61.23.11 NMAC, is this deposit compliant?
options:
  - The deposit is noncompliant because the deposit was made more than 24 hours after receipt
  - The deposit is compliant because the deposit was made per the written agreement of the parties
  - The deposit is compliant because funds were deposited as soon as reasonably possible after
    receipt
  - The deposit is noncompliant because funds must be deposited the same day they are received
key: B
explanation: The rule requires deposit per written agreement of the parties. Since the written
  agreement allowed up to two business days and the deposit was made on Wednesday (the second
  business day), the deposit complies. The claim that the deposit is noncompliant because it was
  made more than 24 hours after receipt incorrectly imposes a same‑day requirement not in the rule.
  The claim that the deposit is compliant because funds were deposited as soon as reasonably
  possible after receipt adds a 24‑hour limit not present. The claim that the deposit is
  noncompliant because funds must be deposited the same day they are received invokes the “as soon
  as reasonably possible” standard, which is superseded by the specific written agreement.
