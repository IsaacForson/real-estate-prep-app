stem: An associate broker commits an unlawful act under the Real Estate Brokers and Salesmen Act,
  and the qualifying broker was unaware of the act. Under 61-29-12 NMSA 1978, what must be shown
  before the qualifying broker's own license can be revoked for that act?
options:
  - That the qualifying broker had guilty knowledge
  - That the associate broker was newly licensed
  - That the brokerage lacked a written office policy
  - That the act occurred inside the brokerage office
key: A
explanation: The statute provides that an unlawful act by an associate broker is not cause for
  revoking the qualifying broker's license unless the commission finds the qualifying broker had
  guilty knowledge of the violation.
citation:
  source: N.M. Stat. Ann. § 61-29-12
  url: null
  quoted_text: An unlawful act or violation of Chapter 61, Article 29 NMSA 1978 by an associate
    broker, employee, partner or associate of a qualifying broker shall not be cause for the
    revocation  of a license of the qualifying  broker unless it appears to the satisfaction  of the
    commission  that the qualifying broker had guilty knowledge of  the unlawful  act or violation.
