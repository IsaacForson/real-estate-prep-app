stem: After closing, a broker delays giving one party a signed copy of the purchase agreement for
  several weeks with no explanation. Under 16.61.33.9 NMAC, does this delay meet the broker's
  delivery duty?
options:
  - No, but that rule applies to commercial deals
  - Yes, delivery timing is left to broker discretion
  - Yes, as long as the closing itself occurred on time and place
  - No, copies have to be given as soon as practicable
key: D
explanation: The rule makes each broker responsible for assuring that parties receive legible copies
  of documents they signed as soon as practicably possible.
