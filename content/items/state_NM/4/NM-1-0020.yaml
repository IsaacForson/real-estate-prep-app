stem: A brokerage's existing exclusive seller agency agreement is later modified so the brokerage
  will act as a facilitator for both the buyer and seller in one transaction. Under 16.61.19.9 NMAC,
  which brokerage relationship results from this modification?
options:
  - Exclusive agency arrangement
  - Dual agency arrangement
  - Subagency arrangement
  - Property management arrangement
key: B
explanation: The rule defines dual agency as an express written agreement that modifies existing
  exclusive agency agreements so the brokerage acts as a facilitator rather than as an exclusive
  agent for either party.
