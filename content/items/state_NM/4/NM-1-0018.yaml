stem: A licensee pays part of a commission to an unlicensed referral source without obtaining the
  principal's written consent. Under 61-29-12 NMSA 1978, how does this conduct affect the licensee's
  license?
options:
  - It is permitted for small referral fees
  - It is allowed if the principal later learns of it
  - It is permitted between licensees of any state
  - It is grounds for discipline against the license
key: D
explanation: The statute makes it a ground for discipline to pay or receive a rebate, profit, or
  commission to or from an unlicensed person except the principal, and then only with the
  principal's written consent.
