stem: Under the New Mexico Real Estate Commission rules, what is the minimum total number of points
  an applicant must document for qualifying transactional experience to be eligible for a qualifying
  broker license?
options:
  - 50 points
  - 75 points
  - 100 points
  - 125 points
key: C
explanation: The rule explicitly states that documented qualifying transactional experience must
  total 100 points, with at least one transaction in each of the four years preceding the
  application. Therefore, 100 points is the required minimum. The distractor of 75 points might be
  mistakenly recalled as half the requirement, but the rule sets the threshold at 100 points.
