stem: According to 16.61.1.7 NMAC, what is a 'Brokerage trust account'?
options:
  - an account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding earnest money deposits only
  - an account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money belonging to others received during a real estate sales transaction
  - an account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding money of an owner
  - an account at an acceptable financial institution established by the qualifying broker for the
    purpose of holding commission advances
key: B
explanation: A brokerage trust account is defined in 16.61.1.7.H NMAC as an account at an acceptable
  financial institution established by the qualifying broker to hold money belonging to others that
  is received during a real estate sales transaction. The option that limits the account to earnest
  money deposits only is too narrow and therefore incorrect. The option that states the account
  holds money of an owner is incorrect because the definition requires the money to belong to
  others, not the owner. The option that states the account holds commission advances is incorrect
  because commission advances are not included in the definition. Only the option that states the
  account holds money belonging to others received during a real estate sales transaction matches
  the definition.
