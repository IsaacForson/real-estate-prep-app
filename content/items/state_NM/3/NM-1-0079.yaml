stem: A provider submits a proposal for a new continuing education course that includes a statement
  of educational objective, a benefit statement, a detailed cost analysis, and a list of instructors
  with their credentials, but omits the detailed course outline, number of educational hours, length
  of course, schedule of instruction, location, and anticipated number of participants. Which
  required element is missing according to 16.61.14.10 NMAC?
options:
  - A statement of how the program will benefit associate brokers, qualifying brokers, or the public
    who may engage with the offered education or research and may submit feedback to the commission
  - A list of instructors who may be used and their credentials, including professional
    certifications, years of experience, and teaching evaluations
  - A detailed cost analysis of the entire course or project including source(s) of other funding,
    advertising costs, instructor fees, materials, and facility expenses
  - A detailed course outline, the number of educational hours, length of course, schedule of
    instruction, location, and anticipated number of participants
key: D
explanation: The rule states that, when applicable, a proposal must contain a detailed course
  outline, the number of educational hours, length of course, schedule of instruction, location, and
  anticipated number of participants (16.61.14.10 NMAC). The provider’s submission omitted all of
  these items, making the proposal incomplete. The option that describes a benefit statement for
  associate brokers, qualifying brokers, or the public who may engage with the education or research
  and may submit feedback to the commission is present in the scenario, so it is not the missing
  element.
