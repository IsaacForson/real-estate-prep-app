stem: A homeowner personally sells one parcel of land that they own, without a subdivision involved.
  Under 61-29-2 NMSA 1978, does this owner need a real estate license for the sale?
options:
  - No, but a lawyer should review the sale details
  - No, owners selling their own property are exempt
  - Yes, a license is required for every single sale
  - Yes, unless the buyer is a close family relative here
key: B
explanation: The statute exempts an owner who performs listed activities regarding property the
  owner holds, unless the sale involves a subdivision of one hundred or more parcels.
citation:
  source: N.M. Stat. Ann. § 61-29-2
  url: null
  quoted_text: A person who as owner performs any of the activities included in this section with
    reference to property owned by the person, except when the sale or offering for sale of the
    property constitutes a subdivision containing one hundred or more parcels
