stem: A qualifying broker manages a rental property under a written management agreement that lasts
  18 months. After the agreement ends, how long must the qualifying broker retain the transaction
  records for that property under 16.61.16.9 NMAC?
options:
  - 18 months
  - 54 months
  - 78 months
  - 90 months
key: D
explanation: For property management, records must be kept for the full term of the agreement plus
  six years from termination. Eighteen months plus six years (72 months) equals ninety months total
  retention.
citation:
  source: "### 16.61 NMAC — New Mexico Real Estate Commission Rules, 16.61 NMAC (Title 16, Chapter 61)
    — NMREC License Law and Rules book, 2021 web edition — § 16.61.16.9"
  url: null
  quoted_text: Maintain all transaction records for six years if not performing property management,
    and for the full term of the assignment if performing property management.
