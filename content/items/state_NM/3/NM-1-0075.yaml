stem: A qualifying broker receives an earnest money deposit from a buyer and deposits it into an
  account at an acceptable financial institution established by the broker for that purpose. Under
  16.61.1.7 NMAC, how should this account be classified?
options:
  - It is a custodial account because it holds money of an owner and may be interest bearing
  - It is a brokerage trust account because it holds money belonging to others received in a sales
    transaction
  - It is an escrow account not defined in the rule but sometimes used in practice for holding funds
  - It is a property management trust account established for holding owners' funds and may be
    interest bearing
key: B
explanation: Earnest money deposit is money belonging to others (the buyer) received during a sales
  transaction, which fits the definition of a brokerage trust account. Under 16.61.1.7.H, a
  brokerage trust account is defined as an account at an acceptable financial institution
  established by the qualifying broker for the purpose of holding money belonging to others received
  during a real estate sales transaction. The description of a custodial account, which holds money
  of an owner, does not apply. The descriptions of an escrow account not defined in the rule and a
  property management trust account for owners' funds also do not apply.
