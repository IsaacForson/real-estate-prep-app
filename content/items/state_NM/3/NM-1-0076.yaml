stem: A qualifying broker wants to have one associate broker represent a buyer client exclusively
  and another associate broker represent a seller client exclusively in the same transaction. Under
  16.61.1.7 NMAC, is this permitted?
options:
  - It is not permitted because designated agent means the brokerage acts as facilitator for both
    parties
  - It is not permitted because a broker can only represent one party in any transaction
  - It is permitted if the qualifying broker adopts a designated agency policy and discloses it to
    the clients
  - It is permitted only if the associate brokers are also qualifying brokers
key: C
explanation: "Under 16.61.1.7 NMAC, a qualifying broker may designate one associate broker to act as
  the buyer's exclusive agent and another associate broker to act as the seller's exclusive agent in
  the same transaction, provided the brokerage has a written designated agency policy and discloses
  that policy to both clients. This allows each associate broker to represent a single party while
  the brokerage facilitates the transaction. The other statements are incorrect: designated agency
  does not turn the brokerage into a facilitator, a broker can represent more than one party when
  using designated agency, and the associate brokers do not need to be qualifying brokers."
