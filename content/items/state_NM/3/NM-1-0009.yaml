stem: An associate broker violates commission rules without the qualifying broker's awareness. Under
  16.61.16.10 NMAC, what determines whether the qualifying broker's own license may be suspended or
  revoked for that violation?
options:
  - Whether the brokerage carries excess insurance
  - Whether the violation occurred during business hours
  - Whether the associate broker is a new licensee
  - Whether the qualifying broker had guilty knowledge
key: D
explanation: The rule provides that a licensee's violation is not cause for suspension or revocation
  of the qualifying broker's license unless the qualifying broker had guilty knowledge of the act.
