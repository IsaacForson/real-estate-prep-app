stem: If the beneficiary of an earnest money deposit agrees in writing, what may the listing or
  selling broker do with interest earned on the broker's escrow/trust account holding the earnest
  money, per 876 IAC 8-2-2(c)?
options:
  - May transfer interest to an affordable housing fund meeting IRS 501(c)(3)
  - May deposit the interest into the broker's operating account
  - May retain the interest as additional commission for the brokerage
  - May remit the interest to the Indiana Real Estate Commission
key: A
explanation: Under 876 IAC 8-2-2(c), when the beneficiary agrees in writing, the broker may
  voluntarily transfer interest earned on the escrow/trust account to a fund established for the
  sole purpose of providing affordable housing opportunities in Indiana that meets the requirements
  of Internal Revenue Code 501(c)(3). The rule does not permit the broker to deposit the interest
  into an operating account, retain it as additional commission, or remit it to the Indiana Real
  Estate Commission.
