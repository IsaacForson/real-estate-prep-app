stem: Under Indiana Administrative Code 8-1-2, what must a broker company do before opening a branch
  office?
options:
  - Obtain a managing broker license from the commission
  - Notify the commission of a new branch manager
  - Submit a Branch Office Registration Form to the commission
  - Pay the reassignment fee established in 876 IAC 5-3-1
