stem: A broker ends their association with a broker company. Per 876 IAC 8-1-4, within how many
  business days must the broker submit a reassignment application to the Indiana Real Estate
  Commission?
options:
  - Within ten (10) business days
  - Within fifteen (15) business days
  - Within five (5) business days
  - Within thirty (30) days
key: C
explanation: The rule mandates that a broker must submit a reassignment application to the
  commission within five (5) business days of terminating association with a broker company. Options
  specifying ten or fifteen days exceed the required timeframe, and thirty days is not mentioned in
  the rule.
citation:
  source: 876 Ind. Admin. Code 8 — 876 IAC Article 8 — Article 8 (Indiana Real Estate Commission
    rules; official iac.iga.in.gov 2024 edition PDF read via Internet Archive capture of 2024-02-14
    because iga.in.gov now serves the IAC only through a JavaScript app and in.gov refuses
    connections from this environment) — § 8-1-4
  url: null
  quoted_text: Any broker, upon termination of the broker's association with a broker company, shall
    submit to the commission within five (5) business days of the termination, a reassignment
    application attesting to the termination and electing either to be unassigned or to be assigned
    to a new broker company.
