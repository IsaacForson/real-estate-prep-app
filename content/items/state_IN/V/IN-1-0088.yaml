stem: A person who has just obtained an Indiana broker license wishes to be employed by a broker
  company. According to 876 IAC 8-1-3, what must occur for the broker to be assigned to that
  company?
options:
  - Submit a reassignment application signed by the broker
  - Have the licensure application signed by the managing broker
  - Pay the reassignment fee set forth in 876 IAC 5-3-1
  - Notify the commission of a change in branch manager
key: B
explanation: The rule states that if a newly licensed broker wishes to be assigned, the broker's
  licensure application must be signed by the broker company's managing broker attesting to the
  assignment. Submitting a reassignment application applies only when an unassigned broker later
  seeks assignment, not at initial licensure.
