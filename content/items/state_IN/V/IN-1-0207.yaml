stem: After a failed closing, the broker notifies buyer and seller by certified mail that the
  earnest money will be released to the seller. Neither party initiates litigation or enters a
  written release within sixty days. According to 876 IAC 8-2-2, what may the broker do?
options:
  - Release the earnest money to the seller as identified in the certified letter
  - Return the earnest money to the buyer because the transaction failed
  - Hold the earnest money indefinitely until a court order is issued
  - Deposit the earnest money into the state affordable housing fund
key: A
explanation: Subsection (d) provides that if neither the buyer nor the seller initiates litigation
  or enters a written release within sixty days of the mailing date of the certified letter, the
  broker may release the earnest money deposit to the party identified in the certified letter.
  Therefore, the broker may release the funds to the seller as named in the letter. The distractor
  suggesting a mandatory return to the buyer is not supported; the rule permits release per the
  letter's direction.
