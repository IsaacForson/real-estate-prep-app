stem: A buyer offers to pay the earnest money deposit with a promissory note. According to 876 IAC
  8-2-2, what must the listing broker do before the seller accepts the offer?
options:
  - Depositing the note into the escrow account without delay
  - Notifying seller deposit not cash, check, or equivalent
  - Showing the deposit form in the earnest money receipt promptly
  - Obtaining a written release from the buyer promptly
key: B
explanation: Under 876 IAC 8-2-2, the listing broker must inform the seller that the earnest money
  is not cash, a check, or its equivalent before the seller accepts the offer. Simply showing the
  deposit form in the earnest money receipt or obtaining a release from the buyer does not satisfy
  the pre‑acceptance notification requirement.
