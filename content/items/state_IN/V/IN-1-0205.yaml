stem: According to 876 IAC 8-1-3, how is an inactive broker who reactivates the license treated?
options:
  - Is automatically assigned to the broker company where last active
  - Is required to complete additional continuing education before reactivation
  - Is placed in referral status until a managing broker signs the application
  - Is treated as a newly licensed broker choosing unassigned or assigned
key: D
explanation: Subsection (d) states that an inactive broker who reactivates the license shall be
  treated in the same manner provided for in subsections (a) through (c), which cover the choices of
  being unassigned or assigned upon licensure. Therefore, the broker is treated as a newly licensed
  broker choosing unassigned or assigned. The distractor about additional continuing education is
  not mentioned in the rule for reactivation.
