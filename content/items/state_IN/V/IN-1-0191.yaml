stem: A broker serves as branch manager for two different branch offices of the same broker company.
  Per 876 IAC § 8-1-2, is this permissible?
options:
  - Limited to one branch office
  - Only if offices are in different counties
  - Permitted to manage more than one office
  - Requires an additional fee
key: C
explanation: The rule explicitly states that an individual broker may be a branch manager of more
  than one branch office under this section. Therefore serving as branch manager for two offices is
  allowed. The distractor suggesting a limit to one branch office contradicts the permissive
  language of the rule.
