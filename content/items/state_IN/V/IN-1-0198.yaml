stem: According to 876 IAC 8-1-2(b), what is permissible regarding an individual broker serving as a
  branch manager?
options:
  - May be the managing broker of the broker company
  - May be employed full‑time at the branch office
  - May manage only one branch office at a time
  - May manage more than one branch office
key: D
explanation: 876 IAC 8-1-2(b) explicitly states that an individual broker may be a branch manager of
  more than one branch office. Therefore, the option stating that a broker may manage more than one
  branch office is correct. The option limiting the broker to managing only one branch office at a
  time is incorrect because it contradicts the rule.
