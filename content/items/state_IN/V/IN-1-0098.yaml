stem: A broker company’s branch office in Fort Wayne appoints a new branch manager. According to 876
  IAC 8-1-2, what action must the broker company take regarding the Indiana Real Estate Commission?
options:
  - Filing a reassignment application with signatures
  - Waiting to report the change at renewal
  - Submitting a new branch office registration
  - Notifying the commission of the new manager
key: D
explanation: The rule requires the broker company to notify the commission when a branch office has
  a new branch manager. The correct option states that the company must notify the commission of the
  new manager. Filing a reassignment application with signatures is required upon termination of
  association, not for a branch manager change. Waiting to report the change at renewal is not
  sufficient; the notice must be given promptly. Submitting a new branch office registration is not
  required when only the manager changes.
