stem: If no material changes have occurred to the property after the disclosure form is completed,
  what may the seller do at settlement according to 876 IAC 9-1-2?
options:
  - Submitting a new disclosure form to the buyer at settlement
  - Obtaining a home inspection for the buyer before closing
  - Paying a fee to the Indiana Real Estate Commission as required
  - Certifying that the property’s condition is substantially unchanged
key: D
explanation: The rule allows the seller to certify at settlement that the property's condition is
  substantially the same as when the disclosure form was provided if no material changes have
  occurred. Therefore certifying that the condition is substantially unchanged is permitted.
  Submitting a new disclosure form is not required when the condition is unchanged.
citation:
  source: 876 Ind. Admin. Code 9 § 876
  url: null
  quoted_text: At or before settlement, the owner is required to disclose any material change in the
    physical condition of the property or certify to the purchaser at settlement that the condition
    of the property is substantially the same as it was when the disclosure form was provided.
