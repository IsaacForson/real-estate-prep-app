stem: A buyer and seller agree in writing that any interest earned on the earnest money deposit may
  be transferred to an affordable housing fund. Under 876 IAC 8-2-2(c), what may the listing or
  selling broker do with the interest earned?
options:
  - The broker may transfer the interest earned to an affordable housing fund that meets IRS
    501(c)(3) requirements
  - The broker must remit the interest earned to the buyer at the time of closing before any
    disbursement is made
  - The broker must retain the interest earned in the escrow account until the transaction is
    disbursed
  - The broker may keep the interest earned as additional compensation for the brokerage firm
key: A
explanation: The rule states that if the beneficiary agrees in writing, the broker may voluntarily
  transfer any interest earned on the earnest money to an affordable housing fund meeting IRS
  501(c)(3) requirements. Therefore, the broker may transfer the interest as described. The
  distractor that the broker must remit the interest to the buyer is incorrect because the rule does
  not require remittance to the buyer; it permits transfer to the fund upon written agreement.
citation:
  source: 876 Ind. Admin. Code 8 — 876 IAC Article 8 — Article 8 (Indiana Real Estate Commission
    rules; official iac.iga.in.gov 2024 edition PDF read via Internet Archive capture of 2024-02-14
    because iga.in.gov now serves the IAC only through a JavaScript app and in.gov refuses
    connections from this environment) — § 8-2-2
  url: null
  quoted_text: If the beneficiary agrees in writing, the listing or selling broker holding the earnest
    money may voluntarily transfer any interest earned on the broker's escrow/trust account to a
    fund established for the sole purpose of providing affordable housing opportunities in Indiana
    that meets the requirements of Internal Revenue Code 501(c)(3).
