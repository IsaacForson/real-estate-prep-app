stem: Under 876 IAC 8-2-3, for how long must the listing and selling broker retain copies of the
  closing statement?
options:
  - Two (2) years.
  - Three (3) years.
  - Five (5) years.
  - Seven (7) years.
key: C
explanation: The rule states that the listing and selling broker shall retain copies of the closing
  statement for at least five (5) years. This makes the five‑year period the correct answer. The
  three‑year option is a common misconception but does not match the required retention length.
