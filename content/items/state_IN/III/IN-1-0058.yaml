    connections from this environment) — § 8-2-3
  url: null
  quoted_text: Every listing and selling broker shall deliver to the broker's client in every real
    estate transaction at the time such transaction is consummated, a complete detailed closing
    statement showing all of the receipts and disbursements handled by such broker.
