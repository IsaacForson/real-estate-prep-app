stem: Under 876 IAC 8-2-3, what must a listing and selling broker deliver to the broker's client at
  the time a real estate transaction is consummated?
options:
  - A summary of the purchase price, financing terms, and closing costs provided to the client
  - A complete detailed closing statement showing all of the receipts and disbursements handled by
    the broker
  - A copy of the signed purchase agreement accompanied by the property disclosure form
  - A list of outstanding property tax liens, utility bills, and homeowners association dues
key: B
explanation: The rule requires the broker to deliver a complete detailed closing statement showing
  all receipts and disbursements handled by the broker. The other options omit required details or
  add unrelated documents.
citation:
