stem: Under 876 IAC 8-1-4, within what time must a broker submit a reassignment application after
  leaving a broker company?
options:
  - Fifteen calendar days of the termination
  - Thirty calendar days of the termination
  - Five business days of the termination
  - Ten business days of the new assignment
key: C
explanation: 876 IAC 8-1-4 requires a broker who terminates association with a broker company to
  submit a reassignment application to the commission within five business days of the termination,
  electing to be unassigned or assigned to a new broker company.
citation:
  source: 876 Ind. Admin. Code § 8-1-4
  url: null
  quoted_text: Any broker, upon termination of the broker's association with a broker company, shall
    submit to the commission within five (5) business days of the termination, a reassignment
    application attesting to the termination and electing either to be unassigned or to be assigned
    to a new broker company.
