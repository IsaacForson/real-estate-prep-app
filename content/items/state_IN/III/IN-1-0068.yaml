stem: A seller knows that a recent addition to the property may require improvements to the sewage
  disposal system but the improvements have not yet been completed. Under 876 IAC 9-1-2, what
  specific information must the seller provide regarding those improvements?
options:
  - The seller must provide the cost of the improvements
  - The seller must state whether improvements are completed
  - The seller must disclose the date the addition was built
  - The seller must name the contractor for improvements
key: B
explanation: The form explicitly asks whether any required improvements to the sewage disposal
  system have been completed when an addition may necessitate them. Providing cost, contractor name,
  or addition date is not required by the disclosure form. The seller must answer the completion
  question based on their knowledge.
