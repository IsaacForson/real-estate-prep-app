stem: A listing broker cannot personally attend a residential closing covered by the attendance
  requirement. Under 876 IAC 8-2-4, what may the broker do instead?
options:
  - Cancel the closing until available
  - Send an associated broker to act instead
  - Ask the buyer's broker to represent both sides
  - Postpone the closing by thirty days
key: B
explanation: 876 IAC 8-2-4 allows the listing or selling broker, instead of personally attending, to
  send an associated broker or designate another broker to act on the broker's behalf at the
  closing.
