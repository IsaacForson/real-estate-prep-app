stem: Under 876 IAC 9-1-2, who is required to complete and sign the residential real estate sales
  disclosure form?
options:
  - The buyer's agent
  - The closing attorney
  - The property owner
  - The listing broker
key: C
explanation: The rule states that 'An owner must complete and sign the disclosure form and submit
  the form to a prospective buyer before an offer is accepted for the sale of the real estate.'
  Therefore, the property owner (seller) must complete and sign the form. The listing broker is not
  required to complete the form; the form represents the owner's knowledge, not the agent's.
