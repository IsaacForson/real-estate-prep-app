stem: A buyer offers earnest money in the form of a promissory note. Under 876 IAC 8-2-2, what must
  the listing broker do before the seller accepts the offer?
options:
  - The broker must deposit the promissory note into the escrow account immediately upon receipt
  - The broker must show the earnest money receipt after the seller has accepted the offer
  - The broker must obtain a written release from the seller accepting the non‑cash earnest money
    before proceeding
  - The broker must communicate to the seller that the deposit is not cash, check, or its equivalent
    before the seller's acceptance
key: D
explanation: The rule states that if the earnest money deposit is other than cash, check, or its
  equivalent, the fact must be communicated to the seller before the seller's acceptance and shown
  in the earnest money receipt. Therefore, the broker must inform the seller beforehand. The other
  options either mistime the disclosure or impose unnecessary steps.
citation:
  source: 876 Ind. Admin. Code 8 — 876 IAC Article 8 — Article 8 (Indiana Real Estate Commission
    rules; official iac.iga.in.gov 2024 edition PDF read via Internet Archive capture of 2024-02-14
    because iga.in.gov now serves the IAC only through a JavaScript app and in.gov refuses
    connections from this environment) — § 8-2-2
  url: null
  quoted_text: "(b) If the earnest money deposit is other than cash, check, or its equivalent, this
    fact shall be: (1) communicated to the seller before the seller's acceptance of the offer to
    purchase; and (2) shown in the earnest money receipt."
