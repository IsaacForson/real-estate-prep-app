stem: A broker places an online advertisement that includes the broker company's name but is created
  and posted solely by the broker without oversight from the broker company. Under 876 IAC 8-1-8, is
  this advertisement permissible?
options:
  - Yes, because the broker company's name is present in the advertisement.
  - No, because advertising must be under the direct supervision of the broker company.
  - Yes, as long as the advertisement contains no false or misleading information.
  - No, because online advertisements are exempt from supervision requirements.
key: B
explanation: The rule requires all advertising to be under the direct supervision and in the name of
  the broker company. Since the advertisement lacks supervision, it is not permissible. The option
  that focuses only on the presence of the company name is incorrect because supervision is also
  required.
