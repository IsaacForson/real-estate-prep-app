stem: A seller receives a purchase offer on May 10 and accepts the offer on May 12. The seller
  completes and submits the residential sales disclosure form to the buyer on May 15. According to
  876 IAC 9-1-2, is the seller's action compliant?
options:
  - No, because the form must be submitted before the offer is accepted
  - Yes, as long as the form is submitted before settlement
  - No, because the form must be notarized before submission
  - Yes, because the form was submitted before closing
key: A
explanation: The rule requires the owner to complete and sign the disclosure form and submit it to a
  prospective buyer before an offer is accepted. Submitting the form after the offer has been
  accepted violates this requirement. The form does not need to be notarized, and submission before
  closing or settlement does not satisfy the timing rule.
