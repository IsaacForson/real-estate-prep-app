stem: A real estate transaction fails to close, and the buyer and seller disagree about who should
  receive the earnest money. Under 876 IAC 8-2-2, when is the broker holding the funds required to
  make payment, apart from the certified-mail release process?
options:
  - Within thirty days of the failed closing
  - Immediately once either party demands it
  - After a mutual release or court order
  - As soon as the listing agreement expires
key: C
explanation: 876 IAC 8-2-2 provides that a broker holding earnest money is not required to pay the
  purchaser or seller when a transaction is not consummated unless the parties sign a mutual release
  or a court orders payment.
citation:
  source: 876 Ind. Admin. Code § 8-2-2
  url: null
  quoted_text: The listing or selling brokers holding any earnest money are not required to make
    payment to the purchasers or sellers when a real estate transaction is not consummated unless
    the parties enter into a mutual release of the funds or a court issues an order for payment
