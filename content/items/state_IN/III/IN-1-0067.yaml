stem: A seller knows that radon gas is present in the basement but answers 'No' to the hazardous
  conditions question on the residential sales disclosure form. Under 876 IAC 9-1-2, what is the
  seller's action?
options:
  - The seller must withhold disclosure of radon gas
  - The seller must leave the question blank if uncertain
  - The seller must assume the form is compliant without changes
  - The seller must disclose the known hazardous condition
key: D
explanation: The seller must disclose any known hazardous condition because the form must reflect
  the seller's current actual knowledge. Leaving the question blank or withholding information
  contradicts the requirement to provide correct information. Assuming compliance without changes
  ignores the duty to update the form for known issues.
