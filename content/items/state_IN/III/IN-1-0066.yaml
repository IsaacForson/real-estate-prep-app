stem: Under 876 IAC 9-1-2, what must the owner do at or before settlement if there is a material
  change in the property's physical condition?
options:
  - The seller must wait until after closing to inform the purchaser
  - The seller must certify condition is substantially same
  - The seller must disclose the material change to the purchaser
  - The seller must disregard the change if it is minor
key: C
explanation: The rule requires the owner to disclose any material change in the property's physical
  condition at or before settlement. Waiting until after closing fails to meet this timing
  requirement. Certifying that the condition is substantially the same is only permissible when no
  material change has occurred. Disregarding the change violates the disclosure obligation.
