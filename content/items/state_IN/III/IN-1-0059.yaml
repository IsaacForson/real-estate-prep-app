stem: A broker places a billboard advertisement that displays only the broker's personal name and
  telephone number, without the name of the broker company. Under 876 IAC 8-1-8, is this
  advertisement permissible?
options:
  - The advertisement is permissible because billboard advertising is exempt from broker company
    name requirements
  - The advertisement is permissible because it includes the broker's personal name and telephone
    number
  - The advertisement is permissible because the broker's telephone number satisfies the
    identification requirement
  - The advertisement is not permissible because it fails to include the broker company's name as
    required
key: D
explanation: The rule requires any display that carries a broker's name to also contain the broker
  company's name clearly visible. Since the billboard omits the broker company name, it is not
  permissible. The other options incorrectly claim exemptions or sufficiency of personal contact
  information.
