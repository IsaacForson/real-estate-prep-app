    connections from this environment) — § 8-1-8
  url: null
  quoted_text: (a) Any display, classified advertising, signs, Internet advertising, or business cards
    that carry a broker's name must contain the name of the broker company with whom the broker is
    associated, and said broker company's name must be clearly visible.
