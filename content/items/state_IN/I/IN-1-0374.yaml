stem: A broker company enters into a transaction where the buyer provides the earnest money deposit
  via a cashier's check. The purchase agreement is silent on who receives the deposit. According to
  876 IAC 8-2-2(a), where must the listing broker deposit the money?
options:
  - Into the listing broker's escrow/trust account
  - Into a joint account held by the buyer and seller
  - Into the seller's personal checking account
  - Into the buyer's personal checking account
key: A
explanation: Section 8-2-2(a)(1) requires the listing broker to deposit all money received in
  connection with a transaction in the listing broker's escrow/trust account unless the purchase
  agreement indicates otherwise. Since the agreement is silent, the default rule applies.
