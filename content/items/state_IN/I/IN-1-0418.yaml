stem: Under 876 IAC 5-1-1, which type of conduct is listed as a ground for disciplinary action
  against a broker?
options:
  - Dishonest, fraudulent, or criminal activities
  - Failure to file state tax returns
  - Providing marketing materials without approval
  - Operating without a designated managing broker
key: A
explanation: Section 5-1-1 states that the commission disciplines brokers who engage in dishonest,
  fraudulent, or criminal activities. Therefore, that conduct is a ground for discipline. The other
  options are not mentioned as disciplinary grounds in the cited provision.
