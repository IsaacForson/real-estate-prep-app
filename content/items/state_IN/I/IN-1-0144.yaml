stem: A managing broker of a broker company also serves as branch manager for a branch office of the
  same broker company located at a different address. According to 876 IAC 8-1-1(c), is this
  permissible?
options:
  - Yes, because the managing broker may also be a branch manager under section 2 of this rule.
  - Yes, but only if the branch office is located at the same address as the broker company.
  - Yes, provided the managing broker obtains written approval from the commission.
  - Yes, as long as the branch manager holds a separate managing broker license.
key: A
explanation: The rule permits a managing broker to also serve as a branch manager under section 2 of
  this rule, so the scenario is allowed. The distractor incorrectly adds a same‑address requirement
  that is not present in the rule.
