stem: A listing broker receives final acceptance of an offer to purchase on Tuesday, April 2. The
  following Wednesday, April 3, is a bank holiday, and Thursday, April 4, is also a bank holiday.
  Assuming the next two banking days after acceptance are Friday, April 5 and Monday, April 8, by
  what date must the broker deposit the earnest money received in connection with the transaction?
options:
  - April 8
  - April 5
  - April 4
  - April 9
key: A
explanation: According to 876 IAC 8-2-2(a), the broker must deposit the earnest money on or before
  the next two banking days after final acceptance. Since April 3 and April 4 are holidays
  (non‑banking days), the first banking day is April 5 and the second is April 8. Thus the latest
  permissible deposit date is April 8. The other options either represent only the first banking
  day, a date after the second banking day, or a holiday.
citation:
