    because iga.in.gov now serves the IAC only through a JavaScript app and in.gov refuses
    connections from this environment) — § 8-2-2(a)
  url: null
  quoted_text: "The listing broker shall, on or before the next two (2) banking days after final
    acceptance of the offer to purchase, do one (1) of the following:"
  secondary: []
math:
  worked_solution: |-
    Step 1: Acceptance date is Tuesday, April 2.
    Step 2: Identify banking days (days when banks are open).
    Step 3: Wednesday, April 3 is a bank holiday → not a banking day.
    Step 4: Thursday, April 4 is a bank holiday → not a banking day.
    Step 5: Friday, April 5 is a banking day → first banking day.
    Step 6: Saturday, April 6 and Sunday, April 7 are weekends → not banking days.
    Step 7: Monday, April 8 is a banking day → second banking day.
    Step 8: Therefore, the broker must deposit the earnest money on or before Monday, April 8.
  formulas:
    - Deposit date = acceptance date + number of calendar days needed to accumulate two banking
      days, skipping non‑banking days
