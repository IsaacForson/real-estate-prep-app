stem: The managing broker of a broker company is notified that a state attorney general's
  investigator seeks a detailed summary of the company's escrow/trust account for investigative
  purposes. According to 876 IAC 8-1-13(a), who is authorized to make this request?
options:
  - An authorized representative of the commission or the office of the attorney general
  - The office of the attorney general or the office of the state auditor
  - An authorized representative of the commission or any licensed broker in the company
  - An authorized representative of the commission or the office of the county prosecutor
key: A
explanation: 876 IAC 8-1-13(a) limits the right to demand a detailed summary of the escrow/trust
  account to an authorized representative of the commission or the office of the attorney general,
  for investigative purposes. The distractors substitute the county prosecutor, the state auditor,
  or a licensed broker, none of whom the rule identifies as an authorized requester, which is the
  common confusion between the state attorney general and other law-enforcement or audit offices.
citation:
  source: 876 Ind. Admin. Code 8 — 876 IAC Article 8 — Article 8 (Indiana Real Estate Commission
    rules; official iac.iga.in.gov 2024 edition PDF read via Internet Archive capture of 2024-02-14
    because iga.in.gov now serves the IAC only through a JavaScript app and in.gov refuses
    connections from this environment) — § 8-1-13(a)
  url: null
  quoted_text: A broker company shall provide a detailed summary of the broker company's escrow/trust
    account upon request by an authorized representative of the commission or by the office of the
    attorney general for investigative purposes.
