stem: A managing broker of a limited liability company also serves as managing broker for a
  corporation located at a different address. According to 876 IAC § 8-1-1(a), is this arrangement
  permissible?
options:
  - The arrangement is permitted because the rule allows a managing broker to serve more than one
    broker company regardless of location.
  - The arrangement is not permitted because the rule only allows a managing broker to serve more
    than one broker company when they are at the same address.
  - The arrangement is permitted provided the managing broker files a notice with the commission.
  - The arrangement is not permitted because a managing broker may only serve one broker company at
    any time.
key: B
explanation: The rule states that a managing broker may serve more than one broker company only if
  the companies are at the same address. Serving companies at different addresses is not authorized
  by this provision. The other options either add conditions not present or misstate the limitation.
citation:
