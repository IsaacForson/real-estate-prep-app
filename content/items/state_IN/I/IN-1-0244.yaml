stem: A buyer offers to pay earnest money via a personal promissory note. According to 876 IAC
  8-2-2(b), what must the listing broker do?
options:
  - The broker must communicate the fact to the seller before acceptance but not show it in the
    earnest money receipt
  - The broker must communicate the fact to the seller after acceptance and show it in the earnest
    money receipt
  - The broker must neither communicate the fact nor show it in the earnest money receipt
  - The broker must communicate the fact to the seller before acceptance and show it in the earnest
    money receipt
key: D
explanation: The rule states that if the earnest money is not cash, check, or equivalent, the fact
  must be communicated to the seller before the seller's acceptance and shown in the earnest money
  receipt. Communicating after acceptance or omitting the receipt violates the requirement.
citation:
  source: "### 876 Ind. Admin. Code 8 — 876 IAC Article 8 — Article 8 (Indiana Real Estate Commission
    rules; official iac.iga.in.gov 2024 edition PDF read via Internet Archive capture of 2024-02-14
    because iga.in.gov now serves the IAC only through a JavaScript app and in.gov refuses
    connections from this environment) — § 8-2-2"
  url: null
  quoted_text: "If the earnest money deposit is other than cash, check, or its equivalent, this fact
    shall be: (1) communicated to the seller before the seller's acceptance of the offer to
    purchase; and (2) shown in the earnest money receipt."
