stem: A listing broker receives a written offer to purchase where the earnest money is in the form
  of a promissory note. According to 876 IAC 8-2-2(b), what must the broker do before the seller
  accepts the offer?
options:
  - Deposit the note in the escrow/trust account immediately upon receipt
  - Obtain a court order validating the promissory note before acceptance
  - Communicate the fact that the deposit is not cash or a check to the seller
  - Reject the offer because non-cash deposits are prohibited by rule
key: C
explanation: 876 IAC 8-2-2(b) requires that if the earnest money deposit is other than cash, check,
  or its equivalent, the fact shall be communicated to the seller before the seller's acceptance of
  the offer. The rule mandates disclosure, not rejection or deposit, prior to acceptance.
