stem: A broker company receives a written request from an authorized representative of the Indiana
  Real Estate Commission for a detailed summary of its escrow/trust account. According to 876 IAC
  8-1-13, what must the broker company do?
options:
  - Provide a detailed summary of the escrow/trust account
  - Provide only the total balance of the escrow/trust account
  - Provide a summary only if the escrow/trust account exceeds $10,000
  - Provide the summary only after obtaining a court order
key: A
explanation: The rule obligates the broker company to provide a detailed summary upon request by an
  authorized representative of the commission or the attorney general. The distractor that suggests
  providing only the total balance is incorrect because the rule requires a detailed summary, not
  merely the balance.
