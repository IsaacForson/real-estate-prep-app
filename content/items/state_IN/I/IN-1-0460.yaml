stem: According to 876 IAC 5-1-1, which of the following is listed as a reason the commission may
  cause discipline of a person?
options:
  - The refusal to cooperate with a title company
  - The failure to display the broker's license number on advertisements
  - The violation of IC 25-1-11, IC 25-34.1, or this title
  - The omission of required continuing education hours
key: C
explanation: The commission may cause discipline for violations of IC 25-1-11, IC 25-34.1, or this
  title, which matches the option stating that violation of those statutes is a reason for
  discipline. The option about failing to display the broker's license number on advertisements is
  not listed as a basis for discipline in the rule.
