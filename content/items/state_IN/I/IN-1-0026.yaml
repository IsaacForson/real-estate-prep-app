stem: A listing broker receives final acceptance of an offer to purchase on Thursday, May 9.
  Assuming the next two banking days are Friday, May 10 and Monday, May 13 (the bank is closed
  Saturday and Sunday), by what date must the broker deposit the earnest money received in
  connection with the transaction?
options:
  - Friday, May 10
  - Tuesday, May 14
  - Thursday, May 9
  - Monday, May 13
key: D
explanation: The rule requires deposit on or before the next two banking days after final
  acceptance. Counting Friday and Monday as the two banking days, the latest permissible date is
  Monday, May 13. The distractor Friday, May 10 allows only one banking day; Tuesday, May 14 exceeds
  the allowed period; and Thursday, May 9 is the same day as acceptance, which is before the
  required period.
