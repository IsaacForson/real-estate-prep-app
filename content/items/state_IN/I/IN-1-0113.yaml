stem: An investigator from the Indiana Attorney General's office requests a detailed summary of a
  broker company's escrow/trust account. According to 876 IAC 8-1-13(a), what must the broker
  company do?
options:
  - Provide only the total balance of the escrow account
  - Provide the summary only after receiving a subpoena
  - Provide the summary only if the escrow account exceeds $10,000
  - Provide the detailed summary to the investigator
key: D
explanation: The rule requires a broker company to provide a detailed summary of its escrow/trust
  account upon request by an authorized representative of the commission or the office of the
  attorney general for investigative purposes. Providing only the total balance or conditioning the
  response on a subpoena or account size does not satisfy this requirement.
