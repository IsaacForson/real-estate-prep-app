stem: A listing broker receives final acceptance of an offer to purchase on Monday, May 6, 2024.
  Tuesday, May 7 is a bank holiday, and Wednesday, May 8 and Thursday, May 9 are regular banking
  days. According to 876 IAC 8-2-2(a), by what date must the broker deposit the earnest money
  received in connection with the transaction?
options:
  - Thursday, May 9, 2024.
  - Wednesday, May 8, 2024.
  - Friday, May 10, 2024.
  - Monday, May 13, 2024.
key: A
explanation: After acceptance on Monday, May 6, the next banking days are Wednesday, May 8 (first)
  and Thursday, May 9 (second). The deposit must be made on or before the second banking day, which
  is Thursday, May 9. Wednesday, May 8 is only the first banking day and does not satisfy the
  deadline.
