stem: A broker company holding earnest money receives notice that the buyer intends not to perform
  the contract. The offer to purchase contains no specific provisions for the release of the
  deposit. According to 876 IAC 8-2-2(d), what action may the broker initiate?
options:
  - Notify all parties at their last known address by personal written delivery
  - Notify all parties at their last known address by certified mail
  - Notify all parties at their last known address by electronic email notification
  - Notify all parties at their last known address by regular first-class mail
key: B
explanation: Section 8-2-2(d) states that if no provision is made in the offer to purchase, the
  broker may initiate the release process, which requires notifying all parties at their last known
  address by certified mail. The broker cannot unilaterally release funds to one party without this
  notice and the subsequent 60-day waiting period.
citation:
