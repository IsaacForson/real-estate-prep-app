stem: According to 876 IAC 8-1-13(b), with what type of financial institution must a broker company
  establish its escrow/trust account?
options:
  - C) A private investment firm.
  - B) A federally insured financial institution
  - D) A mortgage lending company
  - A) A state-chartered credit union
key: B
explanation: The rule states that a broker company shall establish an escrow/trust account with a
  federally insured financial institution as required by IC 25-34.1 and this title, making the
  choice that specifies a federally insured financial institution correct. The choice that limits
  the institution to a state-chartered credit union is incorrect because the rule does not limit the
  institution to state-chartered credit unions; it requires federal insurance, which a
  state-chartered credit union may not have.
