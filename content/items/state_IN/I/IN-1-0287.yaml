stem: A managing broker of a broker company fails to supervise the company's agents, resulting in
  fraudulent activity. According to 876 IAC 5-1-1, what action may the commission take?
options:
  - Causing the discipline of the managing broker
  - Revoking the company's registration
  - Imposing a cease-and-desist order
  - Requiring additional training for agents
key: A
explanation: The managing broker is primarily responsible to the commission for the broker company's
  actions under 876 IAC 8-1-1(b), and failure to supervise leading to fraud violates this title,
  authorizing discipline. Imposing a cease-and-desist order or revoking registration is not
  specified in this rule.
