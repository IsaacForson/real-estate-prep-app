stem: According to 876 IAC 5-1-1, which of the following is a stated purpose of the Indiana Real
  Estate Commission?
options:
  - Encouraging the collection of state sales tax on transactions
  - Encouraging and requiring high standards of knowledge
  - Encouraging the commission to set maximum commission rates
  - Encouraging brokers to engage in dual agency
key: B
explanation: The commission’s purpose includes encouraging and requiring high standards of knowledge
  as listed in subsection (1) of 876 IAC 5-1-1. Encouraging dual agency, setting commission rates,
  or collecting sales tax are not mentioned as purposes in the rule.
