stem: A listing broker, holding the earnest money for a purchase agreement, is notified that the
  buyer intends not to perform. The offer to purchase contains no provision directing how the
  deposit should be released. The broker sends a certified letter to both parties at their last
  known addresses. According to 876 IAC 8-2-2(d), what must happen before the broker may release the
  earnest money deposit to the party identified in the certified letter?
options:
  - Neither party initiates litigation and neither enters into a written release within sixty days
    of the mailing date of the certified letter
  - Both parties sign a mutual release of the funds within thirty days of the mailing date of the
    certified letter
  - The buyer provides a written waiver of the deposit within sixty days of the mailing date of the
    certified letter
  - The seller files a stipulation for release with the commission within sixty days of the mailing
    date of the certified letter
key: A
explanation: Under 876 IAC 8-2-2(d), when there is no provision in the offer, the broker may
  initiate the release process by certifying a letter to all parties, provided that within sixty
  days of the mailing date neither the buyer nor the seller initiates litigation or enters into a
  written release; only then may the broker release the deposit to the party identified in the
  letter. The distractor requiring a buyer waiver or a seller stipulation is not a condition in the
  rule, and the mutual-release option misstates both the required parties and the thirty-day period
  (the rule uses sixty days and permits release to a single identified party without a mutual
  release).
citation:
  source: 876 Ind. Admin. Code 8 — 876 IAC Article 8 — Article 8 (Indiana Real Estate Commission
    rules; official iac.iga.in.gov 2024 edition PDF read via Internet Archive capture of 2024-02-14
    because iga.in.gov now serves the IAC only through a JavaScript app and in.gov refuses
    connections from this environment) — § 8-2-2(d)
  url: null
  quoted_text: If neither the buyer nor the seller initiates litigation or enters into a written
    release within sixty (60) days of the mailing date of the certified letter, the broker may
    release the earnest money deposit to the party identified in the certified letter.
