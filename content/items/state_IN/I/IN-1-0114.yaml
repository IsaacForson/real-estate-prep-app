stem: Under 876 IAC 8-1-13(a), what must a broker company do when asked by an authorized
  representative of the Indiana Real Estate Commission for investigative purposes?
options:
  - Attend a continuing education course yearly
  - Pay a fine for noncompletion of duties
  - Submit a complete list of all active listings
  - Provide a detailed escrow/trust account summary
key: D
explanation: The rule explicitly states that a broker company shall provide a detailed summary of
  its escrow/trust account upon request by an authorized representative of the commission. The other
  options describe actions not required by this provision.
