stem: A broker company receives earnest money deposits from buyers as part of its real estate sales
  activities. According to 876 IAC 8-1-13(b), what must the broker company do?
options:
  - Establish an escrow/trust account only if the earnest money is in the form of cash or check.
  - Establish an escrow/trust account with a federally insured financial institution as required by
    IC 25-34.1 and this title.
  - Establish an escrow/trust account and deposit all money received into the broker's personal
    account.
  - Establish an escrow/trust account with any financial institution, regardless of federal
    insurance.
key: B
explanation: The rule requires broker companies that collect monies in the performance of licensed
  activities to establish an escrow/trust account with a federally insured financial institution.
  The distractor incorrectly limits the requirement to cash or check, omits the federal insurance
  requirement, or misstates where the money should be deposited.
