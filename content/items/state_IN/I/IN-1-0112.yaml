stem: A listing broker sends a certified letter to both parties stating the earnest money will be
  released to the buyer unless they respond. Neither party initiates litigation or enters a written
  release within 60 days of the mailing date. According to 876 IAC 8-2-2(d), what may the broker do?
options:
  - release the earnest money to the seller
  - retain the earnest money until a court order
  - release the earnest money to the buyer
  - return the earnest money to the buyer's lender
key: C
explanation: The rule states that if neither party initiates litigation or enters a written release
  within sixty days of the certified letter, the broker may release the earnest money to the party
  identified in the letter. The letter identified the buyer as the recipient, making release to the
  buyer permissible. Releasing to the seller contradicts the letter's direction.
