stem: A partnership of two licensed brokers wants to operate as a broker company but has not yet
  filed a designated managing broker with the commission. According to 876 IAC 8-1-1(a), what must
  the partnership do before it can be considered a broker company?
options:
  - Opening an escrow account with a bank
  - Registering the partnership as a sole proprietorship
  - Obtaining a broker license for each partner
  - Designating a managing broker to the commission
key: D
explanation: The rule requires that for partnerships, the managing broker shall be the managing
  broker designated to the commission under IC 25-34.1-4-2. Simply obtaining a broker license for
  each partner does not satisfy the designation requirement.
