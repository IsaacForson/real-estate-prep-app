stem: A buyer's written offer includes a $5,000 earnest money deposit in the form of a cashier's
  check. The seller gives final acceptance on a Tuesday morning. The listing broker holds the
  deposit. According to 876 IAC 8-2-2, which of the following statements about the broker's handling
  of the deposit is correct?
options:
  - The broker must hold the check in a personal account until the transaction closes and the
    parties request disbursement
  - The broker must deliver the check directly to the seller's attorney no later than the close of
    business on the day acceptance is signed
  - The broker must deposit the check in the broker's escrow/trust account on or before the next two
    banking days after acceptance
  - The broker must deposit the check in the broker's escrow/trust account on or before the next one
    banking day after acceptance
key: C
explanation: 876 IAC 8-2-2(a) requires the listing broker to deposit all money received in
  connection with the transaction in the listing broker's escrow/trust account on or before the next
  two banking days after final acceptance. Because the deposit is a cashier's check (cash or its
  equivalent), the non-cash disclosure duty in subsection (b) does not apply. The distractor about
  the next business day misstates the banking-day window, and the personal-account and
  direct-delivery options violate the rule that the commission holds any broker to whom money is
  deposited responsible for it.
