stem: A listing broker receives final acceptance of an offer to purchase on Wednesday morning.
  According to 876 IAC 8-2-2(a), by what deadline must the broker deposit the earnest money into the
  escrow/trust account?
options:
  - End of the first banking day after acceptance
  - End of the second banking day after acceptance
  - End of the third banking day after acceptance
  - End of the fourth banking day after acceptance
key: B
explanation: The rule requires the broker to deposit the earnest money on or before the next two
  banking days after final acceptance. If acceptance occurs on Wednesday, the first banking day is
  Thursday and the second is Friday, so the deposit must be made by the end of Friday. Options
  citing the first or third/fourth banking day misstate the timing.
