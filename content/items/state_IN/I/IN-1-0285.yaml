stem: According to 876 IAC 5-1-1, the commission is authorized to discipline brokers who engage in
  which of the following?
options:
  - Engaging in negligent record keeping of client funds
  - Engaging in advertising without displaying license number
  - Engaging in failure to attend continuing education
  - Engaging in dishonest, fraudulent, or criminal activities
key: D
explanation: Under 876 IAC 5-1-1, the commission may discipline brokers who engage in dishonest,
  fraudulent, or criminal activities. The other options describe conduct that is not listed as
  grounds for discipline in that rule.
