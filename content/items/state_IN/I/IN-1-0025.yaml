stem: According to 876 IAC 8-2-2(b), if the earnest money deposit is other than cash, check, or its
  equivalent, which two actions must be taken?
options:
  - Communicating the fact to the buyer before the buyer's acceptance and showing it in the purchase
    agreement
  - Communicating the fact to the seller after the seller's acceptance and showing it in the earnest
    money receipt
  - Communicating the fact to the seller before the seller's acceptance and showing it in the
    earnest money receipt
  - Communicating the fact to the seller before the seller's acceptance and showing it in the
    closing statement
key: C
explanation: The rule requires that the fact be communicated to the seller before the seller's
  acceptance and shown in the earnest money receipt. The distractor that mentions communicating to
  the buyer and showing it in the purchase agreement is incorrect because the rule specifies the
  seller, not the buyer, and the earnest money receipt, not the purchase agreement.
