stem: A buyer’s earnest money deposit is to be held by the seller’s attorney as specified in the
  purchase agreement. After the seller’s final acceptance of the offer, where must the listing
  broker deposit the earnest money?
options:
  - Deposit to the title company
  - Deposit to the seller’s attorney
  - Deposit to the broker’s escrow account
  - Deposit to the buyer’s broker
key: B
explanation: The rule requires the listing broker to deposit money received in connection with a
  transaction to whoever is indicated in the purchase agreement to receive the deposit. Depositing
  to the broker’s escrow account applies only when the purchase agreement is silent on who receives
  the deposit.
