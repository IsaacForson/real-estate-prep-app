stem: According to 876 IAC 8-1-1(a), who is the managing broker of a sole proprietorship?
options:
  - The commission overseeing activities
  - The broker company itself and its agents
  - The designated managing broker appointee
  - The sole proprietor of the business
key: D
explanation: Under 876 IAC 8-1-1(a), for a sole proprietorship the sole proprietor serves as the
  managing broker. The other options incorrectly assign responsibility to the commission, the broker
  company and its agents, or a designated managing broker appointee.
