stem: Jane Doe operates a sole proprietorship real estate brokerage. One of her sales agents
  deposits earnest money into his personal account instead of the company escrow account. Under 876
  IAC 8-1-1(b), who is primarily responsible to the Indiana Real Estate Commission for the
  brokerage's actions?
options:
  - The sales agent who took the earnest money
  - The sole proprietor managing broker
  - The buyer in the transaction
  - The Indiana Real Estate Commission
key: B
explanation: Under 876 IAC 8-1-1(b), a sole proprietor managing broker is primarily responsible to
  the commission for the broker company's actions. Therefore, Jane Doe, as the sole proprietor
  managing broker, bears that responsibility. The sales agent who misappropriated the funds is not
  identified as the party primarily responsible under this rule. The commission oversees compliance
  but is not responsible for the brokerage's actions.
citation:
