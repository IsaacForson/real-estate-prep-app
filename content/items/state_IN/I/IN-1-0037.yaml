    connections from this environment) — § 8-1-1
  url: null
  quoted_text: (b) A sole proprietor managing broker, and, as provided for in IC 25-34.1-4-2, the
    designated managing broker described in subsection (a) shall be primarily responsible to the
    commission for the broker company's actions.
