stem: A listing broker receives a written purchase offer via email at 9:00 AM on Tuesday. According
  to 876 IAC 8-2-2(a), by what time must the broker communicate the offer to the seller?
options:
  - Communicate the offer to the seller within one hour of receipt.
  - Communicate the offer to the seller by the end of the business day.
  - Communicate the offer to the seller immediately upon receipt.
  - Communicate the offer to the seller within 24 hours of receipt.
key: C
explanation: 876 IAC 8‑2‑2 requires that any written offer be communicated to the seller for
  acceptance or rejection immediately upon receipt of the offer. Therefore the statement that the
  broker must communicate the offer immediately upon receipt is correct. The alternatives that
  impose a one‑hour delay, an end‑of‑business‑day deadline, or a 24‑hour window add time limits that
  the rule does not permit.
