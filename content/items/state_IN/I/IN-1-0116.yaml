stem: A sole proprietor who is the managing broker of her own broker company also agrees to serve as
  managing broker for a second broker company that shares the same office address. According to 876
  IAC 8-1-1(a), is this permissible?
options:
  - The managing broker may serve more than one broker company at the same address
  - The managing broker may serve only one broker company at any given time daily
  - The managing broker may serve multiple companies only if second is corporation
  - The managing broker may serve multiple companies only with commission permission
key: A
explanation: The rule expressly states that it does not prohibit a managing broker from being the
  managing broker for more than one broker company located at the same address. Therefore serving
  two companies at the same location is allowed, while the other options impose restrictions not
  found in the rule.
citation:
