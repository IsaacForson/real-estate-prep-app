stem: A listing broker holds earnest money in an escrow account and the buyer agrees in writing to
  transfer any interest earned to an affordable housing fund. According to 876 IAC 8-2-2(c), what
  may the broker do?
options:
  - The broker may transfer the interest earned to the listing broker's operating account
  - The broker must transfer the interest earned to the buyer's escrow account
  - The broker must transfer the interest earned to the Indiana Real Estate Commission
  - The broker may transfer the interest earned to the affordable housing fund
key: D
explanation: If the beneficiary agrees in writing, the broker may voluntarily transfer any interest
  earned on the escrow/trust account to a fund that provides affordable housing opportunities and
  meets IRS 501(c)(3) requirements. The broker is not required to remit interest to the buyer, keep
  it in the account, or withdraw it for personal use.
citation:
  source: 876 Ind. Admin. Code 8 — 876 IAC Article 8 — Article 8 (Indiana Real Estate Commission
    rules; official iac.iga.in.gov 2024 edition PDF read via Internet Archive capture of 2024-02-14
