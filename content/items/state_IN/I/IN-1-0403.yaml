stem: A managing broker also operates a separate office for property management services unrelated
  to real estate brokerage. According to 876 IAC 8-1-1(a), what must be true about the broker
  company?
options:
  - The broker company must be the managing broker's principal and sole place of real estate business
  - The broker company may be one of several places where the managing broker conducts real estate
    business
  - The broker company may be located anywhere regardless of the managing broker's other business
    activities
  - The broker company must be separate from the managing broker's personal residence
key: A
explanation: The rule states that the broker company shall constitute the managing broker's
  principal and sole place of real estate business. Therefore, the company cannot be merely one of
  several places or located anywhere; it must be the principal and sole place. The rule does not
  require separation from the personal residence.
