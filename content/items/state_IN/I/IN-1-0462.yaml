stem: A broker is convicted of a felony for embezzlement unrelated to real estate transactions.
  According to 876 IAC 5-1-1, what action may the commission take?
options:
  - The discipline of the broker
  - The issuance of a warning
  - The requirement of extra education
  - The referral to the prosecutor
key: A
explanation: The rule provides for disciplining brokers who engage in criminal activities, thus the
  commission may discipline the broker. The most tempting distractor, requiring additional
  education, is not cited as an authorized disciplinary measure in the rule.
