key: A
explanation: The fee for activating an inactive license is $10 as stated in 876 IAC 5-3-1(a)(4).
  Therefore the correct answer is $10.00. A common mistake is to confuse this with the renewal fee,
  which is $50.00, but the rule clearly sets the activation fee at $10.
