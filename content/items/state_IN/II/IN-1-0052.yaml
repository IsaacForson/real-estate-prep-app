stem: A broker company plans to open a new branch office in Indianapolis. What must the broker
  company do before the branch office may begin operations?
options:
  - The broker company must submit a Branch Office Registration Form to the commission before
    opening the branch office
  - The broker company must notify the commission of the new branch manager after opening the branch
    office
  - The broker company must obtain a separate license for the branch office from the commission
  - The broker company must file a renewal application for the main office before opening the branch
key: A
explanation: Under 876 IAC 8-1-2(a), a broker company must submit a Branch Office Registration Form
  to the commission prior to opening any branch office. Therefore, submitting the form is required
  before operations may start. Notifying the commission of a new branch manager after opening
  addresses a different requirement and does not satisfy the prerequisite for opening.
