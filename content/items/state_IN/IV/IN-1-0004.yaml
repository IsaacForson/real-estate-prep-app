stem: Under 876 IAC 8-2-2, when a buyer's earnest money deposit is something other than cash or a
  check, what must occur?
options:
  - Immediate deposit into a savings account
  - Disclosure to the seller in advance
  - Conversion to cash before the offer date
  - Approval from the real estate commission
key: B
explanation: 876 IAC 8-2-2 requires that when earnest money is other than cash, check, or its
  equivalent, that fact be communicated to the seller before the seller accepts the offer to
  purchase.
citation:
  source: 876 Ind. Admin. Code § 8-2-2
  url: null
  quoted_text: "If the earnest money deposit is other than cash, check, or its equivalent, this fact
    shall be: (1) communicated to the seller before the seller's acceptance of the offer to
    purchase; and (2) shown in the earnest money receipt."
