stem: A broker agrees to sell a seller's property based on a verbal agreement. Under 876 IAC 8-2-1,
  is this agreement permissible?
options:
  - The agreement is permissible if the broker reduces the commission rate.
  - The agreement is not permissible because listing agreements must be in writing.
  - The agreement is permissible if the seller signs a later written ratification.
  - The agreement is permissible because both parties consented verbally.
key: B
explanation: The rule requires all listing agreements or authorities to sell to be in writing,
  either on paper or in electronic format. A verbal agreement does not satisfy this requirement,
  making it impermissible. The distractor claiming permissibility based solely on mutual consent is
  incorrect because consent alone does not override the writing mandate.
