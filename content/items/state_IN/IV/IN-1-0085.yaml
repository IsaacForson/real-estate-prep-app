stem: Under 876 IAC 8-1-8(b), what must any advertising by a broker company reveal?
options:
  - The name of the broker company as on its license or publicly known name
  - The name of the broker's individual license issued by the commission
  - The telephone number of the broker company's office
  - The email address of the broker company's contact person
key: A
explanation: The rule requires advertising by a broker company to reveal the broker company's name
  as it appears on its license or by its publicly known name. The distractor about the broker's
  individual license is incorrect because the rule applies to the broker company, not the individual
  broker.
