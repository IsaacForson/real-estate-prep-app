stem: A buyer notifies the broker of an intent not to perform, and the purchase agreement is silent
  on releasing earnest money. The broker mails a certified letter to both parties proposing a
  distribution. Neither party objects or sues. Under 876 IAC 8-2-2, when may the broker release the
  funds as stated in the letter?
options:
  - Sixty days after the mailing date
  - After a court issues an order
  - Immediately after mailing the letter
  - After five days from the buyer's notice
key: A
explanation: 876 IAC 8-2-2 allows the broker to release earnest money to the parties named in the
  certified letter if neither party sues nor signs a mutual release within sixty days of the mailing
  date of that letter.
citation:
  source: 876 Ind. Admin. Code § 8-2-2
  url: null
  quoted_text: "the selling or listing broker to notify all parties at their last known address by
    certified mail that the earnest money deposit shall be distributed to the parties specified in
    the letter unless: (1) all parties enter into a mutual release; or (2) one (1) or more of the
    parties initiate litigation; within sixty (60) days of the mailing date of the certified
    letter."
