stem: A listing broker deposits earnest money into an escrow account at a title company. Later, the
  money is misappropriated. Under 876 IAC 8-2-2, who is held responsible for the money?
options:
  - The commission shall hold the buyer's agent responsible for the money
  - The commission shall hold the seller's agent responsible for the money
  - The commission shall hold the listing broker responsible for the money
  - The commission shall hold the escrow agent responsible for the money
key: C
explanation: The rule states that the commission shall hold any broker with whom money is deposited
  responsible for the money. The title company, buyer, or seller are not held responsible by the
  commission under this provision.
