stem: A broker deposits a buyer's earnest money check into the escrow account of a title company.
  Later, the title company misplaces the funds. Under 876 IAC 8-2-2(a), who is responsible for the
  earnest money?
options:
  - The title company
  - The broker firm
  - The buyer party
  - The seller party
key: B
explanation: Under 876 IAC 8-2-2(a), the commission holds any broker with whom money is deposited
  responsible for the money, regardless of where the funds are placed. Therefore, the broker remains
  liable for the earnest money even though it was deposited in a title company's escrow account. The
  distractor that the title company is responsible is incorrect because the rule places
  responsibility on the broker, not the third‑party escrow holder.
