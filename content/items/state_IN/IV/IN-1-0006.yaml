stem: A seller finally accepts a purchase offer on a Wednesday. Under 876 IAC 8-2-2, by when must
  the listing broker deposit the earnest money into the escrow account?
options:
  - Within one business day of closing
  - On or before the next ten calendar days
  - Within thirty days of the offer date
  - On or before the next two banking days
key: D
explanation: 876 IAC 8-2-2 requires the listing broker, on or before the next two banking days after
  final acceptance of the offer, to deposit money received into the escrow or trust account or as
  the purchase agreement directs.
citation:
  source: 876 Ind. Admin. Code § 8-2-2
  url: null
  quoted_text: "The listing broker shall, on or before the next two (2) banking days after final
    acceptance of the offer to purchase, do one (1) of the following: (1) Deposit all money received
    in connection with a transaction in the listing broker's escrow/trust account."
