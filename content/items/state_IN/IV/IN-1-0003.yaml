stem: A broker company agrees to a listing that pays the broker any amount above a set net price to
  the seller, with no maximum commission stated. Under 876 IAC 8-2-1, is this listing agreement
  permitted?
options:
  - No, the listing needs a maximum commission
  - Yes, because net listings are permitted
  - Yes, because the seller approved it verbally
  - No, because the property lacked an appraisal
key: A
explanation: 876 IAC 8-2-1 bars a broker company from accepting a listing agreement that provides a
  net return to the seller unless that agreement also states a maximum commission payable to the
  broker company.
citation:
  source: 876 Ind. Admin. Code § 8-2-1
  url: null
  quoted_text: No listing agreements shall be accepted by a broker company or by an associated broker
    on the broker company's behalf that provides for a net return to the seller, unless said listing
    agreement provides for a maximum commission to be paid by the seller to the broker company.
