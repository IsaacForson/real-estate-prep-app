stem: "A licensee informs an appraiser that the appraisal fee will be withheld unless the
  appraiser's final valuation matches the loan amount required by the lender. This conduct is:"
options:
  - Being allowed when disclosed to borrower
  - Being permissible under the rule
  - Being required by the rule
  - Being considered improper influence
key: D
explanation: Withholding an appraisal fee unless the appraiser's value matches the loan amount ties
  payment to a specific valuation, which Cal. Code Regs. tit. 10, § 2785(a)(4) defines as improper
  influence. Therefore the conduct is considered improper influence. It is not allowed even if
  disclosed to the borrower, it is not permissible under the rule, and the rule does not require
  such conditioning.
