stem: Maria, who is not licensed, receives a fee for negotiating a mortgage loan secured by a
  residential property for a client. Under Cal. Bus. & Prof. Code § 10131(d), Maria must hold which
  license to legally perform this activity?
options:
  - a real estate salesperson license
  - a real estate broker license
  - a residential appraiser license
  - a mortgage loan originator license
key: B
explanation: The statute defines a broker as one who "negotiates loans. in connection with loans
  secured by real property" (quoted). A salesperson may not negotiate loans for compensation; only a
  broker may. The other licenses do not authorize loan negotiation.
