stem: "A licensee tells an appraiser that payment for a completed appraisal report will be withheld
  unless the appraiser revises the property value upward. According to Cal. Code Regs. tit. 10, §§
  2705–3109 § 2785(a)(1), this conduct is:"
options:
  - The improper influence on the appraisal
  - The permissible request for additional information
  - The legitimate negotiation of fees
  - The allowed conditioning of future business
key: A
explanation: Withholding or threatening to withhold payment for a completed appraisal report unless
  the value is changed is expressly listed as improper influence under subsection (a)(1). The
  permissible request for additional information is allowed only under subsection (b)(1) and does
  not apply to this scenario.
