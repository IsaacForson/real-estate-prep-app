stem: "A licensee asks an appraiser to correct a mathematical error found in the appraisal report
  before final submission. Under Cal. Code Regs. tit. 10, §§ 2705–3109 § 2785(b)(3), this action
  is:"
options:
  - The prohibited improper influence on the appraisal
  - The permissible correction of errors in the appraisal report
  - The disallowed conditioning of future business
  - The impermissible request for a predetermined value
