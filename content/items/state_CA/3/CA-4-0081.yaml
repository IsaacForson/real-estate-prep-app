stem: Under Cal. Bus. & Prof. Code § 10131, a real estate broker may perform which of the following
  acts for another?
options:
  - Preparing tax returns for clients
  - Issuing title insurance policies
  - Negotiating loans for compensation
  - Conducting property inspections
key: C
explanation: The statute defines a broker as one who "solicits borrowers or lenders for or
  negotiates loans or collects payments or performs services for borrowers or lenders" in connection
  with loans secured by real property. Preparing tax returns, issuing title insurance, and
  conducting inspections are not listed acts under this section.
