stem: "A licensee tells an appraiser that they will receive a promotion and higher pay if the
  appraisal value meets the loan amount requested by the lender. According to Cal. Code Regs. tit.
  10, § 2785(a)(3), this conduct is:"
options:
  - The conduct is improper influence because it promises future business or compensation.
  - The conduct is proper influence because it is a legitimate incentive.
  - The conduct is permissible communication under subdivision (b).
  - The conduct is not addressed by any specific regulation in this section.
key: A
explanation: Subsection (a)(3) expressly or impliedly promising future business, promotions, or
  increased compensation for an appraiser is improper influence. The scenario describes a promise of
  promotion and higher pay contingent on the appraisal value, which matches this prohibition. The
  option stating that the conduct is proper influence because it is a legitimate incentive is
  incorrect because such a promise is not considered a legitimate incentive under the regulation.
