stem: The Legislature decides to review the Bureau of Real Estate Appraisers' powers and duties in
  2025. According to Cal. Bus. & Prof. Code § 11301(b), how must this review be performed?
options:
  - As if this part were scheduled to be repealed as of January 1, 2025
  - As if this part were scheduled to be repealed as of January 1, 2035
  - As if this part were scheduled to be repealed as of January 1, 2040
  - As if this part were scheduled to be repealed as of January 1, 2030
key: D
explanation: The statute mandates that any review be conducted as if the part were scheduled to be
  repealed on January 1, 2030, regardless of when the review occurs. Suggesting the review uses the
  year 2025 mistakenly applies the effective date of the amendment instead of the prescribed repeal
  date.
