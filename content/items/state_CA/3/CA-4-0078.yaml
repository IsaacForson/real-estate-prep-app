stem: Under Cal. Bus. & Prof. Code § 11301(b), the Bureau of Real Estate Appraisers is subject to
  review by which entity and until what date?
options:
  - Review by the appropriate policy committees of the Legislature, with a scheduled repeal date of
    January 1, 2030
  - Review by the Department of Consumer Affairs, with a scheduled repeal date of January 1, 2030
  - Review by the appropriate policy committees of the Legislature, with a scheduled repeal date of
    January 1, 2025
  - Review by the Governor’s Office, with no scheduled repeal date under the statute
key: A
explanation: The statute states that the bureau's powers and duties are subject to review by the
  appropriate policy committees of the Legislature, and the review shall be performed as if the part
  were scheduled to be repealed as of January 1, 2030. The other options incorrectly name the
  reviewing entity or the date.
