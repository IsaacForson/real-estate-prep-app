stem: A licensee’s expired license is being considered for an extension under Cal. Code Regs. tit.
  10, § 3012. The Commissioner may extend the license for a maximum of how many days while
  investigating evidence of good cause?
options:
  - The Commissioner may extend the license for 30 days.
  - The Commissioner may extend the license for 60 days.
  - The Commissioner may extend the license for 90 days.
  - The Commissioner may extend the license for 120 days.
