stem: A tenant installs a custom-built shelving unit in a rented commercial space, bolting it to the
  floor, without any agreement about removal. At lease end, the landlord demands the shelving
  remain. Who owns the shelving under Cal. Civ. Code § 1013?
options:
  - The tenant owns the shelving unit
  - The shelving unit is personal property of the tenant
  - The shelving unit must be removed by the tenant
  - The landlord owns the shelving unit
key: D
explanation: Under § 1013, when a person affixes property to another's land without an agreement
  permitting removal, the thing affixed belongs to the landowner unless the landowner requires
  removal or the person elects to exercise the right of removal under § 1013.5. Since there is no
  agreement, the shelving belongs to the landlord. The tenant does not own it absent such agreement.
citation:
  source: Cal. Civ. Code § 1013
  url: null
  quoted_text: When a person affixes his property to the land of another, without an agreement
    permitting him to remove it, the thing affixed, except as otherwise provided in this chapter,
    belongs to the owner of the land, unless he chooses to require the former to remove it or the
    former elects to exercise the right of removal provided for in Section 1013.5 of this chapter.
