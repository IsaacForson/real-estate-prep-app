stem: Under Cal. Bus. & Prof. Code § 10165, what action may the commissioner take for a violation of
  Section 10162 (definite place of business requirement)?
options:
  - The commissioner may temporarily suspend or permanently revoke the license.
  - The commissioner may issue a written warning and require corrective action.
  - The commissioner may require the licensee to pay a civil penalty of $500.
  - The commissioner may refer the case to the district attorney for prosecution.
key: A
explanation: The statute expressly authorizes the commissioner to suspend or revoke a license for
  violations of the definite place of business requirement (§10162). A written warning alone is not
  the prescribed remedy; the law provides for suspension or revocation as the permissible
  disciplinary action.
