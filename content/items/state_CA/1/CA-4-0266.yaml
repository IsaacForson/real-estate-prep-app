stem: Under Cal. Bus. & Prof. Code § 10167.9(a)(5), what is the latest permissible expiration date
  for a prepaid rental listing service contract?
options:
  - The contract may expire 60 days from execution
  - The contract may expire 90 days from execution
  - The contract may expire 30 days from execution
  - The contract may expire 45 days from execution
key: B
explanation: The statute explicitly states that the contract expiration date shall not be later than
  90 days from the date of execution. Therefore, the latest permissible expiration is 90 days from
  execution. The other options represent shorter periods that, while allowed, are not the latest
  permissible date.
