stem: A subdivider files an amended public report to offer 8 subdivision interests described in
  Section 11004.5, for which no fees have previously been paid. What is the total filing fee
  required under Cal. Code Regs. tit. 10, § 2790.1.5(a)(10)?
options:
  - $500
  - $580
  - $660
  - $740
key: B
explanation: The fee is $500 plus $10 for each interest without a prior fee, so $500 + (8 × $10) =
  $580. Omitting the per‑interest charge leads to the distractor $500.
citation:
