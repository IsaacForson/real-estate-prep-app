stem: A tenant installs a shed on the landlord's land without any agreement allowing removal. The
  landlord does not demand removal and the tenant does not assert a right of removal. Who owns the
  shed under Cal. Civ. Code § 1013?
options:
  - Ownership by the tenant
  - Ownership by both parties
  - Ownership by the landlord
  - Ownership by neither party
key: C
explanation: Because there is no agreement permitting removal, the landlord does not require
  removal, and the tenant does not elect to remove the shed, the statute provides that the affixed
  property belongs to the landlord. The distractor “Ownership by the tenant” is incorrect because,
  absent an agreement permitting removal, the tenant retains no ownership rights in the affixed
  item.
