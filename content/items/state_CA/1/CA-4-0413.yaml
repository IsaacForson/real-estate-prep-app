stem: A licensee advertises a subdivision as offering a private tennis club for residents' use, but
  the Notice of Intention and Questionnaire submitted to the Commissioner only lists single-family
  residential lots and no recreational facilities. According to Cal. Code Regs. tit. 10, §
  2799.1(1), is this advertisement permissible?
options:
  - The advertisement is permissible because the tennis club is a private amenity for residents
  - The advertisement is impermissible because it implies a use not set forth in the Notice of
    Intention
  - The advertisement is permissible because the commissioner has not yet objected
  - The advertisement is impermissible because it lacks an estimated completion date for the tennis
    club
key: B
explanation: The rule forbids implying a use of a subdivision interest that is not set forth in the
  Notice of Intention and Questionnaire. The advertisement implies a tennis club use not described
  in the Notice, making it impermissible. The claim that the advertisement is impermissible because
  it lacks an estimated completion date for the tennis club is incorrect because the rule’s
  prohibition does not depend on providing an estimated completion date.
