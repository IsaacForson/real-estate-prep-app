stem: A licensee advertises that buyers will have access to a nearby marina being built by an
  affiliate, but the Commissioner has not approved financial arrangements for the marina’s
  construction. According to Cal. Code Regs. tit. 10, § 2799.1(5), is this advertisement
  permissible?
options:
  - The advertisement is impermissible because it fails to mention the estimated date of completion
    for the marina
  - The advertisement is permissible because the marina is already completed and available for use
  - The advertisement is impermissible because it references outside private facilities without
    commissioner approval
  - The advertisement is permissible because the marina will be completed within one year
key: C
explanation: The regulation prohibits referencing the prospective availability of private facilities
  outside the subdivision for purchasers’ use when the facilities are to be built by the subdivider
  or an affiliate unless financial arrangements have been approved by the commissioner. The
  advertisement mentions a marina being built by an affiliate without such approval, making it
  impermissible. The claim that the marina will be completed within one year does not satisfy the
  requirement for commissioner approval of financial arrangements, so that option is incorrect.
citation:
  source: Cal. Code Regs. tit. 10, § 2799.1(5)
  url: null
  quoted_text: There shall be no reference to the prospective availability of private facilities
    outside of the subdivision for the use and enjoyment of purchasers of subdivision interests if
    the facilities are to be constructed or installed by the subdivider or an affiliated entity
    unless financial arrangements for completion or installation have been approved by the
    commissioner.
