stem: A developer offers a promotional travel certificate that requires the recipient to pay a
  long‑distance call charge to activate the certificate, beyond the usual toll costs imposed by the
  recipient’s telephone service. Which provision of Cal. Bus. & Prof. Code § 11245(a) is violated?
options:
  - Subsection (10) – failing to disclose annual maintenance and association dues
  - Subsection (13) – failing to allow time to read the public report before signing a contract
  - Subsection (1) – making a material misrepresentation about the time‑share plan in any
    advertisement
  - Subsection (15) – offering a travel certificate that incurs additional telephone expenses beyond
    usual toll costs
key: D
explanation: Subsection (15) prohibits offering a travel certificate that cannot be activated
  without incurring additional telephone charges beyond the usual toll costs imposed by the
  recipient’s telephone service. The scenario matches this prohibition exactly.
citation:
  source: Cal. Bus. & Prof. Code §§ 11210–11288 § 11245(a)(15)
  url: null
  quoted_text: (15) Offer as a promotional incentive any travel certificate or coupon redeemable for
    transportation, accommodations, or other travel-related service that does not allow the
    recipient to activate or redeem the incentive without incurring any additional telephone
    expenses charged by or on behalf of the developer other than the usual toll costs imposed by the
    prospective purchaser’s telephone service.
