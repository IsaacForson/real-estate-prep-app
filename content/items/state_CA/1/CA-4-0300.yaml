stem: A broker receives a $5,000 earnest money deposit from a buyer on Monday. According to Cal.
  Code Regs. tit. 10, § 2832(a), by what deadline must the broker deposit the funds into a trust
  fund account?
options:
  - The broker must deposit the funds by the end of the same business day.
  - The broker must deposit the funds by the close of the next business day.
  - The broker must deposit the funds within five business days following receipt.
  - The broker must deposit the funds within three business days following receipt.
key: D
explanation: Under Cal. Code Regs. tit. 10, § 2832(a), trust funds must be deposited in a trust
  account not later than three business days following receipt. Stating that the deadline is the
  close of the next business day is incorrect because the rule allows up to three business days.
