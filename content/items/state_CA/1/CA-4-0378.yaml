stem: A licensee’s discipline originated from an Accusation filed by the Commissioner. When seeking
  removal of that discipline information from the Department’s website, which set of rehabilitation
  criteria applies under Cal. Code Regs. tit. 10, § 2915(e)?
options:
  - Both sets of criteria apply
  - Neither set of criteria applies
  - The criteria in section 2911 apply
  - The criteria in section 2912 apply
key: D
explanation: The regulation states that when discipline stems from an Accusation, surrender of a
  license, or other Commissioner‑ordered actions (except a Statement of Issues), the rehabilitation
  criteria from section 2912 apply. Because the discipline in this scenario arose from an
  Accusation, the section 2912 criteria govern. Therefore the correct choice is the statement that
  the criteria in section 2912 apply; the other options conflict with the allocation of criteria in
  the rule.
citation:
  source: Cal. Code Regs. tit. 10, § 2915(e)
  url: null
  quoted_text: The criteria for rehabilitation set forth in section 2911 of these Regulations will
    apply where a petitioner seeks removal of discipline information from the Department’s website
    stemming from a Statement of Issues or where petitioner’s license discipline stems from an
    original application for a license. The criteria for rehabilitation set forth in section 2912 of
    these Regulations will apply where a petitioner seeks removal of discipline information from the
    Department’s website stemming from an Accusation, surrender of a license, or other discipline
    actions ordered by the Commissioner except for a Statement of Issues.
