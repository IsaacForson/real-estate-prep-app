stem: A licensee is interpreting Cal. Civ. Code § 8018, which defines 'direct contractor.' Does the
  definition of 'contractor' in Cal. Civ. Code § 8012 apply to this interpretation?
options:
  - No, because § 8012 includes both direct contractors and subcontractors
  - No, because § 8012 explicitly states it does not apply to § 8018
  - No, but only if the person is a direct contractor
  - No, unless the person is a material supplier
key: B
explanation: Section 8012 provides that its definition of contractor does not apply to § 8018, so
  the definition does not apply when interpreting that section. The option stating that the
  definition applies because § 8012 includes both direct contractors and subcontractors is
  incorrect, as it ignores the explicit non‑applicability clause.
