stem: A real estate salesperson fails to renew her license before the expiration date and submits
  the renewal application two weeks late. According to Cal. Code Regs. tit. 10, § 2716.1(4), what is
  the late license renewal fee she must pay?
options:
  - $245
  - $300
  - $367
  - $450
key: C
explanation: The late license renewal fee for a salesperson is $367, as stated in § 2716.1(4). The
  distractor of $450 applies to brokers, not salespersons.
