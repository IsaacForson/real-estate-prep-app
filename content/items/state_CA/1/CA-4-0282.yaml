stem: An association wants to levy a special assessment to reimburse the association for costs
  incurred in bringing a time-share interest owner into compliance with the governing instruments.
  Under Cal. Bus. & Prof. Code § 11265(a)(6)(C), is this special assessment permissible without a
  vote of the owners other than the developer?
options:
  - Yes, because it is for compliance reimbursement.
  - Yes, because it is less than 10 percent of the budgeted gross expenses.
  - Yes, because it does not exceed 5 percent of the budgeted gross expenses.
  - Yes, because it is for ordinary maintenance and operations.
key: A
explanation: Under Cal. Bus. & Prof. Code § 11265(a)(6)(C), a special assessment may be levied to
  reimburse the association for costs incurred in bringing a time‑share interest owner into
  compliance with the governing instruments, and no owner vote is required regardless of the
  assessment amount. The assessment’s size relative to the budget does not determine permissibility,
  so options that rely on a percentage limit or characterize the assessment as ordinary maintenance
  are incorrect.
