stem: Under Cal. Bus. & Prof. Code § 11265(a)(5), what is the maximum percentage increase in the
  regular annual assessment per time-share interest that may be imposed without the vote or written
  assent of a majority of the voting power of the association residing in members other than the
  developer?
options:
  - Up to 5 percent
  - Up to 10 percent
  - Up to 15 percent
  - Up to 20 percent
key: D
explanation: The rule allows the association to increase the regular annual assessment by up to 20
  percent without a vote of owners other than the developer. Any increase exceeding that threshold
  requires such a vote. Therefore, the maximum permissible increase without a vote is 20 percent. An
  option stating a lower percentage, such as 10 percent, understates the allowance and is incorrect.
