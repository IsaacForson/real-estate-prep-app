stem: A developer sells a time-share interest but fails to give the purchaser the public report at
  closing. Which statement is true under Cal. Bus. & Prof. Code § 11234?
options:
  - The developer has violated Cal. Bus. & Prof. Code § 11234.
  - The developer has satisfied the public report requirement.
  - The developer must provide the report within three days after closing.
  - The developer may rely on an out-of-state public report instead.
key: A
explanation: Under Cal. Bus. & Prof. Code § 11234, the developer must provide the public report at
  the time of purchase. Failing to do so violates the statute. The claim that the developer has
  satisfied the public report requirement is incorrect because no report was given.
