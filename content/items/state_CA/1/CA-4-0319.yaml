stem: Under Cal. Code Regs. tit. 10, § 2792.32(c), what event triggers the automatic conversion of
  Class B membership to Class A membership in a Master Planned Development?
options:
  - When seventy-five percent of the separate residential interests have been conveyed to Class A
    members
  - When ninety percent of the separate residential interests have been conveyed to Class A members
  - When fifty percent of the separate residential interests have been conveyed to Class A members
  - When one hundred percent of the separate residential interests have been conveyed to Class A
    members
key: A
explanation: The regulation states that Class B membership is automatically converted to Class A
  membership when seventy‑five percent of the separate residential interests proposed for the
  development have been conveyed to Class A members. The ninety‑percent threshold applies to
  termination of the subdivider’s architectural‑control arrangement, not to Class B conversion.
