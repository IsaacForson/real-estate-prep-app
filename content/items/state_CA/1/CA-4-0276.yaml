stem: A person solicits borrowers for loans secured by real property and collects payments. Under
  Cal. Bus. & Prof. Code § 10131(d), does the person need a real estate license?
options:
  - The person must hold a real estate license only if they also negotiate purchases or sales of
    real property.
  - The person is exempt from licensing if they only collect payments and do not negotiate loans.
  - The person must hold a real estate license because soliciting borrowers for loans secured by
    real property is a broker activity.
  - The person is not required to have a license because loan solicitation is exempt under §
    10131.01.
key: C
explanation: Section 10131(d) includes soliciting borrowers for loans secured by real property and
  collecting payments in connection with such loans as acts that define a real estate broker.
  Therefore a license is required regardless of whether the person also negotiates loans or engages
  in other real estate activities. The option stating that the person is exempt from licensing if
  they only collect payments and do not negotiate loans is incorrect because collecting payments
  alone still falls under the broker definition when tied to real‑property‑secured loans.
