stem: An applicant for a mortgage loan originator license endorsement has a recent judgment for
  fraud related to mishandling of trust funds. Under Cal. Code Regs. tit. 10, § 2758.3(a), what is
  the likely outcome?
options:
  - The endorsement will be issued with a probationary condition.
  - The applicant must complete additional education to qualify.
  - The applicant may be precluded from obtaining the endorsement.
  - The applicant is automatically eligible if they pay restitution.
key: C
explanation: Under Cal. Code Regs. tit. 10, § 2758.3(a), an applicant may be precluded from
  obtaining a mortgage loan originator license endorsement if personal history includes liens or
  judgments for fraud, misrepresentation, dishonest dealing, or mishandling of trust funds. The
  other options describe actions that are not provided for by the regulation.
