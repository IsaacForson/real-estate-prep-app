stem: A seller knows the property is located within a special flood hazard area but does not inform
  the prospective buyer. Under Cal. Civ. Code § 1103(c)(1)(A), is the seller’s failure to disclose
  permissible?
options:
  - Permitted because the seller’s agent did not have actual knowledge
  - Permitted if the buyer later discovers the hazard
  - Permitted if the property is not in a very high fire hazard severity zone
  - Prohibited because disclosure is required when the seller has actual knowledge
key: D
explanation: The rule requires disclosure when the seller or agent has actual knowledge the property
  is in a special flood hazard area; failure to disclose is therefore prohibited. The distractor
  claiming permission if the buyer later discovers the hazard is wrong because the duty to disclose
  arises at the time of transfer, not after discovery.
