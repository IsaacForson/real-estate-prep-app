stem: A developer of a time-share plan learns that the swimming pool advertised in the public report
  will not be completed as promised. The developer notifies the commissioner of this material and
  adverse change. According to Cal. Bus. & Prof. Code § 11226(f)(1)(A), what must occur before any
  closing can take place?
options:
  - The developer must wait seven days after sending the amended public report
  - The developer must obtain an amended public report from the commissioner
  - The developer must provide a notice to each purchaser describing the change
  - The developer must hold all purchaser funds in escrow before closing
key: D
explanation: The rule requires that purchaser funds be held in escrow (or alternative assurance) and
  that no closing occur until the commissioner approves the amendment. Simply notifying purchasers
  or awaiting a report does not satisfy the escrow requirement.
