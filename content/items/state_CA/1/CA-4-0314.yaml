stem: According to Cal. Code Regs. tit. 10, § 2792.18(e)(1), what is the permissible range for a
  quorum at a members’ meeting of a common-interest subdivision association?
options:
  - Not less than 25% and not more than 66 2/3% of the total voting power
  - Not less than 20% and not more than 60% of the total voting power
  - Not less than 33 1/3% and not more than 75% of the total voting power
  - Not less than 10% and not more than 50% of the total voting power
key: A
explanation: The rule sets the quorum range at not less than 25% and not more than 66 2/3% of the
  total voting power. The distractor offering 10% to 50% incorrectly lowers both thresholds.
