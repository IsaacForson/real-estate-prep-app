stem: A prospective purchaser executes an offer to purchase an interest in an undivided-interest
  subdivision on April 5, 2024. According to Cal. Bus. & Prof. Code § 11000.2(a), by what date and
  time must the purchaser exercise the right of rescission to be valid?
options:
  - April 8, 2024 at 11:59 p.m.
  - April 9, 2024 at 11:59 p.m.
  - April 6, 2024 at 11:59 p.m.
  - April 7, 2024 at 11:59 p.m.
key: A
explanation: The right of rescission lasts until midnight of the third calendar day after the offer
  date. Counting April 6 as day 1, April 7 as day 2, and April 8 as day 3 makes the deadline
  midnight of April 8. Choosing April 7 incorrectly treats the second day as the deadline.
