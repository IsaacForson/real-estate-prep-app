stem: In a multi-phase development, the first conveyance in Phase 1 occurred on March 15, 2021 and
  the first conveyance in Phase 2 (the most recent phase) occurred on September 30, 2022. Under Cal.
  Code Regs. tit. 10, § 2792.18(4), by what date must the Class B membership have been converted to
  Class A at the latest?
options:
  - September 30, 2024.
  - March 15, 2025.
  - September 30, 2025.
  - March 15, 2024.
key: A
explanation: "Under Cal. Code Regs. tit. 10, § 2792.18(4), the Class B membership must be converted
  to Class A on the earlier of (1) the second anniversary of the first conveyance in the most recent
  phase (September 30, 2022 + 2 years = September 30, 2024) or (2) the fourth anniversary of the
  first conveyance in the first phase (March 15, 2021 + 4 years = March 15, 2025). The earlier date
  is September 30, 2024, so conversion must have occurred by that date. The other choices are
  incorrect: one gives the later date (March 15, 2025), another gives a premature date
  (March 15, 2024), and the third adds an extra year to the most recent phase anniversary
  (September 30, 2025)."
citation:
  source: Cal. Code Regs. tit. 10, § 2792.18(4)
  url: null
  quoted_text: "(4) In a multi-phase development for which the subdivider has submitted a plan for
    phased development through annexation which satisfies the requirements of Section 2792.27, the
    Class B membership shall be irreversibly converted to Class A membership on the first to occur
    of the following: (A) A prescribed date certain which is not later than the second anniversary
    of the first conveyance of a subdivision interest in the most recent phase of the development.
    (B) A prescribed date certain which is not later than the fourth anniversary of the first
    conveyance of a subdivision interest in the first phase of the development."
