stem: A homeowner fails to pay for roofing work; the roofer records a lien for the unpaid amount.
  What type of lien is this under Cal. Civ. Code § 2875?
options:
  - A general lien covering all debts
  - An equitable lien based on fairness
  - A special lien for a specific act
  - A possessory lien requiring possession
key: C
explanation: Section 2875 defines a special lien as one enforceable only as security for the
  performance of a particular act or obligation and incidental obligations. A lien for unpaid
  roofing work secures only that specific act, making it a special lien. A general lien, by
  contrast, secures all obligations of the owner, not just a specific act.
