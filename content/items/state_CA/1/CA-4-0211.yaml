stem: A licensee changes their mailing address on July 10. By what date must the licensee submit the
  notice of change to the Bureau?
options:
  - July 12
  - July 20
  - July 15
  - July 17
key: C
explanation: Section 2710(c) of Cal. Code Regs. tit. 10 requires that notice of changes be submitted
  not later than five days after the effective date of the change. Adding five days to July 10 gives
  a deadline of July 15, so July 15 is the correct date. July 12 is earlier than the deadline but
  does not represent the latest permissible date. July 17 exceeds the five‑day limit and would be
  untimely.
