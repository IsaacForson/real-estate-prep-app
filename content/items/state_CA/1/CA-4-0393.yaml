stem: A licensee terminates a prepaid rental listing service contract on June 1, 2024. According to
  Cal. Bus. & Prof. Code § 10167.9(b)(1), until what date must the licensee retain the original
  contract and related documents?
options:
  - The licensee must retain the documents until May 31, 2027.
  - The licensee must retain the documents until June 1, 2027.
  - The licensee must retain the documents until June 1, 2028.
  - The licensee must retain the documents until June 1, 2025.
key: B
explanation: The law requires retention of contracts for a period of not less than three years from
  the date of termination. Three years after June 1, 2024 is June 1, 2027, so the documents must be
  kept at least until that date. The other options are either too short, too long, or off by one
  day.
citation:
  source: "Cal. Bus. & Prof. Code §§ 10130–10171.5 — B&P Code Div. 4, Pt. 1, Ch. 3, Arts. 1-2.5 (§§
    10130-10171.5) - Real Estate Regulations: Scope, Licenses, Exams, Fictitious names,
    Corporations, Restricted licenses § 10167.9(b)(1)"
  url: null
  quoted_text: (1) The original of each contract, any separate contracts for required goods or
    services, refund claims, receipts and any other relevant documents shall be retained by the
    licensee for a period of not less than three years from the date of termination of the contract
    during that time the contract shall be subject to examination by a duly authorized
    representative of the commissioner.
