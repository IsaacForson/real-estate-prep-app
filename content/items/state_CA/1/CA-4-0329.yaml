stem: Under Cal. Bus. & Prof. Code § 11234, what must a developer do regarding the public report for
  a time‑share plan?
options:
  - The developer must file the public report with the county recorder before closing.
  - The developer must provide the public report to each purchaser at the time of purchase.
  - The developer must advertise the time‑share plan in a newspaper of general circulation.
  - The developer must obtain a surety bond equal to twice the purchase price.
key: B
explanation: Cal. Bus. & Prof. Code § 11234 requires a developer to give the public report to each
  purchaser at the time of purchase. The law does not require filing the report with the county
  recorder, placing a newspaper advertisement, or posting a surety bond equal to twice the purchase
  price.
