stem: Under Cal. Bus. & Prof. Code § 10143.5, a broker must file a report to the commissioner within
  how many days after the end of each calendar quarter?
options:
  - 5 days
  - 10 days
  - 30 days
  - 15 days
key: B
explanation: Under Cal. Bus. & Prof. Code § 10143.5, a broker must file the quarterly report within
  10 days after the close of each calendar quarter. Therefore the correct interval is 10 days. The
  distractor stating 5 days incorrectly assumes a shorter period, while 15 and 30 days overstate the
  required timeframe.
