stem: A notice of intention for a subdivision public report was filed on January 15, 2023. By what
  date must the subdivider furnish the data required by Section 11010 to avoid possible abandonment
  of the application under Cal. Bus. & Prof. Code § 11018.13(a)?
options:
  - January 15, 2024
  - January 15, 2025
  - January 15, 2026
  - January 15, 2027
key: C
explanation: The commissioner may abandon an application if the required data are not furnished
  within three years from the date the notice of intention is filed. Adding three years to January
  15, 2023 gives January 15, 2026 as the deadline to avoid abandonment.
