stem: Under Cal. Code Regs. tit. 10, § 2705(g), how is the term 'License' defined?
options:
  - Any authorization granted by the Commissioner to practice real estate
  - Any person applying to the Department of Real Estate for a license
  - Any license issued under authority of the Real Estate Law
  - Any permit issued under authority of the Subdivided Lands Law
key: C
explanation: "According to Cal. Code Regs. tit. 10, § 2705(g), a license is defined as any license
  issued under authority of the Real Estate Law. Therefore the correct choice is the option that
  states this definition. The other options describe different terms: an applicant for a license, an
  authorization granted by the Commissioner, and a permit under the Subdivided Lands Law, none of
  which match the definition in §2705(g)."
