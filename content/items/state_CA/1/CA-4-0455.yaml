stem: Under Cal. Bus. & Prof. Code § 11245(a)(10), what information must a developer disclose prior
  to the execution of any purchase contract for a time-share interest?
options:
  - The nature and extent of any incidental benefit offered with the purchase, when applicable
  - The annual maintenance and association dues or any separately billed taxes, when applicable
  - The estimated annual resale price increase for the next five years, when applicable
  - The conditions under which a purchaser may exchange accommodations for another location, when
    applicable
key: B
explanation: The statute requires a clear and conspicuous disclosure of annual maintenance and
  association dues or any separately billed taxes before the purchase contract is signed. The other
  options describe information that is not mandated by this subsection.
