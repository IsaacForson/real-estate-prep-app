stem: A seller attaches a report prepared by a licensed engineer verifying that the property is not
  in an earthquake fault zone. According to Cal. Civ. Code § 1103.2(b), what may the seller’s agent
  mark on the Natural Hazard Disclosure Statement?
options:
  - The agent may mark 'No' as allowed per statute
  - The agent may mark 'Yes' as allowed per statute
  - The agent may mark either 'Yes' or 'No' as allowed
  - The agent may leave the field blank as allowed
key: A
explanation: Under Cal. Civ. Code § 1103.2(b), if the seller attaches a report verifying the
  property is not in the hazard zone pursuant to § 1103.4(c), the seller’s agent may mark “No” on
  the NHDS. Marking “Yes” would be incorrect because the report shows no hazard.
