stem: Under Cal. Bus. & Prof. Code § 11010.5, within how many days must the Commissioner be notified
  of a change of ownership after acquisition of subdivided lots through foreclosure?
options:
  - 15 days
  - 30 days
  - 45 days
  - 60 days
key: B
explanation: The statute provides that the exemption from filing a second notice and report applies
  only if the commissioner is notified of the change of ownership within 30 days of acquiring the
  title. Therefore, the required notification period is 30 days.
