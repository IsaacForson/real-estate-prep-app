    Code Regs. tit. 10, ch. 6) - DRE compilation 2792.24(a)
  url: null
  quoted_text: The percentage of the voting power necessary to amend a specific clause or provision
    shall not be less than the percentage of affirmative votes prescribed for action to be taken
    under that clause.
