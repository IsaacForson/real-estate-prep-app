stem: An association's CC&R's state that a 60% vote of total voting power is required to increase
  the maximum annual assessment. Under Cal. Code Regs. tit. 10, §§ 2705–3109, what is the minimum
  percentage of total voting power that must approve an amendment to this provision?
options:
  - 50%
  - 60%
  - 70%
  - 75%
key: B
explanation: Under Cal. Code Regs. tit. 10, §§ 2705–3109, the percentage of voting power needed to
  amend a clause cannot be lower than the percentage required to take action under that clause. The
  clause in question requires a 60% vote to raise the maximum annual assessment, so at least 60% of
  the total voting power must approve any amendment to that provision. An answer of 50% does not
  meet this requirement because it is below the prescribed threshold.
citation:
