math:
  worked_solution: "Step 1: Identify the required vote for the action: 60% to increase the assessment.
    Step 2: Apply the regulation: the percentage needed to amend a clause must be at least the
    percentage required for the action. Step 3: Therefore, the minimum percentage to amend the
    clause equals 60%."
