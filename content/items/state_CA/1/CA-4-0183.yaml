stem: A subdivider submits a notice of intention for a subdivision public report without attaching a
  completed questionnaire. What is the required filing fee under Cal. Code Regs. tit. 10, §
  2790.1.5(a)(1)?
options:
  - $600
  - $150
  - $500
  - $1,700
key: B
explanation: The regulation states that a notice of intention without a completed questionnaire
  incurs a filing fee of one hundred fifty dollars ($150). The $500 distractor applies to an
  original public report for subdivision interests not described in Section 11004.5, not to a notice
  of intention.
