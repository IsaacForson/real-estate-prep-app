stem: A licensed real estate broker must retain copies of listings, deposit receipts, canceled
  checks, trust records, and other documents for how many years after the closing of a transaction?
options:
  - Four years
  - Eleven years
  - Three years
  - Seven years
key: C
explanation: The statute requires brokers to keep these records for three years from the date of
  closing. This retention period applies regardless of whether the transaction is consummated, as it
  runs from the closing date or the listing date if the deal falls through. The most tempting
  distractor is "One year" because some might confuse the renewal cycle with the record‑keeping
  rule, but the law explicitly sets a three‑year term.
citation:
  source: Cal. Bus. & Prof. Code § 10148(a)
  url: null
  quoted_text: A licensed real estate broker shall retain for three years copies of all listings,
    deposit receipts, canceled checks, trust records, and other documents executed by the broker or
    obtained by the broker in connection with any transactions for which a real estate broker
    license is required.
