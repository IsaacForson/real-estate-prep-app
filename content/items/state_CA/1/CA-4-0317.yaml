stem: "Under Cal. Bus. & Prof. Code § 10170.8(a), a real estate licensee is exempt from continuing
  education requirements if the licensee:"
options:
  - The licensee is 70 years of age or older, regardless of licensure length.
  - The licensee has been a real estate licensee in good standing for 30 continuous years,
    regardless of age.
  - The licensee has been a real estate licensee in good standing for 20 continuous years and is 65
    years of age or older.
  - The licensee has been a real estate licensee in good standing for 30 continuous years and is 70
    years of age or older.
key: D
explanation: The statute provides that an exemption applies only when a licensee can show both a
  period of 30 continuous years in good standing and that the licensee is at least 70 years old. The
  statement that the licensee is 70 years of age or older without mentioning the 30‑year service
  period leaves out the required experience condition. The statement that the licensee has 30
  continuous years in good standing but makes no reference to age omits the age requirement. The
  statement that the licensee has 20 continuous years and is 65 years old fails to meet either the
  required length of service or the required age. Only the description that includes both 30
  continuous years in good standing and an age of 70 years or older satisfies the statutory
  exemption. (Cal. Bus. & Prof. Code § 10170.8(a))
