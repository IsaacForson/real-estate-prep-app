stem: A subdivider receives a conditional public report for a subdivision of attached residential
  condominium units comprising 30 units. What is the maximum initial term, in months, of this
  conditional public report under Cal. Bus. & Prof. Code § 11018.12(i)?
options:
  - 24 months
  - 30 months
  - 6 months
  - 12 months
key: B
explanation: For attached residential condominium projects of 25 units or more, the law limits the
  initial conditional public report to no more than 30 months. A 30‑unit project meets this
  threshold, so the longest initial term allowed is 30 months. The shorter options reflect the
  standard six‑month limit that applies to other subdivisions.
