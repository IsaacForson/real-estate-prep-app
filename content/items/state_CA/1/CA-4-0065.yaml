stem: Under Cal. Code Regs. tit. 10, § 2792.2(16)(B), if escrows for a stock cooperative subdivision
  are **NOT** closed on or before the date prescribed in the instructions, what must the escrow
  instructions provide?
options:
  - A provision that allows the subdivider to retain deposited funds if escrows close after the
    prescribed date
  - A provision that mandates interest accrual on deposited funds during the escrow period
  - A provision that requires the return of funds to buyers if escrows do not close by the
    prescribed date
  - A provision that permits the escrow depository to extend the closing date without buyer consent
key: C
explanation: The rule states that escrow instructions must include a provision for the return of
  funds to buyers if escrows do not close by the prescribed date. The distractor suggesting the
  subdivider may retain deposited funds is incorrect because the rule obligates the return to
  buyers, not retention by the subdivider.
