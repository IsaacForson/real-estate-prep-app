stem: Under Cal. Bus. & Prof. Code § 10167.9(a)(5), what must the contract for prepaid rental
  listing services include regarding the contract expiration date?
options:
  - The contract expiration date shall be determined by the prospective tenant's specifications.
  - The contract expiration date shall not be later than 90 days from the date of execution of the
    contract.
  - The contract expiration date shall be no earlier than 90 days from the date of execution of the
    contract.
  - The contract expiration date shall be exactly 90 days from the date of execution of the contract.
key: B
explanation: The statute explicitly states that the contract expiration date shall not be later than
  90 days from the date of execution of the contract. The other options either impose an exact or
  earlier deadline or allow the tenant to set the date, which the law does not permit.
