stem: An individual owns 12 percent of the shares of a corporation applying for an original real
  estate broker license. According to Cal. Code Regs. tit. 10, § 2746(a), what action must the
  designated officer take regarding this individual?
options:
  - Excluding the individual's interest from the background statement
  - Submitting the individual's fingerprints and photograph to the Bureau
  - Obtaining a signed waiver from the Commissioner for the individual
  - Filing a background statement of information for the individual
key: D
explanation: The regulation mandates a background statement for any natural person owning or
  controlling more than ten percent of the corporation’s shares; at 12 percent the individual
  exceeds that threshold and must be included. Excluding the individual or seeking a waiver
  contradicts the rule, and fingerprints alone do not satisfy the background‑statement requirement.
