stem: A licensee completes a three‑hour ethics course but does not pass the final examination. Under
  Cal. Bus. & Prof. Code § 10170.5(d), does this course count toward the continuing education
  requirement for license renewal?
options:
  - The course counts because attendance at an approved course is sufficient.
  - The course does not count because successful completion requires passing the final examination.
  - The course counts if the commissioner has approved the offering.
  - The course does not count because only broker‑specific courses require an exam.
key: B
explanation: The statute defines “successful completion” of a required course as passing the final
  examination. Merely attending the course without passing the exam does not satisfy the
  requirement. The claim that attendance alone satisfies the requirement is incorrect because the
  statute requires passing the final exam. The suggestion that commissioner approval makes the
  course count ignores the exam requirement. The statement that only broker‑specific courses need an
  exam misstates the rule, which applies to all required courses.
