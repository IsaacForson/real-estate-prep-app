stem: When may an original applicant for a real estate license submit fingerprints?
options:
  - The applicant may submit fingerprints only with the application to take the license examination,
    as required by the Bureau, which is a requirement stipulated by the Commissioner for all license
    applicants.
  - The applicant may submit fingerprints only at any time after submitting the application to take
    the license examination, as required by the Bureau, which is a requirement stipulated by the
    Commissioner for all license applicants.
  - The applicant may submit fingerprints with the application to take the license examination, at
    any time after submitting the application to take the license examination, or with the
    application for a real estate license.
  - The applicant may submit fingerprints only with the application for a real estate license, as
    required by the Bureau, which is a requirement stipulated by the Commissioner for all license
    applicants.
key: C
explanation: Section 2712 allows an original applicant to submit fingerprints (a) with the
  application to take the license examination, (b) at any time after submitting that application, or
  (c) with the application for a real estate license. The correct option states that fingerprints
  may be submitted with the examination application, at any time after that application, or with the
  license application. The first wrong option limits submission to only the examination application.
  The second wrong option limits submission to only any time after the examination application. The
  third wrong option limits submission to only the license application.
