stem: Under Cal. Civ. Code § 1103(d), what is the legal effect of a waiver of the natural hazard
  disclosure requirements?
options:
  - Valid as against statutory exception and enforceable
  - Void as against public policy and unenforceable
  - Enforceable as against mutual agreement and binding
  - Voidable as against buyer’s election and unenforceable
key: B
explanation: The statute states that any waiver of the requirements of this article is void as
  against public policy, making such a waiver unenforceable. The distractor suggesting the waiver is
  voidable at the buyer’s option is incorrect because the law declares the waiver void, not merely
  voidable.
