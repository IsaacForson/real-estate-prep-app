stem: Which of the following is permitted under Cal. Code Regs. tit. 10, § 2705(t)?
options:
  - Advertising housing accommodation services for persons with physical disabilities
  - Advertising a preference for families with children in rental listings
  - Advertising a limitation based on religion in residential property listings
  - Advertising an intention to discriminate based on national origin in property listings
key: A
explanation: The regulation explicitly states that subdivision (t) does not prohibit advertising of
  housing accommodation services or housing accommodations for persons with physical disabilities.
  Therefore, advertising such services is allowed. Advertising a preference for families with
  children indicates discrimination based on familial status, which is prohibited under the same
  subdivision because it shows a preference based on protected class.
