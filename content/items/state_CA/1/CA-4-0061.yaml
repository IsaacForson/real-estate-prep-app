stem: A subdivider is applying for a final subdivision public report for a condominium project that
  is not a conversion. Which of the following documents must be included in the application?
options:
  - The plot plan delineating all improvements and recreational amenities
  - The proposed or existing governing instruments for the owners' association
  - The overall subdivision plan for a phased development subdivision
  - The completed supplemental questionnaire for a condominium conversion
key: B
explanation: For a condominium project, the regulations require the submission of proposed or
  existing governing instruments for the owners' association. The plot plan delineating improvements
  and recreational amenities is only required when the subdivision is not a condominium, making it
  incorrect in this context.
