stem: Under Cal. Civ. Code § 1103.3(a), who is responsible for delivering the Natural Hazard
  Disclosure Statement to the prospective buyer?
options:
  - The escrow agent
  - The buyer's agent
  - The seller's agent
  - The seller
key: D
explanation: The statute states that the seller of any real property subject to this article shall
  deliver the written statement required by the article. This places the duty directly on the
  seller, not the agent. The seller's agent may assist but does not bear the statutory duty.
