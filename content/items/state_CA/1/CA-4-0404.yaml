stem: A developer and the association disagree about whether the developer has fulfilled all
  obligations under the subsidization contract. According to Cal. Bus. & Prof. Code §§ 11210–11288 §
  11242.1(a)(2), what must happen next?
options:
  - The developer must automatically forfeit the security deposit to the association
  - The association may unilaterally terminate the subsidization contract without further notice
  - The issue shall be submitted to arbitration at the request of either party
  - The commissioner shall appoint a mediator to resolve the dispute within 30 days
key: C
explanation: Under Cal. Bus. & Prof. Code §§ 11210–11288 § 11242.1(a)(2), when the developer and the
  association disagree about whether the developer has satisfied the conditions for exoneration or
  release of the security, the dispute must be submitted to arbitration if either party requests it.
  The statute does not provide for automatic forfeiture of the security deposit, nor does it allow
  the association to unilaterally terminate the subsidization contract, nor does it require the
  commissioner to appoint a mediator within 30 days.
citation:
  source: Cal. Bus. & Prof. Code §§ 11210–11288 § 11242.1(a)(2)
  url: null
  quoted_text: If there is a dispute between the developer and the association with respect to the
    questions of satisfaction of the conditions for exoneration or release of the security, the
    issue or issues shall, at the request of either party, be submitted to arbitration in accordance
    with the Commercial Arbitration Rules of the American Arbitration Association or another
    third-party arbitration organization selected by the parties and in accordance with Title 9
    (commencing with Section 1280) of Part 3 of the Code of Civil Procedure.
