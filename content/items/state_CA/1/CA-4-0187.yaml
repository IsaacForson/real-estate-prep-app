stem: Under Cal. Code Regs. tit. 10, § 2716.1(3), what is the license fee for an applicant
  qualifying pursuant to Section 10153.4 of the Code who has **NOT** satisfied all of the
  educational requirements prior to issuance of a real estate salesperson license?
options:
  - $275
  - $245
  - $095
  - $300
key: A
explanation: Section 2716.1(3) sets the salesperson license fee at $275 for applicants who qualify
  under Section 10153.4 but have not completed the required education before licensure. The $245 fee
  applies only to salesperson applicants who have satisfied the educational requirements.
