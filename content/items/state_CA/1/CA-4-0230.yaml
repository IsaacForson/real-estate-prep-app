stem: Under Cal. Bus. & Prof. Code § 11212(m), which of the following is **NOT** considered an
  incidental benefit offered to a prospective purchaser of a time-share interest?
options:
  - A complimentary guided tour offered for eighteen months
  - A free one-night stay voucher provided at the sales presentation
  - A discounted spa service available for three years
  - A product discount coupon valid for two years
key: B
explanation: The definition of "incidental benefit" explicitly excludes offers of a free or
  discounted one-time basis. A free one-night stay voucher is such a one-time offer, so it is not an
  incidental benefit. The other options describe benefits lasting longer than one time and thus may
  qualify as incidental benefits.
citation:
