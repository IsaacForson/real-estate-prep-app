stem: A broker who is a member of a real estate brokerage partnership wishes to meet clients at a
  partnership branch office. The broker does not hold a branch office license, but another broker
  member of the partnership holds a current branch office license for that location. Under Cal. Code
  Regs. tit. 10, § 2728, may the broker conduct business from that branch office without obtaining a
  separate branch office license?
options:
  - Yes, the broker may conduct business from the partnership branch office without obtaining a
    separate branch office license because another broker member holds a current branch office
    license for that location.
  - Yes, the broker may conduct business from the partnership branch office if the broker obtains a
    salesperson license from the Bureau.
  - Yes, the broker may conduct business from the partnership branch office provided the broker also
    holds a current branch office license for that location.
  - Yes, the broker may conduct business from the partnership branch office only if the partnership
    files a new branch office license application with the Bureau.
key: A
explanation: The regulation permits a broker member of a partnership to conduct business from a
  partnership branch office without a separate license if another broker member of the partnership
  has a current branch office license for that location. The distractor claiming the broker must
  himself hold the license is incorrect because the rule allows the requirement to be satisfied by
  any broker member of the partnership.
citation:
  source: Cal. Code Regs. tit. 10, § 2728
  url: null
  quoted_text: A real estate broker who is a member of such a partnership may conduct business from a
    branch office of the partnership without applying for or acquiring a branch office license in
    his or her own name, provided another real estate broker member of the partnership has a current
    branch office license for and at the location in question.
