stem: A time-share interest owner accidentally breaks a window in the unit during their stay,
  causing damage to the accommodation. Under Cal. Bus. & Prof. Code § 11274(c), what action may the
  association take?
options:
  - The association may impose a monetary penalty for the damage to the accommodation.
  - The association may suspend the owner's right to occupancy and related privileges.
  - The association may immediately forfeit the owner's interest without court action.
  - The association may foreclose or sell the interest under a power of sale for nonpayment of
    assessments.
key: A
explanation: The statute allows the association to impose a monetary penalty for damage to an
  accommodation or other property that is part of the time-share plan (§11274(c)(2)). Suspension of
  occupancy rights is limited to delinquency in payments (§11274(b)). Foreclosure or sale applies
  only to nonpayment of assessments (§11274(a)(2)). Immediate forfeiture without court action is not
  permitted.
