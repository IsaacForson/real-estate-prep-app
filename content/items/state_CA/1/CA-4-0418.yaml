stem: A registrant who is a spouse of a servicemember renews their out-of-state real estate license
  and receives a new expiration date. According to Cal. Code Regs. tit. 10, § 2759.6(a)(2), within
  how many days must the registrant notify the Department of this renewal?
options:
  - 30 days
  - 45 days
  - 15 days
  - 60 days
key: A
explanation: Section 2759.6(a) mandates that registrants notify the Department within 30 days of
  renewing the out-of-state license through which they qualify for registration, including providing
  the new expiration date. The other intervals are not consistent with this rule.
