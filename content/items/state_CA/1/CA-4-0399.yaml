stem: If a bank fails to notify the Commissioner within 30 days after acquiring subdivided lots
  through foreclosure, what must it do under Cal. Bus. & Prof. Code § 11010.5?
options:
  - Obtaining an updated public report
  - Requesting a waiver from the Commissioner
  - Paying a monetary penalty to the state
  - Filing a second notice of intention
key: D
explanation: When the 30‑day notification condition is not met, the exemption does not apply, so the
  bank must file a second notice of intention and report as required by the statute.
