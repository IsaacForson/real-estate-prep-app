stem: A licensee submits an application for a mortgage loan originator license endorsement on
  November 5, 2023, and the application is approved on November 10, 2023. Under Cal. Code Regs. tit.
  10, § 2758.7(a), until what date is the license endorsement valid?
options:
  - January 31, 2025
  - January 31, 2024
  - December 31, 2024
  - December 31, 2023
key: C
explanation: Section 2758.7(a) of the California Code of Regulations states that a mortgage loan
  originator license endorsement expires on December 31 of the year it is issued, except that if the
  application is approved after October 31, the endorsement remains valid through December 31 of the
  following year. The application was approved on November 10, 2023, which is after October 31, so
  the endorsement is valid through December 31, 2024. The answer stating January 31, 2025
  incorrectly applies a different expiration rule. The answer stating January 31, 2024 assumes the
  standard expiration date without the extension for late‑year approvals. The answer stating
  December 31, 2023 ignores the extension that applies when approval occurs after October 31.
