stem: In a California common-interest development association with 100 total votes, the subdivider
  holds 20 votes. Under Cal. Code Regs. tit. 10 § 2792.24(a), what is the minimum number of votes
  that must be cast by members other than the subdivider to amend the CC&Rs, assuming the CC&Rs do
  **NOT** specify a higher vote threshold for that provision?
options:
  - 60 votes
  - 50 votes
  - 41 votes
  - 55 votes
key: C
explanation: The rule requires at least a bare majority of the votes of members other than the
  subdivider. With 80 non‑subdivider votes, a bare majority is 41. The 50‑vote distractor
  incorrectly applies the majority requirement to the total voting power rather than to the
  non‑subdivider members.
citation:
  source: Cal. Code Regs. tit. 10, § 2792.24(a)
  url: null
  quoted_text: (2) At least a bare majority of the votes of members other than the subdivider.
  secondary: []
math:
  worked_solution: |-
    Total votes = 100
    Subdivider votes = 20
    Non‑subdivider votes = 100 – 20 = 80
    Bare majority of 80 = floor(80/2) + 1 = 40 + 1 = 41
  formulas:
    - non_subdivider_votes = total_votes - subdivider_votes
    - bare_majority = floor(non_subdivider_votes / 2) + 1
