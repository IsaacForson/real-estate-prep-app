stem: Under Cal. Code Regs. tit. 10, § 2759.1(b), what does the term “Registrant” mean?
options:
  - A servicemember or spouse of a servicemember who holds an out-of-state real estate license and
    seeks to register with the Department
  - A servicemember or spouse of a servicemember who has been approved by the Department for
    registration
  - An active real estate license issued by another state, district, or territory of the United
    States
  - A Permanent Change of Station order or equivalent order issued by a branch of the United States
    armed forces
key: B
explanation: The regulation defines a Registrant as a servicemember or spouse of a servicemember who
  has been approved by the Department for registration. The option that states this matches the
  definition. The other options describe an applicant seeking registration, an out‑of‑state license,
  or a military order, none of which fit the definition. (Cal. Code Regs. tit. 10, § 2759.1(b))
