stem: A broker wishes to delegate supervision of unlicensed assistants to a salesperson who has
  worked full-time as a salesperson for 18 months in the past five years and has a written
  agreement. Is the delegation permissible under Cal. Code Regs. tit. 10, § 2724(b)?
options:
  - The delegation is permissible because a written agreement is in place.
  - The delegation is permissible because the salesperson has 18 months of experience.
  - The delegation is not permissible because the salesperson lacks the required two years of
    experience.
  - The delegation is not permissible because the broker must personally supervise all assistants.
key: C
explanation: The rule requires at least two years of full‑time experience as a salesperson licensee
  within the preceding five years; 18 months does not meet this threshold, so delegation is not
  allowed. The option claiming permissibility based on 18 months of experience ignores the two‑year
  requirement.
