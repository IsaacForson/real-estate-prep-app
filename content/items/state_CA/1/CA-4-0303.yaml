stem: Under Cal. Bus. & Prof. Code § 11022(b), what is the maximum amount the commissioner may
  prescribe by regulation for the fee to submit an advertisement for approval?
options:
  - $500
  - $260
  - $200
  - $300
key: B
explanation: The statute says the commissioner may set the fee by regulation, but it may not exceed
  two hundred sixty dollars ($260). Therefore the maximum permissible fee is $260. The $200 figure
  is the base fee mentioned, not the ceiling.
