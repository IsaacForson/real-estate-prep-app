stem: Under Cal. Bus. & Prof. Code § 11215(b), which action is **NOT** prohibited by the time-share
  instrument's restriction on judicial partition?
options:
  - Filing a lawsuit to partition the time-share property
  - Requesting a court-ordered sale in lieu of partition
  - Selling the accommodation after termination of the time-share plan
  - Seeking judicial partition of the time-share interest
key: C
explanation: Subdivision (b) clarifies that the prohibition on judicial partition in subdivision (a)
  does not apply to a sale of an accommodation upon termination of the time-share plan or removal
  per the instrument. Thus, selling after termination is not prohibited. Seeking judicial partition
  remains prohibited under subdivision (a).
