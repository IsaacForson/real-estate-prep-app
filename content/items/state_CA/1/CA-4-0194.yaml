stem: A homeowner initiates a dispute resolution process on April 1. The subdivider appoints a
  neutral administrator on June 2. Is this appointment compliant with Cal. Code Regs. tit. 10, §
  2791.8(a)(3)?
options:
  - The appointment is not compliant because it occurred after 60 days of initiation.
  - The appointment is compliant because it occurred within 60 days of initiation.
  - The appointment is not compliant because it occurred before the 60‑day period began.
  - The appointment is compliant because it occurred within 90 days of initiation.
key: A
explanation: The regulation requires the appointment to be made within sixty (60) days of
  initiation; April 1 to June 2 is 62 days, exceeding the limit. The distractor claiming compliance
  within 90 days misstates the required timeframe.
