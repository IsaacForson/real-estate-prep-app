stem: According to Cal. Code Regs. tit. 10, § 2911(a)(1)(A), what is considered inadequate to
  demonstrate rehabilitation for an applicant whose most recent criminal conviction is a cause of
  action in the Bureau’s Statement of Issues?
options:
  - The passage of less than two years since the most recent criminal conviction
  - The passage of more than two years since the most recent criminal conviction
  - The completion of restitution to any person who suffered monetary losses
  - The expungement of the criminal conviction under Penal Code Section 1203.4
key: A
explanation: The regulation explicitly states that less than two years after the relevant conviction
  is inadequate to show rehabilitation. The other options either exceed the time frame, involve
  restitution, or rely on expungement, which the rule does not list as sufficient proof of
  rehabilitation by itself.
