stem: A developer receives a conditional public report for a time-share plan on January 1, 2024. The
  commissioner later grants a renewal of the conditional public report. According to Cal. Bus. &
  Prof. Code § 11227(h), what is the maximum total duration, in months, that the developer may rely
  on the conditional public report (including the original and renewal) before a final public report
  must be issued?
options:
  - The maximum total duration is 6 months
  - The maximum total duration is 12 months
  - The maximum total duration is 18 months
  - The maximum total duration is 24 months
key: B
explanation: The statute limits a conditional public report to six months, renewable for one
  additional six-month period, yielding a maximum of twelve months. The statements that the maximum
  total duration is 18 months and 24 months exceed this limit, and the statement that the maximum
  total duration is 6 months omits the renewal period.
citation:
  source: Cal. Bus. & Prof. Code § 11227(h)
  url: null
  quoted_text: The term of a conditional public report may not exceed six months unless renewed
    pursuant to this subdivision. The conditional public report may be renewed for one additional
    six-month period if the commissioner determines that the requirements for issuance of a final
    public report are likely to be satisfied during the renewal term.
