stem: Under Cal. Code Regs. tit. 10, § 2792.23(d)(1), how many days after a meeting must draft
  minutes marked for adoption be made available to members of the association?
options:
  - 30 days
  - 15 days
  - 60 days
  - 45 days
key: A
explanation: The regulation states that minutes proposed for adoption that are marked to indicate
  draft status shall be available to members within 30 days of the meeting. Therefore, 30 days is
  correct. The distractor of 45 days incorrectly extends the period beyond the required timeframe.
