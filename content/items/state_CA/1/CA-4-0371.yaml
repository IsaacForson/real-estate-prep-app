stem: Under Cal. Bus. & Prof. Code § 11274(b), what may the association do to a time-share interest
  owner who is delinquent in paying regular or special assessments?
options:
  - The association may impose a monetary penalty for the delinquency
  - The association may initiate forfeiture of the owner's time-share interest
  - The association may suspend the owner's right to occupancy and related privileges
  - The association may require the owner to provide an oral defense
key: C
explanation: Subdivision (b) authorizes the association to suspend the owner's occupancy rights and
  related privileges during delinquency in assessment payments. The monetary penalty option applies
  only to violations of the time-share instrument under subdivision (c), not to mere delinquency.
citation:
  source: Cal. Bus. & Prof. Code §§ 11210–11288 — B&P Code Div. 4, Pt. 2, Ch. 2 - Vacation Ownership
    and Time-Share Act § 11274(b)
  url: null
  quoted_text: to suspend a time-share interest owner’s right to the occupancy of an accommodation,
    and all related rights and privileges as a time-share interest owner of a time-share interest in
    the time-share plan, during the period of time that the time-share interest owner is delinquent
    in the payment of regular or special assessments or other charges duly levied by the
    association.
