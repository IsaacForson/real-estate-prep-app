stem: Under Cal. Code Regs. tit. 10, § 2792.18(a), what is the voting entitlement of a member who
  owns a subdivision interest in an association that does **NOT** have two classes of voting
  membership?
options:
  - The member is entitled to one vote for each association member.
  - The member is entitled to three votes for each subdivision interest owned.
  - The member is entitled to two votes for each subdivision interest owned.
  - The member is entitled to one vote for each subdivision interest owned.
key: D
explanation: The regulation states that when an association does not have two classes of voting
  membership, a member receives one vote for each subdivision interest it owns. Consequently, the
  statement that a member is entitled to one vote for each subdivision interest owned is correct. A
  statement that a member gets one vote for each association member is incorrect because voting is
  tied to ownership, not to the number of members. Statements that a member receives two or three
  votes for each subdivision interest owned are also incorrect; the regulation does not provide
  multiple votes per interest unless a separate voting class exists. (Cal. Code Regs. tit. 10,
  § 2792.18(a))
