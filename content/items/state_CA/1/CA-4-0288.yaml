stem: A licensee delivers the Natural Hazard Disclosure Statement to a buyer by deposit in the mail
  after the buyer has signed an offer to purchase. How many days does the buyer have to terminate
  the offer?
options:
  - Ten calendar days
  - Five calendar days
  - Three calendar days
  - Seven calendar days
key: B
explanation: According to Cal. Civ. Code § 1103.3(c), if a disclosure is delivered by deposit in the
  mail after execution of an offer, the prospective buyer has five days to terminate the offer. The
  three‑day period applies only to personal delivery.
citation:
  source: Cal. Civ. Code § 1103.3(c)
  url: null
  quoted_text: If any disclosure, or any material amendment of any disclosure, required to be made
    pursuant to this article is delivered after the execution of an offer to purchase, the
    prospective buyer shall have three days after delivery in person, five days after delivery by
    deposit in the mail, or five days after delivery of an electronic record in transactions where
    the parties have agreed to conduct the transaction by electronic means, pursuant to provisions
    of the Uniform Electronic Transactions Act (Title 2.5 (commencing with Section 1633.1) of Part 2
    of Division 3), to terminate his or her offer by delivery of a written notice of termination to
    the seller or the seller’s agent.
