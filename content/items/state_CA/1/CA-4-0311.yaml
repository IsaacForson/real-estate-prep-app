stem: Under Cal. Bus. & Prof. Code § 10145(i), how is the term “neutral escrow” defined?
options:
  - An escrow business conducted by a person licensed under Division 6 (commencing with Section
    17000) of the Financial Code or by a person described in paragraph (1) or (3) of subdivision (a)
    of Section 17006 of that code
  - An escrow business conducted by a real estate broker licensed under this part or by a person
    described in subdivision (b) of Section 17006 of the Financial Code
  - An escrow business conducted by a title insurer authorized to do business in this state or by a
    person described in paragraph (2) of subdivision (a) of Section 17006 of that code
  - An escrow business conducted by a financial institution regulated by the Commissioner of
    Financial Protection and Innovation or by a person described in paragraph (4) of subdivision (a)
    of Section 17006 of that code
key: A
explanation: The definition of neutral escrow is explicitly stated in subdivision (i) of section
  10145. The correct option matches that language exactly. The option that mentions a real estate
  broker and subdivision (b) is incorrect because the statute does not include those.
