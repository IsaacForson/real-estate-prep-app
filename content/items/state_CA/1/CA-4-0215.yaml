stem: A homeowner installs a satellite dish on the roof of a rented house, bolting it to the roof,
  without any agreement about removal. At the end of the lease, the landlord demands the dish
  remain. Who owns the dish under Cal. Civ. Code § 1013?
options:
  - The landlord owns it
  - Both own it equally
  - Neither party owns it
  - The tenant owns it
key: A
explanation: Under §1013, when a person affixes property to another's land without an agreement
  permitting removal, the fixture belongs to the landowner unless the landowner requires removal or
  the affixer exercises a removal right. Here, there is no removal agreement, and the landlord wants
  the dish to stay, so the landlord owns it.
citation:
