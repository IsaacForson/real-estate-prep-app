stem: A developer sells a time‑share interest before construction is completed. The rescission
  period has expired, and the developer has not provided any financial assurance to the
  commissioner. Under Cal. Bus. & Prof. Code §§ 11210–11288 § 11243(b), what must the developer do
  with the funds received from the purchaser?
options:
  - The developer shall transfer the funds to the association's operating account to cover common
    expenses, and must notify the commissioner of the transfer within five days
  - The developer must return the funds to the purchaser unless the purchaser defaults on the
    contract, and may retain a reasonable administrative fee for processing the return
  - The developer must continue to maintain the funds in escrow until a certificate of occupancy or
    equivalent is obtained and the rescission period has passed
  - The developer may release the funds to the developer immediately after the rescission period
    ends, unless the purchaser has defaulted on the contract
key: C
explanation: Under Cal. Bus. & Prof. Code §§ 11210–11288 § 11243(b), the developer must keep the
  purchaser's funds in escrow until a certificate of occupancy (or equivalent) is obtained and the
  rescission period has passed. Returning the funds early or releasing them to the developer is not
  permitted absent that evidence.
citation:
  source: Cal. Bus. & Prof. Code §§ 11210–11288 § 11243(b)
  url: null
  quoted_text: If a developer contracts to sell a time-share interest and the construction of any
    property in which the time-share interest is located has not been completed, the developer, upon
    expiration of the rescission period, shall continue to maintain in an escrow account all funds
    received by or on behalf of the developer from the prospective purchaser under the purchase
    contract.
