stem: Under Cal. Civ. Code § 663, how is personal property defined?
options:
  - Things that can be moved easily
  - Property not attached to land
  - Any property that is not real
  - Only movable personal property
key: C
explanation: Under Cal. Civ. Code § 663, personal property is defined as every kind of property that
  is not real. Therefore the correct choice is the one stating that personal property is any
  property that is not real. The choice describing personal property as things that can be moved
  easily is incorrect because the definition is not limited to movable items; it includes all
  non‑real property, such as emblements agreed to be severed before sale, which may still be
  attached to land. The choice stating that personal property is property not attached to land is
  also incorrect because it omits items that are attached to land but are still classified as
  personal property under the statute. The choice limiting personal property to only movable
  personal property is incorrect for the same reason as the first wrong choice.
