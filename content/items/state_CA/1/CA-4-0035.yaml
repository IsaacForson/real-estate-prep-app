stem: An applicant has submitted the application to take the real estate salesperson examination but
  has not yet taken the exam. According to Cal. Code Regs. tit. 10, § 2712, when may the applicant
  submit fingerprints?
options:
  - The applicant may submit fingerprints only with the application to take the examination.
  - The applicant may submit fingerprints only after passing the examination.
  - The applicant may submit fingerprints at any time after submitting the application to take the
    examination.
  - The applicant may submit fingerprints only with the application for a real estate license.
key: C
explanation: Section 2712(b) expressly allows fingerprint submission 'at anytime after submitting
  the application to take the license examination,' which corresponds to the option stating that
  fingerprints may be submitted at any time after submitting the application to take the
  examination. The option stating that fingerprints may be submitted only with the application to
  take the examination is incorrect because it limits submission to that time only, ignoring the
  'anytime after' provision.
citation:
  source: Cal. Code Regs. tit. 10, § 2712
  url: null
  quoted_text: An original applicant for a real estate license may submit his or her fingerprints (a)
    with the application to take the license examination; (b) at anytime after submitting the
    application to take the license examination; or (c) with the application for a real estate
    license.
