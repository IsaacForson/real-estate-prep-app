stem: A developer of a time-share plan changes the escrow depository for handling purchase money
  from a bank to a title insurer. According to Cal. Code Regs. tit. 10, § 2806, what must the
  developer do?
options:
  - Notify the Bureau of the change.
  - File an amended public report with the Bureau.
  - Obtain a new surety bond for the time-share plan.
  - No action is required because the change is exempt.
key: A
explanation: Under §2806(d), a change in purchase money handling procedures, including a change of
  escrow depository, is a material change that must be reported to the Bureau. Thus the developer
  must notify the Bureau. Filing an amended public report or obtaining a new bond is not required
  for this specific change, and the change is not exempt.
