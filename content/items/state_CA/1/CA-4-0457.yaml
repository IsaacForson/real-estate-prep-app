stem: A developer fails to disclose in writing an automatic monthly billing procedure for
  maintenance fees and does not obtain the prospective purchaser’s express written authorization
  before enrolling them in that billing. Which violation of Cal. Bus. & Prof. Code § 11245(a) does
  this constitute?
options:
  - Subsection (1) – making a material misrepresentation about the time‑share plan in any
    advertisement
  - Subsection (5) – misrepresenting the availability of a resale or rental program offered by the
    developer
  - Subsection (11) – failing to disclose in writing any automatic billing procedure and obtain
    express authorization
  - Subsection (18) – failing to inform the purchaser of the procedures to cancel the purchase
    within the rescission period
key: C
explanation: Subsection (11) requires a clear written disclosure of any automatic charging or
  billing procedure and the express written authorization of the purchaser; failure to do both
  violates this provision.
citation:
  source: Cal. Bus. & Prof. Code §§ 11210–11288 § 11245(a)(11)
  url: null
  quoted_text: (11) Fail to clearly disclose in writing any automatic charging or billing procedure,
    and fail thereafter to obtain the express written authorization from the prospective purchaser
    for any purchase, subscription, or enrollment that results in that automatic charging or billing
    of initial or periodic amounts to the prospective purchaser.
