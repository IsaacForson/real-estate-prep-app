stem: Under Cal. Civ. Code §§ 4250–4276, what is the minimum written notice period that a petitioner
  must give to association members before a court hearing on a petition to reduce the required
  affirmative vote percentage for amending a declaration?
options:
  - At least 15 days
  - At least 20 days
  - At least 5 days
  - At least 10 days
key: A
explanation: The rule requires the petitioner to give not less than 15 days written notice of the
  court hearing, so a 15‑day notice satisfies the requirement. A 10‑day notice is insufficient
  because the statute explicitly demands at least 15 days.
