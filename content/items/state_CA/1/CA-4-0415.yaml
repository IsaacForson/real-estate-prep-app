stem: A declaration for a common interest development has an initial term of 8 years. According to
  Cal. Civ. Code §§ 4250–4276, what is the maximum number of years that a single extension of the
  declaration’s term may be granted under § 4265(c)?
options:
  - Eight years
  - Twelve years
  - Twenty years
  - Four years
key: A
explanation: Section 4265(c) limits any single extension to the lesser of the declaration’s initial
  term or 20 years. With an 8‑year initial term, the lesser value is 8 years, so the maximum
  extension is 8 years. The distractor “Twenty years” mistakenly applies the 20‑year cap without
  first comparing it to the shorter initial term.
citation:
