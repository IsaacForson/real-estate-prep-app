stem: A real estate salesperson who was not licensed at the time a commission was earned sues a
  client for that commission. To succeed in the action, what must the salesperson do under Cal. Bus.
  & Prof. Code § 10136?
options:
  - The salesperson must prove the client agreed to pay the commission
  - The salesperson must allege and prove they were duly licensed at the time the cause of action
    arose
  - The salesperson must show the commission was earned through a licensed broker
  - The salesperson must obtain a license before filing the lawsuit
key: B
explanation: Under Cal. Bus. & Prof. Code § 10136, a plaintiff cannot maintain an action for
  compensation unless they allege and prove they were duly licensed at the time the cause of action
  arose. Therefore the salesperson must allege and prove licensure at that time. Simply showing the
  client agreed to pay the commission does not satisfy the licensing requirement. Showing the
  commission was earned through a licensed broker also does not meet the statutory condition.
  Obtaining a license after the fact and before filing the lawsuit does not cure the defect because
  the license must have existed when the cause of action arose.
