stem: Under Cal. Bus. & Prof. Code § 11010.2, if the Commissioner fails to act within the time
  periods prescribed for reviewing a subdivision public report application, what restriction applies
  to a denial of the public report?
options:
  - The Commissioner may not base the denial on lack of an airport influence notice
  - The Commissioner may not base the denial on lack of adequate information
  - The Commissioner may not base the denial on lack of a school district statement
  - The Commissioner may not base the denial on lack of a water supply verification
key: B
explanation: The statute explicitly states that the commissioner may not base a denial on lack of
  adequate information if the commissioner has not acted within the prescribed time periods. This
  prohibits using insufficiency as a grounds for denial when the commissioner’s own delay caused the
  deficiency. The distractor about issuing the report without delay is incorrect because the statute
  does not mandate immediate issuance; it only limits the basis for denial.
