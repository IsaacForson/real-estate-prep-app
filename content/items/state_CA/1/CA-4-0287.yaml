stem: Which of the following is **NOT** prohibited from using the Natural Hazard Disclosure Statement?
options:
  - Lenders
  - Insurance companies
  - Prospective buyers
  - Governmental agencies
key: C
explanation: Under Cal. Civ. Code § 1103.2(g), the disclosure is only between the seller, the
  seller’s agent, and the prospective buyer and shall not be used by any other party, including
  insurance companies, lenders, or governmental agencies. Therefore, prospective buyers are not
  prohibited from using the statement.
