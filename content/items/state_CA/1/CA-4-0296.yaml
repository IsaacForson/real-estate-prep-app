stem: Under Cal. Code Regs. tit. 10, § 2830(b), how is a 'compensating balance' defined?
options:
  - A compensating balance is a balance maintained in the broker's personal account to cover
    overdraft fees on the trust account and is considered a prohibited inducement under trust fund
    regulations.
  - A compensating balance is a balance maintained in a checking account or other account in a bank
    or other recognized depository in the name of a real estate broker for the purpose of paying
    bank fees on a separate trust fund account.
  - A compensating balance is an escrow deposit held by the broker on behalf of a client for future
    property tax payments and does not serve to offset any bank fees associated with trust accounts.
  - A compensating balance is a minimum balance required by the bank to avoid service charges on the
    broker's operating account and is not related to any trust fund account administration.
key: B
explanation: "Under Cal. Code Regs. tit. 10, § 2830(b), a compensating balance is a balance
  maintained in a checking account or other account in a bank or other recognized depository in the
  name of a real estate broker for the purpose of paying bank fees on a separate trust fund account.
  The other answer choices are incorrect: one describes a balance in the broker's personal account
  to cover overdraft fees and labels it a prohibited inducement; another describes an escrow deposit
  for future property tax payments that does not offset bank fees; another describes a minimum
  balance required by the bank to avoid service charges on the broker's operating account and says
  it is unrelated to trust fund administration."
