stem: A county enacts an ordinance that mandates time-share associations to collect an extra fee for
  local infrastructure improvements. Under Cal. Bus. & Prof. Code § 11280(a), is this ordinance
  permissible?
options:
  - The ordinance is permissible because local governments may supplement state regulations
  - The ordinance is permissible if the fee is approved by the commissioner
  - The ordinance is not permissible unless it also receives voter approval
  - The ordinance is not permissible because regulation of time-share plans is an exclusive state
    power
key: D
explanation: Subsection (a) states that regulation of time-share plans is an exclusive power of the
  state and that a unit of local government may not regulate such plans. Therefore the county
  ordinance is invalid. The idea that local governments can supplement state rules contradicts the
  explicit prohibition on local regulation.
