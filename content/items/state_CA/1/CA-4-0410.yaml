stem: Under Cal. Code Regs. tit. 10, § 2799.1, which of the following is expressly prohibited in
  advertising for sale or lease of subdivision interests?
options:
  - Stating that the subdivision's name is as set forth in the Notice of Intention
  - Implying a use of a subdivision interest that is not set forth in the Notice of Intention and
    Questionnaire
  - Providing an estimated completion date for unfinished utilities after bonding approval
  - Advertising completed improvements that are ready for resident use and approved by the
    commissioner
key: B
explanation: Cal. Code Regs. tit. 10, § 2799.1(1) forbids any advertisement that implies a use of a
  subdivision interest that is not set forth in the Notice of Intention and Questionnaire.
  Therefore, stating the subdivision's name exactly as it appears in the Notice is allowed because
  it does not imply any use beyond what is listed. Implying a use that is not included in the Notice
  is prohibited. Providing an estimated completion date for unfinished utilities after bonding
  approval, and advertising completed improvements that are ready for resident use and approved by
  the commissioner, are permissible because they do not suggest an unauthorized use.
