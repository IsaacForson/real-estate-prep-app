stem: An association’s budgeted gross expenses for the fiscal year are $200,000. It proposes a
  special assessment of $25,000 to repair damage to an accommodation. Under Cal. Bus. & Prof. Code §
  11265(a)(6)(B), is this special assessment permissible without a vote of the owners other than the
  developer?
options:
  - The special assessment is permissible because it does not exceed 5% of the budgeted gross
    expenses.
  - The special assessment is not permissible because it exceeds 5% of the budgeted gross expenses.
  - The special assessment is permissible because it does not exceed 10% of the budgeted gross
    expenses.
  - The special assessment is not permissible because it exceeds 10% of the budgeted gross expenses.
key: D
explanation: Under Cal. Bus. & Prof. Code § 11265(a)(6)(B), a special assessment for repair or
  rebuilding of an accommodation may not exceed 10 percent of the association's budgeted gross
  expenses for the fiscal year without a vote. Ten percent of $200,000 is $20,000. The proposed
  $25,000 exceeds this limit, so a vote is required.
