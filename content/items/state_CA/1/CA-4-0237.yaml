stem: Before the association can impose a monetary penalty on a time-share interest owner for
  damaging an accommodation, what procedural step must the association take according to Cal. Bus. &
  Prof. Code § 11274(d)?
options:
  - The association must provide the owner with 30-days prior written notice and the opportunity to
    present a written or oral defense to the charges
  - The association must obtain a court judgment authorizing the penalty before any notice is given
  - The association may impose the penalty immediately after deciding, as long as the owner is
    delinquent in assessments
  - The association must first suspend the owner's occupancy rights for at least 30 days before
    considering a penalty
key: A
explanation: Subdivision (d) requires that before any disciplinary action under subdivision (c)
  (including monetary penalties) can be imposed, the owner must receive 30‑days prior written notice
  and an opportunity to defend against the charges. The option stating that the association must
  obtain a court judgment before giving notice adds a step not required by the statute. The option
  claiming the association may impose the penalty immediately after deciding, provided the owner is
  delinquent in assessments, waives the notice requirement that the statute mandates. The option
  that says the association must first suspend occupancy rights for at least 30 days before
  considering a penalty introduces an additional precondition not present in the law.
citation:
  source: Cal. Bus. & Prof. Code §§ 11210–11288 — B&P Code Div. 4, Pt. 2, Ch. 2 - Vacation Ownership
