stem: A developer offers a time-share interest to a purchaser who previously acquired a time-share
  interest from the same developer. The developer’s time-share plan was registered and approved by
  the commissioner within the preceding seven years, the developer complies with §11245, provides a
  seven‑day cancellation period, all required disclosure documents, and the statutory disclaimer.
  Under Cal. Bus. & Prof. Code § 11225(d)(1), is the developer required to register the time-share
  plan for this transaction?
options:
  - Yes, registration is required because any sale of a time-share interest triggers registration.
  - No, registration is not required because the transaction qualifies for an exemption.
  - Yes, registration is required unless the developer provides a cancellation period of at least
    seven days.
  - No, registration is not required only if the developer is offering a new time-share interest.
key: B
explanation: Subsection 11225(d)(1) exempts from registration a developer who sells a time-share
  interest to a prior purchaser when the plan is registered, approved within the prior seven years,
  the developer complies with §11245, provides a seven‑day cancellation period, all required
  disclosures, and the statutory disclaimer. Since all conditions are met, registration is not
  required.
citation:
  source: Cal. Bus. & Prof. Code § 11225(d)(1)
  url: null
  quoted_text: "The developer is offering or disposing of a time-share interest to a purchaser who has
    previously acquired a time-share interest from the same developer if the developer has a
    time-share plan registered under this chapter, which was originally approved by the commissioner
    within the preceding seven years, and the developer complies in all respects with the provisions
    of Section 11245, and, further, provides the purchaser with (A) a cancellation period of at
    least seven days, (B) all the time-share disclosure documents that are required to be provided
    to purchasers as if the sale occurred in the state or jurisdiction where the time-share property
    is located, and (C) the following disclaimer in conspicuous type:"
