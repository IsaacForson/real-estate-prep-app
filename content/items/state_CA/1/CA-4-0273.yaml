stem: A licensee has received a 90‑day extension for benefit renewal under Cal. Code Regs. tit. 10,
  § 2705(n)(2) after demonstrating good cause and completing required continuing education. What is
  the maximum length of the additional extension that may be granted?
options:
  - 60 days
  - 90 days
  - 30 days
  - 120 days
key: A
explanation: Section 2705(n)(2) allows the Bureau to grant an additional extension not to exceed 60
  days upon a written request showing good cause and proof of continuing education compliance. The
  90‑day option recalls the initial extension and is a typical mistaken choice.
