stem: Under Cal. Code Regs. tit. 10, § 2792.1(15)(B), what provision must be included in the
  exemplar of escrow instructions for a subdivision public report?
options:
  - A provision that requires the return of funds to nondefaulting buyers if escrows do not close by
    the prescribed date.
  - A provision that allows the subdivider to retain deposited funds if escrows close after the
    prescribed date.
  - A provision that mandates interest accrual on deposited funds during the escrow period.
  - A provision that permits the escrow depository to change the closing date without notice.
key: A
explanation: The rule explicitly requires escrow instructions to provide for the return of funds to
  nondefaulting buyers if escrows do not close by the prescribed date. The distractor that suggests
  the subdivider may retain deposited funds contradicts this requirement, as the rule mandates
  return to buyers, not retention by the subdivider.
citation:
