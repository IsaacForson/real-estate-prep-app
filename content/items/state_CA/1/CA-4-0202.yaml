stem: A broker relocates her principal place of business from Sacramento to Fresno on a Monday.
  According to Cal. Code Regs. tit. 10, § 2715, by what deadline must she notify the Commissioner of
  the change?
options:
  - By the end of the fifth business day
  - By the close of the next business day
  - By the end of that Monday
  - By the end of the second business day
key: B
explanation: The rule requires notification not later than the next business day following the
  change, so the broker must notify by the close of the next business day. The distractor suggesting
  the end of the second business day allows too much time and does not comply with the 'not later
  than' requirement.
citation:
  source: Cal. Code Regs. tit. 10, § 2715
  url: null
  quoted_text: Whenever there is a change in the location or address of the principal place of
    business or of a branch office of a broker, that broker shall notify the Commissioner thereof
    not later than the next business day following the change.
