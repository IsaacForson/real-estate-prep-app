stem: Under Cal. Code Regs. tit. 10, § 2705(a), which of the following best describes 'Advertising'?
options:
  - Any written or printed communication, or oral communication made in accordance with a text or
    outline that has been reduced to written form, which is published for the purpose of inducing
    persons to purchase or use a product or service.
  - Any written or printed communication, or oral communication made in accordance with a text or
    outline that has been reduced to written form, which is published for the purpose of inducing
    persons to purchase or use a product or service, and is distributed exclusively online.
  - Any written or printed communication, or oral communication made in accordance with a text or
    outline that has been reduced to written form, which is published for the purpose of inducing
    persons to purchase or use a product or service, and requires the approval of the Commissioner
    before dissemination.
  - Any written or printed communication, or oral communication made in accordance with a text or
    outline that has been reduced to written form, which is published for the purpose of inducing
    persons to purchase or use a product or service, and must be submitted to the Bureau within 24
    hours of creation.
key: A
explanation: Cal. Code Regs. tit. 10, § 2705(a) defines advertising as any written or printed
  communication, or oral communication made in accordance with a text or outline that has been
  reduced to written form, which is published for the purpose of inducing persons to purchase or use
  a product or service. The option that states this definition exactly—without any extra
  conditions—is correct. The other options incorrectly add requirements such as limiting
  distribution to online only, requiring commissioner approval, or mandating submission to the
  Bureau within 24 hours, none of which appear in the regulation.
