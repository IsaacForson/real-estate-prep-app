stem: A developer of a time-share plan learns that the swimming pool advertised in the public report
  will not be completed as promised. According to Cal. Code Regs. tit. 10, § 2806, what action must
  the developer take?
options:
  - Report to the Bureau of Real Estate the relevant details concerning the change.
  - Submit an amended public report to the Commissioner and await approval before continuing sales.
  - Take no action unless the change also affects the trust account balances.
  - Notify each prospective buyer individually about the swimming pool cancellation before any
    further sales.
key: A
explanation: The regulation requires the developer to report to the Bureau of Real Estate relevant
  details concerning any material change in the time-share plan. Notifying each prospective buyer
  individually about the swimming pool cancellation before any further sales is not required by the
  rule; the Bureau must be informed instead.
