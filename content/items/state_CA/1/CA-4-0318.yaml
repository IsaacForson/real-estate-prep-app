stem: A real estate licensee who is 72 years old has held an active license for 35 years but had a
  disciplinary suspension that ended two years ago. Under Cal. Bus. & Prof. Code § 10170.8(a), is
  this licensee exempt from continuing education requirements?
options:
  - The licensee is exempt because the age and total years of licensure satisfy the statute.
  - The licensee is not exempt because the suspension breaks the required continuous good‑standing
    period.
  - The licensee is exempt because any disciplinary action older than one year is disregarded.
  - The licensee is not exempt because the statute requires the licensee to be exactly 70 years old.
key: B
explanation: To qualify for the exemption, the licensee must have been in good standing for 30
  continuous years. A disciplinary suspension breaks good‑standing status, so the continuous‑years
  requirement is not met. The option that claims exemption based on age and total years ignores the
  suspension; the option that claims exemption because any disciplinary action older than one year
  is disregarded is incorrect; the option that claims exemption because the statute requires the
  licensee to be exactly 70 years old misstates the age requirement.
