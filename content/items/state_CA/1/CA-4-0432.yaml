stem: A broker’s fiscal year ends on June 30, 2024. Assuming no additional time is granted, what is
  the latest date by which the broker must file the business activities report required under Cal.
  Bus. & Prof. Code § 10166.07?
options:
  - September 30, 2024
  - September 28, 2024
  - August 30, 2024
  - October 1, 2024
key: B
explanation: Adding 90 days to June 30, 2024 yields September 28, 2024. The other options result
  from miscalculating the number of days in July and August.
citation:
  source: "Cal. Bus. & Prof. Code §§ 10130–10171.5 — B&P Code Div. 4, Pt. 1, Ch. 3, Arts. 1-2.5 (§§
    10130-10171.5) - Real Estate Regulations: Scope, Licenses, Exams, Fictitious names,
    Corporations, Restricted licenses Cal. Bus. & Prof. Code § 10166.07(a)"
  url: null
  quoted_text: shall annually file a business activities report, within 90 days after the end of the
    broker’s fiscal year
  secondary: []
math:
  worked_solution: |-
    Start date: June 30, 2024
    Add 31 days for July → July 31, 2024 (31 days used)
    Add 31 days for August → August 31, 2024 (62 days used)
    Add remaining 28 days → September 28, 2024 (90 days total)
  formulas:
    - Result = Start date + 90 days
