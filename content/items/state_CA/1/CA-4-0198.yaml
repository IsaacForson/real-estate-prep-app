stem: Under Cal. Civ. Code § 660, which of the following would be treated as personal property
  (goods) because it is agreed to be severed before sale?
options:
  - Industrial growing crops agreed to be severed before sale
  - A vineyard's grapevines attached by roots
  - A building's foundation imbedded in the land
  - A barn permanently resting on the land
key: A
explanation: The exception in § 660 states that emblements, industrial growing crops and things
  attached to or forming part of the land which are agreed to be severed before sale or under the
  contract of sale shall be treated as goods. Therefore, industrial growing crops agreed to be
  severed before sale are personal property. A vineyard's grapevines attached by roots remain
  affixed because there is no agreement to sever them before sale.
