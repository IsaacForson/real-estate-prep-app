stem: A time-share association plans to increase its regular assessment. According to Cal. Bus. &
  Prof. Code § 11265.1(c), what is the minimum notice period the association must give owners before
  the increased assessment becomes due?
options:
  - The association must give 45 days' notice before the increased assessment becomes due.
  - The association must give 60 days' notice before the increased assessment becomes due.
  - The association must give 30 days' notice before the increased assessment becomes due.
  - The association must give 15 days' notice before the increased assessment becomes due.
key: C
explanation: The statute requires notice not less than 30 days nor more than 60 days prior to the
  increased assessment becoming due, so the minimum notice is 30 days. The 60 days' notice option
  states the maximum allowable notice, not the minimum required.
