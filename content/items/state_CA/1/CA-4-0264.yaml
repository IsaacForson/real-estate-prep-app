stem: A proposed set of governing instruments includes a procedure for calculating regular
  assessments but does not include a procedure for collecting them. Does it satisfy the requirement
  under Cal. Code Regs. tit. 10, § 2792.8(4)?
options:
  - Yes, because calculating assessments alone satisfies the rule
  - No, because both calculating and collecting are required
  - Yes, because the requirement only mentions calculating assessments
  - No, because the requirement applies only to special assessments
key: B
explanation: Subsection (4) mandates both calculating and collecting regular assessments; omitting
  the collection procedure fails to meet the standard. The distractor that claims calculating alone
  is sufficient misreads the conjunctive language of the rule.
