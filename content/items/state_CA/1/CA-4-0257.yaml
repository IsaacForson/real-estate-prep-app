stem: Under Cal. Bus. & Prof. Code § 11000.2(a), how many calendar days does a prospective purchaser
  have to rescind a contract after executing an offer to purchase an interest in an
  undivided-interest subdivision?
options:
  - 1 day
  - 2 days
  - 3 days
  - 5 days
key: C
explanation: The statute provides the right to rescind until midnight of the third calendar day
  following the day the offer was executed, giving a three‑day rescission period. The two‑day option
  mistakenly counts only the day after the offer and the next day, omitting the third day.
