stem: A licensee wants to complete two correspondence courses totaling 18 credit hours in a single
  24‑hour period. According to Cal. Code Regs. tit. 10, § 3007.3(c), what is the maximum number of
  credit hours for which the licensee may be granted access to the final examinations during that
  period?
options:
  - The licensee may be granted access to final examinations for up to 15 credit hours during any
    one 24‑hour period.
  - The licensee may be granted access to final examinations for up to 10 credit hours during any
    one 24‑hour period.
  - The licensee may be granted access to final examinations for up to 18 credit hours during any
    one 24‑hour period.
  - The licensee may be granted access to final examinations for up to 20 credit hours during any
    one 24‑hour period.
key: A
explanation: Section 3007.3(c) limits correspondence course final examinations to a maximum of
  fifteen credit hours in any 24‑hour period, so the licensee may only access exams for up to 15
  credit hours. The distractor suggesting 18 credit hours incorrectly assumes the total course hours
  dictate the limit, ignoring the regulatory cap.
citation:
