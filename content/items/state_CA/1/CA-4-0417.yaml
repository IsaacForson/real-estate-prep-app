stem: A servicemember receives a Permanent Change of Station order assigning them to a duty station
  outside California. According to Cal. Code Regs. tit. 10, § 2759.6(a)(1), within how many days
  must the servicemember notify the Department of this change?
options:
  - 15 days
  - 30 days
  - 45 days
  - 60 days
key: B
explanation: Section 2759.6(a) requires registrants to notify the Department within 30 days of
  events such as issuance of new military orders to a duty station outside California. The other
  time frames do not match this requirement.
