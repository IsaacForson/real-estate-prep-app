  - 60 days
  - 120 days
  - 30 days
key: A
explanation: The statute requires the report to be filed within 90 days after the end of the
  broker’s fiscal year. The 60‑day option applies only to payment of the commissioner’s examination
  cost, not to the filing deadline.
