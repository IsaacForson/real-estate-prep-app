stem: A licensee accepts a fee and, within five days, provides only two rental properties that meet
  the tenant’s specifications. The tenant does not obtain a rental through the licensee. What must
  the licensee do under Cal. Bus. & Prof. Code § 10167.10(a)(1)?
options:
  - Refund the full fee as agreed
  - Refund the fee less fifty dollars
  - Refund the fee less actual cost
  - Refund none of the fee as required
key: A
explanation: The licensee must refund the full fee because they failed to supply at least three
  matching properties within five days and the tenant did not obtain a rental through the licensee.
  The statute requires a full refund in this situation. The other options incorrectly apply a
  service charge or no refund.
citation:
  source: "Cal. Bus. & Prof. Code §§ 10130–10171.5 — B&P Code Div. 4, Pt. 1, Ch. 3, Arts. 1-2.5 (§§
    10130-10171.5) - Real Estate Regulations: Scope, Licenses, Exams, Fictitious names,
    Corporations, Restricted licenses § 10167.10(a)(1)"
  url: null
  quoted_text: A licensee shall refund in full the fee paid by a prospective tenant if the licensee
    does not, within five days after execution of the contract, supply at least three rental
    properties then available to the prospective tenant and meeting the specifications of the
    contract
