stem: A members’ meeting of an association fails to achieve a quorum. Under Cal. Code Regs. tit. 10,
  § 2792.18(e)(2), what is the latest date to which the meeting may be adjourned for lack of a
  quorum?
options:
  - Sixty days after the original meeting date
  - Thirty-one days after the original meeting date
  - Thirty days after the original meeting date
  - Four days after the original meeting date
key: C
explanation: The rule states an adjournment for lack of a quorum shall be to a date not more than 30
  days from the original meeting date, making thirty days the latest permissible adjournment. The
  distractor of sixty days exceeds the allowed maximum.
