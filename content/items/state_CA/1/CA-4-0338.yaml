stem: When may a licensee use a fictitious name in conducting licensed real estate activity?
options:
  - Only if the licensee also uses a nickname as a last name on all advertising.
  - Only if the licensee holds a license issued under that fictitious name.
  - Only if the licensee uses a fictitious name that includes the term 'escrow'.
  - Only if the licensee has been licensed for at least five years in the state.
key: B
explanation: Cal. Code Regs. tit. 10, § 2731(a) states that a licensee may not use a fictitious name
  unless the licensee holds a license issued under that name. Therefore, the correct choice is the
  one that says a licensee may use a fictitious name only if the licensee holds a license issued
  under that fictitious name. The other options are incorrect because using a nickname, including
  the term 'escrow', or having five years of licensure does not satisfy the requirement.
citation:
  source: Cal. Code Regs. tit. 10, § 2731(a)
  url: null
  quoted_text: A licensee shall not use a fictitious name in the conduct of any activity for which a
    license is required under the Real Estate Law unless the licensee is the holder of a license
    bearing the fictitious name.
