stem: A sponsor wishes to include a copyrighted video clip in a continuing education course.
  According to Cal. Code Regs. tit. 10, § 2705(b), what must the sponsor submit to the Bureau?
options:
  - The sponsor must submit a signed statement from the course instructor affirming that the use of
    the clip qualifies as fair use under copyright law.
  - The sponsor must submit a receipt showing payment of royalties to the copyright holder, along
    with the relevant invoice and payment date.
  - The sponsor must submit a copyright authorization from the copyright holder specifying the
    material that may be used and to whom the authorization has been granted.
  - The sponsor must submit a copy of the video clip’s licensing agreement with the Bureau,
    including the effective date and scope of permitted use.
key: C
explanation: Section 2705(b) explicitly requires a copyright authorization from the holder
  specifying the material and the grantee when copyrighted material would otherwise violate
  copyright law. The distractor about a licensing agreement with the Bureau is incorrect because the
  regulation does not require Bureau approval of such agreements, only the holder’s authorization.
