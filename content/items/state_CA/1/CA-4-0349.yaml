stem: A declaration for a common interest development has an initial term of 12 years. According to
  Cal. Civ. Code §§ 4250–4276, what is the maximum number of years that a single extension of the
  declaration’s term may be granted under § 4265(c)?
options:
  - 12 years
  - 15 years
  - 20 years
  - 25 years
key: A
explanation: The statute limits any single extension to the initial term or 20 years, whichever is
  less. With a 12‑year initial term, the lesser value is 12 years, so the extension cannot exceed
  that. An extension of 20 years would exceed the initial term and thus is not permitted.
citation:
