stem: According to the statutory agency disclosure form described in Section 2079.16, what duty does
  a seller's agent owe to the seller?
options:
  - A fiduciary duty of utmost care, integrity, honesty, and loyalty in dealings with the seller.
  - A limited duty of reasonable communication and a timely response to all of the seller's
    inquiries.
  - A general duty of good faith similar to the duty owed to unrepresented third parties.
  - A contractual duty of best efforts defined solely by the listing agreement's terms.
key: A
explanation: The statutory disclosure form in Section 2079.16 states that a seller's agent owes the
  seller a fiduciary duty of utmost care, integrity, honesty, and loyalty, a higher standard than
  the duties owed to the other party in the transaction.
