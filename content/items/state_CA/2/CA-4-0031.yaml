stem: Under Section 2079.4 of the Civil Code, what is the maximum period allowed for filing a
  lawsuit for breach of the duty to disclose material facts to a prospective buyer?
options:
  - Two years from the date of possession.
  - One year from the date of possession.
  - Three years from the date of possession.
  - Five years from the date of possession.
key: A
explanation: Section 2079.4 states that the time for commencement of legal action for breach of duty
  shall not exceed two years from the date of possession. Therefore, the longest permissible period
  is two years. A one‑year limit is too short and would bar otherwise timely claims.
