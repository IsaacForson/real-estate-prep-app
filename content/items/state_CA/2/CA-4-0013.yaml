stem: A property owner orally promises to pay a licensee a commission for finding a buyer under an
  arrangement that would run for two years. Under Section 1624, what is required for this
  compensation agreement to be enforceable?
options:
  - An oral agreement, since real estate commission arrangements are enforceable however made.
  - A written agreement, since the arrangement authorizes an agent to find a real estate buyer for a
    fee.
  - A recorded agreement, since the county recorder must certify all such commission arrangements
    well in advance.
  - A verbal agreement, since brokers may rely on custom and practice rather than a signed writing.
key: B
explanation: Section 1624 makes an agreement authorizing an agent or broker to find a purchaser or
  seller of real estate for compensation invalid unless it, or a note or memorandum of it, is in
  writing and subscribed by the party to be charged.
citation:
  source: Cal. Civ. Code § 1624
  url: null
  quoted_text: An agreement authorizing or employing an agent, broker, or any other person to purchase
    or sell real estate, or to lease real estate for a longer period than one year, or to procure,
    introduce, or find a purchaser or seller of real estate or a lessee or lessor of real estate
    where the lease is for a longer period than one year, for compensation or a commission.
