stem: A homeowner hires a real estate salesperson to market the property and to negotiate offers
  with prospective buyers. Which description best characterizes the salesperson's relationship to
  the homeowner under Section 2295?
options:
  - An broker acting solely as a consultant to the homeowner without representation.
  - An third‑party facilitator who provides services but does not represent the homeowner.
  - An agent representing the homeowner in dealings with third persons.
  - An tenant who occupies the homeowner's property and has no agency relationship.
key: C
explanation: Section 2295 defines an agent as one who "represents another, called the principal, in
  dealings with third persons." The salesperson is hired to negotiate with buyers, thus representing
  the homeowner in third‑person dealings. The other options describe roles that lack representation
  of the principal, so they do not meet the statutory definition.
