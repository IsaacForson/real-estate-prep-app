stem: A licensee is hired to manage all aspects of a client's real estate portfolio, including
  buying, selling, leasing, and property maintenance. Under Section 2297, how should the licensee’s
  authority be classified?
options:
  - A special agent
  - A general agent
  - A universal agent
  - A subagent
key: B
explanation: Section 2297 states that all agents who are not limited to a particular act or
  transaction are general agents. Managing multiple aspects of a portfolio involves more than one
  act, so the licensee is a general agent. The special agent option applies only to a single act or
  transaction.
