stem: "Under Cal. Civ. Code § 1620, an express contract is defined as:"
options:
  - A contract whose terms are stated in words
  - A contract that is not enforceable unless recorded
  - A contract inferred from the parties' conduct
  - A contract that must be in writing to be enforceable
key: A
explanation: Section 1620 defines an express contract as one whose terms are stated in words. A
  contract inferred from the parties' conduct is an implied contract under § 1621, so the statement
  that a contract is not enforceable unless recorded does not match the definition. Likewise, the
  statements that a contract must be inferred from conduct or must be in writing to be enforceable
  add requirements not found in § 1620.
