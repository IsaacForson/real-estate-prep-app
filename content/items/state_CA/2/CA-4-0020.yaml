stem: A buyer sues a broker for failing to detect a defect during a visual inspection of a property.
  Under Section 2079.2, what standard of care applies to that inspection?
options:
  - The degree of care a reasonably prudent real estate licensee would exercise.
  - The degree of care an expert home inspector with engineering training would exercise.
  - The degree of care an average homeowner without professional training would exercise.
  - The degree of care a licensed contractor performing structural repairs would exercise.
key: A
explanation: Section 2079.2 measures a broker's standard of care by the degree of care a reasonably
  prudent real estate licensee would exercise, based on the knowledge required to obtain a real
  estate license.
citation:
  source: Cal. Civ. Code § 2079.2
  url: null
  quoted_text: The standard of care owed by a broker under this article is the degree of care that a
    reasonably prudent real estate licensee would exercise and is measured by the degree of
    knowledge through education, experience, and examination, required to obtain a license under
    Division 4 (commencing with Section 10000) of the Business and Professions Code.
