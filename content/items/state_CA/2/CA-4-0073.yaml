stem: A property owner asks a friend to show a house to a prospective buyer as a favor, with no
  discussion of compensation. After the showing, the owner agrees to pay the friend a commission.
  Under Cal. Civ. Code § 2307, how is the agency relationship between the owner and the friend
  established?
options:
  - By subsequent ratification, because the owner later agreed to pay a commission for the act
    performed
  - By precedent authorization, because the owner asked the friend to show the house as a favor
  - By subsequent ratification, only if the friend had a real estate license at time of showing
  - By precedent authorization, because showing a house is a necessary step in selling real property
key: A
explanation: The statute provides that agency may be created by subsequent ratification when the
  principal later approves the act. A mere favor does not constitute precedent authorization to act
  as an agent, so the first distractor is incorrect.
citation:
  source: Cal. Civ. Code § 2307
  url: null
  quoted_text: An agency may be created, and an authority may be conferred, by a precedent
    authorization or a subsequent ratification.
