stem: A buyer purchases a home and later discovers a cracked foundation that was visible during a
  reasonable inspection. Under Section 2079.5, what effect does this have on the buyer's ability to
  claim breach of duty by the broker?
options:
  - The buyer is barred from recovery because they had a duty to exercise reasonable care.
  - The buyer may recover damages because the broker's inspection was insufficient.
  - The buyer may recover damages if the defect was obvious and easily seen.
  - The buyer can still sue the broker for nondisclosure because the broker must discover all
    defects.
key: A
explanation: Section 2079.5 provides that nothing in the article relieves a buyer of the duty to
  exercise reasonable care to protect themselves, including facts within their diligent observation.
  Because the cracked foundation was observable, the buyer’s failure to notice it bars recovery. The
  broker’s inspection adequacy does not override the buyer’s own duty.
