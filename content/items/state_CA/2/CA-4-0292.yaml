stem: A broker repeatedly compensates unlicensed assistants to perform licensed acts. Under Cal.
  Bus. & Prof. Code § 10137, what is the most severe disciplinary action the Commissioner may
  impose?
options:
  - Temporary suspension of the broker's real estate license.
  - Permanent revocation of the real estate license.
  - Either suspension or revocation of the license.
  - A monetary fine imposed by the California Commissioner.
key: B
explanation: The statute permits temporary suspension or permanent revocation, with permanent
  revocation being the more severe penalty. The distractor listing both actions does not identify a
  single most severe action.
