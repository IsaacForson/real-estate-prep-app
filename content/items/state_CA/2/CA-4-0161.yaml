stem: A seller authorizes a broker to obtain a loan commitment from a lender on the seller's behalf.
  Under Section 2297 of the Civil Code, how should the broker’s authority be classified?
options:
  - A special agent
  - A general agent
  - A universal agent
  - A limited agent
key: A
explanation: Section 2297 states that an agent for a particular act or transaction is a special
  agent, while all others are general agents. Obtaining a loan commitment is a single, specific act,
  so the broker is a special agent. A general agent would handle ongoing or multiple matters, which
  is not the case here.
