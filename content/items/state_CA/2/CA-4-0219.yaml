stem: A licensee is authorized to show a property to a prospective buyer but not to negotiate price
  or accept offers. Under Section 2297, how should the licensee’s authority be classified?
options:
  - A universal agent
  - A subagent
  - A special agent
  - A general agent
key: C
explanation: Section 2297 defines an agent for a particular act or transaction as a special agent.
  Showing a property is a particular act, so the licensee is a special agent. A general agent would
  have authority over all acts, which is not the case here.
