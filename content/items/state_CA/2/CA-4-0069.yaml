stem: A licensee and a seller want to change their agency relationship from seller's agent to dual
  agent before any performance has occurred. Under Section 2079.23(a), what is required for this
  change to be valid?
options:
  - Written consent of both the licensee and the seller
  - A new written listing agreement signed by the seller only
  - Verbal agreement between the licensee and the seller
  - Approval from the real estate commissioner
key: A
explanation: Section 2079.23(a) states that a contract between principal and agent may be modified
  to change the agency relationship before performance only with the written consent of the parties.
  A verbal agreement does not satisfy the written consent requirement, making it insufficient.
citation:
  source: Cal. Civ. Code §§ 2079–2079.25 — Cal. Civil Code - ARTICLE 2. Duty to Prospective Purchaser
    of Real Property 2079-2079.25 § 2079.23
  url: null
  quoted_text: A contract between the principal and agent may be modified or altered to change the
    agency relationship at any time before the performance of the act which is the object of the
    agency with the written consent of the parties to the agency relationship.
