stem: Under Section 2295 of the Civil Code, what is an agent?
options:
  - One who negotiates only monetary transactions on behalf of another person.
  - One who supervises other licensees performing licensed acts on behalf of another person.
  - One who guarantees the performance of contracts made by another person entirely.
  - One who represents another, the principal, in dealings with third persons.
key: D
explanation: Section 2295 defines an agent as one who represents another, called the principal, in
  dealings with third persons, and that representation itself is what the law calls agency.
