stem: A brokerage drafts a printed listing agreement establishing the broker's right to a commission
  on the sale of a four-unit residential property. Under Section 10147.5, what statement must appear
  in boldface immediately before the compensation provision?
options:
  - A statement that commission rates are fixed by state law and identical among all brokers.
  - A statement that commission rates require prior approval from the local board of realtors.
  - A statement that commission amounts are set by the Department of Real Estate for every single
    licensee statewide.
  - A statement that commission amounts are not fixed by law and are negotiable between the parties.
key: D
explanation: Section 10147.5 requires such agreements to state in boldface that real estate
  commissions are not fixed by law, are set individually by each broker, and may be negotiable
  between the parties.
citation:
  source: Cal. Bus. & Prof. Code § 10147.5
  url: null
  quoted_text: "Notice: The amount or rate of real estate commissions is not fixed by law. They are
    set by each broker individually and may be negotiable between the seller and broker."
