stem: A lender asks a homeowner to sign an agreement promising to indemnify the lender for any
  liability arising from the lender’s actions in a real estate transaction. Under Section
  2079.23(b), what is the legal effect of such an indemnity clause?
options:
  - Enforceable if the homeowner receives a copy of the agreement
  - Valid only if approved by the real estate commissioner
  - Against public policy, void, and unenforceable
  - Permitted as long as it is limited to actual damages
key: C
explanation: Section 2079.23(b) declares any clause that imposes an obligation to defend or
  indemnify a lender or auction company to be against public policy, void, and unenforceable. The
  suggestion that such a clause is permitted if limited to actual damages contradicts the blanket
  prohibition.
