stem: A licensed salesperson performs a licensed act for a buyer and wants to accept payment
  directly from the buyer instead of through the employing broker. Under Section 10137, why is this
  arrangement prohibited?
options:
  - Because commission splits between salespersons and brokers require prior written board approval.
  - Because commission arrangements must first be filed with the county recorder before payment.
  - Because buyers are barred from paying compensation directly to any licensee in a transaction.
  - Because a salesperson may accept compensation for licensed work only from the employing broker.
key: D
explanation: Section 10137 states that no real estate salesperson shall accept compensation for
  activity requiring a real estate license from any person other than the broker under whom the
  salesperson is licensed at the time.
citation:
  source: Cal. Bus. & Prof. Code § 10137
  url: null
  quoted_text: >-
    No real estate salesperson shall accept compensation for activity requiring a real estate
    license from any person other than the broker under whom he or

    she is at the time licensed.
