stem: A broker has a written listing agreement with a seller to find a buyer. During a visual
  inspection, the broker discovers a leaky roof that would affect the property's value. Under
  Section 2079(a), what must the broker do?
options:
  - Wait until after closing to disclose the defect.
  - Disclose the defect to the buyer.
  - Inform only the seller of the defect.
  - Ignore the defect because it is not visible.
key: B
explanation: Section 2079(a) requires a broker with a written contract to find a buyer to disclose
  all facts materially affecting value or desirability that an inspection would reveal. The leaky
  roof is such a fact, so it must be disclosed to the buyer. Informing only the seller does not
  satisfy the duty to the prospective buyer.
