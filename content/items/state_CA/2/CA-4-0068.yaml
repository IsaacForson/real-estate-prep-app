stem: Under Section 2079.21(c) of the Civil Code, which of the following is expressly included in
  the definition of 'confidential information'?
options:
  - Buyer's willingness to pay a price above the listing price
  - Agent's commission rate and fee structure
  - Property's zoning and land-use restrictions
  - Seller's willingness to accept a price below the listing price
key: D
explanation: The definition in 2079.21(c) explicitly includes the seller’s willingness to accept a
  price less than the listing price as an example of confidential information. The buyer’s
  willingness to pay above the listing price is not mentioned; the definition cites a price greater
  than the price offered, not the listing price.
