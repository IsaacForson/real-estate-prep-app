stem: An agent’s employee discovers a material defect in a property but the agent believes the buyer
  already knows about it. Under Cal. Civ. Code § 2079.24, what is the agent’s obligation?
options:
  - The agent is relieved of liability for any nondisclosure.
  - The agent’s duty is reduced because the employee found the defect.
  - The agent must still disclose the defect to the buyer.
  - The agent may rely on the buyer’s presumed knowledge and need not disclose.
key: C
explanation: Section 2079.24 states the duty of disclosure owed by agents and their licensees,
  subagents, and employees is not diminished, so the agent must disclose the defect. The other
  options incorrectly suggest the duty can be ignored or liability removed.
citation:
  source: Cal. Civ. Code § 2079.24
  url: null
  quoted_text: Nothing in this article shall be construed to either diminish the duty of disclosure
    owed buyers and sellers by agents and their associate licensees, subagents, and employees or to
    relieve agents and their associate licensees, subagents, and employees from liability for their
    conduct in connection with acts governed by this article or for any breach of a fiduciary duty
    or a duty of disclosure.
