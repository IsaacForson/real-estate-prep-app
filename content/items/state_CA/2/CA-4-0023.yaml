stem: A buyer contracts with a broker to locate a property now and also to handle any future
  investment purchases for the next five years. Under Section 2297, how should the broker’s role be
  classified?
options:
  - A general agent for the entire five‑year period.
  - A special agent for each individual transaction.
  - A general agent for all future investment transactions.
  - A special agent for the initial property search only.
key: A
explanation: Section 2297 distinguishes special agents (limited to a particular act) from general
  agents (all others). Because the broker is authorized to act on multiple future transactions over
  a five‑year span, the relationship falls under the "general agent" category for the whole period.
  The option describing a special agent limits the scope to a single act, which does not match the
  authority granted.
