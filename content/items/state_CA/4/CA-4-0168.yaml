stem: Under Cal. Civ. Code § 2923.5(e)(1)(A), what must a mortgage servicer include in the
  first-class letter sent as part of the due diligence process?
options:
  - The toll-free telephone number made available by HUD to find a HUD‑certified housing counseling
    agency
  - A copy of the borrower’s promissory note or other evidence of indebtedness
  - A list of financial documents the borrower should collect and present to the mortgage servicer
  - A statement that the borrower may be entitled to protections under the Servicemembers Civil
    Relief Act
key: A
explanation: The statute requires the first-class letter to include the HUD toll‑free number for
  finding a HUD‑certified housing counseling agency. The other options describe disclosures required
  elsewhere (e.g., promissory note copy under §2923.55(b)(1)(B), financial‑document list under
  §2923.5(e)(5)(B), or SCRA statement under §2923.55(b)(1)(A)), which are not part of the
  due‑diligence letter under §2923.5(e)(1)(A).
citation:
