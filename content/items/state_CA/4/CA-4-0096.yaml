stem: A lender files a notice of default on March 1. According to Cal. Civ. Code § 2924(a)(2), what
  is the minimum time that must elapse before the lender may record a notice of sale?
options:
  - At least 60 days must elapse.
  - At least 120 days must elapse.
  - At least 90 days must elapse.
  - At least 30 days must elapse.
key: C
explanation: The statute states that not less than three months shall elapse from the filing of the
  notice of default before a notice of sale may be recorded. Three months is approximately 90 days,
  making the 90‑day option correct. Shorter periods violate the rule, and longer periods exceed the
  minimum required.
