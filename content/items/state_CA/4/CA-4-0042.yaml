stem: A mortgage broker recommends a loan product that pays a higher commission but offers less
  favorable terms to the borrower. Which action violates the broker’s fiduciary duty under Cal. Civ.
  Code § 2923.1(a)?
options:
  - Recommending a loan that provides higher compensation to the broker but is less favorable to the
    borrower
  - Recommending a loan after providing the borrower with a list of available loan options
  - Recommending a loan after obtaining the borrower's written consent to the broker's compensation
  - Recommending a loan after disclosing all terms and associated costs to the borrower
key: D
explanation: Under Cal. Civ. Code § 2923.1(a), a mortgage broker must place the economic interest of
  the borrower ahead of the broker’s own economic interest. Recommending a loan that pays the broker
  more but is worse for the borrower violates this duty. The other options describe permissible
  conduct such as disclosure, consent, or providing options, which do not inherently breach the
  fiduciary duty.
citation:
  source: Cal. Civ. Code §§ 2920–2944.10 — Cal. Civil Code - ARTICLE 1. Mortgages in General
    2920-2944.10 § 2923.1(a)
  url: null
  quoted_text: A mortgage broker providing mortgage brokerage services to a borrower is the fiduciary
    of the borrower, and any violation of the broker’s fiduciary duties shall be a violation of the
    mortgage broker’s license law. This fiduciary duty includes a requirement that the mortgage
    broker place the economic interest of the borrower ahead of his or her own economic interest.
