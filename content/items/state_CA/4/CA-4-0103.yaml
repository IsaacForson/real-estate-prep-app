stem: Under Cal. Civ. Code § 2924e(b), what fee must accompany a request for notice of delinquencies
  on a senior lien?
options:
  - $30.00
  - $15.00
  - $60.00
  - $40.00
key: D
explanation: The statute requires that a request for notice be accompanied by the trustor's written
  consent and a fee of forty dollars ($40). The $15.00 distractor reflects the renewal fee for
  nonresidential properties after five notices, not the initial request fee.
