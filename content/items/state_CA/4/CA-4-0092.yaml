stem: Under Cal. Civ. Code § 2923.6(h), when is a first lien loan modification application
  considered complete?
options:
  - When the borrower provides all documents the servicer requires after its timeframes.
  - When the borrower provides any documents the servicer requires within its timeframes.
  - When the servicer provides all documents the borrower requires within its timeframes.
  - When the borrower provides all documents the servicer requires within its timeframes.
key: D
explanation: The statute defines a complete application as when the borrower supplies all documents
  required by the servicer within the servicer's specified timeframes. Submitting any document is
  insufficient, servicer approval is not required for completeness, and missed payments are
  unrelated to the definition.
