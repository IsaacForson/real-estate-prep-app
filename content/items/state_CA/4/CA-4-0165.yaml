stem: According to Cal. Civ. Code § 2920.5(d), how is the term 'first lien' defined?
options:
  - The most senior mortgage or deed of trust on the property that is the subject of the notice of
    default or notice of sale.
  - The mortgage or deed of trust that is recorded first in time, regardless of any notice of
    default or notice of sale.
  - The lien that has the highest priority according to the date of recording, irrespective of any
    notice of default.
  - The mortgage or deed of trust that secures the loan with the lowest interest rate on the
    property.
key: A
explanation: The definition of ‘first lien’ in Cal. Civ. Code § 2920.5(d) states it is the most
  senior mortgage or deed of trust on the property that is the subject of the notice of default or
  notice of sale. One incorrect choice bases seniority solely on the recording date, ignoring the
  notice requirement. Another incorrect choice also ignores the notice of default or sale condition.
  The remaining incorrect choice introduces an irrelevant interest‑rate test.
