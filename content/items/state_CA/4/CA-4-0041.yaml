stem: Under Cal. Civ. Code § 2920.5(d), what is the definition of 'first lien'?
options:
  - The senior mortgage or deed of trust on the property securing the notice of default or notice of
    sale
  - Any mortgage or deed of trust that is junior to another lien recorded against the same property
  - The total amount of all liens recorded against the property including taxes, assessments, and
    other charges
  - The mortgage that has been satisfied but remains visible in the public land records as a lien
key: A
explanation: Cal. Civ. Code § 2920.5(d) defines 'first lien' as the most senior mortgage or deed of
  trust on the property that is the subject of the notice of default or notice of sale. This matches
  the option stating that the first lien is the senior mortgage or deed of trust on the property
  securing the notice of default or notice of sale. The other options describe junior liens, total
  indebtedness, or satisfied mortgages, which do not meet the statutory definition.
