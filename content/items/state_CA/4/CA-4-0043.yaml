stem: A borrower has filed a Chapter 13 bankruptcy case, and the bankruptcy court has not yet
  entered an order closing or dismissing the case. According to Cal. Civ. Code § 2920.5(c)(2)(C), is
  this borrower eligible for a foreclosure prevention alternative offered by the mortgage servicer?
options:
  - No, because the borrower has filed a bankruptcy case that has not been closed, dismissed, or
    granted relief from the stay
  - Yes, because filing bankruptcy automatically qualifies the borrower for all loss mitigation
    options
  - No, because the borrower has surrendered the property by delivering the keys to the mortgagee
  - Yes, as long as the borrower continues to make the contractual mortgage payments
key: A
explanation: Cal. Civ. Code § 2920.5(c)(2)(C) expressly excludes from the definition of 'borrower'
  any individual who has filed a bankruptcy case under Chapters 7, 11, 12, or 13 if the bankruptcy
  court has not entered an order closing or dismissing the case or granting relief from the stay.
  Therefore, the borrower described is not eligible for foreclosure prevention alternatives. The
  other options either misstate the effect of bankruptcy or describe unrelated circumstances.
