stem: A trustee prepares a notice of sale for a residential property with 1‑4 units. What
  information must the notice include regarding the obligation secured by the property?
options:
  - Statement of total unpaid balance and estimated costs, expenses, advances
  - Name of original trustor, property address, and recorder’s office info
  - Street address, assessor’s parcel number, and recording date of the county
  - Fair market value determined by licensed appraiser or broker for the property
key: A
explanation: Cal. Civ. Code § 2924f(b)(7) mandates that the notice contain a statement of the total
  unpaid balance of the obligation secured by the property plus reasonably estimated costs,
  expenses, and advances at the time of the initial publication. The correct option states that the
  notice must include a statement of the total unpaid balance and estimated costs, expenses, and
  advances. The other options mention details such as the trustor's name and property address, the
  parcel number and recording date, or a fair market value, which are not the required financial
  statement.
