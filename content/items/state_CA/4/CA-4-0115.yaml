stem: A trustee is preparing to hold a trustee’s sale of a single‑family residence located in a
  gated community where the main entrance is controlled by a guard gate that prevents entry. Where
  may the trustee post the notice of sale?
options:
  - On the front door of the residence
  - In a conspicuous place on the property
  - At the guard gate or similar impediment
  - In the county recorder’s office
key: C
explanation: The rule allows the notice to be posted at the guard gate or similar impediment when a
  common entrance to the property is restricted by a guard gate or similar impediment. Posting on
  the front door of the residence is not feasible because the gate blocks access, and posting merely
  in a conspicuous place on the property does not meet the specific requirement for gate‑restricted
  access.
