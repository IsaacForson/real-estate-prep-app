stem: According to Cal. Civ. Code § 2924.15(b), how is 'owner-occupied' defined for the purpose of
  determining which foreclosure-related sections apply to a mortgage?
options:
  - The property is the principal residence of the borrower and secures a loan made for personal,
    family, or household purposes.
  - The property is rented to tenants and the borrower receives monthly rental income, with no
    personal use by the borrower.
  - The property is vacant land held for future development by the borrower, with no structures or
    improvements present.
  - The property is a second home used only for vacation purposes, and the borrower occupies it only
    during summer months.
key: A
explanation: Under Cal. Civ. Code § 2924.15(b), 'owner-occupied' means the property is the
  borrower’s principal residence and secures a loan for personal, family, or household purposes. The
  correct option states that the property is the borrower’s principal residence and secures a loan
  for personal, family, or household purposes, which matches the statutory definition. The other
  options describe vacant land, a vacation home, or rental property, none of which meet the
  definition of owner‑occupied.
