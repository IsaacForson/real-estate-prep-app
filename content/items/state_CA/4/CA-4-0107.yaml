stem: Under Cal. Civ. Code § 2924.21, how many days after the trustee’s deed is recorded must a
  person wait before contacting an owner to claim surplus funds from a foreclosure sale?
options:
  - 120 days
  - 90 days
  - 60 days
  - 30 days
key: B
explanation: The statute prohibits contact before 90 days after the trustee’s deed is recorded, so
  the correct waiting period is 90 days. The 60‑day distractor is incorrect because the law
  specifies 90 days, not 60.
citation:
  source: Cal. Civ. Code §§ 2920–2944.10 — Cal. Civil Code - ARTICLE 1. Mortgages in General
    2920-2944.10 § 2924.21
  url: null
  quoted_text: A person shall not contact, solicit, or initiate communication with an owner to claim
    the surplus funds from a foreclosure sale of the owner’s residence before 90 days after the
    trustee’s deed has been recorded.
