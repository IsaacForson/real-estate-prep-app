stem: Under Cal. Civ. Code § 1097, what is the maximum fee a vendor or lessor of a single family
  residential property may charge for signing and delivering a document in connection with the
  transfer, cancellation, or reconveyance of title when the buyer exercises an option to purchase
  the property?
options:
  - Ten dollars ($10)
  - Five dollars ($5)
  - Twenty dollars ($20)
  - No fee permitted
key: A
explanation: The statute explicitly limits the fee to ten dollars ($10). The distractors propose
  other amounts or no fee, which contradict the statutory cap.
citation:
  source: Cal. Civ. Code §§ 1091–1099 — Cal. Civil Code - ARTICLE 1. Mode of Transfer 1091-1099 — § 1097
  url: null
  quoted_text: No vendor or lessor of a single family residential property shall contract for or exact
    any fee in excess of ten dollars ($10) for the act of signing and delivering a document in
    connection with the transfer, cancellation or reconveyance of any title or instrument at the
    time the buyer or lessee exercises an option to buy, or completes performance of the contract
    for the sale of, the property.
