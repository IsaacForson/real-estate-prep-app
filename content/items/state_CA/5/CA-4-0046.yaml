stem: According to Cal. Civ. Code § 1091, which of the following is required to transfer an estate
  in real property that is **NOT** an estate at will or for a term not exceeding one year?
options:
  - An instrument in writing signed by the party or his authorized agent
  - An oral agreement between the parties satisfies the transfer requirement
  - A transfer fee must be paid to the local government before conveyance
  - The transfer must be recorded with the county recorder’s office to be valid
key: A
explanation: The statute states that an estate in real property other than an estate at will or for
  a term not exceeding one year can be transferred only by operation of law, or by an instrument in
  writing subscribed by the party disposing of the estate or by his authorized agent. Therefore, a
  written instrument signed by the party or his agent is required. The distractor suggesting that
  recording with the county recorder’s office is required is incorrect because the statute does not
  impose a recording requirement for validity of the transfer itself.
citation:
  source: Cal. Civ. Code § 1091
  url: null
  quoted_text: An estate in real property, other than an estate at will or for a term not exceeding
    one year, can be transferred only by operation of law, or by an instrument in writing,
    subscribed by the party disposing of the same, or by his agent thereunto authorized by writing.
