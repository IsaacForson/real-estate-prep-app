stem: "According to Cal. Civ. Code § 1214, a conveyance of real property (other than a lease for a
  term not exceeding one year) is **NOT** valid against a subsequent purchaser who:"
options:
  - A purchaser who acquires the property as a gift and records before the prior conveyance.
  - A purchaser who acquires the property with knowledge of the prior conveyance and records after.
  - A purchaser who acquires the property in good faith for valuable consideration and records first.
  - A purchaser who acquires the property for nominal consideration and records after the conveyance.
key: C
explanation: Under Cal. Civ. Code § 1214, a conveyance of real property is not valid against a later
  purchaser who takes the property in good faith, pays valuable consideration, and records the
  conveyance first. The statute protects the first recorder who meets those requirements. The
  correct answer describes a purchaser who acquires the property in good faith for valuable
  consideration and records first. The other options fail because they lack good faith, involve
  knowledge of the prior conveyance, lack valuable consideration, or record after the prior
  conveyance.
citation:
