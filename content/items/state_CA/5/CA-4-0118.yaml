stem: "A buyer deposits funds with a title company, agreeing that the funds will be released to the
  seller only after the seller provides a grant deed free of liens. Under Cal. Civ. Code § 1057,
  this arrangement is best described as:"
options:
  - The escrow arrangement
  - The trust account agreement
  - The conditional gift deed
  - The loan commitment letter
key: A
explanation: Section 1057 defines an escrow as a grant deposited with a third person to be delivered
  on performance of a condition, which matches the scenario of the buyer’s deposit. A trust account
  agreement refers to the handling of funds, not the conditional delivery of a grant, so it does not
  satisfy the statutory definition.
