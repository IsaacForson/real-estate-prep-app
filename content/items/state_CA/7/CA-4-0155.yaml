stem: What is a multiple listing service (MLS) under Cal. Civ. Code § 1087?
options:
  - A facility of cooperation of agents and appraisers operating through an intermediary that does
    not itself act as an agent or appraiser
  - A database maintained exclusively by real estate brokers for residential listings and commercial
    property data nationwide for members
  - A government-run platform for publishing property tax assessments, valuation reports, and market
    trend analyses
  - A private company that provides mortgage loan origination services and title insurance
    underwriting
