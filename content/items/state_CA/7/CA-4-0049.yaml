stem: A licensee enters into a listing agreement with a seller who has been deprived of civil rights
  due to a felony conviction. Under Cal. Civ. Code § 1556, what is the status of the listing
  agreement?
options:
  - The agreement is enforceable if the licensee discloses the seller's status today.
  - The agreement is void because persons deprived of civil rights are incapable of contracting.
  - The agreement is voidable at the seller's discretion today.
  - The agreement is valid if a court appoints a guardian today.
key: B
explanation: Persons deprived of civil rights are expressly excluded from the capacity to contract
  under § 1556, making any agreement they sign void. Consequently, the listing agreement with such a
  seller lacks legal enforceability. The other options incorrectly suggest voidability,
  enforceability upon disclosure, or validity with a guardian, none of which override the statutory
  incapacity.
citation:
