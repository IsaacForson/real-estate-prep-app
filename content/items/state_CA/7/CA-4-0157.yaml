stem: A supervised financial organization receives a written loan application on a Monday. According
  to Cal. Civ. Code § 1632.5(d)(1), by when must it provide the translated Good Faith Estimate
  disclosure to the borrower?
options:
  - Within one business day
  - Within three business days
  - Within five business days
  - Within two business days
key: B
explanation: The rule requires the translated Good Faith Estimate to be provided no later than three
  business days after receipt of the written application. Options stating within one business day,
  within five business days, and within two business days are not supported by the statute.
