stem: A licensee sells a personal emergency response unit that is not installed as part of a home
  security alarm system to a buyer who is a senior citizen. Under Cal. Civ. Code § 1689.6(d), what
  is the rescission period?
options:
  - Three business days
  - Seven business days
  - Ten business days
  - Five business days
key: B
explanation: Subsection (d) replaces the notice with a seven‑business‑day period, overriding the
  senior‑citizen five‑day rule from subsection (c)(2). Thus the correct period is seven business
  days, not five.
