stem: A person who lost their voting rights due to a felony conviction wants to purchase a rental
  property. Under Cal. Civ. Code §1556, what is this person’s contractual capacity?
options:
  - Fully capable because they can still own property.
  - Incapable because deprivation of civil rights eliminates capacity.
  - Capable only for contracts necessities.
  - Capable if they obtain a court order restoring rights.
key: B
explanation: The statute expressly excludes persons deprived of civil rights from capacity to
  contract. Ownership of property does not confer contractual capacity, and the statute provides no
  necessities exception or court‑order condition. Hence the person is incapable of contracting.
citation:
  source: Cal. Civ. Code § 1556
  url: null
  quoted_text: All persons are capable of contracting, except minors, persons of unsound mind, and
    persons deprived of civil rights.
