stem: A buyer initiates a contract for emergency repair of a storm‑damaged roof and provides a
  separate signed statement waiving the right to cancel. The contract is entered into after January
  1, 2021. Under Cal. Civ. Code § 1689.13, is the waiver enforceable?
options:
  - The waiver is unenforceable due to exemption.
  - The waiver is enforceable with senior condition.
  - The waiver is enforceable and legally binding.
  - The waiver is unenforceable due to initiation.
key: C
explanation: Subsections (a), (b), (c)(1) and (c)(2) together make a waiver enforceable when the
  buyer initiates the contract for emergency repairs, provides a separate statement, and the
  contract is entered on or after January 1, 2021. The claim that initiation voids the waiver
  contradicts subsection (a).
citation:
