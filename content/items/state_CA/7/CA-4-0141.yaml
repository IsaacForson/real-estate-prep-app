stem: Under Cal. Civ. Code § 1622, which statement correctly describes the general rule regarding
  the form of contracts?
options:
  - All contracts must be in writing to be enforceable.
  - Contracts may be oral unless a statute requires them to be in writing.
  - Only contracts for the sale of real property may be oral.
  - Contracts not performable within one year may be oral.
key: B
explanation: Cal. Civ. Code § 1622 provides that contracts may be oral unless a statute specifically
  requires them to be in writing. The option stating that contracts may be oral unless a statute
  requires them to be in writing correctly reflects this rule. The option claiming that all
  contracts must be in writing is incorrect because the statute allows oral contracts absent a
  statutory writing requirement.
