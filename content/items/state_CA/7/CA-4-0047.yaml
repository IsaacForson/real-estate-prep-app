stem: According to Cal. Civ. Code § 1556, which group IS capable of entering into a contract?
options:
  - Individuals who are under the age of majority.
  - Individuals who are adjudged to be of unsound mind.
  - Individuals who are deprived of civil rights.
  - Individuals who are licensed real estate brokers.
key: D
explanation: Under Cal. Civ. Code § 1556, all persons are capable of contracting except minors,
  persons of unsound mind, and persons deprived of civil rights. Therefore, a licensed real estate
  broker, who is none of those excluded persons, retains the capacity to contract. The other options
  list groups that the statute expressly excludes from capacity, so they are incorrect.
