stem: A licensee enters into an oral agreement with a property owner to market the owner's
  residential property for sale and to receive a commission, with the understanding that the
  agreement will last for eighteen months. Under Cal. Civ. Code § 1624(a)(4), what is the status of
  this agreement?
options:
  - The agreement is void because oral agreements for brokerage services are invalid.
  - The agreement is enforceable as long as the licensee performs the services.
  - The agreement is unenforceable unless it is in writing and signed by the party to be charged.
  - The agreement is enforceable because it concerns real estate brokerage services.
key: C
explanation: Under Cal. Civ. Code § 1624(a)(4), an agreement to employ a broker for more than one
  year must be in writing and signed by the party to be charged to be enforceable. Since this oral
  agreement lasts eighteen months, it is unenforceable unless it is in writing and signed.
