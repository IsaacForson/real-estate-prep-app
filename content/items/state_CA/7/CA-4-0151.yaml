stem: A buyer mails a notice of cancellation for a home solicitation contract on Monday morning.
  Under Cal. Civ. Code § 1689.6(e), when is the notice of cancellation effective?
options:
  - Effective when posted online
  - Effective upon receipt by the seller
  - Effective upon deposit in the mail
  - Effective when the seller reads the notice
key: C
explanation: The statute provides that a notice of cancellation given by mail is effective when
  deposited in the mail properly addressed with postage prepaid. The distractor stating
  effectiveness upon receipt is incorrect because the statute ties effectiveness to deposit, not to
  the seller's receipt or reading of the notice.
