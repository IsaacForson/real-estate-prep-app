stem: Under Cal. Civ. Code § 1632.5(a)(1), which languages trigger the requirement for a supervised
  financial organization to deliver translated loan forms prior to contract execution?
options:
  - The languages Spanish, Chinese, Tagalog, Vietnamese, and Korean
  - The languages Spanish, Chinese, Tagalog, Vietnamese, and English
  - The languages Spanish, Chinese, Tagalog, Vietnamese, and French
  - The languages Spanish, Chinese, Tagalog, Vietnamese, and Portuguese
key: A
explanation: The statute explicitly lists Spanish, Chinese, Tagalog, Vietnamese, and Korean as the
  languages that trigger the translation requirement. The other options replace Korean with English,
  French, or Portuguese, which are not included in the statutory list.
