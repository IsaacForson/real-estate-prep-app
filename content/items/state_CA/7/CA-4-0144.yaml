stem: Under Cal. Civ. Code §1556, which of the following individuals is **NOT** capable of entering
  into a contract?
options:
  - A licensed real estate broker in California
  - A 20‑year‑old college student enrolled full‑time
  - A person declared mentally incompetent by a court
  - A homeowner who owns property outright
key: C
explanation: The statute states that all persons are capable of contracting except minors, persons
  of unsound mind, and persons deprived of civil rights. A person declared mentally incompetent
  falls under the exception for persons of unsound mind, thus lacks capacity. The other options
  describe individuals who are not subject to any of the listed exceptions and therefore retain
  capacity.
