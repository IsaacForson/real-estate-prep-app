stem: A corporation’s sole designated broker-officer passes away on a Tuesday. To continue operating
  under its existing real estate license without interruption, what must the corporation do
  according to Cal. Bus. & Prof. Code § 10158?
options:
  - Obtain an additional license for each officer who wishes to act under the license for corporate
    activities
  - Notify the department of the change in office address, telephone number, or email address within
    30 days
  - File notice of death and application for new designated officer within 10 business days after
    the event
  - Submit a new fictitious business name statement to the county clerk and pay associated fees
    within 5 days
key: C
explanation: The statute allows uninterrupted operation if notice of the death or incapacity and an
  application for a new designated officer are filed before midnight of the 10th business day after
  the event. The distractor about fictitious business name statements pertains to a different
  requirement under §10159.5 and does not address officer succession.
citation:
  source: "Cal. Bus. & Prof. Code §§ 10130–10171.5 — B&P Code Div. 4, Pt. 1, Ch. 3, Arts. 1-2.5 (§§
    10130-10171.5) - Real Estate Regulations: Scope, Licenses, Exams, Fictitious names,
    Corporations, Restricted licenses § 10158"
  url: null
  quoted_text: In the event of death or incapacity of a sole designated broker-officer, a corporation
    may operate as a licensee without interruption under its existing license if notice of the death
    or incapacity and an application for a new designated officer is filed with the department
    before midnight of the 10th business day after the event.
