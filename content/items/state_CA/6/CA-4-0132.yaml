stem: Under California law, when a lease is referenced in this article, what does it include?
options:
  - Only leases that represent the sole transaction involved in the deal.
  - Any lease, whether it is the sole transaction, principal, or incidental.
  - Only leases that extend beyond a one‑year term in California practice.
  - Only leases that pertain to residential real estate transactions involved.
key: B
explanation: The statute defines that a lease reference includes any lease, whether it is the sole
  transaction, the principal part, or merely an incidental part of the transaction. The option
  stating 'Any lease, whether it is the sole transaction, principal, or incidental.' matches this
  definition exactly. The option stating 'Only leases that represent the sole transaction involved
  in the deal.' is incorrect because it limits the definition to sole transactions only, which is
  too narrow.
