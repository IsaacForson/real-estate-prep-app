stem: A licensee receives notice that a mobilehome listed for sale is no longer available. According
  to Cal. Bus. & Prof. Code § 10131.7(b), what must the licensee do within 48 hours of receiving
  that notice?
options:
  - Notify the Department of Housing and Community Development
  - Continue advertising but add a disclaimer about availability
  - Withdraw the advertisement of the mobilehome for sale, lease, or exchange
  - Update the advertisement to reflect a new price
key: C
explanation: The law requires the licensee to withdraw any advertisement of the mobilehome for sale,
  lease, or exchange within 48 hours after receiving notice that it is no longer available. The
  other actions are not mandated by this provision.
citation:
  source: "Cal. Bus. & Prof. Code §§ 10130–10171.5 — B&P Code Div. 4, Pt. 1, Ch. 3, Arts. 1-2.5 (§§
