    Corporations, Restricted licenses § 10131.7(b)"
  url: null
  quoted_text: (b) To fail to withdraw any advertisement of a manufactured home or mobilehome for
    sale, lease, or exchange within 48 hours after the real estate licensee’s receipt of notice that
    the manufactured home or mobilehome is no longer available for sale, lease, or exchange.
