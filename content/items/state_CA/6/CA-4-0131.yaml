stem: An applicant earned a bachelor's degree in economics with a minor in real estate five years
  ago and now applies for a real estate broker license. Under Cal. Bus. & Prof. Code § 10150.6(c),
  how may the commissioner treat this degree?
options:
  - The commissioner may treat the degree as equivalent to two years' general real estate experience.
  - The commissioner may treat the degree as equivalent to one year of general real estate
    experience.
  - The commissioner may only consider the degree if it was earned within the five-year period prior
    to application.
  - The commissioner may not consider the degree at all for experience equivalence unless other
    qualifications are met.
key: A
explanation: Section 10150.6(c) allows the commissioner to treat a four‑year degree that includes a
  major or minor in real estate as equivalent to two years of general real estate experience,
  regardless of when the degree was earned. Thus the applicant’s economics degree with a real estate
  minor qualifies for the two‑year equivalence. The claim that the degree must be earned within the
  prior five‑year period is incorrect because the statute expressly permits consideration of degrees
  completed before that window.
