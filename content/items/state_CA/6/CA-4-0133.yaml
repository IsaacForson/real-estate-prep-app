stem: A real estate salesperson files a lawsuit to collect a commission allegedly earned six months
  ago. At the time the alleged cause of action arose, the salesperson was not licensed. Under
  §10136, what must the salesperson do to maintain the action?
options:
  - Allege and prove that they were duly licensed when the cause of action arose.
  - Provide a written contract that details the commission agreement.
  - Show that they have since obtained a valid real estate license.
  - Demonstrate that the client agreed to pay the claimed commission.
key: A
explanation: The statute requires a person bringing an action for compensation to allege and prove
  they were duly licensed at the time the cause of action arose. The option stating that the
  salesperson must allege and prove they were duly licensed when the cause of action arose matches
  that requirement. The option stating that the salesperson need only show they have since obtained
  a valid real estate license does not satisfy the requirement because subsequent licensure does not
  prove licensure at the time the claim arose.
citation:
  source: Cal. Bus. & Prof. Code § 10136
  url: null
  quoted_text: No person engaged in the business or acting in the capacity of a real estate broker or
    a real estate salesperson within this state shall bring or maintain any action in the courts of
    this state for the collection of compensation for the performance of any of the acts mentioned
    in this article without alleging and proving that he or she was a duly licensed real estate
    broker or real estate salesperson at the time the alleged cause of action arose.
