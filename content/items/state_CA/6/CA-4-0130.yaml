stem: A broker closes a residential purchase transaction on March 10, 2023. Under Cal. Bus. & Prof.
  Code § 10148(a), when may the broker dispose of the related trust records?
options:
  - Three years after the closing date
  - Six months after the closing date
  - Immediately after the closing date
  - One year after the closing date
key: A
explanation: Under § 10148(a), the retention period for trust records begins at the closing date (or
  listing date if no closing) and lasts three years. Therefore, records from a March 10, 2023
  closing may be disposed of three years later, on March 10, 2026. A one‑year retention period is
  insufficient because the rule explicitly sets a three‑year limit.
