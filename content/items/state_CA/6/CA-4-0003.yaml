stem: A bank offers to help pay a real estate broker's office rent in exchange for the broker
  placing client trust accounts with that bank. Without the client's written permission, what does
  this arrangement constitute under Section 2830?
options:
  - A per se unlawful inducement for the placement of trust account business.
  - A permitted promotional courtesy extended between financial institutions.
  - A routine banking practice requiring no written client authorization.
  - A lawful compensating balance arrangement approved by the real estate commissioner.
key: A
explanation: Section 2830 deems receiving or requesting assistance with a broker's business
  expenses, such as rent, in exchange for placing trust account business a per se unlawful
  inducement unless the client has given written permission.
citation:
  source: Cal. Code Regs. tit. 10, § 2830
  url: null
  quoted_text: "Unless in possession of written permission from the client as described in subsection
    (a), the following activities, whether performed directly or indirectly, are deemed per se
    receipt of inducements for the placement of trust account business by any person and are
    unlawful: (1) Receiving or requesting payment for, accepting or requesting provision of, or
    accepting or requesting assistance with business expenses, including, but not limited to, rent,
    employee salaries, furniture, copiers, facsimile machines, automobiles, telephone services or
    equipment, or computers."
