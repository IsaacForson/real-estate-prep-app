stem: An unlicensed employee of an individual broker has fidelity bond coverage equal to the maximum
  trust funds to which the employee has access. Under Section 2834, what else must occur before that
  employee may sign withdrawals from the broker's trust account?
options:
  - General verbal permission from the broker allowing the employee to sign withdrawals.
  - Annual written approval from the commissioner's office allowing the employee to sign withdrawals
    on file.
  - Specific written authorization from the broker allowing the employee to sign withdrawals.
  - Notarized consent from the principal allowing the employee to sign withdrawals.
key: C
explanation: Section 2834 permits withdrawals by a bonded unlicensed employee only when the broker
  has specifically authorized that person in writing, so bond coverage alone does not satisfy the
  signature-authorization rule.
