stem: A broker holds trust funds for two principals in one account and plans a disbursement that
  would drop the balance below the combined amount owed to both. What must the broker obtain first
  under Section 2832.1?
options:
  - A bond from the bank where the trust account is maintained.
  - Written consent from every principal who owns funds in the account.
  - A waiver signed by the broker's supervising corporate officer.
  - Verbal approval from the escrow officer handling that particular transaction.
key: B
explanation: Section 2832.1 requires the broker to obtain the written consent of every principal who
  owns funds in the account before making a disbursement that would reduce the balance below the
  aggregate trust fund liability owed to all owners.
citation:
  source: Cal. Code Regs. tit. 10, § 2832.1
  url: null
  quoted_text: The written consent of every principal who is an owner of the funds in the account
    shall be obtained by a real estate broker prior to each disbursement if such a disbursement will
    reduce the balance of funds in the account to an amount less than the existing aggregate trust
    fund liability of the broker to all owners of the funds.
