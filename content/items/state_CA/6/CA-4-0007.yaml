stem: A broker receives a buyer's earnest money deposit for a routine home purchase. Under Section
  2832, within what period must the broker place the funds into a trust account or neutral escrow
  depository?
options:
  - Not later than three business days following receipt of the funds by the broker.
  - Not later than three calendar days following receipt of the funds by the parties.
  - Not later than ten business days following receipt of the escrow instructions.
  - Not later than five business days following receipt of the trust funds themselves.
key: A
explanation: Section 2832 requires a broker to place trust funds into the owner's hands, a neutral
  escrow depository, or a trust fund account not later than three business days after receiving the
  funds.
citation:
  source: Cal. Code Regs. tit. 10, § 2832
  url: null
  quoted_text: Compliance with Section 10145 of the Code requires that the broker place funds accepted
    on behalf of another into the hands of the owner of the funds, into a neutral escrow depository
    or into a trust fund account in the name of the broker, or in a fictitious name if the broker is
    the holder of a license bearing such fictitious name, as trustee at a bank or other financial
    institution not later than three business days following receipt of the funds by the broker or
    by the broker’s salesperson.
