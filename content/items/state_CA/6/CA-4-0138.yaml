stem: Under California law, what is the definition of a 'prepaid rental listing service'?
options:
  - The business of selling residential real properties to prospective tenants for a fee paid after
    the lease is signed, which does not constitute a prepaid rental listing service under California
    law.
  - The business of supplying prospective tenants with listings of residential real properties for
    tenancy, by publication or otherwise, pursuant to an arrangement requiring an advance or
    contemporaneous fee to obtain listings, but not involving negotiation of rentals, in accordance
    with California law.
  - The business of providing roommate referral information designed to assist persons in locating a
    roommate who meets selection criteria related to personal traits, characteristics, habits or
    preferences, and selection criteria related to the residential real property occupied by the
    prospective roommate, as excluded from the definition.
  - The business of managing residential real properties on behalf of owners for a monthly
    management fee, which is not considered a prepaid rental listing service because it does not
    involve supplying listings for a fee.
key: B
explanation: Under Cal. Bus. & Prof. Code § 10167(a), a prepaid rental listing service is the
  business of supplying prospective tenants with listings of residential real properties for
  tenancy, by publication or otherwise, when an advance or contemporaneous fee is required to obtain
  those listings, and the service does not involve negotiation of rentals. This definition excludes
  roommate referral services and property management activities.
citation:
  source: "Cal. Bus. & Prof. Code §§ 10130–10171.5 — B&P Code Div. 4, Pt. 1, Ch. 3, Arts. 1-2.5 (§§
    10130-10171.5) - Real Estate Regulations: Scope, Licenses, Exams, Fictitious names,
    Corporations, Restricted licenses § 10167(a)"
  url: null
  quoted_text: “Prepaid rental listing service” means the business of supplying prospective tenants
    with listings of residential real properties for tenancy, by publication or otherwise, pursuant
    to an arrangement under which the prospective tenants are required to pay an advance or
    contemporaneous fee (1) specifically to obtain listings or (2) to purchase any other product or
    service in order to obtain listings, but which does not otherwise involve the negotiation of
    rentals by the person conducting the service.
