stem: A broker manages trust funds for three separate transactions. Under Section 2831.1, what must
  the broker maintain for each beneficiary or transaction?
options:
  - A separate ledger tracking the broker's personal expenses paid from the general operating
    account.
  - A separate file listing the broker's commission splits with cooperating brokers on each sale.
  - A separate record accounting for all funds deposited to the broker's trust account and any
    interest earned there.
  - A separate log recording the broker's completed continuing education hours for each current
    renewal period on file.
key: C
explanation: Section 2831.1 requires a broker to keep a separate record for each beneficiary or
  transaction that accounts for all funds deposited to the broker's trust bank account, including
  any interest earned on deposit.
citation:
  source: Cal. Code Regs. tit. 10, § 2831.1
  url: null
  quoted_text: A broker shall keep a separate record for each beneficiary or transaction, accounting
    for all funds which have been deposited to the broker’s trust bank account and interest, if any,
    earned on the funds on deposit.
