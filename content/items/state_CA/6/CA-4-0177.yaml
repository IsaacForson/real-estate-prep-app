stem: Under Cal. Bus. & Prof. Code § 10131.7(c), what action is prohibited for a real estate
  licensee acting under authority of Section 10131.6?
options:
  - Advertising a mobilehome as a new mobilehome for sale or lease
  - Advertising a manufactured home with a disclosed transportation limitation for buyer
  - Advertising a manufactured home as a used manufactured home for lease
  - Advertising a mobilehome located in a mobilehome park for rent
key: A
explanation: The statute explicitly prohibits advertising or representing a mobilehome as a new
  mobilehome (or a manufactured home as a new manufactured home). The other options describe
  permissible advertising because they do not claim the home is new.
