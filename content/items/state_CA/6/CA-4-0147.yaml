stem: Under Cal. Bus. & Prof. Code § 10158, what must a corporation do if it wants an officer other
  than the officer designated pursuant to Section 10211 to act under its license as a real estate
  broker?
options:
  - Procure an additional license for each such officer
  - Obtain a separate corporate broker license for the officer
  - Have the officer pass the broker license examination
  - File a notice of change with the department within 10 days
key: A
explanation: The statute explicitly states that a corporation must procure an additional license to
  retain each officer other than the designated broker-officer who wishes to act under the corporate
  license. The distractor about filing a notice within 10 days applies only to the death or
  incapacity of a sole designated broker-officer, not to authorizing additional officers.
citation:
  source: "Cal. Bus. & Prof. Code §§ 10130–10171.5 — B&P Code Div. 4, Pt. 1, Ch. 3, Arts. 1-2.5 (§§
