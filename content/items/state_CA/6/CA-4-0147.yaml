    Corporations, Restricted licenses § 10158"
  url: null
  quoted_text: When a real estate license is issued to a corporation, if it desires any of its
    officers other than the officer designated by it pursuant to Section 10211, to act under its
    license as a real estate broker, it shall procure an additional license to retain each of those
    additional officers.
