stem: A broker who makes loans secured by one to four residential units fails to timely file the
  required business activities report. Under Cal. Bus. & Prof. Code § 10166.07(c), what action may
  the commissioner take?
options:
  - Impose a charge of twice the cost of the examination and report
  - Impose a fixed monetary penalty equal to the cost of the examination and report
  - Impose a charge of one and one-half times the cost of the examination and report
  - Impose a requirement that the broker complete additional continuing education hours
key: C
explanation: The statute allows the commissioner to charge the broker one and one-half times the
  cost of making the examination and report for late filing. Charging twice the cost, imposing a
  fixed penalty equal to the cost, or requiring additional continuing education are not authorized
  for this violation.
