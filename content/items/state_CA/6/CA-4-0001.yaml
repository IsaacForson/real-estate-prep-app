stem: Under California trust fund law, where must a real estate broker deposit client funds that are
  **NOT** placed into escrow or delivered to the broker's principal?
options:
  - Into a personal escrow account maintained by the broker at a title company in this same state.
  - Into a general operating account maintained by the broker at a credit union in this same state.
  - Into a bonded client reserve account maintained by the broker at an insurance company in this
    same state as required.
  - Into a trust fund account maintained by the broker at a bank or recognized depository nearby.
key: D
explanation: Section 10145 requires a broker who accepts funds belonging to others to deposit funds
  not placed into escrow or the principal's hands into a broker-maintained trust fund account at a
  bank or recognized depository, keeping client money separate from personal or operating funds.
citation:
  source: Cal. Bus. & Prof. Code § 10145
  url: null
  quoted_text: A real estate broker who accepts funds belonging to others in connection with a
    transaction subject to this part shall deposit all those funds that are not immediately placed
    into a neutral escrow depository or into the hands of the broker’s principal, into a trust fund
    account maintained by the broker in a bank or recognized depository in this state.
