stem: Under Mississippi Real Estate Commission Rule 3.3, what must all advertising be done under?
options:
  - The direct supervision of the Principal Broker
  - The indirect supervision of the Principal Broker
  - The direct supervision of the Real Estate Commission
  - The direct supervision of the Buyer's Agent
key: A
explanation: The rule states that all advertising must be under the direct supervision and in the
  name of the Principal Broker or the Brokerage Firm. The distractor about indirect supervision is
  incorrect because the rule requires direct supervision, not indirect, and specifies the Principal
  Broker, not any licensee.
