stem: A licensee decides to advertise her own vacant lot for sale on a community bulletin board, and
  the property is not listed with any broker. According to Mississippi Real Estate Commission Rule
  3.3, what must the licensee include in the advertisement?
options:
  - The statement that she is affiliated with a brokerage firm
  - The statement that she is a licensed real estate licensee
  - The statement that she must include the asking price
  - The statement that she must include a recent photograph
key: B
explanation: Rule 3.3 D requires a licensee advertising their own unlisted property to indicate that
  he or she is licensed. Including the brokerage firm's name, price, or photograph does not satisfy
  this specific disclosure requirement.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
