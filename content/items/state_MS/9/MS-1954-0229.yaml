stem: A licensee wants to place a 'For Sale' sign on a vacant lot she does not own, hoping to
  attract buyers. According to Mississippi Real Estate Commission Rule 3.3, what must she do before
  placing the sign?
options:
  - She must display her license number prominently on the sign
  - She must ensure the sign does not exceed 24 inches by 18 inches
  - She must obtain written authorization from the property's owner
  - She must register the sign with the Mississippi Real Estate Commission
key: C
explanation: Rule 3.3 C prohibits placing a sign offering property for sale or rent without first
  obtaining written authorization from all owners or an authorized representative. The other options
  describe actions not mandated by this rule.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 3.3 C
  url: null
  quoted_text: No Principal Broker or licensee sponsored by said broker shall in any way advertise
    property or place a sign on any such property offering the property for sale or rent without
    first obtaining the written authorization to do so by all owners of the property or by any
    appointed person or entity who also has full authority to convey the property.
