stem: A licensee advertises a property for sale on a flyer that includes the brokerage firm's name
  but omits the telephone number. According to Mississippi Real Estate Commission Rule 3.3, is this
  advertising compliant?
options:
  - The advertisement is not compliant because it omits the required telephone number.
  - The advertisement is compliant because it includes the brokerage firm's name.
  - The advertisement is compliant because it includes the property address.
  - The advertisement is not compliant because it uses a font size smaller than the Principal
    Broker's name.
key: A
explanation: Rule 3.3 requires that all advertising include the telephone number of the Principal
  Broker or the Brokerage Firm. Omitting the telephone number violates this requirement, making the
  advertising non‑compliant regardless of whether the brokerage firm's name is present.
