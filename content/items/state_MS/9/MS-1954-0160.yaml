stem: A licensee creates a social media post advertising a listing. Under Mississippi Real Estate
  Commission Rule 3.3, how must the Principal Broker's name appear relative to the licensee's name?
options:
  - Displayed in italics and same size as licensee name
  - Displayed in smaller print than licensee's name
  - Displayed same size or larger print as licensee name
  - Displayed at the bottom of the advertisement
key: C
explanation: The rule requires that the Broker or Brokerage Firm be identified by using the same
  size or larger print as that of a Licensee, Team Member, or Team in all advertising. The
  distractor about smaller print is incorrect because the rule prohibits using smaller print for the
  broker's name relative to the licensee's name.
