stem: A broker wants to advertise under the trade name 'Sunrise Realty'. According to Mississippi
  Real Estate Commission Rule 3.3, what must the broker do before using this trade name in
  advertising?
options:
  - Obtain a partnership license
  - Obtain a trade name license
  - Obtain a corporation license
  - Obtain a salesperson license
key: B
explanation: The rule provides that if advertising in any other form, a partnership, trade name,
  association, company or corporation license must be obtained prior to advertising in that manner.
  The distractor about a partnership license is incorrect because the broker is not operating as a
  partnership and therefore does not need that specific license.
