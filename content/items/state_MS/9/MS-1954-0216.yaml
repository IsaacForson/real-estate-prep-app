stem: A licensee places a newspaper advertisement for a listing that includes only the licensee's
  name and phone number, without mentioning the brokerage firm. Under Mississippi Real Estate
  Commission Rule 3.3 B, is this advertising compliant?
options:
  - It is not compliant because the Principal Broker's name is missing.
  - It is compliant because the licensee's name is clearly shown.
  - It is compliant because the telephone number is clearly shown.
  - It is not compliant because the advertisement lacks a for sale sign.
key: A
explanation: Rule 3.3 B requires all advertising to be under the direct supervision of and in the
  name of the Principal Broker or brokerage firm, and to prominently display that name. An
  advertisement that shows only the licensee's name and phone number does not display the required
  Principal Broker or brokerage firm name, so it is non‑compliant. Options stating that the
  advertisement is compliant because the licensee's name or telephone number is shown are incorrect,
  as they miss the required brokerage identification. The option mentioning a missing for‑sale sign
  is irrelevant because the rule does not require a sign.
citation:
