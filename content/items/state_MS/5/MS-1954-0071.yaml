stem: According to Mississippi Real Estate Commission rules, what must a responsible nonresident
  broker do before placing a sign on Mississippi real property?
options:
  - A) Obtain written consent from the cooperating responsible Mississippi broker.
  - B) File a notice with the Mississippi Real Estate Commission.
  - C) Ensure the sign is smaller than the Mississippi broker's sign.
  - D) Pay a fee to the Mississippi Real Estate Commission.
key: A
explanation: The rule states that a responsible nonresident broker cannot place any sign on real
  property located in the state of Mississippi without the written consent of the cooperating
  responsible Mississippi broker. Therefore, obtaining that written consent is required. Filing a
  notice with the Commission is not mentioned as a prerequisite for sign placement.
