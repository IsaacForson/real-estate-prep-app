stem: A Mississippi broker enters into a cooperative agreement with an out-of-state broker to sell
  two different Mississippi properties. According to Rule 3.1C, how many cooperative agreements must
  be filed with the Mississippi Real Estate Commission?
options:
  - The broker must file one cooperative agreement covering both properties.
  - The broker must file two separate cooperative agreements, one for each property.
  - The broker must file one cooperative agreement per transaction regardless of property.
  - The broker must file three cooperative agreements, one for each property and one for the
    transaction.
key: B
explanation: Rule 3.1C requires a separate cooperative agreement for each property, prospective
  user, or transaction. Therefore, two properties necessitate two separate agreements. The option
  suggesting a single agreement can cover both properties violates the 'separate' requirement. The
  other incorrect options introduce unrelated bases such as per transaction or extra agreements,
  which are not supported by the rule.
citation:
