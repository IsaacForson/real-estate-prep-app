stem: A Mississippi broker enters into a cooperative agreement with an out-of-state broker to sell a
  Mississippi property but fails to require a listing or joint listing of the property. According to
  Miss. Code Ann. § 73-35-11, what is the legal effect of this omission?
options:
  - The agreement remains valid if compensation is disclosed on the required form
  - The agreement is voidable at the option of the out-of-state broker
  - The agreement is unlawful because the Mississippi broker must require a listing or joint listing
  - The omission can be cured by filing the agreement within ten days
key: C
explanation: The key is correct because § 73-35-11 states the Mississippi broker shall require a
  listing or joint listing of the property involved; failure to do so makes the agreement unlawful.
  The most tempting distractor, 'The agreement remains valid if compensation is disclosed on the
  required form,' is incorrect because the statute imposes the listing requirement regardless of
  compensation disclosure.
