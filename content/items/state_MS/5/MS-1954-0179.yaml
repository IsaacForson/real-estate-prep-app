stem: According to Mississippi Real Estate Commission Rule 3.1C, how is a responsible nonresident
  broker defined?
options:
  - An active, licensed responsible real estate broker of another state who does not possess an
    active responsible nonresident real estate broker's license issued by the Mississippi Real
    Estate Commission.
  - An active, licensed responsible real estate broker of another state who possesses an active
    responsible nonresident real estate broker's license issued by the Mississippi Real Estate
    Commission.
  - An active, licensed responsible real estate broker of Mississippi who does not possess an active
    responsible nonresident real estate broker's license issued by the Mississippi Real Estate
    Commission.
  - An active, licensed responsible real estate broker of another state who holds a temporary permit
    to practice in Mississippi issued by the Mississippi Real Estate Commission.
key: A
explanation: Rule 3.1C defines a responsible nonresident broker as an active, licensed responsible
  real estate broker of another state who does not possess an active responsible nonresident real
  estate broker's license issued by the Mississippi Real Estate Commission. A statement that the
  broker does possess such a license is incorrect because the definition requires the broker not to
  have that license. Describing the broker as an active, licensed responsible broker of Mississippi
  is also incorrect because the rule applies only to brokers from another state. Likewise, stating
  that the broker holds a temporary permit to practice in Mississippi is wrong because the rule
  makes no reference to a temporary permit.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 3.1C
  url: null
  quoted_text: A responsible (principal) nonresident broker described herein is defined as an active,
    licensed responsible real estate broker of another state who does not possess an active
    responsible nonresident real estate broker's license issued by the Mississippi Real Estate
    Commission (MREC).
