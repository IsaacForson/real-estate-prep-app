stem: When a responsible nonresident broker places a sign on Mississippi property with the written
  consent of the cooperating Mississippi broker, where must the Mississippi broker's sign be placed
  relative to the nonresident broker's sign?
options:
  - The Mississippi broker's sign must be placed at the broker's office only, regardless of property
    location
  - The Mississippi broker's sign must be placed on the opposite side of the property from the
    nonresident broker's sign
  - The Mississippi broker's sign must be placed anywhere on the property as long as it is visible
    to passersby
  - The Mississippi broker's sign must be placed in a prominent place and in close proximity to the
    nonresident broker's sign
key: D
explanation: "Rule 3.1C of the Mississippi Real Estate Commission Rules states that after obtaining
  written consent, the responsible Mississippi broker's sign must be placed in a prominent place and
  in close proximity to the responsible nonresident broker's sign. Therefore, the correct answer is
  the option that says the Mississippi broker's sign must be placed in a prominent place and in
  close proximity to the nonresident broker's sign. The other options are incorrect: one limits the
  sign to the broker's office only, another requires it to be on the opposite side of the property,
  and the third allows placement anywhere visible without requiring proximity."
citation:
