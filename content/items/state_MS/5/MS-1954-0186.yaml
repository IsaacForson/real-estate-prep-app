stem: A Mississippi broker and a Louisiana-licensed broker enter into a written cooperative
  agreement to sell a residential property in Gulfport. According to Miss. Code Ann. § 73-35-11,
  what must the written cooperative agreement specify?
options:
  - The written cooperative agreement must specify all material terms of the agreement, including
    financial terms.
  - The written cooperative agreement must specify only the duration of the agreement and the
    brokerage fees.
  - The written cooperative agreement must specify only the commission amount to be paid to the
    out-of-state broker.
  - The written cooperative agreement must specify only the property address and listing price.
key: A
explanation: The statute requires written cooperative agreements to specify all material terms,
  including financial terms. The other answer choices incorrectly limit the specification to only
  the duration and brokerage fees, only the commission amount to the out‑of‑state broker, or only
  the property address and listing price.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
