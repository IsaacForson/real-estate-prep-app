stem: A broker licensed in Georgia wishes to assist a client in selling a Mississippi residential
  property. The broker does not hold a Mississippi license. To lawfully participate, what must the
  Georgia broker do?
options:
  - Pay a referral fee directly to the Mississippi broker without any written agreement
  - Obtain a Mississippi nonresident license before any activity
  - Cooperate with a licensed Mississippi broker and file the agreement within ten days
  - Advertise the property under the Georgia broker's own name
key: C
explanation: The key is correct because Miss. Code Ann. § 73-35-11 permits an out-of-state broker to
  cooperate with a Mississippi broker, provided the Mississippi broker files a copy of the written
  cooperative agreement within ten days and states the compensation on a form filed with the
  commission. The most tempting distractor, 'Obtain a Mississippi nonresident license before any
  activity,' is incorrect because the statute allows cooperation without obtaining a nonresident
  license when the Mississippi broker fulfills the filing and disclosure requirements.
citation:
  source: Miss. Code Ann. § 73-35-11
  url: null
  quoted_text: a licensed broker of another state who does not hold a Mississippi real estate license
    may cooperate with a licensed broker of this state provided that any commission or fee resulting
    from such cooperative negotiation shall be stated on a form filed with the commission reflecting
    the compensation to be paid to the Mississippi broker. Whenever a Mississippi broker enters into
    a cooperative agreement under this section, the Mississippi broker shall file within ten (10)
    days with the commission a copy of each such written agreement.
