stem: Under Mississippi law, what must a nonresident applicant file with the Real Estate Commission
  to obtain a nonresident license?
options:
  - A certificate of equivalent pre-licensing education from the applicant's home state
  - A statement of irrevocable consent allowing legal actions to be commenced against him in
    Mississippi courts
  - A copy of the applicant's current out-of-state broker license in good standing
  - A notarized affidavit of Mississippi residency for licensure purposes
key: B
explanation: The statute requires every nonresident applicant to file a statement of irrevocable
  consent permitting legal actions to be commenced against them in Mississippi courts. This consent
  must be duly acknowledged and acknowledges jurisdiction. The other options describe education,
  licensing, or residency documents that are not mandated by this provision.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) — § 73-35-8
  url: null
  quoted_text: Every nonresident applicant shall file a statement of irrevocable consent with the Real
    Estate Commission that legal actions may be commenced against him in the proper court of any
    county of this state in which a cause of action may arise or in which the plaintiff may reside
    by service of process or pleading authorized by the laws of this state
