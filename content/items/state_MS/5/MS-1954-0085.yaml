stem: A Georgia-licensed broker cooperates with a Mississippi broker to sell a commercial property
  in Jackson, Mississippi. The Georgia broker does not hold a Mississippi license. According to
  Miss. Code Ann. § 73-35-11, what must the Georgia broker agree to as part of the cooperative
  agreement?
options:
  - The Georgia broker must pay a fee to the Mississippi Real Estate Commission before any showings,
    listings, or other activities.
  - The Georgia broker must obtain a Mississippi salesperson license before conducting any showings,
    listings, or other activities.
  - The Georgia broker must agree that civil actions may be filed against him in any Mississippi
    county where a claim arises.
  - The Georgia broker must provide a surety bond of $10,000 to the Mississippi broker before any
    showings, listings, or other activities.
key: C
explanation: The statute requires a nonresident broker who signs a cooperative agreement to agree
  that civil actions may be commenced against him in any Mississippi county where a claim arises.
  This matches the correct option. The distractor about obtaining a Mississippi salesperson license
  is incorrect because the law permits cooperation without a Mississippi license, provided the
  nonresident broker agrees to the statutory terms.
citation:
