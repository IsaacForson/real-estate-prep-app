stem: Under a cooperative agreement between a Mississippi broker and an out-of-state broker for a
  Mississippi property, how is the compensation determined?
options:
  - A) The compensation is split equally regardless of effort.
  - C) The compensation is determined by the Mississippi Real Estate Commission.
  - D) The compensation is based solely on the listing price.
  - B) The compensation is divided on a negotiable basis between the brokers.
key: D
explanation: The rule provides that commissions or other compensation earned during the period the
  cooperative agreement is in force shall be divided on a negotiable basis between the Mississippi
  broker and the nonresident broker. Therefore, the division is subject to negotiation, not a fixed
  equal split or Commission determination.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) Rule 3.1.C
  url: null
  quoted_text: The commissions or other compensation resulting from the sale/rent/lease/property
    management or auction of the Mississippi real property, and which are earned during the period
    the cooperative agreement is in force shall be divided on a negotiable basis between the
    Mississippi broker and the nonresident broker.
