stem: Under a cooperative agreement between a Mississippi broker and an out-of-state broker for a
  Mississippi property, what must the written cooperative agreement reflect according to Rule 3.1C?
options:
  - The written cooperative agreement must reflect the compensation to be paid to the Mississippi
    licensed broker.
  - The written cooperative agreement must reflect the compensation to be paid to the out-of-state
    broker.
  - The written cooperative agreement must reflect the listing price of the Mississippi property.
  - The written cooperative agreement must reflect the agreed-upon percentage split of the
    commission.
key: A
explanation: Rule 3.1C requires that the written cooperative agreement reflect the compensation to
  be paid to the Mississippi licensed broker. The option stating that the agreement must reflect the
  compensation to be paid to the out-of-state broker is incorrect because the rule does not require
  that. The options mentioning the listing price of the Mississippi property or the agreed‑upon
  percentage split of the commission are also incorrect, as those elements are not part of the
  rule’s writing requirement.
