  quoted_text: In such instance herein where a responsible Mississippi broker enters into a
    cooperative agreement with a responsible nonresident broker pertaining to the sale of real
    property within the state of Mississippi, the responsible Mississippi broker must file two
    copies of the cooperating agreement with the Mississippi Real Estate Commission.
