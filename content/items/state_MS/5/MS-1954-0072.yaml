stem: A Mississippi responsible broker enters into a cooperative agreement with an out-of-state
  responsible broker to sell a Mississippi property. What must the Mississippi broker do with the
  cooperative agreement?
options:
  - A) File two copies with the Mississippi Real Estate Commission.
  - B) File one copy with the Mississippi Real Estate Commission.
  - C) Keep the agreement only in their office files.
  - D) Submit the agreement to the out-of-state broker's state commission.
key: A
explanation: The rule specifies that when a responsible Mississippi broker enters into a cooperative
  agreement with a responsible nonresident broker for the sale of Mississippi real property, the
  Mississippi broker must file two copies of the agreement with the Mississippi Real Estate
  Commission. Filing only one copy does not satisfy this requirement.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) Rule 3.1.C
