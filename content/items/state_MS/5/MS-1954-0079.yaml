stem: A responsible broker in Mississippi agrees that a broker under his supervision may perform
  certain real estate services outside the responsible broker's supervision. What must the
  responsible broker do according to Mississippi Real Estate Commission Rule 3.1B?
options:
  - Notify the Commission in writing about the broker relationship
  - Obtain written consent from clients for the outside services
  - File a license application for the supervised broker with the Commission
  - Submit a quarterly report to the Commission detailing services performed
key: A
explanation: "Rule 3.1B of the Mississippi Real Estate Commission Rules requires the responsible
  broker to inform the Commission in writing when allowing a supervised broker to perform real
  estate services outside the responsible broker's supervision, including the exact nature of the
  relationship and the names of the brokers involved. Therefore, the correct action is to notify the
  Commission in writing about the broker relationship. The other options are incorrect: obtaining
  written client consent for outside services is not required by the rule; filing a license
  application for the supervised broker is unnecessary because the broker is already licensed; and
  submitting a quarterly report detailing services performed is not mandated by Rule 3.1B."
