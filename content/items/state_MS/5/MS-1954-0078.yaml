stem: Under Mississippi Real Estate Commission Rule 2.2, how are fees treated for resident and
  nonresident licenses?
options:
  - Fees are higher for nonresident license applicants
  - Fees are the same for resident and nonresident licenses
  - Fees are waived for resident license holders
  - Fees are determined by the broker's office location
key: B
explanation: The option stating that fees are the same for resident and nonresident licenses is
  correct because Rule 2.2 requires that all fees be identical for resident and nonresident
  licenses. The option stating that fees are higher for nonresident license applicants is incorrect
  because the rule does not allow higher fees for nonresidents. The option stating that fees are
  waived for resident license holders is incorrect because the rule provides no waiver for
  residents. The option stating that fees are determined by the broker's office location is
  incorrect because the rule ties fees to license type, not to where the broker's office is located.
