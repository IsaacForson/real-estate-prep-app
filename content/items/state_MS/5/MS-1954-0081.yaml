stem: According to Miss. Code Ann. § 73-35-11, what must a Mississippi broker require before
  entering a cooperative agreement with an out-of-state broker for a Mississippi property?
options:
  - A certificate from the out-of-state broker's home state
  - A listing or joint listing of the property
  - A disclosure of any prior disciplinary action
  - A written referral fee agreement form
key: B
explanation: The key is correct because Miss. Code Ann. § 73-35-11 explicitly states that the
  Mississippi broker shall require a listing or joint listing of the property involved. This
  requirement ensures the Mississippi broker has control over the property listing. The most
  tempting distractor, 'A written referral fee agreement form,' is incorrect because the statute
  does not mention a referral fee agreement as a prerequisite; it mandates the listing or joint
  listing requirement instead.
