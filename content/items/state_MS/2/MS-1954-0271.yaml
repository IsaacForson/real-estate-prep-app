stem: A licensee changes principal broker on May 1 and sends written notice to the commission on May
  5. What is the status of the licensee's license under Miss. Code Ann. § 73-35-15(2)?
options:
  - License is suspended until the broker acknowledges the change
  - License is placed on inactive status pending review
  - License is automatically cancelled for late notice
  - License remains active because notice was given within a week
key: C
explanation: The rule states that failure to give notice within three days automatically cancels the
  license. Notice on May 5 exceeds the three‑day limit, so the licence is cancelled. The one‑week
  option misstates the required period.
