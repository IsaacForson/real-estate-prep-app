stem: A licensee fails to deliver the property condition disclosure statement before executing a
  sales contract for a residential property. The buyer later discovers the omission and files a
  complaint with the Mississippi Real Estate Commission. Under Miss. Code Ann. § 89-1-523(2), what
  is the likely outcome regarding disciplinary action?
options:
  - The licensee will not face disciplinary action from the Mississippi Real Estate Commission.
  - The licensee will be subject to disciplinary action for failing to deliver the disclosure
    statement.
  - The licensee will face disciplinary action unless they can prove the omission was not within
    personal knowledge.
  - The licensee will not face disciplinary action but may be liable for actual damages.
key: A
explanation: Section 89-1-523(2) prohibits the Mississippi Real Estate Commission from imposing
  discipline on licensees for any failure to comply with the disclosure requirements, including late
  or missing disclosure statements. Thus, the licensee cannot be disciplined for the omission. The
  other options incorrectly assert discipline, add a personal‑knowledge condition, or mention civil
  liability, which the statute does not address in the context of commission discipline.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) § 89-1-523(2)
  url: null
  quoted_text: Notwithstanding any other provision of law to the contrary, no real estate licensee
    shall be subject to discipline or other action of any kind by any licensing authority of the
    State of Mississippi pertaining to information required to be disclosed by Sections 89-1-501
    through 89-1-523 or delivery of information required to be disclosed by Sections 89-1-501
    through 89-1-523.
