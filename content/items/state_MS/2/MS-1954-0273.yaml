stem: A broker licensed in Alabama lists a Mississippi residential property for sale without
  associating with a Mississippi-licensed broker. Under Miss. Code Ann. § 73-35-11, is this conduct
  permitted?
options:
  - Permitted, because the broker holds a valid out-of-state license.
  - Permitted, provided the broker files a cooperative agreement within ten days.
  - Not permitted, unless the broker cooperates with a Mississippi-licensed broker.
  - Not permitted, but the broker may avoid liability by paying a fine to the commission.
key: C
explanation: The statute makes it unlawful for a nonresident broker to perform any act regulated by
  the chapter unless cooperating with a Mississippi-licensed broker. Listing a property for sale is
  a regulated act, so the conduct is not permitted without such cooperation. Holding a valid
  out-of-state license does not exempt the broker from the cooperation requirement. Filing a
  cooperative agreement after the fact does not render the initial act lawful, and the statute does
  not mention avoidance of liability via a fine.
