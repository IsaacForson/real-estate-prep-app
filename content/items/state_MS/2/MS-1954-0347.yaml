stem: Under Miss. Code Ann. § 73-35-3(4), what must a brokerage agreement contain to be valid?
options:
  - A verbal agreement that outlines only the broker’s commission rate without other terms
  - A statement of the brokerage services terms and conditions, including compensation
  - A notarized signature from both parties acknowledging receipt of the agreement
  - A copy of the property’s title deed attached to the brokerage agreement for reference
key: B
explanation: Under Miss. Code Ann. § 73-35-3(4), a brokerage agreement must be a written agreement
  that contains a statement of the terms and conditions of the brokerage services to be provided,
  including any compensation. An agreement that is solely verbal and limited to the broker’s
  commission rate fails to meet this requirement.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
