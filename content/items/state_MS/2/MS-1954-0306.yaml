stem: A Mississippi real estate broker receives a $2,500 commission for a transaction that required
  a license but the broker was unlicensed at the time. Under Miss. Code Ann. § 73-35-31(2), what is
  the maximum penalty the broker may be liable to pay for this violation?
options:
  - A penalty of $2,500.
  - A penalty of $5,000.
  - A penalty of $7,500.
  - A penalty of $10,000.
key: D
explanation: Under Miss. Code Ann. § 73-35-31(2), a person who earns a commission while unlicensed
  must pay a penalty of not less than the amount received and not more than four times that amount.
  For a $2,500 commission, the maximum penalty is 4 × $2,500 = $10,000. The other options represent
  lower multiples (1×, 2×, 3×) and therefore are below the statutory maximum.
