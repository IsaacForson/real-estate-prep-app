stem: A Mississippi resident who has held an active real estate salesperson license for ten months
  applies for a broker license. Under Miss. Code Ann. § 73-35-7, is the applicant eligible to sit
  for the broker examination?
options:
  - The applicant is eligible because they satisfy the age and domicile requirements.
  - The applicant is not eligible because they have not held a salesperson license for the required
    twelve months.
  - The applicant is eligible because they have completed the required 120 hours of coursework.
  - The applicant is not eligible because they must also pass the background investigation.
key: B
explanation: Subsection (d) requires twelve months of active salesperson licensure before applying
  for the broker examination; ten months is insufficient. While age, domicile, coursework, and
  background clearance are also required, the twelve‑month salesperson prerequisite is the decisive
  factor.
