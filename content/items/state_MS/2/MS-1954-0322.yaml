stem: A licensee provides a broker's price opinion to a potential buyer for the purpose of listing
  and selling a parcel of real property. Under Miss. Code Ann. § 73-35-4.1(b)(ii), is the licensee
  required to identify the source of the information?
options:
  - The licensee must identify the source only if the opinion includes an appraisal.
  - The licensee is not required to identify the source because a broker's price opinion is not
    third‑party information.
  - The licensee is not required to identify the source unless the buyer requests it.
  - The licensee must identify the source of the broker's price opinion as third‑party information.
key: B
explanation: The definition of third‑party information in § 73-35-4.1(b)(ii) lists appraisal,
  surveyor plans, tax records, and builder’s plans; a broker’s price opinion is not included.
  Therefore, providing such an opinion does not trigger the duty to disclose a source. The
  distractor about including an appraisal is incorrect because the opinion itself remains the
  licensee’s own work, not third‑party information.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) § 73-35-4.1(b)(ii)
  url: null
  quoted_text: "For the purposes of this section, “third-party information” means: 1. An appraisal or
    any measurement information prepared by a licensed appraiser; 2. A surveyor developer’s plan
    prepared by a licensed surveyor; 3. A tax assessor’s public record; or 4. A builder’s plan used
    to construct or market the property."
