stem: A licensee’s renewal application is submitted on July 15, 2023 for a license expiring August
  1, 2023. Under Miss. Code Ann. § 73-35-6(3), what must the licensee include with the renewal
  application?
options:
  - A current email address
  - Proof of errors and omissions insurance
  - A copy of the salesperson license
  - A statement of no criminal convictions
key: A
explanation: The rule requires a current email address for any renewal after June 30, 2019. The
  distractor “Proof of errors and omissions insurance” is not mentioned in the continuing‑education
  renewal section and therefore is not required by this provision.
