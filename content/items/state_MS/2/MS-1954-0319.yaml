stem: A licensee receives a temporary license on August 15, 2024. Under Miss. Code Ann. §
  73-35-14.5(1), what is the expiration date of the temporary license?
options:
  - August 31, 2025
  - July 31, 2025
  - September 1, 2025
  - August 15, 2025
key: A
explanation: A temporary license is valid for one year following the first day of the month after
  issuance; starting September 1, 2024 and adding one year yields an expiration of August 31, 2025.
  The other dates either ignore the one‑month offset or mis‑calculate the one‑year period.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) § 73-35-14.5(1)
  url: null
  quoted_text: (1) Upon passing the Mississippi broker’s or salesperson’s examination and complying
    with all other conditions for licensure, a temporary license shall be issued to the applicant.
    The fee for the temporary license shall also be the same for the permanent license as provided
    in Section 73-35-17. A temporary license shall be valid for a period of one (1) year following
    the first day of the month after its issuance.
