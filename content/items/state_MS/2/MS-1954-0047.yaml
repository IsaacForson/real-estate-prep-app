stem: What is the duration of a temporary license issued after passing the Mississippi broker’s or
  salesperson’s examination?
options:
  - Six months following the first day of the month after issuance
  - Two years following the first day of the month after issuance
  - Indefinite, remaining valid until the licensee submits a renewal application
  - One year following the first day of the month after issuance
key: D
explanation: The statute states that a temporary license shall be valid for a period of one (1) year
  following the first day of the month after its issuance. The distractor “Six months following the
  first day of the month after issuance” is incorrect because it is shorter than the required
  period.
