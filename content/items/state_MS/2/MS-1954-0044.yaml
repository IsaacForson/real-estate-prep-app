stem: "A licensee represents both the buyer and the seller in a residential transaction and receives
  a commission from each party, but neither party is aware that the licensee is also representing
  the other side. This conduct is:"
options:
  - It is grounds for refusing to issue, suspending, or revoking the license.
  - It is permissible if the licensee discloses the dual representation in writing.
  - It is allowed only if the licensee obtains informed consent from both parties.
  - It is permissible only when both parties have given written consent.
key: A
explanation: Miss. Code Ann. § 73-35-21 provides that acting for more than one party in a
  transaction or receiving compensation from more than one party, without the knowledge of all
  parties, is grounds for refusing to issue, suspending, or revoking a license. Because neither
  party knows about the dual representation, the licensee’s conduct violates this provision. The
  option stating that it is permissible if the licensee discloses the dual representation in writing
  is incorrect because mere written disclosure does not give all parties knowledge of the dual
  representation.
