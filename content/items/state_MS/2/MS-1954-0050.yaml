stem: A licensee completed 22 hours of continuing education during the current renewal period. Under
  Miss. Code Ann. § 73-35-6(1), what is the maximum number of those hours that may be carried over
  to the next renewal period?
options:
  - 0 hours
  - 6 hours
  - 16 hours
  - 22 hours
key: B
explanation: The rule states that no more than six (6) hours of continuing education may be carried
  over to the next renewal period. Therefore, even though the licensee earned 22 hours, only six can
  be carried forward. The distractor claiming 22 hours incorrectly assumes all earned hours are
  eligible for carryover, ignoring the statutory limit.
