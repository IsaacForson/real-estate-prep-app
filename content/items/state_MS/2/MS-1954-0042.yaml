stem: A broker who obtained his license after being an active salesperson for twenty months wishes
  to hire a salesperson fifteen months after receiving the broker license. Under Miss. Code Ann. §
  73-35-7, paragraph (h), is the broker permitted to hire the salesperson at that time?
options:
  - The broker is permitted to hire the salesperson because the broker has completed the required
    continuing education.
  - The broker is not permitted to hire the salesperson because the broker must first pass a
    background investigation.
  - The broker is permitted to hire the salesperson because fifteen months have passed since the
    broker license was issued.
  - The broker is not permitted to hire the salesperson because less than thirty-six months have
    passed since the salesperson license was approved.
key: D
explanation: Paragraph (h) prohibits hiring any salesperson for thirty‑six months from the date the
  applicant’s active salesperson license was approved. With twenty months as a salesperson plus
  fifteen months after broker licensure, only thirty‑five months have elapsed, so the restriction
  still applies.
