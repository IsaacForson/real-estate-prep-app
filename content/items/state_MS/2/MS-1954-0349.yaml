stem: A licensee prepares a brokerage agreement that includes the services to be provided but omits
  any mention of the compensation to be paid. Under Miss. Code Ann. § 73-35-3(4), what is the status
  of this agreement?
options:
  - A valid brokerage agreement because services are described
  - An invalid agreement only if the consumer files a complaint with the Commission
  - An invalid brokerage agreement because it lacks the required statement of compensation
  - A valid agreement if the parties later agree on compensation orally
key: C
explanation: Miss. Code Ann. § 73-35-3(4) requires that a brokerage agreement include a statement of
  compensation. Because the agreement omits that term, it does not satisfy the statutory requirement
  and is therefore invalid. An agreement cannot be salvaged by a later oral agreement on
  compensation, as the statute demands the compensation term be in the written agreement. The claim
  that the agreement is valid because services are described ignores the compensation requirement;
  the claim that invalidity depends on a consumer complaint misstates the rule; and the claim that
  later oral agreement can cure the omission contradicts the statute’s written requirement.
