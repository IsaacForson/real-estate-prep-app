stem: A person holds a duly executed power of attorney from a property owner authorizing the sale of
  the owner's residential home. Under Miss. Code Ann. § 73-35-3(9)(b), is a real estate license
  required for this person to conduct the sale?
options:
  - The person must first become a licensed real estate salesperson to act under the power of
    attorney
  - The person must obtain a real estate license before proceeding with the sale
  - The person is exempt as they hold a valid power of attorney from the owner
  - The person may only act if they are also the owner of the property being sold
key: C
explanation: Under §73-35-3(9)(b), any person holding in good faith a duly executed power of
  attorney from the owner authorizing the sale of real estate is exempt from licensing requirements.
  Therefore, no license is needed. The distractor suggesting a salesperson license is required
  contradicts the statutory exemption.
