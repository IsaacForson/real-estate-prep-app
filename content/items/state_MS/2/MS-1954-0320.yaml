stem: A Mississippi broker enters into a cooperative agreement with an out-of-state broker on March
  1 and files the written agreement with the commission on March 15. Under Miss. Code Ann. §
  73-35-11, is this filing compliant?
options:
  - The filing is compliant because it was made within ten (10) days.
  - The filing is non-compliant because it was made after ten (10) days.
  - The filing is compliant because it was made within fifteen (15) days.
  - The filing is non-compliant because it was made after fifteen (15) days.
key: B
explanation: Under Miss. Code Ann. § 73-35-11, a Mississippi broker must file a copy of each written
  cooperative agreement within ten (10) days. The agreement was entered on March 1 and filed on
  March 15, which is fourteen days later, exceeding the ten-day limit. Therefore the filing is
  non-compliant. The statement that the filing is compliant because it was made within ten (10) days
  is incorrect.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
