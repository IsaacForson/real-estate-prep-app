stem: A real estate school’s annual average pass rate on the broker’s license examination is 60
  percent. According to Miss. Code Ann. § 73-35-14.1(1)(b), what action must the Mississippi Real
  Estate Commission take?
options:
  - Immediately revoke the school’s accreditation and issue a fine
  - Require the school to submit a corrective action plan within 30 days
  - Mandate that the school stop offering pre‑license courses until compliant
  - Allow the school a three‑month period to reach the required pass rate
key: D
explanation: If a school fails to meet the minimum annual average pass rate of sixty‑five percent,
  the commission must allow the school a minimum of a three‑month time period to attain that rate.
  The distractor “Immediately revoke the school’s accreditation and issue a fine” is incorrect
  because the statute first provides a remediation period before any disciplinary action.
