  url: null
  quoted_text: (8) Exempt from the licensing requirements of this chapter shall be any person,
    partnership, association or corporation, who, as a bona fide owner, shall perform any aforesaid
    act with reference to property owned by them, or to the regular employees thereof who are on a
    stated salary, where such acts are performed in the regular course of business.
