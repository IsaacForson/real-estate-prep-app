stem: A Mississippi homeowner decides to sell their own residence without the assistance of a real
  estate broker. Under Miss. Code Ann. § 73-35-3(8), is the homeowner required to obtain a real
  estate license to conduct the sale?
options:
  - The homeowner must obtain a real estate license before listing the property
  - The homeowner must hold an active real estate salesperson license to proceed
  - The homeowner must first obtain a power of attorney from themselves to be exempt
  - The homeowner is exempt as a bona fide owner acting on their own property
key: D
explanation: The exemption in §73-35-3(8) states that a bona fide owner performing acts regarding
  property owned by them is exempt from licensing requirements. The homeowner selling their own
  property falls under this exemption, so no license is needed. The distractor about obtaining a
  power of attorney is incorrect because the exemption does not require a power of attorney for
  owners.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
