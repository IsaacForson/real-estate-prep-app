stem: Under Miss. Code Ann. § 73-35-21, what is the definition of 'reasonable time' for depositing
  earnest money received by a licensee?
options:
  - By the close of business of the same banking day the money is received.
  - By the close of business of the next banking day after receipt.
  - By the close of business of two banking days after receipt.
  - By the close of business of the seventh calendar day after receipt.
key: C
explanation: The statute defines reasonable time as the close of business of two banking days after
  the date the licensee receives the money. The option stating 'By the close of business of two
  banking days after receipt.' matches this definition. The option stating 'By the close of business
  of the next banking day after receipt.' is incorrect because it allows only one banking day, which
  is shorter than the required period.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) — § 73-35-21
  url: null
  quoted_text: “Reasonable time” in this context means by the close of business of two (2) banking
    days immediately following the date on which a licensee comes into possession of monies
    belonging to others or on which a responsible broker takes or receives any cash or checks from
    procuring the execution of an earnest money contract or option or other contract;
