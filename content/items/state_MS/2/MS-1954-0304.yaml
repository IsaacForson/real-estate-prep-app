  - A fine of $750.00.
  - A fine of $1,000.00.
  - A fine of $1,500.00.
key: C
explanation: The statute sets a fine range of not less than $500 nor more than $1,000 for a first
  violation, making $1,000 the maximum allowable fine. The $500 option represents the minimum, not
  the maximum; $750 is not specified in the law; and $1,500 exceeds the statutory cap.
