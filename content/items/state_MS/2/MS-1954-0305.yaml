stem: Under Miss. Code Ann. § 73-35-31(1), what is the maximum fine that may be imposed on an
  individual for a second violation of the Mississippi Real Estate Brokers License Law?
options:
  - A fine of $1,000.00.
  - A fine of $1,500.00.
  - A fine of $500.00.
  - A fine of $2,000.00.
key: D
explanation: For a second or subsequent violation, the law provides a fine of not less than $1,000
  nor more than $2,000. Thus the greatest fine permissible is $2,000. The lower options either fall
  below the statutory minimum or represent intermediate amounts not authorized as the maximum.
