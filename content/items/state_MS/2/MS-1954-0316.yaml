stem: Under Miss. Code Ann. § 73-35-10(2)(d), which of the following applicants is exempt from the
  criminal background check requirement?
options:
  - An applicant who has held a salesperson's license for twenty-five (25) years and is seventy-one
    (71) years of age.
  - An applicant who has held a broker's license for twenty (20) years and is sixty-eight (68) years
    of age.
  - An applicant who has held a salesperson's license for thirty (30) years and is sixty-nine (69)
    years of age.
  - An applicant who has held a broker's license for twenty-five (25) years and is seventy (70)
    years of age.
key: A
explanation: The exemption applies to persons who have held a broker's or salesperson's license in
  this state for at least twenty‑five years and who are older than seventy years of age. An
  applicant who has held a salesperson's license for twenty‑five years and is seventy‑one years of
  age meets both criteria. An applicant who has held a broker's license for twenty years and is
  sixty‑eight years of age does not meet the twenty‑year license requirement. An applicant who has
  held a salesperson's license for thirty years and is sixty‑nine years of age does not meet the age
  requirement. An applicant who has held a broker's license for twenty‑five years and is seventy
  years of age does not meet the age requirement because the applicant is not older than seventy.
citation:
