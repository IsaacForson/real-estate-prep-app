stem: A salesperson obtained their Mississippi license on March 1, 2024. Their license renews on
  June 30, 2025. Under Miss. Code Ann. § 73-35-6(2), is the salesperson required to complete
  continuing education for this first renewal?
options:
  - Yes, because they have been licensed more than one year.
  - No, because they have been licensed less than one year.
  - Yes, because the renewal date is after July 1, 1994.
  - No, because inactive licensees are exempt from continuing education.
key: A
explanation: The exemption applies only to applicants for first renewal who have been licensed for
  not more than one year; the salesperson has been licensed over one year, so they must complete
  continuing education. The distractor claiming exemption because the renewal date is after July 1,
  1994 misstates the condition, which is based on licensure duration, not the calendar date.
