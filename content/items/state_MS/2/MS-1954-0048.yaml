  url: null
  quoted_text: |-
    The holder of a temporary license shall complete the entire thirty-
    hour course within twelve (12) months of issuance of his temporary license; otherwise, this
    temporary license shall automatically be placed on inactive status by the Mississippi Real
    Estate Commission
