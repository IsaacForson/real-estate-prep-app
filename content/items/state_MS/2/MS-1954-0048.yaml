stem: A licensee receives a temporary license on March 15. What is the latest date by which the
  licensee must complete the required thirty‑hour post‑license course to avoid having the temporary
  license placed on inactive status?
options:
  - March 15 of the following calendar year
  - March 15 of the same calendar year
  - One year after receiving the temporary license
  - September 15 of the following calendar year
key: A
explanation: The holder of a temporary license must complete the thirty‑hour course within twelve
  (12) months of issuance; otherwise the license is placed on inactive status. Therefore, the course
  must be finished by March 15 of the following calendar year. The distractor “September 15 of the
  following calendar year” incorrectly allows extra time beyond the twelve‑month limit.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
