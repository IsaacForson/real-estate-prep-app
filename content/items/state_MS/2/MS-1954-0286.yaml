stem: What is the biennial accreditation fee that a real estate school must pay to the Mississippi
  Real Estate Commission under Miss. Code Ann. § 73-35-14.1(1)(a)?
options:
  - $2,500
  - $1,000
  - $5,000
  - $750
key: A
explanation: The rule states that if the school is accredited as a pre‑license school or pre‑license
  education provider, fees shall include a biennial fee of Two Thousand Five Hundred Dollars
  ($2,500.00). Therefore the correct amount is $2,500. The $1,000 figure applies to the annual
  certification fee for post‑license course providers, not the school accreditation biennial fee.
