stem: A licensee receives a notice of deficiency from the Mississippi Real Estate Commission on
  April 1. If the licensee does **NOT** submit the required proof of errors and omissions insurance
  by April 30, what is the status of the license?
options:
  - The license is revoked immediately for noncompliance.
  - The license remains active and valid for renewal.
  - The license is suspended pending review by the commission.
  - The license is placed on inactive status.
key: D
explanation: The rule states that licensees who do not correct the deficiency within thirty (30)
  days shall have their licenses placed on inactive status. The option claiming the license remains
  active ignores the mandatory thirty‑day cure period.
