stem: A real estate school’s annual average pass rate on the broker’s license examination is 60
  percent for the first nine months of the year. According to Miss. Code Ann. § 73-35-14.1(1)(b),
  how many additional months does the school have to reach the required 65 percent pass rate before
  facing disciplinary action?
options:
  - Six months
  - Twelve months
  - Nine months
  - Three months
key: D
explanation: When a school falls below the 65 % pass‑rate threshold, the commission must give it at
  least three months to improve before any disciplinary action. Therefore the school has three
  additional months to reach the required rate. The longer periods listed are not the minimum
  allowance prescribed by the rule.
