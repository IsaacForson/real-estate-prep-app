stem: An applicant for a Mississippi resident real estate broker license lives in Alabama but
  maintains a Mississippi mailing address and works remotely for a Mississippi‑based brokerage.
  Under Miss. Code Ann. § 73-35-7(a), is the applicant eligible for a resident license?
options:
  - Yes, because the applicant has a Mississippi mailing address.
  - No, because the applicant must have legal domicile in Mississippi at the time of application.
  - Yes, if the applicant declares intent to establish domicile within six months.
  - No, unless the applicant also holds an active salesperson license for twelve months.
key: B
explanation: Subsection (a) requires the applicant to be age twenty‑one or over and to have his
  legal domicile in the State of Mississippi at the time he applies. A mailing address alone does
  not satisfy the domicile requirement. The other options either add conditions not in the statute
  or confuse it with unrelated rules.
