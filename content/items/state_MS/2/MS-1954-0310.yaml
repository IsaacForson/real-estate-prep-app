stem: Under Miss. Code Ann. § 73-35-3(9)(a), which of the following is exempt from the licensing
  requirements of this chapter?
options:
  - A property manager overseeing maintenance contracts
  - A real estate salesperson showing residential units to prospects
  - A licensed real estate broker advertising property for lease
  - An attorney at law performing primary duties as an attorney
key: D
explanation: The statute explicitly exempts attorneys at law who are performing primary or
  incidental duties as attorneys from the licensing requirements. A licensed broker, salesperson, or
  property manager performing brokerage activities must be licensed, so those options are incorrect.
