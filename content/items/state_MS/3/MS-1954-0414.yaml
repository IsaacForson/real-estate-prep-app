stem: A licensee employs salespersons who repeatedly tell buyers that the roof is new when it is
  actually 20 years old, and the licensee knows of these misrepresentations but takes no action.
  Under Mississippi law, which subsection of §73-35-21 provides grounds for discipline?
options:
  - Subsection (c)
  - Subsection (d)
  - Subsection (a)
  - Subsection (b)
key: A
explanation: Subsection (c) covers pursuing a continued and flagrant course of misrepresentation
  through agents or salespersons. The most tempting distractor, Subsection (a), addresses a single
  substantial misrepresentation rather than a continued course through agents.
