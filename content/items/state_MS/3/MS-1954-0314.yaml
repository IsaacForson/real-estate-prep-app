stem: A broker closes a residential sale on March 10, 2024. According to Mississippi rule, how long
  must the broker retain the complete file relating to that transaction?
options:
  - For three years after the date of closing, until March 10, 2027.
  - For five years after the date of closing, until March 10, 2029.
  - For one year after the date of closing, until March 10, 2025.
  - For the duration of the broker’s license, whichever is longer.
key: A
explanation: Rule 3.2 G requires brokers to keep complete records for three years following the
  consummation of a transaction. Thus the file must be retained until three years after March 10,
  2024. The other options either overstate, understate, or introduce irrelevant criteria.
citation:
