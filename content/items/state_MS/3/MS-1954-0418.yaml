stem: Under Mississippi rule, what must an 'Exclusive Agency' listing agreement clearly indicate?
options:
  - that it shows expiration date
  - that it states broker commission
  - that it is such an agreement
  - that it includes the sales price
key: C
explanation: The rule requires an 'Exclusive Agency' listing agreement to clearly indicate that it
  is such an agreement. Therefore the correct answer is that it must indicate the agency type. The
  sales price, expiration date, and commission, while often included, are not the specific
  indication required by this rule.
citation:
  source: "### 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
