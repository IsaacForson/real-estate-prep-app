stem: A licensee prepares an exclusive buyer representation agreement that does not state that it is
  such an agreement. Under Mississippi rule, which requirement has been violated?
options:
  - A written agreement containing all required terms and signatures
  - An agreement with a definite expiration date and signatures
  - An agreement indicating it is an exclusive buyer representation agreement
  - An agreement specifying the buyer’s acceptable price range and terms
key: C
explanation: Rule 3.2C requires that an exclusive buyer representation agreement clearly indicate in
  the body of the document that it is such an agreement. The option that states the agreement must
  indicate it is an exclusive buyer representation agreement satisfies this requirement. The other
  options describe different requirements that are not the specific violation described.
