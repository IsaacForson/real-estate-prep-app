stem: Under Mississippi rule, which of the following must a broker retain for three years after a
  transaction's consummation?
options:
  - The broker must retain personal income tax records of the parties.
  - The broker must retain advertising materials used in the transaction.
  - The broker must retain escrow records related to the transaction.
  - The broker must retain referral fee agreements with other licensees.
key: C
explanation: Rule 3.2 G requires brokers to keep complete records of any real estate transaction for
  three years after consummation, and it explicitly lists escrow records as part of those records.
  Advertising materials, personal tax records, and referral fee agreements are not mandated to be
  retained for that period.
citation:
