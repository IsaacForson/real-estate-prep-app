stem: Under Mississippi rule, what statement must be included in every real estate contract to
  indicate whom the broker represents?
options:
  - A disclosure of the broker’s license number to the parties
  - A statement over the signatures showing broker representation
  - A notarized affidavit confirming the agency relationship
  - A separate addendum signed by both parties to the transaction
key: B
explanation: Rule 3.2E of the Mississippi Real Estate Commission Rules requires that every real
  estate contract contain a statement placed over the signatures indicating which party the broker
  represents. The correct option reflects this requirement by describing a statement over the
  signatures showing broker representation. The other options describe items — such as disclosing
  the broker’s license number, providing a notarized affidavit, or using a separate addendum — that
  are not mandated by this rule.
