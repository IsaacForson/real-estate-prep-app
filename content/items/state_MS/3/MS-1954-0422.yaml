  url: null
  quoted_text: or commingling of monies belonging to others with his or her own funds.
  secondary: []
math:
  worked_solution: The question does not require a numerical calculation; it only requires recognizing
    that the $5,000 earnest‑money check was deposited into a personal account, which is prohibited
    commingling under § 73‑35‑21(f).
