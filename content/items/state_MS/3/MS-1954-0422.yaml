stem: A licensee receives an earnest money check of $5,000 on Tuesday and deposits it into his
  personal checking account the same day. Under Mississippi law, which subsection of § 73‑35‑21
  provides grounds for discipline?
options:
  - Subsection (h)
  - Subsection (a)
  - Subsection (f)
  - Subsection (c)
key: C
explanation: Under Mississippi law, subsection (f) of § 73‑35‑21 makes it a disciplinary violation
  for a licensee to commingle money belonging to others with the licensee’s own funds. Depositing an
  earnest‑money check into a personal account is exactly that prohibited commingling. The other
  subsections address different conduct and do not cover this behavior.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
