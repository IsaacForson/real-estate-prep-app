stem: A listing broker receives a second written offer from a prospective buyer before the owner has
  accepted the first offer. The owner has given specific, written instructions to postpone
  presentation of other offers. Under Mississippi rule, what must the broker do with the second
  offer?
options:
  - The broker should forward the offer to another licensee for presentation.
  - The broker should discard the offer and inform the buyer it was not received.
  - The broker should withhold the offer from the owner until the owner provides new instructions.
  - The broker should present the offer to the owner immediately.
key: C
explanation: Rule 3.2 D states that any other written offer received before the owner has accepted
  an offer shall be presented to the owner unless the owner has given specific, written instructions
  to postpone presentation of other offers. Since the owner gave such instructions, the broker must
  withhold the offer from presentation. The distractor that says to present the offer immediately is
  wrong because it ignores the owner's written postponement instruction.
