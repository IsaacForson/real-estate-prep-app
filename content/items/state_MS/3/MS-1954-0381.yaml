stem: A broker closes a residential sale on June 1, 2024. According to Mississippi rule, until what
  date must the broker retain the property condition disclosure statement related to that
  transaction?
options:
  - June 1, 2027
  - May 31, 2027
  - June 1, 2025
  - May 31, 2025
key: A
explanation: Rule 30 Miss. Admin. Code Pt. 1601 § 3.2.G requires brokers to keep complete records
  relating to any real estate transaction for three years following its consummation. Adding three
  years to the June 1, 2024 closing date yields a retention deadline of June 1, 2027. The distractor
  May 31, 2027 mistakenly subtracts one day from the correct three‑year period.
citation:
