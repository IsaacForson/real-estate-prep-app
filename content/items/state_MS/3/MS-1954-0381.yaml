  url: null
  quoted_text: G. A real estate broker must keep on file for three years following its consummation,
    complete records relating to any real estate transaction. This includes, but is not limited to
    listings, options, leases, offers to purchase, contracts of sale, escrow records, agency
    agreements and copies of all closing statements.
