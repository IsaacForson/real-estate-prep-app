stem: Under Mississippi law, what is the definition of 'reasonable time' for depositing earnest
  money into a trust account?
options:
  - The money must be deposited by the close of the next banking day.
  - The money must be deposited by the close of the second banking day.
  - The money must be deposited immediately upon receipt.
  - The money must be deposited within five business days.
key: B
explanation: The statute defines reasonable time as the close of business of two banking days after
  receiving the money. The option stating the next banking day reflects the rule's shorter period
  but is not the statutory definition.
citation:
  source: Miss. Code Ann. § 73-35-21(f)
  url: null
  quoted_text: “Reasonable time” in this context means by the close of business of two (2) banking
    days immediately following the date on which a licensee comes into possession of monies
    belonging to others
