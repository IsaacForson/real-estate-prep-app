stem: "A broker acts as the agent for the seller in a residential sale. The seller is unable to
  deliver clear title and the transaction does not close. The earnest money deposited by the buyer
  must:"
options:
  - The earnest money must be returned in full to the buyer, and the broker may seek compensation
    only from the seller.
  - The earnest money must be split between the buyer and the broker to cover any earned commission.
  - The earnest money must be retained by the broker as liquidated damages for the seller's default.
  - The earnest money must be deposited into the broker's escrow account and held until the seller
    resolves the title issue.
key: A
explanation: >-
  The rule states that when the broker represents the seller and the seller cannot consummate the
  transaction, the broker has no right to any portion of the earnest money deposited by the buyer;
  the full amount must be returned to the buyer and the broker may seek compensation only from the
  seller. Therefore, the correct response is the one that says the earnest money must be returned in
  full to the buyer and the broker may seek compensation only from the seller.


  The idea that the earnest money should be deposited into the broker's escrow account and held
  until the seller resolves the title issue is incorrect because the broker may not retain any part
  of the deposit even if a commission has been earned. The suggestion that the broker may retain the
  earnest money as liquidated damages for the seller's default is also incorrect for the same
  reason. The proposal to split the earnest money between the buyer and the broker to cover any
  earned commission is likewise incorrect because the broker is not entitled to any portion of the
  deposit.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 3.4
  url: null
  quoted_text: When the broker is the agent for the seller and for any reason the seller fails or is
    unable to consummate the transaction, the broker has no right to any portion of the earnest
    money deposited by the purchaser, even if a commission has been earned. The entire amount of the
    earnest money deposit must be returned to the purchaser and the broker should look to the seller
    for compensation.
