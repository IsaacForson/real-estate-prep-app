stem: "A buyer cancels a purchase contract after discovering the seller failed to disclose a major
  structural defect, and is entitled to the return of the earnest money deposit. The broker holding
  the earnest money must:"
options:
  - The broker must return the earnest money promptly, allowing reasonable time for the check to
    clear.
  - The broker must return the earnest money immediately without waiting for the check to clear.
  - The broker must hold the earnest money until the seller authorizes its release.
  - The broker must deposit the earnest money into the broker's business account to cover potential
    losses.
key: A
explanation: The rule states that earnest money must be returned promptly when the purchaser is
  rightfully entitled, allowing reasonable time for the check to clear. Thus, the option stating
  that the broker must return the earnest money promptly, allowing reasonable time for the check to
  clear, is correct. The option stating that the broker must return the earnest money immediately
  without waiting for the check to clear is wrong because it omits the required clearance period,
  which the rule explicitly requires.
