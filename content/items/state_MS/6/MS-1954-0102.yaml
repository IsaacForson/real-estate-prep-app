stem: A salesperson receives an earnest money check from a buyer on Thursday morning. Under
  Mississippi law, by what time must the salesperson deposit the check into the responsible broker's
  trust account?
options:
  - End of business Tuesday.
  - End of business Thursday.
  - End of business Monday.
  - End of business Friday.
key: C
explanation: Section 73-35-21(f) defines reasonable time as the close of business of two banking
  days after receipt. Received Thursday, the two banking days are Friday and Monday, so deposit must
  be made by close of business Monday. The option stating end of business Friday is too early; the
  option stating end of business Tuesday is also too early; the option stating end of business
  Thursday allows only one banking day.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) — § 73-35-21
  url: null
  quoted_text: “Reasonable time” in this context means by the close of business of two (2) banking
    days immediately following the date on which a licensee comes into possession of monies
    belonging to others or on which a responsible broker takes or receives any cash or checks from
    procuring the execution of an earnest money contract or option or other contract;
