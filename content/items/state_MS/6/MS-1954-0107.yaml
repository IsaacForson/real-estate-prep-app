stem: Under Rule 3.4 A, when must a broker return earnest money to a purchaser who is rightfully
  entitled to it after the contract is terminated?
options:
  - After the purchaser submits a written cancellation notice.
  - After the earnest money check is placed in the escrow account.
  - After the earnest money check clears and the funds are available.
  - After the broker notifies the seller of the contract termination.
key: C
explanation: The rule requires earnest money to be returned promptly when the purchaser is
  rightfully entitled, allowing reasonable time for the check to clear. Therefore, the broker may
  return the money only after the check has cleared and funds are available. Returning the money
  immediately upon receiving a cancellation notice would violate the clearance requirement.
