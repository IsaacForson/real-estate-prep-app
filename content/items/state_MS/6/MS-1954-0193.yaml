stem: A broker maintains a single ledger that commingles all escrow monies without separating them
  by transaction. According to Mississippi Real Estate Commission Rule 3.4(C), is this practice
  compliant?
options:
  - The broker must store escrow records in a locked safe
  - The broker must reconcile escrow accounts monthly
  - The broker must keep only a total escrow balance
  - The broker must identify each escrow amount by transaction
key: D
explanation: The rule requires all monies in escrow accounts to be individually identified as to a
  particular transaction. The distractor suggesting only a total balance is insufficient because it
  fails to meet the individual identification requirement.
