stem: A broker opens a new office and employs three salespersons. According to §73-35-15(1), what
  must the broker ensure is prominently displayed in the office?
options:
  - The broker's registration certificate and each salesperson's registration certificate
  - The broker's business license and each salesperson's identification card and office lease
  - The broker's continuing education certificates and each salesperson's renewal receipts
  - The broker's office lease agreement and each salesperson's commission statement
key: A
explanation: The rule explicitly states that the broker's registration certificate and each
  salesperson's registration certificate must be prominently displayed in the office. The other
  items, such as business licenses, education certificates, or lease agreements, are not required to
  be displayed under this provision.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) § 73-35-15
  url: null
  quoted_text: The certificate of registration as broker and the certificate of each real estate
    salesperson employed by such broker shall be prominently displayed in said office.
