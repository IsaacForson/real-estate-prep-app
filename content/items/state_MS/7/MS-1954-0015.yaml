stem: Under Rule 5.1, what is a responsible broker required to do upon reasonably believing a
  supervised licensee violated the License Law?
options:
  - Personally fine the licensee for the violation
  - Terminate the licensee immediately without any investigation
  - Publish the violation in a local newspaper
  - Notify the Commission of the suspected violation
key: D
explanation: Rule 5.1 makes it mandatory for a responsible broker to notify the Commission upon
  reasonable belief that a supervised licensee violated the License Law or Rules and Regulations.
citation:
  source: 30 Miss. Admin. Code Pt. 1601, Rule 5.1
  url: null
  quoted_text: It shall be mandatory for a responsible broker to notify the Commission if the
    responsible broker has reason to believe that a licensee for whom the broker is responsible has
    violated the Real Estate License Law or Rules and Regulations of the Commission.
