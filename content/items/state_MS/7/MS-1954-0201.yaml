stem: A responsible broker learns that a salesperson supervised by the broker has been conducting
  real estate transactions through another broker without the broker's knowledge. According to Rule
  5.1(D), what must the broker do?
options:
  - The broker shall require the salesperson to cease activity but not notify the Commission
  - The broker shall wait until the salesperson's next license renewal to report the activity
  - The broker shall notify the Commission immediately and forward the salesperson's license to the
    Commission
  - The broker shall terminate the salesperson's employment but take no further action
key: C
explanation: Rule 5.1(D) mandates that if a broker finds a supervised licensee operating
  independently or through another broker, the broker must notify the Commission immediately and
  forward that licensee's license to the Commission. Waiting, terminating employment without
  notification, or merely requiring cessation do not satisfy the rule.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 5.1(D)
  url: null
  quoted_text: If a broker finds that a licensee licensed under that broker has been operating
    independently or through some other broker, the broker shall notify the Commission immediately
    and forward said individual's license to the Commission.
