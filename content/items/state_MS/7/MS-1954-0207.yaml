stem: A broker decides to cease all real estate activity and terminate the business. Under Rule
  1.2(A), what may the broker do with the business license?
options:
  - The broker must immediately surrender the license to the Commission
  - The broker may continue to renew the license as active without conducting business
  - The broker may place the business license on inactive status
  - The broker may transfer the license to a salesperson without Commission approval
key: C
explanation: Rule 1.2(A) states that a broker who terminates a real estate business may place the
  business license on inactive status. Surrendering the license, renewing as active, or transferring
  to a salesperson without approval are not permitted under this provision.
