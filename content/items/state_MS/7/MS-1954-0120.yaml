stem: A licensee wishes to place their license on inactive status. They send a written notice to the
  Commission and pay the fee, but they do not return the physical license. What must the licensee do
  to complete the change to inactive status?
options:
  - Submit a renewal application to the Commission.
  - Wait ten days for the change to be processed automatically.
  - Return the license to the Commission.
  - Notify the Commission of any adverse court decisions.
key: C
explanation: Under Rule 1.2 A, a licensee must notify the Commission in writing, return the license,
  and pay the fee to change to inactive status. Since the licensee already notified and paid, the
  missing step is returning the license. Therefore, returning the license to the Commission
  completes the requirement. Waiting ten days for the change to be processed automatically is
  incorrect because the rule does not provide for an automatic change; the license must be
  physically returned.
