stem: A responsible broker's license is suspended by the Commission. Under Rule 5.1, what happens to
  the licenses of the real estate licensees the broker supervises?
options:
  - Their licenses are automatically suspended as well
  - Their licenses are immediately upgraded to broker status
  - Their licenses are permanently revoked without appeal
  - Their licenses remain fully active and unaffected
key: A
explanation: Rule 5.1 provides that suspension or revocation of a responsible broker's license
  automatically suspends the license of every licensee under that broker's supervision.
citation:
  source: 30 Miss. Admin. Code Pt. 1601, Rule 5.1
  url: null
  quoted_text: The expiration, suspension or revocation of a responsible broker's license shall
    automatically suspend the license of every real estate licensee currently under the supervision
    of that broker.
