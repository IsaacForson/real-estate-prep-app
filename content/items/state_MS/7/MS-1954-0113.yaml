stem: A licensee returns to civilian life eleven months after an honorable discharge from
  active-duty military service. Under Rule 1.2C, how is the licensee considered regarding continuous
  engagement?
options:
  - As having to complete a refresher course before reactivation
  - As having been continuously engaged in the same capacity
  - As having broken continuity and requiring re‑licensing
  - As having to submit a new license application for renewal
key: B
explanation: Rule 1.2C states that a licensee returning within twelve months of honorable discharge
  is considered to have been continuously engaged in the same capacity. The other options describe
  consequences that do not apply within that period.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 § 1.2C
  url: null
  quoted_text: Any licensee who has entered active-duty military service due to draft laws or national
    emergency shall, upon his return to civilian life and within twelve (12) months after honorable
    discharge, be considered, so far as this Commission is concerned, to have been continuously
    engaged in the real estate business in the same capacity as when the licensee entered military
    service.
