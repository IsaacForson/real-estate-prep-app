stem: A broker discovers that a salesperson licensed under them has been operating independently
  (i.e., not under the broker's supervision) and has not informed the broker. According to Rule
  5.1D, what must the broker do?
options:
  - Notify the Commission immediately and forward the salesperson's license to the Commission.
  - File a transfer application with the new broker and pay the transfer fee.
  - Place the salesperson's license on inactive status and return it to the Commission.
  - Wait ten days to see if the salesperson corrects the behavior before taking action.
key: A
explanation: Rule 5.1D mandates immediate notification to the Commission and forwarding of the
  license when a broker finds a licensee operating independently without authorization. The
  transfer‑application distractor applies only when a licensee is changing brokers, not when
  operating independently.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 § 5.1D
  url: null
  quoted_text: If a broker finds that a licensee licensed under that broker has been operating
    independently or through some other broker, the broker shall notify the Commission immediately
    and forward said individual's license to the Commission.
