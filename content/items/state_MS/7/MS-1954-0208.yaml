stem: A salesperson seeks to recover unpaid fees from the broker who employed them. Under §
  73-35-33(2), who may bring the action in the salesperson's own name?
options:
  - The salesperson may bring the action in their own name.
  - The broker must bring the action on behalf of the salesperson.
  - The salesperson may bring the action only if the broker consents.
  - The salesperson may bring the action only if the fees are owed by a third party.
key: A
explanation: Section 73-35-33(2) expressly allows a salesperson to sue in their own name when
  seeking fees owed by the employing broker. The broker is not required to bring the suit; the
  salesperson may proceed directly.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) — § 73-35-33(2)
  url: null
  quoted_text: However, any real estate salesperson shall have the right to bring an action in his own
    name if the action is against the broker employing such salesperson for the recovery of any fees
    owed to him.
