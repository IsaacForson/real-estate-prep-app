stem: A broker’s business license is currently inactive, and the broker wishes to return to active
  status. Under Rule 1.2, what must the broker do to activate the license?
options:
  - The broker must submit a renewal application and pay the renewal fee to the Commission.
  - The broker must return the license to the Commission in writing and pay a reactivation fee.
  - The broker must notify the Commission by letter or submit a transfer application and pay the
    required fee.
  - The broker must file a transfer application signed by the new broker to the Commission.
key: C
explanation: Rule 1.2 states that a broker and/or a business license may be activated by notifying
  the Commission by letter or transfer application including the required fee. The
  renewal-application distractor applies to inactive licensees renewing, not activating.
