stem: Under § 73-35-15, what must be prominently displayed in a broker's office?
options:
  - The broker's business license document and a detailed list of current property listings
  - The broker's continuing education completion certificates and the signed office lease agreement
  - The broker's personal identification card and the salesperson's license certificate
  - The broker's registration certificate and the certificate of each salesperson employed by the
    broker
key: D
explanation: The statute requires that the broker's registration certificate and each salesperson's
  certificate be displayed prominently in the office. The other options list items not mandated for
  display by this provision.
