stem: Under § 73-35-15, what must the principal broker do within three days after a licensee’s
  agency is terminated?
options:
  - The principal broker must notify the Commission of the termination within three days.
  - The principal broker must return the licensee's license to the Commission within three days.
  - The principal broker must acknowledge the transfer of the licensee so that a new license may be
    issued.
  - The principal broker must file a transfer application with the Commission within three days.
key: C
explanation: The rule states that upon termination of a licensee’s agency, the principal broker
  shall within three days acknowledge the transfer so that a new license may be issued. The most
  tempting distractor is to notify the Commission, but the statute requires acknowledgement, not
  notification.
