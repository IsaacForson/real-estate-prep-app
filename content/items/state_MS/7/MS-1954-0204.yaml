stem: A broker wants to place their business license on inactive status, then later reactivate it.
  According to Rule 1.2, what must the broker do to reactivate the business license?
options:
  - Return the license to the Commission and pay the appropriate fee.
  - Submit a renewal application and pay the renewal fee while on inactive status.
  - Notify the Commission by letter or transfer application including the required fee.
  - File a transfer application signed by the new broker and pay the transfer fee.
key: C
explanation: Rule 1.2 provides that a broker and/or business license may be activated by notifying
  the Commission by letter or transfer application including the required fee. Returning the license
  and paying a fee pertains to placing the license on inactive status, not reactivation.
