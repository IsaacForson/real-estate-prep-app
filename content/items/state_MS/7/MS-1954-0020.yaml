stem: A brokerage forms a real estate Team under Rule 3.5. What experience must the designated Team
  Leader hold, and what liability follows?
options:
  - One year of experience, with exposure to team discipline
  - Five years of experience, with full immunity from team violations
  - Two years of experience, with liability limited to advertising errors
  - No minimum experience, with liability held by the Principal Broker
key: A
explanation: Rule 3.5 requires the Team Leader to have a minimum of one year of real estate
  experience and states the Team Leader may face disciplinary action for violations by team members
  under their supervision.
citation:
  source: 30 Miss. Admin. Code Pt. 1601, Rule 3.5
  url: null
  quoted_text: |-
    All teams must appoint a Team Leader, who will be a Broker Associate with a minimum
    of one years’ real estate experience and will have supervisory responsibility (under the
    supervision of the Principal Broker) over the Team members. The Team Leader may be
    subject to disciplinary action for violations of the Mississippi Real Estate Brokers Act by
    Team members under their supervision.
