stem: Under § 73-35-4, what duty does a licensee have to independently verify the accuracy of
  third-party information about a property's size or area?
options:
  - The licensee has a duty to verify the information with a surveyor
  - The licensee has a duty to verify the information with the assessor
  - The licensee has no duty to independently verify the information
  - The licensee has a duty to verify the information before closing
key: C
explanation: Section 73-35-4 states a licensee has no duty to conduct an independent investigation
  of a property's size or area or to independently verify the accuracy of third-party information.
citation:
  source: Miss. Code Ann. § 73-35-4
  url: null
  quoted_text: |-
    A real estate licensee has no duty to the seller or purchaser of real property to
    conduct an independent investigation of the size or area, in square footage or
    otherwise, of a subject property, or to independently verify the accuracy of any
    third-party information.
