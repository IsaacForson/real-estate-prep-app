stem: A broker wishes to place his business license on inactive status. Under Rule 1.2, what must
  the broker do?
options:
  - File a transfer application with a new broker's signature and pay the transfer fee
  - Submit a renewal application and pay the renewal fee while keeping the license active
  - Request a temporary suspension from the Commission and continue advertising listings
  - Notify the Commission in writing, return the license to the Commission, and pay the appropriate
    fee
key: D
explanation: Rule 1.2 A requires that to change a license from active to inactive status, the
  licensee must notify the Commission in writing, return the license, and pay the appropriate fee.
  The other options describe actions for renewal, transfer, or suspension, not inactivation.
