stem: A broker discovers that a salesperson under his supervision is conducting real estate
  transactions independently, without the broker's involvement. Under Rule 5.1, what must the broker
  do?
options:
  - Notify the Commission immediately and forward the salesperson's license to the Commission
  - Issue a written warning to the salesperson and retain the license in the office
  - Allow the salesperson to continue operating but require weekly reports
  - Terminate the salesperson's employment and keep the license with the broker
key: A
explanation: Rule 5.1 D states that if a broker finds a licensee operating independently or through
  another broker, the broker must notify the Commission immediately and forward the individual's
  license. The other options describe actions not required by the rule.
citation:
  source: "### 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 5.1"
  url: null
  quoted_text: If a broker finds that a licensee licensed under that broker has been operating
    independently or through some other broker, the broker shall notify the Commission immediately
    and forward said individual's license to the Commission.
