stem: A broker discovers that a salesperson licensed under the broker has been conducting real
  estate transactions through another broker without the broker's knowledge. Under Rule 5.1(D), what
  must the broker do?
options:
  - The broker must inform the salesperson to cease activity but need not notify the Commission.
  - The broker must wait ten days before notifying the Commission of the violation.
  - The broker must terminate the salesperson's license and return it to the Commission.
  - The broker must notify the Commission immediately and forward the salesperson's license to the
    Commission.
key: D
explanation: Rule 5.1(D) requires the broker to notify the Commission immediately and forward the
  license when a licensee operates independently or through another broker. Terminating the license
  is not authorized by the rule; the rule only mandates notification and forwarding.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 5.1(D)
  url: null
  quoted_text: If a broker finds that a licensee licensed under that broker has been operating
    independently or through some other broker, the broker shall notify the Commission immediately
    and forward said individual's license to the Commission.
