stem: Under §73-35-15(2), what must every license issued to a real estate salesperson or
  broker-salesperson designate?
options:
  - The principal broker of such salesperson or broker-salesperson
  - The address of the broker's principal office
  - The date the license was originally issued
  - The name of the salesperson's supervising team leader
key: A
explanation: The statute requires that each salesperson or broker-salesperson license designate the
  principal broker under whom they work. The address of the broker's office, the original issue
  date, and a team leader's name are not required designations under this provision.
