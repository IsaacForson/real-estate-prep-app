stem: A salesperson wants to sue for an unpaid commission owed by a buyer in a completed sale. Under
  § 73-35-33, who must bring that suit?
options:
  - The salesperson, suing in his own name
  - The Mississippi Real Estate Commission
  - The buyer's own closing attorney
  - The broker employing the salesperson
key: D
explanation: Section 73-35-33 provides that a salesperson may not sue in his own name for a
  commission and that such an action must be brought by the employing broker.
citation:
  source: Miss. Code Ann. § 73-35-33
  url: null
  quoted_text: No real estate salesperson shall have the right to institute suits in his own name for
    the recovery of a fee, commission or compensation for services as a real estate salesperson, but
    any such action shall be instituted and brought by the broker employing such salesperson.
