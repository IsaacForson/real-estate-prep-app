stem: A responsible broker receives an earnest money check from a buyer on Thursday morning.
  Assuming Friday and Monday are regular banking days, by what time must the broker deposit the
  check into the trust account to comply with § 73-35-21(f)?
options:
  - End of business Thursday
  - End of business Friday
  - End of business Monday
  - End of business Tuesday
key: C
explanation: The check is received on Thursday. The two banking days immediately following are
  Friday and Monday, so the deposit must be made by the close of business on Monday. Depositing by
  Friday would only satisfy one banking day, which does not meet the two‑day requirement.
citation:
