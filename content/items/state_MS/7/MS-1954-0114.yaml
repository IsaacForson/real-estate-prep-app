stem: Under Miss. Code Ann. § 73-35-21(f), within what timeframe must a responsible broker deposit
  earnest money or other funds received from a client into a trust or escrow account?
options:
  - Within five calendar days of receipt
  - By the close of business of two banking days after receipt
  - By the close of business of the next banking day after receipt
  - By the end of the same business day
key: B
explanation: The statute defines “reasonable time” for depositing trust funds as the close of
  business of two banking days after the licensee comes into possession of the money. Therefore, the
  broker must wait until the end of the second banking day. The option that limits the deposit to
  the next banking day is incorrect because the rule requires two banking days.
citation:
