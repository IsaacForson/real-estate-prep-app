citation:
  source: Miss. Code Ann. § 73-35-15
  url: null
  quoted_text: Every person, partnership, association or corporation licensed as a real estate broker
    shall be required to have and maintain a definite place of business, which shall be a room
    either in his or her home or an office elsewhere, to be used for the transaction of real estate
    business, or such business and any allied business.
