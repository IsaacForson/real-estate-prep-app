stem: Under § 73-35-21(f), what is meant by a "reasonable time" for depositing monies belonging to
  others?
options:
  - By the close of business of two banking days immediately following the date on which the
    licensee comes into possession of the monies.
  - Within seven calendar days of receiving the monies, the licensee must deposit them into a trust
    account.
  - Before the end of the next business day after receiving the monies, the funds must be placed in
    an escrow account.
  - At any time before the transaction closes or terminates, the broker should hold the monies in a
    separate account.
key: A
explanation: Under Miss. Code Ann. § 73-35-21, “reasonable time” means the close of business of two
  banking days after the licensee receives the monies. The choice that states funds must be
  deposited by the close of business of two banking days after receipt matches this definition. The
  choice requiring deposit within seven calendar days is not supported by the statute. The choice
  requiring deposit by the next business day imposes a shorter period than allowed. The choice
  permitting the funds to be held until closing exceeds the permitted time.
citation:
