  quoted_text: A Respondent who chooses to have the administrative hearing conducted by an
    Administrative Hearing Officer must notify the Commission of that choice within ten (10) days of
    the date of service of the Formal Complaint, Notice of Hearing and Notice of Option for
    Administrative Hearing Officer.
