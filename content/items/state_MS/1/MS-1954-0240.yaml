stem: A licensee receives a Formal Complaint, Notice of Hearing, and Notice of Option for
  Administrative Hearing Officer on March 1. By what date must the licensee notify the Mississippi
  Real Estate Commission in writing if they choose to have the hearing conducted by an
  Administrative Hearing Officer?
options:
  - March 2
  - March 11
  - March 15
  - March 31
key: B
explanation: Rule 5.5 D mandates that a respondent electing an administrative hearing officer must
  notify the commission within ten days of receiving the Formal Complaint, Notice of Hearing, and
  Notice of Option. Counting ten days from March 1 yields March 11. Shorter or longer periods do not
  satisfy the requirement.
