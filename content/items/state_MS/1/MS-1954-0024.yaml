stem: Under Mississippi law, which statement correctly describes public access to records maintained
  by the Mississippi Real Estate Commission?
options:
  - Only pending investigative files are routinely open to public inspection.
  - Commission records are rarely open to public inspection during regular business hours.
  - Commission records are open to public inspection except pending investigative files.
  - All commission records are open to public inspection after a formal request.
key: C
explanation: The statute provides that all commission records are open to public inspection except
  pending investigative files. Therefore, records are accessible unless they pertain to an ongoing
  investigation. The distractor claiming all records are open ignores the exemption for pending
  investigative files.
