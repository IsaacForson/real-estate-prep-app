stem: The Mississippi Real Estate Commission wishes to adopt new advertising rules for licensees.
  Which statement about its authority to do so is correct?
options:
  - The commission may promulgate rules to carry out this chapter.
  - The commission may adopt any rules it deems necessary without limitation.
  - The commission may not adopt rules without legislative approval.
  - The commission may only adopt rules that mirror federal regulations.
key: A
explanation: The statute authorizes the commission to promulgate rules and regulations to carry into
  effect the provisions of this chapter. The distractor suggesting the commission may adopt any
  rules without limitation overstates its authority, while the distractor requiring federal
  mirroring or legislative approval misstates the scope of its rulemaking power.
