stem: What standard of proof must the Mississippi Real Estate Commission use when examining factors
  during hearings on violations?
options:
  - The commission must apply a probable cause standard.
  - The commission must apply a preponderance of the evidence standard.
  - The commission must apply a beyond a reasonable doubt standard.
  - The commission must apply a clear and convincing evidence standard.
key: D
explanation: The key is correct because the statute explicitly states that the clear and convincing
  standard of proof shall be used to examine factors during all hearings. The distractor citing
  preponderance of the evidence is incorrect as the text does not mention that standard for
  commission hearings.
