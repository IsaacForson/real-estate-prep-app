stem: A licensee places their license on inactive status. According to Mississippi law, is the
  licensee required to submit proof of errors and omissions insurance to maintain the inactive
  license?
options:
  - An obligation to submit proof of errors and omissions insurance annually to maintain an inactive
    license
  - An exemption from errors and omissions insurance for licensees on inactive status
  - An obligation to submit proof only if inactive for less than one year
  - An obligation to pay a reinstatement fee instead of providing insurance
