stem: A licensee completes 10 hours of approved coursework in real estate law, a subject the
  commission has designated as required for renewal, and 6 hours in property management. Does the
  licensee satisfy the continuing education requirement for license renewal?
options:
  - Yes, because the total hours equal the required sixteen hours.
  - Yes, because property management hours supplement the law hours.
  - No, because the law hours exceed the eight‑hour limit for required subject matter.
  - No, because the licensee did not complete any ethics training.
key: C
explanation: The commission may mandate required subjects within the 16‑hour total, but those
  required subjects may not exceed eight hours. Ten hours in a designated required subject violates
  that limit, so the licensee does not meet the requirement. The distractor that focuses only on
  total hours ignores the eight‑hour cap on required subject matter.
