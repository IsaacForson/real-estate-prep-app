stem: A broker who currently maintains one licensed office opens a second office at a different
  location. What is the maximum annual fee the Mississippi Real Estate Commission may charge for the
  additional office?
options:
  - Seventy-five Dollars ($75.00) per year
  - Zero dollars ($0.00) per year
  - Fifty Dollars ($50.00) per year
  - Twenty-five Dollars ($25.00) per year
key: C
explanation: The statute limits the fee for each additional office to $50.00 per year. Thus the
  commission may charge up to that amount for the second office. The distractor of $75.00 exceeds
  the statutory maximum, while $0.00 and $25.00 are below the allowed maximum.
