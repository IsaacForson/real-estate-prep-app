stem: What is the minimum number of years a person must have been a Mississippi resident before
  being eligible for appointment to the Mississippi Real Estate Commission?
options:
  - Eight (8) years
  - Five (5) years
  - Six (6) years
  - Four (4) years
key: C
explanation: The statute requires each appointee to have been a resident and citizen of Mississippi
  for at least six years prior to appointment. This six‑year residency is a prerequisite for
  commission membership. The five‑year option is a common distractor that confuses the residency
  rule with the five‑year broker experience requirement.
