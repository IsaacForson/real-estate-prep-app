stem: The Mississippi Real Estate Commission plans to suspend a licensee’s license effective next
  Monday. According to § 73-35-10(3), when must the commission provide prior written notification to
  the licensee?
options:
  - The commission must provide notice immediately after deciding to suspend the license.
  - The commission must provide notice at least three business days before the effective date of the
    suspension.
  - The commission must provide notice at least five calendar days before the effective date of the
    suspension.
  - The commission must provide notice at least five business days before the effective date of the
    suspension.
key: D
explanation: The rule requires notice to be delivered not less than five business days prior to the
  effective date of any amendment, suspension, revocation, or non‑renewal. Therefore, the commission
  must give at least five business days’ notice before the suspension takes effect. Using calendar
  days or a shorter period does not satisfy the statutory requirement.
citation:
  source: "### Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) —
    Mississippi Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC
    compilation rev. 7-01-2026) § 73-35-10(3)"
  url: null
  quoted_text: Said notice shall be delivered to the licensee whose license shall be affected and, if
    applicable, to their responsible broker, not less than five (5) business days prior to the
    effective date of the change.
