stem: Under Mississippi Real Estate Commission rules, when may an investigator discuss alleged
  violations with a licensee?
options:
  - Under Mississippi law, the investigator may discuss alleged violations with a licensee only
    after written notice to the broker.
  - Under Mississippi law, the investigator may discuss alleged violations with a licensee only
    after written notice to the licensee.
  - Under Mississippi law, the investigator may discuss alleged violations with a licensee only
    after verbal notice to the broker.
  - Under Mississippi law, the investigator may discuss alleged violations with a licensee only
    after the fifteen‑day notice period for a hearing has elapsed.
key: A
explanation: The correct answer reflects the prohibition on commission staff communicating with a
  licensee about an investigation before written notice is sent to the licensee’s responsible
  broker. Discussing the matter only after hiring an attorney does not satisfy the statutory
  requirement, making that option incorrect.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) — § 73-35-23
  url: null
  quoted_text: No commissioner, administrator, employee, investigator, representative or agent of the
    commission shall communicate with a licensee in connection with any preliminary or formal
    investigation associated with alleged violations of licensing law or regulations prior to the
    delivery of written notice to the licensee’s responsible broker.
