stem: A witness subpoenaed by the Mississippi Real Estate Commission refuses to produce requested
  documents. According to Mississippi law, how may the commission enforce the witness's compliance?
options:
  - To ask the licensee's broker to persuade the witness to comply
  - To seek enforcement through any court in the same manner as civil cases
  - To request the commission to issue a new subpoena with higher fees
  - To impose an immediate fine on the witness without court involvement
key: B
explanation: Under §73-35-23(4), if a witness refuses to attend or produce documents, the commission
  may seek enforcement through any court of competent jurisdiction in the same manner as civil
  cases. The option stating that the commission can impose an immediate fine on the witness without
  court involvement incorrectly suggests the commission can impose fines directly, which the statute
  does not authorize.
