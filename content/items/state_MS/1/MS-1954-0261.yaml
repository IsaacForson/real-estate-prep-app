stem: A licensee knowingly misrepresents the square footage of a property to a buyer. The buyer sues
  for damages. Under Mississippi law, what type of damages may the buyer recover?
options:
  - The buyer may recover actual damages only, as exemplary and punitive damages are not allowed.
  - The buyer may recover no damages because the licensee did not fail to disclose the source of the
    information.
  - The buyer may recover actual damages plus exemplary damages, as the statute permits additional
    damages for knowing misrepresentation.
  - The buyer may recover actual damages plus punitive damages, as the statute allows extra damages
    for intentional misrepresentation.
key: A
explanation: Under Miss. Code Ann. § 73-35-4.1(2)(b), the sole and exclusive civil remedy for a
  licensee's violation of this section is an action for actual damages; exemplary or punitive
  damages are not permitted. Therefore the buyer may recover only actual damages. The option stating
  that the buyer may recover no damages is incorrect because the statute allows recovery of actual
  damages for a knowing misrepresentation. The options suggesting that exemplary or punitive damages
  may be added are incorrect because the statute expressly excludes those damages.
citation:
  source: "### Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) —
    Mississippi Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC
    compilation rev. 7-01-2026) § 73-35-4.1(2)(b)"
  url: null
  quoted_text: The sole and exclusive civil remedy at common law or otherwise for a violation of this
    section by a real estate licensee shall be an action for actual damages suffered by the party as
    a result of such violation and shall not include exemplary or punitive damages.
