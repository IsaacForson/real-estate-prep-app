stem: What is the minimum age requirement for an applicant seeking a resident real estate broker
  license in Mississippi?
options:
  - Twenty-one (21) years of age
  - Twenty-five (25) years of age
  - Thirty (30) years of age
  - Eighteen (18) years of age
key: A
explanation: Under Miss. Code Ann. § 73-35-7(1)(a), an applicant for a resident broker license must
  be age twenty‑one (21) years or over and have legal domicile in Mississippi. The statute
  explicitly sets twenty‑one as the minimum age. Therefore, eighteen years of age does not satisfy
  the requirement.
