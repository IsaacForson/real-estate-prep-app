stem: Under Mississippi law, how many days' notice must a licensee receive before a hearing on
  charges filed by the Mississippi Real Estate Commission?
options:
  - Eleven (11) days
  - Fourteen (14) days
  - Fifteen (15) days
  - Seventeen (17) days
key: C
explanation: The statute requires that a licensee be given fifteen (15) days’ notice of the hearing
  upon the charges filed, together with notice of the option to appear before the commission or an
  administrative hearing officer. The fourteen‑day option incorrectly shortens the required period,
  while the eleven‑ and seventeen‑day options do not match the statutory timeframe.
