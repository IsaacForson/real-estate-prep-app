stem: Under Mississippi law, may the Mississippi Real Estate Commission discipline a licensee for
  failing to disclose the source of third‑party size or area information provided in a real estate
  transaction?
options:
  - The Mississippi Real Estate Commission may discipline the licensee only for actual damages.
  - The Mississippi Real Estate Commission may discipline the licensee if the licensee also
    misrepresented the size.
  - The Mississippi Real Estate Commission may discipline the licensee if the violation was knowing.
  - The Mississippi Real Estate Commission may not discipline the licensee for such a violation.
key: D
explanation: Subsection (3) of § 73-35-4.1 provides that no real estate licensee shall be subject to
  discipline or other action by any licensing authority for violations of the disclosure‑of‑source
  requirement. Therefore the commission may not discipline the licensee. Distractor A incorrectly
  suggests that a knowing violation permits discipline, but the prohibition applies regardless of
  the licensee’s knowledge.
citation:
  source: "### Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) —
    Mississippi Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC
    compilation rev. 7-01-2026) § 73-35-4.1(3)"
  url: null
  quoted_text: Notwithstanding any other provision of law to the contrary, no real estate licensee
    shall have any duty or obligation nor be subject to discipline or other action of any kind by
    any licensing authority of the State of Mississippi, pertaining to information required to be
    disclosed by Sections 89-1-501 through 89-1-523 or delivery of information required to be
    disclosed by Sections 89-1-501 through 89-1-523.
