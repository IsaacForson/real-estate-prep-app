stem: Under Rule 5.7 A(c), a continuance request submitted less than five (5) days prior to the
  hearing may be made only under what circumstances?
options:
  - Unusual or extenuating circumstances
  - Routine scheduling conflicts
  - Attorney availability only
  - Witness unavailability only
key: A
explanation: The rule states that a continuance request made less than five days before the hearing
  may be made only under unusual or extenuating circumstances. The distractor describing routine
  scheduling conflicts is incorrect because the rule limits such late requests to unusual or
  extenuating situations, not ordinary scheduling issues.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 5.7 A(c)
  url: null
  quoted_text: A request for continuance, including one to retain counsel, submitted less than five
    (5) days prior to the hearing may be made only under unusual or extenuating circumstances.
