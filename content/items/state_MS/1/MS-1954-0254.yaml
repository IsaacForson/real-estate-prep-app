stem: Under Mississippi law, what amount must a person post as a bond when taking an appeal from an
  adverse decision of the Mississippi Real Estate Commission?
options:
  - One Hundred Dollars ($100.00)
  - One Thousand Dollars ($1,000.00)
  - Two Hundred Fifty Dollars ($250.00)
  - Five Hundred Dollars ($500.00)
key: D
explanation: The statute requires a bond of Five Hundred Dollars ($500.00) for any appeal
  (§73-35-25(4)). This amount ensures payment of possible costs. The distractor of Two Hundred Fifty
  Dollars understates the required bond, while One Thousand Dollars overstates it; neither matches
  the statutory figure.
