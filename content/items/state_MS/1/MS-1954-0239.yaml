  quoted_text: Any complaint initiated by the commission or filed with it shall be resolved by
    dismissal or issuance of a formal complaint within one hundred twenty (120) days of the date
    written notice is provided to licensee(s) and their responsible broker(s) of commencement of an
    investigation pertaining to any complaint.
