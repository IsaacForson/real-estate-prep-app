stem: A licensee delivers the property condition disclosure statement to a prospective buyer by
  first‑class mail after the buyer has executed an offer to purchase. Under Mississippi law, how
  many days does the buyer have to terminate the offer after receiving the disclosure?
options:
  - three (3) days
  - five (5) days
  - seven (7) days
  - ten (10) days
key: B
explanation: When the disclosure is delivered by deposit in the mail after execution of an offer,
  the transferee is allowed five (5) days to terminate the offer. The three‑day period applies only
  to personal delivery.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) § 89-1-503
  url: null
  quoted_text: the transferee shall have three (3) days after delivery in person or five (5) days
    after delivery by deposit in the mail, to terminate his or her offer by delivery of a written
    notice of termination to the transferor or the transferor’s agent.
