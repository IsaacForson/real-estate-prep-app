stem: A licensee prepares a broker's price opinion for a lienholder to be used as the basis for
  determining the value of a property in a first mortgage loan transaction. Under Mississippi law,
  is this permissible?
options:
  - No, because mortgage loan opinions must be prepared by a licensed appraiser
  - No, because subsection (2)(d) prohibits using a BPO for mortgage loan valuation
  - Yes, because lienholders are expressly allowed to request broker's price opinions
  - Yes, if the lienholder provides written authorization for the opinion
key: B
explanation: Subsection (2)(d) allows a licensee to prepare a BPO for a lienholder only for purposes
  other than using it as the basis to determine value for mortgage loan origination. Preparing such
  an opinion for mortgage loan valuation is therefore prohibited. The distractor suggesting
  permission with written authorization is incorrect because the statutory ban cannot be overridden
  by private agreement.
