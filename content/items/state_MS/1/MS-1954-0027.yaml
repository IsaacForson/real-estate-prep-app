stem: Under Mississippi law, which of the following applicants is exempt from the criminal
  background check requirement for a real estate license?
options:
  - An applicant who has held a broker’s license for twenty‑four years and is seventy‑one years old
  - An applicant who has held a broker’s license for thirty years and is sixty‑nine years old
  - An applicant who has held a broker’s license for twenty‑five years and is seventy years old
  - An applicant who has held a broker’s license for twenty‑eight years and is seventy‑two years old
key: D
explanation: The statute exempts from the background check persons who have held a broker’s or
  salesperson’s license for at least twenty‑five years and are older than seventy years. Only the
  applicant with twenty‑eight years of licensure and age seventy‑two meets both criteria. The other
  options fail either the years‑licensed or the age threshold.
