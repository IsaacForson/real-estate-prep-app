stem: A licensee provides a buyer with third‑party square‑footage information from a tax assessor
  but fails to disclose the source. The buyer suffers actual damages due to the incorrect size. In a
  civil action, what may the prevailing party recover besides actual damages?
options:
  - The prevailing party may recover court costs and reasonable attorney fees.
  - The prevailing party may recover interest on the damages at the statutory rate.
  - The prevailing party may recover exemplary damages in addition to actual damages.
  - The prevailing party may recover punitive damages in addition to actual damages.
key: A
explanation: Subsection (2)(d) of § 73-35-4.1 states that the prevailing party shall be allowed
  court costs and reasonable attorney fees in any civil action brought under this section.
  Distractors B and C are incorrect because the statute limits recovery to actual damages and
  excludes exemplary or punitive damages, as clarified in subsection (2)(b).
