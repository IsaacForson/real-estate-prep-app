stem: A Mississippi broker cooperates with an out-of-state broker to sell a Mississippi property.
  The buyer deposits earnest money. What must the Mississippi broker do with that earnest money
  under Mississippi law?
options:
  - The Mississippi broker must deposit the earnest money into the cooperating broker's escrow
    account.
  - The Mississippi broker must keep the earnest money in escrow unless the buyer and seller agree
    in writing to relieve him.
  - The Mississippi broker must release the earnest money to the seller immediately upon receipt.
  - The Mississippi broker must return the earnest money to the buyer if the cooperating broker is
    not licensed in Mississippi.
key: B
explanation: The statute requires the Mississippi broker to hold all earnest money from a
  cooperative agreement in escrow unless the buyer and seller agree in writing to relieve the broker
  of that responsibility. Depositing the money into the cooperating broker's escrow account violates
  this rule because the Mississippi broker, not the cooperating broker, must retain control of the
  funds.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
