stem: According to Mississippi law, what is the maximum time allowed for a responsible broker to
  deposit earnest money received from a client into a trust or escrow account?
options:
  - By the close of the fifth banking day after receipt.
  - By the close of the second banking day after receipt.
  - By the close of the first banking day after receipt.
  - By the close of the third banking day after receipt.
key: B
explanation: The statute defines 'reasonable time' for depositing earnest money as the close of
  business of the second banking day after receipt. Therefore, the broker must deposit by that time.
  The other options incorrectly state a different number of days.
citation:
  source: Miss. Code Ann. § 73-35-21
  url: null
  quoted_text: “Reasonable time” in this context means by the close of business of two (2) banking
    days immediately following the date on which a licensee comes into possession of monies
    belonging to others or on which a responsible broker takes or receives any cash or checks from
    procuring the execution of an earnest money contract or option or other contract;
