stem: Under Mississippi law, how many days does a transferee have to terminate an offer after
  receiving a property condition disclosure statement delivered in person following the execution of
  an offer to purchase?
options:
  - seven (7) days
  - ten (10) days
  - three (3) days
  - five (5) days
key: C
explanation: The statute provides that if a disclosure is delivered after execution of an offer, the
  transferee has three (3) days to terminate when the disclosure is delivered in person. The
  five‑day period applies only to delivery by deposit in the mail.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) § 89-1-503
  url: null
  quoted_text: the transferee shall have three (3) days after delivery in person or five (5) days
    after delivery by deposit in the mail, to terminate his or her offer by delivery of a written
    notice of termination to the transferor or the transferor’s agent.
