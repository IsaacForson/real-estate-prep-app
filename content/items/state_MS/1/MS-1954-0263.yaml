stem: Which licensee is exempt from the sixteen-hour continuing education requirement for the first
  renewal of a permanent license under Mississippi law?
options:
  - A licensee who is inactive and has not renewed for two years
  - A licensee who has held a license for more than five years
  - A licensee who has completed the post-license course and holds a permanent license
  - A licensee who has completed six hours of continuing education in the last year
key: C
explanation: The statute provides that the holder of an active license who has satisfactorily
  completed the post-license course and whose permanent license has been issued shall not be subject
  to the sixteen-hour continuing education requirement for the first renewal of that permanent
  license.
