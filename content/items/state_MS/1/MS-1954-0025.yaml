stem: A licensee provides a buyer with third‑party square‑footage information obtained from a tax
  assessor but fails to disclose the source of that information. The buyer later suffers actual
  damages because the size was incorrect. Which remedy is available to the buyer under Mississippi
  law?
options:
  - The buyer may recover punitive damages in addition to actual damages.
  - The buyer may recover actual damages only if the licensee knowingly violated the duty to
    disclose the source.
  - The buyer may recover both actual and punitive damages regardless of the licensee’s knowledge.
  - The buyer may not recover any damages because the information came from a public record.
key: B
explanation: The law allows recovery of actual damages only when the licensee knowingly fails to
  disclose the source of third‑party information; punitive damages are not available. The distractor
  that suggests punitive damages are available misstates the exclusive remedy provision.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) — Mississippi
    Real Estate Brokers License Law, Miss. Code Ann. Title 73, Chapter 35 (MREC compilation rev.
    7-01-2026) § 73-35-4.1(2)(a)
  url: null
  quoted_text: If a real estate licensee has provided third-party information to any party to a real
    estate transaction concerning size or area of the subject real property, a party to the real
    estate transaction may recover damages from the licensee in a civil action only when a licensee
    knowingly violates the duty to disclose the source of the information as required in this
    section.
