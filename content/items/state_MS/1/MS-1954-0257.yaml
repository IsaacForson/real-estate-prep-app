stem: Under Mississippi law, what is the evidentiary effect of a certified copy of the Mississippi
  Real Estate Commission's records that bears the commission's seal?
options:
  - Under Mississippi law, the certified copy is inadmissible unless the original is also presented.
  - Under Mississippi law, the certified copy is given less weight than the original.
  - Under Mississippi law, the certified copy is received in evidence equally and with like effect
    as the original.
  - Under Mississippi law, the certified copy is limited to use in administrative hearings only.
key: C
explanation: Miss. Code Ann. § 73-35-5(4) provides that copies of records and papers in the
  commission's office, duly certified and authenticated by the commission's seal, shall be received
  in evidence in all courts equally and with like effect as the original. The option stating that
  the certified copy is given less weight than the original contradicts this statutory provision.
