stem: A licensee receives written notice of an investigation on April 10. Assuming no extensions, by
  what date must the Mississippi Real Estate Commission either dismiss the complaint or issue a
  formal complaint?
options:
  - August 9
  - August 10
  - August 8
  - August 11
key: C
explanation: The correct date is August 8, which is 120 days after April 10. The statute requires
  dismissal or issuance of a formal complaint within 120 days of written notice. August 9 would be
  121 days, exceeding the allowed period.
