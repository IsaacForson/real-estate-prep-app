stem: A licensee submits a broker's price opinion via an online form that does not have a field for
  signatures or disclaimers. According to Mississippi law, how may the licensee satisfy the
  signature and disclaimer requirements?
options:
  - Attach a separate document containing the signature and disclaimer, reference the attachment,
    and state that the opinion is incomplete without it.
  - Insert a typed name and date in the form's comment box to serve as both signature and disclaimer.
  - Submit the opinion without a signature or disclaimer because the electronic format exempts the
    licensee from those requirements.
  - Obtain a hand‑signed waiver from the requesting party that excuses the signature and disclaimer.
key: A
explanation: Subsection (5)(a)(i) permits the signature and disclaimer to be transmitted in a
  separate attachment when the electronic format does not allow additional comments, provided the
  attachment is referenced and a statement is included that the opinion is incomplete without it.
  The other options either misstate the rule or add conditions not present in the statute.
citation:
  source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954) § 73-35-4.1(5)(a)(i)
  url: null
  quoted_text: (i) A signature required by paragraph (g) of subsection (4) and the disclaimer required
    by paragraph (j) of subsection (4) may be transmitted in a separate attachment if the electronic
    format or form supplied by the requesting party does not allow additional comments to be written
    by the licensee.
