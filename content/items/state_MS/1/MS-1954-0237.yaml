stem: An applicant has been a licensed real estate broker in Mississippi for four (4) years and has
  been a state resident for seven (7) years. According to Mississippi law, is the applicant eligible
  for appointment to the Mississippi Real Estate Commission?
options:
  - The applicant is eligible because the residency requirement is satisfied.
  - The applicant is ineligible because the broker experience requirement is not met.
  - The applicant is eligible because both residency and broker experience exceed the minimums.
  - The applicant is ineligible because the residency requirement is not met.
key: B
explanation: To be appointed, an applicant must have a vocation as a real estate broker for at least
  five years. The applicant has only four years of broker experience, so they are ineligible despite
  meeting the six‑year residency requirement. The distractor claiming eligibility based solely on
  residency ignores the broker experience prerequisite.
