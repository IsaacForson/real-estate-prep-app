stem: A licensee knowingly misrepresents the square footage of a property to a buyer. The buyer
  suffers actual damages due to the incorrect size. Under Mississippi law, within how many years
  after the date of transfer must the buyer file a civil action for actual damages?
options:
  - One (1) year after the date of transfer
  - Two (2) years after the date of transfer
  - Three (3) years after the date of transfer
  - Five (5) years after the date of transfer
key: B
explanation: The statute states that any civil action under this section must be commenced within
  two (2) years after the date of transfer of the subject real property. This timeline applies to
  actions for actual damages resulting from a licensee’s knowing misrepresentation of size. The
  one‑year option is incorrect because the law provides a longer period; the three‑ and five‑year
  options exceed the statutorily prescribed limit.
citation:
  source: Miss. Code Ann. § 73-35-4.1(2)(c)
  url: null
  quoted_text: For any real estate transaction commenced after the effective date of this section, any
    civil action brought pursuant to this section shall be commenced within two (2) years after the
    date of transfer of the subject real property.
