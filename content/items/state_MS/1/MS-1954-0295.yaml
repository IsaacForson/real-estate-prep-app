stem: Which of the following must be included in a broker's price opinion prepared under Mississippi law?
options:
  - A certification that the property complies with local zoning ordinances
  - A guarantee of the subject property's square footage
  - An appraisal of the market value of the property
  - A statement of the intended purpose of the price opinion
key: D
explanation: Subsection (4)(a) requires a broker's price opinion to contain a statement of the
  intended purpose of the price opinion. The other options describe items that are either prohibited
  (an appraisal) or not required by the statute.
