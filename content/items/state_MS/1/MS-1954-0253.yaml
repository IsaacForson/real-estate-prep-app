stem: A licensee provides a buyer with third‑party square‑footage information from a tax assessor
  but fails to disclose the source. The buyer later suffers actual damages due to the incorrect
  size. Under Mississippi law, within how many years must the buyer file a civil action for actual
  damages?
options:
  - The buyer must file within four (4) years of the property transfer
  - The buyer must file within one (1) year of the property transfer
  - The buyer must file within three (3) years of the property transfer
  - The buyer must file within two (2) years of the property transfer
key: D
explanation: Subsection (2)(c) of § 73-35-4.1 provides that any civil action for actual damages must
  be commenced within two (2) years after the date of transfer of the subject real property.
  Therefore, the buyer has two years to file suit. The one‑year option is incorrect because the
  statute explicitly sets a two‑year limitation period.
