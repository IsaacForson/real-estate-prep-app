stem: What minimum annual average pass rate must a Mississippi real estate school maintain on each
  of the broker’s and salesperson’s license examinations to retain its accreditation?
options:
  - At least sixty-four percent (64%)
  - At least sixty-six percent (66%)
  - At least sixty-three percent (63%)
  - At least sixty-five percent (65%)
key: D
explanation: The rule requires schools to keep an annual average pass rate of at least sixty‑five
  percent on both broker and salesperson exams to keep accreditation. A school with only a sixty
  percent rate falls short of that threshold, so the sixty percent option does not satisfy the
  requirement.
