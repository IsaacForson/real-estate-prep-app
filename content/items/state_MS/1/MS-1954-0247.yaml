stem: A Mississippi corporation with three officers who actively participate in its brokerage
  business applies for a real estate brokerage license. Two officers hold active broker licenses;
  the third does not. Under Mississippi law, what is the correct outcome?
options:
  - The license shall be granted because two of the three officers hold broker licenses.
  - The license shall be denied because all participating officers must hold broker licenses.
  - The license shall be granted after the third officer obtains a broker license.
  - The license shall be denied because the corporation has not paid the required fee.
key: B
explanation: Miss. Code Ann. § 73-35-6 requires that a business entity be licensed only when every
  owner, partner, or officer who actively participates in the brokerage business holds an individual
  broker license. Since one participating officer lacks a license, the corporation’s application
  must be denied. The fee payment is assumed to be satisfied, so that is not the basis for denial.
citation:
