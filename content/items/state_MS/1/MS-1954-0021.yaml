stem: How many members constitute the Mississippi Real Estate Commission?
options:
  - Three (3) persons.
  - Four (4) persons.
  - Five (5) persons.
  - Six (6) persons.
key: C
explanation: The statute creates the commission and specifies that it shall consist of five (5)
  persons appointed by the Governor with Senate consent. Therefore, five members is correct. The
  distractor stating four persons confuses the term allocation (one‑, two‑, and four‑year terms)
  with the total number of commissioners.
