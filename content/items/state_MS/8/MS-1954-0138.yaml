stem: A broker completes a real estate transaction on March 15, 2025. According to Mississippi Real
  Estate Commission Rule 3.2, until what date must the broker retain the complete records for that
  transaction?
options:
  - The broker must retain the records until March 15, 2027.
  - The broker must retain the records indefinitely.
  - The broker must retain the records until March 15, 2026.
  - The broker must retain the records until March 15, 2028.
key: D
explanation: Rule 3.2G mandates that a broker must keep on file for three years following
  consummation complete records relating to any real estate transaction. Adding three years to the
  consummation date of March 15, 2025 yields March 15, 2028 as the retention deadline. The
  distractor proposing a two-year retention period is incorrect because the rule explicitly requires
  three years, not two.
citation:
