stem: According to Mississippi Real Estate Commission Rule 3.4, how must earnest money records be
  maintained?
options:
  - Records must be individually identified as to a particular transaction.
  - Records must be aggregated monthly for each escrow account.
  - Records must be stored electronically for at least two years.
  - Records must be reviewed by the commission every quarter.
key: A
explanation: Rule 3.4 C states that all monies in escrow accounts must be individually identified as
  to a particular transaction. This requires separate tracking for each transaction rather than
  grouping them. The distractor suggesting monthly aggregation is incorrect because the rule
  mandates identification per transaction, not by time period.
