stem: A broker, acting as escrow agent, deposits an earnest money check that later is returned
  unpaid by the bank. According to Mississippi Real Estate Commission Rule 3.4, what must the broker
  do upon discovering the check has **NOT** been honored?
options:
  - The broker must immediately notify all parties involved in the transaction.
  - The broker must wait until the next banking day to notify the parties.
  - The broker must deposit the check again before notifying anyone.
  - The broker may choose to ignore the dishonored check if the amount is small.
key: A
explanation: The rule requires the broker to immediately notify all parties when an earnest money
  check is not honored. Therefore, the broker must notify all parties immediately. Waiting until the
  next banking day or redepositing the check does not satisfy the immediate notice requirement.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 3.4
  url: null
  quoted_text: If a broker, as escrow agent, accepts a check and later finds that such check has not
    been honored by the bank on which it was drawn, the broker shall immediately notify all parties
    involved in the transaction.
