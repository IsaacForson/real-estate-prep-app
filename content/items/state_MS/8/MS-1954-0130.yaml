stem: A broker accepts an earnest money check from a buyer and later discovers that the check has
  not been honored by the bank. According to Mississippi Real Estate Commission Rule 3.4, what
  action must the broker take?
options:
  - The broker must immediately notify all parties involved in the transaction.
  - The broker must wait until the next banking day to inform the buyer.
  - The broker must deposit the check into a different escrow account.
  - The broker must retain the check and attempt to re-deposit it.
key: A
explanation: Rule 3.4D requires that if a broker, as escrow agent, accepts a check that is later
  found not to be honored, the broker shall immediately notify all parties involved in the
  transaction. Thus, immediate notification is mandated. The distractor suggesting the broker wait
  until the next banking day is incorrect because the rule demands immediate action, not a delay.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
