stem: According to Mississippi Real Estate Commission Rule 3.2, what must every real estate contract
  include to indicate broker representation?
options:
  - A statement over the signatures showing whom the broker represents
  - A statement attached as an addendum to the contract
  - A statement placed in the contract's preamble
  - A statement printed on the broker's letterhead
key: A
explanation: Rule 3.2E states that every real estate contract must reflect whom the broker
  represents by a statement over the signatures of the parties to the contract. Therefore, the
  contract must include a statement over the signatures indicating the broker's representation. The
  distractor suggesting a statement attached as an addendum is incorrect because the rule specifies
  the statement must be over the signatures, not attached separately.
