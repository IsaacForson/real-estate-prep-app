stem: A broker receives a second written offer from a prospective buyer before the owner has
  accepted the first offer, and the owner has not given written instructions to postpone
  presentation. According to Mississippi Real Estate Commission Rule 3.2, what must the broker do
  with this second offer?
options:
  - Present the offer to the owner right away.
  - Hold the offer until the owner accepts the first bid.
  - Return the offer to the buyer without delay.
  - Deposit the offer into the escrow account.
key: A
explanation: Rule 3.2 D states that any other written offer must be presented to the owner unless
  the broker has specific written instructions to postpone. Since no such instructions exist, the
  broker must present the offer promptly. The distractor “Hold the offer until the owner accepts the
  first bid.” would delay presentation contrary to the rule’s requirement.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 3.2
  url: null
  quoted_text: any other written offer received by the listing broker, whether from a prospective
    purchaser or from another licensee cooperating in a sale, shall be presented to the owner unless
    the listing broker has specific, written instructions from the owner to postpone the
    presentation of other offers.
