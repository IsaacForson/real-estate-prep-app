stem: According to Mississippi Real Estate Commission Rule 3.2, what must an exclusive buyer
  representation agreement include to be compliant?
options:
  - The sales price range acceptable to the buyer, the considerations to be paid, the signatures of
    all parties, and a definite date of expiration
  - The exact sales price, the considerations to be paid, the signatures of all parties, and a
    definite date of expiration
  - The sales price range acceptable to the buyer, the considerations to be paid, the signatures of
    the buyer and broker only, and a definite date of expiration
  - The sales price range acceptable to the buyer, the considerations to be paid, the signatures of
    all parties, and a description of the property
key: A
explanation: Rule 3.2 C requires an exclusive buyer representation agreement to include the sales
  price range acceptable to the buyer, the considerations to be paid, the signatures of all parties,
  and a definite date of expiration. The most tempting distractor incorrectly substitutes an exact
  sales price for the required range.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 3.2
  url: null
  quoted_text: All exclusive buyer representation agreements shall be in writing and properly identify
    the terms and conditions under which the buyer will rely on the broker for the purchase of real
    estate; including the sales price range acceptable to the buyer, the considerations to be paid,
    the signatures of all parties to the agreement, and a definite date of expiration.
