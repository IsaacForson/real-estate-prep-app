stem: According to Rule 4.2.G, which of the following is **NOT** a fiduciary responsibility owed to
  the principal?
options:
  - Marketing
  - Confidentiality
  - Loyalty
  - Obedience
key: A
explanation: Rule 4.2.G lists the fiduciary duties as loyalty, obedience, disclosure,
  confidentiality, reasonable skill, care and diligence, and full accounting. Marketing is not among
  these duties, so it is not a fiduciary responsibility. The distractor "Confidentiality" is
  incorrect because it is expressly identified as a fiduciary duty in the same rule.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 4.2.G
  url: null
  quoted_text: (1) 'Loyalty' - the agent must put the interests of the principal above the interests
    of the agent or any third party. (2) 'Obedience' - the agent agrees to obey any lawful
    instruction from the principal in the execution of the transaction that is the subject of the
    agency. (3) 'Disclosure' - the agent must disclose to the principal any information the agent
    becomes aware of in connection with the agency.
