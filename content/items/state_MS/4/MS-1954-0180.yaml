stem: According to Rule 4.2.E, how is a "Customer" defined in a real estate transaction?
options:
  - The person to whom the agent owes a fiduciary duty
  - The person not represented in a real estate transaction
  - The broker who acts as a subagent to the salesperson
  - The party who provides written consent to dual agency
key: B
explanation: The rule defines a Customer as the person not represented in a real estate transaction;
  this may be the buyer, seller, landlord, or tenant. The description that the agent owes a
  fiduciary duty to the person refers to a client, which is not the definition of Customer.
citation:
