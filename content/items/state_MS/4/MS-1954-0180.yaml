    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 4.2
  url: null
  quoted_text: E. 'Customer' shall mean that person not represented in a real estate transaction. It
    may be the buyer, seller, landlord or tenant.
