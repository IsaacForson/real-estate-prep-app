stem: A broker representing a seller learns from a title search that there is an undisclosed
  easement on the property. The broker does not inform the seller. Which fiduciary duty is the
  broker violating?
options:
  - Violating the duty of obedience
  - Violating the duty of loyalty
  - Violating the duty of confidentiality
  - Violating the duty of disclosure
key: D
explanation: Under Rule 4.2.G(3), the disclosure duty requires the agent to disclose any information
  become aware of in connection with the agency. The broker’s failure to tell the seller about the
  easement violates this duty. Loyalty would require putting the seller’s interests above the
  broker’s, which is not the primary issue here.
