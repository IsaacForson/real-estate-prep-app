stem: Under Rule 4.3.F, when must the terms of the agency relationship be ratified?
options:
  - After the transaction closes
  - Before any contract is signed
  - Only when dual agency is used
  - On all real estate contracts
key: D
explanation: Rule 4.3.F states that the terms of the agency relationship shall be ratified on all
  contracts pertaining to real estate transactions. This aligns with the option "On all real estate
  contracts." The distractor "Before any contract is signed" is incorrect because ratification
  occurs on the contract itself, not prior to its execution.
