stem: Under Rule 4.4, when a licensee is transacting real estate with a limited liability company,
  what happens to the licensee's duty to comply with the provisions of Section 3?
options:
  - The licensee has to comply twice, once for each managing member
  - The licensee is required to notify the Commission within one business day
  - The licensee needs judicial approval to be excused
  - The licensee is not required to comply with those provisions
key: D
explanation: Rule 4.4 excuses a licensee from complying with the Section 3 provisions when the
  transaction involves a limited liability company or similar listed entity.
citation:
  source: 30 Miss. Admin. Code Pt. 1601, Rule 4.4
  url: null
  quoted_text: A licensee shall not be required to comply with the provisions of Section 3, when
    engaged in transactions with any corporation, non-profit corporation, professional corporation,
    professional association, limited liability company, partnership, real estate investment trust,
    business trust, charitable trust, family trust, or any governmental entity in transactions
    involving real estate.
