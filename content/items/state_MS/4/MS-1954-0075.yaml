stem: A broker initially represents the seller in a residential sale. Later, the broker agrees to
  also represent the buyer in the same transaction. According to Rule 4.3.C, when must the broker
  obtain new disclosure forms from all parties?
options:
  - At the time the broker first meets the buyer
  - At the time the agency relationship changes
  - At the time the purchase agreement is signed
  - At the time the broker receives the earnest money deposit
key: B
explanation: "Rule 4.3.C requires new disclosure forms whenever the agency relationship changes. The
  broker must obtain new disclosure forms at that point. The other options describe times unrelated
  to a change in representation: meeting the buyer first, signing the purchase agreement, or
  receiving the earnest money deposit."
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 4.3
  url: null
  quoted_text: In the event the agency relationship changes between the parties to a real estate
    transaction, new disclosure forms will be acknowledged by all parties involved.
