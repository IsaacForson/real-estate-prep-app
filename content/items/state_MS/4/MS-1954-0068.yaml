stem: A licensee prepares a purchase agreement that omits a statement indicating whom the broker
  represents. According to Rule 3.2(E), is this contract compliant?
options:
  - The contract is compliant if the parties verbally waive the statement
  - The contract is non‑compliant only when the broker acts undisclosed
  - The contract is compliant because the statement is considered optional
  - The contract is non‑compliant because the statement is required by rule
key: D
explanation: Rule 3.2(E) mandates that every real estate contract include a statement over the
  signatures showing whom the broker represents. Omitting this statement makes the contract
  non‑compliant, regardless of any verbal agreement. The distractor claiming compliance if parties
  verbally waive the statement ignores the written requirement.
