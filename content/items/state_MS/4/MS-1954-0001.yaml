stem: Under 30 Miss. Admin. Code Pt. 1601, Rule 4.2, what right does a principal delegate to an
  agent in creating an agency relationship?
options:
  - The right to keep commissions without accounting
  - The right to represent adverse parties without consent
  - The right to terminate the license law's fiduciary duties
  - The right to act for the principal with some discretion
key: D
explanation: Agency is created when a principal delegates to the agent the right to act on the
  principal's behalf and to exercise some degree of discretion while doing so.
