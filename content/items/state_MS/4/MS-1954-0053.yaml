stem: Under Rule 3.2(E), what must every real estate contract include regarding broker representation?
options:
  - A disclosure of the broker’s fee schedule provided before signing
  - A written expiration date included in the sales contract
  - A copy of the listing agreement attached to the sales contract
  - A statement over the signatures showing whom the broker represents
key: D
explanation: The rule states that every real estate contract must reflect whom the broker represents
  by a statement over the signatures of the parties to the contract. The other options describe
  unrelated contract elements such as attaching a listing agreement, disclosing fees, or including
  an expiration date, which are not required by this provision.
