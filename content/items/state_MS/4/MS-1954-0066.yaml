stem: A broker closed a residential sale on March 10, 2023. According to Rule 3.2(G), what is the
  latest date by which the broker must retain the complete records of that transaction?
options:
  - March 10, 2026
  - March 10, 2027
  - March 10, 2024
  - March 10, 2025
key: A
explanation: Rule 3.2(G) requires brokers to keep records for three years following the
  transaction's consummation. Three years after March 10, 2023 is March 10, 2026, so records must be
  retained at least until that date. March 10, 2027 would exceed the required retention period.
