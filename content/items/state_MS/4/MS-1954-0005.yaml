stem: A broker practicing disclosed dual agency obtains the seller's informed written consent to
  dual agency at what point, according to Rule 4.3?
options:
  - When the property's appraisal report is delivered
  - When the final closing statement is fully prepared
  - When the buyer first tours the listed property
  - When signing the broker representation agreement
key: D
explanation: Rule 4.3 states the seller gives written consent to dual agency by signing the consent
  portion of the MREC form at the time the representation agreement is entered into.
citation:
  source: 30 Miss. Admin. Code Pt. 1601, Rule 4.3
  url: null
  quoted_text: The seller, at the time an agreement for representation is entered into between the
    broker and seller, gives written consent to dual agency by signing the Consent To Dual Agency
    portion of MREC Form A.
