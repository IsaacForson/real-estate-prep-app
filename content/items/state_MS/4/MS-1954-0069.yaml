stem: A seller tells the listing broker verbally to hold off presenting any other offers until
  further notice. A second written offer is then received. According to Rule 3.2(D), what must the
  listing broker do with this offer?
options:
  - The broker should present the offer to the seller because only written instructions can postpone
    presentation
  - The broker should withhold the offer until the seller provides written confirmation
  - The broker should present the offer only if the seller later agrees in writing
  - The broker should withhold the offer because verbal instructions are sufficient to postpone
key: A
explanation: Rule 3.2(D) states that other written offers must be presented to the owner unless the
  broker has specific, written instructions to postpone presentation. A verbal instruction does not
  satisfy this requirement, so the broker must present the offer. The distractor claiming verbal
  instructions are sufficient contradicts the rule’s explicit written‑instruction condition.
