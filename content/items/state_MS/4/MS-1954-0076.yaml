stem: During negotiations, a seller tells the broker that the seller will accept $180,000 for the
  property, but asks the broker to keep this information confidential. The buyer later asks the
  broker whether the seller will accept less than the asking price. According to Rule 4.2.G(4), what
  must the broker do?
options:
  - The broker shall tell the buyer that the seller's bottom line is unknown
  - The broker shall disclose the seller's bottom line to the buyer
  - The broker shall inform the buyer that the seller is unwilling to negotiate
  - The broker shall keep the seller's bottom line confidential unless the seller permits disclosure
key: D
explanation: Rule 4.2.G(4) requires agents to keep confidential any private information from the
  principal unless the principal gives permission to disclose. Therefore, the broker must keep the
  seller's bottom line confidential unless the seller permits disclosure. Disclosing that
  information without permission would violate the confidentiality duty.
