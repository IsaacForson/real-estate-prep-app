    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 3.2(G)
  url: null
  quoted_text: A real estate broker must keep on file for three years following its consummation,
    complete records relating to any real estate transaction.
