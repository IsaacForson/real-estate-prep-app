stem: Under Rule 3.2(G) of the Mississippi Real Estate Commission Rules, how long must a broker
  retain escrow records after a transaction is completed?
options:
  - Seven year retention
  - Three year retention
  - Two year retention
  - One year retention
key: B
explanation: The rule requires brokers to keep escrow records for at least three years after the
  transaction’s consummation. Therefore, the correct retention period is three years. The option
  stating two years is incorrect because the rule specifies a minimum of three years, not two.
citation:
