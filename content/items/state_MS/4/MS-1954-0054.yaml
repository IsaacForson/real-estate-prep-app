stem: A licensee prepares a sales contract for a buyer and includes a purchase price higher than the
  actual agreed price to help the buyer qualify for a larger loan. According to Rule 3.2(F), what is
  prohibited?
options:
  - Providing a copy of the contract to the buyer after signing
  - Failing to present competing offers to the seller
  - Representing an amount exceeding the true selling price to a lender
  - Not retaining transaction records for the required three years
key: C
explanation: The rule prohibits a licensee from representing to a lender or any other interested
  party an amount in excess of the true and actual selling price, whether verbally or through a
  false sales contract. The other options describe permissible or unrelated actions such as
  providing a contract copy, not presenting offers, or record‑keeping duties, which are not
  addressed by this prohibition.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
    Commission Rules and Regulations, 30 Miss. Admin. Code Part 1601 (rev. 02-21-2025) — § 3.2
  url: null
  quoted_text: No licensee shall represent to a lender or any other interested party, either verbally
    or through the preparation of a false sales contract, an amount in excess of the true and actual
    selling price.
