stem: A seller has not yet accepted an offer when a second written offer arrives from another
  licensee. Under Rule 3.2, what must the listing broker do with the second offer?
options:
  - Present it to the seller unless told in writing to postpone
  - Discard it because a single offer may be reviewed at a time
  - Forward it directly to the Commission for review
  - Combine both offers into a single counteroffer automatically
key: A
explanation: Rule 3.2 requires any other written offer to be presented to the owner unless the
  listing broker has specific written instructions from the owner to postpone presentation of other
  offers.
citation:
  source: 30 Miss. Admin. Code Pt. 1601, Rule 3.2
  url: null
  quoted_text: any other written offer received by the listing broker, whether from a prospective
    purchaser or from another licensee cooperating in a sale, shall be presented to the owner unless
    the listing broker has specific, written instructions from the owner to postpone the
    presentation of other offers
