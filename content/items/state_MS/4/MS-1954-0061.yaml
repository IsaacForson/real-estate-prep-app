stem: Under Rule 4.2 of the Mississippi Real Estate Commission Rules, how is the term "Client" defined?
options:
  - The person to whom the agent owes a fiduciary duty, who may be a seller, buyer, landlord, tenant
    or both
  - The person to whom the agent owes a fiduciary duty, who is either the seller or the buyer
  - The person to whom the agent owes a fiduciary duty, who is the party paying the commission
  - The person to whom the agent owes a fiduciary duty, who is the landlord in a lease transaction
key: A
explanation: Rule 4.2(C) defines "Client" as the person to whom the agent owes a fiduciary duty,
  noting it can be a seller, buyer, landlord, tenant, or both. The option that limits the client to
  only seller or buyer incorrectly omits landlord, tenant, or both parties.
