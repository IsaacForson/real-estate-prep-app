stem: Under Rule 3.3, what must a broker obtain before advertising using a partnership, trade name,
  association, company, or corporation name?
options:
  - A partnership, trade name, association, company or corporation license
  - A trust account agreement with a bank for escrow
  - A written authorization from every property owner
  - A consent form from the Mississippi Real Estate Commission
key: A
explanation: Under Rule 3.3(B), a broker must secure a partnership, trade name, association,
  company, or corporation license before advertising using that name. A written authorization from
  every property owner pertains to sign placement, not trade‑name advertising. A consent form from
  the Mississippi Real Estate Commission is not required for trade‑name use. A trust account
  agreement with a bank relates to handling funds, not advertising authority.
