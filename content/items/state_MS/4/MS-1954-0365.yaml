stem: A broker closes a residential sale on January 15, 2024 and destroys the escrow records on July
  1, 2025. Under Rule 3.2(G), is the broker’s action compliant?
options:
  - Yes, because less than three years have passed since closing.
  - No, because the broker must keep records for five years after closing.
  - No, because records must be retained for three years after consummation.
  - Yes, because the broker retained the records for over 18 months.
key: C
explanation: The rule mandates that escrow records be kept for three years following consummation;
  destroying them after only 18 months violates this requirement. Therefore, the broker’s action is
  not compliant. The option claiming compliance because less than three years have passed ignores
  the three‑year minimum.
citation:
  source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations) — Mississippi Real Estate
