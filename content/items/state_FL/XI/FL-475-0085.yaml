stem: A licensee arranges to receive a rebate from a title company for referring closings, and fully
  advises the buyer, seller, and all other affected parties of the arrangement before it takes
  effect. Analyzing Rule 61J2-10.028, F.A.C., does this arrangement violate the rule?
options:
  - Yes, any rebate arrangement between a licensee and a title company is barred
  - No, full advance disclosure to affected parties removes the violation
  - No, rebates from title companies fall outside this rule entirely
  - Yes, disclosure to affected parties cannot cure a kickback arrangement
key: B
explanation: The rule makes a kickback or rebate arrangement a violation unless, before the
  placement or favor occurs, the licensee has fully advised the principal and all affected parties
  of the arrangement, which is exactly what happened here.
citation:
  source: Fla. Admin. Code Rule 61J2-10.028
  url: null
