    receive, directly or indirectly, any kickback or rebate, for the placement of, or f avor in, any
    business transaction which forms a part of, or is incident to, any transaction(s) negotiated or
    handled by said licensee, is a violation of Section 475.25(1)(b) or (d), F.S.
