stem: "A sales associate secures a written listing agreement from a homeowner but forgets to insert
  a definite expiration date. According to §475.25(1)(r), this omission:"
options:
  - It is a violation that may lead to disciplinary action
  - It is permissible if the homeowner verbally agrees to a time frame
  - It is a minor clerical error not subject to commission review
  - It is applicable to commercial real estate listings
key: A
explanation: Under §475.25(1)(r), a written listing agreement must include a definite expiration
  date; omitting this element is a violation that may lead to disciplinary action. The distractor
  suggesting verbal agreement suffices is wrong because the statute requires the expiration date to
  be in the written agreement regardless of any oral understanding.
