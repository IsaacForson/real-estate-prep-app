stem: "A broker hires an individual who has never held a real estate license to work as a sales
  associate. Under Florida Statute 475.42(c), this action is:"
options:
  - This action is allowed if the broker pays a processing fee to the commission.
  - This action is a violation because the broker employed an unlicensed person as a sales associate.
  - This action is permissible if the individual completes the required pre‑license course within 30
    days.
  - This action is allowed if the individual obtains a license before conducting any transactions.
key: B
explanation: The statute forbids a broker from employing or continuing to employ any person as a
  sales associate who does not hold a valid and current sales associate license. The distractor
  suggesting acceptability if the license is obtained before transactions is incorrect because the
  license must be held at the time of employment.
