stem: "Under Florida Statute 475.41, a contract for a commission or compensation for any act or
  service requiring a real estate license is:"
options:
  - A contract that is valid if the unlicensed person obtains a license before the service is
    performed.
  - A contract that is valid if the parties sign a written agreement regardless of licensing.
  - A contract that is valid only if the broker or sales associate holds a current active license
    when the service is performed.
  - A contract that is invalid even if the broker or sales associate is licensed at the time of
    service.
key: C
explanation: The statute states that a contract for commission is invalid unless the broker or sales
  associate has complied with licensing requirements at the time the service was performed. The
  distractor suggesting validity if the license is obtained beforehand is incorrect because the
  license must be held when the act or service occurs.
