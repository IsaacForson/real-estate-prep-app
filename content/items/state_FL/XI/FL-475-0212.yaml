stem: According to Florida Statute 475.255, what does the mere payment or promise to pay
  compensation to a licensee **NOT** determine?
options:
  - Whether the buyer has delivered earnest money to the escrow agent
  - Whether the seller has disclosed known property defects
  - Whether an agency or transactional brokerage relationship exists
  - Whether the licensee is entitled to receive a commission
key: C
explanation: The statute explicitly states that payment or promise of compensation alone does not
  determine whether an agency or transactional brokerage relationship exists; therefore, the correct
  answer is whether such a relationship exists. The distractor about commission entitlement is
  incorrect because the statute does not address commission entitlement in this provision.
