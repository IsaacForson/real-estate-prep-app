stem: Which activity is exempt from the real estate licensing requirement under Florida Statute
  475.01(11)?
options:
  - Renting a public lodging establishment for transient occupancy
  - Advertising for the sale of a single-family residence
  - Managing a commercial office building for a monthly fee
  - Leasing agricultural land to a tenant under a lease agreement
key: A
explanation: Florida Statute 475.01(11) exempts any person who, for compensation, rents or
  advertises for rent for transient occupancy any public lodging establishment licensed under
  chapter 509. Therefore, renting a public lodging establishment for transient occupancy is exempt.
  Advertising for the sale of a single-family residence involves a sale, not a rental for transient
  occupancy, so it is not exempt. Managing a commercial office building for a monthly fee is
  property management activity, which is not covered by the exemption. Leasing agricultural land to
  a tenant under a lease agreement does not involve a public lodging establishment licensed under
  chapter 509, so it is also not exempt.
