stem: Which written contract, entered into between an owner of commercial real estate and a broker,
  obligates the owner to pay a commission for the broker's licensed services relating to the
  property's sale?
options:
  - A brokerage agreement
  - A property listing disclosure
  - A commission notice
  - A closing cost statement
key: A
explanation: Section 475.701, Florida Statutes, defines a brokerage agreement as the written
  contract in which a commercial property owner agrees to pay the broker a commission for the
  broker's licensed services.
citation:
  source: Fla. Stat. § 475.701
  url: null
  quoted_text: “Brokerage agreement” means a written contract entered into on or after the effective
    date of this act between an owner of commercial real estate and a broker that obligates the
    owner to pay a commission to the broker for licensed services provided by the broker relating to
    the sale or disposition of the commercial real estate as specified in the contract.
