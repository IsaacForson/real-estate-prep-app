stem: An owner sells a triplex, a structure with three residential units, and the broker seeks to
  record a lien under the Commercial Real Estate Sales Commission Lien Act. Applying section
  475.701, F.S., how is the triplex treated?
options:
  - It is excluded if the owner occupies one of the units
  - It is included because it generates rental income for the owner
  - It is included because it has more than one residential unit
  - It is excluded because it holds one to four residential units
key: D
explanation: Section 475.701 excludes from the definition of commercial real estate any interest
  improved with one single-family unit or a multifamily structure containing one to four residential
  units, and a triplex falls within that carve-out.
