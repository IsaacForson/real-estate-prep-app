stem: "A sales associate receives a buyer’s earnest money deposit directly from the buyer and
  deposits it into her personal account without first obtaining her broker’s express consent. Under
  Florida Statute 475.42(d), this action is:"
options:
  - This action is permissible because the associate holds a valid sales associate license.
  - This action is allowed if the associate returns the deposit to the buyer the same day.
  - This action is a violation because the associate collected money not in the name of the employer.
  - This action is allowed if the associate notifies the broker within 24 hours.
key: C
explanation: The statute prohibits a sales associate from collecting any money in a brokerage
  transaction except in the name of the employer with the employer’s express consent. The distractor
  claiming permissibility due to licensure is wrong because the license does not override the
  requirement to handle funds through the employer.
