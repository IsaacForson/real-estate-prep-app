stem: A sales contract directs the buyer's deposit to a title company rather than the licensee's
  broker. Under Rule 61J2-14.008, F.A.C., what must the licensee's broker do within ten business
  days after the deposit is due?
options:
  - Deposit a matching amount into the brokerage's own escrow account
  - File a copy of the sales contract with the Department
  - Notify the buyer that the broker is no longer responsible for the funds
  - Make written request to the title company for verification of receipt
key: D
explanation: The rule requires that within ten business days after each deposit is due, the
  licensee's broker make written request to the title company or attorney to provide written
  verification of receipt of the deposit.
