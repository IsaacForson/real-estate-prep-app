stem: A commercial property owner and a broker sign a brokerage agreement that sets a fee the owner
  will pay once the property sells. How does section 475.701, F.S., classify that fee?
options:
  - A commission, because it is compensation the owner agreed to pay
  - A commission notice, because it is claimed in a recorded document
  - A closing cost, because it is paid when documents are exchanged
  - A brokerage agreement, because it arises from the signed contract
key: A
explanation: Section 475.701 defines commission as any fee or other compensation that an owner
  agrees to pay a broker for licensed services as specified in a brokerage agreement, which
  describes the fee in this scenario.
