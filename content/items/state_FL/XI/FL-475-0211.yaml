stem: A federally insured depository institution sells a parcel of land to an accredited investor,
  with no involvement in a business enterprise transaction. Under Florida Statute 475.01(12), is the
  institution exempt from the real estate licensing requirement?
options:
  - Not exempt because the institution did not receive compensation for the land sale
  - Exempt because the institution is a federally insured depository institution
  - Exempt because the buyer is an accredited investor in a land-only deal
  - Not exempt because the transaction involves land, not a business enterprise
key: D
explanation: The exemption under Fla. Stat. § 475.01(12) applies only when the transaction involves
  the sale, exchange, purchase, or rental of a business enterprise; it does not apply to a sale of
  land that is not connected with such a transaction. Therefore, a land‑only sale is not exempt. The
  claim that exemption is based on the institution’s status is incorrect; the exemption depends on
  the nature of the transaction, not on who the parties are.
citation:
