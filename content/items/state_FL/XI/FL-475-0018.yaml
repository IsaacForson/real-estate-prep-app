stem: A buyer's deposit under a sales contract is being held by a title company rather than the
  broker. Under Rule 61J2-14.008, how soon after the deposit is due must the licensee's broker
  request written verification of receipt from the title company?
options:
  - Within one business day after the deposit is due under the sales contract
  - Within ten business days after the deposit is due under the sales contract
  - Within thirty calendar days after the deposit is due under the sales contract
  - Within three business days after the deposit is due under the sales contract
key: B
explanation: Rule 61J2-14.008, F.A.C. requires the licensee's broker to make a written request for
  verification of a deposit held by a title company or attorney within ten business days after the
  deposit is due.
citation:
  source: Fla. Admin. Code Rule 61J2-14.008
  url: null
  quoted_text: Within ten (10) business days after each deposit is due under the sales contract, the
    Licensee’s broker shall make written request to the title company or attorney to provide written
    verification of receipt of the deposit, unless the deposit is held by a title company or by an
    attorney nominated in writing by a seller or seller’s agent.
