stem: Under Florida Statute 475.451(3), which of the following actions is expressly prohibited for a
  real estate school?
options:
  - Guaranteeing that its pupils will pass the licensure examination.
  - Offering courses via distance learning.
  - Charging a tuition fee for student enrollment.
  - Requiring students to purchase textbooks from the school.
key: A
explanation: The statute prohibits a real estate school from guaranteeing that its pupils will pass
  the licensure examination. Charging tuition, requiring students to buy textbooks from the school,
  and offering courses via distance learning are not prohibited by this subsection. Therefore,
  guaranteeing that its pupils will pass the licensure examination is the prohibited action.
