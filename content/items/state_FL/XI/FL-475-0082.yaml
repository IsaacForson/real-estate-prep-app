stem: A buyer hands a real estate licensee an earnest money check as part payment on a purchase
  contract. Under Rule 61J2-14.008, F.A.C., how is this check classified?
options:
  - A closing cost, because it is applied at the time of closing
  - A rebate, because it returns to the buyer if the sale falls through
  - A deposit, because it is earnest money paid toward the purchase
  - A commission, because it pays the licensee for arranging the sale
key: C
explanation: The rule defines a deposit as a sum of money, or its equivalent, delivered to a
  licensee as earnest money or a payment in connection with a real estate transaction, which
  describes the buyer's check.
citation:
  source: Fla. Admin. Code Rule 61J2-14.008
  url: null
  quoted_text: A “deposit” is a sum of money, or its equivalent, delivered to a real estate licensee,
    as earnest money, or a payment, or a part payment, in connection with any real estate
    transaction named or described in Section 475.01(1)(a), F.S.
