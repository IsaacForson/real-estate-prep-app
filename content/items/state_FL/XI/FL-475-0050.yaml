stem: A buyer of a residential condominium unit delivers written notice to a licensee of the buyer’s
  intent to cancel the contract for sale and purchase as authorized by s. 718.503. The licensee is
  holding the buyer’s deposit in an escrow account. What may the licensee do with the escrowed
  funds?
options:
  - The licensee shall wait thirty days before taking any action regarding the escrowed deposit
    unless the buyer provides written cancellation notice.
  - The licensee shall submit the matter to arbitration with the consent of all parties before
    deciding how to disburse the escrowed deposit.
  - The licensee shall return the escrowed deposit to the purchaser without notifying the commission
    or initiating any of the procedures in §475.42(d)1.a.-d.
  - The licensee shall immediately notify the commission and request an escrow disbursement order to
    determine who is entitled to the escrowed deposit.
key: C
explanation: According to §475.42(d)1, if a buyer of a residential condominium unit delivers written
  notice of intent to cancel the contract as authorized by s. 718.503, the licensee may return the
  escrowed property to the purchaser without notifying the commission or initiating any of the
  procedures listed in sub-subparagraphs a.-d. The other options either impose unnecessary steps or
  delay the permissible action.
