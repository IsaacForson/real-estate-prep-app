stem: "A licensee who is the purchaser under a real estate sales contract fails to deposit the
  earnest money into an escrow account as required by the contract. According to §475.42(d)2, this
  failure is:"
options:
  - The licensee has committed a violation by failing to deliver escrowed property to the party
    entitled to it upon demand under the terms of the escrow agreement.
  - The licensee has committed a violation by advertising property in a false or misleading manner
    that violates commission rules on advertising.
  - The licensee has committed a violation by sharing a commission with an unlicensed person for a
    referral without the proper licensing authorization.
  - The licensee has committed a violation by failing to deposit money in an escrow account when the
    contract requires the purchaser to place deposit money there.
key: D
explanation: Section §475.42(d)2 specifically defines a violation as failing to deposit money in an
  escrow account when the licensee is the purchaser under a contract that requires the purchaser to
  place deposit money in escrow. The other options describe violations covered by different
  subsections, such as failure to deliver escrowed property (§475.42(d)1) or false advertising
  (§475.42(c)).
