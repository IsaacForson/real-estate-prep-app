stem: Under section 475.701, Florida Statutes, who is the 'closing agent' in a commercial real
  estate transaction?
options:
  - The person who negotiates the purchase price on behalf of the buyer
  - The person who lists the commercial property for sale with a brokerage
  - The person who receives funds and documents for closing disbursement
  - The person who appraises the commercial property before the sale closes
key: C
explanation: Section 475.701, Florida Statutes, defines the closing agent as the person who receives
  the documents and funds and handles their recording and disbursement when a commercial real estate
  transaction closes.
