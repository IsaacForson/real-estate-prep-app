stem: A property management firm pays a tenant $75 for referring a new lessee to an apartment unit.
  Under Florida Statute 475.01(13), is this payment permissible?
options:
  - Not permissible because the fee exceeds $50 per transaction
  - Permissible because the firm disclosed the payment to the tenant in writing
  - Permissible because the tenant is unlicensed and the fee was agreed upon
  - Not permissible because the statute limits payments to apartment owners
key: A
explanation: The statute permits a finder’s fee or referral fee only if its value does not exceed
  $50 per transaction. Paying $75 violates this limit, making the payment impermissible. The option
  stating that the payment is permissible because the tenant is unlicensed and the fee was agreed
  upon incorrectly focuses on the tenant’s unlicensed status, but the fee amount restriction applies
  regardless of the tenant’s licensure.
