stem: What must a licensee do when there are conflicting demands for escrowed property?
options:
  - The licensee must notify the commission and request an escrow disbursement order determining who
    is entitled to the escrowed property.
  - The licensee must immediately disburse the escrowed property to the party that first demanded it.
  - The licensee must wait thirty days before taking any action regarding the escrowed property.
  - The licensee must file a civil lawsuit in circuit court without first notifying the commission.
key: A
explanation: Under §475.42(d)1, when there are conflicting demands for escrowed property, the
  licensee must promptly notify the commission and request an escrow disbursement order determining
  who is entitled to the property. The other options describe actions that are not permitted without
  first following the required procedures, such as immediate disbursement or waiting arbitrarily.
