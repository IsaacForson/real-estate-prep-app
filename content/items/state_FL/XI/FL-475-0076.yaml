stem: Under the Commercial Real Estate Sales Commission Lien Act, how does section 475.701, F.S.,
  define a "brokerage agreement"?
options:
  - A written contract obligating an owner to pay a broker's fee
  - An oral understanding that a broker will locate a buyer for a fee
  - A recorded deed naming the broker as a party to the closing
  - A verbal referral arrangement between two cooperating brokers
key: A
explanation: Section 475.701 defines a brokerage agreement as a written contract between an owner of
  commercial real estate and a broker obligating the owner to pay a commission for licensed services
  relating to the sale or disposition of the property.
citation:
  source: Fla. Stat. § 475.701
  url: null
  quoted_text: “Brokerage agreement” means a written contract entered into on or after the effective
    date of this act between an owner of commercial real estate and a broker that obligates the
    owner to pay a commission to the broker for licensed services provided by the broker relating to
    the sale or disposition of the commercial real estate as specified in the contract.
