stem: How many classroom hours of continuing education may be substituted by attending one legal
  agenda session of the Florida Real Estate Commission, one time per renewal cycle, under Florida
  law?
options:
  - Nine classroom hours
  - Twelve classroom hours
  - Three classroom hours
  - Six classroom hours
key: C
explanation: The statute states that the commission may accept as a substitute for 3 classroom
  hours, one time per renewal cycle, attendance at one legal agenda session of the commission.
  Therefore, three classroom hours is the correct substitution amount. The distractor of six
  classroom hours incorrectly doubles the allowable substitution, which is not supported by the
  rule.
