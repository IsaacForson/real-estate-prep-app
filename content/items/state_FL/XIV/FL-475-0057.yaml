explanation: For involuntary inactivity exceeding 12 months but less than 24 months, the statute
  mandates 28 hours of commission‑prescribed education to reactivate. The 14‑hour option applies
  only to inactivity of 12 months or less, while 21 and 35 hours are not specified in the rule.
