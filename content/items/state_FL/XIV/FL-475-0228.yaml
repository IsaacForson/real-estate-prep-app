stem: Which of the following may be considered a deposit under Florida Administrative Code 61J2-14.008?
options:
  - Only cash or currency, excluding securities
  - Cash, currency, or securities convertible to money
  - Personal funds of the licensee in an escrow account
  - Funds held in a title company escrow account only
key: B
explanation: Under Fla. Admin. Code § 61J2-14.008(1)(b), a deposit includes any medium of exchange
  or securities convertible to money, not limited to cash. Personal funds cannot be commingled
  except as allowed, and deposits are not restricted to title company accounts.
citation:
  source: Fla. Admin. Code § 61J2-14.008(1)(b)
  url: null
  quoted_text: (b) A deposit, as so defined, shall extend to and include not only cash, or currency,
    but any medium of exchange, or any securities to be converted into money, delivered for any of
    the purposes aforesaid, to be held or converted into cash or bank credits.
