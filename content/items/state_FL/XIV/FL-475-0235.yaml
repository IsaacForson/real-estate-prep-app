stem: A licensee’s license has been involuntarily inactive for 6 months. How many hours of
  commission‑prescribed continuing education must be completed to reactivate the license?
options:
  - 7 hours
  - 0 hours
  - 14 hours
  - 28 hours
key: C
explanation: Fla. Stat. § 475.183(2)(a) states that a licensee may reactivate a license inactive for
  12 months or less by completing at least 14 hours of commission‑prescribed continuing education.
  Since six months is within the 12‑month limit, the required hours are fourteen. The
  twenty‑eight‑hour option applies only when inactivity exceeds twelve months but is less than
  twenty‑four months.
