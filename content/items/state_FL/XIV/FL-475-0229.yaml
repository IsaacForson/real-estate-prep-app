stem: A licensee has completed 10 classroom hours of continuing education this biennium and attends
  one legal agenda session of the Florida Real Estate Commission, having notified the division at
  least 7 days in advance and not being a party to a disciplinary action. How many additional
  classroom hours of continuing education are needed to meet the biennial requirement of 14
  classroom hours?
options:
  - 4 hours
  - 2 hours
  - 1 hour
  - 3 hours
key: C
explanation: Attendance at one legal agenda session counts as 3 classroom hours (475.182(1)(b)).
  Adding the 10 hours already completed gives 13 hours, leaving 1 hour needed to reach the 14‑hour
  requirement.
citation:
  source: Fla. Stat. § 475.182(1)(b)
  url: null
  quoted_text: The commission may accept as a substitute for 3 classroom hours, one time per renewal
    cycle, attendance at one legal agenda session of the commission.
