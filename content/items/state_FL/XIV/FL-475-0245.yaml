stem: A licensee completes a 7‑hour approved distance learning continuing education course. How many
  classroom hours of continuing education credit does this course satisfy toward the biennial
  requirement under Florida law?
options:
  - 5 hours
  - 7 hours
  - 3 hours
  - 10 hours
key: B
explanation: The statute allows the commission to accept, on a classroom‑hour‑for‑classroom‑hour
  basis, any satisfactorily completed education course, including an approved distance learning
  course, as a substitute for required continuing education. Therefore, a 7‑hour distance learning
  course counts as 7 classroom hours.
