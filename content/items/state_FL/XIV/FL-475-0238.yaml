stem: If a license that has been involuntarily inactive for more than 2 years will expire on October
  1, 2025, on what date must the department give notice of expiration to the licensee?
options:
  - June 3, 2025
  - July 3, 2025
  - July 4, 2025
  - July 2, 2025
key: B
explanation: The rule requires the department to give notice ninety days prior to expiration of a
  license that will become null and void after more than two years of involuntary inactive status.
  Counting back ninety days from October 1, 2025 yields July 3, 2025. The distractor of July 4, 2025
  results from mistakenly subtracting only eighty‑nine days, which does not satisfy the ninety‑day
  requirement.
