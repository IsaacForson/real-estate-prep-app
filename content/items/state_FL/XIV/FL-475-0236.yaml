explanation: Fla. Stat. § 475.182(1)(a) requires active licensees to complete at least 14 classroom
  hours of 50 minutes each per biennium. Multiplying 14 hours by 50 minutes yields 700 minutes. The
  six‑hundred‑minute distractor mistakenly uses twelve hours, eight hundred uses sixteen hours, and
  five hundred uses ten hours.
