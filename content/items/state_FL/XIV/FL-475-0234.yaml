key: D
explanation: Under Fla. Stat. § 475.182(4), the department must mail the notice sixty days before
  the end of the license period and automatic reversion to inactive status. The thirty‑day option
  confuses this with other notice periods, while ninety days applies to the notice before expiration
  of an involuntarily inactive license.
