math:
  worked_solution: "Step 1: Identify the statutory limit: $50 per transaction. Step 2: Identify the
    fee paid: $75. Step 3: Compare fee to limit: $75 > $50. Step 4: Calculate excess: $75 - $50 =
    $25. Step 5: Because the fee exceeds the limit, the payment is not permissible."
