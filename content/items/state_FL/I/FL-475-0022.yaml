stem: A property management firm pays a tenant a referral fee of $75 for introducing a prospective
  lessee to an apartment unit. Under Florida Statute 475.01(13), is this payment permissible?
options:
  - The fee is permissible because it is less than $100
  - The fee is not permissible because it exceeds the $50 limit per transaction
  - The fee is permissible as long as the tenant is not advertised
  - The fee is not permissible because only owners may pay such fees
key: B
explanation: Florida Statute 475.01(13) allows a referral fee only if its value does not exceed $50
  per transaction. Paying $75 is $25 above that limit, so the payment is not allowed. The claim that
  the fee is permissible because it is under $100 misstates the statutory threshold.
