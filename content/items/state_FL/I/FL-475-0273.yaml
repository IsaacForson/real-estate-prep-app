stem: A broker assists both buyer and seller in a transaction without representing either in a
  fiduciary capacity and agrees not to favor one party over the other. This scenario describes which
  relationship under Florida Statute 475.01(l)?
options:
  - The relationship described is a broker associate.
  - The relationship described is a designated sales associate.
  - The relationship described is a single agent.
  - The relationship described is a transaction broker.
key: D
explanation: The definition of transaction broker covers limited representation of both parties
  without fiduciary duties and without representing either to the detriment of the other, matching
  the scenario. A single agent would represent only one party as a fiduciary, which is not the case
  here.
citation:
