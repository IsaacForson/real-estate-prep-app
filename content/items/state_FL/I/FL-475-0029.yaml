stem: A legislative proposal would permit unlicensed persons to collect referral fees for
  facilitating real estate transactions. Based on the purpose statement in Florida Statute 475.001,
  what is the primary reason the legislature would likely oppose this proposal?
options:
  - It would reduce state tax revenue by decreasing licensed broker fees.
  - It would undermine public welfare by allowing unregulated practice.
  - It would increase competition among brokers.
  - It would lower home prices, making properties affordable for buyers.
key: B
explanation: Section 475.001 states that the Legislature deems regulation necessary in the interest
  of the public welfare. Because the proposal would allow unlicensed individuals to earn referral
  fees, it would create unregulated practice and therefore undermine the public welfare the statute
  seeks to protect. The other choices focus on tax revenue, competition, or home prices, which are
  not addressed in the purpose clause.
