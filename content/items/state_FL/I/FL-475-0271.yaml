stem: According to Florida Statute 475.01(1)(a), which activity is expressly included in the
  definition of a broker?
options:
  - The broker advertises rental property information or lists to the public.
  - The broker manages properties for a salary without expecting any commission.
  - The broker acts as a trustee for a bank, trust company, or similar entity.
  - The broker provides legal advice on real estate contracts and closing documents.
key: A
explanation: Section 475.01(1)(a) defines a broker as any person who advertises rental property
  information or lists. The statement that the broker advertises rental property information or
  lists to the public therefore satisfies the statutory definition. The other statements describe
  activities—acting as a trustee for a bank or trust company, managing properties for a salary
  without expecting commission, and providing legal advice on contracts and closing documents—that
  are not included in the definition of broker under the statute.
