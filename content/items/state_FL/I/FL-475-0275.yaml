stem: At the end of her biennium, a Florida sales associate has completed only 13 classroom hours of
  continuing education. Under Florida Statute 475.182(1)(a), what is the correct status of her
  license renewal application?
options:
  - She may renew her license if she completes an additional 2 hours of continuing education before
    the renewal deadline.
  - She may not renew her license because she must complete 28 hours of continuing education for
    renewal.
  - She may renew her license because she has completed 13 hours of continuing education, which
    meets the requirement.
  - She may not renew her license because she has completed just 13 hours of continuing education,
    which is below the required 14 hours.
key: D
explanation: The rule requires at least 14 classroom hours of continuing education each biennium for
  renewal; 13 hours is insufficient, so the license may not be renewed. The distractor suggesting
  renewal after completing additional hours is incorrect because the biennium has already ended.
