stem: A homeowner decides to sell her house and hires a licensed broker to market the property,
  agreeing to pay a commission based on the sale price. Under Florida Statute 475.011(2), what is
  the effect on the exemption that allows an owner to sell their own property without a license?
options:
  - The exemption remains available because the owner is selling their own property.
  - The exemption is not available because the owner employed an agent paid a commission on a
    transactional basis.
  - The exemption is not available because the owner sold the property to a family member.
  - The exemption remains available because the broker is licensed.
key: B
explanation: Under 475.011(2), the exemption for owners selling their own property is lost when the
  owner employs an agent who is paid a commission or other compensation strictly on a transactional
  basis. Hiring a licensed broker and paying a commission based on the sale price therefore removes
  the exemption, which is exactly what the correct answer states. The answer that says the exemption
  remains available because the broker is licensed is incorrect; the statute’s focus is on the
  nature of the compensation, not on the broker’s licensure.
citation:
