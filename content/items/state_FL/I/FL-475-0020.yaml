  url: null
  quoted_text: this exemption shall not be available if and to the extent that an agent, employee, or
    independent contractor paid a commission or other compensation strictly on a transactional basis
    is employed to make sales, exchanges, or leases to or with customers in the ordinary course of
    an owner’s business of selling, exchanging, or leasing real property to the public.
