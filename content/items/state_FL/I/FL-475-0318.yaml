stem: According to Florida Statute 475.01(1)(a), which of the following activities is explicitly
  included in the definition of a broker?
options:
  - Engaging in the advertisement of rental property information
  - Engaging in the management of a homeowners association
  - Engaging in the construction of new residential buildings
  - Engaging in the provision of legal advice for real estate transactions
key: A
explanation: The definition of broker expressly includes all persons who advertise rental property
  information or lists. The distractor about appraisal is incorrect because, although appraisal is
  mentioned, the definition excludes appraisal services that must be performed only by
  state-licensed or state-certified appraisers.
