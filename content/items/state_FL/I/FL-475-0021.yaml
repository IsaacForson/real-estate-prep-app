stem: According to Florida Statute 475.02(1), how many members of the Florida Real Estate Commission
  must be licensed brokers who have held an active license for the 5 years preceding appointment?
options:
  - Five members
  - Two members
  - Three members
  - Four members
key: D
explanation: The statute explicitly requires four members to be licensed brokers with five years of
  active licensure. The option stating three members is incorrect because the law sets the minimum
  at four, not three.
