stem: "A hotel employee handles reservations and advertises the property for short‑term stays,
  receiving compensation for this work. Under Florida law, this individual is:"
options:
  - The individual is required to hold a real estate broker license.
  - The individual is required to hold a property management license.
  - The individual is exempt from real estate licensing requirements.
  - The individual is required to hold a real estate sales associate license.
key: C
explanation: The exemption in Fla. Stat. § 475.011(11) excludes any person who, for compensation,
  rents or advertises for rent for transient occupancy of a public lodging establishment licensed
  under chapter 509. Since the employee performs advertising for short‑term (transient) occupancy of
  a hotel, the exemption applies and no license is required. The distractor suggesting a sales
  associate license is incorrect because the statutory exemption expressly removes the licensing
  requirement for this activity.
