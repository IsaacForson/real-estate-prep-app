stem: "A leasing agent employed by an apartment owner works onsite and receives only salary, no
  commission. Under Florida Statute 475.011(4), this individual is:"
options:
  - A leasing agent employed by an apartment owner works onsite and receives only salary, no
    commission.
  - A leasing agent employed by an apartment owner works onsite and receives a commission per lease
    signed.
  - A leasing agent employed by a property management company works offsite and receives salary only.
  - A leasing agent employed by an apartment owner works onsite and receives both salary and bonus
    based on occupancy.
key: A
explanation: Under Fla. Stat. § 475.011(4), a salaried employee of an apartment community owner who
  works in an onsite rental office in a leasing capacity is exempt from licensing. An option stating
  that the leasing agent receives a commission per lease signed incorrectly adds a commission, which
  removes the exemption.
