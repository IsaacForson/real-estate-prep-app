stem: According to Florida Statute 475.01(1)(i), which of the following is **NOT** considered real
  property for licensing purposes?
options:
  - A cemetery lot.
  - A mineral right.
  - A subleasehold.
  - A leasehold interest.
key: A
explanation: The statute defines real property as any interest or estate in land and any interest in
  business enterprises or business opportunities, including leasehold, subleasehold, and mineral
  rights, but expressly excludes cemetery lots and rights of burial. Therefore, a cemetery lot is
  not real property under the license law. The other options are expressly included in the
  definition.
