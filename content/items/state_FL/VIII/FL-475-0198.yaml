stem: For an active Florida real estate licensee, how many classroom hours of continuing education
  must be completed each biennium to satisfy the renewal requirement under Florida Statute
  475.182(1)(a)?
options:
  - At least 14 classroom hours of 50 minutes each
  - At least 10 classroom hours of 50 minutes each
  - At least 20 classroom hours of 50 minutes each
  - At least 7 classroom hours of 50 minutes each
key: A
explanation: The statute requires active licensees to complete at least 14 classroom hours of 50
  minutes each during each biennium. The option stating 10 hours is insufficient because it falls
  below the mandated minimum.
