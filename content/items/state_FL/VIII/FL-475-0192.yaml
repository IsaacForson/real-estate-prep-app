  - 21 years of age
  - 18 years of age
  - 25 years of age
key: C
explanation: The statute explicitly states that an applicant who is a natural person must be at
  least 18 years of age. The distractor listing 21 years of age is incorrect because the law does
  not set the minimum age at 21; it fixes it at 18.
