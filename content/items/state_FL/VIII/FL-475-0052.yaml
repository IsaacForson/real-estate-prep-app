stem: Maria owns a timeshare week that she uses for her own vacation each year. She decides to sell
  that week to a friend. Under Florida Statute 475.011(8)(a), is Maria required to hold a real
  estate license to sell her timeshare week?
options:
  - No, because she received no compensation for the sale.
  - No, because she is an owner selling her own timeshare week for personal use prior to sale.
  - No, because the timeshare week was used for less than one year in her personal occupancy.
  - No, because she sold the week to a friend rather than to the public.
key: B
explanation: The exemption in 475.011(8)(a) applies to an owner of a timeshare period for personal
  use and occupancy who later offers that period for resale. Maria’s situation matches this
  description, so she is exempt from licensing. The other options introduce irrelevant factors—such
  as selling to a friend, lack of compensation, or duration of use—that are not part of the
  statutory exemption.
