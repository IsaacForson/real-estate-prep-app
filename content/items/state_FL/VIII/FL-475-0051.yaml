stem: According to Florida Statute 475.01(1)(a), a broker includes a person who undertakes to list
  or sell timeshare periods, **EXCEPT** as provided in which of the following?
options:
  - ss. 475.011 and 721.20.
  - ss. 475.015 and 721.25.
  - ss. 475.02 and 721.30.
  - ss. 475.03 and 721.35.
key: A
explanation: The statute defines a broker to include anyone who lists or sells timeshare periods,
  unless exempt under ss. 475.011 and 721.20. Therefore, the correct exception is ss. 475.011 and
  721.20. The other options list incorrect section numbers that do not appear in the statute. Those
  numbers correspond to unrelated provisions and thus are not the statutory exemption for timeshare
  activities.
citation:
  source: Fla. Stat. § 475.01(1)(a)
  url: null
  quoted_text: The term “broker” also includes any person or entity who undertakes to list or sell one
    or more timeshare periods per year in one or more timeshare plans on behalf of any number of
    persons, except as provided in ss. 475.011 and 721.20.
