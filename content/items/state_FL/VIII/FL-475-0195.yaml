stem: An exchange company facilitates timeshare exchanges for a fee but does not comply with the
  requirements of s. 721.18. Under Florida Statute 475.011(8)(b), is the exchange company exempt
  from the real estate license requirement?
options:
  - No, because the exemption applies only if the exchange company complies with s. 721.18.
  - Yes, because exchange companies are exempt from licensing.
  - No, because timeshare exchange activity requires a real estate license.
  - Yes, as long as it does not charge a fee for the exchange service.
key: A
explanation: The exemption for exchange companies under Fla. Stat. § 475.011(8)(b) applies only when
  the company is engaged in exchange program activities and complies with s. 721.18. Because the
  company does not meet that compliance condition, the exemption does not apply and a real estate
  license is required. Stating that exchange companies are always exempt is incorrect because the
  exemption is conditional. Claiming that any timeshare exchange activity requires a license is
  incorrect because the exemption exists when the company complies with s. 721.18. Saying that the
  exemption applies if no fee is charged is incorrect because the statute conditions the exemption
  on compliance with s. 721.18, not on the presence or absence of a fee.
