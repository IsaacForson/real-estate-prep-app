stem: A licensee assists a client in renting a mobile home lot in a mobile home park for a fee.
  Under Florida Statute 475.01(1)(i), does the licensee need a real estate license to perform this
  activity?
options:
  - Yes, because any rental activity for compensation requires a license.
  - No, because renting a mobile home lot is not considered real property under the statute.
  - Yes, unless the licensee is employed by the mobile home park.
  - No, only if the lot is rented for a period longer than one year.
key: B
explanation: The definition of real property explicitly excludes the renting of a mobile home lot or
  recreational vehicle lot in a mobile home park or travel park. Since the activity involves renting
  a mobile home lot, it is not considered real property and therefore does not require a real estate
  license.
