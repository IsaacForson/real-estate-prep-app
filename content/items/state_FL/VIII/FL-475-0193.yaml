stem: A limited liability company (LLC) wishes to act as a real estate broker in Florida. According
  to Florida Statute 475.15, what must the LLC do regarding the licensing of its members, officers,
  and directors?
options:
  - The LLC must register with the commission and renew the licenses of its members, officers, and
    directors each license period.
  - The LLC must register with the commission and ensure that only its general partners hold active
    broker licenses.
  - The LLC must register with the commission but is not required to have any licensed members,
    officers, or directors.
  - The LLC must register with the commission and ensure that at least one member holds an active
    broker license.
key: A
explanation: The statute requires any LLC acting as a broker to register with the commission and to
  renew the licenses or registrations of its members, officers, and directors for each license
  period. The distractor referencing only general partners applies solely to limited partnerships,
  not to an LLC.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) § 475.15
  url: null
  quoted_text: Each partnership, limited liability partnership, limited liability company, or
    corporation which acts as a broker shall register with the commission and shall renew the
    licenses or registrations of its members, officers, and directors for each license period.
