stem: A licensee meets a prospective buyer at an open house and begins showing the property. The
  buyer expresses interest in hiring the licensee as a single agent. According to Florida Statute
  475.278(3)(b)1, when must the licensee provide the single agent disclosure?
options:
  - The disclosure must be provided before entering into a listing agreement
  - The disclosure must be provided at the time of entering into a listing agreement
  - The disclosure must be provided before the showing of property
  - The disclosure must be provided after the showing but before any offer is made
key: C
explanation: Florida Statute 475.278(3)(b)1 requires that the single‑agent disclosure be given
  before, or at the time of, entering into a listing agreement or an agreement for representation,
  or before the showing of property, whichever occurs first. In this situation the showing occurs
  before any agreement, so the disclosure must be provided before the showing. Therefore the correct
  answer is the option stating that the disclosure must be provided before the showing of property.
