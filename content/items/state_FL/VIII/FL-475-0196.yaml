stem: A prospective sales associate completes a prelicensure course that totals 60 classroom hours
  of 50 minutes each, inclusive of examination. Does this satisfy the educational requirement for
  initial licensure as a sales associate under Florida Statute 475.17(2)(a)1?
options:
  - The course satisfies the requirement because it does not exceed the maximum of 63 classroom
    hours.
  - The course does not satisfy the requirement because it must be exactly 63 classroom hours.
  - The course satisfies the requirement because it meets the minimum of 60 classroom hours.
  - The course does not satisfy the requirement because it falls below the minimum of 60 classroom
    hours.
key: A
explanation: The statute sets a maximum of 63 classroom hours for sales associate prelicensure
  education; a 60‑hour course does not exceed that limit and therefore satisfies the requirement.
  The distractor asserting a minimum of 60 hours is incorrect because the law does not impose a
  minimum—it only caps the total at 63 hours.
