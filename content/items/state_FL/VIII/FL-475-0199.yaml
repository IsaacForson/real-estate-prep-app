stem: A Florida broker changes her principal office address on March 1. By what date must she notify
  the commission to avoid a violation under Florida Statute 475.23?
options:
  - By March 11
  - By March 10
  - By March 12
  - By March 9
key: A
explanation: The law requires notification no later than 10 days after the address change, which for
  a March 1 change is March 11. Notifying by March 10 would be only 9 days after the change,
  violating the deadline.
citation:
