stem: What is meant by the term 'finder's fee' or 'referral fee' in the context of apartment unit
  rentals?
options:
  - A fee paid to a licensed broker for introducing a buyer to a seller of real property in a
    typical sale transaction.
  - A referral payment made to a property management firm for each lease renewal secured with an
    existing tenant in an apartment complex.
  - A fee paid, credit toward rent, or other thing of value given to a person for introducing
    parties to an apartment unit rental or lease transaction.
  - A commission paid to an unlicensed tenant for advertising a vacant apartment unit on online
    platforms to attract prospective lessees.
key: C
explanation: Under Florida Statute 475.011(13), a finder’s fee or referral fee is defined as a fee
  paid, credit toward rent, or other thing of value given to a person for introducing parties to an
  apartment unit rental or lease transaction. The option stating 'A fee paid, credit toward rent, or
  other thing of value given to a person for introducing parties to an apartment unit rental or
  lease transaction' matches this definition exactly. The option stating 'A fee paid to a licensed
  broker for introducing a buyer to a seller of real property in a typical sale transaction'
  incorrectly describes a fee for a licensed broker in a real property sale, which is not the
  definition provided in subsection (13).
citation:
  source: Fla. Stat. § 475.011(13)
  url: null
  quoted_text: For purposes of this subsection, “finder’s fee” or “referral fee” means a fee paid,
    credit towards rent, or some other thing of value provided to a person for introducing or
    arranging an introduction between parties to a transaction involving the rental or lease of an
    apartment unit.
