stem: A sales associate currently employed by Broker A receives an offer to also work as an
  independent contractor for Broker B on weekends, while maintaining her employment with Broker A.
  Is this permissible under Florida law?
options:
  - Yes, as long as she works fewer than 20 hours for Broker B
  - No, because a sales associate may have only one registered employer
  - Yes, if she obtains written consent from both brokers
  - No, unless she first transfers her license to Broker B
key: B
explanation: Florida law prohibits a sales associate from having more than one registered employer
  at any time. Therefore, accepting the additional work would violate the one‑employer rule. The
  suggestion that limited hours or broker consent overrides this restriction is incorrect because
  the statute makes no exception for part‑time work or mutual agreement.
