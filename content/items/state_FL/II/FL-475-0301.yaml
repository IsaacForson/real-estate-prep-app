stem: Maria has held an active real estate sales associate license for 24 months during the
  preceding 5 years while employed by a county housing agency, performing duties authorized for real
  estate licensees. She has also completed the required sales associate postlicensure education.
  Under Florida Statute 475.17, is Maria eligible to apply for a broker license?
options:
  - No, she must finish broker postlicensure education.
  - Yes, she meets the experience requirement.
  - No, she needs an out-of-state broker license.
  - No, she must have broker-office experience.
key: B
explanation: Subsection (2)(b)2 qualifies a sales associate who has held a current and valid license
  for at least 24 months in the preceding five years while employed by a governmental agency.
  Subsection (d) further requires completion of any mandated postlicensure education, which Maria
  has satisfied. The other options incorrectly impose broker‑office experience, an out‑of‑state
  broker license, or broker‑level postlicensure education that are not required for eligibility.
