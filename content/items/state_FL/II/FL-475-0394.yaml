  - April 12
  - April 13
key: D
explanation: Under Florida Statute 475.717, notice delivered by mail is effective three days after
  it is deposited in the mail. A notice mailed on April 10 therefore becomes effective on April 13.
  The option that says April 12 is incorrect because it reflects only a two‑day period, which does
  not meet the statutory requirement.
