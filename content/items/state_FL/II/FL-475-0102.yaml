stem: Broker X’s license is suspended by an order of the Florida Real Estate Commission. According
  to Florida Statute 475.31(1), what is the effect on the licenses of sales associates registered
  with Broker X?
options:
  - The licenses of the sales associates become involuntarily inactive during the broker's suspension
  - The licenses of the sales associates remain active unless the sales associate also violates the
    law
  - The licenses of the sales associates are automatically revoked by the commission
  - The licenses of the sales associates must be renewed within thirty days to stay active
key: A
explanation: The statute provides that an order suspending a broker’s license automatically causes
  the licenses of all sales associates registered with that broker to become involuntarily inactive
  while the broker’s license is inoperative. Therefore, the associates’ licenses are placed in
  involuntarily inactive status. The distractor suggesting the licenses remain active is incorrect
  because the statute imposes automatic inactivity regardless of the associates’ conduct.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) § 475.31(1)
  url: null
  quoted_text: An order revoking or suspending the license of a broker shall automatically cause the
    licenses of all sales associates and broker associates registered with the broker, and, if a
    partnership or corporation, of all members, officers, and directors thereof to become
    involuntarily inactive, while the license of the broker is inoperative or until new employment
    or connection is secured.
