stem: An unlicensed individual submits a notice to the Florida Real Estate Commission that contains
  a material misstatement about a real estate transaction. Under Florida Statute 475.486(2), how is
  this conduct classified?
options:
  - It is classified as a felony of the third degree offense
  - It is classified as a civil infraction under Florida law offense
  - It is classified as a misdemeanor of the second degree offense
  - It is classified as a having no penalty under the statute offense
key: C
explanation: The law defines the filing of a false or materially misleading statement with the
  commission as a misdemeanor of the second degree, not as a felony, civil infraction, or
  penalty‑free act. The felony option is incorrect because the statute limits the offense to a
  misdemeanor.
