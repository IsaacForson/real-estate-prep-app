stem: Under Florida Statute 475.5015, what is the minimum period a broker must preserve records of a
  real estate brokerage business?
options:
  - One year period
  - Three year period
  - Five year period
  - Ten year period
key: C
explanation: The statute requires brokers to keep at least one legible copy of all books, accounts,
  and records for at least five years from the date of receipt of funds or, if no funds are
  received, from the date of execution of any agreement engaging the broker’s services. This
  establishes a five‑year minimum retention period. The distractor “Three year period” understates
  the required duration.
