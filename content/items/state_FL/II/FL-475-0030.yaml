stem: The Florida Real Estate Commission wishes to hire an independent attorney to advise on a
  disciplinary matter but has not obtained the Attorney General’s prior approval. Under Florida
  Statute 475.03, is this action permissible?
options:
  - The action is not permissible because prior approval of the Attorney General is required
  - The action is permissible if the attorney is also a commission member
  - The action is not permissible because the commission may only delegate disciplinary powers
  - The action is permissible because the commission may retain counsel for any matter
key: A
explanation: The statute requires prior approval of the Attorney General before the commission may
  retain independent legal counsel. Without this approval, the action is not permissible. The
  distractor suggesting permissibility if the attorney is a commission member is incorrect because
  the approval requirement still applies.
