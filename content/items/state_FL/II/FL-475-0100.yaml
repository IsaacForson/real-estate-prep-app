stem: Under Florida Statute 475.41, what must be true for a contract for a commission or
  compensation for an act enumerated in s. 475.01(3) to be valid?
options:
  - The broker or sales associate is employed by a corporation registered with the commission
  - The broker or sales associate has disclosed all material aspects of the agreement to the client
  - The broker or sales associate holds a valid and current active license at the time the act or
    service was performed
  - The broker or sales associate has completed the required postlicensure education
key: C
explanation: The statute states that a contract for commission is valid only if the broker or sales
  associate has complied with the chapter regarding issuance and renewal of the license at the time
  the act or service was performed. Therefore, holding a valid and current active license at that
  time is required. The distractor about postlicensure education is incorrect because the statute
  does not mention education as a condition for contract validity.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) § 475.41
  url: null
  quoted_text: No contract for a commission or compensation for any act or service enumerated in s.
    475.01(3) is valid unless the broker or sales associate has complied with this chapter in regard
    to issuance and renewal of the license at the time the act or service was performed.
