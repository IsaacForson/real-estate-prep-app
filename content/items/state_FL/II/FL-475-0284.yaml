stem: Under Florida Statute 475.182(1)(a), what must a licensee do to renew an active broker, broker
  associate, or sales associate license?
options:
  - Complete at least 7 classroom hours of continuing education each biennium.
  - Complete at least 14 classroom hours of continuing education each biennium.
  - Complete at least 21 classroom hours of continuing education each biennium.
  - Complete at least 28 classroom hours of continuing education each biennium.
key: B
explanation: The statute requires proof of at least 14 classroom hours of 50‑minute continuing
  education completed during each biennium for active license renewal. The other options specify
  hour totals of 7, 21, and 28 classroom hours, which are not required by the law.
citation:
  source: Fla. Stat. § 475.182(1)(a)
  url: null
  quoted_text: The renewal application for an active license as broker, broker associate, or sales
    associate shall include proof satisfactory to the commission that the licensee has, since the
    issuance or renewal of her or his current license, satisfactorily completed at least 14
    classroom hours of 50 minutes each of a continuing education course during each biennium of a
    license period, as prescribed by the commission.
