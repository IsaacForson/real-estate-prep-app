stem: A closing agent has held disputed reserved proceeds for 6 days after closing without agreement
  between the owner and broker. According to Florida Statute 475.709(12), what is the closing
  agent's obligation regarding continued service as an escrow agent?
options:
  - Is required to continue serving as escrow agent
  - Is permitted to release proceeds to broker immediately
  - Is not required to continue serving as escrow agent
  - Is required to file an interpleader action immediately
key: C
explanation: The statute prohibits requiring a closing agent to serve involuntarily more than five
  days; after six days, continued involuntary service is not required.
citation:
  source: Fla. Stat. § 475.709(12)
  url: null
  quoted_text: No provision of this part shall require a closing agent to serve involuntarily more
    than 5 days after a closing as an escrow agent or stakeholder for any moneys or other property
    that are disputed by the owner and the broker under the provisions of this part.
