stem: An owner of a personal residence decides to sell the home and enters into a listing agreement
  with a licensed broker, agreeing to pay a commission upon sale. Under Florida Statute 475.011(2),
  is the owner exempt from the licensing requirement for this transaction?
options:
  - C. Yes, because any owner selling their own real property is exempt regardless of broker
    involvement.
  - D. No, because the exemption only applies when the owner sells the property without any
    professional assistance.
  - A. Yes, because the owner is not engaged in the ordinary course of a business of selling real
    property to the public.
  - B. No, because the owner employed a broker who is paid a commission on a transactional basis.
key: C
explanation: Under Florida Statute 475.011(2), an owner who sells their own real property is exempt
  from the licensing requirement, but this exemption does not apply if an agent paid a commission is
  employed in the ordinary course of the owner’s business of selling real property to the public.
  Because selling a personal residence is not the owner’s ordinary business, the exemption remains
  valid. The claim that hiring a broker who receives a commission automatically removes the
  exemption is incorrect.
citation:
  source: "### Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) — official Online Sunshine page,
