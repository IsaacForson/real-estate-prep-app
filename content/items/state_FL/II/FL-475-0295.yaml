    Stat. § 475.011(2)"
  url: null
  quoted_text: Any individual, corporation, partnership, trust, joint venture, or other entity which
    sells, exchanges, or leases its own real property; however, this exemption shall not be
    available if and to the extent that an agent, employee, or independent contractor paid a
    commission or other compensation strictly on a transactional basis is employed to make sales,
    exchanges, or leases to or with customers in the ordinary course of an owner’s business of
    selling, exchanging, or leasing real property to the public.
