stem: A member of the Florida Real Estate Commission attempts to delegate the commission's authority
  to adopt new rules to another member. Under Florida Statute 475.03, is this action permissible?
options:
  - No, because the power to adopt rules may not be delegated
  - Yes, because any duty or power may be delegated by resolution
  - No, unless the Attorney General gives prior approval for the delegation
  - Yes, but only if the chair approves the delegation
key: A
explanation: The statute provides that any duties and powers of the commission may be delegated
  except disciplinary powers and the power to adopt rules. Therefore delegating rule‑making
  authority is not allowed. The distractor suggesting delegation is permitted with chair approval
  misstates the exception.
