stem: A corporation that acts as a broker in Florida has three members who are all licensed brokers.
  If one member’s broker license lapses and is **not** renewed, what is the effect on the
  corporation’s registration under Florida Statute 475.15?
options:
  - Under Florida Statute 475.15, the corporation’s registration in this state is canceled
    automatically
  - Under Florida Statute 475.15, the corporation’s registration in this state remains active
    despite lapse
  - Under Florida Statute 475.15, the corporation’s registration in this state must be reinstated in
    30 days
  - Under Florida Statute 475.15, the corporation’s registration in this state may continue
    operating under temporary broker
key: A
explanation: Under Florida Statute 475.15, if the license or registration of at least one active
  broker member is not in force, the registration of a corporation, LLC, LLP, or partnership is
  canceled automatically during that period. Therefore, the lapse of one member’s license results in
  automatic cancellation of the corporation’s registration. The other options are incorrect because
  the registration does not remain active, does not require reinstatement within 30 days, and cannot
  continue operating under a temporary broker.
