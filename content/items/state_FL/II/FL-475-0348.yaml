stem: An individual operates as an appraisal management company in Florida without holding a valid
  registration. According to Florida Statute 475.626(1)(a) and (2), what is the classification of
  this violation?
options:
  - A misdemeanor of the second degree
  - A misdemeanor of the first degree
  - A felony of the third degree
  - A civil offense punishable by fine
key: A
explanation: Subsection (1)(a) prohibits operating as an appraisal management company without a
  valid registration, and subsection (2) declares that any person who violates a provision of
  subsection (1) commits a misdemeanor of the second degree. Thus the violation is classified as a
  misdemeanor of the second degree. The other options either overstate the penalty or understate it.
