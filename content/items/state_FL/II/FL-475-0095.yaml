stem: A salaried employee of an apartment community works in the onsite rental office, showing units
  to prospective tenants, preparing lease agreements, and collecting rent. Under Florida Statute
  475.011, is the employee required to hold a real estate license?
options:
  - The employee must hold a real estate license because she is performing leasing activities.
    Additionally, any person who drafts lease agreements for compensation must be licensed.
  - The employee must hold a license only if she receives a commission for each lease signed, even
    though the law does not require a commission‑based threshold for licensing.
  - The employee is exempt only if she works for a broker rather than the apartment owner, which the
    statute does not limit to broker affiliation.
  - The employee is exempt from licensing requirements because she is a salaried employee working in
    an onsite rental office of an apartment community in a leasing capacity.
key: D
explanation: Florida Statute § 475.011(4) provides an exemption for any salaried employee of an
  apartment‑community owner or of a registered broker for the owner who works in an onsite rental
  office in a leasing capacity. Because the employee described is salaried and performs leasing
  duties in the onsite office, the exemption applies and a license is not required. The statement
  that a license is required because the employee performs leasing activities is incorrect, as is
  the suggestion that a commission or broker affiliation determines the licensing requirement.
