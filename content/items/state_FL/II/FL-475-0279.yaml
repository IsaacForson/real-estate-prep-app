stem: A sales associate employed by a broker wants to list a timeshare week for resale that she owns
  personally. Under Florida Statute 475.011, is she exempt from licensure for this activity?
options:
  - Yes, because owners of timeshare periods may resell their own periods without a license.
  - No, because the exemption applies only to owners who are not real estate licensees.
  - Yes, but only if she does not receive any compensation for the resale.
  - No, because she is acting as a sales associate and must be licensed regardless of ownership.
key: A
explanation: The exemption in 475.011(8)(a) allows an owner of a timeshare period to resell their
  own period without licensure, regardless of their license status. The other options incorrectly
  impose limitations not present in the statute.
