stem: Under Florida Statute 475.161, how must a license be issued to a broker associate or sales
  associate who is licensed as a professional corporation?
options:
  - In the licensee’s legal name only, with the entity designation included
  - In the licensee’s legal name only, without the entity designation
  - In the licensee’s legal name only, with the entity designation optional
  - In the licensee’s legal name only, with the entity designation omitted
key: A
explanation: The statute requires that a license be issued in the licensee’s legal name only and,
  when appropriate, include the entity designation. Therefore, for a professional corporation, the
  license must show the individual's legal name along with the corporate designation. The other
  options either omit the designation, make it optional, or remove it entirely, which contradicts
  the rule.
