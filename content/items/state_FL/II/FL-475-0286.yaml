stem: A sales associate employed by a broker changes employers. According to Florida Statute 475.23,
  within how many days must the licensee notify the commission of the change?
options:
  - Notify the commission within 5 days of the change.
  - Notify the commission within 10 days of the change.
  - Notify the commission within 15 days of the change.
  - Notify the commission within 20 days of the change.
key: B
explanation: Florida Statute 475.23 requires the licensee to notify the commission no later than 10
  days after changing employers. The other options specify intervals that are either too short or
  too long compared to the statutory requirement.
citation:
  source: Fla. Stat. § 475.23
  url: null
  quoted_text: The licensee shall notify the commission of the change no later than 10 days after the
    change, on a form provided by the commission.
