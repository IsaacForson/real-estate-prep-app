stem: A closing agent has received $2,500 in disputed reserved proceeds from a commercial real
  estate transaction. The closing agent incurred $120 in attorney fees to commence an interpleader
  action, $30 to record the required affidavit, and $15 in clerk of court service charges. According
  to Florida Statute 475.711(2), what is the net amount of disputed reserved proceeds that the
  closing agent must deposit into the court registry?
options:
  - $2,350
  - $2,380
  - $2,365
  - $2,335
key: D
explanation: "The net amount is the disputed proceeds minus attorney fees, recording costs, and
  clerk charges: $2,500 - ($120 + $30 + $15) = $2,335."
citation:
  source: Fla. Stat. § 475.711(2)
  url: null
  quoted_text: "The closing agent shall determine the net amount of disputed reserved proceeds
    deposited in the court registry by deducting from the disputed reserved proceeds:"
