math:
  worked_solution: Start with $2,500 disputed reserved proceeds. Subtract attorney fees $120,
    recording costs $30, and clerk service charges $15. Total deductions = $120 + $30 + $15 = $165.
    Net amount = $2,500 - $165 = $2,335.
  formulas:
    - Net = Disputed - (AttorneyFees + RecordingCosts + ClerkCharges)
