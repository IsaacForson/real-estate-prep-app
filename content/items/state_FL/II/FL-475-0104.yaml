stem: A broker who never receives any money, deposit, or check from clients but signs a listing
  agreement with a seller on January 1, 2024, must preserve records related to that agreement until
  at **LEAST** what date?
options:
  - January 1, 2026
  - January 1, 2027
  - January 1, 2029
  - January 1, 2030
key: C
explanation: When no funds are entrusted to the broker, the retention period begins on the date of
  execution of any agreement that engages the broker’s services and lasts for at least five years.
  Adding five years to January 1, 2024 yields January 1, 2029. The distractor “January 1, 2026”
  incorrectly assumes a three‑year period.
