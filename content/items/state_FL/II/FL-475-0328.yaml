stem: An applicant submits a real estate license application on March 15, 2024, but does not pass
  the required examination. According to Florida Statute 475.181(2), when does the application
  expire?
options:
  - The application expires on March 15, 2025, and cannot be renewed.
  - The application stays valid until the applicant passes the exam.
  - The application expires on March 15, 2026, and cannot be renewed.
  - The application expires six months after the date received, per statute.
key: C
explanation: The statute provides that an application expires two years after the date received if
  the applicant does not pass the appropriate examination. Therefore, an application received on
  March 15, 2024, expires on March 15, 2026. The distractor stating a one‑year expiration misstates
  the statutory period.
