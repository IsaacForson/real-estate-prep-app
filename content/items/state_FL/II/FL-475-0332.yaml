stem: What is the minimum passing grade required on the Commission-prescribed end-of-course
  examination for pre‑licensing courses under Fla. Admin. Code ch. 61J2 § 61J2-3.008(4)(a)?
options:
  - D. A grade of 80% or higher.
  - B. A grade of 70% or higher.
  - A. A grade of 65% or higher.
  - C. A grade of 75% or higher.
