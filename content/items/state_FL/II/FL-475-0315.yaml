stem: Under Florida Statute 475.01(13), what is the maximum amount of a finder’s fee that may be
  paid to an unlicensed tenant per transaction?
options:
  - The fee must not exceed $25 per transaction
  - The fee must not exceed $50 per transaction
  - The fee must not exceed $75 per transaction
  - The fee must not exceed $100 per transaction
key: B
