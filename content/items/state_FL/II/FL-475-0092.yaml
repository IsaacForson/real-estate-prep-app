stem: According to Florida Statute 475.02, what age requirement applies to the Florida Real Estate
  Commission?
options:
  - The commission must have at least three members who are 60 years of age or older.
  - The commission must have at least two members who are 60 years of age or older.
  - The commission must have exactly one member who is 60 years of age or older.
  - The commission must have at least one member who is 60 years of age or older.
key: D
explanation: Florida Statute 475.02 requires that at least one member of the Florida Real Estate
  Commission be 60 years of age or older. The option stating that exactly one member must be 60
  years of age or older is incorrect because the rule sets a minimum, not an exact number. The
  options stating that at least two members or at least three members must be 60 or older are also
  incorrect because they impose a higher minimum than the statute requires.
