stem: Under Florida Statute 475.161, how must a license be issued for a broker associate or sales
  associate who operates as a professional corporation?
options:
  - In the licensee’s legal name only, without any entity designation.
  - In the licensee’s legal name only, and when appropriate, include the entity designation.
  - In the trade name of the professional corporation, with no personal name required.
  - In the licensee’s legal name only, but the entity designation is optional only for brokers.
key: B
explanation: The statute requires that a license be issued in the licensee’s legal name only and,
  when appropriate, shall include the entity designation. Therefore, a professional corporation
  license must show the individual's legal name plus the corporate designation. The other options
  either omit the entity designation when required, allow a trade name only, or incorrectly limit
  the entity designation to brokers only.
