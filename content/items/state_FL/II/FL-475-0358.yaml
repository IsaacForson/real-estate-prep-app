stem: A broker’s assistant knowingly files a false statement with the Florida Real Estate Commission
  regarding a client’s transaction. According to Florida Statute 475.486(2), what is the legal
  classification of the assistant’s conduct?
options:
  - It is classified as a having no penalty under the statute offense
  - It is classified as a civil infraction under Florida law offense
  - It is classified as a misdemeanor of the second degree offense
  - It is classified as a felony of the third degree offense
key: C
explanation: The statute classifies the filing of a false or materially misleading statement with
  the commission as a misdemeanor of the second degree. The option labeling the conduct as a felony
  of the third degree is inaccurate because the law does not elevate this violation to a felony.
