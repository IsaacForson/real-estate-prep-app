stem: A limited partnership acting as a broker in Florida has two general partners and three limited
  partners. Under Florida Statute 475.15, which individuals must be licensed brokers?
options:
  - Only the general partners must be licensed brokers.
  - Only the limited partners must be licensed brokers.
  - Only the officers and directors must be licensed brokers.
  - Only the members must be licensed brokers.
key: A
explanation: The statute provides that for a limited partnership, only the general partners must be
  licensed brokers or brokerage corporations registered under this part. Limited partners, officers,
  directors, or members are not subject to this requirement unless they serve as general partners.
  Therefore, only the two general partners need licensure.
