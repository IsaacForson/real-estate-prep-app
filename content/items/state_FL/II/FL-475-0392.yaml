stem: According to Florida Statute 475.709(7), if the owner and broker are unable to agree in
  writing regarding the release of a purchase-money note, within how many days after closing must
  the closing agent interplead the note?
options:
  - The closing agent must interplead the note within 7 days after closing.
  - The closing agent must interplead the note within 5 days after closing.
  - The closing agent must interplead the note within 10 days after closing.
  - The closing agent must interplead the note within 3 days after closing.
key: B
explanation: The statute states that if the owner and broker cannot agree within 5 days after
  closing regarding the release of the purchase-money note, the closing agent shall interplead the
  note. Therefore, the 5‑day period triggers the interpleader requirement. A 3‑day period is
  incorrect because the law specifies 5 days, not a shorter interval.
