    475.25(1)(d)1
  url: null
  quoted_text: If the buyer of a residential condominium unit delivers to a licensee written notice of
    the buyer’s intent to cancel the contract for sale and purchase, as authorized by s. 718.503, or
    if the buyer of real property in good faith fails to satisfy the terms in the financing clause
    of a contract for sale and purchase, the licensee may return the escrowed property to the
    purchaser without notifying the commission or initiating any of the procedures listed in
    sub-subparagraphs a.-d.
