stem: A licensee receives written notice from a buyer of a residential condominium unit stating the
  buyer’s intent to cancel the contract for sale and purchase, as authorized by s. 718.503. The
  licensee returns the escrowed deposit to the buyer without notifying the commission. Is this
  action permissible under Florida Statute 475.25(1)(d)1?
options:
  - No, the licensee must notify the commission before returning escrow funds.
  - B. Yes, because the exemption allows return without commission notification.
  - Yes, but only if the buyer also provides a signed release.
  - No, the licensee must first seek arbitration before taking any further action.
key: B
explanation: Under Florida Statute 475.25(1)(d)1, a licensee may return escrowed property to a
  purchaser without notifying the commission when the buyer delivers written notice of intent to
  cancel the contract under s. 718.503.
citation:
