stem: According to Florida Statute 475.01, what is a broker associate?
options:
  - A person who is qualified to be issued a license as a broker but who operates as a sales
    associate in the employ of another.
  - A person who performs any act specified in the definition of "broker," but who performs such act
    under the direction, control, or management of another person.
  - A broker who represents, as a fiduciary, either the buyer or seller but not both in the same
    transaction.
  - A broker who provides limited representation to a buyer, a seller, or both, in a real estate
    transaction, but does not represent either in a fiduciary capacity or as a single agent.
key: A
explanation: The statute defines a broker associate as a person qualified for a broker license who
  works as a sales associate for another. The other options describe a sales associate, single
  agent, and transaction broker, respectively.
