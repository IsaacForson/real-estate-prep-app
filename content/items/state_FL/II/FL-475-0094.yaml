stem: The Division of Real Estate receives fees collected by the Florida Real Estate Commission.
  According to Florida Statute 475.021, how may these funds be used?
options:
  - The funds may be used to fund real estate regulation.
  - The funds may be used to cover office expenses.
  - The funds may be used to pay employee salaries.
  - The funds may be used to finance marketing initiatives.
key: A
explanation: The statute requires that funds collected by the commission be used only to fund real
  estate regulation. Using the funds for other department purposes, returning them to licensees, or
  investing them is not permitted under this provision.
citation:
  source: "### Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) — official Online Sunshine page,
    read via Internet Archive capture because leg.state.fl.us/flsenate.gov refused connections §
    475.021"
  url: null
  quoted_text: The Division of Real Estate shall be funded by fees and assessments of the commission,
    and funds collected by the commission shall be used only to fund real estate regulation.
