  url: null
  quoted_text: The commission may prescribe a postlicensure education requirement in order for a
    person to maintain a valid sales associate’s license, which shall not exceed 45 classroom hours
    of 50 minutes each, inclusive of examination, prior to the first renewal following initial
    licensure.
