stem: What is the maximum number of classroom hours required for the sales associate postlicensure
  education under Florida Statute 475.17(3)(a)?
options:
  - 63 classroom hours of 50 minutes each
  - 72 classroom hours of 50 minutes each
  - 45 classroom hours of 50 minutes each
  - 60 classroom hours of 50 minutes each
key: C
explanation: The statute states that the sales associate postlicensure requirement shall not exceed
  45 classroom hours of 50 minutes each, inclusive of examination. The 60‑hour figure applies to
  broker postlicensure, while 63 and 72 hours relate to prelicensure requirements for sales
  associates and brokers respectively.
