stem: A sales associate misses the scheduled end-of-course examination due to illness and arranges a
  make‑up examination 45 days after the original exam date without obtaining Commission approval.
  Under Fla. Admin. Code ch. 61J2 § 61J2-3.008(7), is this permissible?
options:
  - A. Yes, because the make‑up occurs within the one‑year retest window.
  - B. No, because the make‑up exceeds the 30‑day limit without Commission approval.
  - C. Yes, because the student provided a doctor’s note.
  - D. No, because the make‑up must be scheduled before the original exam date.
key: B
explanation: The rule limits make‑up sessions to no more than 30 days beyond the scheduled
  examination unless the Commission grants approval; a 45‑day delay without approval therefore
  violates the rule. The other options misstate the applicable limits or requirements.
