stem: Jane, who does not hold a real estate license, shows a property to a prospective buyer and
  negotiates a purchase price in expectation of a commission. According to Florida Statute
  475.42(1)(a), what is the legal classification of Jane's conduct?
options:
  - a felony of the third degree punishable under state law
  - a misdemeanor of the second degree punishable under state law
  - a civil fine not exceeding five thousand dollars under state law
  - an administrative sanction requiring continuing education under state law
key: A
explanation: The statute provides that any person who operates as a broker or sales associate
  without a valid and current active license commits a felony of the third degree. Jane’s actions
  constitute unlicensed brokerage activity, so the offense is classified as a felony of the third
  degree. The distractor about a misdemeanor is incorrect because the statute specifies a felony for
  this violation, not a misdemeanor.
