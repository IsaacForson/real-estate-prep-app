stem: Under Florida Statute 475.278(3)(c)2, a licensee who currently represents a buyer as a single
  agent wishes to change that relationship to a transaction broker. What must the licensee obtain
  before making the change?
options:
  - A new listing agreement that revises the commission terms.
  - A disclosure of all known material facts that affect property value.
  - Approval from the broker’s supervising broker to proceed.
  - The principal’s written consent to change the relationship.
key: D
explanation: Under Florida Statute 475.278(3)(c)2, a single agent relationship may be changed to a
  transaction broker relationship only after the agent first obtains the principal’s written consent
  to the change in relationship. The option stating that approval from the broker’s supervising
  broker is required is incorrect because the statute does not require supervising broker approval,
  only the principal’s consent.
citation:
  source: Fla. Stat. § 475.278(3)(c)2
  url: null
  quoted_text: A single agent relationship may be changed to a transaction broker relationship at any
    time during the relationship between an agent and principal, provided the agent first obtains
    the principal’s written consent to the change in relationship.
