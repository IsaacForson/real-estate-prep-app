stem: How many days after closing does the owner have to notify the closing agent of a dispute under
  the Florida Commercial Real Estate Sales Commission Lien Act?
options:
  - 10 days
  - 3 days
  - 7 days
  - 5 days
key: D
explanation: The warning attached to the commission notice states that an owner must notify the
  closing agent of a dispute no later than five days after the closing. Therefore the correct answer
  is five days. The three‑day option confuses this rule with the three‑day notice requirement for
  closing agents when net proceeds are insufficient.
