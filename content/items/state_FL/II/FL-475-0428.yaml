stem: According to Florida Statute 475.2755(1), under which condition may a broker designate sales
  associates to act as single agents for different customers in the same transaction?
options:
  - The transaction is a residential sale and the buyer and seller each have assets of $500,000 or
    more
  - The transaction is not a residential sale and the buyer and seller each have assets of $1
    million or more
  - The broker initiates the designation without a request from the customers
  - The buyer or seller has assets of $1 million or more, regardless of the other party's assets
key: B
explanation: The statute expressly limits designated sales associate use to non‑residential
  transactions where both buyer and seller have assets of $1 million or more. The option describing
  a residential sale is incorrect because the statute excludes residential sales from this
  provision.
