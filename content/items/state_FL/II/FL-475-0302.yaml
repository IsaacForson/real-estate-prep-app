stem: Jordan holds a bachelor's degree in real estate from an accredited university and has just
  completed the sales associate prelicensure course. Under Florida Statute 475.17, is Jordan
  required to complete the postlicensure education requirement before the first renewal?
options:
  - Yes, Jordan must complete 45 hours of postlicensure education.
  - No, Jordan is exempt due to the real‑estate degree.
  - Yes, Jordan must finish the education unless seeking a broker license.
  - No, Jordan only needs to pass the distance‑learning exam.
key: B
explanation: Subsection (6) of Florida Statute 475.17 exempts anyone who has earned a four‑year
  degree or higher in real estate from an accredited institution from both the postlicensure
  education requirement and the initial education coursework. Because Jordan holds such a degree, he
  is not required to complete the postlicensure education before his first renewal. The option
  stating that Jordan must complete 45 hours of postlicensure education is incorrect because the
  exemption removes that requirement. The option suggesting Jordan must finish the education unless
  seeking a broker license adds a condition that the statute does not include in the exemption. The
  option claiming Jordan only needs to pass a distance‑learning exam is incorrect because the
  exemption does not substitute any exam for the education requirement.
citation:
