stem: A Florida sales associate has held an active license for 24 months in the preceding five years
  while employed by a broker. She has not completed the required postlicensure education. Under
  Florida Statute 475.17, is she eligible to apply for a broker license?
options:
  - She is eligible to apply for a broker license if she works for a governmental agency.
  - She is eligible to apply for a broker license because she meets the experience requirement.
  - She is not eligible to apply for a broker license until she completes the postlicensure
    education.
  - She is not eligible to apply for a broker license because she needs 36 months of experience.
key: C
explanation: The statute requires a sales associate to complete any postlicensure education
  requirement and hold a current license to be eligible for a broker license. Mere experience does
  not waive this education prerequisite. Thus, she must finish the postlicensure education before
  she can qualify.
citation:
  source: Fla. Stat. § 475.17(2)(d)
  url: null
  quoted_text: A sales associate who is required to complete any postlicensure education requirement
    must complete any postlicensure education requirement and hold a current and valid license in
    order to be eligible for licensure as a broker.
