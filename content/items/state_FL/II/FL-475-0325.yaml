stem: Under Florida Statute 475.705(3), what is the latest time before closing that a broker must
  deliver a copy of the commission notice to the owner and closing agent?
options:
  - The broker must deliver the commission notice no later than the date of closing.
  - The broker must deliver the commission notice within 3 days after acquiring knowledge of the
    closing agent.
  - The broker must deliver the commission notice within 30 days after the commission is earned.
  - The broker must deliver the commission notice at least 1 day before the closing.
key: D
explanation: The statute requires delivery both within 30 days after the commission is earned and at
  least one day before the closing. The latest permissible time is therefore the
  one‑day‑before‑closing requirement. The distractor about the 30‑day window is incorrect because
  that window sets a maximum, not the latest allowable moment; delivery could occur earlier but
  still must satisfy the one‑day rule.
