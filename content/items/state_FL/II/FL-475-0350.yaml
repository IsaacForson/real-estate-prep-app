stem: Under Florida Statute 475.43, which of the following is excluded from the presumption that a
  party is acting as a real estate broker?
options:
  - A lease agreement for residential property.
  - A sales associate's commission agreement.
  - A mortgage loan secured by real estate.
  - An irrevocable gift of real property.
key: D
explanation: The statute explicitly states that the presumption does not apply to irrevocable gifts,
  unconditional contracts to purchase, or options based on substantial consideration actually paid.
  A lease agreement does not fall under this exemption, so the presumption would still apply if the
  party lacks title.
