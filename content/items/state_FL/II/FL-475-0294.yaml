stem: Under Florida Statute 475.01, how is a "customer" defined in the context of real estate brokerage?
options:
  - A. A person who appraises, auctions, sells, exchanges, buys, rents, or offers to appraise,
    auction, or negotiate the sale, exchange, purchase, or rental of real property for compensation.
  - B. A member of the public who is or may be a buyer or seller of real property and may or may not
    be represented by a real estate licensee in an authorized brokerage relationship.
  - C. A broker who represents, as a fiduciary, either the buyer or seller but not both in the same
    transaction, owing loyalty and confidentiality to that principal.
  - D. A person who performs any act specified in the definition of “broker,” but who performs such
    act under the direction, control, or management of another person.
key: B
explanation: Florida Statute § 475.01(d) defines a “customer” as a member of the public who is or
  may be a buyer or seller of real property and who may or may not be represented by a real estate
  licensee in an authorized brokerage relationship. The statement that a customer is a member of the
  public who may be a buyer or seller and may or may not be represented by a licensee therefore
  matches the statutory definition. The other answer choices describe a broker, a fiduciary broker
  relationship, or a person acting under another’s direction, none of which are the statutory
  definition of a customer.
