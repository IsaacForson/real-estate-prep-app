stem: According to Florida Statute 475.02, how many members of the Florida Real Estate Commission
  must be licensed brokers who have held an active license for at **LEAST** five years preceding
  appointment?
options:
  - Three members
  - Two members
  - One member
  - Four members
key: D
explanation: The statute states that four members must be licensed brokers, each of whom has held an
  active license for the 5 years preceding appointment. The option 'Two members' incorrectly
  reflects the requirement for members who are not brokers or sales associates.
