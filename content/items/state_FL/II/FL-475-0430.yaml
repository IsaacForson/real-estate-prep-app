stem: A broker is facilitating a commercial office building sale where the buyer is a corporation
  with assets of $2 million and the seller is a partnership with assets of $1.5 million. The broker,
  at the request of both parties, wants to designate sales associates to represent each side. Is
  this permissible under Florida Statute 475.2755(1)?
options:
  - Yes, because the transaction is not a residential sale and both parties meet the $1 million
    asset threshold.
  - No, because the broker must obtain written consent from the Florida Real Estate Commission
    before designating sales associates.
  - Yes, but only if the buyer and seller each have assets of exactly $1 million.
  - No, because designated sales associates may only be used in residential transactions.
key: A
explanation: The statute permits designation when the transaction is non‑residential and both
  parties have assets of $1 million or more; the scenario satisfies both requirements. The claim
  that the broker must obtain written consent from the Florida Real Estate Commission before
  designating sales associates is incorrect because the statute does not require commission approval
  for designation.
