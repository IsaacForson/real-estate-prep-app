stem: Under Florida Statute 475.2755(1), what must the broker obtain from both the buyer and the
  seller before using a designated sales associate in a qualifying transaction?
options:
  - An written request from the broker’s office manager authorizing the designation of sales
    associates
  - A verbal confirmation that the transaction exceeds $1 million in total value
  - A separate agreement allowing the designated sales associate to disclose confidential
    information to the other party
  - A signed disclosure confirming each party’s assets meet the $1 million threshold and requesting
    designated sales associate representation
key: D
explanation: The statute requires the buyer and seller to each sign disclosures that confirm the
  $1 million asset threshold and request the designated sales associate form of representation. The
  option suggesting a written request from the broker’s office manager is incorrect because the
  statute does not require supervisory approval. The option suggesting a verbal confirmation that
  the transaction exceeds $1 million is incorrect because the statute requires signed disclosures,
  not a verbal statement, and the threshold concerns each party’s assets, not the transaction value.
  The option suggesting a separate agreement allowing the designated sales associate to disclose
  confidential information is incorrect because the statute does not authorize such disclosure; it
  only governs the disclosure and request for designated sales associate representation.
