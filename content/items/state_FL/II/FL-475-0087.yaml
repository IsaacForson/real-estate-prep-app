stem: Which of the following best describes a sales associate?
options:
  - A person who performs any act specified in the definition of “broker,” but who performs such act
    under the direction, control, or management of another person.
  - A person who is qualified to be issued a license as a broker but who operates as a sales
    associate in the employ of another.
  - A person who, for another and for compensation, appraises, auctions, sells, exchanges, buys,
    rents, or negotiates the sale or rental of real property.
  - A person who is a member of the public who may be a buyer or seller of real property and may or
    may not be represented by a licensee.
key: A
explanation: According to Fla. Stat. § 475.01(j), a sales associate is a person who performs any act
  specified in the definition of a broker but under the direction, control, or management of another
  person. This matches the description that a person performs any act specified in the definition of
  a broker but performs such act under the direction, control, or management of another person. The
  statement that a person is qualified to be issued a license as a broker but operates as a sales
  associate in the employ of another describes a broker associate, not a sales associate.
