stem: A licensee is acting as a transaction broker in the sale of a single‑family home. According to
  Florida Statute 475.278(2)(d), what information must the licensee disclose to the buyer?
options:
  - Known facts materially affecting residential property value that are not readily observable to
    the buyer.
  - The seller’s motivation for selling the property, including any urgency or personal
    circumstances.
  - The exact amount of the seller’s outstanding mortgage balance, including any secondary loans or
    liens.
  - The licensee’s personal opinion on the property’s future appreciation, including expected market
    trends.
key: A
explanation: According to Fla. Stat. § 475.278(2)(d), a transaction broker must disclose all known
  facts that materially affect the value of residential real property and are not readily observable
  to the buyer. The seller’s motivation for selling the property, including any urgency or personal
  circumstances, is confidential and must not be disclosed.
