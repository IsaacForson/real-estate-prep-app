stem: A sales associate completes initial licensure but fails to finish the required postlicensure
  education before the first license renewal. According to Florida Statute 475.17, what is the
  status of her license?
options:
  - Under Florida Statute 475.17(3)(c), the sales associate’s license in Florida remains active but
    cannot be renewed
  - Under Florida Statute 475.17(3)(c), the sales associate’s license in Florida is automatically
    converted to a broker license
  - Under Florida Statute 475.17(3)(c), the sales associate’s license in Florida is placed on
    inactive status until education completed
  - Under Florida Statute 475.17(3)(c), the sales associate’s license in Florida is considered null
    and void
key: D
explanation: The law provides that a sales associate who does not complete the postlicensure
  education requirement prior to the first renewal following initial licensure shall have her
  license considered null and void. Therefore, the license is invalid and cannot be used until the
  associate requalifies. The other options describe the license as active, inactive, or converted,
  which the statute does not allow.
