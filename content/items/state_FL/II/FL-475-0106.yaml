stem: Under Florida Statute 475.2755(1), when a broker designates sales associates for a
  non‑residential transaction involving customers with assets of $1 million or more, what must the
  buyer and seller each sign?
options:
  - A disclosure stating their assets meet the $1 million threshold and requesting designated sales
    associate representation.
  - A written consent to change the brokerage relationship from single agent to transaction broker.
  - A listing agreement that includes the broker’s commission rate and property description.
  - A confidentiality waiver allowing the associate to share information with the broker.
key: A
explanation: Fla. Stat. § 475.2755(1) requires both buyer and seller to sign a disclosure stating
  that their assets meet the $1 million threshold and requesting that the broker use the designated
  sales associate form of representation. The other options describe different documents—a consent
  to change agency relationship, a listing agreement, or a confidentiality waiver—which are not
  required by this provision.
