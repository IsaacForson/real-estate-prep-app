stem: A broker records a commission notice on January 1. The closing occurs on February 20. Does the
  recorded notice constitute constructive notice to the closing agent under Florida Statute
  475.707(1)(b)?
options:
  - Regarding constructive notice to the closing agent, the recording does not constitute notice
    because the notice was not delivered to the closing agent.
  - Regarding constructive notice to the closing agent, the recording constitutes notice because the
    notice was recorded.
  - Regarding constructive notice to the closing agent, the recording constitutes notice because the
    owner received a copy of the notice.
  - Regarding constructive notice to the closing agent, the recording does not constitute notice
    because less than sixty days have passed since recording.
key: D
explanation: Constructive notice to a closing agent arises only after the commission notice has been
  of record for at least sixty days. With only fifty days elapsed between recording and closing, the
  notice does not yet provide constructive notice. The distractor that treats any recording as
  sufficient ignores the sixty‑day threshold.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) § 475.707(1)(b)
  url: null
  quoted_text: The recording of the commission notice shall not constitute constructive notice to a
    closing agent unless the commission notice has been of record for at least 60 days.
