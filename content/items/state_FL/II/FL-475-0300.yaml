stem: Under Florida Statute 475.17(5)(a), what additional time may the commission allow for
  completing postlicensure education due to individual physical hardship?
options:
  - Three months
  - Six months
  - Nine months
  - Twelve months
key: B
explanation: The statute explicitly allows an additional six‑month period for sales associates and
  brokers who cannot complete the required postlicensure education because of individual physical
  hardship as defined by rule. The three‑month option understates the allowance, while nine and
  twelve months exceed what the law permits.
