stem: Under Florida Statute 475.483(1)(c), what is the maximum period after the act giving rise to a
  claim that a claim for recovery may be made from the Real Estate Recovery Fund?
options:
  - Two years
  - Three years
  - Four years
  - Five years
key: C
explanation: The statute explicitly states that no claim for recovery may be made more than 4 years
  after the date of the act giving rise to the claim. The two‑year period mentioned elsewhere
  applies to filing after the act or after discovery, but the absolute outer limit is four years.
