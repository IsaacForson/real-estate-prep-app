stem: If a court appoints a receiver for a brokerage firm and the firm’s assets are insufficient to
  cover the receiver’s expenses, what is the maximum amount that may be paid from the Real Estate
  Recovery Fund for that receivership under Florida Statute 475.5017(2)?
options:
  - $100,000
  - $150,000
  - $50,000
  - $75,000
key: A
explanation: The statute states that if the brokerage’s assets are insufficient to pay the
  receiver’s expenses, the court may order disbursement from the Real Estate Recovery Fund, but such
  disbursement may not exceed $100,000 per receivership. Therefore, the upper limit is $100,000. The
  distractor “$75,000” understates the statutory cap.
