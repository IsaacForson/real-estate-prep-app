stem: A licensed broker employs an unlicensed assistant to answer phone calls and schedule
  appointments but not to negotiate or show properties. Under Florida Statute 475.01, is the
  assistant required to hold a real estate license?
options:
  - Yes, because any employee of a broker must be licensed regardless of duties.
  - No, but only if the assistant receives no compensation for the work.
  - No, because performing clerical tasks alone does not constitute acts requiring a license.
  - Yes, because the assistant is employed by a broker and therefore must be licensed.
key: C
explanation: The definition of broker and sales associate requires performing acts such as
  appraising, auctioning, selling, exchanging, buying, renting, or negotiating. Clerical tasks like
  answering phones and scheduling do not meet this definition, so a license is not required. The
  other options incorrectly extend the licensing requirement to all employees or add unsupported
  conditions.
