stem: Closing occurs on May 1. The owner and broker have not agreed in writing regarding the release
  of disputed reserved proceeds by May 6. What action may the closing agent take under Florida
  Statute 475.711?
options:
  - The closing agent may file an interpleader action to have the court decide the rights to the
    disputed reserved proceeds.
  - The closing agent must release the disputed reserved proceeds to the broker without further
    delay or additional conditions.
  - The closing agent must deduct recording expenses from the disputed reserved proceeds before any
    distribution is made.
  - The closing agent must continue holding the disputed reserved proceeds until the owner and
    broker agree on their distribution.
key: A
explanation: Under Florida Statute § 475.711(1)(b), when the owner and broker have not reached a
  written agreement within five days after closing about the disputed reserved proceeds, the closing
  agent is authorized to file an interpleader action so a court can determine the proper
  distribution. The agent may not release the proceeds to either party, may not deduct expenses, and
  may not simply retain the funds without seeking court direction.
