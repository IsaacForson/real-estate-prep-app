stem: Under Florida Statute 475.180(2)(a), what must a resident licensee do within 60 days after
  becoming a nonresident?
options:
  - The licensee must notify the commission of the change in residency and comply with nonresident
    requirements
  - The licensee must submit a new application for licensure to the commission and pay the required
    fee
  - The licensee must complete fourteen classroom hours of continuing education and submit proof to
    the commission
  - The licensee must pay a one‑hundred‑dollar late renewal fee and submit proof of payment to the
    commission
key: A
explanation: Under Fla. Stat. § 475.180(2)(a), a resident licensee who becomes a nonresident must
  notify the commission of the change in residency and comply with nonresident requirements within
  60 days. The option stating that the licensee must notify the commission of the change in
  residency and comply with nonresident requirements reflects this requirement. The other options
  add obligations—such as submitting a new application, completing continuing education, or paying a
  late renewal fee—that are not required solely for a change in residency under the statute.
