stem: A broker recorded a commission notice on January 15, 2024. The owner remains obligated to pay
  a commission after the notice’s one‑year expiration. What is the latest date the broker may record
  an extension notice to extend the lien for another year?
options:
  - November 15, 2024
  - December 15, 2024
  - January 14, 2025
  - January 15, 2025
key: C
explanation: A commission notice expires one year after recording (January 15, 2025). An extension
  notice must be recorded within the last 60 days before that expiration date, which runs from
  November 16, 2024 through January 14, 2025. The latest allowable date is therefore
  January 14, 2025. Selecting January 15 incorrectly uses the expiration date itself.
