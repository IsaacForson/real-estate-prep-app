stem: Under Florida Statute 475.001, what is the purpose of regulating real estate brokers, sales
  associates, and schools in Florida?
options:
  - To restrict property ownership to residents
  - To increase state tax revenue
  - To mandate continuing education for all citizens
  - To protect public welfare
key: D
explanation: Florida Statute 475.001 states that the Legislature finds regulation of brokers, sales
  associates, and schools necessary in the interest of public welfare. Thus the purpose is to
  protect public welfare. The other choices describe purposes that the statute does not assign, such
  as limiting ownership, raising tax revenue, or requiring education for all citizens.
