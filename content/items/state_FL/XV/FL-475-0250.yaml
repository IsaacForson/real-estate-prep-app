stem: Maria owns a single-family home and decides to sell it herself without hiring any agent or
  paying any commission. Under Florida Statutes, is Maria required to hold a real estate license to
  conduct this sale?
options:
  - Under Florida Statutes, Maria must hold a license only if she receives a commission from the
    buyer
  - Under Florida Statutes, Maria is exempt only if she sells the property to a family member
  - Under Florida Statutes, Maria must hold a real estate license to sell her own home
  - Under Florida Statutes, Maria is exempt from licensing requirements when selling her own home
key: D
explanation: The exemption in 475.011(2) states that any individual who sells, exchanges, or leases
  its own real property is exempt from licensing requirements. Since Maria is selling her own home
  without employing a commissioned agent, she falls under this exemption. The other options
  incorrectly condition the exemption on receiving a commission or selling to a family member, which
  are not required by the statute.
