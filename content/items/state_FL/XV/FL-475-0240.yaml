stem: According to Florida Statutes, which of the following activities is included in the statutory
  definition of a 'broker'?
options:
  - A person who manages a rental property for a salary and does not receive any commission
  - A person who advertises or holds out to the public that they are engaged in the business of
    leasing real property of others
  - A person who provides legal advice to clients regarding any real estate contracts
  - A person who appraises personal property for a fee without holding the real estate license
key: B
explanation: The definition of broker includes advertising or holding out to the public that one is
  engaged in the business of leasing real property of others, as shown in the quoted text. The
  option stating that a person appraises personal property for a fee without holding a real estate
  license describes an activity excluded from the definition because it applies only to real
  property or business enterprises. The options stating that a person provides legal advice to
  clients regarding real estate contracts, and that a person manages a rental property for a salary
  and does not receive any commission, describe activities not covered by the broker definition.
