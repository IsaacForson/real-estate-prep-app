stem: A property management firm pays a tenant $60 as a finder’s fee for introducing a prospective
  lessee, and does not advertise the tenant’s services. Under Florida law, is this payment
  permissible?
options:
  - The payment is permissible because the fee was paid to a tenant and no advertising occurred
  - The payment is permissible because the fee was credited toward the tenant’s rent
  - The payment is not permissible because the fee exceeds the $50 limit set by statute
  - The payment is not permissible because the tenant must hold a sales associate license to receive
    any fee
key: C
explanation: Florida law limits finder’s fees paid to unlicensed tenants to $50 per transaction; a
  $60 payment exceeds that limit, making it impermissible.
citation:
  source: Fla. Stat. § 475.01(13)
  url: null
  quoted_text: Any property management firm or any owner of an apartment complex for the act of paying
    a finder’s fee or referral fee to an unlicensed person who is a tenant in such apartment complex
    provided the value of the fee does not exceed $50 per transaction.
