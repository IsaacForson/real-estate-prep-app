stem: Alex holds an active broker license but chooses to work under the supervision of another
  broker, performing sales associate duties. According to Florida Statutes, how should Alex be
  classified?
options:
  - According to Florida Statutes, Alex should be classified as a broker
  - According to Florida Statutes, Alex should be classified as a broker associate
  - According to Florida Statutes, Alex should be classified as a sales associate
  - According to Florida Statutes, Alex should be classified as an unlicensed assistant
key: B
explanation: The definition of broker associate in 475.01(1)(b) specifies a person qualified for a
  broker license who operates as a sales associate in the employ of another. Alex meets this
  description, so the correct classification is broker associate. The other options either ignore
  the qualification for a broker license or misidentify the role.
