stem: A dealer registered under the Securities Exchange Act sells a business enterprise to an
  accredited investor. The transaction also includes the sale of undeveloped land that is not
  connected to the business enterprise. Under Florida law, does the exemption in § 475.01(12) apply
  to the land portion?
options:
  - The exemption applies to the entire transaction because the investor is accredited
  - The exemption applies to the business enterprise portion but not to the land portion
  - The exemption does not apply because the dealer is not a Florida‑licensed real estate broker
  - The exemption applies only if the land is sold first, then the business enterprise
key: B
explanation: § 475.01(12) states the exemption does not apply to a sale, exchange, purchase, or
  rental of land, buildings, fixtures or other improvements to the land which is not made in
  connection with the sale, exchange, purchase, or rental of a business enterprise. Therefore the
  land portion is not exempt.
