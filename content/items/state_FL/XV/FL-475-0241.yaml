stem: Under Florida Statute 475.01(13), what is the maximum amount a property management firm may
  pay as a finder’s fee to a tenant for introducing a prospective lessee without requiring the
  tenant to hold a real estate license?
options:
  - $25
  - $50
  - $75
  - $100
key: B
explanation: The statute expressly permits a property management firm to pay a finder’s fee to a
  tenant‑unlicensed person only when the fee’s value does not exceed $50 per transaction. Amounts
  above this threshold require the recipient to be licensed.
citation:
  source: Fla. Stat. § 475.01(13)
  url: null
  quoted_text: Any property management firm or any owner of an apartment complex for the act of paying
    a finder’s fee or referral fee to an unlicensed person who is a tenant in such apartment complex
    provided the value of the fee does not exceed $50 per transaction.
