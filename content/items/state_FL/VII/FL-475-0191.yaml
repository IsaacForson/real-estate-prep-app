stem: A licensee attends two legal agenda sessions of the Florida Real Estate Commission during a
  single renewal cycle, notifies the division at least seven days in advance for each session, and
  is not a party to any disciplinary action. How many continuing education hours may the licensee
  claim for these attendances?
options:
  - 9 hours
  - 6 hours
  - 3 hours
  - 0 hours
key: C
explanation: Fla. Stat. § 475.182(1)(b) allows the commission to substitute up to three classroom
  hours of continuing education per renewal cycle for attendance at one legal agenda session, and
  this credit cannot be earned for more than one session in the same cycle. Thus attending two
  sessions still yields only three hours. The distractor “6 hours” is wrong because it assumes each
  session provides three hours, but the rule caps the credit at three hours per renewal cycle for
  such attendance.
