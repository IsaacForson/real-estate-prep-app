stem: Under Florida law, how many times per renewal cycle may a licensee receive continuing
  education credit for attending a legal agenda session of the Florida Real Estate Commission?
options:
  - Two times per renewal cycle.
  - One time per renewal cycle.
  - Three times per renewal cycle.
  - Unlimited times per renewal cycle.
key: B
explanation: The statute states that the commission may accept attendance at one legal agenda
  session as a substitute for 3 classroom hours, one time per renewal cycle. Therefore, a licensee
  may claim credit only once per cycle. The distractor claiming two times per renewal cycle
  incorrectly assumes multiple allowances, which the law does not permit.
