stem: A licensee plans to attend a legal agenda session on November 5 and notifies the division on
  October 28. Assuming the licensee is **NOT** a party to any disciplinary action, how many
  continuing education hours may be claimed for this attendance?
options:
  - Six hours
  - Twelve hours
  - Zero hours
  - Three hours
key: D
explanation: The licensee notified the division eight days in advance (October 28 to November 5),
  satisfying the at‑least‑seven‑day requirement, so the session qualifies for the three‑hour
  substitution. Zero hours would apply if notice were fewer than seven days; six or twelve hours
  exceed the allowed substitution.
