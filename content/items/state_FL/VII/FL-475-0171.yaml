stem: A licensee’s license period ends on September 30, 2025. On what date must the Florida
  Department of Business and Professional Regulation have mailed the renewal notice to the licensee?
options:
  - 09/01/2025.
  - 08/01/2025.
  - 07/02/2025.
  - 08/30/2025.
key: B
explanation: Fla. Stat. § 475.182(4) requires the department to mail a renewal notice sixty days
  before the end of the license period. Counting back sixty days from September 30, 2025 lands on
  August 1, 2025. The distractor of August 30, 2025 is only thirty‑one days prior, which does not
  satisfy the sixty‑day rule.
