stem: Under Florida law, how many days before the end of a license period must the department mail a
  notice of renewal and possible reversion to the licensee?
options:
  - 30 days
  - 45 days
  - 60 days
  - 90 days
key: C
explanation: The statute requires the department to mail a notice of renewal and possible reversion
  sixty days before the end of the license period and automatic reversion to inactive status. The
  thirty‑day and forty‑five‑day options are too short, and the ninety‑day option exceeds the
  required period.
