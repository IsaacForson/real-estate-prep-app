stem: A licensee’s license became involuntarily inactive on January 1, 2023. Under Florida law, on
  what date must the department mail the notice of expiration to the licensee?
options:
  - A. October 3, 2024.
  - B. October 1, 2024.
  - C. September 30, 2024.
  - D. November 2, 2024.
key: A
explanation: A license that has been involuntarily inactive for more than two years automatically
  expires. Thus, the license expires on January 1, 2025 (24 months after January 1, 2023). The
  department must give notice ninety days prior to expiration, which is October 3, 2024. The other
  dates are either too early or too late relative to this requirement.
