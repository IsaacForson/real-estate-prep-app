stem: A sales associate’s license has been involuntarily inactive for 10 months. What is the minimum
  continuing education requirement to reactivate the license?
options:
  - Twenty‑four hours.
  - Seven hours.
  - Fourteen hours.
  - Twenty‑eight hours.
key: C
explanation: For a license involuntarily inactive for 12 months or less, the reactivation
  requirement is at least 14 hours of commission‑prescribed continuing education. Since ten months
  is within this period, fourteen hours is required. The distractor "Twenty‑eight hours" applies
  only when the inactive period exceeds twelve months but is less than twenty‑four months.
