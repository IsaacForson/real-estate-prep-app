stem: Under Florida law, what is the maximum late renewal fee that the Florida Real Estate
  Commission may prescribe for an involuntarily inactive license?
options:
  - A. $50.
  - D. $150.
  - B. $75.
  - C. $100.
key: D
explanation: The statute states that the commission shall prescribe by rule a fee not to exceed $100
  for the late renewal of an involuntarily inactive license. Therefore, the maximum allowable fee is
  $100. Options suggesting $50 or $75 are under the maximum, while $150 exceeds the statutory limit.
