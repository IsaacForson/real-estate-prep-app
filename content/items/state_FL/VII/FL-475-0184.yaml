stem: According to Florida law, what must the department do upon receipt of a renewal application
  and fee for an active license?
options:
  - The department renews the license.
  - The department denies the license.
  - The department schedules an exam.
  - The department asks for more CE.
key: A
explanation: The department must renew a license when it receives a completed renewal application
  and the required fee, as provided in Fla. Stat. § 475.182(1)(a). Therefore, the correct action is
  to renew the license. The option stating that the department denies the license is incorrect
  because the statute requires renewal, not denial, upon receipt of a complete application and fee.
