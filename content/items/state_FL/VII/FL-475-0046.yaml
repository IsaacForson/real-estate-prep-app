stem: What occurs to a Florida real estate license if the licensee fails to renew it by the end of
  the license period set by the department?
options:
  - It becomes voluntarily inactive status and must be renewed.
  - It is immediately canceled and must be re‑applied for again.
  - It automatically reverts to involuntarily inactive status.
  - It remains active but incurs a late renewal fee each period.
key: C
explanation: Under Fla. Stat. § 475.182(3), a license that is not renewed at the end of the license
  period automatically reverts to involuntarily inactive status. The distractor claiming it becomes
  voluntarily inactive is incorrect because the statute specifies involuntary, not voluntary,
  reversion.
