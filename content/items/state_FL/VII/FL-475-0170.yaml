stem: A sales associate’s license has been voluntarily inactive for 3 years. What is the maximum
  number of continuing education hours the Florida Real Estate Commission may require for renewal of
  the license?
options:
  - 48 hours.
  - 36 hours.
  - 24 hours.
  - 12 hours.
key: B
explanation: According to Fla. Stat. § 475.183(1), the commission may require continuing education
  not to exceed twelve classroom hours for each year a license was voluntarily inactive. For three
  years of inactivity, the maximum is three times twelve, or thirty‑six hours. The distractor of
  twenty‑four hours corresponds to only two years of inactivity and thus understates the allowable
  maximum.
