stem: A sales associate’s license has been voluntarily inactive for 18 months. The licensee submits
  a renewal application to the department. According to Florida law, what may the licensee elect to
  do after the license is renewed?
options:
  - The licensee may switch to active status immediately.
  - The licensee may complete additional continuing education hours.
  - The licensee may continue her or his voluntarily inactive status.
  - The licensee may surrender the license to the department.
key: C
explanation: The statute allows a licensee who renews a voluntarily inactive license to elect to
  continue that voluntarily inactive status. The distractor suggesting an immediate switch to active
  status incorrectly ignores the elective provision and the requirement to meet any applicable
  continuing education obligations.
citation:
  source: Fla. Stat. § 475.183(1)
  url: null
  quoted_text: A person whose license is voluntarily inactive and who renews the license may elect to
    continue her or his voluntarily inactive status.
