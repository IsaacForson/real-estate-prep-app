stem: A sales associate’s license has been involuntarily inactive for 28 months. What is the status
  of the license under Florida law?
options:
  - The license remains involuntarily inactive and may be renewed after completing 28 hours of
    continuing education
  - The license has automatically expired and is null and void with no further action needed
  - The license is considered voluntarily inactive and may be renewed after 12 hours of continuing ed
  - The license is still active but subject to a fine and possible administrative penalties
key: B
explanation: Under Florida Statute §475.183(2)(b), any license that has been involuntarily inactive
  for more than two years automatically expires and becomes null and void without further action.
  The option stating that the license remains involuntarily inactive and may be renewed after
  completing 28 hours of continuing education is incorrect because renewal is not possible after
  expiration. The option stating that the license is considered voluntarily inactive and may be
  renewed after 12 hours of continuing education is incorrect because the status is involuntary, not
  voluntary, and renewal is not allowed. The option stating that the license is still active but
  subject to a fine and possible administrative penalties is incorrect because the license is no
  longer active.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
