stem: A sales associate’s license has been involuntarily inactive for 6 months. What is the minimum
  continuing education requirement to reactivate the license under Florida law?
options:
  - The licensee must complete 14 hours of commission‑prescribed continuing education.
  - The licensee must complete 21 hours of commission‑prescribed continuing education.
  - The licensee must complete 28 hours of commission‑prescribed continuing education.
  - The licensee must complete 7 hours of commission‑prescribed continuing education.
key: A
explanation: Fla. Stat. § 475.183(2)(a) requires at least 14 hours of commission‑prescribed
  continuing education to reactivate a license that has been involuntarily inactive for 12 months or
  less. The distractor suggesting 28 hours applies only when inactivity exceeds 12 months but is
  less than 24 months.
