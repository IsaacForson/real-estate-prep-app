stem: Under Florida law, what is the maximum number of continuing education hours that may be earned
  per renewal cycle by attending a legal agenda session of the Florida Real Estate Commission?
options:
  - Fourteen hours.
  - Zero hours.
  - Three hours.
  - Six hours.
key: C
explanation: The rule states that the commission may accept attendance at one legal agenda session
  as a substitute for 3 classroom hours, one time per renewal cycle. Therefore the maximum credit
  allowed is three hours. The distractor "Six hours" incorrectly doubles the allowed credit, which
  the statute does not permit.
