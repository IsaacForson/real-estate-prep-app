stem: A licensee attends a legal agenda session of the Florida Real Estate Commission and is a party
  to a disciplinary action. According to Florida law, what continuing education credit may the
  licensee claim for this attendance?
options:
  - The licensee may retake the legal agenda session to receive credit.
  - The licensee may claim continuing education credit for the attendance.
  - The licensee may not claim any continuing education credit for the attendance.
  - The licensee may claim half the usual continuing education credit for the attendance.
key: C
explanation: The statute explicitly prohibits a licensee from earning continuing education credit
  for attending a legal agenda session when they are a party to a disciplinary action. The
  distractor claiming credit can be earned overlooks this prohibition.
