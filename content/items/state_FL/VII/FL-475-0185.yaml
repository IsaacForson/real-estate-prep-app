stem: A sales associate’s license has been voluntarily inactive for 18 months. What is the maximum
  number of continuing education hours the Florida Real Estate Commission may require for renewal of
  the license?
options:
  - 12 hours
  - 30 hours
  - 18 hours
  - 24 hours
key: C
explanation: The rule limits continuing education for a voluntarily inactive license to no more than
  12 classroom hours for each year of inactivity. Eighteen months equals 1.5 years, so the maximum
  is 1.5 × 12 = 18 hours. The distractor of 12 hours would only apply if the license were inactive
  for exactly one year, ignoring the additional six months.
