stem: A sales associate’s license has been voluntarily inactive for 24 months. What is the maximum
  number of continuing education hours the Florida Real Estate Commission may require for renewal of
  the license?
options:
  - 12 hours
  - 18 hours
  - 24 hours
  - 30 hours
key: C
explanation: The statute allows up to 12 classroom hours of continuing education for each year the
  license was voluntarily inactive. Twenty‑four months is two years, so the maximum is 2 × 12 = 24
  hours. The distractor of 30 hours incorrectly adds extra hours beyond the yearly cap.
