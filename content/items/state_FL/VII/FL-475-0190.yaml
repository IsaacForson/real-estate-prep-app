stem: A sales associate attends a legal agenda session of the Florida Real Estate Commission,
  notifies the division eight days in advance, and is a party to an ongoing disciplinary action. How
  many continuing education hours may the sales associate claim for this attendance?
options:
  - 0 hours
  - 6 hours
  - 14 hours
  - 3 hours
key: A
explanation: According to Fla. Stat. § 475.182(1)(b), a licensee may not earn any continuing
  education credit for attending a legal agenda session while being a party to a disciplinary
  action, regardless of how early they notify the division. Therefore the sales associate earns zero
  hours. The distractor “3 hours” is incorrect because it ignores the statutory prohibition that
  applies when the licensee is a party to the proceeding.
