stem: Under Florida law, how many days in advance must a licensee notify the division to receive
  continuing education credit for attending a legal agenda session of the Florida Real Estate
  Commission?
options:
  - At least 3 days.
  - At least 5 days.
  - At least 7 days.
  - At least 10 days.
key: C
explanation: Under Fla. Stat. § 475.182(1)(b), a licensee must notify the division at least seven
  days in advance to receive continuing education credit for attending a legal agenda session.
  Therefore, the correct answer is at least seven days. The distractor of five days is insufficient
  because it does not meet the seven‑day requirement, so no credit may be claimed.
