stem: If a Florida real estate license period ends on June 30, 2025, on what date must the
  department mail the notice of renewal and possible reversion to the licensee?
options:
  - May 1, 2025
  - May 30, 2025
  - June 1, 2025
  - May 2, 2025
key: A
explanation: Sixty days before June 30, 2025 is May 1, 2025; the department must mail the notice on
  that date. May 2 is one day late, May 30 is only one month prior, and June 1 is only 29 days
  prior.
