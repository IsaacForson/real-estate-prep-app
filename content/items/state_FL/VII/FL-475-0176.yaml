stem: A licensee completes an approved distance learning continuing education course that requires a
  final written examination to be taken at a proctored testing center. Under Florida law, may the
  licensee claim continuing education credit for this course?
options:
  - C. Yes, as long as the course provider is approved by the Florida Real Estate Commission.
  - D. No, unless the licensee also completes a live review session of the same material.
  - A. Yes, because distance learning courses are expressly permitted under Florida law.
  - B. No, because the commission may not require a written examination at a centralized location
    for distance learning credit.
key: D
explanation: The law explicitly prohibits the commission from requiring a written examination at a
  centralized location for distance learning or correspondence courses to count toward continuing
  education credit. Since the course mandates such an exam, the licensee cannot claim credit. The
  claim that distance learning courses are expressly permitted does not override the prohibition on
  centralized exams.
