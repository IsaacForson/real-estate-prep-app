stem: According to Florida Statute 475.01, what does the term 'Broker associate' mean?
options:
  - A person who is qualified to be issued a license as a broker but who operates as a sales
    associate in the employ of another
  - A person who performs any act specified in the definition of broker but under the direction of
    another
  - A person who represents either the buyer or seller as a fiduciary in a transaction
  - A person who provides limited representation to both parties without fiduciary capacity
key: A
explanation: The key is correct because 475.01(b) defines a broker associate as someone qualified
  for a broker license who works as a sales associate for another. The option stating that a person
  performs any act specified in the definition of broker but under the direction of another
  describes a sales associate, not a broker associate, because it omits the qualification for a
  broker license. The options stating that a person represents either the buyer or seller as a
  fiduciary in a transaction and that a person provides limited representation to both parties
  without fiduciary capacity describe single agent and transaction broker roles, which are distinct
  definitions elsewhere in the statute.
