stem: A Florida resident sales associate moves to Georgia and wishes to maintain her Florida
  license. According to Florida Statute 475.180, within how many days must she notify the commission
  of her change in residency?
options:
  - 30 days
  - 60 days
  - 90 days
  - 120 days
key: B
explanation: Fla. Stat. § 475.180(2)(a) requires a resident licensee who becomes a nonresident to
  notify the commission within 60 days of the change in residency. The other timeframes are not
  specified in the law.
