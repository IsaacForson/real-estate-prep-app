stem: A licensee receives a notice of noncompliance from the commission for failing to maintain
  proper escrow records. The licensee argues the commission lacked authority to issue such notice.
  Which statute supports the commission's authority to issue notices of noncompliance?
options:
  - Fla. Stat. § 475.41.
  - Fla. Stat. § 475.28.
  - Fla. Stat. § 475.31.
  - Fla. Stat. § 475.2801.
key: D
explanation: Under Fla. Stat. § 475.2801, the commission may adopt rules that include notices of
  noncompliance, giving it authority to issue such notices. The distractor Fla. Stat. § 475.28
  concerns rules of evidence in proceedings and does not grant rulemaking authority for notices of
  noncompliance.
