    Stat. § 475.620(2)"
  url: null
  quoted_text: Corporations, partnerships, firms, or groups which employ certified or licensed
    appraisers or registered trainee appraisers who provide appraisal reports, as defined by this
    part, may represent to the public and advertise that they offer appraisals performed by
    registered, licensed, or certified appraisers.
