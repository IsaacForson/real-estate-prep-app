stem: A Florida corporation employs a state-licensed residential appraiser to prepare appraisal
  reports for clients. The corporation wishes to advertise that it provides appraisal services
  performed by licensed appraisers. According to Florida Statute 475.620(2), which of the following
  is true?
options:
  - The corporation must obtain its own appraisal license before advertising any appraisal services.
  - The corporation may advertise that it offers appraisal services performed by licensed appraisers.
  - The corporation may not advertise appraisal services at all because corporations are ineligible
    for licensure.
  - The corporation may only advertise appraisal services if the licensed appraiser is also a
    partner in the corporation.
key: B
explanation: The statute expressly allows corporations that employ certified or licensed appraisers
  to represent to the public and advertise that they offer appraisals performed by those appraisers.
  Therefore, the corporation may advertise its services as described. The other options incorrectly
  impose licensing requirements on the corporation, add a partnership condition, or prohibit
  advertising altogether, which contradicts the statutory exemption.
citation:
  source: "### Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) — official Online Sunshine page,
