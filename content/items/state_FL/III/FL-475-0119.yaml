stem: A sales associate who has not completed the required postlicensure education prior to the
  first renewal after initial licensure wishes to continue practicing. According to Florida Statute
  475.17(3)(c), what is the status of her license?
options:
  - The license is suspended but can be reinstated after paying a fine
  - The license remains valid until the next renewal period
  - The license is considered null and void and must be reissued
  - The license is automatically converted to a broker license
