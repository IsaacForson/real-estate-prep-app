stem: A broker recorded a commission notice nine months ago and the owner remains obligated to pay
  the commission. According to Florida Statute 475.707(3), what must the broker do to extend the
  effectiveness of the recorded commission notice?
options:
  - The broker must record an extension notice within the last sixty days before expiration and
    deliver a copy to the closing agent, but need not mention the owner’s obligation, and must also
    send a copy of the extension notice to the owner via certified mail within fifteen days.
  - The broker must record an extension notice at any time before the expiration date and simply
    attach a copy of the original commission notice to it and must also file the extension notice
    with the Department of Business and Professional Regulation within five days of recording.
  - The broker must record an extension notice in the same public records within the last sixty days
    before the expiration date, reference the original commission notice, state that the owner
    remains obligated to pay the commission, and deliver a copy of the extension notice to the owner
    within ten days after recording it.
  - The broker must record an extension notice after the expiration date as long as the owner still
    owes the commission and notify the closing agent of the extension, provided the extension notice
    is notarized and includes the broker’s license number.
key: C
explanation: Florida Statute 475.707(3) requires the broker to record an extension notice in the
  same public records within the last 60 days before the commission notice expires, reference the
  original notice, state that the owner remains obligated to pay the commission, and deliver a copy
  of the extension notice to the owner within 10 days after recording. The option that matches this
  requirement is the one stating those steps; the other options either omit the obligation
  statement, misstate the timing, or direct the copy to the wrong party.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) — official Online Sunshine page,
    read via Internet Archive capture because leg.state.fl.us/flsenate.gov refused connections §
    475.707(3)
  url: null
  quoted_text: A commission notice recorded under this part expires 1 year after the date of
    recording, unless the owner remains obligated to pay a commission to the broker after the
    expiration date of the commission notice and the broker records an extension notice in the same
    public records within the last 60 days before such expiration date.
