stem: A developer who regularly builds and sells residential homes to the public employs licensed
  sales associates on a commission-only basis to show properties and negotiate sales. According to
  Florida Statute 475.011(2), is the developer exempt from licensing requirements for these sales?
options:
  - The developer is exempt from licensing requirements because they own the property and are not
    acting as a broker.
  - The developer is not exempt from licensing requirements because they employ agents paid
    commission strictly on a transactional basis to make sales to the public.
  - The developer is exempt from licensing requirements because the hired sales associates hold
    active real estate licenses.
  - The developer is not exempt from licensing requirements because they engage in the regular
    business of selling real property to the public.
key: B
explanation: The developer is not exempt because employing sales associates who are paid strictly on
  a transactional basis to sell to the public removes the owner‑seller exemption under 475.011(2).
  The exemption for an owner selling their own property does not apply when such agents are used.
  Therefore, the statement that the developer is exempt because they own the property is incorrect.
  The claim that the developer is exempt because the hired associates are licensed is also
  incorrect; licensing of the associates does not restore the exemption. Finally, the assertion that
  the developer is not exempt because they engage in the regular business of selling real property
  to the public misstates the rule; the regular business activity is relevant only insofar as it
  triggers the exception when transaction‑based agents are employed.
