stem: A Florida licensee moves to another state and does not notify the commission of the change in
  residency within 60 days. What is the consequence under Florida law?
options:
  - The licensee's failure to notify results in a violation of the license law subject to penalties
    in s. 475.25.
  - The licensee's failure to notify results in an automatic revocation of the license by the
    department.
  - The licensee's failure to notify results in a requirement to complete additional continuing
    education hours.
  - The licensee's failure to notify results in a fine of exactly $500 imposed by the commission.
key: A
explanation: The statute provides that failure to notify and comply with nonresident requirements is
  a violation of the license law subject to the penalties in s. 475.25. Automatic revocation,
  additional education, or a specific $500 fine are not mentioned as direct consequences for this
  failure.
