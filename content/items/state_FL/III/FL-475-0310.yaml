stem: A broker whose license has been involuntarily inactive for 18 months wishes to reactivate the
  license. According to Florida Statute 475.183, what is the minimum continuing education
  requirement the broker must satisfy to reactivate the license?
options:
  - No continuing education is required if the license is less than 2 years old
  - 14 hours of a commission-prescribed continuing education course
  - 12 classroom hours for each year the license was inactive
  - 28 hours of a commission-prescribed education course
key: D
explanation: Florida Statute 475.183(2)(a) provides that a licensee may reactivate a license that
  has been involuntarily inactive for more than 12 months but fewer than 24 months by satisfactorily
  completing 28 hours of a commission-prescribed education course. Since 18 months falls within this
  range, the 28-hour requirement applies. The 14-hour requirement applies to licenses inactive for
  12 months or less, and the 12-hour-per-year rule applies to voluntarily inactive licenses under
  Section 475.183(1).
