stem: A seller learns that a broker committed fraud in a transaction that took place 5 years ago.
  The seller files a claim for recovery from the Real Estate Recovery Fund today. Is the claim
  timely?
options:
  - Yes, because the claim is filed within two years of discovering the fraud.
  - No, because the claim is filed more than four years after the fraudulent act.
  - Yes, because the claim is filed within four years of the fraudulent act.
  - No, because the claim is filed more than two years after discovering the fraud.
key: B
explanation: Although the claim is filed within two years of discovery, the statute bars any claim
  made more than four years after the act. Since the act occurred five years ago, the claim is
  untimely. The option stating the claim is within four years of the act is incorrect because the
  period has expired.
