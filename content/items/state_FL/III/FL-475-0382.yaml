stem: A claimant files a lawsuit against a broker and sends notice to the Florida Real Estate
  Commission by certified mail two weeks after the lawsuit is filed. Later, the claimant realizes
  they never sent the notice. The commission reviews the claim and finds it otherwise valid. May the
  claim still be honored?
options:
  - Yes, because the commission may waive notice if the claim is otherwise valid.
  - No, because notice must be sent by certified mail when the action starts.
  - Yes, because notice is not required for any claim under the statute.
  - No, because the claimant failed to send notice before filing the lawsuit.
key: A
explanation: The statute provides that if no notice was given, the claim can still be honored when
  the commission deems it otherwise valid. Thus the commission may waive the notice requirement. The
  claim that notice is never required is false, and the claim that notice must be sent at
  commencement ignores the waiver provision.
