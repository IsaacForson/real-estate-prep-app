stem: A sales associate completes a prelicensure course but is absent for 9 classroom hours.
  According to Florida Statute 475.17(2)(a)1, what is the result regarding the notice of
  satisfactory completion?
options:
  - The notice of satisfactory completion is issued because the absences are within the allowed limit
  - The notice of satisfactory completion is not issued because absences exceed 8 classroom hours
  - The notice of satisfactory completion is issued only if the student passes the final exam
  - The notice of satisfactory completion is issued after the student completes a makeup session
key: B
explanation: The statute provides that notice of satisfactory completion shall not be issued if the
  student has absences in excess of 8 classroom hours. Since the associate missed 9 hours, the
  notice is withheld.
