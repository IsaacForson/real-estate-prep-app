stem: What is the maximum late renewal fee that the Florida Real Estate Commission may prescribe for
  an involuntarily inactive license?
options:
  - The commission may prescribe a late renewal fee of $150 per renewal period.
  - The commission may prescribe a late renewal fee of $50 per renewal period.
  - The commission may prescribe a late renewal fee of $100 per renewal period.
  - The commission may prescribe a late renewal fee of $75 per renewal period.
key: C
explanation: The statute explicitly states that the commission shall prescribe by rule a fee not to
  exceed $100 for the late renewal of an involuntarily inactive license. Therefore, $100 is the
  maximum allowable fee. The distractors propose higher or lower amounts that are not supported by
  the text.
