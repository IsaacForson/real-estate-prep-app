stem: Under Florida Statute 475.483(1)(c), what is the maximum time allowed to file a claim for
  recovery from the Real Estate Recovery Fund after the act giving rise to the claim?
options:
  - Three years from act or discovery, not exceeding five years from act.
  - Two years from act or discovery, not exceeding four years from act.
  - Two years from act only, not exceeding four years from act.
  - Two years from discovery only, not exceeding four years from act.
key: B
explanation: The statute allows a claim to be filed within two years of the act or its discovery,
  but in no event may a claim be made more than four years after the act. Therefore the outer limit
  is four years from the act. The other options either omit the four‑year cap or misstate the
  trigger.
