stem: Under Florida Statute 475.182, what is the minimum number of classroom hours of continuing
  education a licensee must complete during each biennium of a license period to renew an active
  license?
options:
  - 12 classroom hours
  - 14 classroom hours
  - 28 classroom hours
  - 30 classroom hours
key: B
explanation: Florida Statute 475.182(1)(a) explicitly states that the renewal application must
  include proof that the licensee has satisfactorily completed at least 14 classroom hours of a
  continuing education course during each biennium of a license period. The 12-hour figure applies
  to the maximum annual requirement for renewing a voluntarily inactive license under Section
  475.183(1), and the 28-hour figure applies to reactivating an involuntarily inactive license that
  has been inactive for more than 12 months but fewer than 24 months under Section 475.183(2)(a).
