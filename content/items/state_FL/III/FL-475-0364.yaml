stem: A broker maintains a registered office outside Florida and fails to comply with a department
  request for documents during an investigation. What is the consequence under Florida law?
options:
  - The broker's failure to comply results in a requirement to attend a mandatory continuing
    education course.
  - The broker's failure to comply results in a fine of exactly $250 imposed by the commission.
  - The broker's failure to comply results in a violation of the license law subject to the
    penalties in s. 475.25.
  - The broker's failure to comply results in an automatic suspension of the broker’s license for 30
    days.
key: C
explanation: The law states that if a broker with an out‑of‑state office fails to substantially
  comply with a department request for documents or to appear for an interview, the failure is a
  violation of the license law subject to the penalties of s. 475.25. Automatic suspension,
  mandatory education, or a set $250 fine are not prescribed for this specific failure.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) — official Online Sunshine page,
    read via Internet Archive capture because leg.state.fl.us/flsenate.gov refused connections §
    475.22(2)
  url: null
  quoted_text: If the department sends, by certified mail to the broker at the broker’s last known
    business address as registered with the department, a notice or request to produce any documents
    or to appear for an interview with an authorized representative of the department and the broker
    fails to substantially comply with that request or notice, then such failure by the broker is a
    violation of the license law, subject to the penalties of s. 475.25.
