stem: Under Florida Statute 475.705(2), what must the broker swear or affirm under penalty of
  perjury in a commission notice?
options:
  - The broker must swear or affirm that the broker has obtained the owner’s written confirmation
    that the commission is payable as stipulated in the brokerage agreement between the parties and
    has filed such confirmation with the closing agent prior to disbursement of the owner’s net
    proceeds.
  - The broker must swear or affirm that the broker has executed and delivered to the closing agent
    a sworn affidavit stating that the missed delivery was solely because the owner entered into the
    contract without the broker’s knowledge, provided the owner has not yet received any net
    proceeds from the transaction.
  - The broker must swear or affirm that the broker has delivered a copy of the commission notice to
    the owner only before the closing agent disburses the owner’s net proceeds and must also notify
    the closing agent of the delivery within three days after the closing.
  - The broker must swear or affirm that the broker has read the commission notice, knows its
    contents and believes the same to be true and correct, and that the broker is making this
    commission claim pursuant to the written brokerage commission agreement described in the notice.
key: D
explanation: Under Fla. Stat. §475.705(2), the broker must swear or affirm that they have read the
  commission notice, know its contents, believe it to be true and correct, and are making the claim
  pursuant to the written brokerage agreement described in the notice. The statement that the broker
  has executed and delivered a sworn affidavit to the closing agent about a missed delivery due to
  the owner contracting without the broker’s knowledge is not required.
