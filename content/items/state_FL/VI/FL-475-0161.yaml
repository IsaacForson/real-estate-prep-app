stem: According to Fla. Stat. § 475.483(1)(c), what is the maximum number of years after the act
  giving rise to the claim that a claim for recovery may be filed?
options:
  - 1 year
  - 2 years
  - 3 years
  - 4 years
key: D
explanation: The statute provides that a claim must be made within two years of the act or its
  discovery, but in no event may a claim be filed more than four years after the act giving rise to
  the claim. Therefore the absolute outer limit is four years. The two‑year option is incorrect
  because it ignores the four‑year ceiling that applies when the act is discovered later than two
  years after it occurred.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) — official Online Sunshine page,
