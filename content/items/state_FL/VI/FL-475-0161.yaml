    475.483(1)(c)
  url: null
  quoted_text: A claim for recovery is made within 2 years from the time of the act giving rise to the
    claim or within 2 years from the time the act is discovered or should have been discovered with
    the exercise of due diligence. In no event may a claim for recovery be made more than 4 years
    after the date of the act giving rise to the claim.
