stem: An applicant completed a real‑estate pre‑licensing course in Georgia and is under
  investigation there for alleged fraud that would violate Florida’s real‑estate statutes. The
  investigation has concluded and any disciplinary proceedings have been terminated. Under Florida
  Statute § 475.25(3), what is the department’s authority regarding issuing a Florida license to
  this applicant?
options:
  - The department may issue the license immediately because the investigation occurred outside
    Florida.
  - The department may issue the license because the investigation is complete and disciplinary
    proceedings have been terminated.
  - The department may not issue the license until the applicant completes additional
    Florida‑specific education.
  - The department may not issue the license because any out‑of‑state investigation permanently bars
    licensure.
key: B
explanation: Section 475.25(3) states that the department may not issue a license while an
  out‑of‑state investigation for a violation of this part or chapter 455 is pending, but the
  prohibition ends once the investigation is complete and disciplinary proceedings have been
  terminated. Therefore, after those conditions are met, the department may issue the license. The
  option stating that the department may not issue the license until the applicant completes
  additional Florida‑specific education incorrectly adds an education requirement not found in the
  statute.
