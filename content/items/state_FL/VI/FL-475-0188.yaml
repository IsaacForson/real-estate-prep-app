stem: A licensee who signs a false affidavit intended for use as evidence before the Florida Real
  Estate Commission violates which provision of Fla. Stat. § 475.42(1)?
options:
  - Engaging in submitting a false affidavit for commission evidence
  - Engaging in recording a deed known to be false to affect title
  - Engaging in operating as a broker without a valid license
  - Engaging in employing a sales associate who lacks a license
key: A
explanation: Paragraph (f) of subsection (1) prohibits making any false affidavit or affirmation
  intended for use as evidence before the commission. The other options describe violations covered
  by different paragraphs, such as operating without a license (a) or employing an unlicensed
  associate (c).
