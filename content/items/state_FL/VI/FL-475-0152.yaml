stem: Which of the following individuals is exempt from licensing requirements under Fla. Stat. §
  475.011?
options:
  - A broker who advertises rental property information to the public online.
  - A person who sells timeshare periods for compensation to the public daily.
  - An owner who sells his own real property but employs a licensed agent paid a commission on each
    transaction regularly.
  - A salaried employee of an owner who works in an onsite rental office of an apartment community
    in a leasing capacity.
key: D
explanation: Fla. Stat. § 475.011(4) exempts any salaried employee of an owner who works in an
  onsite rental office of an apartment community in a leasing capacity. The other options describe
  activities that require a real estate license because they involve selling or leasing real
  property for compensation.
citation:
  source: Fla. Stat. § 475.011(4)
  url: null
  quoted_text: Any salaried employee of an owner, or of a registered broker for an owner, of an
    apartment community who works in an onsite rental office of the apartment community in a leasing
    capacity.
