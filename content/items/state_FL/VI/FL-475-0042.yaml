stem: A sales associate’s license expires on June 30, 2025. The associate does not submit the
  renewal application or fee by that date. According to Florida Statute § 475.182(3), what is the
  status of the license after June 30, 2025?
options:
  - The license automatically becomes voluntarily inactive.
  - The license automatically reverts to involuntarily inactive status.
  - The license is void and must be re‑applied for as a new applicant.
  - The license remains active but incurs a late renewal fee.
key: B
explanation: According to Fla. Stat. § 475.182(3), a license that is not renewed by the end of its
  license period automatically reverts to involuntarily inactive status. It does not remain active
  with a late fee, it does not become voluntarily inactive, and it is not void requiring a new
  application.
