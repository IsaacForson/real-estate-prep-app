stem: A licensee obtained a final judgment of $75,000 against a sales associate for
  misrepresentation in a sale. The claimant had the sheriff execute a writ of execution, but no
  property could be levied, and an affidavit was filed showing that no personal or real property of
  the judgment debtor could be found. Which condition of eligibility for recovery from the Real
  Estate Recovery Fund does this satisfy?
options:
  - The claimant mailed notice to the commission by certified mail.
  - The claimant filed the claim within two years of discovering the act.
  - The claimant obtained a writ of execution and affirmed no assets.
  - The claimant is not the spouse of the judgment debtor.
key: C
explanation: Under Florida Statute 475.483(1)(d)1, eligibility requires that the claimant have
  caused a writ of execution to be issued and have executed an affidavit showing that no personal or
  real property of the judgment debtor liable to be levied can be found. The scenario satisfies both
  requirements, making the option stating that the claimant obtained a writ of execution and
  affirmed no assets the correct choice. The other options describe unrelated conditions such as
  timing of filing, relationship to the debtor, or notice mailing, which do not fulfill the
  execution-and-affidavit condition.
