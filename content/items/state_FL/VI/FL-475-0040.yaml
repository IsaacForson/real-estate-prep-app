stem: According to Florida Statute § 475.25(3), under what condition may the department **NOT**
  issue a license to an applicant?
options:
  - An applicant who is under investigation in Florida for any act that would violate this part or
    chapter 455, and the investigation remains active.
  - An applicant who is under investigation in another state for an act that would violate this part
    or chapter 455, and the investigation is ongoing.
  - An applicant who is under investigation in another state for a violation of federal antitrust
    law, and the case is still pending.
  - An applicant who is under investigation in another state for failure to pay renewal fees, and
    the matter is under review.
key: B
explanation: Section 475.25(3) states that the department may not issue a license to any applicant
  who is under investigation in any other state, territory, or foreign jurisdiction for conduct that
  would violate this part or chapter 455, and the investigation has not been completed.
  Consequently, the description of an applicant under investigation in another state for an act that
  would violate this part or chapter 455, with the investigation still ongoing, satisfies the
  statutory prohibition. The other statements involve a Florida investigation, a federal antitrust
  matter, or unpaid renewal fees, none of which trigger the restriction.
citation:
  source: Fla. Stat. § 475.25(3)
  url: null
  quoted_text: (3) The department may not issue a license to any applicant who is under investigation
    in any other state, territory, or jurisdiction of the United States or any foreign national
    jurisdiction for any act that would constitute a violation of this part or chapter 455 until
    such time as the investigation is complete and disciplinary proceedings have been terminated.
