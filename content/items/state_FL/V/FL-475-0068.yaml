stem: A broker sets up a temporary shelter on a subdivision site so sales associates can protect
  customers from the weather, and no transactions are closed there. How does Rule 61J2-10.023,
  F.A.C., treat this shelter?
options:
  - It is deemed a branch office because customers visit the location
  - It is deemed a branch office once a single transaction is discussed there
  - It is not deemed an office of any kind or subject to disclosure
  - It is not deemed a branch office because it is a mere temporary shelter
key: D
explanation: The rule states that a mere temporary shelter on a subdivision, used for the protection
  of salespersons and customers, where transactions are not closed and associates are not
  permanently assigned, is not deemed a branch office.
citation:
  source: Fla. Admin. Code Rule 61J2-10.023
  url: null
  quoted_text: A mere temporary shelter, on a subdivision being sold by the broker, for the protection
    of salespersons and customers and at which transactions are not closed and salespersons are not
    permanently assigned, is not deemed to be a branch office.
