stem: According to Florida Statutes, what is the definition of a 'covered transaction'?
options:
  - A consumer credit transaction secured by the consumer’s principal dwelling
  - A commercial loan secured by business property used for business operations
  - A lease agreement for residential property lasting one year
  - A cash purchase of real estate without financing made by an investor
key: A
explanation: The statute defines a covered transaction as a consumer credit transaction secured by
  the consumer’s principal dwelling. The other options describe different types of transactions that
  do not meet both elements of the definition.
