stem: A Florida broker closed a branch office six months ago and now wants to reopen that same
  office during the same license period. Under Rule 61J2-10.023, what must the broker do?
options:
  - Apply to the Department to reopen the office, paying no additional registration fee
  - Notify the Department by phone to reopen the office, paying a reduced registration fee
  - Register the office as an entirely new branch office, paying the full registration fee again
  - Register the office as a temporary shelter, paying no registration fee at all
key: A
explanation: Rule 61J2-10.023, F.A.C. lets a broker reopen a previously closed branch office at any
  time during the same license period by applying to the Department, without paying a new
  registration fee.
