stem: Closing occurs on June 20. By what date must the owner notify the closing agent to dispute the
  commission, or else be deemed to have confirmed it?
options:
  - June 25
  - June 24
  - June 26
  - June 23
key: A
explanation: The warning on the commission notice states that an owner must notify the closing agent
  of a dispute no later than five days after the closing. Five days after June 20 is June 25, so
  that is the final day to preserve the right to dispute. The distractor “June 24” falls one day
  short of the five‑day period and would therefore be insufficient.
