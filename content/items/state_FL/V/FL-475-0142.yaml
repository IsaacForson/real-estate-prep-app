stem: Under Florida Statutes, when a broker charges a fee for providing a rental information list to
  a prospective tenant, what must the contract or receipt include?
options:
  - A provision for repayment of any amount over 50 percent of the fee if the tenant does not obtain
    a rental
  - A provision for repayment of any amount over 25 percent of the fee if the tenant does not obtain
    a rental
  - A provision for repayment of any amount over 10 percent of the fee if the tenant does not obtain
    a rental
  - A provision for repayment of the entire fee if the tenant does not obtain a rental
key: B
explanation: The statute requires that the contract or receipt include a provision for repayment of
  any amount over 25 percent of the fee if the tenant does not obtain a rental. Full repayment of
  the fee is required only when the rental information list is not current or accurate in any
  material respect.
citation:
  source: Fla. Stat. § 475.453(1)
  url: null
  quoted_text: Each broker or sales associate who furnishes a rental information list to a prospective
    tenant, for a fee paid by the prospective tenant, shall provide such prospective tenant with a
    contract or receipt, which contract or receipt contains a provision for the repayment of any
    amount over 25 percent of the fee to the prospective tenant if the prospective tenant does not
    obtain a rental.
