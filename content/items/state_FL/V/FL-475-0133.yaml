stem: Under Florida Statutes, what is the maximum amount a property management firm may pay to an
  unlicensed tenant as a finder's fee for referring a prospective lessee without violating the
  license law?
options:
  - $50
  - $25
  - $100
  - $75
key: A
explanation: The statute expressly allows a property management firm or apartment‑complex owner to
  pay a finder’s fee to an unlicensed tenant as long as the fee does not exceed $50 per transaction.
  Any amount above that limit violates the licensing requirement. The $25 distractor is under the
  limit but not the maximum allowed, and the $75 and $100 distractors exceed the statutory cap.
citation:
  source: Fla. Stat. ch. 475 § 475.01(13)
  url: null
  quoted_text: Any property management firm or any owner of an apartment complex for the act of paying
    a finder’s fee or referral fee to an unlicensed person who is a tenant in such apartment complex
    provided the value of the fee does not exceed $50 per transaction.
