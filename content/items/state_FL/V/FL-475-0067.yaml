stem: A broker who already operates one registered office wants to open a second location where
  business will be conducted. What must the broker do under Rule 61J2-10.023, F.A.C.?
options:
  - File the additional office address with the local zoning board
  - Wait until the first office closes before opening the additional location
  - Register the additional office as a branch office and pay the fee
  - Notify the seller's attorney that a second office has opened for business
key: C
explanation: The rule requires that each additional office from which a broker conducts business be
  registered as a branch office with the fee paid for its registration.
