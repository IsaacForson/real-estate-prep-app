stem: A Florida licensee enters into a listing agreement with a seller on Monday. When must the
  single agent disclosure be provided to the seller?
options:
  - After the listing agreement is signed but before the first property showing
  - At the time the listing agreement is signed
  - After the first property showing has been completed
  - Within three business days after the listing agreement is signed
key: B
explanation: The law requires the single‑agent disclosure to be made before, or at the time of,
  entering into a listing agreement. Therefore the disclosure must be provided at the moment the
  agreement is signed. Providing it after signing, even before a showing, does not satisfy the
  'before or at the time of' requirement.
