stem: A licensee performs a valuation of a property for a transaction that does not require an
  appraisal under federal regulations, and the valuation qualifies for an exemption. Under Fla.
  Stat. § 475.611(1)(q), how is this valuation classified?
options:
  - The valuation is classified as an appraisal
  - The valuation is classified as a market analysis
  - The valuation is classified as an evaluation
  - The valuation is classified as a broker price opinion
key: C
explanation: The statute defines an evaluation as a valuation permitted by federal agency
  regulations for transactions that do not require an appraisal and that qualify for a federal
  exemption. An appraisal requires an appraisal, while a broker price opinion and market analysis
  are not defined in this section.
