stem: A Florida broker's license period ends on June 30. The broker fails to submit a renewal
  application by that date. Under Florida Statutes, when does the license become involuntarily
  inactive?
options:
  - Ninety days after expiration
  - When notice of renewal is mailed
  - On the license expiration date
  - Sixty days after expiration
key: C
explanation: The statute states that any license not renewed at the end of the license period shall
  automatically revert to involuntarily inactive status. Thus the license becomes involuntarily
  inactive as of the expiration date, June 30. The distractor suggesting sixty days after confuses
  the renewal notice period with the reversion timing.
