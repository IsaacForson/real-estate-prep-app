stem: A real estate team advertises using its team name in 24-point font while the brokerage's name
  appears in 12-point font on the same ad. Under Rule 61J2-10.026, what is wrong with this
  advertisement?
options:
  - The team name appears in smaller print than the registered brokerage's name
  - The team name appears in the same print size as the registered brokerage's name
  - The team name appears in a different font style than the registered brokerage's name
  - The team name appears in larger print than the registered brokerage's name
key: D
explanation: Rule 61J2-10.026, F.A.C. prohibits a team or group name from being printed larger than
  the name of the registered brokerage in any advertisement.
