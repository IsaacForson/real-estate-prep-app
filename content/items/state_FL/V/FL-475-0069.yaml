stem: A sales associate adds the initials of a well-known real estate association to her business
  cards, although the association never granted her permission to use its name. What does Rule
  61J2-10.027, F.A.C., say about this?
options:
  - No licensee may use an association's designation without being entitled
  - A licensee may use a designation once the association is notified by mail
  - A licensee may use a designation if clients are told it is decorative
  - A licensee may use any designation once the brokerage name also appears
key: A
explanation: The rule prohibits a licensee from using an identification or designation of any
  association or organization related to real estate unless the licensee is entitled to use it.
