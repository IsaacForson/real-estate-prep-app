stem: A Florida sales associate personally receives a buyer's earnest money check on Tuesday. Under
  Rule 61J2-14.009, by when must the sales associate deliver that deposit to the broker?
options:
  - No later than the end of the following calendar month after receipt of the deposit
  - No later than the end of the same calendar week the deposit was received
  - No later than the end of the next business day following receipt of the deposit
  - No later than the end of the third business day following receipt of the deposit
key: C
explanation: Rule 61J2-14.009, F.A.C. requires a sales associate who personally receives a deposit
  to turn it over to the broker or employer no later than the end of the next business day.
citation:
  source: Fla. Admin. Code Rule 61J2-14.009
  url: null
  quoted_text: Every sales associate who receives any deposit, as defined in Rule 61J2-14.008, F.A.C.,
    shall deliver the same to the broker or employer no later than the end of the next business day
    following receipt of the item to be deposited. Saturday, Sundays and legal holidays shall not be
    construed as business days.
