stem: A Florida real estate licensee fails, for the first time, to notify the Department of Business
  and Professional Regulation of a change in mailing address. Under Rule 61J2-10.038, what is the
  result?
options:
  - The Department revokes the license for the first-time violation
  - The Department issues a Citation for the first-time violation
  - The Department suspends the license for the first-time violation
  - The Department imposes a monetary fine for the first-time violation
key: B
explanation: Rule 61J2-10.038, F.A.C. provides that a licensee's first failure to timely report a
  change of mailing or e-mail address results in a Citation, with discipline reserved for repeat
  violations.
