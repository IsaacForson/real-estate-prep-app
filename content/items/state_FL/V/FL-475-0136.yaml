stem: A homeowner sells their own single-family residence without employing any agent or paying a
  commission. Under Florida Statutes, is the homeowner required to hold a real estate license?
options:
  - Yes, because any sale of real property requires a license and must be conducted through a
    licensed broker.
  - No, because the homeowner is exempt when selling their own real property unless they hire a
    commissioned agent.
  - Yes, unless the property is valued under $100,000, in which case a license is still required.
  - No, but only if the homeowner is also a licensed broker and the sale is conducted through their
    brokerage.
key: B
explanation: Under Fla. Stat. § 475.011(2), an owner selling their own real property is exempt from
  licensing unless they employ a commissioned agent. The statement that any sale requires a license
  ignores this exemption. Introducing a value threshold for the exemption is not supported by the
  statute. Adding a condition that the homeowner must be a licensed broker or use a brokerage also
  contradicts the exemption.
