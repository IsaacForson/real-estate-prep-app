stem: On March 10, a licensee receives a notice of noncompliance for failing to provide a course
  completion report. Under Rule 61J2-24.003, F.A.C., by what date must the licensee comply to avoid
  a citation?
options:
  - March 25
  - March 28
  - March 20
  - March 22
key: A
explanation: The rule allows 15 days for compliance starting from receipt of the notice; adding 15
  days to March 10 yields March 25. The distractor March 20 mistakenly uses a 10‑day period, which
  applies to mailing‑address updates, not to compliance after a notice of noncompliance.
