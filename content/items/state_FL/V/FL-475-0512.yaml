  url: null
  quoted_text: The DBPR shall allow 15 days for compliance with the statute and rule and shall so
    notify the licensee, registrant or permitholder. The time for compliance shall begin to run from
    the time the licensee, registrant or permitholder receives the notice of noncompliance.
