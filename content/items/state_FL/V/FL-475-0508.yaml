stem: A sales associate who lives in Georgia but holds a Florida real estate license does not notify
  the Florida Real Estate Commission of her change to nonresident status for 70 days. Under Florida
  Statutes, what is the consequence of this failure to notify?
options:
  - The sales associate has committed a violation of the license law.
  - The sales associate must pay a one hundred dollar fine.
  - The sales associate’s license is automatically revoked.
  - The sales associate must complete additional continuing education.
key: A
explanation: The statute states that failure to notify the commission of a change to nonresident
  status within sixty days is a violation of the license law, subject to penalties. The distractor
  claiming automatic revocation is incorrect because the statute only declares a violation;
  revocation would require further disciplinary action.
