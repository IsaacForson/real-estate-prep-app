stem: A Florida sales associate’s license has been involuntarily inactive for 18 months. How many
  hours of commission‑prescribed continuing education must the sales associate complete to
  reactivate the license?
options:
  - 14 hours
  - 0 hours
  - 56 hours
  - 28 hours
key: D
explanation: For an involuntarily inactive license lasting more than 12 months but fewer than 24
  months, the statute requires 28 hours of continuing education for reactivation. Since 18 months
  falls in that range, 28 hours is correct. The distractor 14 hours applies only to inactivity of 12
  months or less.
