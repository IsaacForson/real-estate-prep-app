stem: A broker and a buyer execute a residential loan alternative agreement on January 1. Listing
  services do not begin until April 2 of the same year. What is the legal status of the agreement
  under Florida Statutes?
options:
  - The agreement remains valid because listing services eventually began.
  - The agreement is void because listing services did not begin within 90 days after execution.
  - The agreement is void only if the parties mutually agree to terminate.
  - The agreement is enforceable because the parties can still perform.
key: B
explanation: The law provides that a residential loan alternative agreement is void if listing
  services do not begin within 90 days after the agreement is executed by both parties. Since
  listing services started on day 92, the condition for voidance is met, making the agreement void.
  The claim that the agreement remains valid because listing services eventually began is incorrect
  because eventual commencement does not cure the defect.
