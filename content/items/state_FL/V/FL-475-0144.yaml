stem: A Florida broker pays a fine imposed by the commission for a license law violation. Under
  Florida Statutes, what happens to the money from that fine?
options:
  - Returned to the broker as a credit toward future license fees
  - Deposited into the state's general revenue fund
  - Transferred into the Real Estate Recovery Fund
  - Retained by the commission to cover administrative costs
key: C
explanation: All fines collected by the commission must be transferred into the Real Estate Recovery
  Fund, as required by Florida Statutes § 475.482(4). The money is not returned to the broker as a
  credit toward future license fees.
