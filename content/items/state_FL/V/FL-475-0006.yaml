stem: Under Florida Administrative Code Rule 61J2-10.027, when may a real estate licensee use the
  name or logo of a real estate association?
options:
  - Only when the licensee is entitled to use that association's name
  - Only when the licensee pays an annual fee to the Florida Real Estate Commission
  - Only when the licensee's broker approves the use in a written brokerage policy
  - Only when the licensee discloses the use to the buyer or seller in writing
key: A
explanation: Rule 61J2-10.027, F.A.C. bars a licensee from using a real estate association's
  identification or designation unless the licensee is actually entitled to use it.
citation:
  source: Fla. Admin. Code Rule 61J2-10.027
  url: null
  quoted_text: No licensee shall use an identification or designation of any association or
    organization having to do with real estate unless entitled to use such identification or
    designation.
