stem: A broker's license is suspended by an order of the Florida Real Estate Commission. What
  happens to the licenses of sales associates registered with that broker under Florida Statutes?
options:
  - The sales associates' licenses remain active unless the broker terminates their employment.
  - The sales associates' licenses are automatically terminated.
  - The sales associates' licenses become involuntarily inactive.
  - The sales associates' licenses must be renewed within 30 days to stay active.
key: C
explanation: The statute provides that an order revoking or suspending a broker's license
  automatically causes the licenses of all sales associates registered with that broker to become
  involuntarily inactive while the broker's license is inoperative. The sales associates' licenses
  become involuntarily inactive, which matches the description that the licenses become
  involuntarily inactive. The alternative stating that the licenses are automatically terminated is
  incorrect because the licenses are not terminated but placed in an involuntarily inactive status.
citation:
  source: Fla. Stat. ch. 475 § 475.31(1)
  url: null
  quoted_text: An order revoking or suspending the license of a broker shall automatically cause the
    licenses of all sales associates and broker associates registered with the broker, and, if a
    partnership or corporation, of all members, officers, and directors thereof to become
    involuntarily inactive, while the license of the broker is inoperative or until new employment
    or connection is secured.
