stem: A brokerage posts a listing on its website and lists a phone number as the point of contact.
  Where must the brokerage firm name appear relative to that phone number under Rule 61J2-10.025,
  F.A.C.?
options:
  - In the website's footer, regardless of where contact information is shown
  - Inside a separate disclosure page linked from the listing
  - Anywhere on the website, as long as it appears once per page
  - Adjacent to, or above or below, the point of contact information
key: D
explanation: When advertising on an Internet site, the rule requires the brokerage firm name to be
  placed adjacent to or immediately above or below the point of contact information.
citation:
  source: Fla. Admin. Code Rule 61J2-10.025
  url: null
  quoted_text: When advertising on a site on the Internet, the brokerage firm name as required in
    subsection (1), above, shall be placed adjacent to or immediately above or below the point of
    contact information.
