stem: According to Florida Statutes, what must appear on a broker's office entrance sign at a minimum?
options:
  - The sign must include the words “licensed real estate broker” or “lic. real estate broker”.
  - The sign must display the broker’s current telephone number and email address.
  - The sign must show the broker’s active license number and expiration date.
  - The sign must list the broker’s street address and office hours.
key: A
explanation: The statute explicitly states that at a minimum, the words “licensed real estate
  broker” or “lic. real estate broker” must appear on office entrance signs. The distractor about
  telephone number and email is incorrect because the statute does not require contact information
  on the sign.
