stem: The Florida Department of Business and Professional Regulation discovers that a broker whose
  license has been suspended is still conducting real estate transactions. Under Florida Statutes,
  what action may the department take?
options:
  - The department may require the broker to complete additional continuing education courses.
  - The department may bring a civil action in circuit court to enjoin the broker from continuing
    the violation.
  - The department may impose a fine of up to $5,000 per violation.
  - The department may immediately revoke the broker's license without further hearing.
key: B
explanation: "Under Florida Statutes ch. 475 § 475.5017(1), the department may bring a civil action
  in circuit court to enjoin a broker from engaging in or continuing a violation. Therefore the
  correct answer is the option stating that the department may bring a civil action in circuit court
  to enjoin the broker from continuing the violation. The other options are incorrect: the statute
  does not authorize requiring additional continuing education, imposing a fine of up to $5,000 per
  violation, or immediate revocation without a hearing."
