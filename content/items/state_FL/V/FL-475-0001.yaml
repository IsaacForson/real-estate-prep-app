stem: Under Florida Administrative Code Rule 61J2-10.022, where may a broker locate the brokerage's
  required office?
options:
  - In a shared coworking location, without displaying any required broker's sign
  - In a vacant land location, provided a zoning exemption is filed annually
  - In a commercial location, even where local zoning ordinances forbid it
  - In a residential location, unless local zoning ordinances forbid it
key: D
explanation: Rule 61J2-10.022, F.A.C. allows the required brokerage office to be a residence as long
  as local zoning does not forbid it and the minimum office and sign requirements are still met.
