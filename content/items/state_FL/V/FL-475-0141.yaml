key: A
explanation: The statute prohibits advertising that is fraudulent, false, deceptive, or misleading
  in form or content (Fla. Stat. § 475.25(1)(c)). Describing an old, leaking roof as new is a false
  or misleading statement. The distractor labeling it as permissible puffery is incorrect because
  puffery does not cover false statements of fact.
