stem: "A Florida licensee advertises a home as having a new roof when the roof is actually 15 years
  old and leaking. Under Florida Statutes, this advertisement is considered:"
options:
  - It is a false or misleading advertisement
  - It is considered permissible puffery
  - It is a fraudulent misrepresentation
