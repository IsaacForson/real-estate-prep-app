stem: A Florida broker receives an earnest money deposit from a buyer on Monday. Under Rule
  61J2-14.008, by when must the broker place the deposit in escrow if Saturdays, Sundays, and
  holidays are excluded as business days?
options:
  - By the end of the fifth business day following receipt of the deposit
  - By the end of the third business day following receipt of the deposit
  - By the end of the same business day the deposit was received
  - By the end of the first business day following receipt of the deposit
key: B
explanation: Rule 61J2-14.008, F.A.C. defines 'immediately' for escrow purposes as no later than the
  end of the third business day after the broker receives the deposit.
citation:
  source: Fla. Admin. Code Rule 61J2-14.008
  url: null
  quoted_text: “Immediately” means the placement of a deposit in an escrow account no later than the
    end of the third business day following receipt of the item to be deposited. Saturdays, Sundays
    and legal holidays shall not be considered as business days.
