stem: Under Florida Statutes, within how many days after a commission is earned must a broker
  deliver a copy of the commission notice to the owner and closing agent, assuming the delivery
  occurs at **LEAST** one day before closing?
options:
  - 10 days
  - 15 days
  - 20 days
  - 30 days
key: C
explanation: The statute requires the broker to deliver the copy within 30 days after the commission
  is earned and at least one day before closing. Therefore, the correct interval is 30 days. The
  distractor “20 days” incorrectly shortens the period, which does not satisfy the statutory window.
