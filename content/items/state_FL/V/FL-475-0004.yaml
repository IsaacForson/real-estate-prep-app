stem: A Florida sales associate places a print advertisement for a listing that includes only her
  own name and phone number. Under Rule 61J2-10.025, what has she failed to do?
options:
  - Include the licensed name of the multiple listing service in the advertisement
  - Include the licensed name of the buyer's lender in the advertisement
  - Include the licensed name of the brokerage firm in the advertisement
  - Include the licensed name of the local Realtor association in the advertisement
key: C
explanation: Rule 61J2-10.025, F.A.C. requires every real estate advertisement to include the
  licensed name of the brokerage firm so consumers know they are dealing with a real estate
  licensee.
