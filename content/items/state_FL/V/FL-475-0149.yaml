stem: In which of the following situations may a Florida broker designate sales associates to act as
  single agents for different customers in the same transaction?
options:
  - A commercial sale where the buyer and seller each have assets of $1,000,000
  - A residential sale where the buyer and seller each have assets of $500,000
  - A commercial sale where the buyer and seller each have assets of $500,000
  - A residential sale where the buyer and seller each have assets of $2,000,000
key: A
explanation: The statute permits designation only in non‑residential transactions where both parties
  have assets of $1 million or more. The option describing a commercial sale where the buyer and
  seller each have assets of $1,000,000 satisfies both conditions. The residential‑sale options do
  not meet the non‑residential requirement, and the commercial sale with assets of $500,000 does not
  meet the asset threshold.
