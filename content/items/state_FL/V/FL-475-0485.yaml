stem: What is the minimum asset threshold that each party must meet for a broker to designate sales
  associates as single agents in a non‑residential transaction?
options:
  - $500,000
  - $750,000
  - $1,000,000
  - $2,000,000
key: C
explanation: The statute permits designation of sales associates as single agents only when the
  buyer and seller each have assets of $1 million or more. Therefore the threshold is $1,000,000.
  The $500,000 figure is below the statutory requirement.
