stem: A broker wants to keep a small cushion of brokerage funds in each escrow account to absorb
  bank service charges. Under Rule 61J2-14.010, F.A.C., how should the broker evaluate the amounts
  kept in a sales escrow account versus a property management escrow account?
options:
  - The sales account cap is higher than the property management account cap
  - The sales account cap is lower than the property management account cap
  - Neither account type is subject to a cap on personal funds
  - Both account types share one identical, unchanging cap
key: B
explanation: The rule permits a broker to keep up to $1,000 of personal or brokerage funds in a
  sales escrow account, but up to $5,000 in a property management escrow account, so the sales
  account limit is the lower of the two.
