stem: Under Florida Statutes, what is the legal status of disclosed dual agency for a real estate
  licensee?
options:
  - It is expressly revoked under the statute
  - It is permitted with written consent from both parties
  - It is a required disclosure statement
  - It is allowed in commercial transactions
key: A
explanation: The statute expressly revokes disclosed dual agency as an authorized form of
  representation (Fla. Stat. § 475.272(1)). Therefore, a licensee may not act as a disclosed dual
  agent even with consent. The distractor that suggests it is permitted with written consent is
  incorrect because the revocation applies regardless of agreement.
