stem: Under Florida Statutes, what is the maximum annual registration fee that a broker must pay for
  a branch office?
options:
  - $50.00
  - $25.00
  - $75.00
  - $100.00
key: A
explanation: The statute provides that the annual registration fee for a branch office is prescribed
  by the commission in an amount not exceeding $50. Therefore $50.00 is the highest permissible
  amount. The distractor $75.00 incorrectly assumes a higher cap that does not exist in the law.
