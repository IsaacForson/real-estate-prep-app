stem: A salaried employee of an apartment community works in the onsite rental office and arranges
  leases for units for periods of eight months. Under Florida Statutes, is this employee required to
  have a real estate license?
options:
  - No, but only if the leases are for periods longer than one year, which would remove the
    exemption.
  - Yes, because leasing activity requires a license, even for salaried employees of an apartment
    community.
  - Yes, unless the employee receives additional commission beyond their salary, which would require
    licensure.
  - No, because the employee is exempt when working in an onsite rental office for an apartment
    community.
key: D
explanation: Under Fla. Stat. § 475.011(4), a salaried employee of an apartment community who works
  in the onsite rental office in a leasing capacity is exempt from licensure. Therefore the correct
  answer is the option stating that the employee is exempt when working in an onsite rental office
  for an apartment community. The other options are incorrect because they either impose a
  lease‑length condition, claim licensing is always required, or tie exemption to commission.
citation:
