stem: A broker intends to deposit escrow funds into an interest-bearing account and plans to
  allocate the earned interest to the buyer without consulting the other parties. According to Rule
  61J2-14.014, what is required for this action to be permissible?
options:
  - Obtain written permission from all parties to the transaction.
  - Obtain written permission from the broker's supervising broker.
  - Obtain written permission from the buyer only.
  - Obtain written permission from the seller only.
key: A
explanation: The rule mandates that placing escrow monies in an interest-bearing account,
  designating the interest recipient, and setting the disbursement time must be done with the
  written permission of all parties to the transaction. Permission from only one party or the
  supervising broker does not satisfy this requirement.
