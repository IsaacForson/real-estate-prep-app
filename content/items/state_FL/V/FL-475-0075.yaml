stem: A broker wants to place escrow funds in an interest-bearing account and decide, on her own,
  which party will receive the earned interest. Under Rule 61J2-14.014, F.A.C., why does this plan
  fall short?
options:
  - It needs the closing agent's approval instead of the broker's
  - It needs approval from the party who will receive the interest
  - It needs written permission from every party in the deal
  - It needs no permission because the broker holds full discretion
key: C
explanation: The rule requires that placing escrow funds in an interest-bearing account, along with
  designating who receives the interest, be done with the written permission of all the parties to
  the transaction, not by the broker's unilateral decision.
citation:
  source: Fla. Admin. Code Rule 61J2-14.014
  url: null
  quoted_text: The placement of escrow monies in an interest-bearing account, designation of the party
    who is to receive the interest, and the time the earned interest must be disbursed, must be done
    with the written permission of all the parties to the transaction.
