stem: A Florida sales associate, acting as the buyer's agent, receives an earnest money check from
  the buyer under a purchase contract that requires the purchaser to deposit the earnest money in an
  escrow account. What must the sales associate do with the check?
options:
  - The sales associate should deposit it in an escrow account
  - The sales associate should hold it in their personal account until closing
  - The sales associate should give it to the seller immediately
  - The sales associate should return it to the buyer
key: A
explanation: When a licensee receives earnest money on behalf of a buyer under a contract that
  requires the purchaser to place deposit money in escrow, the licensee must deposit the money in an
  escrow account. Holding the check in a personal account violates this duty under Fla. Stat. §
  475.25(1)(d)2.
