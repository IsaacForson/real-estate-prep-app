stem: A Florida broker wants to keep an operating cushion of personal brokerage funds inside a
  single escrow account used for property management deposits. Under Rule 61J2-14.010, what is the
  maximum amount of personal or brokerage funds the broker may keep in that account?
options:
  - Personal or brokerage funds may not exceed $2,500 per escrow account
  - Personal or brokerage funds may not exceed $1,000 per escrow account
  - Personal or brokerage funds may not exceed $10,000 per escrow account
  - Personal or brokerage funds may not exceed $5,000 per escrow account
key: D
explanation: Rule 61J2-14.010, F.A.C. caps personal or brokerage funds kept in any escrow account at
  $5,000, regardless of the type of escrow account involved.
