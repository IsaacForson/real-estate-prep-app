stem: Under Florida Statutes, how long must a broker retain legible copies of books, accounts, and
  records pertaining to her or his real estate brokerage business when funds have been entrusted to
  the broker?
options:
  - The broker must retain records for five years from the date of receipt of the entrusted funds.
  - The broker must retain records for five years from the date of execution of the listing
    agreement.
  - The broker must retain records for two years after the conclusion of any related civil action.
  - The broker must retain records indefinitely as long as the broker remains licensed.
key: A
explanation: The statute requires brokers to keep legible records for at least five years from the
  date of receipt of any money, fund, deposit, check, or draft entrusted to the broker. The correct
  answer states that records must be retained for five years from the date of receipt of entrusted
  funds. The answer stating that records must be retained for five years from the date of execution
  of the listing agreement is incorrect because the five‑year period runs from receipt of funds, not
  from the date of the listing agreement.
