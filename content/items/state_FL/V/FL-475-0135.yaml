stem: According to Florida Statutes, which statement correctly defines a transaction broker?
options:
  - A broker who must obtain written consent from both parties before showing any property to a
    client.
  - A broker who acts as a facilitator and may share confidential information with either party, but
    owes no loyalty.
  - A broker who provides limited representation to a buyer, seller, or both, without fiduciary duty
    to either party.
  - A broker who represents both parties as a fiduciary in a single transaction, owing loyalty to
    each.
key: C
explanation: The definition of transaction broker in Fla. Stat. § 475.01(l) states that the broker
  provides limited representation to a buyer, a seller, or both, without fiduciary duty to either
  party. This matches the option describing a broker who provides limited representation to a buyer,
  seller, or both, without fiduciary duty to either party. The option describing a broker who must
  obtain written consent before showing property describes a single‑agent relationship, which
  involves fiduciary duties and is not a transaction broker.
citation:
