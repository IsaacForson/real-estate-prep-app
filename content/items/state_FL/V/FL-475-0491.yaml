stem: A homebuyer takes out a mortgage loan to purchase their primary residence, with the loan
  secured by the dwelling. Under Fla. Stat. § 475.611(1)(n), is this transaction considered a
  covered transaction?
options:
  - The transaction is a covered transaction because it is a consumer credit transaction secured by
    the consumer's principal dwelling
  - The transaction is not a covered transaction because it is a commercial loan secured by business
    property
  - The transaction is not a covered transaction because the loan is not secured by the dwelling
  - The transaction is a covered transaction because any real estate loan qualifies
key: A
explanation: "The loan meets both criteria: it is a consumer credit transaction and it is secured by
  the buyer’s principal dwelling, satisfying the statutory definition. The option stating that any
  real estate loan qualifies is incorrect because the definition requires a consumer credit
  transaction secured by the principal dwelling, not any loan."
