stem: A broker receives a request from a buyer and seller, each with assets above the statutory
  threshold, to designate sales associates in a commercial office building sale. What must the buyer
  and seller sign?
options:
  - A consent to dual agency representation in the transaction for both parties
  - A disclosure stating assets meet threshold and requesting designated sales associate form
  - A written agreement to pay double the usual commission for the sale in the transaction
  - A notice of transition to transaction broker relationship for the parties in the transaction
key: B
explanation: When assets exceed $1 million in a non‑residential transaction, Florida law requires
  the buyer and seller to sign disclosures confirming that their assets meet the threshold and
  requesting the designated sales associate form of representation. Dual agency consent is
  prohibited because the designated sales associate arrangement precludes dual agency. An agreement
  to pay double commission is not required by law. A notice of transition to transaction broker
  relationship is unrelated to the designated sales associate request.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) — official Online Sunshine page,
    read via Internet Archive capture because leg.state.fl.us/flsenate.gov refused connections §
    475.2755(1)
  url: null
  quoted_text: In addition to disclosure requirements in s. 475.278(3)(b) and (c), the buyer and
    seller as customers shall both sign disclosures stating that their assets meet the threshold
    described in this subsection and requesting that the broker use the designated sales associate
    form of representation.
