stem: Under Florida Statute 475.25(1)(t), what is prohibited for a real estate licensee who performs
  a comparative market analysis, broker price opinion, or opinion of value in the ordinary course of
  business?
options:
  - Referring to the analysis as an appraisal
  - Charging a reasonable fee for the analysis
  - Sharing the analysis with a third party
  - Using the analysis to establish a listing price
key: A
explanation: The statute explicitly states that a comparative market analysis, broker price opinion,
  or opinion of value may not be referred to as an appraisal. Charging a fee, sharing the analysis,
  or using it to set a price are not prohibited by this provision.
