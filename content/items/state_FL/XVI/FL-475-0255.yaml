stem: A real estate sales associate offers to perform market valuations for clients without holding
  an appraiser license. Based on the legislative purpose in Fla. Stat. § 475.610, why does the law
  require licensure for such activities?
options:
  - Ensuring practitioners meet competency standards
  - Reducing the number of appraisal complaints
  - Increasing revenue for the state government
  - Protecting the public welfare from unqualified practice
key: D
explanation: The statute’s purpose is to regulate appraisers in the interest of the public welfare,
  so licensure aims to protect the public from unqualified practice. The option stating that the
  purpose is to increase revenue for the state government is not supported by the statute.
