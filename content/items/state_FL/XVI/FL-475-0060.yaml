stem: A Florida broker provides an opinion of value to a buyer in the ordinary course of business.
  Which statement is correct under Florida Statute 475.611?
options:
  - The broker may refer to the opinion of value as an appraisal if the buyer consents in writing.
  - The broker may not refer to the opinion of value as an appraisal under any circumstance.
  - The broker may refer to the opinion of value as an appraisal after disclosing that it is not a
    formal appraisal.
  - The broker may refer to the opinion of value as an appraisal if the broker also holds a
    certified appraiser license.
key: B
explanation: The statute states that in no event may a comparative market analysis, broker price
  opinion, or opinion of value be referred to as an appraisal. This prohibition applies regardless
  of buyer consent, additional licensure, or disclosure.
