stem: A consumer hires an unlicensed individual to prepare an appraisal report. According to the
  legislative purpose in Fla. Stat. § 475.610, what is the primary concern that the regulation seeks
  to address?
options:
  - Increasing oversight of appraisal practice
  - Reducing risks associated with appraisals
  - Ensuring consumer financial protection
  - Protecting public welfare from harm
key: D
explanation: The statute declares that regulation is necessary in the interest of public welfare, so
  the primary concern is protecting public welfare from harm. The option about consumer financial
  protection does not match this purpose.
