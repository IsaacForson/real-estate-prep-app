stem: What is the legislative purpose behind Florida’s regulation of real estate appraisers as
  stated in Fla. Stat. § 475.610?
options:
  - Increasing state tax revenue from appraisal fees
  - Protecting the public welfare through regulation
  - Expanding the number of licensed appraisers
  - Reducing licensing costs for appraisers
key: B
explanation: The statute states that regulation is necessary in the interest of the public welfare,
  so the option stating that the purpose is to protect the public welfare through regulation is
  correct. The option claiming the purpose is to increase state tax revenue from appraisal fees is
  incorrect because the statute does not mention tax revenue as a purpose.
