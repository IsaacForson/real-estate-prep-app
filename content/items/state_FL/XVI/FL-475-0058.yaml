stem: According to Florida Statute 475.611, what is prohibited regarding a comparative market
  analysis, broker price opinion, or opinion of value?
options:
  - It may be referred to as an appraisal if the licensee also holds a certified appraiser license.
  - It may be referred to as an appraisal when disclosed to the client as an estimate of value.
  - It may be referred to as an appraisal after obtaining written consent from the client for the
    transaction.
  - It must not be referred to as an appraisal under any circumstance, even if the client requests
    it.
key: D
explanation: The statute explicitly states that a comparative market analysis, broker price opinion,
  or opinion of value may not be referred to as an appraisal under any circumstance. The most
  tempting distractor suggests an exception if disclosed to the client, but the statute provides no
  such exception.
citation:
  source: Fla. Stat. § 475.611
  url: null
  quoted_text: However, in no event may this comparative market analysis, broker price opinion, or
    opinion of value of real estate be referred to as an appraisal, as defined in s. 475.611.
