stem: A Florida sales associate prepares a comparative market analysis for a seller and includes the
  heading 'Market Appraisal' in the report. Which statement is correct under Florida Statute
  475.611?
options:
  - The licensee must change the heading to avoid using the term 'appraisal' in the document.
  - The licensee may keep the heading if the broker price opinion is provided free of charge.
  - The licensee may keep the heading if the broker also holds a certified appraiser license.
  - The licensee may keep the heading if the buyer is informed the document is not an appraisal.
key: A
explanation: The statute prohibits referring to a comparative market analysis as an appraisal, with
  no exceptions for licensure, disclosure, or lack of charge. Therefore the heading must be changed
  to avoid using the term 'appraisal'.
citation:
  source: Fla. Stat. § 475.611
  url: null
  quoted_text: However, in no event may this comparative market analysis, broker price opinion, or
    opinion of value of real estate be referred to as an appraisal, as defined in s. 475.611.
