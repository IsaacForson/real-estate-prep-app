stem: A person oversees an appraiser panel of 18 state-certified appraisers within Florida and
  coordinates appraisal services for compensation. Under Florida law, does this person qualify as an
  appraisal management company?
options:
  - The person does not qualify as an appraisal management company because the statute requires
    oversight of 25 or more appraisers in two or more states, and overseeing fewer than 25 in a
    single state is insufficient.
  - The person does not qualify as an appraisal management company because only licensed real estate
    brokers may perform appraisal management services under Florida law.
  - The person qualifies as an appraisal management company because they oversee more than 15
    state-certified appraisers in a single state and perform appraisal management services for
    compensation.
  - The person qualifies as an appraisal management company only if they also hold a certified
    appraiser license, which is not required by the definition.
key: C
explanation: Under subsection 475.611(c), an appraisal management company is defined as a person who
  oversees more than 15 state‑certified or state‑licensed appraisers in a state (or 25 or more in
  two or more states) and performs appraisal management services. The scenario meets the first
  threshold, so the person qualifies. The statement that the person does not qualify because the
  statute requires oversight of 25 or more appraisers in two or more states is incorrect because the
  single‑state threshold of more than 15 is sufficient. The claim that only licensed real estate
  brokers may perform appraisal management services adds a requirement that the definition does not
  contain. The assertion that the person qualifies only if they also hold a certified appraiser
  license imposes an extra certification requirement that the definition does not include.
citation:
