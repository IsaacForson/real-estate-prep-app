    475.611(c)
  url: null
  quoted_text: '"Appraisal management company" means a person who, within a 12‑month period, oversees
    an appraiser panel of more than 15 state‑certified or state‑licensed appraisers in a state, or
    25 or more state‑certified or state‑licensed appraisers in two or more states, and who performs
    appraisal management services regardless of the use of the term "appraisal management company,"
    "appraiser cooperative," "appraiser portal," "mortgage technology company," or other term.'
