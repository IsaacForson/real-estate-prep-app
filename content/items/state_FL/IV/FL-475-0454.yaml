stem: An individual who is not a licensed appraiser performs appraisals of a railroad terminal
  company using the unit-rule method for ad valorem tax purposes. The individual receives
  compensation for this service. According to Florida law, is the individual exempt from the real
  estate licensing requirement?
options:
  - Exemption under subsection (9) of § 475.01
  - Exemption under subsection (10) of § 475.01
  - Exemption under subsection (11) of § 475.01
  - Exemption under subsection (13) of § 475.01
key: B
explanation: The individual's activity falls under subsection (10), which exempts anyone who
  appraises a railroad or railroad terminal company using the unit-rule method for ad valorem tax
  purposes, regardless of licensing status. The exemption under subsection (9) requires the person
  to be a registered or licensed appraiser under part II, which the individual is not, so it does
  not apply.
