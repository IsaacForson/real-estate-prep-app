stem: Under Florida law, what is the maximum amount of personal or brokerage funds a broker may
  place in a property management escrow account?
options:
  - $5,000.
  - $1,000.
  - $2,500.
  - $10,000.
key: A
explanation: The statute explicitly allows a broker to place and maintain up to $5,000 of personal
  or brokerage funds in the broker’s property management escrow account. The $1,000 figure applies
  only to the sales escrow account, not the property management account.
citation:
  source: Fla. Stat. § 475.25(1)(k)
  url: null
  quoted_text: A broker may place and maintain up to $5,000 of personal or brokerage funds in the
    broker’s property management escrow account and up to $1,000 of personal or brokerage funds in
    the broker’s sales escrow account.
