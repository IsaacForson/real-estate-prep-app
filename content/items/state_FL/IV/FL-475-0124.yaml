stem: A broker submits an initial application for a real estate license and pays the required
  examination fee. What is the maximum amount the broker could be charged for the initial
  application and examination under Florida law?
options:
  - The broker may be charged up to $100 for the combined application and examination fees.
  - The broker may be charged up to $75 for the combined application and examination fees.
  - The broker may be charged up to $150 for the combined application and examination fees.
  - The broker may be charged up to $50 for the combined application and examination fees.
key: A
explanation: Florida statute provides that the fee for initial application and examination may not
  exceed $100. Therefore, the option stating that the broker may be charged up to $100 for the
  combined fees is correct. The options stating up to $75, $150, and $50 are incorrect because they
  either fall below or exceed the statutory maximum.
