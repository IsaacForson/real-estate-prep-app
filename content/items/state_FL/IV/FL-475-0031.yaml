stem: Under Florida law, what occurs to the licenses of sales associates registered with a broker
  when the broker's license is revoked or suspended?
options:
  - The licenses remain active until reemployment
  - The licenses must be renewed within thirty days
  - The licenses are transferred to another broker
  - The licenses become involuntarily inactive
key: D
explanation: Under 475.31(1), an order revoking or suspending a broker's license automatically
  causes the licenses of all sales associates and broker associates registered with the broker to
  become involuntarily inactive while the broker's license is inoperative or until new employment is
  secured.
citation:
  source: Fla. Stat. § 475.31(1)
  url: null
  quoted_text: An order revoking or suspending the license of a broker shall automatically cause the
    licenses of all sales associates and broker associates registered with the broker, and, if a
    partnership or corporation, of all members, officers, and directors thereof to become
    involuntarily inactive, while the license of the broker is inoperative or until new employment
    or connection is secured.
