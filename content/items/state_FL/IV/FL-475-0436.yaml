  url: null
  quoted_text: If a proceeding to enforce a transferred lien is not commenced within the time
    specified in s. 475.809 or if it appears that the transferred lien has been satisfied of record,
    the clerk shall return said security upon request of the person depositing or filing the same,
    or the insurer.
