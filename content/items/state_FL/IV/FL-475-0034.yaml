stem: According to Florida Statutes, how is a transaction broker defined?
options:
  - A broker who provides limited representation to a buyer, a seller, or both, in a real estate
    transaction, but does not represent either in a fiduciary capacity or as a single agent.
  - A broker who represents, as a fiduciary, either the buyer or seller but not both solely in the
    same transaction.
  - A broker who acts under the direction, control, or management of another person while performing
    any act specified in the definition of 'broker'.
  - A broker who is qualified to be issued a license as a broker but who operates as a sales
    associate in the employ of another.
key: A
explanation: According to Florida Statutes § 475.01(1)(l), a transaction broker is a broker who
  provides limited representation to a buyer, a seller, or both, in a real estate transaction, but
  does not represent either party in a fiduciary capacity or as a single agent. Therefore the option
  that states this definition is correct. An option that says the broker represents either the buyer
  or seller as a fiduciary but not both describes a single agent, which is not a transaction broker.
