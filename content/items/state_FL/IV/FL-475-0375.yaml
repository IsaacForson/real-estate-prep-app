stem: A sales associate wants to earn continuing education credit by attending a legal agenda
  session of the Florida Real Estate Commission. According to Florida law, what must the sales
  associate do to receive credit for attending the session?
options:
  - Notify the division at least 7 days in advance of intent to attend
  - Pay a fee to the commission for each hour of attendance
  - Complete a written examination at a centralized location after the session
  - Attend the session as a party to a disciplinary action to qualify for credit
key: A
explanation: The rule states that the commission may accept attendance at one legal agenda session
  as a substitute for 3 classroom hours of continuing education, but only if the licensee notifies
  the division at least 7 days in advance of intent to attend. Therefore, advance notification is
  required to obtain credit. The distractor about completing a written examination is incorrect
  because the commission may not require a written examination at a centralized location for
  continuing education credit.
citation:
  source: Fla. Stat. § 475.182(1)(b)
  url: null
  quoted_text: The commission may accept as a substitute for 3 classroom hours, one time per renewal
    cycle, attendance at one legal agenda session of the commission. In order to obtain credit, the
    licensee must notify the division at least 7 days in advance of his or her intent to attend.
