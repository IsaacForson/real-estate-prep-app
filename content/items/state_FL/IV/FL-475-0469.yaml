stem: Under Florida’s Commercial Real Estate Sales Commission Lien Act, when must a broker disclose
  to the owner that the broker may claim a lien against net proceeds from the disposition of
  commercial real estate?
options:
  - At or before the time the owner executes the brokerage agreement.
  - Only if the owner requests information about potential lien rights.
  - Within five days after the closing of the transaction.
  - After the brokerage agreement is signed but before any earnest money is deposited.
key: A
explanation: The statute requires the broker to disclose lien rights at or before the time the owner
  executes the brokerage agreement. The distractor suggesting disclosure after agreement signing but
  before earnest money deposit is incorrect because the timing is tied to execution of the
  agreement, not to deposit handling.
citation:
  source: Fla. Stat. § 475.703(5)
  url: null
  quoted_text: A broker shall disclose to the owner at or before the time the owner executes the
    brokerage agreement that this part creates lien rights for a commission earned by the broker
    that are not waivable before the commission is earned by the broker.
