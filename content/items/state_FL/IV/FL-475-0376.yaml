stem: A broker receives conflicting demands from two parties for trust funds held in the broker’s
  escrow account. According to Florida law and Commission rule, what is the broker’s first required
  action?
options:
  - Immediately disburse the funds to the party who made the first demand
  - Provide written notification to the Commission within 15 business days of the last party’s demand
  - Wait 30 business days before taking any action to see if the parties resolve the dispute
  - File a complaint with the local police department alleging fraud
key: B
explanation: The rule requires a broker who receives conflicting demands for trust funds to provide
  written notification to the Commission within 15 business days of the last party’s demand and to
  institute a settlement procedure within 30 business days after that demand. Thus, the first step
  is timely notification to the Commission. The distractor suggesting immediate disbursement is
  wrong because the broker must first notify the Commission and follow settlement procedures before
  releasing funds.
citation:
  source: Fla. Admin. Code § 61J2-10.032(1)(a)
  url: null
  quoted_text: A real estate broker, upon receiving conflicting demands for any trust funds being
    maintained in the broker’s escrow account, must provide written notification to the Commission
    within 15 business days of the last party’s demand and the broker must institute one of the
    settlement procedures as set forth in Section 475.25(1)(d)1., F.S., within 30 business days
    after the last demand.
