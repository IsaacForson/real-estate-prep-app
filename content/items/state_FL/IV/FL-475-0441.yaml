stem: Under Florida’s Commercial Real Estate Sales Commission Lien Act, what is the minimum period a
  commission notice must be recorded to constitute constructive notice to a closing agent?
options:
  - 30 days
  - 45 days
  - 60 days
  - 90 days
key: C
explanation: The recording of the commission notice shall not constitute constructive notice to a
  closing agent unless the commission notice has been of record for at least 60 days, per Fla. Stat.
  § 475.707(1)(b). The 30‑day distractor reflects the period for delivering the notice before
  closing, not the recording period for constructive notice.
