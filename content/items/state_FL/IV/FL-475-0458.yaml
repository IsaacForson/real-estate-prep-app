stem: Which of the following must be included in a commission notice under the Commercial Real
  Estate Sales Commission Lien Act?
options:
  - The buyer's email address and phone number
  - The broker's social security number and license number
  - The seller's phone number and email address
  - Name of the owner who is obligated to pay the commission
key: D
explanation: The commission notice must include the name of the owner who is obligated to pay the
  commission, as required by Florida Statutes § 475.705(2). The other items listed are not required
  in the notice.
