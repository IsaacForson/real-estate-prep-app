stem: A Florida broker receives a deposit check from a buyer and deposits it into the escrow
  account. According to Florida law, how long must the broker retain a legible copy of the brokerage
  business records relating to this transaction?
options:
  - Two years from the date of receipt of the money or from the date of execution of the agreement
  - Three years from the date of receipt of the money or from the date of execution of the agreement
  - Five years from the date of receipt of the money or from the date of execution of the agreement
  - Seven years from the date of receipt of the money or from the date of execution of the agreement
key: C
explanation: The correct answer is five years because the statute requires brokers to preserve
  legible copies of all brokerage business records for at least five years from the date of receipt
  of money or, if no funds are entrusted, from the date of execution of the agreement. The
  three‑year option is incorrect because it understates the statutory retention period; the rule
  explicitly sets a five‑year minimum, not three. The seven‑year option exceeds the required period
  and is not mandated by law.
citation:
  source: Fla. Stat. § 475.5015
  url: null
  quoted_text: Each broker shall preserve at least one legible copy of all books, accounts, and
    records pertaining to her or his real estate brokerage business for at least 5 years from the
    date of receipt of any money, fund, deposit, check, or draft entrusted to the broker
