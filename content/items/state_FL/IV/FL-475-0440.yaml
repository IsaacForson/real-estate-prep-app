stem: After a court finally reverses and sets aside an order that denied a license applicant’s
  application, what effect does the reversal have on the allegations made in the original
  information?
options:
  - The allegations are automatically deemed proven and the license is granted.
  - The applicant must submit a new application to have the allegations considered.
  - The allegations shall not be reexamined in any other proceeding concerning the licensure of the
    applicant.
  - The allegations may be reexamined in a later proceeding concerning the applicant’s licensure.
key: C
explanation: The statute provides that if an order denying a license or taking disciplinary action
  is finally reversed and set aside, the matters and things alleged in the information shall not
  thereafter be reexamined in any other proceeding concerning the licensure of the defendant (Fla.
  Stat. § 475.37). Therefore, the allegations cannot be raised again in a later licensure
  proceeding. The other answer choices are incorrect because they suggest the allegations are
  automatically proven, require a new application, or may be reexamined, which contradicts the
  statutory prohibition.
