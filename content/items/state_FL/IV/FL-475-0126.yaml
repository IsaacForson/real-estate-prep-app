stem: According to Florida Statutes, what is a transaction broker?
options:
  - A broker who represents either the buyer or seller as a fiduciary in a single agency
    relationship and owes loyalty to that client.
  - A broker who provides limited representation to a buyer, a seller, or both, without representing
    either in a fiduciary capacity or as a single agent.
  - A broker who acts as a trustee for a trust created under chapter 689 and manages trust property
    for beneficiaries.
  - A broker who is qualified to be issued a license as a broker but operates as a sales associate
    in the employ of another and receives compensation from the employing broker.
key: B
explanation: Under Fla. Stat. § 475.01(1)(l), a transaction broker is a broker who provides limited
  representation to a buyer, a seller, or both, without representing either in a fiduciary capacity
  or as a single agent. The description that a broker represents either the buyer or seller as a
  fiduciary in a single agency relationship describes a single agent, which is not the definition of
  a transaction broker.
