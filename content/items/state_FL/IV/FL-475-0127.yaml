stem: According to Florida Statutes, what is the limitation on the exemption for colleges,
  universities, community colleges, and career centers regarding real estate practice courses?
options:
  - The exemption applies only to courses offered by such institutions that are taught by licensed
    brokers.
  - The exemption applies only to transferable college credit courses offered by such institutions.
  - The exemption applies only to courses offered by such institutions that are approved by the
    commission.
  - The exemption applies only to non‑credit continuing education courses offered by such
    institutions.
key: B
explanation: Under Fla. Stat. § 475.451(1), the exemption for colleges, universities, community
  colleges, and career centers applies only to transferable college‑credit courses offered by those
  institutions. Consequently, the exemption does not cover non‑credit continuing education courses,
  courses that require commission approval, or courses taught exclusively by licensed brokers.
