stem: Maria owns a single-family home and decides to sell it. She hires a licensed broker and agrees
  to pay a commission upon sale. Under Florida law, is Maria exempt from the licensing requirement
  for selling her own property?
options:
  - She is exempt as long as she does not pay any additional compensation beyond the broker's fee.
  - She is not exempt because she employed a broker and agreed to pay a commission.
  - She is not exempt because owners are generally not exempt from licensing requirements.
  - She is exempt from the licensing requirement because she is the owner selling her own property.
key: B
explanation: Under Florida law, the exemption for owners selling their own property does not apply
  when the owner employs a broker who is paid a commission. Since Maria hired a broker and agreed to
  pay a commission, she is not exempt. See § 475.011(2).
