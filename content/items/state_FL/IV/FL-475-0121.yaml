stem: Maria, a Florida-licensed sales associate, relocates her permanent residence to Alabama and
  continues to work remotely for her Florida broker. According to Florida law, within how many days
  must Maria notify the commission of her change in residency?
options:
  - Within 30 days.
  - Within 45 days.
  - Within 60 days.
  - Within 90 days.
key: C
explanation: Florida law requires a resident licensee who becomes a nonresident to notify the
  commission within 60 days of the change in residency. Therefore the correct response is the one
  stating 60 days. The other options give different time periods that do not match the statutory
  requirement.
