stem: A property management company pays a $40 referral fee to a current tenant for introducing a
  prospective lessee to an available apartment unit. The fee is paid as a credit toward rent.
  According to Florida law, is this payment exempt from the real estate licensing requirement?
options:
  - Exemption under subsection (13) of § 475.01
  - Exemption under subsection (11) of § 475.01
  - Exemption under subsection (10) of § 475.01
  - Exemption under subsection (9) of § 475.01
key: A
explanation: Under Florida law, a property management company may pay a referral fee to an
  unlicensed tenant without needing a real estate license if the fee is a finder’s fee not exceeding
  $50 per transaction. This exemption is provided in subsection (13) of § 475.01 of the Florida
  Statutes. Since the $40 fee is below the $50 limit, the payment is exempt.
citation:
  source: Fla. Stat. § 475.01(13)
  url: null
  quoted_text: Any property management firm or any owner of an apartment complex for the act of paying
    a finder’s fee or referral fee to an unlicensed person who is a tenant in such apartment complex
    provided the value of the fee does not exceed $50 per transaction.
