stem: According to Florida Statutes, what is the deadline for a sales associate to complete the
  required postlicensure education to keep the license valid?
options:
  - Within twelve months after passing the state examination
  - Within the period before the first renewal following initial licensure
  - Within thirty days after beginning active practice or employment
  - Within six months after initial licensure or state exam
key: B
explanation: The statute provides that a sales associate’s license becomes null and void if the
  postlicensure education is not completed prior to the first renewal following initial licensure.
  Therefore, completing the education before that first renewal keeps the license active. The
  six‑month hardship extension only applies when the licensee cannot complete the education due to
  physical hardship, not as a default deadline.
citation:
