stem: A broker changes her business address from Miami to Orlando. Under Florida law, within how
  many days must she notify the commission of this change?
options:
  - Within 10 days.
  - Within 20 days.
  - Within 15 days.
  - Within 5 days.
key: A
explanation: The statute requires a licensee to notify the commission of a change of business
  address no later than 10 days after the change. Therefore the option stating 'Within 10 days.' is
  correct. The option stating 'Within 5 days.' is incorrect because the rule sets a 10‑day deadline,
  not 5 days.
