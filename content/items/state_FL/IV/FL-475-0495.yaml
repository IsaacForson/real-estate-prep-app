stem: A licensee signs a residential loan alternative agreement with a buyer on January 1. Listing
  services commence on April 5 of the same year. Under Florida law, what is the effect on the
  agreement?
options:
  - The agreement remains valid because services began within 90 days.
  - The agreement is void because services began after 90 days.
  - The agreement is enforceable only if recorded in public records.
  - The agreement may be assigned to another party.
key: B
explanation: The law states that a residential loan alternative agreement is void if listing
  services do not begin within 90 days after execution. Since services began on April 5, which is 95
  days after January 1, the requirement was not met and the agreement is void. The other options
  either incorrectly state the agreement remains valid, add unrelated conditions, or suggest
  assignability, which is prohibited by subsection (3).
citation:
  source: Fla. Stat. § 475.25(4)
  url: null
  quoted_text: A residential loan alternative agreement is void if listing services do not begin
    within 90 days after the execution of the agreement by both parties.
