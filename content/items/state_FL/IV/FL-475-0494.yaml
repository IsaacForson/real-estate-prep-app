stem: Under Florida law, what must a person have in order to operate as a broker or sales associate?
options:
  - Membership in a local Realtor association.
  - Completion of a 63‑hour pre‑licensing course.
  - A valid and current active license.
  - A high school diploma or equivalent.
key: C
explanation: The statute declares that a person may not operate as a broker or sales associate
  without holding a valid and current active license. Therefore, possessing such a license is
  required to engage in brokerage activities. The other options describe qualifications that are not
  mandated by law for operating as a broker or sales associate.
