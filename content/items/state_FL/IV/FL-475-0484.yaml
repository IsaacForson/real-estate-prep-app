stem: A broker records a commission notice 45 days before the closing of a commercial real estate
  transaction. Under Florida Statutes, does this recording constitute constructive notice to the
  closing agent?
options:
  - The recording constitutes constructive notice to the closing agent because it was recorded
    before closing.
  - The recording constitutes constructive notice to the closing agent only if the closing agent has
    actual knowledge.
  - The recording does not constitute constructive notice to the closing agent because it has been
    recorded for less than 60 days.
  - The recording constitutes constructive notice to the closing agent after the closing agent
    receives a copy of the notice.
key: C
explanation: Under Florida Statutes § 475.707(1)(b), a recorded commission notice does not give
  constructive notice unless it has been on record for at least 60 days. Because the notice was
  recorded only 45 days before closing, it does not meet the 60‑day requirement, so no constructive
  notice arises. The option stating that the recording gives notice because it was recorded before
  closing ignores the 60‑day threshold. The option claiming notice only if the closing agent has
  actual knowledge adds a condition not supported by the statute. The option saying notice arises
  after the closing agent receives a copy also introduces a requirement not found in the law.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) § 475.707(1)(b)
  url: null
  quoted_text: The recording of the commission notice shall not constitute constructive notice to a
    closing agent unless the commission notice has been of record for at least 60 days.
