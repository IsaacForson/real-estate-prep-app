stem: Under Florida law, after a final order of the Florida Real Estate Commission becomes final,
  what action may the commission take regarding the order and the parties' names and addresses?
options:
  - Publish the final order but must include the names and addresses of all parties.
  - Publish the final order and may choose to publish or withhold the names and addresses of parties.
  - Withhold the final order entirely unless the parties consent to publication.
  - Publish only the names and addresses of parties, not the final order itself.
key: B
explanation: The commission may publish and distribute its final orders and may decide whether to
  include or omit the names and addresses of the parties involved. Requiring that the names and
  addresses always be published is incorrect, as is stating that the order must be withheld unless
  the parties consent or that only the parties’ information may be published without the order. Fla.
  Stat. § 475.31(2) provides this authority.
citation:
  source: Fla. Stat. § 475.31(2)
  url: null
  quoted_text: The commission may publish and distribute in such manner and form as it may prescribe
    any of its final orders or decisions made under this chapter, after they become final by lapse
    of time or upon affirmance on appeal, or opinions of appellate courts for the guidance of
    registrants and the public; and it may publish or withhold from publication the names and
    addresses of any parties concerned.
