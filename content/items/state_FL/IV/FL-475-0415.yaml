stem: A broker earns a leasing commission under a brokerage agreement with the landlord of a
  commercial property. Where does the broker’s lien attach under Florida Statutes?
options:
  - The broker’s lien attaches to the landlord’s interest in the commercial real estate only,
    excluding the tenant’s leasehold
  - The broker’s lien attaches to both the landlord’s interest and the tenant’s leasehold estate in
    the leased premises
  - The broker’s lien attaches to neither the landlord’s interest nor the tenant’s leasehold estate
    in the leased premises
  - The broker’s lien attaches to the tenant’s leasehold estate only, excluding the landlord’s
    interest in the commercial real estate
key: A
explanation: When the owner obligated to pay the commission is the landlord, the statute provides
  that the broker’s lien attaches to the landlord’s interest in the commercial real estate
  identified in the agreement but not to the tenant’s leasehold estate. Therefore the lien is
  limited to the landlord’s interest only.
