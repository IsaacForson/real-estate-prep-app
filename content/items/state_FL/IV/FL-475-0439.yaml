stem: A licensee incurs expert witness fees during a disciplinary proceeding before the Florida Real
  Estate Commission. Under Florida law, what must occur for the commission to reimburse those fees?
options:
  - The licensee must pay the fees and cannot seek reimbursement under any circumstance.
  - The commission may pay the fees only if the licensee prevails in the proceeding.
  - The licensee must submit a voucher to the commission, which, if approved, will be audited and
    paid.
  - The commission must automatically advance the fees to the licensee upon request.
key: C
explanation: Under Florida Statute § 475.38, the commission is not required to advance fees or
  costs; however, if the commission is liable for fees or costs, the licensee must present a
  voucher, which, if approved, is audited and paid like other commission expenses. Therefore, the
  correct option describes the voucher submission and approval process. The option stating that the
  licensee must pay the fees and cannot seek reimbursement is incorrect because the statute allows
  reimbursement when the commission is liable. The option stating that payment occurs only if the
  licensee prevails is incorrect because liability for fees is not tied to prevailing in the
  proceeding. The option stating that the commission must automatically advance fees upon request is
  incorrect because the statute explicitly says the commission is not required to advance fees.
citation:
  source: Fla. Stat. § 475.38
  url: null
  quoted_text: The commission shall not be required to advance any fees or costs to any officer or
    witness, or to execute any bond in any proceeding in the courts, any general statute to the
    contrary notwithstanding, but in every case in which the commission is liable for any fees or
    costs, a voucher therefor shall be presented to the commission and, if approved, shall be
    audited and paid as are other expenses of the commission.
