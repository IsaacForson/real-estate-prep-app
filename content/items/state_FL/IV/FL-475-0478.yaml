stem: Maria worked as a real estate sales associate for six months in 2023 without a license. She
  submitted a license application in March 2024. According to Florida law, what is the likely
  outcome regarding her application?
options:
  - Her application will be approved because she has completed the required prelicensing course.
  - Her application may be disapproved because she acted as a sales associate without a license
    within the prior year.
  - Her application will be approved if she pays an administrative fine for the violation.
  - Her application will be delayed pending completion of a mandatory ethics course.
key: B
explanation: Under Fla. Stat. § 475.17(1)(b), an application may be disapproved if the applicant has
  acted as a broker or sales associate in violation of the chapter within the year prior to
  applying. Maria’s unlicensed activity occurred within the prior year, so her application may be
  disapproved. The other options suggest approval or conditions not provided by the statute for this
  violation.
citation:
  source: Fla. Stat. § 475.17(1)(b)
  url: null
  quoted_text: An application may be disapproved if the applicant has acted or attempted to act, or
    has held herself or himself out as entitled to act, during the period of 1 year next prior to
    the filing of the application, as a real estate broker or sales associate in the state in
    violation of this chapter.
