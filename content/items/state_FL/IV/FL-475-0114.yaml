stem: Under Florida law, if a final order denying a license or imposing disciplinary action is
  finally reversed and set aside, what happens to the licensee's rights and privileges?
options:
  - They are restored as of the date the mandate is filed.
  - They are restored only after completing additional education.
  - They are permanently revoked regardless of the reversal.
  - They are restored only if the licensee reapplies.
key: A
explanation: The statute provides that when an order denying a license or taking disciplinary action
  is finally reversed, the defendant shall be restored to her or his rights and privileges as of the
  date of filing the mandate with the commission. The other options add conditions or outcomes not
  supported by the text.
citation:
  source: Fla. Stat. § 475.37
  url: null
  quoted_text: If the order of the court or commission denying a license or taking any disciplinary
    action against a licensee is finally reversed and set aside, the defendant shall be restored to
    her or his rights and privileges as a broker or sales associate as of the date of filing the
    mandate or a copy thereof with the commission.
