  url: null
  quoted_text: The renewal application shall include proof that the permitholder has, since the
    issuance or renewal of the current permit, successfully completed a minimum of 7 classroom or
    distance learning hours of instruction in real estate subjects or instructional techniques, as
    prescribed by the commission.
