stem: A real estate school instructor completed 5 classroom hours of instruction in real estate
  subjects during the current permit period. According to Florida Statutes, what is required for the
  instructor to renew the permit?
options:
  - The instructor must complete two additional classroom hours of instruction in real estate
    subjects.
  - The instructor must retake and pass the instructor’s examination approved by the commission
    before renewal.
  - The instructor must submit proof of holding a bachelor’s degree in a business‑related subject
    before renewal.
  - The instructor must voluntarily inactive their broker license and notify the commission annually.
key: A
explanation: The statute requires proof of at least 7 classroom or distance learning hours of
  instruction in real estate subjects or instructional techniques for permit renewal. Having
  completed only 5 hours, the instructor needs 2 more hours to meet the minimum. Retaking the exam,
  submitting degree proof, or inactive broker status do not satisfy the hour requirement.
citation:
