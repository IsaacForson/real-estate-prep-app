stem: A Florida broker refers a client to a broker licensed in another country and pays a referral
  fee. The foreign broker’s conduct does not violate any Florida law. Under Florida law, is the
  referral fee permissible?
options:
  - The payment is permissible because the foreign broker does not violate any Florida law.
  - The payment is permissible only if the foreign broker is also licensed in Florida.
  - The payment is impermissible because referral fees to foreign brokers are prohibited.
  - The payment is impermissible because the fee must be paid to a Florida-licensed broker.
key: A
explanation: The statute permits a licensed broker to pay a referral fee to a foreign broker so long
  as the foreign broker does not violate any law of this state. Since the foreign broker’s conduct
  complies with Florida law, the payment is allowed. The distractor claiming prohibition is
  incorrect because the statute expressly authorizes such payments under the stated condition.
