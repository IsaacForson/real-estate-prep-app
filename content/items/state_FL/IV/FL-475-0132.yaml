stem: During a routine audit, an authorized agent of the Florida Department of Business and
  Professional Regulation arrives at a brokerage office to inspect records. According to Florida
  law, what authority does the agent have?
options:
  - May inspect only during business hours with prior notice of the brokerage.
  - May inspect only if given a court order for the inspection.
  - May inspect only if the broker consents to the inspection.
  - May inspect and audit at all reasonable hours of the brokerage.
key: D
explanation: The agent may inspect and audit at all reasonable hours of the brokerage because the
  statute grants authorized agents the power to inspect and audit any broker or brokerage office at
  all reasonable hours. The option limiting inspection to times when a court order is present
  incorrectly adds a requirement not found in the law.
citation:
  source: Fla. Stat. § 475.5016
  url: null
  quoted_text: Duly authorized agents and employees of the department shall have the power to inspect
    and audit in a lawful manner at all reasonable hours any broker or brokerage office licensed
    under this chapter, for the purpose of determining if any of the provisions of this chapter,
    chapter 455, or any rule promulgated under authority of either chapter is being violated.
