math:
  worked_solution: |-
    Amount claimed: $12,000
    Interest for 3 years at legal rate 5%: $12,000 × 0.05 × 3 = $1,800
    Greater of $1,000 or 25% of amount claimed: 25% × $12,000 = $3,000 (greater than $1,000)
    Total bond amount: $12,000 + $1,800 + $3,000 = $16,800
  formulas:
