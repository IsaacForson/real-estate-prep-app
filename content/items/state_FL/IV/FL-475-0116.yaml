stem: A broker hires an individual to work as a sales associate, but the individual has not yet
  obtained a sales associate license. Under Florida law, may the broker employ this person?
options:
  - The broker may employ the person if the individual holds a broker license instead.
  - The broker may not employ the person as a sales associate without a valid license.
  - The broker may employ the person if the individual agrees to obtain a license within 30 days.
  - The broker may employ the person as long as the individual works under supervision.
key: B
explanation: The statute prohibits a broker from employing or continuing to employ any person as a
  sales associate who is not the holder of a valid and current sales associate license. The
  exception allowing a broker to obtain a sales associate license by surrendering a broker license
  does not apply to an unlicensed individual. Therefore, employing an unlicensed person as a sales
  associate is not permitted.
citation:
  source: Fla. Stat. § 475.42(c)
  url: null
  quoted_text: A broker may not employ, or continue in employment, any person as a sales associate who
    is not the holder of a valid and current license as sales associate; but a license as sales
    associate may be issued to a person licensed as an active broker, upon request and surrender of
    the license as broker, without a fee in addition to that paid for the issuance of the broker’s
    active license.
