stem: Under Florida law, which of the following individuals is exempt from the real estate licensing
  requirement when acting solely as an attorney in fact for the purpose of executing contracts or
  conveyances?
options:
  - The individual is exempt as an attorney in fact for executing contracts or conveyances only
  - The individual is exempt only if also licensed as a broker
  - The individual is not exempt because any contract execution requires a license
  - The individual is exempt only when the transaction involves timeshare interests
key: A
explanation: The statute explicitly exempts any person acting as an attorney in fact solely for
  executing contracts or conveyances. The other options incorrectly add licensing requirements or
  unrelated conditions.
