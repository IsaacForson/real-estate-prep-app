stem: After a closing of a commercial real estate transaction, the owner and broker have not agreed
  in writing within five days regarding the release of disputed reserved proceeds that the closing
  agent has held. What must the closing agent do with those disputed reserved proceeds under Florida
  law?
options:
  - The closing agent must return the full disputed reserved proceeds to the owner and keep none for
    costs, fees, or charges.
  - The closing agent must release the disputed reserved proceeds to the broker immediately, without
    deducting any costs or fees.
  - The closing agent must deposit the net disputed reserved proceeds in the court registry after
    deducting costs, affidavit fees, and clerk charges.
  - The closing agent must place the disputed reserved proceeds in an escrow account and await a
    written agreement between the owner and broker.
key: C
explanation: Florida Statute § 475.711(2) requires that when the owner and broker do not reach a
  written agreement within five days after closing on disputed reserved proceeds, the closing agent
  must determine the net amount and deposit it in the court registry after deducting the agent’s
  costs, affidavit recording fees, and clerk service charges. Therefore, the statement that the
  closing agent must deposit the net disputed reserved proceeds in the court registry after
  deducting costs, affidavit fees, and clerk charges is the correct answer. The other choices are
  incorrect because they either require returning the full amount to the owner, releasing the funds
  to the broker without deductions, or holding the funds in escrow pending agreement, none of which
  comply with the statute.
