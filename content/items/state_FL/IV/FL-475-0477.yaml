stem: Under Florida law, what is the consequence for an applicant who has acted as a real estate
  broker or sales associate in violation of chapter 475 within the one-year period preceding the
  filing of a license application?
options:
  - The applicant must complete additional continuing education.
  - The applicant is automatically granted a provisional license.
  - The applicant must pay a fine of $500.
  - The application may be disapproved.
key: D
explanation: Under Fla. Stat. § 475.17(1)(b), an application may be disapproved if the applicant has
  acted as a broker or sales associate in violation of the chapter within the year prior to
  applying. The other options impose penalties or requirements not stated in the statute for this
  violation.
citation:
  source: Fla. Stat. § 475.17(1)(b)
  url: null
  quoted_text: An application may be disapproved if the applicant has acted or attempted to act, or
    has held herself or himself out as entitled to act, during the period of 1 year next prior to
    the filing of the application, as a real estate broker or sales associate in the state in
    violation of this chapter.
