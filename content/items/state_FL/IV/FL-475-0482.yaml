stem: Under Florida Statutes, who is responsible for delivering a copy of the commission notice to
  the closing agent before the closing of a commercial real estate transaction?
options:
  - The broker
  - The closing agent
  - The owner
  - The sales associate
key: A
explanation: The statute requires the broker to deliver a copy of the commission notice to the
  closing agent when the broker knows the closing agent’s identity, and to do so at least one day
  before closing. The closing agent has no duty to deliver the notice to itself, and the owner and
  sales associate are not assigned this duty.
citation:
  source: Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) § 475.705(3)
  url: null
  quoted_text: If the identity of the closing agent thereafter becomes known to the broker, then the
    broker shall deliver a copy of the commission notice to the closing agent within 3 days after
    the broker acquires such knowledge and at least 1 day before the closing.
