stem: An exchange company facilitates a like-kind exchange of investment property and also sells a
  parcel of land to a third party for cash. Under Florida law, does the exchange company need a real
  estate license for the land sale?
options:
  - The exchange company is exempt from licensing for the land sale if it registers with the FCC
  - The exchange company must hold a real estate license for the land sale because the exemption
    applies only to exchange program activities
  - The exchange company must hold a real estate license for the land sale only if the transaction
    exceeds $100,000
  - The exchange company is exempt from licensing for the land sale because it conducted an exchange
key: B
explanation: The exemption for exchange companies under Fla. Stat. ch. 475 § 475.011(8)(b) applies
  only to exchange program activities; a land sale for cash is not part of those activities, so a
  real estate license is required. The claim that the company is exempt if it registers with the FCC
  is incorrect because the exemption does not depend on FCC registration. The claim that a license
  is needed only if the sale price exceeds $100,000 is incorrect because licensing requirements are
  not based on a price threshold. The claim that the company is exempt because it conducted an
  exchange is incorrect because the exemption covers only exchange program activities, not separate
  land sales.
