stem: An appraiser submits an initial application and pays the examination fee. If the board later
  determines that the state is **NOT** entitled to the fees, what must happen to the fees?
options:
  - Be forfeited to the state fund
  - Be applied toward the next renewal
  - Be retained by the board for processing
  - Be refunded to the applicant
key: D
explanation: The statute mandates refund when the state is not entitled to fees. The distractor
  suggesting retention for processing contradicts the refund requirement.
citation:
  source: Fla. Stat. § 475.6147(2)
  url: null
  quoted_text: Application and certification, registration, and license fees shall be refunded upon a
    determination by the board that the state is not entitled to the fees or that only a portion of
    the resources have been expended in the processing of the application
