stem: Under Florida law, how many classroom hours of continuing education must a licensee complete
  each biennium to renew an active license?
options:
  - At least 16 classroom hours of 50 minutes each.
  - At least 14 classroom hours of 50 minutes each.
  - At least 12 classroom hours of 50 minutes each.
  - At least 10 classroom hours of 50 minutes each.
key: B
explanation: Florida law requires licensees to complete at least 14 classroom hours of 50‑minute
  continuing education each biennium to renew an active license (Fla. Stat. § 475.182(1)(a)).
  Therefore the option stating 'At least 14 classroom hours of 50 minutes each.' is correct. The
  option stating 'At least 12 classroom hours of 50 minutes each.' is incorrect because the rule
  specifies 14 hours, not 12.
