stem: A broker charges a prospective tenant $120 for a rental information list, and the tenant does
  not obtain a rental. Under Florida law, how much must the broker refund to the tenant?
options:
  - The broker must refund $30
  - The broker must refund $60
  - The broker must refund $90
  - The broker must refund $120
key: C
explanation: The rule requires repayment of any amount over 25 percent of the fee when the tenant
  does not obtain a rental; 25 percent of $120 is $30, so the refund is $120 − $30 = $90. Stating
  that the broker must refund $60 incorrectly assumes a 50 percent refund.
citation:
