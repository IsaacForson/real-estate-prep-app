stem: A licensee attempts to record a residential loan alternative agreement in the public records.
  Under Florida law, what is the result?
options:
  - The recording is prohibited and the agreement is unenforceable.
  - The recording is permitted and provides constructive notice to third parties.
  - The recording is allowed only if the broker consents in writing.
  - The recording is permitted but does not affect the agreement's enforceability.
key: A
explanation: The statute requires that a residential loan alternative agreement meet all
  requirements of the section or it is unenforceable; one requirement is that the agreement may not
  be recorded by the clerk. Attempting to record violates this requirement, rendering the agreement
  unenforceable. The other options incorrectly claim recording is permitted, allowed with broker
  consent, or has no effect on enforceability.
