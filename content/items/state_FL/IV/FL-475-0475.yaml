stem: An appraiser is convicted of a felony on March 1. According to Florida law, what is the last
  day she may notify the board in writing to satisfy the 30‑day notification requirement?
options:
  - April 01, 2025
  - April 15, 2025
  - March 31, 2025
  - May 01, 2025
key: C
explanation: The rule requires the appraiser to inform the board in writing within 30 days after a
  felony conviction. Counting 30 days from March 1 brings the deadline to March 31, so that date is
  correct. The April 01 option mistakenly adds an extra day, while the later dates exceed the
  statutory window.
