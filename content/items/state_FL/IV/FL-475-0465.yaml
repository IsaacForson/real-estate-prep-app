stem: A broker provides a seller with a comparative market analysis and advertises it as an
  "appraisal" in marketing materials. Under Florida law, how is this action treated?
options:
  - Not permitted because brokers are prohibited from offering any valuation services
  - Permitted because brokers may provide comparative market analyses
  - Permitted only if the broker also holds a licensed appraiser credential
  - Not permitted because the analysis cannot be referred to as an appraisal
key: D
explanation: The statute exempts brokers from licensure when they perform comparative market
  analyses, price opinions, or value opinions in the ordinary course of business, but it expressly
  prohibits referring to such analyses as appraisals. Therefore, advertising the analysis as an
  appraisal violates the rule. The distractor that claims the action is permitted because brokers
  may provide CMAs ignores this prohibition on calling the analysis an appraisal.
citation:
  source: Fla. Stat. § 475.612(3)
  url: null
  quoted_text: This section does not apply to a real estate broker or sales associate who, in the
    ordinary course of business, performs a comparative market analysis, gives a price opinion, or
    gives an opinion of the value of real estate. However, in no event may this comparative market
    analysis, price opinion, or opinion of value of real estate be referred to or construed as an
    appraisal.
