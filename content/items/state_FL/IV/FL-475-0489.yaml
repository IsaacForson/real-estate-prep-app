stem: Under Florida law, what must a subordination instrument for an automatic renewal commission
  include to be valid?
options:
  - Be oral and recorded in the public records
  - Be approved by the Florida Real Estate Commission
  - Be in writing and recorded in the public records
  - Be notarized and filed with the clerk of court
key: C
explanation: The statute requires that a subordination instrument for an automatic renewal
  commission be made in writing and recorded in the public records of the same county where the
  broker’s lien notice was recorded. An oral agreement is insufficient because the writing
  requirement is mandatory.
citation:
  source: Fla. Stat. § 475.813(2)
  url: null
  quoted_text: The subordination instrument described in this subsection shall be made in writing and
    shall be recorded by the owner in the public records of the same county where the broker’s lien
    notice was recorded.
