stem: Under Florida law, within how many days after execution must listing services begin for a
  residential loan alternative agreement to remain valid?
options:
  - 30 days
  - 60 days
  - 90 days
  - 120 days
key: C
explanation: The statute provides that a residential loan alternative agreement is void if listing
  services do not begin within 90 days after the agreement is executed by both parties. Therefore,
  to avoid voidance, listing services must commence within that 90‑day period. The distractor “60
  days” is incorrect because the law specifies 90 days, not 60.
