stem: An individual holds a bachelor's degree in business administration but does not hold a broker
  license and has not passed an instructor examination. Under Florida Statutes, can this individual
  serve as a school permitholder for a proprietary real estate school?
options:
  - The individual may serve as a school permitholder after completing 7 classroom hours of
    instruction in real estate subjects.
  - The individual may serve as a school permitholder by teaching only non‑credit courses at a
    career center.
  - The individual may serve as a school permitholder only if they obtain a broker license or pass
    an instructor examination.
  - The individual may serve as a school permitholder if they have extensive real estate experience
    as defined by rule.
key: C
explanation: The statute specifies that a school permitholder must be a holder of a broker license
  (active or voluntarily inactive) or must have passed an instructor’s examination approved by the
  commission. Holding a bachelor’s degree alone does not satisfy this requirement. Therefore, the
  individual must obtain a broker license or pass the instructor exam to serve as a permitholder.
citation:
  source: Fla. Stat. § 475.451(2)(a)
  url: null
  quoted_text: A school permitholder must be the holder of a license as a broker, either active or
    voluntarily inactive, or must have passed an instructor’s examination approved by the
    commission.
