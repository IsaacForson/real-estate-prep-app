stem: Under Florida law, which of the following may the chair of the Florida Real Estate Commission
  exercise without a resolution?
options:
  - The chair may exercise disciplinary powers and the power to adopt rules, as specified in the
    commission’s governing statutes.
  - The chair may set fees for license renewal and application, subject to the limits established by
    department rule.
  - The chair may exercise any of the duties and powers of the commission, except disciplinary
    powers and the power to adopt rules, unless delegated by resolution.
  - The chair may investigate complaints and issue cease‑and‑desist orders, following the procedures
    outlined in chapter 455.
key: C
explanation: "Under Fla. Stat. ch. 475 § 475.03(1), the chair of the Florida Real Estate Commission
  may exercise any of the commission’s duties and powers without a resolution, except for
  disciplinary powers and the power to adopt rules, which may only be exercised if delegated by a
  resolution. Therefore, the statement that the chair may exercise any of the commission’s duties
  and powers except disciplinary powers and rulemaking, unless delegated by resolution, accurately
  reflects the law. The other choices are incorrect: they either give the chair authority to
  investigate complaints and issue cease‑and‑desist orders (which is not a unilateral chair power
  under the statute), attribute disciplinary or rulemaking powers to the chair without a resolution,
  or assign fee‑setting authority to the chair, none of which are supported by the cited provision."
