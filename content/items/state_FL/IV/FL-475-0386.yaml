stem: Under Florida law, what is the consequence if a broker fails to record a lien notice within
  the time period required by s. 475.807(1)?
options:
  - The broker may not enforce the lien for the claimed commission and the lien notice is void.
  - The broker’s license is automatically suspended for 30 days.
  - The broker must pay a fine of $500 to the Department of Business and Professional Regulation.
  - The broker may still enforce the lien if the owner agrees in writing.
key: A
explanation: The statute states that a broker who fails to record a lien notice within the
  prescribed time may not enforce a lien for the claimed commission, and any notice recorded outside
  that period is void. The distractor suggesting enforcement with owner agreement contradicts the
  explicit prohibition on enforcement.
