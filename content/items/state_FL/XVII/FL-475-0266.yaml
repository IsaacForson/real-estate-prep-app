stem: A licensee receives a referral fee from a mortgage broker for directing a buyer to that
  broker's loan products. The licensee does not represent either party in the transaction. Under
  Fla. Stat. § 475.255, does this payment alone create an agency or transactional brokerage
  relationship between the licensee and the buyer?
options:
  - The licensee must enter into a transactional brokerage agreement with the buyer for this
    transaction.
  - The licensee must refund the fee to avoid violating the statute under the provisions of this
    chapter.
  - The licensee is considered to have an agency relationship with the buyer in this transaction.
  - The licensee is not considered to have an agency relationship with the buyer because of the
    payment.
key: D
explanation: The statute provides that the mere payment or promise to pay compensation does not
  determine whether an agency or transactional brokerage relationship exists. Thus, the fee alone
  does not create an agency relationship. The distractor that the payment automatically creates an
  agency relationship is incorrect because the statute expressly rejects that notion.
