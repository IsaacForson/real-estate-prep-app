stem: An owner sells their own real property without employing any agent who is paid a commission
  strictly on a transactional basis. Which statement is correct under Florida law?
options:
  - The transaction does not require a real estate license for the owner
  - The transaction requires a real estate license as the owner sells real property
  - The transaction requires a real estate license only for business opportunity property
  - The transaction requires a real estate license unless the owner is a licensed broker
key: A
explanation: The exemption in 475.011(2) states that an owner selling their own real property is
  exempt from licensing requirements, provided no commissioned agent is employed. Since the scenario
  specifies no such agent, no license is required. The other options incorrectly impose a license
  requirement or add irrelevant conditions.
citation:
  source: "### Fla. Stat. ch. 475 — Florida Statutes 2025, Chapter 475 — Real Estate Brokers, Sales
    Associates, Schools, and Appraisers (Part I is the license law) — official Online Sunshine page,
    read via Internet Archive capture because leg.state.fl.us/flsenate.gov refused connections Fla.
    Stat. § 475.011(2)"
  url: null
  quoted_text: Any individual, corporation, partnership, trust, joint venture, or other entity which
    sells, exchanges, or leases its own real property; however, this exemption shall not be
    available if and to the extent that an agent, employee, or independent contractor paid a
    commission or other compensation strictly on a transactional basis is employed to make sales,
    exchanges, or leases to or with customers
