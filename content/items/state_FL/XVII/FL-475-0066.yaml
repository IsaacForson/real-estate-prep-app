stem: A property management firm in Miami pays a current tenant $75 for referring a prospective
  lessee who signs a lease for an apartment unit. Under Florida Statute 475.01(13), which statement
  is correct regarding this payment?
options:
  - The payment is permissible because the tenant is unlicensed but the fee is below $100.
  - The payment is permissible because the tenant is a licensed sales associate.
  - The payment is not permissible because the fee exceeds the $50 limit per transaction.
  - The payment is permissible because finder’s fees are exempt for apartment complexes.
key: C
explanation: Subsection (13) limits finder’s fees or referral fees to a maximum of $50 per
  transaction when paid to an unlicensed tenant. A payment of $75 exceeds this limit, making the
  transaction impermissible. The option suggesting permissibility because the fee is below $100
  ignores the specific $50 cap.
