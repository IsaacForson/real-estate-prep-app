stem: Under Florida Statute 475.01(13), what is the maximum amount a property management firm may
  pay a tenant as a finder’s fee or referral fee for introducing a prospective lessee to an
  apartment unit without violating the statute?
options:
  - $50 per transaction
  - $25 per transaction
  - $100 per transaction
  - $75 per transaction
key: A
explanation: Subsection (13) explicitly states that the fee must not exceed $50 per transaction.
  Therefore, $50 per transaction is the maximum allowable amount. The $75 per transaction option
  exceeds this limit and would violate the statute.
