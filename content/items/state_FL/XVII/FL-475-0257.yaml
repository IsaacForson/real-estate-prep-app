stem: Under Florida Statute 475.01(9), which of the following individuals is exempt from licensing
  requirements when performing appraisals?
options:
  - A. A licensed real estate sales associate performing a comparative market analysis
  - B. A person registered as a trainee appraiser under part II performing appraisals
  - C. A certified general appraiser performing appraisals for federally related transactions
  - D. A broker conducting a broker price opinion for a residential property
key: B
explanation: The statute exempts anyone registered, licensed, or certified by the department under
  part II as an appraiser or trainee appraiser who is performing appraisals in accordance with that
  part. The correct choice describes a person registered as a trainee appraiser under part II
  performing appraisals. The incorrect choice about a certified general appraiser performing
  appraisals for federally related transactions is not exempt unless the appraiser is also
  registered under part II.
