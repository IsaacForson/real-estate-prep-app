stem: A Florida resident who holds an active sales associate license moves to Georgia and does not
  notify the Florida Real Estate Commission within the required timeframe. According to Florida
  Statute 475.180(2)(a) and the penalty provision in s. 475.25, what is the status of this failure
  to notify?
options:
  - It is a violation of the license law subject to penalties
  - It is an automatic revocation of the license
  - It is a requirement to complete additional continuing education
  - It is a permissible action requiring no further action
key: A
explanation: The statute explicitly states that failure to notify and comply is a violation of the
  license law, subject to the penalties in s. 475.25. Hence, the failure to notify constitutes a
  violation punishable under the license law. The distractor suggesting it is a permissible action
  ignores the statutory language that labels the omission a violation.
