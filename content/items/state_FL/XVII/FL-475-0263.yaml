stem: Under Fla. Stat. § 475.25(1)(h), which action may result in disciplinary action against a licensee?
options:
  - Accepting a referral fee from a licensed attorney for a real estate transaction today
  - Receiving a bonus from a broker for exceeding sales targets during the fiscal year
  - Sharing a commission with an unlicensed person for the referral of real estate business
  - Paying a fee to an unlicensed assistant for preparing marketing materials and ads
key: C
explanation: The statute prohibits sharing a commission with, or paying a fee to, a person not
  properly licensed as a broker, broker associate, or sales associate for the referral of real
  estate business. Therefore, sharing a commission with an unlicensed person for the referral of
  real estate business is grounds for discipline. Accepting a referral fee from a licensed attorney
  is not prohibited by this subsection because it does not involve sharing commission with or paying
  a fee to an unlicensed person.
