stem: A broker wishes to open two branch offices in different counties. Under Florida Statute
  475.24, what is the maximum total annual registration fee the broker must pay for both branch
  offices?
options:
  - $50.00
  - $75.00
  - $100.00
  - $150.00
key: C
explanation: Each branch office incurs an annual registration fee that may not exceed $50; for two
  offices, the maximum total fee is therefore 2 × $50 = $100. The distractor of $50.00 applies the
  per‑office limit to only one office, while $75.00 and $150.00 result from misapplying the fee
  rate.
citation:
