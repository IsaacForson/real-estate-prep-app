stem: Under Florida Statute 475.01(1), which of the following is included in the statutory
  definition of a 'broker'?
options:
  - Managing a condominium complex for a salary
  - Appraising mineral rights only when state-licensed
  - Acting as an attorney-in-fact for contract execution only
  - Negotiating the sale or purchase of a business opportunity
key: D
explanation: The definition of broker includes negotiating the sale, exchange, purchase, or rental
  of business enterprises or business opportunities. The other options describe activities that are
  either exempt (attorney-in-fact), unrelated to brokerage (condo management), or limited to
  appraisal requiring state licensure.
