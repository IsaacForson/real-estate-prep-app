stem: A broker's license is suspended by the Florida Real Estate Commission for violating
  advertising rules. What is the effect on the licenses of the sales associates registered with that
  broker?
options:
  - The sales associate's license is automatically revoked.
  - The sales associate's license becomes voluntarily inactive.
  - The sales associate's license remains active and unaffected.
  - The sales associate's license becomes involuntarily inactive.
key: D
explanation: Under Fla. Stat. § 475.31(1), an order suspending a broker's license automatically
  causes the licenses of all sales associates registered with that broker to become involuntarily
  inactive while the broker's license is inoperative. The distractor that the license remains active
  ignores the automatic effect of the broker's suspension on associated sales associates.
citation:
  source: Fla. Stat. § 475.31(1)
  url: null
  quoted_text: An order revoking or suspending the license of a broker shall automatically cause the
    licenses of all sales associates and broker associates registered with the broker, and, if a
    partnership or corporation, of all members, officers, and directors thereof to become
    involuntarily inactive, while the license of the broker is inoperative or until new employment
    or connection is secured.
