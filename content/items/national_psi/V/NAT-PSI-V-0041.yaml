stem: Which of the following is an essential element of a valid real estate contract?
options:
  - Earnest money
  - Recording
  - Consideration
  - Notarization
key: C
explanation: A valid contract requires competent parties, mutual assent through offer and
  acceptance, consideration, a lawful object, and, for most real estate contracts, a signed writing.
  Earnest money, recording, and notarization are common in practice but none is required to form a
  binding contract.
