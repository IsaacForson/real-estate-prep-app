stem: A person signs a contract to sell a parcel that belongs to a stranger and that the person has
  no means of acquiring. What is the legal status of this contract?
options:
  - Voidable
  - Valid
  - Executory
  - Void
key: D
explanation: A contract to sell property the purported seller neither owns nor can acquire has no
  legal effect from the start because an essential element is missing; there is nothing for either
  party to enforce. Voidable would imply a valid contract that one party may cancel, which is a
  different status.
