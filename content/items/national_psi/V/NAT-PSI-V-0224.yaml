stem: A buyer signs a purchase agreement that includes a clause prohibiting assignment without the
  seller's written consent. The buyer later attempts to assign the contract to an investor without
  obtaining the seller's consent. What is the effect of this attempted assignment?
options:
  - The assignment is void and the original buyer remains liable for performance
  - The assignment creates a novation that releases the original buyer
  - The assignment is valid only if the investor provides additional earnest money
  - The assignment is valid and releases the original buyer from liability
key: A
explanation: Because the contract expressly prohibits assignment without the seller's consent, the
  attempted assignment is void and the original buyer remains liable for performance. An assignment
  that releases the original buyer would only be effective if the contract permitted assignment and
  a release was obtained.
