stem: A landlord and tenant agree orally to a six-month residential lease. Under the Statute of
  Frauds, is the lease enforceable?
options:
  - The lease is unenforceable because all leases must be in writing.
  - The lease is enforceable because it is for less than one year.
  - The lease is unenforceable because oral agreements for residential property are void.
  - The lease is enforceable only if recorded with the county.
