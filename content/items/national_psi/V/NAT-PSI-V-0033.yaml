stem: "With no written or spoken agreement in place, a licensee spends several weeks showing
  properties, advising on pricing, and negotiating for a buyer who welcomes the help. Whatever
  contractual relationship exists between them arises from:"
options:
  - The stated words of the parties (an express contract)
  - A promise exchanged for an act (a unilateral contract)
  - The conduct of the parties (an implied contract)
  - A promise that has been fully carried out (an executed contract)
key: C
explanation: An implied (implied-in-fact) contract is inferred from what the parties do rather than
  from what they say or write. An express contract requires stated terms, oral or written. This is
  why a licensee's conduct can create an agency relationship the licensee never meant to create.
