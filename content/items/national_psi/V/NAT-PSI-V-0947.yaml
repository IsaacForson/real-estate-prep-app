stem: A landlord sells a rental house while a tenant has a six-month lease remaining. According to
  the text, what is the effect on the tenant's lease?
options:
  - The lease ends and the tenant must vacate.
  - The lease continues unchanged under the new owner.
  - The lease is automatically renewed for another term.
  - The lease becomes void and the tenant receives a refund.
key: B
explanation: The text expressly states that the sale of the property does not terminate a lease; the
  new owner takes subject to existing tenancies. Thus the lease continues with the new owner
  unchanged. The distractor that the lease ends mistakenly treats sale as a terminating event.
