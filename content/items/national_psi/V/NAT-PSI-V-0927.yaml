stem: What is a contingency in a real estate purchase contract?
options:
  - A term that obligates both parties to perform regardless of events
  - A term that makes one party's duty to perform depend on the occurrence of a stated event
  - A term that automatically terminates the contract after a set date
  - A term that allows either party to change the price unilaterally
key: B
explanation: The correct answer defines a contingency as a term that makes one party's duty to
  perform depend on the occurrence of a stated event, as stated in § 6.1 Concept. The distractor
  stating that a contingency obligates both parties to perform regardless of events is incorrect
  because a contingency allows the protected party to terminate if the event does not occur.
