stem: A licensee who is also the trusted financial advisor of an elderly seller convinces the seller
  to sign a purchase agreement at a price far below market value. Assuming the licensee abused the
  position of trust, what is the likely legal status of the contract?
options:
  - The contract is valid and enforceable
  - The contract is voidable by the seller
  - The contract is void due to illegality
  - The contract is voidable by the licensee
key: B
explanation: The key is correct because undue influence makes a contract voidable by the victim,
  here the seller. The most tempting distractor, 'The contract is valid and enforceable,' ignores
  the defect in consent that voids the agreement.
