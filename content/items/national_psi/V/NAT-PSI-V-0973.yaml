stem: A landlord and tenant agree orally to an eleven-month residential lease. Is the lease enforceable?
options:
  - The lease is enforceable because it is for less than one year.
  - The lease is unenforceable because oral leases are generally not valid.
  - The lease is enforceable only if the tenant pays rent in advance.
  - The lease is unenforceable because it exceeds one year.
key: A
explanation: Under the Statute of Frauds, a lease for more than one year must be in writing to be
  enforceable; a lease for one year or less may be oral and still enforceable. An eleven‑month lease
  is therefore enforceable even though it is oral. The claim that the lease is unenforceable because
  oral leases are generally not valid is incorrect because oral leases for terms of one year or less
  are permissible. The claim that the lease is enforceable only if the tenant pays rent in advance
  is incorrect because advance payment is not required for enforceability. The claim that the lease
  is unenforceable because it exceeds one year is incorrect because the lease does not exceed one
  year.
