stem: "A buyer and seller have both signed a purchase agreement with closing set six weeks out. The
  deed has been prepared but has yet to be delivered. In the legal sense, the purchase agreement is
  best described as:"
options:
  - An executory unilateral contract
  - An executory bilateral contract
  - An executed unilateral contract
  - An executed bilateral contract
key: B
explanation: The agreement is bilateral because each side has made a promise (the seller to convey,
  the buyer to pay), and it is executory because those promises remain unperformed until closing. A
  contract that has merely been signed is executed only in the loose everyday sense; exam usage
  treats executed as fully performed.
