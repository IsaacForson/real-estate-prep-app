stem: A purchase agreement includes a 'time is of the essence' clause setting the closing date for
  June 30. The buyer fails to deliver the purchase funds by that date. What is the consequence?
options:
  - The buyer is in breach and the seller may pursue remedies or treat the contract as terminated
  - The buyer may still perform within a reasonable time after June 30 without penalty
  - The contract is automatically void due to the missed deadline
  - The seller must grant an extension before exercising any remedies
key: A
explanation: "A 'time is of the essence' clause makes stated deadlines strict: a party who misses a
  deadline is in breach and the other party may pursue remedies or treat the contract as terminated.
  The buyer's failure to fund by June 30 constitutes a breach, allowing the seller to seek remedies
  or terminate. The other options contradict the strictness of the clause."
