stem: A buyer sees a newspaper advertisement offering a house and sends a signed purchase agreement
  to the seller. The seller does not respond. Which statement best describes the legal situation?
options:
  - A contract is formed because the advertisement was an offer.
  - No contract exists because the advertisement was merely an invitation to make offers.
  - A contract exists if the buyer's agreement is considered acceptance.
  - The seller is bound to sell because the buyer's offer was communicated.
key: B
explanation: An advertisement is ordinarily an invitation to make offers, not an offer itself. Thus
  the buyer's signed agreement is an offer, but no contract exists until the seller accepts. The
  distractor that treats the advertisement as an offer confuses invitation with offer.
