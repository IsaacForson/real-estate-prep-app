stem: Under general contract law, what is a material breach?
options:
  - A breach that goes to the heart of the bargain and excuses the other party's performance
  - A breach that is a minor delay where time is not of the essence
  - A breach that occurs when a party announces in advance it will not perform
  - A breach that allows the injured party to claim damages but not to walk away
key: A
explanation: Section 7.1 defines a material breach as one that goes to the heart of the bargain
  (refusing to close, failing to deliver title) and excuses the other party's performance. The most
  tempting distractor describes a minor breach, which only entitles the injured party to damages but
  does not allow the contract to be terminated.
