stem: A buyer and seller agree to include a repair clause in their purchase agreement before signing
  the contract. Later, after signing, they agree to change the closing date. Which statement
  correctly describes these two changes?
options:
  - The repair clause is an amendment and the closing date change is an addendum.
  - The repair clause is an addendum and the closing date change is an amendment.
  - The repair clause is an amendment and the closing date change is an amendment.
  - The repair clause is an addendum and the closing date change is an addendum.
key: B
explanation: An addendum is a provision added when the contract is formed, while an amendment is a
  change made after the contract is signed. Therefore, the repair clause agreed to before signing is
  an addendum, and the closing‑date change agreed to after signing is an amendment. The option that
  states the repair clause is an addendum and the closing date change is an amendment correctly
  reflects these definitions.
