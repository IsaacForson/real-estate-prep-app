stem: What is a bilateral contract?
options:
  - A contract in which each party promises to perform and each promise is consideration for the
    other.
  - A contract in which one party promises to perform and the other party is not bound to do
    anything.
  - A contract in which the terms are implied from the parties' conduct rather than from stated
    words.
  - A contract in which the agreement has no legal effect from the start because an essential
    element is missing or the object is illegal.
key: A
explanation: The correct answer defines a bilateral contract as an agreement where each party makes
  a promise and each promise serves as consideration for the other's promise. The option describing
  a contract where only one party promises to perform and the other is not bound describes a
  unilateral contract. The option describing a contract whose terms are inferred from the parties'
  conduct rather than from expressed words describes an implied contract. The option describing an
  agreement that has no legal effect from the outset because an essential element is missing or the
  object is illegal describes a void contract.
citation:
