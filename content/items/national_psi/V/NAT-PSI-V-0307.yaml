stem: A buyer and seller have signed a purchase agreement and completed the closing, transferring
  the deed and paying the price. According to the text, what is the contract best described as?
options:
  - The executory contract
  - The voidable contract
  - The executed contract
  - The unenforceable contract
key: C
explanation: The text clarifies that 'executed' in the exam context means 'fully performed,'
  referring to a contract where all obligations have been satisfied. Since the closing has occurred
  and the deed and price have been exchanged, the contract is fully performed. Thus, it is best
  described as executed. An executory contract would have pending performance, while voidable and
  unenforceable contracts involve distinct defects not present after full performance.
