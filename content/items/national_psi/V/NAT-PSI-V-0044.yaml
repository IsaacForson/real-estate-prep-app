stem: A seller contracts to sell a home to a nephew at a price well below market value, then seeks
  to escape the contract on the ground that the consideration was inadequate. How will a court most
  likely treat this argument?
options:
  - Courts require consideration to be roughly equal in value
  - Adequacy of consideration is not weighed absent fraud
  - Courts treat a below-market price as evidence of duress
  - Courts void any sale to a relative for less than market value
key: B
explanation: Consideration must exist, but it need not be money and need not be equal in value.
  Courts generally refuse to weigh the adequacy of consideration unless fraud is shown, so a bargain
  price freely agreed to is enforceable. A low price by itself is neither duress nor a ground to
  void a family sale.
