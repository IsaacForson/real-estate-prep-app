stem: Which term describes a contract in which one or more of the parties still have something left
  to perform?
options:
  - Executory
  - Executed
  - Implied
  - Unilateral
key: A
explanation: A contract is executory while any party still owes performance, such as a signed
  purchase agreement awaiting closing. Once the deed has been delivered and the price paid, every
  party has fully performed and the contract is executed. Implied and unilateral describe how a
  contract is formed and who is bound, not its stage of performance.
citation:
