stem: Two competing brokerages sign an agreement to charge every seller in town the same commission
  rate. What is the legal status of that agreement?
options:
  - Voidable at the election of either broker
  - Valid so long as both brokers perform
  - Unenforceable until reduced to writing
  - Void because its object is illegal
key: D
explanation: A valid contract requires a lawful object. An agreement between competing brokers to
  fix commission rates violates federal antitrust law, so its purpose is illegal and the agreement
  is void; neither party can enforce it, and performance would itself be unlawful.
citation:
  source: REP Ref. Contracts — Lawful object
  url: null
  quoted_text: A contract whose object is illegal — for example, an agreement between competing
    brokers to fix commission rates, which the cached Sherman Act prohibits, or an agreement to
    violate zoning law — is void.
