stem: What characterizes a void contract?
options:
  - It is valid until the protected party cancels.
  - It is lacking any legal effect.
  - It is binding after ratification.
  - It is enforceable despite missing a writing.
key: B
explanation: A void contract never had any legal effect; it is treated as if it never existed. In
  contrast, a voidable contract remains valid until the party with the power to avoid it chooses to
  cancel. Therefore, the correct description is that a void contract lacks any legal effect. The
  option stating it is valid until the protected party cancels describes a voidable contract, not a
  void one.
