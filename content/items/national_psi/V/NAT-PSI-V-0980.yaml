stem: A buyer signs a purchase agreement and faxes it to the seller's office, but the seller's agent
  does not receive the fax until the next day. When is the contract formed?
options:
  - When the buyer's agent transmits the fax.
  - When the buyer's agent sends the fax.
  - When the buyer signs the agreement.
  - When the seller's agent receives the fax.
key: D
explanation: According to §3.3, acceptance is effective only when it is communicated to the offeror
  (or the offeror's agent). The contract is formed at that moment, not when the offeree signs. The
  distractor that points to the buyer's signature ignores the communication requirement.
