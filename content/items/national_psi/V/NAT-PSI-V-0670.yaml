stem: A buyer gives earnest money with an offer but later decides not to proceed with the purchase
  without any contingency being triggered. According to the text, what is the likely outcome for the
  earnest money?
options:
  - The earnest money is returned automatically if the buyer changes their mind.
  - The earnest money is considered part of the purchase price at closing.
  - The earnest money is evidence of good faith and a source of liquidated damages.
  - The earnest money is the mutual promises that constitute consideration.
key: C
explanation: Earnest money serves as evidence of the buyer's good faith and may be retained by the
  seller as liquidated damages when the buyer defaults without a valid contingency. It is not the
  consideration itself, which consists of the mutual promises to buy and sell.
