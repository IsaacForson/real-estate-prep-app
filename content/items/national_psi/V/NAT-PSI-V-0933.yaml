stem: In a real estate purchase agreement, which of the following constitutes valid consideration
  for the seller's promise to convey the property?
options:
  - The buyer's promise to pay the purchase price
  - The earnest money deposit accompanying the offer
  - The buyer's expressed love and affection for the property
  - The seller's promise to deliver a warranty deed
key: A
explanation: The buyer's promise to pay the purchase price is the bargained-for exchange that serves
  as consideration for the seller's promise to convey the property, as stated in § 2.4. Earnest
  money is merely a deposit showing good faith and is not consideration. Love and affection does not
  constitute valuable consideration, and the seller's own promise cannot be consideration for
  itself.
citation:
