stem: In a bilateral contract such as a purchase agreement, what serves as the consideration for
  each party's promise?
options:
  - The signature of a witness
  - The earnest money deposit
  - The recording of the contract
  - The other party's promise
key: D
explanation: "A bilateral contract is an exchange of promises, and each promise is the consideration
  supporting the other: the seller's promise to convey supports the buyer's promise to pay, and vice
  versa. Earnest money is evidence of good faith, and recording or witnessing has nothing to do with
  consideration."
citation:
  source: REP Ref. Contracts — Bilateral versus unilateral
  url: null
  quoted_text: "A **bilateral** contract is an exchange of promises: each party promises to perform,
    and each promise is consideration for the other."
