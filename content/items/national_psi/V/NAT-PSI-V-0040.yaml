stem: A seller and buyer agreed orally on the sale of a lot, the buyer paid, and the seller
  delivered a deed. A creditor of the seller now argues the conveyance is invalid because the
  contract was only oral. Which statement is correct?
options:
  - The conveyance fails; an oral land contract has no legal effect from the start
  - The conveyance stands; performance of an unenforceable agreement is effective
  - The conveyance is voidable; the creditor may elect to set the deed aside
  - The conveyance is suspended until a written contract is signed and then recorded
key: B
explanation: An oral land sale is unenforceable, meaning a court would decline to compel
  performance, but it is a valid agreement rather than a void one. When the parties choose to
  perform anyway, the performance stands and the conveyance is valid. The missing writing gives a
  stranger to the contract no ground to undo it.
