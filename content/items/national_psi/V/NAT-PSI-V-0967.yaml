stem: How does an addendum differ from an amendment in a real estate contract?
options:
  - An addendum requires both parties' signatures; an amendment may be signed by one party only.
  - An addendum is added at contract formation; an amendment is made after the contract is signed.
  - An addendum replaces the original contract; an amendment adds new terms to it.
  - An addendum is added after contract formation; an amendment is made at formation.
key: B
explanation: The correct description is that an addendum is incorporated into the contract when the
  parties first agree, while an amendment changes the contract after it has been executed. Therefore
  the statement that an addendum is added at contract formation and an amendment is made after the
  contract is signed accurately captures this difference. The claim that an addendum requires both
  parties' signatures while an amendment may be signed by one party only misstates the signature
  requirements for both. The assertion that an addendum replaces the original contract and an
  amendment adds new terms incorrectly describes the effect of each. The statement that an addendum
  is added after contract formation and an amendment is made at formation reverses the timing of the
  two.
