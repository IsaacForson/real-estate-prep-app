stem: Which of the following acts by a licensee who holds earnest money is expressly prohibited
  under § 5.2 Handling in general terms?
options:
  - The licensee holds earnest money pending a written agreement of the parties
  - The licensee deposits earnest money in a trust account within the time state law prescribes
  - The licensee commingles earnest money with the brokerage's operating funds
  - The licensee returns earnest money to the buyer after a mutual rescission
key: C
explanation: A licensee who holds earnest money may not mix it with the brokerage's own operating
  funds (commingling) and may not use it for any purpose other than as the contract and the parties
  direct. Therefore, commingling earnest money with operating funds is expressly prohibited.
  Depositing funds in a trust account within the prescribed time is permitted, not prohibited.
