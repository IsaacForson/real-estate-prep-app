stem: A buyer who was a minor when a land contract was signed reaches the age of majority and, over
  the next several months, keeps making the installment payments. What is the effect on the
  contract?
options:
  - The contract became void when the buyer reached majority
  - The contract must be re-signed before it can be enforced
  - The contract has been ratified and is now fully binding
  - The contract remains voidable indefinitely by the buyer
key: C
explanation: A voidable contract stays in force until the protected party elects to cancel it, and
  that party may instead affirm it. Continuing to perform after reaching majority is ratification,
  which makes the contract fully binding on the former minor.
