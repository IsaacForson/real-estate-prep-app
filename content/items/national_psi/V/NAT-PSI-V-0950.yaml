stem: A purchase agreement for a commercial property lacks a 'time is of the essence' clause and
  sets closing for August 15. The buyer tenders the funds on August 22. What is the likely result?
options:
  - The buyer is not in breach if the delay is considered a reasonable time.
  - The contract is automatically terminated due to the late performance.
  - The buyer is in breach because the funds were delivered after the closing date.
  - The seller may retain the earnest money as liquidated damages.
key: A
explanation: Without a 'time is of the essence' clause, courts generally allow performance within a
  reasonable time after the stated date, so the buyer's performance on August 22 may not be a breach
  if the delay is reasonable. The distractor that asserts the buyer is in breach because funds were
  delivered after the closing date ignores the reasonable‑time allowance granted when the clause is
  absent.
