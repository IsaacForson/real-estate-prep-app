stem: Under §5.2 Handling in general terms, what must a broker do with earnest money received under
  a purchase contract?
options:
  - Combine it with the brokerage's operating funds to earn interest
  - Deposit it in a trust (escrow) account within the time state law prescribes
  - Release it to the seller immediately if the buyer changes mind
  - Use it to cover advertising expenses if the buyer and seller agree
key: B
explanation: A broker who holds earnest money must deposit it in a trust (escrow) account within the
  time state law prescribes. Commingling earnest money with the brokerage's operating funds is
  prohibited.
