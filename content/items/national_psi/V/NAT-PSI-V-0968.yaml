stem: A buyer and seller agree that if the seller receives a genuine purchase offer from another
  party, the buyer will have the opportunity to match that offer before the seller accepts it.
  According to the text, what type of agreement have the parties created?
options:
  - An agreement for a lease that includes an option to purchase the premises
  - An agreement granting a right of first refusal to the buyer
  - An agreement for a purchase that includes a financing contingency clause
  - An agreement that fixes an option purchase price for the property
key: B
explanation: A right of first refusal only allows the holder to match a third‑party offer; it does
  not set a price or compel a sale. An option to purchase, by contrast, fixes a price and can
  obligate the seller to sell, which does not match the described situation.
