stem: Both the optionor and the optionee sign an option agreement. A licensing candidate concludes
  that the option must be bilateral because both parties signed it. What is the flaw in that
  reasoning?
options:
  - Classification turns on who is bound to perform, and only the optionor is bound
  - Classification turns on who drafted the document, and the optionee prepared it
  - Classification turns on whether the agreement was recorded, and options are recorded
  - Classification turns on whether consideration was paid, and the optionee paid a fee
key: A
explanation: Whether a contract is unilateral or bilateral depends on who is obligated, not on who
  signs. In an option both parties sign, but only the optionor promises anything (to sell if the
  optionee exercises); the optionee is free to walk away, so the option is unilateral.
citation:
  source: REP Ref. Contracts — Bilateral versus unilateral
  url: null
  quoted_text: The test is who is obligated, not who signs. Both parties sign an option, but only the
    optionor is bound.
