stem: A tenant transfers their entire remaining lease term to a new tenant, but the original tenant
  remains liable to the landlord if the new tenant fails to pay rent. According to the text, what
  has the tenant performed?
options:
  - The novation of the lease substitutes a new tenant and releases the original tenant.
  - The sublease of the premises transfers only part of the lease term to a subtenant.
  - The assignment of the lease transfers the tenant's remaining term to another party.
  - The amendment of the lease changes a term after the contract has been signed.
key: C
explanation: Assignment transfers rights and leaves the assignor secondarily liable, while novation
  substitutes a party and releases the original; the scenario describes assignment because the
  original tenant remains liable after transferring the lease.
