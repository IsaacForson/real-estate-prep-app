stem: A listing licensee receives an offer signed by an individual on behalf of a limited liability
  company. Before the seller relies on the offer, what should the licensee do?
options:
  - Ask the LLC to post additional earnest money as security
  - Require that every member of the LLC also sign the offer
  - Treat the offer as void because an entity lacks capacity
  - Confirm that the signer has authority to bind the LLC
key: D
explanation: Entities such as corporations, partnerships, LLCs, and trusts have capacity to
  contract, but they act only through authorized officers, partners, managers, or trustees. The
  prudent step is to verify the signer's authority; every member need not sign, and the entity's
  capacity is not in doubt.
