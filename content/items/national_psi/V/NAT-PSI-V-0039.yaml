stem: Two neighbors orally agree on the sale of a strip of land. The seller later refuses to convey
  and the buyer sues to force the sale. What is the most likely result?
options:
  - Unenforceable; a court will decline to compel conveyance
  - Void; the buyer may recover the price as punitive damages
  - Valid; the court will order the seller to deliver the deed
  - Voidable; only the buyer may elect to cancel the agreement
key: A
explanation: "Contracts for the sale of real property fall within the Statute of Frauds, so an oral
  land sale is unenforceable: it may look valid, but a court will refuse to compel performance
  because the required signed writing is missing. It is unenforceable rather than void, so the
  parties could still perform voluntarily."
citation:
  source: REP Ref. Contracts — Valid, void, voidable, and unenforceable
  url: null
  quoted_text: "**Unenforceable**: the agreement may appear valid but a court will not compel
    performance, usually because of a procedural defect such as the absence of a required writing
    under the Statute of Frauds, or the running of the statute of limitations."
