stem: According to the text, under what condition will a court enforce a liquidated damages clause
  in a real estate contract?
options:
  - The court will enforce the clause if the amount equals the actual damages suffered and is not a
    penalty
  - The court will enforce the clause if actual damages hard to estimate and amount reasonable
    forecast
  - The court will enforce the clause if the clause is included in the contract regardless of the
    amount
  - The court will enforce the clause if both parties agree to the amount after a breach occurs and
    no waiver is given
key: B
explanation: Courts enforce a liquidated damages clause when actual damages would be difficult to
  estimate at the time of contracting and the stipulated amount is a reasonable forecast of those
  damages, not a penalty. The option stating that the court will enforce the clause if actual
  damages are hard to estimate and the amount is a reasonable forecast matches this rule.
