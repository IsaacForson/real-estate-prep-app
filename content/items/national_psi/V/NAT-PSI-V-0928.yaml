stem: A buyer purchases an option to buy a commercial lot for $300,000. The option fee is $15,000
  and the contract states that the fee applies to the purchase price if the option is exercised.
  What is the effective purchase price if the buyer exercises the option?
options:
  - $300,000
  - $330,000
  - $315,000
  - $285,000
key: D
explanation: The effective purchase price equals the option price minus the option fee when the
  contract specifies that the fee applies to the price, yielding $300,000 − $15,000 = $285,000. The
  distractor of $300,000 incorrectly ignores the fee’s application to the price.
citation:
