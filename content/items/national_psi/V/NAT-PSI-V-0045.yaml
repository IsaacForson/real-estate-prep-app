stem: 'A grantor conveys property to a child by a deed reciting "love and affection" as the
  consideration. This type of consideration supports:'
options:
  - An enforceable lease longer than one year
  - An enforceable option to purchase the property
  - A gift deed, but no enforceable contract
  - An enforceable bilateral purchase contract
