stem: Which deed provides the grantee with the greatest protection by warranting against defects
  arising at any time in the chain of title?
options:
  - Special warranty deed
  - Bargain and sale deed
  - General warranty deed
  - Quitclaim deed only
key: C
explanation: A general warranty deed provides the grantee with the greatest protection because the
  grantor warrants against defects arising at any time in the chain of title, including before and
  during the grantor's ownership. A bargain and sale deed does not include such warranties, so it
  offers less protection.
