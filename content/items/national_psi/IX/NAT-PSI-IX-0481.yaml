stem: According to REP Ref. Ownership, Title & Transfer § 1.3, what must the grantor do to retake
  property held under a fee simple subject to a condition subsequent?
options:
  - The property reverts to the grantor's heirs without any action
  - The estate ends automatically when the condition is broken
  - The grantor must take legal action to retake the property
  - The grantor retains a possibility of reverter
key: C
explanation: Under a fee simple subject to a condition subsequent, the estate does not end
  automatically when the condition is broken; the grantor holds a right of re-entry and must take
  legal action to retake the property. The incorrect option describes automatic termination, which
  applies to a fee simple determinable.
