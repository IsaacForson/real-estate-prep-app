stem: A person occupies a parcel of land openly, continuously, and without the owner's permission
  for the statutory period required by state law, but shares possession with the public by allowing
  hikers to cross the land. Which element of adverse possession is missing?
options:
  - The requirement of open and notorious possession
  - The requirement of exclusive possession
  - The requirement of actual possession
  - The requirement of hostile possession
key: B
explanation: To claim adverse possession, the possessor must hold the land exclusively, without
  sharing it with the owner or the public. Permitting hikers to cross the property means possession
  is not exclusive, so the required element is missing even though the occupation is open, actual,
  hostile, and continuous for the statutory period.
