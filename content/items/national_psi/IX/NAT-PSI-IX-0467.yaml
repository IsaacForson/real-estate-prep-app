stem: At a closing, a property has a mortgage lien recorded in 2018, a mechanic's lien recorded in
  2020, and a property tax lien for the current year. Which lien must be paid first from the
  proceeds under REP Ref. Ownership, Title & Transfer § 3.4?
options:
  - The lien relating back to construction start must be satisfied before any other liens.
  - The mechanic's lien recorded in 2020 must be satisfied before any other liens.
  - The property tax lien for the current year must be satisfied before any other liens.
  - The mortgage lien recorded in 2018 must be satisfied before any other liens.
key: C
explanation: Under lien priority rules, property tax and special assessment liens rank first by
  statute regardless of the date of recording. Therefore, the property tax lien for the current year
  must be paid before the mortgage and mechanic's liens. The statement that the lien relating back
  to construction start must be satisfied before any other liens is incorrect because mortgage liens
  do not automatically outrank tax liens.
