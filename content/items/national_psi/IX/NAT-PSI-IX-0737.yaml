stem: What does the habendum clause in a deed primarily define?
options:
  - The estate granted and must agree with the granting clause
  - The legal description of the property boundaries
  - The names of the grantor and grantee parties
  - The amount of consideration stated in the deed
key: A
explanation: The habendum clause ('to have and to hold') defines the estate being granted and must
  agree with the granting clause. It does not state consideration, describe the property, or name
  the parties.
