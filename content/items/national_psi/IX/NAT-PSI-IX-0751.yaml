stem: Two unmarried individuals purchase a property together and the deed does not specify the form
  of co-ownership. What type of ownership is presumed?
options:
  - Community property owned equally by spouses
  - Tenancy by the entirety for married couples only
  - Tenancy in common with unequal shares allowed
  - Joint tenancy with right of survivorship
key: C
explanation: A conveyance to two or more unmarried persons is presumed in most states to create a
  tenancy in common. Joint tenancy requires express language, and tenancy by the entirety is limited
  to spouses.
