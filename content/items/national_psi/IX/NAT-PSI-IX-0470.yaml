stem: Under §10.6, on March 10 the seller has prepaid the annual property tax of $3,600 for the
  calendar year. The closing occurs on March 10, and the parties agree that the closing day is
  charged to the buyer. Using the 365-day method, what is the buyer's tax proration debit?
options:
  - $3,600.00
  - $1,800.00
  - $670.68
  - $2,929.32
key: D
explanation: The seller owned the property from January 1 through March 9 (68 days), leaving the
  buyer with 297 days of ownership. The buyer's share of the prepaid tax is (297/365) × $3,600 =
  $2,929.32. Since the seller prepaid the full amount, the buyer debits this amount at closing. The
  distractor $670.68 represents the seller's share, which would be a credit to the buyer, not a
  debit.
citation:
  source: REP Ref. Financing & Closing § 10.6
  url: null
  quoted_text: Expenses that run with the property over time — property taxes, association dues, rents
    collected in advance, interest on an assumed loan — are divided so each party bears the share
    for its period of ownership. Items the seller paid ahead are credited to the seller and debited
    to the buyer; items accrued but unpaid are debited to the seller and credited to the buyer. Two
    calendar conventions exist (365-day actual, or 360-day with 30-day months), and the closing day
    is charged to one party by agreement or custom; examination problems state the convention.
  secondary: []
math:
  worked_solution: |-
    Seller ownership days: Jan 1 – Mar 9 = 31 (Jan) + 28 (Feb) + 9 (Mar) = 68 days
    Buyer ownership days: 365 – 68 = 297 days
    Buyer's share = (297/365) × $3,600 = $2,929.32
    Buyer's tax proration debit = $2,929.32
  formulas:
    - Proration = (days owned / days in year) × total amount
