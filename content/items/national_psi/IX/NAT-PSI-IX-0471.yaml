stem: What is the legal effect of recording a deed?
options:
  - It gives constructive notice to subsequent purchasers
  - It transfers title between the parties at closing
  - It is required for the deed to be valid and enforceable
  - It fixes the purchase price stated in the sales contract
key: A
explanation: Recording a deed does not transfer title between the parties; instead it gives
  constructive notice to later purchasers, protects the grantee against subsequent purchasers and
  lien creditors, and fixes the priority of interests.
citation:
  source: REP Ref. Financing & Closing § 10.9
  url: null
  quoted_text: Recording is not required to pass title between the parties, but it gives constructive
    notice, protects the grantee against later purchasers and lien creditors, and fixes the priority
    of the buyer's title and the lender's lien; the closing agent records the deed first and the
    security instrument immediately after, in the county where the land lies.
