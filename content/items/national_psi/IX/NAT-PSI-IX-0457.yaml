stem: For an FHA-insured loan, what is the minimum required investment as a percentage of the lesser
  of appraised value or purchase price for a borrower with a decision credit score of 580 or above?
options:
  - 20.00%
  - 3.50%
  - 10.00%
  - 5.00%
key: B
explanation: The rule states that for a borrower with a decision credit score of 580 or above, the
  minimum required investment is 3.5% of the lesser of appraised value or purchase price, making
  3.50% the correct answer. The 5.00% figure applies to borrowers with scores between 500 and 579,
  not to those meeting the 580 threshold.
