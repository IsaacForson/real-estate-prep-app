stem: A buyer acquires real property through a tax sale where the taxing authority sold the property
  itself. What is true regarding warranties in the deed received?
options:
  - The deed includes full warranty of title
  - The deed includes limited warranty against liens
  - The deed carries no warranties whatsoever
  - The deed warrants only against prior claims
key: C
explanation: A tax deed carries no warranties, so the deed received provides no warranties
  whatsoever. A deed that includes a full warranty of title would be inconsistent with that rule.
citation:
  source: REP Ref. Ownership, Title & Transfer § 12.2
  url: null
  quoted_text: A tax deed carries no warranties, and the title may need a quiet title action before it
    is insurable.
