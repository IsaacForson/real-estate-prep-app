stem: A grantor conveys property 'to A for life.' What future interest does the grantor retain?
options:
  - Possibility of reverter only
  - Right of re-entry only
  - Remainder interest only
  - Reversion interest only
key: D
explanation: Under §1.4, when a deed conveys 'to A for life' with no named remainderman, the grantor
  retains a reversion that returns upon the life tenant’s death. The distractor ‘Remainder interest
  only’ is incorrect because a remainder belongs to a third party, not the grantor.
