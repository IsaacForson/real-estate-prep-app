stem: Which of the following covenants in a warranty deed is considered a present covenant that is
  breached, if at all, at the time of delivery?
options:
  - The covenant of seisin
  - The covenant of quiet enjoyment
  - The covenant of warranty
  - The covenant of further assurances
key: A
explanation: The covenant of seisin promises that the grantor holds the title being conveyed; it is
  a present covenant that is breached, if at all, at the moment the deed is delivered. The covenants
  of quiet enjoyment and warranty are future covenants, which are only violated if a superior claim
  arises after delivery.
citation:
