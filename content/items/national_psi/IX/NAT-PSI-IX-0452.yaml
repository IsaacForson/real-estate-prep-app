stem: A seller signs a deed on Monday and places it in escrow with instructions to release it when
  the buyer’s loan funds are received. The buyer’s funds arrive on Thursday, the escrow agent
  releases the deed, and it is recorded on Friday. When does title pass?
options:
  - If the grantor dies before delivery
  - When the deed is signed
  - When the deed is recorded
  - When escrow releases the deed
key: D
explanation: Title passes when the deed is delivered by the grantor and accepted by the grantee, not
  when it is signed or recorded. In the scenario, delivery occurs when the escrow agent releases the
  deed after the buyer’s funds arrive, which is Thursday. The distractor confusing recording with
  delivery is a typical error.
