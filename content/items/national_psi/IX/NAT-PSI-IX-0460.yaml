stem: What two items does a title commitment list?
options:
  - Loan amount and purchase price of the property being financed
  - Buyer's debits and seller's credits on the settlement statement
  - Requirements for insuring and exceptions that will remain
  - Recording fees and transfer tax charged at closing
key: C
explanation: "A title commitment lists the requirements for insuring and the exceptions that will
  remain. The other options describe items that belong elsewhere: loan amount and purchase price are
  financing details, buyer's debits and seller's credits appear on the settlement statement, and
  recording fees and transfer tax are closing costs."
