stem: According to federal TRID rules, what information does the Closing Disclosure provide about
  closing costs?
options:
  - Itemizes every closing cost by who pays it and when
  - Shows only the total cash to close and seller credits
  - Lists only the buyer's down payment and earnest money
  - Provides only the loan's interest rate and APR
key: A
explanation: The Closing Disclosure itemizes every closing cost by who pays it and when, as stated
  in §10.4. The distractor that mentions only the loan amount and interest rate omits the required
  itemization of fees.
