stem: A grantor conveys land 'to the school district so long as it is used for a public school.' The
  district later leases the building to a retail store. According to REP Ref. Ownership, Title &
  Transfer § 1.3, what happens to the title?
options:
  - The estate becomes a fee simple subject to a condition subsequent
  - The grantor must file a lawsuit to retake the property
  - The title reverts automatically to the grantor or grantor's heirs
  - The school district retains title because a lease does not alter the use
key: C
explanation: The phrase 'so long as' creates a fee simple determinable that ends automatically when
  the stated use stops; leasing to a store ends the school use, so title reverts automatically
  without grantor action. The incorrect option describes a condition subsequent, which requires the
  grantor to sue to retake the property.
