stem: A grantor conveys property 'to A for life, then to C.' According to REP Ref. Ownership, Title
  & Transfer § 1.4, what interest does C hold?
options:
  - C holds a leasehold estate for years
  - C holds an estate at sufferance until A's death
  - C holds a reversion that returns to the grantor
  - C holds a remainder and is the remainderman
key: D
explanation: When the deed names a third party after a life estate, that third party holds a
  remainder interest and is called the remainderman; the interest is transferable even though
  possession is postponed. The incorrect option describes a reversion, which occurs when the
  property returns to the grantor.
