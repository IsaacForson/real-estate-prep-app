stem: A property is subject to a mortgage recorded January 1, a mechanic's lien filed March 1, and
  the current year's property tax lien. If the property is sold at foreclosure, which lien is paid
  first?
options:
  - The lien that was recorded first
  - The property tax lien regardless of date
  - The mechanic's lien filed later
  - The mortgage lien recorded earliest
key: B
explanation: Property tax and special assessment liens rank first by statute regardless of the date
  of recording. Therefore the property tax lien is paid before the mortgage or mechanic's lien.
