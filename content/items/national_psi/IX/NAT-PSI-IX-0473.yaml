stem: A neighbor fences and gardens a 10-foot strip of the adjoining lot for longer than the
  statutory period while the record owner neither objects nor gives permission. What is the likely
  outcome of the neighbor's quiet title action?
options:
  - The neighbor acquires title because the possession was hostile and continuous
  - The neighbor does not acquire title because the use was not exclusive
  - The neighbor acquires title only if they paid property taxes
  - The neighbor does not acquire title because the land is government owned
key: A
explanation: Adverse possession requires actual, open and notorious, exclusive, hostile, and
  continuous possession for the statutory period. Fencing and gardening a strip without the owner's
  permission satisfies those elements, so the neighbor can acquire title by quiet title action. The
  other options are incorrect because exclusivity is present, no tax payment is required, and the
  land is not government owned.
