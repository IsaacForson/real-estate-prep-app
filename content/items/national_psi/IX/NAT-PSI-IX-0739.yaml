stem: A buyer purchases a property that the lender acquired through foreclosure and now holds for
  resale. What should the buyer do to protect against undisclosed liens that may have existed before
  the lender took title?
options:
  - Obtain a lender's title policy
  - Rely on the special warranty deed
  - Record the deed immediately
  - Obtain an owner's title policy
key: D
explanation: Buyers of REO properties should obtain an owner's title policy to protect against
  undisclosed liens that may have existed before the lender took title. This policy covers the
  buyer's interest, whereas a lender's policy only protects the lender, and relying on the special
  warranty deed or recording the deed does not address hidden liens.
citation:
  source: REP Ref. Ownership, Title & Transfer § 12.4
  url: null
  quoted_text: The buyer should verify that any redemption period has run and junior liens were
    extinguished, and should obtain an owner's title policy.
