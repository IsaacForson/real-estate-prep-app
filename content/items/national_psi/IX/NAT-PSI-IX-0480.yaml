stem: In a notice jurisdiction, Grantor conveys the same parcel to Buyer A, who does not record.
  Later, Grantor conveys the parcel to Buyer B, who pays value, has no actual or constructive notice
  of A's deed, and records first. Who prevails?
options:
  - Buyer A's claim prevails
  - Buyer B's claim prevails
  - Both claims prevail
  - Neither claim prevails
key: B
explanation: Under a notice statute, a later bona fide purchaser for value without notice (actual or
  constructive) of the earlier interest wins even before recording; Buyer B had no notice and
  recorded first, so prevails. Buyer A's unrecorded deed does not prevail because Buyer B lacked
  notice.
