stem: What does a quitclaim deed convey?
options:
  - Only the grantor's ownership period
  - A guarantee against undisclosed encumbrances
  - Whatever interest the grantor has, if any
  - Full warranty of title against all defects
key: C
explanation: Under §6.6, a quitclaim deed transfers only the interest the grantor actually
  possesses, without any warranties. Therefore the correct answer is whatever interest the grantor
  has, if any. The distractor 'Full warranty of title against all defects' describes a general
  warranty deed, which provides the opposite protection.
citation:
  source: REP Ref. Ownership, Title & Transfer § 6.6
  url: null
  quoted_text: A quitclaim deed conveys whatever interest the grantor has, if any, with no warranties
    and no implication that the grantor has any interest.
