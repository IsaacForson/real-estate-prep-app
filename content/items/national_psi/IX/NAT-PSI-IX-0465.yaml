stem: In a notice state, Grantor conveys the same lot to Buyer A on Monday, who does not record the
  deed. On Wednesday, Grantor conveys the lot to Buyer B, who pays value, has no actual or
  constructive notice of A's deed, and records the deed on Thursday. Who owns the lot?
options:
  - The lot belongs to Buyer A because the deed was first delivered.
  - The lot belongs to Buyer B because they lacked notice and recorded first.
  - The lot is owned undivided by Buyers A and B.
  - The lot reverts to the grantor due to the double conveyance.
key: B
explanation: Under a notice statute a later bona fide purchaser for value without notice wins even
  before recording, so Buyer B prevails. The lot belongs to Buyer A because the deed was first
  delivered is incorrect because mere first delivery does not defeat a later notice‑protected
  purchaser.
