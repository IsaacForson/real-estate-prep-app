stem: Under the text, which situation requires a revised Loan Estimate?
options:
  - The interest rate lock expires before closing
  - The borrower changes the loan amount after application
  - The lender updates the appraisal after closing
  - The changed circumstances that alter the locked terms
key: D
explanation: Changed circumstances that alter the locked terms trigger a revised Loan Estimate. The
  interest rate lock expiring before closing does not change the locked terms, so it does not
  trigger a revised LE. Changing the loan amount after application is not a changed circumstance
  that alters the locked terms under the rule. Updating the appraisal after closing occurs after the
  loan is closed and therefore does not affect the locked terms or require a revised LE.
