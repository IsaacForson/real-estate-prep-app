stem: In a transaction where the purchase agreement specifies that the buyer will pay for the
  owner's title policy, who is responsible for that cost?
options:
  - The lender
  - The seller
  - The agent
  - The buyer
key: D
explanation: The purchase agreement governs who pays for title insurance; if it assigns that cost to
  the buyer, the buyer must pay. Although sellers often cover the cost in many states, the
  contract’s provision supersedes that default.
