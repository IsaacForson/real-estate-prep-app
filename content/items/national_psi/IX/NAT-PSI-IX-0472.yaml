stem: According to the text, what is marketable title?
options:
  - Title that is considered marketable only after a title insurance policy is issued
  - Title that is free from reasonable doubt and acceptable to a prudent buyer
  - Title that is free of defects created during the grantor's ownership only
  - Title that is guaranteed by the grantor's covenant of seisin and right to convey
key: B
explanation: Marketable title is defined as title free from reasonable doubt that a prudent buyer
  would accept, not subject to undisclosed liens or encumbrances, and not exposing the buyer to
  litigation. It need not be perfect, and its adequacy is judged at closing, not only after
  recording. The other options either impose perfection, allow undisclosed liens, or misstate when
  title is judged.
citation:
  source: REP Ref. Ownership, Title & Transfer § 10.5
  url: null
  quoted_text: "Marketable title is title free from reasonable doubt: one a reasonably prudent,
    well-informed buyer would accept, not subject to undisclosed liens or encumbrances, and not
    exposing the buyer to litigation."
