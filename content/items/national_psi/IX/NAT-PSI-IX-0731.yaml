stem: Which of the following is **NOT** required for a deed to be valid between the parties?
options:
  - Legally competent grantor
  - An identifiable grantee
  - The words of conveyance
  - A recorded acknowledgment
key: D
explanation: Under §6.1, a deed requires a competent grantor, an identifiable grantee, and words of
  conveyance, but an acknowledgment is only needed for recording, not for validity between the
  parties. The distractor ‘Legally competent grantor’ is incorrect because grantor competence is
  essential for a valid deed.
