stem: A seller tells a neighbor, 'Talk to my nephew about buying the lot; he handles that for me.'
  The nephew negotiates terms with the neighbor. According to the text, what is the legal effect?
options:
  - The seller is bound only if the nephew is a licensed real estate agent
  - The seller may be bound due to ostensible agency and estoppel
  - The seller is not bound because no written agency agreement exists
  - The seller is bound only if the nephew receives a commission
key: B
explanation: Ostensible agency arises when a principal's words lead a third party to reasonably
  believe that someone is the agent, and the principal is then estopped from denying that agency. In
  this case, the seller's statement to the neighbor created such belief, so the seller may be bound
  by the nephew's negotiations.
