stem: A licensee presents an offer to a seller without having a listing agreement. The seller
  accepts the offer. According to the text, what best describes the licensee's relationship to the
  seller after acceptance?
options:
  - The licensee is the seller's customer
  - The licensee is a subagent for the seller
  - The licensee has no agency relationship
  - The licensee is the seller's agent
key: D
explanation: By accepting the offer, the seller ratifies the licensee's unauthorized act, treating
  the licensee as if authorized from the beginning and thus creating an agency relationship. The
  licensee is not merely a customer, subagent, or unrelated party.
citation:
  source: "REP Ref. Agency — Reference note: agency relationships, creation/termination, fiduciary
