stem: A seller instructs the listing agent to refuse to show the property to families with children.
  According to the fiduciary duty of obedience, what must the agent do?
options:
  - Follow the instruction because it is the seller's lawful request.
  - Refuse to follow the instruction because it would violate fair housing law.
  - Show the property only to families with children to avoid discrimination.
  - Seek the broker's approval before deciding whether to comply.
key: B
explanation: The duty of obedience requires the agent to follow only lawful instructions;
  instructions to break the law, such as refusing to show the property to families with children in
  violation of the Fair Housing Act, must be refused. An agent who follows an unlawful instruction
  is personally liable. The other options either suggest compliance with an unlawful directive,
  defer to the broker, or propose a discriminatory action that also violates the law.
