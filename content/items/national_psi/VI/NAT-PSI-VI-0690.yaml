stem: "Conversion is best defined as:"
options:
  - Failing to disclose known material defects to a customer
  - Using client funds for an unauthorized purpose such as paying payroll
  - Mixing client funds with the brokerage's operating account
  - Providing forms and scheduling showings for an unrepresented buyer
key: B
explanation: Conversion occurs when someone uses money that belongs to another person for a purpose
  that was not authorized, such as using earnest money to pay office payroll. Mixing client funds
  with the brokerage’s operating account is commingling, not conversion. Failing to disclose
  material defects relates to disclosure duties, and providing forms and scheduling showings for an
  unrepresented buyer is a ministerial act.
