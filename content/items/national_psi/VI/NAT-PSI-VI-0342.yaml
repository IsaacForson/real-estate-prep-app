stem: Under the fiduciary duty of obedience, what must an agent do if the principal instructs the
  agent to conceal a known defect in the property?
options:
  - Follow the instruction because the principal is the client
  - Refuse to follow the instruction because it is unlawful
  - Follow the instruction but disclose the defect to the buyer
  - Seek the broker's approval before deciding
key: B
explanation: The duty of obedience requires an agent to follow the principal's lawful instructions,
  but an agent must refuse any instruction that would violate the law, such as concealing a known
  defect. Following an unlawful instruction makes the agent personally liable. Therefore, the agent
  must refuse to conceal the defect.
