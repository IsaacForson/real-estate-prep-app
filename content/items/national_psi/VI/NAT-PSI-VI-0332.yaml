stem: A listing agent learns that the buyer, whose offer is pending, has just been laid off and may
  be unable to obtain financing. According to the fiduciary duty of disclosure, what must the agent
  do?
options:
  - The agent must inform the seller about the buyer's change in employment status
  - The agent must keep the information confidential to protect the buyer's negotiating position
  - The agent must disclose the information only if the buyer asks the agent to do so
  - The agent must use the information to advise the buyer to increase the offer amount
key: A
explanation: The agent must disclose to the principal (the seller) every fact that could affect the
  principal's decisions; the buyer's employment change affects the seller's assessment of the
  offer's reliability. The distractor advocating confidentiality misstates the duty, which requires
  disclosure to the client, not concealment.
citation:
  source: REP Ref. Agency § 5.4 Disclosure (full disclosure to the principal)
  url: null
