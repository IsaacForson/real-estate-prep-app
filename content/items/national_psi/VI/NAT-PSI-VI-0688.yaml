stem: Under the agency classification, a salesperson is generally treated as which type of agent of
  the sponsoring broker?
options:
  - The universal agent
  - The general agent
  - The special agent
  - The subagent role
key: B
explanation: A salesperson is generally treated as a general agent of the sponsoring broker, meaning
  the salesperson can act for the broker in all matters related to the brokerage business. A
  universal agent would have broader authority, but such agents are rare in real estate brokerage.
