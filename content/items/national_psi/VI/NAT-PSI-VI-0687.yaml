stem: A licensee knows of a latent defect in a property that the buyer could not discover through
  reasonable inspection. What must the licensee do?
options:
  - Wait until the buyer asks about the property's condition before mentioning it.
  - Disclose the defect to all parties because it is a material fact.
  - Not disclose the defect if the seller instructs the agent to keep it confidential.
  - Disclose the defect only to the seller, as the buyer is responsible for inspection.
key: B
explanation: A licensee who knows of a latent defect that a buyer could not discover through
  reasonable inspection must disclose that defect to all parties, because it is a material fact.
  This duty cannot be waived by the client.
