  url: null
  quoted_text: Some states allow a licensee to assist one or both parties without representing either
    — as a transaction broker, facilitator, or intermediary (terminology varies). A non-agent owes
    no fiduciary loyalty but is still bound by statutory duties that commonly include honesty,
    disclosure of known material facts about the property, accounting for funds, reasonable skill
    and care, and confidentiality of certain information. A transaction broker does not negotiate
    for either party.
