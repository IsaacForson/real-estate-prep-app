stem: "According to the text, a transaction broker is best described as:"
options:
  - Assists both parties without representing either and does not negotiate for either party.
  - Acts as a universal agent with authority to bind the principal in all matters.
  - Is permitted only in states that have abolished dual agency.
  - Represents either the buyer or the seller and owes fiduciary loyalty to that client.
key: A
explanation: A transaction broker assists one or both parties without representing either and
  therefore owes no fiduciary loyalty, while still being bound by duties such as honesty, disclosure
  of known material facts, accounting, reasonable skill and care, and confidentiality of certain
  information. A transaction broker does not negotiate for either party. The other options
  incorrectly attribute representation, fiduciary loyalty, universal authority, or a restriction to
  states that have abolished dual agency.
citation:
