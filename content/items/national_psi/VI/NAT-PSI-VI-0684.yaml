stem: A brokerage lists a property for a seller and also represents a buyer as a client. The buyer
  wants to make an offer on that property. What must the brokerage do before proceeding?
options:
  - Obtain verbal consent from both parties
  - Obtain written consent from only the seller
  - Obtain informed written consent from both parties
  - Obtain informed consent from both parties orally
key: C
explanation: Dual agency is permitted only when the brokerage obtains informed written consent from
  both the seller and the buyer. Obtaining only verbal consent or consent from only one party does
  not meet this requirement.
