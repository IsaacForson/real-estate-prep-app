stem: A licensee representing a buyer learns that the buyer has just been laid off and may be unable
  to obtain financing. According to the fiduciary duty of disclosure to the principal, what must the
  licensee do?
options:
  - Wait until after closing to disclose the information
  - Advise the buyer to hide the layoff from the seller
  - Inform the seller-client about the buyer's potential financing difficulty
  - Keep the information confidential to protect the buyer's negotiating position
key: C
explanation: Under the duty of disclosure to the principal, the agent must reveal any known fact
  that could affect the principal's decisions, including the buyer's potential financing problems.
  Keeping the information confidential would violate this duty. Thus, the agent must inform the
  seller-client.
