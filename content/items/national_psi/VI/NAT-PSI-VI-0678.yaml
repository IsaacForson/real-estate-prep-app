stem: Which of the following best describes commingling?
options:
  - Mixing client funds with brokerage operating funds
  - Failing to disclose a known roof leak
  - Using puffing statements in advertising
  - Advising a client on tax consequences without expertise
key: A
explanation: Under § 8.1 Commingling, commingling occurs when a licensee mixes client funds with the
  brokerage's own funds, such as depositing earnest money into the operating account. This is a
  violation regardless of whether money is lost. The distractor about failing to disclose a roof
  leak relates to material‑fact disclosure, not commingling.
