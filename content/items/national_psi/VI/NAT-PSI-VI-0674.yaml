stem: What is the characteristic authority of a special agent in real estate brokerage?
options:
  - May do anything the principal could lawfully do
  - May bind the principal to contracts within a scope
  - May act for the principal in a continuing business
  - May perform one specific task without binding power
key: D
explanation: A special agent is limited to performing a single, specific task and generally does not
  have authority to bind the principal to a contract. The option stating that the agent may perform
  one specific task without binding power matches this definition. The option stating that the agent
  may act for the principal in a continuing business describes a general agent's authority, not that
  of a special agent.
