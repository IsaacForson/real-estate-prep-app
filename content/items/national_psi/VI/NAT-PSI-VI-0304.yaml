stem: Under the duty of confidentiality, which of the following is **NOT** considered protected
  information that an agent must **NOT** reveal without principal authorization?
options:
  - The material facts about the property's physical condition.
  - The seller's willingness to accept less than list price.
  - The seller's reason for selling, such as divorce or job relocation.
  - The buyer's maximum price or urgency to close quickly.
key: A
explanation: The duty of confidentiality protects information that could weaken the principal's
  bargaining position, such as the seller's willingness to accept less than list price, the reason
  for selling, and the buyer's maximum price or urgency. However, confidentiality does not cover
  material facts about the property's physical condition or legal status that the law requires to be
  disclosed to the other party. Therefore, material facts about the property's physical condition
  are not protected information.
