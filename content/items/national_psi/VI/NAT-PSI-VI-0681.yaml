stem: What is the primary limitation of a special agent (limited agent) in real estate brokerage?
options:
  - The agent may perform one specific task and usually cannot bind the principal.
  - The agent may bind the principal to any contract within the agency scope.
  - The agent may perform any lawful act the principal is able to do lawfully.
  - The agent must obtain informed written consent from both parties before acting.
