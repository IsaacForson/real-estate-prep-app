stem: After the agency relationship ends, the former listing agent must continue to do which of the
  following?
options:
  - The agent must account for any funds already received
  - The agent must maintain loyalty to the former client
  - The agent must keep confidential information secret
  - The agent must continue to obey the former client’s instructions
key: A
explanation: Upon termination, duties of loyalty and obedience end, but the duty to account for
  money already received continues until the accounting is complete. Confidentiality generally
  survives, but the question asks specifically about the duty that continues until accounting is
  finished, which is accounting.
