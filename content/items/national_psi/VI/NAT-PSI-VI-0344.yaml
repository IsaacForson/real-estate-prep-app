stem: If the sole-proprietor broker of a real estate firm dies, what is the effect on the firm's
  existing listing agreements under general agency law?
options:
  - The listings remain valid because the salesperson can continue as agent
  - The listings automatically transfer to the broker's heirs or personal representative
  - The listings continue but require a new written agreement with the seller
  - The listings are terminated because the broker's death ends the agency relationship
key: D
explanation: Because the agency relationship is personal, the death of a sole‑proprietor broker
  terminates the firm's listings; the death of a salesperson does not affect them. Hence, the
  broker's death ends the listing agreements.
