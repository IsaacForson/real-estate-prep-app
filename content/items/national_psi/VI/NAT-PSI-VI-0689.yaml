stem: If a seller tells a neighbor, 'Talk to my nephew about buying the lot; he handles that for
  me,' and the nephew negotiates terms with the neighbor, what doctrine may bind the seller to the
  nephew's actions even though no formal agency was created?
options:
  - The implied agency
  - The express agency
  - The ratification
  - The ostensible agency
key: D
explanation: Ostensible (apparent) agency occurs when a principal’s words or conduct cause a third
  party to reasonably believe that another person is the principal’s agent, and the third party
  relies on that belief. Because the seller told the neighbor to talk to his nephew about buying the
  lot, a reasonable person could think the nephew had authority to act for the seller, so the seller
  may be bound by the nephew’s negotiations even though no formal agency was created. Implied
  agency, by contrast, arises from the agent’s own conduct, not from the principal’s
  representations.
