stem: A licensee shows a property to an unrepresented buyer, advises the buyer on what offer to
  make, negotiates the offer, and tells the buyer 'I'll take care of you.' According to the text,
  what agency relationship has most likely been created?
options:
  - Express agency
  - Subagency
  - Implied agency
  - Universal agency
key: C
explanation: The described conduct—advising on price, negotiating, and assuring the buyer they will
  be taken care of—creates an agency by conduct, i.e., implied agency, absent an express agreement.
  Express agency requires a written or oral agreement, which is not indicated.
citation:
  source: "REP Ref. Agency — Reference note: agency relationships, creation/termination, fiduciary
    duties, disclosure (authored, status: draft — needs licensed review) § 3.2 Implied agency
    (agency by conduct)"
  url: null
  quoted_text: A licensee who advises an unrepresented buyer on what to offer, negotiates on the
    buyer's behalf, and tells the buyer 'I'll take care of you' may have become the buyer's implied
    agent — and if the licensee is also the listing agent, an undisclosed dual agent.
