stem: A licensee represents a buyer but is paid from the seller's proceeds at closing. According to
  the text, what must the licensee disclose to the buyer?
options:
  - That the buyer must pay the licensee directly at closing.
  - That the licensee is actually the seller's agent in the transaction.
  - That the compensation arrangement exists and who is paying it.
  - That the amount of the commission being paid is disclosed.
key: C
explanation: Compensation arrangements must be disclosed to all parties regardless of who pays the
  licensee, because who pays does not determine whom the licensee represents. The licensee must
  disclose that a compensation arrangement exists and identify the party providing the payment. The
  other options either misstate the agency relationship, focus only on the amount, or incorrectly
  state that the buyer must pay the licensee directly.
citation:
  source: "REP Ref. Agency — Reference note: agency relationships, creation/termination, fiduciary
    duties, disclosure (authored, status: draft — needs licensed review) § 3.5"
  url: null
  quoted_text: Who pays the licensee does not decide whom the licensee represents. A buyer's agent may
    be paid from the seller's proceeds, by the listing broker's cooperative offer, or by the buyer
    directly, and remains the buyer's agent in every case. Conversely, a licensee who is paid
    nothing may still be an agent (a gratuitous agent) with full fiduciary duties. Agency is created
    by agreement or conduct (§§ 3.1–3.4), not by the flow of money. Compensation arrangements should
    nevertheless be disclosed to all parties (§ 7.3).
