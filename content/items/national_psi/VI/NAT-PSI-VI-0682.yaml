stem: After closing, a former listing agent tells a friend the seller's bottom line price. According
  to the text, which duty is violated?
options:
  - The duty of loyalty to the client
  - The duty of confidentiality to the client
  - The duty of obedience to the client
  - The duty of reasonable care and diligence
key: B
explanation: The duty of confidentiality survives termination and prohibits a former listing agent
  from disclosing the seller's bottom line price. Loyalty addresses self‑dealing and secret profits,
  not post‑termination disclosure of confidential information.
citation:
  source: REP Ref. Agency § 4.3
  url: null
  quoted_text: "The duty of confidentiality generally survives the end of the agency: a former listing
    agent may not later tell a buyer what the former seller-client's bottom line was"
