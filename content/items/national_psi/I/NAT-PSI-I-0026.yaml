stem: In a western state that follows the doctrine of prior appropriation, how are rights to use
  water from a river determined?
options:
  - By ownership of any land that touches the river bank
  - By equal shares among all owners along the river
  - By the county assessor's annual water allocation
  - By permit, with the earliest user holding priority
key: D
explanation: Under prior appropriation, used in many western states, water rights are obtained by
  permit apart from land ownership, and the earliest user has priority over later users. Under the
  riparian and littoral doctrines, by contrast, an owner whose land touches the water has a right to
  reasonable use. Which system applies varies by state.
