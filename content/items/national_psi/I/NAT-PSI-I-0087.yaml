stem: A legal description includes both an iron pin (an artificial monument) and an oak tree (a
  natural monument) as boundary markers. If the two markers conflict, which controls under the usual
  rule of construction?
options:
  - The oak tree
  - The adjoining boundary
  - The iron pin
  - The course and distance
key: A
explanation: The rule of construction ranks natural monuments first, then artificial monuments, then
  adjoining boundaries, then courses, then distances, and stated area last. Therefore, the natural
  monument (the oak tree) prevails over the artificial iron pin.
