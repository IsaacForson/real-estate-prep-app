stem: A property owner fails to pay the annual property tax bill. What action may the taxing
  authority take to enforce the lien?
options:
  - Filing a lis pendens notice against the title
  - Placing a mechanic's lien on the property title
  - Initiating a tax foreclosure sale to satisfy debt
  - Seeking a judgment lien on the owner's property
key: C
explanation: The rule states that if a lien is unpaid, the lienholder can force a sale and be paid
  from the proceeds. Therefore, the taxing authority may initiate a foreclosure sale to satisfy the
  tax debt. Filing a lis pendens notice merely records pending litigation and does not itself
  collect the debt.
