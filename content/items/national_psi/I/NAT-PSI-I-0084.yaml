stem: A residential property is assessed at $400,000. The municipality applies a tax rate of 20
  mills, and the owner qualifies for a $40,000 homestead exemption. What is the annual property tax?
options:
  - $8,000
  - $72,000
  - $3,600
  - $7,200
key: D
explanation: Taxable value is $400,000 minus $40,000 exemption = $360,000. At 20 mills ($1 per
  $1,000), the tax rate is 0.02. Multiplying $360,000 by 0.02 yields $7,200.
citation:
  source: REP Ref. Property & Land Use § 4.4
  url: null
  quoted_text: taxing bodies apply a rate expressed per hundred, per thousand, or in mills; one mill
    is one-tenth of a cent, that is, $1 of tax per $1,000 of assessed value.
  secondary: []
math:
  worked_solution: 1. Taxable value = $400,000 - $40,000 = $360,000\n2. Mill rate decimal = 20 mills ÷
    1000 = 0.02\n3. Tax = $360,000 × 0.02 = $7,200
  formulas:
