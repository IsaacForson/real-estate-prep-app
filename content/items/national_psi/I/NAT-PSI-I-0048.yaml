stem: In a cooperative ownership arrangement, what does a resident actually own?
options:
  - Fee simple title to the unit
  - Shares of the corporation and a proprietary lease
  - A right-to-use contract for a term of years
  - A deeded fractional interest in the unit
key: B
explanation: In a cooperative ownership arrangement, a resident purchases shares of the corporation
  that owns the building and receives a proprietary lease granting the right to occupy a specific
  unit. This means the resident owns stock and a leasehold interest, not real estate. Fee simple
  title is not conveyed in a cooperative.
