stem: A commercial tenant installs built-in shelving bolted to the wall of the leased space to
  display merchandise. The lease agreement includes a clause stating that the tenant may remove the
  shelving at the lease’s end and must repair any damage. When the lease ends, what is the tenant’s
  right regarding the shelving?
options:
  - The tenant may not remove the shelving because it became real property.
  - The tenant may remove the shelving but is not required to repair any damage.
  - The tenant may remove the shelving and must repair any damage.
  - The tenant must leave the shelving because it is a fixture.
key: C
explanation: Because the lease contains a written clause that allows the tenant to remove the
  installed shelving at the end of the lease and requires the tenant to repair any damage, that
  agreement controls the fixture analysis. A written landlord‑tenant agreement supersedes the common
  fixture tests, so the tenant is entitled to remove the shelving but must fix any damage caused by
  the removal. The choice stating the tenant cannot remove the shelving treats it as real property,
  which conflicts with the agreement. The choice that allows removal without a repair obligation
  ignores the lease requirement. The choice that requires the tenant to leave the shelving treats it
  as a fixture despite the written clause.
