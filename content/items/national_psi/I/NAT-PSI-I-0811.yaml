stem: An owner of a triangular lot cannot satisfy the 30‑foot front setback requirement because of
  the lot’s shape. The owner applies for an area variance to reduce the setback to 18 feet. The
  hardship is due to the lot’s geometry and existed before the owner purchased the property. How
  should the zoning board of appeals likely rule?
options:
  - The zoning board of appeals must deny the variance because financial hardship is the only basis
    for an area variance.
  - The zoning board of appeals may grant a use variance instead, as area variances are not
    permitted for lot shape issues.
  - The zoning board of appeals may grant the variance only if the owner proves that no reasonable
    use of the land is possible without the deviation.
  - The zoning board of appeals may grant the area variance because the hardship stems from the
    lot's shape and existed before the owner acquired the property.
key: D
explanation: An area variance is appropriate when the hardship is unique to the property, not
  self‑created, and the adjustment does not harm the public; here the hardship arises from the lot’s
  shape and predates the owner, satisfying those criteria.
