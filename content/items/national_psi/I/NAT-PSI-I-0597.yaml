stem: A buyer purchases a house and receives a deed. What does the deed transfer?
options:
  - The deed transfers land, attachments, and ownership rights.
  - The deed transfers only the legal rights of ownership.
  - The deed transfers the land surface and subsurface only.
  - The deed transfers the land and any permanent human-made attachments.
key: A
explanation: Real property is defined as land together with the legal rights of ownership, often
  described as a bundle of rights to possess, control, use, enjoy, exclude, and dispose. Because a
  deed conveys real property, it transfers the land itself, any permanent improvements attached to
  the land, and the full bundle of ownership rights. A statement that the deed transfers only the
  legal rights of ownership omits the land and its attachments, so it is incomplete. A statement
  that the deed transfers only the surface and subsurface of the land leaves out both the ownership
  bundle and any improvements, making it incorrect. A statement that the deed transfers land and
  permanent human-made attachments but does not mention the ownership rights fails to include the
  complete bundle of rights.
