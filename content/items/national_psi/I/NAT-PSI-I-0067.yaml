stem: In a fee (interval-ownership) timeshare, what does each purchaser receive?
options:
  - A deeded fractional interest that can be sold or willed.
  - A contract right, license, or lease for a term of years.
  - Stock in the corporation and a proprietary lease.
  - Fee title to the lot while the association owns the common areas.
key: A
explanation: The key is correct because §5.3 states that in a fee (interval-ownership) timeshare
  each purchaser receives a deeded fractional interest that can be sold or willed. The distractor
  describing a contract right applies to a right-to-use timeshare, not a fee interest. The other
  distractors describe cooperative and PUD ownership, which are unrelated to timeshare arrangements.
