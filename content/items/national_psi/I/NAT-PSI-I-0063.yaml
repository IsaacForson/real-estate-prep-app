stem: A property owner operates a small grocery store in a building that was lawful when
  constructed. The municipality later rezones the block to single-family residential, prohibiting
  commercial uses. The owner wishes to continue operating the grocery store. Which statement is
  correct regarding the owner's ability to continue the use?
options:
  - The owner may continue only if they obtain a variance from the zoning board
  - The owner may continue the grocery store and may expand it as needed
  - The owner must cease operations immediately because the use is now prohibited
  - The owner may continue the grocery store but may not enlarge or intensify the use
key: D
explanation: Under the nonconforming use doctrine, an existing lawful use that becomes noncompliant
  due to a zoning change may continue as a legal nonconforming use, but the privilege does not allow
  enlargement or intensification of the use. Therefore, the owner may continue the grocery store but
  may not enlarge or intensify it. The distractor suggesting immediate cessation is incorrect
  because the use is grandfathered.
citation:
