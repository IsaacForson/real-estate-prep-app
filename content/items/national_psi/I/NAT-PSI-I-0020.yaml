stem: A barber vacates a leased shop and leaves the barber chairs bolted to the floor after the
  lease has already ended. Who generally owns the chairs?
options:
  - The barber, as trade fixtures
  - The landlord, by accession
  - The next tenant, by annexation
  - The lender, under its mortgage lien
key: B
explanation: Barber chairs installed by a business tenant are trade fixtures and remain the tenant's
  personal property while the lease runs, but the tenant must remove them before the lease ends.
  Trade fixtures left behind after the lease ends generally become the landlord's property by
  accession, so the barber loses them by leaving them in place.
