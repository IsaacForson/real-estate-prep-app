stem: A buyer purchases a timeshare week and receives a deed to the fractional interest. Which type
  of timeshare allows the buyer to will the interest to heirs?
options:
  - A right-to-use (licensed) timeshare
  - A fee (interval-ownership) timeshare
  - A leasehold (non-deeded) timeshare
  - A mortgage-backed (financed) timeshare
key: B
explanation: The key is correct because a fee (interval-ownership) timeshare grants a deeded
  fractional interest that can be sold or willed, per the timeshare section. The most tempting
  distractor describes a right-to-use timeshare, which only provides a contract right and does not
  allow the owner to will the interest.
