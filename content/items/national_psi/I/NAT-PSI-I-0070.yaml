stem: According to the definition, real property consists of land plus permanent human-made
  attachments and which of the following?
options:
  - The economic characteristics such as scarcity and area preference
  - The legal rights of ownership, often described as a bundle of rights
  - The physical characteristics such as immobility and indestructibility
  - The government powers such as police power and eminent domain
key: B
explanation: As defined, real property consists of real estate plus the legal rights of ownership,
  often described as a bundle of rights (see § 1.1). The most tempting distractor, B, lists only the
  land’s physical characteristics, which alone do not constitute real property; those traits
  describe land itself, not the ownership rights that make up real property.
