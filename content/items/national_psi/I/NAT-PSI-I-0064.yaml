stem: Under the Fifth Amendment, what is required when the government takes private property for
  public use?
options:
  - The government must pay just compensation when taking private property for public use.
  - The government must obtain the owner's consent before taking private property for public use.
  - The government must provide relocation assistance but not compensation when taking private
    property for public use.
  - The government must not pay any compensation when taking private property for public use.
key: A
explanation: Eminent domain is the government's power to take private property for public use upon
  payment of just compensation, so just compensation must be paid. The owner's consent is not
  required; the government may proceed without it if the taking is for a legitimate public use.
