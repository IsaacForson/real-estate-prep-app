stem: A seller discovers an undisclosed lien on the property just before closing and cannot remove
  it in time. What may the buyer generally do?
options:
  - The buyer may cancel the contract and recover the deposit, then walk away from the purchase.
  - The buyer may accept the title as is and waive the deposit, proceeding with the purchase.
  - The buyer may proceed with closing and rely on title insurance to cover the lien, assuming the
    policy is valid.
  - The buyer may sue the seller for specific performance to force the sale to close and recover
    damages.
key: A
explanation: Under the governing rule, if a seller cannot cure a title defect in time, the buyer may
  generally cancel the contract and recover the deposit or accept the title as is. The correct
  choice describes the buyer canceling and recovering the deposit. The option suggesting the buyer
  accept the title as is and waive the deposit is incorrect because accepting the title as is does
  not involve waiving the deposit; the buyer would still pay the purchase price. The option about
  relying on title insurance is incorrect because the standard remedy is to cancel or accept, not to
  rely on insurance for an undisclosed lien. The option about suing for specific performance is
  incorrect because specific performance forces the sale but does not address the title defect
  directly in this context.
citation:
  source: REP Ref. Ownership, Title & Transfer § 10.5
