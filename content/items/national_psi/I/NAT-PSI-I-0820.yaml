stem: A tenant plants corn on leased farmland, but the lease is terminated early due to the
  landlord's decision to sell the property. Under the REP Ref. Property & Land Use, what right does
  the tenant have regarding the corn?
options:
  - The tenant may re-enter to harvest the corn before it is spoiled.
  - The tenant forfeits all rights to the corn because the lease ended.
  - The tenant must obtain the landlord's permission to harvest the corn.
  - The tenant must abandon the corn as it becomes the landlord's property.
key: A
explanation: Under the doctrine of emblements, annual crops grown by a tenant are considered the
  tenant's personal property. If the lease ends through no fault of the tenant—for example, because
  the landlord sells the property—the tenant retains the right to re‑enter the land and harvest the
  crop before it spoils. Therefore, the tenant may re‑enter to harvest the corn before it is
  spoiled.
citation:
  source: REP Ref. Property & Land Use § 1.5
  url: null
  quoted_text: Annual crops produced by cultivation are treated as personal property of the person who
    planted them and are called emblements. Under the doctrine of emblements, a tenant whose tenancy
    ends through no fault of the tenant at an unpredictable time may re-enter to harvest crops the
    tenant planted.
