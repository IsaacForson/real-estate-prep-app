stem: A grantor executes a deed and delivers it to the grantee, but the deed omits a legal
  description of the property. Based on the requirements for a valid deed, is the deed valid?
options:
  - No, because an adequate legal description is required for a valid deed
  - Yes, because delivery and acceptance are sufficient for validity
  - Yes, if the grantee accepts the deed and records it promptly
  - No, unless the deed is accompanied by a separate affidavit describing the property
key: A
explanation: A valid deed must contain an adequate legal description of the property; without it the
  deed is invalid, even if delivered and accepted. The option stating that delivery and acceptance
  alone are sufficient is incorrect because it ignores the description requirement.
