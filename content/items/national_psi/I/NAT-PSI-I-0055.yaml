stem: Which of the following liens is classified as a general, involuntary lien?
options:
  - Mortgage lien
  - Judgment lien
  - Property tax lien
  - Mechanic's lien
key: B
explanation: Under the statute, a judgment lien is classified as a general lien because it attaches
  to all of the debtor's real and personal property, and it is involuntary because it arises by
  court action without the owner's consent. The property tax lien, while involuntary, is specific as
  it attaches only to the parcel taxed. Therefore, the judgment lien is the only option that is both
  general and involuntary.
