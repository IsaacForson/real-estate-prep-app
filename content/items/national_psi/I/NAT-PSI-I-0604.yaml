stem: A grantor conveys property 'to A for the life of B'. If A dies before B, who holds the
  property until B's death?
options:
  - The grantor's reversion
  - The remainderman C
  - The heirs of A
  - The life tenant B
key: C
explanation: When the measuring life is someone else, the estate is pur autre vie; if the life
  tenant dies first, the life tenant's heirs hold the estate until the measuring life ends per §
  1.4. The grantor's reversion would only apply if no remainder were named, which is not the case
  here.
