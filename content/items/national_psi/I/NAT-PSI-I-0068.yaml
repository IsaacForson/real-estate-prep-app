stem: On Tuesday a grantor conveys a parcel to X, who does not record. On Friday the same grantor
  conveys the parcel to Y, who pays value, has no actual or constructive notice of X's deed, and
  records the same day. In a notice jurisdiction, who prevails?
options:
  - The lot belongs to X alone.
  - The lot belongs to Y alone.
  - The lot belongs to both X and Y.
  - The lot belongs to the grantor.
key: B
explanation: Under a notice statute a later bona fide purchaser for value without notice wins even
  before recording, as stated in §9.3. Y paid value and lacked notice, so Y's interest prevails over
  X's unrecorded deed. The distractor favoring X ignores the notice statute's protection for a BFP
  who lacks notice.
