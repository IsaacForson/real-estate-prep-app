stem: A tenant has been holding over after a lease ended and the landlord accepted rent, creating a
  month-to-month tenancy. What must the landlord do before requiring the tenant to vacate?
options:
  - The landlord must obtain a court order before requiring the tenant to vacate
  - The landlord must file a lawsuit before requiring the tenant to vacate
  - The landlord must provide a written notice before requiring the tenant to vacate
  - The landlord must give statutory notice before requiring the tenant to vacate
key: D
explanation: A month-to-month periodic tenant must receive statutory notice before being required to
  leave. Therefore, the landlord must give statutory notice before requiring the tenant to vacate.
  Filing a lawsuit or obtaining a court order is not required prior to vacating under this rule, and
  while a written notice may be the form of statutory notice, the rule specifically requires
  statutory notice, not merely any written notice.
