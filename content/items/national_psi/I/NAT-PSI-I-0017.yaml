stem: Which of the following is an improvement that makes a parcel real estate rather than simply land?
options:
  - Mineral deposits lying beneath the surface
  - A mature oak growing on the lot
  - A well drilled and cased on the parcel
  - Airspace above the parcel
key: C
explanation: Land is the surface, the subsurface, the airspace, and things attached by nature such
  as trees and water. Real estate is land plus permanent human-made attachments called improvements,
  such as buildings, fences, wells, and paving. A drilled well is a human-made improvement;
  minerals, airspace, and a naturally growing tree are all part of the land itself.
