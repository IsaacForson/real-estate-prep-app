stem: A buyer places a manufactured home on a concrete foundation on land they own and completes the
  state‑required title‑surrender procedure. How should the home be classified after these steps?
options:
  - It is classified as real property
  - It is still personal property with vehicle title
  - It is a trade fixture of the land
  - It remains personal property if land not owned
key: A
explanation: When a manufactured home is permanently affixed to a foundation on land the owner owns
  and the state title‑surrender procedure is completed, it becomes real property. Until those steps
  are done, it remains personal property.
citation:
  source: REP Ref. Property & Land Use § 1.6
  url: null
  quoted_text: A manufactured home is personal property while it carries a vehicle-type title; it may
    become real property when permanently affixed to a foundation on land the owner holds and a
    state conversion or title-surrender procedure is completed.
