stem: If a grantor breaches the covenant against encumbrances in a warranty deed, when is the breach
  considered to have occurred?
options:
  - The breach occurs when a superior claim is later asserted.
  - The breach occurs at the time the defect is discovered.
  - The breach occurs at delivery of the deed.
  - The breach occurs after the grantee records the deed.
key: C
explanation: The covenant against encumbrances is one of the present covenants in a warranty deed;
  present covenants are breached, if at all, at the moment the deed is delivered. Therefore the
  breach occurs at delivery. The statement that the breach occurs when a superior claim is later
  asserted describes a future covenant, which is only breached when such a claim arises.
citation:
  source: REP Ref. Ownership, Title & Transfer § 6.2
  url: null
  quoted_text: The first three are present covenants, breached if at all at delivery; the last three
    are future covenants, breached only when a superior claim is later asserted.
