stem: Under eminent domain, what is included in just compensation for a partial taking of property?
options:
  - The compensation includes the fair market value of the taken portion plus severance damages
  - The compensation includes only the fair market value of the remainder
  - The compensation includes only the fair market value of the taken portion
  - The compensation includes the original purchase price of the entire parcel
key: A
explanation: The rule states that just compensation is the fair market value of what is taken plus,
  for a partial taking, any loss in value to the remainder (severance damages). Therefore, the
  correct answer includes both the taken portion's value and severance damages. The distractor that
  omits severance damages is incorrect because it ignores the loss in value to the remaining
  property.
