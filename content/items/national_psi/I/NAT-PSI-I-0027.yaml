stem: A deed conveying a lakefront lot says nothing about the recorded right-of-way the lot has long
  enjoyed over a neighbor's driveway. What happens to that right-of-way when the lot is sold?
options:
  - It passes to the buyer as an appurtenance to the lot
  - It is extinguished because the deed did not expressly mention it
  - It reverts to the neighbor who originally granted it
  - It stays with the seller as a personal right of use
key: A
explanation: An appurtenance is a right that belongs to and passes with the land even if the deed
  does not name it. A recorded right-of-way benefiting the lot is an appurtenant easement, so it
  transfers automatically with the dominant parcel to the new owner; the deed's silence neither
  extinguishes it nor leaves it with the seller.
