stem: A neighbor openly and continuously uses a vacant lot adjacent to his property for 8 years,
  maintaining a garden and paying property taxes, without the owner's permission. The state's
  statutory period for adverse possession is 10 years. Which element is lacking for the neighbor to
  acquire title by adverse possession?
options:
  - Lack of actual use
  - Lack of continuous period
  - Lack of open and notorious use
  - Lack of exclusive use
key: B
explanation: Adverse possession requires continuous possession for the statutory period set by state
  law. The neighbor's use lasted only 8 years, which is less than the required 10 years, so the
  continuous period element is not satisfied. The other elements—actual, open and notorious,
  exclusive, and hostile—are met by the facts given.
citation:
  source: REP Ref. Ownership, Title & Transfer § 8.4
  url: null
  quoted_text: The possession must be actual (physical use as an owner would), open and notorious
    (visible), exclusive (not shared with the owner or the public), hostile or adverse (without
    permission, under a claim of right), and continuous for the period set by state statute.
