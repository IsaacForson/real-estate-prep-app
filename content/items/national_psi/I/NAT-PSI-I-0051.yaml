stem: Which of the following is an example of a specific, voluntary lien?
options:
  - Property tax lien
  - Federal tax lien
  - Mortgage loan
  - Judgment lien
key: C
explanation: A mortgage loan is a specific, voluntary lien because it is created by the borrower’s
  agreement and attaches to a single parcel of real estate. Property tax liens are specific but
  arise involuntarily by operation of law, while judgment liens and federal tax liens are general
  liens that are not limited to a particular property.
