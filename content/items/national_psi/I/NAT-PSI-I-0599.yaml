explanation: A quarter‑quarter of a section contains 40 acres because a section is 640 acres;
  dividing by four gives a quarter (160 acres) and dividing by four again gives a quarter‑quarter
  (40 acres). The SW 1/4 of the NE 1/4 is such a quarter‑quarter, so it is 40 acres. The other
  answer choices represent an eighth of a section (80 acres), a thirty‑second of a section (20
  acres), and a quarter of a section (160 acres).
