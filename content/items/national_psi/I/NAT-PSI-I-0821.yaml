stem: A landowner conveys 'the surface estate only,' reserving all oil, gas, and minerals. When the
  surface owner later sells the land, what happens to the mineral estate?
options:
  - The mineral estate passes to the buyer as part of the surface estate.
  - The mineral estate remains with the original owner who reserved it.
  - The mineral estate is automatically transferred to the state.
  - The mineral estate is divided equally between the buyer and the original owner.
key: B
explanation: When a landowner conveys only the surface estate and reserves the oil, gas, and
  minerals, the reservation creates a severed mineral estate that remains with the grantor.
  Consequently, a later sale of the surface estate does not transfer the mineral rights; they stay
  with the original owner who reserved them. The mineral estate does not automatically pass to the
  buyer, go to the state, or get split between parties.
citation:
