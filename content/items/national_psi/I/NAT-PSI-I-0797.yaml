stem: A buyer discovers a leaky roof during inspection. Assuming no other issues, is the title
  considered marketable?
options:
  - Yes, because a leaky roof is a physical defect, not a title defect.
  - Yes, because a leaky roof is considered an encumbrance on the title.
  - Yes, because title insurance covers physical defects like a leaky roof.
  - Yes, because the seller must disclose all known defects before closing.
key: A
explanation: Section 10.5 clarifies that marketability concerns title defects, not physical
  conditions; a leaky roof is a physical defect and does not affect marketability. The distractor
  claiming any physical defect voids marketability misstates the rule by conflating physical flaws
  with title issues.
