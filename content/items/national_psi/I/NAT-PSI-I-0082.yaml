stem: Which statement correctly describes a license?
options:
  - It runs with the land as an appurtenance.
  - It is a nonpossessory right that benefits a parcel.
  - It is personal permission revocable at will.
  - It is created by prescription after a period of adverse use.
key: C
explanation: A license is personal permission to use another's land for a particular purpose and is
  revocable at will; it is not an interest in land and does not run with the land. The other options
  describe easements or prescriptive easements.
citation:
  source: REP Ref. Property & Land Use § 7.5
  url: null
  quoted_text: "A license is personal permission to use another's land for a particular purpose. It is
    not an interest in land: it may be oral, is revocable at will, cannot be assigned, and ends on
    the death of either party or a sale of the property."
