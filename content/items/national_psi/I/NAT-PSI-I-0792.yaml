stem: A triangular lot cannot meet the 25-foot rear setback due to its shape. The owner requests a
  reduction to a 12-foot setback. Which type of variance is being sought?
options:
  - A variance that relaxes a physical rule such as a setback or height
  - A variance that permits a use not otherwise allowed under zoning
  - A necessity easement that arises from the shape of the lot
  - A special-use permit that authorizes a use when conditions are met
key: A
explanation: An area (dimensional) variance relaxes a physical rule such as a setback or height; a
  use variance permits a use not otherwise allowed and is harder to obtain. The option describing a
  variance that relaxes a physical rule such as a setback or height matches the situation, while the
  option describing a use variance is incorrect.
