stem: A property has a 2018 first mortgage, unpaid 2020 property taxes, and a 2022 mechanic's lien.
  If the property is foreclosed, in what order will the lienholders be paid from the proceeds?
options:
  - Taxes, mortgage, mechanic's lien
  - Mortgage, taxes, mechanic's lien
  - Mechanic's lien, taxes, mortgage
  - Taxes, mechanic's lien, mortgage
key: A
explanation: Property tax liens rank ahead of all other liens regardless of date per § 8.3, so taxes
  are paid first. Among the remaining liens, the first‑in‑time rule gives the 2018 mortgage priority
  over the 2022 mechanic's lien. Placing the mortgage before taxes ignores the statutory exception
  for tax liens.
