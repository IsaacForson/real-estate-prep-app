stem: In a cooperative housing arrangement, what does a resident actually own?
options:
  - The resident owns a contract right to use the unit for a term of years
  - The resident owns stock in the corporation and a proprietary lease to occupy a unit
  - The resident owns a deeded fractional interest that can be sold or willed
  - The resident owns fee simple title to the unit and an undivided interest in the common elements
key: B
explanation: The key is correct because the cooperative resident purchases stock in the corporation
  and receives a proprietary lease for the unit, as stated in the cooperative section. The most
  tempting distractor describes fee simple title and an undivided interest in common elements, which
  defines a condominium, not a cooperative.
citation:
  source: REP Ref. Ownership, Title & Transfer § 5.2
  url: null
  quoted_text: In a cooperative, a corporation owns the building and land. A resident buys shares of
    the corporation and receives a proprietary lease to occupy a specific unit. The resident owns
    stock (personal property in most states) and a leasehold, not real estate;
