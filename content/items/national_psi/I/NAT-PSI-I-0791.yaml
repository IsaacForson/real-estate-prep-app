stem: A landowner divides a parcel, leaving one part with no access to a public road. Which type of
  easement may be implied by law to provide access?
options:
  - An easement implied when a division leaves one part landlocked
  - An easement that benefits a person or entity rather than a parcel
  - An easement created by the servient owner's written permission
  - An easement that benefits a dominant tenement and burdens a servient tenement
key: A
explanation: An easement implied when a division leaves one part landlocked is correct because the
  law implies an access easement over the portion that retains road access when a parcel is split
  and one part becomes landlocked. The option describing an easement that benefits a person or
  entity rather than a parcel is incorrect, as it describes an easement in gross, which does not
  arise from a landlocked division.
citation:
