stem: A developer wants to construct a building above an active rail yard using air rights. How can
  air rights be transferred?
options:
  - Air rights that can be sold or leased to allow construction above a rail yard
  - Air rights that are automatically transferred with the sale of the underlying land
  - Air rights that may only be acquired by government agencies for public projects
  - Air rights that cannot be separated from the surface estate and remain with the landowner
key: A
explanation: "Air rights, the right to use the space above the surface subject to navigable‑airspace
  rules, can be sold or leased so that a building may rise above a rail yard. Therefore the correct
  choice is the one stating that air rights can be sold or leased for such construction. The other
  options are incorrect: air rights do not automatically transfer with the land, they are not
  limited to government acquisition, and they are not inseparable from the surface estate."
