stem: If a mechanic's lien relates back to the date work began, which of the following is true
  regarding its priority relative to a mortgage recorded after work began but before the lien was
  filed?
options:
  - It has priority over the mortgage
  - It is subordinate to the mortgage
  - It is void because it was filed after completion
  - It attaches only to personal property
key: A
explanation: According to § 3.4, a mechanic's lien may relate back to the start of construction
  under state law, allowing it to attain priority over a later-recorded mortgage. Thus the lien
  takes priority over the mortgage in the described situation. The subordinate option incorrectly
  applies the strict first-in-time rule without considering relation back.
