stem: Which statement correctly describes the coverage of a lender's title insurance policy?
options:
  - Protection of the lender only for the loan amount, decreasing as the loan is paid down and
    ending when the loan is repaid
  - Protection of the buyer against defects that arise after the policy date
  - Protection of both the lender and the buyer for the loan amount, increasing as the loan is paid
    down
  - Protection of the buyer for the full purchase price for as long as the buyer or heirs hold an
    interest
key: A
explanation: A lender's title insurance policy protects only the lender, for the loan amount, which
  decreases as the loan is paid down and ends when the loan is repaid.
