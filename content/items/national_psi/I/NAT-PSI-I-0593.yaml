stem: What does a lender's (mortgagee's) title insurance policy protect?
options:
  - Covers the buyer for the purchase price as long as the insured or heirs hold interest
  - Covers only the lender, for the loan amount, declining as the loan is paid down and ending when
    it is repaid
  - Covers defects the insured knew of and did not disclose, including known liens and unrecorded
    claims
  - Covers unrecorded easements and boundary matters a survey would reveal, plus taxes not yet due
key: B
explanation: A lender's (mortgagee's) title insurance policy protects only the lender for the amount
  of the loan; the coverage amount decreases as the loan is paid down and terminates when the loan
  is fully repaid. This differs from an owner's policy, which protects the buyer for the purchase
  price. (Ownership, Title & Transfer)
