stem: Grantor conveys a parcel to A, who does not record. Later the same grantor conveys the parcel
  to B, who pays value, has no actual or constructive notice of A's deed, and records first. In a
  race-notice jurisdiction, who prevails?
options:
  - The first grantee (A) prevails because they took possession first
  - The second grantee (B) prevails because they lacked notice and recorded first
  - The first grantee (A) prevails because they recorded before any notice arose
  - The second grantee (B) prevails because they paid consideration
key: B
explanation: "Under a race-notice statute, a later purchaser prevails only if they lack notice of
  the prior interest and record first. B meets both requirements: B had no notice and recorded
  before A. Therefore B prevails. The distractor that A prevails due to possession is incorrect
  because possession does not determine priority under recording acts; lack of notice and recording
  first are required."
