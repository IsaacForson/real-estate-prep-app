stem: A grantor physically hands the deed to the grantee at the closing table, and the grantee
  accepts it. When does title pass?
options:
  - When the deed is delivered to the grantee and accepted.
  - When the deed is signed by the grantor at closing.
  - When the grantor dies after delivering the deed at closing.
  - When the deed is recorded in the public records at closing.
key: A
explanation: Section 11.2 states that title passes when the deed is delivered by the grantor and
  accepted by the grantee, not at signing or recording. Therefore, title passes at the moment of
  delivery and acceptance. The distractor about signing confuses the act of executing the deed with
  the legal transfer of title.
