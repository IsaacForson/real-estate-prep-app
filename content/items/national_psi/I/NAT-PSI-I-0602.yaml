stem: Which of the following liens is classified as a specific, voluntary lien?
options:
  - Property tax lien
  - Mechanic's lien
  - Mortgage lien
  - Judgment lien
key: C
explanation: Under § 8.2, a mortgage or deed of trust is classified as a specific, voluntary lien.
  Therefore the mortgage lien is the correct choice. The mechanic's lien, while specific, is
  involuntary because it arises by statute without the owner's consent.
