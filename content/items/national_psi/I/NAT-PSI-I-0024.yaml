stem: A buyer is purchasing a manufactured home that sits on a rented space in a park and still
  carries a vehicle-type title. How should a licensee classify the home?
options:
  - Real property, because it has been occupied as a residence
  - Personal property, because it still carries a vehicle-type title
  - Real property, because it is connected to utilities and fully skirted
  - A fixture of the park owner's land, because it rests on the lot
key: B
explanation: A manufactured home is personal property while it carries a vehicle-type title. It may
  become real property only when it is permanently affixed to a foundation on land the owner holds
  and the state's conversion or title-surrender procedure is completed. A home on rented park land
  with a vehicle title has met neither condition.
