stem: A buyer purchases a lot in a planned unit development. Who owns the pool and streets?
options:
  - The local government authority
  - The homeowners' association
  - The developer of the project
  - The lot owners as tenants in common
key: B
explanation: The key is correct because in a PUD, the homeowners' association owns the common areas
  such as pools and streets, as stated in the PUD section. The most tempting distractor incorrectly
  states that the lot owners as tenants in common own the common areas, which describes a
  condominium arrangement.
citation:
  source: REP Ref. Ownership, Title & Transfer § 5.4
  url: null
  quoted_text: A planned unit development (PUD) is a zoning and ownership arrangement in which
    individual lots are owned in fee simple while streets, open space, and recreational facilities
    are owned by a homeowners' association of which every lot owner is a member. The association,
    not the lot owners as tenants in common, owns the common areas, which is the main structural
    difference from a condominium.
