stem: What is marketable title?
options:
  - Title that is free from reasonable doubt and acceptable to a reasonably prudent, well-informed
    buyer.
  - Title that is subject to undisclosed liens but not to litigation.
  - Title that is free from recorded encumbrances only, and guarantees no future claims or
    undisclosed liens.
  - Title that is perfect and free from any defects, known or unknown.
key: A
explanation: Marketable title is defined as title free from reasonable doubt, meaning it is
  acceptable to a reasonably prudent, well-informed buyer, is not subject to undisclosed liens or
  encumbrances, and does not expose the buyer to litigation. The option stating that title must be
  perfect and free from any defects is incorrect because marketable title does not require absolute
  perfection.
