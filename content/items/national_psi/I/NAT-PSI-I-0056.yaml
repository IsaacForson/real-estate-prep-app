stem: A lender signs a recorded subordination agreement agreeing to let a subsequently recorded
  mechanic's lien have priority over its mortgage. What is the result?
options:
  - The mortgage remains senior to the mechanic's lien
  - The mortgage is converted to an involuntary lien
  - The mechanic's lien becomes senior to the mortgage
  - The mechanic's lien is extinguished by the agreement
key: C
explanation: The statute states that parties can rearrange priority by a recorded subordination
  agreement, allowing a lender to agree to rank behind a later lien. When the lender subordinates
  its mortgage to a subsequently recorded mechanic's lien, the mechanic's lien moves ahead in
  priority. The distractor that the mortgage remains senior ignores the effect of the subordination
  agreement.
