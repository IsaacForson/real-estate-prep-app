stem: A seller agrees to leave the refrigerator and the patio furniture for the buyer. Which
  document actually transfers ownership of those items to the buyer?
options:
  - A bill of sale or an itemized clause in the contract
  - The recorded subdivision plat for the lot
  - The general warranty deed the seller delivers at closing
  - The lender's closing disclosure form
key: A
explanation: A refrigerator and patio furniture are personal property. Real property passes by deed,
  but personal property passes by bill of sale or by delivery, so the deed alone does not transfer
  the appliances and furniture. A careful contract itemizes the personal property included in the
  sale, and a bill of sale documents the transfer at closing.
