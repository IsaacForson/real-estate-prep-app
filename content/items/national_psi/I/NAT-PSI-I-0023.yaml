stem: Which of the following actions converts real property into personal property?
options:
  - Cutting standing timber on the tract
  - Installing a furnace in the basement
  - Pouring a concrete patio behind the house
  - Planting an orchard across the field
key: A
explanation: Severance turns real property into personal property, as when timber is cut, ore is
  mined, or a fixture is detached. The opposite process, annexation, turns personal property into
  real property, as when a furnace is installed, an orchard is planted, or concrete is poured. Only
  cutting the timber is a severance.
