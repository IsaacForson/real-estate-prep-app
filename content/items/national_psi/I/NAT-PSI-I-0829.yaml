stem: A licensee lists a property for rent with a lease term of 18 months. Under the Statute of
  Frauds provision in the REP Ref. Ownership, Title & Transfer, what is required for this lease to
  be enforceable?
options:
  - The lease may be oral and still be enforceable
  - The lease must be notarized to be enforceable
  - The lease must be recorded to be enforceable
  - The lease must be in writing to be enforceable
key: D
explanation: Since the lease term is 18 months, which is more than one year, the Statute of Frauds
  requires a writing for enforceability. An oral lease would not satisfy the statute and thus would
  not be enforceable. Recording or notarization is not required by the Statute of Frauds for lease
  enforceability.
