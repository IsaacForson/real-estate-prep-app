stem: "A mortgage lien is classified as:"
options:
  - Specific voluntary lien
  - General involuntary lien
  - Specific involuntary lien
  - General voluntary lien
key: A
explanation: Under the lien classification rules, a mortgage is a specific lien because it attaches
  to one parcel, and it is voluntary because it arises from the owner's agreement. Therefore, the
  correct classification is specific voluntary. The distractor 'General involuntary lien' is
  incorrect because a mortgage is neither general (it does not attach to all property) nor
  involuntary (it requires the owner's consent).
