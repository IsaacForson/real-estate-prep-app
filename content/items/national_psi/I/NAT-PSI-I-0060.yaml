stem: A buyer purchases a property with a loan and obtains only a lender's title insurance policy.
  Later a forged deed in the chain is discovered. According to the text, what is the likely outcome?
options:
  - The insurer will pay the buyer up to the loan balance
  - The insurer will pay the lender up to the loan balance
  - The insurer will pay the buyer up to the purchase price
  - The insurer will require the buyer to sue the third party
key: B
explanation: Without an owner's policy, a lender's title insurance policy pays only the loan amount
  to the lender. Therefore, the insurer will pay the lender up to the loan balance. The distractor
  suggesting payment to the buyer up to the purchase price is incorrect because the lender's policy
  does not cover the buyer's equity.
