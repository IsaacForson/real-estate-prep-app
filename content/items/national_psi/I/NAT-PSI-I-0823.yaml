stem: In a notice state, a seller deeds the same lot to A on Monday (A does not record) and to B on
  Wednesday (B pays value, has no notice of A, and records on Thursday). Who owns the lot?
options:
  - The lot is owned by A.
  - The lot is owned by B.
  - The lot is owned by A and B.
  - The lot is owned by the seller.
key: B
explanation: Under a notice statute, a later bona fide purchaser for value without notice wins even
  before recording. B paid value, lacked notice of A’s prior deed, and recorded after A failed to
  record, so B prevails. The lot is owned by the seller is incorrect because A’s unrecorded deed
  does not give B constructive notice.
