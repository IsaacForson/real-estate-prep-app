stem: What is an easement in gross?
options:
  - An easement that benefits a person or entity rather than a parcel
  - An easement that terminates when the servient owner builds a structure
  - An easement that arises from prior use of the land by the owner
  - An easement that benefits a dominant tenement and burdens a servient tenement
key: A
explanation: An easement in gross benefits a person or entity rather than a parcel of land; it
  imposes a burden on the servient tenement but does not benefit any dominant tenement. Therefore
  the option stating that it benefits a person or entity rather than a parcel is correct. The option
  describing an easement that benefits a dominant tenement and burdens a servient tenement describes
  an appurtenant easement, not an easement in gross. The option about termination when the servient
  owner builds a structure is not a defining characteristic of an easement in gross. The option
  about arising from prior use refers to an easement by prescription, not an easement in gross.
citation:
