stem: Title insurance is best described as which type of contract?
options:
  - An indemnity contract.
  - A warranty contract.
  - A lease contract.
  - An option contract.
key: A
explanation: Title insurance is an indemnity contract in which the insurer agrees to defend the
  insured's title and pay losses caused by covered defects existing on the policy date, for a
  one-time premium paid at closing. A warranty contract promises performance or condition, which is
  not how title insurance functions.
