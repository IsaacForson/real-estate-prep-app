stem: A buyer discovers an unrecorded mechanic's lien that was not disclosed in the purchase
  contract, and the seller cannot remove it before closing. What is the buyer's typical remedy?
options:
  - The buyer may sue for specific performance
  - The buyer may cancel the contract and recover the deposit
  - The buyer may accept the title as is and sue the seller later
  - The buyer may pay off the lien themselves
key: B
explanation: If the seller cannot cure a title defect before closing, the buyer may cancel the
  contract and recover the deposit; accepting the title as is is also permitted, but suing the
  seller later is not a recognized remedy.
