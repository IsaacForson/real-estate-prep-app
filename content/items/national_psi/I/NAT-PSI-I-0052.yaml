stem: A property has a 2018 mortgage, a 2020 mechanic's lien, and unpaid 2022 property taxes. In a
  foreclosure sale, which claim is paid first?
options:
  - The 2020 mechanic's lien
  - The 2018 mortgage
  - The owner's equity
  - The 2022 property taxes
key: D
explanation: Section 3.4 of the same reference states that property tax and special assessment liens
  rank first by statute regardless of date. Consequently, the 2022 property taxes are satisfied
  before the 2018 mortgage and the 2020 mechanic's lien. The owner's equity is not a lien and
  receives any residual proceeds only after all liens are paid.
