stem: A homeowner grants a neighbor a recorded easement to cross the rear yard to reach a lake. In
  terms of the bundle of rights, what has the homeowner done?
options:
  - Converted the burdened strip of yard into personal property
  - Transferred part of the bundle while retaining the remainder
  - Surrendered the right to exclude all others from the whole lot
  - Conveyed the entire fee simple estate to the neighbor
key: B
explanation: "Real property is a bundle of rights: to possess, control, enjoy, exclude, and dispose.
  Each right can be separated and transferred alone. An easement, like a lease or a mortgage,
  transfers one part of the bundle while the owner keeps title and every other right, so the
  homeowner still owns the fee and may use the yard in any way that does not interfere with the
  easement."
citation:
