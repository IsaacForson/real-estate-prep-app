stem: A farm tenant holding under a lease that lasts for the life of the landowner planted corn in
  the spring. The landowner died in July, ending the tenancy before harvest. What right does the
  tenant have to the corn?
options:
  - The tenant loses the crop because annual crops pass with the land to the heirs
  - The tenant may claim the crop only by paying the heirs the fair rental value of the field
  - The tenant may re-enter after the tenancy ends to harvest the crop the tenant planted
  - The tenant keeps the crop only if the lease expressly reserved the crops to the tenant
key: C
explanation: Annual cultivated crops are emblements, the personal property of the person who planted
  them. Under the doctrine of emblements, a tenant whose tenancy ends through no fault of the tenant
  at an unpredictable time, such as the death of the person whose life measures the lease, may
  re-enter to harvest the crops the tenant planted.
