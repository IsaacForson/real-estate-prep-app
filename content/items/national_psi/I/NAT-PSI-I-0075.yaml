stem: Three siblings own a cabin as joint tenants. One sibling sells her interest to a friend. After
  the sale, what is the friend's ownership interest?
options:
  - The friend holds the interest as a joint tenant
  - The friend holds the interest as a tenant in common
  - The friend holds the interest as a tenant in severalty
  - The friend holds the interest as a life tenant
key: B
explanation: When a joint tenant conveys her share during life, the buyer becomes a tenant in common
  with the remaining owners, who continue to hold their interests as joint tenants among themselves.
  Thus the friend holds the purchased share as a tenant in common, while the two siblings remain
  joint tenants as to the other two-thirds. The distractor stating the friend becomes a joint tenant
  is incorrect because conveying a joint tenancy interest destroys the right of survivorship for
  that share.
