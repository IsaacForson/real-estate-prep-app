stem: A tenant installs a built-in bookshelf in a leased office. The lease agreement explicitly
  states that the bookshelf remains the tenant's personal property. At the end of the lease, who
  owns the bookshelf?
options:
  - The tenant, because the written agreement controls fixture status.
  - The landlord, because trade fixtures belong to the landlord after lease end.
  - The landlord, because the bookshelf is attached to the premises.
  - The tenant, only if the bookshelf can be removed without damaging the wall.
key: A
explanation: Under the fixture tests, a written agreement between landlord and tenant controls the
  classification of an item, overriding attachment, adaptation, and party‑relationship
  considerations. Since the lease expressly designates the bookshelf as the tenant's personal
  property, the tenant retains ownership upon lease termination. The other options incorrectly rely
  on physical attachment or trade‑fixture rules that are superseded by the agreement.
