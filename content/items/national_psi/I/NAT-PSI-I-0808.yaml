stem: A restaurant tenant installs a walk-in cooler bolted to the floor of the leased premises. The
  lease agreement does not mention fixtures. When the lease ends, what is the tenant’s right
  regarding the walk-in cooler?
options:
  - The tenant must leave it because it became real property.
  - The tenant may remove it and must repair any damage.
  - The tenant may remove it but is not responsible for repairs.
  - The tenant must obtain landlord's permission before removal.
key: B
explanation: Trade fixtures remain the tenant's personal property and may be removed before the
  lease ends; the tenant must repair any damage caused by removal. Because the lease does not
  address fixtures, the default rule applies, so the tenant may remove the walk‑in cooler and must
  repair any damage. The option stating that the tenant may remove it but is not responsible for
  repairs is incorrect because repair responsibility is required.
