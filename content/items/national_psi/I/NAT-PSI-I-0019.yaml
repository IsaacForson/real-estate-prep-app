stem: A restaurant tenant bolted commercial kitchen hoods and display cases to the leased premises
  to run the business. As the lease term draws to a close, what are the tenant's rights in these
  items?
options:
  - The tenant may remove them before the lease ends but must repair any damage
  - The tenant forfeits them at signing because attachment made them real property
  - The tenant may remove them at any time after the lease ends with no repair duty
  - The tenant must sell them to the landlord at depreciated value before vacating
key: A
explanation: Items a commercial tenant attaches to carry on a business are trade fixtures, which
  remain the tenant's personal property despite being attached. The tenant may remove them before
  the lease ends and must repair the damage removal causes. Items left behind after the lease ends
  generally become the landlord's property by accession, so timing matters.
