stem: A buyer receives a special warranty deed. Two years later an heir of a prior owner asserts an
  unreleased interest that arose before the seller took title. What is the likely outcome?
options:
  - The seller is liable and must defend the title
  - The buyer must rely on the seller's personal guarantee
  - The seller has no liability for the defect
  - The buyer can recover from the title insurance company
key: C
explanation: A special warranty deed limits the grantor's covenants to defects arising during the
  grantor's own period of ownership and provides no protection against defects created before the
  grantor took title. Since the asserted interest predates the seller's ownership, the seller is not
  liable under the deed. The distractor claiming the seller is liable confuses a special warranty
  deed with a general warranty deed, which warrants against defects arising at any time in the chain
  of title.
citation:
  source: REP Ref. Ownership, Title & Transfer § 6.4
  url: null
  quoted_text: "A special warranty deed limits the covenants to the grantor's own period of ownership:
    the grantor warrants only against claims 'by, through, or under' the grantor, and gives no
    protection against defects created before the grantor took title."
