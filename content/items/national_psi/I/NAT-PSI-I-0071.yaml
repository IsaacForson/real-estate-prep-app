stem: A homeowner installs a satellite dish on the roof using bolts and wires, with no written
  agreement about its removal, and later lists the house for sale. Assuming no agreement exists, how
  should the satellite dish be classified under the fixture tests?
options:
  - A fixture that passes with the real estate
  - A right that runs with the land as an appurtenance
  - A personal property item that the seller may remove
  - A trade fixture belonging to the homeowner
key: A
explanation: Bolting and wiring the dish shows a method of attachment that indicates fixture status.
  With no agreement about removal, the relationship‑of‑the‑parties rule resolves any ambiguity in
  favor of the buyer, so the dish passes with the real estate. The idea that it is personal property
  the seller may remove is incorrect because the attachment method points to a fixture.
citation:
  source: REP Ref. Property & Land Use § 1.3
  url: null
  quoted_text: "Intent of the person who attached the item is the controlling question, inferred from
    these tests taken together: - Method of attachment. Bolted, wired, plumbed, cemented, or built
    in, so that removal would damage the property, points toward fixture."
