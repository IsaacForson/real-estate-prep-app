stem: A buyer purchases property after a lis pendens has been recorded. What effect does the lis
  pendens have on the buyer's title?
options:
  - The buyer can ignore the lis pendens because it is not a lien
  - The buyer takes title free of any claim arising from the litigation
  - The buyer must pay off the underlying claim before closing
  - The buyer's title is subject to the outcome of the litigation
key: D
explanation: The statute provides that a lis pendens is not a lien but a recorded notice that
  litigation affecting title is pending, and a later purchaser or lender is bound by the result.
  Consequently, a buyer who takes title after the notice is recorded assumes the risk that the
  litigation may affect ownership. The distractor suggesting the buyer can ignore the lis pendens
  overlooks that the notice binds subsequent parties despite not being a lien.
