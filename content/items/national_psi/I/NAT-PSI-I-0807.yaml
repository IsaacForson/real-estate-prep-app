stem: A landlocked parcel originally accessed via an easement of necessity over adjacent land later
  gains a public road frontage. What happens to the easement of necessity?
options:
  - The easement of necessity continues unchanged because it runs with the land.
  - The easement of necessity is terminated because the dominant tenement now has other legal access.
  - The easement of necessity converts to an easement in gross held by the original owner.
  - The easement of necessity remains enforceable until the servient owner releases it in writing.
key: B
explanation: Under the rule for termination of an easement by necessity, the easement ends when the
  dominant tenement gains other legal access, eliminating the necessity.
