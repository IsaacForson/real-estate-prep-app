stem: Which deed conveys whatever interest the grantor has, if any, with no warranties and no
  implication that the grantor has any interest?
options:
  - Bargain and sale deed
  - Special warranty deed
  - Quitclaim deed
  - General warranty deed
key: C
explanation: Under § 6.6 Quitclaim deed, a quitclaim deed conveys whatever interest the grantor has,
  if any, with no warranties and no implication that the grantor has any interest. A bargain and
  sale deed only implies the grantor holds title but does not expressly disclaim interest, so it
  does not match the description.
