stem: What condition negates the mineral owner's implied right of reasonable surface access to the
  surface estate?
options:
  - If the mineral estate is leased to a third party.
  - If the deed expressly states otherwise.
  - If the surface owner objects in writing.
  - If the mineral rights are severed after surface conveyance.
key: B
explanation: A mineral owner ordinarily has an implied right of reasonable surface access unless the
  deed expressly provides otherwise. Leasing the mineral estate does not affect that implied right.
