stem: A homeowner gives a neighbor oral permission to park a car in the driveway each weekend. After
  the homeowner sells the property, what is the status of the neighbor's permission?
options:
  - The neighbor's permission continues as an easement because it was used regularly.
  - The neighbor's permission becomes an easement in gross held by the neighbor.
  - The neighbor's permission is terminated because a license ends upon sale of the property.
  - The neighbor's permission becomes a profit à prendre allowing removal of soil.
key: C
explanation: A license is personal permission to use another's land for a particular purpose; it is
  not an interest in land, may be oral, is revocable at will, cannot be assigned, and ends on the
  death of either party or a sale of the property. Therefore the neighbor's permission terminates
  upon sale. An oral permission does not create an easement because an easement requires a writing
  under the Statute of Frauds.
