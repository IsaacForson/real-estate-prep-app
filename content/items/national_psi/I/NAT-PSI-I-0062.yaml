stem: A residential property is assessed at $300,000. The municipality applies a tax rate of 18
  mills, and the owner qualifies for a $30,000 homestead exemption. What is the annual property tax?
options:
  - The annual tax is $5,400
  - The annual tax is $4,860
  - The annual tax is $4,320
  - The annual tax is $5,040
key: B
explanation: "First subtract the exemption from the assessed value to get the taxable base: $300,000
  - $30,000 = $270,000. Convert mills to a decimal rate: 18 mills = 0.018. Multiply the taxable base
  by the rate: $270,000 × 0.018 = $4,860. The distractor that results from forgetting to subtract
  the exemption is $5,400."
citation:
  source: REP Ref. Property & Land Use § 4.4
  url: null
  quoted_text: one mill is one-tenth of a cent, that is, $1 of tax per $1,000 of assessed value.
  secondary: []
math:
  worked_solution: |-
    Assessed Value = $300,000
    Exemption = $30,000
    Taxable Value = Assessed Value - Exemption = $300,000 - $30,000 = $270,000
    Tax Rate (decimal) = Mills / 1000 = 18 / 1000 = 0.018
    Property Tax = Taxable Value × Tax Rate = $270,000 × 0.018 = $4,860
  formulas:
    - Taxable Value = Assessed Value - Exemption
    - Tax Rate (decimal) = Mills / 1000
    - Property Tax = Taxable Value × Tax Rate
