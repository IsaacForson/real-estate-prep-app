stem: A buyer purchases a manufactured home that currently has a vehicle title. The buyer affixes
  the home to a permanent foundation on land they own and completes the state-required
  title-surrender procedure. According to REP Ref. Property & Land Use, what is the legal status of
  the manufactured home after these steps?
options:
  - It is considered emblements.
  - It stays personal property.
  - It is a trade fixture.
  - It becomes real property.
key: D
explanation: A manufactured home is personal property while it bears a vehicle‑type title, but once
  it is permanently affixed to a foundation on land the owner holds and the required title‑surrender
  procedure is completed, it becomes real property. Saying it stays personal property ignores the
  affixation and procedure that change its status. Calling it a trade fixture mischaracterizes the
  home; trade fixtures are items a tenant installs for business use and can remove, not a dwelling
  affixed to land. Describing it as emblements is wrong because emblements refer to annual crops
  produced by cultivation, not a dwelling.
citation:
