stem: An appraiser depreciates the buildings on a parcel but assigns no depreciation to the land
  itself. Which characteristic of land explains this practice?
options:
  - Permanence of investment
  - Immobility
  - Uniqueness
  - Indestructibility
key: D
explanation: "Indestructibility is the physical characteristic that land is durable: improvements
  wear out but the land remains. That is why appraisers depreciate buildings while land is not
  depreciated. Immobility concerns location, uniqueness concerns the lack of identical parcels, and
  fixity is an economic characteristic about capital being long-lived."
