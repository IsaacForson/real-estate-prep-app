stem: A property has a 2017 mortgage, a 2019 mechanic's lien, and unpaid 2021 property taxes.
  Foreclosure occurs in 2022. Assuming the jurisdiction follows the general rule and its statutory
  exception, which lien is paid first from the foreclosure proceeds?
options:
  - B) The 2019 mechanic's lien
  - D) The lien recorded most recently
  - C) The 2021 property tax lien
  - A) The 2017 mortgage
key: C
explanation: Property tax and special assessment liens rank ahead of all other liens regardless of
  date by statutory exception. Therefore the 2021 property tax lien is paid first, before the 2017
  mortgage and 2019 mechanic's lien. The 2017 mortgage incorrectly applies the first‑in‑time rule
  without the exception.
