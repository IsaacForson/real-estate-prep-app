stem: A rectangular lot measures 80 feet of frontage and 120 feet deep. What is its area in square feet?
options:
  - 4,800 square feet
  - 400 square feet
  - 9,600 square feet
  - 200 square feet
key: C
explanation: The area of a rectangle is found by multiplying its frontage by its depth. Multiplying
  80 feet by 120 feet yields 9,600 square feet, which corresponds to the answer stating 9,600 square
  feet. The answer stating 400 square feet results from multiplying frontage by half the depth (80 ×
  60), a common mistake when confusing the formula for triangle area.
