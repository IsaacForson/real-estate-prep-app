stem: A court orders a defaulting seller to convey a parcel to the buyer rather than merely pay
  money damages. Which physical characteristic of land supports this remedy?
options:
  - Immobility
  - Uniqueness
  - Indestructibility
  - Scarcity
key: B
explanation: "Uniqueness, also called non-homogeneity, means no two parcels are identical because no
  two occupy the same location. It is the legal basis for specific performance in real estate
  contracts: money damages are considered inadequate because the buyer cannot purchase an identical
  substitute parcel elsewhere."
