stem: In a cooperative, the board may reject a prospective purchaser based on financial screening
  because widespread default puts the whole building at risk. What action is the board permitted to
  take regarding a sale?
options:
  - Must obtain approval from the corporation's mortgage lender before any sale
  - May reject a purchaser based on financial screening
  - Must accept any buyer who offers the asking price
  - May only reject if the purchaser intends to sublet the unit
key: B
explanation: Because widespread default puts the whole building at risk, boards commonly screen
  purchasers and may reject a sale; therefore the board may reject a purchaser based on financial
  screening. The option stating that the board must accept any buyer who offers the asking price is
  incorrect, as is the option requiring lender approval before any sale and the option limiting
  rejection to sublet intentions.
