stem: Two houses built from the same plans by the same builder sold in the same month, one in a
  prestigious neighborhood with a mild coastal climate and one in a distant inland town, at prices
  that differed by a wide margin. Which economic characteristic of land best explains the
  difference?
options:
  - Permanence of investment
  - Modification by improvements
  - Area preference
  - Scarcity
key: C
explanation: Area preference, or situs, reflects that people prefer some locations for convenience,
  prestige, schools, or climate. It is often called the most important economic characteristic
  because two identical houses in different locations sell for different prices. Scarcity, fixity of
  investment, and modification by nearby improvements do not explain a pure location premium.
