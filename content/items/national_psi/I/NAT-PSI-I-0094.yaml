stem: A borrower unable to make mortgage payments conveys the property to the lender via a deed in
  lieu of foreclosure. What warranties does this deed typically carry?
options:
  - The deed carries no warranties at all
  - The deed carries full warranty covenants
  - The deed carries warranties limited to the grantor's own acts
  - The deed carries warranties only against future claims
key: C
explanation: A deed in lieu of foreclosure is a special‑purpose deed that provides no warranties
  beyond the grantor’s own acts. Therefore the deed carries warranties limited to the grantor’s own
  acts. The option stating that the deed carries full warranty covenants is incorrect because
  special‑purpose deeds do not provide full warranty protection.
