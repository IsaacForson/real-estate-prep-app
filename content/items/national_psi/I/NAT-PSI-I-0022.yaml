stem: Which of the following growing on a farm is treated as personal property rather than real property?
options:
  - An established apple orchard on the parcel
  - Native prairie grasses covering the pasture
  - A windbreak of mature pines along the road
  - A field of soybeans planted this season
key: D
explanation: Perennial plants that grow without annual cultivation, such as trees, shrubs, and
  native grasses, are real property until severed. Annual crops produced by cultivation are
  emblements, treated as the personal property of the person who planted them. Soybeans planted this
  season are an annual cultivated crop; orchards, native grasses, and pines are perennials.
citation:
