stem: Under the REP Ref. Property & Land Use, what is the defining characteristic of a trade fixture
  installed by a commercial tenant?
options:
  - It automatically becomes the landlord's property upon installation.
  - It becomes part of the real property and passes with the deed.
  - It remains the tenant's personal property and may be removed before lease ends.
  - It is considered an emblement belonging to the tenant who planted it.
key: C
explanation: Trade fixtures are items a commercial tenant installs to conduct business; although
  they are attached to the leased premises, they stay the tenant’s personal property and may be
  removed before the lease ends. Consequently, a statement that the fixture automatically becomes
  the landlord’s property or passes with the deed is incorrect, as is the suggestion that it is an
  emblement, which applies to crops planted by a farmer.
citation:
  source: REP Ref. Property & Land Use § 1.4
  url: null
  quoted_text: "A trade fixture is an item a commercial tenant attaches to leased premises to carry on
    a business: display shelving, kitchen hoods, a barber's chairs. Although attached, trade
    fixtures remain the tenant's personal property."
