stem: What is the main structural difference between a planned unit development (PUD) and a
  condominium regarding ownership of common areas?
options:
  - In a PUD the association owns the common areas; in a condominium the owners hold them as tenants
    in common
  - In a PUD the owners own the common areas; in a condominium the association owns them
  - In a PUD the common areas are leased; in a condominium they are owned outright
  - In a PUD the common areas are owned by the developer; in a condominium they are owned by the
    association
key: A
explanation: In a planned unit development, the homeowners' association holds title to the common
  areas, whereas in a condominium, each unit owner owns an undivided interest in the common elements
  as a tenant in common. This distinction in ownership of common areas is the primary structural
  difference between the two forms.
