stem: A parcel is described by metes and bounds as a rectangle 200 feet wide and 217.8 feet deep.
  What is the area of the parcel in acres?
options:
  - The area is 0.5 acre
  - The area is 0.75 acre
  - The area is 1.0 acre
  - The area is 1.25 acre
key: C
explanation: "The area in square feet is found by multiplying width by depth: 200 ft × 217.8 ft =
  43,560 sq ft. According to §3.6, 1 acre equals 43,560 square feet, so the parcel contains 1.0
  acre. The distractor 0.75 acre would result from using an incorrect factor (e.g., dividing by
  58,080 instead of 43,560)."
