stem: A licensee is helping a client sell a house and the client asks what items are considered
  personal property under real estate law. Which statement correctly defines personal property?
options:
  - It consists of movable items and intangible rights not real property.
  - It refers only to furniture and vehicles attached to the land.
  - It includes real estate plus the legal rights of ownership.
  - It is the same as real estate but excludes the land.
key: A
explanation: Personal property includes movable items and intangible rights that are not real
  property. Items such as furniture and vehicles that are attached to the land become fixtures and
  are considered part of real property, so limiting personal property to only those attached items
  is incorrect.
citation:
  source: REP Ref. Property & Land Use § 1.2
  url: null
  quoted_text: "Personal property (chattels, personalty) is everything that is not real property:
    movable things such as furniture, vehicles, and equipment, and intangible rights such as a
    promissory note."
