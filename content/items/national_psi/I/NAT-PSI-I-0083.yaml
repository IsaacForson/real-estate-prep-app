stem: A landowner who holds an appurtenant easement across a neighboring parcel later purchases that
  neighboring parcel. What is the effect on the easement?
options:
  - The easement remains enforceable against the now‑owned parcel.
  - The easement is extinguished by merger.
  - The easement becomes a license revocable at will.
  - The easement converts to an easement in gross.
