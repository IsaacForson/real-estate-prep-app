stem: According to the definition of real property, which of the following rights is part of the
  bundle of rights?
options:
  - The right to mine subsurface minerals
  - The right to possess the property
  - The right to vote in local elections
  - The right to obtain a building permit
key: B
explanation: The bundle of rights that accompanies real property includes the right to possess, to
  control and use, to enjoy without interference, to exclude others, and to dispose of the property.
  Therefore, the right to possess is part of that bundle. The right to mine subsurface minerals is a
  severable mineral interest that can be separated from the surface estate and is not one of the
  bundle of rights.
citation:
