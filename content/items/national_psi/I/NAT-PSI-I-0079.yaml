stem: In a planned unit development (PUD), who owns the common areas such as streets, open space,
  and recreational facilities?
options:
  - The homeowners' association
  - The individual lot owners
  - The developer of the project
  - The local government agency
key: A
explanation: In a planned unit development, each lot is owned in fee simple by its owner, while the
  streets, open space, and recreational facilities are owned collectively by the homeowners'
  association, of which every lot owner is a member. Therefore, the association holds title to the
  common areas. The idea that individual lot owners own the common areas is incorrect because lot
  owners only own their individual lots, not the shared facilities.
