stem: A residential property is assessed at $500,000. The municipality applies a tax rate of 12
  mills, and the owner qualifies for a $50,000 homestead exemption. What is the annual property tax?
options:
  - The annual property tax is $540.
  - The annual property tax is $6,000.
  - The annual property tax is $54,000.
  - The annual property tax is $5,400.
key: D
explanation: "First subtract the exemption from the assessed value to get the taxable base
  ($450,000). Then convert the mill rate to a decimal (12 mills × 0.001 = 0.012) and multiply:
  $450,000 × 0.012 = $5,400."
citation:
  source: REP Ref. Property & Land Use § 4.4
  url: null
  quoted_text: one mill is one-tenth of a cent, that is, $1 of tax per $1,000 of assessed value.
  secondary: []
math:
  worked_solution: |-
    Subtract exemption: $500,000 - $50,000 = $450,000
    Convert mills to decimal: 12 × 0.001 = 0.012
    Multiply: $450,000 × 0.012 = $5,400
  formulas:
    - Tax = (Assessed value - Exemption) × (Mill rate × 0.001)
