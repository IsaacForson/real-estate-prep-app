stem: A seller installed floor-to-ceiling shelving custom-built to fit an alcove in the living room.
  The purchase contract says nothing about the shelving, and the seller wants to take it. Absent any
  agreement, how is the dispute most likely resolved?
options:
  - The seller may take it, because the seller paid for it
  - The shelving stays only if the buyer pays its appraised value
  - The seller may take it, because custom items remain personal property
  - The shelving stays, because doubt is resolved in favor of the buyer
key: D
explanation: Custom-fitted, built-in shelving points strongly toward a fixture under the adaptation
  and attachment tests, and fixtures pass with the real estate unless the contract excludes them.
  When the tests leave doubt, the relationship-of-the-parties test resolves ambiguity against the
  party who attached the item, favoring the buyer over the seller, so the shelving stays.
