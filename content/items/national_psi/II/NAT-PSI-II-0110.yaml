explanation: Because the regulation strips essentially all use, it fails the requirement that a
  police power regulation leave the owner an economically viable use and may be challenged as a
  regulatory taking. The option describing a valid exercise promoting public welfare is incorrect
  because it ignores the economically viable use test.
