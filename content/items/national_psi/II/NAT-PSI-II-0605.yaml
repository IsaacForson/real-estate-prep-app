stem: Which statement correctly describes police power?
options:
  - It requires compensation when it regulates the use of private land.
  - It allows the government to take title to private land without payment.
  - It enables the government to enact zoning ordinances without paying compensation.
  - It applies only to federal lands and not to state or local jurisdictions.
key: C
explanation: Police power enables the government to enact zoning and similar land-use regulations
  without requiring compensation, provided the regulation is reasonable and leaves an economically
  viable use of the property.
