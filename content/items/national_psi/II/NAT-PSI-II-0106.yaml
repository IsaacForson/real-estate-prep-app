stem: "A lien is best described as:"
options:
  - a charge against property securing payment of a debt or obligation; if unpaid, the lienholder
    can force a sale and be paid from the proceeds, as defined in the statute
  - a legal document that transfers ownership of real property from one party to another, commonly
    used in real estate transactions, such as a warranty deed
  - a government regulation that limits the use of land in a municipality, often implemented through
    zoning ordinances, to manage growth and development
  - a contract between a landlord and tenant specifying rent amount and lease term, governing the
    rental relationship, and may include provisions for utilities and maintenance
key: A
explanation: A lien is a charge against property securing payment of a debt or obligation; if
  unpaid, the lienholder can force a sale and be paid from the proceeds. The option that states this
  definition is correct. The other options describe a lease contract between landlord and tenant, a
  zoning regulation limiting land use, and a deed transferring ownership, which do not define a
  lien.
