stem: A county enacts a zoning ordinance that prohibits any commercial use on a parcel, leaving the
  owner with no economically viable use. What may the owner do?
options:
  - The owner may seek compensation for the loss of all economically viable use.
  - The owner may challenge the regulation as a regulatory taking.
  - The owner must first obtain a variance before using the land for any purpose.
  - The owner may ignore the ordinance and continue the existing commercial use.
key: B
explanation: A regulation that strips essentially all use may be challenged as a regulatory taking,
  allowing the owner to contest the ordinance. The option claiming the owner must first obtain a
  variance is incorrect because the rule does not impose that prerequisite; the owner may directly
  challenge the regulation.
