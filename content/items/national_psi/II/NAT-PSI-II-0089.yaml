stem: A commercial tenant bolts a built‑in bookshelf to the wall of leased premises; the bookshelf
  is custom‑fitted to the space and there is no written agreement about its removal. Is the
  bookshelf considered real property or personal property?
options:
  - The bookshelf is personal property because the tenant installed it and there is no written
    agreement.
  - The bookshelf is real property because it is bolted to the wall and custom‑fitted to the space.
  - The bookshelf is personal property because ambiguity is resolved in favor of the tenant under
    the relationship test.
  - The bookshelf is real property because the method of attachment and adaptation indicate a
    fixture.
key: C
explanation: The relationship test resolves ambiguity against the party who attached the item,
  favoring the tenant over the landlord unless the item is a trade fixture. Because the bookshelf is
  not a trade fixture, the tenant prevails and the item remains personal property. The option
  stating the bookshelf is real property because it is bolted to the wall and custom‑fitted to the
  space ignores the relationship test that controls the outcome.
