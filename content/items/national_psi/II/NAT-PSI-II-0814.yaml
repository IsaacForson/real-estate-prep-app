stem: A borrower has a judgment lien recorded in 2020 and a mortgage recorded in 2021. They later
  record a subordination agreement that makes the judgment lien senior to the mortgage. In a
  foreclosure sale, which lien will be paid first?
options:
  - the mortgage lien is senior
  - the judgment lien
  - both paid at same time
  - the borrower gets nothing first
key: B
explanation: Because parties can rearrange priority by a recorded subordination agreement, the
  agreement made the judgment lien senior to the mortgage, so the judgment lien is paid first in
  foreclosure.
