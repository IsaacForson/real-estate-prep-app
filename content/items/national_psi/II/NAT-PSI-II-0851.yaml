stem: A property owner wants to operate a home-based day care in a single-family residential zone
  where the zoning ordinance lists day care as a permitted use only if certain conditions (traffic,
  parking, screening) are satisfied. The owner does not claim any unique hardship due to the
  property's shape or topography. Which mechanism should the owner pursue?
options:
  - The use variance appeal
  - The nonconforming use
  - The special-use permit
  - The area variance request
key: C
explanation: A special-use permit is the appropriate mechanism when a use is listed as conditionally
  permitted in a zoning district and the applicant can demonstrate that the required conditions
  (such as traffic, parking, screening, and hours of operation) will be satisfied; no showing of
  unnecessary hardship is needed. A use variance would require proving an unnecessary hardship
  unique to the property, which the owner does not claim.
