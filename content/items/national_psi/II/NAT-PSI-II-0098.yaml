stem: A property has a 2017 mortgage, a 2021 home-equity line of credit, a 2023 mechanic's lien, and
  unpaid property taxes. If the property is sold at foreclosure, which claim is paid first from the
  proceeds?
options:
  - Mechanic's lien
  - Home equity line
  - Property taxes
  - First mortgage loan
key: C
explanation: Property tax and special assessment liens rank ahead of all other liens regardless of
  date, including an earlier-recorded mortgage. Therefore, unpaid property taxes are paid before the
  mortgage, equity line, and mechanic's lien.
