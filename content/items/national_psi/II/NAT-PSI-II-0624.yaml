stem: In a western state that follows the prior appropriation system, a farmer secured a water
  permit in 1995 and a developer secured a water permit in 2005 for the same river. During a water
  shortage, who has the legal right to use the water first?
options:
  - The water right belongs to the farmer who holds the 1995 permit
  - The water right belongs to the developer who holds the 2005 permit
  - The water right belongs to the owner of the land bordering the river
  - The water right belongs to the state agency that allocates water
key: A
explanation: Prior appropriation awards water rights based on the doctrine of “first in time, first
  in right”; the earliest valid permit holder has priority when water is scarce. Because the
  farmer’s permit was issued in 1995, the farmer’s right outranks the developer’s 2005 permit. The
  riparian ownership rule does not apply in a prior‑appropriation state. (Property & Land Use, REP
  Reference)
