stem: A grocery store has operated as a legal nonconforming use in a residentially zoned block for
  thirty years. The owner wants to add a second story of retail space to the building. According to
  the rule on nonconforming uses, what is the likely outcome?
options:
  - The owner may add a second story
  - The owner may not add a second story
  - The owner must obtain a special-use permit
  - The owner may expand without increasing traffic
key: B
explanation: The privilege of a nonconforming use does not allow the owner to enlarge or intensify
  the use; adding a second story would be an enlargement and is therefore prohibited.
citation:
  source: REP Ref. Property & Land Use § 5.3
  url: null
  quoted_text: "The privilege is not a license to grow: ordinances typically forbid enlarging or
    intensifying the use, terminate it if abandoned for a stated period, and limit rebuilding after
    destruction."
