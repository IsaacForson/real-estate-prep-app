stem: A home is assessed at $340,000. The owner qualifies for a $30,000 homestead exemption. If the
  combined tax rate is 18 mills, what is the annual property tax?
options:
  - $5,580.00
  - $6,120.00
  - $6,660.00
  - $6,820.00
key: A
explanation: "One mill equals $1 of tax per $1,000 of assessed value. First subtract the homestead
  exemption: $340,000 − $30,000 = $310,000 taxable value. Convert 18 mills to a decimal: 18/1000 =
  0.018. Multiply the taxable value by the decimal rate: $310,000 × 0.018 = $5,580. The option that
  does not apply the exemption calculates tax on the full assessed value. The option that adds the
  exemption before calculating tax yields a higher amount. The option that uses the correct
  exemption but an incorrect tax rate (22 mills) also produces a different result."
citation:
