math:
  worked_solution: "Step 1: Taxable assessed value = $340,000 - $30,000 = $310,000.\\nStep 2: Mill
    rate as decimal = 18 mills / 1000 = 0.018.\\nStep 3: Property tax = $310,000 × 0.018 =
    $5,580.\\nStep 4: Annual property tax = $5,580."
  formulas:
