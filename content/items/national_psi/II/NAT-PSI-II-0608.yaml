stem: A contractor who performed work on a homeowner's property and was not paid files a lien
  against the property. Which statement best describes this lien?
options:
  - A lis pendens notice of suit
  - A voluntary lien created by owner
  - A specific lien for unpaid workers
  - A general lien from court judgment
key: C
explanation: A mechanic's lien is a specific, involuntary lien that arises by law for contractors,
  subcontractors, laborers, and suppliers who improve real property and remain unpaid; it is not a
  voluntary lien, not a general lien, and not a lis pendens.
