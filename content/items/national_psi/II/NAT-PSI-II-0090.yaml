stem: A tenant plants corn on leased farmland. Midway through the lease term, the landlord sells the
  property and the new owner terminates the lease without fault of the tenant. Under REP Ref.
  Property & Land Use § 1.5, may the tenant re‑enter to harvest the corn?
options:
  - The tenant may re‑enter the property to harvest the corn because the crops are emblements and
    the tenancy ended without fault.
  - The tenant may not re‑enter because the landlord sold the property and the lease terminated.
  - The tenant may re‑enter only if the lease agreement expressly permits harvesting after
    termination.
  - The tenant may not re‑enter because annual crops become real property once planted.
key: A
explanation: Annual crops that a tenant plants are considered emblements, which remain the tenant's
  personal property even though they are attached to the land. Under the doctrine of emblements, if
  a tenant's lease ends through no fault of the tenant, the tenant may re‑enter the leased property
  to harvest those crops. The statement that the tenant may re‑enter to harvest the corn because the
  crops are emblements and the tenancy ended without fault correctly applies this rule. The claim
  that the tenant may not re‑enter because the landlord sold the property and the lease terminated
  ignores the emblements doctrine and is therefore incorrect. The assertion that the tenant may
  re‑enter only if the lease expressly permits harvesting after termination adds a condition that
  the doctrine does not require; the right to harvest emblements exists regardless of such a clause,
  making this option incorrect. The suggestion that annual crops become real property once planted
  contradicts the classification of emblements as personal property and is also incorrect.
