stem: A property has a 2018 first mortgage, a 2020 mechanic's lien, and unpaid 2022 property taxes.
  If the property is foreclosed, which lien is paid first from the proceeds?
options:
  - A 2020 mechanic's lien filed
  - A 2022 property tax lien
  - A 2018 first mortgage loan
  - A lien paid after all others
key: B
explanation: Property tax liens rank ahead of all other liens regardless of date, so the 2022
  property tax lien is paid first. The other options ignore this statutory exception.
citation:
  source: REP Ref. Property & Land Use § 8.3
  url: null
  quoted_text: "Property tax and special assessment liens are the major exception: by statute they
    generally rank ahead of all other liens regardless of date, including an earlier-recorded
    mortgage."
