stem: A restaurant tenant installs a custom-built kitchen hood that is plumbed and wired, attached
  to the wall, and custom-fitted to the kitchen, with no written agreement. At lease end, the tenant
  removes the hood. What is the status of the hood?
options:
  - It is a fixture and must remain with the property
  - It is a trade fixture and the tenant may remove it
  - It is personal property because it is not attached
  - It becomes the landlord's property upon installation
key: B
explanation: Trade fixtures remain the tenant's personal property, and the tenant may remove them
  before the lease ends, repairing any damage caused. Therefore, the hood is a trade fixture and the
  tenant may remove it. The option claiming it is a fixture that must remain incorrectly applies the
  rule for items intended to stay with the real estate.
