stem: A contractor completes work on a homeowner's property in January, files a mechanic's lien in
  March, and the homeowner had recorded a mortgage in February. What could allow the mechanic's lien
  to take priority over the mortgage?
options:
  - If the contractor recorded the lien before the mortgage
  - If the lien amount is less than one thousand dollars
  - If the homeowner consented to the lien for the improvements made to the property
  - If state statute permits the lien to relate back to the date work began
key: D
explanation: Mechanic's lien priority is determined by state statute, which may allow the lien to
  relate back to the date the work began. Therefore, if the statute permits this relation back, the
  lien could take priority over a mortgage recorded later. The other scenarios—such as lien amount,
  homeowner consent, or the specific recording date relative to the mortgage—do not alter the
  statutory priority rule.
