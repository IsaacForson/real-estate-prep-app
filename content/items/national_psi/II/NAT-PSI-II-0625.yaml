stem: A general lien attaches to which of the following?
options:
  - A lien that attaches to only real property of the debtor and any improvements
  - A lien that attaches to only personal property of the debtor's estate
  - A lien that attaches to only one parcel of real property of the debtor
  - A lien that attaches to all of a debtor's property, real and personal
key: D
explanation: A general lien is a claim that reaches every asset owned by the debtor, including both
  real estate and personal belongings. Accordingly, the choice describing a lien that attaches to
  all of a debtor’s property, real and personal, is correct. The other choices limit the lien to
  only real property, only personal property, or a single parcel, which describe specific or limited
  liens. According to Property & Land Use, a general lien attaches to all of a debtor's property,
  real and personal.
