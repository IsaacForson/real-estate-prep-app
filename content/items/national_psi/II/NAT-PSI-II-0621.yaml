stem: A developer wants to build a day-care center in a residential district where the zoning
  ordinance allows such use only with a special-use permit. What must the developer demonstrate to
  obtain the permit?
options:
  - The applicant must prove excessive hardship
  - The applicant must show that conditions are met
  - The applicant must obtain approval from board
  - The applicant must pay required impact fees
key: B
explanation: The rule provides that a special-use permit authorizes a use identified as appropriate
  in a district only when stated conditions are met, and no hardship is required; the applicant must
  show that the ordinance's conditions (traffic, parking, screening, hours) will be satisfied. Thus,
  the developer must show that conditions are met. The distractor about proving excessive hardship
  describes a variance, not a special-use permit.
