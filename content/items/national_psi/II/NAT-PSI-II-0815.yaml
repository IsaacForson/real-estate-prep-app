stem: A contractor began work on a property on Jan 1 2023 and filed a mechanic’s lien on
  Mar 15 2024. A first mortgage was recorded on Feb 10 2023. Assuming the state follows the rule
  that a mechanic’s lien may relate back to the date work began, which lien has senior priority?
options:
  - the mechanic’s lien
  - the first mortgage
  - both have equal priority
  - seniority depends on date
key: A
explanation: Because the mechanic’s lien relates back to the date work began, its effective date is
  Jan 1 2023, which is earlier than the Feb 10 2023 recording of the first mortgage; therefore the
  mechanic’s lien has senior priority.
