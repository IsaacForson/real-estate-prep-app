stem: A property has a 2017 first mortgage, a 2019 judgment lien, and unpaid 2021 property taxes. If
  the property is foreclosed, which lien is paid first from the proceeds?
options:
  - The 2017 first mortgage
  - The 2019 judgment lien
  - The 2021 property taxes
  - The surplus to the owner
key: C
explanation: A tax lien takes priority over all other liens, regardless of when the other liens were
  recorded. Therefore the unpaid 2021 property taxes must be satisfied before the mortgage or
  judgment lien, and any remaining proceeds go to the owner after all liens are paid.
citation:
