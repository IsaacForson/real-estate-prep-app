stem: A city rezones a single residential lot to allow a commercial store while the surrounding area
  is residential and the comprehensive plan designates the area for residential use. What is the
  status of this rezoning?
options:
  - The rezoning is valid because it conforms to the comprehensive plan
  - The rezoning is valid because the owner benefits from the change
  - The rezoning is invalid because it constitutes spot zoning
  - The rezoning is invalid because it violates state environmental law
key: C
explanation: Reclassifying one small parcel for its owner's benefit, inconsistently with the plan
  and surroundings, is spot zoning and generally invalid. The described rezoning fits this
  definition, so it is invalid. The distractor claiming the rezoning is valid because it conforms to
  the comprehensive plan is incorrect because the rezoning is inconsistent with the plan.
