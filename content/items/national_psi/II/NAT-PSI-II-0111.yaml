stem: If the government exercises eminent domain to acquire land for a public school, which
  statement is correct?
options:
  - The government must pay just compensation to the owner
  - The government may take the land without compensation if it is for public use
  - The government only needs to provide relocation assistance
  - The government may take the land and pay only if the owner agrees
key: A
explanation: Eminent domain allows the government to take private property for public use, but it
  must pay just compensation to the owner.
citation:
  source: REP Ref. Property & Land Use § 4.1
  url: null
  quoted_text: "Private ownership is always subject to four government powers, remembered by the
    letters P-E-T-E: police power, eminent domain, taxation, and escheat. The pair most often
    confused: police power regulates use and pays nothing; eminent domain takes title or an interest
    and must pay."
