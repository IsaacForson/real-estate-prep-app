stem: A contractor who renovated a client's kitchen and was not paid files a lien against the
  property. How is this lien classified?
options:
  - a general, voluntary, contractual lien
  - a specific, involuntary, statutory lien
  - a specific, voluntary, equitable lien
  - a general, involuntary, tax assessment lien
key: B
explanation: A mechanic's lien is specific because it attaches only to the improved property,
  involuntary because it arises without the owner's consent, and statutory because it is created by
  law.
