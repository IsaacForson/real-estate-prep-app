stem: A property is subject to a 2015 judgment lien, a 2018 first mortgage, and unpaid 2020 property
  taxes. If the property is foreclosed, which lien is paid first from the proceeds?
options:
  - the 2018 first mortgage.
  - the 2015 judgment lien.
  - the 2015 judgment lien, general.
  - the 2020 property tax lien.
key: D
explanation: Property tax liens rank ahead of all other liens regardless of date, so the 2020
  property tax lien is paid first. The judgment lien, although general, is still junior to the tax
  lien, making the 2018 first mortgage incorrect.
citation:
