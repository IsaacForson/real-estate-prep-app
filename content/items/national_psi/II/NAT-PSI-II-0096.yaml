stem: A neighbor gives oral permission to park a car in the driveway for a month. Later the neighbor
  sells the property. What happens to the permission?
options:
  - The permission becomes an easement after one month of use
  - The permission continues because it was given orally
  - The permission is binding on the new owner as a license
  - The permission is terminated because the property was sold
key: D
explanation: "A license is personal permission to use another's land for a particular purpose. It is
  not an interest in land: it may be oral, is revocable at will, cannot be assigned, and ends on the
  death of either party or a sale of the property. Therefore, when the neighbor sells the property,
  the license terminates. The distractor claiming the permission continues because it was given
  orally ignores the rule that a license ends upon sale of the property."
