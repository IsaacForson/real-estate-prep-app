stem: What is a special-use (conditional-use) permit?
options:
  - A permit that excuses compliance with a zoning rule when the owner shows undue hardship.
  - A permit that authorizes a use the ordinance identifies as appropriate in a district only when
    stated conditions are met.
  - A permit that allows any use not listed in the zoning ordinance without further approval.
  - A permit that terminates a nonconforming use after a statutory abandonment period.
key: B
explanation: The special-use (conditional-use) permit authorizes a use that the zoning ordinance
  identifies as appropriate in a district only when specific conditions are satisfied. A variance,
  which requires showing undue hardship, is different. Allowing any use not listed in the ordinance
  without approval is not permitted. Terminating a nonconforming use after abandonment relates to
  loss of nonconforming status, not a special-use permit.
