stem: A salon tenant installs a barber chair that is bolted to the floor and wired for electricity,
  with no written agreement about its removal. Under REP Ref. Property & Land Use § 1.4, may the
  tenant remove the chair before the lease ends?
options:
  - Under the rule, the tenant may not remove the chair because it is considered a fixture under the
    attachment test
  - Under the rule, the tenant may remove the chair before the lease ends but is not required to
    repair damage
  - Under the rule, the tenant may not remove the chair because the lease prohibits removal of trade
    fixtures
  - Under the rule, the tenant may remove the chair before the lease ends and must repair any damage
    caused by removal
key: D
explanation: The rule states that a trade fixture remains the tenant's personal property and may be
  removed before the lease ends, with the tenant responsible for repairing any damage caused by
  removal. The option that says the tenant may remove the chair and must repair damage matches this
  rule. The option that says the tenant may remove the chair but is not required to repair damage is
  incorrect because the rule requires the tenant to repair any damage from removal. The option that
  says the tenant may not remove the chair because it is considered a fixture under the attachment
  test is incorrect because, although the chair is bolted and wired, it is a trade fixture and
  remains the tenant's personal property. The option that says the tenant may not remove the chair
  because the lease prohibits removal is incorrect because the scenario provides no lease
  prohibition on removal.
citation:
  source: REP Ref. Property & Land Use § 1.4
  url: null
  quoted_text: "A trade fixture is an item a commercial tenant attaches to leased premises to carry on
    a business: display shelving, kitchen hoods, a barber's chairs. Although attached, trade
    fixtures remain the tenant's personal property. The tenant may remove them before the lease ends
    and must repair the damage removal causes."
