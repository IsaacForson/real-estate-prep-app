stem: A tenant plants wheat on leased farmland. The lease ends early when the landlord sells the
  property, which is not the tenant's fault. What right does the tenant have?
options:
  - The tenant may sue the landlord for the value of the wheat
  - The tenant may re-enter to harvest the wheat they planted
  - The tenant may continue the lease under the original terms
  - The tenant may remove any irrigation system installed on the land
key: B
explanation: The doctrine of emblements provides that when a tenancy ends through no fault of the
  tenant at an unpredictable time, the tenant may re‑enter the land to harvest crops the tenant has
  planted. Accordingly, the tenant may re‑enter to harvest the wheat they planted. The tenant does
  not have a right to sue for the crop’s value, to continue the lease under the original terms, or
  to remove an irrigation system because those remedies are not covered by the doctrine of
  emblements. (Property & Land Use)
