stem: Which of the following actions would most likely be considered a violation of police power
  regulations?
options:
  - Paying property taxes annually to the county government
  - Exercising eminent domain to acquire land for the project
  - Constructing a building without obtaining a required building permit
  - Recording a deed to transfer ownership of a real property
key: C
explanation: Building codes are an exercise of police power, so constructing without a required
  permit violates that power. Paying property taxes relates to taxation, not police power.
