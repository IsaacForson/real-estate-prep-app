stem: A triangular lot cannot meet the 25-foot rear setback required by the zoning ordinance. The
  owner applies for an area variance to reduce the setback to 12 feet. The hardship stems from the
  lot's shape, which predates the owner's purchase. Which of the following must be true for the
  zoning board to grant the variance?
options:
  - Hardship unique to the property not created by the owner
  - Deviation that would harm the public or neighborhood
  - Hardship stemming from the owner's finances
  - Owner previously violated the zoning requirement
key: A
explanation: The variance rule requires that the hardship be unique to the property and not created
  by the owner. Financial hardship or owner-created hardship does not satisfy this requirement, and
  the deviation must not harm the public.
citation:
  source: REP Ref. Property & Land Use § 5.4
  url: null
  quoted_text: A variance permits deviation from a specific zoning requirement because strict
    application would impose unnecessary hardship unique to the property, not created by the owner,
    and the deviation would not harm the public or neighborhood.
