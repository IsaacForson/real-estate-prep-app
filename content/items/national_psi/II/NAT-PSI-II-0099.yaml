stem: A licensee wishes to refinance a property that already has a mortgage. The new lender agrees
  to be paid after the existing mortgage if the property is foreclosed. Which document allows this
  rearrangement of lien priority?
options:
  - Lis pendens filing
  - Lien waiver statement
  - Subordination agreement
  - Judgment lien release
key: C
explanation: A subordination agreement allows a new lender to agree to be paid after an existing
  mortgage if the property is foreclosed, thereby rearranging lien priority. A lis pendens filing
  only notes pending litigation, and a lien waiver or judgment release does not change priority
  order.
