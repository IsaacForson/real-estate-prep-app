stem: A neighbor orally permits a friend to park a car in the neighbor's driveway for the summer.
  The friend later parks there for two months, after which the neighbor revokes permission. The
  friend claims a right to continue parking. Which statement best describes the friend's right?
options:
  - The easement by prescription
  - The appurtenant easement
  - The revocable license
  - The profit à prendre
key: C
explanation: A license is personal permission to use another's land for a particular purpose; it may
  be oral and is revocable at will. An easement by prescription requires adverse use without
  permission, so the neighbor's oral permission prevents the friend from acquiring such an easement.
citation:
  source: REP Ref. Property & Land Use § 7.5
  url: null
  quoted_text: "A license is personal permission to use another's land for a particular purpose. It is
    not an interest in land: it may be oral, is revocable at will, cannot be assigned, and ends on
    the death of either party or a sale of the property."
