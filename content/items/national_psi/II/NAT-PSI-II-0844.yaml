stem: A property has a 2020 judgment lien, a 2021 federal tax lien, and unpaid 2022 property taxes.
  If the property is foreclosed, which lien is paid first from the proceeds?
options:
  - The 2020 judgment lien
  - The 2021 federal tax lien
  - The 2022 property tax lien
  - The 2022 mechanic's lien
key: C
explanation: Property tax and special assessment liens rank ahead of all other liens regardless of
  date, so the 2022 property tax lien is paid before the judgment and federal tax liens.
citation:
