stem: A city plans to widen a road and needs to acquire a strip of land along the front of a
  commercial parcel. The city files a condemnation action to take the strip. What must the city
  provide to the landowner?
options:
  - The city must provide the landowner with a new parcel of equal size elsewhere.
  - The city must pay the landowner just compensation for the taken interest.
  - The city must obtain the landowner's written consent before proceeding.
  - The city must lease the land back to the landowner for a term of 99 years.
key: B
explanation: When the government exercises eminent domain, it may take title or an interest in land,
  but the owner must receive just compensation for the taking. Accordingly, the city must pay the
  landowner just compensation for the strip of land. (Property & Land Use)
citation:
  source: REP Ref. Property & Land Use § 4.1
