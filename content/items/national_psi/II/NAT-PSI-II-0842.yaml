stem: "A homeowner obtains a loan from a bank and signs a deed of trust to secure the loan.
  According to the lien classifications, this deed of trust is:"
options:
  - a specific and voluntary lien created by agreement.
  - a specific lien arising without owner consent.
  - a voluntary lien arising with owner consent.
  - a general lien affecting all property.
key: A
explanation: A deed of trust is a specific and voluntary lien created by agreement. Therefore the
  option stating that it is a specific and voluntary lien created by agreement is correct. The other
  options are incorrect because they describe the lien as arising without consent, as merely
  voluntary without specificity, or as a general lien, which does not match the nature of a deed of
  trust.
