stem: A junior lienholder wishes to be paid before a senior lienholder from foreclosure proceeds.
  What action can the parties take to rearrange the priority of their liens?
options:
  - The parties may file a new mortgage deed of trust.
  - The parties may wait for the statutory period.
  - The parties may obtain a court judgment lien.
  - The parties may record a subordination agreement.
