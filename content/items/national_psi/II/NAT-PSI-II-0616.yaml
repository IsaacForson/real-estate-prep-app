stem: What is the term for a nonpossessory right to use another's land for a specific purpose that
  benefits a parcel and runs with the land?
options:
  - Profit à prendre right
  - Easement in gross
  - Appurtenant easement
  - License agreement right
key: C
explanation: An appurtenant easement benefits a parcel of land (the dominant tenement) and runs with
  the land, whereas an easement in gross benefits a person or entity and does not run with the land.
