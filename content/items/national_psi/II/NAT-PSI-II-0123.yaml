stem: A beauty salon tenant installs a custom-built shampoo bowl that is plumbed into the wall and
  bolted to the floor. There is no written agreement about its removal. Is the shampoo bowl
  considered real property or personal property?
options:
  - It is classified as real property under the trade fixture rule
  - It is classified as personal property under the trade fixture rule
  - It is classified as both real and personal property under the trade fixture rule
  - It is classified as neither real nor personal property under the trade fixture rule
key: B
explanation: Trade fixtures remain the tenant's personal property even when attached, unless there
  is a written agreement to the contrary. Since the shampoo bowl is attached but there is no written
  agreement, it is personal property. The option stating it is classified as real property under the
  trade fixture rule is incorrect; the option stating it is classified as both real and personal
  property under the trade fixture rule is incorrect; and the option stating it is classified as
  neither real nor personal property under the trade fixture rule is incorrect.
