stem: A homeowner obtains a mortgage loan to buy a house and signs a deed of trust. According to the
  text, how is this lien classified?
options:
  - A general involuntary lien
  - A specific involuntary lien
  - A general voluntary lien
  - A specific voluntary lien
key: D
explanation: A mortgage or deed of trust creates a lien that applies only to the specific property
  used as security and is established with the borrower's consent, which makes it a specific
  voluntary lien.
