stem: What is the definition of 'potential gross income'?
options:
  - Potential gross income is all units rented at market rent for the full period.
  - Potential gross income is the total rent collected from tenants after deducting vacancy losses.
  - Potential gross income is the income from laundry and parking facilities only.
  - Potential gross income is the net operating income before debt service and taxes.
key: A
explanation: Potential gross income is defined as all units rented at market rent for the full
  period. The option stating that potential gross income is all units rented at market rent for the
  full period correctly matches this definition. The option describing total rent collected after
  deducting vacancy losses refers to effective gross income, not potential gross income. The option
  limiting income to laundry and parking facilities only describes ancillary income, not potential
  gross income. The option equating potential gross income with net operating income before debt
  service and taxes confuses it with net operating income.
