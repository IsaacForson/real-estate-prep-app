stem: A landlord refuses to rent to a prospective tenant who uses a wheelchair. Based solely on the
  text, is this action permissible?
options:
  - The action is permissible if the tenant cannot afford the rent
  - The action is permitted if the landlord offers a different unit
  - The action is prohibited under the Fair Housing Act
  - The action is allowed under the housing-for-older-persons exemption
key: C
explanation: Refusing to rent to someone because they use a wheelchair is disability discrimination,
  which the Fair Housing Act prohibits. The Fair Housing Act makes it illegal to deny housing based
  on a protected class such as disability.
