stem: A broker fails to review a salesperson's advertisement that contains a false statement of
  fact. According to the supervision duty, what may happen to the broker?
options:
  - The broker may only be liable if they personally made the false statement.
  - The broker may be disciplined for the salesperson's violation.
  - The broker may be exempt from liability if the advertisement was approved by the salesperson.
  - The broker may avoid responsibility by claiming the salesperson is an independent contractor.
key: B
explanation: State license law makes the broker responsible for supervising licensees, and a broker
  may be disciplined for a salesperson's violation that the broker should have prevented through
  reasonable supervision. The broker cannot avoid this responsibility by labeling the salesperson an
  independent contractor.
citation:
  source: REP Ref. Brokerage Practice § 7.1
  url: null
  quoted_text: A broker may be disciplined for a salesperson's violation the broker should have
    prevented through reasonable supervision, and is civilly liable to clients and third parties for
    licensees' acts within the scope of the license.
