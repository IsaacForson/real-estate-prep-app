stem: A broker enters into an oral listing agreement with a seller that expires in 60 days. What is
  the likely enforceability of this agreement?
options:
  - The agreement is enforceable because it has a definite expiration date
  - The agreement is enforceable because the broker performed services
  - The agreement is not enforceable because most states require listings to be written
  - The agreement is not enforceable because the seller did not sign a purchase contract
key: C
explanation: Most states require listing agreements to be in writing, signed by the seller, and
  include a definite expiration date. An oral agreement fails the writing requirement, making it
  unenforceable. The presence of a definite expiration date or the broker’s performance does not
  satisfy the writing requirement, and the lack of a purchase contract is irrelevant to the
  enforceability of a listing agreement.
