stem: Under the Telephone Consumer Protection Act, which of the following best describes 'telephone
  solicitation'?
options:
  - The initiation of a telephone call or message for the purpose of encouraging the purchase or
    rental of, or investment in, property, goods, or services, which is transmitted to any person,
    but does not include calls made with prior express invitation or permission, to persons with an
    established business relationship, or by a tax‑exempt nonprofit organization.
  - The initiation of a telephone call or message for the purpose of encouraging the purchase or
    rental of, or investment in, property, goods, or services, which is transmitted to any person,
    but does not include calls made without prior express invitation or permission, to persons with
    an established business relationship, or by a tax‑exempt nonprofit organization.
  - The initiation of a telephone call or message for the purpose of encouraging the purchase or
    rental of, or investment in, property, goods, or services, which is transmitted to any person,
    but does not include calls made with prior express invitation or permission, to persons with no
    established business relationship, or by a tax‑exempt nonprofit organization.
  - The initiation of a telephone call or message for the purpose of encouraging the purchase or
    rental of, or investment in, property, goods, or services, which is transmitted to any person,
    but does not include calls made with prior express invitation or permission, to persons with an
    established business relationship, or by a for‑profit organization.
key: A
explanation: Under 47 U.S.C. §227(a)(4), telephone solicitation is defined as the initiation of a
  telephone call or message for the purpose of encouraging the purchase, rental, or investment in
  property, goods, or services, transmitted to any person, but it does not include calls made with
  prior express invitation or permission, to persons with an established business relationship, or
  by a tax‑exempt nonprofit organization. The option that states this definition matches the
  statute, while the other three options each change one of the exclusions, making them incorrect.
citation:
  source: "### 47 U.S.C. § 227 (TCPA / Do-Not-Call) — Telephone Consumer Protection Act — restrictions
    on telephone solicitation (a)(4)"
  url: null
  quoted_text: The term 'telephone solicitation' means the initiation of a telephone call or message
    for the purpose of encouraging the purchase or rental of, or investment in, property, goods, or
    services, which is transmitted to any person, but such term does not include a call or message
    (A) to any person with that person's prior express invitation or permission, (B) to any person
    with whom the caller has an established business relationship, or (C) by a tax exempt nonprofit
    organization.
