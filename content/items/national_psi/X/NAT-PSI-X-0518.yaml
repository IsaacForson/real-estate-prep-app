stem: A property manager requires a minimum credit score of 650 for all applicants, but imposes a
  higher minimum credit score of 700 for applicants who identify as Hispanic. Which statement best
  describes the manager’s practice under the text?
options:
  - The manager's practice is unlawful because it applies different criteria based on a protected
    class.
  - The manager's practice is permissible because credit standards are a legitimate business
    necessity.
  - The manager's practice is acceptable if the overall approval rate remains unchanged.
  - The manager's practice is allowed as long as the criteria are written down.
key: A
explanation: The Fair Housing Act requires that screening criteria be applied uniformly to all
  applicants and prohibits imposing different terms based on a protected class such as race or
  ethnicity. Therefore, requiring a higher credit score for Hispanic applicants is unlawful. The
  statement that the practice is permissible because credit standards are a legitimate business
  necessity is incorrect; business necessity cannot justify disparate treatment based on a protected
  class. The claim that the practice is acceptable if the overall approval rate remains unchanged is
  also incorrect because uniformity of application is required regardless of overall rates. Finally,
  merely writing down the criteria does not make the discriminatory practice permissible.
