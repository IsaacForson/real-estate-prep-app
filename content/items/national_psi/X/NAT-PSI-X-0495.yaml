stem: A tenant has vacated a unit. What must the landlord do with the security deposit?
options:
  - Return the deposit or provide an itemized statement of deductions within a stated number of days
  - Hold the deposit in the trust account and use it for future rent payments
  - Forfeit the deposit immediately to cover any unpaid rent or damages
  - Transfer the deposit to a personal account and return it after thirty days
key: A
explanation: The landlord must return the security deposit or provide an itemized statement of
  deductions within a stated number of days after the tenant vacates; retaining the deposit in bad
  faith may result in penalties. Holding the deposit for future rent is not permitted.
