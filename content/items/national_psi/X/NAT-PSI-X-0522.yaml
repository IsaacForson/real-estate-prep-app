stem: According to 42 U.S.C. § 1982, what right do all citizens have regarding real property?
options:
  - All citizens have the right to receive federal housing assistance without discrimination based
    on race, as provided by other federal laws.
  - All citizens have the right to inherit, purchase, lease, sell, hold, and convey real and
    personal property under the same conditions as white citizens.
  - All citizens have the right to obtain a mortgage loan regardless of religious affiliation, as
    lenders must follow equal credit opportunity rules.
  - All citizens have the right to file a housing discrimination complaint with the Department of
    Housing and Urban Development, which enforces fair housing standards.
key: B
explanation: The statute explicitly states that all citizens shall have the same right as white
  citizens to inherit, purchase, lease, sell, hold, and convey real and personal property. The other
  options describe rights or protections that are not mentioned in this provision, such as federal
  housing assistance, complaint filing procedures, or mortgage lending rules.
citation:
