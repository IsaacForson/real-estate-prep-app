stem: Under the TCPA, what is the maximum civil forfeiture penalty that may be imposed for each
  violation of the prohibition on misleading caller identification information?
options:
  - A civil forfeiture penalty of $5,000 per violation may be imposed.
  - A civil forfeiture penalty of $10,000 per violation may be imposed.
  - A civil forfeiture penalty of $15,000 per violation may be imposed.
  - A civil forfeiture penalty of $20,000 per violation may be imposed.
key: B
explanation: Under 47 U.S.C. § 227(e)(5)(A)(i), the forfeiture penalty for each violation of the
  prohibition on misleading caller identification information may not exceed $10,000. Therefore, the
  correct answer is the option stating a civil forfeiture penalty of $10,000 per violation may be
  imposed.
