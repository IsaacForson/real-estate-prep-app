stem: Under the TCPA, how is the term 'established business relationship' defined for the purposes
  of subsection (b)(1)(C)(i)?
options:
  - It is defined as any relationship where the recipient has previously purchased goods or services
    from the caller, regardless of when.
  - It is defined as a relationship that exists only if the recipient has given prior express
    consent to receive calls under the TCPA.
  - It is defined as the meaning in 47 CFR §64.1200 (Jan 1 2003), applied to business subscribers
    and subject to any time limit under paragraph (2)(G).
  - It is defined as a relationship where the caller has previously done business with the recipient
    within the last 18 months or more.
key: C
explanation: The term 'established business relationship' for subsection (b)(1)(C)(i) is defined by
  47 U.S.C. §227 as having the meaning given in 47 CFR §64.1200 as of January 1, 2003, applied to
  business subscribers and subject to any time limit under paragraph (2)(G). The option stating that
  the relationship exists where the caller has previously done business with the recipient within
  the last 18 months or more is incorrect because the definition does not include an 18‑month
  period.
