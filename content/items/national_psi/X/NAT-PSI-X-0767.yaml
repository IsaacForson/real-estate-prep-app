stem: A tenant who uses a wheelchair requests permission to install a portable ramp at the entrance
  of their rented unit, offering to cover all installation costs. The landlord refuses unless the
  tenant also pays to repaint the hallway after removal. Is the landlord’s refusal permissible?
options:
  - Yes, as long as the tenant agrees to restore the property to its original condition
  - No, because only structural modifications are permitted at the tenant's expense
  - Yes, because landlords may require tenants to cover additional cosmetic costs
  - No, because reasonable modifications must be permitted at the tenant's expense
key: D
explanation: Permission for reasonable modifications at the tenant's expense must be granted;
  landlords cannot condition approval on additional payments such as requiring repainting after
  removal. The option that says 'Yes, as long as the tenant agrees to restore the property to its
  original condition' incorrectly allows landlords to impose extra cosmetic costs.
