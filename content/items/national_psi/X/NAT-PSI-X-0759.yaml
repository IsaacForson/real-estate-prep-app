stem: According to REP Ref. Brokerage Practice § 1.1, which of the following acts is a licensee
  explicitly authorized to perform for compensation on behalf of others?
options:
  - Advising the client on how to take title
  - Drafting a lease agreement from scratch
  - Listing property for sale
  - Preparing a tax return for the client
key: C
explanation: The text explicitly lists 'listing' as one of the acts a license may authorize for
  compensation on behalf of others. Preparing a tax return is not a brokerage act and would
  constitute giving tax advice beyond general information, which is prohibited. Drafting a lease
  from scratch and advising on title are prohibited as unauthorized practice of law.
citation:
  source: "REP Ref. Brokerage Practice — Reference note: brokerage practice, listings, compensation,
    supervision, risk, property management (authored, status: draft — needs licensed review) § 1.1
    What a license authorizes"
  url: null
  quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
    to perform the acts state law defines as brokerage: listing, selling, buying, exchanging,
    leasing, renting, managing, negotiating, advertising, and offering to do any of these with
    respect to real property."
