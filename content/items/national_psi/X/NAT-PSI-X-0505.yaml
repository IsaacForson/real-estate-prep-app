stem: Two brokers claim a commission for the same sale. Broker X first showed the property to the
  buyer but then abandoned the buyer. Broker Y later negotiated and wrote the accepted offer. Which
  broker is the procuring cause?
options:
  - The broker who negotiated and wrote the accepted offer
  - The broker who first showed the property to the buyer
  - The broker who prepared the closing statement
  - The broker who advertised the property in the local newspaper
key: A
explanation: Under the procuring cause rule, the broker whose efforts began an unbroken chain of
  events leading to the sale earns the commission; Broker Y's negotiation and offer created that
  chain. The distractor focusing on the broker who first showed the property is incorrect because
  merely showing the property is not conclusive if there is a break in continuity.
citation:
  source: REP Ref. Brokerage Practice § 4.3
  url: null
  quoted_text: "When more than one broker claims a commission for the same sale, the dispute is
    decided by identifying the procuring cause: the broker whose efforts began an unbroken chain of
    events that led to the sale."
