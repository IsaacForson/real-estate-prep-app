stem: Which of the following advertising statements is prohibited under the Fair Housing Act?
options:
  - A statement indicating a preference, limitation, or discrimination based on a protected class
  - A statement describing the property's square footage, lot size, age, and school district
  - A statement of opinion such as "beautiful home" that does not assert a factual claim
  - A statement that includes the equal housing opportunity logo and the phrase "Equal Housing
    Opportunity"
key: A
explanation: The Fair Housing Act prohibits advertising that indicates a preference, limitation, or
  discrimination based on any protected class. The option that describes such a preference,
  limitation, or discrimination is therefore prohibited. The option that gives a factual description
  of the property’s size, age, and school district is permissible. The option that offers a
  subjective opinion like "beautiful home" is allowed puffery. The option that includes the equal
  housing opportunity logo and phrase is encouraged, not prohibited.
