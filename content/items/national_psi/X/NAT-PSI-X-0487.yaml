stem: A licensee calls a prospective buyer whose telephone number is listed on the national
  Do-Not-Call registry to advertise a new property listing. Based solely on the TCPA provisions,
  what is the status of this call?
options:
  - The call is permissible if made between 8 a.m. and 9 p.m.
  - The call is prohibited because the number is in the Do-Not-Call database.
  - The call is permissible if the consumer previously inquired about the listing.
  - The call is permissible if the licensee blocks caller ID information.
key: B
explanation: The TCPA prohibits making any telephone solicitation to a subscriber whose number is
  included in the Do-Not-Call database, so the call is prohibited. The claim that the call is
  permissible if made between 8 a.m. and 9 p.m. incorrectly introduces a time‑of‑day restriction
  that the TCPA does not contain for this prohibition.
