stem: A property manager requires a minimum credit score of 680 for applicants from Region X but 720
  for applicants from Region Y, asserting it reflects regional credit risk differences. Under §12.5,
  is this practice permissible?
options:
  - Yes, because managers may adjust criteria based on local market conditions
  - No, because screening criteria must be applied uniformly to every applicant
  - Yes, as long as the differing scores are documented in writing and retained
  - No, because only income ratios may differ among applicants in their screening
key: B
explanation: The rule states screening criteria must be applied uniformly to every applicant;
  varying credit scores by region violates this requirement. The suggestion that managers may adjust
  criteria based on local market conditions is incorrect.
