stem: Which of the following actions constitutes the unauthorized practice of law for a licensee?
options:
  - Drafting original contract language for a client
  - Filling in the negotiated price on a standard purchase agreement
  - Placing a broker's sign on the listed property
  - Advertising the property on multiple listing services
key: A
explanation: Licensees may not draft original contract language, create deeds, mortgages, or leases
  from scratch, give legal advice, advise how to take title, or interpret how a law applies to a
  client's situation. Filling in the negotiated price on a standard purchase agreement is permitted
  as incidental to brokerage service. Therefore drafting original contract language is the
  prohibited act.
citation:
  source: REP Ref. Brokerage Practice § 1.2
  url: null
  quoted_text: Licensees may **not** draft original contract language, create deeds, mortgages, or
    leases from scratch (except where a standard lease form is expressly permitted), give legal
    advice about the meaning or effect of a document, advise how to take title, or interpret how a
    law applies to a client's situation.
