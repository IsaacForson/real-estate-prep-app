stem: A broker wants to maintain the federal statutory safe harbor that treats licensees as
  independent contractors for tax purposes. Which of the following actions would jeopardize that
  safe harbor?
options:
  - Requiring licensees to hold a valid real estate license
  - Paying licensees solely on commission splits
  - Having a written independent contractor agreement
  - Requiring licensees to attend mandatory weekly meetings
key: D
explanation: The safe harbor requires brokers to avoid conduct inconsistent with independent
  contractor status, such as setting mandatory hours or reimbursing expenses (quoted text).
  Requiring mandatory weekly meetings is such conduct, thus breaks the safe harbor. Paying solely on
  commission and having a written agreement are consistent with the safe harbor.
