stem: Which of the following advertising practices is explicitly prohibited by the Fair Housing Act
  as described in the text?
options:
  - Indicating a preference based on a protected class
  - Displaying the equal housing opportunity logo in advertisements
  - Describing property features such as square footage
  - Using puffery of opinion in property descriptions
key: A
explanation: The Fair Housing Act prohibits advertising that indicates a preference, limitation, or
  discrimination based on a protected class (quoted text). Using puffery of opinion is allowed as
  long as it does not become a factual claim, so it is not prohibited.
