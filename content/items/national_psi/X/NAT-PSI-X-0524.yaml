stem: A licensee refuses to convey (sell) real property to a buyer because the buyer is of Hispanic
  origin. Based solely on 42 U.S.C. § 1982, is the licensee's action permissible?
options:
  - The licensee's action is impermissible only when the property is financed with a federally
    insured loan, which triggers additional nondiscrimination rules.
  - The licensee's action is permissible because the statute only protects citizens, not
    non-citizens, even if the buyer is a citizen of Hispanic origin.
  - The licensee's action is permissible if the buyer obtains a private waiver from the seller,
    which the statute allows.
  - The licensee's action is impermissible because the statute guarantees the same right to sell
    real property as white citizens enjoy, irrespective of the buyer's national origin.
key: D
explanation: The statute ensures all citizens have the same right to sell real property as white
  citizens enjoy, so refusing to sell based on national origin is impermissible. The other options
  incorrectly assert that the statute excludes certain citizens, allows private waivers, or limits
  the prohibition to federally financed properties.
citation:
  source: 42 U.S.C. § 1982 (Civil Rights Act of 1866, property rights) — Civil Rights Act of 1866 —
