stem: Which federal agency has authority to enforce antitrust laws for all other character of
  commerce under the Sherman Act?
options:
  - Federal Trade Commission
  - Federal Reserve Board
  - Department of Transportation
  - Surface Transportation Board
key: A
explanation: The statute states that authority to enforce the antitrust provisions is vested in the
  Federal Trade Commission where applicable to all other character of commerce. The Federal Reserve
  Board only oversees banks, the Secretary of Transportation covers air carriers, and the Surface
  Transportation Board handles common carriers, so they lack general commerce authority.
