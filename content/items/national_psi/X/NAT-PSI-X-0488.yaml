stem: A homeowner receives two unsolicited telephone calls from the same telemarketing firm within a
  12‑month period, violating the TCPA. What is the maximum statutory damages the homeowner may
  recover per violation under the private right of action?
options:
  - The homeowner may recover up to $500 in damages per violation.
  - The homeowner may recover up to $1,000 in damages per violation.
  - The homeowner may recover up to $100 in damages per violation.
  - The homeowner may recover up to $250 in damages per violation.
key: A
explanation: Under the TCPA’s private right of action, a plaintiff may receive up to $500 in damages
  for each violation. The answer stating that amount is correct. The options stating higher amounts
  ($1,000, $250, or $100) overstate the damages authorized by the statute and are therefore
  incorrect.
