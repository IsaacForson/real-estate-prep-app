stem: A licensee receives an earnest money deposit from a buyer and must handle the funds according
  to trust account rules. What is the correct action?
options:
  - Deposit the earnest money into the brokerage's operating account and record it as a liability
  - Deposit the earnest money into a designated trust or escrow account separate from operating funds
  - Deposit the earnest money into the licensee's personal account until closing and then transfer
    it at settlement
  - Deposit the earnest money into the operating account if the broker provides a written waiver to
    the licensee
key: B
explanation: Trust money must be held in a designated trust or escrow account separate from the
  firm's operating funds. The correct action is to deposit the earnest money into a designated trust
  or escrow account separate from operating funds. Depositing the earnest money into the brokerage's
  operating account and recording it as a liability, depositing it into the licensee's personal
  account until closing, or depositing it into the operating account with a written waiver all
  involve commingling trust funds with operating or personal funds, which is prohibited.
citation:
