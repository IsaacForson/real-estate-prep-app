stem: A property sells for $275,000 with a commission rate of 5.2%. What is the total commission?
options:
  - $14,300
  - $143,000
  - $1,430
  - $1,430,000
key: A
explanation: "Using the formula Commission = sale price × rate, convert 5.2% to 0.052 and multiply:
  $275,000 × 0.052 = $14,300. The distractor $143,000 results from mistakenly using 52% (0.52) as
  the decimal equivalent, which overstates the commission by a factor of ten."
