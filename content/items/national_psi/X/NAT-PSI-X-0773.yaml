stem: Which of the following actions with earnest money constitutes conversion of trust funds?
options:
  - Using earnest money to cover office operating expenses
  - Holding earnest money until parties agree in writing
  - Paying broker commission from trust account after closing
  - Maintaining a separate ledger for each transaction
key: A
explanation: Conversion is using trust money for any unauthorized purpose (quoted text). Using
  earnest money to pay office expenses is an unauthorized use, thus conversion. Holding disputed
  funds until agreement, paying earned commissions after closing, and keeping separate ledgers are
  permitted or required.
