stem: Which of the following is included in operating expenses?
options:
  - The mortgage principal
  - The income tax
  - The depreciation expense
  - The property taxes
key: D
explanation: Operating expenses include fixed costs such as taxes and insurance, variable costs such
  as utilities and repairs, and reserves for replacement. Property taxes are a fixed operating
  expense. The mortgage principal is not an operating expense because debt service is excluded from
  net operating income.
