stem: A licensee refuses to lease an apartment to a prospective tenant because the tenant is African
  American. Based solely on 42 U.S.C. § 1982, is the licensee's action permissible?
options:
  - The licensee's action is permissible because the statute only applies to property sales, not
    leases, as clarified in related case law.
  - The licensee's action is impermissible because the statute guarantees the same right to lease
    real property as white citizens enjoy, regardless of the tenant's race.
  - The licensee's action is permissible if the licensee obtains a waiver from the Department of
    Housing and Urban Development, which may grant exceptions under certain conditions.
  - The licensee's action is impermissible only if the property receives federal financial
    assistance, which triggers additional nondiscrimination requirements under other statutes.
key: B
explanation: The statute 42 U.S.C. § 1982 provides that all citizens have the same right as white
  citizens to lease real property. Therefore, refusing to lease to someone because of their race is
  impermissible. The option claiming the statute only applies to sales misstates its coverage; the
  option suggesting a waiver from HUD adds a provision that does not exist in the statute; and the
  option limiting the prohibition to federally assisted properties incorrectly conditions the right
  on federal assistance, which the statute does not require.
