stem: "A licensee uses an automatic telephone dialing system to call a telephone number assigned to
  a paging service to promote a new listing, without the recipient's prior express consent. Under
  the TCPA, this call is:"
options:
  - The call is unlawful unless made solely to collect a debt owed to or guaranteed by the United
    States
  - The call is lawful if the licensee has an established business relationship with the recipient
  - The call is lawful because it uses an automatic telephone dialing system rather than a live
    operator
  - The call is unlawful even if the recipient has previously consented to receive calls
key: A
explanation: The TCPA bars autodialed calls to paging service lines unless the call is solely to
  collect a debt owed to or guaranteed by the United States; no exemption exists for established
  business relationships or prior consent. The claim that the call is lawful if the licensee has an
  established business relationship with the recipient is incorrect because the established business
  relationship exception does not apply to paging service calls under this provision.
