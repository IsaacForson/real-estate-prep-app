stem: A licensee is budgeting rent for an 8-unit apartment building. The target NOI is $48,000,
  annual operating expenses are $27,000, and the expected vacancy rate is 4%. What is the required
  rent per unit per month?
options:
  - $750.00
  - $227.86
  - $813.80
  - $520.83
key: C
explanation: First, EGI = target NOI + operating expenses = $48,000 + $27,000 = $75,000. Next, PGI =
  EGI ÷ (1 − vacancy rate) = $75,000 ÷ 0.96 = $78,125. Finally, rent per unit per month = PGI ÷
  (units × 12) = $78,125 ÷ (8 × 12) = $813.80. The distractors arise from omitting expenses,
  misapplying the vacancy rate as a multiplier, or subtracting expenses instead of adding them.
