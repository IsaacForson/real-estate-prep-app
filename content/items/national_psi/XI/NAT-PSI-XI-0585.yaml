stem: A trapezoidal lot has 80 feet of frontage, 120 feet at the rear, and a depth of 100 feet. What
  is the area of the lot in acres?
options:
  - 0.18 acre
  - 0.28 acre
  - 0.46 acre
  - 0.23 acre
key: D
explanation: Using the trapezoid formula area = ((side1 + side2) / 2) × depth, the average width is
  (80 + 120) / 2 = 100 ft. Multiplying by the depth gives 100 × 100 = 10,000 sq ft. Dividing by
  43,560 converts to 0.2296 acre, which rounds to 0.23 acre. The distractor 0.46 acre results from
  forgetting to divide by 2 before multiplying by depth, which incorrectly uses the sum of the sides
  instead of the average.
