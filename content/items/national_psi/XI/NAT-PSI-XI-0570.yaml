stem: What is the formula for finding cost from a stated profit?
options:
  - Cost = sale price ÷ (1 − profit rate)
  - Cost = sale price ÷ (1 + profit rate)
  - Cost = sale price × (1 + profit rate)
  - Cost = sale price × (1 − profit rate)
key: B
explanation: To find cost when a profit is known, divide the sale price by one plus the profit rate.
  Multiplying by one plus the profit rate would increase the sale price rather than reduce it to
  cost. Using one minus the profit rate would incorrectly treat the profit as a loss.
