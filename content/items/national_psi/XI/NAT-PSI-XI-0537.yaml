stem: What is the formula for required effective gross income (EGI) when budgeting rent to reach a
  target NOI?
options:
  - EGI = target NOI ÷ operating expenses.
  - EGI = target NOI + operating expenses.
  - EGI = target NOI × operating expenses.
  - EGI = target NOI − operating expenses.
key: B
explanation: Required effective gross income (EGI) is calculated by adding the target net operating
  income (NOI) to the operating expenses. Therefore the option stating EGI = target NOI + operating
  expenses correctly reflects that relationship. The option stating EGI = target NOI ÷ operating
  expenses is incorrect because it divides the two values instead of adding them.
