stem: A 30-year fixed-rate mortgage has a monthly payment of $1,200 and an original principal of
  $200,000. What is the total interest paid over the life of the loan?
options:
  - $282,000
  - $332,000
  - $182,000
  - $232,000
key: D
explanation: According to the formula total interest = payment × number of payments − original
  principal, the number of payments is 30 years × 12 = 360. Total paid equals $1,200 × 360 =
  $432,000. Subtracting the original principal of $200,000 yields $232,000 of interest. The
  distractor $332,000 arises from subtracting only half the principal ($100,000) instead of the full
  amount.
citation:
