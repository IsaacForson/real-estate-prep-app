stem: A licensee purchased a property for $200,000, spent $50,000 on improvements, and later sold it
  for $300,000. What is the percent profit on cost?
options:
  - 16.67%
  - 50.00%
  - 20.00%
  - 25.00%
key: C
explanation: Total cost = purchase price + improvements = $200,000 + $50,000 = $250,000. Profit =
  sale price − total cost = $300,000 − $250,000 = $50,000. Percent profit = profit ÷ total cost =
  $50,000 ÷ $250,000 = 0.20 = 20.00%. The distractors arise from using sale price as denominator,
  omitting improvements in the cost base, or using purchase price as denominator.
citation:
  source: REP Ref. Real Estate Math § 14.1
  url: null
  quoted_text: Percent = (sale price − total cost) ÷ total cost (§ 7.6)
  secondary: []
math:
  worked_solution: |-
    Total cost = $200,000 + $50,000 = $250,000
    Profit = $300,000 − $250,000 = $50,000
    Percent = $50,000 ÷ $250,000 = 0.20 = 20.00%
