stem: When adjusting a comparable sale to the subject property, what adjustment is made if the
  comparable is superior?
options:
  - Subtract the adjustment
  - Add the adjustment
  - Multiply the adjustment
  - Divide the adjustment
key: A
explanation: If a comparable sale is superior (better) than the subject property, you subtract the
  adjustment to bring the comparable down to the subject's level. If the comparable is inferior, you
  add the adjustment to bring it up.
