stem: A licensee is budgeting rent for a 12-unit apartment building. The target NOI is $55,000,
  annual operating expenses are $30,000, and the expected vacancy rate is 6%. What is the required
  rent per unit per month?
options:
  - $406.33
  - $627.96
  - $555.00
  - $7,535.46
key: B
explanation: First, EGI = target NOI + expenses = $55,000 + $30,000 = $85,000. Then, PGI = EGI ÷ (1
  − vacancy rate) = $85,000 ÷ 0.94 ≈ $90,425.53. Finally, rent per unit per month = PGI ÷ units ÷ 12
  = $90,425.53 ÷ 12 ÷ 12 ≈ $627.96. The other options result from omitting expenses, misapplying the
  vacancy rate, or forgetting to divide by 12.
