stem: In the part‑whole‑rate triangle, which formula solves for the whole?
options:
  - Whole = Part ÷ Rate
  - Whole = Part × Rate
  - Whole = Rate ÷ Part
  - Whole = Part + Rate
key: A
explanation: From the relationship Part = Whole × Rate, solving for the whole gives Whole = Part ÷
  Rate. The distractor Whole = Part × Rate incorrectly keeps multiplication instead of dividing the
  part by the rate.
