stem: According to §15.2 Net-to-seller shortcut, how should you calculate the sale price when you
  know the desired net amount and the rate?
options:
  - Multiply the desired net by (1 + rate)
  - Divide the desired net by (1 − rate)
  - Multiply the desired net by (1 − rate)
  - Divide the desired net by (1 + rate)
key: B
explanation: The rule states that multiplying the desired net by (1 + rate) understates the price;
  instead you must divide the desired net by (1 − rate) to obtain the correct sale price. This
  ensures the rate is removed from the net to recover the gross amount. The distractor that
  multiplies by (1 + rate) would produce a price too low because it adds the rate rather than
  reversing it.
