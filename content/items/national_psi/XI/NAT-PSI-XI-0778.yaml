math:
  worked_solution: "Step 1: EGI = $50,000 + $30,000 = $80,000.\\nStep 2: PGI = $80,000 ÷ (1 - 0.10) =
    $80,000 ÷ 0.90 = $88,888.89.\\nStep 3: Rent per unit per month = $88,888.89 ÷ 8 ÷ 12 =
    $88,888.89 ÷ 96 = $925.93."
