stem: An owner wants a target NOI of $50,000 with operating expenses of $30,000, a vacancy rate of
  10%, and 8 units. What is the required rent per unit per month to achieve the target?
options:
  - $1,041.67
  - $763.89
  - $925.93
  - $833.33
key: C
explanation: First, EGI equals target NOI plus operating expenses ($80,000). Then PGI equals EGI
  divided by (1 minus vacancy rate) ($88,888.89). Finally, rent per unit per month equals PGI
  divided by units and by 12, yielding $925.93. The distractor $833.33 results from omitting the
  vacancy adjustment and using EGI directly as PGI.
citation:
