  - Whole = Part ÷ Rate
  - Whole = Rate ÷ Part
  - Whole = Part + Rate
key: B
explanation: To find the whole when you know the part and the rate, divide the part by the rate.
  Multiplying the part by the rate would give the part again, not the whole.
