stem: "A licensee hires a contractor to remove soil contaminated with a hazardous substance from a
  property. The contractor later disposes of the soil at an unlicensed site, causing a release.
  Under CERCLA § 9607(a)(3), the licensee may be held liable because:"
options:
  - The licensee arranged for disposal or treatment of the hazardous substance.
  - The licensee possessed the property from which the contaminated soil was removed.
  - The licensee neglected to verify the contractor's disposal site credentials.
  - The licensee was aware that the contractor planned to dispose of the soil elsewhere.
key: A
explanation: Subsection (a)(3) imposes liability on any person who arranges for disposal or
  treatment of hazardous substances, regardless of ownership or knowledge. The licensee’s role as
  arranger triggers liability; failure to supervise or actual knowledge are not required for this
  basis of liability.
citation:
  source: 42 U.S.C. §§ 9601–9628 (CERCLA) — CERCLA — Hazardous Substances Releases, Liability,
