stem: A licensee advises a prospective buyer to obtain a Phase I Environmental Site Assessment that
  includes a review of historical aerial photographs. According to CERCLA, which component of the
  assessment satisfies the 'all appropriate inquiries' requirement?
options:
  - The measurement of square footage
  - The verification of zoning classification
  - The assessment of market value
  - The review of historical aerial photographs
key: D
explanation: The all appropriate inquiries requirement includes reviews of historical sources such
  as aerial photographs, building department records, and land use records to determine prior uses
  of the property (see 42 U.S.C. § 9601(35)(B)(ii)). Measuring square footage, verifying zoning, or
  assessing market value are not part of this inquiry.
