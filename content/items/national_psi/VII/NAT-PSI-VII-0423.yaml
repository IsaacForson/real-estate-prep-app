stem: Under CERCLA, which of the following roles is expressly included in the definition of a
  'fiduciary'?
options:
  - Trustee
  - Accountant
  - Real estate broker
  - Attorney
key: A
explanation: CERCLA defines a fiduciary as including a trustee, executor, administrator, custodian,
  guardian, receiver, conservator, committee of estates of incapacitated persons, personal
  representative, or similar representative. The other roles are not listed in the statutory
  definition.
