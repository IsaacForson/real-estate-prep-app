stem: Under Section 404 of the Clean Water Act, what is required to discharge dredged or fill
  material into jurisdictional wetlands?
options:
  - A permit from the U.S. Army Corps of Engineers with EPA oversight
  - Approval from the state environmental agency for wetland activities
  - A written waiver from the property owner for wetland work
  - Notification to the local health department regarding wetlands
key: A
explanation: Discharging dredged or fill material into jurisdictional wetlands requires a permit
  from the U.S. Army Corps of Engineers with EPA oversight. Approval from the state environmental
  agency for wetland activities does not satisfy this requirement because federal law mandates the
  Corps permit with EPA oversight, not merely state agency approval.
