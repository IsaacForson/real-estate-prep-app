stem: Under CERCLA, which of the following roles is expressly included in the definition of a
  'fiduciary'?
options:
  - Real estate broker listing a property
  - Property manager collecting rent
  - Trustee of a bankruptcy estate
  - Insurance adjuster assessing damage
key: C
explanation: The definition of fiduciary includes a trustee acting for the benefit of another party;
  therefore a trustee of a bankruptcy estate qualifies. The distractors describe roles such as a
  real estate broker or property manager, which are not listed in the statutory definition and thus
  do not meet the fiduciary definition under CERCLA.
