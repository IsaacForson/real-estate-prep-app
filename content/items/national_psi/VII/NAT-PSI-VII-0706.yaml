stem: A seller lists property 'as-is' and tells the licensee not to disclose a known cracked
  foundation. What is the licensee's obligation?
options:
  - The as-is clause eliminates the need to disclose any defects
  - The licensee may rely on the as-is clause to avoid disclosing the cracked foundation
  - The licensee must disclose the known cracked foundation despite the as-is clause
  - The licensee should only disclose if the buyer asks directly
key: C
explanation: An 'as-is' clause does not relieve the seller of the duty to disclose known material
  latent defects, nor does it protect against fraud. Hence the licensee must disclose the cracked
  foundation even though the property is sold 'as-is'. The distractor claiming the as-is clause
  eliminates the need to disclose any defects misstates the limitation of such clauses.
