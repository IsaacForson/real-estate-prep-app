stem: A lender signs a guarantee agreement to cover potential cleanup costs for a property owner but
  does not participate in management of the facility. Under CERCLA, is the lender considered a
  guarantor?
options:
  - The lender is considered a guarantor because it provides evidence of financial responsibility
    for the owner or operator
  - The lender is not considered a guarantor because it does not participate in management of the
    facility
  - The lender is not considered a guarantor because only the owner or operator can be a guarantor
  - The lender is considered a guarantor only if it also holds title to the facility
key: A
explanation: According to CERCLA § 9601(13), a guarantor is any person, other than the owner or
  operator, who provides evidence of financial responsibility for an owner or operator under this
  chapter. The lender, by signing a guarantee agreement, provides such evidence, so it is a
  guarantor regardless of management participation. The claim that lack of management participation
  disqualifies the lender is incorrect, because the guarantor definition does not include a
  management requirement.
