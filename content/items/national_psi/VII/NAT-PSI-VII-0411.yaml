stem: According to CERCLA § 9601, how is the term 'ground water' defined?
options:
  - Water that is used exclusively for agricultural irrigation
  - Water that is stored in above‑ground reservoirs or tanks
  - Water that is present in the unsaturated zone above the water table
  - Water that is found in a saturated zone or stratum beneath the surface of land or water
key: D
explanation: The definition of ground water in CERCLA § 9601(12) states it is water in a saturated
  zone or stratum beneath the surface of land or water. The other options describe unsaturated zone,
  above‑ground storage, or exclusive agricultural use, which do not match the statutory definition.
