stem: A licensee receives a seller's disclosure stating the roof is new. During the showing, the
  licensee observes several missing shingles. According to §5.3 Reliance and verification, what is
  the licensee's appropriate action?
options:
  - Repeat the seller's claim that the roof is new, citing the seller's form as source
  - Inform the buyer that the roof appears to need repair based on observation and recommend a roof
    inspection
  - Remain silent about the roof condition to avoid contradicting the seller
  - Advise the buyer to rely solely on the seller's form because it is a reliable source
key: B
explanation: The rule allows a licensee to repeat information from a reliable source only when the
  licensee has no reason to doubt it. If the licensee observes something that contradicts that
  source, the licensee must not repeat the doubtful claim and should instead disclose what was
  observed and advise the buyer to get an inspection. Repeating the seller’s claim despite seeing
  missing shingles would violate the rule, as would staying silent about an observed defect or
  telling the buyer to rely solely on the seller’s form when the observation contradicts it.
citation:
  source: REP Ref. Property Condition & Environmental § 5.3
  url: null
  quoted_text: A licensee may generally pass along information from a reliable source (the seller's
    form, public records, a survey) with attribution, but may not repeat information the licensee
    has reason to doubt or that contradicts what the licensee observed.
