stem: Under 42 U.S.C. § 4012a(f)(5), what is the maximum civil monetary penalty that may be assessed
  for each violation under subsection (f)(2) or (f)(3)?
options:
  - A civil penalty of $2,000 per violation.
  - A civil penalty of $1,000 per violation.
  - A civil penalty of $500 per violation.
  - A civil penalty of $5,000 per violation.
key: A
explanation: Subsection (f)(5) states that a civil monetary penalty under this subsection may not
  exceed $2,000 for each violation under paragraph (2) or paragraph (3). Therefore, the maximum
  penalty per violation is $2,000. The $500 and $1,000 options are below the statutory cap, while
  the $5,000 option exceeds it.
