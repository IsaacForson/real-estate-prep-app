stem: "A licensee advises a homeowner to repaint a window sill with lead-based paint to temporarily
  reduce exposure while arranging for permanent removal. According to the definitions in the
  Residential Lead-Based Paint Hazard Reduction Act, this action is best described as:"
options:
  - Risk assessment
  - Hazard evaluation
  - Full abatement
  - Interim controls
key: D
explanation: Repainting to temporarily reduce exposure aligns with the definition of interim
  controls, which are measures designed to reduce human exposure temporarily, including painting.
  Abatement refers to permanent elimination of hazards, which is not what the described action
  entails. Evaluation and risk assessment involve investigation, not implementation of
  exposure‑reduction measures.
citation:
  source: 42 U.S.C. §§ 4851–4856 (Lead paint — Residential Lead-Based Paint Hazard Reduction Act) —
    Residential Lead-Based Paint Hazard Reduction Act (incl. § 4852d disclosure) §4851b
  url: null
  quoted_text: Interim controls means a set of measures designed to reduce temporarily human exposure
    or likely exposure to lead-based paint hazards, including specialized cleaning, repairs,
    maintenance, painting, temporary containment, ongoing monitoring of lead-based paint hazards or
    potential hazards, and the establishment and operation of management and resident education
    programs
