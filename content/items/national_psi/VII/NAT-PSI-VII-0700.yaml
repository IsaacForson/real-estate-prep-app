stem: Which remedy allows an injured buyer to unwind the sale after discovering a material defect?
options:
  - Seek statutory remedies with multiplied damages
  - Request a price reduction based on repair costs
  - Pursue rescission of the sale to unwind transaction
  - File a claim for attorney fees only
key: C
explanation: The remedy of rescission cancels the contract and returns the parties to their pre‑sale
  positions, effectively unwinding the transaction. Seeking statutory remedies with multiplied
  damages provides additional compensation but does not undo the sale. Requesting a price reduction
  based on repair costs adjusts the price while keeping the contract intact. Filing a claim for
  attorney fees only recovers costs but leaves the sale unchanged.
