stem: A homeowner notices wet, lush grass over the drainfield and foul sewage odors. What does this
  most likely indicate?
options:
  - Recent heavy rainfall causing temporary soggy ground
  - Well water contamination affecting nearby plants
  - Septic system failure indicated by wet drainfield
  - Normal seasonal vegetation growth over the drainfield
key: C
explanation: Signs of septic system failure include slow drains, sewage odors, wet or unusually lush
  areas over the drainfield, and backups. Therefore, wet, lush grass and foul odors indicate
  failure. The option describing normal seasonal vegetation growth over the drainfield is incorrect
  because lush grass over the drainfield signals failure, not normal growth.
