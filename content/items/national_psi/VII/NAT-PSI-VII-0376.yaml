stem: A licensee discovers soil contaminated with petroleum hydrocarbons at a former gasoline
  station. According to CERCLA, is the petroleum contamination considered a hazardous substance?
options:
  - No, unless the petroleum is mixed with a listed hazardous substance
  - No, because petroleum is excluded from the definition unless specifically listed
  - Yes, if the contamination exceeds EPA-established thresholds
  - Yes, because any soil contamination triggers hazardous substance status
key: B
explanation: Petroleum is excluded from the definition of hazardous substance unless specifically
  listed (see § 9601(14) exclusion). Therefore, contamination from petroleum hydrocarbons alone does
  not constitute a hazardous substance under CERCLA. The distractor that any soil contamination
  triggers hazardous substance status ignores this petroleum exclusion.
