  url: null
  quoted_text: There shall be no liability under subsection (a) of this section for a person otherwise
    liable who can establish by a preponderance of the evidence that the release or threat of
    release of a hazardous substance and the damages resulting therefrom were caused solely by— (1)
    an act of God;
