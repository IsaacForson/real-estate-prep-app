stem: "A release of a hazardous substance occurs due to a sudden flood that damages a storage tank.
  The defendant claims the release was caused solely by an act of God. Under CERCLA § 9607(b)(1),
  the defendant can avoid liability if they:"
options:
  - Demonstrate they had no knowledge of the hazardous substance prior to the release.
  - Prove by a preponderance of the evidence that the release was caused solely by an act of God.
  - Show they exercised due care with respect to the hazardous substance and took all reasonable
    precautions.
  - Establish that the flood was unforeseeable and that they followed all applicable safety rules.
key: B
explanation: Subsection (b)(1) provides a complete defense when the release is caused solely by an
  act of God, requiring the defendant to prove that fact by a preponderance of the evidence. The
  other options describe elements of the third‑party defense or unrelated considerations and do not
  alone satisfy the act‑of‑God defense.
