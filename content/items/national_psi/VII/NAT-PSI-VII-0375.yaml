stem: Under CERCLA, which of the following is included in the definition of 'hazardous substance'?
options:
  - A substance listed under section 9602
  - Petroleum crude oil or fractions
  - Natural gas or synthetic gas for fuel
  - Water used by a public water system
key: A
explanation: The definition of hazardous substance includes any substance designated under section
  9602 of this title (42 U.S.C. § 9601(14)(B)). Petroleum crude oil and natural gas are explicitly
  excluded unless specifically listed (see § 9601(14) exclusion). Water used by a public water
  system is not mentioned in the hazardous substance definition.
