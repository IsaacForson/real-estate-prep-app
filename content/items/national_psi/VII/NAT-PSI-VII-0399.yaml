stem: A licensee is acting as an agent for a seller of a home built before 1978. Under the
  Residential Lead-Based Paint Hazard Reduction Act, what duty does the licensee have regarding
  lead-based paint disclosure?
options:
  - Conduct a lead risk assessment for the seller using the DIY test kit
  - Advise the seller to omit the lead disclosure pamphlet from the contract
  - Provide the buyer with a lead hazard control plan prepared by an uncertified contractor
  - Ensure compliance with the lead disclosure requirements on behalf of the seller
key: D
explanation: The statute requires that whenever a seller or lessor has entered into a contract with
  an agent for the purpose of selling or leasing target housing, the agent must ensure compliance
  with the lead disclosure requirements on behalf of the seller or lessor (42 U.S.C. § 4852d(a)(4)).
  The distractors describe actions that are not required of the agent under the Act.
citation:
  source: 42 U.S.C. §§ 4851–4856 (Lead paint — Residential Lead-Based Paint Hazard Reduction Act) —
    Residential Lead-Based Paint Hazard Reduction Act (incl. § 4852d disclosure) § 4852d(a)(4)
  url: null
  quoted_text: Whenever a seller or lessor has entered into a contract with an agent for the purpose
    of selling or leasing a unit of target housing, the regulations promulgated under this section
    shall require the agent, on behalf of the seller or lessor, to ensure compliance with the
    requirements of this section.
