stem: A borrower maintains his own flood insurance policy, and the lender also purchases flood
  insurance for the same loan, resulting in overlapping coverage periods. According to 42 U.S.C. §
  4012a(B), what must the lender do regarding the premiums paid by the borrower for the
  lender‑purchased insurance during the overlap?
options:
  - The lender must retain the premiums and any related fees for the overlapping period.
  - The lender must waive the premiums and any related fees for the overlapping period.
  - The lender must refund the premiums and any related fees for the overlapping period.
  - The lender must apply the premiums and any related fees for the overlapping period.
key: C
explanation: Subsection (B) requires the lender to refund to the borrower all premiums paid by the
  borrower for any insurance purchased by the lender during any period of overlapping coverage, plus
  any related fees. Therefore, refunding both premiums and fees is mandatory. Retaining premiums,
  applying them to future premiums, or merely notifying the borrower do not satisfy this obligation.
