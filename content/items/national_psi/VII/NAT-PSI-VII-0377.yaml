stem: A licensee is asked whether an abandoned underground storage tank that once held hazardous
  solvents qualifies as a 'facility' under CERCLA. Which statement is correct?
options:
  - No, because only buildings and structures are considered facilities
  - No, unless the tank is currently leaking hazardous substances
  - Yes, if the tank is a site where a hazardous substance has been stored
  - Yes, because any motor vehicle is automatically a facility
key: C
explanation: The definition of facility includes any site where a hazardous substance has been
  deposited, stored, disposed of, or placed (see § 9601(9)(B)). Thus, an underground storage tank
  that held hazardous solvents qualifies as a facility. The distractor that only buildings and
  structures are facilities misstates the broad definition.
