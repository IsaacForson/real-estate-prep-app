stem: According to CERCLA, which of the following is included in the definition of 'release'?
options:
  - Release of source material from a nuclear incident.
  - Spilling of a hazardous substance onto the soil.
  - Normal application of fertilizer to a residential lawn.
  - Emissions from the engine exhaust of a motor vehicle.
key: B
explanation: Under CERCLA, the term 'release' includes spilling, leaking, pumping, pouring,
  emitting, emptying, discharging, injecting, escaping, leaching, dumping, or disposing into the
  environment. Therefore, spilling of a hazardous substance onto the soil qualifies as a release.
  Emissions from engine exhaust, normal fertilizer application, and nuclear material releases
  subject to NRC financial protection are explicitly excluded from the definition.
citation:
  source: 42 U.S.C. §§ 9601–9628 (CERCLA) — CERCLA — Hazardous Substances Releases, Liability,
