stem: A regulated lending institution purchases flood insurance on behalf of a borrower for a loan
  that requires flood insurance. According to 42 U.S.C. § 4012a(f)(6), how is the lender treated
  with respect to compliance with the regulations issued under subsection (b)?
options:
  - The lender is exempt from any penalty under subsection (f) regardless of compliance.
  - The lender is considered to have complied with the regulations issued under subsection (b).
  - The lender is considered to have violated the regulations issued under subsection (b).
  - The lender must obtain a separate waiver to be considered compliant.
key: B
explanation: Subsection (f)(6) provides that a regulated lending institution that purchases flood
  insurance on behalf of a borrower shall be considered to have complied with the regulations issued
  under subsection (b). Thus, the lender is deemed compliant. The option stating violation
  contradicts the explicit language, the waiver option adds a requirement not present, and the
  exemption option misstates the rule.
citation:
  source: 42 U.S.C. § 4012a(f)(6)
  url: null
  quoted_text: Notwithstanding any State or local law, for purposes of this subsection, any regulated
    lending institution that purchases flood insurance or renews a contract for flood insurance on
    behalf of or as an agent of a borrower of a loan for which flood insurance is required shall be
    considered to have complied with the regulations issued under subsection (b).
