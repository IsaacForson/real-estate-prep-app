stem: A buyer has signed a purchase agreement for a home built in 1972 and wishes to check for
  lead-based paint hazards. According to the Residential Lead-Based Paint Hazard Reduction Act, how
  many days does the buyer have to conduct a risk assessment or inspection before becoming obligated
  under the contract?
options:
  - Fifteen days, unless the parties agree otherwise
  - Thirty days, unless the parties agree otherwise
  - Ten days, unless the parties agree otherwise
  - Five days, unless the parties agree otherwise
key: C
explanation: The statute requires the seller to permit the purchaser a 10-day period to conduct a
  risk assessment or inspection, unless the parties mutually agree on a different period (42 U.S.C.
  § 4852d(a)(1)(C)). The distractors propose other time periods not supported by the text.
