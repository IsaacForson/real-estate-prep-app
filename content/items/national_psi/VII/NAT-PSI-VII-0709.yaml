stem: A company maintains records of hazardous substance storage at a facility established on March
  1, 1990. Assuming no waiver is obtained, until what date must the records be retained under
  CERCLA?
options:
  - March 1, 2040
  - December 11, 2040
  - December 11, 2030
  - March 1, 2030
key: A
explanation: Under CERCLA, records must be kept for fifty years after December 11, 1980 or fifty
  years after the date of establishment of the record, whichever is later. The facility was
  established March 1, 1990, so the later date is March 1, 2040. The December 11, 2030 distractor
  uses only the fixed 1980 start date and ignores the later establishment date.
