stem: The Secretary of Housing and Urban Development must transmit a biennial report to Congress
  every 24 months, beginning 24 months after October 28, 1992. On what date is the first biennial
  report due?
options:
  - October 28, 1995.
  - October 28, 1994.
  - November 28, 1994.
  - October 28, 1993.
key: B
explanation: The key is correct because adding 24 months to the start date of October 28, 1992
  yields October 28, 1994, as required by §4856(b)(1). The distractor of October 28, 1993 is wrong;
  it reflects only a 12‑month interval, not the 24‑month biennial period.
