stem: Under CERCLA § 9607(a), which of the following costs may a liable party be required to pay?
options:
  - Attorney fees incurred in defending against the claim in court of law.
  - Lost profits of businesses near the release site due to contamination.
  - Diminution in property value due to stigma from environmental concerns.
  - Costs of removal or remedial action incurred by the United States Government.
key: D
explanation: The statute makes a liable party responsible for all costs of removal or remedial
  action incurred by the United States Government, a State, or an Indian tribe. Attorney fees, lost
  profits, and stigma‑based diminution are not listed as recoverable costs under subsection (a).
