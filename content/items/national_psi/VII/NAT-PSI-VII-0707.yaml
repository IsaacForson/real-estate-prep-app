stem: Under CERCLA, what is the maximum fine for knowingly failing to notify the EPA of the
  existence of a hazardous substance facility as required under subsection (c)?
options:
  - $20,000
  - $15,000
  - $10,000
  - $5,000
key: C
explanation: The statute states that a person who knowingly fails to notify the Administrator of the
  existence of a facility shall be fined not more than $10,000, imprisoned not more than one year,
  or both. Therefore the maximum fine is $10,000. The $5,000 distractor understates the statutory
  limit.
