stem: Which of the following best describes a latent defect?
options:
  - A defect hidden and not discoverable by a reasonably diligent inspection
  - A defect that would be discovered by a reasonably diligent inspection
  - A defect that only appears after major renovations
  - A defect visible during a casual walk-through
key: A
explanation: A latent defect is a hidden problem that would not be found by a reasonably diligent
  inspection, such as a crack in a foundation behind finished walls, a buried oil tank, or a roof
  that leaks only during wind‑driven rain. The option describing a defect hidden and not
  discoverable by a reasonably diligent inspection matches this definition. The option describing a
  defect visible during a casual walk‑through describes a patent defect, which is the opposite of a
  latent defect.
