explanation: Under CERCLA, removal encompasses the cleanup or removal of released hazardous
  substances and the disposal of removed material (see 42 U.S.C. § 9601(23)). Remedial action refers
  to permanent remedy measures such as storage, confinement, or treatment, which go beyond simple
  removal.
