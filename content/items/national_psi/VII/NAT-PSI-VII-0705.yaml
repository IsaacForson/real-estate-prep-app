stem: A licensee learns from the seller that the roof leaks during heavy rain, but the seller says
  not to mention it. What must the licensee do?
options:
  - The licensee must disclose the defect to any party because it is a known material latent defect
  - The licensee may honor the seller's request and keep the defect confidential
  - The licensee should advise the seller to fix the roof before listing
  - The licensee may wait until after closing to inform the buyer
key: A
explanation: The licensee's duty includes disclosing known material latent defects to any party, and
  a seller's instruction to keep a defect confidential does not override this duty. Therefore the
  licensee must disclose the roof leak despite the seller's request. The distractor suggesting the
  licensee may honor the seller's request incorrectly implies confidentiality overrides the
  disclosure duty.
