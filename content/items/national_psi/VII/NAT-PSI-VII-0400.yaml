stem: Which of the following is a stated purpose of the Residential Lead-Based Paint Hazard
  Reduction Act as outlined in 42 U.S.C. §§ 4851–4856?
options:
  - Develop improved methods for evaluating lead-based paint hazards in housing.
  - Mandate annual lead inspections for all rental properties.
  - Establish federal licensing requirements for real estate brokers.
  - Provide tax credits for homeowners who remove lead paint.
key: A
explanation: The key is correct because §4852(1) of the Act lists developing improved methods for
  evaluating lead-based paint hazards in housing as a purpose. The distractor about federal
  licensing requirements for brokers is incorrect; the Act does not establish broker licensing
  requirements.
