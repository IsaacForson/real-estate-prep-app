stem: "Under the Residential Lead-Based Paint Hazard Reduction Act, before a purchaser becomes
  obligated under a contract to purchase target housing, the seller must:"
options:
  - Obtain a lead abatement certification from an accredited provider
  - Provide the purchaser with a lead hazard information pamphlet
  - Provide a warranty against lead presence for the property
  - Pay for a lead inspection conducted by a certified inspector
key: B
explanation: The statute requires the seller to provide the purchaser with a lead hazard information
  pamphlet before the purchaser is obligated under any contract (42 U.S.C. § 4852d(a)(1)(A)). The
  distractors describe actions not mandated by the Act, such as obtaining abatement certification or
  paying for an inspection.
