stem: According to CERCLA § 9601(7), how would a spring that supplies water to a municipal water
  treatment plant be classified?
options:
  - It is considered a drinking water supply because it may be used by a public water system
  - It is not considered a drinking water supply because it is not finished water
  - It is considered a drinking water supply only if it serves individual households
  - It is not considered a drinking water supply because it is raw water only
key: A
explanation: The definition of drinking water supply in CERCLA § 9601(7) includes any raw or
  finished water source that is or may be used by a public water system. A spring feeding a
  municipal treatment plant meets this criterion, so it is a drinking water supply.
citation:
  source: 42 U.S.C. §§ 9601–9628 (CERCLA) — CERCLA — Hazardous Substances Releases, Liability,
