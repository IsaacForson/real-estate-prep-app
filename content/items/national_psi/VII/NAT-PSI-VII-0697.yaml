stem: What must a licensee do before the buyer becomes bound under a contract?
options:
  - Recommend obtaining a home warranty inspection
  - Provide a verbal summary of known material facts
  - Disclose every known material fact in writing
  - Obtain a signed acknowledgment for any declined inspections
key: C
explanation: The rule requires that a licensee disclose every known material fact in writing before
  the buyer becomes bound under a contract. The correct option states this requirement. The option
  suggesting only a verbal summary does not satisfy the written disclosure requirement. The option
  about obtaining an acknowledgment for declined inspections is a separate risk‑management step. The
  option recommending a home warranty inspection is unrelated to the disclosure obligation.
