stem: On January 10, an owner notifies the EPA that all conditions for liability transfer under
  CERCLA subsection (l) have been satisfied. The EPA takes no action during the following ninety
  days. Assuming no state program is involved, when does the transfer of liability become effective?
options:
  - Effective April 10
  - Effective March 31
  - Effective May 10
  - Effective January 10
key: A
explanation: Under CERCLA § 9607(l)(2), liability transfer becomes effective ninety days after the
  owner notifies the EPA that conditions are satisfied, provided the EPA does not object within that
  period. Counting ninety days from January 10 yields April 10. The distractors result from
  miscalculating the ninety‑day period.
