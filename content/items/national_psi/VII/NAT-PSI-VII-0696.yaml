stem: A homeowner has a 900-gallon underground tank storing heating oil used only for the house
  furnace. Under federal regulation, is this tank exempt from UST requirements?
options:
  - Yes, because it stores heating oil for use on the premises
  - No, because all underground storage tanks must be registered
  - Yes, because it holds less than 1,100 gallons
  - No, because heating oil is considered a hazardous substance
key: A
explanation: Federal regulations exempt underground storage tanks that store heating oil for use on
  the premises from UST requirements. The size‑based exemption for tanks holding 1,100 gallons or
  less applies only to motor‑fuel tanks used noncommercially, not to heating‑oil tanks.
