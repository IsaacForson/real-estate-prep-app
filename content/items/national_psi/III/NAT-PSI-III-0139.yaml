stem: A property has a potential gross income of $150,000 per year, vacancy and collection loss of
  5% of PGI, other income of $3,000, and operating expenses of $45,000. What is the net operating
  income (NOI)?
options:
  - $108,000
  - $100,500
  - $93,000
  - $115,500
key: B
explanation: "First calculate EGI: $150,000 − 5% of $150,000 ($7,500) + $3,000 = $145,500. Then NOI
  = EGI − operating expenses: $145,500 − $45,000 = $100,500. The distractor $108,000 results from
  omitting the other income before subtracting expenses."
citation:
  source: REP Ref. Valuation & Appraisal § 12.1
  url: null
  quoted_text: EGI = PGI − vacancy and collection loss + other income; NOI = EGI − operating expenses
    (excluding debt service, depreciation, income taxes, capital improvements).
