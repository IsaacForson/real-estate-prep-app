stem: A lender has received an appraisal from a fee appraiser for a federally related transaction.
  According to federal appraisal independence rules, what must the lender do concerning payment?
options:
  - Pay after the loan closes and funding is complete
  - Pay a fee that is a percentage of the appraised value
  - Pay a fee only if the appraisal meets the contract price
  - Pay customary and reasonable compensation
key: D
explanation: Lenders must pay fee appraisers customary and reasonable compensation and must report
  appraisers who materially violate applicable standards to the state licensing agency.
