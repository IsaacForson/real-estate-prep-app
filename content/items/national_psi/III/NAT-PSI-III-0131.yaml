stem: A licensee is preparing a CMA and has a comparable property that has a superior feature (an
  extra bedroom) compared to the subject property. According to the adjustment direction rule, what
  adjustment should be made to the comparable's sale price?
options:
  - No adjustment should be made to the comparable's price; the subject's price remains unchanged.
  - The comparable's price should be used as the subject's value without any adjustment.
  - The value of the extra bedroom should be subtracted from the comparable's price.
  - The value of the extra bedroom should be added to the comparable's price.
key: C
explanation: The rule states that for a comparable superior to the subject, the analyst subtracts
  the value of the superior feature from the comparable's price. The most tempting distractor is to
  add the value, which would be appropriate only if the comparable were inferior.
citation:
  source: REP Ref. Valuation & Appraisal § 12.1
  url: null
  quoted_text: "- Adjustment direction: comparable superior, subtract; comparable inferior, add; never
    adjust the subject."
