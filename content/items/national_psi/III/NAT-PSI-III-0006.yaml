stem: When an appraiser analyzes the highest and best use of a site, which of the four tests is
  applied first?
options:
  - Financially feasible
  - Legally permissible
  - Maximally productive
  - Physically possible
key: B
explanation: Highest and best use must be legally permissible, physically possible, financially
  feasible, and maximally productive, and the tests are applied in that order. A use that fails an
  earlier test is dropped and not carried forward, so legal permissibility under zoning, private
  restrictions, and environmental law is examined before the physical, financial, and productivity
  tests.
