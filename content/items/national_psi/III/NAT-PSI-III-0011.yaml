stem: A lender orders an appraisal of a house that is rented under a two-year lease at a rent below
  market. Which interest is being appraised, and how does its value compare with the fee simple
  value?
options:
  - Leasehold; above fee simple value
  - Fee simple; equal to leased fee value
  - Leased fee; below fee simple value
  - Leased fee; above fee simple value
key: C
explanation: When a lease is in place, the owner's interest is the leased fee, which reflects
  contract rents and the reversion at lease end. Because contract rent is below market, the leased
  fee is worth less than the fee simple, while the tenant's leasehold has positive value. Fee simple
  value assumes no leases, so it is not the interest a lender appraises on a rented house.
