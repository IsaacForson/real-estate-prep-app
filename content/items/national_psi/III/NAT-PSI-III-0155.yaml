stem: A parcel is zoned for agricultural use, but the owner wants to build a factory. According to
  the highest and best use tests, which test would cause the industrial use to be eliminated?
options:
  - The legally permissible test
  - The physically possible test
  - The financially feasible test
  - The maximally productive test
key: A
explanation: The highest and best use analysis applies tests in order, beginning with legally
  permissible use under zoning. Since the parcel is zoned for agricultural use, a factory is not
  legally permissible, so the industrial use fails the first test. The physically possible test is
  not the cause because the scenario does not mention any physical limitations.
citation:
  source: REP Ref. Valuation & Appraisal § 4.1
  url: null
  quoted_text: "The four tests are applied in that order: (1) legally permissible under zoning,
    private restrictions, and environmental law; (2) physically possible given size, shape, soil,
    topography, and access; (3) financially feasible, producing a positive return; (4) maximally
    productive, yielding the highest land value among feasible uses."
