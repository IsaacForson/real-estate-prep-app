  - Progression
  - Conformity
  - Anticipation
key: B
explanation: Progression is the principle whereby an inferior property’s value is increased by being
  surrounded by superior properties, which matches the option stating 'Progression'. Regression
  describes the opposite effect, where a superior property’s value is reduced by inferior neighbors.
  Anticipation concerns value based on expected future benefits, and conformity holds that value is
  maximized when properties are similar in character and use.
