stem: A licensee prepares a CMA for a seller and includes a statement that the CMA is an appraisal
  to help secure the listing. According to the text, what is the licensee's obligation regarding
  this statement?
options:
  - Remove or correct the statement so the CMA is not described as an appraisal.
  - Leave the statement unchanged because it helps the seller understand the property's market value.
  - Add a detailed note asserting the CMA satisfies appraisal requirements.
  - Request a supervising broker’s written approval to keep the statement.
key: A
explanation: A CMA is not an appraisal and must not be represented as one; therefore the licensee
  must remove or correct any statement that calls the CMA an appraisal. Leaving the statement
  unchanged violates this rule, and adding notes or seeking broker approval does not change the
  prohibited representation.
