stem: A creditor receives an application for a first-lien loan secured by a dwelling on May 1.
  According to Regulation B, within how many business days of application must the creditor notify
  the applicant of the right to receive a copy of the appraisal?
options:
  - 1 business day
  - 3 business days
  - 5 business days
  - 7 business days
key: B
explanation: Regulation B mandates that the creditor notify the applicant of the right to receive a
  copy of the appraisal within three business days of the application.
citation:
  source: REP Ref. Valuation & Appraisal § 6.4
  url: null
  quoted_text: Separately, the ECOA valuation rule (Regulation B) requires a creditor to give an
    applicant a copy of any appraisal or written valuation developed for a first-lien loan secured
    by a dwelling promptly upon completion or three business days before consummation, whichever is
    earlier, and to notify the applicant of that right within three business days of application.
