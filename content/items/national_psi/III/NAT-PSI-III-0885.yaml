stem: A creditor completes an appraisal for a first-lien loan secured by a dwelling on April 5 and
  plans to consummate the loan on April 18. According to Regulation B, by what date must the
  creditor provide the applicant with a copy of the appraisal?
options:
  - April 5
  - April 9
  - April 12
  - April 18
key: A
explanation: The creditor must provide the copy by the earlier of the completion date or three
  business days before consummation; April 5 is earlier than three business days before April 18
  (April 9).
citation:
  source: REP Ref. Valuation & Appraisal § 6.4
  url: null
  quoted_text: Separately, the ECOA valuation rule (Regulation B) requires a creditor to give an
    applicant a copy of any appraisal or written valuation developed for a first-lien loan secured
    by a dwelling promptly upon completion or three business days before consummation, whichever is
    earlier, and to notify the applicant of that right within three business days of application.
