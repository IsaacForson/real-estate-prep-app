stem: A building has a replacement cost new of $600,000. The appraiser estimates an effective age of
  15 years and a total economic life of 60 years. Using the straight-line (economic age-life)
  method, what is the accrued depreciation?
options:
  - $200,000
  - $50,000
  - $150,000
  - $100,000
key: C
explanation: Accrued depreciation equals (effective age ÷ total economic life) × cost new per the
  straight-line method. (15 ÷ 60) × $600,000 = 0.25 × $600,000 = $150,000. The distractors result
  from common errors such as using only the effective age, misapplying the fraction, or using the
  total economic life incorrectly.
citation:
  source: REP Ref. Valuation & Appraisal § 8.5
  url: null
  quoted_text: Accrued depreciation = (effective age ÷ total economic life) × cost new; equivalently,
    annual depreciation = cost new ÷ total economic life.
  secondary: []
math:
  worked_solution: Effective age = 15 years; total economic life = 60 years; fraction = 15/60 = 0.25;
    multiply by $600,000 = $150,000.
  formulas:
    - Accrued depreciation = (effective age / total economic life) × cost new
