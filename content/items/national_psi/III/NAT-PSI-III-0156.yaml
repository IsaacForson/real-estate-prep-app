stem: A neighborhood sees a surge in short-term rental profits, leading to many new properties being
  converted to short-term rentals. Over time, the average profit per property declines. Which
  principle explains this?
options:
  - The principle of substitution
  - The principle of competition
  - The principle of anticipation
  - The principle of conformity
key: B
explanation: The principle of competition holds that excess profits attract competitors, leading to
  increased supply that returns profits to a normal level. In this scenario, the initial surge in
  short-term rental profits prompted new entrants, which subsequently reduced average profits. The
  principle of substitution is incorrect because it concerns a buyer's willingness to pay based on
  substitute costs, not market entry driven by profits.
citation:
