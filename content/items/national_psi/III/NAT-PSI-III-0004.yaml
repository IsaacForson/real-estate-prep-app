stem: In the definition of market value used by the federal banking agencies, how is the value described?
options:
  - The highest price a motivated buyer would agree to pay
  - The price a seller under time pressure would accept
  - The average of the three most recent comparable sales
  - The most probable price in a competitive and open market
key: D
explanation: Market value is the most probable price a property should bring in a competitive and
  open market under conditions requisite to a fair sale, with both parties acting prudently and
  knowledgeably and without undue stimulus. Candidates often substitute "highest price," which is
  wrong; averaging sales is not the definition, and a seller under pressure violates the typically
  motivated condition.
