stem: A federally regulated bank is making a purchase loan on a house. The transaction value exceeds
  the residential appraisal exemption threshold but is well below the level at which a certified
  appraiser becomes mandatory. What must the bank obtain?
options:
  - A broker price opinion from the listing brokerage
  - An appraisal by a state-licensed or state-certified appraiser
  - An appraisal by a state-certified general appraiser only
  - A written evaluation that need not be done by an appraiser
key: B
explanation: For a federally related transaction above the exemption threshold, the lender must
  obtain an appraisal from a state-licensed or state-certified appraiser. A written evaluation
  suffices only at or below the threshold; a state-certified appraiser is mandatory only for larger,
  complex, or nonresidential transactions; and federal law bars using a broker price opinion as the
  primary basis for value when originating a residential mortgage on a principal dwelling.
