stem: A parcel is zoned so that no practical use is allowed and has no legal access from any road.
  Which characteristic of value does this parcel chiefly lack?
options:
  - Scarcity
  - Transferability
  - Utility
  - Demand
key: C
explanation: Utility is the ability to satisfy a need or want. A landlocked parcel with no legal
  access, or land zoned so that no practical use is permitted, has little utility and therefore
  little value even if it is scarce and freely transferable. Scarcity concerns limited supply,
  transferability concerns the ability to convey title, and demand is desire coupled with purchasing
  power.
