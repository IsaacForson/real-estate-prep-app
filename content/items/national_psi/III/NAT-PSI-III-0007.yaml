stem: A much larger custom-built home sits among modest tract houses. Which principle explains why
  its value is pulled below what its size and cost would suggest?
options:
  - Progression
  - Anticipation
  - Regression
  - Competition
key: C
explanation: Regression holds that the value of a superior property is pulled down by the inferior
  properties around it; the largest house on the block suffers regression. Progression is the
  opposite effect on an inferior property among superior neighbors. Anticipation concerns expected
  future benefits, and competition concerns excess profits attracting new supply.
