stem: A listing agent wants to assist the appraiser on a pending sale. Which action is permitted
  under appraisal independence rules?
options:
  - Emailing three recent comparable sales and a list of the seller's upgrades
  - Offering a bonus payable once the report supports the sale price
  - Mentioning that future assignments depend on reaching the contract price
  - Telling the appraiser the minimum value needed for the loan to close
key: A
explanation: Appraisal independence rules bar anyone with an interest in the transaction from
  coercing, bribing, or attempting to influence the appraiser's opinion of value. A licensee may
  supply comparable sales and point out property features, but may not name the number needed,
  threaten to steer future business, or condition payment on hitting the contract price.
