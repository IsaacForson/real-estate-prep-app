stem: An appraisal for a federally related loan comes in at $425,000 on a $436,000 purchase
  contract. What must the lender do under Regulation B according to the text?
options:
  - The lender must provide the borrower with a copy of the appraisal
  - The lender must cancel the loan application immediately
  - The lender must require the borrower to obtain a second appraisal
  - The lender must increase the loan amount to match the appraised value
key: A
explanation: Under Regulation B, when an appraisal for a federally related loan comes in below the
  purchase price, the lender must provide the borrower with a copy of the appraisal. The parties may
  then renegotiate, increase the down payment, or rely on an appraisal contingency if the contract
  includes one.
