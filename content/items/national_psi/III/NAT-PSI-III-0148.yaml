stem: A property has a market value of $480,000. The jurisdiction assesses property at 55 percent of
  market value. What is the assessed value?
options:
  - $264,000
  - $216,000
  - $744,000
  - $872,727
key: A
explanation: The assessed value is found by multiplying the market value by the assessment ratio
  expressed as a decimal. Here, 55 percent becomes 0.55, and $480,000 × 0.55 equals $264,000. One
  incorrect option results from using 45 percent instead of 55 percent, which yields a lower value.
citation:
