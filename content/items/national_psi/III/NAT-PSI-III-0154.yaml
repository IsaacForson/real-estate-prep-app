stem: According to the principle of substitution, what will a prudent buyer pay for a property?
options:
  - The cost of acquiring an equally desirable substitute
  - The highest price the market will bear
  - The price paid for a comparable property last year
  - The amount the seller originally paid for the property
key: A
explanation: The principle of substitution states that a prudent buyer will pay no more for a
  property than the cost of acquiring an equally desirable substitute. Therefore, the correct answer
  is the cost of acquiring an equally desirable substitute. The distractor about the highest price
  the market will bear is incorrect because substitution limits the buyer's payment to the
  substitute's cost, not the market's highest price.
