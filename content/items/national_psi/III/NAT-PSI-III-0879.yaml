stem: According to federal appraisal independence rules, which action by a loan officer is prohibited?
options:
  - Asking the appraiser to confirm the effective date of the appraisal
  - Providing the appraiser with three recent comparable sales and a list of the seller's upgrades
  - Stating that the loan will not be approved unless the appraisal meets or exceeds the contract
    price
  - Emailing the appraiser a request for the appraisal to be completed within 48 hours
key: C
explanation: Stating that loan approval depends on the appraisal meeting or exceeding the contract
  price is an attempt to influence the appraised value, which is prohibited under federal appraisal
  independence rules. Providing the appraiser with recent comparable sales and a list of the
  seller's upgrades is permitted.
citation:
