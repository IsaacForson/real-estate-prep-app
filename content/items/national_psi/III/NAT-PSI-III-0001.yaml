stem: Which statement correctly distinguishes value from price in appraisal terminology?
options:
  - Value is an opinion as of a date; price is the sum actually paid
  - Value is the sum spent to create improvements; price is an estimate
  - Value and price become the same figure once a sale has closed
  - Value is a historical fact; price is an opinion of future benefits
key: A
explanation: Value is the present worth of future benefits and is an opinion stated as of a specific
  date, while price is the amount actually paid in a completed transaction, a historical fact. Cost,
  not value, describes the amount spent to create improvements. Value and price often diverge even
  after a sale closes, because a party may have been under pressure, poorly informed, or receiving
  unusual financing.
citation:
  source: REP Ref. Valuation & Appraisal § 1.1
  url: null
  quoted_text: Value is the present worth of the future benefits ownership is expected to deliver; it
    is an opinion, always stated as of a specific date. Price is the amount actually paid in a
    completed transaction; it is a historical fact.
