stem: A federally regulated bank is making a purchase loan on a house priced at $350,000. What must
  the bank obtain?
options:
  - a written evaluation
  - no valuation required
  - a broker price opinion
  - a full appraisal report
key: A
explanation: Because the $350,000 transaction is at or below the $400,000 residential exemption
  threshold, the bank must obtain a written evaluation, which does not need to be performed by a
  licensed appraiser. A full appraisal by a state‑licensed appraiser is not required for exempt
  transactions. The other options either over‑require or under‑require the necessary work.
