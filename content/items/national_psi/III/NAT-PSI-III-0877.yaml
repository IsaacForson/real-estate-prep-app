stem: A licensee prepares a valuation for a seller to help set a listing price. The licensee does
  not charge a fee and does not inspect the interior. Which valuation product best matches this
  description?
options:
  - The CMA valuation method
  - The appraisal valuation method
  - The AVM valuation method
  - The BPO valuation method
key: A
explanation: A CMA is prepared by a real estate licensee to help set a listing or offer price; it
  usually involves only an exterior or walk‑through inspection and is typically provided without a
  fee. This matches the scenario. An appraisal generally requires both interior and exterior
  inspection and a fee, which does not fit.
