stem: A licensee prepares a CMA for a seller and the buyer's lender requests a valuation for loan
  underwriting. According to the text, what must the licensee disclose to the lender about the CMA?
options:
  - The licensee must disclose to the lender that the CMA meets USPAP standards.
  - The licensee must disclose to the lender that the CMA includes an interior inspection.
  - The licensee must disclose to the lender that the CMA is not an appraisal.
  - The licensee must disclose to the lender that the CMA is prepared by a certified appraiser.
key: C
explanation: The licensee must disclose that a CMA is not an appraisal because only an appraisal
  meets the lender's regulatory requirement for a valuation. The option stating that the CMA meets
  USPAP standards is incorrect because a CMA does not satisfy USPAP standards. The option stating
  that the CMA includes an interior inspection is incorrect because a CMA may or may not include an
  interior inspection and is not required to do so. The option stating that the CMA is prepared by a
  certified appraiser is incorrect because a licensee may prepare a CMA without being a certified
  appraiser.
