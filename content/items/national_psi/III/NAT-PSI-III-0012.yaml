stem: What did Title XI of FIRREA require with respect to appraiser licensing?
options:
  - The ASC must license and certify appraisers under federal rule
  - The Foundation must license and certify appraisers under AQB criteria
  - HUD must license and certify appraisers for residential transactions
  - Each state must license and certify appraisers under its own law
key: D
explanation: "FIRREA created a two-layer system: the Appraisal Subcommittee oversees state programs
  and The Appraisal Foundation's boards set minimum criteria and write USPAP, but each state
  licenses, certifies, and disciplines appraisers under its own law meeting or exceeding the AQB
  minimums. FIRREA did not create a federal license; it required the states to create them."
