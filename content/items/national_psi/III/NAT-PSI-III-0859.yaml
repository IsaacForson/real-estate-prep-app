explanation: The AQB criteria state that a licensed residential appraiser may handle complex
  one-to-four-unit residential properties only when the transaction value is below $400,000. The
  $1,000,000 limit applies to non‑complex properties, not complex ones. The other amounts are either
  the exemption thresholds or unrelated figures.
