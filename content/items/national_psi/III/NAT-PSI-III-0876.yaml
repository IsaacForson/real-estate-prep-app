math:
  worked_solution: Sum of individual lot values = $120,000 + $120,000 = $240,000; Plottage = Combined
    value − Sum of individual lot values = $280,000 − $240,000 = $40,000.
  formulas:
    - Plottage = Combined value − (Sum of individual lot values)
