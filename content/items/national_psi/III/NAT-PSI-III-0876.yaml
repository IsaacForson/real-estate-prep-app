stem: Two adjoining lots each valued at $120,000 are combined into a single parcel worth $280,000.
  What is the plottage value resulting from the assemblage?
options:
  - $40,000
  - $20,000
  - $60,000
  - $80,000
key: A
explanation: Plottage is the increase in value when combined parcels are worth more than the sum of
  their separate values. The sum of the two lots is $240,000, and the combined value is $280,000, so
  the plottage is $40,000.
citation:
  source: "REP Ref. Valuation & Appraisal — Reference note: value concepts, appraisal process, three
