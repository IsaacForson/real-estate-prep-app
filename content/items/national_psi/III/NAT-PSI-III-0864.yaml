stem: A licensee is preparing a CMA and has a comparable property that has a superior feature (an
  extra bathroom) compared to the subject property. According to the adjustment direction rule, what
  adjustment should be made to the comparable's sale price?
options:
  - Adjust by making no change to the comparable
  - Adjust by revising the subject property's price
  - Adjust by subtracting the superior feature's value
  - Adjust by adding the superior feature's value
key: C
explanation: The adjustment direction rule states that for a comparable with a superior feature, the
  value of that feature should be subtracted from the comparable's price. Adding the superior
  feature's value would incorrectly increase the comparable's price.
citation:
  source: REP Ref. Valuation & Appraisal § 12.1
  url: null
  quoted_text: "Adjustment direction: comparable superior, subtract; comparable inferior, add; never
    adjust the subject."
