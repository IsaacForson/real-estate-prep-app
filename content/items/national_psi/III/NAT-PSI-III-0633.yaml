stem: A property has a market value of $500,000 and an assessed value of $200,000. What is the
  assessment ratio?
options:
  - 25 percent
  - 40 percent
  - 60 percent
  - 80 percent
key: B
explanation: The assessment ratio is the assessed value expressed as a percentage of market value.
  Dividing $200,000 by $500,000 yields 0.40, or 40 percent. The other options represent incorrect
  ratios derived from miscalculating the fraction.
citation:
  source: "REP Ref. Valuation & Appraisal — Reference note: value concepts, appraisal process, three
