stem: What is the second test applied in the highest and best use analysis?
options:
  - The legally permissible test.
  - The maximally productive test.
  - The physically possible test.
  - The financially feasible test.
key: C
explanation: The second test in highest and best use analysis is the physically possible test, which
  evaluates whether the use can be physically accommodated on the site given its size, shape, soil,
  topography, and access. It follows the legally permissible test and precedes the financially
  feasible test.
