stem: Under federal law, what is the consequence of using a broker price opinion (BPO) as the
  primary basis for determining value when originating a residential mortgage secured by the
  consumer's principal dwelling?
options:
  - It is permitted if the licensee holds an appraiser license
  - It is allowed only with a written disclaimer to the borrower
  - It is subject to state licensing board approval only
  - It is prohibited under 12 U.S.C. § 3355
key: D
explanation: Federal law prohibits using a broker price opinion as the primary basis for determining
  value when originating a residential mortgage secured by the consumer's principal dwelling.
  Therefore, the answer indicating it is prohibited under 12 U.S.C. § 3355 is correct. The answer
  stating it is permitted if the licensee holds an appraiser license is incorrect because the
  prohibition applies regardless of the licensee's credentials.
