stem: Which statement about the fee an appraiser charges for an appraisal is correct?
options:
  - It is set by the state appraisal board
  - It may not be contingent on the value concluded
  - It is payable only if the loan closes
  - It may be a percentage of the final value estimate
key: B
explanation: An appraisal is an impartial opinion of value, so the appraiser's fee may not depend on
  the value concluded. A fee tied to a percentage of value or to whether the loan closes would give
  the appraiser a stake in the outcome and compromise impartiality. States license and discipline
  appraisers but do not fix the fee.
