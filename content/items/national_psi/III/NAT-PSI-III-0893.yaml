stem: A licensee is preparing to work with an appraiser on a federally related transaction. Which of
  the following actions by the licensee is prohibited under federal appraisal independence rules?
options:
  - Providing the appraiser with three recent comparable sales
  - Asking the appraiser to explain the valuation conclusion
  - Pointing out unique property features to the appraiser
  - Threatening to steer future business unless the appraisal meets a certain value
key: D
explanation: Licensees may provide comparable sales and point out property features, but they may
  not threaten to steer future business or otherwise influence the appraised value. Therefore
  threatening to steer future business is prohibited. Providing comparables and pointing out
  features are permitted.
