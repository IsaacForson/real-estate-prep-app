stem: Home prices near a proposed commuter rail station rise as soon as the project is announced,
  years before any track is laid. Which principle of value is at work?
options:
  - Anticipation
  - Substitution
  - Conformity
  - Contribution
key: A
explanation: Anticipation holds that value is created by the expectation of future benefits, such as
  improved access once the station opens; buyers pay today for benefits they expect tomorrow.
  Substitution compares prices of equally desirable alternatives, conformity concerns similarity to
  surrounding properties, and contribution measures what a component adds to the whole.
