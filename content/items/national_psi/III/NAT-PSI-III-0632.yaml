stem: A parcel is zoned for multi-family housing and is physically suitable, but the projected
  rental income would not cover construction costs and financing. According to the highest and best
  use tests, which test would cause the multi-family use to be eliminated?
options:
  - Financially feasible
  - Legally permissible
  - Physically possible
  - Maximally productive
key: A
explanation: The highest and best use analysis applies the financially feasible test third, which
  requires the use to produce a positive return. If projected rental income does not cover costs,
  the use fails this test and is eliminated. The legally permissible and physically possible tests
  are satisfied by the zoning and suitability, so they do not eliminate the use.
