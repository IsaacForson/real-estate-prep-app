stem: A buyer purchases a home for $350,000 and later spends $60,000 on a basement finish. An
  appraiser estimates the current market value at $390,000. How much did the basement finish
  contribute to value?
options:
  - $45,000
  - $50,000
  - $55,000
  - $40,000
key: D
explanation: "Contribution to value is the change in market value attributable to the improvement:
  $390,000 (current value) − $350,000 (original purchase price) = $40,000. The $60,000 cost is not
  the contribution; only the value added counts."
citation:
  source: "REP Ref. Valuation & Appraisal — Reference note: value concepts, appraisal process, three
    approaches, CMA/BPO (authored, status: draft — needs licensed review) § 1.3"
  url: null
  quoted_text: The remodel contributed 448,000 − 410,000 = $38,000 to value, not the $45,000 it cost.
