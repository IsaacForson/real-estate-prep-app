stem: A loan officer sends a text message to the appraiser stating, 'We need the appraisal to be at
  least the contract price or we will withdraw the loan commitment.' Under federal appraisal
  independence rules, how should this message be classified, **not** considering any exemptions?
options:
  - It is an acceptable follow‑up after receiving the appraisal report
  - It is a permissible way to convey loan conditions to the appraiser
  - It is a required notice under the Truth in Lending Act
  - It is a prohibited attempt to influence the appraiser's value opinion
key: D
explanation: Under appraisal independence rules, a loan officer cannot condition loan approval on
  achieving a particular appraisal value; such a statement is a prohibited attempt to influence the
  appraiser's opinion of value.
