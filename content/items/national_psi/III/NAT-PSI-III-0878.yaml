stem: Under the ECOA valuation rule (Regulation B), what must a creditor do with respect to an
  appraisal or written valuation developed for a first-lien loan secured by a dwelling?
options:
  - The creditor must give the applicant a copy of the appraisal only.
  - The creditor must notify the applicant of the right to receive a copy only.
  - The creditor must give the applicant a copy of the appraisal and notify the applicant of that
    right.
  - The creditor must provide the appraisal to the lender's underwriting department only.
key: C
explanation: Regulation B requires the creditor both to give the applicant a copy of the appraisal
  and to notify the applicant of that right.
