  source: REP Ref. Valuation & Appraisal § 6.4
  url: null
  quoted_text: Separately, the ECOA valuation rule (Regulation B) requires a creditor to give an
    applicant a copy of any appraisal or written valuation developed for a first-lien loan secured
    by a dwelling promptly upon completion or three business days before consummation, whichever is
    earlier, and to notify the applicant of that right within three business days of application.
