stem: A comparable property sold for $350,000 and has a pool, which the subject lacks. If the
  market-derived adjustment for a pool is $12,000, what is the adjusted price of the comparable?
options:
  - $338,000
  - $350,000
  - $344,000
  - $362,000
key: A
explanation: Because the comparable has a feature the subject lacks (pool), it is superior and its
  price must be adjusted downward by $12,000, yielding $338,000. The distractor $362,000 results
  from incorrectly adding the adjustment instead of subtracting it.
citation:
  source: REP Ref. Valuation & Appraisal § 7.3
  url: null
  quoted_text: If a comparable has a feature the subject lacks (comparable superior), its price is
    adjusted downward;
  secondary: []
math:
  worked_solution: >-
    Start with comparable sale price: $350,000

    Since the comparable has a pool the subject lacks, it is superior; subtract the pool adjustment:
    $350,000 - $12,000 = $338,000
  formulas:
    - Adjusted price = Sale price - Adjustment (for superior feature)
