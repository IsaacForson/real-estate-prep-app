stem: A federally regulated bank is making a commercial real estate loan valued at $480,000.
  According to the federal appraisal threshold rules, what must the bank obtain?
options:
  - State-licensed appraisal
  - State-certified appraisal
  - Written evaluation only
  - No evaluation required
key: C
explanation: For federally regulated banks, a commercial real estate loan of $500,000 or less
  requires only a written evaluation, which does not need to be performed by a licensed appraiser.
  Since the loan amount is $480,000, which is below that threshold, the bank must obtain a written
  evaluation only.
