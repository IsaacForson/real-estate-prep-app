math:
  worked_solution: |-
    Step 1: Identify the federal appraisal threshold for commercial real estate loans: $500,000.
    Step 2: Compare the loan amount of $480,000 to the threshold.
    Step 3: Since $480,000 is less than $500,000, the loan falls below the threshold.
    Step 4: Apply the rule: loans at or below the threshold require a written evaluation only.
    Conclusion: The bank must obtain a written evaluation only.
