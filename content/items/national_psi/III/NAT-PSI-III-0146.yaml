stem: A building has cost new of $500,000, effective age of 10 years, and total economic life of 50
  years. Using the straight-line method, what is the accrued depreciation percentage?
options:
  - 10%
  - 25%
  - 20%
  - 15%
key: C
explanation: Accrued depreciation percentage equals effective age divided by total economic life (10
  ÷ 50 = 0.20 or 20%). The distractor 25% would result from mistakenly using 10 ÷ 40.
citation:
  source: REP Ref. Valuation & Appraisal § 8.5
  url: null
  quoted_text: Accrued depreciation = (effective age ÷ total economic life) × cost new;
  secondary: []
