stem: A property owner and a broker agree that the manager will receive a flat fee of $150 per month
  plus 4% of the gross collected rent. If the monthly rent collected from tenants is $5,000, what is
  the manager's total monthly compensation?
options:
  - $150
  - $350
  - $200
  - $400
key: B
explanation: Under § 4.1, compensation can be a flat fee plus a percentage of collected rent. The
  percentage portion is 4% of $5,000 = $200, and adding the flat fee of $150 yields $350. The
  distractor '$200' omits the flat fee, a common error when calculating compensation that includes
  both a flat fee and a percentage.
citation:
  source: REP Ref. Brokerage Practice § 4.1 Forms of compensation
  url: null
  quoted_text: "Brokerage compensation is whatever the client and broker agree to: a percentage of the
    sale price (most common for sales), a flat fee, an hourly fee, a percentage of collected rent
    (management), or a fee per lease."
  secondary: []
math:
  worked_solution: |-
    Percentage portion = 0.04 × $5,000 = $200
    Total compensation = $150 + $200 = $350
  formulas:
    - Compensation = flat fee + (rate × rent)
