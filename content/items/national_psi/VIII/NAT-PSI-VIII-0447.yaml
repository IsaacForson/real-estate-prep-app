stem: A property manager notices persistent water stains on the ceiling of a rental unit during a
  routine inspection. According to the text, what is the manager's appropriate action?
options:
  - Ignore the stains, considering them only cosmetic and not a safety concern
  - Tell the owner about the stains and recommend a professional inspection
  - Fix the ceiling themselves without telling the owner to avoid extra cost
  - Delay taking any action until the tenant complains about a ceiling issue
key: B
explanation: A licensee must not ignore red flags such as stains and should disclose them and
  recommend expert evaluation. Ignoring the stains is wrong because the rule prohibits ignoring any
  red flags, even if they appear merely cosmetic.
citation:
  source: REP Ref. Brokerage Practice § 11.3
  url: null
  quoted_text: A licensee is not an inspector or a title examiner, but must not ignore red flags —
    stains, cracks, odors, unpermitted additions — and should disclose them and recommend expert
    evaluation.
