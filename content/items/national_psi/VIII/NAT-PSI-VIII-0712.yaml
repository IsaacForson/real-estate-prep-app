math:
  worked_solution: |-
    Potential gross income = 12 × $900 × 12 = $129,600
    Vacancy and collection loss = 0.04 × $129,600 = $5,184
    Effective gross income = $129,600 − $5,184 + $3,000 = $127,416
    Net operating income = $127,416 − $55,000 = $72,416
  formulas:
