stem: A 12-unit apartment building rents for $900 per unit per month. Vacancy and collection loss is
  4%, other income is $3,000 per year, and operating expenses are $55,000 per year. What is the net
  operating income?
options:
  - $72,416
  - $68,232
  - $75,600
  - $70,000
key: A
explanation: "First calculate potential gross income: 12 units × $900 × 12 months = $129,600.
  Subtract vacancy and collection loss (4% of $129,600 = $5,184) and add other income ($3,000) to
  get effective gross income of $127,416. Subtract operating expenses ($55,000) yields net operating
  income of $72,416. The distractors result from common errors such as omitting other income,
  misapplying the vacancy percentage, or miscalculating potential gross income."
