stem: A tenant vacates after a one-year lease. The carpet shows wear from ordinary use and the walls
  have minor scuffs. According to the text, which of the following is true about the landlord’s
  right to deduct from the security deposit?
options:
  - The landlord may not deduct for either the carpet wear or the scuffs
  - The landlord may deduct for the carpet wear but not for the scuffs
  - The landlord may deduct for the scuffs but not for the carpet wear
  - The landlord may deduct for the carpet wear and the scuffs
key: A
explanation: Normal wear and tear — minor scuffs, faded paint, carpet worn by ordinary use — may not
  be charged against a deposit. The described carpet wear and wall scuffs are normal wear and tear,
  so the landlord may not deduct for either. The option stating that the landlord may not deduct for
  either the carpet wear or the scuffs correctly reflects the rule.
