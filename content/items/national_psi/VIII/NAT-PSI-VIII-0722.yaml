stem: An on-site employee of the owner performs leasing, rent collection, and maintenance
  coordination for the property without holding a broker's license. Is this permissible?
options:
  - Yes, because the text exempts on-site employees of the owner from the broker license requirement
    for property management
  - No, because property management requires a broker's license regardless of employment status
  - Yes, if the employee also holds a valid salesperson's license issued by the state
  - No, the employee must first obtain a property management license from the state regulatory agency
key: A
explanation: Under the federal law, property management is brokerage activity requiring a broker's
  license in most states, with limited exemptions for on-site employees of the owner. Therefore, the
  described conduct is permissible under that exemption. The other options contradict the law's
  exemption.
