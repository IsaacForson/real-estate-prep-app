stem: A property manager receives a cash payment from a maintenance contractor for directing repair
  work to them without informing the property owner. Which fiduciary duty is violated?
options:
  - Reasonable care (diligent property oversight)
  - Loyalty (no undisclosed vendor kickbacks)
  - Accounting (properly ledgered trust funds)
  - Confidentiality (protecting client information)
key: B
explanation: Under the federal law, loyalty is defined as the duty to avoid undisclosed vendor
  kickbacks. Accepting a cash payment for directing work without disclosure breaches this loyalty
  duty. Accounting concerns proper handling of trust funds, not kickbacks.
