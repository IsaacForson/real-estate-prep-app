stem: A property manager collects earnest money from a prospective tenant and deposits it into the
  brokerage's operating account to pay for office supplies. According to the text, is this action
  permissible?
options:
  - Yes, because earnest money is considered operating funds once received
  - No, it constitutes commingling of trust money with operating funds
  - Yes, as long as the money is returned within 24 hours
  - No, because the manager failed to obtain the broker's written approval
key: B
explanation: Commingling occurs when trust money is mixed with the broker's own funds, such as
  depositing earnest money into the operating account. This practice is prohibited because trust
  money must be kept separate from operating funds.
citation:
  source: REP Ref. Brokerage Practice § 10.2
  url: null
  quoted_text: Commingling is mixing trust money with the broker's own — depositing earnest money to
    the operating account, or leaving earned commissions in the trust account past the permitted
    time.
