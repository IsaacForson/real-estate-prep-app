stem: A tenant with a disability requests permission to install a grab bar in the bathroom at their
  own expense. According to the text, how must the property manager respond?
options:
  - The manager must allow the modification
  - The manager must deny the modification
  - The manager must charge a fee for the modification
  - The manager must require removal upon move-out
key: A
explanation: Permission for reasonable modifications at the tenant's expense must be granted in most
  private housing. Therefore, the manager must allow the grab bar installation. Charging a fee is
  incorrect because the modification is to be paid for by the tenant, not the manager.
