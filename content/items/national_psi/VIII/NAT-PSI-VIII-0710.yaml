stem: According to the text, which of the following is an owner's obligation in a property
  management agreement?
options:
  - Setting the monthly rent
  - Collecting rent from tenants
  - Funding a reserve account
  - Hiring and paying vendors
key: C
explanation: The text explicitly lists funding a reserve as part of the owner's obligations in a
  property management agreement. The most tempting distractor, "Setting the monthly rent," is
  incorrect because setting rent falls under the manager's authority, not the owner's obligations.
