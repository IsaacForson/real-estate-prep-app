stem: What type of agency relationship is created by a property management agreement?
options:
  - Agency coupled with interest
  - Universal agency
  - General agency
  - Special agency
key: C
explanation: A property management agreement gives the managing broker authority to act on behalf of
  the owner in all matters related to the property, which is a general agency relationship. Special
  agency would only authorize a single act or limited tasks, which does not fit the broad duties of
  property management.
