stem: According to the text, which of the following is a required element that a property management
  agreement must state?
options:
  - The manager's authority to lease, set or approve rents, collect rents, hire and pay vendors,
    evict, and spend up to a stated amount without approval
  - The broker's commission rate for sales transactions in residential properties and must be
    negotiated between the broker and the client
  - The licensee's continuing education requirements as mandated by state licensing authorities and
    must be completed before renewal of the real estate license
  - The property's zoning classification according to local municipal ordinances and state land-use
    regulations that govern permissible building heights and setback requirements
key: A
explanation: The text explicitly lists the manager's authority to lease, set or approve rents,
  collect rents, hire and pay vendors, evict, and spend up to a stated amount without approval as
  something the agreement must state. The broker's commission rate is not mentioned as a required
  element of a property management agreement.
