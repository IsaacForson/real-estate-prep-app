stem: A property management agreement specifies that the manager receives a fee based on the rent
  collected from tenants. What obligation does this compensation structure most likely create for
  the owner?
options:
  - Require the manager to submit monthly expense reports
  - Allow the manager to set rental rates without approval
  - Permit the manager to hire vendors at any cost
  - Authorize the manager to collect security deposits
key: A
explanation: Because a fee based on collected rent rewards occupancy and collections but not expense
  control, reporting and budgeting obligations are typically specified separately. Therefore, the
  owner would likely require the manager to submit expense reports. The distractor about allowing
  the manager to set rental rates without approval pertains to leasing parameters, not to the
  expense‑control reporting obligation.
