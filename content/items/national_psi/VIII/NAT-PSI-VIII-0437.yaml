stem: A property management agreement specifies that the manager receives 7% of the gross collected
  rent each month plus a leasing fee equal to one month's rent when a new lease is signed. If the
  monthly rent collected from tenants is $1,800 and a new lease is signed during the month, what is
  the manager's total compensation for that month?
options:
  - The manager's compensation is $2,520
  - The manager's compensation is $1,926
  - The manager's compensation is $126
  - The manager's compensation is $1,800
key: B
explanation: The manager's compensation consists of 7% of $1,800 ($126) plus a leasing fee of one
  month's rent ($1,800), totaling $1,926. The $126 option reflects only the percentage, the $1,800
  option reflects only the leasing fee, and the $2,520 option incorrectly adds an extra $600.
