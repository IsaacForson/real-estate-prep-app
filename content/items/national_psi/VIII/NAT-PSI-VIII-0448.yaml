stem: Which of the following best defines effective gross income?
options:
  - Effective gross income is potential gross income plus vacancy and collection loss minus other
    income such as laundry and parking
  - Effective gross income is potential gross income minus operating expenses before debt service
    and income taxes
  - Effective gross income is potential gross income minus vacancy and collection loss, plus other
    income such as laundry and parking
  - Effective gross income is potential gross income plus operating expenses plus reserves for
    replacement
key: C
explanation: Effective gross income is calculated as potential gross income minus vacancy and
  collection loss, plus other income such as laundry and parking. The option that states this
  matches the definition. The option that adds vacancy and collection loss and subtracts other
  income is incorrect because it reverses the adjustments. The option that subtracts operating
  expenses before debt service and income taxes describes net operating income, not effective gross
  income. The option that adds operating expenses and reserves for replacement is incorrect because
  effective gross income does not include expenses.
