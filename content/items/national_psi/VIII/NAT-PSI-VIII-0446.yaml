stem: Which of the following is considered part of operating expenses for a rental property?
options:
  - Depreciation expense is considered part of operating expenses.
  - Mortgage interest payments are considered part of operating expenses.
  - Capital improvement costs are considered part of operating expenses.
  - Property taxes are considered part of operating expenses.
key: D
explanation: Operating expenses include fixed costs such as taxes and insurance, variable costs such
  as utilities and repairs, and reserves for replacement. Property taxes are a fixed cost included
  in operating expenses. Mortgage interest, depreciation, and capital improvements are not operating
  expenses.
