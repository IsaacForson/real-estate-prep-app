math:
  worked_solution: |-
    Commission = $2,500 × 0.06 = $150
    Repair fees = 3 × $200 = $600
    Total compensation = $150 + $600 = $750
  formulas:
    - Total = (rent × rate) + (number of repairs × fee per repair)
