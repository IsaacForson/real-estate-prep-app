stem: A property management agreement provides that the manager receives 6% of gross collected rent
  each month and a fee of $200 for each major repair supervised. If the monthly gross collected rent
  is $2,500 and three major repairs are supervised during the month, what is the manager's total
  compensation for that month?
options:
  - $850.00
  - $750.00
  - $650.00
  - $950.00
key: B
explanation: The manager's compensation is calculated as 6% of $2,500 plus three times $200. This
  equals $150 + $600 = $750. Therefore, $750.00 is correct. The distractor $650.00 omits the repair
  fees or miscalculates the commission.
citation:
  source: "REP Ref. Brokerage Practice — Reference note: brokerage practice, listings, compensation,
    supervision, risk, property management (authored, status: draft — needs licensed review) § 3.2
