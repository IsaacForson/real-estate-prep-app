stem: According to the text, which of the following must a property management agreement state
  regarding trust funds?
options:
  - The agreement must specify the broker's office location
  - The agreement must specify the seller's loan interest rate
  - The agreement must specify how trust funds are held
  - The agreement must specify the manager's investment strategy
key: C
explanation: A property management agreement must state how trust funds are held; this is required
  under brokerage practice rules. Specifying the manager's investment strategy is not required.
