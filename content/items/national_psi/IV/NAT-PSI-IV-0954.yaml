stem: A creditor receives a completed loan application on March 10. Under ECOA, what is the latest
  date by which the creditor must notify the applicant of its action on the application, assuming no
  holidays affect the calculation?
options:
  - The creditor must notify the applicant by April 9.
  - The creditor must notify the applicant by April 10.
  - The creditor must notify the applicant by March 31.
  - The creditor must notify the applicant by April 8.
key: A
explanation: Under 15 U.S.C. § 1691(d)(1), a creditor must notify the applicant of its action within
  thirty days of receiving a completed application. Counting thirty days from March 10 brings us to
  April 9. The option that says April 10 adds an extra day beyond the thirty‑day period, the option
  that says March 31 ends before the thirty days are complete, and the option that says April 8
  subtracts a day, none of which satisfy the thirty‑day rule.
citation:
