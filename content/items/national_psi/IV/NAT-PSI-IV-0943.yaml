stem: A consumer pays two bona fide discount points on a loan whose interest rate is reduced by 1.4
  percentage points relative to the average prime offer rate. Under TILA §1602(ee), how many of
  those discount points may be excluded from points and fees?
options:
  - Two discount points
  - Three discount points
  - Zero discount points
  - One discount points
key: D
explanation: Because the interest rate reduction exceeds one percentage point but does not exceed
  two percentage points, paragraph (2) applies, allowing exclusion of up to and including 1 bona
  fide discount point. Thus only one of the two points paid can be excluded. The option suggesting
  two points is incorrect as it applies only when the reduction is one percentage point or less.
