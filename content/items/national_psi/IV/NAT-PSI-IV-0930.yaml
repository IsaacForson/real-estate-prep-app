stem: Under TILA §1664(b), which type of advertisement is generally excluded from the advertising
  provisions of this section?
options:
  - Advertisements for open-end credit plans only
  - Advertisements for residential real estate
  - Advertisements that state the annual percentage rate
  - Advertisements that include the down payment amount
key: B
explanation: The statute says the provisions of this section do not apply to advertisements of
  residential real estate except to the extent that the Bureau may by regulation require. Therefore,
  residential real estate ads are excluded. The distractor about open-end credit plans is incorrect
  because subsection (a) excludes open-end plans from the section's application, but the question
  asks about exclusion under subsection (b).
