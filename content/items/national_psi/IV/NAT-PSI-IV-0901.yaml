stem: A borrower suffers actual damages of $2,000 due to a creditor's ECOA violation. What is the
  maximum total recovery (actual plus punitive damages) the borrower could obtain in an individual
  action under ECOA?
options:
  - $2,000
  - $10,000
  - $12,000
  - $20,000
key: C
explanation: ECOA allows recovery of actual damages plus punitive damages not exceeding $10,000 (15
  U.S.C. §§ 1691–1691f (ECOA) — Equal Credit Opportunity Act §1691e(b)). Adding the $2,000 actual
  damages to the $10,000 punitive cap yields $12,000; the $20,000 option incorrectly doubles the
  punitive limit.
citation:
  source: 15 U.S.C. §§ 1691–1691f (ECOA) — Equal Credit Opportunity Act §1691e(b)
  url: null
  quoted_text: Any creditor, other than a government or governmental subdivision or agency, who fails
    to comply with any requirement imposed under this subchapter shall be liable to the aggrieved
    applicant for punitive damages in an amount not greater than $10,000
  secondary: []
math:
  worked_solution: |-
    Actual damages: $2,000
    Maximum punitive damages: $10,000
    Total recovery = $2,000 + $10,000 = $12,000
  formulas:
    - Total recovery = actual damages + punitive damages (capped at $10,000)
