stem: A creditor services a fixed-rate residential mortgage loan and provides the borrower with a
  coupon book that contains substantially the same information as required in TILA §1638(f)(1).
  Under TILA §1638(f)(3), is the creditor required to transmit periodic statements for each billing
  cycle?
options:
  - The creditor must transmit periodic statements for each billing cycle
  - The creditor is not required to transmit periodic statements for each billing cycle
  - The creditor may choose whether to transmit periodic statements for each billing cycle
  - The creditor must transmit periodic statements only if the coupon book lacks required information
key: B
explanation: The exception in subsection (f)(3) states that paragraph (1) does not apply to a
  fixed‑rate residential mortgage loan when the creditor provides a coupon book with substantially
  the same information. Therefore, no periodic statements are required. The option stating that
  statements are required ignores this exemption.
