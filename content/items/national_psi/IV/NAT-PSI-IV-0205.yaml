stem: What is the latest time by which an obligor may exercise the right to rescind under TILA §1635(a)?
options:
  - Midnight of the third business day after the consummation of the transaction
  - Midnight of the third business day after the delivery of the information and rescission forms
  - Midnight of the third business day after whichever occurs later of consummation or delivery
  - Midnight of the third business day after both consummation and delivery having occurred
key: C
explanation: The statute provides that the right to rescind lasts until midnight of the third
  business day following the consummation of the transaction or the delivery of the required
  disclosures, whichever is later. Therefore the correct answer reflects the later of the two
  events. The other options incorrectly limit the period to only one event or to both events having
  occurred.
