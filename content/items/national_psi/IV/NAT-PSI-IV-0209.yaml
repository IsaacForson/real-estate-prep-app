stem: Under TILA §1638(e)(1)(A), what must a private educational lender disclose in any application
  for a private education loan?
options:
  - the requirements for a co-borrower, including any changes in the applicable interest rates
    without a co-borrower
  - the disclosure of whether the rate of interest applicable to the private education loan is fixed
    or variable
  - the potential range of rates of interest applicable to the private education loan
  - the limitations on interest rate adjustments, both in terms of frequency and amount, or the lack
    thereof, if applicable
key: C
explanation: The statute explicitly requires disclosure of the potential range of rates of interest
  applicable to the private education loan in subsection (e)(1)(A). The other options describe
  disclosures required under different paragraphs of the same subsection, such as whether the rate
  is fixed or variable (e)(1)(B) or co‑borrower requirements (e)(1)(D).
