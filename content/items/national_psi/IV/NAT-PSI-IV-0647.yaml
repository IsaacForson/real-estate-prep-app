stem: In a contract for deed, who retains legal title until the purchase price is fully paid?
options:
  - The seller (vendor)
  - The buyer (vendee)
  - The mortgage lender
  - The closing trustee
key: A
explanation: The statute defines a contract for deed as an arrangement where the seller (vendor)
  retains legal title until the price is paid, while the buyer receives only possession and
  equitable title. Therefore, the seller holds legal title. The buyer does not obtain legal title
  until the contract is satisfied, and lenders or trustees are not parties to this arrangement.
