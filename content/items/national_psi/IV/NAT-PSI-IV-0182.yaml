stem: A creditor receives a completed loan application on June 1. Under ECOA, what is the latest
  date by which the creditor must notify the applicant of its action on the application?
options:
  - July 1
  - June 30
  - June 15
  - July 2
key: A
explanation: ECOA §1691(d)(1) requires notification within thirty days after receipt of a completed
  application. Counting thirty days from June 1 brings the latest permissible date to July 1. The
  distractor 'June 30' is wrong because it assumes only twenty‑nine days after receipt.
