stem: A creditor is refinancing a residential mortgage loan that is subject to anti-deficiency
  protection, and the refinancing would cause the loan to lose that protection. Under TILA
  §1639(g)(3), when must the creditor provide the written notice describing the protection and
  significance of loss?
options:
  - Before any agreement for such refinancing is consummated
  - At the time of the original loan consummation
  - Only if the consumer requests the notice
  - After the refinancing is consummated
key: A
explanation: The regulation requires that, before any agreement for a refinancing that would
  eliminate anti-deficiency protection is consummated, the creditor must give the consumer a written
  notice describing that protection and the consequence of its loss. Providing the notice after
  consummation or only upon request does not satisfy the timing requirement.
citation:
  source: 15 U.S.C. §§ 1601–1667f (TILA) — Truth in Lending Act — § 1639(g)(3)
  url: null
  quoted_text: In the case of any residential mortgage loan that is subject to protection under an
    anti-deficiency law, if a creditor or mortgage originator provides an application to a consumer,
    or receives an application from a consumer, for any type of refinancing for such loan that would
    cause the loan to lose the protection of such anti-deficiency law, the creditor or mortgage
    originator shall provide a written notice to the consumer describing the protection provided by
    the anti-deficiency law and the significance for the consumer of the loss of such protection
    before any agreement for any such refinancing is consummated.
