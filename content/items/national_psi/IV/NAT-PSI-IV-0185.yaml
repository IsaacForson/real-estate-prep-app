stem: A creditor is preparing to consummate a residential mortgage loan that will require an escrow
  account for taxes and insurance. Under TILA §1639d(h), when must the creditor disclose the amount
  required at closing to initially fund the escrow account?
options:
  - The creditor must disclose the amount required at closing to initially fund the escrow account
    at least 3 business days before consummation.
  - The creditor must disclose the amount required at closing to initially fund the escrow account
    within 7 days after consummation.
  - The creditor must disclose the amount required at closing to initially fund the escrow account
    only if the borrower requests it.
  - The creditor must disclose the amount required at closing to initially fund the escrow account
    at the time of consummation.
key: A
explanation: Section 1639d(h) requires the creditor to disclose, at least 3 business days before
  consummation, the amount needed to initially fund the escrow account. Disclosing the amount at
  consummation does not satisfy the advance‑notice requirement.
