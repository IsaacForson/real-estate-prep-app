stem: On March 10, a creditor receives a notice of rescission from an obligor. Assuming no holidays
  or weekends, by what date must the creditor return any earnest money or downpayment under TILA
  §1635(b)?
options:
  - By March 30
  - By March 31
  - By April 9
  - By April 10
key: A
explanation: The creditor must return the money within 20 days after receipt of the notice of
  rescission. Counting 20 calendar days from March 10 brings the deadline to March 30. The other
  options either miscount the days or add extra days.
