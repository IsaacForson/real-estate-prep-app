stem: A borrower seeks a loan of $180,000 to purchase a home priced at $250,000 with an appraised
  value of $225,000. What is the loan-to-value (LTV) ratio?
options:
  - The LTV ratio is 75 percent
  - The LTV ratio is 70 percent
  - The LTV ratio is 85 percent
  - The LTV ratio is 80 percent
key: D
explanation: LTV is calculated as the loan amount divided by the lesser of appraised value or
  purchase price. Here the lesser value is the appraised value of $225,000, so $180,000 ÷ $225,000 =
  0.80, or 80 percent. The other percentages result from using incorrect values or miscalculations.
citation:
  source: REP Ref. Financing & Closing § 8.2
  url: null
  quoted_text: LTV is the loan amount divided by the lesser of appraised value or purchase price
  secondary: []
math:
  worked_solution: |-
    Identify lesser of appraised value ($225,000) and purchase price ($250,000) = $225,000
    Divide loan amount ($180,000) by lesser value ($225,000) = 0.8
    Convert to percentage: 0.8 × 100 = 80%
  formulas:
    - LTV = Loan Amount / Lesser of Appraised Value or Purchase Price
