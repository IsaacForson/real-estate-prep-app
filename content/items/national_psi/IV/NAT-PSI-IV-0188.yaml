stem: What does an acceleration clause permit the lender to do upon a defined default?
options:
  - Declare the full unpaid balance due immediately
  - Require a court judgment before starting foreclosure
  - Sue only for each installment as it becomes due
  - Allow the borrower to cure arrears during reinstatement
key: A
explanation: The acceleration clause lets the lender declare the entire unpaid balance due at once
  when a default such as missed payment occurs. This matches the option to declare the full unpaid
  balance due immediately. Suing only for each installment would be the remedy without an
  acceleration clause.
