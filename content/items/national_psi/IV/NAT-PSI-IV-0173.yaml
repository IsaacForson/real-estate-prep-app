stem: Under TILA §1639(b)(1), which of the following actions constitutes a violation of appraisal
  independence?
options:
  - Asking an appraiser to consider additional comparable properties
  - Correcting errors in the appraisal report
  - Providing further detail for the appraiser's value conclusion
  - Compensating an appraiser to influence the appraised value
key: D
explanation: Subsection (b)(1) defines a violation as compensating, coercing, or otherwise
  influencing an appraiser to base the value on factors other than independent judgment. Therefore,
  compensating an appraiser to influence the appraised value is a prohibited act. The distractor
  describing a request for additional comparable properties is permissible under subsection (c)(1)
  and does not constitute a violation.
citation:
