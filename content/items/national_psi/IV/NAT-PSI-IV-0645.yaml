stem: A borrower transfers the property to his spouse via quitclaim deed. The loan contains an
  alienation clause. May the lender accelerate the loan?
options:
  - The lender may accelerate the loan because the alienation clause applies to any transfer.
  - The lender may not accelerate the loan because transfers to a spouse are exempt.
  - The lender may accelerate the loan only if the borrower is in default.
  - The lender may not accelerate the loan unless the loan is assumable.
key: B
explanation: Under the Garn–St Germain Act of 1982, alienation clauses are generally enforceable but
  transfers to a spouse are exempt. Therefore the lender may not accelerate the loan. The statement
  that the lender may accelerate because the alienation clause applies to any transfer is incorrect
  because it ignores the statutory exemption for spouse transfers.
