stem: A lender charges $4,500 in points and fees on a $150,000 loan. Based on the points and fees
  test in TILA §1639(b)(2)(A)(vii), is the loan eligible to be considered a qualified mortgage?
options:
  - The loan is ineligible because the points and fees exceed 3 percent of the loan amount
  - The loan is eligible because the points and fees equal 3 percent of the loan amount
  - The loan is ineligible because the points and fees equal 3 percent of the loan amount
  - The loan is eligible because the points and fees are less than 3 percent of the loan amount
key: B
explanation: The points and fees of $4,500 represent exactly 3 percent of the $150,000 loan amount,
  which meets the requirement that they do not exceed 3 percent. The option claiming ineligibility
  due to equality is incorrect because the limit is not exceeded.
