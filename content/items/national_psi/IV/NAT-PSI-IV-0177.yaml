stem: Which of the following is included in the finance charge under TILA?
options:
  - Title search and examination fees
  - Appraisal and inspection fees
  - Escrow for taxes and insurance
  - Interest, time price differential
key: D
explanation: Under §1605(a)(1), interest, time price differential, and amounts payable under points,
  discounts, or similar systems are included in the finance charge. Therefore, interest, time price
  differential is part of the finance charge. The distractor 'Title search and examination fees' is
  incorrect because §1605(e)(1) excludes fees for title examination, title insurance, or similar
  purposes from the finance charge for real property–secured loans.
