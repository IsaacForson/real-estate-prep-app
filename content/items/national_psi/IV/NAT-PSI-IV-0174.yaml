stem: A mortgage broker asks an appraiser to review additional comparable sales to support the
  appraisal. Under TILA §1639(c), is this request permissible?
options:
  - The request is prohibited because subsection (b)(1) bars any compensation to influence the
    appraised value
  - The request is permissible because subsection (c)(1) allows consideration of additional
    appropriate property information
  - The request is permissible only if the broker pays the appraiser a separate fee for the
    additional work
  - The request is prohibited unless a second appraisal is obtained as required under subsection
    (b)(2)
key: B
explanation: Subsection (c)(1) explicitly permits a mortgage broker to ask an appraiser to consider
  additional appropriate property information, including comparable properties, to support the
  appraisal. Thus the request is allowed. The distractor claiming the request is prohibited
  incorrectly applies the prohibitions in subsection (b)(1), which only bar coercive compensation or
  intimidation, not permissible requests for additional information.
