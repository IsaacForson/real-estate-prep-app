stem: A loan officer knowingly compensates an appraiser to inflate the property's value in order to
  secure a loan. Under TILA §1639(k)(1), what is the maximum civil penalty for this first violation?
options:
  - $20,000 per day
  - $15,000 per day
  - $10,000 per day
  - $5,000 per day
key: C
explanation: For a first violation of the appraisal independence standards, TILA §1639(k)(1) imposes
  a civil penalty of not more than $10,000 per day for each day the violation continues. Therefore,
  the maximum penalty is $10,000 per day. The distractor of $20,000 per day applies only to
  subsequent violations after a prior penalty has been assessed.
