stem: Which of the following is **NOT** an option for the buyer when the appraisal comes in below
  the contract price?
options:
  - Adding cash to cover the difference
  - Renegotiating the purchase price
  - Invoking an appraisal contingency to cancel
  - Obtaining a second appraisal
key: D
explanation: When the appraisal comes in below the contract price, the buyer’s options are to add
  cash to cover the difference, renegotiate the purchase price, or invoke an appraisal contingency
  to cancel the contract. Obtaining a second appraisal is not one of those options, so it is the
  correct answer.
