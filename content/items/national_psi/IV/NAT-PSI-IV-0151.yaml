stem: A buyer with a credit score of 560 is purchasing a home priced at $250,000. Assuming the
  appraised value equals the price, what is the minimum required investment (down payment) under FHA
  guidelines?
options:
  - A down payment of $30,000
  - A down payment of $20,000
  - A down payment of $25,000
  - A down payment of $35,000
key: C
explanation: For FHA loans, the minimum required investment is 10% of the lesser of appraised value
  or purchase price when the borrower’s decision credit score is between 500 and 579. With a score
  of 560, the buyer falls in this range, so the down payment is 10% of $250,000, or $25,000. The
  3.5% figure applies only to scores of 580 or higher, and the other amounts correspond to incorrect
  percentages.
