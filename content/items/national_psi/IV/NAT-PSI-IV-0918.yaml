stem: Under TILA §1640(a)(2)(A)(iv), what is the minimum statutory damages award for an individual
  action relating to a credit transaction secured by real property or a dwelling?
options:
  - $500
  - $1,000
  - $200
  - $400
key: D
explanation: The statute awards a minimum of $400 and a maximum of $4,000 for individual actions
  involving credit transactions secured by real property; the $200 minimum applies only to consumer
  leases, and the $500 minimum applies to open-end plans not secured by real property. Therefore the
  correct minimum is $400.
citation:
