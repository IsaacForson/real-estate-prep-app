stem: A licensee publishes an advertisement for a residential mortgage that states the down payment
  amount. According to TILA §1664(d), what additional information must the advertisement also
  include?
options:
  - The down payment amount and the terms of repayment
  - The terms of repayment and the annual percentage rate
  - The annual percentage rate and the down payment amount
  - The number of installments and the amount financed
key: B
explanation: "Subsection (d) states that if an advertisement states the amount of the downpayment,
  then it shall state all of the following: the downpayment, the terms of repayment, and the rate of
  the finance charge expressed as an annual percentage rate. Therefore, the ad must also include the
  terms of repayment and the APR. Distractor A omits terms of repayment. Distractor C includes
  number of installments and amount financed, which are not required unless those items are stated.
  Distractor D repeats downpayment and terms but omits APR."
citation:
  source: 15 U.S.C. §§ 1601–1667f (TILA) — Truth in Lending Act — § 1664(d)
  url: null
  quoted_text: "If any advertisement to which this section applies states the amount of the
    downpayment, if any, the amount of any installment payment, the dollar amount of any finance
    charge, or the number of installments or the period of repayment, then the advertisement shall
    state all of the following items: (1) The downpayment, if any. (2) The terms of repayment. (3)
    The rate of the finance charge expressed as an annual percentage rate."
