stem: Under ECOA, when must a creditor provide a copy of a written appraisal to an applicant for a
  dwelling‑secured loan?
options:
  - The creditor must provide the appraisal seven days prior to closing.
  - The creditor must provide the appraisal at the loan closing date.
  - The creditor must provide the appraisal three days before closing at latest.
  - The creditor must provide the appraisal at the time of application.
key: C
explanation: ECOA §1691(e)(1) states that the creditor shall furnish the appraisal promptly upon
  completion but in no case later than three days prior to closing. Therefore, the latest
  permissible time is three days before closing. The distractor 'The creditor must provide the
  appraisal at the loan closing date.' is incorrect because the statute prohibits providing the
  appraisal as late as closing.
