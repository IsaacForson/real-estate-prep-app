stem: A seller carries a purchase‑money loan on land and wants the buyer to obtain a construction
  loan later. Which clause allows the seller’s loan to accept lower priority than the future
  construction loan?
options:
  - Alienation clause
  - Subordination clause
  - Defeasance clause
  - Acceleration clause
key: B
explanation: A subordination clause lets a lien holder voluntarily accept a lower priority than a
  later lien, exactly as the seller’s loan would do to accommodate a construction loan. The
  acceleration clause deals with demanding immediate repayment upon default, not with lien priority.
