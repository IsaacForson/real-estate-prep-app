stem: A state housing finance agency extends a loan to a consumer to purchase a primary residence,
  taking a security interest in the dwelling. Under TILA §1635(e), does the consumer have a right to
  rescind the transaction?
options:
  - No, because the consumer received the TILA disclosures before closing
  - No, because the loan is secured by the borrower's principal dwelling
  - No, because the loan amount is less than $50,000
  - No, because the creditor is a state agency
key: D
explanation: Subsection (e)(3) exempts transactions where the creditor is an agency of a State from
  the right of rescission. Since the creditor in the scenario is a state housing finance agency, the
  consumer lacks rescission rights. The other options cite factors that do not create an exemption
  under this section.
