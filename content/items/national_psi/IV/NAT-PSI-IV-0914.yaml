stem: Under TILA §1639h(e), if a creditor willfully fails to obtain a required appraisal for a
  higher-risk mortgage, what is the liability to the applicant?
options:
  - The creditor is liable to the applicant for the sum of $2,000 as statutory damages.
  - The creditor is liable to the applicant for triple the amount of any finance charges paid.
  - The creditor is liable to the applicant for actual damages plus court costs.
  - The creditor is liable to the applicant for the amount of the loan origination fee.
key: A
explanation: TILA §1639h(e) explicitly states that a creditor who willfully fails to obtain an
  appraisal as required shall be liable to the applicant or borrower for the sum of $2,000. The
  other options describe liabilities that are not prescribed by this provision.
