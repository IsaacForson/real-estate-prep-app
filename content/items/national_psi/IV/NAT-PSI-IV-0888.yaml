stem: A borrower takes out a loan using their owned residence as security but continues to live in
  the property and collect no rent. Which term describes this arrangement?
options:
  - The borrower sells the property to the lender with an agreement to repurchase later
  - The borrower conveys bare legal title to a trustee who holds it for the lender
  - The borrower retains possession of the property while pledging it as security for the loan
  - The borrower transfers legal title to the lender while retaining equitable title
key: C
explanation: Hypothecation is defined as pledging property as security while the borrower retains
  possession, which matches the scenario of living in the owned residence while using it as
  collateral. The most tempting distractor, C, describes a deed of trust where legal title is
  transferred to a trustee, which is not hypothecation.
