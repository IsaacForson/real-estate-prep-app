stem: Under TILA §1664(c), if an advertisement states the rate of a finance charge, what must the
  advertisement also state?
options:
  - The number of monthly payments
  - The downpayment amount required
  - The rate as an annual percentage rate
  - The finance charge in dollars
key: C
explanation: Subsection (c) requires that when an advertisement states the rate of a finance charge,
  it must also state that rate expressed as an annual percentage rate. The finance charge amount in
  dollars is not required by this subsection; only the APR is mandated when the rate is disclosed.
