stem: A loan applicant receives Supplemental Nutrition Assistance Program (SNAP) benefits. The
  creditor denies the loan solely because the applicant receives SNAP benefits. Under ECOA, is this
  action permissible?
options:
  - Yes, because the creditor may consider public assistance income when determining
    creditworthiness.
  - No, because discrimination based on public assistance income is prohibited.
  - Yes, if the creditor provides a statement of reasons for the denial.
  - No, unless the applicant waives the right to receive a copy of the appraisal.
key: B
explanation: ECOA §1691(a)(2) prohibits denying credit when all or part of an applicant’s income
  comes from a public assistance program. Therefore, denying the loan solely because the applicant
  receives SNAP benefits is unlawful discrimination. The option stating that a creditor may deny the
  loan if it provides a statement of reasons is incorrect because providing a statement of reasons
  does not overcome a prohibited basis for denial.
