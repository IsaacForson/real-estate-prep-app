  source: 15 U.S.C. § 1639h(b)(1)
  url: null
  quoted_text: Subject to the rules prescribed under paragraph (4), an appraisal of property to be
    secured by a higher-risk mortgage does not meet the requirement of this section unless it is
    performed by a certified or licensed appraiser who conducts a physical property visit of the
    interior of the mortgaged property.
