stem: An appraiser conducts only an exterior inspection of a property for a higher-risk mortgage.
  Does this appraisal satisfy the requirement of TILA §1639h(b)(1)?
options:
  - No, unless the property is a condominium unit, in any case
  - Yes, provided the appraiser is certified or licensed in the state
  - No, because the appraisal must include a physical property visit of the interior
  - Yes, because an exterior inspection is sufficient for all property types
key: C
explanation: The regulation requires that an appraisal for a higher-risk mortgage be performed by a
  certified or licensed appraiser who conducts a physical property visit of the interior of the
  mortgaged property. An exterior-only inspection fails to meet this requirement.
