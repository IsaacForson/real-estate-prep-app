stem: What does a defeasance clause require the lender to do when the debt is fully paid?
options:
  - The lender must forgive the remaining balance and cancel the debt
  - The lender must retain the title until the debt is satisfied
  - The lender must release the lien or have the trustee reconvey title
  - The lender must demand immediate payment of the outstanding balance
key: C
explanation: The defeasance clause requires the lender to release the lien or have the trustee
  reconvey title when the debt is fully paid. The distractor stating that the lender must forgive
  the remaining balance and cancel the debt is incorrect because the clause does not require the
  lender to forgive the balance.
