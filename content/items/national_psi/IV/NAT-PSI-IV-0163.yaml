stem: Under TILA, what must a private educational lender disclose in any application for a private
  education loan?
options:
  - The potential range of rates of interest applicable to the private education loan
  - The fixed or variable nature of the interest rate applicable to the private education loan
  - The limitations on interest rate adjustments, both in terms of frequency and amount, or the lack
    thereof, if applicable
  - The requirements for a co-borrower, including any changes in the applicable interest rates
    without a co-borrower
key: A
explanation: The statute requires that in any application for a private education loan, the lender
  disclose the potential range of rates of interest applicable to the loan. This is explicitly
  listed as paragraph (A) of subsection (e)(1). The other options, while also required disclosures,
  appear in different paragraphs of the same subsection.
