stem: Under ECOA, which of the following actions by a creditor is prohibited?
options:
  - Asking an applicant's marital status to determine the applicant's creditworthiness for loan
    approval.
  - Using an age-based credit system that is statistically sound and does not penalize elderly
    applicants.
  - Asking whether an applicant's income comes from public assistance to evaluate the amount and
    stability of income.
  - Asking an applicant's age to determine the probable continuance of income levels and credit
    history.
key: A
explanation: Under ECOA §1691(b)(1), a creditor may ask about marital status only to ascertain its
  rights and remedies, not to discriminate in credit‑worthiness determinations. Asking marital
  status to judge creditworthiness therefore constitutes prohibited discrimination. The option
  describing the use of an age‑based credit system that is statistically sound and does not penalize
  elderly applicants is permissible because ECOA allows age inquiries for assessing income
  continuance.
