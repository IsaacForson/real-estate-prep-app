stem: Under the Equal Credit Opportunity Act (ECOA), what is the maximum amount of punitive damages
  a creditor may be liable for in an individual action for violating the Act?
options:
  - $10,000
  - $25,000
  - $2,000
  - $5,000
key: A
explanation: The statute limits punitive damages to not greater than $10,000 in an individual action
  (15 U.S.C. §§ 1691–1691f (ECOA) — Equal Credit Opportunity Act §1691e(b)). The $25,000 option
  exceeds this statutory cap and is therefore incorrect.
citation:
  source: 15 U.S.C. §§ 1691–1691f (ECOA) — Equal Credit Opportunity Act §1691e(b)
  url: null
  quoted_text: Any creditor, other than a government or governmental subdivision or agency, who fails
    to comply with any requirement imposed under this subchapter shall be liable to the aggrieved
    applicant for punitive damages in an amount not greater than $10,000
