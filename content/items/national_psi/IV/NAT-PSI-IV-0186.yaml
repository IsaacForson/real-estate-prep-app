stem: "Under the Equal Credit Opportunity Act, a request for the signature of both husband and wife
  for the purpose of creating a valid lien is:"
options:
  - Considered discrimination based on marital status.
  - Not considered discrimination under the act.
  - Required only for FHA-insured loans.
  - Allowed only when both incomes are equal.
key: B
explanation: Under the Equal Credit Opportunity Act, a request for both spouses' signatures to
  create a valid lien shall not constitute discrimination. Therefore the option stating that such a
  request is not considered discrimination under the act is correct. The option claiming the request
  is allowed only when both incomes are equal adds a condition not present in the law. The option
  labeling the request as discrimination based on marital status contradicts the statute. The option
  limiting the request to FHA-insured loans also introduces a condition that the act does not
  impose.
