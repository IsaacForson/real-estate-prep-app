stem: Under TILA §1605(a), which of the following is included in the finance charge for a consumer
  credit transaction?
options:
  - The escrow reserve
  - The interest charge
  - The title insurance
  - The appraisal fee
key: B
explanation: The finance charge includes interest, time price differential, and amounts paid under
  points or similar charges, as stated in §1605(a)(1). The title insurance premium is excluded for
  real property‑secured loans under §1605(e)(1).
