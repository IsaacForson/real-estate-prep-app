stem: A borrower with an FHA loan pays off the loan early and is charged a fee equal to two months'
  interest. Is this permissible?
options:
  - The fee is not permissible unless the loan is in default of payment.
  - The fee is permissible because FHA loans allow prepayment penalties.
  - The fee is permissible only if the loan balance exceeds two hundred thousand dollars.
  - The fee is not permissible because FHA loans have no prepayment penalty.
key: D
explanation: FHA, VA and USDA loans have no prepayment penalty, so charging a fee for early payoff
  on an FHA loan is not allowed. The statement that the fee is not permissible unless the loan is in
  default of payment is incorrect because FHA loans never permit prepayment penalties, even if the
  loan is in default. The claim that the fee is permissible because FHA loans allow prepayment
  penalties is false; FHA loans prohibit such penalties. The assertion that the fee is permissible
  only if the loan balance exceeds two hundred thousand dollars is also incorrect; FHA loans do not
  allow prepayment penalties regardless of the loan amount.
