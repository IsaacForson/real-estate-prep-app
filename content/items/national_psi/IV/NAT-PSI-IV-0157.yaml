stem: "Under TILA §1635(a), the obligor's right to rescind a consumer credit transaction secured by
  the principal dwelling expires at:"
options:
  - Three years after the date of consummation of the transaction.
  - Midnight of the third business day after consummation of the transaction.
  - Midnight of the third business day after the later of consummation or delivery of the
    disclosures.
  - Midnight of the third business day after delivery of the required disclosures.
key: C
explanation: Under TILA §1635(a), the rescission right expires at midnight of the third business day
  after the later of consummation or delivery of the required disclosures. The answer that states
  this later‑event rule is correct. The answers that base the period on only consummation or only
  delivery of the disclosures are incorrect because they ignore the later‑event requirement.
