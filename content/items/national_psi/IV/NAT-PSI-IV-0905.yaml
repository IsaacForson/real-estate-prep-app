stem: Under TILA §1664(c), if an advertisement states the rate of a finance charge, what must the
  advertisement also state?
options:
  - The advertisement must state the rate expressed as an annual percentage rate.
  - The advertisement must state the total finance charge amount in dollars.
  - The advertisement must state the number of periodic installment payments.
  - The advertisement must state the amount of the down payment required.
key: A
explanation: The statute requires that if an advertisement states the rate of a finance charge, it
  must also state that rate expressed as an annual percentage rate. The other options list
  disclosures that are only required when specific trigger amounts are mentioned, not merely the
  rate itself.
