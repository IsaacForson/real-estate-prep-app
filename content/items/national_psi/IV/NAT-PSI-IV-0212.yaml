stem: Under TILA §1639(c)(1)(A), what is prohibited in a mortgage referred to in section 1602(aa)?
options:
  - A term that permits negative amortization over the loan term
  - A prepayment penalty clause that charges a fee for early payoff
  - A clause allowing the lender to increase the interest rate after default
  - A provision that requires the borrower to pay a balloon payment at maturity
key: B
explanation: The statute states that a mortgage referred to in section 1602(aa) may not contain
  terms under which a consumer must pay a prepayment penalty for paying all or part of the principal
  before the due date. Therefore a prepayment penalty clause is prohibited. The distractor about
  increasing the interest rate after default is addressed in a different subsection (§1639(d)) and
  is not what this paragraph prohibits.
