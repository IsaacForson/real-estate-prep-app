stem: A qualified mortgage loan has an outstanding balance of $200,000 at the start of the second
  year after consummation. What is the maximum prepayment penalty that may be charged during that
  year under TILA §1639(c)(3)(B)?
options:
  - $6,000
  - $4,000
  - $8,000
  - $2,000
key: B
explanation: During the second year, the prepayment penalty may not exceed 2 percent of the
  outstanding balance. Two percent of $200,000 is $4,000. The $2,000 option corresponds to 1
  percent, while the $6,000 and $8,000 options exceed the permitted limit.
