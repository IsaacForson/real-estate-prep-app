stem: A borrower provides the six items needed for a loan application and receives a Loan Estimate
  but does not indicate intent to proceed. What is the lender prohibited from doing under TILA/RESPA
  rules?
options:
  - Charging most fees
  - Locking the rate
  - Ordering an appraisal
  - Providing disclosures
key: A
explanation: Under TILA/RESPA rules, a lender may not charge most fees until the borrower indicates
  intent to proceed. Providing disclosures is required regardless of intent, so that option is
  incorrect.
