stem: A consumer signs a mortgage loan secured by their principal dwelling on Tuesday, May 2. The
  creditor delivers the required TILA disclosures and rescission forms on Friday, May 5. Assuming no
  holidays, what is the latest date and time by which the consumer may exercise the right to
  rescind?
options:
  - Midnight of May 8
  - Midnight of May 9
  - Midnight of May 10
  - Midnight of May 11
key: C
explanation: The right to rescind lasts until midnight of the third business day after the later of
  consummation or delivery of the required disclosures. Consummation occurred on Tuesday, May 2, and
  the disclosures were delivered on Friday, May 5. The later event is the delivery on May 5.
  Counting three business days from May 5 gives May 8, May 9, and May 10, so the deadline is
  midnight of May 10. Selecting the answer that states midnight of May 9 would count only two
  business days after delivery, and selecting the answer that states midnight of May 8 would
  incorrectly base the count on the consummation date.
citation:
