stem: A creditor schedules the closing of a higher-risk mortgage for Thursday, June 10. According to
  TILA §1639h(c), what is the latest day the creditor may provide the applicant with a free copy of
  the appraisal?
options:
  - The creditor may provide the appraisal copy on Tuesday, June 8
  - The creditor may provide the appraisal copy on Wednesday, June 9
  - The creditor may provide the appraisal copy on Thursday, June 10
  - The creditor may provide the appraisal copy on Monday, June 7
key: D
explanation: Subsection (c) requires the creditor to provide the appraisal copy at least 3 days
  prior to the closing date. Providing the copy on Monday, June 7 satisfies this requirement, while
  Tuesday, June 8 provides only 2 days' notice.
