stem: A consumer pays one bona fide discount point on a loan whose interest rate is reduced by 2.5
  percentage points relative to the average prime offer rate. Under TILA §1602(ee), how many of
  those discount points may be excluded from points and fees?
options:
  - Zero discount points
  - One discount points
  - Two discount points
  - Three discount points
key: A
explanation: Paragraphs (1) and (2) only permit exclusion of discount points when the interest rate
  reduction does not exceed one or two percentage points, respectively. A reduction of 2.5
  percentage points exceeds both thresholds, so neither paragraph applies and no discount points may
  be excluded. The option suggesting one point is incorrect because the condition for any exclusion
  is not satisfied.
