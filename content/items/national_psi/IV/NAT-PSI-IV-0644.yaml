stem: A borrower signs a written promise to repay a loan with interest, naming the borrower as maker
  and the lender as payee. Which document is this?
options:
  - Deed of trust instrument
  - Contract for deed agreement
  - Promissory note instrument
  - Mortgage security instrument
key: C
explanation: The promissory note is defined as the borrower's written, unconditional promise to
  repay a definite sum with interest on stated terms (§1.1). The mortgage security instrument is
  incorrect because it creates a lien on the property, not the promise of repayment.
