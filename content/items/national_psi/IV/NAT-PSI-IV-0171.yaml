math:
  worked_solution: >-
    Step 1: Calculate buyer debits = purchase price + loan origination fee + prepaid taxes =
    $300,000 + $1,200 + $1,500 = $302,700.

    Step 2: Calculate buyer credits = loan amount + earnest money = $240,000 + $10,000 = $250,000.

    Step 3: Cash to close = buyer debits − buyer credits = $302,700 − $250,000 = $52,700.
