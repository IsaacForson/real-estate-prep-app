stem: A buyer is purchasing a home for $300,000 with a loan of $240,000 and has deposited $10,000
  earnest money. The buyer also owes a $1,200 loan origination fee and must prepay $1,500 in
  property taxes at closing. Using the rule that buyer cash to close equals buyer debits minus buyer
  credits, what is the buyer’s cash to close?
options:
  - $62,700
  - $52,700
  - $42,700
  - $51,200
key: B
explanation: The buyer’s cash to close is found by subtracting buyer credits from buyer debits.
  Buyer debits include the purchase price ($300,000), the loan origination fee ($1,200), and the
  prepaid property taxes ($1,500), totaling $302,700. Buyer credits consist of the loan amount
  ($240,000) and the earnest money deposit ($10,000), totaling $250,000. Subtracting credits from
  debits gives $302,700 − $250,000 = $52,700. If the earnest money were incorrectly treated as a
  debit instead of a credit, the calculation would yield a different amount (the option that results
  from that error).
citation:
