stem: Under a deed of trust, which party holds bare legal title to the property?
options:
  - The borrower (trustor)
  - The mortgagee
  - The lender (beneficiary)
  - The trustee
key: D
explanation: The trustee holds bare legal title under a deed of trust, as the borrower conveys that
  title to the trustee who holds it for the lender. The borrower (trustor) is a common distractor
  because everyday speech says the borrower 'gets a mortgage,' but the trustee is the title holder.
