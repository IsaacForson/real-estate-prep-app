stem: A private educational lender approves a private education loan application on March 15 and
  provides the required disclosure documents on the same day. According to TILA §1638(e)(6)(A), what
  is the latest calendar date by which the borrower may accept the loan terms and consummate the
  transaction?
options:
  - April 12
  - April 13
  - April 15
  - April 14
key: D
explanation: The rule gives the borrower 30 calendar days following approval and receipt of
  disclosures to accept the loan. March 15 plus 30 days lands on April 14, which is the latest
  permissible date. April 15 would exceed the 30‑day limit, while April 12 or 13 would be earlier
  than allowed.
