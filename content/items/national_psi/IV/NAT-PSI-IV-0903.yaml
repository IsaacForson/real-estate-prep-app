stem: Under TILA §1631(a), to whom is a creditor required to disclose the information required by
  this subchapter in a consumer credit transaction?
options:
  - The creditor's internal compliance officer
  - The real estate broker facilitating the transaction
  - The settlement agent handling the closing
  - The person who is obligated on the transaction
key: D
explanation: The regulation states that a creditor shall disclose to the person who is obligated on
  the transaction. The other options describe parties that are not required to receive the
  disclosures under this provision.
