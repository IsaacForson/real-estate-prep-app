stem: A consumer pays two bona fide discount points that reduce the interest rate by 1.8 percentage
  points relative to the average prime offer rate. Under TILA, how many of those points may be
  excluded from the points and fees calculation?
options:
  - One points
  - Zero points
  - Two points
  - Three points
key: A
explanation: Under TILA §1602(ee)(2), if the interest rate reduction exceeds one percentage point
  but does not exceed two percentage points, up to one bona fide discount point may be excluded from
  points and fees. Since the reduction is 1.8 percentage points, only one point may be excluded. The
  distractor "Two points" incorrectly assumes both points can be excluded regardless of the size of
  the interest rate reduction.
