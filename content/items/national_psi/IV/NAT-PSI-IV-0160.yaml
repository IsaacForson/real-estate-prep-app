stem: A consumer provides a dated, written statement waiving the TILA disclosure timing requirements
  due to a bona fide personal financial emergency. What must the creditor provide to the consumer at
  or before the time of such waiver?
options:
  - The creditor must provide the final disclosures required by subsection (a)
  - The creditor must provide a copy of the consumer's credit report (for underwriting)
  - The creditor must provide a revised good faith estimate (if the APR changes)
  - The creditor must provide a statement of the annual percentage rate (in the loan agreement)
key: A
explanation: When a consumer waives the timing requirements, the creditor must provide the final
  disclosures required by subsection (a) at or before the time of the waiver. The other options are
  not mandated by the waiver provision.
