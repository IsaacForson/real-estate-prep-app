stem: A consumer submits a written loan application for a mortgage secured by their principal
  dwelling on a Wednesday. What is the latest time by which the creditor must mail the good faith
  estimate of the required TILA disclosures?
options:
  - The creditor must mail the estimate three business days after receiving the application
  - The creditor must mail the estimate at least seven business days before consummation (as
    required by the rule)
  - The creditor must mail the estimate before the consumer pays any fee (if applicable)
  - The creditor must mail the estimate at the time of consummation (when the loan closes)
key: A
explanation: TILA requires that good faith estimates be delivered or placed in the mail not later
  than three business days after the creditor receives the consumer's written application. While the
  estimate must also be at least seven business days before consummation, the direct timing rule is
  the three‑day period after receipt.
