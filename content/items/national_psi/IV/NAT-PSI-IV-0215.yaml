stem: A loan officer receives a yield spread premium from the lender that is higher when the loan’s
  interest rate is higher. Under TILA §1639b(c)(1), is this permissible?
options:
  - The practice is prohibited because the compensation varies based on the loan's interest rate, a
    loan term.
  - The practice is prohibited when the consumer pays the yield spread premium directly.
  - The practice is permitted if the yield spread premium is disclosed to the consumer.
  - The practice is permitted because yield spread premium is not considered compensation based on
    loan terms.
key: A
explanation: TILA §1639b(c)(1) prohibits any compensation to a mortgage originator that varies based
  on the terms of the loan other than the principal amount. A yield spread premium that increases
  with the interest rate varies with a loan term, so it is prohibited. The distractor suggesting
  permissibility if disclosed is incorrect because disclosure does not override the prohibition.
citation:
  source: 15 U.S.C. § 1639b(c)(1)
  url: null
  quoted_text: For any residential mortgage loan, no mortgage originator shall receive from any person
    and no person shall pay to a mortgage originator, directly or indirectly, compensation that
    varies based on the terms of the loan (other than the amount of the principal).
