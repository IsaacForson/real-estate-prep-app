stem: A buyer takes title to a property that is subject to a mortgage containing an alienation
  clause but does not obtain the lender’s consent. What action may the lender take?
options:
  - Extend the loan repayment term
  - Reduce the interest rate
  - Forgive the outstanding debt
  - Accelerate the loan balance
key: D
explanation: The alienation (due-on-sale) clause permits the lender to accelerate the loan if title
  is transferred without consent, making the entire balance due immediately. Forgiving the debt or
  reducing the rate are not authorized by this clause.
