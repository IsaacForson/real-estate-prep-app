stem: Under TILA §1639d(h), how many business days before consummation must the creditor disclose
  the required escrow account information?
options:
  - One business day
  - Three business days
  - Five business days
  - Seven business days
key: B
explanation: The rule states that the creditor shall disclose the escrow information by written
  notice at least three business days before the consummation of the transaction that creates the
  account. Disclosures made sooner or later than this interval do not meet the statutory timing
  requirement.
