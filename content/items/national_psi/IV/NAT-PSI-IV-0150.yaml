stem: Under the Homeowners Protection Act, when must a lender automatically terminate borrower‑paid
  private mortgage insurance (PMI) for a single‑family principal residence if the loan is current?
options:
  - When the balance is scheduled to reach 78% of the original value
  - When the borrower requests cancellation after reaching 80% of the original value
  - When the balance reaches 80% of the original value
  - When the loan balance reaches the midpoint of the term
key: A
explanation: Under the Homeowners Protection Act, a lender must automatically cancel borrower‑paid
  PMI when the loan balance is scheduled to reach 78% of the original value, provided the loan is
  current. The borrower may request cancellation earlier at 80% of value, but automatic termination
  occurs at the 78% threshold. The other options describe the borrower‑request threshold, the
  midpoint of the schedule, or an incorrect 80% automatic trigger, which do not match the rule.
