stem: Which of the following is **NOT** a prohibited basis for discrimination under the Equal Credit
  Opportunity Act (ECOA)?
options:
  - Based on race or color.
  - Based on credit history.
  - Based on sex or gender.
  - Based on religion alone.
key: B
explanation: Under ECOA §1691(a)(1), discrimination based on race, color, religion, national origin,
  sex, marital status, or age (if the applicant has capacity to contract) is prohibited. Credit
  history is not listed among these prohibited bases, so using it as a basis for discrimination is
  not prohibited by ECOA. The distractor 'Based on religion alone.' is incorrect because the statute
  explicitly includes religion as a prohibited basis.
