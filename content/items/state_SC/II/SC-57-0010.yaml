stem: A continuing education provider dedicates class time to recruiting students to join the
  instructor's brokerage team. Which principle in S.C. Code Ann. Regs. 105-8 explains why this
  practice violates the regulation?
options:
  - Providers may not advertise passage rates without disclosing sample size
  - Course hours may not be used to recruit affiliates or solicit business
  - Instructors may not alter a student's grade without commission approval
  - Providers may not offer make-up sessions exceeding twenty percent of hours
key: B
explanation: The regulation prohibits individuals or companies from utilizing course hours or
  materials to recruit new affiliates for any company, sell promotional materials, or solicit
  business.
