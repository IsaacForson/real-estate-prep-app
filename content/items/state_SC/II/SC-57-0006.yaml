stem: A licensee wants to advertise a property owned by someone else before the owner signs any
  agreement with the licensee's firm. Under S.C. Code Ann. § 40-57-135, what must happen first?
options:
  - The licensee must notify the commission of the planned advertisement
  - The firm must first obtain a written listing agreement
  - The firm must obtain the buyer's verbal consent to advertise
  - The licensee must register an alternative name with the commission
key: B
explanation: A licensee may not advertise, market, or offer to conduct a real estate transaction
  involving property owned by another person without first obtaining a written listing agreement
  between the property owner and the real estate brokerage firm.
citation:
  source: S.C. Code Ann. § 40-57-135
  url: null
  quoted_text: A licensee may not advertise, market, or offer to conduct a real estate transaction
    involving real estate owned, in whole or in part, by another person without first obtaining a
    written listing agreement between the property owner and the real estate brokerage firm with
    whom the licensee is associated.
