stem: A broker-in-charge disburses earnest money to the seller before closing, contrary to the
  contract which requires the funds to be held until closing. Under S.C. Code Ann. §
  40-57-136(B)(5), is this conduct considered demonstrating incompetence?
options:
  - Yes, because disbursing trust funds contrary to the terms of the contract demonstrates
    incompetence.
  - No, because the broker-in-charge may disburse funds at any time before closing.
  - Yes, but only if the funds are disputed between the parties.
  - No, because the broker-in-charge may retain a company amount to cover service charges.
key: A
explanation: The rule states that disbursing trust funds contrary to the terms of the contract
  demonstrates incompetence. Therefore, the described conduct is grounds for a finding of
  incompetence. The distractor claiming that disbursement may occur at any time before closing
  contradicts the requirement to follow the contract terms.
citation:
  source: S.C. Code Ann. § 40-57 (Title 40, ch. 57 — Real Estate Brokers, Brokers-in-Charge,
