    Estate Brokers, Brokers-in-Charge, Associates, and Property Managers — § 40-57-136(B)(5)
  url: null
  quoted_text: A broker-in-charge or property manager-in-charge who disburses trust funds contrary to
    the terms of the contract or fails to disburse trust funds not in dispute is considered to have
    demonstrated incompetence to act as a broker-in-charge or property manager-in-charge.
