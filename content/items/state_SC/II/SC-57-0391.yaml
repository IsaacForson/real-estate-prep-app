stem: A provider renewed their license on June 30, 2021. As of January 1, 2024, has the provider met
  the biennial renewal requirement under S.C. Code Ann. § 40-57-930(A)?
options:
  - No, because the provider renewed exactly one year ago.
  - No, the provider has not met the biennial renewal requirement.
  - Yes, the provider has met the biennial renewal requirement.
  - Yes, because the provider renewed less than one year ago.
key: B
explanation: Biennial renewal means the license must be renewed every two years. The provider’s last
  renewal was June 30, 2021, so the next renewal was due June 30, 2023. As of January 1, 2024 that
  deadline has passed, so the requirement has not been met. The distractor claiming less than one
  year has passed is false; more than two years have elapsed.
