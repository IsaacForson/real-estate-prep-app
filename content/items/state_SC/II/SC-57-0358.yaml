stem: A licensee commits a first violation of a particular provision of this chapter. What is the
  maximum administrative penalty that may be assessed under S.C. Code Ann. § 40-57-725(C)(1)?
options:
  - A ten-thousand-dollar penalty
  - A five-thousand-dollar penalty
  - A one-thousand-dollar penalty
  - A five-hundred-dollar penalty
key: D
explanation: Under § 40-57-725(C)(1), the commission may assess an administrative penalty of no more
  than $500 for a first violation of any provision. Therefore, the correct answer is a
  five‑hundred‑dollar penalty. A one‑thousand‑dollar penalty applies only to a second violation of
  the same provision within five years, making it incorrect for a first offense.
