stem: A licensee knows that the property has a leaking roof but does not disclose this condition to
  the buyer. Under which provision of S.C. Code Ann. § 40-57-710 is this failure to disclose a known
  material fact grounds for discipline?
options:
  - Subsection (A)(15) – receiving compensation from more than one party without proper written
    disclosure.
  - Subsection (A)(16) – representing more than one party in a transaction without written consent.
  - Subsection (A)(20) – failing to disclose a known material fact about the property.
  - Subsection (A)(22) – violating a commission rule or order concerning real estate practices.
key: C
explanation: The key is correct because subsection (A)(20) directly prohibits failing to disclose a
  known material fact concerning a real estate transaction as required by Section 40-57-350. The
  other options address unrelated prohibitions such as undisclosed dual compensation, representing
  multiple parties without consent, or generic commission rule violations.
