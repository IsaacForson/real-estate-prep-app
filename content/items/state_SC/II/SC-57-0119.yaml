stem: During an investigation under S.C. Code Ann. § 40-57-770, a supervised licensee is sent
  information as required by Section 40-1-80(B). Who else must receive a copy of that same
  information?
options:
  - The supervising broker-in-charge or property manager-in-charge of record
  - The real estate school’s director responsible for compliance
  - The commission’s legal counsel assigned to the case
  - The licensee’s managing broker overseeing the transaction
key: A
explanation: The statute provides that the supervising broker-in-charge or property
  manager-in-charge of record with whom the supervised licensee is affiliated shall also receive a
  copy of the information sent to the licensee. The other options are not mentioned in the provision
  and therefore incorrect.
