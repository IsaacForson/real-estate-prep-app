stem: A licensee voluntarily surrenders their license under S.C. Code Ann. § 40-57-720(D). Later,
  they wish to reapply for a license. According to S.C. Code Ann. § 40-57-730(A), which statement
  correctly describes the waiting period before reapplication?
options:
  - The licensee must wait one year before reapplying.
  - The licensee may reapply immediately after surrender.
  - The licensee must wait five years before reapplying.
  - The licensee must wait three years before reapplying.
key: B
explanation: The three‑year reapplication bar applies only after a revocation, not after a voluntary
  surrender. Since the licensee surrendered, no waiting period is required, making the immediate
  reapplication option correct. The three‑year, one‑year, and five‑year options incorrectly apply
  the revocation rule to a surrender.
citation:
