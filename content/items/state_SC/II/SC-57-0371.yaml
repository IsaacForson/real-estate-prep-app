stem: Under S.C. Code Ann. § 40-57-350, what must a seller's agent disclose to the seller concerning
  the transaction?
options:
  - All material adverse facts whether known or unknown
  - All facts that the seller requests to be disclosed
  - All facts that affect the property's structural integrity only
  - All material adverse facts actually known to the agent
key: D
explanation: The statute requires a seller's agent to disclose to the seller all material adverse
  facts concerning the transaction that are actually known to the agent. This duty is limited to
  facts the agent actually knows; it does not require disclosure of unknown or speculative facts.
  The incorrect option suggesting disclosure of whether known or unknown facts misstates the scope
  of the duty.
