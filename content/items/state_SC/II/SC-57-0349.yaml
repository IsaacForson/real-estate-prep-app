stem: A resident licensee moves to another state and does not notify the South Carolina Real Estate
  Commission within thirty days of the change in residency. Under S.C. Code Ann. § 40-57-120, what
  is the consequence of this failure to notify?
options:
  - A violation of this chapter subject to penalties provided in Section 40-57-710
  - Immediate suspension of the licensee's real estate license by the commission
  - A required payment of one thousand dollars to the state real estate recovery fund
  - Mandatory completion of thirty hours of continuing education within sixty days
key: A
explanation: The key is correct because subsection (C)(3) provides that failure to timely notify the
  commission of a change in residency is a violation of the chapter subject to penalties under
  Section 40-57-710. The most tempting distractor, immediate suspension of the licensee's real
  estate license by the commission, is incorrect because the statute does not prescribe automatic
  suspension for this violation; it only subjects the licensee to penalties under the referenced
  section.
