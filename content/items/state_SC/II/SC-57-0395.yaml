stem: A licensee represents both the buyer and seller in a real estate transaction after obtaining
  written consent from both parties to act as a dual agent. Under S.C. Code Ann. § 40-57-710(A)(16),
  is this conduct grounds for disciplinary action?
options:
  - Not grounds for disciplinary action because written consent was obtained
  - Grounds for disciplinary action because representing multiple parties is prohibited
  - Grounds for disciplinary action only if the broker-in-charge did not approve
  - Not grounds for disciplinary action if the licensee discloses the arrangement to the commission
key: A
explanation: Subsection (A)(16) prohibits representing more than one party without the full written
  knowledge and consent of all parties; obtaining written consent makes the conduct permissible. The
  distractor stating that representing multiple parties is prohibited overlooks the consent
  exception outlined in the rule.
