stem: A licensee receives an earnest money deposit from a buyer but does not inform the buyer in
  writing that the licensee will hold the funds. Under S.C. Code Ann. § 40-57-710(A)(18), is this
  conduct grounds for disciplinary action?
options:
  - The licensee used the deposit for personal expenses before closing the transaction.
  - The licensee accepted the deposit but did not place it in an escrow account as required.
  - The licensee failed to inform the payor and obtain written acknowledgement of who will hold the
    money.
  - The licensee retained the deposit without providing a written receipt to the payor.
key: C
explanation: The key is correct because subsection (A)(18) requires the licensee to inform the payor
  and obtain written acknowledgement of who will hold the deposit; failing to do so is grounds for
  discipline. The other options describe different violations (such as commingling or failing to use
  escrow) that are not addressed by this specific subsection.
