stem: A broker-in-charge wishes to operate her real estate business from a home office that is not
  open to the public. Under S.C. Code Ann. § 40-57-135(C)(1), is this permissible?
options:
  - Yes, as long as the office has a dedicated phone line
  - No, the office must be open to the public during business hrs
  - Yes, if she posts a sign indicating office hours
  - No, unless she obtains a waiver from the commission
key: B
explanation: Subsection (C)(1) requires the office location to be accessible by the public during
  reasonable business hours. A home office closed to the public does not meet this requirement,
  regardless of phone lines or signage.
