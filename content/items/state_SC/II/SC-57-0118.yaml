stem: A licensee receives an administrative citation for a violation and chooses not to file an
  appeal. According to S.C. Code Ann. § 40-57-725(D), by when must the administrative penalty be
  paid?
options:
  - Within ten days of receiving the citation
  - Within twenty days of receiving the citation
  - Within thirty days of receiving the citation
  - Within sixty days of receiving the citation
key: C
explanation: The rule states that if no appeal is filed, the citation becomes a final order and the
  penalties must be paid within thirty days of receipt of the citation. The ten‑day period applies
  to filing an appeal, not to payment, and twenty‑ and sixty‑day periods are not specified in the
  statute.
