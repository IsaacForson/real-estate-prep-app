stem: A provider receives a notice of disapproval for its course application and is given thirty
  days to cure deficiencies. If the provider cures the deficiencies within the thirty‑day period,
  what is the outcome according to S.C. Code Ann. Regs. ch. 105?
options:
  - The provider must pay a penalty before approval is granted
  - The application will be approved after deficiencies are cured
  - The provider must wait an additional sixty days before reapplying
  - The Commission will withdraw existing course approvals
key: B
explanation: The regulation specifies that if deficiencies are cured within the thirty‑day period,
  the application will be approved. Paying a penalty, waiting additional time, or withdrawing
  existing approvals are not stated outcomes for this scenario.
citation:
  source: S.C. Code Ann. Regs. ch. 105 (Real Estate Commission) — South Carolina Code of Regulations
