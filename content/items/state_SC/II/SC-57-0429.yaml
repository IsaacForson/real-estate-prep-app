stem: "A licensee deposits a client’s earnest money into the brokerage trust account and later
  withdraws $2,000 from that account to pay personal credit‑card debt. Under S.C. Code Ann. §
  40-57-30(12), this conduct is:"
options:
  - It is conversion because trust funds were used for a purpose other than for the client.
  - It is not conversion because the funds were returned within 30 days.
  - It is permitted because the licensee disclosed the withdrawal to the client.
  - It is allowed because the amount is less than $5,000.
key: A
explanation: Using trust‑account funds to pay personal debt is conversion because the funds are
  employed for a purpose other than holding them for the client. The claim that returning the funds
  within 30 days negates conversion is incorrect; the statute defines conversion by the use, not by
  timing.
