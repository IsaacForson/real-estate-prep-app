stem: Under S.C. Code Ann. § 40-57-820, how is a licensee treated when a violation of the chapter is
  committed through the use of artificial intelligence or similar programs?
options:
  - The licensee is considered to have committed the violation directly.
  - The licensee may avoid liability by claiming the AI acted independently.
  - The commission must prove the licensee personally performed the act.
  - The violation is exempt from disciplinary action if the AI was unsupervised.
key: A
explanation: The statute states that a violation committed through the use of AI or similar programs
  is treated as if the violation was committed directly by the licensee. Therefore, the licensee is
  considered to have committed the violation directly. The claim that the AI acted independently
  does not relieve the licensee of responsibility under this rule.
