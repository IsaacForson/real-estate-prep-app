stem: A licensee uses an artificial intelligence program to generate a property description that
  omits known defects. Under S.C. Code Ann. § 40-57-820, how is this conduct treated for
  disciplinary purposes?
options:
  - As if the violation was committed directly by the licensee.
  - As a separate violation attributable only to the software provider.
  - As a mitigating factor reducing potential discipline.
  - As permissible because the licensee did not personally create the description.
key: A
explanation: The statute treats any violation that occurs through the use of an AI program as if the
  licensee themselves committed the violation. Therefore, the option stating that the violation is
  treated as if committed directly by the licensee is correct. The option that assigns
  responsibility only to the software provider is incorrect because the rule holds the licensee
  accountable. The option that suggests the conduct is a mitigating factor is incorrect; the statute
  does not reduce discipline for AI‑generated descriptions. Finally, the option that claims the act
  is permissible because the licensee did not personally create the description is incorrect; the
  rule does not excuse the licensee for using AI to omit known defects.
