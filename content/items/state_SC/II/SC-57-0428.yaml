stem: Under S.C. Code Ann. § 40-57-30(12), what does the term "Conversion" mean?
options:
  - Advertising a property without disclosing the licensee's affiliation with a brokerage.
  - Using trust funds for a purpose other than the purpose for which they are held.
  - Failing to deposit earnest money into a trust account within three business days.
  - Receiving a referral fee without written disclosure to the client.
key: B
explanation: Conversion, as defined in S.C. Code Ann. § 40-57-30(12), occurs when trust funds are
  used for a purpose other than the purpose for which they are held. The option stating 'Using trust
  funds for a purpose other than the purpose for which they are held' matches this definition. The
  other options describe different trust‑account or disclosure violations that do not meet the
  statutory definition of conversion.
