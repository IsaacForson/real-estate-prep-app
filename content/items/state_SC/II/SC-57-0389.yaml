stem: Under S.C. Code Ann. Regs. ch. 105, what is the consequence for a provider that offers a real
  estate pre-licensing course before obtaining Commission approval?
options:
  - The provider must pay a five‑hundred‑dollar penalty
  - The Commission will withdraw course approval
  - The certificates of completion will not be recognized
  - The provider must resubmit the application
