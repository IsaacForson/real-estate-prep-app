stem: Under S.C. Code Ann. § 40-57-30(1), what does the term 'active license' mean?
options:
  - A license that has been issued for the current period and authorizes the licensee to practice in
    this State.
  - A license that has expired but may be renewed within the six‑month grace period established by
    commission rule.
  - A license that is temporarily inactive because the licensee has chosen not to engage in real
    estate practice.
  - A license that has been canceled and requires the holder to submit a new application and satisfy
    current licensure criteria.
key: A
explanation: The definition in § 40-57-30(1) explicitly states that an active license is one issued
  for the current period that authorizes practice in South Carolina. The option describing an
  expired license that may be renewed is incorrect because an active license must be currently
  valid, not expired.
