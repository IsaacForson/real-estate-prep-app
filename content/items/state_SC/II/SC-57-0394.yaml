stem: A licensee assists both the buyer and seller in a transaction and receives a fee from each
  party. The licensee provides written disclosure of the dual compensation to both parties before
  they sign the contract. Under S.C. Code Ann. § 40-57-710(A)(15), is this conduct permissible?
options:
  - Permissible only if the broker-in-charge approves the arrangement
  - Not permissible unless the parties are related by blood or marriage
  - Permissible because full knowledge and written disclosure were provided
  - Not permissible because compensation from multiple parties is banned
key: C
explanation: The conduct is permissible because the licensee gave full knowledge and written
  disclosure to both parties, satisfying the exception in subsection (A)(15). The distractor
  claiming compensation from multiple parties is always banned ignores the statutory exception that
  permits such compensation with proper disclosure.
