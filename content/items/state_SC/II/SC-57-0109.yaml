stem: Under S.C. Code Ann. § 40-57-135(A)(5), what must a broker-in-charge establish and maintain?
options:
  - A verbal office policy communicated during staff meetings
  - A written office policy that is accessible to supervised licensees
  - A written office policy retained only by the broker-in-charge
  - A written office policy filed with the commission each year
key: B
explanation: The rule requires a written office policy that is readily accessible to supervised
  licensees; the other options describe policies that are verbal, filed with the commission, or
  retained only by the broker-in-charge, which do not meet the requirement.
