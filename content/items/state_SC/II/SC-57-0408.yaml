stem: An instructor renews their license with the commission but does not attend an instructor
  development workshop or provide equivalent continuing education. Under S.C. Code Ann. §
  40-57-930(B), what is required for the instructor's license renewal?
options:
  - The instructor must attend an instructor development workshop or provide evidence of equivalent
    continuing education.
  - The instructor must attend an instructor development workshop and provide evidence of equivalent
    continuing education.
  - The instructor must only attend an instructor development workshop; providing evidence of
    continuing education is not sufficient.
  - The instructor must only provide evidence of equivalent continuing education; attending a
    workshop is not sufficient.
key: A
explanation: The statute provides that, as a condition of renewal, instructors shall attend
  instructor development workshops or provide evidence of equivalent continuing education. This
  creates an alternative requirement, so satisfying either condition meets the rule. Requiring both
  attendance and evidence adds a condition not present in the law.
citation:
  source: S.C. Code Ann. § 40-57 (Title 40, ch. 57 — Real Estate Brokers, Brokers-in-Charge,
