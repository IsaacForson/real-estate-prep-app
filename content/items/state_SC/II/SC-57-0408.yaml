    Estate Brokers, Brokers-in-Charge, Associates, and Property Managers § 40-57-930
  url: null
  quoted_text: As a condition of renewal, instructors shall attend instructor development workshops
    sponsored by the commission or provide evidence of equivalent hours of continuing education that
    increases their knowledge of the subject content in their area of expertise of their teaching
    techniques.
