stem: A licensee receives an administrative citation on June 1, 2025 and decides to appeal. What is
  the last day the appeal can be filed to be timely?
options:
  - June 9, 2025
  - June 10, 2025
  - June 11, 2025
  - June 12, 2025
key: C
explanation: The rule requires an appeal to be filed within ten days of receiving the citation.
  Counting ten days from June 1, 2025 brings the deadline to June 11, 2025. June 10 would be only
  nine days after receipt, while June 12 would be the eleventh day, exceeding the limit.
