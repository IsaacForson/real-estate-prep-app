stem: A licensee accepts payment from both the buyer and seller in the same transaction without
  informing either party in writing. Which rule from S.C. Code Ann. § 40-57-710 explains why this is
  grounds for discipline?
options:
  - Receiving undisclosed compensation from more than one party
  - Issuing a check returned for insufficient funds or a closed account
  - Acting as an undisclosed principal in the transaction
  - Failing to remit trust funds within a reasonable time
