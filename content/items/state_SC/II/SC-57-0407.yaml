stem: An education provider submits an application for approval but the commission finds that the
  provider violated a statutory requirement by advertising without disclosing the sponsor's
  identity. Under S.C. Code Ann. § 40-57-920(B), what action may the commission take regarding the
  provider's approval?
options:
  - The commission may impose a continuing education audit on the provider.
  - The commission may issue a public commendation for the provider's compliance.
  - The commission may deny the provider's approval based on the violation found.
  - The commission may require the provider to retake the pre-licensing course.
key: C
explanation: The statute authorizes the commission to deny, reprimand, fine, suspend, or revoke
  approval when it finds violations of statutory or regulatory requirements. Denial is therefore a
  permissible action. Requiring a retake of the pre-licensing course is not listed as an authorized
  sanction in this provision.
