stem: Under S.C. Code Ann. § 40-57-720(C)(1), how many days does the department have to complete its
  investigation after receiving a complaint, unless it seeks a waiver from the commission?
options:
  - One hundred eighty days
  - One hundred thirty days
  - One hundred twenty days
  - One hundred fifty days
key: D
explanation: The statute requires the department to conclude its investigation within one hundred
  fifty days from receipt of the complaint unless a waiver is obtained. The thirty‑day and sixty‑day
  options are too short, and ninety days applies to the commission’s decision notice, not the
  investigation period.
