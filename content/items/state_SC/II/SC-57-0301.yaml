stem: Under S.C. Code Ann. § 40-57-136(B)(2), what must a broker-in-charge or property
  manager-in-charge do with backup copies of computerized real estate trust accounts?
options:
  - The broker-in-charge must store backup copies on the same premises as the original records.
  - The broker-in-charge must maintain backup copies on a data storage medium stored in a separate
    off-site location.
  - The broker-in-charge must keep backup copies only in electronic format on the broker's personal
    computer.
  - The broker-in-charge must destroy backup copies after one year unless otherwise directed by the
    commission.
key: B
explanation: The rule explicitly requires that backup copies be kept on a data storage medium stored
  in a separate off-site location. Storing copies on the same premises violates this requirement.
