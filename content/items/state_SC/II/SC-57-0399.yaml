stem: A provider fails to maintain required attendance records for its pre-licensing course as
  mandated by S.C. Code Ann. Regs. ch. 105. According to the regulations, what action may the
  Commission take?
options:
  - The Commission will impose a one‑thousand‑dollar fine
  - The Commission will require repayment of all tuition
  - The Commission will withdraw course approval
  - The Commission will suspend advertising for six months
key: C
explanation: The regulation provides that failure to meet the above‑listed requirements may result
  in the Commission withdrawing course approval. Imposing fines, requiring tuition repayment, or
  suspending advertising are not mentioned as consequences for this specific failure.
