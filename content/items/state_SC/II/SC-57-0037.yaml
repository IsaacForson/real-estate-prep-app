stem: Under S.C. Code Ann. § 40-57-710(A)(10), within how many days must a licensee report to the
  commission in writing by certified mail notice of a conviction for a crime listed in subsection
  (A)(9)?
options:
  - Five days.
  - Seven days.
  - Ten days.
  - Thirty days.
key: C
explanation: The key is correct because subsection (A)(10) requires a licensee to report a
  conviction to the commission in writing by certified mail within ten days. The other options list
  time periods not specified in the statute. Reporting within five or seven days would be early but
  not required; thirty days would exceed the limit and violate the rule.
