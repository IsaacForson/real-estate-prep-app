stem: According to S.C. Code Ann. Regs. ch. 105, which statement correctly defines a time sharing
  ownership plan?
options:
  - Purchasers are deeded an undivided interest in the facilities with a right to use designated
    accommodations for a specific period of time during any given year, but not necessarily for
    consecutive years, which extends for a period of more than one (1) year
  - Purchasers are deeded title to specific time‑sharing units or facilities for a set period each
    year, not necessarily consecutive, lasting more than one year, with the remaining interest
    retained by interval owners as tenants in common
  - Purchasers lease a designated unit for a fixed term under one year, receiving no ownership
    interest in the property and having no right to use any shared amenities or common areas
  - Purchasers own the property outright and may use it at any time, with no limitations on
    duration, frequency, or purpose of use, and may transfer their interest freely
key: A
explanation: The regulation defines a time sharing ownership plan as an undivided interest in the
  facilities with a right to use designated accommodations for a specific period each year, not
  necessarily consecutive, lasting more than one year. The description that mentions deeded title
  and a remainder interest to interval owners as tenants in common characterizes an interval
  ownership plan, which is not a time sharing plan.
