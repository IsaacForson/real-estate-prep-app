stem: A South Carolina resident licensee wants to pay a referral fee to a brokerage licensed in
  North Carolina that also lists and sells homes in South Carolina for commission. Under S.C. Code
  Ann. § 40-57-120(E), is this payment permitted?
options:
  - The payment is permitted because the brokerage holds a license in another state.
  - The payment is not permitted because the brokerage conducts real estate brokerage services in
    South Carolina for which a fee is paid.
  - The payment is permitted if the referral fee does not exceed fifty percent of the commission.
  - The payment is not permitted unless the resident licensee first obtains written consent from the
    commission.
key: B
explanation: The rule allows a referral fee only when the out‑of‑state brokerage does not conduct
  real estate brokerage services in South Carolina for which a fee, compensation, or commission is
  paid. The distractor "permitted because the brokerage holds a license in another state" overlooks
  the required limitation on the brokerage’s in‑state activity.
