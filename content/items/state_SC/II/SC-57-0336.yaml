stem: According to S.C. Code Ann. § 40-57-135(A)(3), what must a broker-in-charge do to prevent or
  curtail practices by a licensee that would violate the chapter?
options:
  - Review and approve all forms of listing agreements and contracts
  - Maintain adequate, reasonable, and regular contact with supervised licensees
  - Be available to the public during business hours to discuss complaints
  - Ensure supervised licensees have an active real estate license
key: B
explanation: The subsection requires the broker-in-charge to maintain adequate, reasonable, and
  regular contact with supervised licensees to prevent or curtail violations. Reviewing and
  approving forms is a separate duty under subsection (A)(2).
