stem: A provider’s enrollment agreement states the tuition amount and accepted payment methods but
  does not mention a refund policy. According to S.C. Code Ann. Regs. ch. 105, what must the
  provider do to comply?
options:
  - Add a statement that no refund policy exists in writing
  - Remove the tuition and payment details until a refund policy is created
  - Omit the refund policy entirely as it is optional
  - Provide a refund policy that matches the tuition amount
key: A
explanation: The regulation requires that if a provider has no policy for refunding fees, it must
  state that fact in writing within the enrollment agreement. Simply omitting the refund policy
  violates this requirement. Stating that a refund policy is optional and can be omitted, or
  requiring a refund policy to match the tuition amount, both add incorrect information or remove
  the required disclosure.
