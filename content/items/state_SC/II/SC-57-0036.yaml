stem: A broker-in-charge updates the office policy manual and stores it only on her
  password-protected laptop. Supervised licensees request to view the policy. According to S.C. Code
  Ann. § 40-57-135(A)(5), what must the broker-in-charge do to comply?
options:
  - Keep the policy confidential to protect firm secrets
  - Store the policy exclusively on the broker-in-charge's laptop
  - Make the policy readily accessible to supervised licensees
  - Require supervised licensees to request the policy in writing
key: C
explanation: The statute requires the broker-in-charge to establish and maintain a written office
  policy and make that policy readily accessible to supervised licensees. Storing the policy only on
  a laptop does not satisfy the accessibility requirement, keeping it confidential contradicts the
  rule, and requiring written requests for each view does not ensure ready accessibility. Therefore,
  the policy must be made readily accessible as specified.
