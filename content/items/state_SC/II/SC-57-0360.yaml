stem: A licensee commits a second violation of the same provision within a five-year period. What is
  the maximum administrative penalty that may be assessed under S.C. Code Ann. § 40-57-725(C)(2)?
options:
  - A five-hundred-dollar penalty
  - A one-thousand-dollar penalty
  - A five-thousand-dollar penalty
  - A ten-thousand-dollar penalty
key: B
explanation: According to § 40-57-725(C)(2), a second violation of the same provision within a
  five‑year period carries a maximum administrative penalty of $1,000. Thus, a one‑thousand‑dollar
  penalty is correct. A five‑hundred‑dollar penalty is reserved for a first violation, not a second.
