stem: A property manager who is directly employed by the owner of a rental property receives an
  advance rental deposit of $1,200 from a prospective tenant. Under S.C. Code Ann. §
  40-57-136(C)(1)(b), may the property manager deposit this advance rental deposit into the owner’s
  operating account?
options:
  - Deposit of the advance rental deposit into the operating account is permissible if the deposit
    is clearly identified as belonging to the owner.
  - Deposit of the advance rental deposit into the operating account is not permissible unless the
    tenant provides written consent.
  - Deposit of the advance rental deposit into the operating account is permissible because the
    property manager is employed directly by the owner.
  - Deposit of the advance rental deposit into the operating account is not permissible because an
    advance rental deposit is a trust fund.
key: D
explanation: The statute states that an advance rental deposit is a trust fund and must be treated
  as such, prohibiting its deposit into an operating account. The distractor suggesting
  permissibility due to direct employment overlooks this specific trust‑fund requirement.
