stem: Under S.C. Code Ann. § 40-57-780, what is the maximum fine that may be imposed on a real
  estate broker, associate, or property manager who fails to renew or register a license and
  continues to engage in the business?
options:
  - A fine of two hundred fifty dollars
  - A fine of one hundred dollars
  - A fine of one thousand dollars
  - A fine of five hundred dollars
key: D
explanation: The statute states that a violator 'must be fined not more than five hundred dollars'.
  Therefore the maximum allowable fine is five hundred dollars. The distractor proposing a two
  hundred fifty dollar fine is incorrect because the law sets the upper limit at five hundred
  dollars, not a lower amount.
