stem: A licensee is fined for failing to renew license. The commission attempts to collect the fine
  by placing a lien on the licensee's property without following the procedure in Section 40-1-180.
  Is this permissible under S.C. Code Ann. § 40-57-760?
options:
  - No, because fines cannot be collected after 30 days
  - Yes, as long as the licensee is notified
  - No, because collection must comply with Section 40-1-180
  - Yes, because the commission may use any collection method
key: C
explanation: Under § 40-57-760, the collection of any fine must follow the procedures in Section
  40-1-180; attempting to collect via a lien without complying with that section is not permitted.
  Therefore, the action described is not permissible.
