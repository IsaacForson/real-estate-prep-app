stem: A licensee acting as a buyer's agent anticipates possibly later acting as a disclosed dual
  agent in the same transaction. Under S.C. Code Ann. § 40-57-350, what must the licensee explain to
  the buyer about this potential later dual agency?
options:
  - That the licensee would represent clients whose interests may be adverse and that agency duties
    would be limited
  - That the licensee would definitely act as a disclosed dual agent for the buyer
  - That the licensee must obtain the buyer's written consent before any future dual agency
  - That the licensee would not be allowed to disclose any information obtained from the buyer
key: A
explanation: The statute specifies that when acting as a dual agent, the brokerage firm represents
  clients whose interests may be adverse and that agency duties are limited. This is the content
  that must be disclosed when explaining the potential for later dual agency. The option claiming a
  definite future dual agency misstates the rule, as no commitment is required at the disclosure
  stage.
