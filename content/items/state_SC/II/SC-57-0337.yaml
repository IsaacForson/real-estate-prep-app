stem: A broker-in-charge receives a new purchase contract template from an associate and intends to
  use it for upcoming transactions. What must the broker-in-charge do under S.C. Code Ann. §
  40-57-135(A)(2) before the template can be used?
options:
  - Review and approve the purchase contract template
  - Use the template immediately if it resembles prior forms
  - Delegate the review to an unlicensed office assistant
  - Use the template without review for internal training only
key: A
explanation: Subsection (A)(2) mandates that the broker-in-charge review and approve all forms
  routinely used by the firm before use. Using the template immediately or delegating review to an
  unlicensed assistant does not satisfy this requirement.
citation:
  source: S.C. Code Ann. § 40-57-135(A)(2)
  url: null
  quoted_text: (2) review and approve all forms of listing agreements, agency agreements, offers, sale
    contracts, purchase contracts, leases, options, contract addenda, or other contractual or
    disclosure documents routinely used by the real estate brokerage firm;
