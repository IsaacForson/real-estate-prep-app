stem: Under S.C. Code Ann. § 40-57-740(A)(3), which of the following off-site conditions does
  **NOT** give rise to a cause of action against an owner of real estate for failure to disclose?
options:
  - An off-site condition that directly impacts the property being transferred (e.g., a neighboring
    landfill causing subsidence that damages the foundation)
  - An off-site condition that does not directly impact the property being transferred (e.g., a
    distant highway whose noise is not audible on the property)
  - An off-site condition that directly impacts the property being transferred (e.g., a nearby
    factory emitting chemicals that contaminate groundwater under the property)
  - An off-site condition that directly impacts the physical condition of the property being
    transferred (e.g., a leaking septic tank from an adjacent property seeping onto the land)
key: B
explanation: Subsection (A)(3) exempts off‑site conditions or hazards that do not directly impact
  the property being transferred, so the statement describing an off‑site condition that does not
  directly impact the property identifies an exempt condition. The statement describing an off‑site
  condition that directly impacts the property (for example, a neighboring landfill causing
  subsidence that damages the foundation) removes the exemption and therefore would give rise to a
  cause of action.
