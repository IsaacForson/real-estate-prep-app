stem: A licensee’s license was revoked on March 5, 2024, and the revocation is not permanent.
  Assuming all other requirements are met, what is the earliest date the licensee may reapply for a
  license?
options:
  - March 5, 2026
  - March 5, 2025
  - March 5, 2028
  - March 5, 2027
key: D
explanation: The statute bars reapplication for three years from the date of revocation unless the
  revocation is expressly made permanent. Adding three years to March 5, 2024 yields March 5, 2027
  as the earliest permissible reapplication date. March 5, 2026 reflects only two years, while March
  5, 2028 exceeds the three‑year period.
