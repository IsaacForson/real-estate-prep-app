stem: In June 2028, a broker-in-charge creates a team advertisement where the team name is displayed
  in 24-point font and the brokerage firm name is displayed in 10-point font. Under S.C. Code Ann. §
  40-57-360(D), is this advertisement permissible?
options:
  - The advertisement is not permissible because the team name must be exactly the same size as the
    brokerage firm name.
  - The advertisement is permissible because the brokerage firm name is still present.
  - The advertisement is not permissible because the team name exceeds twice the size of the
    brokerage firm name.
  - The advertisement is permissible because the team name is larger but still visible.
key: C
explanation: The rule provides that in all team advertising and marketing, the team name may not be
  more than twice the size, prominence, or frequency of the full name of the brokerage firm. A
  24-point team name is 2.4 times the 10-point firm name, exceeding the allowed limit. The
  distractor claiming permissibility due to visibility is incorrect because the size restriction is
  absolute regardless of visibility.
