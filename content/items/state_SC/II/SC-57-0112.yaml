stem: Under S.C. Code Ann. § 40-57-120(C)(1), within how many days must a resident licensee who
  becomes a nonresident notify the commission in writing of the change in residency?
options:
  - Sixty days
  - Thirty days
  - Twenty days
  - Ten days
key: B
explanation: The rule requires a resident licensee who becomes a nonresident to notify the
  commission within thirty days of the change in residency. The distractor "Ten days" incorrectly
  applies the office‑address change deadline from § 40-57-135(A)(8) to residency changes.
