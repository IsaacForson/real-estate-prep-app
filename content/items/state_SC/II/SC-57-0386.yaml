stem: Under S.C. Code Ann. § 40-57-136(B)(3), a broker-in-charge may maintain a clearly identified
  amount of the company's funds in the trust account for which two purposes?
options:
  - To cover bank service charges or to earn interest on funds
  - To cover bank service charges or to avoid closing the account
  - To cover bank service charges or to pay the personal expenses
  - To avoid closing the account or to pay the office rent
key: B
explanation: Under S.C. Code Ann. § 40-57-136(B)(3), a broker‑in‑charge may retain a clearly
  identified amount of the company’s funds in the trust account solely to cover bank service charges
  or to avoid the account being closed when no client trust funds are on deposit. Keeping the funds
  to earn interest, to pay personal expenses, or to pay office rent is not authorized by this
  provision.
