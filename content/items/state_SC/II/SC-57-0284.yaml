stem: A provider renewed their license on January 1, 2023. As of July 1, 2024, has the provider met
  the biennial renewal requirement under S.C. Code Ann. § 40-57-930(A)?
options:
  - No, because the provider must renew annually.
  - Yes, because exactly one year has passed since the last renewal.
  - No, because less than two years have passed since the last renewal.
  - Yes, because more than two years have passed since the last renewal.
key: C
explanation: Biennial renewal means every two years; less than two years have elapsed from January
  1, 2023 to July 1, 2024, so the provider is not yet required to renew again. The claim that more
  than two years have passed is false.
