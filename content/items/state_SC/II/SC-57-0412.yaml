stem: After an investigation, the South Carolina Real Estate Commission determines that a licensee
  must pay costs for the investigation. According to S.C. Code Ann. § 40-57-750, with which section
  must the payment and collection of these costs comply?
options:
  - Section 40-1-190
  - Section 40-1-170
  - Section 40-1-160
  - Section 40-1-180
key: B
explanation: The statute explicitly states that payment and collection of investigation costs must
  comply with Section 40-1-170, making that the correct answer. Section 40-1-180 governs the
  imposition and collection of costs and fines, not investigation costs, so it is incorrect.
