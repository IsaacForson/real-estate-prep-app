stem: A supervised licensee creates a single-member LLC to receive referral fees from a mortgage
  broker. The licensee's broker-in-charge agrees to pay the commission to the LLC. The LLC's sole
  member is the licensee, who holds an active real estate license. Under S.C. Code Ann. §
  40-57-135(B), is this arrangement permissible?
options:
  - The arrangement is permissible because the licensee is the sole principal and holds an active
    license.
  - The arrangement is impermissible because supervised licensees cannot receive compensation from
    any other entity.
  - The arrangement is impermissible because the LLC must have at least two licensed principals.
  - The arrangement is impermissible because the broker-in-charge cannot pay fees to a business
    entity.
key: A
explanation: Section 40-57-135(B) allows a supervised licensee to form a business entity that can
  receive fees or commissions from the broker-in-charge if the principals in that entity hold an
  active real estate license. Here the licensee is the sole principal and is licensed, so the
  arrangement is permitted. The incorrect options misstate the rule by ignoring the
  principal‑license exception or overstating the prohibition.
citation:
  source: S.C. Code Ann. § 40-57 (Title 40, ch. 57 — Real Estate Brokers, Brokers-in-Charge,
    Associates, and Property Managers) — South Carolina Code of Laws Title 40, Chapter 57 — Real
    Estate Brokers, Brokers-in-Charge, Associates, and Property Managers — § 40-57-135
  url: null
  quoted_text: A supervised licensee may not receive compensation from an activity requiring a real
    estate license from an entity or person other than the one for which the license is issued. A
    supervised licensee may form a business entity allowing the licensee's broker-in-charge or
    property manager-in-charge to pay fees or commissions to that entity if the principals in that
    entity hold an active real estate license.
