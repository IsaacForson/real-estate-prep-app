stem: A broker offers to pay a finder's fee to a neighbor who is unlicensed and not a party to the
  sale for referring a buyer. Under S.C. Code Ann. § 40-57-710, is this payment permitted?
options:
  - No, because the neighbor is unlicensed and not a party to the sale
  - Yes, because referral fees are unregulated under this chapter
  - No, because referral fees may be paid solely to licensed sellers
  - Yes, because the neighbor personally introduced the buyer to the firm
key: A
explanation: The statute prohibits a licensee from paying or offering to pay a referral fee or
  finder's fee to an unlicensed individual who is not a party in the real estate sales or rental
  transaction.
