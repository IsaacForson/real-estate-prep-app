stem: A broker-in-charge receives an earnest money deposit from a buyer and deposits the funds into
  the brokerage's operating account. Under S.C. Code Ann. § 40-57-135(A)(7), is this permissible?
options:
  - Depositing the earnest money into the operating account is permissible because the funds are
    held for less than 24 hours
  - Depositing the earnest money into the operating account is permissible if the broker-in-charge
    reconciles the account monthly
  - Depositing the earnest money into the operating account is not permissible because trust funds
    must be deposited in an active trust account
  - Depositing the earnest money into the operating account is permissible if the broker-in-charge
    obtains written consent from the buyer
key: C
explanation: S.C. Code Ann. § 40-57-135(A)(7) requires a broker‑in‑charge to keep any trust funds
  belonging to others in an active trust account that the broker controls. Earnest money is a trust
  fund, so it must be placed in that trust account. The operating account cannot be used, even for a
  short period, even if the broker reconciles the account monthly, or even if the buyer gives
  written consent. Therefore the statement that depositing the earnest money into the operating
  account is not permissible because trust funds must be deposited in an active trust account is the
  correct choice.
