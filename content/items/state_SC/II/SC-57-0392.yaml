stem: Under S.C. Code Ann. § 40-57-710(A)(15), a licensee may receive compensation from more than
  one party in a real estate transaction if which condition is met?
options:
  - Full knowledge and written disclosure to all parties
  - Approval from the broker-in-charge only
  - Disclosure to the commission within ten days
  - Written consent from the buyer and seller
key: A
explanation: The rule explicitly allows compensation from more than one party when the licensee
  provides full knowledge and written disclosure to all parties. The distractor suggesting approval
  from the broker-in-charge is incorrect because the statute does not require broker-in-charge
  approval for this exemption.
