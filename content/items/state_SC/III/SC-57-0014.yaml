stem: A buyer contacts a real estate brokerage firm for the first time but has not signed any agency
  agreement. Under S.C. Code Ann. § 40-57-370, what is presumed about the buyer's status?
options:
  - The buyer is a customer served as a transaction broker
  - The buyer is a designated agency client of the firm
  - The buyer is a client represented under an exclusive buyer agency
  - The buyer is a disclosed dual agency client of the firm
key: A
explanation: The statute presumes at first substantive contact that the potential buyer or seller is
  a customer of the real estate brokerage firm and that the firm will act as a transaction broker.
citation:
  source: S.C. Code Ann. § 40-57-370
  url: null
  quoted_text: At the time of first substantive contact, it is presumed that the potential buyer or
    seller is to be a customer of the real estate brokerage firm and that the real estate brokerage
    firm will be acting as a transaction broker as defined by this chapter
