stem: A broker terminates an agency agreement with a seller after closing. The broker later receives
  a request from the buyer for the seller's confidential motivation to sell, which was made
  confidential by the seller. May the broker disclose this information to the buyer under S.C. Code
  Ann. § 40-57-380?
options:
  - The broker may disclose the information because the buyer requested it and the seller’s
    motivation is no longer confidential, even though the duty of confidentiality still applies.
  - The broker may not disclose the information because the duty of confidentiality continues after
    termination unless an exception applies.
  - The broker may disclose the information after obtaining verbal permission from the seller,
    although written agreement is required for an exception.
  - The broker may disclose the information if the broker believes it will help close the
    transaction, despite the ongoing confidentiality obligation after termination.
key: B
explanation: "Under S.C. Code Ann. § 40-57-380, the duty of confidentiality that a broker owes to a
  client continues after the agency agreement ends, and the broker may disclose confidential
  information only if the client gives written permission, disclosure is required by law, it is
  necessary to defend the licensee against an accusation of wrongful conduct, or the information
  becomes public from another source. In this situation, none of those exceptions apply: the buyer’s
  request does not constitute client consent, verbal permission does not satisfy the
  written‑agreement requirement, and the broker’s belief that disclosure will help close the
  transaction is not a legal exception. Therefore the broker must keep the seller’s motivation
  confidential and may not share it with the buyer."
