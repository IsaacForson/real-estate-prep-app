stem: A listing agreement has expired and the transaction has closed. Under S.C. Code Ann. §
  40-57-380, which duty does the licensee still owe to the former client?
options:
  - Presenting new offers received after the closing date
  - Continuing to seek additional offers on the client's behalf
  - Accounting for money and property already received
  - Advising the client on matters beyond the licensee's expertise
key: C
explanation: The statute states that a real estate broker and supervised licensees owe no duty to a
  former client after termination or closing except accounting in a timely manner for all money and
  property received during the relationship.
