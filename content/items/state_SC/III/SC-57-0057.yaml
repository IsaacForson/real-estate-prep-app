stem: Which of the following is **NOT** a duty owed by a real estate brokerage firm to its client
  under S.C. Code Ann. § 40-57-350(A)?
options:
  - Obedience
  - Loyalty
  - Marketing
  - Disclosure
key: C
explanation: The statute lists loyalty, obedience, disclosure, confidentiality, reasonable care,
  diligence, and accounting as duties owed to a client. Marketing is not among those duties.
  Therefore, Marketing is not a required duty.
