stem: Under S.C. Code Ann. § 40-57-350(B), which of the following must be included in the
  broker-in-charge's written company policy?
options:
  - The scope of services provided to customers
  - The firm's advertising budget
  - A list of all licensed affiliates
  - A statement of the firm's commission splits
key: A
explanation: The statute requires the written company policy to include the scope of services
  provided to the firm's customers. The other options are not mentioned as required components of
  the policy.
