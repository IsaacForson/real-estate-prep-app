stem: A broker-in-charge assigns one supervised licensee to represent the buyer and a different
  supervised licensee to represent the seller in the same transaction, each acting exclusively for
  their own client. Which brokerage relationship under S.C. Code Ann. § 40-57-350 does this
  describe?
options:
  - Disclosed dual agency
  - Transaction brokerage
  - Designated agency
  - Cooperating subagency
key: C
explanation: The statute describes designated agency as arising when a broker-in-charge specifically
  designates one or more supervised licensees to act as agent of the buyer client or seller client
  to the exclusion of all other supervised licensees.
citation:
  source: S.C. Code Ann. § 40-57-350
  url: null
  quoted_text: A broker-in-charge may personally, or through the broker's duly authorized real
    estate-licensed representative, specifically designate one or more supervised licensees who will
    be acting as agent of the buyer client or seller client to the exclusion of all other supervised
    licensees.
