stem: A listing agent wants to personally purchase a property that the agent currently has listed.
  Under S.C. Code Ann. § 40-57-135, what must the licensee do first?
options:
  - Disclose the true position in writing to all parties
  - Transfer the listing to another licensee in the firm
  - Wait until the listing agreement expires to purchase
  - Obtain a written waiver of conflict from the broker-in-charge
key: A
explanation: The statute prohibits a licensee from buying real estate he has listed for his own
  account without first making his true position clearly known in writing to all parties involved.
citation:
  source: S.C. Code Ann. § 40-57-135
  url: null
  quoted_text: No licensee, either directly or indirectly, may buy for his own account or for a
    corporation or another business in which he holds an interest or for a close relative, real
    estate listed with him or real estate for which he has been approached by the seller or
    prospective buyer to act as agent, without first making his true position clearly known in
    writing to all parties involved.
