stem: A broker-in-charge wishes to assign a supervised licensee to act as the designated agent for a
  buyer in a transaction. According to S.C. Code Ann. § 40-57-350(J)(2), what must occur before the
  licensee can begin acting as the designated agent?
options:
  - The licensee may act immediately after receiving verbal approval from the broker-in-charge and
    recording that approval in the office policy manual for future reference.
  - The buyer and seller must give informed consent evidenced by a designated agency agreement
    signed by the buyer before writing an offer and by the seller before signing the sales
    agreement.
  - The designated agent must first complete a dual agency agreement with both parties and obtain
    their signatures before proceeding with any representation or providing any confidential
    information.
  - The broker-in-charge may assign the licensee without any consent if the company policy permits
    and the assignment is documented in the firm's official records for compliance purposes.
key: B
explanation: The statute requires informed consent from both buyer and seller, evidenced by a signed
  designated agency agreement with the buyer signing before writing an offer and the seller signing
  before the sales agreement. Acting without this consent, relying solely on verbal approval, or
  using a dual agency agreement does not satisfy the requirement.
citation:
  source: S.C. Code Ann. § 40-57-350(J)(2)
  url: null
  quoted_text: Buyers and sellers shall give informed consent to enter into designated agency
    relationships. The informed consent must be evidenced by a designated agency agreement
    promulgated by the commission, and must be signed by the buyer before writing the offer and by
    the seller before signing the sales agreement.
