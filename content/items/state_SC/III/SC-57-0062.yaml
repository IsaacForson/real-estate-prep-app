stem: Under S.C. Code Ann. § 40-57-380, which two duties does a broker owe to a client after the
  termination of an agency agreement?
options:
  - The broker must refund any earnest money received, obtain a signed release of liability from the
    client, continue to market the property as if the agency agreement were still in effect, and
    advise the client on any subsequent real estate transactions that may arise.
  - The broker must provide a written accounting of all trust funds received during the relationship
    and disclose any confidential information to the client’s attorney unless the client consents in
    writing or disclosure is required by law.
  - The broker must maintain the listing agreement in force, negotiate any future offers on behalf
    of the client, ensure all closing documents are delivered to the client’s representative, and
    provide periodic updates on market conditions affecting the property.
  - The broker must account in a timely manner for all money and property related to and received
    during the relationship and keep confidential all information received during the course of the
    engagement which was made confidential by request or instructions from the client.
key: D
explanation: "Under S.C. Code Ann. § 40-57-380, after an agency agreement ends a broker owes only
  two duties: to account promptly for all money and property received during the relationship, and
  to keep confidential any information that the client made confidential by request or instruction.
  The correct option states both of these duties exactly. The other options either add duties not
  required by the statute (such as refunding earnest money, obtaining a release, continuing to
  market, providing updates, negotiating future offers, delivering closing documents, or disclosing
  confidential information to an attorney) or misstate the duties, making them incorrect."
citation:
  source: S.C. Code Ann. § 40-57-380
  url: null
  quoted_text: "A real estate broker and all supervised licensees owe no duty or obligation to a
    client following termination, expiration, completion, or performance of an agency agreement or
    closing of the real property transaction, whichever occurs first, except the duties of: (1)
    accounting in a timely manner for all money and property related to and received during the
    relationship; and (2) keeping confidential all information received during the course of the
    engagement which was made confidential by request or instructions from the client"
