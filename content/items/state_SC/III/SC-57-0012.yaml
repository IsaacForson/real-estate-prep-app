stem: Which term defined in S.C. Code Ann. § 40-57-30 describes an act performed by a licensee for a
  nonclient that does **NOT** involve discretion or judgment?
options:
  - Substantive contact
  - Material adverse fact
  - Ministerial act
  - Agency relationship
key: C
explanation: The statute defines a ministerial act as an act performed by a licensee not involving
  an exercise of discretion or judgment on behalf of a person who is not a client, that assists the
  nonclient to consummate a real estate transaction.
