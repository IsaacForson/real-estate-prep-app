stem: A buyer's agent represents two clients who both want to make offers on the same property.
  Under S.C. Code Ann. § 40-57-350, what must the agent do?
options:
  - Withdraw from representing both buyer clients immediately
  - Obtain a designated agency agreement signed by the seller
  - Convert the representation to a disclosed dual agency
  - Give written notice of the confidentiality limits
key: D
explanation: The statute requires that if a licensee has two competing buyer clients in a single
  transaction, the agent must give written notice to each buyer client that neither will receive the
  confidential information of the other.
