stem: Taylor uses a licensee's services to view homes but has not signed any written agency
  agreement. Under S.C. Code Ann. § 40-57-30, how is Taylor classified?
options:
  - Is considered a client
  - Is considered a customer
  - Is considered an agent
  - Is considered a subagent
key: B
explanation: A customer is defined as a buyer, seller, landlord, or tenant who uses a licensee’s
  services without a written agency agreement. Since Taylor has no written agreement, Taylor is a
  customer. The option stating that Taylor is considered a client is incorrect because a client
  requires a written agreement establishing an agency relationship.
