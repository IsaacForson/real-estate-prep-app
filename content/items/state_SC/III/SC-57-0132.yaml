stem: A seller's agent has a written agency agreement and the property is currently under contract.
  According to S.C. Code Ann. § 40-57-350(C)(1)(b)(ii), what must the agent do regarding written
  offers and counteroffers received from any party?
options:
  - Must present them in a timely manner to the seller;
  - Must seek additional offers before presenting any received offers;
  - Must ignore any offers that are lower than the contract price;
  - Must wait until the contract closes before presenting any offers;
key: A
explanation: The rule states that a seller's agent must present all written offers and counteroffers
  in a timely manner to the seller, even when the property is subject to a contract of sale.
  Waiting, seeking additional offers, or ignoring lower offers would violate this duty.
