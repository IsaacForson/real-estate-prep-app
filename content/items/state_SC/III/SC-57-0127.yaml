stem: A licensee receives a promise of payment from a seller for future services but no written
  agency agreement is signed. Under S.C. Code Ann. § 40-57-370(F), what effect does this promise
  have on the existence of an agency relationship?
options:
  - It creates a client relationship but not a customer relationship
  - It does not determine whether an agency relationship has been created
  - It creates an agency relationship only if the payment is actually made
  - It automatically creates an agency relationship
key: B
explanation: Subsection (F) states that the payment or promise of payment of compensation does not
  determine whether an agency relationship has been created between a licensee and a party.
  Therefore, the promise alone does not establish an agency relationship. The other options
  incorrectly suggest that payment or promise creates or influences the relationship.
citation:
  source: S.C. Code Ann. § 40-57-370(F)
  url: null
  quoted_text: The payment or promise of payment of compensation to a real estate brokerage firm by a
    seller, buyer, landlord, or tenant does not determine whether an agency relationship has been
    created between a real estate licensee and a seller, buyer, landlord, or tenant.
