stem: A seller tells a licensee over the phone, without signing anything, that the licensee should
  act as the seller's agent. Applying S.C. Code Ann. § 40-57-370, has an agency relationship been
  created?
options:
  - Yes, because first substantive contact automatically creates agency
  - No, because agency relationships may not be created orally
  - No, because buyer agency requires separate written consent
  - Yes, because the seller's verbal statement is sufficient to create agency
key: B
explanation: The statute states that no agency relationship exists unless the parties agree in
  writing, and that no type of agency relationship may be assumed or created orally or by
  implication.
citation:
  source: S.C. Code Ann. § 40-57-370
  url: null
  quoted_text: No type of agency relationship may be assumed by a buyer, seller, landlord, tenant, or
    licensee or created orally or by implication.
