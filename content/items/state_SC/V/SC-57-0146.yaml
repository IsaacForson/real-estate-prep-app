stem: A broker-in-charge uses a computerized system to maintain trust account records. According to
  South Carolina law, where must the backup copy of these records be stored?
options:
  - On the broker-in-charge's personal computer
  - In a cloud-based service without geographic restrictions
  - On a data storage medium stored in a separate off-site location
  - In the same office as the original records
key: C
explanation: South Carolina Code Ann. § 40-57-136 requires that backup copies for computerized real
  estate trust accounts be maintained on a data storage medium stored in a separate off-site
  location. Storing the backup on a personal computer, in a cloud service without geographic
  restrictions, or in the same office as the original records does not meet the statutory
  requirement for a separate off-site location.
