stem: A licensee receives a written purchase offer from a buyer. According to South Carolina law,
  what must the licensee do first?
options:
  - The licensee must prepare the offer in writing and promptly present it to the seller
  - The licensee must immediately deposit the earnest money into the brokerage trust account
  - The licensee must obtain a signed listing agreement from the seller before showing the property
  - The licensee must provide the buyer with a property disclosure form prior to signing the contract
key: A
explanation: The correct answer is to prepare the offer in writing and promptly present it to the
  seller, as required by subsection (H)(1) which states that upon receipt, the licensee must prepare
  all offers in writing and promptly present them to the seller. The distractor about immediately
  depositing earnest money is incorrect because the statute does not require immediate deposit;
  trust deposit rules are separate and not the first step after receiving an offer.
