stem: Under South Carolina law, what type of financial institution must hold a real estate trust account?
options:
  - A federal savings association without deposit insurance
  - Any bank operating in the state regardless of federal insurance
  - An insured financial institution authorized to conduct business in South Carolina
  - A state-chartered credit union that is not federally insured
key: C
explanation: "S.C. Code Ann. § 40-57-136 requires that a trust account be a demand deposit account
  located in an insured financial institution authorized to conduct business in South Carolina. The
  option describing a federal savings association without deposit insurance fails because it lacks
  the required insurance. The option describing any bank regardless of federal insurance is
  incorrect because the statute specifically mandates that the institution be insured. The option
  describing a state-chartered credit union that is not federally insured is also incorrect for the
  same reason: it does not meet the insurance requirement set by the statute."
