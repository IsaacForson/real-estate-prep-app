stem: "Under South Carolina Code § 40-57-710(A)(28), a licensee may be subject to disciplinary
  action for:"
options:
  - Accepting a deposit without informing the payor of the identity of the person who will hold the
    funds
  - Failing to promptly submit all offers and counteroffers to the client in a sales transaction
  - Creating an unreasonable delay in closing due solely to a dispute among licensees concerning the
    division of a commission
  - Failing to deposit trust funds into the escrow account within a reasonable time after receipt
key: C
explanation: The correct answer is the option that describes creating an unreasonable delay in
  closing due solely to a dispute among licensees concerning the division of a commission, which is
  prohibited by subsection (A)(28). The option about failing to deposit trust funds within a
  reasonable time corresponds to subsection (A)(11). The option about accepting a deposit without
  informing the payor who will hold the funds corresponds to subsection (A)(18). The option about
  failing to promptly submit all offers and counteroffers in a sales transaction corresponds to
  subsection (A)(26).
