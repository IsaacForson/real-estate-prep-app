    Estate Brokers, Brokers-in-Charge, Associates, and Property Managers — § 40-57-135(C)(2)
  url: null
  quoted_text: The same person may request to be licensed as broker-in-charge or property
    manager-in-charge of more than one office if the broker-in-charge or property manager-in-charge
    making the request acknowledges in writing that the applicant understands the duties and can
    fully assume the responsibility to ensure compliance with this chapter.
