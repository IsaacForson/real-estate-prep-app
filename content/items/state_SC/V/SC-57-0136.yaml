stem: A broker-in-charge wants to be the broker-in-charge for two different office locations of the
  same brokerage firm. According to South Carolina law, what must the broker-in-charge do to be
  licensed for both offices?
options:
  - Obtain a separate license
  - Provide written acknowledgment
  - Submit a new application form
  - Complete extra education hours
key: B
explanation: The law allows the same person to be licensed as broker-in-charge of more than one
  office if they acknowledge in writing that they understand the duties and can fully assume
  responsibility. This written acknowledgment is the required step. Simply obtaining another license
  or completing education does not satisfy the provision.
citation:
