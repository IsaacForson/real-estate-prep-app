stem: Under South Carolina law, within how many days must a licensee report to the commission in
  writing by certified mail notice of a criminal conviction?
options:
  - 5 days
  - 10 days
  - 15 days
  - 7 days
key: B
explanation: The statute provides that a licensee who fails to report to the commission in writing
  by certified mail, within ten days, notice of conviction of a crime may be disciplined. Therefore,
  the correct reporting period is ten days. The distractor of five days is incorrect because the law
  specifies ten days, not a shorter period.
