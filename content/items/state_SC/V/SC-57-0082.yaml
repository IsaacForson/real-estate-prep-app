stem: A licensee receives an earnest money deposit from a buyer and places it in his personal
  account, telling the buyer only that the funds are safe, without providing written acknowledgment
  of who will hold the money. Under South Carolina law, this conduct may result in disciplinary
  action because it violates which provision?
options:
  - Failing to deposit trust funds received from a buyer into an escrow or trust account within a
    reasonable time after receipt
  - Failing to promptly submit all offers and counteroffers received from the seller or buyer to the
    other party in a sales transaction
  - Accepting deposit money without informing the payor and having the payor acknowledge in writing
    who will hold the money
  - Creating an unreasonable delay in closing due solely to a dispute among licensees concerning the
    division of a commission
key: C
explanation: "Placing earnest money in a personal account and only telling the buyer the funds are
  safe, without obtaining a written acknowledgment of who will hold the money, violates the rule
  that requires informing the payor and having the payor acknowledge in writing who will hold
  deposit money (S.C. Code Ann. § 40-57-710(A)(18)). The other choices describe different
  violations: failing to deposit trust funds within a reasonable time, creating unreasonable delay
  due solely to a commission dispute among licensees, and failing to promptly submit offers and
  counteroffers, none of which match the described conduct."
