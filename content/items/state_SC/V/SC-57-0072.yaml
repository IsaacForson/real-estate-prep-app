stem: A licensee is acting as a buyer's agent in a personal transaction to purchase a property for
  themselves. According to South Carolina law, where must the licensee deposit any trust funds
  received from the transaction?
options:
  - The licensee must deposit trust funds received in a personal transaction into the brokerage
    firm's trust account
  - The licensee must deposit trust funds received in a personal transaction into the licensee's
    personal trust account
  - The licensee must deposit trust funds received in a personal transaction into a separate
    business account
  - The licensee must deposit trust funds received in a personal transaction into an escrow account
    held by the title company
key: B
explanation: The correct answer is the licensee's personal trust account because subsection (F)(2)
  mandates that trust funds from a licensee's personal rental or transaction be deposited in the
  licensee's personal trust account and may not be placed in the brokerage firm's trust account
  unless the property is managed, listed, or owned by the firm. The distractor suggesting the
  brokerage firm's trust account is incorrect as it violates this prohibition for personal
  transactions.
citation:
  source: S.C. Code Ann. § 40-57-135(F)(2)
  url: null
  quoted_text: Trust funds received in a licensee's personal rental or transaction must be deposited
    in the licensee's personal trust account and may not be deposited in the real estate brokerage
    firm's trust account unless the real property is managed, listed, or owned by the real estate
    brokerage firm.
