stem: A broker‑in‑charge receives an offer to purchase a property that is later rejected by the
  seller. According to South Carolina law, what may the broker‑in‑charge do with the earnest money
  held in the trust account?
options:
  - Hold the funds until the parties reach a written agreement.
  - Disburse the funds to the appropriate party as directed by the contract.
  - Transfer the funds to the broker‑in‑charge’s personal account to cover bank fees.
  - Return the funds to the buyer only after a court order is issued.
key: B
explanation: Under S.C. Code Ann. § 40-57-136(D)(2)(a), a broker‑in‑charge who disburses trust funds
  upon rejection of an offer is considered to have properly fulfilled the duty to the account.
  Therefore the broker‑in‑charge may disburse the funds as the contract directs. Holding the funds
  until a written agreement is unnecessary because rejection triggers a proper disbursement event.
