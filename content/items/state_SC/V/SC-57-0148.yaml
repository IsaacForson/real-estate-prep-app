stem: A property manager receives a cash security deposit from a tenant on Monday morning. According
  to South Carolina law, by what deadline must the cash be deposited into the trust account?
options:
  - By the end of Thursday.
  - By the end of Friday.
  - By the end of Tuesday.
  - By the end of Wednesday.
key: D
explanation: The rule in S.C. Code Ann. § 40-57-136(C)(1)(a)(i) requires cash or certified funds to
  be deposited within forty‑eight hours of receipt, excluding Saturday, Sunday, and bank holidays. A
  deposit received Monday morning must be deposited by the end of Wednesday, assuming no intervening
  bank holidays. The Tuesday option is too early because it does not allow the full forty‑eight‑hour
  period.
