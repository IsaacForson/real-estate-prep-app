stem: Under South Carolina law, within how many days must a broker‑in‑charge notify the commission
  of a change in office address, email address, or telephone number?
options:
  - Fifteen working days
  - Five business days
  - Ten calendar days
  - Thirty calendar days
key: C
explanation: A broker‑in‑charge must notify the commission by mail within ten calendar days after
  any change of office name, address, email address, or telephone number. S.C. Code Ann.
  § 40‑57‑135(A)(8) sets the period at ten days; a longer period is not required.
