stem: A broker is renewing their license for the sixth time. According to S.C. Code Ann. §
  40-57-340(A)(1), must the broker submit to a criminal background check as part of this renewal?
options:
  - The broker must not submit to a criminal background check because they have already completed
    one in the previous renewal.
  - The broker must submit to a criminal background check because this is the sixth renewal, which
    is a multiple of three.
  - The broker must submit to a criminal background check only if they have changed their contact
    information.
  - The broker must not submit to a criminal background check because checks are required only on
    the first renewal.
key: B
explanation: The rule requires a criminal background check upon every third renewal (i.e., renewals
  3, 6, 9, …). Since this is the sixth renewal, the broker must submit to the check. The distractor
  stating checks are required only on the first renewal misstates the frequency requirement.
