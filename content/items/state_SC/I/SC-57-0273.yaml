stem: Which of the following correctly defines an 'associate' under S.C. Code Ann. § 40-57-30(5)?
options:
  - A supervised licensee who has passed both state and national portions of the associate license
    examination but does not engage in broker activities for compensation
  - A supervised licensee who engages in broker activities for a fee or with the intent of receiving
    compensation but lacks the required experience and education
  - A supervised licensee who meets experience and education requirements but has not passed the
    associate license examination
  - A supervised licensee who meets experience and education requirements, passed the associate
    license examination, and engages in broker activities for compensation
key: D
explanation: >-
  Under S.C. Code Ann. § 40-57-30(5), an associate is a supervised licensee who (1) meets the
  experience and education requirements, (2) passes both the state and national portions of the
  associate license examination, and (3) engages in broker activities for a fee, salary, commission,
  or other valuable consideration, or with the intent or expectation of receiving compensation.


  The first wrong option describes a licensee who has passed the examination but does not engage in
  broker activities for compensation, so it fails the third requirement.


  The second wrong option describes a licensee who engages in broker activities for compensation but
  lacks the required experience and education, so it fails the first requirement.


  The third wrong option describes a licensee who meets experience and education requirements but
  has not passed the examination, so it fails the second requirement.
