stem: A licensee meets a prospective buyer at an open house, provides a meaningful explanation of
  brokerage relationships, but does not provide the Disclosure of Brokerage Relationships form.
  According to S.C. Code Ann. § 40-57-370(A), is the licensee in compliance with the disclosure
  requirement?
options:
  - The licensee's action is noncompliant because the Disclosure of Brokerage Relationships form was
    omitted
  - The licensee's action is noncompliant because the meaningful explanation of brokerage
    relationships was omitted
  - The licensee's action is compliant because a meaningful explanation of brokerage relationships
    was provided
  - The licensee's action is compliant because both the explanation and the form were provided
key: A
explanation: The rule requires both a meaningful explanation of brokerage relationships and the
  Disclosure of Brokerage Relationships form at first practical opportunity; omitting the form
  results in noncompliance. The distractor claiming compliance because the explanation was provided
  is wrong because the form is also mandatory.
