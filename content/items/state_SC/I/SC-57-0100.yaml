stem: A broker-in-charge changes her office email address. According to S.C. Code Ann. §
  40-57-135(A)(8), what must she do?
options:
  - Notify the commission by mail within ten days of the change.
  - Notify the commission by mail only if the telephone number changes.
  - No notification is required for email address changes.
  - Notify the commission by mail within thirty days of the change.
key: A
explanation: Subsection (A)(8) mandates that a broker-in-charge notify the commission by mail within
  ten days of any change to office name, address, email address, or telephone number. The distractor
  suggesting a thirty‑day window is incorrect because the rule specifies ten days, and the other
  distractors either limit the trigger to telephone changes or claim no notification is needed.
