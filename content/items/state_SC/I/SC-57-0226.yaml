stem: "Under S.C. Code Ann. § 40-57-30(28), a personal trust account is:"
options:
  - An escrow account or demand deposit bank account properly designated and titled to include the
    words "trust" or "escrow" that is established and maintained by a licensee to safeguard funds
    belonging to parties to any real estate transaction
  - An escrow account or demand deposit bank account properly designated and titled to include the
    words "trust" or "escrow" that is established and maintained by a licensee to safeguard funds
    belonging to parties to a real estate transaction when the transaction involves the licensee's
    personal real estate and the real estate is not managed or listed through a real estate
    brokerage firm
  - An escrow account or demand deposit bank account properly designated and titled to include the
    words "trust" or "escrow" that is established and maintained by a licensee to safeguard funds
    belonging to parties to a real estate transaction when the transaction involves the licensee's
    personal real estate and the real estate is managed through a real estate brokerage firm
  - An escrow account or demand deposit bank account properly designated and titled to include the
    words "trust" or "escrow" that is established and maintained by a broker-in-charge to safeguard
    funds belonging to parties to a real estate transaction
key: B
explanation: The definition in S.C. Code Ann. § 40-57-30(28) requires that a personal trust account
  be established by a licensee for the licensee's own personal real estate that is not managed or
  listed through a brokerage firm. The option that matches this description is the one specifying
  the licensee's personal real estate and the non‑brokerage condition. The other options are
  incorrect because they either omit the limitation to the licensee's personal real estate, apply to
  all real estate transactions, or designate the broker‑in‑charge as the account holder, which does
  not satisfy the statutory definition.
