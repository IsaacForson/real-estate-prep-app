stem: "Under S.C. Code Ann. § 40-57-30(7), a broker-in-charge who delegates trust‑account
  reconciliation to an unlicensed assistant:"
options:
  - The broker‑in‑charge may delegate the task as long as the assistant is supervised by a licensed
    salesperson.
  - The broker‑in‑charge must obtain written permission from the commission before delegating any
    trust‑account duties.
  - The broker‑in‑charge is no longer liable for the trust account because the task was delegated.
  - The broker‑in‑charge remains liable for the trust account and may not delegate authority over it.
key: D
explanation: Under S.C. Code Ann. § 40‑57‑30(7) the broker‑in‑charge retains control and liability
  for the trust account and the authority granted cannot be assigned to another licensee.
  Consequently, delegating reconciliation to an unlicensed assistant does not relieve the
  broker‑in‑charge of liability, and the broker‑in‑charge may not delegate authority over the trust
  account.
