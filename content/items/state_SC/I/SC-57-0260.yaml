stem: Which of the following qualifies an applicant for a broker-in-charge license under S.C. Code
  Ann. § 40-57-330(A)?
options:
  - Being a licensed associate for three years
  - Having an ownership interest in the company
  - Being employed as a property manager
  - Completing ten hours of continuing education
key: B
explanation: The statute requires a broker-in-charge applicant to either have an ownership interest
  in the company or be actively engaged in its operation and management. Having an ownership
  interest satisfies this requirement. Being a licensed associate for three years is not mentioned
  as a qualifying condition.
