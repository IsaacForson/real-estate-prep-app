key: D
explanation: "Under S.C. Code Ann. § 40-57-345, an individual with an expired license may renew if
  they were in good standing at the time the license expired, have at least twenty‑five years of
  South Carolina licensure, and are at least sixty‑five years old. The correct choice states that
  the applicant must be at least sixty‑five years old, in good standing at expiration, and have
  twenty‑five or more years of South Carolina licensure. The other choices are incorrect: one lowers
  the age to sixty, another reduces the required licensure to twenty years, and a third does both,
  failing to meet the statutory criteria."
