stem: Under S.C. Code Ann. § 40-57-30, what does the term 'active license' mean?
options:
  - A license that is temporarily inactive due to failure to renew within the allotted time
  - A license that authorizes the holder to act solely as a broker-in-charge
  - A license that has been issued for the current period and authorizes the licensee to practice in
    this State
  - A license that has been canceled and may not be reinstated under any circumstances
key: C
explanation: The definition of 'active license' in S.C. Code Ann. § 40-57-30(1) states it is a
  license issued for the current period that authorizes practice in this State. Therefore the option
  stating that a license has been issued for the current period and authorizes the licensee to
  practice in this State is correct. The other choices describe licenses that are inactive, limited
  to broker-in-charge, or canceled, which do not match the definition.
