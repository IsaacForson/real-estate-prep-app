stem: According to S.C. Code Ann. § 40-57-780, which of the following individuals is subject to the
  misdemeanor penalty for failing to renew or register a license and continuing to engage in the
  permitted business?
options:
  - The broker
  - The attorney
  - The lender
  - The appraiser
key: A
explanation: The statute explicitly includes a broker among those who may be guilty of a misdemeanor
  for failing to renew or register a license while continuing to practice. The attorney, lender, and
  appraiser are not listed in this provision and therefore are not subject to this specific penalty.
