stem: How can the status of a South Carolina real estate license be verified?
options:
  - Reviewing the licensee's advertising
  - Checking the MLS database and public records
  - Contacting the commission's website or staff
  - Requesting a letter from the broker-in-charge
key: C
explanation: The statute provides that the status of an associate, broker, or property manager
  license can be verified on the commission's website or by contacting commission staff, making that
  the correct method. Checking the MLS database is not mentioned in the statute, reviewing
  advertising does not confirm licensure status, and requesting a letter from the broker‑in‑charge
  is not a statutory verification method.
