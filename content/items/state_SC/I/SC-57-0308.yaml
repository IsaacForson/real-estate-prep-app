stem: According to S.C. Code Ann. Regs. § 105-10(A), who must teach approved qualifying courses?
options:
  - Commission-approved instructors who are actively licensed as brokers by the Commission.
  - Commission-approved instructors who hold a bachelor's degree in a related field.
  - Commission-approved instructors who possess a current teaching certificate from any state.
  - Commission-approved instructors who have served as assistant instructors for sixty hours.
key: A
explanation: Approved qualifying courses must be taught by Commission-approved instructors who hold
  an active broker license issued by the Commission (S.C. Code Ann. Regs. § 105-10(A)). The option
  describing Commission-approved instructors who are actively licensed as brokers by the Commission
  meets this requirement. The option describing Commission-approved instructors who hold a
  bachelor's degree in a related field does not, because an active broker license is required
  regardless of educational background.
