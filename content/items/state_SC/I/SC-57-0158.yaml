stem: An applicant submits a license application and pays the required application fee. Before the
  commission processes the application, the applicant decides to withdraw the request. What is the
  status of the application fee under S.C. Code Ann. § 40-57-70(B)?
options:
  - Refundable upon request
  - Transferred to the education fund
  - Forfeited and not refunded
  - Held in escrow until reapplication
key: C
explanation: The statute provides that an application fee is nonrefundable, meaning it is forfeited
  and not returned regardless of whether the application is processed or withdrawn. Therefore, the
  fee is forfeited and not refunded. The option suggesting it is refundable upon request contradicts
  the explicit nonrefundable rule.
