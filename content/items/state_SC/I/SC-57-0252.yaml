stem: An applicant passes both the state and national portions of the real estate examination on
  March 1, 2024. According to S.C. Code Ann. § 40-57-320(B)(4), what must the applicant do to avoid
  having to reapply and retake the examination?
options:
  - Apply for a license within one year
  - Submit proof of thirty hours instruction
  - Pay the biennial renewal fee within six months
  - Complete a broker course before next renewal
key: A
explanation: The statute requires that an applicant who passes both portions must apply for a
  license within one year; otherwise they must reapply and retake the examination. Applying within
  one year satisfies the requirement. The other options are not conditions for avoiding
  re‑examination.
