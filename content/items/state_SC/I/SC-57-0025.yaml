stem: A license applicant submits an examination application and includes the required application
  fee. If the applicant later decides not to take the examination, what is the status of the
  application fee under S.C. Code Ann. § 40-57-70(B)?
options:
  - It is applied to a future application.
  - It is forfeited and not refunded by law.
  - It is refunded upon request and void.
  - It is transferred to the Education Fund.
key: B
explanation: The statute explicitly provides that an application fee is nonrefundable when submitted
  with an examination or license application. Consequently, the fee is forfeited and not returned to
  the applicant. The other options incorrectly suggest refund, reapplication, or transfer to the
  Education Fund, which the statute does not authorize.
citation:
