stem: A provider submits an application and fee to the commission and receives approval. According
  to S.C. Code Ann. § 40-57-920(A), what must the commission do next?
options:
  - Issue a notification to the provider
  - Issue a renewal reminder to the provider
  - Issue a continuing education certificate
  - Issue a refund of the application fee
key: A
explanation: When the commission approves an application, it must issue a notification to the
  provider, as stated in the statute. The correct answer reflects this disclosure requirement. The
  distractor about issuing a continuing education certificate is wrong because the statute does not
  obligate the commission to provide such certificates upon approval.
