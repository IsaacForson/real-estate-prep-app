stem: "A prospective buyer tours homes with a licensee but never signs a written agency agreement.
  Under S.C. Code Ann. § 40-57-30(13), the buyer is:"
options:
  - The buyer is considered a customer.
  - The buyer is considered a client.
  - The buyer is considered a subagent.
  - The buyer is considered a broker-in-charge.
key: A
explanation: S.C. Code Ann. § 40‑57‑30(13) defines a customer as a buyer, seller, landlord, or
  tenant who uses a licensee’s services without establishing an agency relationship through a
  written agreement. Because the prospective buyer only toured homes and never signed a written
  agency agreement, the buyer meets that definition and is a customer. A client, on the other hand,
  requires a written agency agreement as defined in subsection (10), so labeling the buyer as a
  client is incorrect.
