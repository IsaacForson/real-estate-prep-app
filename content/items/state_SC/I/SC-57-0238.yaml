stem: Under S.C. Code Ann. § 40-57-30(24), what is a limited‑function referral office?
options:
  - C. A brokerage that specializes in referral fees for out-of-state transactions
  - B. A brokerage where the office policy allows only the placement of referrals through the
    broker-in-charge
  - D. A brokerage that must obtain commission approval before accepting any referral
  - A. A brokerage where supervised licensees may independently place referrals
key: B
explanation: The statute defines a limited‑function referral office as a brokerage whose policy
  permits referrals to be placed only by the broker‑in‑charge; therefore the statement that the
  office policy allows only the placement of referrals through the broker‑in‑charge is correct. The
  statement that supervised licensees may independently place referrals is incorrect because the
  definition limits placement to the broker‑in‑charge.
