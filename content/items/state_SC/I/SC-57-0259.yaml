stem: A property manager-in-charge is renewing their license for the third time and submits the
  renewal fee but does not submit the required criminal background check by the renewal date. What
  is the status of the license immediately after renewal under S.C. Code Ann. § 40-57-510(G)?
options:
  - The license will remain active with no restrictions
  - The license will be placed on inactive status pending review
  - The license will be revoked and require reapplication
  - The license will be suspended for thirty days pending review
key: B
explanation: The statute states that if the background‑check requirement is not met by the renewal
  date, the license may be renewed but must be placed on inactive status. The license is not revoked
  or suspended for a set period, and it does not remain fully active.
citation:
  source: S.C. Code Ann. § 40-57 (Title 40, ch. 57 — Real Estate Brokers, Brokers-in-Charge,
    Associates, and Property Managers) — South Carolina Code of Laws Title 40, Chapter 57 — Real
    Estate Brokers, Brokers-in-Charge, Associates, and Property Managers SECTION 40-57-510(G)
  url: null
  quoted_text: A property manager or property manager-in-charge who fails to submit to criminal
    background check requirements of this section by the date of license renewal may renew by
    submitting applicable fees but immediately must be placed on inactive status.
