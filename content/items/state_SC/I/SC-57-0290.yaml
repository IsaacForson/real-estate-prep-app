    Estate Brokers, Brokers-in-Charge, Associates, and Property Managers — § 40-57-340
  url: null
  quoted_text: A broker or associate who fails to submit to criminal background check requirements of
    this section or complete the continuing education requirements of this section by the date of
    license renewal may renew by submitting applicable fees but immediately must be placed on
    inactive status.
