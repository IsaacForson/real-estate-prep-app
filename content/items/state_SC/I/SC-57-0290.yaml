stem: A broker submits the renewal fee but does not submit the required criminal background check by
  the renewal date. What is the immediate status of the license?
options:
  - Active
  - Inactive
  - Revoked
  - Suspended
key: B
explanation: The statute provides that failing to submit the required criminal background check by
  the renewal date results in the license being placed on inactive status immediately. Therefore,
  the correct answer is Inactive. The distractor Revoked is incorrect because revocation is a more
  severe penalty that does not arise solely from this omission.
citation:
  source: S.C. Code Ann. § 40-57 (Title 40, ch. 57 — Real Estate Brokers, Brokers-in-Charge,
