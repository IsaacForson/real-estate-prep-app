key: B
explanation: According to S.C. Code Ann. § 40-57-30(28), a personal trust account is an escrow or
  demand deposit account properly titled with 'trust' or 'escrow' that a licensee establishes to
  safeguard funds for parties in a transaction involving the licensee's own personal real estate
  that is not managed or listed through a brokerage firm. An option that allows the account when the
  property is managed or listed through a brokerage firm contradicts the requirement that the
  property not be managed or listed. An option that permits the account for any real estate, not
  limited to the licensee's personal property, adds an unrestricted scope not present in the
  statute. An option that restricts the account to commercial‑only properties introduces a
  limitation that the definition does not contain.
