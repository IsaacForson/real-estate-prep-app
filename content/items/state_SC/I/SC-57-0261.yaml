stem: Mara, an associate licensee, completed a South Carolina post-licensing course in January 2024.
  She is renewing her license for the period beginning July 1, 2024. Under S.C. Code Ann. §
  40-57-340(B)(1)(a), is Mara exempt from the biennial continuing education requirement for this
  renewal period?
options:
  - Yes, because she completed the post-licensing course during the renewal period.
  - No, because associates must complete ten hours of continuing education every renewal period.
  - No, because the exemption applies only to broker courses, not post-licensing courses.
  - No, because she must wait until the next renewal period to claim the exemption.
key: A
explanation: The statute exempts an associate who successfully completes a post-licensing course
  from the continuing education requirement for the renewal period during which the course was
  taken. Mara completed the course in January 2024 and is renewing for the period starting July 1,
  2024, so she is exempt. The distractor claiming associates must complete ten hours every renewal
  period ignores this specific exemption.
