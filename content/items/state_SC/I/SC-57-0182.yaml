stem: Under S.C. Code Ann. § 40-57-60(B), what action is the South Carolina Real Estate Commission
  prohibited from taking concerning licensees?
options:
  - Resolving disputes between licensees over payment or division of a commission or fee
  - Setting educational standards for applicant qualifications and eligibility requirements
  - Conducting disciplinary hearings for alleged violations and misconduct complaints
  - Establishing a fee schedule for licensure renewal and continuing education
key: A
explanation: The statute explicitly states the commission may not be involved in resolving disputes
  between licensees over payment or division of a commission or fee. Setting educational standards
  is actually a commission power under subsection (A)(1), making it an incorrect choice.
