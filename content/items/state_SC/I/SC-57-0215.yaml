stem: A broker's license expired on March 15, 2024. If the broker does not reinstate the license, on
  what date will the license be canceled according to S.C. Code Ann. § 40-57-110(E)?
options:
  - March 31, 2026
  - March 15, 2025
  - March 15, 2027
  - February 28, 2026
key: A
explanation: The statute provides that a lapsed license is canceled if not reinstated by the last
  day of the twenty‑fourth month following expiration. Adding twenty‑four months to March 15, 2024
  brings us to March 2026, and the last day of that month is March 31, 2026. The distractor March
  15, 2025 mistakenly uses only twelve months instead of twenty‑four.
citation:
  source: S.C. Code Ann. § 40-57 (Title 40, ch. 57 — Real Estate Brokers, Brokers-in-Charge,
    Associates, and Property Managers) — South Carolina Code of Laws Title 40, Chapter 57 — Real
    Estate Brokers, Brokers-in-Charge, Associates, and Property Managers — § 40-57-110 (E)
  url: null
  quoted_text: A license that has lapsed and is not reinstated by the last day of the twenty-fourth
    month following expiration is canceled.
  secondary: []
math:
  worked_solution: |-
    Start with expiration date: March 15, 2024.
    Add 24 months: March 15, 2024 + 24 months = March 15, 2026.
    Determine last day of that month: March 31, 2026.
    Cancellation date = March 31, 2026.
  formulas:
    - cancellation_date = expiration_date + 24 months, then set to last day of the resulting month
