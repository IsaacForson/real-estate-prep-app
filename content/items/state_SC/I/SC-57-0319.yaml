stem: A licensee was denied licensure by the South Carolina Real Estate Commission on January 15,
  2024. Assuming they do not win an appeal, what is the earliest date they may reapply for licensure
  under S.C. Code Ann. § 40-57-320(B)(5)?
options:
  - January 15, 2025
  - July 15, 2026
  - January 15, 2026
  - July 15, 2025
key: C
explanation: The statute imposes a twenty‑four‑month bar on reapplication after a denial unless the
  denial is overturned on appeal. Adding twenty‑four months to January 15, 2024 yields January 15,
  2026.
