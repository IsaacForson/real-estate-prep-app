stem: A South Carolina resident licensee wants to pay part of her commission as a referral fee to a
  brokerage in another state. According to S.C. Code Ann. § 40-57-120(E), under what condition is
  this permissible?
options:
  - If the out-of-state brokerage's license does not conduct, in this State, a real estate brokerage
    service for which a fee, compensation, or commission is paid.
  - If the out-of-state brokerage maintains a physical office within South Carolina and employs at
    least one licensed real estate agent, and complies with all state advertising rules.
  - If the referral fee amount is less than fifty percent of the total commission earned on the
    transaction and the client receives written disclosure of the fee arrangement before signing any
    contract.
  - If the licensee obtains written consent from both the buyer and the seller prior to paying any
    referral fee to the out-of-state brokerage, and the consent must be kept in the transaction file
    for at least three years.
key: A
explanation: The statute permits a resident licensee to pay a referral fee to an out‑of‑state
  brokerage only when that brokerage does not engage in real estate brokerage services in South
  Carolina for which a fee is paid. The distractors introduce additional requirements—such as
  maintaining a local office, fee percentage limits, or client consent—that are not found in
  subsection (E).
