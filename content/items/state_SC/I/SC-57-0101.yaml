  quoted_text: A resident licensee may pay a part of his commission as a referral fee on a cooperative
    basis to a brokerage of another state or jurisdiction if that brokerage's license does not
    conduct, in this State, a real estate brokerage service for which a fee, compensation, or
    commission is paid.
