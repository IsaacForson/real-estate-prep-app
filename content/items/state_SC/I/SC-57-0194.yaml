stem: A licensee placed their broker license on inactive status on January 15, 2022. They now wish
  to reactivate the license. What must the licensee do to reactivate it according to S.C. Code Ann.
  § 40-57-110(B)?
options:
  - To reactivate, the licensee must apply for the same license classification, pay the fee, and
    meet continuing education requirements
  - To reactivate, the licensee must simply pay the renewal fee without additional education
  - To reactivate, the licensee must apply for a different license classification, pay the fee, and
    complete continuing education
  - To reactivate, the licensee must submit a new application for an associate license only
key: A
explanation: S.C. Code Ann. § 40-57-110(B) states that an individual seeking to reactivate a license
  shall apply for the same license classification which was placed on inactive status, pay the
  appropriate fee, and meet the continuing education requirements as prescribed. Therefore, the
  licensee must apply for the same broker classification, pay the fee, and satisfy continuing
  education. The distractor suggesting a different license classification misstates the requirement
  to retain the original classification.
