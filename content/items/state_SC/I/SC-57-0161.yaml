stem: "A licensee assists a prospective buyer who is not a client by preparing a standard purchase
  agreement for the buyer to sign. Under S.C. Code Ann. § 40-57-30(26), this action is:"
options:
  - The action is prohibited because it involves discretion or judgment
  - The action is permissible as a ministerial act under state definition
  - The action constitutes practicing brokerage without a license
  - The action requires a written agency agreement with the buyer in this state
key: B
explanation: A ministerial act is defined as an act performed by a licensee that does not involve
  discretion or judgment on behalf of a nonclient and assists the nonclient to consummate a real
  estate transaction. Preparing a standard purchase agreement for a nonclient meets these criteria,
  making it permissible as a ministerial act. The incorrect options either add requirements not
  present in the definition or mischaracterize the nature of the act.
