stem: What does the term 'Conversion' mean?
options:
  - To commingle trust funds with personal finances and use them for personal expenses
  - To use trust funds for a purpose other than the purpose for which they are held
  - To fail to deposit trust funds into a designated trust account within the required timeframe
  - To withdraw trust funds from the account without obtaining written client authorization
key: B
explanation: According to S.C. Code Ann. § 40-57-30(12), conversion is using trust funds for a
  purpose other than the purpose for which they are held. Therefore the option stating that
  conversion is using trust funds for a purpose other than the purpose for which they are held is
  correct. The distractor about commingling funds is incorrect because conversion concerns the
  purpose of use, not merely mixing funds.
