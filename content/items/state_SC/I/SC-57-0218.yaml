stem: "Under S.C. Code Ann. § 40-57-120(B), a nonresident licensee who maintains an active place of
  business in their home state is:"
options:
  - The licensee must obtain a South Carolina broker-in-charge license
  - The licensee is not required to maintain a place of business in South Carolina
  - The licensee must close the out-of-state office within 30 days
  - The licensee must also maintain a place of business in South Carolina
key: B
explanation: The statute provides that a nonresident licensee acknowledged by the commission is not
  required to maintain a place of business in this State if the nonresident maintains an active
  place of business in the state of residence. Therefore, maintaining an out-of-state office
  satisfies the requirement and no South Carolina office is needed. The other options impose
  requirements not found in the statute.
