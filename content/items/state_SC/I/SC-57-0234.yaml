stem: David places his South Carolina broker license on inactive status on January 1, 2024 and does
  not renew it for the renewal period. According to S.C. Code Ann. § 40-57-110, what is the status
  of his license after the expiration date if he does **NOT** renew?
options:
  - His license will remain on inactive status indefinitely without any further action.
  - His license will lapse because inactive status requires renewal the same as an active license.
  - His license will be canceled after twenty‑four months if not reinstated following lapse.
  - His license will be placed on administrative hold until the renewal requirements are satisfied.
key: B
explanation: To maintain an inactive license status, the license must be renewed in the same manner
  as provided for active license renewals; if not renewed, the license lapses. Therefore, David’s
  license lapses upon expiration. The option claiming the license remains inactive without action
  ignores the renewal requirement, and the cancellation option applies only after a lapse persists
  for twenty‑four months.
