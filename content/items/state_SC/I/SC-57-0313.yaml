stem: A licensee’s license has been canceled due to fraud. What must the licensee do to obtain a new
  real estate license under S.C. Code Ann. § 40-57-30(9)?
options:
  - The licensee must pay the renewal fee and submit a new application to restore the license.
  - The licensee must complete additional continuing education hours and pass the state exam before
    reapplying.
  - The licensee must reapply and meet current licensure requirements to obtain a new license.
  - The licensee must request reinstatement from the commission and pay any applicable penalties.
key: C
explanation: Under S.C. Code Ann. § 40-57-30(9), a canceled license cannot be renewed; the
  individual must reapply and satisfy current licensure requirements to obtain a new license.
