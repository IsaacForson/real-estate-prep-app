stem: Sarah, a licensed broker, submits a written request to the commission to place her license on
  inactive status. Which statement accurately describes her ability to engage in real estate
  brokerage while her license remains inactive?
options:
  - She may continue to practice real estate brokerage provided she renews her license promptly.
  - She may not practice real estate brokerage while her license remains inactive.
  - She may practice real estate brokerage if she also holds an active license in another
    jurisdiction.
  - She may practice real estate brokerage only when earning referral fees from out-of-state brokers.
key: B
explanation: Under S.C. Code Ann. § 40-57-110(B)(1), inactive licensees are prohibited from
  practicing real estate brokerage as defined in the chapter and regulations. Therefore, Sarah may
  not engage in brokerage activities while her license is inactive. The suggestion that renewal
  permits practice is incorrect because the prohibition applies regardless of renewal status.
