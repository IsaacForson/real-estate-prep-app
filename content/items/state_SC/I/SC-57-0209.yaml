stem: Marco, a nonresident licensee, becomes a resident of South Carolina and notifies the
  commission within thirty days but continues to practice without meeting South Carolina licensing
  requirements. What is the consequence under S.C. Code Ann. § 40-57-120(C)(3)?
options:
  - An automatic cancellation of his license after thirty days of noncompliance
  - A written reprimand from the commission with no financial penalty imposed
  - A requirement to retake the South Carolina real estate examination and pay a fee
  - A violation of this chapter subject to penalties under Section 40-57-710
key: D
explanation: Marco’s failure to comply with the requirements of the subsection (by practicing
  without meeting South Carolina licensing requirements) constitutes a violation under §
  40-57-120(C)(3), subject to penalties in § 40-57-710. The distractor asserting an automatic
  cancellation is incorrect because the law does not impose a specific penalty; it only designates
  the act as a violation.
