stem: According to S.C. Code Ann. § 40-57-70(C)(1), what is the maximum amount that may be allocated
  from each license renewal fee to the South Carolina Real Estate Commission Education and Research
  Fund?
options:
  - $5.00
  - $10.00
  - $15.00
  - $20.00
key: B
explanation: The statute states that the department may allocate up to ten dollars of each license
  renewal fee to the Education and Research Fund. Therefore, the maximum permissible allocation is
  ten dollars. Options of five dollars or less are below the maximum, while fifteen or twenty
  dollars exceed the allowed amount.
