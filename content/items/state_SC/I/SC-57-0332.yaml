stem: A broker‑in‑charge dies on July 15, 2024. The department permits a supervised licensee to act
  as broker‑in‑charge. What is the latest date the supervised licensee may serve in that role
  without violating the rule?
options:
  - January 15, 2025
  - February 15, 2025
  - January 16, 2025
  - January 14, 2025
key: A
explanation: Six months after July 15, 2024 is January 15, 2025, the maximum period allowed by §
  40-57-135(C)(4). The January 14, 2025 option falls one day short of the full six‑month period,
  while January 16, 2025 exceeds it by one day.
citation:
