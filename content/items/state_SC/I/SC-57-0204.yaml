stem: Which of the following is **NOT** required for initial applicants and licensure renewal
  applicants under S.C. Code Ann. § 40-57-115?
options:
  - State fingerprint-based criminal records check conducted by SLED
  - National criminal records check supported by fingerprints by the FBI
  - SSN-based criminal records check from an approved source
  - Credit check from a private consumer reporting agency
key: D
explanation: The statute requires applicants to submit a state fingerprint-based check via SLED, a
  national fingerprint-based check via the FBI, and a social-security-number-based check from a
  commission‑approved source. A credit check from a private consumer reporting agency is not
  mentioned in the requirement. Therefore the credit check is the item that is not required.
