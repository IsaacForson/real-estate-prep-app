stem: If a license is revoked on March 1, 2024 and the revocation is not made permanent, what is the
  earliest date the person may reapply for licensure under S.C. Code Ann. § 40-57-730(A)?
options:
  - March 1, 2025
  - March 1, 2026
  - March 1, 2027
  - March 1, 2028
key: C
explanation: The statute bars reapplication for three years from the date of revocation unless the
  revocation is made permanent. Adding three years to March 1, 2024 yields March 1, 2027 as the
  earliest permissible date. Dates earlier than this violate the three‑year bar, while later dates
  are permissible but not the earliest.
