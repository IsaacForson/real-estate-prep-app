stem: Taylor, a broker-in-charge, ceases to be associated with the brokerage office on June 10,
  2024. According to S.C. Code Ann. § 40-57-330(C), what is the latest date by which Taylor must
  notify the commission to avoid deactivation of the license?
options:
  - Taylor must notify by June 12, 2024
  - Taylor must notify by June 13, 2024
  - Taylor must notify by June 15, 2024
  - Taylor must notify by June 20, 2024
key: C
explanation: If disassociated on June 10, adding five days yields June 15 as the final day to
  notify. Thus June 15 is correct. The June 13 distractor is wrong because it only allows three
  days, which is insufficient under the five‑day rule.
