stem: A licensee changes their mailing address and fails to notify the South Carolina Real Estate
  Commission within the required timeframe. According to S.C. Code Ann. § 40-57-310(3), what may
  happen as a result?
options:
  - The license may be administratively nullified.
  - The license may be administratively suspended.
  - The license may be administratively fined.
  - The license may be administratively revoked.
key: B
explanation: The statute states that failure to update contact information within thirty days after
  a change may result in an administrative suspension of the licensee. Therefore, the correct
  consequence is an administrative suspension. The distractor suggesting placement on inactive
  status is incorrect because the statute specifies suspension, not inactive status, for this
  violation.
