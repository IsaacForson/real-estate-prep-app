stem: Which of the following experiences satisfies the ability-to-teach requirement under S.C. Code
  Ann. Regs. § 105-10(2)(d)?
options:
  - The applicant has three years of adult-education experience in schools within the past five
    years.
  - The applicant has two years of adult-education experience in seminars within the past five years.
  - The applicant has five years of adult-education experience in seminars more than five years ago.
  - The applicant has four years of experience as a real estate sales agent within the past five
    years.
key: A
explanation: Under S.C. Code Ann. Regs. § 105-10(2)(d), the ability-to-teach requirement is
  satisfied by three years of adult-education experience in schools, seminars, or an equivalent
  setting within the past five years. The correct option describes three years of adult-education
  experience in schools within the past five years, meeting both the duration and recency criteria.
  The option stating two years of adult-education experience in seminars within the past five years
  fails because it provides only two years of experience, which is insufficient. The option stating
  five years of adult-education experience in seminars more than five years ago fails because the
  experience occurred outside the required five‑year window. The option stating four years of
  experience as a real estate sales agent within the past five years fails because sales‑agent
  experience is not adult‑education in a qualifying setting.
