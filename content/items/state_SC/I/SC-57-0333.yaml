stem: An individual whose real estate license expired while they were in good standing, has 28 years
  of South Carolina licensure, and is 66 years old wishes to renew the license. According to S.C.
  Code Ann. § 40-57-345, what is true?
options:
  - The licensee may renew the license and is exempt from continuing education.
  - The licensee may renew the license and must complete continuing education.
  - The licensee may not renew the license because they are over 65.
  - The licensee may renew the license only if they retake the pre-licensing exam.
key: A
explanation: The statute allows renewal for individuals whose license expired while in good
  standing, who have at least 25 years of South Carolina licensure, and who are 65 or older, and it
  exempts them from continuing education upon renewal. The option stating that the licensee may
  renew the license and must complete continuing education is incorrect because the law provides an
  exemption for this group.
