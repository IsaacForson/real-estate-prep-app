stem: An instructor’s application for course approval is denied. According to S.C. Code Ann. §
  40-57-920(B), what must the commission do?
options:
  - Provide a refund of the fee to the provider
  - Provide a detailed reason for denial to the provider
  - Provide a copy of the application to the provider
  - Provide a new application form to the provider
key: B
explanation: If an application is not approved, the commission must detail the reason and provide it
  to the provider or instructor, per the statute. The correct answer captures this required
  disclosure. The distractor suggesting the commission provide a copy of the application is
  incorrect because the rule mandates a detailed reason, not a copy of the application.
