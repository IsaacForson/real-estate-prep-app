stem: An applicant passes both the state and national portions of the real estate examination on
  March 1, 2024. According to S.C. Code Ann. § 40-57-320(B)(4), by what date must the applicant
  apply for a license to avoid having to reapply and retake the examination?
options:
  - March 1, 2026
  - February 28, 2026
  - February 28, 2025
  - March 1, 2025
key: D
explanation: The statute requires that an applicant who passes both portions must apply for a
  license within one year, or they must reapply and retake all portions. One year after March 1,
  2024 is March 1, 2025.
