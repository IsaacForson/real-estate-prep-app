stem: According to S.C. Code Ann. § 40-57-30(9), what is the definition of a 'canceled license'?
options:
  - A license that has been issued for the current period and authorizes the licensee to practice in
    this State.
  - A license that is invalidated, can no longer be reinstated or renewed, and requires
    reapplication and meeting current licensure requirements after cancellation.
  - A license that is temporarily ceased upon notice to the commission that the licensee does not
    intend to practice real estate.
  - A license that is terminated due to failure to renew within the renewal period but before
    cancellation.
key: B
explanation: "S.C. Code Ann. § 40-57-30(9) defines a canceled license as a license that is
  invalidated, can no longer be reinstated or renewed, and requires reapplication and meeting
  current licensure requirements after cancellation. The correct option states this definition. The
  other options describe different license statuses: one describes a license temporarily ceased upon
  notice to the commission, another describes a license terminated for failure to renew before
  cancellation, and the fourth describes an active license issued for the current period."
