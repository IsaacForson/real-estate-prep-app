stem: A broker-in-charge changes the office telephone number on April 2. By what date must the
  broker-in-charge notify the South Carolina Real Estate Commission of this change under S.C. Code
  Ann. § 40-57-135(A)(8)?
options:
  - April 10
  - April 12
  - April 15
  - April 20
key: B
explanation: Under S.C. Code Ann. § 40-57-135(A)(8), a broker‑in‑charge must notify the commission
  within ten days of any change to the office telephone number. Starting from April 2 and counting
  ten days forward gives April 12 as the latest day to make the notification. April 10 would be
  before the ten‑day period ends, while April 15 and April 20 are after the allowed ten days.
