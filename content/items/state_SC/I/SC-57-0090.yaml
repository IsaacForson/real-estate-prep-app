stem: According to S.C. Code Ann. § 40-57-30, what does the term "inactive license" mean?
options:
  - A license that has been issued for the current period and authorizes the licensee to practice in
    this State, remaining in full effect so long as the licensee complies with continuing‑education
    requirements and does not voluntarily suspend it
  - A license that has been permanently invalidated by the commission due to serious misconduct,
    making it impossible to reinstate, renew, or reactivate under any circumstances
  - The official temporary cessation of a licensee's authorization to practice real estate upon
    notice to the commission that the person does not intend to practice
  - A license that has lapsed because the holder failed to renew within the renewal period,
    resulting in a loss of authority until the license is reinstated, but before any formal
    cancellation occurs
key: C
explanation: The definition of "inactive license" in § 40‑57‑30(19) states it is the official
  temporary cessation of a licensee's authorization to practice real estate upon providing notice to
  the commission that the person does not intend to practice real estate brokerage, is no longer
  supervised, or has stepped down as broker‑in‑charge or property manager‑in‑charge. The other
  choices describe a lapsed license, an active license, and a permanently invalidated license, which
  are defined elsewhere in the same section.
citation:
  source: S.C. Code Ann. § 40-57-30
  url: null
  quoted_text: "\"Inactive license\" means the official temporary cessation of a licensee's
    authorization to practice real estate upon the licensee providing notice to the commission that
    the person does not intend to practice real estate brokerage, is no longer supervised by a South
    Carolina-licensed broker-in-charge or property manager-in-charge, or has stepped down as the
    broker-in-charge or property manager-in-charge from a brokerage or property management office."
