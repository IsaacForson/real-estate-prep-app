stem: An applicant for a South Carolina real estate broker license is denied licensure after a
  criminal background check reveals a felony conviction. Under S.C. Code Ann. § 40-57-115, may the
  commission disclose the criminal records information to the public to support its denial?
options:
  - The commission may not disclose the information under any circumstances
  - The commission may disclose the information only with the applicant's written consent
  - The commission may disclose the information if relied upon in denying licensure
  - The commission may disclose the information only to law enforcement agencies
key: C
explanation: The statute requires the commission to keep criminal records information confidential,
  except that information relied upon in denying licensure may be disclosed as necessary to support
  the administrative action. Therefore, disclosure is permitted when the information is used to
  support a denial. The option stating disclosure is never allowed ignores the statutory exception.
