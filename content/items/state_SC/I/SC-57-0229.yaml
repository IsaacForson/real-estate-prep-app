stem: A broker-in-charge asks a supervised licensee to oversee the brokerage's real estate trust
  account. According to S.C. Code Ann. § 40-57-30(7), is this permissible?
options:
  - The assignment is permissible if the broker-in-charge remains liable for the trust account
  - The assignment is permissible because supervised licensees may assist with trust account duties
  - The assignment is not permissible because the authority cannot be assigned to another licensee
  - The assignment is not permissible unless the supervised licensee holds a broker-in-charge license
key: C
explanation: Section 40-57-30(7) explicitly states that the authority granted to the
  broker-in-charge cannot be assigned or designated to another licensee. Therefore, delegating
  oversight of the trust account to a supervised licensee violates this prohibition. The assignment
  might seem plausible if the broker-in-charge remains liable for the trust account, but the rule
  forbids any assignment of authority regardless of retained liability.
