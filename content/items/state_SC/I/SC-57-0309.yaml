stem: An applicant holds a bachelor's degree in finance and wishes to teach a real estate finance
  course. Which of the following educational backgrounds meets the knowledge requirement for
  instructor approval under S.C. Code Ann. Regs. § 105-10(1)(b)?
options:
  - The applicant holds a bachelor's degree in finance for teaching a real estate finance course.
  - The applicant holds a bachelor's degree in history for teaching a real estate finance course.
  - The applicant holds a master's degree in education for teaching a real estate finance course.
  - The applicant holds a high school diploma for teaching a real estate finance course.
key: A
explanation: Under S.C. Code Ann. Regs. § 105-10(1)(b), an instructor must have a college degree in
  an academic area directly related to the course or the specific subject matter to be taught; a
  finance degree is directly related to a real estate finance course, satisfying the requirement. A
  master's degree in education is not directly related to the finance course subject.
