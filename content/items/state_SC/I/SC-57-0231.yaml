stem: A licensee makes a telephone solicitation to a potential seller to list their property.
  According to S.C. Code Ann. § 40-57-370(G)(2), is the licensee required to provide the Disclosure
  of Brokerage Relationships form and a meaningful explanation of brokerage relationships?
options:
  - The licensee is required to provide the disclosure because the licensee has substantive contact
    with the seller
  - The licensee is not required to provide the disclosure because the transaction involves a rental
    property
  - The licensee is required to provide the disclosure because the communication is a solicitation
    of business
  - The licensee is not required to provide the disclosure because the communication is a
    solicitation of business
key: D
explanation: The rule exempts disclosure requirements when the licensee's communication is a
  solicitation of business; thus no disclosure is needed. The distractor claiming the disclosure is
  required despite the solicitation is wrong because the exception applies.
citation:
  source: S.C. Code Ann. § 40-57 (Title 40, ch. 57 — Real Estate Brokers, Brokers-in-Charge,
    Associates, and Property Managers) — South Carolina Code of Laws Title 40, Chapter 57 — Real
    Estate Brokers, Brokers-in-Charge, Associates, and Property Managers § 40-57-370(G)(2)
  url: null
  quoted_text: "(G) The brokerage relationship disclosure requirements of this section do not apply if
    the: (1) transaction is regarding the rental or lease of property; or (2) communication from the
    licensee is a solicitation of business."
