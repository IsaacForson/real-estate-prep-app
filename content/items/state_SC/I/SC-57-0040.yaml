stem: "Maria, who does not hold a real estate license, advertises that she can help buyers find
  homes and receives a commission for a successful transaction. Under S.C. Code Ann. § 40-57-20,
  Maria's conduct is:"
options:
  - It is lawful if she disclosed her unlicensed status to the buyer
  - It is unlawful only if she also negotiated a purchase contract
  - It is lawful because she only provided referral services
  - It is unlawful because she acted as a broker without a license
key: D
explanation: Under S.C. Code Ann. § 40-57-20, it is unlawful to act as a real estate broker or to
  advertise or provide brokerage services without an active license. Maria’s advertising of her
  ability to help buyers find homes and her receipt of a commission for a successful transaction
  constitute broker activity, so her conduct is unlawful. The claim that disclosure of her
  unlicensed status makes the activity lawful is incorrect because the statute does not provide an
  exception for disclosure. The assertion that unlawfulness requires also negotiating a purchase
  contract is incorrect because advertising and receiving compensation for a transaction already
  satisfy the definition of broker activity. The statement that providing referral services for
  compensation is lawful is incorrect because referral services for compensation are included in the
  broker definition and thus also require a license.
