stem: Under S.C. Code Ann. § 40-57-115, when may the commission disclose criminal records
  information obtained from a background check?
options:
  - The commission may disclose the information only when needed to support a denial of licensure
  - The commission may disclose the information only after receiving a written request from the
    applicant
  - The commission may disclose the information only when required for ongoing investigations
  - The commission may disclose the information only when sharing with other state licensing boards
key: A
explanation: The statute states that the commission shall keep information confidential, except that
  information relied upon in denying licensure may be disclosed as necessary to support the
  administrative action. Therefore, disclosure is permitted only to support a denial of licensure.
  The other options either add conditions not in the statute or prohibit disclosure entirely.
