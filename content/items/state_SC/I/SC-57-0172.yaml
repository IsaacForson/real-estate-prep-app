stem: According to South Carolina real estate licensing law, what is a subagent?
options:
  - A person who acts as an agent for another agent in a real estate transaction
  - A person who negotiates lease agreements on behalf of a landlord for a fee
  - A person who advertises real estate consulting services to the public
  - A person who supervises licensees and manages trust accounts for a brokerage firm
key: A
explanation: "Under S.C. Code Ann. § 40-57-30(37), a subagent is an agent of an agent, meaning a
  licensee who acts on behalf of another agent in a real estate transaction. The correct option
  describes this relationship. The other options are incorrect: negotiating lease agreements for a
  landlord, advertising consulting services to the public, and supervising licensees or managing
  trust accounts for a brokerage firm do not meet the definition of subagent."
