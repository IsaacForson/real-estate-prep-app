stem: Under S.C. Code Ann. § 40-57-320(B)(5), how long must an applicant wait before reapplying for
  licensure after being denied by the commission, assuming they do **NOT** prevail in an appeal?
options:
  - Six months
  - One year
  - Eighteen months
  - Twenty-four months
key: D
explanation: The statute states that an applicant denied licensure may not reapply for a period of
  twenty-four months from the date of denial unless they prevail in an appeal. The other options
  represent shorter periods not supported by the text.
citation:
  source: S.C. Code Ann. § 40-57-320(B)(5)
  url: null
  quoted_text: An applicant who is denied licensure by the commission may not reapply for licensure
    for a period of twenty-four months from the date of denial unless he prevails in appealing the
    denial pursuant to the Administrative Procedures Act.
