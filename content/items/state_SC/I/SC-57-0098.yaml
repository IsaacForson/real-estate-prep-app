stem: A licensee who holds an active broker license wishes to become a broker‑in‑charge but has no
  ownership interest in the company and is not involved in its day‑to‑day management. According to
  S.C. Code Ann. § 40-57-330(A), what must the licensee do to qualify for a broker‑in‑charge
  license?
options:
  - Obtain an ownership interest in the company
  - Secure a written agreement from the current broker‑in‑charge
  - Pass the state portion of the examination again
  - Complete an additional thirty hours of brokerage principles course
key: A
explanation: The law requires a broker‑in‑charge applicant to either have an ownership interest in
  the company or be actively engaged in its operation and management. Since the licensee lacks both,
  obtaining an ownership interest satisfies the requirement. The other options pertain to education,
  agreements, or re‑examination, which are not stipulated for broker‑in‑charge eligibility.
citation:
  source: S.C. Code Ann. § 40-57-330(A)
  url: null
  quoted_text: "(A) A broker-in-charge license may not be issued to or renewed for an applicant unless
    the applicant: (1) has an ownership interest in the applicant's company; or (2) is actively
    engaged in the operation and management of the company."
