stem: According to S.C. Code Ann. § 40-57-330(C), within how many days must a broker-in-charge
  notify the commission after becoming disassociated with the office registered with the commission?
options:
  - The broker-in-charge must notify within ten days
  - The broker-in-charge must notify within fifteen days
  - The broker-in-charge must notify within five days
  - The broker-in-charge must notify within thirty days
key: C
explanation: The rule requires a broker-in-charge to notify the commission within five days of
  disassociation. Therefore, the correct answer is five days. The ten‑day distractor is incorrect
  because the statute specifies five days, not ten.
