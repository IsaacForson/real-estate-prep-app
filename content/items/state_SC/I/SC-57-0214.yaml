stem: A licensee pays a $120 license renewal fee. What is the maximum amount that may be allocated
  from this fee to the South Carolina Real Estate Commission Education and Research Fund under S.C.
  Code Ann. § 40-57-70(C)(1)?
options:
  - $0.00
  - $10.00
  - $20.00
  - $12.00
key: B
explanation: The rule permits allocation of up to ten dollars of each license renewal fee,
  regardless of the fee amount. Since $120 exceeds the ten‑dollar limit, the maximum allocation is
  ten dollars. The distractor twelve dollars incorrectly applies the fee amount instead of the
  statutory cap.
