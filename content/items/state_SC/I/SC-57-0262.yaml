stem: The broker-in-charge of a firm is preparing the written company policy required by S.C. Code
  Ann. § 40-57-350(B). Which of the following must be included in that policy?
options:
  - The firm's dress code policy for licensees
  - The scope of services provided to clients
  - The list of approved advertising and media
  - The schedule for regular office meetings
key: B
explanation: The statute explicitly requires the written company policy to include the scope of
  services provided to the real estate brokerage firm's clients. The schedule for regular office
  meetings, while possibly useful, is not mandated by this provision.
