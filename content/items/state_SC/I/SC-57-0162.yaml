stem: "Lisa, a licensee, markets herself as 'Lisa' but her legal first name is 'Elizabeth'. She has
  not registered 'Lisa' with the commission. Under S.C. Code Ann. § 40-57-30(4), her use of 'Lisa'
  is:"
options:
  - The use of 'Lisa' is permissible as an alternative name because it is a first name
  - The use of 'Lisa' is not permissible because it must be registered with the commission
  - The use of 'Lisa' is permissible because she uses it for marketing purposes
  - The use of 'Lisa' is permissible if the licensee believes it is her legal first name
key: B
explanation: The definition of 'alternative name' requires that the name be registered with the
  commission and used for marketing purposes. Since Lisa has not registered 'Lisa', her use does not
  satisfy the statutory requirement, making it impermissible. The distractors omit the registration
  requirement or add irrelevant conditions.
