stem: According to S.C. Code Ann. § 40-57-110(A), which statement is correct about holding multiple
  real estate license classifications in South Carolina?
options:
  - An individual may hold both a broker and an associate license simultaneously if they meet the
    requirements for each.
  - An individual may hold both a broker-in-charge and a property manager-in-charge license at the
    same time.
  - An individual may not be licensed in more than one classification at the same time.
  - An individual may hold any two classifications as long as they are not actively practicing.
key: C
explanation: The statute explicitly states that no individual may be licensed in more than one
  classification at the same time. Therefore, holding multiple classifications concurrently is
  prohibited. Options suggesting otherwise contradict this clear prohibition.
