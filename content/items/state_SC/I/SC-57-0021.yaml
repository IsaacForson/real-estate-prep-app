stem: What is the purpose of the South Carolina Real Estate Commission?
options:
  - To regulate the real estate industry and protect the public's interest when involved in real
    estate transactions.
  - To manage the state's real estate tax collection and to allocate those funds to local school
    districts.
  - To enforce zoning ordinances for residential properties and to approve building permits for
    commercial developments.
  - To provide licensing exams for real estate professionals and to issue continuing education
    credits for agents.
key: A
explanation: South Carolina Code of Laws § 40‑57‑10 states that the commission’s purpose is to
  regulate the real estate industry so as to protect the public’s interest when involved in
  real‑estate transactions. The other answer choices describe duties that the commission does not
  have.
