stem: "Marcus, a broker-in-charge, uses funds from the brokerage's real estate trust account to pay
  his personal credit card bill. Under S.C. Code Ann. § 40-57-30(12), this action constitutes:"
options:
  - B) An authorized disbursement for office expenses only with proper documentation
  - A) A permissible ministerial act under state definitions and regulations
  - D) A required interest payment to the account holder annually
  - C) Conversion of trust funds for a purpose other than intended
key: D
explanation: Definition (12) defines conversion as using trust funds for a purpose other than that
  for which they are held, which is a breach of trust and a crime. Using trust funds for a personal
  credit card bill is conversion. The other options describe permissible or required actions not
  supported by the section.
