stem: What does the term 'designated agency' mean?
options:
  - It is a relationship where a licensee acts as an agent for another agent in a real estate
    transaction
  - It is a form of agency in which a real estate brokerage firm with two clients in the same
    transaction gives limited agency services
  - It is a situation where a licensee assists a prospective buyer who is not a client by preparing
    a standard purchase agreement
  - It is a form of agency in which two clients represented by a real estate brokerage firm in the
    same transaction may be given almost equivalent treatment as a single agency
key: D
explanation: Designated agency, as defined in S.C. Code Ann. § 40-57-30(15), is a form of agency
  where two clients represented by the same brokerage firm in a transaction may be given almost
  equivalent treatment as if they were a single agency. The option stating that a licensee acts as
  an agent for another agent describes subagency, not designated agency. The option describing a
  brokerage firm with two clients giving limited agency services describes dual agency. The option
  about assisting a prospective buyer who is not a client by preparing a standard purchase agreement
  describes ministerial assistance, not designated agency.
