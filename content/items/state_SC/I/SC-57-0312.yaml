stem: A licensee receives earnest money from a buyer and uses the funds to pay personal credit card
  debt. What is the consequence under S.C. Code Ann. § 40-57-30(12)?
options:
  - The licensee has committed conversion, which is a crime as defined by law.
  - The licensee has violated advertising rules by failing to include the brokerage name.
  - The licensee has committed a minor infraction subject to a letter of caution.
  - The licensee has committed no violation if the funds are returned within 24 hours.
key: A
explanation: Using earnest money for personal debt is using trust funds for an unauthorized purpose,
  which constitutes conversion and is a crime under the definition. The distractor about advertising
  rules is wrong because the scenario involves trust fund misuse, not advertising.
