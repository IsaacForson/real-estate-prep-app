stem: A nonresident licensee establishes residency in South Carolina on March 10, 2024 but fails to
  notify the commission in writing. What may happen as a result under S.C. Code Ann. §
  40-57-120(C)(3)?
options:
  - Failure to notify may result in automatic cancellation of the license after thirty days
  - Failure to notify may result in disciplinary action against the licensee
  - Failure to notify may require the licensee to retake the licensing exam
  - Failure to notify may result in no penalty if notification is made after sixty days
key: B
explanation: S.C. Code Ann. § 40-57-120(C)(3) provides that failure to timely notify the commission
  of a change in residency is a violation of this chapter subject to penalties provided in Section
  40-57-710. Thus, the licensee may face disciplinary action for the omission. The distractor
  claiming automatic cancellation after thirty days is incorrect because the statute allows the
  licensee to avoid cancellation by placing the license on inactive status, not by automatic
  cancellation.
