stem: A licensee was denied licensure by the South Carolina Real Estate Commission on January 15,
  2024. Assuming they do not win an appeal, what is the earliest date they may reapply for licensure
  under S.C. Code Ann. § 40-57-320(B)(5)?
options:
  - January 15, 2025
  - January 15, 2026
  - July 15, 2025
  - January 15, 2027
key: B
explanation: The statute bars reapplication for twenty‑four months from the date of denial unless
  the denial is overturned on appeal. Adding twenty‑four months to January 15, 2024 yields January
  15, 2026. The other dates do not reflect the twenty‑four‑month period.
