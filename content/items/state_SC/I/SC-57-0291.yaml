key: D
explanation: Under §40-57-340(A)(1), a broker or associate must provide proof of satisfactory
  completion of ten hours of continuing education biennially to maintain an active license. This
  biennial requirement applies at each renewal cycle. The ten hours must include at least four hours
  of mandated topics. Therefore, the correct answer is ten hours.
