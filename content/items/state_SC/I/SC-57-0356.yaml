stem: Alex, who is 20 years old, wants to obtain a property manager-in-charge license in South
  Carolina. According to S.C. Code Ann. § 40-57-510(A)(1), what is the outcome?
options:
  - He is eligible after seven hours of accounting instruction.
  - He is not eligible because he is under twenty-one.
  - He is eligible if he holds a property manager license.
  - He is eligible because he meets the age requirement.
key: B
explanation: The rule mandates that an applicant for a property manager‑in‑charge license must be at
  least twenty‑one years old. Since Alex is only twenty, he does not satisfy this requirement and is
  therefore ineligible. Holding a property manager license or completing accounting instruction does
  not override the age requirement.
