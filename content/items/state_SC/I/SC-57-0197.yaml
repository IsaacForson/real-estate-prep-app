stem: Lisa, a licensee, is selling her own personal residence and holds the buyer's earnest money in
  an account titled 'Lisa's Trust Account' at her bank. Is this a permissible personal trust account
  under S.C. Code Ann. § 40-57-30(28)?
options:
  - Yes, because the account is properly titled with the word 'Trust' and safeguards funds for her
    personal real estate transaction not managed through a brokerage firm
  - Yes, because any account held by a licensee automatically qualifies as a personal trust account
  - Yes, as long as the account is an escrow account, regardless of whether it includes the words
    'trust' or 'escrow'
  - Yes, because the licensee may use her personal trust account for any real estate transaction,
    including those managed through a brokerage firm
key: A
explanation: Section 40-57-30(28) defines a personal trust account as an escrow or demand deposit
  account properly titled with 'trust' or 'escrow' that safeguards funds for a licensee’s personal
  real estate transaction not managed through a brokerage firm. Lisa’s account meets all these
  criteria. The statement that any account held by a licensee automatically qualifies is incorrect
  because the statute requires the account to be properly titled with 'trust' or 'escrow' and to
  safeguard funds for a personal transaction not managed through a brokerage firm.
citation:
  source: S.C. Code Ann. § 40-57-30(28)
  url: null
  quoted_text: (28) "Personal trust account means an escrow account or demand deposit bank account
    properly designated and titled to include the words "trust" or "escrow" that is established and
    maintained by a licensee to safeguard funds belonging to parties to a real estate transaction
    when the transaction involves the licensee's personal real estate and the real estate is not
    managed or listed through a real estate brokerage firm."
