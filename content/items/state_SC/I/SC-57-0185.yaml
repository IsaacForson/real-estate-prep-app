stem: "Jordan, who holds no real estate license, agrees to manage a rental property for a landlord
  and collects a monthly fee for this service. Under S.C. Code Ann. § 40-57-20, Jordan's conduct
  is:"
options:
  - Jordan's conduct is lawful because he only managed a rental property and did not engage in
    brokerage activities.
  - Jordan's conduct is lawful because he did not advertise or hold himself out as a real estate
    professional.
  - Jordan's conduct is unlawful because he acted as a property manager without an active, valid
    license.
  - Jordan's conduct is unlawful only if he also advertised the property management services to the
    public.
key: C
explanation: Section 40-57-20 of the South Carolina Code makes it unlawful to act as a real estate
  property manager without an active, valid license. Jordan's actions meet this definition, making
  his conduct unlawful. The claim that his conduct is lawful because he did not advertise or hold
  himself out as a real estate professional is incorrect because the statute prohibits acting as a
  property manager regardless of whether advertising occurs or whether the activity is considered
  brokerage.
