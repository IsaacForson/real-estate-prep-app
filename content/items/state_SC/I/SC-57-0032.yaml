stem: An applicant for an associate license holds a bachelor's degree in real estate from an
  accredited college or university. Which statement correctly describes the educational requirement
  for licensure?
options:
  - The applicant must still complete sixty hours of fundamentals and thirty hours of advanced
    instruction.
  - The applicant is exempt from any further classroom instruction because the degree satisfies the
    education requirement.
  - The applicant must complete the thirty hours of advanced instruction in addition to the degree.
  - The applicant must complete both the degree and the sixty hours of fundamentals instruction.
key: B
explanation: According to § 40-57-320(A)(1)(b), evidence of holding a baccalaureate degree with a
  major in real estate from an accredited institution satisfies the educational requirement for an
  associate license, so no additional classroom instruction is required. The distractor that insists
  on completing the sixty/thirty‑hour coursework incorrectly treats the degree as insufficient.
