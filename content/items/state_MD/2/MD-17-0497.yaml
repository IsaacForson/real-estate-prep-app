stem: A time share developer advertises that a new swimming pool will be built at the property to
  attract buyers, but the developer does not have sufficient financial assets to complete the pool.
  Under COMAR 09.11.04.04, is this a violation that could lead to discipline?
options:
  - Yes, it is a violation because the developer lacks sufficient financial assets and bona fide
    intention to complete the improvement.
  - No, it is permissible if the developer later obtains financing before construction begins.
  - No, it is permissible if the advertisement includes a disclaimer that construction is not
    guaranteed.
  - No, it is permissible if the pool is not considered a material fact of the time share estate.
key: A
explanation: The rule prohibits asserting that an improvement will be built unless the developer has
  sufficient financial assets and a bona fide intention to complete it. Advertising a pool without
  meeting those conditions is therefore a violation. The suggestion that later financing fixes the
  issue is incorrect because the rule requires the assets and intention at the time of the
  assertion.
citation:
  source: COMAR § 09.11.04.04
  url: null
  quoted_text: There may not be indication or assertion by a developer that an improvement will be
    built or placed in a time share project and be made available for use by purchasers of a time
    share estate unless the developer has sufficient financial assets and bona fide intention to
    complete the improvement represented.
