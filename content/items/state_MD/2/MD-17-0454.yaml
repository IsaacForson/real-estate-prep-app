stem: A buyer files a complaint against a licensee on June 10, 2024, alleging fraud in a sale that
  closed on March 1, 2021. May the Commission summarily dismiss the complaint under COMAR
  09.11.01.19?
options:
  - No, the Commission may not summarily dismiss the complaint because the complaint involves fraud.
  - Yes, the Commission may summarily dismiss the complaint because more than three years have
    elapsed since the sale.
  - Yes, the Commission may summarily dismiss the complaint because the complainant's delay was
    justified.
  - No, the Commission may not summarily dismiss the complaint because less than three years have
    elapsed since the sale.
key: B
explanation: COMAR 09.11.01.19 allows the Commission to summarily dismiss a complaint filed more
  than three years after the underlying transaction, unless the delay is justified and creates an
  undue burden. The sale closed on March 1, 2021 and the complaint was filed on June 10, 2024—over
  three years later—with no indication of justification, so dismissal is permissible. The distractor
  claiming less than three years have elapsed is incorrect because the interval exceeds three years.
citation:
  source: COMAR § 09.11.01.19
  url: null
  quoted_text: The Commission may summarily dismiss any complaint brought against a licensee after 3
    years from the date of the written listing contract, contract of sale, lease agreement, option,
    or actions upon which the complaint is based, unless the Commission finds that the complainant's
    delay in bringing the complaint was justified and that the delay does not result in an undue
    burden for the licensee.
