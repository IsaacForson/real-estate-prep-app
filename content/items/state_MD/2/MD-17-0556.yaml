stem: A time share developer advertises that the Real Estate Commission has approved their new
  project. Under COMAR 09.11.04.04(D), is this advertisement permissible?
options:
  - It is permissible because the developer obtained actual approval from the Commission.
  - It is permissible because the Commission routinely approves all time share projects.
  - It is not permissible because the Commission may not approve or recommend any time share project.
  - It is not permissible because the developer must first obtain a license from the Commission.
key: C
explanation: The advertisement is not permissible because COMAR 09.11.04.04(D) prohibits a time
  share developer from representing that the Real Estate Commission has approved or recommended any
  time share project. The most tempting distractor is the option claiming permissibility because the
  developer obtained actual approval, as the rule bars any such representation regardless of actual
  approval.
citation:
  source: COMAR 09.11.01–09.11.09 § .04.04(D)
  url: null
  quoted_text: D. A time share developer, real estate broker, salesman, or any other person may not
    advertise or represent that the Real Estate Commission has approved or recommended any time
    share project or estate offered for sale.
