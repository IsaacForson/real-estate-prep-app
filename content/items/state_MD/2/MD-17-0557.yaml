stem: A licensee submits a purchase offer on behalf of a buyer without first ensuring the buyer has
  the real property disclosure statement in hand. Under COMAR 09.11.01.01(I), is this a violation?
options:
  - This action is a violation if the failure could result in the contract becoming void or voidable.
  - This action is a violation only if the buyer later discovers defects in the property.
  - This action is not permissible because the disclosure statement is optional for residential
    transactions.
  - This action is a violation because the licensee failed to deliver the disclosure statement
    before the offer.
key: A
explanation: The action is a violation if the failure could result in the contract becoming void or
  voidable, per COMAR 09.11.01.01(I). The most tempting distractor is the option stating the action
  is a violation because the licensee failed to deliver the disclosure statement before the offer,
  because the rule ties the violation to the potential for the contract to become void or voidable,
  not merely to the failure to deliver.
citation:
  source: COMAR 09.11.01–09.11.09 § .01.01(I)
  url: null
  quoted_text: I. Unexcused failure to ensure that a prospective purchaser has the real property
    disclosure statement or disclaimer statement in hand before the submission of an offer to
    purchase may be considered a violation of the licensee's obligation to protect and promote the
    interests of the licensee's client when this failure could result in a contract becoming void or
    voidable.
