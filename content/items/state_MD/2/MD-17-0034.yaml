stem: According to COMAR 09.11.06.01, what is the definition of a 'clock hour' for continuing education?
options:
  - Any period of instruction lasting at least 30 minutes per session.
  - A minimum of 50 minutes of instruction per 60-minute hour.
  - A unit of instruction equal to 100 minutes, including breaks.
  - A full 60-minute hour of instruction, with no breaks allowed.
key: B
explanation: The regulation defines a clock hour as a minimum of 50 minutes of instruction within
  each 60‑minute hour. This means that less than 50 minutes does not satisfy the requirement, and a
  full 60‑minute hour is not required.
