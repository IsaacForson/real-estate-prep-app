stem: The Commission receives a time share developer registration application on March 1. According
  to COMAR 09.11.04.01(D), what is the latest date by which the Commission must return the
  application if it finds a deficiency and does **NOT** believe it can be readily corrected?
options:
  - March 31
  - April 1
  - March 30
  - April 30
key: A
explanation: The regulation requires the Commission to return the application within 30 days after
  receipt if a deficiency is found and the application cannot be readily corrected. Adding 30 days
  to March 1 gives March 31 as the latest permissible date.
citation:
  source: COMAR § 09.11.04.01(D)
  url: null
  quoted_text: If, within 30 days after receiving an application, the Commission determines that any
    prerequisite for registration has not been met, the Commission shall return the application to
    the applicant with a statement specifying the deficiencies in the application
