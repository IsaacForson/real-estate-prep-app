stem: What does the term 'Approved continuing education course' mean under COMAR 09.11.06.01?
options:
  - A continuing education course approved by the Commission
  - A continuing education course offered by a licensed instructor
  - A continuing education course covering fair housing law
  - A continuing education course of at least 1.5 clock hours
key: A
explanation: COMAR § 09.11.06.01 defines an “Approved continuing education course” as a continuing
  education course that has been approved by the Commission. Therefore, the choice stating that the
  course is approved by the Commission is correct. The other choices are incorrect because merely
  being offered by a licensed instructor, covering fair‑housing law, or meeting a minimum clock‑hour
  requirement does not satisfy the statutory definition of an approved course.
