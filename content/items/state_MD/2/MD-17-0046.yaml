stem: A licensed broker moves the business office from Baltimore to Annapolis on June 1. By what
  date must the broker notify the Maryland Real Estate Commission in writing of the change?
options:
  - The broker must notify the Commission within 10 days of changing business location.
  - The broker must notify the Commission within 15 days of changing business location.
  - The broker must notify the Commission within 5 days of changing business location.
  - The broker must notify the Commission within 30 days of changing business location.
key: A
explanation: Regulation.08 requires a licensed broker to notify the Commission in writing within 10
  days after changing business location. Therefore, notice must be given by June 11. The 15‑day
  option incorrectly extends the deadline beyond what the rule allows.
