stem: Under COMAR 09.11.01.10, what must a licensee do with a residential listing contract before
  advertising, showing, or offering the property?
options:
  - Submit the contract to the state Guaranty Fund.
  - File the contract with the Maryland Real Estate Commission.
  - Have the contract notarized by a licensed notary public.
  - Provide a copy of the contract to the seller or owner.
key: D
explanation: The rule requires that a copy of the signed residential listing contract be given to
  the seller or owner before the licensee advertises, shows, or offers the property. Providing the
  copy satisfies this disclosure requirement. Filing the contract with the Commission or having it
  notarized is not mandated by this provision.
citation:
  source: COMAR § 09.11.01.10
  url: null
  quoted_text: All residential listing contracts, listing real property for sale, rental, lease, or
    exchange, either exclusive or open, shall be in writing and signed, and a copy of the contract
    shall be given to the seller or owner before the licensee advertises, shows, or offers the
    property.
