stem: How many days before a license expires must the Commission mail or electronically transmit a
  renewal application form and notice to the licensee?
options:
  - 60 days
  - 90 days
  - 30 days
  - 15 days
key: A
explanation: The statute requires the Commission to mail or electronically transmit the renewal
  application and notice at least 60 days before the license expires. The 30‑day distractor
  mistakenly assumes a shorter notice period.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 § 17-314
  url: null
  quoted_text: "At least 60 days before a license expires, the Commission shall mail or electronically
    transmit to the licensee, as provided in paragraph (2) of this subsection: (i) a renewal
    application form; and (ii) a notice that states: 1. the date on which the current license
    expires; and 2. the amount of the renewal fee."
