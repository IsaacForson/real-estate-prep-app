stem: An applicant who already paid the Guaranty Fund fee for a previous real estate salesperson
  application submits a new application for a broker license. How much must they pay to the Guaranty
  Fund for this new application?
options:
  - $20
  - $10
  - $5
  - $0
key: D
explanation: Regardless of how many times an individual applies, the Commission may charge the
  Guaranty Fund fee only once. Having already paid the fee, the applicant owes nothing for the
  subsequent application. The $5 distractor is the branch office certificate application fee, not
  the Guaranty Fund fee.
