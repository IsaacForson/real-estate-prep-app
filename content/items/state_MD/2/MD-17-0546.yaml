stem: A licensee receives $2,000 earnest money from a buyer and deposits it into an interest‑bearing
  account without written instructions to the contrary. Is this permissible under COMAR 09.11.06?
options:
  - The deposit is permissible because the money is held for the buyer.
  - The deposit is permissible because the account is clearly designated as escrow.
  - The deposit is not permissible because the money must be in a non-interest-bearing account.
  - The deposit is not permissible because the licensee failed to notify the Commission.
key: C
explanation: COMAR § 09.11.06 states that money held for others must be deposited and retained in a
  non‑interest‑bearing escrow account unless the parties provide written instructions to the
  contrary. Because no such instructions exist, placing the earnest money in an interest‑bearing
  account is not allowed. The requirement to notify the Commission is unrelated to the
  escrow‑account rule.
