stem: A licensee completes a distance learning course that is 7 clock hours long and covers fair
  housing law. Under COMAR 09.11.06.01, does this course satisfy the definition of a 'Course' for
  continuing education?
options:
  - No, because the course length is less than 1.5 clock hours.
  - Yes, because the course covers a fair housing topic.
  - Yes, because the course is delivered via distance learning.
  - No, because the course length exceeds 6 clock hours.
key: D
explanation: According to COMAR § 09.11.06.01, a Course must be at least 1.5 clock hours and no more
  than 6 clock hours. A 7‑clock‑hour course exceeds the maximum allowed length, so it does not
  qualify. The option stating that the course satisfies because it covers a fair housing topic is
  incorrect because covering a permitted topic does not override the length restriction.
