stem: Under COMAR 09.11.01.01(2), unless otherwise specified in the brokerage agreement, how must a
  licensee present all written offers or counteroffers received to the client?
options:
  - The licensee must present the offers only in electronic format.
  - The licensee must present the offers only if the client requests them.
  - The licensee must present the offers in full and in hard copy or electronic format.
  - The licensee must present the offers only in hard copy format.
key: C
explanation: The correct answer is that the licensee must present the offers in full and in hard
  copy or electronic format, as stated in COMAR 09.11.01.01(2). The most tempting distractor is the
  option that requires presentation only in hard copy format, because the rule allows either hard
  copy or electronic format unless the brokerage agreement specifies otherwise.
