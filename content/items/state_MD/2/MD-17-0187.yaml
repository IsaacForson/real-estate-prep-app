  - $00.00
  - $20.00
key: D
explanation: Before issuing any real estate broker, associate broker, or salesperson license, the
  applicant must pay a $20 fee to be credited to the Guaranty Fund, unless they have already paid it
  previously. The $0.00 distractor incorrectly assumes no fee is required.
