stem: How long must a course provider maintain records of course attendees, outlines, instructor
  information, and final grades after a course ends?
options:
  - One year after the course ends
  - Three years after the course ends
  - Five years after the course ends
  - Ten years after the course ends
key: C
explanation: COMAR 09.11.03.03(G) requires course providers to keep attendee records, outlines,
  instructor information, and final grades for at least five years after each course offering
  expires. The distractor “Three years after the course ends” is incorrect because the rule
  specifies a five‑year minimum, not three.
