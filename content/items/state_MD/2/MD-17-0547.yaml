stem: A broker uses only an answering service and a mail drop as their place of business, with no
  physical office where they regularly transact business. Is this permissible under COMAR 09.11.11?
options:
  - The broker's place of business is not permissible because the Commission may not consider an
    answering service or mail drop as an office.
  - The broker's place of business is permissible because the broker regularly transacts business
    via phone.
  - The broker's place of business is permissible because an answering service counts as an office.
  - The broker's place of business is permissible because a mail drop satisfies the headquarters
    requirement.
key: A
explanation: The regulation explicitly states that the Commission may not consider an answering
  service, a mechanical message recording device, or a mail drop, singly or in combination, to
  satisfy the office requirement. Therefore, using only an answering service and a mail drop does
  not meet the definite place of business standard. The distractor about transacting business via
  phone does not override the prohibition on those devices.
