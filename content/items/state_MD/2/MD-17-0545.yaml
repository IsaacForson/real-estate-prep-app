stem: Under COMAR 09.11.02, what must a broker obtain before acting as both principal and agent in
  the same transaction?
options:
  - The broker must obtain consent of all parties concerned.
  - The broker must obtain a signed disclosure from the buyer only.
  - The broker must obtain a license amendment from the Commission.
  - The broker must obtain written approval from the Commission.
key: A
explanation: The rule states that a broker may not act as principal and agent in the same
  transaction without consent of all parties concerned. Therefore, consent from all parties is
  required before dual representation. The distractor about Commission approval is incorrect because
  the rule does not mention Commission approval for this situation.
