stem: A licensee completes a 2-hour classroom instruction course on real estate technology. Under
  COMAR 09.11.06.01, does this course satisfy the definition of a 'Course' for continuing education?
options:
  - No, because the course length is less than 1.5 clock hours.
  - Yes, because the course covers an approved topic.
  - Yes, because the course length is between 1.5 and 6 clock hours.
  - No, because the course length exceeds 6 clock hours.
key: C
explanation: The rule defines a Course as classroom or distance learning instruction of at least 1.5
  clock hours and no more than 6 clock hours. A 2‑hour session equals 2 clock hours, which falls
  within that range, making the course qualifying. Stating that the course covers an approved topic
  does not by itself satisfy the length requirement.
