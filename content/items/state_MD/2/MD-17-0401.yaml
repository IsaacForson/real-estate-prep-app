stem: A licensee acquires a 15% ownership interest in a firm that provides real estate brokerage
  services during the licensing period. According to COMAR 09.11.01.22, within how many days must
  the licensee notify the Commission in writing of this change?
options:
  - 10 days
  - 15 days
  - 30 days
  - 60 days
key: C
explanation: The regulation requires a licensee who acquires or disposes of an ownership interest in
  an entity providing real estate brokerage services during the licensing period to furnish the
  Commission with full information within 30 days of the change. The 15‑day option incorrectly
  applies the ownership percentage to the time frame.
citation:
  source: COMAR 09.11.01–09.11.09 (Real Estate Commission regulations) — Code of Maryland Regulations
    Title 09, Subtitle 11 — Real Estate Commission (Chapters 01–09) COMAR § 09.11.01.22
  url: null
  quoted_text: A licensee acquiring or disposing of ownership interest in an entity providing real
    estate brokerage services during the licensing period shall furnish to the Commission full
    information regarding the resulting ownership interest within 30 days of the change in
    ownership.
  secondary: []
math:
  worked_solution: The regulation COMAR 09.11.01.22 specifies that a licensee must notify the
    Commission within 30 days of acquiring or disposing of an ownership interest in a brokerage
    entity, irrespective of the percentage acquired. Therefore, the answer is 30 days.
