stem: During a telephone call with a prospective buyer, a licensee discusses a property listing.
  What must the licensee clearly include in the conversation to comply with COMAR 09.11.01.16?
options:
  - The licensee's name or trade name as registered with the Commission
  - The broker's office address lines information now
  - The property's listing price value information today
  - The date and time of the call now information please
key: A
explanation: The rule mandates that in any oral communication the licensee must clearly include
  their name or trade name as registered with the Commission. Providing the broker's office address
  does not satisfy this specific oral‑communication requirement.
citation:
  source: COMAR 09.11.01–09.11.09 (Real Estate Commission regulations) — Code of Maryland Regulations
    Title 09, Subtitle 11 — Real Estate Commission (Chapters 01–09) COMAR § 09.11.01.16
  url: null
  quoted_text: Any licensee who is in the course of oral communication with another person (whether in
    person or by telephone), shall clearly and unmistakably include in the communication the
    licensee’s name, or trade name, as registered with the Commission, to insure that the licensee’s
    identity is meaningfully and conspicuously made known to that person.
