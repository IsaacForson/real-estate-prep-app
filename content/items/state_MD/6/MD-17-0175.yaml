stem: A licensee requests a copy of the code of ethics 14 months after the Commission’s last
  scheduled distribution. Under Maryland law, is the Commission obligated to provide a copy now?
options:
  - No, because the periodic distribution is not due until 24 months have passed
  - No, because the Commission may deny requests made before the next scheduled distribution
  - Yes, but only if the licensee has not received a copy in the past 12 months
  - Yes, because the Commission must provide a copy upon request regardless of the periodic schedule
key: D
explanation: The Commission must provide a copy of the code of ethics to any person who requests it
  (§17-207(b)(2)). This duty is independent of the biennial distribution requirement, so the request
  triggers an obligation. The distractor B incorrectly treats the periodic rule as limiting the
  on‑request duty.
