stem: A licensee last received a copy of the code of ethics 28 months ago. Under Maryland law, has
  the Commission violated its duty to provide the code of ethics?
options:
  - No, because the licensee did not request a copy
  - No, because the Commission provides the copy only upon request
  - Yes, but only if the licensee works in commercial real estate
  - Yes, because more than 24 months have passed without providing the copy
key: D
explanation: The Commission must provide a copy of the code of ethics at least once every 2 years
  (§17-207(b)(1)). Since 28 months exceeds 24 months, the duty is violated. The distractor B
  incorrectly ties the duty to a request; the periodic duty exists regardless of request.
