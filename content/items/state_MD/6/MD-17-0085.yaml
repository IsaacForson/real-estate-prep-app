stem: Under Maryland law, how often must the State Real Estate Commission provide a copy of the code
  of ethics to each licensee?
options:
  - The Commission must provide a copy every 60 months.
  - The Commission must provide a copy every 12 months.
  - The Commission must provide a copy every 36 months.
  - The Commission must provide a copy every 24 months.
key: D
explanation: The statute requires the Commission to provide a copy of the code of ethics to each
  licensee at least once every 2 years. Therefore, a biennial schedule satisfies the minimum
  requirement. Providing copies more frequently is permitted but not required, so the 12‑month
  option is not the mandated interval.
