stem: A licensee pays a $300 referral fee to an unlicensed acquaintance who recommended a buyer.
  Under Maryland law, is the licensee permitted to make this payment?
options:
  - No, because the statute forbids any compensation to an unlicensed person for brokerage services.
  - Yes, because the acquaintance is not providing brokerage services, only a referral.
  - Yes, because the fee is less than $500, which is allowed for referrals.
  - No, but only if the licensee discloses the payment to the Commission within 10 days.
key: A
explanation: Section 17‑604(a) prohibits paying any compensation for brokerage services to a person
  who is not licensed under the title. Since the acquaintance is unlicensed, the payment is
  prohibited regardless of amount or disclosure. The other options incorrectly suggest exceptions
  that do not exist in the statute.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
    Brokers (MGA Statute_Web, 2025RS) § 17-604(a)
  url: null
  quoted_text: |-
    a) Except as provided in subsection (b) of this section, a real estate broker, 
    an associate real estate broker, or a real estate salesperson may not pay 
    compensation, in any form, for the provision of real estate bro kerage services to any 
    person who is not licensed under this title
