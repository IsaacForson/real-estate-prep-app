stem: A licensee wishes to act as a dual agent in a residential transaction. Under Maryland law,
  what is required before the licensee may do so?
options:
  - The licensee must obtain written informed consent from all parties to the transaction.
  - The licensee must obtain written informed consent from the parties after closing.
  - The licensee must obtain written informed consent from all parties to the transaction verbally.
  - The licensee must obtain written informed consent from either the buyer or the seller.
key: A
explanation: Section 17‑530.1(b)(1)(i) states that a licensed real estate broker may act as a dual
  agent only after obtaining the written informed consent of all parties to the transaction. Consent
  from only one party or mere disclosure without consent does not satisfy the statutory requirement.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
    Brokers (MGA Statute_Web, 2025RS) § 17-530.1(b)(1)(i)
  url: null
  quoted_text: |-
    b) (1) (i) If a licensed real estate broker obtains the written 
    informed consent of all parties to a real estate transaction, the real estate broker, or 
    a branc h office manager described in § 17–518(d) of this subtitle who has been 
    designated by the licensed real estate broker, may act as a dual agent for both the 
    seller and the buyer or the lessor and the lessee in the same real estate transaction
