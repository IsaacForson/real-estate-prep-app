stem: Under Maryland law, what is the definition of a 'team' in the context of real estate brokerage?
options:
  - A team consists of any two individuals affiliated with the same brokerage regardless of license
    type.
  - A team consists of a licensed real estate salesperson and a licensed real estate broker working
    under the same firm.
  - A team consists of a licensed real estate broker and at least one licensed associate real estate
    broker.
  - A team consists of two or more licensed associate real estate brokers or licensed real estate
    salespersons, or any combination thereof.
key: D
explanation: "The definition is explicitly stated in §17-543: a team means two or more licensed
  associate real estate brokers or licensed real estate salespersons, or any combination thereof,
  who work together regularly and represent themselves as one entity. The other options incorrectly
  require a broker or impose unrelated conditions."
