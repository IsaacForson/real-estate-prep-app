stem: A broker prepares a sales contract for a buyer but forgets to include the Guaranty Fund
  notice. Which statement best describes the broker's compliance with § 17-405?
options:
  - The broker is not compliant because the statute requires the notice in each sales contract.
  - The broker is compliant because the buyer may file a Guaranty Fund claim.
  - The broker is not compliant only if the transaction price exceeds $500,000.
  - The broker is compliant because the notice is optional for residential sales.
key: A
explanation: The statute mandates the notice in each sales contract; omitting it is noncompliant
  regardless of price or buyer remedy.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
    Brokers (MGA Statute_Web, 2025RS) — § 17-405
  url: null
  quoted_text: A real estate broker shall include in each sales contract that is provided by the real
    estate broker a written notice to the buyer that the buyer is protected by the Guaranty Fund in
    an amount not exceeding $50,000.
