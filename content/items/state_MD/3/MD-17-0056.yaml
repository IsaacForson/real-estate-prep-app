stem: Under Maryland law, what written disclosure must a licensee make when participating in a
  residential real estate transaction as a seller's agent, buyer's agent, or subagent?
options:
  - The licensee must disclose in writing that the licensee represents the party whose name appears
    on the listing contract.
  - The licensee must disclose in writing that the licensee represents only the party who paid the
    commission.
  - The licensee must disclose in writing that the licensee represents the seller or lessor or the
    buyer or lessee.
  - The licensee must disclose in writing that the licensee represents both the seller and the buyer
    in the transaction.
key: C
explanation: The rule requires a licensee to provide a written disclosure of whom the licensee
  represents when acting as a seller’s agent, buyer’s agent, or subagent in a residential
  transaction. The correct answer describes that the licensee must disclose that they represent the
  seller or lessor or the buyer or lessee. An answer stating that the licensee represents only the
  party who paid the commission is incorrect because the statute does not limit disclosure to the
  commission‑paying party.
citation:
  source: "### Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
    Brokers (MGA Statute_Web, 2025RS) §17-530(a)(1)"
  url: null
  quoted_text: (a) (1) Except as provided in paragraphs (2) and (3) of this subsection, a licensee who
    participates in a residential real estate transaction as a seller ’s agent, buyer’s agent, or a
    subagent shall disclose in writing that the licensee represents the seller or lessor or the
    buyer or lessee as provided in this section.
