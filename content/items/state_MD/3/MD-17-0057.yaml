stem: A licensee wishes to represent both the buyer and seller in a residential transaction without
  obtaining their written informed consent. Is this permissible under Maryland law?
options:
  - Under Maryland law, the licensee may act as a dual agent if they disclose the dual agency to the
    parties.
  - Under Maryland law, the licensee may act as a dual agent if the transaction is commercial rather
    than residential.
  - Under Maryland law, the licensee may not act as a dual agent without obtaining written informed
    consent of all parties.
  - Under Maryland law, the licensee may act as a dual agent if they are affiliated with the same
    broker.
key: C
explanation: Maryland law prohibits dual agency unless the licensee obtains written informed consent
  from all parties to the transaction. The correct answer reflects this prohibition. The option
  stating that mere disclosure satisfies the consent requirement is incorrect because disclosure
  alone does not meet the consent requirement.
