stem: Under Maryland's Code of Ethics governing relations to fellow licensees, how must the agency
  of a licensee holding an exclusive listing be treated?
options:
  - The agency created by an exclusive listing may be freely ignored
  - The agency created by an exclusive listing belongs to the seller alone
  - The agency created by an exclusive listing shall be respected
  - The agency created by an exclusive listing expires after ten days
key: C
explanation: The Code of Ethics states plainly that the agency of a licensee who holds an exclusive
  listing shall be respected, which is why negotiations on that property are carried on solely with
  the listing broker.
