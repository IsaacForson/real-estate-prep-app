stem: Under a Maryland Real Estate Commission regulation, who must be a signator on checks drawn on
  a broker's required escrow account?
options:
  - The broker, or at least one of the signators
  - An unlicensed bookkeeper employed by the brokerage
  - Any salesperson affiliated with the brokerage
  - The buyer's attorney handling the settlement
key: A
explanation: The regulation requires the broker to be a signator, or one of the signators, on checks
  drawn against the escrow account the broker is required to maintain, keeping disbursement of trust
  funds under the broker's direct control.
citation:
  source: COMAR § 09.11.01.17 — Escrow Account Signators
  url: null
  quoted_text: A real estate broker shall be a signator or at least one of the signators on checks
    which may be drawn on escrow accounts which, under Business Occupations and Professions Article,
    Title 17, Subtitle 5, Part I, Annotated Code of Maryland, this real estate broker is required to
    maintain at all times.
