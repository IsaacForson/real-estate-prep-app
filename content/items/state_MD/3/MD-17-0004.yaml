stem: A licensee places a for-sale sign and prepares a listing contract using the brokerage's
  registered trade name. What must also appear on those documents?
options:
  - The licensee's personal home address and phone number
  - The trade name of a competing brokerage for comparison
  - A disclaimer stating the trade name is unregistered
  - The licensee's name or trade name as registered
key: D
explanation: A licensee using a trade name on a for-sale sign, listing contract, or similar document
  must clearly include the licensee's name, or the trade name as registered with the Commission, on
  that document.
citation:
  source: COMAR § 09.11.01.16 — Use of Trade Names
  url: null
  quoted_text: A licensee using a trade name on a for-sale sign, business card, office sign, sales
    contract, listing contract, or other document relating to real estate activities as defined
    under Business Occupations and Professions Article, §17-101, Annotated Code of Maryland , shall
    clearly and unmistakably include on any of these documents the licensee’s name, or trade name,
    as registered with the Commission.
