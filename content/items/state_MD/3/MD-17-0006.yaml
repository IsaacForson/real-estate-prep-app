stem: A licensee wants to submit a personal offer to purchase a home listed by another agent. Under
  the Code of Ethics, when must the licensee disclose the licensee's licensing status to the seller?
options:
  - After the sale contract has been fully ratified
  - No later than the time the offer is submitted
  - After the seller specifically requests such disclosure
  - No later than 30 days after closing occurs
key: B
explanation: A licensee seeking to acquire an interest in real property must disclose the licensee's
  licensing status in writing to the seller or lessor no later than the time an offer is submitted.
