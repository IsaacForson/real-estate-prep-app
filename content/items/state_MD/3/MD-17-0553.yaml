stem: A course provider receives a denial of course approval on Thursday, March 7. According to
  COMAR 09.11.02(B), what is the last business day on which the provider may file a request for
  review to be timely?
options:
  - March 13
  - March 20
  - March 15
  - March 22
key: B
explanation: The rule requires the request to be filed within 10 business days of receipt of the
  denial notice. Counting 10 business days from March 7 (excluding weekends) leads to March 20.
  March 15 would only be six business days after receipt.
