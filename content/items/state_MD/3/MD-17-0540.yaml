stem: A licensee requires a buyer to use a specific title insurance company as a condition of
  settlement. Under Maryland law, is this permissible?
options:
  - The requirement is not permissible under § 17-322(b)(29) and § 17-607(a)
  - The requirement is permissible if disclosed in the contract
  - The requirement is permissible if the buyer consents in writing
  - The requirement is permissible because the title company offers a discount
key: A
explanation: Section 17-322(b)(29) lists requiring a buyer to employ a particular title company as a
  violation, and § 17-607(a) expressly forbids such a requirement. The distractor incorrectly
  suggests that buyer consent makes it permissible, but the prohibition applies regardless of
  consent.
