stem: A broker prepares a sales contract for a buyer purchasing a residential property. What must
  the broker include in that contract?
options:
  - The broker must include a written notice that the buyer is protected by the Guaranty Fund up to
    $100,000.
  - The broker must include a written notice that the seller is protected by the Guaranty Fund up to
    $50,000.
  - The broker must include a written notice that the buyer is protected by the Guaranty Fund up to
    $25,000.
  - The broker must include a written notice that the buyer is protected by the Guaranty Fund up to
    $50,000.
key: D
explanation: Under Md. Code Ann., Bus. Occ. & Prof. § 17-405, a broker must include in each sales
  contract a written notice informing the buyer that the buyer is protected by the Guaranty Fund up
  to $50,000. Therefore, the correct notice is that the buyer is protected up to $50,000. The
  distractor that states the seller is protected misapplies the rule, which only protects the buyer.
  The distractor that cites $100,000 exceeds the statutory limit.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
    Brokers (MGA Statute_Web, 2025RS) — § 17-405
  url: null
  quoted_text: A real estate broker shall include in each sales contract that is provided by the real
    estate broker a written notice to the buyer that the buyer is protected by the Guaranty Fund in
    an amount not exceeding $50,000.
