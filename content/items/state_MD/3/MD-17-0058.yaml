stem: A licensee is preparing to represent a buyer in a residential real estate transaction. What
  must the licensee do regarding disclosure forms?
options:
  - The licensee must utilize a standard disclosure form that includes the information specified in
    § 17-530(f).
  - The licensee must utilize a standard disclosure form when the transaction involves a new
    construction property.
  - The licensee must utilize a standard disclosure form when the buyer is a first-time homebuyer.
  - The licensee must utilize a standard disclosure form when the property is located in a flood
    zone.
key: A
explanation: The rule requires licensees to use a standard disclosure form that contains the
  information listed in § 17‑530(f) for every residential real estate transaction. The option
  stating that the form must be used only when the property is new construction is incorrect because
  the requirement applies regardless of whether the property is newly built. Similarly, the options
  limiting the requirement to first‑time homebuyers or to properties in a flood zone are incorrect
  because the rule does not depend on the buyer’s experience or the property’s flood‑zone status.
citation:
  source: "### Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
    Brokers (MGA Statute_Web, 2025RS) §17-530.2(a)(1)"
  url: null
  quoted_text: (a) (1) A licensed real estate broker, licensed associate real estate broker, or
    licensed real estate salesperson who participates in a residential real estate transaction shall
    utilize a standard disclosure form in each real estate transaction that includes the information
    specified in § 17–530(f) of this subtitle.
