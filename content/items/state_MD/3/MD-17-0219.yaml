stem: A licensee enters into a brokerage agreement that requires the licensee to handle tenant
  screening and rent collection, tasks not mentioned in the standard duties under § 17-532. Is this
  arrangement permissible under Maryland law?
options:
  - The arrangement is permissible, because the law allows additional duties beyond those in §
    17-532.
  - The arrangement is impermissible, because any duty not listed in § 17-532 is prohibited.
  - The arrangement is permissible only if the client provides written consent for each additional
    duty.
  - The arrangement is impermissible unless the licensee obtains a separate brokerage agreement for
    each task.
key: A
explanation: Section 17-531 expressly states that a brokerage agreement may impose on a licensee
  duties and obligations in addition to those specified in § 17-532, without prohibition. Therefore,
  adding tenant screening and rent collection is allowed. The incorrect options mistakenly treat
  extra duties as prohibited or impose extra consent or agreement requirements not found in the
  statute.
citation:
