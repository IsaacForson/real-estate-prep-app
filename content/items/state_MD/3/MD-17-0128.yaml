stem: A licensee wishes to place a for-sale sign on a residential property listed by the licensee.
  The owner has not given consent. What must the licensee do under COMAR?
options:
  - Notify the owner verbally before placing the sign
  - Obtain the owner's prior consent before placing the sign
  - Place the sign only if the property is vacant before obtaining consent
  - Submit the sign design to the Commission before placing the sign
key: B
explanation: COMAR prohibits placing a sign without the owner's prior consent, so the licensee must
  obtain that consent before posting any sign. The distractor "Place the sign after notifying the
  owner verbally" is wrong because mere notification does not satisfy the consent requirement.
citation:
  source: COMAR 09.11.01–09.11.09 § 03C
  url: null
  quoted_text: Signs giving notice of property for sale, rent, lease, or exchange may not be placed on
    any property without the owner's prior consent.
