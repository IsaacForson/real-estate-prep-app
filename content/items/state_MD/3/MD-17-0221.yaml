stem: What must a real estate broker include in each sales contract provided to a buyer under
  Maryland law?
options:
  - A disclosure of the broker's commission rate as a percentage.
  - A written notice that the buyer is protected by the Guaranty Fund up to $50,000.
  - A copy of the broker's current license certificate.
  - A statement that the property is free of any encumbrances.
key: B
explanation: The statute requires brokers to include a written notice that the buyer is protected by
  the Guaranty Fund in an amount not exceeding $50,000. The other options are not required by this
  provision.
