stem: What must a brokerage agreement between a broker and a seller or lessor include regarding the
  agreement's duration?
options:
  - A termination date requiring ninety days written notice
  - An indefinite duration renewable at the broker's sole discretion
  - A termination date fixed by the local zoning jurisdiction
  - A definite termination date effective without notice
