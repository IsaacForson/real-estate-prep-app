stem: A dispute arises between a buyer and seller over deposit funds a licensee is holding, and the
  contract of sale contains no provision addressing such a dispute. Which of the following actions
  may the licensee properly take under COMAR?
options:
  - Hold the funds until receiving signed releases from every party
  - Release the funds to whichever party contacts the licensee first
  - Deposit the funds into the licensee's personal operating account
  - Discard the deposit records to avoid an ongoing dispute
key: A
explanation: When a contract is silent on how to resolve a dispute over deposit funds, the licensee
  may hold the funds until obtaining releases signed by all parties authorizing how the funds should
  be disposed of.
citation:
  source: COMAR § 09.11.01.18 — Disposition of Deposit Monies Held by Licensees
