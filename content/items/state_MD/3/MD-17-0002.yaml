stem: Under COMAR, how long after the date of the underlying listing contract, contract of sale,
  lease agreement, or option may the Commission summarily dismiss a complaint against a licensee,
  absent a justified delay?
options:
  - After 1 year from the date of the underlying contract
  - After 3 years from the date of the underlying contract
  - After 10 years from the date of the underlying contract
  - After 6 months from the date of the underlying contract
key: B
explanation: The regulation lets the Commission summarily dismiss a complaint filed more than 3
  years after the written listing contract, contract of sale, lease agreement, option, or action on
  which the complaint is based, unless the delay was justified.
citation:
  source: COMAR § 09.11.01.19 — Time Limitation for Filing Complaints
  url: null
  quoted_text: The Commission may summarily dismiss any complaint brought against a licensee after 3
    years from the date of the written listing contract, contract of sale, lease agreement, option,
    or actions upon which the complaint is based, unless the Commission finds that the complainant's
    delay in bringing the complaint was justified and that the delay does not result in an undue
    burden for the licensee.
