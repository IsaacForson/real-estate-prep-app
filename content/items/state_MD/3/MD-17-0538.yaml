stem: Under §17-322.1(b), which of the following is **NOT** grounds for disciplinary action against
  a licensee?
options:
  - Failing to disclose a known roof leak to the buyer
  - Failing to disclose that the property owner is infected with HIV
  - Failing to disclose homeowners' association fees to the buyer
  - Failing to disclose that the property is in a flood zone
key: B
explanation: Under §17-322.1(b), a licensee is not disciplined for failing to disclose facts listed
  in subsection (a), such as HIV infection of the property owner. Failing to disclose a known roof
  leak is a material fact and thus grounds for discipline.
citation:
