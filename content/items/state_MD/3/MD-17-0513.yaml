stem: Under § 17-405, in which situation must a broker include the Guaranty Fund notice in a sales
  contract?
options:
  - When the contract is for a lease rather than a sale.
  - When the broker prepares the contract for the buyer.
  - When the seller provides the contract to the buyer.
  - When the buyer's attorney prepares the contract.
key: B
explanation: The statute requires the notice in each sales contract that is provided by the broker;
  therefore, the notice is required only when the broker prepares the contract. The other options
  describe situations where the contract is not provided by the broker, so the notice is not
  mandated by § 17-405.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
    Brokers (MGA Statute_Web, 2025RS) — § 17-405
  url: null
  quoted_text: A real estate broker shall include in each sales contract that is provided by the real
    estate broker a written notice to the buyer that the buyer is protected by the Guaranty Fund in
    an amount not exceeding $50,000.
