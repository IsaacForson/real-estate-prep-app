stem: A licensee has an exclusive listing on a property. Another broker brings a prospective buyer
  who makes an offer. Under COMAR, how must the licensee proceed?
options:
  - Cooperate with other broker, share commissions, and negotiate solely with listing broker
  - Refer the buyer to the listing broker and decline any involvement
  - Negotiate directly with the buyer and keep the full commission
  - Inform the buyer that the property is not available for showings
key: A
explanation: The rule requires cooperation with other brokers, sharing commissions on a previously
  agreed basis, and conducting negotiations solely with the listing broker. The distractor
  "Negotiate directly with the buyer and keep the full commission" violates both the cooperation and
  commission-sharing obligations.
citation:
  source: COMAR 09.11.01–09.11.09 § 03B
  url: null
  quoted_text: The licensee shall cooperate with other brokers on property listed by the licensee
    exclusively whenever it is in the interest of the client, and share commissions on a previously
    agreed basis. Negotiations concerning property listed exclusively with one broker shall be
    carried on solely with the listing broker.
