stem: A licensee advertises free appraisals to attract prospective sellers. Under the
  grounds-for-discipline statute, this advertisement is lawful under which condition?
options:
  - The licensee charges a reduced fee for appraisals for first-time buyers
  - The licensee is prepared to appraise property free for anyone
  - The licensee limits the free offer to property already listed with the firm
  - The licensee offers free appraisals to existing brokerage clients
key: B
explanation: Advertising free appraisals is grounds for discipline unless the advertiser is prepared
  to appraise real estate free of charge for any person, regardless of why that person requests the
  appraisal.
