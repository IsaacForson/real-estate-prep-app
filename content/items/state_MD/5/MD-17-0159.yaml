stem: A licensee representing a seller learns that the roof leaks but does not inform the buyer.
  Which statement best describes the licensee's conduct under Maryland law?
options:
  - The licensee has violated the duty to disclose material facts.
  - The licensee has acted permissibly as long as the licensee was unaware of the leak.
  - The licensee has violated the duty only if the buyer suffers actual damages.
  - The licensee has committed no violation because the buyer did not ask about the roof.
key: A
explanation: Under § 17-530(f)(3), a licensee must disclose all known material facts about the
  property. Failing to disclose a known leak violates this duty irrespective of whether the buyer
  asks or suffers damages.
