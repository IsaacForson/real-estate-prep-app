stem: A course provider wants to include the phone number of a third-party sponsor in the
  advertisement for a specific course. What does COMAR 09.11.06(C) prohibit?
options:
  - The advertisement must not include contact information for individuals or entities other than
    the approved course provider.
  - The advertisement must not include the course provider’s office address or telephone number.
  - The advertisement must not include any mention of the course’s cost or refund policy.
  - The advertisement must not include the name of any sponsor in the advertising material.
key: A
explanation: The rule bars any contact information for persons or entities other than the approved
  course provider from appearing in the course advertisement. Including a sponsor’s phone number
  violates this prohibition, whereas omitting sponsor names or cost details is not required.
