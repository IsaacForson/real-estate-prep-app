stem: A licensee is speaking with a prospective client about a possible brokerage relationship that
  has not yet been formed, and the prospective client shares confidential financial information. If
  no brokerage relationship ever forms, may the licensee later disclose that information to a third
  party?
options:
  - If the prospective client consents in writing to it
  - Yes, because no brokerage relationship was ever created
  - Yes, but after the client signs with a competitor instead
  - If the third party works at the same brokerage
key: A
explanation: "The confidentiality duty attaches even before a brokerage relationship exists: a
  licensee may not disclose confidential information obtained from a prospective client in
  anticipation of forming that relationship unless the prospective client consents in writing."
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. § 17-532(d)
  url: null
  quoted_text: A licensee may not disclose confidential information obtained from a prospective client
    in anticipation of forming a brokerage relationship, unless the prospective client consents in
    writing to the disclosure.
