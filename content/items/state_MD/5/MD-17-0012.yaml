stem: Under Maryland law, when may an individual licensed in Maryland divide a commission earned
  here with an individual licensed in another state?
options:
  - When the out-of-state individual is a licensed attorney
  - If that other state allows dividing its fees with a Maryland licensee
  - Whenever both individuals hold a recognized national brokerage designation
