stem: Under the statute defining material facts for disclosure purposes, is the occurrence of a
  natural death on a property considered a material fact?
options:
  - Yes, a natural death that occurred on the property is material
  - Yes, but if the death occurred within the past five years
  - No, a natural death on the property is not a material fact
  - No, unless the buyer specifically asks about prior deaths
key: C
explanation: The statute specifies that a homicide, suicide, accidental death, natural death, or
  felony occurring on a property is not a material fact that must be disclosed to a prospective
  purchaser or lessee.
