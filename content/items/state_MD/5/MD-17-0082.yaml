stem: A course provider wishes to advertise a continuing education course that has been submitted to
  the Commission but has not yet received approval. What must the advertisement state according to
  COMAR 09.11.06(G)?
options:
  - The advertisement must state that the course is “approved by the Commission”.
  - The advertisement must state that the course is “under review by the Commission”.
  - The advertisement must state that the course is “subject to Commission approval”.
  - The advertisement must state that the course is “pending final approval”.
key: C
explanation: The regulation specifies that a course pending approval must be advertised exactly as
  “subject to Commission approval”. Stating that the course is already approved or merely under
  review does not satisfy this requirement.
