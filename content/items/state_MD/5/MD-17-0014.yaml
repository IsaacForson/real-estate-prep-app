stem: A broker's associate brokers and salespersons are handling transactions with minimal broker
  oversight. What does COMAR require of the broker regarding these licensees?
options:
  - Delegate oversight duties entirely to the branch office manager
  - Review their files once a year at license renewal
  - Require them to co-sign every listing with the broker
  - Exercise reasonable and adequate supervision over their work
key: D
explanation: A broker must exercise reasonable and adequate supervision over the activities of the
  broker's associate brokers and salespersons, a duty that cannot be satisfied by minimal or
  occasional oversight.
