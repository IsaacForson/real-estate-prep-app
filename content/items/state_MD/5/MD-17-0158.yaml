stem: Under Maryland law, when a licensee learns of a material defect in the property they are
  selling, what must they do?
options:
  - The licensee must disclose the defect to the buyer.
  - The licensee must keep the defect confidential unless the buyer asks.
  - The licensee must disclose the defect only to the broker.
  - The licensee must wait until closing to disclose the defect.
key: A
explanation: Section 17-530(f)(3) requires licensees to disclose all material facts that are known
  or should be known relating to a property. Keeping the defect confidential unless asked violates
  this duty because disclosure is required regardless of whether the buyer inquires.
