stem: A buyer's agent knows an offer to purchase a home will be submitted soon. Under COMAR guidance
  on the disclosure/disclaimer statement, what should the buyer's agent do before that offer is
  submitted?
options:
  - Wait for the seller's agent to raise the topic later on
  - Forward the statement to the buyer after settlement gets finalized
  - Tell the buyer that the statement is entirely optional here
  - Try to get the disclosure or disclaimer statement to the buyer
key: D
explanation: COMAR guidance directs the buyer's agent to make every effort to ensure the prospective
  purchaser has the disclosure statement or the disclaimer statement in hand before submitting the
  offer to purchase.
citation:
  source: COMAR § 09.11.07.02 — Guidelines (Residential Property Disclosure/Disclaimer)
  url: null
  quoted_text: The buyer’s agent should make every effort to ensure that the prospective purchaser has
    the disclosure statement or the disclaimer statement in hand before submission of the offer to
    purchase the property.
