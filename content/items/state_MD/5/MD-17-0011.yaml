stem: Under Maryland's real estate licensing law, may an unlicensed person recover compensation in
  court for having provided real estate brokerage services?
options:
  - No, unless the person was authorized to provide those services
  - Yes, provided the services were performed honestly and in good faith
  - Yes, if the unlicensed person disclosed the lack of a license
  - No, but if the transaction involved residential property
key: A
explanation: A person may not bring or recover on an action for compensation for real estate
  brokerage services in a Maryland court unless that person was authorized to provide those services
  at the time.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. § 17-516
  url: null
  quoted_text: A person may not bring an action or recover on an action for compensation for providing
    real estate brokerage services in a court of the State unless the person was authorized to
    provide real estate brokerage services under this title at the time of offering to provide and
    providing real estate brokerage services.
