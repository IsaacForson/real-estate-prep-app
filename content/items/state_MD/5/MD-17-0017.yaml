stem: A broker offers a local attorney a fee simply for referring the attorney's clients to the
  brokerage, with no other service performed. Is this arrangement permitted under the statute
  governing referral fees to lawyers?
options:
  - Yes, provided the fee is paid soon after the sale closes
  - Yes, as long as the attorney signs a detailed written referral agreement
  - No, a broker may not pay a lawyer a fee for merely referring a client
  - No, unless the attorney happens to be related to a party
key: C
explanation: The statute bars a real estate broker, associate broker, or salesperson from paying or
  offering to pay a commission to a lawyer simply for referring a person as a possible party to a
  residential transaction.
