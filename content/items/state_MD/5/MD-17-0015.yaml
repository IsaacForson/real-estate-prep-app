stem: A time share developer tells prospective buyers that the Real Estate Commission has approved
  its time share project. Is this representation permitted under COMAR?
options:
  - No, a developer may not claim Commission approval of the project
  - Yes, provided the claim appears in the company's printed brochures
  - No, unless the developer gets written buyer acknowledgment
  - Yes, if the Commission actually reviewed the registration
key: A
explanation: COMAR bars a time share developer, broker, salesman, or any other person from
  advertising or representing that the Real Estate Commission has approved or recommended a time
  share project or estate.
citation:
  source: COMAR § 09.11.04.04 — General Regulations (Time Share)
  url: null
  quoted_text: A time share developer, real estate broker, salesman, or any other person may not
    advertise or represent that the Real Estate Commission has approved or recommended any time
    share project or estate offered for sale.
