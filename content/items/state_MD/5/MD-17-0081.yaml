stem: According to COMAR 09.11.06(E), what information must be included in the advertising material
  for a specific approved real estate continuing education course?
options:
  - The advertisement must include the title, topic, name of the approved course provider,
    Commission approval number, number of approved hours, and the course provider’s refund policy.
  - The advertisement must include the title, topic, name of the approved course provider,
    Commission approval number, and number of approved hours.
  - The advertisement must include the title, topic, name of the approved course provider,
    Commission approval number, number of approved hours, cost of the course, and the instructor’s
    name.
  - The advertisement must include the title, topic, name of the approved course provider,
    Commission approval number, number of approved hours, and cost of the course.
key: D
explanation: The rule explicitly requires the advertisement to contain the title, topic, provider
  name, approval number, hours, and cost. Omitting the cost, as in the option that does not include
  the cost, fails to meet this requirement.
