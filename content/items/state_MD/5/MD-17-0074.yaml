stem: A broker places an advertisement that includes the licensee’s full name exactly as it appears
  on the license certificate and pocket card, but shows only the brokerage’s logo without any text
  of the business name. Under Maryland advertising rules, is this advertisement permissible?
options:
  - No, because the advertisement must include the full business name and not merely a logo.
  - No, because the licensee’s first name is sufficient identification.
  - No, because the advertisement must include the licensee’s full name as on the license
    certificate.
  - No, because the logo satisfies the business name requirement.
key: A
explanation: The advertisement satisfies the licensee‑name requirement but violates the rule that
  the business name must be included and may not be represented solely by a logo. The distractor
  claiming the licensee’s first name is sufficient is wrong because the full name as on the license
  certificate is required.
