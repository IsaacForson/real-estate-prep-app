stem: A Maryland broker wants to pay part of a commission to an individual who holds no Maryland
  license but is licensed to provide brokerage services in another state. Under the statute limiting
  payments to unlicensed persons, when is this payment permitted?
options:
  - Whenever the individual has five years of industry experience
  - If that individual also meets the interstate fee-division rule
  - When the transaction property sits outside Maryland instead
  - Whenever the broker notes the payment in the closing statement afterward
key: B
explanation: The general ban on paying unlicensed persons does not apply to an individual who is
  licensed in another state and who also meets the interstate fee-division requirements set out for
  such reciprocal payments.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. § 17-604(b)(1)
  url: null
  quoted_text: "Subsection (a) of this section does not prohibit the payment of compensation to: (1)
    an individual: (i) who is licensed in another state; and (ii) who meets the requirements of §
    17–513 of this title;"
