stem: A licensee tells a prospective buyer that the neighborhood has a high concentration of a
  particular religious group to discourage them from making an offer. Is this permitted under
  Maryland law?
options:
  - No, because the licensee must disclose any known material facts about the neighborhood’s
    religious composition.
  - No, because making representations about the existing proximity of individuals of a particular
    religion is prohibited.
  - No, because the licensee may share demographic information as long as it is accurate.
  - No, because the statement is permissible if the buyer asks for it first.
key: B
explanation: The statute prohibits making representations about the existing proximity of
  individuals of a particular religion to discourage a purchase, regardless of the statement’s
  accuracy. The distractor claiming accuracy makes it permissible is wrong because the prohibition
  applies irrespective of truthfulness.
