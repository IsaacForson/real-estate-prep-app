stem: A broker wants to pay a finder's fee to an unlicensed neighbor for referring a buyer to the
  brokerage. Under the statute governing compensation to unlicensed persons, is this payment
  generally permitted?
options:
  - Yes, provided the fee is described in writing as a gift
  - No, a broker may not pay compensation to an unlicensed person
  - Yes, as long as the fee stays smaller than a standard commission
  - No, unless the unlicensed person once held a license
key: B
explanation: The statute prohibits a real estate broker, associate broker, or salesperson from
  paying compensation, in any form, for real estate brokerage services to a person who is not
  licensed under the title.
