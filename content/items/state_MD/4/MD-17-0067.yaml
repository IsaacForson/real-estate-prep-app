stem: A Maryland licensee holds an earnest money deposit and a dispute arises between the buyer and
  seller over its disposition. According to COMAR 09.11.01.18, what is the licensee’s first required
  action?
options:
  - File a bill of interpleader in the appropriate court
  - Hold the funds awaiting a court disbursement order
  - Hold the funds until releases signed by all parties
  - Distribute the funds according to §17‑505 procedures
key: C
explanation: The regulation lists the licensee’s duties in order; the first step is to hold the
  funds until releases signed by all parties are obtained. Only if that fails may the licensee
  proceed to interpleader or wait for a court order. Distributing per §17‑505 is a later
  alternative.
