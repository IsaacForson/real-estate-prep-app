stem: A broker receives an earnest money deposit from a buyer for a residential property. The seller
  has not provided written instructions to deposit the funds in an interest-bearing account. Under
  Maryland law, where may the broker deposit the earnest money?
options:
  - The noninterest bearing checking account
  - The money market deposit account
  - The interest-bearing savings account
  - The interest-bearing checking account
key: A
explanation: The statute permits deposit of trust money in a noninterest bearing checking account or
  a noninterest bearing savings account, or any combination, unless the owner gives written
  instructions otherwise. Since no such instructions exist, a noninterest bearing checking account
  is permissible. An interest-bearing checking account is not allowed absent written instructions.
