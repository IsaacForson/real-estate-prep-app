stem: Under Maryland law, for how many years must a licensee retain records of trust money related
  to a real estate transaction?
options:
  - 3 years
  - 2 years
  - 7 years
  - 5 years
key: D
explanation: Maryland regulations require a licensee to keep trust money records for five years,
  measured from the closing date of the transaction or, if the transaction does not close, from the
  listing date. This retention period ensures that records are available for possible Guaranty Fund
  claims or audits. The rule applies to all licensees handling trust money.
