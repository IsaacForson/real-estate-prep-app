stem: Under Maryland law, which of the following insurers may a real estate broker rely on for a
  financial institution holding trust money?
options:
  - The National Savings and Loan Insurance Corporation
  - The State of Virginia Insurance Fund
  - The Federal Home Loan Bank Board of Directors
  - The Federal Deposit Insurance Corporation
key: D
explanation: The statute requires that trust money be deposited in a financial institution whose
  deposits are insured by the Federal Deposit Insurance Corporation, among other listed insurers.
  The Private Deposit Insurance Company is not one of the authorized insurers under Maryland law.
