stem: A broker receives an earnest money deposit. The owner and beneficial owner give written
  instructions to deposit the funds in an interest‑bearing account. Under Maryland law, where may
  the broker deposit the earnest money?
options:
  - In a noninterest bearing checking account only
  - In a noninterest bearing savings account only
  - In an interest-bearing account as instructed
  - In any combination of noninterest bearing accounts
key: C
explanation: Maryland law requires a broker to keep trust money in noninterest bearing accounts
  unless the owner and beneficial owner provide written instructions to the contrary. Because
  written instructions were given to use an interest‑bearing account, the broker may follow those
  instructions and deposit the funds there. The alternatives that limit the deposit to a noninterest
  checking account, a noninterest savings account, or any combination of noninterest accounts are
  incorrect because they disregard the owners' written direction.
