stem: A licensed real estate broker who serves as a team leader for a group of associate brokers and
  salespersons must exercise supervision over the team members' brokerage activities. This duty is
  in addition to the supervision required of the broker under which Maryland provision?
options:
  - §17-320(c)(1)
  - §17-502(b)(1)
  - §17-507(b)(2)(i)
  - §17-545(b)
key: A
explanation: The team leader’s supervisory responsibility is expressly stated to be in addition to
  the broker’s supervision duties under §17-320(c)(1), which requires a broker to exercise
  reasonable and adequate supervision over any individual providing brokerage services on the
  broker’s behalf. Thus, the team leader must supervise the team while the broker remains separately
  liable for supervision under §17-320(c)(1).
