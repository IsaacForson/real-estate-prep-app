    Except as otherwise provided in subsection (c) of this section, a 
    real estate broker promptly, but not more than 7 business days after the acceptance 
    of a contract of sale by both parties, shall depo sit trust money in an account that is 
    maintained by the real estate broker: 
     
       (i) separately from the real estate broker’s own accounts; and 
     
       (ii) solely for trust money
