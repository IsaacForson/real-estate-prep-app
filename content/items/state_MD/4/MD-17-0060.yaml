stem: A Maryland real estate broker accepts a purchase contract on a Tuesday. According to
  §17-502(b)(1), by what deadline must the broker deposit the trust money into a separate trust
  account?
options:
  - End of the same day
  - Within 3 business days
  - Within 7 business days
  - Within 10 business days
key: C
explanation: The broker must deposit trust money promptly but no later than seven business days
  after both parties have accepted the contract of sale. The deposit must be into an account
  separate from the broker’s own funds and used solely for trust money. This timing protects the
  client’s funds and complies with Maryland’s trust accounting rules.
