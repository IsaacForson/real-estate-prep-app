stem: A Maryland licensee places a for‑sale sign advertising a property. According to COMAR
  09.11.01.16(C)(2), what must be clearly and unmistakably included on the sign?
options:
  - The licensee’s name or trade name as registered with the Commission
  - Only the brokerage’s name and logo on the sign
  - Only the team name associated with the listing and office location
  - Only the licensee’s telephone number and email address
key: A
explanation: The rule requires that a licensee using a trade name on a for‑sale sign shall clearly
  and unmistakably include the licensee’s name, or trade name, as registered with the Commission.
  The other options omit this required identification.
