stem: Under COMAR 09.11.01.19, after how many years may the Real Estate Commission summarily dismiss
  a complaint against a licensee, absent justification?
options:
  - 1 year
  - 2 years
  - 3 years
  - 5 years
key: C
explanation: The regulation states that the Commission may summarily dismiss any complaint brought
  after 3 years from the date of the underlying contract unless the complainant’s delay is justified
  and does not burden the licensee. Therefore, the 3‑year period is the threshold for automatic
  dismissal. The 2‑year option is incorrect because the rule specifically sets the period at three
  years, not two.
