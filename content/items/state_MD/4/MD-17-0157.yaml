stem: Besides disciplinary action under the Maryland Real Estate Brokers Act, what other liability
  may a broker face for violating a trust money provision?
options:
  - The criminal monetary penalty only
  - The civil or criminal action
  - The civil monetary fine only
  - The no additional financial liability
key: B
explanation: The statute states that a broker who violates any provision of this part is subject, in
  addition to disciplinary action, to any other civil or criminal action provided by law. Therefore,
  the broker may face either a civil or criminal action. The option stating only a civil fine is too
  narrow, and the option stating no additional liability contradicts the statute.
