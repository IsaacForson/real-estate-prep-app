stem: A Maryland licensee closed a residential real estate sale on August 15, 2022. According to
  Maryland law, until what date must the licensee retain the trust money records associated with
  this transaction?
options:
  - On August 15, 2022
  - On August 15, 2024
  - On August 15, 2026
  - On August 15, 2027
key: D
explanation: Records for a closed transaction must be retained for five years from the date of
  closing. Adding five years to August 15, 2022 yields August 15, 2027. The other options reflect
  shorter or longer periods not supported by the statute.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. § 17-507(b)(2)(i)
  url: null
  quoted_text: A licensee shall keep the records required by this section for 5 years, starting on the
    date of the closing of a real estate transaction, or, if the transaction is not closed, 5 years
    after the date of the listing.
