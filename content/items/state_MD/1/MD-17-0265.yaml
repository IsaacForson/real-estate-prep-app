stem: According to § 17-212 of the Maryland Real Estate Brokers Act, which of the following is
  expressly listed as a power of the Real Estate Commission?
options:
  - To adopt an official seal for the Commission
  - To set licensing fees for brokers and salespersons
  - To investigate complaints against licensees
  - To issue formal subpoenas for hearings
key: A
explanation: The power to adopt an official seal for the Commission is expressly listed in
  §17-212(1) of the Maryland Real Estate Brokers Act. Setting licensing fees for brokers and
  salespersons is not mentioned in this subsection.
