stem: In which of the following situations must a Maryland real estate broker include the Guaranty
  Fund notice in the contract, according to § 17-405?
options:
  - When the broker provides a sales contract to the buyer.
  - When the broker provides a listing agreement to the seller.
  - When the broker provides a lease agreement to the tenant.
  - When the broker provides a sales contract to the seller.
key: A
explanation: Under Md. Code Ann., Bus. Occ. & Prof. § 17-405, a broker must include the Guaranty
  Fund notice in any sales contract that the broker provides to the buyer. Therefore, the situation
  where the broker gives a sales contract to the buyer requires the notice. Providing a listing
  agreement to the seller, a lease agreement to the tenant, or a sales contract to the seller does
  not meet the condition because the statute applies only to sales contracts given to buyers.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. § 17-405
  url: null
  quoted_text: A real estate broker shall include in each sales contract that is provided by the real
    estate broker a written notice to the buyer that the buyer is protected by the Guaranty Fund in
    an amount not exceeding $50,000.
