stem: Under COMAR 09.11.01.17, what must be true regarding the broker’s role as a signator on escrow
  account checks?
options:
  - The broker may allow a nonlicensed person to serve as the sole signator on escrow checks
  - The broker may avoid being a signator if a licensed associate broker signs all escrow checks
  - The broker must be a signator or at least one of the signators on checks drawn on the escrow
    account
  - The broker may designate any unlicensed employee as the sole signator on escrow checks
key: C
explanation: The regulation states that a real estate broker shall be a signator or at least one of
  the signators on checks drawn on escrow accounts. Therefore the broker must be a signator or share
  signatory duties. Designating an unlicensed employee as the sole signator violates the requirement
  that an alternate signator be a licensee, and a nonlicensed person cannot be the sole signator
  without a licensee cosignature. The broker cannot avoid being a signator altogether.
citation:
  source: COMAR § 09.11.01.17
  url: null
  quoted_text: A real estate broker shall be a signator or at least one of the signators on checks
    which may be drawn on escrow accounts which, under Business Occupations and Professions Article,
    Title 17, Subtitle 5, Part I, Annotated Code of Maryland, this real estate broker is required to
    maintain at all times.
