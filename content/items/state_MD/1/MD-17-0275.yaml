key: D
explanation: Section 17-411(a)(2) requires reimbursement of the Guaranty Fund with interest at an
  annual rate of at least 10%, as determined by the Commission. Options of 5% and 8% are below the
  statutory minimum, while 12% exceeds the minimum but is not required.
