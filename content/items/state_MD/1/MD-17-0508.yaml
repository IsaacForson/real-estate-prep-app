stem: A licensee holds an earnest money deposit; the buyer and seller disagree on who is entitled to
  the funds, the contract contains no provision to the contrary, and the licensee cannot obtain
  signed releases from both parties. According to COMAR 09.11.01.18, what action may the licensee
  take?
options:
  - The licensee may disburse the deposit to the seller upon mutual verbal agreement
  - The licensee may hold the deposit until one party provides a written release
  - The licensee may file a bill of interpleader to have the court decide the disposition
  - The licensee may apply the deposit toward outstanding commission fees owed by the buyer
key: C
explanation: The regulation permits the licensee to file a bill of interpleader when releases cannot
  be obtained, causing the court to hold the funds. Holding the deposit indefinitely is not allowed;
  the licensee must either secure releases, file interpleader, await a court order from a filed
  suit, or disburse under §17-505. Immediate disbursement or retaining the deposit as compensation
  is prohibited without releases or court order.
