stem: A seller drafts a purchase agreement and gives it to the broker to present to the buyer. Must
  the broker include the Guaranty Fund notice?
options:
  - No, because the notice applies only to residential sales
  - No, because the Guaranty Fund notice is optional for brokers
  - No, because the broker did not provide the sales contract
  - No, because the broker must include the notice only if asked
key: C
explanation: The broker did not provide the sales contract; the seller drafted it. The statute only
  requires the notice when the broker provides the contract, so no notice is needed. The distractor
  that the notice applies only to sales contracts is true but irrelevant because the issue is who
  provided the contract.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
