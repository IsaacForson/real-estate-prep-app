stem: A homeowner who works as a teacher rents out their spare room to a tenant and handles all
  leasing activities themselves. Under Maryland law, does the homeowner need a real estate license
  for this activity?
options:
  - The exemption that applies only to owners who lease their own property
  - The requirement that a license is needed unless the owner hires a property manager
  - The exemption for an owner managing their own property when not a real estate broker
  - The requirement that any leasing or rental activity necessitates a real estate license
key: C
explanation: Section 17-102(5) exempts an owner or lessor managing, leasing, or selling real estate
  unless their primary business is providing real estate brokerage services. The homeowner is an
  owner managing their own property and their primary business is teaching, not brokerage, so no
  license is required. The other options either impose a license requirement, add unnecessary
  conditions, or incorrectly limit the exemption.
