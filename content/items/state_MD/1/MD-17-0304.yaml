stem: A consumer wants to know whether the State Real Estate Commission is part of the state
  government. Based solely on § 17-201, which conclusion is supported?
options:
  - The Commission is not part of the state government because the statute does not mention state
    funding.
  - The Commission is part of the state government because it is a State Real Estate Commission
    located in the Department.
  - The statute provides no information about the Commission's governmental status.
  - The Commission is part of the federal government because it regulates real estate.
key: B
explanation: The statute provides that there is a State Real Estate Commission in the Department,
  indicating the Commission is a state governmental body. The option stating the Commission is part
  of the state government because it is a State Real Estate Commission located in the Department
  aligns with this. The alternatives claiming the Commission is not part of state government, that
  the statute gives no information, or that it is part of the federal government are not supported
  by the statute (§ 17-201).
