stem: According to Md. Code Ann., Bus. Occ. & Prof. § 17-405, what is the maximum amount of
  protection the Guaranty Fund provides to a buyer as stated in the required notice?
options:
  - $100,000
  - $25,000
  - $75,000
  - $50,000
key: D
explanation: The statute requires the notice to state that the buyer is protected by the Guaranty
  Fund in an amount not exceeding $50,000, establishing $50,000 as the maximum. The $25,000
  distractor incorrectly states a lower limit not mentioned in the law.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
    Brokers (MGA Statute_Web, 2025RS) — § 17-405
  url: null
  quoted_text: A real estate broker shall include in each sales contract that is provided by the real
    estate broker a written notice to the buyer that the buyer is protected by the Guaranty Fund in
    an amount not exceeding $50,000.
