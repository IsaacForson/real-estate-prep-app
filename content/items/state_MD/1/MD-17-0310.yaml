stem: According to COMAR 09.11.01.16(B)(3), how is a 'trade name' defined for real estate licensees
  in Maryland?
options:
  - The licensee’s personal name used exclusively for all advertising and contracts in every
    transaction and promotional material
  - Any name registered with the Maryland Department of Assessments and Taxation for real estate
    activities and renewed biennially
  - A trademark or service mark, company name or business name, irrespective of whether permission
    is needed from another entity
  - A nickname or informal name used by a licensee in oral or written communications with clients
key: C
explanation: The regulation defines a trade name as a trademark or service mark, company name or
  business name, irrespective of whether permission is needed from another entity that holds rights
  to that name. The option stating that a trade name is the licensee’s personal name used
  exclusively for all advertising and contracts in every transaction and promotional material does
  not match this definition.
citation:
  source: COMAR 09.11.01–09.11.09 (Real Estate Commission regulations) § 09.11.01.16(B)(3)
  url: null
  quoted_text: “Trade name” means trademark or service mark, company name or business name,
    irrespective of whether the licensee needs to obtain permission from another person or entity
    who has an existing or continuing right in that trademark or service mark by virtue of any State
    or federal law.
