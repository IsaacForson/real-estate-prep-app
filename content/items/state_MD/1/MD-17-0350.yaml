stem: A Maryland salesperson is designated as a team leader on June 12, 2024 and has not completed
  the required broker supervision course in the previous four years. According to COMAR 09.11.01.23,
  by what date must she finish the 1.5‑clock‑hour course?
options:
  - September 10, 2024
  - September 11, 2024
  - September 9, 2024
  - October 12, 2024
key: A
explanation: COMAR 09.11.01.23 mandates completion of the supervision course within 90 days of the
  designation when the course has not been taken in the prior four years. Counting 90 days from June
  12 lands on September 10, 2024. Selecting September 11 exceeds the allowed period.
citation:
  source: COMAR § 09.11.01.23
  url: null
  quoted_text: A licensee who is designated as a broker, branch office manager, or team leader shall
    complete a 1.5 clock-hour course that includes the requirements of broker supervision under
    COMAR 09.11.06.01B(8)(i) within 90 days of the effective date of the designation if the licensee
    has not completed that course during the previous four years.
