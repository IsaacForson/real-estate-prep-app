stem: Under COMAR 09.11.01.02(B), how many business days must a course provider file a request for
  review with the Education Committee after receiving a denial notice from Commission staff?
options:
  - 10 business days
  - 15 business days
  - 20 business days
  - 5 business days
key: A
explanation: The rule explicitly states that the request for review shall be filed within 10
  business days of receipt of the denial notice. Therefore, 10 business days is the correct
  timeframe. The distractor of 5 business days understates the required period, while 15 and 20
  business days exceed it.
