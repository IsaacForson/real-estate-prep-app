stem: According to § 17-405, the notice required in a sales contract provided by the broker must be
  directed to which party?
options:
  - The notice must be directed to the broker
  - The notice must be directed to the seller
  - The notice must be directed to the lender
  - The notice must be directed to the buyer
key: D
explanation: The statute requires brokers to include a written notice to the buyer about Guaranty
  Fund protection. Therefore the notice must be addressed to the buyer. The distractor suggesting
  the seller is incorrect because the notice is expressly for the buyer’s benefit.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
    Brokers (MGA Statute_Web, 2025RS) — § 17-405
  url: null
  quoted_text: A real estate broker shall include in each sales contract that is provided by the real
    estate broker a written notice to the buyer that the buyer is protected by the Guaranty Fund in
    an amount not exceeding $50,000.
