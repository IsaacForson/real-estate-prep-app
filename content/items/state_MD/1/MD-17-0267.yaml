stem: The Maryland Real Estate Commission is creating its official seal for use on documents. Which
  power under § 17-212 authorizes the Commission to create this seal?
options:
  - To use the seal to authenticate its proceedings
  - To approve educational courses for applicants
  - To adopt an official seal for the Commission
  - To investigate complaints against licensees
key: C
explanation: "Under § 17-212(1) the Maryland Real Estate Commission is granted the power to adopt a
  seal. This authority directly allows the Commission to design and use an official seal on its
  documents. The other choices describe unrelated powers: approving educational courses for
  applicants, investigating complaints against licensees, and using a seal to authenticate
  proceedings (which is a function of having a seal, not the authority to create it)."
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
