stem: What must a real estate broker include in each sales contract provided by the broker under
  Maryland law?
options:
  - A written notice to the seller that the seller is protected by the Guaranty Fund in an amount
    not exceeding $50,000.
  - A written notice to the buyer that the buyer is protected by the Guaranty Fund in an amount not
    exceeding $50,000.
  - A written notice to the buyer that the buyer is protected by the Guaranty Fund in an amount not
    exceeding $25,000.
  - A written notice to the buyer that the buyer is protected by the Guaranty Fund in an amount not
    exceeding $75,000.
key: B
explanation: Maryland law requires a broker to place in every sales contract a written notice
  addressed to the buyer stating that the buyer is protected by the Guaranty Fund up to $50,000. The
  statement that provides a buyer‑directed notice with protection of $50,000 therefore meets the
  statutory requirement, while the other statements are incorrect because they either address the
  seller or specify the wrong protection amount. (Md. Code Ann., Bus. Occ. & Prof. § 17‑405)
citation:
