stem: What does Md. Code Ann., Bus. Occ. & Prof. § 17-201 establish concerning the State Real Estate
  Commission?
options:
  - A. A licensing fee for broker applicants
  - B. A State Real Estate Commission within the Department
  - C. A maximum civil penalty for violations
  - D. A Guaranty Fund for consumer reimbursement
key: B
explanation: Section 17‑201 of the Maryland Code, Business Occupations and Professions provides that
  a State Real Estate Commission is created within the Department, thereby establishing the
  commission’s existence and location. The other answer choices describe provisions that are found
  in other sections of the Real Estate Brokers Act—licensing fees, civil penalties, and a guaranty
  fund—none of which are addressed in § 17‑201. Consequently, only the choice that identifies the
  establishment of the State Real Estate Commission is correct.
