stem: A course provider plans to begin offering a Commission‑approved course on June 15, 2024.
  According to COMAR 09.11.03(B), what is the latest date by which the completed application for
  approval as a course provider must be submitted to the Commission?
options:
  - May 17, 2024
  - May 15, 2024
  - May 16, 2024
  - June 15, 2024
key: C
explanation: The rule requires the application to be submitted at least 30 days prior to the first
  course offering date. Counting back 30 days from June 15, 2024 gives May 16, 2024 as the latest
  permissible submission date. Submitting on May 17, 2024 would be only 29 days prior, which does
  not satisfy the "at least 30 days" requirement.
