stem: According to COMAR 09.11.09.01, what is the intended purpose of the fees set by the Maryland
  Real Estate Commission?
options:
  - To cover the Commission's actual documented direct and indirect costs
  - To generate revenue for the State General Fund and support operations
  - To fund the Guaranty Fund exclusively and ensure its solvency for future claims
  - To pay for Commission staff salaries only and administrative overhead
key: A
explanation: The purpose clause states that fees are set to cover the Commission's actual documented
  direct and indirect costs of fulfilling its statutory and regulatory duties. The distractor about
  generating revenue for the State General Fund incorrectly shifts the purpose to state funding
  rather than cost recovery.
