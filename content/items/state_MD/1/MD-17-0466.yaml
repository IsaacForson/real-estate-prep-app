stem: A Maryland resident first applies for a real estate salesperson license, pays the required $20
  Guaranty Fund fee, but does not pass the exam. Six months later, the applicant applies for a real
  estate broker license. Under Md. Code Ann., Bus. Occ. & Prof. § 17-403(a)(2), what is the correct
  statement regarding the Guaranty Fund fee for the broker license application?
options:
  - The applicant is not required to pay another Guaranty Fund fee; the Commission may charge the
    fee only once per individual.
  - The applicant must pay the fee only if the Commission determines the applicant is eligible for
    the broker license.
  - The applicant must pay a total of $40 in Guaranty Fund fees, $20 for each license type.
  - The applicant must pay another $20 Guaranty Fund fee because the broker license is a different
    license type.
key: A
explanation: Under Md. Code Ann., Bus. Occ. & Prof. § 17-403(a)(2), the Commission may charge the
  Guaranty Fund fee only once per individual, regardless of how many license applications are
  submitted. Therefore, the applicant who already paid the $20 fee for the salesperson application
  does not owe another fee when applying for a broker license. The statement that the applicant is
  not required to pay another fee and that the Commission may charge the fee only once per
  individual correctly reflects this rule. The statement that the fee is payable only if the
  Commission determines eligibility is incorrect because eligibility does not affect the
  once‑per‑individual fee requirement. The statement that the applicant must pay a total of $40, $20
  for each license type, is incorrect because the fee is not charged per license type. The statement
  that another $20 fee is required because the broker license is a different license type is also
  incorrect because the fee is based on the individual, not the license sought.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
    Annotated Code of Maryland, Business Occupations and Professions Article, Title 17 — Real Estate
