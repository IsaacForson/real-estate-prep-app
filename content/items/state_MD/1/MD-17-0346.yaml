stem: A cousin is given a power of attorney by an owner to sell the owner's single-family home.
  Under Maryland law, does the cousin need a real estate license to conduct the sale?
options:
  - The requirement that any sale or lease of real estate necessitates a real estate license
  - The exemption for a person acting under a power of attorney for a single transaction
  - The requirement that a license is required unless the individual is a licensed attorney
  - The exemption that applies only to commercial real estate transactions
key: B
explanation: Section 17-102(3) exempts a person engaging in a single transaction involving the sale
  or lease of real estate under a power of attorney executed by the owner. Since the cousin is
  acting under such a power of attorney for a single sale, no license is required. The other options
  incorrectly impose a license requirement or limit the exemption to commercial property or attorney
  status.
