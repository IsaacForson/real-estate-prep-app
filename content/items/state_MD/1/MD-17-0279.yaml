stem: A homebuyer discovers on March 15, 2023 that the seller failed to disclose a material defect
  in the property. Under Md. Code Ann., Bus. Occ. & Prof. § 17-404(d), by what date must the claim
  be submitted to the Guaranty Fund?
options:
  - March 15, 2024
  - March 15, 2025
  - March 15, 2026
  - March 15, 2027
key: C
explanation: The law requires that a claim under the Guaranty Fund be submitted within three years
  after the claimant discovers or should have discovered the loss. Adding three years to March 15,
  2023 yields March 15, 2026 as the final permissible date. The other options are either too early
  or too late.
