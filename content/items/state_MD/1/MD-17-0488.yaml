stem: A course is cancelled on April 10, 2024. Under COMAR 09.11.08(H)(2), by what date must the
  course provider refund all prepaid fees to students?
options:
  - May 9, 2024
  - April 10, 2024
  - May 11, 2024
  - May 10, 2024
key: D
explanation: The rule requires the provider to refund all prepaid fees within 30 days of the date of
  cancellation. Adding 30 days to April 10, 2024 yields May 10, 2024 as the deadline. Refunding on
  May 11, 2024 would be one day late, while May 9, 2024 is early but still permissible; however the
  question asks for the date by which the refund must be made, i.e., the latest allowable date,
  which is May 10, 2024.
