stem: A broker designates an office manager who lacks a real estate license to sign checks on the
  broker’s escrow account. Is this permissible under COMAR 09.11.01.17?
options:
  - The alternate signator must be a licensed real estate broker, associate broker, or salesperson
  - The alternate signator may be any employee of the brokerage who has been authorized to sign
    checks
  - The alternate signator may be a licensed certified public accountant not employed by the
    brokerage
  - The alternate signator may be a family member who holds a real estate license in another
    jurisdiction
key: A
explanation: The regulation specifies that any designated alternate signator shall be a licensee.
  Therefore an unlicensed office manager cannot serve as the alternate signator. A licensed attorney
  who is not a real estate licensee also does not qualify, and the broker’s spouse must hold a real
  estate license to be eligible.
