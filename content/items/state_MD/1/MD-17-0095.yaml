stem: Which of the following statements is true regarding the State Real Estate Commission in Maryland?
options:
  - It is responsible for setting federal mortgage rates
  - It is a State Real Estate Commission in the Department
  - It is located in the Department of Transportation
  - It is a federal agency overseeing real estate brokers nationwide
key: B
explanation: Md. Code Ann., Bus. Occ. & Prof. § 17-201 provides that there is a State Real Estate
  Commission in the Department, making the statement 'It is a State Real Estate Commission in the
  Department' correct. The Commission does not set federal mortgage rates; it is a state entity, not
  a federal agency. It is not located in the Department of Transportation, and it is not a federal
  agency overseeing real estate brokers nationwide.
