stem: According to COMAR 09.11.01.02(A), what is the minimum composition of the Education Committee?
options:
  - At least three licensee members and no consumer members
  - At least one licensee member and two consumer members
  - At least two licensee members and two consumer members
  - At least two licensee members and one consumer member
key: D
explanation: The regulation states that the Education Committee shall include at least two licensee
  members and one consumer member. Therefore, the correct composition requires two licensee members
  and one consumer member. The option suggesting only one licensee member is incorrect because the
  rule requires a minimum of two.
