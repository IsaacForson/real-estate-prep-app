stem: A broker purchases a property for his own investment and then lists it for sale, representing
  both himself as buyer and the seller, without obtaining consent from the seller. Under COMAR
  09.11.01.02, how is this conduct classified?
options:
  - The broker's action is permitted if the broker discloses his dual role to the seller
  - The broker's action is permitted if the broker obtains written consent from the seller after the
    purchase
  - The broker's action is prohibited because the broker is acting as principal and agent without
    consent of all parties
  - The broker's action is permitted because the broker is not receiving a commission
key: C
explanation: COMAR 09.11.01.02 states that a broker may not act as both principal and agent in the
  same transaction without the consent of all parties. Since the broker is purchasing the property
  for himself and then representing the seller without obtaining that consent, the conduct is
  prohibited. Options suggesting that mere disclosure or lack of a commission makes the act
  permissible misstate the rule, which requires explicit consent.
citation:
