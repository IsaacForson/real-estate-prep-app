stem: According to Md. Code Ann., Bus. Occ. & Prof. § 17-202(c), what is the minimum length of time
  a professional member of the State Real Estate Commission must have been a licensed real estate
  broker, associate broker, or salesperson before appointment?
options:
  - 15 years
  - 20 years
  - 5 years
  - 10 years
key: D
explanation: The statute requires that each professional member have been a licensed real estate
  broker, associate broker, or salesperson for at least 10 years immediately before appointment.
  This ensures substantial experience before serving on the Commission. The other options represent
  shorter or longer periods not supported by the text.
