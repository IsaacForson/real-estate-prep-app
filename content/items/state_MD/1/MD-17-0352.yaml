stem: A broker prepares a sales contract for a buyer and a seller. What must the broker include in
  that contract?
options:
  - The broker must include a written notice to the buyer that the buyer is protected by the
    Guaranty Fund in an amount not exceeding $75,000.
  - The broker must include a written notice to the buyer that the buyer is protected by the
    Guaranty Fund in an amount not exceeding $50,000.
  - The broker must include a written notice to the buyer that the buyer is protected by the
    Guaranty Fund in an amount not exceeding $25,000.
  - The broker must include a written notice to the seller that the seller is protected by the
    Guaranty Fund in an amount not exceeding $50,000.
key: B
explanation: The statute requires the broker to place a written notice in the sales contract
  informing the buyer that the buyer is protected by the Guaranty Fund up to $50,000. The correct
  option states that notice to the buyer with the $50,000 limit. The incorrect options either direct
  the notice to the seller, or state a different dollar amount ($25,000 or $75,000), which does not
  match the statutory requirement.
citation:
  source: Md. Code Ann., Bus. Occ. & Prof. § 17-405
  url: null
  quoted_text: A real estate broker shall include in each sales contract that is provided by the real
    estate broker a written notice to the buyer that the buyer is protected by the Guaranty Fund in
    an amount not exceeding $50,000.
