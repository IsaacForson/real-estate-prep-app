stem: Which form must be used for residential real property disclosures in Maryland?
options:
  - The form provided by the Commission
  - The form drafted by the broker
  - The generic disclosure form used
  - The form obtained from the local MLS
key: A
explanation: Maryland law requires that the disclosure statement form supplied by the Maryland Real
  Estate Commission be used in all applicable residential real‑property transactions. A broker must
  therefore use the Commission‑provided form; a broker‑drafted form, a generic disclosure form, or a
  form obtained from the MLS does not meet the statutory requirement (COMAR § 09.11.01.01).
