stem: A course provider receives a denial notice from Commission staff on Tuesday, May 2, 2023. By
  what date must the provider file a request for review with the Education Committee to stay within
  the required timeframe?
options:
  - May 15, 2023
  - May 17, 2023
  - May 16, 2023
  - May 14, 2023
key: C
explanation: The rule requires the request for review to be filed within 10 business days of receipt
  of the denial notice. Counting ten business days after May 2, 2023, leads to May 16, 2023 as the
  deadline. The option of May 15, 2023 falls one business day short and therefore does not satisfy
  the requirement.
