stem: Which of the following individuals is required to obtain a separate campground membership
  salesperson license to sell campground memberships under the definition in 49 Pa. Code § 35.201?
options:
  - An individual holding no real estate license
  - An individual holding a standard time-share salesperson license
  - An individual holding a standard salesperson license
  - An individual holding a standard broker license
key: A
explanation: The definition explicitly states that a licensed broker, salesperson or time‑share
  salesperson does not need a separate campground membership salesperson license to sell campground
  memberships. Therefore, only someone who holds no real estate license must obtain that separate
  license. The most tempting distractor is the broker option, which incorrectly assumes that even a
  licensed broker must obtain the additional campground membership salesperson license.
