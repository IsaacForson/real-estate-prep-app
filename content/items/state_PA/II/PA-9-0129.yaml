stem: Under 63 P.S. § 455.511(4), what is the minimum experience required for an applicant seeking a
  broker’s license?
options:
  - The applicant must have been engaged as a licensed real estate salesperson for at least three
    years.
  - The applicant must have been engaged as a licensed real estate salesperson for at least two
    years.
  - The applicant must have been engaged as a licensed real estate salesperson for at least five
    years.
  - The applicant must have been engaged as a licensed real estate salesperson for at least one year.
key: A
explanation: Subsection (4) requires the applicant to have been engaged as a licensed real estate
  salesperson for at least three years or possess equivalent education or experience. Therefore, the
  correct answer is at least three years as a licensed salesperson. The distractor stating two years
  is incorrect because the statute specifies three years, not two.
