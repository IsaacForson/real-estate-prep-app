stem: "Under 49 Pa. Code § 35.202(5), an attorney-at-law is excluded from the Real Estate Licensing
  and Registration Act if they:"
options:
  - The attorney-at-law serves as an officer of a cemetery company who shows lots without
    remuneration, and does not receive any compensation beyond regular salary.
  - The attorney-at-law is employed by a public utility and performs only routine administrative
    tasks unrelated to real estate transactions.
  - The attorney-at-law holds a power of attorney from an owner to manage property, but does not
    engage in any real estate brokerage activities.
  - The attorney-at-law receives a fee from a client for services within the attorney‑client
    relationship and does not hold himself out as a real estate broker.
key: D
explanation: "The regulation excludes an attorney‑at‑law who receives a fee from a client for
  services within the attorney‑client relationship and does not hold himself out as a real estate
  broker. The other three options describe situations that fall under different exclusion
  paragraphs: an officer of a cemetery company who shows lots without pay, a public‑utility employee
  performing only routine administrative tasks, and someone holding a power of attorney but not
  engaging in real estate brokerage."
