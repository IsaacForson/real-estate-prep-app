stem: An employee of a cemetery company is paid a $20 per showing fee to show burial lots to
  families and accepts deposits on behalf of the cemetery. Under 63 P.S. § 455.304(7), is this
  employee required to hold a real estate license?
options:
  - "Answer: Yes, because receiving remuneration removes the exclusion"
  - "Answer: No, because the employee only shows lots and does not negotiate"
  - "Answer: Yes, because accepting deposits requires a license"
  - "Answer: No, because cemetery employees are exempt"
key: A
explanation: Under 63 P.S. § 455.304(7), the exclusion for cemetery employees applies only when
  services are performed without remuneration. Because the employee receives a $20 fee for each
  showing, the exclusion does not apply and a real estate license is required. The option that
  claims accepting deposits alone triggers the requirement is incorrect; the determining factor is
  receipt of remuneration.
