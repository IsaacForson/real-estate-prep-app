stem: Maria holds an active Pennsylvania salesperson license and wishes to sell time-share interests
  for a developer. Under the Real Estate Licensing and Registration Act, is Maria required to obtain
  a separate time-share salesperson license?
options:
  - Yes, she must obtain a separate time-share salesperson license before selling any time-share
    interests.
  - Yes, her existing salesperson license authorizes her to sell time-share interests without
    additional licensing.
  - Yes, she must complete additional continuing education specific to time-share sales before she
    can sell.
  - Yes, she may sell time-share interests if she is employed by a broker who holds a time-share
    salesperson license.
key: B
explanation: The Real Estate Licensing and Registration Act provides that a person who holds a
  broker or salesperson license is not required to obtain a separate time-share salesperson license
  in order to sell or offer to sell time shares (63 P.S. § 455.201). Therefore, Maria's existing
  Pennsylvania salesperson license authorizes her to sell time-share interests without additional
  licensing. The statement that she must obtain a separate time-share salesperson license
  contradicts this exemption. The claim that she must complete additional continuing education
  specific to time-share sales adds a requirement not found in the statute. The assertion that she
  may sell only if employed by a broker who holds a time-share salesperson license also introduces a
  condition that the statute does not impose.
