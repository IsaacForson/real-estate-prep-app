stem: Under 63 P.S. § 455.603(a), a salesperson who wishes to change employing brokers must notify
  the commission in writing no later than how many days after the intended date of change?
options:
  - Twenty days
  - Five days
  - Fifteen days
  - Ten days
key: D
explanation: The rule requires notification no later than ten days after the intended date of
  change. A five‑day interval is too short and would not satisfy the statutory requirement.
