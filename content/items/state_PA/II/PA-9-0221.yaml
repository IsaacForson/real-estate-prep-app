stem: A reciprocal broker applicant refuses to agree to permit the disclosure of their disciplinary
  record from another state when submitting the verified statement required under 49 Pa. Code §
  35.222(b)(3). What is the likely result?
options:
  - The application will be denied because the verified statement must include agreement to disclose
    disciplinary records.
  - The application will be accepted after the applicant submits the agreement post‑licensure.
  - The application will be processed normally provided the applicant passes the Pennsylvania
    portion of the exam.
  - The application will be approved if the applicant has no disciplinary record in the other state.
key: A
explanation: The verified statement must include agreement to permit disclosure of the record in any
  disciplinary proceeding; refusing this agreement makes the statement incomplete and the
  application cannot be approved. The distractor about approval absent a record is incorrect because
  the agreement is required regardless of existing discipline.
