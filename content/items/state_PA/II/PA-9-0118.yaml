stem: Broker Allen holds a standard license and decides to relocate his main office to a new
  address. According to 63 P.S. § 455.601(a), what must Allen do before or within ten days after the
  move?
options:
  - Allen must renew his broker license with the commission within thirty days of the relocation.
  - Allen must display a temporary sign at the old office indicating the new location for at least
    seven days.
  - Allen must apply to the commission for a new office location and pay the required fees before
    removal or within ten days.
  - Allen must notify all current clients in writing of the address change within five business days
    of the move.
key: C
explanation: Section 455.601(a) requires that when a broker's office is removed from the designated
  location, the broker must apply to the commission to designate the new location and pay the
  required fees before removal or within ten days thereafter. The other options describe actions not
  mandated by this provision.
