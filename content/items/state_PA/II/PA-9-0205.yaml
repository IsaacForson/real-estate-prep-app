stem: Jordan, who is 17 years old, has completed 80 hours of real estate instruction and holds a
  high school diploma, submits an application for a Pennsylvania salesperson license. According to
  63 P.S. § 455.521, what is the result?
options:
  - Eligibility to take the salesperson exam due to meeting education and hour requirements
  - Ineligibility because the applicant is younger than the required minimum age of 18
  - Eligibility after the applicant finishes an extra ten hours of required instruction
  - Eligibility only if the applicant secures a temporary waiver from the Commission
key: B
explanation: The statute requires an applicant to be at least 18 years of age to take the
  salesperson examination. Jordan, being 17, fails this condition and is therefore ineligible. The
  distractor suggesting eligibility through a waiver is incorrect because the law does not provide
  for age waivers under this provision.
