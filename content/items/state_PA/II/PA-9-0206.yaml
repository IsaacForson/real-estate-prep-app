stem: Taylor applies for a broker's license but fails to include details of a prior misdemeanor
  conviction on the application. Under 49 Pa. Code § 35.221, what is the most likely outcome?
options:
  - Application deemed complete; license granted with a fine for missing conviction info
  - Application processed normally; license issued after background check clears undisclosed
    conviction
  - Application approved pending review; license issued with condition to submit conviction details
    later
  - Application considered incomplete; license withheld until conviction details are submitted
key: D
explanation: The regulation mandates that applicants submit complete details of any felony or
  misdemeanor conviction. Omitting this information renders the application incomplete, and the
  license will not be issued until the missing data is provided. The distractor claiming that only
  felony convictions must be disclosed is incorrect because the rule explicitly includes
  misdemeanors.
