stem: According to the definitions in 49 Pa. Code § 35.201, which term describes an individual who
  holds a standard or reciprocal license and is employed by a broker to sell or offer to sell real
  estate?
options:
  - A broker who negotiates the listing, sale, purchase, exchange, lease, time share and similarly
    designated interests for real estate.
  - A salesperson who is employed by a broker to sell or offer to sell real estate.
  - An associate broker who is employed by another broker and may oversee multiple office locations.
  - A rental listing referral agent who owns or manages a business that collects rental information
    to refer prospective tenants to rental units.
key: B
explanation: The definition of salesperson in § 35.201 explicitly states that a salesperson is an
  individual holding a standard or reciprocal license who is employed by a broker to sell or offer
  to sell real estate, among other activities. The other options describe different license types or
  roles that do not match this definition.
