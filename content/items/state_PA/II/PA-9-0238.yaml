stem: Pine Valley College, accredited by the Middle States Association, wishes to offer a real
  estate finance course to the public. Under the definition of real estate education provider in 49
  Pa. Code § 35.201, is the college required to obtain approval as a real estate education provider?
options:
  - The college must obtain approval only if the course is instructor‑led
  - The college is exempt from approval only if the course is independent‑learning
  - The college must obtain approval because it offers real estate education
  - The college is exempt from approval because it is an accredited college or university
key: D
explanation: The definition excludes colleges, universities or institutes of higher learning
  accredited by the Middle States Association or equivalent accreditation from being considered real
  estate education providers. Therefore, Pine Valley College does not need approval. The most
  tempting distractor is the claim that the college must obtain approval simply because it offers
  real estate education, which overlooks the statutory exemption for accredited institutions.
