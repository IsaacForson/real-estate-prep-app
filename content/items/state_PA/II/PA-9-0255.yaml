stem: A broker employs three salespersons at her main office. According to 63 P.S. § 455.601(a),
  where must the current licenses of the broker and each employed salesperson be displayed?
options:
  - The licenses must be posted on the broker’s website for public viewing.
  - The licenses must be prominently displayed in an office of the broker.
  - The licenses must be kept in a locked file cabinet at the broker’s main office.
  - The licenses must be presented to each client upon request.
key: B
explanation: Section 63 P.S. § 455.601(a) requires that the current license of the broker and each
  licensee employed by the broker be prominently displayed in an office of the broker. Hence, the
  licenses must be prominently displayed in an office of the broker. The other options describe
  posting on a website, keeping in a locked cabinet, or presenting to clients upon request, which
  are not required by the statute.
