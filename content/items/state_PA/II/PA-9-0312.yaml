stem: A candidate completed a real estate finance course 12 years ago and now wants to use it to
  satisfy the education requirement for a Pennsylvania broker’s license. May the course be counted
  toward the requirement under 49 Pa. Code § 35.271(b)(5)?
options:
  - The course may be counted toward the education requirement
  - The course may be counted if the candidate holds a salesperson license
  - The course may not be counted toward the education requirement
  - The course may be counted if it is completed within ten years
key: C
explanation: The regulation requires that courses used for the education requirement be completed
  within 10 years prior to passing the licensing examination (49 Pa. Code § 35.271(b)(5)). A course
  taken 12 years ago falls outside this window and therefore cannot be counted. The option
  suggesting the course may be counted if the candidate holds a salesperson license is incorrect
  because the time limit applies regardless of other licenses held.
