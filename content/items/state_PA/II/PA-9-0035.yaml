  - 20 years of age
key: C
explanation: Under §35.271(a)(1), an individual must be at least 21 years old to sit for the
  broker’s examination. Therefore, 21 years of age satisfies the requirement. The distractor “18
  years of age” reflects the minimum age for a salesperson’s license (§35.272(a)(1)) and does not
  meet the broker threshold.
