explanation: Under 63 P.S. § 455.521, an applicant who has not completed any of the required
  real‑estate instruction before the effective date must complete the 75 hours of instruction within
  five years of taking the salesperson license examination. The three‑year period referenced in
  another provision applies to exam score validity, not to this instruction requirement.
