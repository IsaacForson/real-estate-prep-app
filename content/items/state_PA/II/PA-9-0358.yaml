stem: A salesperson completes a 3‑hour continuing education workshop on real estate finance. Under
  49 Pa. Code § 35.384(a), can this workshop be counted toward the 14‑hour continuing education
  requirement?
options:
  - Yes, because the workshop meets the minimum 2‑hour increment requirement.
  - No, because continuing education must be completed in exactly 2‑hour blocks.
  - Yes, because any course over one hour qualifies.
  - No, because workshops shorter than 4 hours are not acceptable.
key: A
explanation: The rule requires continuing education in acceptable courses in a minimum of 2‑hour
  increments, so a 3‑hour workshop satisfies that requirement. The option claiming exact 2‑hour
  blocks is incorrect because the rule allows increments of 2 hours or more.
