stem: Under 49 Pa. Code § 35.271(b)(5), how long before the licensing examination must real estate
  courses have been completed to count toward the broker education requirement?
options:
  - Courses must be completed within 15 years prior to the date of successful completion of the
    licensing examination.
  - Courses must be completed at any time prior to the date of successful completion of the
    licensing examination.
  - Courses must be completed within 5 years prior to the date of successful completion of the
    licensing examination.
  - Courses must be completed within 10 years prior to the date of successful completion of the
    licensing examination.
key: D
explanation: The rule states that courses must have been completed within 10 years prior to the date
  of successful completion of the licensing examination, making the 10‑year option correct. The
  5‑year option is incorrect because it imposes a shorter period than the rule allows.
