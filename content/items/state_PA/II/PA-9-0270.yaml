stem: A licensee wants to request a waiver of the continuing education requirement due to a
  hardship. Under 49 Pa. Code § 35.383(b), by what date must the waiver request be filed unless the
  licensee proves it was impracticable to do so?
options:
  - April 30 of the renewal year.
  - May 31 of the renewal year.
  - February 28 of the renewal year.
  - March 31 of the renewal year.
key: D
explanation: The rule provides that waiver requests must be filed with the Commission on or before
  March 31 of the renewal year unless impracticability is shown. Filing by February 28 is too early
  and not the prescribed deadline.
