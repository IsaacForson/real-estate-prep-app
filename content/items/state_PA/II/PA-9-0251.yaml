stem: A broker with a standard license wants to appoint a manager for each of her two offices.
  According to 63 P.S. § 455.601(b), who may serve as the manager of a broker's office?
options:
  - The manager must be a licensed salesperson.
  - The manager must be a certified public accountant.
  - The manager must be the broker or an associate broker.
  - The manager must be the broker’s spouse.
key: C
explanation: Under 63 P.S. § 455.601(b), each office must be under the direction and supervision of
  a manager who is either the broker or an associate broker. Therefore, the manager must be the
  broker or an associate broker. The options stating that the manager must be a licensed
  salesperson, a certified public accountant, or the broker’s spouse are not authorized to serve as
  office managers under this provision.
