stem: Broker Dana operates her real estate business from a home office that is not visible to the
  public. Under 63 P.S. §455.601(a), what must Dana do regarding the office sign?
options:
  - Dana must obtain an additional license for the home office before commencing business
  - Dana must prominently display her current license inside the office but is not required to post
    a sign
  - Dana must display a sign indicating her proper licensed brokerage name on the outside of the
    office
  - Dana must notify the Commission within ten days of establishing the home office
key: C
explanation: Under 63 P.S. §455.601(a), a broker who holds a standard license must maintain a sign
  on the outside of the office indicating the proper licensed brokerage name. Therefore, Dana must
  display such a sign on the outside of her home office.
