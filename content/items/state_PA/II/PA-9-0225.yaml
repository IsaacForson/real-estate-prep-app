stem: Under the Pennsylvania Real Estate Licensing and Registration Act, how is an 'associate
  broker' defined?
options:
  - A broker employed by another broker
  - A licensed appraiser who works for a broker
  - A salesperson who works under a broker's supervision
  - A broker who owns their own brokerage
key: A
explanation: The statute defines an associate broker as a broker who is employed by another broker
  (see 63 P.S. § 455.201). Therefore, the option stating 'A broker employed by another broker' is
  correct. The other options are incorrect because they describe a licensed appraiser, a salesperson
  who works under a broker's supervision, and a broker who owns their own brokerage, none of which
  match the statutory definition.
