stem: Under 63 P.S. § 455.511, what is the consequence for an applicant who has **NOT** completed
  the required 240 hours of real estate instruction before applying for a broker's license?
options:
  - Eligibility for the broker's license pending completion of the required hours within six months
  - Ineligibility for a broker's license until the 240‑hour requirement is satisfied
  - Permission to substitute the required hours with additional salesperson experience
  - Issuance of a provisional license allowing limited practice while completing the instruction
key: B
explanation: The statute explicitly states that completing 240 hours of instruction is a condition
  precedent to obtaining a broker's license. Therefore, failure to meet this requirement results in
  ineligibility until the requirement is satisfied. The distractor suggesting eligibility pending
  completion within six months is incorrect because the law provides no such grace period.
