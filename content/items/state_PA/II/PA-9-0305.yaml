stem: An applicant completed 30 hours of real estate instruction before the effective date of the
  amendment to 63 P.S. § 455.521(2) and now seeks a salesperson license. How many total hours of
  instruction must the applicant complete to satisfy the education requirement?
options:
  - 30 hours.
  - 45 hours.
  - 60 hours.
  - 75 hours.
key: C
explanation: Under 63 P.S. § 455.521(2)(ii), an applicant who has completed any portion of the
  required hours before the effective date must complete a total of 60 hours of instruction to
  qualify for a salesperson license. Selecting 60 hours meets this requirement. Choosing 30 hours
  does not reach the required total.
