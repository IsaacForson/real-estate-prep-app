stem: A licensee completes a 1‑hour continuing education seminar on real estate ethics. Under 49 Pa.
  Code § 35.384(a), can this seminar be counted toward the 14‑hour continuing education requirement?
options:
  - The seminar counts only if the Commission designates it as a specialty course
  - The seminar must be paired with another one‑hour session to meet the two‑hour minimum
  - The seminar counts as one hour toward the continuing education requirement
  - The seminar does not qualify because education must be completed in two‑hour increments
key: D
explanation: The rule requires continuing education to be completed in minimum 2‑hour increments, so
  a single 1‑hour seminar does not meet the requirement. The distractor that proposes pairing two
  1‑hour sessions is incorrect because each individual course must satisfy the 2‑hour minimum;
  combining two short sessions still fails to meet the increment rule.
