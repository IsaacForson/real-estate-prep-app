stem: A broker moves his office to a new location on June 1. According to 63 P.S. § 455.601(a), by
  what date must the broker submit the application to the Commission to designate the new office
  location and pay the required fees?
options:
  - June 10
  - June 12
  - June 13
  - June 11
key: D
explanation: The rule requires the application to be filed within ten days after the office move.
  Starting from June 1, the tenth day is June 11, which is the latest date to submit the application
  and pay the fees to comply with the requirement.
