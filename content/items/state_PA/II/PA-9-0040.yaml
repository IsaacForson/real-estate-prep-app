stem: Under 63 P.S. § 455.304(5), which of the following individuals is excluded from the Real
  Estate Licensing and Registration Act?
options:
  - An individual acting as trustee in bankruptcy while acting under a court order
  - An attorney-in-fact using a power of attorney to circumvent the intent of the act
  - An individual who is a licensed real estate salesperson employed by a broker
  - An individual who is a property manager who negotiates lease terms on behalf of an owner
key: A
explanation: The statute 63 P.S. § 455.304(5) excludes a person acting as trustee in bankruptcy,
  administrator, executor, trustee or guardian when acting under a court order or under the
  authority of a will or trust instrument. Therefore the choice describing an individual acting as a
  trustee in bankruptcy under a court order is the excluded individual. The choice describing an
  attorney‑in‑fact who uses a power of attorney to circumvent the act’s intent does not meet the
  exclusion because the statute excludes an attorney‑in‑fact only when the power of attorney is not
  used to circumvent the act.
