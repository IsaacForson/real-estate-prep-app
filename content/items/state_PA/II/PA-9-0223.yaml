stem: Alex completed the required 60 hours (4 credits) for the salesperson license and now wants to
  apply those credits toward the broker education requirement. Under 49 Pa. Code § 35.271(b)(2),
  what is the result?
options:
  - The credits may be applied only if Alex also completes a juris doctor degree.
  - The credits may be applied but only up to 2 credits toward the broker education requirement.
  - The credits may be applied fully toward the broker education requirement.
  - The credits may not be applied toward the broker education requirement.
key: D
explanation: The rule explicitly prohibits applying credits used to qualify for the salesperson
  examination toward the broker education requirement, so Alex cannot use those credits. The option
  claiming the credits may be applied fully is incorrect because the rule bars any such application.
citation:
  source: 49 Pa. Code ch. 35 (State Real Estate Commission) — 49 Pa. Code Chapter 35 — State Real
    Estate Commission (Pennsylvania Code, changes effective through 56 Pa.B. 4026, July 4, 2026) — §
    35.271(b)(2)
  url: null
  quoted_text: A candidate may not apply credits used to qualify for the salesperson’s examination
    toward fulfillment of the broker education requirement.
