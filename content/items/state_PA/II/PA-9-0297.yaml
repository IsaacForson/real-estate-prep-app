stem: Maya holds a bachelor’s degree in real estate from an accredited college and wishes to take
  the broker’s examination. According to 49 Pa. Code § 35.271(b)(1)(i), what is true about her
  education requirement?
options:
  - She is exempt from showing coursework in specific areas of study.
  - She must still complete 16 credits in professional real estate education.
  - She must complete an additional law course approved by the Commission.
  - She must also earn a juris doctor degree to satisfy the requirement.
key: A
explanation: The regulation provides that a bachelor’s degree with a major in real estate from an
  accredited college satisfies the education requirement, so the candidate need not show specific
  coursework. The distractor claiming she must still complete 16 credits ignores this exemption.
