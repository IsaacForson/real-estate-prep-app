stem: A licensee who holds an active broker license from another state wishes to obtain a
  Pennsylvania broker license through reciprocity. What examination requirement applies to this
  reciprocal licensee?
options:
  - The licensee must meet all standard broker requirements including age, experience, and education
  - The licensee must only pass the state portion of the examination
  - The licensee must pass both the national and state portions of the examination
  - The licensee must complete 16 credits in professional real estate education before testing
key: B
explanation: Under §35.271(c), a reciprocal licensee converting that license to a standard broker’s
  license is exempt from subsection (a) and is only required to pass the state portion of the
  examination. Therefore, the licensee need only pass the state portion. The distractor suggesting
  the full national and state examinations ignores the reciprocal exemption provided in the rule.
