stem: An applicant completed 45 hours of real estate instruction before the effective date of the
  amendment to 63 P.S. § 455.521(2) and now seeks a salesperson license. How many additional hours
  of instruction must the applicant complete to satisfy the education requirement?
options:
  - 15 hours
  - 30 hours
  - 60 hours
  - 75 hours
key: A
explanation: Because the applicant completed a portion of the required hours before the effective
  date, the total required instruction is 60 hours under § 455.521(2)(ii). Subtracting the 45 hours
  already completed leaves 15 additional hours needed.
citation:
  source: 63 P.S. § 455.521(2)(ii)
  url: null
  quoted_text: An applicant shall be required to complete 60 hours of real estate instruction as
    prescribed under subparagraph (i) if the applicant has completed a portion of the hours before
    the effective date of this subparagraph.
