  - Eleven years
  - Seven years
  - Four years
key: A
explanation: The rule mandates retention of transaction records for at least three years following
  consummation. The six‑month period applies only to specific acknowledgements, not the full
  transaction file. Therefore, the broker must keep the records for three years.
