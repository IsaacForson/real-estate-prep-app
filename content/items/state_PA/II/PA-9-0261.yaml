stem: Under 63 P.S. § 455.304(1), for a corporation, the exclusion for an owner does **NOT** extend
  to more than how many of its officers?
options:
  - Five officers
  - Three officers
  - Ten officers
  - Seven officers
key: A
explanation: The statute states that for a partnership or corporation, the owner's exclusion does
  not extend to more than five of its partners or officers. Therefore, the maximum number of
  officers that may be excluded is five. The distractor 'Three officers' understates the limit,
  while 'Seven officers' and 'Ten officers' exceed it.
