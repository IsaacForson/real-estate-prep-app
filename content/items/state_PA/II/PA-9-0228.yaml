stem: A salesperson whose license was originally issued 4 months ago applies for renewal of the
  current license. Under 49 Pa. Code § 35.383(a)(1), is the salesperson eligible for a full waiver
  of the continuing education requirement?
options:
  - The salesperson is ineligible for any waiver
  - The salesperson must complete the full 14 hours
  - The salesperson qualifies for a partial waiver of 1 hour
  - The salesperson qualifies for a full waiver
key: D
explanation: Section 35.383(a)(1) provides a full waiver when a license holder seeks renewal of a
  license initially issued within 6 months of the biennial period; the license in question was
  issued 4 months ago, satisfying this condition. The distractor suggesting a partial waiver is
  incorrect because the rule specifies a full waiver, not a partial one, for this situation.
