stem: Which of the following individuals is exempt from the continuing education requirement under
  49 Pa. Code § 35.382(c)?
options:
  - A reciprocal license holder
  - A residential real estate salesperson
  - A commercial real estate broker
  - A property manager
key: A
explanation: The exception in § 35.382(c) explicitly states that reciprocal license holders are not
  subject to the continuing education requirement. Residential real estate salespersons, commercial
  real estate brokers, and property managers are not listed in the exception and therefore must
  complete the required continuing education.
