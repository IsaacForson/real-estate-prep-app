stem: According to 49 Pa. Code § 35.271(a)(1), what is the minimum age requirement for an individual
  to take the broker’s examination for a standard broker’s license?
options:
  - The individual must be at least 18 years of age.
  - The individual must be at least 21 years of age.
  - The individual must be at least 25 years of age.
  - The individual must be at least 30 years of age.
key: B
explanation: The rule explicitly states that an individual must be 21 years of age or older to sit
  for the broker’s exam. The distractor stating 18 years reflects the salesperson age requirement,
  which does not apply to broker licensure.
