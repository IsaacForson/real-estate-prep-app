stem: An employee of a public utility negotiates the purchase of a right-of-way for a new pipeline
  as part of ordinary utility-related business. Under 63 P.S. § 455.304(2), is the employee required
  to hold a real estate license?
options:
  - The employee is required to hold a license because they are negotiating property
  - The employee is exempt only if they are also a licensed attorney
  - The employee is not required to hold a license due to the public utility exclusion
  - The employee must obtain a license only if the transaction exceeds $100,000
key: C
explanation: Under 63 P.S. § 455.304(2), employees of a public utility acting in the ordinary course
  of utility-related business under Title 66 are excluded from licensing when negotiating the
  purchase, sale or lease of property. The employee negotiating a right-of-way for a pipeline is
  performing such utility-related negotiations, so the exclusion applies and no license is needed.
  The distractor that claims a license is required because they are negotiating property overlooks
  the specific public utility exclusion. Therefore, the correct answer is the one stating the
  employee is not required to hold a license due to the public utility exclusion.
