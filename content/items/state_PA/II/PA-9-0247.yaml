stem: Under 49 Pa. Code § 35.201, how is a 'broker price opinion' defined?
options:
  - It is an estimate prepared by a broker, associate broker or salesperson that details the
    probable selling price of a particular parcel of real property and provides a varying level of
    detail about the property’s condition, market and neighborhood, and information on comparable
    sales, but does not include an automated valuation model.
  - It is the individual broker responsible for the real estate transactions of a partnership,
    association or corporation that holds a broker's license, including oversight of escrow
    accounts, supervision of affiliated licensees, ensuring compliance with all state licensing laws
    and regulations, maintaining records of all transactions, and acting as the point of contact for
    regulatory audits.
  - It is a written analysis, opinion or conclusion by a broker, associate broker or salesperson
    relating to the probable sale or rental price of a specified parcel of real property in an
    identified real estate market at a specified time, prepared without the benefit of a physical
    property inspection and without adjusting for unique property characteristics.
  - It is a computerized model used by mortgage originators and secondary market issuers to
    determine the collateral worth of a mortgage secured by a consumer's principal dwelling, relying
    on statistical algorithms and public data sources to estimate value without human appraisal.
key: A
explanation: The definition of a broker price opinion is given in 49 Pa. Code § 35.201 as an
  estimate prepared by a broker, associate broker or salesperson that details the probable selling
  price of a particular parcel of real property and provides a varying level of detail about the
  property's condition, market and neighborhood, and information on comparable sales, but does not
  include an automated valuation model. The option describing the individual broker responsible for
  a partnership's transactions is actually the definition of a broker of record, not a broker price
  opinion. The option describing a written analysis of probable sale or rental price omits the
  requirement that it be an estimate and that it exclude automated valuation models, so it does not
  match the statutory definition. The option describing a computerized model used to determine
  collateral worth describes an automated valuation model, which is explicitly excluded from the
  definition of a broker price opinion.
