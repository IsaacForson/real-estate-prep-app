stem: A broker holds an active standard license and also has an inactive standard license that he
  wishes to reactivate during the same renewal period. Under 49 Pa. Code § 35.382(b), which
  statement is correct regarding the continuing education requirement for renewal and reactivation?
options:
  - He may apply the same 14 hours of continuing education to both renewal and reactivation during
    the biennial period.
  - He is exempt from continuing education for reactivation if the license was inactive less than
    six months.
  - He may use any continuing education completed within the past year to satisfy requirements for
    renewal.
  - He must complete 14 hours of continuing education for reactivation in addition to the 14 hours
    for renewal.
key: D
explanation: The rule prohibits using the same coursework for both renewal and reactivation,
  requiring separate 14‑hour blocks. The other options either allow duplication or introduce
  exemptions not present in the section.
