stem: A candidate has been actively licensed as a broker in another state for four years and wishes
  to apply that experience toward the Pennsylvania broker education requirement. How many credits
  may be awarded for this experience under 49 Pa. Code § 35.271(b)(6)?
options:
  - Two credits
  - Four credits
  - Six credits
  - Eight credits
key: D
explanation: The regulation awards two credits for each year of active practice as a licensed broker
  in another state within the 10‑year period before application (49 Pa. Code § 35.271(b)(6)). Four
  years of experience therefore yields 4 × 2 = 8 credits. The option “Six credits” would correspond
  to only three years of experience, which does not match the candidate’s four‑year history.
