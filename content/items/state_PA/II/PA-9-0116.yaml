stem: A licensee seeks a waiver of the continuing education requirement due to a medical emergency.
  Under 49 Pa. Code § 35.383(a), what must the licensee demonstrate to the Commission to obtain the
  waiver?
options:
  - The licensee must prove inability due to illness, emergency, or hardship.
  - The licensee must have completed at least half of the required continuing education hours.
  - The licensee must be a qualified continuing education instructor to qualify for any waiver.
  - The licensee must submit the waiver request after March 31 of the renewal year.
key: A
explanation: The regulation allows a waiver upon proof of inability due to illness, emergency, or
  hardship. The other options describe conditions not mentioned in the waiver provision.
citation:
  source: 49 Pa. Code § 35.383(a)
  url: null
  quoted_text: The Commission may waive all or part of the continuing education requirement of §
    35.382 (relating to requirement) upon proof that the standard license holder seeking the waiver
    is unable to fulfill the requirement because of illness, emergency or hardship.
