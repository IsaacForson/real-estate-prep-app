key: C
explanation: The statute explicitly states that for a partnership the exclusion does not extend to
  more than five partners. Therefore the correct answer is five partners. The most tempting
  distractor is "3 partners" because some may mistakenly think the limit is lower, but the rule sets
  the maximum at five, not a minimum or other number.
