explanation: The salesperson definition expressly includes performing comparative market analyses as
  a duty that requires a license. Therefore, preparing such analyses necessitates a salesperson
  license. The distractor suggesting the analysis must include an automated valuation model is
  incorrect because the definition explicitly excludes automated valuation models from the
  salesperson's scope.
