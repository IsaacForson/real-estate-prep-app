stem: Under 63 P.S. § 455.304(9), which individual is excluded from the Real Estate Licensing and
  Registration Act when performing authorized duties at a bona fide auction?
options:
  - An auctioneer licensed under the Auctioneers' License Act.
  - A real estate broker conducting the auction.
  - A property manager hired by the auctioneer.
  - A title company representative attending the auction.
key: A
explanation: The exclusion explicitly excludes auctioneers licensed under the Auctioneers' License
  Act while performing authorized duties at a bona fide auction. The most tempting distractor, a
  real estate broker conducting the auction, is incorrect because brokers are not excluded unless
  they meet another statutory exclusion; conducting an auction is a real estate activity requiring
  licensure.
