stem: Broker Carla shares office space with another broker in the same building. Under 63 P.S. §
  455.601(a), what must Carla ensure regarding the sign on the outside of the shared office?
options:
  - Carla must share a single sign that displays both brokerage names.
  - Carla must maintain a sign indicating her own proper licensed brokerage name.
  - Carla must display the State Real Estate Commission's logo on the office sign.
  - Carla must remove any sign from the outside of the shared office.
key: B
explanation: The statute requires each broker holding a standard license to maintain a sign on the
  outside of his or her office indicating the proper licensed brokerage name. This obligation
  applies individually to each broker, even when office space is shared, so Carla must display her
  own brokerage name.
