stem: Under 63 P.S. § 455.304(1), the exclusion for an owner of real estate does **NOT** apply to
  which of the following?
options:
  - The owner is leasing property owned by the owner.
  - The owner is managing property owned by the owner.
  - The owner is selling property owned by the owner.
  - The owner is engaged in a wholesale transaction.
key: D
explanation: The statute explicitly states that the exclusion for an owner does not apply to a
  wholesale transaction. Therefore, when the owner is engaged in a wholesale transaction, the
  exclusion does not apply. The other options describe activities that remain within the exclusion.
