stem: A broker’s license went on inactive status on January 1, 2023. The broker submits a
  reactivation application on June 1, 2025 and has completed 14 hours of continuing education
  between January 2024 and January 2025. Under 49 Pa. Code § 35.382(b), are those hours acceptable
  for the reactivation requirement?
options:
  - Yes, but only if the broker also completes an additional 14 hours for renewal.
  - No, because the coursework must be completed during the license period before inactivation.
  - No, because the same coursework cannot be used for both reactivation and renewal.
  - Yes, because the hours were completed within the 2‑year period preceding the application date.
key: D
explanation: The regulation requires the 14 hours to be completed during the 2-year period preceding
  the reactivation application; the hours from Jan 2024‑Jan 2025 fall within the window from Jun 1,
  2023 to Jun 1, 2025, so they are acceptable. The option stating the hours must be in the period
  immediately preceding inactivation misstates the rule.
