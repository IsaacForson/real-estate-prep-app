stem: A partnership holds a broker license. Which individual is responsible for the partnership’s
  real estate transactions under 49 Pa. Code § 35.201?
options:
  - The individual broker responsible for the real estate transactions of a partnership, association
    or corporation that holds a broker’s license
  - The individual broker responsible for the real estate transactions of a sole proprietorship that
    holds a broker’s license
  - The individual broker responsible for the real estate transactions of a partnership, association
    or corporation that holds a salesperson’s license
  - The individual broker responsible for the real estate transactions of a partnership, association
    or corporation that holds a cemetery broker’s license
key: A
explanation: Under 49 Pa. Code § 35.201, the broker of record is the individual broker responsible
  for the real estate transactions of a partnership, association, or corporation that holds a
  broker’s license. The other options incorrectly describe responsibility for a sole proprietorship,
  a salesperson’s license, or a cemetery broker’s license.
