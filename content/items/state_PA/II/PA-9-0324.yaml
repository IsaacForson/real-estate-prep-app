stem: Under 49 Pa. Code § 35.222(a)(3), what recommendation documents must a standard broker license
  applicant submit if the applicant has **NOT** changed county of residence within the past year?
options:
  - Submit one broker recommendation and two unrelated property owners from the county of residence.
  - Submit one broker recommendation and two unrelated property owners from the county of previous
    residence.
  - Submit two broker recommendations and two unrelated property owners from the county of residence.
  - Submit one broker recommendation and one unrelated property owner from the county of residence.
key: A
explanation: The correct answer is A because §35.222(a)(3)(i) requires one broker recommendation and
  (ii) requires two unrelated property owners from the county of residence, while subsection (iii)
  only applies if the applicant changed county of residence within the prior year. Since the
  applicant has not moved, (iii) does not apply, so no recommendation from the previous county is
  needed. Distractor B incorrectly adds the previous‑county requirement despite the absence of a
  recent move.
