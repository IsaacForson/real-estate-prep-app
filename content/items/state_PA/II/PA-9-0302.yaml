stem: Under 49 Pa. Code § 35.271(b)(6), how many credits are allowed for each year of active
  practice as a licensed broker in another state during the 10-year period immediately preceding the
  submission of the examination application?
options:
  - One credit
  - Two credits
  - Three credits
  - Four credits
key: B
explanation: The rule states that two credits are allowed for each year of active practice as a
  licensed broker in another state during the 10‑year period preceding the application (49 Pa. Code
  § 35.271(b)(6)). Therefore, each qualifying year yields two credits. The distractor “Three
  credits” incorrectly assumes an additional credit per year, which the regulation does not provide.
