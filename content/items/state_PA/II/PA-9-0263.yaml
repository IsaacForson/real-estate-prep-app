stem: A corporation that owns real estate has three officers who all engage in real estate
  transactions on behalf of the corporation. Under 63 P.S. § 455.304(1), how many of those officers
  are excluded from the act?
options:
  - One officer
  - Three officers
  - Two officers
  - Zero officers
key: B
explanation: The exclusion for an owner does not extend to more than five partners or officers. With
  only three officers, all fall within the five-officer limit, so each officer is excluded. The
  distractors suggest fewer officers are excluded, which contradicts the statutory limit.
