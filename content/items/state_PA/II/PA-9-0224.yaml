stem: Taylor holds an active salesperson license from another state and wishes to obtain a
  Pennsylvania salesperson license through reciprocity. Under 49 Pa. Code § 35.272(c), what
  examination requirement applies?
options:
  - Taylor must pass both the national and state portions of the examination.
  - Taylor must pass only the state portion of the examination.
  - Taylor must pass only the national portion of the examination.
  - Taylor must complete 60 hours of instruction before taking any examination.
key: B
explanation: The rule provides that a licensee converting a reciprocal license to a standard
  salesperson’s license is exempt from the education and application requirements and need only pass
  the state portion of the examination. Therefore, passing both national and state portions is not
  required.
citation:
