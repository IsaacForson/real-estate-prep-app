stem: Broker Evans holds a standard license and wishes to supervise two branch offices located in
  different towns. Under 63 P.S. § 455.601(b), is Evans permitted to direct and supervise both
  offices?
options:
  - Evans may supervise both offices because a broker or associate broker may direct and supervise
    more than one office
  - Evans may not supervise both offices because each office must be under the direction of a
    separate broker license
  - Evans may supervise both offices only if he obtains an additional broker license for each office
  - Evans may not supervise both offices because the broker must be physically present at each
    office to supervise
key: A
explanation: The rule provides that a broker or associate broker may direct and supervise more than
  one office, so Evans may oversee both offices without needing separate licenses for each. The most
  tempting distractor is the claim that each office requires a separate broker license, which
  contradicts the explicit permission to supervise multiple offices.
