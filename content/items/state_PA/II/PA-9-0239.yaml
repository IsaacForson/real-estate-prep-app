stem: Broker Jenna completed a residential sale on March 15, 2024 and received the signed
  acknowledgement portion of the consumer notice from the buyer. Under 49 Pa. Code § 35.286(a), how
  long must Jenna retain this acknowledgement portion?
options:
  - Four years
  - Seven years
  - Three years
  - Eleven years
key: C
explanation: The rule requires brokers to keep records pertaining to a real estate transaction for
  at least three years after consummation. The acknowledgement portion of the consumer notice is
  part of those records when a sale occurs, so it must be retained for three years. The six‑month
  exception applies only when there is no real estate transaction, which is not the case here.
