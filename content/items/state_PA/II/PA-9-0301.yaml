stem: Under 63 P.S. § 455.521(3), which statement is correct regarding the high school graduation
  requirement for a salesperson license applicant?
options:
  - The requirement applies to all applicants regardless of prior licensure.
  - The requirement does not apply to a person licensed before the effective date of this paragraph.
  - The requirement is satisfied by completing a college degree in any field.
  - The requirement is waived for applicants who are at least 21 years old.
key: B
explanation: Under 63 P.S. § 455.521(3), the high‑school graduation requirement is exempt for
  persons who were already licensed before the provision’s effective date; therefore the statement
  that the requirement does not apply to a person licensed before the effective date of this
  paragraph is correct.
