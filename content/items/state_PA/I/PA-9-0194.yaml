stem: An applicant for a Pennsylvania real estate salesperson license completed 30 hours of approved
  real estate instruction before the effective date of the 60‑hour rule. How many additional hours
  of instruction must the applicant complete to satisfy the education requirement under 63 P.S. §
  455.521(2)(ii)?
options:
  - 30 hours of additional instruction
  - 45 hours of additional instruction
  - 60 hours of additional instruction
  - 75 hours of additional instruction
key: A
explanation: The rule requires a total of 60 hours of instruction for applicants who have completed
  any portion before the effective date; having already completed 30 hours, the applicant needs 30
  more to reach the 60‑hour total. The distractor suggesting 60 additional hours incorrectly treats
  the 60‑hour figure as an additive requirement rather than the total.
