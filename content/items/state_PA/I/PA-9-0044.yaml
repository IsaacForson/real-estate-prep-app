stem: A Pennsylvania broker with a standard license wishes to open a second office in another city.
  What must the broker do under the Real Estate Licensing and Registration Act?
options:
  - Apply for an additional license for the second office and ensure each office is directed by the
    broker or an associate broker.
  - Simply open the second office under the existing license as long as the broker supervises both
    locations.
  - Notify the commission within ten days of opening and pay a fee for the additional office.
  - Obtain a separate broker's license for the second office and operate it independently.
key: A
explanation: Under 63 P.S. §§ 455.101–455.902 § 455.601(b), a broker who intends to maintain more
  than one place of business must apply for and obtain an additional license for each office, and
  each office must be under the direction of the broker or an associate broker. The correct choice
  describes applying for an additional license for the second office and directing each office by
  the broker or an associate broker. The incorrect choice suggests opening the second office under
  the existing license with broker supervision, which does not satisfy the requirement for an
  additional license.
