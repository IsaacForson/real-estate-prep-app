stem: A Pennsylvania individual spends most of their time creating advertising campaigns for real
  estate developers and occasionally helps clients locate properties for purchase. Under the Real
  Estate Licensing and Registration Act, is this individual required to hold a broker license?
options:
  - Licensure is not required because the individual's main business is advertising, promotion, or
    public relations.
  - Licensure is required because the individual receives compensation for real estate-related
    services.
  - Licensure is required because any assistance in locating properties constitutes brokerage
    activity.
  - Licensure is not required because the individual only occasionally helps clients and does not
    meet the threshold for licensure.
key: A
explanation: The proviso excludes persons whose main business is advertising, promotion, or public
  relations from the broker definition; therefore no license is needed. The statement that
  occasional assistance in locating properties requires a license is incorrect because the exemption
  applies when the primary activity is advertising, not real estate brokerage.
