stem: An individual has submitted an application for a Pennsylvania real estate salesperson license.
  Which entity is responsible for administering the licensing examination to the applicant?
options:
  - To administer the examination by a private testing company
  - To administer the examination by the State Real Estate Commission
  - To administer the examination by the Pennsylvania Department of State
  - To administer the examination by the local county court
key: B
explanation: The Commission has authority to examine applicants per § 455.403; the Department of
  State does not administer the exam under this act.
