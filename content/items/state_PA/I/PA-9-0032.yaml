stem: A Pennsylvania real estate broker is unable to complete the required 14 hours of continuing
  education due to a sudden hospitalization and submits medical documentation to the State Real
  Estate Commission. Under the continuing education provisions, what action may the commission take?
options:
  - Require the broker to complete double the hours in the next renewal period.
  - Waive all or part of the continuing education requirement.
  - Automatically suspend the broker's license until the hours are completed.
  - Fine the broker $1,000 for failing to meet the requirement.
key: B
explanation: The commission may waive all or part of the CE requirement if the licensee shows
  evidence, to the commission's satisfaction, of inability due to illness, emergency, or hardship.
  The fine option is incorrect because the statute provides for waiver, not an automatic penalty.
citation:
  source: 63 P.S. §§ 455.101–455.902 § 455.404a(a)
  url: null
  quoted_text: The commission may waive all or part of the continuing education requirement for a
    salesperson or broker who shows evidence, to the commission's satisfaction, that he was unable
    to complete the requirement due to illness, emergency or hardship.
