    455.101 et seq.), official Pennsylvania General Assembly PDF read via Internet Archive capture
    of 2025-01-14 because legis.state.pa.us/palegis.us refuse connections from this network; section
    headings annotated with 63 P.S. numbers — § 455.802"
  url: null
  quoted_text: If at the commencement of any biennial renewal period beginning in 1982 and thereafter,
    the balance of the fund is less than $300,000, the commission may assess an additional fee, in
    addition to the renewal fee, against each licensee and registrant in an amount not to exceed $10
    which will yield revenues sufficient to bring the balance of the fund to $500,000.
