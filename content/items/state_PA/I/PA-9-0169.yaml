stem: At the commencement of a biennial renewal period beginning in 1982, the Real Estate Recovery
  Fund balance is $250,000. What action may the Commission take under 63 P.S. § 455.802?
options:
  - Suspend all license renewals until the fund balance reaches $300,000.
  - Assess a fee of up to $10 per licensee to raise the fund to $500,000.
  - Transfer excess funds from the fund to the State Treasury for deposit.
  - Refund $10 to each licensee upon renewal of their license.
key: B
explanation: Under 63 P.S. § 455.802, if the fund balance is less than $300,000 at the start of a
  biennial renewal period beginning in 1982, the Commission may assess an additional fee of up to
  $10 per licensee to raise the fund balance to $500,000. A distractor that proposes refunding $10
  to each licensee is incorrect because the statute authorizes assessing, not refunding, fees in
  this circumstance.
