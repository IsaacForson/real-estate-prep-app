stem: A member of the State Real Estate Commission misses three consecutive commission meetings due
  to a sudden illness and submits a written request to the Commissioner of Professional and
  Occupational Affairs asking to be excused. If the Commissioner finds the member should be excused,
  what is the effect on the member's seat?
options:
  - Forfeiture of the seat and removal from office
  - Retention of the seat and continued service
  - Suspension of the seat pending investigation
  - Resignation from the seat required within ten days
key: B
explanation: The statute provides that a member who fails to attend three consecutive meetings
  forfeits the seat unless the Commissioner, upon written request, finds the member should be
  excused due to illness or death of a family member. Therefore, if excused, the member retains the
  seat. The distractor "Automatic forfeiture of the seat" is incorrect because the forfeiture is
  avoided when the Commissioner excuses the absence.
citation:
  source: 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act) — Real Estate
    Licensing and Registration Act, Act of Feb. 19, 1980, P.L. 15, No. 9), official Pennsylvania
    General Assembly PDF read via Internet Archive capture of 2025-01-14 because
    legis.state.pa.us/palegis.us refuse connections from this network; section headings annotated
    with 63 P.S. numbers 63 P.S. § 455.202(c)
  url: null
  quoted_text: A commission member who fails to attend three consecutive meetings shall forfeit his
    seat unless the Commissioner of Professional and Occupational Affairs, upon written request from
    the member, finds that the member should be excused from a meeting because of illness or the
    death of a family member.
