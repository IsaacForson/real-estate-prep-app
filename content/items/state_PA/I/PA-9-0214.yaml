stem: A Pennsylvania salesperson passed the salesperson license examination on August 14, 2023 and
  submitted the license application on August 15, 2026. Is the application timely under 63 P.S. §
  455.522(c)?
options:
  - The application is timely because the commission may accept late applications with a penalty.
  - The application is untimely because the applicant must retake the examination before submitting
    an application.
  - The application is timely because it was submitted within three years of passing the examination.
  - The application is untimely because it was submitted after the three‑year period expired.
key: D
explanation: The statute requires the application to be received within three years of passing the
  examination; submitting on August 15, 2026 is one day after the three‑year deadline ending August
  14, 2026. Therefore the application is untimely. The statute does not provide for late acceptance
  with a penalty or allow submission without retaking the exam after expiration.
