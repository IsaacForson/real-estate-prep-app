stem: Under Pennsylvania law, what is the minimum number of members of the State Real Estate
  Commission that must be present to constitute a quorum?
options:
  - Three commission members.
  - Five commission members.
  - Seven commission members.
  - A majority of members.
key: D
explanation: The statute defines a quorum as a majority of the members currently serving on the
  commission, making the option stating that a majority of members constitutes a quorum correct. The
  option stating that five commission members constitute a quorum is incorrect because the quorum is
  not a fixed number of five members; it depends on how many members are currently serving.
