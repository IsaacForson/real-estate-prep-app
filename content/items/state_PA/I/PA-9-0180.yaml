stem: Under Pennsylvania law, in a commercial property sale or lease transaction, when are the
  disclosures required under subsections (a), (b) and (c) of § 455.608 **NOT** required?
options:
  - When the property is residential and the prospective buyer/tenant or seller/landlord is an
    individual.
  - When the property is residential and the prospective buyer/tenant or seller/landlord is not an
    individual.
  - When the property is commercial and the prospective buyer/tenant or seller/landlord is an
    individual.
  - When the property is commercial and the prospective buyer/tenant or seller/landlord is not an
    individual.
key: D
explanation: The statute states that the required disclosures do not apply in commercial property
  sale or lease transactions unless the prospective buyer/tenant or seller/landlord is an
  individual. Therefore, when the transaction is commercial and the buyer/tenant or seller/landlord
  is not an individual (e.g., a corporation), the disclosures are not required.
