stem: A broker receives a check as an earnest money deposit with written consent from the buyer and
  seller to hold the check uncashed pending acceptance of the offer. The offer is ultimately not
  accepted. What must the broker do with the check under 63 P.S. § 455.608e(f)?
options:
  - Promptly return the check uncashed to the buyer or lessee.
  - Deposit the check into a custodial or trust fund account within three business days.
  - Hold the check in escrow until a new offer is received.
  - Void the check and issue a new check for the same amount to the buyer.
key: A
explanation: Section 63 P.S. § 455.608e(f) states that if an offer is not accepted, the broker shall
  promptly return the check uncashed to the buyer or lessee. The other options describe actions not
  permitted or required by this provision.
