stem: After a broker's license is suspended by the Pennsylvania State Real Estate Commission, where
  must the broker post the suspension notice provided by the Commission?
options:
  - Only at the main office entrance.
  - At the main office and each branch office.
  - Only at the entrance of the main office.
  - In a local newspaper advertisement.
key: B
explanation: The rule requires the notice to be posted at the main office and at each branch office,
  prominently near the public entrance of each office. A distractor stating that only the main
  office needs the notice is incorrect because branch offices are also required to display the
  notice.
citation:
  source: "### 49 Pa. Code ch. 35 (State Real Estate Commission) — 49 Pa. Code Chapter 35 — State Real
    Estate Commission (Pennsylvania Code, changes effective through 56 Pa.B. 4026, July 4, 2026) — §
    35.291"
  url: null
  quoted_text: A broker or cemetery broker whose license is suspended by the Commission shall return
    his license to the Commission and shall post a notice of the Commission’s action at the main
    office and at branch offices. The notice, which will be provided by the Commission, shall be
    posted prominently on or near the public entrance to each office.
