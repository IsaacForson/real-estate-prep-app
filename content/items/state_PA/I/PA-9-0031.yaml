stem: A member of the State Real Estate Commission attends a commission meeting on Tuesday and
  spends four hours on commission business that day. Under Pennsylvania law, what per diem
  compensation is the member entitled to receive for that day?
options:
  - $0.00 per day.
  - $30.00 per day.
  - $60.00 per day.
  - $120.00 per day.
key: C
explanation: The rule provides $60 per day for time actually devoted to commission business, so four
  hours qualifies for the full daily rate. The $30.00 per day option incorrectly halves the rate.
