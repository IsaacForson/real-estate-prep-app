stem: A licensee places a 'for sale' sign on a property without the owner's written consent. Which
  provision of § 455.604 has been violated?
options:
  - "Violation of subsection (7): Acting for more than one party in a transaction without the
    knowledge and consent in writing of all parties."
  - "Violation of subsection (10): Failing to specify a definite termination date that is not
    subject to prior notice, in any listing contract."
  - "Violation of subsection (8): Placing a \"for sale\" or \"for rent\" sign without the owner's
    written consent."
  - "Violation of subsection (6): Failing to preserve transaction records for three years after
    closing."
key: C
explanation: Subsection (8) prohibits placing a 'for sale' or 'for rent' sign on or advertising any
  property without the written consent of the owner or authorized agent. The scenario directly
  matches this prohibition. The distractor about failing to preserve records concerns a different
  record‑keeping requirement unrelated to sign placement.
