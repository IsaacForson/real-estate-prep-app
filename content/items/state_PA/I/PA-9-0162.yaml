stem: A Pennsylvania broker receives a payment from the Real Estate Recovery Fund to settle a claim
  against him. According to the Real Estate Licensing and Registration Act, what is the immediate
  effect on his broker's license?
options:
  - It is placed on probation for the six months.
  - It is automatically suspended upon the effective date of the payment.
  - It must be surrendered to the Commission within ten days.
  - It remains active but the broker must complete additional continuing education.
key: B
explanation: The statute provides that the license shall automatically suspend upon the effective
  date of the payment. The distractor suggesting probation is incorrect because the law mandates
  automatic suspension, not a probationary period.
