stem: Under Pennsylvania law, what must a holder of a reciprocal license do if their principal place
  of business moves into the Commonwealth?
options:
  - Notify the commission within ten days and continue operating under the reciprocal license.
  - Notify the commission promptly; the reciprocal license will not be renewed and a standard
    license must be obtained.
  - Apply for a new reciprocal license from the commission and pay the standard license fee.
  - Surrender the reciprocal license to the commission and cease all real estate activity in
    Pennsylvania.
key: B
explanation: The rule requires a reciprocal licensee to promptly notify the commission when their
  principal place of business enters Pennsylvania; upon notice, the reciprocal license is not
  renewed and the licensee must obtain a standard license. The option stating that the licensee must
  notify the commission promptly; the reciprocal license will not be renewed and a standard license
  must be obtained matches this requirement. The option stating that the licensee should notify the
  commission within ten days and continue operating under the reciprocal license is incorrect
  because the licensee cannot continue under the reciprocal license after moving into the
  Commonwealth; the license must be replaced with a standard license.
citation:
  source: 63 P.S. §§ 455.101–455.902 § 455.602(g)
  url: null
  quoted_text: A person who holds a reciprocal license shall promptly notify the commission if the
    person's principal place of business for the provision of real estate services becomes located
    in this Commonwealth.
