stem: A Pennsylvania broker has had their license on inactive status for four years and now wishes
  to reactivate it. What must the broker demonstrate to the State Real Estate Commission to have the
  license reissued?
options:
  - Proof of completing 14 hours of continuing education.
  - Proof of completing 30 hours of continuing education.
  - Proof of passing the salesperson examination again.
  - Proof of completing a broker refresher course.
key: A
explanation: To reactivate a license placed on inactive status, the licensee must show evidence of
  14 hours of continuing education (63 P.S. § 455.404.1(e)(2)). Thus, proof of 14 hours is required.
  The distractor of 30 hours is incorrect because the statute specifies 14 hours, not 30.
