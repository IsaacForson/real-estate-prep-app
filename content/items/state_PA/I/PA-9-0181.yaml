stem: A licensee is showing a time-share estate to a prospective buyer. According to 63 P.S. §
  455.608(e)(2), when must the licensee provide the written consumer notice indicating the capacity
  in which the licensee is acting?
options:
  - At the time of the initial interview.
  - Within three days of the initial interview.
  - After the buyer signs the purchase agreement.
  - At the closing of the transaction.
key: A
explanation: The statute requires that, in time-share cases, the written statement indicating the
  licensee's capacity be provided at the time of the initial interview.
