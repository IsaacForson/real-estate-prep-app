stem: Under 63 P.S. § 455.521(3), which individual is exempt from the high school graduation
  requirement for a Pennsylvania real estate salesperson license?
options:
  - An applicant who has completed seventy‑five hours of approved real estate instruction
  - An applicant who is at least twenty‑one years of age and holds a high school diploma
  - An applicant who was already licensed as a salesperson before the effective date of this
    paragraph
  - An applicant who has completed a portion of the required hours before the effective date
key: C
explanation: The statute explicitly states that the high school graduation requirement does not
  apply to a person licensed before the effective date of this paragraph. Therefore, an applicant
  who was already licensed as a salesperson before that date is exempt. The distractor about
  completing a portion of the hours refers to the 60‑hour instruction exemption, not the high school
  requirement.
