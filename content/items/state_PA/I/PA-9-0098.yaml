stem: The State Real Estate Commission pays $5,000 from the Real Estate Recovery Fund to settle a
  claim against a licensee. Assuming no partial repayments have been made, what total amount must
  the licensee repay to be eligible for reinstatement after one year?
options:
  - $5,000
  - $5,500
  - $6,000
  - $6,500
key: B
explanation: According to § 455.803(f)(2), a licensee must repay the amount paid from the fund plus
  interest at 10% per year. After one year, $5,000 plus 10% interest ($500) equals $5,500 required
  for reinstatement.
citation:
  source: "### 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act) — Real Estate
    Licensing and Registration Act, Act of Feb. 19, 1980, P.L. 15, No. 9, as amended (63 P.S. §
    455.101 et seq.), official Pennsylvania General Assembly PDF read via Internet Archive capture
    of 2025-01-14 because legis.state.pa.us/palegis.us refuse connections from this network; section
    headings annotated with 63 P.S. numbers — § 455.803"
  url: null
  quoted_text: No such licensee shall be granted reinstatement until he has repaid in full plus
    interest at the rate of 10% a year, the amount paid from the Real Estate Recovery Fund.
