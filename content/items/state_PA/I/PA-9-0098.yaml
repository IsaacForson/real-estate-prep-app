math:
  worked_solution: Principal = $5,000; Interest rate = 10% per year; Time = 1 year. Interest =
    Principal × Rate × Time = $5,000 × 0.10 × 1 = $500. Total repayment = Principal + Interest =
    $5,000 + $500 = $5,500.
