stem: A Pennsylvania licensee receives notice that the real estate licensing authority of another
  state has imposed disciplinary action. Under 49 Pa. Code § 35.290(b), within how many days must
  the licensee notify the Pennsylvania State Real Estate Commission?
options:
  - Thirty-day period
  - Twenty-day period
  - Forty-day period
  - Ten-day period
key: A
explanation: Under 49 Pa. Code § 35.290(b), a licensee must notify the Commission within 30 days of
  receiving notice of disciplinary action from another jurisdiction, making the thirty‑day period
  correct. The distractor suggesting a twenty‑day period confuses the timeframe with other reporting
  requirements that do not apply here.
