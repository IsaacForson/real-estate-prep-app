stem: A licensed salesperson in Pennsylvania decides to change employment from one broker to
  another. What must the salesperson do under the Real Estate Licensing and Registration Act?
options:
  - Obtain a written release from the current broker and file it with the commission before starting
    with the new broker.
  - Notify the commission in writing within ten days of the change, pay the required fee, and return
    the current license to the commission.
  - Submit a new license application to the commission and continue working under the old license
    until approval.
  - Immediately begin working for the new broker and inform the commission within thirty days of the
    change.
key: B
explanation: Under the Real Estate Licensing and Registration Act, a salesperson who wishes to
  change brokers must notify the commission in writing no later than ten days after the intended
  date of change, pay the required fee, and return the current license. The option that states the
  salesperson must notify the commission in writing within ten days, pay the fee, and return the
  license correctly reflects this requirement. The option suggesting the salesperson obtain a
  written release from the current broker and file it before starting is not required by the
  statute. The option proposing to submit a new application and continue working under the old
  license until approval is incorrect because the salesperson must return the current license and
  may not continue to work under it while awaiting a new one. The option stating the salesperson may
  immediately begin work for the new broker and inform the commission within thirty days fails to
  meet the ten‑day notice and fee requirements.
