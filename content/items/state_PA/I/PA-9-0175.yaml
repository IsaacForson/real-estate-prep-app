stem: The State Real Estate Commission plans to hold a required public meeting in Philadelphia on
  May 10, 2025. By what date must the Commission publish notice of this meeting in a newspaper of
  general circulation to comply with the law?
options:
  - May 5, 2025
  - April 30, 2025
  - April 25, 2025
  - April 20, 2025
key: C
explanation: The statute requires that the Commission give public notice of each required public
  meeting at least 15 days prior in a newspaper of general circulation in the area where the meeting
  is held. Counting back 15 days from May 10 yields April 25, so notice must be published by that
  date. The April 20 distractor is too early, while April 30 is after the required deadline.
