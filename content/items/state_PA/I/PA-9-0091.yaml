stem: A Pennsylvania salesperson who owns an interest in a qualified association receives a
  commission from that association for providing real estate services. Under § 455.604(c) of the
  Real Estate Licensing and Registration Act, is this arrangement lawful?
options:
  - Lawful; the act expressly permits such payments
  - Lawful if the commission is under five hundred dollars
  - Unlawful unless the association is also a licensed broker
  - Unlawful; commissions must come exclusively from the broker
key: A
explanation: Section 455.604(c) expressly provides that it is not unlawful for a salesperson to
  receive a commission from a qualified association in which they have an interest, so the
  arrangement is lawful. The distractor claiming it is unlawful because commissions must come
  exclusively from the broker misreads the exception created by subsection (c).
