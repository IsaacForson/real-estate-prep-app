stem: "A Pennsylvania broker whose license has been suspended by the State Real Estate Commission must:"
options:
  - The return of the license to the Commission and posting of a notice at the main office within 30
    days
  - The posting of a notice at the main office and waiting for the Commission to provide the notice
  - The return of the license to the Commission and posting of a notice at the main office and each
    branch office
  - The return of the license to the Commission and posting of a notice at the main office only
key: C
explanation: Under 49 Pa. Code § 35.291, a broker whose license is suspended must return the license
  to the Commission and post a notice of the suspension at the main office and at each branch
  office. An answer that only requires returning the license and posting a notice at the main office
  within 30 days is incorrect because it omits the requirement to post notices at branch offices and
  adds a 30‑day deadline that the rule does not contain. An answer that requires posting a notice at
  the main office and waiting for the Commission to provide the notice is incorrect because it fails
  to require the return of the license and introduces a step not mandated by the rule. An answer
  that requires returning the license and posting a notice only at the main office is incorrect
  because it leaves out the obligation to post notices at branch offices.
