stem: A Pennsylvania licensee places their real estate salesperson license on inactive status. What
  is the maximum number of years the license may remain on inactive status before the licensee must
  either reactivate it or retake the examination?
options:
  - Two years.
  - Three years.
  - Five years.
  - Seven years.
key: C
explanation: The regulation states that licenses may be placed on inactive status for no more than
  five years (63 P.S. § 455.404.1(e)(1)). Therefore, the maximum period is five years. The
  distractor of three years is incorrect because the rule explicitly allows up to five years, not
  three.
