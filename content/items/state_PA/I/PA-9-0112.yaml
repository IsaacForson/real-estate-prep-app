stem: Under 63 P.S. § 455.608b(3), what must a sales agreement include regarding the property's
  zoning classification?
options:
  - A statement describing the purpose of the Real Estate Recovery Fund established under section
    801 and the telephone number of the commission at which further information about the fund may
    be obtained.
  - A statement identifying any possibility that the broker may designate one or more licensees
    affiliated with the broker to represent the separate interest of the parties to the transaction.
  - A statement of the zoning classification of the property, except in cases where the property or
    each parcel of the property, if subdividable, is zoned solely or primarily to permit
    single-family dwellings.
  - A statement that the broker's fee and the duration of the contract have been determined as a
    result of negotiations between the broker and the seller/landlord or buyer/tenant.
key: C
explanation: The correct answer directly quotes the requirement in § 455.608b(3) for a zoning
  classification disclosure, with an exception for properties zoned solely for single-family
  dwellings. The other options, while true disclosures required elsewhere in the statute, do not
  address the zoning classification mandate.
