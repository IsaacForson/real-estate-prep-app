stem: A licensee closes a residential sale on January 15, 2024. By what date must the licensee
  preserve the transaction records to comply with Pennsylvania law?
options:
  - By January 15, 2027
  - By January 15, 2028
  - By January 15, 2025
  - By January 15, 2026
key: A
explanation: Section 455.604(6) requires preservation of records for three years following the
  consummation of a real estate transaction. Adding three years to the closing date of January 15,
  2024 yields January 15, 2027. The January 15, 2026 option is incorrect because it reflects only a
  two‑year retention period.
