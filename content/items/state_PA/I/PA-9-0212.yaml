stem: A Pennsylvania broker who holds an active license wishes to sell campground memberships to
  clients. Under the Real Estate Licensing and Registration Act, must the broker obtain a separate
  campground membership salesperson license?
options:
  - The broker is not required to obtain a separate campground membership salesperson license.
  - The broker must obtain a campground membership salesperson license before selling any
    memberships.
  - The broker may sell campground memberships only if employed by a licensed campground membership
    broker.
  - The broker must complete additional continuing education specific to campground memberships
    before selling.
key: A
explanation: The definition of campground membership salesperson explicitly states that a person
  licensed as a broker is not required to be licensed as a campground membership salesperson to sell
  or offer campground memberships. The other options impose requirements not found in the Act.
citation:
  source: 63 P.S. § 455.201
  url: null
  quoted_text: A person licensed as a broker, as a salesperson or as a time-share salesperson shall
    not be required to be licensed as a campground membership salesperson as a condition for selling
    or offering to sell campground memberships.
