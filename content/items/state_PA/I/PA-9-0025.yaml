stem: A real estate school submits an application to the State Real Estate Commission seeking
  approval to offer pre-licensing courses. Under the Real Estate Licensing and Registration Act,
  what action must the commission take?
options:
  - To issue licenses and renewal certificates in this Commonwealth
  - To examine license applicants and salespersons in this Commonwealth
  - To approve real estate schools and education programs in this Commonwealth
  - To promulgate regulations and continuing education standards in this Commonwealth
