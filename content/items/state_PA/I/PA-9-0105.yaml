stem: Under Pennsylvania law, what must a broker who holds a standard license maintain at his office?
options:
  - A sign indicating the proper licensed brokerage name
  - A copy of the commission's continuing education requirements
  - A roster of all employed salespersons displayed publicly
  - A surety bond filed with the county recorder
key: A
explanation: The statute requires each broker with a standard license to maintain a sign on the
  outside of the office indicating the proper licensed brokerage name. The other options are not
  mandated by this provision.
