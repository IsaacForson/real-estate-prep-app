stem: A Pennsylvania licensee acts as a subagent for a listing broker and is cooperating with that
  broker for a fee paid by the listing broker. Before providing any services to a buyer, the
  licensee presents a written disclosure statement for the buyer to sign, but the buyer refuses to
  sign it. What must the licensee do according to the Real Estate Licensing and Registration Act?
options:
  - Terminate the cooperation with the listing broker immediately.
  - Obtain a written agreement from the seller before providing services.
  - Note the refusal on the statement and retain it for six months.
  - Provide the buyer with an oral disclosure of the services instead.
key: C
explanation: The rule requires a subagent cooperating with a listing broker to give the buyer a
  written disclosure statement signed by the buyer; if the buyer refuses to sign, the licensee must
  note the refusal on the statement and retain it for six months. Obtaining a written agreement from
  the seller is not required by this provision.
