stem: Under Pennsylvania regulations, a licensee who is convicted of a misdemeanor must notify the
  State Real Estate Commission within how many days of the verdict or plea?
options:
  - Within 30 days
  - Within 10 days
  - Within 15 days
  - Within 60 days
key: A
explanation: Section 35.290(a) requires a licensee to notify the Commission of a felony or
  misdemeanor conviction within 30 days of the verdict or plea. Therefore, the correct timeframe is
  30 days. The 10‑day option is incorrect because the rule does not set a shorter deadline.
