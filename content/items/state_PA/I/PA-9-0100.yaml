stem: The State Real Estate Commission wishes to require that all licensees complete a two-hour
  module on fair housing each renewal period. Under the Real Estate Licensing and Registration Act,
  what authority allows the commission to impose this requirement?
options:
  - The commission's duty to issue licenses
  - The commission's power to promulgate regulations
  - The commission's authority to examine applicants
  - The commission's duty to approve schools
key: B
explanation: Section 455.404 grants the commission the power to promulgate rules or regulations to
  administer the act, which includes establishing continuing education requirements. The duty to
  issue licenses (§455.401) pertains only to granting licenses, not creating rules.
