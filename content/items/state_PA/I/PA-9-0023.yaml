stem: After the Commission pays $4,000 from the Real Estate Recovery Fund to settle a claim against
  a licensee, what interest rate must the licensee pay on the amount owed to be eligible for
  reinstatement?
options:
  - 9% per year
  - 7% per year
  - 12% per year
  - 10% per year
key: D
explanation: Subsection (f)(2) states that a licensee may be reinstated only after repaying the
  amount paid from the fund plus interest at the rate of 10% a year; the 6% rate applies to unpaid
  claims awaiting fund reimbursement, while 5% and 8% are not specified in the rule.
