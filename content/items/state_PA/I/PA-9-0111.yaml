stem: A licensee holds a reciprocal license issued by the Pennsylvania State Real Estate Commission
  under a reciprocity agreement with another state. Which of the following is true regarding
  examination requirements for this licensee?
options:
  - The licensee must pass the Pennsylvania real estate examination before practicing
  - The licensee is exempt from taking and passing the examination required for a standard license
  - The licensee must complete additional continuing education hours each year
  - The licensee must retake the examination every four years to maintain the reciprocal license
key: B
explanation: The statute expressly provides that a person holding a reciprocal license shall be
  exempt from taking and passing the examination required for standard licenses. The other options
  impose examination or education requirements not imposed on reciprocal licensees.
