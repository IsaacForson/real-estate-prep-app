stem: An aggrieved person obtains a final judgment of $25,000 against a licensee for fraud in a real
  estate transaction. What is the maximum amount the Real Estate Recovery Fund may pay toward this
  judgment?
options:
  - $10,000
  - $15,000
  - $20,000
  - $25,000
key: C
explanation: Section 455.803(d) limits the fund’s liability to $20,000 for any one claim, regardless
  of the judgment size. Therefore, the fund cannot pay more than $20,000 toward the $25,000
  judgment.
citation:
  source: "### 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act) — Real Estate
    Licensing and Registration Act, Act of Feb. 19, 1980, P.L. 15, No. 9, as amended (63 P.S. §
    455.101 et seq.), official Pennsylvania General Assembly PDF read via Internet Archive capture
    of 2025-01-14 because legis.state.pa.us/palegis.us refuse connections from this network; section
    headings annotated with 63 P.S. numbers — § 455.803"
  url: null
  quoted_text: Notwithstanding any other provisions of this section, the liability of that portion of
    the fund allocated for the purpose of this act shall not exceed $20,000 for any one claim and
    shall not exceed $100,000 per licensee.
