stem: Under § 455.605(b) of the Real Estate Licensing and Registration Act, which of the following
  interests IS considered "promotional real estate"?
options:
  - An interest in land comprising twenty acres divided into four parcels
  - An interest in a common promotional plan involving forty lots
  - An interest in a common promotional plan involving fifty-five lots
  - An interest in a cemetery lot offered for sale
key: C
explanation: The statute defines promotional real estate as an interest in a common promotional
  plan, but expressly excludes interests involving fewer than fifty lots, cemetery lots, and land
  involving fewer than twenty‑five acres. Therefore, an interest in fifty‑five lots meets the
  definition and is considered promotional real estate. The other options describe interests that
  are expressly excluded by the exemption.
