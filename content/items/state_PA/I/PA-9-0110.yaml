stem: A Pennsylvania broker moves her office from the location listed on her license to a new
  address. What must she do within ten days of the move to remain compliant with the Real Estate
  Licensing and Registration Act?
options:
  - Notify the commission in writing of the new office location and pay the required fee
  - Submit a written request to keep the old office open and pay a relocation fee
  - Continue operating at the old address while posting a notice of the move
  - Apply to the commission for a new license at the new address and pay the required fee
key: A
explanation: The law states that upon removal of a broker's office, all licensees at that location
  must apply to the commission within ten days, designate the new location, and pay the required
  fees. The other options either omit the notice requirement or add unauthorized actions.
citation:
  source: 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act) — Real Estate
    Licensing and Registration Act, Act of Feb. 19, 1980, P.L. 15, No. 9); 49 Pa. Code ch. 35 (State
    Real Estate Commission)) § 455.601(a)
  url: null
  quoted_text: In case of removal of a broker's office from the designated location, all licensees
    registered at that location shall make application to the commission before such removal or
    within ten days thereafter, designating the new location of the office, and shall pay the
    required fees, whereupon the commission shall issue a current license at the new location for
    the unexpired period, if the new location complies with the terms of this act.
