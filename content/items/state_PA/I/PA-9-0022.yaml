stem: A consumer obtains a $35,000 judgment against a Pennsylvania real estate licensee for fraud in
  a transaction. What is the maximum amount the Real Estate Recovery Fund can pay toward this
  judgment under the Recovery Fund provisions?
options:
  - $35000
  - $25000
  - $100000
  - $20000
key: D
explanation: Under 63 P.S. § 455.803, the fund may pay no more than $20,000 for any one claim and no
  more than $100,000 per licensee. Because the judgment exceeds the per‑claim limit, the most the
  fund can contribute is $20,000.
