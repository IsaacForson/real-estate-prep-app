stem: A licensee wants to represent both the buyer and the seller in the same transaction as a dual
  agent. Beyond written consent of both parties, what must that consent specifically include?
options:
  - A written appraisal of the property's current value
  - A notarized statement signed by each party's attorney
  - A copy of the licensee's continuing education transcript
  - A statement of the terms of the licensee's compensation
key: D
explanation: Section 606.4(a) requires that dual agency consent, given following the initial
  interview disclosures, must include a statement of the terms of compensation.
citation:
  source: 63 P.S. § 455.606d
  url: null
  quoted_text: A licensee may act as a dual agent only with the written consent of both parties to the
    transaction following the disclosures given at the initial interview required by section 608.
    The consent must include a statement of the terms of compensation.
