stem: A licensee represents both the buyer and the seller in a residential transaction but has not
  obtained written consent from either party. Which prohibited act under § 455.604 does this
  behavior constitute?
options:
  - Acting for more than one party in a transaction without the knowledge and consent in writing of
    all parties
  - Failing to disclose to an owner in writing his intention to acquire an interest in property
    listed with his office
  - Accepting a commission from a person other than the licensed broker with whom he is affiliated
  - Failing to preserve records relating to a real estate transaction for three years
key: A
explanation: "The licensee is acting for both buyer and seller without the required written consent,
  which is prohibited by § 455.604(7). The other options describe different violations:
  self‑disclosure interest (§ 455.604(13)), unauthorized commission acceptance (§ 455.604(12)), and
  record‑keeping failure (§ 455.604(6))."
