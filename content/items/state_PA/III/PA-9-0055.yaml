stem: A licensee agrees to represent both the buyer and the seller in the same residential
  transaction but has not obtained any written consent from either party. To comply with §
  455.604(7), what must the licensee do before proceeding?
options:
  - Obtaining written consent from both the buyer and the seller before engaging in any agency
    activities for the transaction
  - Disclosing the dual agency relationship orally to both parties before showing any property and
    obtaining their acknowledgment
  - Referring the buyer to another licensee within the same firm to avoid a conflict of interest
  - Continuing to represent both parties if they later agree verbally to the arrangement without any
    written documentation
key: A
explanation: Section 455.604(7) requires written consent from all parties before a licensee may act
  for more than one party in a transaction. Obtaining written consent from both buyer and seller
  satisfies this requirement. Oral disclosure or later verbal agreement does not meet the written
  consent standard, and referring the buyer avoids dual agency rather than addressing the consent
  requirement.
