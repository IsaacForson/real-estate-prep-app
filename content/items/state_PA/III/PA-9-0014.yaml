stem: A seller's property is already listed, and a rival agent brings a competing offer through a
  separate buyer. Under the seller's agent's duty to seek buyers, when is that agent excused from
  seeking more offers?
options:
  - Whenever the seller requests a short pause in marketing activity
  - While the property is subject to an existing sale agreement
  - Whenever no open house has yet been scheduled
  - Whenever the listing has run for over ninety days total
key: B
explanation: Section 606.2 requires a continuous and good faith effort to find a buyer, but excuses
  the seller's broker from seeking additional offers while the property is already subject to an
  existing agreement for sale.
