stem: Under the initial interview disclosure required by the act, what must a licensee tell a
  prospective buyer or seller about when an agency relationship arises?
options:
  - It is presumed automatically once a property is shown
  - It begins the moment a listing agreement is signed
  - It exists under a written agreement the consumer acknowledges
  - It requires prior written approval from the state real estate commission
key: C
explanation: Section 608(a)(2) requires the initial interview disclosure to state that an agency
  relationship is not to be presumed and exists only as set forth in a written agreement
  acknowledged by the consumer.
citation:
  source: 63 P.S. § 455.608
  url: null
  quoted_text: A statement informing sellers and buyers of their option to have an agency relationship
    with a broker, that an agency relationship is not to be presumed and that it will exist only as
    set forth in a written agreement between the broker and consumer of real estate service
    acknowledged by the consumer.
