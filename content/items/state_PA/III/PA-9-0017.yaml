stem: A transaction licensee is working with a buyer whose written offer is below the seller's
  asking price. The seller privately tells the licensee that the seller would accept less than that
  price. What must the licensee do with this information?
options:
  - Withhold it from the buyer under limited confidentiality
  - Share it right away with the buyer to speed things up
  - Post it publicly online to attract other competing offers
  - Report it to the commission before proceeding further
key: A
explanation: Section 606.6 prohibits a transaction licensee from disclosing that a seller will
  accept a price less than the asking or listed price, which is part of the licensee's duty of
  limited confidentiality.
citation:
  source: 63 P.S. § 455.606f
  url: null
  quoted_text: A licensee shall not disclose information that the seller will accept a price less than
    the asking price or listed price, that the buyer will pay a price greater than the price
    submitted in a written offer or that a seller or buyer will agree to financing terms other than
    those offered.
