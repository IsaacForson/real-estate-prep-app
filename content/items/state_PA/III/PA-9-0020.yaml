stem: "A seller's agent compensates two cooperating brokers on one transaction: a subagent and a
  separate buyer's agent. How do their duties toward the seller compare under the rules governing a
  seller's agent?"
options:
  - Both cooperating brokers owe the seller identical duties in every possible way
  - Neither cooperating broker owes the seller/landlord any duty
  - The buyer's agent owes far greater duties than the subagent does
  - The subagent shares the seller's agent duties, unlike the buyer's agent
key: D
explanation: Section 35.312(c)-(d) explains that a subagent has the same duties and obligations to
  the seller/landlord as the seller's agent, while a buyer's agent or transaction licensee
  compensated by the seller's agent does not share those same duties.
