stem: What must a buyer's broker disclose at the first contact with the listing broker when acting
  as an agent for the buyer?
options:
  - Disclose that the broker has been engaged as a buyer's agent.
  - Disclose that the broker has a written agreement with the buyer.
  - Disclose that the broker is also representing the seller in the transaction.
  - Disclose that the broker will receive a commission from the seller.
key: A
explanation: Under § 455.606c(3), a buyer's broker must disclose at first contact that they have
  been engaged as a buyer's agent. The distractor about also representing the seller is incorrect
  because the duty is limited to disclosing the buyer's agency relationship unless the broker is
  actually acting as a dual agent.
