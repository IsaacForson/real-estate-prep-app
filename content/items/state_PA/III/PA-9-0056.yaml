stem: A licensee who is interested in purchasing a property that is listed with his office for sale
  decides to make an offer on the property without informing the owner in writing of his intention.
  Which prohibited act under § 455.604 does this behavior constitute?
options:
  - Failing to disclose to an owner in writing his intention or true position if he directly or
    indirectly through a third party purchased for himself or acquires or intends to acquire any
    interest in or any option to purchase property which has been listed with his office to sell or
    lease
  - Accepting a commission or any valuable consideration by a salesperson or associate broker for
    the performance of any acts specified in this act, from any person, except the licensed real
    estate broker with whom he is affiliated, even if the payment is disclosed to the client.
  - Making any substantial misrepresentation about the property's condition or value to induce a
    purchase, including false statements about square footage, zoning, or pending litigation.
  - Failing to preserve for three years following its consummation records relating to any real
    estate transaction, including contracts, closing statements, and correspondence, as required by
    the Real Estate Licensing and Registration Act.
key: A
explanation: Subsection 455.604(13) prohibits a licensee from failing to disclose in writing his
  intention or true position when he acquires or intends to acquire an interest in property listed
  with his office. The scenario describes exactly this omission. The other options describe
  prohibitions concerning record preservation, commission acceptance, and property
  misrepresentation, which are unrelated to the undisclosed personal interest scenario.
