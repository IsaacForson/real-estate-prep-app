stem: When a licensee gives the required oral disclosure at an initial interview that does **NOT**
  occur in person, what does the licensee tell the consumer about information shared before the
  written notice is given?
options:
  - It gets forwarded to the state real estate commission within ten days
  - It becomes confidential once a property is shown
  - It is confidential automatically under any circumstance
  - It is not confidential unless a business relationship begins
key: D
explanation: Section 35.339's required oral disclosure states that information given before the
  written consumer notice is not considered confidential unless and until the consumer and licensee
  enter into a business relationship.
citation:
  source: 49 Pa. Code § 35.339
  url: null
  quoted_text: SINCE WE ARE DISCUSSING REAL ESTATE WITHOUT YOU HAVING THE BENEFIT OF THE CONSUMER
    NOTICE, I HAVE THE DUTY TO ADVISE YOU THAT ANY INFORMATION YOU GIVE ME AT THIS TIME IS NOT
    CONSIDERED TO BE CONFIDENTIAL, AND ANY INFORMATION YOU GIVE ME WILL NOT BE CONSIDERED
    CONFIDENTIAL UNLESS AND UNTIL YOU AND I ENTER INTO A BUSINESS RELATIONSHIP.
