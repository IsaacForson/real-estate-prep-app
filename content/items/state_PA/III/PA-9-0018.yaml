stem: A broker who already has a signed written agreement with a seller decides, mid-transaction, to
  newly designate a different licensee in the firm as the seller's designated agent. Before that
  designation takes effect, what must the broker obtain?
options:
  - A separate escrow account opened for that transaction
  - The principal's written consent to the new designation
  - Approval from every other licensee working at the firm office
  - A revised comparative market analysis for the listing
key: B
explanation: Section 35.315(b)(1) requires that when designation occurs after an initial designation
  or a written agreement is already in place, the broker must obtain the principal's written consent
  to the newly designated licensee.
citation:
  source: 49 Pa. Code § 35.315
  url: null
  quoted_text: Obtain the principal’s consent, in writing, to the newly designated licensee.
