stem: "According to § 455.604(13) of the Pennsylvania Real Estate Licensing and Registration Act, a
  licensee must disclose in writing to the property owner his intention to:"
options:
  - Terminate the listing agreement prior to the expiration date
  - Acquire an interest in or an option to purchase the property
  - Negotiate a lower commission rate with the property owner
  - Act as a dual agent without the written consent of all parties
key: B
explanation: "The statute requires a licensee to disclose in writing any intention to acquire an
  interest in or an option to purchase property listed with his office. The other options describe
  actions prohibited under different subsections: reducing price is not addressed, sharing
  confidential information relates to other duties, and accepting a commission from a third party is
  covered by § 455.604(12)."
