stem: A salesperson receives a commission directly from a buyer for facilitating a sale, while her
  employing broker is unaware of the payment. Which prohibited act under § 455.604 does this
  behavior constitute?
options:
  - Failing to provide a disclosure required by this act or any other Federal or State law imposing
    a disclosure obligation on licensees
  - Accepting a commission or any valuable consideration from any person except the licensed real
    estate broker with whom he is affiliated
  - Paying of a commission or any valuable consideration by a broker to anyone other than his
    licensed employees or another real estate broker
  - Inducing any party to a contract to break such contract for the purpose of substitution in lieu
    thereof of a new contract motivated by personal gain
key: B
explanation: The salesperson accepted a commission from someone other than her affiliated broker,
  which violates § 455.604(12). The other options describe prohibited broker payments (§
  455.604(12.1)), failure to make required disclosures (§ 455.604(15.1)), and inducing breach of
  contract for personal gain (§ 455.604(11)).
