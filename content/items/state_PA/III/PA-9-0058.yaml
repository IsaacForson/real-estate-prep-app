stem: What exact statement must a licensee read verbatim when providing the oral disclosure required
  under 49 Pa. Code § 35.339?
options:
  - THE REAL ESTATE LAW REQUIRES THAT I PROVIDE YOU WITH A WRITTEN CONSUMER NOTICE THAT DESCRIBES
    THE VARIOUS BUSINESS RELATIONSHIP CHOICES THAT YOU MAY HAVE WITH A REAL ESTATE LICENSEE. SINCE
    WE ARE DISCUSSING REAL ESTATE WITHOUT YOU HAVING THE BENEFIT OF THE CONSUMER NOTICE, I HAVE THE
    DUTY TO ADVISE YOU THAT ANY INFORMATION YOU GIVE ME AT THIS TIME IS NOT CONSIDERED TO BE
    CONFIDENTIAL, AND ANY INFORMATION YOU GIVE ME WILL NOT BE CONSIDERED CONFIDENTIAL UNLESS AND
    UNTIL YOU AND I ENTER INTO A BUSINESS RELATIONSHIP. AT OUR FIRST MEETING I WILL PROVIDE YOU WITH
    A WRITTEN CONSUMER NOTICE WHICH EXPLAINS THOSE BUSINESS RELATIONSHIPS AND MY CORRESPONDING
    DUTIES TO YOU.
  - THE REAL ESTATE LAW REQUIRES THAT I PROVIDE YOU WITH A VERBAL CONSUMER NOTICE THAT DESCRIBES THE
