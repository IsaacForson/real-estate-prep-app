key: A
explanation: Under 49 Pa. Code § 35.339, the licensee must read verbatim the statement that begins
  with 'THE REAL ESTATE LAW REQUIRES THAT I PROVIDE YOU WITH A WRITTEN CONSUMER NOTICE THAT
  DESCRIBES THE VARIOUS BUSINESS RELATIONSHIP CHOICES THAT YOU MAY HAVE WITH A REAL ESTATE
  LICENSEE.' and continues with the confidentiality language and the promise to provide the written
  notice at the first meeting. The option that contains exactly that wording is correct. The option
  that substitutes 'verbal' for 'written' in the first sentence is incorrect because it changes the
  required wording. The option that changes 'first' to 'second' meeting is incorrect because it
  alters the timing of the notice. The option that claims information is 'sometimes' considered
  confidential is incorrect because it contradicts the rule that information given before the notice
  is not confidential.
