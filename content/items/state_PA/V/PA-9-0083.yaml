stem: A seller is offering a newly constructed home that has never been occupied. The buyer has a
  two-year written warranty, the home passed a building-code inspection, and a certificate of
  occupancy was issued. Under the Pennsylvania Real Estate Seller Disclosure Law, is the seller
  required to provide a property disclosure statement to the buyer?
options:
  - The seller must provide a property disclosure statement
  - The seller is exempt from providing a property disclosure statement
  - The seller must provide the statement only if the buyer requests it
  - The seller must provide the statement after agreement
key: B
explanation: Section 7302(A)(2) exempts transfers of new residential construction that has not been
  previously occupied when the buyer has a one-year or longer warranty, the dwelling has been
  inspected for code compliance, and a certificate of occupancy has been issued. All three
  conditions are satisfied, so the seller is exempt. Distractor A incorrectly ignores this statutory
  exemption.
citation:
  source: 68 Pa.C.S. §§ 7301–7315 (Real Estate Seller Disclosure Law) — Pennsylvania Real Estate
    Seller Disclosure Law, 68 Pa.C.S. §§ 7301-7315 (as posted by the State Real Estate Commission) —
    § 7302
  url: null
  quoted_text: >-
    Transfers of new residential construction that has not been previously occupied when:

    (i) the buyer has received a one-year or longer written warranty covering such construction;

    (ii) the dwelling has been inspected for compliance with the applicable building code or, if
    there is no applicable code,

    for compliance with a nationally recognized model building code; and

    (iii) a certificate of occupancy or a certificate of code compliance has been issued for the
    dwelling
