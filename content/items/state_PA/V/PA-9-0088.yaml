stem: A broker receives an earnest money deposit from a buyer before closing. What must the broker
  do with the funds under Pennsylvania regulations?
options:
  - Release it to the seller immediately upon contract termination.
  - Deposit it into the broker's operating account.
  - Hold it in an escrow account until consummation or termination.
  - Invest it in an interest-bearing account for the buyer's benefit.
key: C
explanation: The rule requires that any money received by the broker on account of a sale be held in
  an escrow account pending consummation or prior termination. The distractor proposing to deposit
  the funds into the broker’s operating account violates this escrow requirement.
citation:
  source: 49 Pa. Code ch. 35 (State Real Estate Commission) — 49 Pa. Code Chapter 35 — State Real
    Estate Commission (Pennsylvania Code, changes effective through 56 Pa.B. 4026, July 4, 2026) — §
    35.333
  url: null
  quoted_text: A provision that payments of money received by the broker on account of the
    sale—regardless of the form of payment and the person designated as payee (if payment is made by
    an instrument)—shall be held by the broker in an escrow account pending consummation of the sale
    or a prior termination thereof.
