stem: Under the Pennsylvania Real Estate Seller Disclosure Law, what is the seller **NOT** required
  to do when completing a property disclosure statement?
options:
  - Investigate for hidden defects
  - Disclose known material defects
  - Sign and date the statement
  - Deliver the statement before agreement
key: A
explanation: Under 68 Pa.C.S. § 7308, the seller is not obligated to make any specific investigation
  or inquiry when completing the disclosure statement, so investigating for hidden defects is not
  required. The option stating that the seller must disclose known material defects is incorrect
  because the law requires sellers to disclose known material defects (see 68 Pa.C.S. §§ 7303 and
  7308).
