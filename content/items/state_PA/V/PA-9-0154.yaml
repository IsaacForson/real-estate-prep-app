stem: According to 49 Pa. Code § 35.335a, how is a material defect defined for purposes of the
  seller’s property disclosure statement?
options:
  - A problem with the property that would have a significant adverse impact on the value of the
    residential real property or that involves an unreasonable risk to people on the land
  - Any issue with the property that lowers its market value or creates a safety hazard for
    occupants, regardless of whether it is observable
  - A condition that affects the property’s structural integrity or habitability, even if it does
    not immediately affect the resale price
  - A defect that can be seen during a routine visual inspection of the property and therefore does
    not need to be disclosed on the statement
key: A
explanation: "The definition of material defect is explicitly stated in the rule: a problem with the
  property that would significantly affect value or pose an unreasonable risk to people. The other
  options either add unrelated criteria or misstate the scope of what must be disclosed."
citation:
  source: 49 Pa. Code ch. 35 (State Real Estate Commission) — 49 Pa. Code Chapter 35 — State Real
    Estate Commission (Pennsylvania Code, changes effective through 56 Pa.B. 4026, July 4, 2026) — §
    35.335a
  url: null
  quoted_text: A material defect is a problem with the property or any portion of it that would have a
    significant adverse impact on the value of the residential real property or that involves an
    unreasonable risk to people on the land.
