stem: A licensee is assisting an executor who is selling a house that was part of a decedent's
  estate. Under the Pennsylvania Real Estate Seller Disclosure Law, is the licensee required to
  provide a property disclosure statement to the buyer?
options:
  - The licensee must provide a property disclosure statement to the buyer.
  - The licensee is not required to provide a property disclosure statement because the transfer is
    exempt.
  - The licensee must provide a property disclosure statement only if the buyer requests it.
  - The licensee must provide a property disclosure statement unless the property is new
    construction.
key: B
explanation: Section 7302(A)(1) exempts transfers by a fiduciary in the course of administering a
  decedent's estate from the disclosure requirement, so no statement is needed. The distractor
  stating the licensee must provide a statement is incorrect because the exemption applies
  regardless of any buyer request.
