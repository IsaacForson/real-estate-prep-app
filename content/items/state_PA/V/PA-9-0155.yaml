stem: Under 49 Pa. Code § 35.371(b), how many days in advance must an applicant notify the
  Commission before holding a sales event or reception to promote out-of-state property?
options:
  - Fourteen days prior to the event.
  - Seven days prior to the event.
  - Five days prior to the event.
  - Ten days prior to the event.
key: D
explanation: Section 35.371(b) requires an applicant to notify the Commission at least 10 days in
  advance of the date, time and place of efforts to sell or advertise through parties or reception
  or other group media. Therefore, ten days prior to the event is the correct notice period. The
  distractor stating five days prior to the event is incorrect because it falls short of the minimum
  ten‑day notice mandated by the rule.
