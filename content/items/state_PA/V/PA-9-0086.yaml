stem: A rental listing referral agent in Pennsylvania collects a fee from a prospective tenant on
  August 3. Under 49 Pa. Code § 35.289, what is the latest date the agent may have verified the
  availability of the rental units?
options:
  - July 31
  - August 2
  - August 1
  - July 30
key: B
explanation: The rule states that verification must occur no more than 4 days prior to the
  fee‑collection date. Counting back four days from August 3 gives July 30 as the earliest
  permissible date; the latest permissible date is the day before collection, August 2.
