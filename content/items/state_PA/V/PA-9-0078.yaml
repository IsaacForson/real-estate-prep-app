stem: Under 49 Pa. Code § 35.371(a), what action is prohibited for a broker, developer, or
  salesperson when promoting the sale of out-of-state property?
options:
  - Provide an offering statement to each prospective purchaser
  - Submit a disclosure summary for time-share estates
  - Refer to the Pennsylvania State Real Estate Commission in advertising
  - Collect a fee before verifying rental availability
key: C
explanation: The rule explicitly forbids referring to the Commission or its employees in any
  selling, offering for sale, or advertising activity. The other options describe duties covered by
  different sections (rental verification, offering statements, time‑share disclosures) and are not
  prohibited by § 35.371(a).
