stem: A broker's print advertisement describes a free vacation prize offered to buyers but prints
  the prize's fair market value in extremely small type beneath a large photograph. This layout
  fails to meet which requirement?
options:
  - The advertisement must be reviewed and approved by the commission first
  - The value statement must match the prize description's type size
  - The advertisement must run in a licensed publication
  - The advertisement must name the manufacturer of the prize
key: B
explanation: Section 35.306(a)(4) requires that, in a print advertisement offering a prize, the
  statement of the prize's fair market value be in the same size type as the description of the
  prize.
