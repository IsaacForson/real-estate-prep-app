stem: A broker holds earnest money in escrow for eight months and places it in an interest-bearing
  account. According to 49 Pa. Code § 35.325(c), how must the interest earned be treated unless the
  parties agree otherwise?
options:
  - The interest must be transferred to the State Real Estate Commission
  - The interest must be held and disbursed pro rata like the principal
  - The interest must be donated to a charitable organization
  - The broker may keep the interest as compensation
key: B
explanation: The rule provides that interest earned on an escrow account shall be held and disbursed
  pro rata in the same manner as the principal amount, unless the parties direct otherwise.
  Therefore, the interest must be distributed pro rata like the principal. The distractor suggesting
  the broker may keep the interest is incorrect except when the broker is a lessor under the
  Landlord and Tenant Act, which is not indicated here.
