stem: A licensee sends a mail advertisement offering a free weekend getaway as a prize to
  prospective buyers but does not include the odds of winning the prize. This omission violates
  which requirement under 63 P.S. § 455.604(a)(18)(i)?
options:
  - The offering must include a statement of the odds of receiving any such prize.
  - The offering must include a statement of the fair market value of the prize.
  - The offering must include a statement of the suggested retail price of the prize.
  - The offering must include a statement of the name of the company providing the prize.
key: A
explanation: The rule requires that any offering by mail or telephone of a prize in connection with
  the sale of real property be accompanied by a statement of the fair market value of the prize plus
  a statement of the odds of receiving any such prize. Omitting the odds statement violates this
  requirement, even if the fair market value is disclosed. The other options describe items that are
  either already required (fair market value) or not required by the rule (suggested retail price,
  name of the company providing the prize).
citation:
  source: 63 P.S. § 455.604(a)(18)(i)
  url: null
  quoted_text: Any offering by mail or by telephone of any prize, gift, award or bonus in relation to
    the offering of sale of real property, including time sharing, shall be accompanied by a
    statement of the fair market value, not suggested retail price, of all prizes offered, plus a
    statement of the odds of receiving any such prize.
