stem: A rental listing referral agent publishes information about a rental property on its website
  after the landlord explicitly told the agent not to include that property in any lists. Which rule
  does this violate?
options:
  - The requirement to obtain written consent before advertising any property from the lessor.
  - The prohibition against publishing information when the lessor expressly states the property is
    not to be included.
  - The requirement to disclose the agent's licensure in all advertisements to the public.
  - The obligation to include a fair market value statement for any prize offered in the listing.
key: B
explanation: "Under 49 Pa. Code § 35.301(b), a rental listing referral agent may not publish
  information about a rental property if the lessor or property manager expressly states that the
  property is not to be included in the agent’s lists. The other choices refer to different
  requirements: a licensure disclosure is required by advertising rules, written consent is
  addressed in § 35.301(a), and a fair‑market‑value statement applies only to prize offerings, not
  to rental listings."
