stem: A licensee who owns a residential property decides to list it for sale. Before accepting an
  offer from a buyer, what must the licensee do?
options:
  - Provide a written property condition report to the buyer
  - Disclose ownership interest in writing to all parties
  - Submit the buyer's loan pre-approval to the lender
  - File a disclosure statement with the County Recorder's Office
key: B
explanation: Under § 35.283(a), a licensee may not participate in a transaction involving property
  in which they have an ownership interest unless they first disclose that interest in writing to
  all parties. Thus, the licensee must disclose the ownership interest before proceeding. The
  distractor about obtaining an appraisal is unrelated to this disclosure requirement.
