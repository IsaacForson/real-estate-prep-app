stem: A buyer and seller both claim entitlement to a deposit a broker holds in escrow, and
  settlement talks have stalled with no resolution in sight. After giving the required notice, what
  may the broker do next?
options:
  - Release the funds to whichever party signs first
  - Split the disputed deposit evenly between the parties
  - Transfer the deposit into the listing broker's account
  - Petition the county court to interplead the claimants
key: D
explanation: Section 35.327 provides that if resolution of an escrow dispute appears remote without
  legal action, the broker may, after thirty days' notice to the parties, petition the county court
  to interplead the rival claimants.
citation:
  source: 49 Pa. Code § 35.327
  url: null
  quoted_text: If resolution of the dispute appears remote without legal action, the broker may,
    following 30 days’ notice to the parties, petition the county court having jurisdiction in the
    matter to interplead the rival claimants.
