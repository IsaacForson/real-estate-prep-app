stem: A licensee advertises his own condominium for sale on a website but does not disclose that he
  is a real estate licensee. The property is not listed with any real estate company. Which
  statement is correct regarding this advertisement?
options:
  - The advertisement complies with the law because the licensee is not acting as an agent.
  - The advertisement violates the requirement to disclose licensure when selling own real estate.
  - The advertisement is permissible if the licensee includes his broker's name in the same font
    size.
  - The advertisement is allowed because the licensee is selling personal property, not real estate.
key: B
explanation: The rule requires a licensee selling his own real estate to disclose his licensure in
  advertisements unless the property is listed with a real estate company. Since the condo is not
  listed and no disclosure is made, the advertisement violates the rule. The distractor about
  including the broker's name in the same font size pertains to a different rule (35.305) and does
  not cure the disclosure failure.
citation:
  source: 49 Pa. Code § 35.304
  url: null
  quoted_text: A licensee who sells or leases his own real estate shall disclose that he is a real
    estate licensee in advertisements for the property. This requirement does not apply if the
    property is listed with a real estate company.
