stem: A broker who is a sole proprietor wants to allow an employee to handle escrow funds. Which
  action is permissible?
options:
  - Give a licensed employee written authority to withdraw funds for proper charges
  - Give any employee written authority to withdraw funds for any purpose
  - Give an employee written authority to deposit money into the escrow account and withdraw funds
    for service charges
  - Give an employee written authority to deposit money into the escrow account and withdraw funds
    for personal use
key: A
explanation: Under 49 Pa. Code § 35.325, a sole proprietor broker may give any employee written
  authority to deposit money into an escrow account, but may give only a licensed employee written
  authority to withdraw funds, and only for payments that are properly chargeable to the account.
  Giving a licensed employee written authority to withdraw funds for proper charges follows this
  rule. Giving any employee written authority to withdraw funds for any purpose is incorrect because
  it allows withdrawal by unlicensed employees and for improper purposes. Giving an employee written
  authority to deposit money into the escrow account and withdraw funds for service charges is
  incorrect because it permits withdrawal by any employee and does not limit withdrawals to properly
  chargeable payments. Giving an employee written authority to deposit money into the escrow account
  and withdraw funds for personal use is incorrect because it allows withdrawal for personal use,
  which is not a properly chargeable payment.
citation:
  source: 49 Pa. Code ch. 35 (State Real Estate Commission) — 49 Pa. Code Chapter 35 — State Real
