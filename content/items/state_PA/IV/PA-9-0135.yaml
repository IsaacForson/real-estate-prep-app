stem: A licensee tells a prospective buyer that the roof of a home was replaced last year when, in
  fact, it is 20 years old and has never been replaced. Under 63 P.S. § 455.604(a)(1), this conduct
  constitutes which prohibited act?
options:
  - Engaging in any false promise regarding the property
  - Engaging in any substantial misrepresentation
  - Engaging in a continued course of misrepresentation
  - Engaging in any misleading or untruthful advertising
key: B
explanation: The statute defines making any substantial misrepresentation as a prohibited act. The
  licensee's false statement about the roof is a substantial misrepresentation of an existing fact.
  The distractor about a false promise is incorrect because the rule distinguishes false promises
  from misrepresentations of fact.
