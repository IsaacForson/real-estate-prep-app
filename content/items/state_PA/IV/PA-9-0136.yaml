stem: A licensee lists his own home for sale with a real estate brokerage and advertises it in a
  newspaper. Under 49 Pa. Code § 35.304, is the licensee required to disclose his licensure in the
  advertisement?
options:
  - The licensee must disclose his licensure because he is the owner
  - The licensee must disclose his licensure unless the advertisement is online
  - The licensee need not disclose his licensure because the property is listed with a real estate
    company
  - The licensee need not disclose his licensure unless the property is owner-occupied
key: C
explanation: The rule requires disclosure of licensure when advertising one's own real estate, but
  exempts properties listed with a real estate company. Since the home is listed with a brokerage,
  disclosure is not required. The distractor claiming disclosure is required because the licensee is
  the owner ignores the listing exemption.
citation:
  source: 49 Pa. Code §35.304
  url: null
  quoted_text: A licensee who sells or leases his own real estate shall disclose that he is a real
    estate licensee in advertisements for the property. This requirement does not apply if the
    property is listed with a real estate company.
