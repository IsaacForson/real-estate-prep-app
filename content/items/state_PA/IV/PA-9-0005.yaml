stem: A salesperson notices an unlisted property and begins advertising it for sale online without
  contacting the owner. This solicitation violates the conduct rules because it lacked which of the
  following?
options:
  - A signed comparative market analysis form
  - Approval from a competing brokerage firm
  - The authority of the seller or the seller's agent
  - A notarized copy of the recorded property deed on file
key: C
explanation: Section 35.301(a) prohibits a licensee from advertising the sale or lease of real
  estate, or soliciting prospective buyers, without the authority of the seller or lessor or the
  agent of the seller or lessor.
