stem: A broker receives an earnest money check from a buyer on Monday morning in the office where
  escrow records are kept. By when must the broker deposit that check into escrow, absent the
  exception for holding an offer?
options:
  - By the end of the next business day after receipt
  - Within thirty calendar days of receiving the check
  - By the end of that very same Monday afternoon
  - By the end of the following calendar week
key: A
explanation: Section 35.324(a) requires a broker to deposit money belonging to another into an
  escrow account by the end of the next business day following its receipt in the office where
  escrow records are kept.
