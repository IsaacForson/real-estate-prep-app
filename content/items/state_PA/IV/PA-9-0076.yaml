stem: A broker’s license is suspended by the Commission on March 3. The broker fails to post the
  notice provided by the Commission. What is the consequence under 49 Pa. Code §35.291?
options:
  - The broker must retake the licensing exam
  - The broker may be subject to further disciplinary action
  - The broker’s license is automatically revoked
  - The broker must pay a fine of $500
key: B
explanation: Under 49 Pa. Code §35.291, failure to post the notice of suspension constitutes grounds
  for further disciplinary action by the Commission. The other options describe penalties not
  specified in the rule.
