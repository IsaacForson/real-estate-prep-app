stem: A licensee closed a residential sale on March 10, 2022, and destroyed all related files on
  February 28, 2025. According to 63 P.S. § 455.604(a)(6), this conduct constitutes which prohibited
  act?
options:
  - Making a substantial misrepresentation of property condition
  - Failing to preserve records for three years after closing
  - Accepting a commission from someone other than the broker
  - Placing a for sale sign without the owner's written consent
key: B
explanation: The rule prohibits failing to preserve records for three years following the
  consummation of a real estate transaction. The licensee destroyed the files before the three‑year
  period elapsed, violating this requirement. The distractor about misrepresentation is incorrect
  because the scenario involves record retention, not a false statement about the property.
