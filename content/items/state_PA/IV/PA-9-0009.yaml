stem: A broker deposits personal funds into the escrow account solely to cover a monthly service
  charge the bank assesses against that account. Under the escrow rules, this deposit is best
  described as which of the following?
options:
  - A permitted exception requiring prior court approval
  - A prohibited act of commingling the broker's personal funds
  - A permitted exception for covering a bank service charge
  - A prohibited act of misappropriating the client's funds
key: C
explanation: Section 35.326 generally bars commingling personal funds with escrowed money, but
  expressly permits a broker to deposit personal funds to cover service charges assessed against the
  escrow account by the bank.
citation:
  source: 49 Pa. Code § 35.326
  url: null
  quoted_text: Except as provided in subsection (b), a broker may not commingle money that is required
    to be held in escrow—or interest earned on an escrow account—with business, personal or other
    funds.
