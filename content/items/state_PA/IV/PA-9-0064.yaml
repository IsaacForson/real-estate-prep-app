stem: A salesperson receives a $75 gift card from a buyer as a thank‑you after closing a residential
  sale. The salesperson did not inform the broker. According to 63 P.S. § 455.604(a)(12), how should
  this action be classified?
options:
  - The salesperson's acceptance of the gift card is permissible because it is a nominal gift under
    $100.
  - The salesperson's acceptance of the gift card is permissible because the salesperson disclosed
    it to the buyer.
  - The salesperson's acceptance of the gift card is prohibited because it is valuable consideration
    received from a person other than the broker.
  - The salesperson's acceptance of the gift card is permissible because the buyer is not a licensed
    real estate broker.
key: C
explanation: The rule forbids a salesperson from receiving any valuable consideration for performing
  licensed acts from anyone other than the affiliated broker. The gift card constitutes valuable
  consideration from the buyer, so accepting it is prohibited regardless of its value or whether the
  salesperson told the buyer. Claims that the gift is allowed because the buyer is not a broker,
  because it is under $100, or because the salesperson disclosed it to the buyer are all contrary to
  the provision.
