stem: According to 49 Pa. Code § 35.306(a)(4), what must be included in an advertisement by a
  licensee that offers a prize, certificate, gift, or lot?
options:
  - The description of each prize offered
  - The fair market value of each prize offered
  - The prerequisites for receiving each prize offered
  - The limitation on the number of prizes offered
key: B
explanation: An advertisement must state the fair market value of each prize, certificate, gift, or
  lot offered. 49 Pa. Code § 35.306(a)(4) specifically requires the fair market value to be
  disclosed, while other elements such as a description, prerequisites, or limits are addressed in
  different subsections and are not required here.
