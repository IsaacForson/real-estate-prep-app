stem: According to 63 P.S. § 455.604(a)(13), a licensee who intends to acquire an interest in a
  property listed with his office must disclose that intention in writing to whom?
options:
  - The owner
  - The commission
  - The buyer
  - The broker
key: A
explanation: The statute requires the licensee to disclose in writing to the owner any intention to
  acquire an interest in a property listed with his office. The buyer is not the party to whom this
  disclosure is owed, nor is the broker or the commission.
citation:
  source: 63 P.S. § 455.604(a)(13)
  url: null
  quoted_text: (13) Failing to disclose to an owner in writing his intention or true position if he
    directly or indirectly through a third party, purchased for himself or acquires or intends to
    acquire any interest in or any option to purchase property which has been listed with his office
    to sell or lease.
