stem: A licensee's newspaper advertisement offers a free gift certificate to prospective buyers but
  prints the odds of winning in smaller font at the bottom of the ad. Which requirement under 49 Pa.
  Code § 35.306(a)(5) is violated?
options:
  - The odds statement must be placed in a separate section of the advertisement
  - The odds statement must be omitted when the prize is free
  - The odds statement must match the description's type size and be adjacent
  - The odds statement must be printed in larger type than the description
key: C
explanation: 49 Pa. Code § 35.306(a)(5) requires that the statement of odds be the same size type as
  the description of the prize and appear immediately adjacent to it. The option suggesting the odds
  must be printed in larger type is incorrect because the rule mandates equal size, not larger size.
