stem: A Pennsylvania licensee pleads guilty to a misdemeanor on March 10. By what date must the
  licensee notify the Commission under 49 Pa. Code §35.290?
options:
  - April 8
  - April 9
  - April 10
  - April 11
key: B
explanation: The rule requires notification within 30 days of the plea. Counting 30 days from March
  10 lands on April 9, so that is the deadline. April 8 is one day early and would not satisfy the
  30‑day requirement.
