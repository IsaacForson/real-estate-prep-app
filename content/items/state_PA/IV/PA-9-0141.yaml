stem: A broker's license is suspended on May 5. What must the broker do with the license itself
  under 49 Pa. Code §35.291?
options:
  - Destroy it after 30 days.
  - Return it to the Commission.
  - Post it at the main office only.
  - Keep it on file at the branch office.
key: B
explanation: The regulation requires a broker whose license is suspended to return the license to
  the Commission and to post a notice of the suspension at the main office and at any branch
  offices. Returning the license to the Commission satisfies that requirement; the other actions are
  not mandated by 49 Pa. Code § 35.291.
