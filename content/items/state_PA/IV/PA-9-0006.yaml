stem: A salesperson runs a newspaper advertisement that lists her own name and phone number in large
  bold type, with the employing broker's name printed in tiny type below. Which requirement does
  this advertisement fail to meet?
options:
  - The advertisement must state the salesperson's license number
  - The advertisement must be filed with the commission first
  - The advertisement must list the broker's home address
  - The broker's name and number must match her own in size
key: D
explanation: Section 35.305(c) requires that an advertisement by a salesperson contain the employing
  broker's business name and telephone number, with the names and telephone numbers displayed in
  equal size.
citation:
  source: 49 Pa. Code § 35.305
  url: null
  quoted_text: An advertisement by an associate broker, salesperson, cemetery associate broker or
    cemetery salesperson shall contain the business name and telephone number of the employing
    broker. The names and telephone numbers shall be of equal size.
