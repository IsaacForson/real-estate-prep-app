stem: Under Pennsylvania regulations, a licensee is prohibited from giving which of the following?
options:
  - Advice that is correct and based on verified information
  - Advice the licensee believes to be accurate but is actually incorrect
  - Advice he knows or should know is incorrect, inaccurate or improbable
  - Advice that is merely an opinion about market conditions
key: C
explanation: "The rule prohibits a licensee from giving assurances or advice about a real estate
  transaction that the licensee knows, or reasonably should be expected to know, is incorrect,
  inaccurate, or improbable. The correct choice states that a licensee may not give advice he knows
  or should know is incorrect, inaccurate or improbable, which matches the rule. The other choices
  describe situations that are not prohibited: giving correct advice based on verified information
  is allowed; giving advice the licensee believes to be accurate but is actually incorrect is not
  prohibited because the standard is what the licensee knows or should know, not mere belief; and
  giving mere opinion about market conditions is not covered by this prohibition."
citation:
