stem: A licensee receives notice on July 15 that the real estate licensing authority of another
  state has taken disciplinary action against them. By what date must the licensee notify the
  Pennsylvania Commission under 49 Pa. Code §35.290?
options:
  - July 30
  - August 14
  - August 13
  - August 15
key: B
explanation: Under 49 Pa. Code §35.290(b), a licensee must notify the Commission of disciplinary
  action from another jurisdiction within 30 days of receiving notice. Adding 30 days to July 15
  yields August 14. The other dates result from miscalculating the 30‑day period.
