stem: Under 49 Pa. Code § 35.304, a licensee who sells or leases his own real estate must do which
  of the following when advertising the property?
options:
  - Disclose that he is a real estate licensee in advertisements for the property.
  - Disclose that he is a real estate licensee only if the buyer asks.
  - Disclose that he is a real estate licensee only if the property is not listed with a broker.
  - Disclose that he is a real estate licensee in the contract but not in advertisements.
key: A
explanation: Under 49 Pa. Code § 35.304, a licensee who sells or leases his own real estate must
  disclose that he is a real estate licensee in advertisements for the property, unless the property
  is listed with a real estate company. Therefore, the licensee must make the disclosure in the
  advertisements themselves. The other options incorrectly limit the disclosure to certain
  conditions or locations not permitted by the rule.
