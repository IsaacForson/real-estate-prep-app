stem: A broker uses escrow funds to pay a personal credit card bill. Which rule does this violate?
options:
  - The requirement to maintain the escrow account in an insured depository
  - The prohibition against commingling escrow funds with personal funds
  - The prohibition against misappropriating escrow funds for personal purposes
  - The requirement to provide escrow records upon request
key: C
explanation: Section 35.326(c) prohibits a broker from misappropriating escrow funds—or interest
  earned on them—for business, personal, or other purposes. Using escrow funds to pay a personal
  credit card bill is a direct misappropriation. The distractor about commingling is incorrect
  because the funds are not merely mixed with personal funds; they are used for a personal expense,
  which is misappropriation.
