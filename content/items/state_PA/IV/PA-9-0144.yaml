stem: A broker advertises that she is the '#1 agent in luxury home sales' but does not mention any
  municipality. Which requirement under 49 Pa. Code § 35.307(b) does this advertisement fail to
  meet?
options:
  - The advertisement must identify the municipality that the market comprises
  - The advertisement must refer only to closed transactions
  - The advertisement must refer only to offices with branch office licenses
  - The advertisement must include the broker's license number
key: A
explanation: Section 35.307(b) requires that any advertisement about a broker’s production or market
  position must identify the municipality that the market comprises. Because the ad omits the
  municipality, it does not satisfy that requirement. The choice stating that the advertisement must
  identify the municipality that the market comprises is therefore correct. The choice stating that
  the advertisement must refer only to closed transactions is incorrect because that rule applies to
  a different subsection dealing with sales‑volume advertisements.
