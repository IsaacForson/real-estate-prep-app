stem: Under the Real Estate Licensing and Registration Act, what is the status of a valid license
  issued under the 1929 Real Estate Brokers License Act prior to the effective date of the 1980 Act?
options:
  - It remains valid only until the end of the current licensing period.
  - It must be reissued after passing a new licensing examination.
  - It is automatically void and requires a new application.
  - It continues with full force and validity and is renewable without examination.
key: D
explanation: The statute provides that any license issued under the 1929 Act that was valid when the
  1980 Act became effective continues with full force and validity for the period for which it was
  originally issued, and the commission renews it for each subsequent period without requiring a new
  licensing examination. Therefore, the choice stating the license remains valid only until the end
  of the current licensing period is incorrect because renewal is allowed beyond that period. The
  correct answer reflects the automatic continuation and renewal without examination.
citation:
  source: 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act) § 455.901
  url: null
  quoted_text: "All valid licenses issued prior to the effective date of this act under the provisions
    of said 1929 act shall continue with full force and validity during the period for which issued.
    For the subsequent license period, and each license period thereafter, the commission shall
    renew such licenses without requiring any license examination to be taken:"
