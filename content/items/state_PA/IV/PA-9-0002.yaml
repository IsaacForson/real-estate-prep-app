stem: When a broker receives money belonging to another party to a real estate transaction, into
  what type of account must that money be deposited pending consummation?
options:
  - A personal savings account held by the salesperson
  - The buyer's existing personal checking account
  - The broker's own general business operating account
  - An escrow account at an insured depository
key: D
explanation: Section 35.321(a) requires a broker to deposit money received on behalf of another into
  an escrow account at a Federally or State-insured bank or depository pending consummation of the
  transaction.
citation:
  source: 49 Pa. Code § 35.321
  url: null
  quoted_text: a broker shall deposit money that the broker receives belonging to another into an
    escrow account in a Federally or State-insured bank or depository to be held pending
    consummation of the transaction or a prior termination thereof that does not involve a dispute
