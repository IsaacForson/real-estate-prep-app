stem: A broker receives an earnest money check from a buyer and deposits it into the escrow account.
  According to § 35.328, which of the following must be included in the escrow records for this
  transaction?
options:
  - The name of the party from whom the broker received the money
  - The amount of commission the broker expects to earn from the transaction
  - The name of the referring agent who introduced the buyer to the broker
  - The date the broker first advertised the property for sale
key: A
explanation: Under 49 Pa. Code § 35.328, escrow records must include the name of the party from whom
  the broker received the money. The other options describe information that the rule does not
  require for escrow records.
