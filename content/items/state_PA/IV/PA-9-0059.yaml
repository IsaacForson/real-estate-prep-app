stem: Under the Real Estate Licensing and Registration Act, a salesperson may accept a commission
  for performing real estate services only from which of the following?
options:
  - The buyer or seller directly in the transaction.
  - The closing agent or attorney involved in the deal.
  - The licensed real estate broker with whom he is affiliated.
  - The mortgage lender handling the loan for the buyer.
key: C
explanation: The rule prohibits a salesperson from accepting commission from anyone except the
  licensed broker with whom he is affiliated. The most tempting distractor, accepting commission
  directly from the buyer or seller, is prohibited because the statute limits compensation to the
  affiliated broker.
citation:
  source: 63 P.S. § 455.604(a)(12)
  url: null
  quoted_text: Accepting a commission or any valuable consideration by a salesperson or associate
    broker for the performance of any acts specified in this act, from any person, except the
    licensed real estate broker with whom he is affiliated.
