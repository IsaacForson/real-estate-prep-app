stem: A broker’s license is suspended by the Commission on June 1. According to 49 Pa. Code §35.291,
  what must the broker do with the notice provided by the Commission?
options:
  - Return the license to the Commission and post the notice at the main office only
  - Return the license to the Commission and post the notice at the main office and at branch offices
  - Return the license to the Commission and post the notice at the branch offices only
  - Return the license to the Commission and post the notice at the main office and at the broker's
    residence
key: B
explanation: The rule mandates that a broker whose license is suspended must return the license and
  post the notice at both the main office and all branch offices. Posting only at the main office
  omits the required branch‑office posting, which the rule expressly requires.
citation:
  source: 49 Pa. Code ch. 35 (State Real Estate Commission) — 49 Pa. Code Chapter 35 — State Real
    Estate Commission (Pennsylvania Code, changes effective through 56 Pa.B. 4026, July 4, 2026) — §
    35.291
  url: null
  quoted_text: A broker or cemetery broker whose license is suspended by the Commission shall return
    his license to the Commission and shall post a notice of the Commission’s action at the main
    office and at branch offices.
