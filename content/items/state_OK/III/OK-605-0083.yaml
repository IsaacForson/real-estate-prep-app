stem: Under Oklahoma Real Estate License Code, what is the maximum length of stay allowed for a
  guest in a transient lodging facility to qualify for the exemption from licensing?
options:
  - Less than ninety (90) days.
  - Less than sixty (60) days.
  - Less than thirty (30) days.
  - Less than fifteen (15) days.
key: C
explanation: The exemption for transient lodging facilities applies only when the stay is for a
  period less than thirty (30) days, as stated in the definition of transient lodging facility.
  Therefore, the maximum length of stay that still qualifies is less than thirty days. Options
  citing fifteen, sixty, or ninety days do not match the statutory limit.
citation:
  source: Okla. Stat. tit. 59 § 858-301(8)
  url: null
  quoted_text: For purposes of this paragraph, "transient lodging facility" means a furnished room or
    furnished suite of rooms which is rented to a person on a daily basis, not as a principal
    residence, for a period less than thirty (30) days;
