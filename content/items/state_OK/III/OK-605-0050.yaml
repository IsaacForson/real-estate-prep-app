stem: Under Oklahoma Administrative Code § 10-13-1(a)(1)(D), when must a broker deposit escrow funds
  received in connection with a real estate transaction?
options:
  - The broker must deposit escrow funds within 24 hours of receipt, with no allowance for banking
    days or any written agreement to extend the deadline.
  - The broker must deposit escrow funds within five business days of receipt, ignoring any
    possibility of a written agreement to alter the timing.
  - The broker must deposit escrow funds before the end of the third banking day following
    acceptance of an offer or receipt of funds unless otherwise agreed in writing.
  - The broker must deposit escrow funds only at the moment of closing, regardless of when the offer
    is accepted or funds are received, and without any written agreement to change this timing.
key: C
explanation: Under Oklahoma Administrative Code § 10-13-1(a)(1)(D), escrow funds must be deposited
  before the end of the third banking day following acceptance of an offer or receipt of funds
  unless the parties agree otherwise in writing. A requirement to deposit within 24 hours is too
  short, a five‑business‑day deadline is too long, and depositing only at closing ignores the
  allowed banking‑day window and any written agreement to modify the timing.
