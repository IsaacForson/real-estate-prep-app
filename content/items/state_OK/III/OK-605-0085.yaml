stem: A broker's employee leases units in a three-unit affordable housing development to persons
  qualifying under a federal housing subsidy program. Under Oklahoma Real Estate License Code, is a
  real estate license required?
options:
  - Yes, a real estate license is required.
  - No, a real estate license is not required.
  - Yes, only if the employee is compensated.
  - No, because the tenants qualify for a housing subsidy.
key: A
explanation: The exemption for employees of a licensed broker applies only to affordable housing
  developments of four or more units. A three-unit development does not meet this threshold, so the
  exemption does not apply and a license is required. The distractor claiming no license is required
  incorrectly assumes the tenant qualification alone suffices.
