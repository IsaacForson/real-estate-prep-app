stem: A property management broker receives a security deposit from a tenant on Monday. Assuming no
  written agreement to the contrary, by what deadline must the broker deposit the funds into the
  trust account?
options:
  - The broker must deposit the funds by the close of the next banking day.
  - The broker must deposit the funds by the end of the third banking day following receipt.
  - The broker may hold the funds in the broker's personal account until the lease terminates.
  - The broker must deposit the funds only if the tenant requests a receipt.
key: B
explanation: Under OAC 10-13-1(D), escrow funds including security deposits must be deposited before
  the end of the third banking day following receipt unless otherwise agreed in writing. Therefore,
  the broker must deposit by the end of the third banking day after Monday. The distractor that says
  the broker must deposit by the close of the next banking day misstates the deadline; the rule
  requires the third banking day, not the next.
citation:
  source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules) — Oklahoma Administrative
