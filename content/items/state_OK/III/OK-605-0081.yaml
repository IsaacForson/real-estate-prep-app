stem: A property manager acting as a broker receives a tenant's security deposit of $800 on Monday.
  Under Oklahoma Real Estate License Code, what is the broker's duty regarding this money?
options:
  - Use the deposit to cover advertising costs
  - Place the deposit in a personal account until lease termination
  - Immediately refund the deposit to the tenant
  - Account for all money and property received by the broker
key: D
explanation: Under Okla. Stat. tit. 59 § 858-353, a broker must timely account for all money and
  property received, including a tenant's security deposit. Placing the deposit in a personal
  account violates this duty to properly account for funds.
