stem: A broker opens a trust account to hold monthly rent payments collected from tenants for a
  property they manage. Under Oklahoma Administrative Code, what action must the broker take
  regarding the Commission?
options:
  - Notify the Commission in writing of the trust account.
  - Receive written approval from the Commission before depositing any rent.
  - Obtain a surety bond equal to the total rent collected.
  - Submit quarterly interest earnings to the Commission.
key: A
explanation: The rule requires a broker to notify the Commission in writing of all trust or escrow
  accounts, security deposit accounts, rental management operating accounts, and interest bearing
  accounts in which trust funds are held. Therefore, the broker must provide written notice of the
  trust account. The distractor suggesting prior written approval is incorrect because the rule only
  mandates notification, not pre‑approval.
citation:
  source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules) — Oklahoma Administrative
    Code Title 605, Chapters 1 and 10 (OREC Code and Rules Book, as of Nov. 1, 2025) — § 10-13-1(e)
  url: null
  quoted_text: A broker shall be required to notify the Commission in writing of all trust or escrow
    accounts, security deposit accounts, rental management operating accounts, and interest bearing
    accounts in which trust funds are held.
