stem: Under Oklahoma Administrative Code, when is a broker required to maintain a trust or escrow
  account for funds belonging to others?
options:
  - Only when handling earnest money deposits for residential sales in this state.
  - Whenever the broker receives any funds or documents belonging to others that must be placed in
    the account.
  - Only if the broker is also acting as a property manager for rental properties in Oklahoma.
  - Only when the funds exceed $1,000 in a single transaction for residential property.
key: B
explanation: Under Oklahoma Administrative Code, a broker is not required to maintain a trust or
  escrow account unless they accept monies or other depositable items belonging to others that need
  to be placed in the account. Therefore, the option stating that a broker must maintain a trust
  account whenever they receive any funds or documents belonging to others that must be placed in
  the account is correct. The option stating that the requirement applies only when handling earnest
  money deposits for residential sales is incorrect because the requirement is not limited to
  earnest money deposits for residential sales; it applies to any funds belonging to others that
  must be placed in trust.
citation:
  source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules) — Oklahoma Administrative
    Code Title 605, Chapters 1 and 10 (OREC Code and Rules Book, as of Nov. 1, 2025) — § 10-13-1(d)
  url: null
  quoted_text: A broker shall not be required to maintain a trust or escrow account unless monies or
    other depositable items belonging to others are accepted by the broker and require the broker to
    place the monies or items in the broker's trust account.
