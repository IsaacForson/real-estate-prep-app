stem: A resident manager who does not live on the premises performs leasing activities for an
  apartment complex. Under Oklahoma Real Estate License Code, is a real estate license required?
options:
  - Yes, a real estate license is required.
  - Yes, only if the manager receives compensation.
  - No, because the manager is employed by the broker.
  - No, a real estate license is not required.
