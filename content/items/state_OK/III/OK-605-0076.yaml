stem: A broker receives an earnest money deposit on a Wednesday morning. Assuming no written
  agreement to the contrary, by what deadline must the broker deposit the funds into the trust
  account under Oklahoma Administrative Code?
options:
  - By the end of Wednesday
  - By the end of Tuesday
  - By the end of Monday
  - By the end of Friday
key: C
explanation: The rule requires escrow funds to be deposited before the end of the third banking day
  following receipt. A Wednesday receipt makes Thursday the first banking day, Friday the second,
  and Monday the third banking day, so the deposit is due by end of Monday. Depositing by Friday
  would only satisfy the second banking day and is therefore too early.
citation:
  source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules) — Oklahoma Administrative
    Code Title 605, Chapters 1 and 10 (OREC Code and Rules Book, as of Nov. 1, 2025) — §
    10-13-1(a)(1)(D)
  url: null
  quoted_text: All escrow funds shall be deposited before the end of the third banking day following
    acceptance of an offer by an offeree or receipt of escrow funds unless otherwise agreed to in
    writing by all interested parties.
