stem: A person manages a furnished suite rented daily to travelers for stays under 30 days, not as a
  principal residence. Under Oklahoma Real Estate License Code, does this person need a real estate
  license to perform leasing activities?
options:
  - License is required because any rental activity needs licensure
  - License is required unless the person also holds a broker license
  - License is not required due to transient lodging facility exemption
  - License is not required only if the stays are longer than 30 days
key: C
explanation: The statute exempts anyone managing a transient lodging facility, defined as a
  furnished suite rented daily for less than thirty days, from licensure requirements. Therefore, no
  license is required. The distractor stating a license is not required only if stays exceed thirty
  days inverts the threshold and is incorrect.
