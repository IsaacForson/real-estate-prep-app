stem: Under Oklahoma Administrative Code, what must a broker do with a trust or escrow account that
  is no longer in use?
options:
  - Notify the Commission in writing that the account is closed.
  - Close the account without notifying the Commission.
  - Transfer the remaining funds to the broker's personal account.
  - Continue to maintain the account for future transactions.
key: A
explanation: The rule states that a broker shall inform the Commission in writing of any accounts
  which are closed and no longer in use. Therefore, notifying the Commission is required. Closing
  the account without notice violates this requirement because the Commission must be kept informed
  of all trust accounts.
