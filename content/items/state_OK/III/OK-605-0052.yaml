stem: A broker deposits personal money into the trust account to cover the monthly service fee
  charged by the bank. Is this permissible under Oklahoma Admin. Code § 10-13-1(b)?
options:
  - The broker's action is impermissible unless the broker obtains written consent from the client.
  - The broker's action is permissible only if the funds are left in the account for less than 24
    hours.
  - The broker's action is permissible because the personal funds are to cover the bank's service
    charges.
  - The broker's action is impermissible because any personal funds in a trust account are
    prohibited.
key: C
explanation: The rule permits personal funds in a trust account only in amounts sufficient to cover
  charges for servicing the account. Since the deposit is to cover the bank's service charge, it is
  allowed. The distractor claiming an absolute prohibition is incorrect because the rule provides
  this exception.
citation:
  source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules) — Oklahoma Administrative
