stem: A licensee does not pay the required license renewal fee by the deadline. What may the
  Oklahoma Real Estate Commission do under its powers and duties?
options:
  - The Commission may prescribe penalties for failure to pay the renewal fee.
  - The Commission may issue a public reprimand via newspaper notice.
  - The Commission may automatically revoke the licensee's license.
  - The Commission may require the licensee to retake the licensing examination.
key: A
explanation: The Commission may prescribe penalties to be assessed against licensees for failure to
  pay license renewal fees, as stated in its powers and duties. The distractor claiming automatic
  revocation is incorrect because revocation requires showing good cause and is not an automatic
  consequence for nonpayment of the renewal fee.
