stem: A person is appointed to the Oklahoma Real Estate Commission but has only lived in Oklahoma
  for two years prior to appointment, although they are a U.S. citizen. Is this appointment valid
  under the Oklahoma Real Estate License Code?
options:
  - The appointment is valid because U.S. citizenship is the only requirement for Commission members.
  - The appointment is invalid because members must have been Oklahoma residents for at least three
    years prior to appointment.
  - The appointment is valid because the residency requirement applies only to licensed broker
    members.
  - The appointment is invalid because the person must also be a licensed real estate broker.
key: B
explanation: The statute requires all Commission members to be U.S. citizens and to have been
  Oklahoma residents for at least three years before appointment. Since the person lacks the
  required residency, the appointment is invalid. The other options misstate the scope of the
  residency rule or add unrelated broker licensing requirements.
