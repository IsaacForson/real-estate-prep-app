stem: A licensee is called to active military duty and wishes to avoid paying renewal fees while
  deployed. According to Okla. Stat. tit. 59 § 858-309(B), what must the licensee do to avoid paying
  fees during active military service?
options:
  - Paying reduced fees equal to half the regular renewal amount, as allowed for temporary hardship
    cases.
  - Notifying the Commission in writing within thirty days of deployment, but only after receiving
    approval from the unit commander.
  - Submitting a written request for inactive status on Commission forms prior to each term for
    which the license is to be issued
  - Receiving inactive status automatically without any request, even if the licensee is deployed
    overseas.
key: C
explanation: Under Okla. Stat. tit. 59 § 858-309(B), a licensee on active military duty is not
  required to pay renewal fees but must request inactive status before each renewal term. Therefore,
  submitting a written request for inactive status on Commission forms prior to each term is
  necessary to avoid fees; simply receiving inactive status without a request does not satisfy the
  requirement.
