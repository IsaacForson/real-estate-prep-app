stem: A licensee advertises a residential property for sale online without first obtaining the
  seller's written consent. Which prohibited act does this most directly violate?
options:
  - Making a materially false or fraudulent statement in an application for a license
  - Using prizes or gifts as an inducement to secure customers for a specific property
  - Advertising or offering for sale real estate without the consent of the owner
  - Failing to account for or remit monies received from a buyer or client
key: C
explanation: The statute prohibits advertising or offering real estate for sale without the owner's
  consent. The option about using prizes as an inducement relates to a different prohibited act
  concerning marketing inducements.
