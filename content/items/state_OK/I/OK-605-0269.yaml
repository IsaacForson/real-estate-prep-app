stem: An applicant for a real estate license asks whether the broker may reimburse the cost of the
  required national criminal history record check. According to Oklahoma Statute § 858-307.4(C), who
  is responsible for paying the costs associated with the check?
options:
  - The applicant shall pay
  - The broker shall pay
  - The Commission shall pay
  - The state shall pay
key: A
explanation: Section 858-307.4(C) explicitly states that the costs associated with the national
  criminal history record check shall be paid by the applicant. Therefore, the applicant—not the
  broker, Commission, or state—must bear the expense. The distractor “The broker shall pay”
  misassigns responsibility to the broker, which the statute does not allow.
