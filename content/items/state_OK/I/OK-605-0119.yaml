stem: A real estate broker continues to operate without a license after receiving a written warning
  from the Commission to cease such activity. Under §858-208(18) of the Oklahoma Real Estate License
  Code, what action may the Commission take?
options:
  - The Commission may impose an administrative fine of $500 per day
  - The Commission may issue a cease and desist order to the broker
  - The Commission may suspend the broker's license for six months
  - The Commission may require the broker to complete additional continuing education
key: B
explanation: The Commission is expressly authorized to issue cease and desist orders to any person
  or business entity violating the License Code or its rules. While the Commission also holds powers
  to fine, suspend, or mandate education, those authorities are found in other subsections and are
  not the specific remedy described in paragraph 18. Therefore, the correct action under this
  provision is to issue a cease and desist order.
