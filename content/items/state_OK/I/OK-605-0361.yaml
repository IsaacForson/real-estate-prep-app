stem: A licensee pleads guilty to a felony offense on March 10. According to Oklahoma Statute §
  858-301.2, by what date must the licensee notify the Commission in writing of the plea?
options:
  - April 9
  - March 31
  - April 10
  - May 10
key: A
explanation: The statute requires notification within thirty (30) days after the plea is taken.
  Adding thirty days to March 10 yields April 9. The distractor April 10 incorrectly adds thirty‑one
  days.
citation:
