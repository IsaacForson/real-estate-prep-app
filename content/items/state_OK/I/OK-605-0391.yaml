stem: What is the Education and Recovery Fund fee for an original provisional sales associate
  license under Oklahoma Administrative Code § 10-7-2?
options:
  - $5.00
  - $10.00
  - $15.00
  - $20.00
key: C
explanation: The rule states that the Education and Recovery Fund fee is $20.00 for most licenses,
  but an exception reduces the fee to $15.00 for a provisional sales associate license. Therefore,
  the correct fee is $15.00. The distractor of $20.00 applies to other license types and ignores the
  exception for provisional sales associates.
