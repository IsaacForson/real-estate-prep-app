stem: A broker plans to begin advertising a new trade name on June 1. According to Oklahoma
  Administrative Code, by what date must the broker have registered the trade name with the
  Commission?
options:
  - By June 15
  - By June 2
  - By June 1
  - By May 31
key: D
explanation: The rule requires registration prior to the trade name being advertised or displayed.
  Since advertising begins June 1, registration must occur on or before May 31. Registering on June
  1 would violate the prior‑to‑advertising requirement.
citation:
  source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules) — Oklahoma Administrative
    Code Title 605, Chapters 1 and 10 (OREC Code and Rules Book, as of Nov. 1, 2025) — § 10-9-3
  url: null
  quoted_text: Each licensed broker or entity must register in writing to the Commission all trade
    names used in connection with real estate activities prior to the trade name being advertised or
    displayed in any way.
