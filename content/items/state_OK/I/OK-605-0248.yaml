stem: Under Oklahoma Administrative Code § 10-9-3, when must a broker register a trade name with the
  Oklahoma Real Estate Commission?
options:
  - Registration after the trade name has been used in advertising
  - Registration within 30 days of first using the trade name
  - Registration prior to advertising or displaying the trade name
  - Registration at the time of biennial license renewal
key: C
explanation: The rule requires a broker to register a trade name before it is advertised or
  displayed. Registering after use violates this requirement.
citation:
  source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules) — Oklahoma Administrative
    Code Title 605, Chapters 1 and 10 (OREC Code and Rules Book, as of Nov. 1, 2025) — § 10-9-3
  url: null
  quoted_text: Each licensed broker or entity must register in writing to the Commission all trade
    names used in connection with real estate activities prior to the trade name being advertised or
    displayed in any way.
