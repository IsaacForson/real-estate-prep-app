stem: According to the Oklahoma Real Estate License Code, besides the five licensed broker members,
  what two types of members must also be on the seven-member Real Estate Commission?
options:
  - One licensed attorney and one certified public accountant who are not required by the statute
  - One member from each congressional district and one member from the state legislature although
    the commission does not include legislative representatives
  - Two additional licensed real estate brokers with ten years' experience despite the law requiring
    only five broker members
  - One lay person not in the real estate business and one active representative of an approved real
    estate school
key: D
explanation: The statute requires one lay person who is not in the real estate business and one
  active representative of an approved Oklahoma real estate school to fill the remaining two seats.
  The other options incorrectly substitute attorneys, CPAs, extra brokers, or legislative members,
  which the law does not specify.
citation:
  source: Okla. Stat. tit. 59 § 858-201(C)
  url: null
  quoted_text: One member shall be a lay person not in the real estate business, and one member shall
    be an active representative of a school of real estate located within the State of Oklahoma and
    approved by the Oklahoma Real Estate Commission.
