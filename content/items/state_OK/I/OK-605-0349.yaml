  url: null
  quoted_text: A licensee requesting activation of a license must have complied with the continuing
    education requirement as set forth in Section 858- 307.2 of Title 59 of the Oklahoma Statutes
    and rule 605:10-3-6 and, if applicable, the experience requirement as set forth in Section
    858-303 of Title 59 of the Oklahoma Statutes and 63 rule 605:10-3-4 and 605:10-3-4.1.
