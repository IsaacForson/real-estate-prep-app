stem: A licensee whose license has been inactive for three years submits a request to activate the
  license. According to Oklahoma Administrative Code § 10-7-4(c), what must the licensee have
  completed before the Commission can approve the activation request?
options:
  - Payment of the inactive license fee for the term
  - Completion of the required continuing education
  - Submission of a name change request within ten days
  - Designation of a branch broker for the primary office
key: B
explanation: The rule requires that a licensee requesting activation must have complied with the
  continuing education requirement as set forth in Section 858-307.2 of Title 59 and rule
  605:10-3-6; the other options are not prerequisites for activation under this provision.
