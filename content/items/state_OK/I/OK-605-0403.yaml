stem: Under Oklahoma Administrative Code § 10-1-3(a), how many days does an adversely affected party
  have to file a written request for a hearing after receiving notice of an adverse administrative
  action or decision by the Oklahoma Real Estate Commission?
options:
  - Ten days
  - Fifteen days
  - Thirty days
  - Forty-five days
key: C
explanation: The rule states that an adversely affected party must file a written request for a
  hearing within thirty (30) days of notice of the adverse action or decision. Therefore, thirty
  days is the correct period. Fifteen days is incorrect because it applies to the notice of hearing,
  not the filing deadline.
