stem: "A sales associate receives a referral fee from a mortgage lender for directing clients to
  that lender. Under the Oklahoma Real Estate License Code, this action most likely constitutes:"
options:
  - Accepting a bonus from the broker for exceeding sales targets
  - Accepting a salary from the broker for performing associate acts
  - Accepting a gift of nominal value from a client
  - Accepting a commission from a mortgage lender for referring clients
key: D
explanation: The Code prohibits a real estate associate from accepting a commission or other
  valuable consideration for performing associate acts except from the broker with whom the
  associate is associated (Okla. Stat. tit. 59 § 858-312). Receiving a referral fee from a mortgage
  lender is a commission from someone other than the broker, so it is not permitted. Accepting a
  bonus from the broker for exceeding sales targets and accepting a salary from the broker for
  performing associate acts are both forms of compensation from the broker, which the exception
  allows. Accepting a gift of nominal value from a client is not a commission for associate acts and
  therefore is not prohibited.
