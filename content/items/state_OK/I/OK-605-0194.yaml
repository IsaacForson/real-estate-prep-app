stem: Under Oklahoma Administrative Code § 10-17-4(21), how is an 'immediate family relationship'
  defined for disclosure purposes?
options:
  - "A licensee's: Spouse, Children, Grandchildren, Parents, Grandparents, Brothers, and Sisters,
    including step, half or in-law relationships named herein."
  - "A licensee's: Spouse, Children, Grandchildren, Parents, Grandparents, Brothers, and Sisters,
    excluding step, half or in-law relationships."
  - "A licensee's: Spouse, Children, Grandchildren, Parents, Grandparents, Brothers, and Sisters,
    including only step relationships."
  - "A licensee's: Spouse, Children, Grandchildren, Parents, Grandparents, Brothers, and Sisters,
    including only half relationships."
key: A
explanation: The rule explicitly defines immediate family relationship as a licensee's spouse,
  children, grandchildren, parents, grandparents, brothers, and sisters, including step, half, or
  in‑law relationships. The distractor that excludes step, half or in‑law relationships contradicts
  this definition and is therefore incorrect.
