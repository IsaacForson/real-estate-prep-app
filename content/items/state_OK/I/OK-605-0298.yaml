stem: Under Oklahoma Statute § 858-311, what must a licensee allege and prove to maintain a court
  action for compensation for services rendered in listing, buying, selling, renting, leasing, or
  exchanging real estate?
options:
  - The licensee must allege and prove that the commission was agreed upon in writing before
    services began.
  - The licensee must allege and prove that the licensee was licensed when the cause of action arose.
  - The licensee must allege and prove that the transaction was closed within thirty days of the
    listing agreement.
  - The licensee must allege and prove that the client suffered actual monetary damages.
key: B
explanation: The statute plainly states that a licensee may not sue for compensation without
  alleging and proving licensure at the time the cause of action arose. The other options introduce
  elements such as damages, closing time, or written commission agreements that are not required by
  this provision.
