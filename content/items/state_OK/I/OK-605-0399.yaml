stem: A licensee wishes to place their license on inactive status and submits a verbal request to
  the Commission. According to Oklahoma Statute § 858-309(A), what is the consequence of this verbal
  request?
options:
  - The request is invalid and the license remains active
  - The licensee will receive a warning for improper procedure
  - The license will be placed on inactive status effective immediately
  - The license will be placed on inactive status after review
key: A
explanation: The statute requires that a request for inactive status be in writing on forms
  furnished by the Commission. A verbal request does not meet this requirement, so it is invalid and
  the license stays active. The option suggesting the license will be placed on inactive status
  after review is incorrect because the statute does not provide for any review of a verbal request;
  it must be written.
