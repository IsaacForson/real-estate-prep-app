stem: A licensee submits a single, timely request to both activate an inactive license and change
  the licensee's name on the same license. How many fees will the Oklahoma Real Estate Commission
  charge for this combined request?
options:
  - One fee
  - Two fees
  - Three fees
  - No fee
key: A
explanation: The rule states that when a request involves more than one change at the same time and
  each change normally requires a separate fee, only one fee is charged if the request is done in a
  timely manner. Distractors that assume separate fees or no fee contradict this provision.
citation:
  source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules) — Oklahoma Administrative
    Code Title 605, Chapters 1 and 10 (OREC Code and Rules Book, as of Nov. 1, 2025) — § 10-7-4(b)
  url: null
  quoted_text: In the event a licensee's request involves more than one change to the license at the
    same time, and each individual change requires a separate fee elsewhere in the rules of this
    Chapter, the Commission shall only require that one fee be charged to reissue the license if the
    request is done in a timely manner.
