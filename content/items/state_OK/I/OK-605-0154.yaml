stem: A licensee pleads guilty to a felony offense. According to § 858-312(27), within how many days
  must the licensee notify the Commission in writing of the plea?
options:
  - Ten (10) days
  - Fifteen (15) days
  - Twenty (20) days
  - Thirty (30) days
key: D
explanation: The statute requires notification of a felony plea or conviction within thirty (30)
  days after the plea is taken, and also within thirty days of judgment and sentencing.
