stem: An applicant submits a national criminal history record check that is dated seven months
  before the application filing date. According to Oklahoma Administrative Code § 10-3-2(a)(1)(M),
  what must the applicant do to satisfy the Commission’s requirement?
options:
  - The existing national criminal history record check accompanied by a written explanation
  - A new national criminal history record check issued within the last six months
  - A waiver request submitted to the Commission for the existing national criminal history record
    check
  - An additional fee paid to extend the validity of the existing national criminal history record
    check
key: B
explanation: The rule states that a completed national criminal history record check is valid for
  only six months from the date of issuance; a check older than six months is not acceptable and a
  new, current check must be obtained. Simply providing an explanation or paying a fee does not
  extend the validity period set by the rule.
citation:
  source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules) — Oklahoma Administrative
