    2025) — § 858-301.1
  url: null
  quoted_text: Any applicant convicted of a felony crime that substantially relates to the occupation
    of a real estate agent and poses a reasonable threat to public safety shall not be eligible to
    obtain a real estate license within ten (10) years of the completion of any criminal sentence,
    including parole and probation.
