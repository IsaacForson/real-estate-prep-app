stem: An applicant was convicted of a felony that substantially relates to the occupation of a real
  estate agent and poses a reasonable threat to public safety. The applicant completed the criminal
  sentence, including parole and probation, eight (8) years ago. According to Oklahoma Statute
  § 858-301.1(B), is the applicant eligible to obtain a real estate license?
options:
  - No, because the applicant must wait twenty (20) years for any felony.
  - Yes, because more than ten (10) years have passed since the sentence ended.
  - Yes, because the felony does not substantially relate to real estate.
  - No, because less than ten (10) years have passed since the sentence ended.
key: D
explanation: Oklahoma Statute § 858-301.1(B) provides a ten‑year ineligibility period for any
  applicant whose felony conviction substantially relates to the real‑estate occupation and
  threatens public safety. Because only eight years have passed since the sentence ended, the
  ten‑year period has not yet elapsed, so the applicant is not eligible. The claim that a
  twenty‑year wait is required or that the felony does not substantially relate is inconsistent with
  the statute.
citation:
