stem: An applicant indicates a past felony conviction on the application and is unable to obtain
  official disposition documents. According to Oklahoma Administrative Code § 10-3-2(a)(2), what
  must the applicant submit with the application?
options:
  - A detailed letter explaining the matter(s)
  - A copy of the conviction judgment
  - A police arrest report with incident details
  - A notarized affidavit of the conviction details
key: A
explanation: The rule specifies that if official documents cannot be obtained, a detailed letter
  explaining the matter(s) must be attached to the application. A copy of the judgment or an arrest
  report does not satisfy the substitute documentation requirement when official records are
  unavailable.
