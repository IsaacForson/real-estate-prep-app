stem: A licensee who is on active military service wishes to keep their real estate license
  inactive. According to the Oklahoma Real Estate License Code, what must the licensee do regarding
  fees and inactive status?
options:
  - Pay regular fees and request inactive status each year
  - Pay reduced fees and automatically receive inactive status
  - Submit a written request for inactive status once per term
  - Exempt from fees; request inactive status before each term
key: D
explanation: Section 858-309(B) states that during active military service, any licensee shall not
  be required to pay the fees but shall request the inactive status prior to each term for which the
  license is to be issued. Thus, the licensee is exempt from fees but must request inactive status
  before each term.
