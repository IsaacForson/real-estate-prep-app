stem: An associate wants to place an online advertisement that includes only their personal name and
  phone number. What must the associate do to comply with Oklahoma Administrative Code §
  10-9-4(b)(3)?
options:
  - The associate must display the associate's nickname without registering it with the Commission
  - The associate must include the broker's name at least 50% larger than any associate reference
  - The associate must obtain written permission from the broker before using any personal insignia
  - The associate must use only the associate's personal name and contact information
key: B
explanation: The rule defines 'prominent, conspicuous and easily identifiable' as requiring the
  broker's reference to be at least 50% larger than any associate reference in the advertisement.
  Simply using only the associate's name violates the requirement to include the broker's reference
  prominently.
