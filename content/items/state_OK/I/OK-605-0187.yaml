stem: A licensee completes a real estate training session that is a regular part of their
  brokerage’s in‑house meetings. Under Oklahoma Administrative Code § 10-3-6(f)(1)(D), may this
  session be counted toward the continuing education requirement?
options:
  - The session may not be counted because in‑house training is expressly ineligible.
  - The session may be counted because it is related to real estate practices.
  - The session may not be counted unless the session is approved by the Commission.
  - The session may be counted if the licensee receives a certificate of completion.
key: A
explanation: The rule explicitly lists ‘Meetings which are a normal part of in-house training’ as
  ineligible for continuing education credit, regardless of content or certification. Options
  suggesting the session could be counted contradict this specific prohibition.
