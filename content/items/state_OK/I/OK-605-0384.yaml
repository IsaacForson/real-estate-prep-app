stem: A licensee wishes to place a 'For Sale' sign on a residential property they are listing. What
  must the licensee have before placing the sign?
options:
  - Consent from the property owner or authorized representative
  - Approval from the broker's managing supervisor for signage
  - A signed purchase agreement from a prospective buyer or tenant
  - A disclosure statement of the licensee's commission rate and fees
key: A
explanation: The licensee must obtain consent from the property owner or authorized representative
  before placing a sign. The other options—approval from the broker's managing supervisor for
  signage, a signed purchase agreement from a prospective buyer or tenant, and a disclosure
  statement of the licensee's commission rate and fees—are not required by this provision.
