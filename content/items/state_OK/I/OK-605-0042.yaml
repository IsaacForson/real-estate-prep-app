stem: A provisional sales associate fails to submit evidence of completing the required 45 clock
  hours of postlicense education before the provisional license expires. What is the consequence
  under Oklahoma Statute?
options:
  - The associate is required to retake the 90‑hour prelicense course.
  - The associate is allowed to renew after paying a late fee.
  - The associate is not entitled to renew the license for another term.
  - The associate is required to complete 90 additional hours before renewal.
key: C
explanation: The statute specifies that a provisional sales associate who does not meet the
  postlicense education requirement prior to the first expiration date shall not be entitled to
  renew the license for another term. The retake‑prelicense option confuses the initial education
  requirement, while the late‑fee and additional‑hours options introduce conditions not mentioned in
  the rule.
