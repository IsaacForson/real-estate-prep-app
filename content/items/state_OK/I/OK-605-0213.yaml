stem: A licensee had their real estate license revoked on January 15, 2023. On what date may they
  first submit an application for reissuance of the license?
options:
  - January 15, 2028
  - January 15, 2026
  - January 15, 2025
  - January 15, 2024
key: A
explanation: Under §858-307.3, a person may not file for reissuance within five years of the
  revocation date, so the earliest permissible filing date is five years after January 15, 2023,
  which is January 15, 2028. The distractor “January 15, 2026” is incorrect because it reflects only
  a three‑year wait, which does not satisfy the five‑year barrier.
