stem: Before a private real estate school that is **NOT** an institution of higher education may be
  approved by the Oklahoma Real Estate Commission, what must it submit to the Commission?
options:
  - Proof of ownership of the school property
  - Its syllabus of instruction submitted
  - A detailed budget for the upcoming year
  - A list of all prospective students
key: B
explanation: Section 858-304(D) requires each school, whether public or private other than
  institutions of higher education, to present its syllabus of instruction to the Commission prior
  to approval. Therefore, the school must submit its syllabus of instruction.
