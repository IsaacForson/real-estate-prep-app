stem: A licensee deposits client earnest money into an escrow account that also contains the
  licensee's personal funds. Under Oklahoma Statute § 858-312, which provision addresses this
  conduct?
options:
  - A. Commingling with the licensee's own money or property the money or property of others which
    is received and held by the licensee, unless the money or property of others is received by the
    licensee and held in an escrow account that contains only money or property of others
  - Failing, within a reasonable time, to account for or to remit any monies, documents, or other
    property coming into the possession of the licensee which belong to others, such as neglecting
    to return a client’s earnest money deposit after a transaction falls through or keeping a
    seller’s closing statement without delivering it
  - Paying a commission or valuable consideration to any unlicensed person for acts or services
    performed in violation of the Oklahoma Real Estate License Code, such as giving a referral fee
    to a friend who is not a licensed real estate agent for helping locate a buyer
  - Advertising to buy, sell, rent, or exchange any real estate without disclosing in writing that
    the licensee is a real estate licensee, for example placing a yard sign or online listing that
    omits the required disclosure of licensure status
key: A
explanation: "The scenario describes a licensee mixing personal funds with client earnest money in
  the same escrow account. Under Okla. Stat. tit. 59 § 858-312(16), this conduct is prohibited as
  commingling unless the account holds only others’ funds. The option that describes commingling
  with the licensee’s own money or property the money or property of others which is received and
  held by the licensee, unless the money or property of others is received by the licensee and held
  in an escrow account that contains only money or property of others, states the prohibited
  conduct. The other options describe different violations: failing to account for or remit others’
  property, paying commissions to unlicensed persons, and advertising without proper licensure
  disclosure, none of which match the commingling issue."
