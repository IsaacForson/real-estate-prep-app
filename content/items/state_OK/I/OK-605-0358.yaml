stem: Under Oklahoma Statute § 858-301(7), what is the maximum amount of a resident referral fee
  that is exempt from licensing requirements?
options:
  - Seventy-five Dollars ($75.00).
  - One Hundred Dollars ($100.00).
  - One Hundred Fifty Dollars ($150.00).
  - Two Hundred Dollars ($200.00).
key: B
explanation: The statute defines a resident referral fee as a nominal fee not to exceed One Hundred
  Dollars ($100.00). Therefore, the correct maximum exempt amount is $100. The distractor listing
  $150 exceeds this limit and is not exempt.
