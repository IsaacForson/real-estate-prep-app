stem: An applicant attends an in‑class pre‑license course but leaves early before the session ends.
  According to Oklahoma Administrative Code § 10-3-1(c), what must the applicant do to receive
  credit for the course?
options:
  - Attend the full session and then pass the examination
  - Submit a detailed letter explaining the early departure
  - Receive credit based on the portions attended
  - Pass the examination without attending the full session
key: A
explanation: The rule mandates that a person be physically present during all of the in‑class
  offering time and successfully complete all course requirements, including an examination.
  Therefore, the applicant must attend the full session and pass the exam. Receiving credit for only
  the portions attended does not meet the full‑attendance requirement.
