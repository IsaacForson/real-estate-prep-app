stem: A broker continues to advertise using a trade name that has not been registered with the
  Oklahoma Real Estate Commission. What action may the Commission take under the Oklahoma Real
  Estate License Code?
options:
  - The Commission may require the broker to complete additional education.
  - The Commission may place the broker's license on probation.
  - The Commission may issue a cease and desist order.
  - The Commission may impose a fine of $1,000.
key: C
explanation: The Commission has the power to issue cease and desist orders to anyone violating the
  Code or its rules, which includes using an unregistered trade name in advertising. The distractor
  proposing a specific $1,000 fine is incorrect because the rule does not set a fine amount for this
  violation; fines must be imposed pursuant to Section 858-402 and are not automatic.
