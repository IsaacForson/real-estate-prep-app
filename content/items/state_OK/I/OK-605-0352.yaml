stem: A licensee presents a purchase offer to a seller and buyer. At that time, the licensee informs
  the parties verbally that they will need to pay closing costs and brokerage fees but does not
  provide a written estimate. According to Oklahoma Administrative Code § 10-17-4, which prohibited
  act has the licensee committed?
options:
  - Failure to inform the buyer and seller in writing at offer presentation of expected closing costs
  - Failure to reduce an offer to writing when a proposed purchaser requests such offer
  - Failure to disclose in writing any known immediate family relationship to a party to the
    transaction
  - Failure to make known in writing to any purchaser any interest the licensee has in the property
key: A
explanation: The rule mandates that the licensee inform the buyer and seller in writing at the time
  the offer is presented of expected closing costs, brokerage service costs, and approximate
  amounts. Providing only a verbal estimate fails this written disclosure requirement. The other
  options describe different prohibited acts not triggered by the scenario.
