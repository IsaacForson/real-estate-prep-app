stem: Under Oklahoma Statute § 858-312, what must a licensee disclose in writing when advertising to
  buy, sell, rent, or exchange real estate?
options:
  - A statement that the licensee is a real estate licensee
  - A statement that the property's listing price is accurate
  - A statement that the seller gave written consent to advertise
  - A statement that closing costs will be disclosed verbally
key: A
explanation: The statute prohibits advertising to buy, sell, rent, or exchange real estate without
  disclosing in writing that the licensee is a real estate licensee; therefore the required
  disclosure is that the licensee is a real estate licensee. The distractors pertain to other
  disclosures not required by this provision.
