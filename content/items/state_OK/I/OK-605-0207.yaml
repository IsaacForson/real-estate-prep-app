stem: Under Oklahoma Statute § 858-303B, within what timeframe must a broker provide a detailed
  accounting of expenditures after the time specified to perform services for which fees were
  collected in advance?
options:
  - Five (5) days after the time specified to perform services
  - Ten (10) days after the time specified to perform services
  - Fifteen (15) days after the time specified to perform services
  - Twenty (20) days after the time specified to perform services
key: B
explanation: The statute requires brokers who collect advance fees to provide a detailed accounting
  within ten (10) days after the time specified to perform the services. The ten‑day period is
  mandatory; the other intervals do not satisfy the requirement.
