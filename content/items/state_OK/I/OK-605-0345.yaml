stem: A broker has formed a team of two licensees to work together on transactions and wants to
  begin providing brokerage services under the team name. What must the broker do before the team
  can perform any licensed activities?
options:
  - The broker must register the team name with the Commission before the team performs any licensed
    activities.
  - The broker must notify the Commission before the team conducts its first licensed transaction.
  - The broker must obtain a separate license for each team member from the Commission before any
    team activity.
  - The broker must file a partnership agreement with the Commission before the team begins any
    licensed activity.
key: A
explanation: The statute defines a team and states that registration shall occur before a team
  performs any licensed activities, and the broker must notify the Commission when a team name is no
  longer used. Thus, registering the team name is required prior to any licensed activity. The other
  options describe actions after transactions, obtaining separate licenses, or filing partnership
  agreements, which are not required by this provision.
