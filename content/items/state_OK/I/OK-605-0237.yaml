stem: A broker plans to register three different team names with the Oklahoma Real Estate
  Commission. What total fee must accompany the registrations?
options:
  - $200
  - $300
  - $100
  - $400
key: B
explanation: Under Oklahoma Administrative Code § 10-9-3.2(a), the fee for registering each team
  name is $100.00. For three team names, the total fee is 3 × $100 = $300. The $200 option would
  only cover two team names, which does not match the scenario. Therefore, the correct total fee is
  $300.
