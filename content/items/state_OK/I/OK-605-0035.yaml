  - $0.00
  - $70.00
  - $50.00
key: A
explanation: The correct answer is $35.00 because the rule states a one‑time application processing
  fee of Thirty Five Dollars ($35.00) must accompany all applications for original licensure. The
  distractor $50.00 is incorrect; it mistakenly adds fifteen dollars to the required fee.
