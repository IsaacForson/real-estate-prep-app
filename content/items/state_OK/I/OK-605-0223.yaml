stem: A broker’s license is suspended effective June 1. According to Oklahoma Administrative Code §
  10-17-6, what must the broker do with their listings?
options:
  - Cancel the listings between receipt of the suspension order and the effective date
  - Keep the listings active until the suspension period ends
  - Transfer the listings to another broker without the owner’s written consent
  - Continue to advertise the listings while the suspension is in effect
key: A
explanation: The rule requires a suspended/revoked broker to cancel listings between the time the
  Order of suspension/revocation is received and the effective date of suspension/revocation,
  because listings become void on that effective date. Keeping the listings active would violate
  this requirement.
