stem: Under Oklahoma Administrative Code § 10-7-1.1, what is the consequence if an applicant fails
  to provide the required documentation to verify citizenship or qualified alien status?
options:
  - Application disapproval
  - Inactive status pending proof
  - Required $200 fine payment
  - Mandatory exam retake
key: A
explanation: The rule states that failure to provide the required documentation results in
  disapproval of the application. Therefore, the correct outcome is that the application is
  disapproved. The distractor describing inactive status pending proof is incorrect because the rule
  only places a licensee inactive after proof of citizenship is missing following reissuance, not
  for initial application documentation failure.
