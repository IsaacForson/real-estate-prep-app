stem: A broker deposits client trust funds into a dedicated escrow account that holds only money
  belonging to others, with none of the broker's own funds in it. Under the Code's
  cause-for-discipline provision on commingling, how is this deposit treated?
options:
  - It is commingling regardless of what the account holds
  - It is commingling because the broker's name appears on the account
  - It is not commingling if the account holds solely others' funds
  - It is not commingling once the Commission pre-approves the account
key: C
explanation: The statute defines commingling as mixing a licensee's own funds with others' funds,
  and expressly excepts an escrow account that contains only money or property belonging to others.
citation:
  source: Okla. Stat. tit. 59, § 858-312
  url: null
  quoted_text: Commingling with the licensee's own money or property the money or property of others
    which is received and held by the licensee, unless the money or property of others is received
    by the licensee and held in an escrow account that contains only money or property of others;
