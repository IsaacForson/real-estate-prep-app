stem: A licensee is preparing to sell a residential property to their brother. The licensee does not
  disclose this relationship in writing to the buyer. Which prohibited act under Oklahoma
  Administrative Code § 10-17-4 does this constitute?
options:
  - Failure to disclose in writing any known immediate family relationship to a party to the
    transaction
  - Failure to make known in writing to any purchaser any interest the licensee has in the property
  - Failure to inform the buyer and seller in writing at offer presentation of expected closing costs
  - Failure to reduce an offer to writing when a proposed purchaser requests such offer
key: A
explanation: The rule requires written disclosure of any known immediate family relationship between
  the licensee and a party to the transaction. Failing to disclose the relationship to the buyer
  violates this provision. The other options pertain to different disclosure obligations not
  implicated by the scenario.
citation:
  source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules) — Oklahoma Administrative
    Code Title 605, Chapters 1 and 10 (OREC Code and Rules Book, as of Nov. 1, 2025) — § 10-17-4
  url: null
  quoted_text: "Failing to disclose in writing any known immediate family relationship to a party to
    the transaction for which the broker is providing brokerage services. For the purposes of this
    section, \"immediate family relationship\" means a licensee's: Spouse, Children, Grandchildren,
    Parents, Grandparents, Brothers, and Sisters, including step, half or in-law relationships named
    herein."
