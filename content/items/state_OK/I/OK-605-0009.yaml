stem: An applicant was convicted of a felony that substantially relates to real estate work and
  poses a reasonable threat to public safety. Based on this conviction alone, when does the
  applicant become eligible for licensure?
options:
  - Twenty years after completing the criminal sentence, including parole and probation
  - Ten years after completing the criminal sentence, including parole and probation
  - Five years after completing the criminal sentence, including parole and probation
  - Immediately after completing the criminal sentence, including parole and probation
key: B
explanation: The statute sets a ten-year ineligibility period for a felony that substantially
  relates to the occupation and poses a reasonable threat, a shorter bar than the twenty-year period
  tied to the crimes listed elsewhere in the section.
citation:
  source: Okla. Stat. tit. 59, § 858-301.1
  url: null
  quoted_text: Any applicant convicted of a felony crime that substantially relates to the occupation
    of a real estate agent and poses a reasonable threat to public safety shall not be eligible to
    obtain a real estate license within ten (10) years of the completion of any criminal sentence,
    including parole and probation.
