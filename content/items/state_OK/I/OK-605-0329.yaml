stem: According to Oklahoma Statute § 858-303B, what is the latest date by which a broker must
  provide a detailed accounting of expenditures for fees collected in advance?
options:
  - Within ten (10) days after the time specified to perform the services.
  - Within thirty (30) days after the time specified to perform the services.
  - Within one (1) year from the date of the contract.
  - Within sixty (60) days after the time specified to perform the services.
key: C
explanation: The statute states that the accounting must be provided no longer than one (1) year
  from the date of the contract for such services. Therefore, the latest permissible date is one
  year from the contract date. The distractor stating ten (10) days after the time specified
  confuses the rule that applies only when no written request is made and relates to the timing
  after services, not as an absolute limit.
