stem: According to Oklahoma Statute § 858-202(D), from what source may the Governor select
  appointees to fill a vacancy on the Oklahoma Real Estate Commission?
options:
  - a list of not less than two qualified persons submitted by the Oklahoma Bar Association
  - a list of at least three qualified persons submitted by a statewide organization representing
    realtors
  - a list of not less than two qualified persons submitted by the Oklahoma Association of Realtors
  - a list of not less than two qualified persons submitted by the Commission's staff
key: C
explanation: The statute states that the Governor may select appointees from a list of not less than
  two qualified persons submitted by a statewide organization representing realtors. Therefore, the
  correct source is a list submitted by such an organization. The distractor that mentions 'at least
  three' is incorrect because the rule specifies a minimum of two, not three.
