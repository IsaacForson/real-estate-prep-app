stem: A licensee submits a single request that changes both the name and the address on the same
  license. Each change normally requires a separate fee, but the request is submitted promptly. How
  many fees must the Commission charge?
options:
  - Two fees will be charged
  - One fee will be charged
  - Three fees will be charged
  - No fee will be charged
key: B
explanation: Section 10-7-4(b) states that when a request involves more than one change and each
  would normally need a separate fee, the Commission shall require only one fee if the request is
  made in a timely manner. Therefore only one fee applies. The other options assume the standard
  separate‑fee rule or no fee, which the exception overrides.
citation:
