  url: null
  quoted_text: In the event a licensee's request involves more than one change to the license at the
    same time, and each individual change requires a separate fee elsewhere in the rules of this
    Chapter, the Commission shall only require that one fee be charged to reissue the license if the
    request is done in a timely manner.
