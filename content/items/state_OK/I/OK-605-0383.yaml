stem: A licensee posts an online advertisement offering to purchase a residential property but does
  not include any written statement indicating they hold a real estate license. According to
  Oklahoma Statute § 858‑312, what is the consequence of this omission?
options:
  - The licensee may continue the advertisement if they verbally disclose their license status
  - The licensee must withdraw the advertisement and submit a written disclosure to the Commission
  - The licensee may face penalties for not disclosing in writing that they are a licensee
  - The licensee must pay a fine determined by the Oklahoma Real Estate Commission
key: C
explanation: Advertising without a written disclosure that the person is a licensed real estate
  professional is listed as a disciplinary violation in Oklahoma Statute § 858‑312(20).
  Consequently, a licensee who fails to include the required written disclosure can be subject to
  penalties. A verbal disclosure does not satisfy the statutory writing requirement, so continuing
  the ad with only a verbal statement is not permissible. The statute does not require the ad to be
  withdrawn or a written notice to be sent to the Commission as a separate step. While penalties may
  include fines, the law does not specify that the Commission must set a particular fine amount for
  this violation.
