stem: A licensee pleads guilty to a felony offense on March 10. The court enters the judgment and
  sentencing on April 5. According to Oklahoma Statute § 858-301.2, by what date must the licensee
  notify the Commission in writing of the judgment and sentencing?
options:
  - On May 6.
  - On April 30.
  - On May 5.
  - On May 4.
key: C
explanation: The rule requires notification within thirty (30) days of the entering of an order of
  judgment and sentencing. Adding thirty days to April 5 yields May 5. The distractor On May 4
  results from miscounting the days by one.
