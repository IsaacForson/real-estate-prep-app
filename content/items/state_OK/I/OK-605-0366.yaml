stem: An associate hires an unlicensed assistant to show properties. The assistant accidentally
  discloses confidential client information to a third party. Under Oklahoma Administrative Code §
  10-11-1(c), who is responsible for the assistant's act?
options:
  - The associate alone bears responsibility.
  - The broker alone bears responsibility.
  - Both associate and broker are responsible.
  - Neither associate nor broker is responsible.
key: C
explanation: The rule states that an associate who employs an unlicensed assistant is responsible in
  conjunction with the broker for all real estate related activities of the unlicensed assistant.
  Therefore, both the associate and the broker share responsibility. The options assigning sole
  responsibility or no responsibility are inconsistent with the rule.
