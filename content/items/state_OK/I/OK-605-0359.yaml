stem: A property manager rents a furnished suite to a traveler for 35 days. Under Oklahoma Statute §
  858-301(8), is the manager exempt from licensing requirements?
options:
  - The manager is exempt because the rental period is less than thirty days.
  - The manager is not exempt because the rental period exceeds thirty days.
  - The manager is exempt because the property is furnished and rented for less than thirty days.
  - The manager is not exempt because the manager is not an employee of a licensed broker.
key: B
explanation: The exemption applies only to rentals of less than thirty days; a 35‑day rental exceeds
  that limit, so the manager is not exempt. The distractor claiming exemption because the property
  is furnished is incorrect because furnishing does not affect the time‑based exemption.
