stem: A broker receives an earnest money check from a buyer after the seller accepts the offer.
  According to Oklahoma Administrative Code § 10-13-1(a)(1)(D), by what deadline must the broker
  deposit the check into the trust account unless otherwise agreed in writing?
options:
  - By the end of the third banking day following acceptance or receipt unless otherwise agreed in
    writing
  - By the end of the first banking day following acceptance or receipt unless otherwise agreed in
    writing
  - By the end of the second banking day following acceptance or receipt unless otherwise agreed in
    writing
  - By the end of the fourth banking day following acceptance or receipt unless otherwise agreed in
    writing
key: A
explanation: The rule requires escrow funds to be deposited before the end of the third banking day
  following acceptance of an offer by an offeree or receipt of escrow funds unless otherwise agreed
  to in writing by all interested parties. Depositing earlier or later without agreement violates
  the rule.
