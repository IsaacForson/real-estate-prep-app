stem: A member of the Oklahoma Real Estate Commission is removed from office for neglect of duty.
  Who is responsible for filling the resulting vacancy?
options:
  - The Governor appoints the replacement with Senate consent
  - The Oklahoma Association of Realtors appoints the replacement
  - The Oklahoma Bar Association appoints the replacement
  - The Commission's Executive Director appoints the replacement
key: A
explanation: The law states that any vacancy on the Commission shall be filled by appointment of the
  Governor with the advice and consent of the Senate. The Bar Association, Realtors group, and
  Executive Director have no authority to fill vacancies under this provision.
