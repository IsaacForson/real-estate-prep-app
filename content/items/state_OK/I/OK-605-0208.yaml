stem: A broker collects a $300 fee in advance for a property management service to be performed in
  45 days. The client does not submit a written request for the accounting. According to Oklahoma
  Statute § 858-303B, by what date must the broker provide the detailed accounting of expenditures?
options:
  - By day 10 after the fee is paid
  - By day 30 after the fee is paid
  - By day 55 after the fee is paid
  - By day 60 after the fee is paid
key: C
explanation: Under 59 O.S. § 858-303B, a broker must provide a detailed accounting of expenditures
  within ten days after the time specified to perform the service. Since the service is scheduled
  for 45 days after the advance fee is paid, the accounting is due 45 + 10 = 55 days after the fee
  is paid.
