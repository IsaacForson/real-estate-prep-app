stem: Which of the following is specifically listed as a cause for discipline under Oklahoma Statute
  § 858-312?
options:
  - Advertising a property without displaying the broker's phone number
  - Making a materially false or fraudulent statement in an application for a license
  - Failing to complete continuing education within the renewal period
  - Charging a flat fee for brokerage services instead of a commission
key: B
explanation: The statute explicitly lists making a materially false or fraudulent statement in a
  license application as a cause for discipline. The option about failing to complete continuing
  education is not mentioned in § 858-312 as a disciplinary cause.
