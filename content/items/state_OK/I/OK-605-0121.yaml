stem: After an applicant submits a national criminal history record check to the Oklahoma Real
  Estate Commission, what action must the Commission take pursuant to Oklahoma Statute §
  858-307.4(B)?
options:
  - Conduct an investigation in accordance with its rules
  - Issue the license immediately if no disqualifying offenses appear
  - Notify the applicant of approval within five business days
  - Forward the record to the Federal Bureau of Investigation for review
key: A
explanation: The statute mandates that upon receipt of criminal history, the Commission shall
  conduct an investigation in accordance with rules promulgated by the Commission. The other options
  describe actions not authorized by this provision.
