stem: Under Oklahoma Statute § 858-301.2, how soon must a licensee notify the Commission in writing
  after entering a guilty plea to a felony offense?
options:
  - Within sixty (60) days after the plea is taken.
  - Within ten (10) days after the plea is taken.
  - Within thirty (30) days after the plea is taken.
  - Within ninety (90) days after the plea is taken.
key: C
explanation: The statute requires licensees to notify the Commission in writing of a felony guilty
  plea within thirty (30) days after the plea is taken. The thirty‑day period is also required after
  the entry of judgment and sentencing. A ten‑day deadline is not prescribed, and longer periods
  exceed the statutory requirement.
