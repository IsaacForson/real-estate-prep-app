    2025) — § 858-301.2
  url: null
  quoted_text: notify the Commission in writing of the conviction or plea of guilty or nolo contendere
    to any felony offense within thirty (30) days after the plea is taken and also within thirty
    (30) days of the entering of an order of judgment and sentencing.
