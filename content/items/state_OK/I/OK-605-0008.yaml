explanation: The statute conditions eligibility to sit for the provisional sales associate
  examination on completing ninety clock hours of Commission-approved basic real estate instruction.
citation:
  source: Okla. Stat. tit. 59, § 858-302
  url: null
  quoted_text: Any person eighteen (18) years of age or older who shall submit to the Commission
    evidence of successful completion of ninety (90) clock hours or its equivalent as determined by
    the Commission of basic real estate instruction in a course of study approved by the Commission,
    may apply to the Commission to take an examination for the purpose of securing a license as a
    provisional sales associate.
