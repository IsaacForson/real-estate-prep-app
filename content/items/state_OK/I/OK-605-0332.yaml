stem: An applicant receives approval of their real estate license application from the Oklahoma Real
  Estate Commission. How long is the approved application valid before it expires, according to
  Oklahoma Administrative Code § 10-3-3(a)(1)?
options:
  - Twelve (12) months
  - Twenty‑four (24) months
  - Six (6) months
  - Nine (9) months
key: A
explanation: The rule states that an approved application shall be valid for one (1) year. One year
  equals twelve months. Therefore the correct answer is twelve months. The other options represent
  incorrect durations not supported by the rule.
