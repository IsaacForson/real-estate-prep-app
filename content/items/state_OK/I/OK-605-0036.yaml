stem: If the Commission determines an applicant is **NOT** qualified, how many days does it have to
  give notice of denial after its ruling?
options:
  - 5 days
  - 10 days
  - 15 days
  - 30 days
key: C
explanation: The correct answer is 15 days because the Commission must give notice of denial within
  fifteen (15) days after its ruling if it finds an applicant not qualified. The distractor 10 days
  is wrong; it confuses the notice period with the shorter time frame used for other Commission
  actions.
