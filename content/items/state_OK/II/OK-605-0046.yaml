stem: A broker wants a sales associate to show a property and present offers to a prospective buyer.
  According to Section 858-363 of the Oklahoma Real Estate License Code, what may the broker do?
options:
  - The broker may authorize the sales associate to provide brokerage services in the name of the
    broker, which may include the execution of written agreements.
  - The broker may require the sales associate to obtain a separate broker license before showing
    the property.
  - The broker may allow the sales associate to enter into a brokerage agreement with the buyer in
    the associate's own name.
  - The broker may permit the sales associate to receive the commission directly from the buyer for
    services rendered.
key: A
explanation: "Section 858-363 states that a real estate broker may authorize associates to provide
  brokerage services in the name of the broker, which may include the execution of written
  agreements. The other options contradict the statute: associates cannot enter agreements in their
  own name, cannot receive commission directly, and do not need a separate broker license to act
  under the broker's authorization."
