stem: A broker represents a buyer in a purchase. When the seller makes an offer, what must the
  broker tell the buyer in writing about the transaction under the duties owed only to a represented
  party?
options:
  - That the broker will keep the offer details confidential
  - That the buyer owes certain costs and their approximate amount
  - That the buyer may waive the duty to receive written counteroffers
  - That the seller is willing to accept less than the listed price
key: B
explanation: This duty runs only to the party the broker represents and requires written notice,
  when an offer is made, of the costs that party will be expected to pay.
