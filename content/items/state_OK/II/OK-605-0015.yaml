stem: A prospective seller privately tells the listing broker that she would accept less than the
  listed price if pressed. Which duty governs the broker's handling of that statement?
options:
  - The duty to keep a party's confidential information confidential
  - The duty to present timely any written offers and counteroffers
  - The duty to disclose compensation and fees to the represented party
  - The duty to timely account for money and property received by the broker
key: A
explanation: A party's willingness to accept less than the asking price is confidential information
  the broker must not disclose without the required consent.
