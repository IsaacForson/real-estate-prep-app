stem: A broker agrees to represent both the buyer and the seller in a residential sale but informs
  the seller that the broker will not assist with the buyer's loan application process. What must
  the broker do to comply with Section 858-355.1(E)?
options:
  - Record the omission in the broker's file only for the seller
  - Give written notice to the buyer about the omitted step
  - Give written notice to the seller about the omitted step
  - Give oral notice to the seller about the omitted step
key: C
explanation: Section 858-355.1(E) requires written disclosure to the party for whom the broker is
  providing services, describing the omitted steps and stating that the other broker is not required
  to assist with those steps. Oral notice or mere recording does not satisfy the written disclosure
  requirement, and consent from the buyer is not mandated by this provision.
citation:
  source: Okla. Stat. tit. 59 (Oklahoma Real Estate License Code, §§ 858-101 to 858-605) — Oklahoma
    Real Estate License Code, 59 O.S. §§ 858-101 to 858-605 (OREC Code and Rules Book, as of Nov. 1,
    2025) — § 858-355.1(E)
  url: null
  quoted_text: If a broker intends to provide fewer brokerage services than those required to complete
    a transaction, the broker shall provide written disclosure to the party for whom the broker is
    providing brokerage services. Such disclosure shall include a description of those steps in the
    transaction for which the broker will not provide brokerage services, and also state that the
    broker assisting the other party in the transaction is not required to provide assistance with
    these steps in any manner.
