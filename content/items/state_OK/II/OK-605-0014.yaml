stem: A broker is negotiating a sale on behalf of a seller and a buyer submits a counteroffer. Which
  mandatory duty requires the broker to deal honestly with the buyer even though the buyer is
  **NOT** the broker's client?
options:
  - The duty to keep the seller informed regarding the transaction
  - The duty to inform the seller of expected brokerage service costs
  - The duty to disclose compensation to the represented party in writing
  - The duty to treat every party with honesty and reasonable care
key: D
explanation: This duty runs to all parties in a transaction, not only to the party the broker
  represents, requiring honest dealing and reasonable skill and care toward the buyer as well.
