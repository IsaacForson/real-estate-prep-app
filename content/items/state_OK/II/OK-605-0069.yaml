stem: A broker is representing a landlord in a lease transaction but does not prepare the lease
  contract. How must the broker comply with the written disclosure requirements under the Broker
  Relationships Act?
options:
  - provide the disclosures orally to the landlord and tenant
  - have the landlord sign a separate acknowledgment form
  - document compliance with the disclosure requirements in writing
  - attach the disclosures to the broker's commission agreement
key: C
explanation: Under 59 O.S. § 858-356, when a broker is involved in a transaction but does not
  prepare the contract, the broker must document compliance with the disclosure requirements in
  writing. Providing the disclosures orally does not satisfy this documentation requirement.
