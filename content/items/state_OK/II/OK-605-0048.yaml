stem: A broker is involved in a real estate transaction but did not prepare the purchase contract.
  According to Section 858-356 of the Oklahoma Real Estate License Code, how must the broker confirm
  the written disclosures required by Section 858-355.1(C)?
options:
  - The broker must provide the disclosures verbally and note the conversation in the file.
  - The broker must obtain written confirmation from the seller that the disclosures were provided.
  - The broker must have the buyer sign the disclosures on a separate form attached to the contract.
  - The broker must document compliance with the disclosure requirements.
key: D
explanation: Section 858-356 states that when a broker is involved in a transaction but does not
  prepare the contract, compliance with the disclosure requirements shall be documented by the
  broker. The other options add actions not required by the statute, such as obtaining signatures on
  a separate form or seller confirmation, which are not specified.
citation:
