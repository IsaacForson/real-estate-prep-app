stem: A broker cooperates with a second broker representing the buyer in the same sale. Under the
  Act's abrogation of common-law agency principles, what relationship may the first broker have
  toward the buyer's broker?
options:
  - The broker automatically becomes a subagent of the buyer's broker
  - The broker may cooperate without becoming an agent or dual agent
  - The broker is barred from cooperating with the buyer's broker
  - The broker becomes a dual agent representing both brokers' clients
key: B
explanation: The Act replaces common-law agency concepts, so a cooperating broker may work with
  another broker on a transaction without becoming an agent, subagent, or dual agent.
