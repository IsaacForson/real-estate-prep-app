stem: A listing agreement between a broker and a seller closes without a written provision extending
  the broker's duties. After closing, which obligations does the broker still owe the former seller
  under the Act?
options:
  - To account for the money and keep confidences private
  - Every duty listed in the Act, unchanged from before the closing
  - No further obligations of any kind to the former seller
  - Just the duty to present any future written offers to the seller
key: A
explanation: Absent a written agreement extending them, the Act narrows a broker's post-transaction
  obligations to accounting for money and property and keeping confidential information
  confidential.
