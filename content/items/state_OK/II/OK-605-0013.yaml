stem: Under the Broker Relationships Act, is a party to a real estate transaction vicariously liable
  for the acts or omissions of the real estate licensee providing brokerage services to that party?
options:
  - Yes, the party is vicariously liable for every act of the licensee
  - Yes, when the licensee acts as a dual agent
  - No, the party is not vicariously liable for those acts
  - No, unless the party signed the brokerage agreement
key: C
explanation: The statute expressly shields a party to a transaction from vicarious liability for the
  acts or omissions of the licensee providing brokerage services.
citation:
  source: Okla. Stat. tit. 59, § 858-362
  url: null
  quoted_text: A party to a real estate transaction shall not be vicariously liable for the acts or
    omissions of a real estate licensee who is providing brokerage services under Sections 858-351
    through 858-363 of The Oklahoma Real Estate License Code.
