stem: A buyer verbally tells the broker that they are willing to pay $5,000 more than the seller's
  asking price. The seller asks the broker to put this counteroffer in writing. According to
  Oklahoma Statutes Title 59, Section 858-353(A)(2)(b), what must the broker do?
options:
  - Ignore the request because the counteroffer was not submitted in writing initially.
  - Reduce the counteroffer to a written form and present it to the seller.
  - Inform the seller that only written offers from the buyer are required to be reduced to writing.
  - Wait for the buyer to submit a written counteroffer before taking any action.
key: B
explanation: Under 59 O.S. § 858-353(A)(2)(b), a broker must reduce offers or counteroffers to
  written form upon request of any party to a transaction, regardless of how the offer was initially
  communicated. Therefore, the broker must put the counteroffer in writing and present it to the
  seller. The idea that only written offers need to be reduced is incorrect because the duty applies
  to any offer or counteroffer when a party requests a written version.
