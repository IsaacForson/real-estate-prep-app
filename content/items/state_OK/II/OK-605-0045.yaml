stem: Under the Broker Relationships Act definitions, what does the term 'Broker' mean?
options:
  - The term "Broker" means a real estate broker, an associated broker associate, sales associate,
    or provisional sales associate authorized by a real estate broker to provide brokerage services.
  - The term "Broker" means a real estate broker who supervises sales associates, handles listings,
    and negotiates contracts for clients.
  - The term "Broker" means a licensed professional authorized to represent buyers or sellers in
    real estate transactions and receive compensation for services rendered.
  - The term "Broker" means an individual who holds a current real estate license and is authorized
    to engage in brokerage activities on behalf of clients.
key: A
explanation: The definition of 'Broker' in Section 858-351 explicitly includes a real estate broker,
  associated broker associate, sales associate, or provisional sales associate authorized by a real
  estate broker to provide brokerage services. The other options add elements not in the statute,
  such as supervising associates or representing clients, which are not part of the statutory
  definition.
