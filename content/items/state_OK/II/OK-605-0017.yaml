stem: A broker plans to provide brokerage services to both the buyer and the seller in the same
  transaction. When must the broker disclose in writing the duties owed under the Act to those
  parties?
options:
  - Within ten days after the parties sign the purchase contract
  - At the closing of the transaction, along with the settlement statement
  - Before the parties sign any contract on the property
  - If a party requests the disclosure in writing beforehand
key: C
explanation: The statute requires the written disclosure of a broker's duties to occur before the
  party or parties sign a contract to sell, purchase, lease, option, or exchange real estate.
citation:
  source: Okla. Stat. tit. 59, § 858-355.1
  url: null
  quoted_text: A broker who is providing brokerage services to one or both parties shall describe and
    disclose in writing the broker's duties and responsibilities set forth in Section 858-353 of The
    Oklahoma Real Estate License Code prior to the party or parties signing a contract to sell,
    purchase, lease, option, or exchange real estate.
