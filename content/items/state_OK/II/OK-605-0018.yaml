stem: A firm intends to provide brokerage services to both the buyer and the seller in one
  transaction. Under Commission rule on broker relationships, what must the firm give both parties
  before that dual arrangement begins?
options:
  - Written consent signed by the party the firm represents
  - Written notice filed directly with the Commission office
  - Written notice from the firm's designated managing broker
  - Written notice that the firm serves more than one party
key: D
explanation: Commission rule requires the firm to give both parties written notice that it is
  providing brokerage services to more than one party in the same transaction.
citation:
  source: Okla. Admin. Code § 605:10-15-2
  url: null
  quoted_text: When a ﬁrm provides brokerage services to more than one party to the transaction, the
    broker shall provide written notice to those parties that the broker is providing brokerage
    services to more than one party.
