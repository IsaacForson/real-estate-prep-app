stem: A prospective buyer submits a written request to a licensee asking whether the property was
  ever occupied by someone suspected of having AIDS. The owner refuses to provide the requested
  information. What must the licensee do under the Commission’s rule on psychological factors?
options:
  - inform the buyer that the owner refused to furnish the requested information
  - obtain the information from public health authorities despite the owner's refusal
  - disclose that the property is psychologically impacted regardless of the owner's response
  - terminate the buyer's agency agreement due to the owner's noncooperation
key: A
explanation: Under 605:10-15-3(6), when the owner refuses to furnish the requested information, the
  licensee must advise the purchaser/lessee of that refusal. Seeking the information from public
  health authorities despite the owner's refusal is not permitted by the rule.
