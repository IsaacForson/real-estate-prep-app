stem: Under Oklahoma Administrative Code provisions for psychologically impacted property, what must
  a real estate licensee do before making an inquiry of the owner about a psychological factor?
options:
  - The licensee must receive a written request from the purchaser/lessee stating that the factor is
    important to the decision.
  - The licensee must obtain a signed affidavit from the purchaser/lessee before any inquiry is made.
  - The licensee must first disclose the factor to the seller and obtain written consent from the
    seller.
  - The licensee must verify the factor through an independent third‑party investigation and report
    findings.
key: A
explanation: The rule requires the licensee to receive a written request from the purchaser/lessee
  that states the factor is important to the decision before any inquiry is made. The other options
  add steps not required by the rule, such as obtaining an affidavit or disclosing to the seller.
