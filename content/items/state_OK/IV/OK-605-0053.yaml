stem: According to Oklahoma Administrative Code Title 605, Chapter 10, how must the Residential
  Property Condition Disclosure Statement forms be made available to the public?
options:
  - They must be provided free of charge at any brokerage office.
  - They must be available to the public upon request.
  - They must be posted on the Commission’s website within one day.
  - They must be mailed to every licensee within three days.
key: B
explanation: The rule explicitly states that the forms shall be available to the public upon
  request. It does not require them to be free of charge at brokerage offices, posted on the website
  within a specific timeframe, or mailed automatically to licensees.
