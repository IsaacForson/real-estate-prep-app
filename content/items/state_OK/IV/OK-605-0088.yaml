stem: A buyer calls a licensee and asks verbally whether the property has ever been the site of a
  suicide. The licensee tells the buyer that they cannot proceed unless the request is made in
  writing. Which provision of the Oklahoma Administrative Code justifies the licensee's action?
options:
  - The licensee must disclose all known psychological factors regardless of request format.
  - The licensee must receive a written request from the purchaser/lessee before making any inquiry.
  - The licensee must proceed with a verbal request if the buyer signs a waiver.
  - The licensee must first obtain a court order to inquire about psychological factors.
key: B
explanation: The rule requires the licensee to receive a written request from the purchaser/lessee
  before inquiring about psychological factors. The other options add conditions—such as requiring a
  court order, a waiver, or unconditional disclosure—that are not supported by the rule.
