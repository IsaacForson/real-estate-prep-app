stem: Under Oklahoma law, which statement is true regarding disclosure of psychologically impacted
  real estate?
options:
  - It is not a material fact that must be disclosed in a real estate transaction.
  - It must be disclosed if the buyer requests it in writing.
  - It must be disclosed if the seller is aware of the psychological impact.
  - It must be disclosed only for commercial properties.
key: A
explanation: Under §858-513(A), psychologically impacted real estate is explicitly stated not to be
  a material fact that must be disclosed. Therefore, the correct answer is that disclosure is not
  required. The distractor suggesting disclosure upon a buyer’s written request is incorrect because
  the statute only obligates the licensee to inquire of the owner, not to disclose the information.
