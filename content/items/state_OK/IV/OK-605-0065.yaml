stem: A licensee receives a written complaint notice from the Oklahoma Real Estate Commission on
  March 1, 2026, via email. According to Oklahoma Administrative Code Title 605, Chapter 10, Section
  10-17-2(b), what is the latest date by which the licensee must file an adequate written response
  to avoid being considered in default?
options:
  - March 16, 2026.
  - March 15, 2026.
  - March 17, 2026.
  - March 31, 2026.
key: A
explanation: Under 605:10-17-2(b), a licensee who receives notice of a complaint must file an
  adequate written response within fifteen (15) days of that notice. Counting fifteen days from
  March 1, 2026 gives a deadline of March 16, 2026, so responding by that date avoids default. The
  distractor “March 15, 2026” assumes the fifteen‑day period ends one day early, which contradicts
  the rule’s plain language. The other distractors either subtract or add days incorrectly.
