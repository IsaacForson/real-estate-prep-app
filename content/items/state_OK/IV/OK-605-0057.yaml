stem: A prospective buyer submits a written request to a real estate licensee asking whether any
  prior occupant of the property had been infected with AIDS. The licensee forwards the request to
  the property owner, who refuses to provide the information. According to Oklahoma Administrative
  Code, what must the licensee do next?
options:
  - The licensee must advise the purchaser/lessee that the owner refused to furnish the requested
    information.
  - The licensee must inform the purchaser/lessee of the owner's refusal and continue with the
    transaction.
  - The licensee must tell the purchaser/lessee that the licensee will assume the answer is negative
    and proceed.
  - The licensee must seek a court order to compel the owner to provide the requested information.
key: A
explanation: The rule explicitly states that if the owner refuses to furnish the requested
  information, the licensee shall so advise the purchaser/lessee. The other options either add
  unnecessary actions or fail to meet the mandatory advising requirement.
