stem: A licensee provides a buyer with an appraisal that states the property's square footage as
  2,200 sq ft, but fails to identify the appraisal as the source of that information. The buyer
  later discovers the actual size is 1,900 sq ft and sues for damages. Under Oklahoma Real Estate
  License Code, what is the licensee's liability for failing to disclose the source of the
  third‑party information?
options:
  - The licensee is liable for actual damages only, but only if the failure to disclose the source
    was knowing.
  - The licensee is liable for actual and punitive damages regardless of knowledge.
  - The licensee is liable for no damages because providing third‑party information is generally not
    a warranty.
  - The licensee is liable for the difference in square footage multiplied by the average price per
    square foot.
key: A
explanation: The statute provides that damages are recoverable only when the licensee knowingly
  violates the duty to disclose the source, and the sole remedy is actual damages, excluding
  exemplary or punitive damages. The other options misstate the liability standard, the availability
  of punitive damages, or the measure of damages.
citation:
  source: Okla. Stat. tit. 59 § 858-515.2
  url: null
  quoted_text: >-
    a party to the real estate transaction may recover damages from the 

    licensee in a civil action only when a licensee knowingly violates the duty to disclose the
    source of 

    the information, as required in paragraph 1 of subsection B of Section 1 of this act.

    B. The sole and exclusive civil remedy at common law or otherwise for a violation of paragraph
    1 

    of subsection B of Section 1 of this act by a real estate licensee shall be an action for
    actual 

    damages suffered by the party as a result of such violation and shall not include exemplary or 

    punitive damages
