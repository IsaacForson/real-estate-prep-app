stem: Under Oklahoma Statute Title 59, Section 858-514, what duty does a licensed real estate
  licensee have regarding information about a person required to register under the Sex Offenders
  Registration Act or the Mary Rippy Violent Crime Offenders Registration Act?
options:
  - Must disclose any known information about the offender to all parties
  - Must disclose only if the offender is a current tenant of the property
  - Must not disclose any information regarding such an offender
  - Must obtain a written waiver from the buyer before withholding info
key: C
explanation: The statute explicitly states that the provisions of the Sex Offenders Registration Act
  and the Mary Rippy Violent Crime Offenders Registration Act shall not be construed as imposing a
  duty upon a licensee to disclose any information regarding an offender required to register.
  Therefore, the licensee has no duty to disclose such information. The distractor that suggests a
  duty to disclose any known information contradicts the statutory language.
