stem: After submitting a written request to the property owner asking whether any occupants have a
  contagious disease, the licensee receives a refusal from the owner to provide the information.
  What must the licensee do next according to Oklahoma Administrative Code § 10-15-3?
options:
  - The licensee must advise the purchaser/lessee that the owner refused to furnish the information.
  - The licensee must file a complaint with the Oklahoma Real Estate Commission regarding the
    refusal.
  - The licensee must conduct an independent investigation of the property's history to verify the
    factor.
  - The licensee must withhold the earnest money deposit until the owner provides the requested
    information.
key: A
explanation: The rule requires that if the owner refuses to furnish the requested information, the
  licensee must advise the purchaser/lessee of that refusal. The other choices—filing a complaint
  with the commission, conducting an independent investigation of the property's history, or
  withholding the earnest money deposit—are not required by the rule.
