stem: A buyer informs the licensee in writing that knowledge of whether the property was the site of
  a suicide is important to their decision. What must the licensee do under Oklahoma law?
options:
  - Disclose the suicide history without owner consent
  - Make inquiry of the owner and report findings with consent
  - Ignore the buyer's written request about psychological impacts
  - End the agency relationship with the buyer immediately
key: B
explanation: Section 858-513(C) requires the licensee to make inquiry of the owner and report any
  findings to the buyer with the owner's consent when the buyer advises in writing that the
  psychological factor is important. Disclosing without consent is incorrect because the statute
  mandates owner consent before reporting findings.
