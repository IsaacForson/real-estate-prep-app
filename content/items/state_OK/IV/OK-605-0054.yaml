stem: A prospective buyer provides a licensee with a written request asking whether the home was
  ever the site of a suicide. According to Oklahoma Statute Title 59, Section 858-513, what action
  must the licensee take?
options:
  - The licensee must disclose the suicide history without owner consent.
  - The licensee must inform the buyer that disclosure is not required.
  - The licensee must inquire of the owner and, with consent, report findings to the buyer.
  - The licensee must refuse to answer any questions about stigmatized history.
key: C
explanation: The statute provides that if a purchaser advises in writing that knowledge of a
  psychologically impacted factor is important, the licensee must inquire of the owner and report
  any findings with the owner's consent. Simply informing the buyer that disclosure is not required
  ignores this duty triggered by a written request.
