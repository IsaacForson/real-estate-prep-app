stem: Under Oklahoma law, what is the Commission's responsibility regarding the Residential Property
  Condition Disclosure Statement and Residential Property Condition Disclaimer Statement?
options:
  - Approve all real estate advertising and marketing
  - Provide the forms to every buyer and seller
  - Develop and amend the disclosure forms by rule
  - Require licensees to guarantee property size
key: C
explanation: The Commission must develop and amend the disclosure forms by rule under §10-15-4(a).
  Providing the forms to every party is not required; the Commission only makes them available upon
  request.
