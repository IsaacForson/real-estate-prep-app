stem: A title insurance company intends to record a release of an Oregon trust deed after the
  obligation is satisfied. Under ORS 86.720, how must the company provide notice of its intention to
  record the release?
options:
  - Sent by certified mail with return receipt requested to the beneficiary and any successor in
    interest, and also to the loan servicer if applicable.
  - Sent by publication in a newspaper of general circulation once a week for two consecutive weeks,
    with an affidavit of publication filed with the county clerk.
  - Sent by personal delivery to the beneficiary at the property address, with a signed receipt
    obtained at the time of delivery, and a copy retained in the company’s records.
  - Sent by first class mail with postage prepaid, addressed to the named interested parties at
    their last-known addresses, including post office boxes.
key: D
explanation: ORS 86.720(3)(b) requires that notice of the intention to record a release be sent by
  first‑class mail with postage prepaid to each named interested party at their last‑known address,
  and that post office boxes are acceptable. The answer that describes notice being sent by
  first‑class mail with postage prepaid to the named interested parties at their last‑known
  addresses, including post office boxes, therefore meets the statutory requirement. The other
  choices describe certified mail with return receipt, newspaper publication, or personal delivery,
  none of which are mandated by the statute.
