stem: Under ORS 86.050, if a mortgagee pays delinquent property taxes on behalf of the mortgagor,
  how is that amount treated?
options:
  - A sum that must be reimbursed within thirty days
  - A deduction from the outstanding principal balance
  - An amount added to the mortgage debt and secured by the mortgage
  - A gift that cannot be recovered from the mortgagor
key: C
explanation: ORS 86.050 states that when a mortgagor fails to pay taxes and the mortgagee pays them,
  the amount paid is added to the mortgage debt and remains secured by the mortgage. It is not a
  gift, nor must it be reimbursed within a set period, nor does it reduce the principal. Hence, the
  correct treatment is that the payment increases the secured debt.
