stem: According to ORS 86.010, what is the nature of a mortgagee’s interest in real property?
options:
  - A right to collect rents without foreclosure proceedings
  - A lien that does not convey title to the property
  - A conveyance that permits immediate possession upon default
  - An absolute deed that transfers ownership outright
key: B
explanation: Under ORS 86.010, a mortgage of real property is not a conveyance that gives the
  mortgagee the right to take possession without foreclosure and sale. Therefore, the mortgagee’s
  interest is a lien, not a title transfer. The other options incorrectly describe immediate
  possession, absolute deed, or rent collection rights, which the statute does not grant.
