stem: A borrower satisfies the obligation secured by an Oregon trust deed on June 1. According to
  ORS 86.720, by what date must the trustee reconvey the property to the borrower if the beneficiary
  delivers a written reconveyance request on the same day?
options:
  - June 30, 2025
  - July 1, 2025
  - July 2, 2025
  - June 15, 2025
key: B
explanation: ORS 86.720(1) requires the trustee to reconvey within 30 days after receiving the
  beneficiary’s written request. If the request is delivered on June 1, the 30‑day period ends on
  July 1, making that the reconveyance deadline. The June 30 option mistakenly measures 30 days from
  the performance date rather than from the request date.
