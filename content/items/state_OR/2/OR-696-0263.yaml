stem: According to OAR 863-015-0259(4), what must the authorized principal broker's ledger account
  show for each fund received in professional real estate activity?
options:
  - From whom the funds were received, the date received, the date deposited, where deposited, and
    the date the funds were returned to the offeror
  - From whom the funds were received, the date received, the date deposited, where deposited, and
    the final disposition of the funds
  - From whom the funds were received, the date received, the date deposited, where deposited, and
    the client's file number
  - From whom the funds were received, the date received, the date deposited, where deposited, and
    the amount of any service fees deducted
key: B
explanation: The rule requires the ledger to show the source, receipt date, deposit date, deposit
  location, and final disposition of funds. Recording service fees is not mandated by this
  provision.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — § 863-015-0259
  url: null
  quoted_text: "(4) Authorized principal brokers must maintain a complete ledger account and record
    all funds received in their professional real estate activity. This ledger account must show:
    (a) From whom the funds were received, (b) The date the funds were received, (c) The date the
    funds were deposited, (d) Where the funds were deposited, and (e) When the transaction has been
    completed or the offer has failed, the final disposition of the funds."
