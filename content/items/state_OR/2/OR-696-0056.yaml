stem: According to OAR 863-015-0257(8), if interest earned in a clients’ trust account under OAR
  863-015-0265 inures to the benefit of the managing principal broker, within how many calendar days
  must such interest be disbursed to the managing principal broker?
options:
  - Five calendar days
  - Seven calendar days
  - Ten calendar days
  - Thirty calendar days
key: C
explanation: The rule states that interest earned in a clients’ trust account that benefits the
  managing principal broker must be disbursed within ten calendar days from the date of the bank
  statement on which the interest first appears. Therefore, ten calendar days is the required
  timeframe. The distractor of five calendar days incorrectly applies the banking‑day deadline for
  delivering earnest money to the principal broker, which does not govern interest disbursement.
