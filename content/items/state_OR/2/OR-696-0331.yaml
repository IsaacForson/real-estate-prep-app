stem: A continuing education provider stores all course completion records electronically and does
  not maintain any paper copies. According to OAR 863-020-0000(3)(B), what must the provider do to
  comply with the rule?
options:
  - The provider must store records in a cloud-based system approved by the Agency.
  - The provider may keep records exclusively in electronic format without any paper backup.
  - The provider must maintain required records in paper or electronic format, as directed by the
    Agency.
  - The provider must convert all electronic records to paper format within 30 days.
key: C
explanation: The rule obligates providers to maintain required records in paper or electronic
  format, as directed by the Agency. Simply keeping records exclusively in electronic format does
  not guarantee compliance unless the Agency has directed that format, and the rule does not permit
  unilateral choice.
