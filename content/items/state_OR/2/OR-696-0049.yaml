stem: A broker opens a clients’ trust account in Oregon. According to OAR 863-015-0255(2), within
  how many business days must the authorized principal broker notify the Agency using the online
  process?
options:
  - 15 business days
  - 20 business days
  - 5 business days
  - 10 business days
key: D
explanation: OAR 863-015-0255(2) states that within 10 business days from the date a clients’ trust
  account is opened, the authorized principal broker must notify the Agency using the online
  process. The distractor of 5 business days is incorrect because the rule specifies a 10‑day
  window, not a shorter period.
