stem: Under Oregon administrative rules, what must be done with computerized trust account records
  when preparing the monthly reconciliation for filing?
options:
  - The broker must print out the computerized records for filing with the reconciliation.
  - The broker must keep the computerized records in electronic format only.
  - The broker must delete the computerized records after reconciliation is complete.
  - The broker must transfer the computerized records to a third-party auditor.
key: A
explanation: The rule explicitly states that if trust account records are computerized, they must be
  printed out for filing with the reconciliation. Keeping the records only in electronic format does
  not satisfy this requirement because the rule mandates a printed copy for the reconciliation file.
