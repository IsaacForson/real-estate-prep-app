stem: According to OAR 863-015-0257(1), within what timeframe must a real estate broker deliver any
  money received while conducting professional real estate activity to the authorized principal
  broker?
options:
  - Within five banking days
  - Within seven banking days
  - Within three banking days
  - Within ten banking days
key: C
explanation: "The rule states that a broker must deliver to the authorized principal broker within
  three banking days any money received while conducting professional real estate activity. The
  other timeframes correspond to different rules: five banking days apply to non‑earnest funds, and
  ten calendar days apply to disbursement of forfeited earnest money or interest."
citation:
