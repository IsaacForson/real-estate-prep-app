stem: During a trust account reconciliation, an authorized principal broker identifies several
  outstanding checks. According to OAR 863-015-0275(5), what information must the broker include for
  each outstanding check?
options:
  - The broker must list the check number, issue date, and payee only.
  - The broker must list the check number, issue date, payee, and amount.
  - The broker must list the check number, payee, and bank branch.
  - The broker must list the check number, amount, and bank name.
key: B
explanation: The rule requires that outstanding checks be listed by check number, issue date, payee,
  and amount. Omitting the amount or substituting other details such as bank name does not meet this
  specification.
