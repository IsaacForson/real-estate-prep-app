stem: An authorized principal broker accepts a credit card payment for earnest money but does not
  have a separate written agreement with the cardholder authorizing a reduction for merchant fees.
  According to OAR 863-015-0257(5), what amount must the broker maintain, use, and refund as
  necessary?
options:
  - The face amount of the credit card payment, without reducing it by any merchant's discount or
    processing fee
  - The face amount of the credit card payment, plus any merchant's discount and processing fee
  - The face amount of the credit card payment, reduced by any merchant's discount and processing fee
  - The net amount received after deducting the merchant's discount and processing fee
key: A
explanation: The rule requires that, without a written agreement allowing a reduction for merchant
  fees, the broker must keep, use, and refund the full face amount of the credit card payment, not
  deducting any discount or fee. The option describing the net amount after deducting the merchant's
  discount and processing fee would only be correct if such a written agreement existed.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-015-0257
  url: null
  quoted_text: (a) The face amount of the credit card payment, without reducing the face amount by any
    merchant's discount and processing fee charged to the principal broker, is the amount he or she
    must maintain, use, and refund as necessary;
