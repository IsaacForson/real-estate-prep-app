stem: A buyer delivers earnest money to a principal broker under a written purchase agreement. The
  seller later disputes the disbursal of the funds and demands release. What must the authorized
  principal broker do as soon as practicable after receiving the demand?
options:
  - Deliver written notice to all parties that a demand has been made and that funds may be
    disbursed to the delivering party within 20 calendar days
  - Deliver written notice to all parties that a demand has been made and that funds must be held
    until a court order is issued
  - Deliver written notice to all parties that a demand has been made and that funds may be
    disbursed immediately to the demanding party
  - Deliver written notice to all parties that a demand has been made and that funds may be
    disbursed only after both parties sign a release
key: A
explanation: The rule requires the broker to deliver written notice to all parties that a demand has
  been made and that funds may be disbursed to the party who delivered the funds within 20 calendar
  days of the demand. This notice must be sent as soon as practicable after the demand. The
  distractor claiming funds must be held until a court order is issued is incorrect because the rule
  allows disbursement after the 20‑day period if no written agreement or proof of a legal claim is
  provided.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-015-0186
  url: null
  quoted_text: As soon as practicable after receiving a demand by one of the parties for the disbursal
    of funds in a clients’ trust account, the authorized principal broker must deliver written
    notice to all parties that a demand has been made for disbursal of the funds, and that such
    funds may be disbursed to the party who delivered the funds within 20 calendar days of the date
    of the demand.
