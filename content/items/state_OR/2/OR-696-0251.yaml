stem: Under OAR 863-015-0257, who must deliver to the authorized principal broker within three
  banking days any money, checks, drafts, warrants, promissory notes, or other consideration
  received while conducting professional real estate activity?
options:
  - Only the managing principal broker
  - Only the buyer's agent in the transaction
  - A real estate broker or principal broker
  - Only the escrow officer handling the funds
key: C
explanation: The rule requires a real estate broker or principal broker to deliver all received
  funds to the authorized principal broker within three banking days. This applies to any
  consideration received while conducting professional real estate activity. The distractor that
  mentions only the buyer's agent is incorrect because the buyer's agent is not responsible for
  delivering funds to the authorized principal broker under this rule.
