stem: A licensee receives a check from a buyer that is payable to the seller and transmits the check
  to the seller for the purpose of transmitting it. According to ORS 696.241(13), what is the
  licensee’s obligation regarding depositing that check into a clients’ trust account?
options:
  - The licensee must deposit the check into a clients’ trust account within three banking days.
  - The licensee must obtain written approval from all parties before depositing the check.
  - The licensee may hold the check un-deposited until the offer is accepted or rejected.
  - The licensee is exempt from depositing the check into a clients’ trust account.
key: D
explanation: ORS 696.241(13) expressly exempts a licensee who receives a check payable to a property
  owner or seller and transmits it for that purpose from the deposit requirements of subsections (2)
  and (3). Therefore, the licensee is not required to deposit the check into a trust account. The
  most tempting distractor incorrectly imposes a three‑day deposit deadline, which applies only to
  earnest money received by brokers, not to this exempt transmission.
