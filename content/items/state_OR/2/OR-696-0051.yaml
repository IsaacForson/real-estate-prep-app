stem: A broker receives an earnest money check made payable to the seller. According to OAR
  863-015-0259(2), which of the following must the broker keep for that check?
options:
  - Date received, name of payor, purpose of payment, and file reference assigned to the offer or
    transaction and the transaction number
  - Date received, name of payor, purpose of payment, file reference assigned to the offer or
    transaction, and date delivered to seller and the time of delivery
  - Date received, name of payor, purpose of payment as indicated on the check, date delivered to
    seller, and documentation of delivery to the seller
  - Date received, name of payor, purpose of payment, file reference assigned to the offer or
    transaction, date delivered to seller, and documentation of delivery to the seller
key: D
explanation: "According to OAR 863-015-0259(2), a broker must keep six items for checks payable to
  the seller: the date received, the payor’s name, the purpose of the payment, the file reference
  assigned to the offer or transaction, the date delivered to the seller, and documentation of that
  delivery. The option that does not include the file reference fails to meet this requirement."
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-015-0259
  url: null
  quoted_text: "(2) For all checks received under OAR 863-015-0257 made payable to the seller, the
    principal broker must also keep the following information: (a) Date received, (b) Name of payor,
    (c) Purpose of payment, (d) File reference assigned to the offer or transaction, (e) Date
    delivered to seller, and (f) Documentation of delivery to the seller."
