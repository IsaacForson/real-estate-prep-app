stem: A principal broker receives a written request to disburse disputed earnest money from a
  clients’ trust account. According to ORS 696.241(11), what is the maximum number of days allowed
  to complete the disbursal after the request is made?
options:
  - 10 days
  - 15 days
  - 20 days
  - 30 days
key: C
explanation: The rule states that the procedure for disbursing disputed funds must allow disbursal
  not more than 20 days after a request is made (Or. Rev. Stat. § 696.241(11)). Therefore, the
  maximum allowable period is 20 days. A common mistake is to recall the 10‑business‑day
  notification requirement for trust accounts, which would incorrectly suggest 10 days.
