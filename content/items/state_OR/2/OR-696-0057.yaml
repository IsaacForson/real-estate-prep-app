stem: A buyer gives an earnest money check to a broker. The written purchase agreement states that
  the broker will hold the check un-deposited until the offer is accepted or rejected, and specifies
  that the check will be deposited into the broker's clients' trust account within two business days
  after acceptance. According to OAR 863-015-0257(2)(a), what may the broker do with the check
  before the offer is accepted or rejected?
options:
  - Deposit the check immediately
  - Hold the check un-deposited
  - Cash the check for personal use
  - Return the check to the buyer
key: B
explanation: The rule allows a broker to hold an earnest money check un‑deposited until the offer is
  accepted or rejected when the written sale agreement states that the broker is holding the check
  un‑deposited and specifies where and when it will be deposited upon acceptance. Thus, holding the
  check un‑deposited is permitted. Depositing the check immediately would violate the agreement’s
  terms for holding the check un‑deposited.
citation:
  source: "### Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-015-0257(2)(a)"
  url: null
  quoted_text: The check may be held un-deposited until the offer is accepted or rejected, provided
    that the written sale agreement states that the real estate broker or principal broker is
    holding the check un-deposited and further states where and when the check will be deposited
    upon acceptance of the offer;
