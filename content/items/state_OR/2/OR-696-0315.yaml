stem: According to ORS 696.241(5), which type of funds may **NOT** be commingled with trust funds in
  a clients’ trust account?
options:
  - The earned interest on the trust account
  - The earned compensation for services
  - The personal funds of the broker
  - The funds held in a neutral escrow account
key: C
explanation: ORS 696.241(5) prohibits commingling any other funds with trust funds except earned
  interest and earned compensation. Therefore, personal funds of the broker may not be commingled.
  The distractor about funds held in a neutral escrow account is incorrect because such funds are
  not an allowed exception under the statute.
citation:
  source: Or. Rev. Stat. § 696.241(5)
  url: null
  quoted_text: "A principal real estate broker or licensed real estate property manager may not
    commingle any other funds with the trust funds held in a clients’ trust account, except for: (a)
    Earned interest on a clients’ trust account as provided in subsections (7) and (8) of this
    section; and (b) Earned compensation as provided in subsection (9) of this section."
