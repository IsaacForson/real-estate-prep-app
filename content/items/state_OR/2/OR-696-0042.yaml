stem: A broker receives an earnest money check made payable to the seller. The buyer’s offer is
  accepted. According to OAR 863-015-0257(3), what must the broker do within three banking days
  following the acceptance?
options:
  - Deposit the check into the clients' trust account
  - Return the check to the buyer for reconsideration
  - Deposit the check with a licensed escrow agent
  - Deliver the check to the seller
key: D
explanation: When an earnest‑money check is payable to the seller, Oregon Administrative Rule
  863‑015‑0257(3) requires the broker to deliver that check to the seller within three banking days
  after the offer is accepted. The rule permits depositing a check into a trust account or an escrow
  account only when the check is not made payable to the seller, and the broker may not return the
  check to the buyer.
