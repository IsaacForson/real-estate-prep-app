stem: A managing principal broker allows an agent to use a debit card linked to the clients’ trust
  account to pay for office supplies. According to OAR 863-015-0255(6), what is the consequence of
  this action?
options:
  - A requirement that must be documented
  - A permissible practice with daily replacement
  - A violation that may lead to discipline
  - An allowed activity for trust expenses
key: C
explanation: OAR 863-015-0255(6) expressly prohibits a managing principal broker from using or
  allowing the use of any form of debit card on clients’ trust accounts. Permitting such use is a
  violation that may lead to discipline. The distractor about daily replacement is incorrect because
  no exception exists for debit card use.
