stem: Under Oregon administrative rules, what is the minimum frequency with which an authorized
  principal broker must reconcile each clients’ trust account?
options:
  - Once each month
  - Twice each month
  - Every two months
  - Only when needed
key: A
explanation: The rule states that an authorized principal broker must reconcile each clients’ trust
  account at least once each month. This establishes a monthly minimum; more frequent reconciliation
  is permitted but not required. The distractor suggesting twice each month incorrectly imposes a
  higher frequency that the rule does not mandate.
