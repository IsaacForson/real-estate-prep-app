stem: A broker receives a refund check for overpaid advertising that is not earnest money and is not
  made payable to the seller. According to OAR 863-015-0257(4), within how many banking days must
  the broker either deposit the funds into a clients’ trust account or deliver them to a licensed
  neutral escrow depository?
options:
  - 3 banking days
  - 5 banking days
  - 7 banking days
  - 10 banking days
key: B
explanation: For funds that are not earnest money, OAR 863-015-0257(4) mandates that the broker
  either deposit the funds into a clients’ trust account or deliver them to a licensed neutral
  escrow depository within five banking days of receipt. Thus the correct interval is five banking
  days. The three‑day option mistakenly applies the earnest‑money delivery timeline to non‑earnest
  funds.
citation:
  source: Or. Admin. R. § 863-015-0257(4)
  url: null
  quoted_text: "the real estate broker or principal broker within five banking days following receipt
    of the funds must: (a) Deposit the funds to a licensed neutral escrow depository located within
    this state; (b) Deposit the funds into a clients’ trust account established under ORS 696.241;
    or (c) For a check made payable to the seller, deliver the check to the seller."
