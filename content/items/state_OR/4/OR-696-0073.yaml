stem: A managing principal broker wants to authorize another managing principal broker to supervise
  their professional real estate activity while they are away for 60 days. According to Oregon
  administrative rule, which element must be included in the written authorization?
options:
  - The written authorization must include a list of all clients the authorizing broker served in
    the past year.
  - The written authorization must include the effective date and termination date of the
    authorization, which may not exceed 90 days.
  - The written authorization must include the supervising broker’s social security number.
  - The written authorization must include a copy of the authorizing broker’s personal tax return.
key: B
explanation: The rule requires the written authorization to state the effective date and the
  termination date, and the termination date may not be more than 90 days after the effective date.
  The authorization does not need to list the authorizing broker’s past clients, does not require
  the supervising broker’s social security number, and does not require a copy of the authorizing
  broker’s personal tax return.
