stem: A continuing education provider that is already certified under OAR 863-020-0030 wishes to
  offer the 26-hour broker advanced practices course for the first time. What must the provider do
  before offering the course for continuing education credit?
options:
  - Obtain separate course approval under OAR chapter 863 division 22
  - Ensure the course instructor holds a principal broker license
  - Submit the course outline to the Oregon Real Estate Board for review
  - Simply advertise the course as CE-eligible because they are already certified
key: A
explanation: The rule states that a certified provider may offer the broker advanced practices
  course only if both the provider and the course have been approved under OAR chapter 863, division
  22. Therefore, separate course approval is required. Simply holding a provider certification does
  not authorize offering that specific course.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) OAR 863-020-0050(2)
  url: null
  quoted_text: A continuing education provider may provide the broker advanced practices course, the
    principal broker advanced practices course, the property manager advanced practices course, or
    the brokerage administration and sales supervision course only if the provider and the course
    have been approved under OAR 863, division 22.
