stem: A managing principal broker signs a written supervisory agreement dividing control among
  several authorized principal brokers, and each keeps open records separated so agents on opposite
  sides of a deal cannot access confidential information. What is the effect on a transaction
  handled by agents supervised by different authorized principal brokers?
options:
  - It voids the supervisory agreement between the managing and authorized brokers
  - It requires each authorized principal broker to personally supervise closing
  - It converts every agent involved into an independent single agent for the deal
  - It creates a disclosed limited agency transaction for the managing broker
key: D
explanation: When a managing principal broker has delegated supervision this way and the
  open-records safeguard is followed, the rule treats the resulting transaction as disclosed limited
  agency for the managing principal broker only.
