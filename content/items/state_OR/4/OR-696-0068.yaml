stem: Under Oregon administrative rule, what percentage of voting stock or controlling ownership
  interest defines a subsidiary organization?
options:
  - The subsidiary organization owns 25 percent of the voting stock.
  - The subsidiary organization owns 40 percent of the voting stock.
  - The subsidiary organization owns 51 percent or more of the voting stock.
  - The subsidiary organization owns 75 percent of the voting stock.
key: C
explanation: The rule defines controlling ownership interest as owning 51 percent or more of the
  voting stock. Therefore the option stating that the subsidiary organization owns 51 percent or
  more of the voting stock is correct. The other options list different percentages and do not match
  the rule’s definition.
