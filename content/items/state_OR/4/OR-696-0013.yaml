stem: An unlicensed marketing coordinator identifies leads and forwards prospective buyer names to a
  principal broker to help close pending sales, without negotiating any terms. Under ORS 696.010,
  does this coordinator's role fall within “professional real estate activity”?
options:
  - Yes, because procuring prospects for a sale is covered
  - No, because negotiating the sale itself is what triggers coverage
  - No, because compensation was not actually promised
  - Yes, but the coordinator would also need a broker license
key: A
explanation: The statute includes assisting or directing in the procuring of prospects calculated to
  result in a sale as professional real estate activity, regardless of whether the person also
  negotiates the transaction.
