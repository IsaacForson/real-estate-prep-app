stem: A real estate broker collects earnest money from a buyer and receives no written instructions
  from the buyer about handling it. Under Oregon administrative rule, what must the broker do with
  that money?
options:
  - Hold it personally until the transaction closes and funds are disbursed
  - Return it to the buyer pending the seller's acceptance of the offer
  - Deposit it directly into the broker's own personal checking account
  - Transmit it to the principal broker within three banking days
key: D
explanation: Absent written instructions to the contrary from the buyer, the rule requires the
  broker to transmit all earnest monies to the authorized principal broker within three banking days
  of receipt.
