key: B
explanation: The statute defines a branch office as a business location, other than the designated
  main office, where professional real estate activity is regularly conducted or advertised as such.
citation:
  source: Or. Rev. Stat. § 696.010
  url: null
  quoted_text: “Branch office” means a business location, other than the main office designated under
    ORS 696.200, where professional real estate activity is regularly conducted or that is
    advertised to the public as a place where professional real estate activity may be regularly
    conducted.
