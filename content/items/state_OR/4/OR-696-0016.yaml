stem: A licensee agrees to prepare a competitive market analysis for a client, but only if the
  analysis reports a value the client has already decided on in advance. How should this arrangement
  be evaluated under ORS 696.301?
options:
  - It is a ground for discipline when the client is also a taxpayer under appeal
  - It is permitted because the client requested the predetermined value
  - It is permitted because competitive market analyses are informal opinions
  - It is a ground for discipline given the fee tied to a preset value
key: D
explanation: ORS 696.301 treats accepting compensation for a competitive market analysis that is
  contingent upon reporting a predetermined value as a ground for discipline.
