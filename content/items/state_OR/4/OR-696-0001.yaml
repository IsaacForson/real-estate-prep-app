stem: Under Oregon's grounds-for-discipline statute, which act by a real estate broker exposes the
  broker to license suspension or revocation?
options:
  - Accepting compensation from a principal broker other than the broker's own
  - Requesting a later closing date so a buyer can finish moving out
  - Referring a buyer to a title company that a family member happens to own
  - Advertising a property listing using photographs the seller personally chose
key: A
explanation: The discipline statute lists accepting compensation from a principal broker other than
  the one the broker is associated with as a ground for suspension, revocation, or reprimand.
