stem: Under ORS 696.010, how does Oregon law define “compensation” for purposes of professional real
  estate activity?
options:
  - Cash payment received at the closing of a completed real estate transaction
  - Reimbursement limited to a licensee's documented marketing expenditures
  - Valuable consideration for services rendered or to be rendered to a client
  - A percentage commission fixed by the principal broker's office policy
key: C
explanation: ORS 696.010 defines compensation broadly as valuable consideration for services
  rendered or to be rendered, whether contingent or otherwise, so it is not limited to commissions
  or closing payments.
