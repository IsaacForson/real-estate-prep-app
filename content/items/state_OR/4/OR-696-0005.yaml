stem: A principal broker wants to rely on a disclosed limited agency agreement to represent both
  parties in a sale. What form must that agreement take to satisfy Oregon administrative rule?
options:
  - Written, signed and dated by the parties or their agents
  - Verbal, later confirmed by an email summarizing the discussed terms
  - Recorded in the listing agent's private transaction notes
  - Oral, witnessed by the closing agent at the settlement table
key: A
explanation: The rule requires disclosed limited agency agreements to be in writing, signed and
  dated by the parties to be bound or by their duly appointed real estate agents.
