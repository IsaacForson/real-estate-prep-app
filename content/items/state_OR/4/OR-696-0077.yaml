stem: A registered business name is not renewed on or before the registration expiration date. What
  is the consequence under OAR 863-014-0097?
options:
  - The business name remains active but incurs a late fee
  - The business name is automatically renewed for another year
  - The business name becomes void and licensees using it are inactivated
  - The business name is transferred to the state for reassignment
key: C
explanation: The rule provides that a registered business name not renewed on or before the
  expiration date will be void, and licensees authorized to conduct activity under that name will be
  inactivated. The distractor suggesting the name remains active with a late fee is incorrect
  because no late fee provision is mentioned; the name becomes void.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) 863-014-0097
  url: null
  quoted_text: >-
    A registered business name that is not renewed on or before the registration expiration date
    will be void.

    (4) If a registered business name becomes void, all real estate licensees authorized to conduct
    professional real estate

    activity under the name will be inactivated and may not engage in any professional real estate
    activity until transferred

    under OAR 863-014-0063
