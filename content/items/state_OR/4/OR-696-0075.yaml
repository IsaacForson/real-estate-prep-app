stem: A managing principal broker wants to authorize a broker to temporarily supervise the managing
  principal broker's professional real estate activity. The broker has three years of active
  experience. What must the managing principal broker do before the authorization becomes effective?
options:
  - Provide written authorization to the broker only
  - File the authorization with the Agency after the effective date
  - Submit the written authorization to the Agency before the effective date
  - Obtain verbal approval from the Commissioner
key: C
explanation: The rule requires that the written authorization be received by the Agency before the
  effective date of the authorization. Submitting the authorization to the Agency after the
  effective date violates this requirement, so the authorization would not be effective.
