stem: A licensee represents both the seller and buyer under a disclosed limited agency agreement.
  The buyer submits an offer that exceeds the seller's listing price. According to ORS 696.815, what
  must the licensee do regarding this information?
options:
  - To disclose the information only if the seller specifically requests it in writing
  - To withhold from the seller that the buyer will pay a price greater than the listing price
  - To inform the seller that the buyer will pay a price greater than the listing price
  - To seek the buyer’s written permission before informing the seller
key: B
explanation: Under ORS 696.815(2)(c)(B), a licensee in a disclosed limited agency must not reveal
  that the buyer will pay more than the offering price. Therefore the licensee must withhold that
  information; disclosing it is prohibited, and informing the seller or seeking the buyer’s
  permission is not required by the rule.
