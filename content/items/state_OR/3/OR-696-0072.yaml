stem: An applicant for a principal broker license has two years of active real estate licensure in
  Washington and one year of active licensure in Oregon. Under Oregon administrative rules, what
  must the applicant do to satisfy the three-year experience requirement?
options:
  - The applicant must provide certification of active license history from Washington
  - The applicant must provide certification of active license history from Oregon only
  - The applicant must retake the broker pre-license courses
  - The applicant must wait until they have three years of active licensure in Oregon
key: A
explanation: The rule requires certification of active license history from any state where
  experience was earned when the three‑year requirement relies partly on out‑of‑state licensure.
  Providing only Oregon certification, retaking courses, or waiting for three Oregon years are not
  sufficient.
