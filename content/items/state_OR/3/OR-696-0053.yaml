stem: Under Oregon law, what affirmative duty does a seller’s agent owe to a party regarding
  material facts?
options:
  - To exercise reasonable care and diligence while acting as the seller’s agent in all transactions.
  - To maintain confidential information from the seller except under subpoena or court order.
  - To disclose material facts known by the agent and not apparent or readily ascertainable to a
    party.
  - To present all written offers and notices to the parties in a timely manner without regard to
    contract status.
key: C
explanation: Under ORS 696.805(2)(c), a seller’s agent must disclose material facts known by the
  agent that are not apparent or readily ascertainable to a party. This duty is affirmative and
  cannot be waived except as provided in subsection (3)(g). The most tempting distractor, to present
  all written offers and notices in a timely manner, describes a different duty under subsection
  (2)(b) and does not address the disclosure of unknown material facts.
