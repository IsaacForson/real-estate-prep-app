stem: A licensee born in March obtains a license on June 1, 2026. What is the expiration date of the
  initial license under Oregon administrative rules?
options:
  - The license expires on March 31, 2028
  - The license expires on May 31, 2028
  - The license expires on March 31, 2027
  - The license expires on June 1, 2028
key: A
explanation: If the license is not issued in the birth month, the initial term starts on the issue
  date and ends 12 months after the first occurrence of the last day of the birth month. For a March
  birthday, the first March 31 after June 1, 2026 is March 31, 2027; adding 12 months gives March
  31, 2028. The other dates either omit the 12‑month addition, use the issue date plus 24 months, or
  incorrectly use the end of May.
