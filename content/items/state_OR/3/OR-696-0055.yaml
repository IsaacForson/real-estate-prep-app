stem: A licensee speaks with a prospective seller by telephone for the first time regarding listing
  the seller’s property. What must the licensee do under Oregon law regarding the agency disclosure
  pamphlet?
options:
  - The licensee must mail the pamphlet to the seller within three business days of the call and
    obtain proof of mailing.
  - The licensee must wait to provide the pamphlet until the seller signs a listing agreement or
    makes an offer to purchase.
  - The licensee must provide a copy of the initial agency disclosure pamphlet to the seller during
    that telephone call.
  - The licensee must provide the pamphlet only if the seller requests it and signs a written
    acknowledgment of receipt.
key: C
explanation: ORS 696.820(2) obligates an agent to provide a copy of the initial agency disclosure
  pamphlet at the first contact with each party to a real property transaction, and this includes
  contacts by telephone. Thus, the licensee must provide the pamphlet during that telephone call.
  The distractor that suggests waiting until the seller signs a listing agreement is incorrect
  because the duty arises at first contact, not after an agreement is signed.
citation:
  source: Or. Rev. Stat. ch. 696 (Real Estate and Escrow Activities) — ORS Chapter 696 — Real Estate
