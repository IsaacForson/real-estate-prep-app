  url: null
  quoted_text: An agent shall provide a copy of the initial agency disclosure pamphlet at the first
    contact with each party to a real property transaction, including but not limited to contacts in
    person, by telephone, over the Internet or the World Wide Web, or by electronic mail, electronic
    bulletin board or a similar electronic method.
