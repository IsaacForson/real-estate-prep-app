stem: A principal broker wishes to advertise real estate services under the assumed name 'Pacific
  Property Group' but has not yet registered that name with the Oregon Real Estate Agency. What must
  the broker do before engaging in any professional real estate activity under that name?
options:
  - The broker must obtain written authorization from the managing principal broker and keep it on
    file for Agency review annually
  - The broker must submit a change of business name registration to the Agency before using the
    name and pay the applicable fee annually
  - The broker must notify the Agency in writing of the assumed name within five days after first
    using it in any advertisement annually
  - The broker must register the business name with the Agency via the online application, providing
    the exact name on file with the Oregon Secretary of State and paying the required fee
key: D
explanation: OAR 863-014-0095(1) states that before conducting professional real estate activity in
  any name, a principal broker must first register the name with the Agency using an online
  application process available through the Agency’s website. Subsection (2) specifies that the
  application must include the exact name on file with the Oregon Secretary of State or the
  licensee’s legal name, written authority, a valid SOS number for non‑legal names, and the fee.
  Therefore, the broker must complete this registration prior to use. The other options describe
  steps for changes, notifications, or internal authorizations that do not satisfy the initial
  registration requirement.
