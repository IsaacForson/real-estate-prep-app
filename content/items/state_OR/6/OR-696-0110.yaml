stem: A property manager and an owner agree to pay a referral fee to a tenant. Where must this term
  be set?
options:
  - In the lease agreement with the tenant
  - In the property management agreement
  - In a separate broker representation agreement
  - In the advertising materials
key: B
explanation: Paragraph (3)(a) requires that any agreement to pay a referral fee to a tenant be
  included in the property management agreement. The lease, broker agreement, or advertising are not
  the proper documents for this term.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-025-0020
  url: null
  quoted_text: "If the property manager and owner agree to any of the following terms, the terms must
    be included in the property management agreement: (a) Payment of a referral fee, rent credit or
    other compensation to a tenant as allowed under ORS 696.290(5);"
