stem: A property manager in Oregon begins managing a single-family rental home for an owner based on
  an oral agreement that outlines fees and responsibilities. No written property management
  agreement has been signed. According to Oregon Administrative Rule 863-025-0020, what is the
  property manager's status regarding management of the rental real estate?
options:
  - The property manager may continue management because the oral agreement satisfies the rule's
    requirement for a property management agreement.
  - The property manager must cease management activities until a written, unexpired property
    management agreement is executed.
  - The property manager may continue management as long as they provide monthly accounting
    statements to the owner.
  - The property manager may continue management if they disclose any pecuniary interest in
    businesses providing services.
key: B
explanation: Under OAR 863-025-0020(1), a property manager must not engage in the management of
  rental real estate without a written, unexpired property management agreement. An oral agreement
  does not satisfy the written requirement, so the manager must stop managing until a written
  agreement is signed. Therefore, the correct action is to cease management activities. The idea
  that the manager may continue because an oral agreement satisfies the requirement is incorrect, as
  the rule explicitly requires a written agreement.
