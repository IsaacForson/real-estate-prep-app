stem: Under ORS 696.241, how is “trust funds” defined?
options:
  - Money belonging to others that is received or handled by a licensed real estate property manager
    or principal real estate broker in the course of conducting professional real estate activity
    and in the real estate licensee’s fiduciary capacity.
  - Money belonging to the property manager that is held in a bank account designated as a clients’
    trust account, intended for the manager’s personal use or business expenses, and not held for
    the benefit of any client or third party.
  - Any funds that a broker deposits in an interest‑bearing account, such as a savings or
    money‑market account, solely for the purpose of earning compensation or additional income for
    the brokerage, and not held on behalf of any client or third party.
  - Funds that are owned by the brokerage firm and used to pay operating expenses, including rent,
    utilities, salaries, and marketing costs, and are not held on behalf of clients or in a
    fiduciary capacity.
key: A
explanation: The statute defines trust funds as “money belonging to others that is received or
  handled by a licensed real estate property manager or principal real estate broker in the course
  of conducting professional real estate activity and in the real estate licensee’s fiduciary
  capacity.” The other choices describe owner‑funds, compensation or operating expenses, which the
  definition does not cover.
citation:
