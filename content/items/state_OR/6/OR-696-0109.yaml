stem: Which of the following items is required to be included in every property management agreement?
options:
  - The date of the agreement
  - The property manager’s phone number
  - The tenant’s credit score
  - The owner’s social security number
key: A
explanation: Oregon Administrative Rule 863-025-0020 requires that every property management
  agreement include the date of the agreement. Items such as the property manager’s phone number,
  the tenant’s credit score, and the owner’s social security number are not mandated by the rule.
