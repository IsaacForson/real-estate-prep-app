stem: What must a currently licensed real estate broker who previously held a principal broker
  license do to be licensed as a principal broker again under OAR 863-014-0063?
options:
  - Apply for a principal broker license, pay the required fee, and meet all current qualifications
  - Only pay the required fee, including any applicable surcharges.
  - Only meet the current qualifications, including continuing education.
  - Only apply for a principal broker license, submitting the required application and fees.
key: A
explanation: Under OAR 863-014-0063(6), a broker who previously held a principal broker license and
  wishes to be licensed as a principal broker again must submit an application for a principal
  broker license, pay the required fee, and meet all current qualification requirements. Choices
  that mention only applying, only paying the fee, or only meeting qualifications do not fulfill all
  three requirements and are therefore incorrect.
