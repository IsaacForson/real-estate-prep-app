stem: Which type of Oregon real estate licensee is authorized to employ, engage, or supervise
  another real estate licensee?
options:
  - A real estate broker may employ, engage, or supervise another licensee.
  - A principal real estate broker may employ, engage, or supervise another licensee.
  - A real estate property manager may employ, engage, or supervise another licensee.
  - A timeshare sales agent may employ, engage, or supervise another licensee.
key: B
explanation: ORS 696.022(3)(b) states that a principal real estate broker may employ, engage, or
  supervise the professional real estate activity of another real estate licensee. A real estate
  broker may not employ or supervise another licensee except under the limited 90‑day provision for
  brokers with three years of experience, so the other options are incorrect.
