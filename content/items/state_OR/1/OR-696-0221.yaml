stem: An active-duty service member stationed in Oregon obtains an authorization to conduct
  professional real estate activity as a principal broker on September 1, 2026. Their out-of-state
  license expires on March 1, 2027, and their active duty in Oregon ends on August 15, 2027.
  According to OAR 863-014-0054, when will the authorization expire?
options:
  - September 1, 2028
  - March 1, 2027
  - June 30, 2027
  - August 15, 2027
key: B
explanation: "The authorization remains valid until the earliest of three events: two years from
  issuance, the end of active‑duty service in Oregon, or the expiry of the out‑of‑state license. The
  out‑of‑state license expires on March 1, 2027, which precedes the other dates, so the
  authorization ends then. The option citing August 15, 2027 (the end of active duty) is incorrect
  because the license expiry occurs earlier."
citation:
  source: "### Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0054"
  url: null
  quoted_text: "(1) An active-duty member of the United States Armed Forces who is stationed in this
    state, or the spouse or domestic partner of such servicemember, may obtain an authorization to
    conduct professional real estate activity as a real estate broker or principal broker upon
    completion of the requirements in (2) through (5) of this rule. Such authorization is valid
    until the earliest of the following: (a) Two years from the date of issuance; (b) The date the
    servicemember's term of active-duty service in this state is complete; or (c) The date the
    applicant’s license issued by another state expires or is no longer active."
