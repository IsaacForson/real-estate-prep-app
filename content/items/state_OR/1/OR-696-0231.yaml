stem: What is the maximum possible duration of an authorization issued under OAR 863-014-0054 for an
  active‑duty service member stationed in Oregon to conduct professional real estate activity as a
  principal broker?
options:
  - The authorization is valid until the service member's active duty ends.
  - The authorization is valid for up to six months from the date of issuance.
  - The authorization is valid for up to one year from the date of issuance.
  - The authorization is valid for up to two years from the date of issuance.
key: D
explanation: Under OAR 863‑014‑0054(a) the authorization remains in effect until the earliest of
  three events, one of which is two years from the date it is issued; therefore the longest it can
  last is two years if the other conditions do not occur earlier. The statement that the
  authorization is valid for up to one year from the date of issuance is incorrect because the rule
  does not limit the authorization to one year.
