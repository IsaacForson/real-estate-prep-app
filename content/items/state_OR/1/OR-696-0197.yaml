stem: A limited licensee wishes to renew their license to active status for the next term. According
  to OAR 863-014-0060, which of the following is required for the renewal application?
options:
  - The application must include a paper copy of all continuing education certificates completed
    during the prior renewal term.
  - The application may be submitted on paper if the licensee obtains a fee waiver approved by the
    Commissioner before the renewal deadline.
  - The application may be sent via email to the Agency’s licensing division only if the licensee
    first receives written approval.
  - The application must be submitted using an online application process available through the
    Agency’s website, and no alternative submission methods are permitted.
key: D
explanation: Under OAR 863-014-0060, a limited licensee may only submit a renewal application using
  the online process; submitting a paper copy of continuing education certificates, submitting on
  paper with a fee waiver, or sending via email without prior approval are not permitted.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
