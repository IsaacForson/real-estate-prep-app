stem: Under ORS 696.022, what condition must be met before a real estate broker may engage in
  professional real estate activity?
options:
  - The broker must be supervised by a principal broker
  - The broker must obtain written consent from the Real Estate Board
  - The broker must register a separate business name
  - The broker must complete 90 days of solo practice first
key: A
explanation: ORS 696.022 provides that a real estate broker may engage in professional real estate
  activity only if the broker is associated with and supervised by a principal real estate broker.
