stem: A managing principal broker receives written notice of a compliance review on Monday, May 5.
  What is the earliest date the Agency may conduct the compliance review?
options:
  - Monday, May 26
  - Monday, May 12
  - Monday, May 19
  - Monday, May 5
key: B
explanation: OAR 863-015-0081(1) requires at least five business days’ notice before a compliance
  review. Counting business days from Tuesday May 6 through Monday May 12 yields five days, making
  Monday May 12 the earliest possible date. Choosing the same day ignores the notice requirement;
  later dates exceed the minimum.
