stem: Under OAR 863-014-0054, which of the following is true regarding the renewal of an
  authorization issued to an active‑duty service member?
options:
  - It may not be renewed; the holder must reapply and meet current qualifications.
  - It may be renewed for an additional two‑year period.
  - It may be renewed once the service member’s active‑duty orders are extended.
  - It may be renewed automatically if the out‑of‑state license remains active.
key: A
explanation: OAR 863-014-0054(6) provides that the authorization to conduct professional real estate
  activity as a real estate broker or principal broker may not be renewed on expiration; the holder
  must reapply and satisfy the current qualification requirements. Therefore the statement that it
  may not be renewed and the holder must reapply and meet current qualifications is correct. The
  suggestions that it can be renewed for a two‑year period, renewed after active‑duty orders are
  extended, or renewed automatically if an out‑of‑state license remains active are not supported by
  the rule.
citation:
