stem: A supervising managing principal broker has received a written authorization that meets all
  requirements of OAR 863-014-0085, including effective and termination dates within 90 days and
  joint responsibility acknowledgments. The supervising broker wishes to conduct professional real
  estate activity under both the authorizing managing principal broker’s registered business name
  and the supervising broker’s own registered business name. Under OAR 863-014-0085, is this
  permissible?
options:
  - Yes, but only if the supervising managing principal broker also files an amended authorization
    with the Agency.
  - Yes, because the rule explicitly allows a supervising managing principal broker to conduct
    activity under both business names when the authorization requirements are met.
  - No, because OAR 863-014-0095(7) prohibits any managing principal broker from using more than one
    registered business name regardless of authorization.
  - No, because the exception applies only to the authorizing managing principal broker, not the
    supervising one.
key: B
explanation: OAR 863-014-0085(7) provides an exception to the prohibition in OAR 863-014-0095(7),
  permitting a supervising managing principal broker to engage in activity under both the
  authorizing and supervising business names when the parties meet the rule’s requirements.
  Therefore, the statement that the supervising managing principal broker may conduct activity under
  both business names when the authorization requirements are met is correct. The statement that the
  prohibition applies regardless of the exception is incorrect.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0085(7)
  url: null
  quoted_text: This rule provides an exception to OAR 863-014-0095(7), which prohibits a managing
    principal broker from engaging in professional real estate activities under more than one
    registered business name. That is, a supervising managing principal broker may conduct
    professional real estate activity under both the authorizing managing principal broker’s
    registered business name and the supervising managing principal broker’s registered business
    name if the parties meet the requirements contained in this rule.
