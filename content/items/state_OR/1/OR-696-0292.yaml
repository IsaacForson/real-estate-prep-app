stem: A licensee submits an online renewal application and certifies that they have completed the
  required 26 hours of continuing education, but they actually completed only 20 hours. According to
  OAR 863-020-0010(5), what is the consequence?
options:
  - The licensee’s renewal is automatically denied
  - The licensee must retake the missing 6 hours within 30 days
  - The licensee is subject to discipline under ORS 696.301
  - The licensee will receive a warning but no discipline
key: C
explanation: OAR 863-020-0010(5) states that a licensee who falsely certifies completion of the
  required continuing education violates the rule and is subject to discipline under ORS 696.301.
  Therefore, the licensee faces possible disciplinary action. The other options describe outcomes
  not specified in the rule.
