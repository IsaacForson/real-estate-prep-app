stem: Under OAR 863-014-0085, what is the maximum number of days that a written authorization
  allowing a managing principal broker to authorize another managing principal broker to control and
  supervise their professional real estate activity may remain in effect?
options:
  - A maximum of 60 days
  - A maximum of 90 days
  - A maximum of 120 days
  - A maximum of 180 days
key: B
explanation: The rule states the termination date may not exceed 90 days, making 90 days the maximum
  allowable period. The 60‑day option is a common misconception that confuses this period with other
  renewal or inactive‑license windows.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0085
  url: null
  quoted_text: (a) The authorizing managing principal broker’s authorization, including the effective
    date and the termination date of such authorization, which may not exceed 90 days;
