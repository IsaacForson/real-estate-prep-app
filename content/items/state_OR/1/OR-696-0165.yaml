stem: What is the minimum and maximum length of an initial real estate license term in Oregon?
options:
  - The initial license term is at minimum 13 months and at most 24 months and 30 days.
  - The initial license term is at minimum 13 months and at most 36 months.
  - The initial license term is at minimum 12 months and at most 24 months and 30 days.
  - The initial license term is at minimum 13 months and at most 24 months maximum.
key: A
explanation: The rule requires that an initial license term be at least 13 months long and no longer
  than 24 months plus an additional 30 days. The correct option states both the 13‑month minimum and
  the 24‑month‑plus‑30‑day maximum. An option that gives a maximum of 36 months exceeds the allowed
  period. An option that lists a minimum of 12 months falls short of the required minimum. An option
  that omits the '+ 30 days' understates the maximum allowable term.
