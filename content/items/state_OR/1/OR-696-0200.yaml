    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-020-0015
  url: null
  quoted_text: A real estate licensee must maintain the licensee’s certificates of completion the
    licensee received from continuing education providers for three years after the renewal date for
    which the continuing education credit applies.
