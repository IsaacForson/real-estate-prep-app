  - June 15, 2025
  - June 15, 2028
  - June 15, 2027
key: D
explanation: The rule requires maintaining certificates for three years after the renewal date for
  which the credit applies; June 15, 2024 plus three years equals June 15, 2027. The distractor June
  15, 2026 reflects only two years.
