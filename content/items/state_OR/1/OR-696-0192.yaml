stem: How many years must a real estate licensee retain certificates of completion from continuing
  education providers after the renewal date for which the credit applies?
options:
  - 1-year period
  - 2-year period
  - 3-year period
  - 4-year period
key: C
explanation: Under OAR 863-020-0015(1), a licensee must keep CE certificates for three years after
  the renewal date for which the credit applies. Therefore the correct answer is three years. The
  distractor of two years is incorrect because it confuses the CE reporting period with the
  record‑retention period.
