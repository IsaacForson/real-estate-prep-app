stem: A licensee holds a limited real estate broker license issued by the Commissioner under ORS
  696.130. The period of limitation has ended, and the licensee wishes to obtain an unrestricted
  license. The licensee has an authorized principal broker. According to OAR 863-014-0060, what must
  the licensee include with the written request for an unrestricted license?
options:
  - The proof of continuing education
  - The copy of the limited license
  - The principal broker's endorsement
  - The fee payment receipt for renewal
key: C
explanation: Under OAR 863-014-0060(1), a licensee seeking to convert a limited license to an
  unrestricted license must include the endorsement of the authorized principal broker, if
  applicable. Since the licensee has an authorized principal broker, the endorsement is required.
  The other items, such as proof of continuing education or a copy of the limited license, are not
  mentioned as requirements for this request.
