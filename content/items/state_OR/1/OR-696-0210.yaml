stem: According to ORS 696.022(2)(c), what is the maximum number of days a real estate broker with
  three years of active experience may supervise another licensee due to unforeseen circumstances or
  the temporary absence of a sole principal broker?
options:
  - 90 days
  - 30 days
  - 60 days
  - 120 days
key: A
explanation: The rule explicitly states that a broker with three years of experience may supervise
  for up to 90 days due to unforeseen circumstances or the temporary absence of a sole principal
  broker. Therefore, the maximum permissible period is 90 days. The distractor of 60 days, while
  within the limit, is not the maximum allowed by the statute.
