    696.022(2)(c)
  url: null
  quoted_text: A real estate broker who has acquired three years of active experience as a real estate
    broker may supervise for up to 90 days the professional real estate activity of another real
    estate licensee due to unforeseen circumstances or the temporary absence of a sole principal
    real estate broker, as provided by the agency by rule.
