stem: A court grants the Real Estate Agency an injunction against a person for violating ORS
  696.020(2). What effect does ORS 696.020 say this injunction has on other remedies?
options:
  - It replaces any pending criminal prosecution for the same conduct
  - It satisfies the agency's disciplinary process against the person
  - It bars the county prosecuting attorney from filing related charges
  - It leaves criminal, civil, and disciplinary remedies available
key: D
explanation: ORS 696.020 provides that an injunction does not relieve a person from criminal
  prosecution or from any other civil, criminal, or disciplinary remedy.
