stem: According to OAR 863-014-0063, what occurs when a principal broker is transferred?
options:
  - The principal broker must reapply for a license before engaging in any activity.
  - The principal broker becomes associated with the managing principal broker as provided by ORS
    696.022.
  - The principal broker automatically becomes a managing principal broker upon transfer.
  - The principal broker must complete additional continuing education hours.
key: B
explanation: The rule states that upon transfer, the principal broker becomes associated with the
  managing principal broker as provided by ORS 696.022. The distractor claiming automatic promotion
  to managing principal broker is incorrect because the rule only creates an association, not a
  change in license status.
