stem: A limited real estate broker license expires on June 30, 2026. The licensee submits the online
  renewal application and pays the fee on July 2, 2026. According to OAR 863-014-0060, what is the
  status of the license?
options:
  - Active and eligible to practice
  - Expired and may not practice
  - Inactive but can be renewed
  - Suspended pending Agency review
key: B
explanation: The rule provides that a limited license expires if not renewed on or before the
  expiration date, after which the licensee may not engage in any professional real estate activity.
  Hence the license is expired and may not be practiced. The option stating the license remains
  active and eligible to practice is incorrect because renewal after the expiration date does not
  restore the license.
citation:
  source: "### Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0060"
  url: null
  quoted_text: (5) A limited real estate broker or principal broker license expires if a licensee
    fails to renew the license on or before the license expiration date. A real estate licensee may
    not engage in any professional real estate activity after a license expires.
