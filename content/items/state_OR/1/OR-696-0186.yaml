stem: A licensed real estate broker works under the supervision of an authorized principal broker.
  According to OAR 863-020-0015, is the authorized principal broker required to maintain the
  broker's continuing education certificates of completion?
options:
  - The authorized principal broker is not required to maintain those records.
  - The authorized principal broker must maintain the certificates only if the broker requests them.
  - The authorized principal broker must maintain the certificates only if the broker is also a
    property manager.
  - The authorized principal broker must maintain the certificates for three years after the renewal
    date.
key: A
explanation: The rule explicitly states that an authorized principal broker is not required to
  maintain the continuing education records of a real estate broker under their supervision. The
  other options incorrectly impose a retention duty that applies only to the licensee themselves,
  not to the supervising authorized principal broker.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-020-0015
  url: null
  quoted_text: (2) An authorized principal broker is not required to maintain the continuing education
    records of a real estate broker, principal real estate broker, or property manager under the
    supervision of the authorized principal broker.
