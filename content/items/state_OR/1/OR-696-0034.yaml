stem: An active‑duty service member stationed in Oregon obtains an authorization to conduct
  professional real estate activity as a principal broker. Their spouse holds an active real estate
  license in another state that was active during the two years preceding the move. The service
  member’s term of active duty in Oregon will end in 18 months. Under OAR 863-014-0054, when will
  the authorization expire?
options:
  - After 12 months
  - After 18 months
  - After 24 months
  - After 30 months
key: B
explanation: The authorization remains valid until the earliest of the three events listed; the
  servicemember’s active‑duty term ends in 18 months, which precedes the two‑year issuance limit and
  the spouse’s out‑of‑state license expiration, so the authorization lapses at that point. The
  24‑month option incorrectly assumes the two‑year issuance limit governs regardless of the service
  term.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0054
  url: null
  quoted_text: (a) Two years from the date of issuance; (b) The date the servicemember's term of
    active-duty service in this state is complete; or (c) The date the applicant’s license issued by
    another state expires or is no longer active.
