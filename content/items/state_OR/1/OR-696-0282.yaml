  - 30 months
  - 18 months
  - 24 months
key: D
explanation: The rule explicitly states that the Agency will renew an active or inactive license for
  a term of 24 months from the last license expiration date. The 12‑month option confuses the
  renewal period with the minimum length of an initial license term.
