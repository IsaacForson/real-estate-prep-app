stem: A licensee completed a 3‑hour fair housing course in January 2024 and again in January 2025
  while renewing their license for the 2024‑2026 cycle. According to OAR 863-020-0010, will the
  licensee receive continuing education credit for the second completion of the same course?
options:
  - No, because the course content is identical to a prior completion within the same two-year
    renewal period
  - No, because the Agency only grants credit for fair housing courses completed in even-numbered
    years.
  - No, because the licensee must wait at least 12 months before retaking the same course for credit.
  - No, because the licensee must complete a different fair housing course approved by the Board
    each renewal cycle.
key: A
explanation: The rule denies credit for repeating a continuing education course with the same
  content during a two‑year renewal period. The distractor about the first year is incorrect because
  the rule does not limit credit to the first year of the period.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-020-0010
  url: null
  quoted_text: A real estate licensee will not be given credit for repeating a continuing education
    course with the same content during a two-year renewal period.
