stem: A licensee's real estate broker license went inactive on March 1. On March 20, the licensee
  submits an online application to change the license status to active, pays the reactivation fee,
  and provides an online license transfer application completed by an authorized principal broker.
  Under OAR 863-014-0065, is the licensee permitted to change the license status to active at this
  time?
options:
  - No, because a licensee must pass the reactivation examination before changing status to active.
  - No, because the licensee must wait until the license has been inactive for at least 60 days
    before reactivation.
  - Yes, because the licensee is within the 30‑day period after inactivation and has met the
    transfer requirements.
  - Yes, but only if the licensee also submits proof of continuing education completion.
key: C
explanation: The rule allows a licensee to change from inactive to active within 30 days of
  inactivation when accompanied by an authorized principal broker transfer; the option that says a
  licensee must pass the reactivation examination before changing status to active incorrectly adds
  an examination requirement that applies only after the 30‑day period.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0065
  url: null
  quoted_text: For a period of 30 days after a real estate license becomes inactive, the licensee may
    change such license status from inactive to active and be transferred by an authorized principal
    broker under OAR 863-014-0063.
