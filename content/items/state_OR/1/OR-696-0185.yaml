stem: Under OAR 863-020-0010, which type of licensee is excluded from the continuing education
  renewal requirements?
options:
  - Property managers
  - Managing principal brokers
  - Principal brokers
  - Timeshare sales agents
key: D
explanation: The rule states that it applies to all real estate licensees except timeshare sales
  agents, so timeshare sales agents are not subject to the CE renewal requirement. Property
  managers, principal brokers, and managing principal brokers are all included because they must
  complete the mandated courses to renew an active license.
