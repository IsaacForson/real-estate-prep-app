stem: An unlicensed assistant works under a principal broker's written delegation described in ORS
  696.030 and, within its limits, collects rent, checks tenant references, and conducts tenant
  relations. Which additional task would exceed the scope of this exemption?
options:
  - Negotiating a rental or lease agreement with a prospective tenant
  - Negotiating the sale of the rental property to a third-party buyer
  - Supervising the on-site premises managers for the property
  - Discussing financial matters relating to the management with the owner
key: B
explanation: ORS 696.030's exemption for a delegated nonlicensed individual is limited to enumerated
  rental-management tasks such as negotiating leases, checking references, and supervising premises
  managers; negotiating a sale of the property falls outside that enumerated list.
