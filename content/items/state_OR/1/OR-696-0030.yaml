stem: A licensee renewed an active license on March 15, 2024. According to OAR 863-020-0015, until
  what date must the licensee retain certificates of completion from continuing education providers?
options:
  - March 15, 2027
  - March 15, 2026
  - March 15, 2025
  - March 15, 2028
key: A
explanation: The rule requires licensees to maintain continuing education certificates for three
  years after the renewal date for which the credit applies. The one‑year option is too short
  because the retention period is three years, not one.
