stem: Under OAR 863-014-0085, what is the maximum permissible length of a written authorization that
  allows one managing principal broker to control another's business during absence?
options:
  - 30 days
  - 45 days
  - 60 days
  - 90 days
key: D
explanation: The rule states that the written authorization must include the effective and
  termination dates, which may not exceed 90 days. Therefore, the maximum length is 90 days. A
  60‑day authorization, while permissible, is not the maximum allowed.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0085
  url: null
  quoted_text: The authorizing managing principal broker’s authorization, including the effective date
    and the termination date of such authorization, which may not exceed 90 days;
