stem: After a compliance review, the Agency finds that an authorized principal broker is not in
  compliance with licensing statutes but determines that no client funds are at risk. Under OAR
  863-015-0081, how many days must the Agency allow the broker to cure the noncompliance before
  imposing sanctions?
options:
  - 60 days
  - 90 days
  - 30 days
  - 15 days
key: C
explanation: The rule states that if the Agency determines noncompliance and there is no risk to
  client funds, it must allow the authorized principal broker at least 30 days to cure the
  noncompliance. The 15‑day option is too short because the rule specifies a minimum of 30 days.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-015-0081
  url: null
  quoted_text: (3) Except as provided in section (4) of this rule, if the Agency determines that an
    authorized principal broker is not in compliance with ORS 696.010 to 696.495, 696.600 to
    696.785, 696.800 to 696.870, or OAR chapter 863 after the Agency completes a compliance review,
    the Agency will allow the authorized principal broker at least 30 days from the date the
    compliance review is completed to cure the noncompliance without sanction.
