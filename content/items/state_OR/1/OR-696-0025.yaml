stem: A property owner's full-time employee occasionally helps show the employer's own building to
  prospective tenants, an activity that is incidental to the employee's regular nonreal estate
  duties. Under ORS 696.030, is this employee exempt from licensing for that activity?
options:
  - Yes, because the activity concerns the employer's property and is incidental to other duties
  - Yes, because the employee received compensation for the assistance
  - No, because helping show property to tenants requires a real estate license regardless of context
  - No, because full-time employees rarely qualify for this exemption
key: A
explanation: ORS 696.030 exempts a nonlicensed full-time employee of an owner whose real estate
  activity involves only the employer's real estate and is incidental to the employee's normal,
  nonreal estate duties.
