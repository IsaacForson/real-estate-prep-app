stem: Under OAR 863-020-0010, what is the minimum number of continuing education hours a real estate
  licensee must complete during the two years preceding renewal to renew an active license?
options:
  - 26 hours
  - 20 hours
  - 24 hours
  - 30 hours
key: A
explanation: The rule requires licensees to have completed at least 26 hours of eligible continuing
  education in the two years before renewal. The 20‑hour option is insufficient because the rule
  specifies a minimum of 26 hours, not 20.
