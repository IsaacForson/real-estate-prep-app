stem: An applicant wishes to conduct professional real estate activity under a business name they
  have registered. What must the applicant do before registering that business name?
options:
  - The applicant must meet all remaining qualifications to obtain the principal broker license.
  - The applicant must obtain a principal broker license from another state.
  - The applicant must complete thirty hours of continuing education.
  - The applicant must submit a written request to the Commissioner for endorsement.
key: A
explanation: "Under OAR 863-014-0063, an applicant must satisfy all remaining qualifications for a
  principal broker license before registering a business name. The option stating that the applicant
  must meet all remaining qualifications to obtain the principal broker license correctly reflects
  this requirement. The other options describe actions not required by the rule: obtaining a
  principal broker license from another state, completing thirty hours of continuing education, or
  submitting a written request to the Commissioner for endorsement."
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0063
  url: null
  quoted_text: If an applicant wishes to conduct professional real estate activity under a business
    name registered by the applicant, the applicant must first meet all of the remaining
    qualifications to obtain the principal broker license and then register a business name under
    OAR 863-014-0095.
