stem: A licensee born in August receives a real estate broker license on March 15. According to OAR
  863-014-0030, what is the expiration date of the initial license?
options:
  - The license expires on March 14 of the following year.
  - The license expires on August 31 of the same year.
  - The license expires on August 31 of the following year.
  - The license expires on February 28 of the following year.
key: C
explanation: OAR 863-014-0030(5)(a) provides that if the license is not issued in the licensee’s
  birth month, the initial term starts on the issue date and ends 12 months after the first
  occurrence of the last day of the birth month. The first August 31 after March 15 is August 31 of
  the same year; adding 12 months yields August 31 of the following year.
