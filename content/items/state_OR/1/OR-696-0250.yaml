stem: A managing principal broker provides written authorization to another managing broker to
  supervise their activity for 100 days while they are on extended leave. According to OAR
  863-014-0085, is this authorization permissible?
options:
  - No, because the Agency must receive the authorization before the effective date.
  - Yes, because both brokers have accepted supervisory responsibility in writing.
  - No, because the termination date must not exceed 90 days.
  - Yes, because the authorization specifies an effective and a termination date.
key: C
explanation: The rule requires that the termination date of a written authorization not exceed 90
  days. An authorization for 100 days violates this limit, making it impermissible. The most
  tempting distractor focuses on having dates but overlooks the 90‑day cap.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0085
  url: null
  quoted_text: "The written authorization required by this rule must contain the following
    information: (a) The authorizing managing principal broker’s authorization, including the
    effective date and the termination date of such authorization, which may not exceed 90 days;"
