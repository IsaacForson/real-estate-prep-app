stem: A licensee born in November receives a real estate broker license on November 5. According to
  OAR 863-014-0030, what is the expiration date of the initial license?
options:
  - November 5 two years later
  - November 30 of the following year
  - November 30 two years later
  - November 5 of the following year
key: C
explanation: OAR 863-014-0030(5)(b) provides that if a license is issued in the licensee’s birth
  month, the initial license term starts on the issue date and ends 24 months after the first
  occurrence of the last day of the birth month. The first occurrence of the last day of November
  after November 5 is November 30 of the same year; adding 24 months yields November 30 two years
  later. The distractor 'November 5 two years later' incorrectly uses the issue date instead of the
  last day of the birth month.
