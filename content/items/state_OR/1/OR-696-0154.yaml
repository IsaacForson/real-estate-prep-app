stem: An active-duty member of the United States Armed Forces stationed in Oregon obtains an
  authorization to conduct professional real estate activity as a principal broker. According to OAR
  863-014-0054, what must the authorization holder do after the authorization expires to continue
  conducting professional real estate activity in Oregon?
options:
  - Reapply for authorization and fulfill the requirements of ORS 696.022 and OAR 863-014-0035 or
    863-014-0040.
  - Renew the authorization by submitting a renewal application and paying the required fee.
  - Submit a request for an unrestricted license to the Commissioner and pay the associated fee.
  - Complete an additional 30 hours of continuing education and submit proof of completion.
key: A
explanation: The rule specifies that the authorization may not be renewed on expiration; previous
  holders must reapply and meet the qualifications under ORS 696.022 and either OAR 863-014-0035 or
  863-014-0040. The distractor suggesting simple renewal is incorrect because renewal is expressly
  prohibited.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0054
  url: null
  quoted_text: The authorization to conduct professional real estate activity as a real estate broker
    or principal broker may not be renewed on expiration. Previous holders of an authorization must
    reapply and fulfill the requirements of ORS 696.022 and OAR 863-014-0035 or 863-014-0040 in
    order to conduct professional real estate activity in this state.
