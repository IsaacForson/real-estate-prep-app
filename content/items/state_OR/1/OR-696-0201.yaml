stem: Under OAR 863-020-0010, what is the consequence for a licensee who falsely certifies
  completion of the required continuing education?
options:
  - The licensee is subject to discipline under ORS 696.301
  - The licensee must pay a fine of $1,000 to the Agency
  - The licensee is automatically suspended for 30 days
  - The licensee must retake the continuing education course
key: A
explanation: The rule states that a licensee who falsely certifies completion of required continuing
  education is subject to discipline under ORS 696.301. The other options describe specific
  penalties—a fine, an automatic suspension, or a requirement to retake the course—that are not
  mentioned in the rule; the rule only imposes discipline, leaving the exact sanction to be
  determined under ORS 696.301.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
