stem: Under OAR 863-014-0065, how many days after a license becomes inactive may a licensee change
  the license status from inactive to active without needing to take the reactivation examination?
options:
  - 45 days
  - 60 days
  - 30 days
  - 90 days
key: C
explanation: The rule states that for a period of 30 days after a license becomes inactive, the
  licensee may change the status to active without taking the reactivation examination. Therefore,
  30 days is correct. The 45‑day option incorrectly extends the period beyond the 30‑day window.
