    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-014-0065"
  url: null
  quoted_text: (5) For a period of 30 days after a real estate license becomes inactive, the licensee
    may change such license status from inactive to active and be transferred by an authorized
    principal broker under OAR 863-014-0063.
