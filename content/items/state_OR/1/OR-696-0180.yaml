stem: A licensee wants to place a lawn sign that reads 'Jane Doe, Real Estate Specialist'. According
  to OAR 863-015-0125(2)(a), what must the licensee ensure about the sign to comply with advertising
  rules?
options:
  - The sign must be identifiable as advertising of a real estate licensee
  - The sign must include the licensee's license number
  - The sign must be approved by the managing principal broker
  - The sign must be displayed only during business hours
key: A
explanation: The rule requires advertising to be identifiable as advertising of a real estate
  licensee (OAR 863-015-0125(2)(a)). The sign must therefore make clear it is advertising by a
  licensee. The option stating that the sign must include the licensee's license number is incorrect
  because the rule does not mandate inclusion of a license number in advertising.
