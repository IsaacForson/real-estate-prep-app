stem: A managing principal broker receives written notice of a clients’ trust account reconciliation
  review on Monday, May 5. According to OAR 863-015-0092, what is the earliest date the managing
  principal broker must provide the required information and documentation?
options:
  - Monday, May 12
  - Monday, May 19
  - Monday, May 26
  - Monday, June 2
key: B
explanation: The rule requires at least ten business days' notice before information must be
  provided. Counting ten business days from May 5 leads to May 19. The other options correspond to
  incorrect counts of five, fifteen, or twenty business days.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-015-0092
  url: null
  quoted_text: The Agency will provide a managing principal broker with written notice of a clients’
    trust account reconciliation review at least 10 business days before required information and
    documentation must be provided to the Agency.
