stem: A real estate broker with three years of active experience is asked to supervise another
  licensee's professional real estate activity for 60 days while the sole principal broker recovers
  from a medical emergency. Does ORS 696.022 allow this arrangement?
options:
  - No, because a principal broker alone may supervise another licensee
  - Yes, given the broker's experience and the temporary absence
  - No, because 60 days exceeds the maximum supervision period allowed
  - Yes, provided the Real Estate Board approves the arrangement in advance
key: B
explanation: ORS 696.022 permits a broker with three years of active experience to supervise another
  licensee's activity for up to 90 days due to unforeseen circumstances or the temporary absence of
  a sole principal broker, so a 60-day gap qualifies.
