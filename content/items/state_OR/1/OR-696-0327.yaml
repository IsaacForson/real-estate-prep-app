stem: A real estate broker who has been licensed for 18 months supervises another licensee's
  professional real estate activity while the principal broker is temporarily absent. According to
  ORS 696.022, is the broker permitted to supervise?
options:
  - The broker is permitted to supervise because they have at least one year of experience.
  - The broker is not permitted to supervise because they lack the required three years of
    experience.
  - The broker is permitted to supervise if the supervision period is under 90 days.
  - The broker is not permitted to supervise unless they are directly supervised by a principal
    broker.
key: B
explanation: ORS 696.022(2)(c) allows a broker to supervise another licensee only after acquiring
  three years of active experience. Since the broker has only 18 months of experience, they do not
  meet this requirement and may not supervise. The option suggesting supervision is allowed if under
  90 days is incorrect because the experience prerequisite is not satisfied.
