stem: A licensee receives a signed purchase agreement from a buyer. Under OAR 863-015-0250(2),
  within how many banking days must the licensee transmit the document to the authorized principal
  broker?
options:
  - 10 banking days
  - 5 banking days
  - 3 banking days
  - 1 banking day
key: C
explanation: OAR 863-015-0250(2) states that when a licensee receives any document referred to in
  subsection (1), the licensee must transmit the document to the authorized principal broker within
  3 banking days of receipt. The other options do not match this requirement.
