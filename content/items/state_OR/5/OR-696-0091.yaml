stem: A principal broker opens a clients' trust account for a real estate transaction. Under OAR
  863-015-0255(2), within how many business days must the authorized principal broker notify the
  Agency of the account opening?
options:
  - 5 business days
  - 10 business days
  - 15 business days
  - 30 business days
key: B
explanation: OAR 863-015-0255(2) requires the authorized principal broker to notify the Agency
  within 10 business days from the date the clients’ trust account is opened. The other options are
  incorrect.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-015-0255
  url: null
  quoted_text: Within 10 business days from the date a clients’ trust account is opened, the
    authorized principal broker must notify the Agency using an online process established by the
    Agency.
