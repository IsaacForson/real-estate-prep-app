stem: According to OAR 863-015-0259(1)(b), what must an authorized principal broker maintain for any
  check received?
options:
  - Maintain a copy of any check received
  - Maintain a dated acknowledgment for returned checks
  - Maintain an accounting of all funds received
  - Maintain a ledger entry showing deposit date
key: A
explanation: The rule explicitly requires maintaining a copy of any check received. Maintaining a
  dated acknowledgment applies only to checks returned to the offeror, not to all checks received.
