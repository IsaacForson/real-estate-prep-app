stem: What must an authorized principal broker's ledger account show for funds received?
options:
  - From whom the funds were received, the date received, the date deposited, where deposited, and
    the final disposition when the transaction is completed or the offer fails
  - From whom the funds were received, the date received, the date deposited, where deposited, and
    the amount of commission earned
  - From whom the funds were received, the date received, the date deposited, where deposited, and
    the client's social security number
  - From whom the funds were received, the date received, the date deposited, where deposited, and
    the property's legal description
key: A
explanation: "Under OAR 863-015-0259(4), a principal broker's ledger account for funds received must
  show: (1) who provided the funds, (2) the date received, (3) the date deposited, (4) where the
  funds were deposited, and (5) the final disposition of the funds when the transaction is completed
  or the offer fails. The correct answer includes all five of these elements. One incorrect answer
  replaces the final disposition with the amount of commission earned, which is not required by this
  rule."
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-015-0259
  url: null
  quoted_text: "Authorized principal brokers must maintain a complete ledger account and record all
    funds received in their professional real estate activity. This ledger account must show: (a)
    From whom the funds were received, (b) The date the funds were received, (c) The date the funds
    were deposited, (d) Where the funds were deposited, and (e) When the transaction has been
    completed or the offer has failed, the final disposition of the funds."
