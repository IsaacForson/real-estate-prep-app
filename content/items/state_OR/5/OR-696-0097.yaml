stem: A principal broker wants to store clients’ trust account reconciliation worksheets and bank
  statements. Which storage method satisfies OAR 863-015-0260(2)?
options:
  - Store records in a locked file cabinet
  - Store records on an unprotected laptop
  - Store records in a shared drive open to all staff
  - Store records on a desk in a paper folder
key: A
explanation: The rule mandates that records be stored in a secure location protected from
  unauthorized access. A locked file cabinet meets this requirement. Storing records on an
  unprotected laptop, in a shared drive open to all staff, or on a desk in a paper folder does not
  provide adequate protection from unauthorized access.
