stem: How often must an authorized principal broker reconcile each clients’ trust account under OAR
  863-015-0275(1)?
options:
  - Once each quarter
  - Once each year
  - Once each week
  - Once each month
key: D
explanation: OAR 863-015-0275(1) requires that an authorized principal broker reconcile each
  client’s trust account at least once each month. Therefore, the option 'Once each month' is
  correct. The option 'Once each week' describes a weekly reconciliation, which is more frequent
  than required but not the mandated interval.
