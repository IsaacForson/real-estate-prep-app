stem: A broker receives an earnest money check made payable to the seller. The offer is accepted.
  What must the broker do within three banking days following acceptance?
options:
  - The broker must deposit the check into a clients' trust account.
  - The broker must deposit the check to a licensed neutral escrow depository.
  - The broker must deliver the check to the seller.
  - The broker must hold the check un-deposited until closing.
key: C
explanation: The rule requires delivery of the check to the seller when the check is made payable to
  the seller, as stated in subsection (c). Depositing the check into a clients' trust account is
  incorrect because that procedure applies only when the check is not made payable to the seller.
