stem: Under OAR 863-015-0257(5)(c), what is prohibited regarding merchant discounts and processing
  fees from credit card payments in a real estate transaction?
options:
  - The broker may retain the discount as additional compensation.
  - The broker may not benefit from any of the merchant's discounts or processing fees.
  - The broker may apply the discount to reduce the amount deposited in the trust account.
  - The broker may pass the discount to the buyer as a closing cost credit.
key: B
explanation: Under OAR 863-015-0257(5)(c), an authorized principal broker may not benefit from any
  merchant discount or processing fee generated by a credit‑card transaction. Retaining the discount
  as additional compensation would be a prohibited benefit, making that option incorrect.
