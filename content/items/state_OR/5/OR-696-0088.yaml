stem: Under OAR 863-015-0260(2), where must an authorized principal broker store records of
  professional real estate activity?
options:
  - In a secure location protected from unauthorized access
  - In the broker's personal residence office desk
  - In a publicly accessible online storage folder system
  - In the office of the nearest title company manager
key: A
explanation: The rule requires authorized principal brokers to store records in a secure location
  protected from unauthorized access. Storing records in a personal residence, publicly accessible
  folder, or title company office does not meet this security requirement.
