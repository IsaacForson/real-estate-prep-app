stem: Under OAR 863-015-0250(2), how soon must a real estate licensee transmit a received document
  to the authorized principal broker?
options:
  - Within 10 business days of receipt
  - Within 5 business days of receipt
  - Within 3 banking days of receipt
  - Within 7 banking days of receipt
key: C
explanation: The rule requires transmission within 3 banking days of the licensee's receipt of the
  document. The distractor of 5 business days is incorrect because the rule specifies banking days,
  not business days, and the timeframe is three, not five.
citation:
  source: Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-015-0250
  url: null
  quoted_text: When a real estate licensee receives any document referred to in (1) of this rule, the
    real estate licensee must transmit the document to the licensee’s authorized principal broker
    within 3 banking days of real estate broker’s receipt of the document.
