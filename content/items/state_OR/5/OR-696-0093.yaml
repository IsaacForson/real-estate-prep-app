stem: A broker receives an earnest money check made payable to the buyer. The written sale agreement
  states that the broker is holding the check un-deposited and will deposit it upon acceptance of
  the offer. According to OAR 863-015-0257(2)(a), may the broker hold the check un-deposited until
  the offer is accepted or rejected?
options:
  - The broker may hold the check un-deposited because the agreement specifies the holding
    arrangement and deposit timing
  - The broker may not hold the check un-deposited; only checks made payable to the seller may be
    held un-deposited
  - The broker may hold the check un-deposited only if the check is less than $1,000 and the buyer
    agrees in writing
  - The broker may not hold the check un-deposited; earnest money checks must be deposited within
    three banking days
key: A
explanation: OAR 863-015-0257(2)(a) allows a check to be held un-deposited if the written sale
  agreement states the broker is holding the check un-deposited and specifies where and when it will
  be deposited upon acceptance. The agreement in the scenario meets these conditions, so holding is
  permitted. The distractor that only seller‑payable checks may be held un‑deposited misstates the
  rule, which applies to any earnest money check when the agreement includes the required terms.
citation:
  source: "### Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
    25; filed Oct. 9, 2025, effective Jan. 1, 2026) — § 863-015-0257"
  url: null
  quoted_text: (a) The check may be held un-deposited until the offer is accepted or rejected,
    provided that the written sale agreement states that the real estate broker or principal broker
    is holding the check un-deposited and further states where and when the check will be deposited
    upon acceptance of the offer;
