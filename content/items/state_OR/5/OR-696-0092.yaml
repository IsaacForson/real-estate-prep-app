stem: A broker receives cash as earnest money on a Wednesday morning. By the end of which day must
  the broker deliver the funds to the authorized principal broker to comply with OAR
  863-015-0257(1)?
options:
  - End of day Thursday
  - End of day Friday
  - End of day Monday
  - End of day Tuesday
key: C
explanation: OAR 863-015-0257(1) requires delivery of any earnest money within three banking days.
  Counting Thursday, Friday, and Monday as the three banking days after a Wednesday receipt, the
  funds must be delivered by end of Monday. Delivering by end of Friday would be only two banking
  days, which is insufficient.
citation:
  source: "### Or. Admin. R. ch. 863 (Real Estate Agency) — Oregon Real Estate Agency permanent
    administrative rules filing implementing HB 3137 (OAR chapter 863, divisions 14, 15, 20, 22, 24,
