stem: Under RCW 18.85.255, what form must notice of a change of business or records depository
  location take?
options:
  - Via email to the firm's clients
  - Verbally to the managing broker
  - Through a public newspaper notice
  - In writing to the director
key: D
explanation: The rule requires that notice of a location change be given in writing to the director.
  The distractor suggesting verbal notice to the managing broker is incorrect because the statute
  specifies written notice to the director, not verbal communication to another party.
citation:
  source: Wash. Rev. Code ch. 18.85 § 18.85.255
  url: null
  quoted_text: A designated broker, managing broker, or firm shall give notice in writing to the
    director of any change of that licensee's business or records depository location.
