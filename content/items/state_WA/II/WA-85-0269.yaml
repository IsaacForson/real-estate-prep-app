stem: A broker completed 40 clock hours of approved continuing education in the first year of her
  licensure period and 10 clock hours in the second year. How many of those hours may be carried
  forward to the next renewal period under RCW 18.85.211?
options:
  - $10 hours
  - $20 hours
  - $15 hours
  - $5 hours
key: C
explanation: The broker earned a total of 50 clock hours, which exceeds the required 30 by 20 hours,
  but only up to 15 excess hours may be carried forward. The $20 hours distractor incorrectly
  assumes all excess hours are transferable.
citation:
  source: Wash. Rev. Code ch. 18.85 — RCW Chapter 18.85 — Real Estate Brokers and Managing Brokers — §
    18.85.211
  url: null
  quoted_text: Up to 15 clock hours of instruction in excess of the required 30 clock hours acquired
    within the immediately preceding two-year period may be carried forward for credit in a
    subsequent two-year period.
  secondary: []
math:
  worked_solution: |-
    40 + 10 = 50 total hours
    50 - 30 = 20 excess hours
    min(20, 15) = 15 hours carry forward
