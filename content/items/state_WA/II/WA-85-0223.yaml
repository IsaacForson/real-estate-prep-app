stem: What is required to activate a broker license that has been inactive for three or more years?
options:
  - Completion of a thirty clock hour course in advanced real estate practices or real estate law
    approved by the director
  - Completion of a forty-five clock hour course in real estate finance approved by the director
  - Completion of a sixty clock hour course in property management approved by the director
  - Completion of a fifteen clock hour course in fair housing approved by the director
