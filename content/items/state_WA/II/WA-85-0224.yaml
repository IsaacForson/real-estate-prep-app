stem: Under RCW 18.85.291, what action by a designated broker may result in disciplinary action
  against the firm?
options:
  - The designated broker's failure to display the firm's license at the office in a conspicuous
    location.
  - The designated broker's failure to promptly notify the director of a broker's termination after
    demand by the affected broker.
  - The designated broker's failure to collect continuing education credits before renewal as
    required by state rule.
  - The designated broker's failure to maintain a trust account for earnest money deposits as
    required by state rule.
key: B
explanation: The statute states that a designated broker’s failure to promptly notify the director
  of a broker’s or managing broker’s termination after demand by the affected broker is grounds for
  disciplinary action against the firm and the designated broker. The other options describe conduct
  not mentioned in this provision as a basis for discipline.
citation:
