stem: A broker ceases to represent her firm but does not submit written notice to the designated
  broker. According to RCW 18.85.291, what is the status of her license?
options:
  - The license is automatically transferred to the firm
  - The license remains active until surrendered
  - The license ceases to be in force
  - The license is suspended pending notice
key: C
explanation: RCW 18.85.291 provides that a broker's license shall cease to be in force when the
  broker ceases to represent the firm, regardless of whether written notice is submitted. Therefore,
  the license is no longer in force. The option stating that the license is automatically
  transferred to the firm is incorrect because the statute does not transfer the license. The option
  stating that the license remains active until surrendered is incorrect because the license ceases
  to be in force immediately upon ceasing representation, irrespective of surrender. The option
  stating that the license is suspended pending notice is incorrect because the statute provides for
  cessation of force, not suspension.
citation:
  source: Wash. Rev. Code ch. 18.85 — RCW Chapter 18.85 — Real Estate Brokers and Managing Brokers — §
    18.85.291
  url: null
  quoted_text: The licenses of a real estate broker and managing broker shall be kept at all times by
    their firm and when real estate brokers or managing brokers cease to represent the firm, their
    licenses shall cease to be in force.
