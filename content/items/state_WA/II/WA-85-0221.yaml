stem: A county employee who holds an active real estate broker license conducts real estate
  transactions on behalf of the county as part of job duties. Under RCW 18.85.081, what is the
  responsibility of the employee's managing broker regarding those transactions?
options:
  - The managing broker is responsible for the employee's real estate transactions on behalf of the
    county
  - The managing broker is liable for the employee's real estate transactions on behalf of the county
  - The managing broker is not responsible for the employee's real estate transactions on behalf of
    the county
  - The managing broker is required to supervise the employee's real estate transactions on behalf
    of the county
key: C
explanation: The statute states that designated and managing brokers are not responsible for the
  real estate transactions of persons licensed under this chapter who are employed by a town, city,
  or county and acting on behalf of that employer. Therefore, the managing broker has no
  responsibility for those transactions. The distractor that claims the managing broker must
  supervise and be liable is contrary to the statutory language.
citation:
  source: Wash. Rev. Code ch. 18.85 — RCW Chapter 18.85 — Real Estate Brokers and Managing Brokers — §
    18.85.081
  url: null
  quoted_text: Persons licensed under this chapter who are employed by a town, city, or county, and
    who are conducting real estate transactions on behalf of the town, city, or county, may hold
    active licenses under this chapter, and their designated and managing brokers are not
    responsible for their real estate transactions on behalf of their town, city, or county
    employer.
