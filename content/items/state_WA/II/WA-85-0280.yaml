stem: An applicant has 28 months of full-time broker experience within the past 48 months. Under RCW
  18.85.111, does this experience satisfy the minimum experience requirement for a managing broker's
  license?
options:
  - The applicant's experience satisfies the requirement because it exceeds two years.
  - The applicant's experience satisfies the requirement because it falls within the five‑year
    window.
  - The applicant's experience does not satisfy the requirement because it is less than three years.
  - The applicant's experience does not satisfy the requirement because it occurred more than five
    years ago.
key: C
explanation: RCW 18.85.111(1)(c) requires a minimum of three years of licensed experience as a
  full‑time real estate broker within the five years previous to applying. Twenty‑eight months is
  less than the required thirty‑six months, so the requirement is not met. The distractor citing the
  five‑year window is incorrect because merely falling within that window does not satisfy the
  three‑year minimum.
