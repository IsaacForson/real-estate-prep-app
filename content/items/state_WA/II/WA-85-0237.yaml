stem: A real estate firm organized as a limited liability company filed its certificate of authority
  with the Washington Secretary of State on April 1, 2024, and that certificate expires on April 1,
  2026. Assuming the firm otherwise meets all licensing requirements, on what date will its firm
  license expire under RCW 18.85.191?
options:
  - April 1, 2028
  - April 1, 2024
  - April 1, 2026
  - April 1, 2030
key: C
explanation: RCW 18.85.191 provides that licenses issued to real estate firms that are LLCs expire
  on the date when the certificate of authority filed with the secretary of state expires. Since the
  certificate expires April 1, 2026, the firm license expires on that date. Adding two years to the
  filing or expiration date is incorrect.
