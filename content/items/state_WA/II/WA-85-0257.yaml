stem: A broker terminates affiliation with their firm and does not submit written notice to the
  designated broker. After the broker demands action, what may result under RCW 18.85.291?
options:
  - Automatic reinstatement of the broker's license
  - Required payment of a $500 penalty to the director
  - Immediate cancellation of the firm's license by the director
  - Grounds for disciplinary action against the firm
key: D
explanation: The statute states that failure to promptly notify the director after demand is grounds
  for disciplinary action against the firm and designated broker. The distractor about automatic
  reinstatement is incorrect because the rule does not provide for reinstatement; it only addresses
  disciplinary consequences for the firm.
citation:
  source: Wash. Rev. Code ch. 18.85 § 18.85.291
  url: null
  quoted_text: Failure of any designated broker for the firm to promptly notify the director of a
    broker's or managing broker's termination after demand by the affected broker or managing broker
    shall be grounds for disciplinary action against the firm and designated broker.
