stem: An out-of-state licensee wants to perform commercial real estate acts in Washington under RCW
  18.85.131 without a Washington license. What arrangement makes this lawful?
options:
  - A referral fee paid directly to the department
  - Cooperating with a WA broker on active status
  - Registration with the county assessor's office
  - Approval from the buyer's out-of-state attorney
