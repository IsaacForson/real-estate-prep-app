stem: A broker who held an active license in another state in good standing but allowed it to lapse
  nine months ago wants to take the Washington broker examination. Under WAC 308-124A-720, what
  portion of the examination must this applicant take?
options:
  - Only the national portion of the exam
  - Both national and Washington law sections
  - Only the Washington law portion of the exam
  - Neither portion; the applicant is not exempt
key: B
explanation: The rule grants the Washington law portion only to those currently active or active
  within the preceding six months. Since the license lapsed nine months ago, the applicant must take
  both portions. The distractor suggesting only the Washington law portion incorrectly assumes the
  lapse still qualifies.
citation:
  source: Wash. Admin. Code ch. 308-124A — WAC Chapter 308-124A — Real Estate—Licensing and
    Examination — § 308-124A-720
  url: null
  quoted_text: (1) Any person applying for a broker or managing broker examination who is actively
    licensed in the same or greater capacity in another jurisdiction and has maintained his or her
    license in good standing or who was actively licensed in the same or greater capacity in good
    standing within the preceding six months is only required to take the Washington law portion of
    the examination.
