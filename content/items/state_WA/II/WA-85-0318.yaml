stem: A trustee appointed by probate court sells a decedent's home under court order without acting
  as a broker. Under RCW 18.85.151, is a real estate license required for this transaction?
options:
  - The person is required to obtain a real estate license before proceeding.
  - The person is required to complete ninety hours of approved instruction.
  - The person is exempt from licensing requirements for this transaction.
  - The person is required to pass the broker license examination to act.
key: C
explanation: RCW 18.85.151(4) exempts any person acting under the order of any court, such as a
  trustee selling property pursuant to a court order, from licensing requirements. The distractor
  that a license must be obtained is incorrect because the exemption applies regardless of
  licensure.
