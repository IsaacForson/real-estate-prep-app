stem: A broker was licensed when she first offered to help a seller sell a house, but her license
  expired before the closing. She later sues the seller for commission. Under RCW 18.85.331, can she
  recover compensation?
options:
  - She cannot recover compensation because her license was not active at the time of closing.
  - She can recover compensation only if she renews her license before filing the lawsuit.
  - She can recover compensation because she was licensed at the time she made the offer to perform
    the transaction.
  - She cannot recover compensation because she did not have a license when the lawsuit was filed.
key: C
explanation: The law requires the plaintiff to prove they were licensed before offering to perform
  the transaction; licensure at closing or at lawsuit filing is irrelevant. The distractor focusing
  on renewal before lawsuit misstates the timing requirement.
