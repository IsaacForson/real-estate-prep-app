stem: Under RCW 18.85.011, how is the term "clear and conspicuous" defined for advertising statements?
options:
  - The representation or term being used is of such a color, contrast, size, or audibility, and
    presented in a manner so as to be readily noticed and understood.
  - The representation or term being used is of such a color, contrast, size, or audibility, and
    presented in a manner so as to be noticeable but not necessarily understood.
  - The representation or term being used is of such a color, contrast, size, or audibility, and
    presented in a manner so as to be readily noticed but not understood.
  - The representation or term being used is of such a font style, color contrast, or size, and
    presented in a manner so as to be easily readable.
key: A
explanation: RCW 18.85.011(4) defines “clear and conspicuous” as requiring the representation or
  term to be of such a color, contrast, size, or audibility and to be presented in a manner so as to
  be readily noticed and understood. The answer that states exactly that wording matches the
  statutory definition. Answers that change the required effect to merely “noticeable” without
  understanding, that add “font style” or omit audibility, or that describe the presentation only as
  “easily readable” do not reflect the language of the statute.
