stem: A managing broker is registered as designated broker for one firm and later accepts an
  endorsement to also serve as designated broker for a second, unrelated firm. Based on RCW
  18.85.121, is this arrangement permitted?
options:
  - No, because a designated broker may serve just one firm at a time
  - Yes, if the firms share common ownership interests
  - No, unless the department issues a special waiver
  - Yes, because a designated broker may act for more than one firm
key: D
explanation: The statute expressly allows a designated broker to act as designated broker for more
  than one firm, provided the department registers the designated broker for each.
