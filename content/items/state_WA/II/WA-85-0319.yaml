stem: A friend refers a buyer to a broker for a flat fee regardless of whether the transaction
  closes and does not participate in negotiations or paperwork. Under RCW 18.85.151, is a real
  estate license required for this referral activity?
options:
  - The person is exempt from licensing requirements for this referral activity.
  - The person must obtain a real estate license before making referrals.
  - The person must first complete ninety hours of approved instruction.
  - The person must pass the broker license examination to receive referral fees.
key: A
explanation: RCW 18.85.151(8) exempts any person providing referrals to licensees who is not
  involved in negotiation, execution of documents, or related brokerage services, and whose
  compensation is not contingent upon receipt of compensation by the licensee or firm. The flat fee
  described is non‑contingent, so the exemption applies. The distractor claiming a license is
  required ignores this exemption.
