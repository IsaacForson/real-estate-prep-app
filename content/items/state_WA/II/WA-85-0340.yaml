stem: Under RCW 18.85.131, which of the following is **NOT** required for an out-of-state licensee
  to be exempt from Washington real estate licensing requirements?
options:
  - A written agreement with the Washington firm that includes oversight, compensation, and a
    statement to adhere to Washington laws
  - Providing the Washington designated broker with a copy of the out-of-state licensee's current
    license in good standing
  - Cooperation with a Washington designated broker who holds a valid, active managing broker license
  - Payment of a fee to the Washington State Real Estate Commission for the exemption
key: D
explanation: The statute lists six specific conditions that an out-of-state licensee must satisfy to
  act without a Washington license; payment of a fee to the commission is not among them. The most
  tempting distractor, which states that the licensee must cooperate with a Washington designated
  broker who holds a valid, active managing broker license, describes a required condition, so it is
  incorrect.
citation:
  source: "### Wash. Rev. Code ch. 18.85 — RCW Chapter 18.85 — Real Estate Brokers and Managing
    Brokers — § 18.85.131"
  url: null
  quoted_text: (a) Works in cooperation with a Washington real estate designated broker who holds a
    valid, active managing broker license issued under this chapter; (b) Enters into a written
    agreement with the Washington firm, through its designated broker, that includes the terms of
    cooperation, oversight by the Washington designated broker, compensation, and a statement that
    the approved out-of-state licensee and its agents will agree to adhere to the laws of
    Washington; (c) Furnishes the Washington designated broker with a copy of the out-of-state
    approved licensee's current license in good standing from any jurisdiction where the
    out-of-state approved licensee maintains an active real estate license; (d) Consents to
    jurisdiction that legal actions arising out of the conduct of the approved out-of-state licensee
    or its agents may be commenced against the approved licensee in the court of proper jurisdiction
    of any county in Washington where the cause of action arises or where the plaintiff resides; (e)
    Includes the name of the Washington broker, managing broker, or firm on all advertising in
    accordance with RCW 18.85.361 (8); and (f) Deposits all documentation required by this section
    and records and documents related to the transaction with the Washington broker, managing
    broker, or firm for a period of three years after the date the documentation is provided, or the
    transaction occurred, as appropriate.
