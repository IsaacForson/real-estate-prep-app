stem: A real estate broker who held an active license in Oregon in good standing allowed that
  license to lapse nine months ago. The broker now wishes to take the Washington real estate broker
  examination. According to WAC 308-124A-720, which portion(s) of the examination must this
  applicant take?
options:
  - Both the national and Washington law sections of the exam.
  - Only the national portion of the broker examination.
  - Neither section; the broker is exempt from the exam.
  - Only the Washington law portion of the broker examination.
key: A
explanation: The exemption applies only if the license was active or in good standing within the
  preceding six months. A lapse of nine months exceeds that period, so the broker must take both the
  national and Washington law portions.
citation:
  source: "### Wash. Admin. Code ch. 308-124A — WAC Chapter 308-124A — Real Estate—Licensing and
    Examination — § 308-124A-720"
  url: null
  quoted_text: Any person applying for a broker or managing broker examination who is actively
    licensed in the same or greater capacity in another jurisdiction and has maintained his or her
    license in good standing or who was actively licensed in the same or greater capacity in good
    standing within the preceding six months is only required to take the Washington law portion of
    the examination.
