stem: A licensee completed a three-hour core curriculum course 30 months before their renewal date.
  Under WAC 308-124A-800, how may this course be used for renewal?
options:
  - The course may count toward the core curriculum requirement and as regular continuing education
    credit
  - The course may not count toward the core curriculum requirement but may apply as regular
    continuing education credit
  - The course may count toward the core curriculum requirement but may not apply as regular
    continuing education credit
  - The course may neither count toward the core curriculum requirement nor apply as regular
    continuing education credit
key: B
explanation: WAC 308-124A-800 states that core curriculum completed between 24 and 36 months before
  renewal does not satisfy the core requirement but may count as regular continuing education. Since
  30 months falls in that range, the course applies only as regular CE. The distractor A incorrectly
  claims it can also satisfy the core requirement.
