stem: A managing broker moves her firm's office to a new address. What must she do to update the
  license for the new location under RCW 18.85.255?
options:
  - The managing broker must give written notice to the director and pay the required fee, but may
    keep the original license.
  - The managing broker must surrender the original license and pay the required fee, but need not
    give written notice.
  - The managing broker must give written notice to the director, surrender the original license,
    and pay the required fee.
  - The managing broker must give written notice to the director and surrender the original license,
    but need not pay any fee.
key: C
explanation: RCW 18.85.255 requires that a managing broker give written notice to the director,
  surrender the original license, and pay the prescribed fee when the office location changes. A
  broker who only gives notice and pays the fee but keeps the original license does not satisfy the
  statute. A broker who gives notice and surrenders the license but does not pay the fee also fails,
  as does a broker who gives notice and surrenders the license but omits the fee requirement.
citation:
  source: Wash. Rev. Code ch. 18.85 — RCW Chapter 18.85 — Real Estate Brokers and Managing Brokers — §
    18.85.255
  url: null
  quoted_text: A designated broker, managing broker, or firm shall give notice in writing to the
    director of any change of that licensee's business or records depository location. Upon the
    surrender of the original license for the business and a payment of a fee as prescribed by the
    director by rule, the director shall issue a new license covering the new location.
