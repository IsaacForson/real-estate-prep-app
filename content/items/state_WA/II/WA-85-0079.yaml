stem: An owner sells their personal residence without the assistance of a real estate broker. Under
  RCW 18.85.151, is the owner required to hold a real estate license to conduct this sale?
options:
  - The owner must be affiliated with a licensed broker to complete the sale of their personal
    residence.
  - The owner must obtain a temporary permit from the department before proceeding with any real
    estate transaction.
  - The owner is exempt from licensing requirements when selling property for their own account, as
    stated in the exemption statute.
  - The owner must hold a license because any transfer of real estate requires broker involvement
    under state law.
key: C
explanation: Exemption (1) excludes from licensing any person who disposes of property for their own
  account. The owner selling their personal residence falls under this exemption, so no license is
  required. The statement that the owner must be affiliated with a licensed broker to complete the
  sale of their personal residence is incorrect because it overlooks the statutory exemption for
  own-account transactions.
