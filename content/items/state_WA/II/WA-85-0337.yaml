stem: Under RCW 18.85.191, when does a firm license for a limited liability company expire?
options:
  - The firm license expires two years from the date of issuance, regardless of the entity type, as
    stated in the general rule for firm licenses.
  - The firm license expires on the date when the certificate of authority filed with the secretary
    of state expires.
  - The firm license expires on the date when the designated broker's license expires, if the broker
    is the sole owner.
  - The firm license expires on the date when the firm's master business license expires, as
    required for renewal.
key: B
explanation: "RCW 18.85.191 specifies that licenses issued to real estate firms that are
  partnerships, limited liability partnerships, limited liability companies, corporations, and other
  legally recognized business entities expire on the date when the registration or certificate of
  authority filed with the secretary of state expires. The other options describe expiration rules
  that do not apply: the two‑year rule is for general firm licenses under WAC 308-124A-735, while
  master business license and designated broker license expiration are not controlling factors for
  firm license term under this statute."
