stem: A firm's master business license expired on March 1, 2025. The firm submits a renewal
  application for its real estate firm license on April 1, 2025. What must the firm do to have its
  renewal application accepted under WAC 308-124A-740?
options:
  - The firm must renew its master business license and submit proof of the current license.
  - The firm must submit the expired master business license with a written explanation.
  - The firm must complete 30 clock hours of continuing education instead, as allowed for individual
    license renewals.
  - The firm must pay a late renewal penalty fee, as required when the renewal application is
    submitted after the expiration date.
key: A
explanation: WAC 308-124A-740 requires applicants for renewal of a firm license to furnish proof of
  a current master business license renewed by the secretary of state. An expired license does not
  satisfy this requirement, so the firm must first renew the master business license and then
  provide proof of its current status. The other options describe actions that are either
  insufficient or unrelated to the firm license renewal proof requirement.
