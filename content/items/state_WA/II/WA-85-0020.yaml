stem: A newly formed real estate firm is applying for its first firm license under RCW 18.85.091.
  What must it do regarding a designated broker to meet the minimum requirement?
options:
  - Hiring a compliance officer independent of any broker
  - Waiting until after licensure to name a designated broker
  - Designating a managing broker as the firm's designee
  - Letting any licensed broker act as designated broker at will
key: C
explanation: The statute requires a firm seeking licensure to designate a managing broker as its
  "designated broker" with authority to act for the firm before the license requirement is
  satisfied.
citation:
  source: Wash. Rev. Code § 18.85.091
  url: null
  quoted_text: Designates a managing broker as the "designated broker" who has authority to act for
    the firm, and provides the director with the name of the owner or owners or any others with a
    controlling interest in the firm;
