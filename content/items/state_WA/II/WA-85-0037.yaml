stem: A licensee's real estate license has been inactive for four years, and the licensee is not a
  state employee conducting transactions for the state. Under RCW 18.85.265, what must the licensee
  show before returning to active status?
options:
  - Proof of passing a new fingerprint background check instead
  - Proof of completing a thirty clock hour course in one year
  - Proof of retaking the full broker licensing examination
  - Proof of three years of newly supervised real estate experience
key: B
explanation: The statute requires a holder whose license has been inactive more than three years to
  show proof of successfully completing a thirty clock hour course in real estate within one year
  before applying for active status.
