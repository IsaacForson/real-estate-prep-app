stem: A managing broker informs a departing broker that the broker's license will not be surrendered
  until the broker completes a pending transaction. Under WAC 308-124A-730, what is the consequence
  of the managing broker's action?
options:
  - The managing broker's action is permissible if the broker agrees in writing.
  - The managing broker's action constitutes a violation that may lead to disciplinary action.
  - The managing broker's action is required to protect the firm's interests.
  - The managing broker's action has no effect on the license surrender process.
key: B
explanation: The rule prohibits a managing broker from conditioning the surrender of a license on
  any act by the broker or managing broker. Conditioning surrender on completing a transaction
  violates this prohibition and may lead to disciplinary action. The other options incorrectly
  suggest the action is allowed, required, or inconsequential.
citation:
