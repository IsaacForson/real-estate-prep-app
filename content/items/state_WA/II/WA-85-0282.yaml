stem: A managing broker receives a written notice of termination from a broker on March 10, 2024,
  via certified mail. The managing broker forwards the notice and the surrendered license to the
  real estate program on March 14, 2024. What is the termination date of the broker's license under
  WAC 308-124A-730?
options:
  - March 10, 2024
  - March 14, 2024
  - March 17, 2024
  - March 20, 2024
key: B
explanation: The rule specifies that the termination date is the postmark date, fax date, or date
  the license is hand delivered to the real estate program. Since the license was hand delivered on
  March 14, 2024, that date controls. The earlier mailing date is not controlling under the
  provision.
