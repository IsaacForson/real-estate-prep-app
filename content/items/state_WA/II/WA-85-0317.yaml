stem: Under RCW 18.85.011, how is the term 'advertising' defined?
options:
  - Any attempt by publication or broadcast, whether oral, written, or otherwise, to induce a person
    to use the services of a real estate firm, broker, managing broker, or designated broker.
  - Any written notice posted on a property to attract potential buyers, including signs, flyers,
    newspaper advertisements, online listings, or direct mail campaigns.
  - Any oral statement made to a client about the price of a property, including discussions of
    market value, appraisal estimates, or listing price.
  - Any social media post that mentions real estate services, such as Facebook updates, tweets,
    Instagram stories promoting listings, or LinkedIn articles sharing property details.
key: A
explanation: The definition of advertising is explicitly stated in RCW 18.85.011(1) as any attempt
  by publication or broadcast to induce a person to use the services of a real estate firm, broker,
  managing broker, or designated broker. The distractor about written notices describes a type of
  advertisement but is not the statutory definition.
