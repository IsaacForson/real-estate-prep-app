stem: Under RCW 18.85.011, what does the term 'business opportunity' include?
options:
  - A business, business entity, and goodwill of an existing business, or any combination thereof
    when the transaction includes an interest in real property.
  - Any parcel of real estate other than real estate containing one to four residential units.
  - The ability to control either the operational or financial, or both, decisions of a firm.
  - An attempt by publication or broadcast to induce a person to use the services of a real estate
    firm, broker, managing broker, or designated broker.
key: A
explanation: The statute defines 'business opportunity' as including a business, business entity,
  and goodwill of an existing business, or any combination thereof, when the transaction includes an
  interest in real property. The option describing any parcel of real estate other than
  one‑to‑four‑unit residential property defines commercial real estate, not a business opportunity.
  The option describing the ability to control operational or financial decisions of a firm defines
  controlling interest. The option describing an attempt by publication or broadcast to induce a
  person to use the services of a real estate firm or broker defines advertising.
