stem: An applicant for a managing broker's license has two years of full-time broker experience
  within the past five years. Under RCW 18.85.111, does this meet the minimum requirement?
options:
  - Yes, provided the applicant is licensed in another state
  - No, three years of licensed experience is required
  - No, the applicant would instead need a lifetime license
  - Yes, two years of experience satisfies the requirement
key: B
explanation: The statute requires a minimum of three years of licensed experience as a full-time
  real estate broker within the five years preceding the managing broker examination application, so
  two years is insufficient.
