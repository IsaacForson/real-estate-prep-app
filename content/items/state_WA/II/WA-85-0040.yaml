stem: A city employee holds an active real estate broker license and conducts real estate
  transactions solely on behalf of the city as part of the employee's job duties. Under RCW
  18.85.081, how does this affect the supervising designated broker?
options:
  - The designated broker is not responsible for those city-related transactions
  - The designated broker has to terminate the employee's affiliation
  - The designated broker remains fully responsible as with any other transaction
  - The designated broker has to file a separate supervision plan
key: A
explanation: The statute provides that designated and managing brokers are not responsible for the
  real estate transactions their town, city, or county employee-licensees conduct on behalf of that
  government employer.
