stem: An applicant for a Washington real estate broker license had a fingerprint background check
  completed five years ago and has not had any new check since. Under WAC 308-124A-700, what is
  required for this applicant to activate the license?
options:
  - Submit a new fingerprint background check for renewal.
  - Retake the national portion of the broker examination.
  - Provide a letter of good standing from the prior jurisdiction.
  - No new fingerprint background check is required.
key: D
explanation: The rule states that if a department background check was within the last six years, no
  new background check is required to activate a license. Since the check was five years ago, the
  applicant is exempt from a new check. Providing a letter of good standing or retaking the exam is
  not mentioned as a substitute.
citation:
  source: "### Wash. Admin. Code ch. 308-124A — WAC Chapter 308-124A — Real Estate—Licensing and
    Examination — § 308-124A-700"
  url: null
  quoted_text: Fingerprint background checks are required for every active renewal every six years. If
    the department background check was within the last six years, then no new background check is
    required to activate a license.
