stem: A designated broker receives a demand from a broker who has terminated affiliation but waits
  two weeks before notifying the director. Under RCW 18.85.291, what is the result?
options:
  - The designated broker's delay in notifying the director after demand is permissible if the
    broker receives written confirmation.
  - The designated broker's delay in notifying the director after demand is required to allow the
    firm to reassign listings.
  - The designated broker's delay in notifying the director after demand may be grounds for
    disciplinary action.
  - The designated broker's delay in notifying the director after demand does not affect the
    broker's license status.
key: C
explanation: The statute provides that a designated broker’s failure to promptly notify the director
  of a broker’s termination after demand by the affected broker is grounds for disciplinary action
  against the firm and the designated broker. A two‑week delay is not prompt, so disciplinary action
  may follow. The other options incorrectly suggest the delay is allowed, required, or irrelevant.
