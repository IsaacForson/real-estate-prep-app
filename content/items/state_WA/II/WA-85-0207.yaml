stem: Under RCW 18.85.011, how is the term 'controlling interest' defined?
options:
  - It is defined as the authority to hire and fire employees of a real estate firm.
  - It is defined as the ability to control either the operational or financial, or both, decisions
    of a firm.
  - It is defined as the responsibility to supervise all licensed brokers employed by a firm.
  - It is defined as the ownership of more than fifty percent of a firm's voting stock.
key: B
explanation: The statute defines controlling interest as the ability to control either the
  operational or financial, or both, decisions of a firm. The distractor about hiring and firing
  authority is incorrect because the definition does not mention personnel authority.
