stem: Which of the following parcels would be considered commercial real estate under RCW 18.85.011(6)?
options:
  - A condominium unit in a building, sold for residential use.
  - A vacant lot zoned for commercial use, sold for building an office building.
  - A duplex with two units, both rented to tenants.
  - A single-family home on its own lot, sold for residential use.
key: B
explanation: Under RCW 18.85.011(6), commercial real estate is any parcel of real estate other than
  real estate containing one to four residential units. The vacant lot zoned for commercial use and
  intended for an office building contains no residential units, so it meets the definition. The
  condominium unit sold for residential use, the duplex with two rental units, and the single-family
  home sold for residential use each contain one to four residential units and are not intended for
  commercial use, so they do not qualify.
