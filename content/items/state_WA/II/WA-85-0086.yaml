stem: A broker decides to stop working for her firm and wants to keep her license active. What must
  she do under RCW 18.85.291 to terminate her affiliation with the firm?
options:
  - The broker must submit written notice to the designated broker and surrender her license, which
    the firm will forward to the director.
  - The broker must submit written notice to the designated broker but may keep her license active
    with the firm.
  - The broker must surrender her license to the firm but need not provide any written notice.
  - The broker must submit written notice to the director directly and surrender her license to the
    firm.
key: A
explanation: RCW 18.85.291 requires a broker who ends affiliation with a firm to give written notice
  to the firm’s designated broker and to surrender the license; the designated broker then forwards
  both the notice and the surrendered license to the director. Providing notice but keeping the
  license active, surrendering the license without written notice, or sending notice directly to the
  director does not satisfy the statutory requirement.
citation:
  source: Wash. Rev. Code ch. 18.85 — RCW Chapter 18.85 — Real Estate Brokers and Managing Brokers — §
    18.85.291
  url: null
  quoted_text: Brokers and managing brokers must submit written notification to the designated broker
    for their firm when they terminate affiliation with their firm. The firm, through the designated
    broker, shall give notice to the director and such notice shall be accompanied by and include
    the surrender of the broker's or managing broker's license.
