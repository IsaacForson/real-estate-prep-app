stem: A real estate firm’s master business license expired two months ago. The firm submits its
  license renewal application without updating the master business license. What is the likely
  outcome under WAC 308-124A-740?
options:
  - The licensee must submit proof of a current master business license renewed by the secretary
  - The licensee must submit proof of a current real estate broker license issued by the state
  - The licensee must submit proof of a current certificate of insurance from the commissioner
  - The licensee must submit proof of a current federal tax ID verified by the department
key: A
explanation: WAC 308-124A-740 requires applicants for renewal of a firm license to furnish proof of
  a current master business license renewed by the secretary of state. Since the master business
  license is expired, the renewal will be denied. The other proofs, while possibly useful, do not
  satisfy this specific requirement.
