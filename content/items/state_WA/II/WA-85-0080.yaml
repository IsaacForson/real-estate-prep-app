stem: An individual acts as a real estate broker without a license and later sues for commission.
  Under RCW 18.85.331, what must the plaintiff prove to recover compensation for brokerage services?
options:
  - The plaintiff must prove they were a duly licensed real estate broker before offering to perform
    the transaction.
  - The plaintiff must show they had a written agreement with the client for the commission.
  - The plaintiff must demonstrate they were employed by a licensed real estate firm at the time of
    the suit.
  - The plaintiff must verify they disclosed their unlicensed status to the other party before the
    transaction.
key: A
explanation: RCW 18.85.331 provides that a claim for broker compensation is permissible only when
  the plaintiff can demonstrate that he was a duly licensed real estate broker before offering to
  perform any real‑estate transaction. Consequently, the statement that the plaintiff must prove he
  was a duly licensed broker before offering to perform the transaction satisfies the statutory
  requirement. The statement that a written agreement is required is inaccurate because the statute
  does not condition recovery on a written contract; the licensing prerequisite is controlling. The
  statement that the plaintiff must have been employed by a licensed real‑estate firm is also
  incorrect, as personal licensure—not firm employment—is the element the statute demands. Finally,
  the statement that disclosure of an unlicensed status cures the deficiency is wrong; disclosure
  does not satisfy the licensing condition imposed by the law.
citation:
  source: "### Wash. Rev. Code ch. 18.85 — RCW Chapter 18.85 — Real Estate Brokers and Managing
    Brokers — § 18.85.331"
  url: null
  quoted_text: No suit or action shall be brought for the collection of compensation as a real estate
    broker, real estate firm, managing broker, or designated broker, without alleging and proving
    that the plaintiff was a duly licensed real estate broker, managing broker, or real estate firm
    before the time of offering to perform any real estate transaction or procuring any promise or
    contract for the payment of compensation for any contemplated real estate transaction.
