stem: A person purchases a duplex for their own investment and does not act as a broker. Under RCW
  18.85.151, is a real estate license required for this transaction?
options:
  - License not required because the property is a duplex
  - License required because the transaction exceeds a monetary threshold
  - License required because the purchase involves real property
  - License not required because the purchase is for the individual's own account
key: D
explanation: Under RCW 18.85.151(1), a person who purchases or disposes of property for their own
  account is exempt from licensing requirements. Since the duplex is bought for personal investment,
  no license is needed. The assertion that a license is required because the purchase involves real
  property is incorrect because the exemption applies to transactions conducted for one's own
  account, regardless of the property type.
