stem: An out-of-state real estate licensee wants to assist a Washington client in purchasing a
  commercial office building. The licensee holds a current license from Idaho, has entered into a
  written agreement with a Washington designated broker that includes oversight and compensation,
  and has furnished the broker with a copy of the Idaho license. However, the licensee does not
  consent to jurisdiction for legal actions arising from the transaction. Under RCW 18.85.131, may
  the licensee perform the acts requiring a Washington real estate license for this commercial
  transaction?
options:
  - No, because consent to jurisdiction is required.
  - Yes, because the transaction is commercial real estate.
  - Yes, because all other conditions are satisfied.
  - No, because the licensee must also deposit documentation for five years.
key: A
explanation: The statute requires consent to jurisdiction for legal actions arising from the
  licensee's conduct. Without this consent, the licensee may not perform the acts, even if other
  conditions are met.
