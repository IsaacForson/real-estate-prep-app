stem: What proof must be furnished when renewing a firm license under WAC 308-124A-740?
options:
  - Proof of current master business license renewed by the secretary of state
  - Proof of completion of thirty clock hours of continuing education
  - Proof of payment of the biennial renewal license fee
  - Proof of fingerprint and background check completion
key: A
explanation: WAC 308-124A-740 explicitly requires applicants for firm license renewal to furnish
  proof of a current master business license renewed by the secretary of state. The other options,
  while possibly required in other contexts, are not mandated for firm renewal by this rule.
