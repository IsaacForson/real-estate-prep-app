stem: A seller signs a listing agreement that states the seller's agent's firm may share the
  compensation paid by the seller with another firm. Under Washington law, is this permissible?
options:
  - The buyer must also provide written consent to the sharing arrangement, and the consent must be
    notarized and filed with the broker.
  - The sharing must be disclosed to the buyer before the offer is made and included in the purchase
    agreement as a condition of sale.
  - Yes, the seller may agree that the seller's agent's firm may share with another firm the
    compensation paid by the seller.
  - Compensation sharing is prohibited unless both parties are licensed brokers, and the brokers
    must be affiliated with the same firm.
key: C
explanation: RCW 18.86.080(3) allows a seller to agree that the seller's agent's firm may share with
  another firm the compensation paid by the seller. Buyer consent or disclosure is not required for
  this permissibility.
