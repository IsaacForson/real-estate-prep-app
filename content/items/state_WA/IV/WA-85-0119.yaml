stem: A broker meets with an unrepresented buyer at an open house and discusses the property's
  features. According to Washington law, what must the broker do regarding the pamphlet?
options:
  - Provide the pamphlet to the unrepresented buyer
  - Provide the pamphlet only if requested by the buyer
  - Withhold the pamphlet because the buyer is unrepresented
  - Provide the pamphlet only to parties with written consent
key: A
explanation: Under RCW 18.86.120, a broker’s duty includes providing the pamphlet to all parties to
  whom the broker renders real estate brokerage services and to any unrepresented party. This duty
  is unconditional and does not depend on the buyer’s request. The distractor that conditions
  provision on a request is incorrect because the rule imposes no such precondition.
