stem: Under Washington law, what must a real estate firm's services agreement include in order for
  the firm to receive compensation for rendering brokerage services?
options:
  - The date and time of the next scheduled open house.
  - The property's legal description and tax parcel number.
  - The broker's license number and expiration date.
  - The amount the principal agrees to compensate the firm.
key: D
explanation: RCW 18.86.080(7)(a)(i) requires that the services agreement include the amount the
  principal agrees to compensate the firm. The broker's license number is not a required term of the
  services agreement for compensation purposes.
