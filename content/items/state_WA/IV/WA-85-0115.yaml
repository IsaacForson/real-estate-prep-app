stem: A broker wishes to market a residential property exclusively to a group of investor clients.
  Under Washington law, when is this permissible?
options:
  - The broker may market the property exclusively to investor clients only to protect the owner's
    health or safety as determined by a licensed inspector.
  - The broker may not market the property exclusively to investor clients unless the property is
    concurrently marketed to the general public and all other brokers.
  - The broker may market the property exclusively to investor clients if the property is also
    listed on the MLS.
  - The broker may market the property exclusively to investor clients with the owner's written
    consent.
key: B
explanation: The key is correct because RCW 18.86.130 prohibits a broker from marketing residential
  real estate to an exclusive group unless the property is also marketed to the general public and
  all other brokers, with an exception only when it is reasonably necessary to protect the health or
  safety of the owner or occupant. The statement that the broker may market exclusively to investor
  clients only to protect the owner's health or safety as determined by a licensed inspector is
  incorrect because the health‑or‑safety exception applies only when reasonably necessary, not
  merely at the broker’s determination. The claim that exclusive marketing is allowed if the
  property is also listed on the MLS is wrong because MLS listing does not satisfy the requirement
  to market to the general public and all other brokers. The assertion that exclusive marketing is
  permissible with the owner's written consent is false because owner consent alone does not
  override the statutory prohibition; the law requires concurrent marketing to the general public
  and all other brokers except for the health‑or‑safety exception.
citation:
  source: Wash. Rev. Code ch. 18.86 — RCW Chapter 18.86 — Real Estate Brokerage Relationships — § 18.86.130
  url: null
  quoted_text: A broker may not market the sale or lease of residential real estate to a limited or
    exclusive group of prospective buyers or brokers, or any combination thereof, unless the real
    estate is concurrently marketed to the general public and all other brokers, except as
    reasonably necessary to protect the health or safety of the owner or occupant.
