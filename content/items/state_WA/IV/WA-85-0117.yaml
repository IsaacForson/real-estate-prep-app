stem: A seller's agent receives a written offer below the listing price. The seller tells the agent
  not to present the offer. According to Washington law, what must the agent do?
options:
  - Withhold the offer per the seller's instruction.
  - Present the offer to the seller as required.
  - Seek the seller's consent before presenting the offer.
  - Present only if the offer is at or above the listing price.
key: B
explanation: The broker must timely present all written offers to the parties, regardless of the
  seller's instruction. Withholding the offer violates this duty.
