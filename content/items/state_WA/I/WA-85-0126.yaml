stem: Under Washington law, which of the following best describes the term "advertising" as defined
  in RCW 18.85.011?
options:
  - Any communication that discloses material facts about a property to a prospective buyer or tenant
  - Any attempt by publication to induce a person to use the services of a real estate firm broker
    managing broker or designated broker
  - Any publication that lists available real estate properties for sale or lease to the public
  - Any written or oral statement that promotes a real estate licensee's personal achievements in
    the marketplace
key: B
explanation: The statute defines advertising as any attempt by publication or broadcast, whether
  oral, written, or otherwise, to induce a person to use the services of a real estate firm, broker,
  managing broker, or designated broker. The option that describes an attempt by publication to
  induce a person to use the services of a real estate firm, broker, managing broker, or designated
  broker matches that definition. The other choices describe promoting personal achievements,
  disclosing material facts, or merely listing properties, none of which are included in the
  statutory definition of advertising (RCW 18.85.011).
