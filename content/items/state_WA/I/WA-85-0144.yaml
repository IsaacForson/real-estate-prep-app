stem: According to RCW 18.85.011(1), what does the term 'Advertising' mean?
options:
  - any attempt by publication or broadcast, whether oral, written, or otherwise, to induce a person
    to use the services of a real estate firm, broker, or managing broker, but not a designated
    broker.
  - any attempt by publication or broadcast, whether oral, written, or otherwise, to induce a person
    to use the services of a real estate firm, broker, managing broker, or designated broker.
  - any attempt by publication or broadcast, whether oral, written, or otherwise, to induce a person
    to use the services of a real estate firm only.
  - any attempt by publication or broadcast, whether oral, written, or otherwise, to induce a person
    to purchase or sell real estate through a licensed broker.
key: B
explanation: RCW 18.85.011(1) defines advertising as any attempt by publication or broadcast to
  induce a person to use the services of a real estate firm, broker, managing broker, or designated
  broker. The option that limits advertising to inducing a person to purchase or sell real estate
  through a licensed broker is incorrect because it omits the broader purpose of using services and
  excludes managing and designated brokers.
