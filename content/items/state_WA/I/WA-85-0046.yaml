stem: An appellant receives a transcript of the disciplinary hearing and an invoice for its
  preparation costs. If the appellant fails to pay the invoice within fifteen days, what happens to
  the appeal under RCW 18.85.401?
options:
  - The appeal is dismissed for nonpayment of transcript costs
  - The appeal is stayed until payment is received and verified
  - The appeal is automatically granted upon receipt of payment
  - The appeal is referred to the attorney general for review
key: A
explanation: RCW 18.85.401 requires the appellant to pay the transcript cost within fifteen days; if
  the cost is not paid in full within that period, the appeal is dismissed. The distractor
  suggesting a stay is incorrect because the statute provides for dismissal, not a continuance, upon
  nonpayment.
