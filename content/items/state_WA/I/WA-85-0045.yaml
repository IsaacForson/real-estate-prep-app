stem: The director receives a complaint about a broker's false advertising and assigns an assistant
  to investigate. Under RCW 18.85.370, is this permissible?
options:
  - The action is permitted because the director may authorize assistants to perform disciplinary
    duties
  - The action is not permitted because only the director may perform disciplinary duties
  - The action is permitted only if the assistant holds a real estate broker license
  - The action is not permitted unless the attorney general authorizes the assistant
key: A
explanation: RCW 18.85.370 expressly states that the director may authorize one or more assistants
  to perform the director's duties with reference to disciplinary action. Therefore delegating the
  investigation is allowed. The distractor that claims only the director may act contradicts this
  delegation authority.
