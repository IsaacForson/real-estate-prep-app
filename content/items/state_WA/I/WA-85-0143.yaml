stem: Where must all money derived from fines imposed under Washington’s real estate licensing
  chapter be deposited?
options:
  - State general fund account in the state treasury
  - Real estate education program account in the state treasury
  - Local government fund account in the state treasury
  - Real estate commission account in the state treasury
key: B
explanation: Under RCW 18.85.061, all money derived from fines imposed under the chapter must be
  deposited in the real estate education program account created in RCW 18.85.321. The real estate
  commission account receives licensing fees, not fine revenue.
