stem: Where must all fees paid under Washington’s real estate licensing chapter be deposited?
options:
  - The director's discretionary account in the state treasury
  - The state general fund account in the state treasury
  - The real estate commission account in the state treasury
  - The real estate education program account in the state treasury
key: C
explanation: Under RCW 18.85.061, all fees paid under this chapter shall be placed in the real
  estate commission account in the state treasury. The real estate education program account
  receives fines, not fees, so placing fees there would be contrary to the statute.
