stem: An investigator sends a written request for 'any documents related to transactions' without
  specifying which transactions or time period. The licensee does not produce the documents. May the
  licensee be charged for failure to cooperate under Washington Administrative Code?
options:
  - Charge not permitted because the investigator made no telephone request
  - Charge permitted because the licensee refused to comply
  - Charge not permitted because the request lacked sufficient specificity
  - Charge permitted because the request was in writing
key: C
explanation: The rule in WAC 308-124I-060 states that a licensee will not be charged for failure to
  cooperate unless the investigator’s written request for records the licensee must keep describes
  those records with sufficient specificity. Because the investigator’s request for ‘any documents
  related to transactions’ did not specify which transactions or time period, it lacked the required
  specificity, so no charge may be imposed. The option stating that charge is not permitted because
  the request lacked sufficient specificity correctly reflects this rule. The option claiming a
  charge is permitted because the licensee refused to comply ignores the specificity requirement;
  refusal alone does not support a charge when the request is insufficiently specific. The option
  asserting a charge is not permitted because the investigator made no telephone request is
  irrelevant, as the rule only requires a written request, not a telephone one. The option stating a
  charge is permitted because the request was in writing overlooks the specificity requirement; a
  written request that is too vague does not authorize a charge.
