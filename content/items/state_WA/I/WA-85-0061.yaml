stem: An investigator asks a licensee for documents over the telephone with no follow‑up written
  request. May the licensee be charged for failure to cooperate?
options:
  - The licensee may be charged for failure to cooperate if requested.
  - The licensee may not be charged unless a written request is sent.
  - The licensee may be charged if the documents are required to be kept.
  - The licensee may not be charged because telephone requests are prohibited.
key: B
explanation: Under Wash. Admin. Code ch. 308-124I — § 308-124I-060, a licensee will not be charged
  for failure to cooperate unless the investigator has made a written request for records or
  documents that the licensee is required to keep. The option stating the licensee may not be
  charged unless a written request is sent is correct. The option suggesting the licensee may be
  charged if requested is incorrect because a telephone request alone does not trigger a charge. The
  option claiming the licensee may be charged if the documents are required to be kept is incorrect
  because the written request requirement is not met. The option stating telephone requests are
  prohibited is incorrect because the rule does not prohibit telephone requests, only that they must
  be followed by a written request to trigger a charge.
citation:
  source: Wash. Admin. Code ch. 308-124I — § 308-124I-060
  url: null
  quoted_text: The investigator will not request documents or explanations by telephone unless the
    telephone request is followed by a request in writing. In the case of a request for records or
    documents, a licensee will not be charged for failure to cooperate with the department unless
    the investigator has made a written request for records or documents that the licensee is
    required to keep, and has described the records or documents with sufficient specificity to
    notify the licensee of what records or documents are being sought.
