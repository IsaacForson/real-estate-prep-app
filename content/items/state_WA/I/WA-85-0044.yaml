stem: Under RCW 18.85.361, which of the following is a ground for disciplinary action?
options:
  - Accepting a commission from a licensed attorney for a referral
  - Advertising without including the real estate firm's name
  - Failing to keep escrow records for five years after closing
  - Charging a flat fee for brokerage services without disclosure
key: B
explanation: "RCW 18.85.361 lists advertising in any manner without including the real estate firm's
  name or assumed name as a ground for disciplinary action. The other options are not grounds:
  accepting a commission from an attorney is not listed, failing to keep records for five years does
  not violate the three‑year requirement, and charging a flat fee is not prohibited unless it
  involves undisclosed compensation from multiple parties."
