stem: If the director believes a broker is violating the chapter and wants to stop the violation,
  which action may the director take under RCW 18.85.430?
options:
  - The director may require the broker to attend continuing education.
  - The director may impose a fine directly without a hearing.
  - The director may petition the superior court for a preliminary or final injunction.
  - The director may revoke the broker's license immediately.
key: C
explanation: RCW 18.85.430 provides that when the director has evidence a person has violated the
  chapter, the director may bring an action in the appropriate superior court to enjoin the
  violation, and the court may issue a preliminary or final injunction. Accordingly, the director
  may petition the superior court for a preliminary or final injunction. Requiring the broker to
  attend continuing education is not a remedy authorized by this section. Imposing a fine without a
  hearing is prohibited because fines require an adjudicative proceeding. Revoking a license
  immediately is not permitted under this provision, which requires court action.
citation:
  source: Wash. Rev. Code ch. 18.85 — RCW Chapter 18.85 — Real Estate Brokers and Managing Brokers — §
    18.85.430
  url: null
  quoted_text: Whenever the director believes from evidence satisfactory to the director that a person
    has violated any of the provisions of this chapter, or any order, license, decision, demand or
    requirement, or any part or provision thereof, the director may bring an action, in the superior
    court in the county wherein the person resides, to enjoin that person from continuing the
    violation or engaging therein or doing any act or acts in furtherance thereof. In this action an
    order or judgment may be entered awarding a preliminary or final injunction as may be proper.
