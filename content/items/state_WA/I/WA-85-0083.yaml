stem: A presiding officer who personally participated in the decision to deny a broker’s license
  renewal is assigned to conduct the brief adjudicative proceeding on that denial. Is this
  permissible under Washington Administrative Code?
options:
  - The presiding officer may not preside because the director has not granted explicit permission.
  - The presiding officer may not preside because they personally participated in the decision.
  - The presiding officer may not preside because they will not issue an oral order.
  - The presiding officer may not preside because they have disclosed their prior involvement.
key: B
explanation: The rule requires that the presiding officer for brief adjudicative proceedings shall
  not have personally participated in the decision which resulted in the request. Therefore the
  officer may not preside. The other options are not allowed by the text.
