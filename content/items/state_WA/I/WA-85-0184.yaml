stem: A licensee is notified on April 1 that the transcript of a disciplinary hearing has been filed
  and that the cost is $120. The licensee pays the cost on April 18. What is the effect on the
  appeal under RCW 18.85.401?
options:
  - The director must reissue transcript
  - The licensee is fined $500
  - The appeal is dismissed
  - The appeal proceeds normally
key: C
explanation: Under RCW 18.85.401, if the transcript cost is not paid in full within fifteen days of
  notification, the appeal is dismissed. The licensee was notified on April 1 and paid on April 18,
  which is seventeen days later—beyond the fifteen‑day limit—so the appeal is dismissed. The idea
  that the appeal proceeds normally ignores the mandatory dismissal for late payment.
citation:
  source: "### Wash. Rev. Code ch. 18.85 — RCW Chapter 18.85 — Real Estate Brokers and Managing
    Brokers — § 18.85.401"
