math:
  worked_solution: >-
    1. Determine the number of days between notification (April 1) and payment (April 18). April 18
    minus April 1 equals 17 days.

    2. Compare the elapsed days to the statutory limit of 15 days.

    3. Since 17 days > 15 days, the condition for dismissal is met.

    4. Therefore, the appeal is dismissed.
  formulas:
    - Days elapsed = Payment date - Notification date
