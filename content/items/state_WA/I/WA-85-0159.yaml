stem: How is 'advertising' defined for real estate licensees in Washington?
options:
  - Any attempt by publication or broadcast to induce a person to use the services of a real estate
    firm, broker, managing broker, or designated broker.
  - Any attempt by publication or broadcast to induce a person to purchase or lease real estate from
    a licensee in any transaction, whether oral or written.
  - Any attempt by publication or broadcast to induce a person to list or sell real estate through a
    licensee in any transaction, whether oral or written.
  - Any attempt by publication or broadcast to induce a person to engage in real estate brokerage
    services through a licensee in any transaction, whether oral or written.
key: A
explanation: RCW 18.85.011 defines advertising as any attempt by publication or broadcast, whether
  oral, written, or otherwise, to induce a person to use the services of a real estate firm, broker,
  managing broker, or designated broker. The option that limits advertising to purchase or lease
  transactions is too narrow because it omits other brokerage activities such as listing, selling,
  or property management. The option that limits advertising to listing or selling is also too
  narrow for the same reason. The option that describes inducing a person to engage in real estate
  brokerage services through a licensee misstates the definition, which focuses on using the
  services of a firm or broker rather than engaging in brokerage services.
