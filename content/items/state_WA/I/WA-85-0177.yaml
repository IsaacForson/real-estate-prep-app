stem: According to RCW 18.85.361, which individual is subject to disciplinary action by the director?
options:
  - An attorney providing legal advice on a real estate transaction
  - A person engaged in the business as a real estate broker
  - A consumer purchasing a home for personal use
  - A person who only occasionally refers clients to a broker
key: B
explanation: The statute authorizes the director to take disciplinary action against any person
  engaged in the business or acting in the capacity of a real estate broker, managing broker,
  designated broker, or real estate firm. This includes a person who is engaged in the business as a
  real estate broker. The other options describe individuals who are not engaged in the business as
  brokers and therefore are not covered by this provision.
