stem: A person with four years of real estate brokerage experience and two years of investigative
  work applies for appointment to the Washington real estate commission. Based on the statutory
  qualifications, is the person eligible?
options:
  - No, the person is not eligible because they have less than five years of brokerage experience.
  - No, the person is not eligible because they lack the required geographic representation.
  - Yes, the person is eligible because the investigative experience satisfies the requirement.
  - Yes, the person is eligible because the combined experience totals six years.
key: A
explanation: RCW 18.85.021 requires that a commission member have at least five years of real‑estate
  brokerage experience in Washington, or at least three years of investigative work of a similar
  nature. Because the applicant has only four years of brokerage experience, the brokerage
  requirement is not met, making the applicant ineligible. The investigative experience does not
  satisfy the brokerage requirement, and the statute does not impose any geographic representation
  condition.
citation:
