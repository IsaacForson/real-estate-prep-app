  url: null
  quoted_text: No commission member shall be appointed who has had less than five years' experience in
    performing real estate brokerage services in this state, or has had at least three years'
    experience in investigative work of a similar nature, preferably in connection with the
    administration of real estate license law of this state or elsewhere.
