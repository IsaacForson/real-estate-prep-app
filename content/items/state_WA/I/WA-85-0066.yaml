stem: The director wants an assistant to review audit records for possible violations. Under RCW
  18.85.370, is this permissible?
options:
  - The director may authorize an assistant to review audit records for possible violations.
  - The director may not authorize an assistant to review audit records for possible violations.
  - The director may authorize an assistant only if the assistant is a licensed broker.
  - The director may authorize an assistant only for clerical tasks, not for disciplinary review.
key: A
explanation: Under RCW 18.85.370, the director may authorize one or more assistants to perform the
  director's duties with reference to disciplinary action, which includes reviewing audit records
  for possible violations. Therefore the statement that the director may authorize such a review is
  correct. The statement that the director may not authorize the review contradicts the statute. The
  statute does not require the assistant to be a licensed broker, so limiting authorization to
  licensed brokers is incorrect. Additionally, the statute permits assistants to perform duties
  related to disciplinary action, not merely clerical tasks, so restricting authorization to
  clerical work only is incorrect.
