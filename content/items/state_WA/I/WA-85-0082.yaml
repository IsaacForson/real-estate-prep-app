stem: During an investigation, a licensee receives a telephone call from an investigator asking for
  records. According to Washington Administrative Code, what must the investigator do for the
  request to be valid?
options:
  - The investigator must provide a written request after the telephone call.
  - The investigator may rely solely on the telephone request.
  - The investigator may ask the licensee to provide records without any follow‑up.
  - The investigator must obtain a warrant before requesting records.
key: A
explanation: The rule provides that an investigator will not request documents or explanations by
  telephone unless the telephone request is followed by a request in writing. Therefore a written
  request must follow the call. The other options contradict the rule.
