stem: A broker obtains an original real estate license and later renews it three times. Under RCW
  18.85.451, what is the total amount of fees assessed for the original license and the three
  renewals?
options:
  - $40
  - $20
  - $80
  - $60
key: C
explanation: Under RCW 18.85.451, a $20 fee is assessed on each original license and each renewal.
  The broker has one original license and three renewals, for a total of four assessments. Four
  assessments multiplied by $20 equals $80. The distractor $60 results from counting only the three
  renewals and omitting the original license fee.
