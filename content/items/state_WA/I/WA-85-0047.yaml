stem: According to Washington law, which of the following best defines a "designated broker"?
options:
  - A designated broker is a natural person who owns a sole proprietorship real estate firm and
    bears ultimate responsibility for the firm's brokerage operations.
  - A designated broker is a natural person who holds a controlling interest in the firm and is
    appointed by a corporation, LLC, LLP, or partnership to serve as the designated broker, with the
    managing broker's license endorsed by the department.
  - A designated broker is a natural person who either owns a sole proprietorship firm or possesses
    a controlling interest, and is designated by a recognized business entity to act as the
    designated broker, with the managing broker's license endorsed by the department.
  - A designated broker is a natural person who supervises brokers and managing brokers employed by
    the firm and ensures compliance with all applicable real estate laws and regulations.
key: C
explanation: RCW 18.85.011(10) defines a designated broker as either (a) a natural person who owns a
  sole‑proprietorship real estate firm, or (b) a natural person who holds a controlling interest in
  the firm and is designated by a legally recognized business entity such as a corporation, LLC,
  LLP, or partnership, with the managing broker’s license endorsed. The answer choice that mentions
  both alternatives—ownership of a sole‑proprietorship or a controlling interest with designation by
  a recognized business entity—is the correct one. The other answer choices each describe only one
  of the statutory alternatives or add supervisory duties that are not part of the definition.
citation:
