  quoted_text: "(10) \"Designated broker\" means: (a) A natural person who owns a sole proprietorship
    real estate firm; or (b) A natural person with a controlling interest in the firm who is
    designated by a legally recognized business entity such as a corporation, limited liability
    company, limited liability partnership, or partnership real estate firm, to act as a designated
    broker on behalf of the real estate firm, and whose managing broker's license receives an
    endorsement from the department of \"designated broker\"."
