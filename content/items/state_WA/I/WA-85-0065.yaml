stem: Under RCW 18.85.411, what is the penalty for acting as a real estate broker without a license?
options:
  - It is classified as a gross misdemeanor.
  - It is classified as a simple misdemeanor.
  - It is classified as a felony offense.
  - It results in a civil penalty only.
key: A
explanation: RCW 18.85.411 states that any person acting as a real estate broker without a license
  is guilty of a gross misdemeanor. Therefore, the option stating it is a gross misdemeanor is
  correct. The option stating it is a simple misdemeanor is incorrect because the statute specifies
  a gross misdemeanor, not a simple one.
