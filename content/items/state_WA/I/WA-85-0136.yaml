stem: Under RCW 18.85.041(1), which of the following actions is permissible for the director?
options:
  - Fix the time and place for holding examinations with commission approval
  - Issue certificates of approval to real estate schools and instructors
  - Grant or deny licenses including temporary licenses to applicants
  - Set the amount of fees charged for real estate licensing examinations
key: A
explanation: Under RCW 18.85.041(1), the director, with the advice and approval of the commission,
  may fix the times and places for holding examinations of applicants for licenses. Therefore, the
  action of fixing the time and place for holding examinations with commission approval is
  permissible. The other actions—issuing certificates of approval to real estate schools and
  instructors, granting or denying licenses including temporary licenses to applicants, and setting
  the amount of fees charged for real estate licensing examinations—are addressed in other
  subsections of the statute.
