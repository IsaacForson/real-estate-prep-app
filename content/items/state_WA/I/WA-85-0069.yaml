stem: A managing broker applicant has been convicted of a felony related to fraud. Under RCW
  18.85.041(2)(a), what action may the director take regarding this applicant’s license application?
options:
  - The director may grant the license without conditions.
  - The director may issue a temporary license only.
  - The director may require additional education before granting.
  - The director may deny the license application.
key: D
explanation: Under RCW 18.85.041(2)(a), the director has the authority to grant or deny licenses,
  including temporary licenses, for real estate firms, brokers, and managing brokers. Therefore,
  when an applicant has a felony fraud conviction, the director may deny the license application.
  The distractor suggesting the director must grant the license without conditions is incorrect
  because the statute gives the director discretion to deny based on licensing laws and rules. The
  other distractors misstate the director’s power by limiting action to temporary licenses only or
  adding education requirements not mentioned in this subsection.
