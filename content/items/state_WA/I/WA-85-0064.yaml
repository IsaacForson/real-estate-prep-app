stem: An investigator telephones a licensee and asks for copies of transaction files. The licensee
  refuses. Later that day, the investigator emails a written request for the same files. Under WAC
  308-124I-060, may the licensee be charged for failure to cooperate based on the telephone refusal?
options:
  - No, because the investigator had not yet made a written request at the time of the refusal
  - Yes, because the investigator eventually made a written request
  - Yes, because any refusal to provide records results in a charge
  - No, because a licensee is not charged for failure to cooperate in this context
key: A
explanation: The rule provides that a licensee will not be charged for failure to cooperate unless
  the investigator has made a written request for records. Since no written request existed at the
  time of the refusal, no charge may be based on that refusal.
