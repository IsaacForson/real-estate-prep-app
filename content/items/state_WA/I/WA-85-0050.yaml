stem: According to RCW 18.85.011, what is the definition of a 'managing broker'?
options:
  - A natural person with a controlling interest in the firm who is designated by a legally
    recognized business entity to act as a designated broker on behalf of the real estate firm, and
    whose managing broker's license receives an endorsement from the department.
  - A natural person acting on behalf of a real estate firm to perform real estate brokerage
    services under the supervision of the designated broker, and who may supervise other brokers or
    managing brokers licensed to the firm.
  - A natural person who owns a sole proprietorship real estate firm and is responsible for all
    brokerage activities conducted under that firm's name, including hiring and supervising
    affiliated licensees.
  - A natural person holding a license as a real estate firm, managing broker, or broker who may
    engage in brokerage services only under supervision and must renew the license biennially to
    maintain active status.
key: B
explanation: RCW 18.85.011(15) defines a managing broker as a natural person who acts on behalf of a
  real estate firm to perform brokerage services under the supervision of the designated broker and
  who may supervise other brokers or managing brokers licensed to the firm. The other answer choices
  describe a controlling‑interest owner, a sole‑proprietor, or a licensee who must work under
  supervision, none of which match the statutory definition.
