stem: A managing broker is fined $500 for failing to renew a certificate of approval on time. Where
  must the fine be deposited?
options:
  - The real estate commission account in the state treasury
  - The state general fund account in the state treasury
  - The real estate education program account in the state treasury
  - The director's discretionary account in the state treasury
key: C
explanation: RCW 18.85.061 states that all money derived from fines imposed under this chapter shall
  be deposited in the real estate education program account created in RCW 18.85.321. The real
  estate commission account receives fees, not fines, so it is incorrect for fine deposits.
