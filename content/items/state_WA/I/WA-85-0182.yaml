stem: A commission member resigns after serving three years of a six-year term. Under RCW 18.85.021,
  who is responsible for filling the vacancy and for what duration?
options:
  - The commission elects a replacement for a full six-year term.
  - The vacancy remains unfilled until the next scheduled election.
  - The director appoints a replacement for the remaining three years.
  - The governor appoints a replacement for the remaining three years.
key: D
explanation: Under RCW 18.85.021, the governor must fill any vacancy on the commission by
  appointment for the unexpired term. Therefore, the governor appoints a replacement to serve the
  remaining three years of the term. The commission does not have the authority to elect a
  replacement and cannot award a full six‑year term. The director does not have the power to appoint
  a replacement. Leaving the vacancy unfilled until the next scheduled election is not permitted.
