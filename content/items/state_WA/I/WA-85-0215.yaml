stem: An investigator arrives at a licensee's office at 6:00 p.m. on a Wednesday that is not a state
  holiday, without an appointment, and seeks to inspect the premises without a warrant. Under
  Washington Administrative Code, is the investigator permitted to conduct the inspection?
options:
  - The investigator may not inspect because no warrant was obtained for the visit
  - The investigator may not inspect because the visit was outside permitted hours
  - The investigator may inspect because the visit occurred on a regular weekday
  - The investigator may inspect because the licensee raised no objection
key: B
explanation: Under WAC 308-124I-060, warrantless inspections are allowed only between 8:00 a.m. and
  5:30 p.m., Monday through Friday, excluding state holidays, or during an agreed appointment. The
  investigator arrived at 6:00 p.m. on a Wednesday that is not a state holiday and without an
  appointment, which is outside the permitted hours. Therefore, the inspection is not permitted. The
  option stating that the investigator may not inspect because no warrant was obtained for the visit
  is incorrect because the rule does not require a warrant for inspections conducted within the
  allowed hours or by appointment. The option stating that the investigator may inspect because the
  visit occurred on a regular weekday is incorrect because the time restriction applies regardless
  of the day being a regular weekday. The option stating that the investigator may inspect because
  the licensee raised no objection is incorrect because lack of objection does not override the time
  restriction; the inspection remains impermissible outside the permitted hours.
