stem: Who is subject to the fee assessed on each original license and renewal under RCW 18.85.451?
options:
  - Both real estate brokers and real estate salespersons
  - Both managing brokers and real estate salespersons
  - Both real estate brokers and managing brokers
  - Both real estate brokers and property managers
key: C
explanation: The statute explicitly states that the $20 fee applies to each real estate broker and
  managing broker's original license and renewal. Therefore, both brokers and managing brokers must
  pay the fee. The distractor that limits the fee to brokers only is incorrect because it omits
  managing brokers who are also required to pay.
