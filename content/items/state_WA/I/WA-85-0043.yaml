stem: An applicant holds a real estate license in Oregon and seeks a Washington license. What must
  the director establish regarding this applicant?
options:
  - The fee for certification of courses
  - The real estate education program
  - The criminal background check requirement
  - The standards for licensure and reciprocity
key: D
explanation: RCW 18.85.041(3) requires the director to establish by rule standards for licensure of
  applicants licensed in other jurisdictions and for reciprocity, including the use of written
  recognition agreements. The criminal background check requirement is addressed in subsection (4),
  not in the rule‑making duty for out‑of‑state licensure.
