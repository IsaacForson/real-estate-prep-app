stem: A licensee requests a brief adjudicative proceeding after a disciplinary decision. Who may
  conduct the proceeding?
options:
  - The director personally conducting the brief proceeding
  - The presiding officer designated by the director for the proceeding
  - The administrative law judge assigned by the office for the proceeding
  - The licensee's managing broker representing the licensee for the proceeding
key: B
explanation: Washington Administrative Code 308‑124‑315 requires that a brief adjudicative
  proceeding be conducted by a presiding officer designated by the director, and that the presiding
  officer not have personally participated in the decision that prompted the request. Accordingly,
  the statement that the presiding officer designated by the director for the proceeding may conduct
  the proceeding is correct. The administrative law judge assigned by the office, the licensee's
  managing broker, and the director personally conducting the proceeding are not authorized under
  the rule.
citation:
  source: Wash. Admin. Code ch. 308-124 — § 308-124-315
  url: null
  quoted_text: Brief adjudicative proceedings shall be conducted by a presiding officer for brief
    adjudicative proceedings designated by the director. The presiding officer for brief
    adjudicative proceedings shall not have personally participated in the decision which resulted
    in the request for a brief adjudicative proceeding.
