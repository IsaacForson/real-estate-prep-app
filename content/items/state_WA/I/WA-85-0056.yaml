stem: Under Washington law, who has the authority to issue rules governing the activities of real
  estate brokers and managing brokers?
options:
  - The state treasurer's licensing division office
  - The real estate commission acting independently
  - The director, with the commission's advice and approval
  - The Washington State Governor's executive office
key: C
explanation: The statute states that the director, with the advice and approval of the commission,
  may issue rules to govern broker activities. The director alone cannot act without the
  commission's input, making the commission-only option incorrect.
