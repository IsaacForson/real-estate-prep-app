stem: Under RCW 18.85.031, what must the commission ensure regarding examinations for applicants?
options:
  - That examinations are prepared and administered at examination centers throughout the state.
  - That examinations are offered exclusively through online platforms approved by the commission.
  - That examinations are prepared solely by the director of licensing after board review.
  - That examinations are administered only in foreign jurisdictions with prior approval.
key: A
explanation: RCW 18.85.031 requires the commission to ensure that examinations are both prepared and
  administered at examination centers located throughout the state. While the commission may approve
  examination locations in foreign jurisdictions, the statute’s primary mandate is in‑state
  preparation and administration, making the statement that examinations are prepared and
  administered at examination centers throughout the state the correct choice. The other statements
  describe requirements that are not imposed by the statute.
