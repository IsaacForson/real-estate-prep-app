stem: The governor appoints three commission members from west of the Cascade range and three from
  east of the Cascade range. Does this appointment satisfy the statutory requirement under RCW
  18.85.021?
options:
  - Yes, because it meets the minimum of two from each side.
  - Yes, if the members also have five years of brokerage experience.
  - No, because exactly three from each side exceeds the maximum allowed.
  - No, because the statute requires exactly four members total.
key: A
explanation: The rule only sets a minimum of two members from each side of the Cascades; having
  three from each side still satisfies that minimum, so the appointment is permissible. The
  statement that the members also need five years of brokerage experience is incorrect because the
  statute does not impose an experience requirement for the geographic selection. The claim that
  exactly three from each side exceeds the maximum allowed is wrong because the statute does not set
  a maximum number from either side. The assertion that the statute requires exactly four members
  total is incorrect; the commission consists of six members, and the rule only requires at least
  two from each side.
