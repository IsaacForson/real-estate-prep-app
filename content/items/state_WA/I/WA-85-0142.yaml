stem: A licensee files an appeal of a disciplinary order with the superior court and submits a cash
  bond of eight hundred dollars. Under RCW 18.85.390, is the appeal properly filed?
options:
  - The appeal is not properly filed because the bond must be filed within fifteen days.
  - The appeal is properly filed because the bond amount meets the requirement.
  - The appeal is not properly filed because the bond must be exactly one thousand dollars.
  - The appeal is properly filed because the judge may approve any bond amount.
key: C
explanation: RCW 18.85.390 requires a cash bond in the sum of one thousand dollars for an appeal. A
  bond of eight hundred dollars does not satisfy this amount, so the appeal is not properly filed.
  The fifteen‑day filing rule applies to the bond and notice, not the amount, and the judge’s
  approval does not alter the statutory sum.
