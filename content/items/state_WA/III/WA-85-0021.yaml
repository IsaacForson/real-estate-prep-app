stem: Under Washington real estate law, who bears responsibility for a broker's conduct that is
  covered by chapter 18.85 RCW?
options:
  - The transaction's independent escrow agent
  - The broker's designated broker
  - The county auditor's recording office
  - The buyer's mortgage lending institution
key: B
explanation: The statute assigns responsibility for a broker's or managing broker's conduct covered
  by the chapter to the designated broker to which the licensee is licensed.
citation:
  source: Wash. Rev. Code § 18.85.201
  url: null
  quoted_text: Responsibility for any real estate broker, managing broker, or branch manager in
    conduct covered by this chapter shall rest with the designated broker to which such licensees
    shall be licensed.
