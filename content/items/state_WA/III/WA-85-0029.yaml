stem: A firm's designated broker deposits a small personal sum into the real estate trust bank
  account solely to keep the account from being closed by the bank. Under WAC 308-124E-105, how
  should this deposit be evaluated?
options:
  - It violates the ban on commingling client funds
  - It is allowed to keep the account from closing
  - It requires prior written client consent
  - It requires approval from the housing trust fund
key: B
explanation: The rule permits a designated broker to deposit a minimal amount to open the trust bank
  account or maintain a minimal amount to keep the account from being closed, as an exception to the
  general bar on depositing the firm's own funds.
