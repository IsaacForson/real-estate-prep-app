stem: Under RCW 18.85.275, who must supervise brokers and managing brokers for compliance with
  chapter 18.85 RCW?
options:
  - The county recorder of deeds' office staff
  - The buyer's own independently retained lawyer
  - The neutral escrow agent handling the closing
  - The firm's designated or managing broker
key: D
explanation: The statute places supervisory duty for compliance with the chapter directly on the
  designated broker or managing broker, not on outside parties to the transaction.
citation:
  source: Wash. Rev. Code § 18.85.275
  url: null
  quoted_text: The designated broker or managing broker shall supervise the conduct of brokers and
    managing brokers for compliance with this chapter, chapter 18.235 RCW, and RCW 18.86.030 .
