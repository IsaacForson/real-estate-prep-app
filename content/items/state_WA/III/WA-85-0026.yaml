stem: A broker accepts a client's offer to pay for services with a promissory note instead of cash
  as earnest money, but never tells the seller before the seller accepts the purchase offer. Which
  disciplinary ground under RCW 18.85.361 does this conduct describe?
options:
  - Discrimination in a real estate brokerage activity
  - Misrepresenting membership in a trade association
  - Taking noncash earnest money without owner disclosure
  - Continuing to sell after a written departmental objection
key: C
explanation: The statute lists as a disciplinary ground accepting other than cash or its equivalent
  as earnest money unless that fact is communicated to the owner before acceptance of the purchase
  offer.
