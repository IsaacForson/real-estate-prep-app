  url: null
  quoted_text: (16) Failing to keep an escrow or trustee account of funds deposited relating to a real
    estate transaction, for a period of three years, showing to whom paid, and other pertinent
    information as the director may require, such records to be available to the director, or the
    director's representatives, on demand, or upon written notice given to the bank;
