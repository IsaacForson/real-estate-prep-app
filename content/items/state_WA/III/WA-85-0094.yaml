stem: Under RCW 18.85.361(16), for how long must a licensee retain escrow or trustee account records
  showing to whom paid and other pertinent information?
options:
  - Seven years
  - Two years
  - Three years
  - Five years
key: C
explanation: The rule requires escrow or trustee account records to be kept for a period of three
  years, showing to whom paid and other pertinent information. The one‑year and two‑year options
  fall short of this requirement, while the five‑year option exceeds it.
citation:
  source: Wash. Rev. Code ch. 18.85 — RCW Chapter 18.85 — Real Estate Brokers and Managing Brokers — §
