stem: A real estate licensee with a controlling interest in a firm arranges for a title insurance
  agent, in which the licensee also holds a financial interest, to receive referrals in exchange for
  a fee. Under RCW 18.85.053, why is this arrangement prohibited?
options:
  - The referral fee was not reduced to a signed written agreement
  - The title insurance agent was not licensed in Washington
  - The licensee has a financial interest in that title agent
  - The referral was not reported to the department within thirty days
key: C
explanation: The statute bars a licensee with a controlling interest in a real estate business from
  giving a fee or reward to another licensee for directing title insurance business to a title agent
  in which the licensee also has a financial interest.
citation:
  source: Wash. Rev. Code § 18.85.053
  url: null
  quoted_text: shall not, directly or indirectly, give any fee, kickback, payment, or other thing of
    value to any other real estate licensee as an inducement, reward for placing title insurance
    business
