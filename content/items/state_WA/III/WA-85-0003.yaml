stem: According to RCW 18.85.291, what happens to a license once the broker ceases to represent the
  firm holding it?
options:
  - The license transfers automatically to a new firm
  - The license ceases to be in force
  - The license converts to inactive managing status
  - The license stays active for another full year
key: B
explanation: The statute states that when a broker or managing broker ceases to represent the firm,
  the license held through that firm ceases to be in force.
citation:
  source: Wash. Rev. Code § 18.85.291
  url: null
  quoted_text: The licenses of a real estate broker and managing broker shall be kept at all times by
    their firm and when real estate brokers or managing brokers cease to represent the firm, their
    licenses shall cease to be in force.
