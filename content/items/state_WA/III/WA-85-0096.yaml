stem: During an audit, a licensing investigator requests a written explanation from a licensee
  regarding a transaction. Under WAC 308-124I-030, what must the licensee do?
options:
  - Provide the statement within thirty days of request
  - Provide a written statement or explanation upon request
  - Provide a written statement only if the licensee consents
  - Provide the statement orally instead of in writing
key: B
explanation: The rule states that during an investigation or audit, licensees may be required to
  provide written statements and/or explanations, and a request for such can only be issued by an
  authorized representative of the director. Therefore, the licensee must comply with the request
  for a written statement or explanation. The distractor suggesting optional compliance is incorrect
  because the rule imposes a duty to provide the requested documents; waiting for a court order is
  unnecessary; and the rule specifies written form, not oral.
