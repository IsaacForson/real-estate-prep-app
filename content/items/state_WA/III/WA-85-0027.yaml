stem: A firm receives a purchase and sale agreement instructing the broker to deliver the earnest
  money check directly to the named closing agent. Under RCW 18.85.285, what is the firm's trust
  account obligation for this transaction?
options:
  - The firm notifies the housing trust fund in writing
  - The firm still opens a pooled trust account
  - The firm deposits the check within one hour
  - No trust account is required for this transaction
key: D
explanation: The statute excuses a firm from maintaining a trust fund account for transactions where
  the purchase and sale agreement instructs the broker to deliver the earnest money check directly
  to a named closing agent or to the seller.
citation:
  source: Wash. Rev. Code § 18.85.285
  url: null
  quoted_text: A firm is not required to maintain a trust fund account for transactions concerning a
    purchase and sale agreement that instructs the broker to deliver the earnest money check
    directly to a named closing agent or to the seller.
