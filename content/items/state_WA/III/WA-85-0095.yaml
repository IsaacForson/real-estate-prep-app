stem: A broker receives a referral fee from a mortgage lender for directing a client to that
  lender’s loan products. The broker does not disclose this fee to the client or the firm. Under RCW
  18.85.361(19), which disciplinary ground does this conduct describe?
options:
  - Accepting compensation from multiple parties without disclosure
  - Failing to keep required escrow records for client funds
  - Making false statements in real estate advertising
  - Accepting a commission from a person other than the licensed firm
key: D
explanation: Under RCW 18.85.361(19), a broker may not accept a commission or any valuable
  consideration for performing real estate brokerage acts from anyone other than the licensed firm
  with whom the broker is licensed. The undisclosed referral fee received from a mortgage lender is
  such a prohibited commission because it comes from a third party, not the broker’s firm. The
  option about accepting compensation from more than one party without disclosure addresses a
  different provision (RCW 18.85.361(10)) that requires disclosure when a broker is compensated by
  both parties to a transaction, not by a third‑party lender.
