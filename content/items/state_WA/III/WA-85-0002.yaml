stem: A broker has held an active license for eight months. Under RCW 18.85.275, what level of
  oversight must the managing broker provide during this period?
options:
  - A heightened level of supervision required by rule
  - Supervision once a client files a complaint
  - Supervision delegated fully to the closing agent
  - Routine supervision applied equally to every broker
key: A
explanation: During the first two years of a broker's licensure, the statute requires the managing
  broker to provide a heightened level of supervision, not merely routine or reactive oversight.
