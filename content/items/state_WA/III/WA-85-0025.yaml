stem: A designated broker discovers that a broker licensed for eighteen months has a contract
  awaiting review. Under WAC 308-124C-125, within how many business days of mutual acceptance must
  that review be completed?
options:
  - Two business days of mutual acceptance
  - Five business days of mutual acceptance
  - Ten business days of mutual acceptance
  - Thirty business days of mutual acceptance
key: B
explanation: The rule requires review of brokerage service contracts involving brokers licensed less
  than two years to be completed within five business days of mutual acceptance.
citation:
  source: Wash. Admin. Code § 308-124C-125
  url: null
  quoted_text: Review must be completed by the designated broker or their delegated managing broker
    within five business days of mutual acceptance.
