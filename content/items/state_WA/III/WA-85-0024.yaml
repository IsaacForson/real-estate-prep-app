stem: A managing broker wants to condition the surrender of a departing broker's license upon the
  broker first finishing a pending transaction. Is this permitted under WAC 308-124A-730?
options:
  - No, surrender cannot be conditioned on the broker's acts
  - Yes, if the pending transaction closes within thirty days
  - Yes, if the designated broker files written consent first
  - No, but after the department grants prior approval
key: A
explanation: The rule states that the managing broker, branch manager, or designated broker may not
  condition surrender of a license upon performance of any act by the broker or managing broker.
citation:
  source: Wash. Admin. Code § 308-124A-730
  url: null
  quoted_text: The managing broker, branch manager or designated broker may not condition his or her
    surrender of license to the real estate program upon performance of any act by the broker or
    managing broker.
