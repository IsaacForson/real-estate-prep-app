stem: Under RCW 18.86.080, what is the effect of an agreement to pay or payment of compensation on
  the relationship between the paying party and the broker?
options:
  - An agreement to pay or payment of compensation requires a written services agreement between the
    party who paid the compensation and the broker.
  - An agreement to pay or payment of compensation establishes an agency relationship between the
    party who paid the compensation and the broker.
  - An agreement to pay or payment of compensation establishes a fiduciary duty between the party
    who paid the compensation and the broker.
  - An agreement to pay or payment of compensation does not establish an agency relationship between
    the party who paid the compensation and the broker.
key: D
explanation: Under RCW 18.86.080, an agreement to pay or payment of compensation does not establish
  an agency relationship between the party who paid the compensation and the broker. Therefore, the
  correct answer is the statement that says such an agreement does not create an agency
  relationship. The other statements are incorrect because they claim that such an agreement creates
  an agency relationship, requires a written services agreement, or creates a fiduciary duty, which
  the statute does not provide.
