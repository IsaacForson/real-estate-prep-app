    18.85.361
  url: null
  quoted_text: (8) Advertising in any manner without including the real estate firm's name or assumed
    name as licensed in a clear and conspicuous manner in the advertisement; except, that real
    estate brokers, managing brokers, or firms advertising their personally owned real property must
    only disclose that they hold a real estate license;
