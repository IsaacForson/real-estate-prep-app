stem: A managing broker creates a Facebook advertisement for a residential listing that includes the
  broker’s photo, contact information, and the statement 'Licensed Real Estate Agent in Washington,'
  but does not mention the name of the firm. The property is listed by the firm, not the broker’s
  personal residence. Under RCW 18.85.361(8), what must the managing broker do to make the
  advertisement compliant?
options:
  - Add the firm's name in a clear and conspicuous manner
  - Include only the broker's license number
  - State that the advertisement is for personal property only
  - Remove the statement about being a licensed agent
key: A
explanation: RCW 18.85.361(8) requires that any advertisement include the real estate firm's name or
  assumed name in a clear and conspicuous manner, unless the advertisement is for the licensee's
  personally owned real property. Since the property belongs to the firm, the firm's name must be
  added. Including only the broker's license number does not satisfy the firm‑name requirement.
citation:
