stem: A broker receives a client's earnest money check on Monday. Under WAC 308-124E-100, by when
  must the broker physically deliver the check to the designated broker, absent a contract term
  requiring faster delivery?
options:
  - Within two business days of client signature
  - Within one full calendar week of receipt
  - Within thirty calendar days after receipt
  - Within twenty-four hours regardless of weekends
key: A
explanation: The rule requires brokers to deliver client funds and negotiable instruments within the
  shorter of two business days of the client's signature or sooner if the contract requires it.
