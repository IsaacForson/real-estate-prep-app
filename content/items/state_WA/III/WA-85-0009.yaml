stem: A licensee who co-owns a title insurance agency pays a referral fee to another broker for
  steering title business to that agency. Under RCW 18.85.053, why is this arrangement unlawful?
options:
  - It violates the statute above a set dollar cap
  - It is unlawful if the buyer later objects to it
  - It is unlawful because both parties hold licenses
  - It is tied to the licensee's own financial stake
key: D
explanation: The statute forbids a licensee with a controlling interest in a title insurance agency
  from giving a fee or kickback to another licensee for referring business to that agency because of
  the licensee's own financial stake.
citation:
  source: Wash. Rev. Code § 18.85.053
  url: null
  quoted_text: A real estate licensee or person who has a controlling interest in a real estate
    business shall not, directly or indirectly, give any fee, kickback, payment, or other thing of
    value to any other real estate licensee as an inducement, reward for placing title insurance
    business, referring title insurance business, or causing title insurance business to be given to
    a title insurance agent in which the real estate licensee or person having a controlling
    interest in a real estate business also has a financial interest.
