stem: A buyer offers a classic car instead of a cash earnest money deposit. Under RCW 18.85.361,
  what must happen before the seller accepts that offer?
options:
  - The buyer must first insure the car at full value
  - The noncash item must be disclosed to the seller first
  - The listing broker must first appraise its market value
  - The car's title must first be recorded countywide
key: B
explanation: Accepting something other than cash or its equivalent as earnest money is grounds for
  discipline unless that fact is communicated to the owner before the owner accepts the offer.
citation:
  source: Wash. Rev. Code § 18.85.361
  url: null
  quoted_text: Accepting other than cash or its equivalent as earnest money unless that fact is
    communicated to the owner before the owner's acceptance of the offer to purchase, and such fact
    is shown in the purchase and sale agreement;
