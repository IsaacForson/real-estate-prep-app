stem: A salesperson licensed under Arizona law receives a payment from a buyer for facilitating the
  sale of a property. The buyer is not a licensed broker and is not authorized to provide
  compensation under §32-2155. Which of the following is a ground for denial, suspension, or
  revocation of the salesperson’s license under Ariz. Rev. Stat. § 32-2153?
options:
  - The salesperson's acceptance of compensation from a buyer who is not authorized to provide
    compensation under §32-2155.
  - The salesperson's acceptance of compensation from the employing broker for performing licensed
    real estate activities as permitted by law.
  - The salesperson's acceptance of compensation from a licensed mortgage broker for negotiating a
    loan secured by real property, provided all conditions of §32-2155(D) are satisfied.
  - The salesperson's acceptance of compensation from a friend in the form of a $100 gift for
    personal reasons unrelated to any licensed activity and not tied to any real estate transaction.
key: A
explanation: The rule prohibits accepting compensation for performing acts specified in the chapter
  from any person not authorized to provide compensation under §32-2155. Accepting payment from an
  unauthorized buyer meets this prohibition. The distractor involving the employing broker describes
  an authorized source of compensation under the statute.
