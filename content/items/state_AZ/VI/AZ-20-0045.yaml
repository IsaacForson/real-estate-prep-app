stem: According to Ariz. Rev. Stat. § 32-2153(A)(15), what must a licensee do regarding monies
  deposited with the licensee relating to a real estate transaction?
options:
  - The licensee must return the monies to the depositor within one business day.
  - The licensee must commingle the monies with personal funds if disclosed.
  - The licensee must keep an escrow or trust account or other record of monies deposited.
  - The licensee must invest the monies in an interest-bearing account.
key: C
explanation: The rule explicitly states that failing to keep an escrow or trust account or other
  record of monies deposited with the licensee relating to a real estate transaction is grounds for
  discipline, so the licensee must keep such a record. The distractor about returning monies within
  one business day is not required by this statute.
