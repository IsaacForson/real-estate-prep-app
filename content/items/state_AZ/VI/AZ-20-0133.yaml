stem: What does the term 'provisional license' mean under Ariz. Rev. Stat. § 32-2153(F)(2)?
options:
  - A license that is issued to applicants who have passed the state exam but have not yet submitted
    fingerprint clearance cards.
  - A license that the department issues allowing practice subject to a consent order under
    §32-2153.01 or the commissioner's terms, conditions and restrictions.
  - A license that permits the holder to act as a broker without supervision after completing
    additional continuing education courses.
  - A license that authorizes the holder to engage solely in property management activities for
    residential rental properties.
key: B
explanation: The statute defines a provisional license as one issued by the department that allows
  practice subject to a consent order under §32-2153.01 or the commissioner's terms, conditions and
  restrictions. The other options describe scenarios not mentioned in the definition.
