stem: According to A.A.C. R4-28-1101(B), a licensee must disclose in writing to all other parties
  which of the following?
options:
  - Any information that the seller or lessor enjoys gardening in the backyard.
  - Any information that the seller or lessor has a pet that lives on the property.
  - Any information that the seller or lessor prefers to close on a Friday.
  - Any information that the seller or lessor is or may be unable to perform.
key: D
explanation: The rule requires written disclosure of any information that the seller or lessor is or
  may be unable to perform. The other options describe personal opinions or preferences that are not
  mandated disclosures under this provision.
