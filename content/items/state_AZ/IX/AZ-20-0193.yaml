stem: Under A.R.S. § 32-2151(B)(1), what information must be included on a deposit slip for a trust
  fund account?
options:
  - The deposit slip must identify each transaction, the date, the amount of the deposit, and the
    escrow company's name
  - The deposit slip must identify each transaction, the date, the amount of the deposit, and the
    names of the parties involved
  - The deposit slip must identify each transaction, the date, the amount of the deposit, and the
    broker's license number
  - The deposit slip must identify each transaction, the date, the amount of the deposit, and the
    property address
key: B
explanation: The statute requires deposit slips to identify each transaction, the date, the amount
  of each deposit, and the names of the parties involved in the transaction. It does not require the
  escrow company's name, the property address, or the broker's license number. Therefore the option
  stating that the deposit slip must identify each transaction, the date, the amount of the deposit,
  and the names of the parties involved is correct, while the options that instead require the
  escrow company's name, the property address, or the broker's license number are incorrect.
citation:
  source: "### Ariz. Rev. Stat. §§ 32-2151 to 32-2166 — ARS Title 32, Ch. 20, Art. 3 - Regulation — §
    32-2151(B)(1)"
  url: null
  quoted_text: The broker shall make deposits to trust fund accounts by deposit slips. Receipts or
    other documentation shall identify each transaction, the date and the amount of each deposit and
    the names of parties involved in the transaction represented by the deposit, and monies shall be
    used only for the purpose for which the monies were deposited.
