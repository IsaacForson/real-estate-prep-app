stem: A broker transfers earnest money from Buyer A's trust account to Buyer B's trust account
  without obtaining written consent from either party. According to A.R.S. § 32-2151(C)(6), what is
  the consequence?
options:
  - The broker has committed a violation of this chapter
  - The broker may transfer funds if both parties are related
  - The broker may proceed if the amounts transferred are equal
  - The broker must notify the department within 24 hours of the transfer
key: A
explanation: The rule prohibits transferring monies between accounts owned by different persons
  unless each person consents in writing, making the broker's action a violation. The distractor
  suggesting equality of amounts is incorrect because written consent is required regardless of the
  transaction size.
