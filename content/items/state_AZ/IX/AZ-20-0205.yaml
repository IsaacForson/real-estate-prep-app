stem: What information must be included on deposit slips for trust fund account deposits?
options:
  - The transaction identifier, date, amount of each deposit, and names of parties involved
  - The amount of each deposit, the date, and the names of the parties
  - The date, amount, and names of parties for each deposit transaction
  - The date of each deposit, the amount deposited, and the parties' names
key: A
explanation: "The statute requires that receipts or other documentation identify each transaction,
  the date, the amount of each deposit, and the names of the parties involved. The correct option
  lists all four required elements: transaction identifier, date, amount of each deposit, and names
  of parties involved. Each of the other options omits at least one of those elements."
citation:
  source: Ariz. Rev. Stat. § 32-2151(B)(1)
  url: null
  quoted_text: Receipts or other documentation shall identify each transaction, the date and the
    amount of each deposit and the names of parties involved in the transaction represented by the
