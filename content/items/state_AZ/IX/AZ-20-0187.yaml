stem: A broker receives earnest money from a buyer and wishes to deposit the funds in a bank located
  in Nevada. The buyer and seller have not agreed in writing to use an out‑of‑state depository, and
  the account is not a property management trust account. Under A.R.S. § 32-2151(D)(2), what must
  the broker do?
options:
  - The broker must obtain written consent from all parties to place the monies in the out-of-state
    depository
  - The broker must disclose to the parties that potential risks may accrue from depositing the
    monies out of state
  - The broker must deposit the monies in a property management trust account that meets federal
    insurance requirements
  - The broker must place the monies in the broker's personal account to avoid fees and maintain
    sufficient balance
key: B
explanation: The rule requires disclosure of potential risks when monies are placed in an
  out‑of‑state depository that is not a property management trust account. Obtaining written consent
  alone is insufficient; the funds cannot be placed in a property management trust account per the
  scenario; placing monies in the broker’s personal account is prohibited.
citation:
  source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166 — ARS Title 32, Ch. 20, Art. 3 - Regulation — §
