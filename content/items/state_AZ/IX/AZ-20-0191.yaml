stem: A broker wishes to store transaction records at an off-site storage facility in Phoenix,
  Arizona, but has not yet notified the department of the facility's street address. According to
  A.R.S. § 32-2151(B)(2), what must the broker do before storing the records off-site?
options:
  - The broker must keep a duplicate copy of the records at the main office while storing off-site.
  - The broker must ensure the off-site storage facility is a federally insured depository.
  - The broker must obtain written consent from each client whose records are being stored before
    off-site storage.
  - The broker must provide prior written notification of the street address of the off-site storage
    location to the department.
key: D
explanation: Subsection B(2) permits off‑site storage of records only if the broker gives prior
  written notice of the facility’s street address to the department. Client consent, federal
  insurance of the facility, or maintaining a duplicate copy are not required by this rule.
  Therefore, providing the notification is the necessary step.
citation:
  source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166 — ARS Title 32, Ch. 20, Art. 3 - Regulation — §
    32-2151(B)(2)
  url: null
  quoted_text: The broker shall retain a complete record of all monies received in connection with a
    real estate transaction electronically or in the main or branch office of the designated broker
    in this state or at an off-site storage location in this state if the broker provides prior
    written notification of the street address of the off-site storage location to the department.
