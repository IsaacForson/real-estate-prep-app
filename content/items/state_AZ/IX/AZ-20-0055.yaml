stem: A broker deposits $3,500 of personal money into the trust fund account to avoid a monthly
  service fee for insufficient minimum balance. No parties to any transaction have objected. Is this
  action permissible?
options:
  - Yes, because the broker may deposit personal monies of not more than $5,000 to keep the account
    open or to avoid charges for an insufficient minimum balance
  - Yes, but only if the broker provides prior written notification of the off-site storage location
    for the trust account records
  - No, because personal monies may only be deposited if the commissioner has adopted rules allowing
    commingling
  - No, because any deposit of personal monies into a trust fund account constitutes commingling and
    is prohibited
key: A
explanation: Under A.R.S. § 32-2151(C)(2), depositing up to $5,000 of personal money into a trust
  account to keep it open or avoid minimum‑balance fees is not considered commingling. Since the
  broker deposited $3,500, which is below the $5,000 limit, the action is permissible.
