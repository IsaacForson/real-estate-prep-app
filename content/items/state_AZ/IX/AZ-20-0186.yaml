stem: Under A.R.S. § 32-2151(C)(2), what is the maximum amount of personal monies a broker may
  deposit into a trust fund account without it being considered commingling?
options:
  - $10,000
  - $5,000
  - $2,500
  - $1,000
key: B
explanation: The rule states that depositing personal monies of not more than $5,000 to keep the
  account open or avoid insufficient‑balance charges is not commingling. Amounts below $5,000 are
  permitted but not the maximum; $10,000 exceeds the limit and would be commingling.
citation:
