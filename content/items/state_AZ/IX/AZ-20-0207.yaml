stem: A broker stores computerized trust fund records off‑site but does not keep them in a manner
  allowing reconstruction if the electronic data is destroyed. Under A.R.S. § 32-2151(B)(2), is this
  compliant?
options:
  - The broker's practice is compliant because off‑site storage is permitted with prior notice
  - The broker's practice is not compliant because computerized records must be kept allowing
    reconstruction
  - The broker's practice is compliant because the records are stored electronically
  - The broker's practice is not compliant because off‑site storage requires department approval
key: B
explanation: The statute requires that computerized records be kept in a manner allowing
  reconstruction if electronic data is destroyed. Failing to do so violates the rule, making the
  practice non‑compliant. The statements claiming compliance based on off‑site storage with prior
  notice or on electronic storage are incorrect, and the claim that non‑compliance stems from a
  department‑approval requirement for off‑site storage is unrelated.
