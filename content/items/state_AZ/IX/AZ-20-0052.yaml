stem: According to A.R.S. § 32-2151(B)(3), what must a broker do on a monthly basis regarding trust
  fund accounts?
options:
  - Complete a three-way reconciliation between the trust fund account bank statements, client
    ledgers and trust fund account ledgers and provide an explanation for a variation
  - Submit a quarterly detailed report of trust fund account activity to the Arizona Department of
    Real Estate and retain a copy for the broker's records
  - Maintain individual ledgers for properties and update them promptly after trust fund
    transactions and retain them for the period required by state law
  - File an annual comprehensive audit report of the trust fund account with the Arizona Real Estate
    Commissioner and submit it to the department upon request
key: A
explanation: The rule requires brokers to perform a three-way reconciliation of bank statements,
  client ledgers and trust fund ledgers each month and explain any differences. Submitting a
  quarterly report is not required by this subsection, making that option incorrect.
