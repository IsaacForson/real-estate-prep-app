stem: A broker receives earnest money from a buyer and wishes to deposit the funds in a bank located
  in Nevada. The buyer and seller have agreed in writing to use the out‑of‑state depository, and the
  account is not a property management trust account. Under A.R.S. § 32-2151(D)(2), what must the
  broker do?
options:
  - The broker must disclose to the parties that potential risks may accrue from depositing the
    monies outside this state
  - The broker must obtain a signed authorization from the depository official allowing examination
    of the account
  - The broker must place the monies in a property management trust account established under §
    32-2174
  - The broker must immediately transfer the monies to a neutral escrow depository located in Arizona
key: A
explanation: When monies are deposited out-of-state and not in a property management trust account,
  the broker must disclose potential risks to the parties, even with written agreement. The
  distractor about obtaining authorization applies only to property management trust accounts under
  D(1)(c)(iii).
