stem: What must a broker's deposit slip documentation include according to A.R.S. § 32-2151(B)(1)?
options:
  - The transaction, date, amount, and names of parties involved
  - The transaction date, deposit amount, and client ledger number
  - The broker's license number, deposit date, and bank name
  - The property address, deposit date, and escrow agent name
key: A
explanation: Under A.R.S. § 32-2151(B)(1), receipts or other documentation must identify each
  transaction, the date and amount of each deposit, and the names of parties involved in the
  transaction. The correct option lists these exact elements. The incorrect option omits the names
  of parties, substituting a client ledger number, which the rule does not require.
