stem: Under A.R.S. § 32-2151(C)(2), what is the maximum amount of personal monies a broker may
  deposit into a trust fund account to avoid insufficient balance charges without the deposit being
  considered commingling?
options:
  - The broker may deposit up to $10,000
  - The broker may deposit up to $1,000
  - The broker may deposit up to $5,000
  - The broker may deposit up to $2,500
key: C
explanation: Subsection C(2) explicitly states that depositing personal monies of not more than
  $5,000 to keep the account open or avoid insufficient balance charges is not considered
  commingling. Any amount above this threshold would be treated as commingling and thus a violation.
  The $5,000 limit is the statutory maximum allowed under this provision.
