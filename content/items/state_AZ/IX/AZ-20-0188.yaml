stem: A broker wants to store trust fund records at an off‑site facility located at 456 Archive
  Lane, Tucson. Under A.R.S. § 32-2151(B)(2), what must the broker do before placing the records at
  that location?
options:
  - The broker must place the monies in the broker's personal account to avoid fees and maintain
    sufficient balance
  - The broker must deposit the monies in a property management trust account that meets federal
    insurance requirements
  - The broker must provide prior written notification of the street address of the off-site storage
    location to the department
  - The broker must obtain written consent from all parties to store records off-site
key: C
explanation: The rule permits off‑site storage only if the broker gives prior written notification
  of the street address to the department. Obtaining party consent is not required; the other
  options relate to trust account deposits or prohibited commingling.
citation:
  source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166 — ARS Title 32, Ch. 20, Art. 3 - Regulation — §
    32-2151(B)(2)
  url: null
  quoted_text: The broker shall retain a complete record of all monies received in connection with a
    real estate transaction electronically or in the main or branch office of the designated broker
    in this state or at an off-site storage location in this state if the broker provides prior
    written notification of the street address of the off-site storage location to the department.
