stem: A broker receives a deposit from a buyer and seller for a residential purchase. The parties
  have not agreed in writing to place the funds in an out-of-state depository. The broker wishes to
  deposit the money in a bank located in another state. Under A.R.S. § 32-2151(D), what must the
  broker do?
options:
  - Place the funds in a property management trust account established under § 32-2174 and obtain
    the depository's signed authorization for department examination
  - Deposit the funds in the out-of-state bank without any additional disclosure because the parties
    have not objected
  - Disclose to the parties that potential risks may accrue as a result of depositing the monies in
    a depository outside this state
  - Immediately place the monies in a neutral escrow depository located in Arizona regardless of the
    parties' wishes
key: C
explanation: Subsection D states that if monies are not placed in a property management trust
  account, the broker must disclose to the parties that potential risks may accrue from depositing
  the monies out-of-state. The other options either describe a different requirement or omit the
  required disclosure.
