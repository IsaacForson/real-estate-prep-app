stem: According to A.A.C. R4-28-1103(F), how soon must a designated broker report a violation of
  real estate statutes or rules by a licensee under the broker’s supervision to avoid disciplinary
  action for failure to supervise?
options:
  - Reporting within 24 hours of learning
  - Reporting immediately upon learning
  - Reporting within five days of learning
  - Reporting within 48 hours of learning
key: B
explanation: The rule states that a designated broker who immediately reports a violation to the
  Department is not subject to disciplinary action for failure to supervise. Therefore, reporting
  must be immediate upon learning of the violation. Reporting within 24 hours, while prompt, does
  not meet the immediacy required by the rule.
