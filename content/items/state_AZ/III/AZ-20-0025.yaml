stem: A licensee wants to advertise a 0.9‑acre parcel as "approximately 0.9 acre" in an online
  listing. The parcel actually measures 39,204 square feet. Is this advertisement compliant with
  Arizona advertising rules?
options:
  - Compliance based on the belief that 'acre' can be used for any parcel size
  - Non‑compliance due to the parcel being less than 43,560 square feet
  - Compliance because online advertisements are exempt from acreage rules
  - Non‑compliance because written owner consent was not obtained
key: B
explanation: Under Arizona Administrative Code § R4-28-502(H), a licensee may not use the term
  “acre,” either alone or modified, unless the land area is at least 43,560 square feet. The parcel
  measures 39,204 square feet, which is below that threshold, so the advertisement violates the
  rule. The notion that online listings are exempt is incorrect.
