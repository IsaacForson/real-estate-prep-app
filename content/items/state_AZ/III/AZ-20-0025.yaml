math:
  worked_solution: "Convert the parcel size to acres: 39,204 sq ft ÷ 43,560 sq ft per acre = 0.9 acre.
    Compare the square‑footage to the minimum required: 39,204 sq ft < 43,560 sq ft, therefore the
    parcel is smaller than one acre and the term “acre” may not be used."
