stem: A licensee places a yard sign advertising a specific property for sale without first obtaining
  the property owner's written consent. According to Arizona advertising rules, what is the
  consequence?
options:
  - The licensee must pay a fine to the State Real Estate Department
  - The licensee must include the employing broker's name on the sign
  - Removal of the sign upon the owner's request
  - The licensee may keep the sign up if the advertisement is accurate
key: C
explanation: The rule requires written consent before placing a sign and mandates prompt removal
  upon the owner's request; fines and broker name are not specified for this violation.
citation:
  source: Ariz. Admin. Code tit. 4, ch. 28 (R4-28-101 to R4-28-1310) — A.A.C. Title 4, Chapter 28 -
