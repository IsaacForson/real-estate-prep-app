    capture 2026-07-27 — § R4-28-502(I)
  url: null
  quoted_text: Before placing a sign or publishing to an electronic medium giving notice that specific
    property is being offered for sale, lease, rent, or exchange, a licensee shall secure the
    written consent of the property owner, and the sign or publication shall be promptly removed
    upon request of the property owner.
