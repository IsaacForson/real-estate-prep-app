stem: A designated broker discovers that a licensee under their supervision has mishandled trust
  funds. The broker reports the violation to the Department two hours later. Under A.A.C.
  R4-28-1103(F), is the broker protected from disciplinary action for failure to supervise?
options:
  - The broker is exempt from disciplinary action
  - The broker is protected from disciplinary action
  - The broker must investigate before disciplinary action
  - The broker is not protected from disciplinary action
key: D
explanation: The rule provides protection only when the violation is reported immediately. Reporting
  two hours later is not immediate, so the broker is not protected from disciplinary action for
  failure to supervise. The belief that the broker is protected mistakenly treats any eventual
  reporting as sufficient, ignoring the immediacy requirement.
