stem: A purchaser discovers a fraudulent scheme (subsection C violation) 20 months after the
  violation occurred. Under Arizona Revised Statutes § 32-2195.06(I), may the purchaser bring an
  action to enforce liability for that violation?
options:
  - Yes, because the limitation period is one year.
  - Yes, because the limitation period is two years.
  - No, because the limitation period is two years.
  - No, because the limitation period is one year.
key: B
explanation: For violations under subsection C, the statute allows up to two years to bring an
  action. At 20 months, the claim is still timely. The distractor “No, because the limitation period
  is one year” mistakenly applies the shorter A/B deadline to a subsection C violation.
