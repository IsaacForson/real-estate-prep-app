stem: On April 5, a subdivider receives a written request from the commissioner for a copy of all
  advertising material used in the subdivision. According to Ariz. Rev. Stat. § 32-2183.01(A), by
  what date must the subdivider file the advertising material with the commissioner?
options:
  - April 15
  - April 12
  - April 14
  - April 13
key: A
explanation: The rule requires filing within ten days after the commissioner’s request. Counting ten
  days from April 5 leads to April 15 as the deadline. April 14 would be only nine days after the
  request and therefore does not satisfy the ten‑day requirement.
citation:
  source: Ariz. Rev. Stat. § 32-2183.01(A)
  url: null
  quoted_text: Within ten days after request by the commissioner, the subdivider shall file with the
    commissioner a copy of any advertising material used in connection with sales of the subdivided
    lands.
