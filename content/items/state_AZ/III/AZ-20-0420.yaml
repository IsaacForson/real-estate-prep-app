stem: A designated broker learns that a licensee under their supervision has placed a false
  advertisement. The broker waits 10 hours before notifying the Department. Under A.A.C.
  R4-28-1103(F), what is the effect on the broker’s potential disciplinary action for failure to
  supervise?
options:
  - The broker faces no disciplinary action
  - The broker may face disciplinary action
  - The broker is exempt from disciplinary action
  - The broker must warn before disciplinary action
key: B
explanation: Because the rule requires immediate reporting to avoid disciplinary action, a delay of
  10 hours is not immediate. Thus the broker may be subject to disciplinary action for failure to
  supervise. The idea that the broker faces no disciplinary action assumes that reporting within the
  same day suffices, which the rule does not allow.
