stem: Under Arizona advertising rules for unsubdivided land, how many days after use must a licensee
  file a copy of subsequent advertising material with the commissioner?
options:
  - File within 21 days of use
  - File within 14 days of use
  - File within 30 days of use
  - File within 10 days of use
key: A
explanation: The rule requires filing of any subsequent advertising within twenty‑one days of use.
  Filing within 10 or 14 days is too soon but still compliant; however the question asks the
  required number of days, which is twenty‑one. Filing within 30 days exceeds the limit and would be
  non‑compliant.
citation:
  source: Ariz. Rev. Stat. §§ 32-2194 to 32-2195.12 — ARS Title 32, Ch. 20, Arts. 6-7 - Cemeteries;
    Membership Campgrounds — § 32-2195.05 § 32-2195.05
  url: null
  quoted_text: The owner or agent shall file with the commissioner, within twenty-one days of use, a
    copy of any subsequent advertising of any kind, used directly or indirectly in connection with
    the purchase, sale or lease of any lot or parcel subject to the provisions of this article.
