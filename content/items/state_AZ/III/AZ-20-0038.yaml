stem: A licensee advertises a property using a promotion that involves a game of chance or lottery
  not specifically authorized under this chapter. What is the consequence under Arizona advertising
  rules?
options:
  - The commissioner may take disciplinary action under grounds for denial, suspension, or
    revocation.
  - The advertisement is permissible if disclosed as a game of chance.
  - The licensee must refund any money collected from participants.
  - The advertisement is exempt if the prize value is under one hundred dollars.
key: A
explanation: Soliciting prospects through a promotion of a speculative nature involving a game of
  chance or risk, or conducting unauthorized lotteries or contests, is expressly prohibited under
  subsection A.13 and constitutes grounds for disciplinary action. The other options introduce
  conditions or exemptions not found in the statute.
