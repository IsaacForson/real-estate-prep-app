stem: After the commissioner issues a cease and desist order regarding a subdivision, within how
  many business days must the commissioner provide notice of the order to all affected parties with
  an ownership interest of record?
options:
  - 5 business days
  - 10 business days
  - 15 business days
  - 20 business days
key: B
explanation: The commissioner must provide notice of a cease and desist order within ten business
  days of issuing the order, as stated in § 32-2183.02(A). The five‑business‑day option is incorrect
  because the rule specifies ten days, not five.
citation:
  source: Ariz. Rev. Stat. §§ 32-2181 to 32-2185.09 — ARS Title 32, Ch. 20, Art. 4 - Sale of
    Subdivided Lands — § 32-2183.01 § 32-2183.02(A)
  url: null
  quoted_text: The commissioner shall also provide notice of the order or suspension to all affected
    parties with an ownership interest of record in any lot, parcel or fractional interest in the
    subdivision property within ten business days of issuing the order of suspension.
