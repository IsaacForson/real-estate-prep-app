stem: A licensee places a yard sign advertising a specific property for sale on the owner's land
  without first obtaining the owner's written consent. According to Arizona advertising rules, what
  disciplinary action may the commissioner take?
options:
  - Assess a civil penalty of $500 per day for each violation, in addition to other possible
    disciplinary actions.
  - Suspend or revoke the license, deny issuance, issue a letter of concern, issue a provisional
    license, or deny renewal.
  - Require the licensee to complete continuing education hours, in addition to any other sanctions
    the commissioner may impose.
  - Issue a letter of concern only, without any additional sanctions such as suspension, revocation,
    or fines.
key: B
explanation: Under Arizona advertising rules, placing a yard sign advertising a specific property
  for sale on the owner's land without the owner's written consent is a specific ground for
  discipline. The commissioner may impose any of the disciplinary actions listed in the statute,
  including suspending or revoking the license, denying issuance, issuing a letter of concern,
  issuing a provisional license, or denying renewal. Other options that limit the commissioner's
  authority or introduce penalties not specified in this rule are incorrect (see Ariz. Rev. Stat. §
  32-2153).
