stem: Under Ariz. Rev. Stat. § 32-2183.01, how many days does a subdivider have to file a copy of
  advertising material with the commissioner after receiving a request?
options:
  - Thirty days
  - Fifteen days
  - Ten days
  - Five days
key: C
explanation: The statute requires the subdivider to file advertising material within ten days of a
  commissioner’s request. Therefore, ten days is the correct period. The distractor of five days is
  incorrect because the rule specifies ten days, not five.
