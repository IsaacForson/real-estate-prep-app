stem: Under Arizona advertising rules, which of the following actions is prohibited for a licensee?
options:
  - Disclosing that a property is located near a public school.
  - Including a photograph of the property's interior in an advertisement.
  - Displaying the licensee's license number in all advertisements.
  - Using the term "real estate broker" in advertising without holding a valid broker license.
key: D
explanation: The statute prohibits a licensee from knowingly using the term 'real estate broker',
  'cemetery broker' or 'membership camping broker' without the legal right to do so. The other
  options describe permissible or unrelated activities not addressed in the provision.
