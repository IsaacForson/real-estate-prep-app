stem: According to Ariz. Rev. Stat. § 32-2195.05(C), all advertising and sales literature for
  unsubdivided land must be consistent with which two documents?
options:
  - The notice of intention and the public report
  - The deed and the title insurance policy
  - The subdivision plat and the zoning map
  - The broker's license and the employer's registration
key: A
explanation: The rule requires advertising to match the notice of intention and the public report
  (32-2195.05(C)). The deed and title insurance policy are not mentioned in this consistency
  requirement, making that option incorrect.
