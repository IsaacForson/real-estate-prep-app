stem: Under Arizona advertising rules, which of the following actions is the commissioner authorized
  to take, **NOT** considering any other factors, when a licensee knowingly publishes a false or
  misleading advertisement concerning property?
options:
  - Issuance of a letter of concern to the licensee
  - Imposition of a monetary fine of $1,000
  - Requirement to complete additional continuing education hours
  - Order to pay restitution to the affected consumer
key: A
explanation: The statute authorizes the commissioner to issue a letter of concern as one of the
  possible disciplinary actions for violations such as false advertising. The other options—imposing
  a fine, requiring continuing education, or ordering restitution—are not mentioned in the provided
  text as permissible actions.
