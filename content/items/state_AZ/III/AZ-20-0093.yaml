stem: A licensee posts a flyer for a rental house that reads 'For rent by owner – no agent fees.'
  According to Arizona Administrative Code R4-28-502.A, what is the status of this advertisement?
options:
  - The advertisement is permitted if the licensee also includes their broker's name
  - The advertisement is permitted because the statement is truthful
  - The advertisement is prohibited because it implies no salesperson or broker is taking part
  - The advertisement is prohibited only if the property is commercial
key: C
explanation: The rule prohibits advertising that implies no salesperson or broker is involved in the
  offer. The flyer’s wording creates that implication, so it is prohibited. The distractor
  suggesting it is permitted if the broker's name is added is incorrect because the implication
  remains regardless of additional disclosure.
