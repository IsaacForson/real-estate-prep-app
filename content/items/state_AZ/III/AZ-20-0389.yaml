stem: According to Ariz. Rev. Stat. § 32-2183.01(C), how long must a subdivider retain copies of
  advertising materials used in marketing lots after the last use of those materials?
options:
  - The subdivider must retain the materials for four years after the last use.
  - The subdivider must retain the materials for two years after the last use.
  - The subdivider must retain the materials for three years after the last use.
  - The subdivider must retain the materials for eleven years after the last use.
key: C
explanation: The rule explicitly requires retention for three years after the last use of the
  advertising materials. This ensures the commissioner can review materials for compliance. The
  two‑year option understates the required period, while the five‑year option exceeds it.
