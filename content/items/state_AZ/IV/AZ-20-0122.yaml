stem: Under Ariz. Rev. Stat. § 32-2158(A), who is responsible for paying the fees and mileage of a
  witness who appears at a commissioner's hearing upon the witness being subpoenaed?
options:
  - The state treasury department
  - The witness who was subpoenaed
  - The party that requested the witness
  - The commissioner's office staff
key: C
explanation: The statute states that any witness who appears by order of the commissioner shall
  receive the same fees and mileage allowed by law to a witness in civil cases, which shall be paid
  by the party at whose request the witness is subpoenaed. Therefore, the requesting party bears the
  cost. The option suggesting the commissioner's office pays is incorrect because the commissioner
  does not cover witness fees.
