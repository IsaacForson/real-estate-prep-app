stem: Under Arizona's licensing definitions, who qualifies as a designated broker?
options:
  - Any salesperson who has held an active real estate license for at least five full years.
  - A corporation registered with the corporation commission to sell real estate.
  - Any licensee appointed by the commissioner to audit trust fund accounts.
  - A natural person who is licensed as a broker and designated to act for an employer.
key: D
explanation: A designated broker is a natural person licensed as a broker under the chapter who is
  either designated to act on behalf of an employing real estate entity or who is doing business as
  a sole proprietor.
citation:
  source: Ariz. Rev. Stat. § 32-2101
  url: null
  quoted_text: '"Designated broker" means a natural person who is licensed as a broker under this
    chapter and who is either: (a) Designated to act on behalf of an employing real estate, cemetery
    or membership camping entity.'
