stem: A broker employs three salespersons but does not review their contracts or monitor their
  advertising, leading to a salesperson making false statements about a property. Under Arizona law,
  is the broker's failure to supervise grounds for disciplinary action?
options:
  - The broker's failure to supervise does not constitute grounds for disciplinary action because
    the broker provided written policies but did not enforce them.
  - The broker's failure to supervise does not constitute grounds for disciplinary action because
    the salesperson acted independently and the broker had no knowledge of the false statements.
  - The broker's failure to supervise constitutes grounds for disciplinary action unless the broker
    has received a complaint from a client.
  - The broker's failure to supervise constitutes grounds for disciplinary action because it
    involved failing to exercise reasonable supervision over salespersons' activities.
key: D
explanation: Under ARS § 32-2153(A)(21), a broker commits a disciplinary offense by failing to
  exercise reasonable supervision over the activities of salespersons under their employ. Therefore,
  the statement that the failure to supervise constitutes grounds for disciplinary action because it
  involved failing to exercise reasonable supervision is correct. The choice suggesting that lack of
  knowledge or independent action by the salesperson negates the duty to supervise is incorrect, as
  the statutory duty to supervise exists regardless of the broker's specific awareness of individual
  misconduct. Similarly, the claim that written policies exempt the broker from discipline if not
  enforced is incorrect because reasonable supervision requires active oversight, not just the
  existence of policies.
