stem: A client is considering taking early possession of a property before closing. What must the
  licensee recommend to the client under Arizona's licensee-duty rule?
options:
  - That the client sign a possession waiver drafted solely by the client's own listing broker.
  - That the client delay closing until the seller agrees to indemnify all risk.
  - That the client rely on the licensee's own opinion instead of outside advice.
  - That the client seek counsel from insurance, legal, tax, and accounting professionals.
key: D
explanation: The rule requires a licensee to recommend that a client seek appropriate counsel from
  insurance, legal, tax, and accounting professionals regarding the risks associated with early or
  delayed possession of a property.
