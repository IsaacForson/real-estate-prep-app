stem: What is the maximum civil penalty per infraction that the Arizona Commissioner of Real Estate
  may assess against a licensee under Ariz. Rev. Stat. § 32-2160.01?
options:
  - A civil penalty of $500 per infraction
  - A civil penalty of $1,000 per infraction
  - A civil penalty of $2,000 per infraction
  - A civil penalty of $5,000 per infraction
key: B
explanation: The statute states the commissioner may assess a civil penalty "in an amount not to
  exceed one thousand dollars for each infraction," making $1,000 the maximum allowable amount. The
  $500 option understates the limit, while the $2,000 and $5,000 options exceed the statutory cap.
