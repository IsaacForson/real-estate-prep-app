stem: Under Arizona's licensing definitions, what does the term 'employing broker' mean?
options:
  - A natural person who is licensed as a broker and designated to act for an employer, including
    the authority to supervise associated licensees and manage office operations
  - A broker who employs salespersons to perform real estate activities, overseeing their
    transactions and ensuring compliance with licensing laws
  - A broker entity registered with the corporation commission or a sole proprietorship where the
    sole proprietor is a licensed broker
  - A person who holds a broker license and works under another broker's supervision, performing
    brokerage activities on behalf of the supervising broker
key: C
explanation: An employing broker is either a broker entity registered with the Corporation
  Commission or a sole proprietorship whose owner is a licensed broker, as defined in Ariz. Rev.
  Stat. § 32-2101(26).
