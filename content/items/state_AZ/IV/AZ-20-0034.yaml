stem: According to Arizona law, what is the minimum number of lots, parcels, or fractional interests
  that constitutes a subdivision?
options:
  - Three or more
  - Five or more
  - Four or more
  - Six or more
key: D
explanation: The statute defines a subdivision as land divided into six or more lots, parcels, or
  fractional interests for sale or lease. Therefore, the minimum number is six. The distractor 'Five
  or more' is incorrect because the threshold is specifically six, not five.
citation:
  source: Ariz. Rev. Stat. §§ 32-2101 to 32-2109 — ARS Title 32, Ch. 20, Art. 1 - Real Estate
    Department; General Provisions — § 32-2101(59)(a)
  url: null
  quoted_text: Means improved or unimproved land or lands divided or proposed to be divided for the
    purpose of sale or lease, whether immediate or future, into six or more lots, parcels or
