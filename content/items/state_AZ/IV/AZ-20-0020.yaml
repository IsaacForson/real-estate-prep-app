stem: A licensee places a for-sale sign on a vacant lot after speaking informally with a neighbor
  who is not the recorded owner. Is this conduct grounds for discipline under Arizona's licensing
  statute?
options:
  - Yes, a sign requires the written authority of the owner or the owner's authorized agent.
  - No, because signage placement is regulated only by local zoning ordinances.
  - No, because any adjacent neighbor may freely authorize signage on undeveloped land parcels
    nearby.
  - Yes, but only if the sign includes the licensee's personal contact information.
key: A
explanation: The statute treats placing a sign on property offering it for sale or rent without the
  written authority of the owner or the owner's authorized agent as grounds for license discipline.
