stem: Under Arizona law, what is a "letter of concern" issued by the commissioner?
options:
  - A license that the department issues and that allows a licensee to practice subject to either a
    consent order as prescribed in section 32-2153.01 or the commissioner's terms, conditions and
    restrictions.
  - A formal order issued by the commissioner requiring a licensee to cease and desist from engaging
    in a prohibited act or practice, to make restitution, or to take appropriate affirmative action
    within a reasonable period as prescribed by the commissioner.
  - A written notice of charges filed against a licensee that must be served before any suspension,
    revocation, or denial of renewal, and that provides the licensee an opportunity for a hearing
    pursuant to title 41, chapter 6, article 10.
  - An advisory letter to notify a licensee that, while the conduct or evidence does not warrant
    disciplinary action, the commissioner believes that the licensee should modify or eliminate
    certain practices and that continuation of the activities may result in disciplinary action
    against the licensee.
key: D
explanation: Arizona Revised Statutes § 32‑2153(F)(1) defines a "letter of concern" as an advisory
  letter to a licensee that, although the conduct does not merit disciplinary action, the
  commissioner believes the licensee should modify or eliminate certain practices and that continued
  conduct could lead to disciplinary action. The other answer choices describe a license that
  permits practice subject to a consent order, a formal cease‑and‑desist order, and a notice of
  charges—none of which match the statutory definition.
