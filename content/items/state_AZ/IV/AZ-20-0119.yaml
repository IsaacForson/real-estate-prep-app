stem: Under Arizona law, what is the definition of a developer?
options:
  - A person who offers real property in a development for sale, lease or use, either immediately or
    in the future, on the person's own behalf or on behalf of another person.
  - A person whose involvement with a development is limited to listing property within the
    development for sale, lease or use.
  - A person who provides financing for development projects but does not offer any real property
    for sale, lease or use.
  - A person who manages construction contracts for a development yet has no authority to offer the
    property for sale, lease or use.
key: A
explanation: Arizona law defines a developer as a person who offers real property in a development
  for sale, lease or use, either immediately or in the future, on the person's own behalf or on
  behalf of another person. This matches the answer that states a developer is a person who offers
  real property in a development for sale, lease or use, either immediately or in the future, on the
  person's own behalf or on behalf of another person. The answer describing a person whose
  involvement is limited to listing property within the development for sale, lease or use does not
  meet the statutory definition, nor do the answers about financing or managing construction
  contracts without authority to offer the property.
citation:
