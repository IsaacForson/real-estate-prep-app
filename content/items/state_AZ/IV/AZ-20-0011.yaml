stem: Under Arizona's licensing definitions, what is an associate broker?
options:
  - A salesperson who has completed continuing education for brokers.
  - A member of the real estate advisory board appointed by the governor.
  - A licensed broker who is employed by another broker.
  - A person who manages trust accounts for a designated broker.
key: C
explanation: The statute defines an associate broker as a licensed broker who is employed by another
  broker, and unless stated otherwise, an associate broker holds the same license privileges as a
  salesperson.
