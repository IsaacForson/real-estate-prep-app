stem: A licensee receives an earnest money deposit from a buyer and deposits it into the licensee's
  personal checking account instead of a trust account. Under Arizona law, is this conduct grounds
  for disciplinary action?
options:
  - The licensee's action does not constitute grounds for disciplinary action because the licensee
    disclosed the commingling to the broker.
  - The licensee's action constitutes grounds for disciplinary action because it involved
    commingling client funds with personal funds.
  - The licensee's action does not constitute grounds for disciplinary action because the licensee
    promptly returned the funds to the client upon request.
  - The licensee's action constitutes grounds for disciplinary action because the licensee failed to
    obtain written consent from the buyer for the commingling.
key: B
explanation: Arizona Revised Statutes § 32‑2153(A)(16) expressly prohibits a licensee from
  commingling a client’s monies or property with the licensee’s own funds. Depositing earnest money
  into a personal checking account is a violation of that provision and is therefore grounds for
  disciplinary action. Disclosure to the broker, returning the funds later, or lack of written
  consent does not cure the initial commingling violation.
