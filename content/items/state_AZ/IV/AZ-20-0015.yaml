stem: A licensee realizes she cannot complete a required act on time because of a scheduling
  conflict. What must she do under Arizona's licensee-duty rule?
options:
  - Wait until the client asks about the delay before saying anything.
  - Perform the act late without comment, since delay alone is not a violation.
  - Notify her designated broker expeditiously of her inability to perform.
  - Reassign the client to another licensee without informing the broker.
key: C
explanation: A licensee must perform required acts expeditiously and not delay performance
  intentionally or through neglect, and if the licensee is unable to perform, the rule requires
  expeditiously notifying the designated broker.
citation:
  source: Ariz. Admin. Code Rule R4-28-1101
  url: null
  quoted_text: A licensee shall expeditiously perform all acts required by the holding of a license. A
    licensee shall not delay performance, either intentionally or through neglect.
