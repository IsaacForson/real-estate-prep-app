stem: A licensee who is also a member of an LLC that will purchase the property represents the
  seller and has not disclosed this interest to the seller. Which rule has the licensee violated?
options:
  - Failed to disclose a present or prospective interest or conflict before entering a binding
    agreement
  - Failed to place monies in a trust fund account as required by statute and maintain proper
    records per commissioner rules
  - Failed to provide a wood infestation report when tendering an offer or a lead‑based paint
    disclosure
  - Failed to recommend the client seek counsel from insurance, legal, tax, and accounting
    professionals before closing
key: A
explanation: The licensee must disclose any present or prospective interest or conflict before
  entering a binding agreement (R4-28-1101.E.4). Failing to do so violates this duty. The other
  options describe unrelated violations.
