stem: A licensee who works at a brokerage office uses that office address as her address of record.
  Under Arizona's definition, does this qualify as an address of record?
options:
  - The licensee's use of the broker's office address does not qualify as an address of record
    because the address must be the licensee's residential address
  - The licensee's use of the broker's office address qualifies as an address of record because the
    address where a licensee practices is included
  - The licensee's use of the broker's office address qualifies as an address of record only if a
    statutory agent address is also provided
  - The licensee's use of the broker's office address does not qualify as an address of record
    because only a residential address qualifies
key: B
explanation: The definition of address of record includes the address where a licensee practices or
  is otherwise employed (§ 32-2101(2)(a)). Therefore using the broker's office address qualifies.
  The distractor claiming only a residential address qualifies is incorrect because the definition
  also lists the practice address as a valid option.
citation:
  source: Ariz. Rev. Stat. § 32-2101
  url: null
  quoted_text: '"Address of record" means any of the following: (a) The address where a licensee
    practices or is otherwise employed.'
