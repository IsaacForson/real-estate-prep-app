stem: A broker pays a licensee a fixed monthly salary for administrative duties. Does this salary
  qualify as compensation under Arizona's definition?
options:
  - Yes because salary is expressly included in the definition of compensation
  - No because compensation only applies to commissions earned from real estate transactions
  - Yes but only if the salary is contingent on closing a sale
  - No because administrative duties are not considered real estate services
key: A
explanation: Compensation is defined in § 32‑2101(17) to include salary as valuable consideration
  for services rendered, so the salary qualifies. The statement that compensation only applies to
  commissions earned from real estate transactions is incorrect because the definition expressly
  includes salary and other forms of consideration.
citation:
