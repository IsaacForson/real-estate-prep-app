stem: The Arizona Commissioner seeks an injunction to stop a person from selling cemetery property
  for speculation, a violation of Ariz. Rev. Stat. § 32-2162. Under Ariz. Rev. Stat. § 32-2160(B),
  what is required for the court to grant the injunction?
options:
  - The commissioner must post a security bond
  - The commissioner must get defendant consent
  - The commissioner must demonstrate probable cause
  - The commissioner must make a proper showing
key: D
explanation: The statute says that upon a proper showing, a temporary restraining order, a
  preliminary injunction or a permanent injunction shall be granted without bond. Thus, a proper
  showing is the requirement for the court to grant the injunction. The option referencing probable
  cause is not the standard set by the statute.
