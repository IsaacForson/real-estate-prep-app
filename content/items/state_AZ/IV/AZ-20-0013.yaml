stem: A licensee sends a free press release about a new listing to a local newspaper, and the
  newspaper charges nothing to publish it. Does this press release count as advertising under
  Arizona's definitions?
options:
  - No, because press releases delivered to news media at no charge are excluded.
  - Yes, because press releases are advertising unless a court rules otherwise.
  - No, because only paid social media posts can ever meet the advertising definition requirements.
  - Yes, because any communication naming a specific property is advertising.
key: A
explanation: The definition of advertising specifically excludes press releases or other
  communications delivered to news media for general information purposes if the media outlet does
  not charge to publish or use the material.
citation:
  source: Ariz. Rev. Stat. § 32-2101
  url: null
  quoted_text: Press releases or other communications delivered to newspapers, periodicals or other
    news media for general information or public relations purposes if no charge is made by the
