stem: A process server delivers a subpoena issued by the Arizona Commissioner of Real Estate.
  According to Ariz. Rev. Stat. § 32-2158(B), what is the maximum compensation the server may
  receive?
options:
  - The fees set by law for similar service
  - Compensation capped at the statutory rate
  - A limit equal to court‑process fees
  - The amount the commissioner approves
key: A
explanation: The statute provides that the person serving process shall receive compensation allowed
  by the commissioner, not to exceed the fees prescribed by law for similar service. Hence, the
  maximum is the legally prescribed fee for comparable service. The option mentioning a statutory
  rate is misleading because the rule references fees, not a rate.
