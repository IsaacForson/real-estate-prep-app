stem: A licensee in Yavapai County is assessed a civil penalty for violating a subdivision
  advertising rule. Who is responsible for bringing the action to recover that penalty under Ariz.
  Rev. Stat. § 32-2160.01(B)?
options:
  - The county attorney of Yavapai County
  - The attorney general of Arizona
  - The Arizona Commissioner of Real Estate
  - The licensee’s employing broker
key: B
explanation: The statute specifies that actions to recover penalties assessed under this chapter
  shall be brought by the attorney general in the name of the state. The county attorney only
  prosecutes violations upon request (§32-2160(A)), while the commissioner assesses penalties but
  does not bring the recovery action.
