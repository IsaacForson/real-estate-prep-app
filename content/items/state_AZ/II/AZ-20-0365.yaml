stem: Under Arizona law, what must a real estate employment agreement include regarding its duration?
options:
  - A clause allowing either party to terminate with 30 days' notice
  - A definite duration or expiration date showing dates of inception and expiration
  - A provision that the agreement renews automatically each year
  - A statement that the agreement remains in effect until the broker's license is renewed
key: B
explanation: Subsection A(3) of § 32-2151.02 requires that a real estate employment agreement have a
  definite duration or expiration date showing the dates of inception and expiration. The other
  options describe provisions not mandated by the statute.
