stem: A broker has not removed interest earned on a trust fund account for 14 months. Under Arizona
  law, what is the result?
options:
  - Violation because interest must be removed at least once every twelve months
  - Violation only if the interest exceeds $100 under Arizona regulations
  - No violation because interest removal is only required annually
  - No violation if the broker provides written notice to the commissioner
key: A
explanation: The rule states that failing to remove trust account interest at least once every
  twelve months is a violation. Fourteen months without removal exceeds the allowed interval, so it
  is a violation. The distractor claiming "No violation because interest removal is only required
  annually" is wrong because the rule sets a minimum frequency of at least once per year, not a
  maximum.
