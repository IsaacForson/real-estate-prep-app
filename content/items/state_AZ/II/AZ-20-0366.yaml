stem: "A licensee seeks to obtain an exclusive real estate employment agreement from a seller who
  currently has an exclusive agreement with another broker. The licensee obtains written
  acknowledgment from the seller that signing another agreement could expose the seller to liability
  for substantial additional commissions. Under Arizona law, the licensee's action is:"
options:
  - The action is prohibited because the seller is already under an exclusive agreement.
  - The action is permitted only if the licensee also discloses the potential liability in writing
    to the seller.
  - The action is permitted because the licensee has obtained the required written acknowledgment.
  - The action is prohibited unless the existing broker consents in writing.
key: C
explanation: Subsection C of § 32-2151.02 allows a licensee to procure an agreement from a party
  already under an exclusive agreement if the licensee has received the party's written
  acknowledgment of potential liability for additional commissions. No additional disclosure is
  required by the statute.
