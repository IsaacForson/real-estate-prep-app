stem: What is a 'real estate employment agreement' under Arizona Revised Statutes § 32-2151.02(E)?
options:
  - A written agreement whereby a broker receives compensation for services performed under
    §44-101(7)
  - An oral agreement allowing a broker to collect fees for property showings
  - A contract that obligates a buyer to pay a broker regardless of services rendered
  - A disclosure statement required before any real estate transaction
key: A
explanation: Under Ariz. Rev. Stat. § 32-2151.02(E), a real estate employment agreement is a written
  agreement by which a real estate broker is entitled to compensation for services rendered pursuant
  to Ariz. Rev. Stat. § 44-101(7). The option describing a written agreement in which a broker
  receives compensation for services performed under §44-101(7) matches this definition. The option
  describing an oral agreement is incorrect because the agreement must be written, not oral.
