stem: A broker deposits $6,000 of personal monies into a trust fund account to keep the account open
  and avoid insufficient‑balance fees. Under Arizona law, what is the result?
options:
  - It is permissible if the broker discloses the deposit to the parties to the transaction
  - It is not a violation because the deposit consists of the broker’s personal funds
  - It is a violation because the exemption for personal monies applies only to deposits of $5,000
    or less
  - It is required to prevent the account from being closed due to insufficient balance
key: C
explanation: Under Ariz. Rev. Stat. § 32-2151.02, a broker may deposit personal monies of not more
  than $5,000 to keep a trust account open or to avoid insufficient‑balance fees without
  constituting commingling. Depositing $6,000 exceeds that limit, so the act is a violation. The
  other options incorrectly state that the deposit is permissible, claim it is not a violation
  because the funds are personal, or suggest it is required to prevent account closure.
