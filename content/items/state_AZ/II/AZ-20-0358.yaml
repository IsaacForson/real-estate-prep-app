stem: A licensee fails to keep any written records of the earnest money deposits received from three
  different buyers over a month. Under Arizona law, which ground for disciplinary action does this
  constitute?
options:
  - The licensee failed to maintain a complete record of each transaction that comes within this
    chapter.
  - The licensee failed to keep an escrow or trust account or other record of monies deposited with
    the licensee relating to a real estate transaction.
  - The licensee commingled the monies or other property of the licensee's principal or client with
    the licensee's own.
  - The licensee accepted compensation from a person not authorized to provide compensation under
    section 32-2155.
key: A
explanation: Clause 18 of § 32-2153 requires a licensee to maintain a complete record of each
  transaction that comes within the chapter. Failing to keep any written records of earnest money
  deposits violates this requirement. The licensee may still have an escrow account, so the
  escrow‑account distractor does not apply; there is no indication of commingling or unauthorized
  compensation.
