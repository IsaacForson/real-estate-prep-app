stem: A licensee represents both the buyer and the seller in the same transaction without obtaining
  the written consent of either party. Which ground for denial, suspension, or revocation of a
  license does this conduct constitute under Arizona Revised Statutes § 32-2153?
options:
  - Acted for more than one party in a transaction with the verbal consent of all parties to the
    transaction
  - Acted for more than one party in a transaction after obtaining written consent from only one
    party to the transaction
  - Acted for more than one party in a transaction without the knowledge or written consent of all
    parties to the transaction
  - Acted for more than one party in a transaction after obtaining written consent from all parties
    but failing to disclose the dual agency arrangement
key: C
explanation: The statute grounds disciplinary action when a licensee acts for more than one party
  without the knowledge or written consent of all parties. The option citing verbal consent is
  incorrect because the statute requires written consent, not merely verbal agreement.
