stem: A broker receives $3,000 earnest money from Buyer A and $2,000 from Buyer B for two separate
  properties. He deposits both amounts into a single trust fund account and later transfers $1,000
  from Buyer A's funds to cover expenses for Buyer B's transaction without obtaining written consent
  from either party. Under Arizona law, which violation does this constitute?
options:
  - Failure to maintain separate ledgers for each property as required
  - Failure to limit personal monies deposits to $5,000 or less in a trust fund account
  - Failure to remove interest earned on a trust fund account at least once every twelve months
  - Failure to obtain written consent before transferring monies between accounts owned by different
    persons
key: D
explanation: The statute prohibits transferring monies between accounts owned by different persons
  unless each person provides written consent. The broker's transfer of funds between Buyer A and
  Buyer B without consent violates this rule. The distractor about failing to remove interest is
  irrelevant because the scenario does not involve interest earnings.
