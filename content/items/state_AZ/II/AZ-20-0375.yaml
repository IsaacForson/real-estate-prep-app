stem: What must a consent order include according to Arizona law?
options:
  - Terms that the parties agree on and that the commissioner believes are appropriate
  - Terms that the commissioner alone decides without party agreement
  - Terms that only the parties agree on, without commissioner input
  - Standard terms prescribed by the commissioner’s rules
key: A
explanation: The statute states that a consent order shall include terms that the parties agree on
  and that the commissioner, in the commissioner's discretion, believes are appropriate. The other
  options either omit the commissioner’s discretion or the parties’ agreement, which contradicts the
  requirement.
