stem: A licensee is found to have committed five separate violations of the real estate chapter.
  What is the maximum total civil penalty the commissioner may assess?
options:
  - $3,000
  - $5,000
  - $4,000
  - $2,000
key: B
explanation: Under Ariz. Rev. Stat. § 32-2160.01.A, each infraction carries a maximum civil penalty
  of $1,000. With five infractions, the greatest allowable total is five multiplied by $1,000,
  resulting in $5,000. The option of $3,000 would be correct for three infractions, and $4,000 for
  four infractions.
