stem: A licensee receives notice of a disciplinary hearing scheduled for June 30. The licensee
  submits a voluntary surrender of the license on June 25. Under Arizona law, is the surrender
  effective?
options:
  - Yes, because the surrender occurred before the hearing date
  - No, because the surrender must occur at least ten days prior to the hearing
  - Yes, provided the licensee also pays all outstanding renewal fees
  - No, unless the commissioner issues a written waiver of the ten‑day requirement
key: B
explanation: The surrender on June 25 is five days before the June 30 hearing, which is less than
  the ten‑day minimum, so it is ineffective. The distractor “Yes, because the surrender occurred
  before the hearing date” is wrong because prematurity alone does not satisfy the statutory ten‑day
  rule.
