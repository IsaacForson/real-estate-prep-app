stem: An employing broker wishes to assign a real estate employment agreement to another broker.
  Under Arizona law, what is required for the assignment to be valid?
options:
  - Obtain express written consent from all parties at the time of assignment
  - Obtain verbal consent from the broker assigning the agreement
  - Obtain consent only from the employing broker who holds the agreement
  - Obtain consent only from the licensee whose agreement is being assigned
key: A
explanation: Under Arizona law, an employing broker may not assign a real estate employment
  agreement to another broker without the express written consent of all parties to the agreement at
  the time of assignment (Ariz. Rev. Stat. § 32-2151.02(B)). Therefore, the assignment is valid only
  when express written consent is obtained from every party involved. Verbal consent does not
  satisfy this requirement, and consent obtained from only the assigning broker or only the licensee
  whose agreement is being assigned is insufficient.
