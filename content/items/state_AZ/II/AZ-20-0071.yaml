stem: A licensee receives earnest money deposit from a buyer and deposits it into his personal
  checking account instead of a trust account. Which ground for disciplinary action does this
  constitute?
options:
  - Failure to keep an escrow or trust account for monies deposited in a real estate transaction.
  - Failure to disclose a known material defect in the property being sold.
  - Failure to pay the renewal fee before the specified time.
  - Failure to maintain a complete record of each transaction that comes within this chapter.
key: A
explanation: The statute lists failure to keep an escrow or trust account for monies deposited in a
  real estate transaction as a ground for discipline. The distractor about failing to disclose a
  known material defect is incorrect because such disclosure failures are exempt from liability
  under Arizona law and are not a disciplinary ground in this section.
