stem: A licensee is accused of violating Arizona real estate law in Pima County. The commissioner
  has received a written request to prosecute. Under Arizona law, who is responsible for prosecuting
  the violation?
options:
  - The Pima County Attorney
  - The Arizona Attorney General
  - The commissioner personally
  - The Maricopa County Attorney
key: A
explanation: Subsection A of Ariz. Rev. Stat. § 32-2160 provides that the county attorney of the
  county where a violation occurs shall, upon the written request of the commissioner or the
  attorney general, prosecute the violation. Because the alleged violation occurred in Pima County
  and the commissioner has made a written request, the Pima County Attorney handles prosecution. The
  Arizona Attorney General does not prosecute directly; the commissioner does not prosecute
  personally; and Maricopa County is irrelevant to the venue of the violation.
