stem: After the commissioner issues a summary suspension of a license, when does the suspension
  become final under Arizona law?
options:
  - The suspension becomes final if the licensee does not surrender the license within thirty days
  - The suspension becomes final if the licensee fails to pay the renewal fee within thirty days
  - The suspension becomes final if the licensee requests a hearing within thirty days
  - The suspension becomes final if the licensee does not request a hearing within thirty days
key: D
explanation: The rule states that 'A summary suspension shall be deemed to be final if a request for
  a hearing is not received within thirty days as provided by section 41-1092.03.' Therefore,
  failure to request a hearing within thirty days makes the suspension final. The distractor about
  failing to pay the renewal fee is incorrect because payment of fees is unrelated to the finality
  of a summary suspension.
