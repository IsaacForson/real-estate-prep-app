stem: A licensee tenders a wood infestation report to a buyer knowing that the report is inaccurate
  and that no inspection was performed. Under Arizona law, which ground for disciplinary action does
  this conduct constitute?
options:
  - "Ground for disciplinary action: tendering a wood infestation report known to be inaccurate or
    false"
  - "Ground for disciplinary action: failing to keep an escrow or trust account for monies deposited
    in a real estate transaction"
  - "Ground for disciplinary action: commingling client monies with personal funds"
  - "Ground for disciplinary action: placing a 'For Sale' sign without the owner's written authority"
key: A
explanation: The rule specifies that tendering a wood infestation report known to be inaccurate or
  false, or when no inspection was done, constitutes a ground for denial, suspension, or revocation
  of a license. The licensee's conduct matches this description. The distractor about failing to
  keep an escrow account describes a different violation not present in the scenario.
