stem: A broker completes trust fund account reconciliations every three months. Under Arizona law,
  does this satisfy the requirement for three-way reconciliations?
options:
  - No, because reconciliations must be completed on a monthly basis
  - No, unless the broker also removes interest annually
  - Yes, as long as the broker provides an explanation for any variation
  - Yes, because quarterly meets the monthly requirement
key: A
explanation: The statute mandates that reconciliations be completed on a monthly basis. Performing
  them only every three months does not meet this requirement. The distractor claiming "Yes, as long
  as the broker provides an explanation for any variation" is incorrect because providing an
  explanation does not substitute for the required monthly frequency.
