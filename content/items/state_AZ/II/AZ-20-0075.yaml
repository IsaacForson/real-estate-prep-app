stem: A broker hires an unlicensed assistant to show properties and collect offers. Which ground for
  disciplinary action does this constitute?
options:
  - Employing an unlicensed individual to prepare marketing materials.
  - Employing an unlicensed salesperson to show properties and collect offers.
  - Employing an unlicensed assistant to perform clerical tasks in the office.
  - Employing an unlicensed person to manage the broker's personal investments.
key: B
explanation: The statute prohibits employing any unlicensed salesperson to perform acts requiring a
  license, such as showing properties and collecting offers. The distractor about clerical tasks is
  incorrect because clerical work that does not require a real estate license is not prohibited
  under this provision.
