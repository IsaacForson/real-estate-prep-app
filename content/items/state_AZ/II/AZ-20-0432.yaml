stem: A licensee receives earnest money deposits from three different buyers and records only the
  amounts received, but fails to keep records of to whom each deposit belongs or which property it
  relates to. Under Arizona law, which ground for denial, suspension, or revocation of a license
  does this constitute?
options:
  - Failure to keep an escrow or trust account for client funds
  - Failure to disclose that the property is located near a registered sex offender
  - Failure to maintain a complete record of each transaction
  - Failure to respond to a commissioner's investigation within required time
key: C
explanation: Arizona law requires licensees to maintain a complete record of each transaction that
  comes within the chapter; omitting details such as the buyer or property associated with earnest
  money deposits violates this requirement under Ariz. Rev. Stat. § 32-2153(A)(18). The other
  options describe distinct violations that are not implicated by the record‑keeping omission
  described.
