stem: Under Arizona law, what must a real estate employment agreement include regarding signatures?
options:
  - Be signed by all parties to the agreement
  - State a definite duration or expiration date
  - List material terms and broker compensation
  - Be written in clear and unambiguous language
key: A
explanation: The statute requires that all real estate employment agreements be signed by all
  parties to the agreement. This ensures mutual assent and enforceability. The other options, while
  also required by the statute, pertain to duration, material terms, and clarity of language, not
  signatures.
