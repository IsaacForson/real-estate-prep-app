stem: A licensee knowingly causes a false advertisement about a subdivision to be published. Under
  Arizona law, what is the result?
options:
  - The licensee is guilty of a class 6 felony
  - The licensee is guilty of a class 1 misdemeanor
  - The licensee may be assessed a civil penalty
  - The licensee faces no disciplinary action
key: A
explanation: The statute provides that a person who knowingly publishes a false statement concerning
  land or subdivision is guilty of a class 6 felony and, if a licensee, shall be tried before the
  commissioner for suspension or revocation of the license. Therefore, the licensee faces a class 6
  felony and possible license action. The other options describe incorrect penalties or no penalty.
