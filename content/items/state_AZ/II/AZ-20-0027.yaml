stem: Under Arizona law, what is the definition of a 'letter of concern' issued by the commissioner?
options:
  - An advisory letter to notify a licensee that the licensee must pay a prescribed fine within
    thirty days to avoid further proceedings, as stipulated by the commissioner's order, and failure
    to pay may result in additional penalties.
  - An advisory letter to notify a licensee that the commissioner has found probable cause for
    discipline based on an investigation, and that the licensee must cease the activity immediately
    pending further review.
  - An advisory letter to notify a licensee that, while the conduct does not warrant disciplinary
    action, the commissioner believes the licensee should modify or eliminate certain practices and
    that continuation may result in disciplinary action.
  - An advisory letter to notify a licensee that the licensee's license is temporarily suspended
    pending a hearing on alleged violations, while the commissioner reviews the evidence, and the
    licensee must refrain from practicing real estate during this period.
key: C
explanation: Under Ariz. Rev. Stat. § 32-2153(F)(1), a 'letter of concern' is an advisory letter
  informing a licensee that the conduct does not warrant disciplinary action but that the
  commissioner believes the licensee should modify or eliminate certain practices, as continuation
  may lead to discipline. This matches the option that states an advisory letter to notify a
  licensee that, while the conduct does not warrant disciplinary action, the commissioner believes
  the licensee should modify or eliminate certain practices and that continuation may result in
  disciplinary action. The other options describe situations involving probable cause for
  discipline, temporary suspension, or a required fine, which are not part of the definition.
citation:
