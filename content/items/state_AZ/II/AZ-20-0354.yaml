stem: A licensee is accused of violating federal fair housing law in a rental transaction. Under
  Arizona law, may the commissioner seek sanctions under this chapter for that violation?
options:
  - The commissioner may not seek sanctions unless the licensee requests a hearing.
  - The commissioner may seek sanctions only if the violation also involves subdivided lands.
  - The commissioner may not seek sanctions because the chapter excludes jurisdiction over federal
    fair housing violations.
  - The commissioner may seek sanctions because fair housing violations are covered by the chapter.
key: C
explanation: The statute provides that the commissioner lacks jurisdiction over federal fair housing
  violations and may not seek sanctions for them, making the option stating that the commissioner
  may not seek sanctions because the chapter excludes jurisdiction correct. The option that
  conditions sanctions on a hearing request is incorrect because the statute does not impose such a
  condition. The option that limits sanctions to violations involving subdivided lands is incorrect
  because the statute does not restrict jurisdiction in that way. The option asserting that the
  chapter covers fair housing violations is incorrect because the statute expressly excludes such
  violations from the commissioner's jurisdiction.
