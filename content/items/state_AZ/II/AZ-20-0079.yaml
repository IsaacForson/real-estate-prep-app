stem: According to Arizona Revised Statutes § 32-2153(F)(2), what is a 'provisional license'?
options:
  - A license that the department issues and that allows a licensee to practice subject to either a
    consent order as prescribed in section 32-2153.01 or the commissioner's terms, conditions and
    restrictions
  - A license that the department issues and that allows a licensee to practice only after
    completing additional continuing education requirements, which is a condition not specified in
    the provisional license statute and therefore incorrect
  - A license that the department issues and that permits the licensee to engage in real estate
    activities without any supervision from the employing broker, even though the employing broker
    remains responsible for ensuring compliance with all licensing laws and regulations
  - A license that the department issues and that authorizes the licensee to act as a broker for a
    limited period of ninety days, and it does not permit the licensee to engage in sales or
    property management activities during that period
key: A
explanation: The statute defines a provisional license exactly as the department-issued license that
  permits practice subject to a consent order or the commissioner's terms, conditions and
  restrictions. The option about additional continuing education adds a requirement not found in the
  definition.
