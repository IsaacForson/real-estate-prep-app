stem: A licensee issues a prospectus for a subdivision that contains a statement regarding the
  availability of water. The licensee knew the statement was false but issued the prospectus anyway.
  Under Arizona law, what is the classification of this offense for the licensee?
options:
  - A class 6 felony
  - A class 4 felony
  - A class 1 misdemeanor
  - A class 3 misdemeanor
key: A
explanation: Ariz. Rev. Stat. § 32-2161(A) provides that a person who knowingly authorizes or
  directs a false statement or representation concerning land or a subdivision, or who issues a
  publication knowing it contains a false or fraudulent statement, is guilty of a class 6 felony.
  The licensee's knowledge of the falsity triggers this specific classification.
