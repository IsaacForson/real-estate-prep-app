stem: A licensee receives notice of a disciplinary hearing scheduled for July 10. The licensee
  submits a voluntary surrender of the license on June 28. Under Arizona law, is the surrender
  effective?
options:
  - Yes, because the surrender meets the ten‑day requirement
  - No, because the commissioner must first issue a summary suspension
  - No, because surrender must occur exactly ten days prior to the hearing
  - Yes, only if the licensee submits a written request for early surrender
key: A
explanation: The surrender on June 28 is twelve days before the July 10 hearing, satisfying the “not
  less than ten days” condition, making the surrender effective. The distractor “No, because
  surrender must occur exactly ten days prior to the hearing” is wrong because the rule requires at
  least ten days, not exactly ten.
