stem: Under Arizona law, what is the limitation on the commissioner's authority regarding
  landlord-tenant disputes and fair housing violations?
options:
  - The commissioner may not seek sanctions under this chapter for landlord-tenant disputes or
    federal or state fair housing violations
  - The commissioner may seek sanctions for both landlord-tenant disputes and federal or state fair
    housing violations only with a court order
  - The commissioner may seek sanctions for landlord-tenant disputes but not for federal or state
    fair housing violations
  - The commissioner may seek sanctions for landlord-tenant disputes if the violation occurs in
    Maricopa County
key: A
explanation: Subsection C of Ariz. Rev. Stat. § 32-2160 explicitly states that nothing in subsection
  B gives the department jurisdiction over landlord‑tenant or federal or state fair housing
  violations, nor authorizes the commissioner to seek sanctions under this chapter for those
  matters. Therefore the commissioner lacks authority to sanction such violations under this
  chapter. The distractor that suggests the commissioner may seek sanctions for these violations
  directly contradicts the statutory prohibition.
