stem: A licensee lists a residential property that is located in the vicinity of a registered sex
  offender and does not disclose this fact to a prospective buyer. Under Arizona law, what is the
  result?
options:
  - Under Arizona law, failing to disclose that a residential property is located in the vicinity of
    a registered sex offender is grounds for rescission of the contract.
  - Under Arizona law, failing to disclose that a residential property is located in the vicinity of
    a registered sex offender is a class 6 felony.
  - Under Arizona law, failing to disclose that a residential property is located in the vicinity of
    a registered sex offender is not grounds for termination or rescission of the transaction.
  - Under Arizona law, failing to disclose that a residential property is located in the vicinity of
    a registered sex offender requires the commissioner to issue a letter of concern.
key: C
explanation: Arizona law provides that failing to disclose proximity to a registered sex offender is
  not grounds for termination or rescission of a real‑property transaction (Ariz. Rev. Stat. §
  32-2153). Therefore the statement that nondisclosure is not grounds for termination or rescission
  is correct. The claim that nondisclosure gives rescission rights is incorrect because the statute
  denies such rights. The claim that it is a felony is incorrect; the statute does not impose
  criminal penalties for this nondisclosure. The claim that the commissioner must issue a letter of
  concern is incorrect; the statute does not require that action.
