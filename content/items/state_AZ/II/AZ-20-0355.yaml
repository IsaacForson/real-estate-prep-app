stem: A licensee publishes a brochure for a subdivision that states the property has access to a
  public water line. The licensee did not verify the claim but should have known the statement was
  false based on readily available records. Under Arizona law, does the licensee's conduct satisfy
  the definition of "knowingly"?
options:
  - The licensee's conduct satisfies the definition of 'knowingly' because the definition includes
    situations where the person should have known of the falsity.
  - The licensee's conduct does not satisfy the definition of 'knowingly' because the person did not
    actually know the statement was false.
  - The licensee's conduct satisfies the definition of 'knowingly' only if the statement was made
    with intent to defraud.
  - The licensee's conduct does not satisfy the definition of 'knowingly' because the brochure was
    not distributed to the public.
key: A
explanation: Under Ariz. Rev. Stat. § 32-2161(B), the term "knowingly" includes situations where a
  person should have known of the falsity of a statement. Therefore, the licensee's conduct
  satisfies the definition because the licensee should have known the claim was false based on
  readily available records. The option stating that the conduct does not satisfy the definition
  because the person did not actually know the statement was false is incorrect, as actual knowledge
  is not required. The option stating that the conduct satisfies the definition only if the
  statement was made with intent to defraud is incorrect, as intent to defraud is not an element of
  the definition. The option stating that the conduct does not satisfy the definition because the
  brochure was not distributed to the public is incorrect, as distribution to the public is
  irrelevant to the statutory definition.
