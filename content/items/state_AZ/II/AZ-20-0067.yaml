stem: According to Arizona Revised Statutes § 32-2153(F)(1), what is a 'letter of concern'?
options:
  - An advisory letter that formally notifies the licensee of an impending license suspension or
    revocation.
  - An advisory letter that advises the licensee to modify or eliminate certain practices to avoid
    possible disciplinary action.
  - An advisory letter that requires the licensee to pay a civil penalty within thirty days.
  - An advisory letter that directs the licensee to complete additional continuing education hours.
key: B
explanation: The statute defines a letter of concern as an advisory letter that notifies a licensee
  to modify or eliminate certain practices to avoid possible disciplinary action, not as a notice of
  impending suspension. The distractor about impending suspension is incorrect because a letter of
  concern is advisory and does not indicate imminent disciplinary action.
citation:
  source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166 — ARS Title 32, Ch. 20, Art. 3 - Regulation — §
    32-2153(F)(1)
  url: null
  quoted_text: "'Letter of concern' means an advisory letter to notify a licensee that, while the
    conduct or evidence does not warrant disciplinary action, the commissioner believes that the
    licensee should modify or eliminate certain practices and that continuation of the activities
    may result in disciplinary action against the licensee."
