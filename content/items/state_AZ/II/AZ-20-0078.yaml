stem: Two licensees disagree about how to split a commission from a transaction; one licensee files
  a complaint with the Arizona Real Estate Commissioner alleging the other failed to pay the agreed
  split. Under Arizona law, what is the commissioner's likely action?
options:
  - Entertain the complaint and schedule a hearing to consider disciplinary action
  - Dismiss the complaint because it involves a purely civil dispute between licensees
  - Refer the matter to the county attorney for criminal prosecution under Arizona law
  - Issue a consent order to resolve the dispute between the parties
key: B
explanation: The statute explicitly states that the commissioner shall not entertain complaints
  regarding purely civil disputes between licensees concerning the earning, splitting, or nonpayment
  of compensation. Therefore, the commissioner will dismiss the complaint. The other options
  describe actions the commissioner is not authorized to take in this situation.
