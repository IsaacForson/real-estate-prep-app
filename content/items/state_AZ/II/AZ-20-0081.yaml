stem: A licensee places a 'For Sale' sign on a residential property without obtaining the written
  authority of the property owner or the owner's authorized agent. Which ground for denial,
  suspension, or revocation of a license does this conduct constitute under Arizona Revised Statutes
  § 32-2153?
options:
  - Placed a sign on any property offering it for sale or for rent without the written authority of
    the owner or the owner's authorized agent
  - Placed a sign on any property offering it for sale or for rent after obtaining verbal authority
    from the owner
  - Placed a sign on any property offering it for sale or for rent after obtaining written authority
    from a neighbor
  - Placed a sign on any property offering it for sale or for rent with the written authority of the
    owner but failed to include the broker's contact information
key: A
explanation: The statute grounds disciplinary action when a licensee places a sign offering property
  for sale or rent without the written authority of the owner or the owner's authorized agent. The
  option relying on verbal authority is incorrect because the statute mandates written authority.
