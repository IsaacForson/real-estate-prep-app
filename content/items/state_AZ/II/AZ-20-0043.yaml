stem: A broker sells a cemetery lot with a promise that the buyer can resell it at a profit. What is
  the effect of the conveyance under Arizona law?
options:
  - The conveyance is valid but the broker may be fined
  - The conveyance is void and unenforceable
  - The conveyance is valid unless the buyer objects
  - The conveyance is valid but subject to a fine
key: B
explanation: The statute declares it unlawful to sell cemetery property under a promise of resale at
  profit and states that the conveyance of cemetery property pursuant to such a sale is void. Thus
  the conveyance is void and unenforceable. The other options incorrectly suggest validity or fines
  only.
