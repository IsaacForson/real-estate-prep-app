stem: A broker receives a $5,000 earnest money check from a buyer for a residential purchase. The
  buyer and seller have not agreed in writing to use an out-of-state depository. Under Arizona law,
  what must the broker do with the check upon receipt?
options:
  - Place the check in the broker's personal checking account
  - Place the check in a trust account at a federally insured Arizona bank
  - Place the check in an out-of-state escrow account without written agreement
  - Place the check in the broker's office safe until closing
key: B
explanation: Under Arizona law, unless the parties agree in writing to use an out-of-state
  depository, a broker must place earnest money received in a trust account at a federally insured
  Arizona bank upon receipt. Placing the check in the broker's personal checking account commingles
  funds with personal money, which is prohibited. Placing the check in an out-of-state escrow
  account without a written agreement violates the requirement to keep the money in-state unless
  agreed in writing. Keeping the check in the office safe does not satisfy the trust account
  requirement.
citation:
  source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166 — ARS Title 32, Ch. 20, Art. 3 - Regulation — §
    32-2151.02 § 32-2151(A)
  url: null
  quoted_text: Unless otherwise provided in writing by all parties to a transaction, any licensed real
    estate broker who does not immediately place all monies entrusted to the broker, in the broker's
    capacity as a real estate broker, in a neutral escrow depository in this state shall on receipt
    place all such monies in a trust fund account in a federally insured or guaranteed account in a
    depository located in this state.
