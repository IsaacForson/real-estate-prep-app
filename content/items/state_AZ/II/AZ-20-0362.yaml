stem: Under Arizona law, to which court may a final decision of the real estate commissioner be appealed?
options:
  - The superior court in the county of the violation
  - The federal district court for Arizona
  - The superior court in Maricopa county
  - The Arizona Court of Appeals for the state
key: C
explanation: Ariz. Rev. Stat. § 32‑2159(A) states that a final decision of the commissioner may be
  appealed to the superior court in Maricopa County. The other courts listed are not authorized to
  hear such appeals under this provision.
