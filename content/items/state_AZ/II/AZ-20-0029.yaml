stem: "The commissioner receives information that an unlicensed individual is advertising
  residential properties for sale on social media, soliciting prospects. Under Arizona law, the
  commissioner may:"
options:
  - The commissioner may impose a civil penalty but cannot order the individual to cease advertising.
  - The commissioner must first obtain a court injunction before taking any action.
  - The commissioner may issue a cease and desist order directing the individual to stop the
    advertising.
  - The commissioner may only issue a letter of concern because the individual is unlicensed.
key: C
explanation: Under Ariz. Rev. Stat. § 32-2154(A), the commissioner may issue an order directing any
  person to cease and desist from engaging in a violation of the chapter, including advertising real
  estate for sale without a license. Therefore, the commissioner may issue a cease and desist order
  directing the individual to stop the advertising. The alternative that would require a court
  injunction before any action is incorrect because the statute does not mandate prior judicial
  approval. The alternative that limits the commissioner to issuing only a letter of concern is
  incorrect because the statute provides broader enforcement powers, including cease and desist
  orders. The alternative that allows a civil penalty but prohibits ordering cessation is incorrect
  because the statute expressly authorizes the commissioner to order cessation as part of the cease
  and desist power.
citation:
