  url: null
  quoted_text: If it appears to the commissioner that any person has engaged, is engaging or is
    preparing to engage in any act, practice or transaction that constitutes a violation of this
    chapter or any rule adopted or order issued by the commissioner, the commissioner may issue an
    order directing any person to cease and desist from engaging in the act, practice or transaction
    or doing any act in furtherance of the act, practice or transaction, to make restitution or to
    take appropriate affirmative action, within a reasonable period of time as prescribed by the
    commissioner, to correct the conditions resulting from the act, practice or transaction.
