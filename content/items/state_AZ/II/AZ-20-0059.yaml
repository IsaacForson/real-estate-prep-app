stem: A licensee sells a cemetery lot to a buyer. The licensee promises the buyer that the cemetery
  property may be resold at a profit. Under Arizona law, what is the legal status of the conveyance
  of the cemetery property?
options:
  - The conveyance is valid
  - The conveyance is void
  - The conveyance is voidable
  - The conveyance is unenforceable
key: B
explanation: Under Ariz. Rev. Stat. § 32-2162, a licensee who promises a buyer that cemetery
  property may be resold at a profit makes the conveyance void.
citation:
  source: Ariz. Rev. Stat. § 32-2162
  url: null
  quoted_text: The conveyance of cemetery property pursuant to a sale in violation of this section is void.
