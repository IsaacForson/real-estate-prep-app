stem: Under Arizona law, how many days after service of a notice of hearing must a respondent file a
  written answer to the complaint?
options:
  - Twenty days
  - Five days
  - Ten days
  - Thirty days
key: A
explanation: The rule states that 'Within twenty days after service of a notice of hearing, the
  respondent shall appear by filing a written answer to the complaint.' Therefore, twenty days is
  the required period. The distractor of ten days is incorrect because that period applies to
  voluntary surrender of a license, not to filing an answer.
