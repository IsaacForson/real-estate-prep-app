stem: A process server delivers a subpoena issued by the Arizona Real Estate Commissioner. What is
  the maximum compensation the server may receive under Arizona law?
options:
  - The actual cost incurred by the server in service
  - The fees set by the commissioner for that service
  - The fees prescribed by law for similar service
  - Double the usual court fees for similar service
key: C
explanation: The law provides that the person serving process shall receive compensation allowed by
  the commissioner, not to exceed the fees prescribed by law for similar service. Thus the upper
  limit is the statutory fee for comparable service, not the commissioner's discretion or actual
  costs.
