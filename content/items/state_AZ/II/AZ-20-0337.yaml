stem: Under Arizona law, what must a licensee do with monies deposited by a client in connection
  with a real estate transaction?
options:
  - Invest them in a money‑market fund and remit interest to the client
  - Deposit them into the licensee's personal checking account
  - Keep them in an escrow or trust account or maintain a record of the deposit
  - Hold them in a non‑interest‑bearing account for no more than 30 days
key: C
explanation: Arizona Revised Statutes § 32-2153 requires licensees to keep client funds in an escrow
  or trust account or maintain a record of the deposit.
