stem: A broker deposits a buyer's $2,000 earnest money check into the broker's personal checking
  account to cover office expenses. Under Arizona law, which violation does this constitute?
options:
  - Failing to identify monies as nonowner tenant monies in descriptive receipts
  - Failing to remove any interest that is earned on a trust fund account at least once every twelve
    months
  - Allowing advance payment of monies belonging to others to be deposited in the broker's personal
    account
  - Failing to maintain separate ledgers for each property transaction
key: C
explanation: The statute prohibits depositing advance payments that belong to others into a broker's
  personal account. Ariz. Rev. Stat. § 32-2151(C)(2) defines this as a violation. The broker’s
  action of placing the $2,000 earnest money check into a personal account to cover office expenses
  commingles client funds with personal funds, which is not allowed. The other options describe
  different trust‑fund requirements that are not violated by this conduct.
