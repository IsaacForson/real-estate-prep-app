stem: An appellant in a real estate commissioner appeal is declared indigent by the superior court.
  Who pays for the reporter's transcript of the administrative hearing under Arizona law?
options:
  - The party requesting the transcript
  - The opposing party in the appeal
  - The Arizona Real Estate Department
  - The clerk of the superior court
key: C
explanation: If the superior court declares an appealing party indigent, the department shall pay
  the costs of the reporter's transcript of proceedings and shall produce a certified copy of all
  documents and evidence in the administrative record at no charge. Hence the department covers the
  transcript cost.
