stem: A licensee deposits a client's earnest money into the trust account, then writes a check from
  the trust account to pay the licensee's personal office rent without obtaining the client's
  written consent. Under Arizona law, which ground for denial, suspension, or revocation of a
  license does this constitute?
options:
  - Failure to keep client trust funds separate and use them for personal expenses
  - Failure to keep an escrow or trust account for client funds
  - Failure to disclose that the property is located near a registered sex offender
  - Failure to respond to a commissioner's investigation within the required time
key: A
explanation: The licensee converted client trust monies to personal use by paying office rent from
  the trust account without client consent, which constitutes commingling or conversion of client
  funds under Ariz. Rev. Stat. § 32-2153(A)(16). Failing to keep a separate escrow or trust account
  for client funds would apply if no trust account were used at all, which is not the case here.
