stem: A licensee wishes to show a property to a prospective buyer but has not received any
  permission from the owner. What must the licensee do?
options:
  - The licensee must assume verbal permission from the owner is sufficient
  - The licensee must notify the broker after showing the property to prospects
  - The licensee must rely on the buyer's agent to authorize access
  - The licensee must obtain prior written authorization from the owner before permitting access
key: D
explanation: Subsection J.1 prohibits permitting access to real property without prior written
  authorization from the owner. Verbal permission or reliance on others does not meet this
  requirement.
