stem: A licensee learns from a neighbor that the property is located in a flood zone and tells the
  buyer this information without verifying it. According to A.A.C. R4-28-1101.I, what must the
  licensee do?
options:
  - Ignore the information and advise the buyer to seek an independent verification
  - Take reasonable steps to assist the buyer in verifying the flood zone information
  - Guarantee the flood zone information is accurate before sharing it with the buyer
  - Disclose the neighbor as the source and advise the buyer to verify the information
key: B
explanation: The rule requires the licensee to take reasonable steps to assist the client in
  confirming the accuracy of information relevant to the transaction. Guaranteeing accuracy imposes
  a higher standard than the rule demands.
