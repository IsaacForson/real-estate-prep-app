stem: According to A.A.C. R4-28-1101.A, what duty does a licensee owe to the client?
options:
  - A duty to protect and promote the client’s interests
  - A duty to deal fairly with all other parties
  - A duty to expeditiously perform required acts
  - A duty to avoid controversies that jeopardize transactions
key: A
explanation: Subsection A states that a licensee owes a fiduciary duty to the client and shall
  protect and promote the client’s interests. The other options describe additional duties but do
  not define the fiduciary duty itself.
