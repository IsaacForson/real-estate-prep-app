stem: A subdivider issues a public report on February 10, 2009 for property located in a military
  electronics range. The military electronics range map was filed on January 1, 2009. According to
  A.R.S. § 32-2183.05(F) and (G), is the public report required to include the military electronics
  range disclosure statements?
options:
  - The public report must include the military electronics range disclosure statements because it
    was issued after the military electronics range map was filed with the state land department.
  - The public report must be amended to include the military electronics range disclosure
    statements within ten business days of issuance.
  - The public report is not required to include the military electronics range disclosure
    statements because it was issued fewer than sixty-one days after the map was filed.
  - The public report is exempt from the military electronics range disclosure requirements under
    subsection E of this section.
key: C
explanation: Subsection G provides that a public report issued sixty‑one or more days after the
  filing of the military electronics range map must meet the disclosure requirements of subsection
  A. Because the report was issued only forty days after the map was filed, it falls short of that
  threshold and is not required to include the statements. The option stating that the report must
  include the statements because it was issued after the map was filed incorrectly assumes any
  post‑filing issuance triggers the requirement.
citation:
