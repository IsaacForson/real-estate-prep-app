stem: "A licensee commits two separate violations of the Arizona real estate statutes: (1) failing
  to deposit earnest money into a trust account, and (2) publishing an advertisement that contains a
  false statement about the property. Assuming the commissioner finds both violations proven after a
  hearing, what is the maximum total civil penalty that may be assessed?"
options:
  - $1,000
  - $500
  - $2,000
  - $1,500
key: C
explanation: Under § 32-2160.01, the commissioner may assess a civil penalty not exceeding one
  thousand dollars for each infraction after a hearing. Two proven infractions therefore allow a
  maximum of $1,000 × 2 = $2,000. The $1,000 distractor applies the per‑infraction limit to the
  total, while $500 and $1,500 reflect incorrect arithmetic or misapplication of the limit.
