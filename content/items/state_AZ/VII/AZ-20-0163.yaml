stem: A public report for a subdivision located under restricted air space was issued on December
  15, 2006. According to Ariz. Rev. Stat. § 32-2183.06.D, is the subdivider required to amend or
  reissue the report to include the restricted air space disclosure statements before selling lots
  in 2008?
options:
  - No amendment is required because the report was issued before December 31, 2006
  - An amendment is required to add all three disclosure statements from subsection A
  - Only the statement about the property being under restricted air space must be added
  - The report must be reissued only if a lot is sold after 2010 and the buyer requests it
key: A
explanation: Subsection D explicitly states that this section does not require the amendment or
  reissuance of any public report issued on or before December 31, 2006. Since the report was issued
  on December 15, 2006, no amendment is needed to add the restricted air space disclosure statements
  before selling lots in 2008. The other options incorrectly impose an amendment requirement or
  limit it to specific statements or conditions.
citation:
  source: Ariz. Rev. Stat. §§ 32-2181 to 32-2185.09 — ARS Title 32, Ch. 20, Art. 4 - Sale of
