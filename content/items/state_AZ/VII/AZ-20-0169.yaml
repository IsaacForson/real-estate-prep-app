stem: A subdivider issued a public report on November 1, 2004 for property located under a military
  training route. Is the subdivider required to amend or reissue the report to include the military
  training route disclosure statements before selling lots in 2006?
options:
  - The subdivider must obtain a new public report from the commissioner before any sales can occur.
  - The subdivider is not required to amend or reissue the public report because it was issued on or
    before December 31, 2004.
  - The subdivider must still include the military training route disclosure statements in any
    reservation document or conditional sales contract.
  - The subdivider must amend or reissue the public report to include the military training route
    disclosure statements before selling any lots.
key: B
explanation: Under A.R.S. § 32-2183.05(D), a public report issued on or before December 31, 2004 for
  property under a military training route does not need to be amended or reissued to include the
  military training route disclosure statements. Since the report was issued November 1, 2004, the
  subdivider is not required to amend or reissue it before selling lots in 2006. The claim that a
  new public report must be obtained before any sales can occur is incorrect because the statute
  provides this exemption.
citation:
  source: Ariz. Rev. Stat. §§ 32-2181 to 32-2185.09 — ARS Title 32, Ch. 20, Art. 4 - Sale of
    Subdivided Lands — § 32-2183.05(D)
  url: null
  quoted_text: This section does not require the amendment or reissuance of any public report issued
    on or before December 31, 2004 that is applicable to property located under a military training
    route, as delineated in the military training route map prepared by the state land department
    pursuant to section 37-102
