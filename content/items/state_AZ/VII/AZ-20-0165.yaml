stem: Under A.R.S. § 32-2153.A.22, what constitutes grounds for denial, suspension or revocation of
  a license?
options:
  - Demonstrated negligence in performing any act for which a license is required
  - Accepted compensation from a person not authorized to provide compensation pursuant to section
    32-2155
  - Failed to keep an escrow or trust account of monies deposited relating to a real estate
    transaction
  - Placed a sign on property offering it for sale without written authority of the owner
key: A
explanation: Subsection A.22 explicitly lists demonstrated negligence as a ground for disciplinary
  action. The other options describe violations covered by other subsections (A.7, A.15, A.12) but
  are not the specific negligence ground.
