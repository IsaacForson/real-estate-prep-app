stem: A licensee fails to maintain any escrow or trust account for earnest money received from
  clients. Under A.R.S. § 32-2153.A.15, which of the following actions is **NOT** authorized for the
  commissioner to take?
options:
  - Suspend or revoke the licensee's license
  - Require continuing education for the licensee
  - Deny renewal of the licensee's license
  - Issue a letter of concern to the licensee
key: B
explanation: Subsection A.15 authorizes the commissioner to issue a letter of concern, suspend or
  revoke the license, or deny renewal for failure to keep an escrow or trust account. Requiring
  continuing education is not listed as an authorized action in that subsection.
