stem: According to Arizona law, what does the term "incompetence" mean for the purpose of
  disciplinary proceedings against a licensee?
options:
  - It means failing to pay the renewal fee as specified in this chapter promptly and before the
    time specified, resulting in disciplinary action and may lead to suspension or revocation of the
    license.
  - It means a lack of basic knowledge or skill appropriate to the type of license the person holds
    or a failure to appreciate the probable consequences of the licensee's action or inaction.
  - It means having been convicted of a felony or any crime of forgery, theft, extortion, conspiracy
    to defraud, or a crime of moral turpitude that constitutes fraud or dishonest dealings.
  - It means employing any unlicensed salesperson or unlicensed associate broker, which is
    prohibited under the statute and may result in disciplinary proceedings against the broker who
    employs them.
key: B
explanation: Ariz. Rev. Stat. § 32‑2153(B)(7) defines incompetence as a lack of basic knowledge or
  skill appropriate to the license type or a failure to appreciate the probable consequences of the
  licensee’s actions or inactions. A description of a felony conviction or other crimes is a
  separate disciplinary ground under § 32‑2153(B)(2) and does not define incompetence.
