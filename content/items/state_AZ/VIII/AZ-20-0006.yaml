stem: A broker wants to sue a former client for unpaid commission on a completed sale. What must the
  broker's complaint allege to commence the action?
options:
  - That the commissioner reviewed and approved the underlying listing agreement.
  - That the department had previously mediated and fully closed out this compensation dispute.
  - That the client agreed in writing to waive any statute of limitations defense.
  - That the broker was a qualified licensed broker or salesperson when the claim arose.
key: D
explanation: To commence an action for collection of compensation, the complaint must allege that
  the plaintiff was a qualified licensed broker or salesperson at the time the claim arose, and the
  court requires proof of that qualification.
citation:
  source: Ariz. Rev. Stat. § 32-2152
  url: null
  quoted_text: An action for the collection of compensation earned may be maintained in the courts of
    the state by any broker or salesperson. To commence the action the complaint shall allege that
    the plaintiff was a qualified licensed broker or salesperson at the time the claim arose.
