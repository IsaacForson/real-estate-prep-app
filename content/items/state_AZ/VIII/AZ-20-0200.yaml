stem: A broker authorizes a licensed salesperson employed by the broker to withdraw earnest money
  from the trust account to refund a buyer. Is this permitted under Arizona statute § 32-2151.01(B)?
options:
  - Not permitted because the refund must go through escrow
  - Permitted only if the broker provides prior written notice
  - Not permitted because only the broker may withdraw trust funds
  - Permitted because the salesperson is a licensee under the broker's license
key: D
explanation: The rule allows a broker to grant withdrawal authority only to a person who is a
  licensee under that broker's license; a licensed salesperson qualifies. The distractor claiming
  only the broker may withdraw funds ignores the explicit exception for licensees.
citation:
