stem: Under Arizona's trust fund statute, where must a broker place transaction monies **NOT**
  deposited in a neutral escrow?
options:
  - The broker's personal operating account used until closing documents are fully signed.
  - Any out-of-state bank account chosen solely at the broker's own personal discretion.
  - A trust fund account in a federally insured depository in this state.
  - A safe deposit box maintained at the broker's own licensed branch office.
key: C
explanation: Unless the parties agree otherwise in writing, a broker who does not immediately place
  transaction monies in a neutral escrow must place them in a trust fund account in a federally
  insured account located in this state.
citation:
  source: Ariz. Rev. Stat. § 32-2151
  url: null
  quoted_text: Unless otherwise provided in writing by all parties to a transaction, any licensed real
    estate broker who does not immediately place all monies entrusted to the broker, in the broker's
    capacity as a real estate broker, in a neutral escrow depository in this state shall on receipt
    place all such monies in a trust fund account in a federally insured or guaranteed account in a
    depository located in this state.
