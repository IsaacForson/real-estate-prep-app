stem: A licensee wants to represent both the buyer and the seller in the same sale and be paid by
  both. What must the licensee obtain beforehand?
options:
  - A waiver filed with the department at the close of escrow.
  - The prior written consent of all parties to the transaction.
  - A letter of concern issued in advance by the real estate commissioner.
  - An oral understanding with each party that dual representation is fine.
key: B
explanation: A licensee may not accept compensation from or represent more than one party to a
  transaction without first obtaining the prior written consent of all parties involved.
