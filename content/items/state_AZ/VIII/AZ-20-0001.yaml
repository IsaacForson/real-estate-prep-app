stem: Under Arizona's real estate employment agreement statute, what must every such agreement contain?
options:
  - A minimum commission percentage that is guaranteed to the broker regardless of outcome.
  - A notarized acknowledgment signed personally by a title insurance agent.
  - A definite duration or expiration date showing the dates of inception and expiration.
  - An automatic renewal clause that extends the agreement at the end of each license period.
key: C
explanation: Arizona law requires every real estate employment agreement to have a definite duration
  or expiration date that shows both the dates of inception and expiration, rather than leaving the
  term open-ended.
