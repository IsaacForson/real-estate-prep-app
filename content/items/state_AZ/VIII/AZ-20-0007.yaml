stem: During an active listing agreement, a licensee receives a purchase offer on the property. What
  must the licensee do with that offer?
options:
  - Promptly submit the offer to the client for the client's own decision.
  - Hold the offer until a full-price offer is later received from another buyer.
  - Reject the offer without forwarding it if the price seems too low to consider.
  - Negotiate the offer directly with the buyer before informing the client.
key: A
explanation: During the term of a listing agreement, a licensee must promptly submit to the client
  all offers received to purchase or lease the listed property, rather than screening or withholding
  them.
