stem: A broker receives a promissory note as earnest money from a buyer. According to Arizona
  statute § 32-2151.01(C), what must the broker do?
options:
  - Obtain the buyer's written consent to accept the note
  - Return the promissory note to the buyer within 24 hours
  - State the type of earnest money in the contract or receipt
  - Deposit the promissory note into an escrow account
key: C
explanation: The statute requires the broker to specify in the contract or receipt what type of
  earnest money was received, whether cash, check, promissory note, or other value. Simply
  depositing the note into escrow does not satisfy this disclosure requirement.
citation:
  source: Ariz. Rev. Stat. § 32-2151.01(C)
  url: null
  quoted_text: A broker shall specifically state in the real estate purchase contract, lease agreement
    or receipt for earnest money the type of earnest money received in any real estate transaction,
    whether it is cash, a check, a promissory note or any other item of value.
