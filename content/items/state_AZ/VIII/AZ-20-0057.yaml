stem: A broker receives a deposit of earnest money from a buyer and prepares a deposit slip. What
  information must the broker include on the deposit slip or accompanying documentation?
options:
  - The broker must identify each transaction, the date and amount of the deposit, and the names of
    the parties involved in the transaction.
  - The broker must calculate and remit any interest earned on the deposit to the state treasury
    monthly.
  - The broker must obtain written consent from the buyer and seller before depositing the money
    into any account.
  - The broker must deposit the money into a neutral escrow depository within three business days.
key: A
explanation: Under 32-2151 B.1, the broker must make deposits to trust fund accounts by deposit
  slips, and receipts or other documentation must identify each transaction, the date and amount of
  each deposit, and the names of parties involved in the transaction represented by the deposit. The
  broker is not required to calculate and remit any interest earned on the deposit to the state
  treasury monthly.
