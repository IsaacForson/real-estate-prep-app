stem: According to Arizona Revised Statute 32-2153.01, what must a consent order include?
options:
  - Terms that the parties agree on and that the commissioner believes are appropriate
  - Terms that the commissioner deems necessary for public protection
  - Terms that the parties agree on, regardless of commissioner approval
  - Terms that are required by statute for all consent orders
key: A
explanation: The statute requires that a consent order include terms that the parties agree on and
  that the commissioner believes are appropriate. The option stating that the commissioner
  unilaterally sets necessary terms for public protection is incorrect because the order must
  reflect the parties' agreement.
citation:
  source: "### Ariz. Rev. Stat. §§ 32-2151 to 32-2166 — ARS Title 32, Ch. 20, Art. 3 - Regulation — §
    32-2153.01 32-2153.01 - Consent order; terms"
  url: null
  quoted_text: The order shall include terms that the parties agree on and that the commissioner, in
    the commissioner's discretion, believes are appropriate.
