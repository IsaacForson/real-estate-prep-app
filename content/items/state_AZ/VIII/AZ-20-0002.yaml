stem: An employing broker wants to assign a client's real estate employment agreement to a different
  broker. What must the broker obtain first?
options:
  - The commissioner's prior written approval of the reassignment.
  - A new employment agreement signed only by the receiving broker.
  - A verbal confirmation from the client that reassignment is acceptable.
  - The express written consent of all parties to the agreement.
key: D
explanation: Arizona law prohibits an employing broker from assigning a real estate employment
  agreement to another broker without the express written consent of all parties to the agreement at
  the time of the assignment.
citation:
  source: Ariz. Rev. Stat. § 32-2151.02
  url: null
  quoted_text: An employing broker shall not assign a real estate employment agreement to another
    broker without the express written consent of all parties to the agreement at the time of the
    assignment.
