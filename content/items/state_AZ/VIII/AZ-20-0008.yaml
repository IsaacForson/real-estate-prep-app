stem: A development contract calls for an earnest money deposit before closing. What must that
  contract specify about the deposit?
options:
  - The purchaser's home address and preferred method of future contact.
  - The name of the title company, broker's trust account, or other depository.
  - The developer's projected completion date for common area amenities.
  - The commissioner's case number assigned to the underlying subdivision filing.
key: B
explanation: The contract must indicate where the earnest money or down payment will be deposited,
  including the name of the title company, the name of the broker's trust account, or another
  depository.
citation:
  source: Ariz. Admin. Code Rule R4-28-803
  url: null
  quoted_text: The contract shall indicate where the earnest money or down payment, if any, will be
    deposited and shall include the name of the title company, the name of the broker’s trust
    account, or other depository.
