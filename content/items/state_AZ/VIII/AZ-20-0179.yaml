stem: A licensee wants to have a seller sign a new real estate employment agreement, but the seller
  already has an exclusive agreement with another broker. What must the licensee obtain before
  proceeding?
options:
  - Written acknowledgment from the seller that signing another employment agreement could expose
    the seller to liability for substantial additional commissions.
  - Written consent from the seller's current broker to terminate the existing exclusive employment
    agreement.
  - A signed disclosure stating that the licensee's commission will be higher than the current
    broker's offered commission.
  - An email confirmation that the seller understands the new agreement will replace the current
    exclusive agreement.
key: A
explanation: The statute requires written acknowledgment from the party that additional agreements
  could expose them to liability for substantial additional commissions before procuring another
  agreement. Consent from the current broker is not mandated by this provision.
citation:
  source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166 — ARS Title 32, Ch. 20, Art. 3 - Regulation — §
    32-2151.02(C)
  url: null
  quoted_text: A licensee shall not procure, or attempt to procure, a real estate employment agreement
    from a party who is already subject to an existing exclusive real estate employment agreement
    unless the licensee has received written acknowledgment from the party that the execution of
    additional real estate employment agreements could expose the party to liability for substantial
    additional commissions.
