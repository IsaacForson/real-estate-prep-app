stem: Under Arizona Administrative Code R4-28-1101, what duty does a licensee owe to a client?
options:
  - A fiduciary duty that protects and promotes the client's interests.
  - A duty to disclose facts only when the client specifically asks for them.
  - A duty to represent the client exclusively for a full calendar year.
  - A duty to guarantee the highest achievable sale price for the property.
key: A
explanation: The rule states that a licensee owes a fiduciary duty to the client and must protect
  and promote the client's interests, while also dealing fairly with other parties to the
  transaction.
