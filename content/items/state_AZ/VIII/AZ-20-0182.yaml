stem: A salesperson files a complaint with the commissioner alleging that another salesperson failed
  to split commission as agreed. According to Arizona statute, how will the commissioner likely
  respond?
options:
  - The commissioner will dismiss the complaint because it concerns a civil dispute over commission
    splitting
  - The commissioner will refer the complaint to the superior court for a civil lawsuit
  - The commissioner will investigate the complaint and possibly discipline the licensee for
    unethical conduct
  - The commissioner will require the parties to attend mediation before any further action
key: A
explanation: Under Arizona Revised Statutes § 32-2152, the commissioner may not entertain complaints
  that are purely civil disputes between licensees about earning, splitting, or nonpayment of
  compensation. Therefore, the commissioner will dismiss a complaint that alleges another
  salesperson failed to split commission as agreed, because it is a civil matter rather than a
  licensing violation.
