stem: Under Arizona law, which statement is correct regarding a licensee's duty to disclose certain
  property conditions?
options:
  - Regarding disclosure, a licensee is not required to reveal a natural death, HIV status, or
    proximity to a sex offender.
  - Regarding disclosure, a licensee must reveal if the property is located in the vicinity of a
    registered sex offender.
  - Regarding disclosure, a licensee must reveal if the property was previously owned by someone
    diagnosed with HIV.
  - Regarding disclosure, a licensee must reveal if the property was the site of a natural death.
key: A
explanation: The statute provides that no criminal, civil, or administrative action may be brought
  against a licensee for failing to disclose a natural death, HIV status, or proximity to a sex
  offender. Consequently, a licensee is not required to reveal those facts. The statements that a
  licensee must disclose proximity to a sex offender, a natural death, or HIV status are incorrect.
