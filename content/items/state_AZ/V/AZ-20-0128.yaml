stem: A licensee commits two separate violations of Ariz. Rev. Stat. § 32-2160.01 by making false
  statements about two different properties. What is the maximum total civil penalty the
  commissioner may assess?
options:
  - $500
  - $1,000
  - $1,500
  - $2,000
key: D
explanation: The statute allows a civil penalty of up to $1,000 for each infraction. For two
  infractions, the maximum total is $2,000. The $2,000 answer reflects this calculation. The $1,500
  answer would be correct for only a single infraction.
citation:
  source: Ariz. Rev. Stat. § 32-2160.01(A)
  url: null
  quoted_text: Any licensee who is subject to the jurisdiction of the department and who has violated
    any provision of this chapter or any rule or order adopted or issued by the commissioner, who
    has deviated substantially from the provisions of a public report or who has engaged in any
    unlawful practices defined in section 44-1522 with respect to the sale or lease of either
    subdivided lands or unsubdivided lands may be assessed a civil penalty by the commissioner,
    after a hearing, in an amount not to exceed one thousand dollars for each infraction.
  secondary: []
math:
  worked_solution: 1,000 dollars per infraction × 2 infractions = 2,000 dollars
  formulas:
    - Total penalty = penalty per infraction × number of infractions
