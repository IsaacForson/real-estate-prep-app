stem: Under Arizona administrative rule, what must a licensee disclose in writing to all other
  parties in a real estate transaction?
options:
  - Any known adverse material fact concerning the property
  - Only defects the seller requests to disclose
  - Only information about the buyer's financing ability
  - Only information about liens if the buyer asks
key: A
explanation: The rule requires licensees to disclose any known adverse material fact about the
  property in writing to all parties. The other options limit disclosure to seller requests, buyer
  financing, or buyer‑asked liens, which are not required by the rule.
