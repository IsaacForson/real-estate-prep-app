stem: A licensee directs a colleague to publish a letter stating that a membership camping contract
  includes amenities that it does not. Under Ariz. Under Ariz. Rev. Stat. § 32-2161(A), what is the
  likely outcome for the licensee?
options:
  - The licensee is guilty of a class 6 felony and may lose license
  - The licensee is guilty of a class 1 misdemeanor and may be fined up to $2,500
  - The licensee is liable for a civil penalty not exceeding $1,000 per violation
  - The licensee is not subject to any criminal or administrative penalty
key: A
explanation: Under Ariz. Rev. Stat. § 32-2161(A), a person who knowingly authorizes or directs any
  false statement concerning a membership camping contract is guilty of a class 6 felony. If the
  person is a licensee, the commissioner may suspend or revoke the license. Therefore, the licensee
  faces a class 6 felony and possible loss of license. The other options are incorrect because the
  offense is not a misdemeanor, not limited to a civil penalty, and the licensee is subject to
  penalty.
citation:
  source: Ariz. Rev. Stat. § 32-2161(A)
  url: null
  quoted_text: Every person who knowingly authorizes or directs any publication or any false statement
    or representation concerning any land, subdivision or membership camping contract offered for
    sale or lease, and every person who, with knowledge that any advertisement, pamphlet,
    prospectus, or letter concerning the land, subdivision or membership camping contract contains
    any written statement that is false or fraudulent, issues, circulates, publishes or distributes
    it or causes it to be issued, circulated, published or distributed, or who in any respect
    knowingly violates or fails to comply with any order, permit, decision, demand or requirement of
    the commissioner under the provisions of this chapter, is guilty of a class 6 felony and, if a
    licensee, shall be tried before the commissioner for suspension or revocation of his license.
