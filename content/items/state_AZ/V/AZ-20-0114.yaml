stem: A licensee knowingly publishes an advertisement claiming a residential property has a swimming
  pool when it does not. According to Ariz. Rev. Stat. § 32-2161(A), what is the likely consequence?
options:
  - The licensee may be charged with a class 6 felony and face possible license suspension or
    revocation
  - The licensee will only receive a written warning from the commissioner for the first offense
  - The licensee will be fined a civil penalty of one thousand dollars per violation
  - The licensee must complete additional continuing education hours within six months
key: A
explanation: Because the licensee knowingly made a false statement about the property, the statute
  classifies the act as a class 6 felony and subjects the licensee to possible suspension or
  revocation. The civil penalty of $1,000 pertains to general violations under § 32‑2160.01, not the
  specific criminal penalty for false statements.
citation:
  source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166 — ARS Title 32, Ch. 20, Art. 3 - Regulation — §
    32-2153 § 32-2161(A)
  url: null
  quoted_text: Every person who knowingly authorizes or directs any publication or any false statement
    or representation concerning any land, subdivision or membership camping contract offered for
    sale or lease, and every person who, with knowledge that any advertisement, pamphlet,
    prospectus, or letter concerning the land, subdivision or membership camping contract contains
    any written statement that is false or fraudulent, issues, circulates, publishes or distributes
    it or causes it to be issued, circulated, published or distributed, or who in any respect
    knowingly violates or fails to comply with any order, permit, decision, demand or requirement of
    the commissioner under the provisions of this chapter, is guilty of a class 6 felony and, if a
    licensee, shall be tried before the commissioner for suspension or revocation of his license.
