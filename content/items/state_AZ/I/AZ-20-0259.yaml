stem: According to Arizona law, what is the minimum years of experience required in the real estate,
  title insurance, banking, or mortgage broker industry for a candidate to be eligible for
  appointment as real estate commissioner?
options:
  - Three years
  - Five years
  - Seven years
  - Ten years
key: B
explanation: The statute requires at least five years' experience in the real estate, title
  insurance, banking, or mortgage broker industry for commissioner candidates. Three years refers
  only to the administrative experience requirement, so the answer stating three years is incorrect.
