  url: null
  quoted_text: If the judgment debtor does not hold a current license and if personal delivery cannot
    be effected by exercising reasonable diligence, the claimant must publish the notice once a week
    for two consecutive weeks in a newspaper of general circulation in the county in which the
    judgment debtor was last known to reside.
