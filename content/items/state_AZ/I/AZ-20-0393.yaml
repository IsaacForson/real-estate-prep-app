stem: A judgment debtor does not hold a current real estate license and personal delivery cannot be
  effected despite reasonable diligence. Under A.R.S. § 32-2188.01(B), what must the claimant do to
  serve the notice of claim?
options:
  - The claimant must send the notice by certified mail, return receipt requested, to the judgment
    debtor's last known business address on file with the department.
  - The claimant must email the notice to the judgment debtor's last known email address and request
    a read receipt.
  - The claimant must publish the notice once a week for two consecutive weeks in a newspaper of
    general circulation in the county where the judgment debtor was last known to reside.
  - The claimant must deliver the notice in person to the judgment debtor's residence and obtain a
    signed acknowledgment of receipt.
key: C
explanation: The statute requires publication in a newspaper for two weeks when the judgment debtor
  lacks a current license and personal delivery cannot be achieved with reasonable diligence. The
  distractor proposing certified mail is incorrect because that method applies only when the
  judgment debtor holds a current license.
citation:
