stem: A broker wishes to use a standardized purchase agreement form for a transaction; under Arizona
  law, who must approve the form to ensure it complies with state statutes and rules?
options:
  - The employing broker firm
  - The real estate commissioner
  - The county recorder's office
  - The supervising salesperson
key: B
explanation: Under Ariz. Rev. Stat. § 32-2107(G), the commissioner may approve standardized legal
  forms for use in the sale or lease of real estate to recognize compliance with the chapter and its
  rules. The county recorder’s duty is to record documents, not to approve forms, and brokers cannot
  unilaterally certify a form’s compliance; only the commissioner has that authority.
