stem: A licensee’s judgment against a salesperson became final on March 15, 2022, after all appeals
  were exhausted. By what date must the aggrieved person file an application for payment from the
  real estate recovery fund to be timely?
options:
  - March 15, 2025
  - March 15, 2026
  - March 15, 2023
  - March 15, 2024
key: D
explanation: Subsection C requires the claimant to file the recovery‑fund application within two
  years after the termination of all proceedings, reviews and appeals connected with the judgment.
  Filing on March 15, 2024 satisfies this two‑year window, while the one‑year date is too early and
  the three‑ or four‑year dates miss the deadline.
