stem: An applicant has four years of unlicensed experience performing duties equivalent to those of
  a licensed real estate broker but has never held a real estate license. The applicant applies for
  an original Arizona real estate broker license. Under Arizona law, what is true regarding the
  experience requirement?
options:
  - The applicant may satisfy the licensed experience requirement by demonstrating equivalent active
    experience in the past five years.
  - The applicant must have at least three years of licensed real estate experience regardless of
    other experience.
  - The applicant must first obtain a real estate salesperson license before any experience can
    count toward the broker requirement.
  - The applicant needs five years of licensed real estate experience to qualify for the broker
    license.
key: A
explanation: Subsection A(7) permits an equivalent amount of active experience within the preceding
  five years to substitute for the licensed active experience otherwise required for a broker
  license. Therefore, the applicant can meet the requirement by proving equivalent experience. The
  other options incorrectly insist on licensed experience or a salesperson license as prerequisites.
