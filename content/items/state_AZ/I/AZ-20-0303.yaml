stem: A licensee receives notice that their fingerprint clearance card has been suspended. They
  submit sufficient evidence to prove they applied for a good cause exception pursuant to section
  41-619.55 three business days after receiving the notice. Under Arizona law, what is the likely
  outcome regarding their real estate license?
options:
  - The licensee's license will be suspended immediately
  - The licensee's license will be revoked immediately
  - The licensee's license will be suspended after notice
  - The licensee's license will not be suspended
key: D
explanation: The statute states that a license may be suspended if the licensee fails to submit
  sufficient evidence of a good cause exception within five business days after being notified of
  the suspension. Submitting the evidence within that period satisfies the requirement, so the
  license is not suspended. The distractor suggesting suspension after notice incorrectly assumes
  automatic suspension regardless of timely submission.
