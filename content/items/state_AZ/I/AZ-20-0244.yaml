stem: Under Arizona law, what is the maximum time allowed to initiate an action that could result in
  a payment from the real estate recovery fund?
options:
  - One year after the cause of action accrues
  - Two years after the cause of action accrues
  - Three years after the cause of action accrues
  - Five years after the cause of action accrues
key: D
explanation: Subsection A of § 32-2188 states that an action for a judgment that may lead to a
  recovery‑fund payment must not be started later than five years from the accrual of the cause of
  action. The other options list shorter periods that the statute does not permit.
citation:
