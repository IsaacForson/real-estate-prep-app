stem: An instructor applicant who is not a panelist, guest speaker, attorney, or out‑of‑state
  instructor has not attended the required three‑hour professional seminar. Under Arizona law, what
  is the correct way for this applicant to still qualify for instructor approval?
options:
  - The applicant may substitute the seminar with additional teaching experience
  - The applicant is automatically ineligible for instructor approval
  - The applicant may request a waiver that the commissioner may grant after review
  - The applicant must retake the seminar before any approval can be considered
key: C
explanation: The statute allows the commissioner to waive the three‑hour professional‑seminar
  requirement for instructor applicants based on an individual request review. Substituting
  experience or automatically denying approval are not permitted, and retaking the seminar is
  unnecessary if a waiver is granted. Therefore, requesting a waiver that the commissioner may
  approve after review is the proper course.
