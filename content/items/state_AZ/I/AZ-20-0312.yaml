stem: After the commissioner has paid a claim from the real estate recovery fund, who is authorized
  to record the assignment of judgment lien and notice of subrogation?
options:
  - The attorney general may record the assignment on behalf of the state.
  - The commissioner may record the assignment as part of the subrogation process.
  - The judgment creditor may record the assignment after receiving payment.
  - The surety company may record the assignment to protect its interests.
key: B
explanation: The statute expressly states that the commissioner may record the assignment of
  judgment lien and notice of subrogation and assignment of rights after paying a claim. The
  attorney general’s role is to bring recovery actions, not to record assignments.
