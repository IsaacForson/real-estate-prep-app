stem: Under Arizona law, what is the maximum amount of interest monies from the real estate recovery
  fund that the commissioner may expend in any fiscal year to increase public awareness of the fund?
options:
  - Up to $100,000
  - Up to $150,000
  - Up to $50,000
  - Up to $75,000
key: C
explanation: The statute expressly limits the commissioner’s use of fund interest for
  public‑awareness expenses to no more than fifty thousand dollars per fiscal year. Any larger
  amount, such as the $75,000 distractor, exceeds that statutory cap and therefore is not permitted.
