stem: A licensee receives notice that their fingerprint clearance card has been suspended and fails
  to submit sufficient evidence of a good cause exception within the required timeframe. What action
  may the commissioner take regarding the licensee's real estate license?
options:
  - Suspend the license
  - Issue a warning
  - Impose a fine
  - Require extra training
key: A
explanation: The law states that the department may suspend a license if the licensee’s fingerprint
  clearance card is suspended and the licensee fails to submit sufficient evidence of a good cause
  exception within five business days after being notified. Thus, suspension is permitted. The other
  actions are not specified as consequences for this failure.
citation:
  source: Ariz. Rev. Stat. § 32-2108.01(C)
  url: null
  quoted_text: "The department may suspend a license if the licensee's fingerprint clearance card is
    suspended and either: 1. If the person was convicted of the alleged crime causing the
    fingerprint clearance card suspension, the commissioner could use the conviction to deny the
    license application pursuant to this chapter. 2. The licensee fails to submit sufficient
    evidence to prove the individual applied for a good cause exception pursuant to section
    41-619.55 within five business days after being notified by the department."
