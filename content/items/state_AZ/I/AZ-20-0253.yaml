stem: Which of the following qualifies as an 'address of record' for a licensee under Arizona law?
options:
  - The address of the licensee's former employer at last job
  - The address of the licensee's bank where funds are held
  - The address of the licensee's nearest relative on file
  - The address where a licensee practices or is otherwise employed
key: D
explanation: Under § 32-2101(2), an address of record includes the address where a licensee
  practices or is otherwise employed. The other options describe addresses not listed in the
  definition, such as a relative’s address or a bank’s address, which do not qualify.
