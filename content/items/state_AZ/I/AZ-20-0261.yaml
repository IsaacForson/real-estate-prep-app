stem: An applicant submits a real estate salesperson license application but has not yet obtained a
  fingerprint clearance card. According to Arizona law, what action must the department take
  regarding the license application?
options:
  - The department will issue the license immediately
  - The department will issue the license after a background check
  - The department will deny the license without a fingerprint clearance card
  - The department will issue a temporary license pending card submission
key: C
explanation: The statute provides that the department shall not issue a license to an original
  license applicant before receiving a valid fingerprint clearance card. Therefore, the department
  must deny issuance when the card is absent. Issuing the license after a background check is not
  authorized by the statute.
