stem: An applicant for a real estate salesperson license states that, due to bona fide religious
  convictions, they do not have a social security number. Which identifier may they provide on the
  application instead of a social security number?
options:
  - state employee identification number
  - federal tax identification number
  - national driver’s license number
  - state tax identification number
key: B
explanation: Under Arizona law, an applicant who lacks a social security number because of bona fide
  religious convictions (or other bona fide reasons documented to the commissioner’s satisfaction)
  may substitute a federal tax identification number. The statute explicitly allows this alternative
  identifier for natural‑person applicants. The distractor listing a driver’s license number is
  incorrect because that identifier is not mentioned as a permissible substitute in the licensing
  application requirements.
citation:
  source: Ariz. Rev. Stat. §§ 32-2121 to 32-2137 — ARS Title 32, Ch. 20, Art. 2 - Licensing — §
    32-2123(B)(5)
  url: null
  quoted_text: If the applicant, due to bona fide religious convictions or other bona fide reasons
    that the applicant documents on the application to the satisfaction of the commissioner, does
    not have a social security number, the applicant may provide the applicant's federal tax
    identification number with the application.
