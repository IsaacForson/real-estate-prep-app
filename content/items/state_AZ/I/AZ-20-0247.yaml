  url: null
  quoted_text: Each year the commissioner shall revise all fees collected under this chapter within
    the limits prescribed by this chapter in such a manner that the revenue derived from such fees
    equals at least ninety-five per cent but not more than one hundred ten per cent of the
    anticipated appropriated budget for the department for the succeeding fiscal year.
