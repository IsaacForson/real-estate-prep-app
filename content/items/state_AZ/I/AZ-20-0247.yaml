stem: Each year the commissioner must revise fees so that the revenue derived from fees falls within
  what percentage range of the anticipated appropriated budget for the succeeding fiscal year?
options:
  - At least 95% but not more than 110%
  - At least 95% but not more than 120%
  - At least 80% but not more than 120%
  - At least 90% but not more than 110%
key: A
explanation: The rule requires the commissioner to set fees so that revenue equals at least 95% but
  not more than 110% of the anticipated appropriated budget for the next fiscal year. Therefore the
  95%‑to‑110% range is correct. The distractor stating 90% as the lower bound is incorrect because
  the rule specifies a minimum of 95%, not 90%.
citation:
