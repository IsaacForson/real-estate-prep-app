stem: If the Arizona state fiscal year ends on June 30, by what date must monies in the real estate
  department education revolving fund exceeding $25,000 revert to the state general fund?
options:
  - May 31, 2025
  - July 1, 2025
  - June 30, 2025
  - August 1, 2025
key: C
explanation: Under Ariz. Rev. Stat. § 32-2107(E), monies in the real estate department education
  revolving fund that exceed twenty‑five thousand dollars at the end of the fiscal year revert to
  the state general fund. Since the fiscal year ends June 30, the reversion date is June 30, 2025.
