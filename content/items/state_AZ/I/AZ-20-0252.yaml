stem: Under Arizona law, does an unlicensed individual who refers a prospective tenant to a real
  estate broker and receives a referral fee for that referral need a real estate license?
options:
  - The individual needs a license because referring prospects assists in procuring prospects under
    § 32-2101(i)
  - The individual does not need a license because referrals are exempt as clerical duties
  - The individual does not need a license because the individual did not collect rent
  - The individual needs a license only if the referral fee exceeds $100
key: A
explanation: Subdivision (i) of § 32-2101 defines assisting or directing in procuring prospects that
  are calculated to result in a sale, exchange, lease or rental as an act requiring a license.
  Referring a prospective tenant for a fee falls within this activity, so a license is required. The
  distractor claiming an exemption as clerical duties is incorrect because the clerical‑duty
  exception applies only to rent collection, not to prospect referral.
