stem: An investor purchases vacant land expecting to resell it at a higher price after zoning
  changes. The zoning change never occurs, and the investor suffers a loss of anticipated profit.
  The investor obtains a judgment against the seller, who is a licensed real estate salesperson. May
  the investor recover from the Arizona real estate recovery fund for this loss?
options:
  - No, because the fund does not pay for speculative losses or lost profits.
  - Yes, but only if the investor also incurred actual out‑of‑pocket expenses.
  - Yes, because the loss arose from a real estate transaction involving a licensee.
  - No, because the fund only covers losses caused by natural causes or vandalism.
key: A
explanation: Subsection G(1) expressly excludes speculation, including lost profits and unrealized
  losses, from fund liability. Therefore a loss of anticipated profit is not compensable, even
  though the transaction involved a licensee.
