stem: A licensed real estate broker sells his own residential property to a buyer and knowingly
  overstates the square footage in the listing. The buyer relies on the broker’s licensed status
  when deciding to purchase. The buyer later discovers the misrepresentation and obtains a judgment
  against the broker. May the buyer recover from the Arizona real estate recovery fund for the
  out‑of‑pocket loss?
options:
  - Yes, because the broker acted as a principal and engaged in fraud or misrepresentation while the
    buyer relied on the broker’s licensed status.
  - No, because the fund only pays for losses arising from transactions where the licensee acted as
    an agent, not as a principal.
  - No, because the fund does not cover losses from misrepresentation unless the licensee is a
    salesperson, not a broker.
  - Yes, but only if the broker also held a cemetery license at the time of the transaction.
key: A
explanation: Subsection A(2) makes the fund liable when a licensee acts as a principal, commits
  fraud or misrepresentation, and the aggrieved party relies on the licensee’s licensed status. The
  fund is not limited to agent‑only transactions, so the claim based on principal fraud is payable.
