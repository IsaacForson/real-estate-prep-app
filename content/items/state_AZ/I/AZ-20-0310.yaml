stem: Under Arizona law, who may bring an action to recover amounts paid from the real estate
  recovery fund including interest, attorney fees, and costs of collection?
options:
  - The commissioner may bring the action in the name of the real estate recovery fund.
  - The attorney general may bring the action in the name of this state.
  - The judgment creditor may bring the action after receiving payment from the fund.
  - The surety company may bring the action on behalf of the licensee.
key: B
explanation: The statute explicitly states that the attorney general shall bring any actions to
  recover amounts paid from the fund, including interest, attorney fees, and costs of collection, in
  the name of this state. The commissioner’s authority is limited to defending the fund, not
  initiating recovery actions.
citation:
  source: Ariz. Rev. Stat. § 32-2192(D)
