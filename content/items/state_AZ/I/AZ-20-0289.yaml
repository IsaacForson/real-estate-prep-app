stem: A school wishes to hold a currently approved continuing education course and has not received
  an exemption from the commissioner. What action must the school take to comply with Arizona law
  regarding department monitoring?
options:
  - Submit notice to the department at least 7 days before the course begins
  - Submit notice to the department at least 14 days before the course begins
  - Obtain written approval from the department before the course begins
  - Wait for the department to send a monitoring team before the course begins
key: B
explanation: Unless the commissioner grants an exemption, a school must provide the department with
  at least fourteen days’ notice before holding a currently approved course so that department staff
  can monitor it. Shorter notice periods do not satisfy the statutory requirement, and neither
  department approval nor waiting for a monitoring team is required. Hence, the fourteen‑day notice
  is the correct action.
