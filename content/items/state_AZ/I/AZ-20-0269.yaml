stem: A county already has one member serving as a residential brokerage representative on the
  Arizona real estate advisory board. How many additional residential brokerage members may be
  appointed from that same county?
options:
  - The number of additional residential brokerage members that may be appointed from that county is
    zero
  - The number of additional residential brokerage members that may be appointed from that county is
    one
  - The number of additional residential brokerage members that may be appointed from that county is
    two
  - The number of additional residential brokerage members that may be appointed from that county is
    three
key: A
explanation: The rule limits residential brokerage seats to no more than one member from any one
  county. Since a county already has one such member, no additional residential brokerage member may
  be appointed from that county.
citation:
