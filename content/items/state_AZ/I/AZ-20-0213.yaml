stem: If the anticipated appropriated budget for the Arizona real estate department for the
  succeeding fiscal year is $480,000, what is the maximum amount of revenue that may be derived from
  fees under the commissioner's annual revision rule?
options:
  - $500,000
  - $528,000
  - $456,000
  - $480,000
key: B
explanation: The rule requires fee revenue to be no more than 110% of the anticipated appropriated
  budget. Multiplying $480,000 by 1.10 yields $528,000 as the maximum allowable revenue. The
  $456,000 distractor reflects mistakenly applying the minimum 95% threshold instead of the maximum.
citation:
  source: Ariz. Rev. Stat. § 32-2103(B)
  url: null
  quoted_text: the revenue derived from such fees equals at least ninety-five per cent but not more
