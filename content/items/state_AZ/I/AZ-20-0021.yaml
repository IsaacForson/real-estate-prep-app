stem: According to Arizona Revised Statutes § 32-2101, how is the term 'Broker' defined when used
  without modification?
options:
  - A person who is licensed as a broker under this chapter or who is required to be licensed as a
    broker under this chapter.
  - A person who sells, exchanges, purchases, rents or leases real estate, businesses, business
    opportunities or timeshare interests for compensation.
  - A person who acts as an intermediary or agent between sellers or buyers in the sale or purchase
    of businesses or business opportunities.
  - A person who is a licensed broker employed by another broker and has the same license privileges
    as a salesperson.
key: A
explanation: The definition of ‘Broker’ in § 32-2101(9) states that a broker is a person licensed as
  a broker under the chapter or required to be licensed as such. The option describing a person who
  is licensed as a broker under this chapter or who is required to be licensed as a broker under
  this chapter matches this wording exactly. The option describing a person who acts as an
  intermediary or agent between sellers or buyers in the sale or purchase of businesses or business
  opportunities describes the activities of a real estate broker, which is a different definition (§
  32-2101(51)), and thus is incorrect.
