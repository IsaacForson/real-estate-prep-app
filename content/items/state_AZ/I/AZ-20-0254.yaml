stem: A licensee sends a press release to a newspaper announcing a new subdivision; the newspaper
  does not charge for publishing the release. Under Arizona law, does this press release constitute
  advertising?
options:
  - It is considered advertising because it promotes a subdivision
  - It is not advertising because it is a press release for general information
  - It is considered advertising because it appears in a newspaper
  - It is not advertising because it is a communication to stockholders
key: B
explanation: The definition of advertising excludes press releases delivered to newspapers for
  general information when no charge is made by the newspaper. Since the press release meets this
  exemption, it is not advertising. Options claiming it is advertising ignore this specific
  exclusion.
