stem: Under Arizona law, what is the minimum number of lots, parcels, or fractional interests that
  must be offered for sale or lease for land to be considered a subdivision?
options:
  - Seven lots
  - Five lots
  - Four lots
  - Six lots
key: D
explanation: The definition of subdivision in § 32-2101(59)(a) states that it means land divided or
  proposed to be divided for the purpose of sale or lease into six or more lots, parcels or
  fractional interests. Therefore, six is the threshold. The distractor “Five lots” is incorrect
  because the rule requires at least six, not five.
