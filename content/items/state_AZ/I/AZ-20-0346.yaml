stem: A licensee’s actions in three separate real estate transactions each cause an actual
  out‑of‑pocket loss of $22,000 to the aggrieved parties. Assuming the losses are otherwise
  eligible, what is the maximum total amount the real estate recovery fund could pay for these three
  transactions?
options:
  - $22,000
  - $66,000
  - $90,000
  - $96,000
key: B
explanation: The fund will pay the lesser of the actual loss or the per‑transaction limit of $30,000
  for each transaction. Each loss of $22,000 is below that limit, so the fund pays the full $22,000
  for each of the three transactions. Adding them together gives $22,000 × 3 = $66,000. The
  per‑licensee aggregate cap of $90,000 is not reached because the total is below that threshold.
citation:
  source: Ariz. Rev. Stat. § 32-2186(B)(1)
  url: null
  quoted_text: Thirty thousand dollars for each transaction, regardless of the number of persons
    aggrieved or the number of licensees or parcels of real estate involved.
  secondary: []
math:
  worked_solution: >-
    1. Determine payment per transaction: min(loss, per‑transaction limit) = min($22,000, $30,000) =
    $22,000.

    2. Multiply by number of transactions: $22,000 × 3 = $66,000.

    3. Check aggregate cap: $66,000 ≤ $90,000, so the cap does not reduce the payment.

    4. Maximum total payment = $66,000.
  formulas:
    - Payment per transaction = min(loss, per‑transaction limit)
    - Total payment = number of transactions × payment per transaction
