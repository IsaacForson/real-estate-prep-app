stem: Under Arizona law, how many continuing education credit hours must a salesperson complete
  during each twenty-four-month licensure period to be eligible for license renewal?
options:
  - Twenty-four credit hours
  - Eighteen credit hours
  - Thirty credit hours total
  - Twelve credit hours required
key: A
explanation: The statute requires salespersons and associate brokers to accrue twenty-four credit
  hours each twenty-four-month period. The thirty‑credit‑hour requirement applies only to designated
  brokers.
citation:
  source: Ariz. Rev. Stat. § 32-2130(A)
  url: null
  quoted_text: The total number of credit hours shall be accrued at a rate of twenty-four credit hours
    for salespersons and associate brokers and thirty credit hours for designated brokers or for
    associate brokers employed by a designated broker pursuant to section 32-2151.01, subsection G
    during each twenty-four-month period of licensure.
