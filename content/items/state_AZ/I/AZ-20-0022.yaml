stem: A licensee sends a press release to a local newspaper announcing a new subdivision. The
  newspaper publishes the release at no charge. Under Arizona law, how is this press release
  classified?
options:
  - The press release is considered advertising because it is distributed to a newspaper, which is a
    common practice in real estate marketing.
  - The press release is considered advertising because it includes details about a subdivision,
    which is a common practice in real estate marketing.
  - The press release is NOT considered advertising because it is a press release delivered at no
    charge for general information.
  - The press release is considered advertising because it promotes a subdivision, which is a common
    practice in real estate marketing.
key: C
explanation: Under § 32-2101(3)(a), a press release delivered to a newspaper at no charge for
  general information is expressly excluded from the definition of advertising. Therefore, the press
  release is not considered advertising, making the option that states the press release is NOT
  considered advertising because it is a press release delivered at no charge for general
  information correct. The option that claims it is considered advertising because it is distributed
  to a newspaper incorrectly treats any newspaper distribution as advertising, ignoring the
  statutory exemption.
citation:
