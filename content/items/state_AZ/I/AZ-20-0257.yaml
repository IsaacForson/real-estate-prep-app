stem: A judgment debtor receives a notice of claim and copy of application from the real estate
  recovery fund. How many calendar days does the judgment debtor have to file a written response to
  avoid waiving the right to object?
options:
  - Thirty calendar days
  - Forty‑five calendar days
  - Thirty‑five calendar days
  - Twenty‑five calendar days
key: C
explanation: The rule states that a judgment debtor who fails to file a written response within
  thirty‑five calendar days after service loses the right to object. The thirty‑day period applies
  to mailing deficiency notices, not to the debtor’s response.
citation:
  source: Ariz. Rev. Stat. § 32-2188.01(C)
  url: null
  quoted_text: If the judgment debtor fails to file a written response to the application with the
    department within thirty-five calendar days after service under subsection B of this section or
    after the first publication of the notice, the judgment debtor is not thereafter entitled to
    notice of any action taken or proposed to be taken by the commissioner with respect to the
    claim.
