stem: A licensee receives notice that their fingerprint clearance card has been suspended. The
  department notifies them that they may avoid suspension of their real estate license if they
  submit sufficient evidence to prove they applied for a good cause exception within how many
  business days?
options:
  - Ten business days
  - Seven business days
  - Five business days
  - Three business days
key: C
explanation: The statute specifies that a licensee must submit sufficient evidence of a good cause
  exception within five business days after being notified of the suspension to avoid license
  suspension. Therefore, five business days is correct. Three business days is too short and does
  not match the statutory period.
