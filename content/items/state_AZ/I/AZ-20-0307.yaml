stem: A cemetery broker licensed in Arizona wishes to renew their license. Which statement about
  continuing education is correct under Arizona law?
options:
  - They must complete twenty‑four credit hours of continuing education each renewal period.
  - They must complete thirty credit hours of continuing education each renewal period.
  - They are exempt from the continuing education requirement for license renewal.
  - They may substitute short‑sale training for the required continuing education hours.
key: C
explanation: Arizona Revised Statutes § 32‑2130(D) states that cemetery brokers and salespersons are
  exempt from the educational requirements of the section. Consequently, a cemetery broker does not
  need to complete any continuing‑education credits to renew the license. The statements that
  require twenty‑four or thirty credit hours, or that allow short‑sale training to count toward the
  requirement, are incorrect because the exemption eliminates the requirement entirely.
