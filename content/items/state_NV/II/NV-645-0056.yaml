stem: A Nevada limited-liability company wishes to engage in the business of property management. To
  comply with NRS 645.6054, the limited-liability company must designate which of the following to
  submit an application for a property management permit?
options:
  - Designate one member
  - Designate a broker
  - Designate its manager
  - Designate one officer
key: C
explanation: NRS 645.6054(1)(c) requires a limited‑liability company to designate its manager to
  submit the property‑management permit application. The option 'Designate one member' is incorrect
  because that rule applies to partnerships, not LLCs.
