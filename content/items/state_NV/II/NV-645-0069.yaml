stem: A license applicant was convicted of embezzlement, paid the court‑ordered restitution, and
  completed parole two years later. Under NRS 645.330, how long must the applicant wait before the
  Real Estate Division may issue a license?
options:
  - 2 years
  - 5 years
  - 6 years
  - 3 years
key: B
explanation: NRS 645.330(2)(b) states that a license shall not be issued until at least three years
  after the later of paying any fine/restitution or the expiration of parole, probation, or
  sentence. Restitution was paid at time zero; parole ended two years later, making parole
  expiration the later event. Adding the three‑year waiting period yields a total of five years
  before licensure is possible.
