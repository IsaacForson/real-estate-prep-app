    — § 645.330"
  url: null
  quoted_text: "Shall not issue a license to such a person until at least 3 years after: (1) The
    person pays any fine or restitution ordered by the court; or (2) The expiration of the period of
    the persons parole, probation or sentence, whichever is later."
