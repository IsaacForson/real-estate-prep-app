stem: To qualify for a real estate broker license in Nevada, an applicant must have been actively
  engaged as a full-time licensee for at **LEAST** how many of the four years preceding the license
  issuance?
options:
  - The applicant must have one year of experience
  - The applicant must have three years of experience
  - The applicant must have four years of experience
  - The applicant must have two years of experience
key: D
explanation: NRS 645.330(4) provides that a person may not be licensed as a real estate broker
  unless they have been actively engaged as a full-time licensed real estate broker-salesperson or
  salesperson in Nevada, or in another state or DC, for at least 2 of the 4 years immediately
  preceding the issuance of a broker’s license. One, three, or four years do not satisfy this
  requirement.
