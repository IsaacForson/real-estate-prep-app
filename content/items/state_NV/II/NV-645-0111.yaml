stem: Under Nevada law, how many days does a broker have to provide written notice to the Division
  after a change of association of a broker-salesperson licensee?
options:
  - 10 days
  - 30 days
  - 15 days
  - 5 days
key: A
explanation: NRS 645.570(1) requires written notice of any change of association to be given to the
  Division within 10 days. The 30‑day period applies to a salesperson who must re‑associate or go
  inactive after termination, not to the broker’s notice obligation.
