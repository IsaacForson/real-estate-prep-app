stem: A Nevada corporation wishes to engage in the business of property management. To comply with
  NRS 645.6054, the corporation must designate which of the following to submit an application for a
  property management permit?
options:
  - Designate a partner
  - Designate an officer
  - Designate a manager
  - Designate a proprietor
key: B
explanation: NRS 645.6054(1)(b) requires a corporation to designate one of its officers or employees
  to submit the property‑management permit application. Designating an officer satisfies this
  requirement because an officer qualifies under the statute. Designating a partner, manager, or
  proprietor does not meet the corporate designation rule and would be insufficient.
