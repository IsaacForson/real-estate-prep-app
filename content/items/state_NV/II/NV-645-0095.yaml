stem: A Nevada broker who operates as a sole proprietor wishes to engage in property management. To
  comply with NRS 645.6054, the broker must designate which of the following to submit an
  application for a property management permit?
options:
  - A licensed broker-salesperson working for broker
  - A licensed broker from another real estate firm
  - An unlicensed office assistant working for the broker
  - A broker acting as the sole proprietor of the firm
key: A
explanation: Under NRS 645.6054(1)(d), a sole‑proprietor broker must designate a person who is
  licensed under the broker to submit the property‑management permit application. A
  broker‑salesperson employed by the broker satisfies this requirement because the salesperson is
  licensed under that broker. The distractor suggesting any licensed broker from another firm is
  incorrect because the designated person must be licensed under the specific broker seeking the
  permit, not merely any broker.
