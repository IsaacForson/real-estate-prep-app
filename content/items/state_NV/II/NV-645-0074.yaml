stem: Under NRS 645.6054(1)(d), a broker who conducts business as a sole proprietor must designate
  which of the following to submit an application for a property management permit?
options:
  - A manager of the limited-liability company
  - A person who is licensed under the broker
  - A member of the partnership organization
  - An officer or employee of the corporation
key: B
explanation: The statute explicitly states that a sole‑proprietor broker must designate a person who
  is licensed under the broker to apply for the property‑management permit. The distractor referring
  to an LLC manager is incorrect because that designation applies only to a limited‑liability
  company, not to a sole proprietorship.
