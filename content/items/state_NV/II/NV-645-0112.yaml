stem: A broker-salesperson terminates her association with a broker. What must the broker do within
  10 days after the termination?
options:
  - The requirement to deliver the license to the Division
  - The requirement to notify the salesperson within 5 days
  - The requirement to file a termination report
  - The requirement to place the license on inactive status
key: A
explanation: NRS 645.580(1)(a) obligates the broker to deliver or mail the license to the Division
  within 10 days after termination, accompanied by a written statement. The 5‑day notice period is
  not specified in the statute; that figure is a common confusion with other notice requirements.
