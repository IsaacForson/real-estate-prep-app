stem: "A property manager arranges to receive a referral fee from a vendor while also being
  compensated by the property owner for the same transaction. Under NAC 645.605, the manager may
  accept compensation from more than one party only if the manager:"
options:
  - Documents the arrangement solely in the manager's personal file
  - Waits until after closing to reveal the arrangement to either party
  - Discloses the arrangement and obtains each party's consent
  - Splits the fee evenly between the vendor and the property owner
key: C
explanation: NAC 645.605 requires a licensee who receives compensation from more than one party in a
  transaction to obtain full disclosure to and consent from each party before accepting it.
citation:
  source: Nev. Admin. Code § 645.605
  url: null
  quoted_text: If the licensee receives compensation from more than one party in a real estate
    transaction, full disclosure to and consent from each party to the real estate transaction. A
    licensee shall not accept compensation from more than one party in a real estate transaction,
    even if otherwise permitted by law, without full disclosure to all parties.
