stem: "A licensee manages a rental property and also has a financial arrangement with the vendor she
  hires to perform maintenance on that property, but she never mentions this arrangement to the
  property owner. Applying NAC 645.605, this omission is most relevant to a finding of:"
options:
  - A clerical slip that needs no disclosure here
  - A renewal gap that has nothing to do with conduct
  - A recordkeeping lapse that concerns the broker's trust accounts
  - Deceitful, fraudulent or dishonest dealing under NRS 645.633
key: D
explanation: NAC 645.605(4)(c) lists a licensee's undisclosed financial arrangement with a
  maintenance vendor for a managed property as a factor the Commission weighs in finding deceitful,
  fraudulent or dishonest dealing under NRS 645.633.
