stem: A broker fails to establish any system for reviewing the contracts written by an associated
  salesperson, and that salesperson later commits a violation of chapter 645. Based on NRS 645.660,
  what is the most likely regulatory consequence for the broker?
options:
  - Automatic loss of the salesperson's license
  - A private note placed in the salesperson's file
  - Suspension of her license and a fine up to $5,000
  - No regulatory result, since the Commission supervises
key: C
explanation: NRS 645.660(3) allows the Commission to suspend, revoke, or deny renewal of a broker's
  license and assess a civil penalty of not more than $5,000 when the broker fails to adequately
  supervise an associated licensee who commits a violation.
citation:
  source: Nev. Rev. Stat. § 645.660
  url: null
  quoted_text: The Commission may suspend, revoke or deny the renewal of the license of a real estate
    broker and may assess a civil penalty of not more than $5,000 against the broker if it appears
    he or she has failed to maintain adequate supervision of a salesperson or broker-salesperson
    associated with the broker and that person commits any unlawful act or violates any of the
    provisions of this chapter.
