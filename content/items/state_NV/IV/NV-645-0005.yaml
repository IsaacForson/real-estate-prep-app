stem: An owner personally manages her own rental property to preserve its physical condition and
  maintain service to tenants, without holding a license. Under NRS 645.0445, this management
  exemption does **NOT** extend to which activity?
options:
  - Collecting rent directly from tenants
  - Engaging in property sales activities
  - Scheduling routine maintenance repairs
  - Maintaining high standards of tenant service
key: B
explanation: NRS 645.0445 exempts an owner managing his or her own property from licensure for
  preserving its value and tenant service, but the exemption does not extend to sales activities.
citation:
  source: Nev. Rev. Stat. § 645.0445
  url: null
  quoted_text: For the purposes of this subsection, management means activities which tend to preserve
    or increase the income from the property by preserving the physical desirability of the property
    or maintaining high standards of service to tenants. The term does not include sales activities.
