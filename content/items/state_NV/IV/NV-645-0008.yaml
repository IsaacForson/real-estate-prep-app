  url: null
  quoted_text: The Commission may suspend, revoke or deny the renewal of the license of a real estate
    broker and may assess a civil penalty of not more than $5,000 against the broker if it appears
    he or she has failed to maintain adequate supervision of a salesperson or broker-salesperson
    associated with the broker and that person commits any unlawful act or violates any of the
    provisions of this chapter.
