stem: A salesperson receives a referral fee from a mortgage lender for bringing a buyer to a
  transaction, without informing their broker. Which ground for disciplinary action under NRS
  645.630 does this conduct violate?
options:
  - Commingling client and personal funds
  - Failing to maintain trust account
  - Accepting an unauthorized commission
  - Making a material misrepresentation
key: C
explanation: NRS 645.630(1)(c) prohibits accepting a commission or valuable consideration from
  anyone other than the employing broker or owner‑developer. The other options describe different
  violations that do not fit the facts.
