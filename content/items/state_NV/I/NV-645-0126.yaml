stem: Under NRS 645.685(3), when does the five-year limitation period for commencing a disciplinary
  proceeding **NOT** begin to run if the charges are based on a misrepresentation or failure to
  disclose?
options:
  - When the licensee receives the complaint
  - When the alleged act actually occurred
  - When the facts showing misrepresentation are found
  - When the licensee files for renewal
key: C
explanation: The rule states that the limitation period does not commence until the discovery of
  facts which do or should lead to the discovery of the misrepresentation or failure to disclose.
  Therefore, the period starts when the facts showing the misrepresentation are found. The
  distractor stating the period starts when the act occurred is incorrect because the exception
  delays the start until discovery.
