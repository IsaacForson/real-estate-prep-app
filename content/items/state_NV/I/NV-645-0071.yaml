stem: Under NRS 645.685, how many days after service of notice must a licensee file an answer to charges?
options:
  - 30 days
  - 10 days
  - 20 days
  - 60 days
key: A
explanation: NRS 645.685 requires a licensee to file an answer to charges not later than 30 days
  after service of the notice and related documents. Therefore, the 30‑day option is correct. The
  10‑day and 20‑day options are too short, and the 60‑day option exceeds the statutory period.
