stem: What is the minimum balance that must be maintained in the Real Estate Education, Research and
  Recovery Fund according to Nevada law?
options:
  - A minimum balance of $300,000 must be maintained in the Fund
  - A minimum balance of $100,000 must be maintained in the Fund
  - A minimum balance of $250,000 must be maintained in the Fund
  - A minimum balance of $500,000 must be maintained in the Fund
key: A
explanation: NRS 645.842(2) requires that a balance of not less than $300,000 be maintained in the
  Fund for satisfying claims against licensees. The $250,000 distractor understates the required
  minimum, while the $500,000 and $100,000 distractors overstate or understate it.
