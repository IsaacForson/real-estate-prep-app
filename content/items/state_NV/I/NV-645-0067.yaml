stem: A licensee receives notice of a disciplinary hearing via certified mail on April 5. Under NRS
  645.685, what is the last day the licensee may file an answer to avoid a default judgment?
options:
  - April 5
  - April 4
  - May 6
  - May 5
key: D
explanation: NRS 645.685 requires the answer to be filed not later than 30 days after service of the
  notice. Adding 30 days to April 5 yields May 5 as the deadline. The distractor "April 5" is
  incorrect because it is the service date itself, not the final day to file.
