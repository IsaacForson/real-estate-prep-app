stem: A licensee committed a misrepresentation in a real estate transaction on January 15, 2019. The
  misrepresentation was not discovered until March 10, 2022. According to NRS 645.685(3)(a), when
  does the 5-year period for commencing a disciplinary proceeding begin?
options:
  - January 15, 2024
  - March 10, 2022
  - March 10, 2027
  - January 15, 2019
key: B
explanation: NRS 645.685(3)(a) provides that when charges are based on a misrepresentation, the
  5‑year period does not commence until the discovery of facts leading to the misrepresentation.
  Therefore, the period starts on the discovery date, March 10, 2022.
