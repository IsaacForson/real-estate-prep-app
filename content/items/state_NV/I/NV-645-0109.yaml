stem: "A licensee deposits client earnest money into his personal checking account to cover a
  temporary shortfall. According to NRS 645.630, this action constitutes:"
options:
  - The action is permitted if the money is returned quickly.
  - The action is allowed if disclosed to the client.
  - The action is prohibited as commingling of funds.
  - The action is acceptable with a ledger only.
key: C
explanation: NRS 645.630(h) expressly prohibits commingling the money or other property of clients
  with the licensee’s own or converting client funds to personal use. Depositing client earnest
  money into a personal account is commingling, regardless of intent to return the funds. The
  distractor 'The action is permitted if the money is returned quickly.' is incorrect because the
  rule does not permit commingling even if the funds are returned promptly.
