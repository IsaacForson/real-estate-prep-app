stem: What is the minimum balance that must be maintained in the Real Estate Education, Research and
  Recovery Fund according to NRS 645.842?
options:
  - A minimum balance of $300,000
  - A minimum balance of $150,000
  - A minimum balance of $500,000
  - A minimum balance of $100,000
key: A
explanation: NRS 645.842(2) mandates that the Fund maintain a balance of not less than $300,000 to
  satisfy claims against licensees. This establishes the required minimum. The $150,000 option
  understates the amount, while $500,000 and $100,000 are not supported by the statute.
