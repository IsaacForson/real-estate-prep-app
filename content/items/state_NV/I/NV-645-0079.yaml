stem: A licensee receives a hearing notice dated May 1 for a hearing scheduled May 15. Does this
  satisfy the notice requirement under NRS 645.680?
options:
  - The notice satisfies the requirement because it was delivered in writing.
  - The notice does not satisfy the requirement because the licensee’s broker was not notified.
  - The notice does not satisfy the requirement because fewer than 30 days notice were given.
  - The notice satisfies the requirement because it was sent by certified mail.
key: C
explanation: NRS 645.680(4) mandates that the licensee must be given at least 30 days notice in
  writing of the hearing date, time, and place. A notice dated May 1 for a May 15 hearing provides
  only 14 days notice, which is insufficient. Therefore, the notice does not satisfy the
  requirement.
