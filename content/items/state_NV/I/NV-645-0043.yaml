stem: A licensee receives a notice of hearing from the Administrator regarding possible disciplinary
  action. Under NRS 645.680, what is the minimum number of days the licensee must be given in
  writing before the hearing?
options:
  - 15 days notice
  - 30 days notice
  - 45 days notice
  - 60 days notice
key: B
explanation: NRS 645.680 requires that the licensee be given at least 30 days notice in writing of
  the hearing date, time, and place. Thus, the minimum notice period is thirty days. The distractor
  of fifteen days notice understates the statutory minimum.
