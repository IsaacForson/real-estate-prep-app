    — § 645.680
  url: null
  quoted_text: The licensee, permittee or owner-developer must be given at least 30 days notice in
    writing by the Division of the date, time and place of the hearing together with a copy of the
    complaint and copies of all communications, reports, affidavits or depositions in possession of
    the Division relevant to the complaint.
