stem: After being served with notice of a disciplinary complaint, a licensee wishes to file an
  answer. According to NRS 645.685, within how many days must the answer be filed with the
  Commission?
options:
  - 40 days
  - 30 days
  - 20 days
  - 10 days
key: B
explanation: The statute specifies that the answer must be filed not later than 30 days after
  service of the notice. Therefore, the required filing period is thirty days. The distractor of
  twenty days incorrectly shortens the statutory deadline.
