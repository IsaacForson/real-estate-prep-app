stem: A licensee made a material misrepresentation in a sale that closed four years ago. The buyer
  discovered the misrepresentation today. The Real Estate Division wishes to initiate disciplinary
  action. Under NRS 645.685(3)(a), may the Division proceed?
options:
  - No, because misrepresentation is not a ground for disciplinary action.
  - Yes, but only if the licensee consents to the proceeding.
  - No, because more than five years have passed since the act occurred.
  - Yes, because the five-year period begins at the discovery of the misrepresentation.
key: D
explanation: NRS 645.685(3)(a) provides that the five-year limitation period does not commence until
  discovery of facts that would lead to the discovery of a misrepresentation or failure to disclose.
  Since the misrepresentation was discovered today, the period starts now, allowing the Division to
  proceed. The distractor "No, because more than five years have passed since the act occurred" is
  wrong because the statute tolls the period for misrepresentation until discovery.
