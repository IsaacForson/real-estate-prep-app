stem: How many days notice must be given to a licensee before a disciplinary hearing under NRS 645.680?
options:
  - At least 60 days notice in writing
  - At least 90 days notice in writing
  - At least 30 days notice in writing
  - At least 15 days notice in writing
key: C
explanation: NRS 645.680(4) requires that the licensee receive at least 30 days’ written notice of
  the hearing date, time, and place, along with a copy of the complaint. The 15‑day option
  understates the statutory minimum, while 60‑ and 90‑day options exceed the required notice period.
