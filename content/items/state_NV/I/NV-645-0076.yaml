stem: A Nevada-licensed salesperson receives a $500 referral fee from a mortgage lender for
  directing a buyer to that lender. The salesperson’s employing broker is unaware of the payment.
  According to NRS 645.630(c), which statement is correct?
options:
  - The salesperson may keep the fee if the buyer signs a written disclosure acknowledging the
    payment.
  - The salesperson may keep the fee if the broker provides a retroactive authorization letter.
  - The salesperson may be disciplined for accepting a fee from anyone other than the broker.
  - The salesperson may keep the fee if the amount is less than five hundred dollars.
key: C
explanation: NRS 645.630(c) prohibits a salesperson from accepting a commission or valuable
  consideration from anyone other than the employing broker or owner‑developer. Therefore, accepting
  a referral fee from a mortgage lender subjects the salesperson to disciplinary action. The idea
  that broker approval after the fact permits the fee is incorrect because the rule bars the
  acceptance regardless of later approval.
