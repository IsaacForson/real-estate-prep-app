stem: A licensee has three separate judgments totaling $120,000 for fraud in different transactions.
  What is the maximum amount the Fund may pay toward satisfying all judgments against this licensee?
options:
  - $60,000
  - $80,000
  - $120,000
  - $100,000
key: D
explanation: Under NRS 645.844(1), the real estate recovery fund’s liability for any single licensee
  cannot exceed $100,000, no matter how many judgments exist against that licensee. Therefore, even
  though the licensee faces judgments totaling $120,000, the fund may pay at most $100,000.
