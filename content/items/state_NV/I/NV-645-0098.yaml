    Salespersons (rev. 4/15/2026, through 2025 session), official Nevada Legislature page read via
    Internet Archive capture of 2026-04-22 because leg.state.nv.us returns Cloudflare 403 to scripts
    — § 645.844"
  url: null
  quoted_text: The liability of the Fund does not exceed $100,000 for any person licensed pursuant to
    this chapter
  secondary: []
math:
  worked_solution: Total judgments = $120,000. Statutory cap per NRS 645.844(1) = $100,000. Maximum
    payable = min(total judgments, cap) = min($120,000, $100,000) = $100,000.
  formulas:
    - Maximum payable = min(total judgments, statutory cap)
