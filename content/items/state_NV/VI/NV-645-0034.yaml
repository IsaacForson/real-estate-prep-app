stem: "A buyer's agent receives two written offers on the same property before the client accepts
  either one, but she delivers only her preferred offer to the client. Under NRS 645.254, this
  conduct violates the licensee's duty to:"
options:
  - Negotiate solely with the offer she likes the best
  - Withhold weaker offers until the top one gets rejected fully
  - Wait until closing to reveal any competing offers
  - Present each offer to the client when it is practicable
key: D
explanation: NRS 645.254(4) requires a licensee to present all offers made to or by the client as
  soon as is practicable, unless the client has signed a waiver of that duty.
