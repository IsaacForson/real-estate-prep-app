stem: Under NRS 645.323, who may lawfully accept an advance fee listing?
options:
  - Any appraiser retained to value the subject property
  - Any unlicensed marketing consultant who is hired by the seller
  - A broker or a licensed salesperson acting under this chapter
  - Any escrow officer who is handling the closing today
key: C
explanation: NRS 645.323 states that a person shall not accept an advance fee listing unless
  licensed as a real estate broker, broker-salesperson, or salesperson under chapter 645.
citation:
  source: Nev. Rev. Stat. § 645.323
  url: null
  quoted_text: A person shall not accept an advance fee listing unless he or she is licensed as a real
    estate broker, broker-salesperson or salesperson pursuant to this chapter.
