stem: "A salesperson holds a buyer's earnest money deposit for four business days after receiving a
  fully executed contract before forwarding it to her broker. Under NAC 645.657, this delay is:"
options:
  - A breach, since the deposit is due within 1 business day
  - A breach, since brokers need to collect deposits themselves
  - Acceptable, since the deposit is the buyer's until closing
  - Acceptable, since brokers need to request the deposit first
key: A
explanation: NAC 645.657 requires a licensee who receives a deposit to pay it over to the broker,
  owner-developer, or designated escrow business within 1 business day after receiving a fully
  executed contract, so a four-day hold breaches that timeline.
