stem: Under Nevada law, when is a licensee **NOT** required to obtain the written consent of each
  party before acting for more than one party in a real estate transaction?
options:
  - When the licensee relies on prior dealings with the parties as evidence of their consent to dual
    agency.
  - When the licensee discloses the dual agency relationship to both parties verbally and proceeds
    without obtaining written consent.
  - When the broker assigns different licensees affiliated with the brokerage to separate parties to
    the transaction.
  - When the transaction is limited to residential property and the parties involved are immediate
    family members.
key: C
explanation: NRS 645.253(1) provides that when a broker assigns different licensees from the same
  brokerage to separate parties, the licensees are not required to obtain the written consent
  otherwise mandated by NRS 645.252(1)(d). Simply disclosing the dual agency relationship does not
  satisfy the consent requirement, making the distractor about verbal disclosure incorrect.
