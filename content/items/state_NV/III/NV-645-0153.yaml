stem: A licensee representing a buyer expects to receive a $500 referral fee from a mortgage lender
  if the buyer obtains a loan through that lender. According to Nevada law, what must the licensee
  do before continuing to act as the buyer's agent?
options:
  - Depositing the referral fee into the brokerage's trust account
  - Obtaining written consent from the buyer to accept the referral fee
  - Disclosing the referral fee source to the buyer as soon as practicable
  - Refusing to accept the referral fee unless the buyer consents in writing
key: C
explanation: NRS 645.252(1)(b) requires disclosure of each source of compensation to the client as
  soon as practicable. Obtaining written consent is not required for compensation disclosure, and
  depositing the fee or refusing it unless the buyer consents are not mandated by this rule.
