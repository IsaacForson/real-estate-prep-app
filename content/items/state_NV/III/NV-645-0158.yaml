stem: A licensee is acting as agent for both the buyer and the seller in a residential transaction.
  According to Nevada law, what must the licensee provide to the parties?
options:
  - Provide the appropriate form prepared by the Division to each party for whom the licensee is
    acting as an agent in the transaction
  - Provide the appropriate form prepared by the Division only to the buyer in the transaction
  - Provide the appropriate form prepared by the Division only to the seller in the transaction
  - Provide the appropriate form prepared by the Division to neither party because both are
    represented
key: A
explanation: Under NRS 645.252(3), a licensee acting as agent must provide the Division‑prepared
  form to each party for whom the licensee is acting, and to any unrepresented party. Providing the
  form only to the buyer (or only to the seller) fails to satisfy the duty to the other represented
  party, making those options incorrect.
citation:
  source: Nev. Rev. Stat. ch. 645 — Nevada Revised Statutes Chapter 645 — Real Estate Brokers and
    Salespersons (rev. 4/15/2026, through 2025 session), official Nevada Legislature page read via
    Internet Archive capture of 2026-04-22 because leg.state.nv.us returns Cloudflare 403 to scripts
    — § 645.252
  url: null
  quoted_text: "Shall provide the appropriate form prepared by the Division pursuant to NRS 645.193
    to: (a) Each party for whom the licensee is acting as an agent in the real estate transaction;
    and (b) Each unrepresented party to the real estate transaction, if any."
