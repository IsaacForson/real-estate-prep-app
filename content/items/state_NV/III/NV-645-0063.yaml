stem: "Under Nevada law, a licensee may refrain from presenting all offers made to or by a client if:"
options:
  - The licensee has already presented a higher offer and considers further offers unnecessary to
    present.
  - The client is unrepresented and the licensee is acting as a transaction broker in the
    transaction.
  - The offer is below the listing price and the licensee believes it is not serious enough to
    present.
  - The client has signed a waiver of the duty to present all offers on a form prescribed by the
    Division.
key: D
explanation: NRS 645.254(4) states that the duty to present all offers may be waived only when the
  client signs a waiver on a form prescribed by the Division. A licensee’s personal judgment about
  an offer’s seriousness or price does not override this duty, so the distractor based on the
  licensee’s belief is incorrect.
