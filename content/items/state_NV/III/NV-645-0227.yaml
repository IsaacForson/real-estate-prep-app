stem: A licensee representing both the buyer and the seller in a residential transaction has
  disclosed dual agency but has not obtained written consent from either party. According to Nevada
  law, what must the licensee do before continuing to act as agent for both parties?
options:
  - Continue acting as agent because disclosure was made
  - Disclose the dual agency to the broker only
  - Terminate the brokerage agreement with one party
  - Obtain written consent from both parties
key: D
explanation: NRS 645.252(1)(d) requires that when a licensee discloses acting for more than one
  party, they must obtain the written consent of each party before continuing to act as an agent.
  Without that consent, the licensee may not continue dual representation. The other options either
  ignore the consent requirement or suggest actions not permitted by the statute.
