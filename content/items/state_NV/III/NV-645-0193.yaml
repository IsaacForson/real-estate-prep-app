stem: "According to NRS 645.252(1)(e), a licensee must disclose to each party to a real estate
  transaction as soon as practicable:"
options:
  - Any changes in the licensee's relationship to a party to the transaction
  - Any material facts about the property known to the licensee
  - Any source of compensation the licensee will receive from the transaction
  - Any indication that the licensee is acting for more than one party in the transaction
key: A
explanation: NRS 645.252(1)(e) requires a licensee to disclose any changes in the licensee's
  relationship to a party to the transaction as soon as practicable. This ensures parties are
  informed of shifts that could affect the agency relationship. The other options describe
  disclosures required under different subsections of NRS 645.252, such as material facts
  (subsection 1)(a), compensation sources (subsection 1)(b), and dual agency (subsection 1)(d).
