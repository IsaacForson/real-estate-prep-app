stem: A licensee terminates a brokerage agreement with a landlord and, eight months later, discloses
  the landlord's confidential rental rate to a prospective tenant without the landlord's permission.
  According to Nevada law, is the licensee permitted to disclose the confidential information?
options:
  - The licensee's disclosure is permitted because the information is no longer considered
    confidential after six months
  - The licensee's disclosure is prohibited because the one‑year confidentiality period has not
    elapsed and no exception applies
  - The licensee's disclosure is prohibited because the duty of confidentiality continues
    indefinitely
  - The licensee's disclosure is permitted because less than one year has passed
key: B
explanation: The statute bars disclosure for one year after termination absent client written
  permission or a court order; eight months falls within that period and no exception applies, so
  the disclosure is prohibited. The six‑month permission option misstates the required time frame.
citation:
