stem: "According to Nevada law, a brokerage agreement is a written contract between a client and a
  broker in which the broker agrees to accept valuable consideration for:"
options:
  - Assisting, soliciting, or negotiating the sale, purchase, option, rental, or lease of real
    property, or the sale, exchange, option, or purchase of a business
  - Assisting, soliciting, or negotiating the sale, purchase, option, rental, or lease of real
    property only
  - Assisting, soliciting, or negotiating the sale, exchange, option, or purchase of a business only
  - Assisting, soliciting, or negotiating the sale, purchase, option, rental, or lease of real
    property, and the sale, exchange, option, or purchase of a business
key: A
explanation: The key is correct because NRS 645.005 defines a brokerage agreement as a written
  contract where the broker accepts valuable consideration for assisting, soliciting, or negotiating
  either real‑property transactions or business transactions. The distractors that limit the
  agreement to only real property or only business omit the alternative allowed by the statute,
  while the distractor that uses “and” incorrectly requires both types of transactions
  simultaneously.
