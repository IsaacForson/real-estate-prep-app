  quoted_text: Brokerage agreement means a written contract between a client and a broker in which the
    broker agrees to accept valuable consideration from the client or another person for assisting,
    soliciting or negotiating the sale, purchase, option, rental or lease of real property, or the
    sale, exchange, option or purchase of a business.
