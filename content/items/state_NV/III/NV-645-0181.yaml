stem: According to NRS 645.254(7), when must a licensee account for money received from a client in
  which the client may have an interest?
options:
  - Immediately upon receiving the client's funds
  - As soon as practicable after receiving funds
  - Within 24 hours of receiving client funds
  - At the close of the real estate transaction
key: B
explanation: NRS 645.254(7) requires a licensee to account for money received from a client in which
  the client may have an interest as soon as practicable. Requiring immediate accounting is stricter
  than the rule, specifying a 24‑hour deadline adds a time frame not present in the statute, and
  waiting until the close of the transaction delays accounting beyond what the rule allows.
