stem: A licensee terminates a brokerage agreement with a buyer and, eight months later, shares the
  buyer's confidential financial information with a third party after obtaining the buyer's written
  permission. According to Nevada law, is the licensee permitted to disclose the information?
options:
  - The licensee is not permitted to disclose the information because sharing confidential
    information with a third party is prohibited.
  - The licensee is permitted to disclose the information because eight months exceeds the required
    confidentiality period.
  - The licensee is not permitted to disclose the information because the one‑year confidentiality
    period has not yet expired.
  - The licensee is permitted to disclose the information because the client gave written permission.
key: D
explanation: NRS 645.254(2) permits disclosure after termination if the client gives written
  permission, which overrides the one‑year confidentiality ban. The rationale that relies only on
  the eight‑month period overlooks this written‑permission exception.
