stem: A licensee’s brokerage agreement with a seller terminated on March 1, 2024. Assuming no court
  order or written permission, on what date may the licensee first disclose confidential information
  about the seller without violating Nevada law?
options:
  - March 1, 2025
  - February 28, 2025
  - March 2, 2024
  - March 1, 2026
key: A
explanation: The confidentiality duty lasts one year after termination; adding one year to March 1,
  2024 yields March 1, 2025. The distractors reflect errors such as subtracting a day, using the
  wrong year, or adding two years.
citation:
  source: Nev. Rev. Stat. § 645.254
  url: null
  quoted_text: Shall not disclose confidential information relating to a client for 1 year after the
    revocation or termination of the brokerage agreement, unless he or she is required to do so
    pursuant to an order of a court of competent jurisdiction or is given written permission to do
    so by the client;
