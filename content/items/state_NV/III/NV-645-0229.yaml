stem: A licensee discloses to both the buyer and seller that she is acting for both parties and has
  a conflict of interest. She does not obtain written consent from either party. According to Nevada
  law, may she continue to act as agent for both the buyer and the seller?
options:
  - She may continue to act as agent for both parties because disclosure alone satisfies the
    requirement.
  - She may not continue to act as agent for both parties until she obtains written consent from
    each party.
  - She may continue to act as agent for both parties if she informs her broker of the dual agency.
  - She may not continue to act as agent for both parties unless the buyer and seller are related by
    blood or marriage.
key: B
explanation: NRS 645.252(1)(d) requires written consent from each party before the licensee may
  continue to act after disclosing that she is acting for more than one party. Mere disclosure,
  informing the broker, or a familial relationship between the parties does not satisfy this
  requirement.
