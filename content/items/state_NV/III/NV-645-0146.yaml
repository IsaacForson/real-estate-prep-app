stem: Under Nevada law, what is the status of a waiver of a licensee's duties?
options:
  - The waiver is permitted if the client signs a written waiver
  - The waiver is prohibited under any circumstances
  - The waiver is allowed for property management agreements
  - The waiver is allowed when the licensee discloses the waiver to the broker
key: B
explanation: NRS 645.255 explicitly states that a waiver of duties of a licensee or property manager
  is prohibited. Therefore, any waiver of a licensee's duties is not permitted under Nevada law. The
  other options incorrectly suggest circumstances under which a waiver might be allowed.
