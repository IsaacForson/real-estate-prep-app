stem: A licensee receives a $2,000 property management fee from a landlord and deposits it into the
  broker's trust account. The licensee uses $300 of the fee to pay for advertising before providing
  any accounting to the landlord. According to Nevada law, what is the licensee's status regarding
  this use of funds?
options:
  - The licensee acted correctly because the amount used was less than 20% of the fee.
  - The licensee acted correctly because the advertising benefited the landlord's property.
  - The licensee acted correctly because the money remained in the trust account.
  - The licensee violated the duty to account as soon as practicable.
key: D
explanation: Using client funds before accounting breaches the duty to account as soon as
  practicable; the statute does not excuse the use because the funds stayed in trust, benefited the
  property, or were a small percentage.
citation:
  source: Nev. Rev. Stat. ch. 645 — Nevada Revised Statutes Chapter 645 — Real Estate Brokers and
    Salespersons (rev. 4/15/2026, through 2025 session), official Nevada Legislature page read via
    Internet Archive capture of 2026-04-22 because leg.state.nv.us returns Cloudflare 403 to scripts
    — § 645.254
  url: null
  quoted_text: Shall account for all money and property the licensee receives in which the client may
    have an interest as soon as is practicable.
  secondary: []
math:
  worked_solution: Total fee = $2,000. Amount used for advertising = $300. Percentage used = ($300 /
    $2,000) × 100 = 15%. Remaining amount in trust = $2,000 - $300 = $1,700.
  formulas:
    - Percentage used = (Amount used / Total fee) × 100
    - Remaining amount = Total fee - Amount used
