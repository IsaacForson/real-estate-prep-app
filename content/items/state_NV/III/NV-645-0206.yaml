stem: According to Nevada law, what is the broker's responsibility when assigning two licensees from
  the same firm to represent the buyer and seller in a residential transaction?
options:
  - The broker need not obtain written consent from the parties for the licensees to act
  - The broker must obtain written consent from both parties before the licensees may act
  - The broker must ensure the licensees present all offers made to or by the client
  - The broker must disclose each licensee's interest in the transaction to the parties
key: A
explanation: The broker does not need to obtain written consent when assigning two licensees from
  the same firm to represent the buyer and seller, as NRS 645.253 provides that licensees assigned
  to separate parties are not required to obtain the written consent otherwise mandated by NRS
  645.252(1)(d). Requiring written consent in this situation is incorrect.
