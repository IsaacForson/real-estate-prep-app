stem: A licensee receives a $3,000 earnest money deposit from a buyer and deposits it into the
  broker's trust account. Two weeks later, the licensee uses $500 of the deposit to pay for online
  advertising for the property. According to NRS 645.254(7), what is the licensee's status regarding
  this use of funds?
options:
  - The licensee's use of the funds is permitted because the licensee disclosed the use to the buyer.
  - The licensee's use of the funds is permitted because the money was deposited in a trust account.
  - The licensee's use of the funds is permitted because the amount used is less than 10% of the
    deposit.
  - The licensee's use of the funds is prohibited because the licensee failed to account for the
    money as soon as practicable.
key: D
explanation: "The licensee's use of the funds is prohibited because the licensee failed to account
  for the money as soon as practicable, which violates NRS 645.254(7). The other options are
  incorrect: disclosing the use to the buyer does not make the use permissible; merely depositing
  the funds in a trust account does not satisfy the accounting requirement; and the amount used
  being less than 10% of the deposit does not excuse the failure to account."
citation:
