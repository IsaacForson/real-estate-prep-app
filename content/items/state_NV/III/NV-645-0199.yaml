stem: A licensee terminates a brokerage agreement with a landlord on March 10, 2024. On March 11,
  2025, the licensee discloses the landlord's confidential rental rate to a neighbor without the
  landlord's permission or a court order. According to Nevada law, is the licensee permitted to make
  this disclosure?
options:
  - No, because less than two years have passed since the agreement ended
  - Yes, because the one-year confidentiality period has expired
  - No, because the licensee must obtain written permission from the landlord regardless of time
  - Yes, because the disclosure was made to a neighbor rather than a friend or family member
key: B
explanation: Under Nevada law, a licensee may not disclose confidential client information for one
  year after termination of a brokerage agreement unless required by court order or with client
  permission. Since the disclosure occurred on March 11, 2025, one day after the one‑year period
  ended on March 10, 2025, the licensee is permitted to disclose the rental rate.
citation:
  source: Nev. Rev. Stat. ch. 645 § 645.254
  url: null
  quoted_text: Shall not disclose confidential information relating to a client for 1 year after the
    revocation or termination of the brokerage agreement, unless he or she is required to do so
    pursuant to an order of a court of competent jurisdiction or is given written permission to do
    so by the client;
