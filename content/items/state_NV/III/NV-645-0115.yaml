stem: A licensee terminates a brokerage agreement with a seller and, six months later, shares the
  seller's confidential financial information with a friend without the seller's permission.
  According to Nevada law, what is the licensee prohibited from doing?
options:
  - The licensee must not disclose the seller's confidential information for one year after
    termination unless the seller gives written permission or a court orders disclosure.
  - The licensee must not disclose the seller's confidential information only if the brokerage
    agreement is still active.
  - The licensee must not disclose the seller's confidential information for six months after
    termination regardless of permission.
  - The licensee must not disclose the seller's confidential information unless the buyer also
    consents to the disclosure.
key: A
explanation: NRS 645.254(2) prohibits a licensee from disclosing confidential client information for
  one year after the brokerage agreement ends, unless the client gives written permission or a court
  orders disclosure. The statement that the duty applies only while the brokerage agreement is still
  active is incorrect because the prohibition lasts for one year after termination.
