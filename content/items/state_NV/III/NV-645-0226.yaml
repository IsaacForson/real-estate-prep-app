stem: If a client presents a signed waiver attempting to release a licensee from duties under a
  brokerage agreement, what is the licensee's obligation under Nevada law?
options:
  - Ignore the waiver and continue to perform all duties
  - Seek a court order to validate the waiver
  - Report the waiver to the Nevada Real Estate Division for approval
  - Accept the waiver and proceed without the duty
key: A
explanation: NRS 645.255 states that a waiver of duties of licensee or property manager is
  prohibited, meaning any such waiver is void and unenforceable. Therefore the licensee must ignore
  the waiver and continue to perform all duties owed to the client. The other options incorrectly
  suggest the waiver has effect or requires external validation.
