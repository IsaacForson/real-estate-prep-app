stem: A broker assigns one licensee to represent the buyer and another licensee from the same
  brokerage to represent the seller in a residential transaction. According to Nevada law, what is
  required regarding the licensees' duty to obtain written consent for acting for more than one
  party?
options:
  - They are not required to obtain written consent from either party
  - They must obtain written consent from both the buyer and the seller
  - They must obtain written consent only from the buyer
  - They must obtain written consent only from the seller
key: A
explanation: NRS 645.253 provides that when a broker assigns different licensees from the same
  brokerage to separate parties in a transaction, the licensees are not required to obtain the
  written consent otherwise required for dual agency under NRS 645.252. Therefore, no written
  consent is needed from either party. The other options incorrectly impose a consent requirement
  that the statute exempts.
