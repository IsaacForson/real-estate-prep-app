stem: "A licensee employed by XYZ Brokerage represents both the buyer and the seller in a
  residential sale. According to Nevada law, before continuing to act as agent for both parties, the
  licensee must:"
options:
  - Written consent from the buyer only, as required by law
  - Written consent from the seller only, as required by law
  - Written consent from both the buyer and the seller, as required
  - Disclosure of the dual agency to both parties without obtaining consent
key: C
explanation: NRS 645.252(1)(d) mandates written consent from each party when a licensee acts for
  more than one party, unless an exception under NRS 645.253 applies. The exception applies only
  when different licensees from the same brokerage represent separate parties, not when the same
  licensee represents both parties. Therefore, written consent from both buyer and seller is
  required.
