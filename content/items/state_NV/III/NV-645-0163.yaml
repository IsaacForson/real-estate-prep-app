stem: Under Nevada law, for how long must a licensee refrain from disclosing confidential
  information relating to a client after the revocation or termination of a brokerage agreement?
options:
  - The licensee must refrain from disclosing confidential information for 2 years after termination
  - The licensee must refrain from disclosing confidential information for 6 months after termination
  - The licensee must refrain from disclosing confidential information for 1 year after termination
  - The licensee must refrain from disclosing confidential information indefinitely after termination
key: C
explanation: NRS 645.254(2) requires a licensee to keep client information confidential for one year
  after the brokerage agreement ends, unless a court orders disclosure or the client gives written
  permission. The six‑month option contradicts the statutory period.
