  - Two years
  - One year
  - Five years
key: C
explanation: The statute states that a licensee shall not disclose confidential information for 1
  year after revocation or termination of the brokerage agreement, unless a court order or client
  permission applies. Therefore the correct duration is one year. The six‑month and two‑year options
  are incorrect because they do not match the statutory period.
