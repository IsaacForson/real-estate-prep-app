stem: According to Nevada law, for how long must a licensee refrain from disclosing confidential
  information relating to a client after the termination of a brokerage agreement?
options:
  - One year period
  - Six months period
  - Indefinitely period
  - Two years period
key: A
explanation: NRS 645.254(2) requires a licensee to refrain from disclosing a client's confidential
  information for one year after the termination of a brokerage agreement. Therefore, the correct
  duration is one year. The distractor 'Six months period' is incorrect because the statute
  specifies a one‑year period, not six months.
