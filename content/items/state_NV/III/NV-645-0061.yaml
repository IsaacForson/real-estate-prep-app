stem: According to Nevada law, what is meant by the term 'agency' in the context of real estate
  brokerage?
options:
  - A relationship between a principal and an agent arising out of a brokerage agreement or property
    management agreement whereby the agent is engaged to do certain acts on behalf of the principal
    in dealings with a third party.
  - A relationship arising solely from negotiations or communications with a client of another
    broker, provided the broker has given written permission for such interaction. even though such
    interaction does not create an agency relationship under Nevada law.
  - A relationship where the licensee represents multiple parties in the same transaction without
    first securing the written consent required by Nevada law. which constitutes undisclosed dual
    agency and is prohibited.
  - A relationship where the licensee is also a principal in the transaction and holds an interest
    adverse to the client's position. which violates the duty of loyalty and is prohibited.
key: A
explanation: NRS 645.0045(1) defines agency as a relationship between a principal and an agent
  arising from a brokerage or property management agreement where the agent acts on the principal’s
  behalf with third parties. The definition excludes relationships that arise solely from
  negotiations with another broker’s client, even with written permission, which is why the
  distractor describing such a scenario is incorrect.
