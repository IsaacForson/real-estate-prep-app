stem: A licensee represents a buyer and will receive a commission from the seller and a referral fee
  from a mortgage broker. According to NRS 645.252(1)(b), what must the licensee disclose?
options:
  - Disclosing the commission from the seller in the transaction
  - Disclosing the referral fee from the mortgage broker in the transaction
  - Disclosing both the commission and the referral fee in the transaction
  - Disclosing no compensation because the buyer is the client
key: C
explanation: The rule requires disclosure of each source from which the licensee will receive
  compensation as a result of the transaction. Therefore, both the seller‑paid commission and the
  mortgage‑broker referral fee must be disclosed. The distractor that suggests no disclosure is
  needed ignores the requirement to reveal all compensation sources.
