stem: Under Nevada law, which of the following is a required disclosure that a licensee must make to
  each party to a real estate transaction as soon as practicable?
options:
  - The licensee's social security number
  - The licensee's favorite color
  - Material facts about the property
  - The licensee's marital status
key: C
explanation: NRS 645.252(1)(a) requires licensees to disclose any material and relevant facts about
  the property to each party as soon as practicable. The licensee's marital status is personal
  information not mandated by this disclosure rule.
