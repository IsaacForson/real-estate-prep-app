stem: Under Nevada law, a licensee is **NOT** required to comply with which of the following?
options:
  - Fiduciary duties to clients
  - Disclosure of material facts
  - Certain principles of common law
  - Statutory licensing requirements
key: C
explanation: Under NRS 645.251, a licensee is not required to comply with certain principles of
  common law. Therefore the correct answer is the option stating that a licensee is not required to
  comply with certain principles of common law. Options concerning fiduciary duties to clients,
  disclosure of material facts, and statutory licensing requirements describe duties that licensees
  must still fulfill under Nevada statutes and rules.
