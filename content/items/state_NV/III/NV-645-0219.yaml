stem: According to NRS 645.257, what type of action may be brought against a licensee who fails to
  perform certain duties?
options:
  - An action to recover damages
  - An action for specific performance
  - An action for injunctive relief
  - An action for declaratory judgment
key: A
explanation: The statute explicitly states that an action to recover damages may be brought for
  failure to perform certain duties. The most tempting distractor, an action for specific
  performance, is incorrect because the statute provides only for damages, not equitable relief.
