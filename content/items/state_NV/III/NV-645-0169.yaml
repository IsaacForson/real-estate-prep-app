stem: A licensee ends a brokerage agreement with a seller on July 10, 2023. The licensee waits until
  July 11, 2024 to share the seller's confidential closing statement with a family member, without
  the seller's permission or a court order. According to Nevada law, is the licensee allowed to
  disclose the information?
options:
  - No, because the licensee must obtain written permission regardless of time.
  - Yes, because the one-year confidentiality period has expired.
  - No, because disclosure to a family member is prohibited.
  - Yes, but only if the licensee first notifies the broker.
key: B
explanation: Under Nev. Rev. Stat. § 645.254, a licensee shall not disclose confidential information
  relating to a client for 1 year after the revocation or termination of the brokerage agreement,
  unless required by court order or given written permission by the client. The one-year period ends
  on July 10, 2024; a disclosure on July 11, 2024 occurs after that date, so the statutory
  prohibition no longer applies. The assertion that written permission is always needed overlooks
  the automatic expiration of the confidentiality duty after one year.
