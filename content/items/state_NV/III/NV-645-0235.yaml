stem: According to Nevada law, what must a licensee do with money received from a client in which
  the client may have an interest?
options:
  - The licensee must place the money in an interest-bearing account.
  - The licensee must obtain the client's written permission before using the money.
  - The licensee must account for the money as soon as practicable.
  - The licensee must hold the money for at least 30 days before accounting.
key: C
explanation: The statute requires the licensee to account for client money as soon as practicable;
  the other options add requirements not found in the law.
