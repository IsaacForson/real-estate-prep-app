stem: A licensee discloses to both buyer and seller that he or she is acting for more than one party
  in a transaction. Before continuing to act as an agent, what must the licensee do according to
  Nevada law?
options:
  - The licensee must obtain the written consent of each party to the transaction for whom the
    licensee is acting.
  - The licensee must obtain only the verbal consent of each party to the transaction, and must
    document this consent in writing.
  - The licensee must disclose the dual agency to the broker supervising the licensee, and must
    refrain from acting until the broker provides further instructions.
  - The licensee must provide each party with a copy of the brokerage agreement, and must obtain
    written acknowledgment of receipt from each party.
key: A
explanation: NRS 645.252(1)(d) requires a licensee who discloses acting for more than one party to
  obtain the written consent of each party before continuing to act as an agent. The correct answer
  states that the licensee must obtain the written consent of each party to the transaction for whom
  the licensee is acting. The alternative that suggests only verbal consent, even if later
  documented, is incorrect because the law requires written consent.
