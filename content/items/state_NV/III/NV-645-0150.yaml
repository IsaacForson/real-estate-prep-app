stem: A licensee terminates a brokerage agreement with a seller and, fourteen months later, shares
  the seller's confidential financial information with a friend without the seller's permission.
  According to Nevada law, is the licensee permitted to make this disclosure?
options:
  - The disclosure is permitted because fourteen months exceeds the one‑year confidentiality period.
  - The disclosure is permitted because the information was shared with a friend, not a colleague.
  - The disclosure is not permitted because the licensee did not obtain written permission from the
    seller.
  - The disclosure is not permitted because fourteen months is still within the one‑year period.
key: A
explanation: NRS 645.254(2) prohibits a licensee from disclosing confidential client information for
  one year after the brokerage agreement ends, unless the client gives written permission or a court
  order requires disclosure. Because fourteen months have passed since the agreement ended, the
  one‑year period has expired, so the licensee is permitted to share the information.
