stem: A licensee terminated a brokerage agreement with a client on June 15, 2023. On July 20, 2024,
  the licensee discloses the client's confidential financial details to a colleague without the
  client's permission or a court order. According to Nevada law, is the licensee's disclosure
  permissible?
options:
  - Yes, because more than one year has passed since the agreement ended.
  - No, because less than six months have elapsed since termination.
  - Yes, because the client gave written permission for the disclosure.
  - No, because the disclosure occurred prior to the one‑year period ending.
key: A
explanation: Under Nev. Rev. Stat. § 645.254(2), a licensee must not disclose confidential client
  information for one year after the brokerage agreement is terminated, unless required by a court
  order. The disclosure on July 20, 2024 occurred more than one year after the June 15, 2023
  termination, so the confidentiality prohibition no longer applies. Therefore, the disclosure is
  permissible absent a court order or client permission. The statement that more than one year has
  passed since the agreement ended correctly reflects this rule. The claim that less than six months
  have elapsed is incorrect because the elapsed time exceeds one year. The claim that the client
  gave written permission is unsupported by the facts. The claim that the disclosure occurred prior
  to the one‑year period ending is also incorrect because the disclosure happened after that period.
