stem: A licensee asks a buyer to sign a waiver releasing the licensee from the duty to present all
  offers. According to Nevada law, is the licensee permitted to have the buyer sign such a waiver?
options:
  - Yes, but only if the waiver is on a Division form.
  - Yes, if the buyer voluntarily agrees to the waiver.
  - No, because waivers of licensee duties are prohibited.
  - No, unless the broker approves the waiver in writing.
key: C
explanation: NRS 645.255 states that a waiver of duties of licensee or property manager is
  prohibited, so the licensee may not obtain such a waiver. The distractor suggesting the waiver is
  allowed if the buyer agrees voluntarily contradicts the outright prohibition.
