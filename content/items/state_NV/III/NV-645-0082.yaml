stem: Under Nevada law, what does a brokerage agreement **NOT** include?
options:
  - A property management agreement for residential real estate
  - A written contract between a client and a broker for real estate
  - Valuable consideration for assisting in real estate sales
  - Assistance with the lease or rental of real property
key: A
explanation: The statute defines a brokerage agreement as a written contract for valuable
  consideration in real estate transactions and explicitly states that the term does not include a
  property management agreement. Therefore, a property management agreement is not part of a
  brokerage agreement. The other options describe elements that are included in the definition of a
  brokerage agreement.
