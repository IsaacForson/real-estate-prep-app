stem: When does the one-year prohibition on disclosing a client's confidential information begin
  under Nevada law?
options:
  - Upon the first communication with the client after the termination.
  - At the moment the brokerage agreement is signed by both parties.
  - After the licensee receives written permission from the client.
  - Immediately after the brokerage agreement is revoked or terminated.
key: D
explanation: NRS 645.254(2) states that a licensee shall not disclose confidential information for 1
  year after the revocation or termination of the brokerage agreement, so the prohibition starts
  right after the agreement ends. The option stating that the period begins at signing is incorrect
  because the confidentiality duty arises only after the relationship terminates.
