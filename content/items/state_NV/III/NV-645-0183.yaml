stem: Who is considered the principal in an agency relationship?
options:
  - The client for whom the agent acts
  - The broker who receives compensation from the client
  - The third party involved in the transaction
  - The licensee who discloses confidential information
key: A
explanation: NRS 645.0045 defines agency as a relationship where the agent acts on behalf of the
  principal, making the client the principal. The broker acts as the agent, not the principal, so
  the option describing the broker as the principal is incorrect.
