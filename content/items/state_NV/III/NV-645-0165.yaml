stem: A licensee terminates a brokerage agreement with a seller and, eighteen months later, shares
  the seller's confidential closing statement with a friend without the seller's permission.
  According to Nevada law, is the licensee permitted to disclose the confidential information?
options:
  - The licensee's disclosure is prohibited because licensees should not disclose confidential
    information
  - The licensee's disclosure is prohibited because a court order is required even after one year
  - The licensee's disclosure is permitted because the client gave verbal permission earlier
  - The licensee's disclosure is permitted because the one‑year confidentiality period has expired
key: D
explanation: After one year the statutory confidentiality duty ends unless a court orders disclosure
  or the client provides written permission; eighteen months exceeds this limit and no exception is
  invoked, so the disclosure is allowed. The option stating that licensees should not disclose
  confidential information incorrectly treats the duty as permanent.
