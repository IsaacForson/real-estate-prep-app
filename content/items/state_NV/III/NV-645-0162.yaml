stem: A licensee represents a buyer in a transaction and will receive a commission from the seller.
  According to Nevada law, when must the licensee disclose this source of compensation to the buyer?
options:
  - The licensee must disclose the compensation source as soon as practicable.
  - The licensee must disclose the compensation source only at closing.
  - The licensee must disclose the compensation source only if the buyer asks.
  - The licensee must not disclose the compensation source.
key: A
explanation: NRS 645.252(1)(b) requires the licensee to disclose each source of compensation as soon
  as practicable. Stating that disclosure may wait until closing does not satisfy that requirement.
