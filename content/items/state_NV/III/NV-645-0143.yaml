stem: According to NRS 645.0045, which of the following is **NOT** included in the definition of agency?
options:
  - A relationship arising solely from negotiations with a client of another broker with written
    permission
  - A relationship arising from a brokerage agreement whereby the agent acts on behalf of the
    principal
  - A relationship arising from a property management agreement whereby the agent acts on behalf of
    the principal
  - A relationship whereby the agent acts on behalf of the principal in dealings with a third party
key: A
explanation: The statute explicitly states that the term 'agency' does not include a relationship
  arising solely from negotiations or communications with a client of another broker when the broker
  has given written permission. The other options describe relationships that are included in the
  definition of agency.
