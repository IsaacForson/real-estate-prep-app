stem: According to Nevada law, what constitutes an agency relationship in real estate?
options:
  - A relationship between a principal and an agent arising from a brokerage or property management
    agreement whereby the agent acts on behalf of the principal in dealings with a third party.
  - A relationship based solely on an oral agreement between a broker and a client to assist in the
    sale of real property, without any written brokerage agreement, and is not recognized as an
    agency under Nevada statutes.
  - A relationship arising solely from negotiations or communications with a client of another
    broker with the written permission of the broker, and does not involve a brokerage agreement,
    and is not considered an agency under Nevada law.
  - A relationship where the agent acts independently of the principal in dealings with third
    parties, without any brokerage agreement or property management agreement, and the principal
    retains no control over the agent's actions.
key: A
explanation: "The definition of agency in NRS 645.0045(1) is: a relationship between a principal and
  an agent arising out of a brokerage agreement or property management agreement whereby the agent
  is engaged to do certain acts on behalf of the principal in dealings with a third party. This
  matches the description that a relationship arises from a brokerage or property management
  agreement whereby the agent acts on behalf of the principal in dealings with a third party. The
  description that a relationship is based solely on an oral agreement between a broker and a client
  to assist in the sale of real property, without any written brokerage agreement, is not recognized
  as an agency under Nevada statutes."
