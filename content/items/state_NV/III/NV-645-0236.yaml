stem: A licensee receives a $1,500 earnest money deposit from a buyer and deposits it into the
  broker's trust account. The licensee does not provide an accounting of the deposit to the buyer
  until 60 days later, after the transaction closes. According to Nevada law, what is the licensee's
  status regarding this delay?
options:
  - The licensee violated the duty to account as soon as practicable.
  - The licensee acted correctly because the funds were deposited in a trust account.
  - The licensee acted correctly because the accounting was provided before disbursement.
  - The licensee acted correctly because the delay was less than 90 days.
key: A
explanation: The rule mandates accounting as soon as practicable; a 60‑day delay after closing fails
  that standard, making it a violation. The distractors incorrectly justify the delay based on trust
  deposit, timing before disbursement, or an arbitrary length.
