stem: According to Nevada law, a licensee must disclose to each party to a real estate transaction
  any material and relevant facts relating to the property as soon as practicable.
options:
  - Any material and relevant facts relating to the property as soon as practicable.
  - Any material and relevant facts relating to the property only after the transaction closes.
  - Any material and relevant facts known only to the licensee's broker.
  - Any material and relevant facts that are publicly available.
key: A
explanation: Nev. Rev. Stat. § 645.252(1)(a) requires a licensee to disclose any material and
  relevant facts relating to the property as soon as practicable. The option stating that disclosure
  should occur only after the transaction closes contradicts this requirement, as it delays
  disclosure beyond the practicable timeframe.
