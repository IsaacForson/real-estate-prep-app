stem: A licensee affiliated with a brokerage is assigned to represent the buyer in a residential
  transaction. According to Nevada law, to whom may the licensee disclose the buyer's confidential
  information?
options:
  - Only to the buyer's attorney
  - To the seller's agent
  - Only to the real estate broker
  - To any party the buyer negotiates with
key: C
explanation: Under Nev. Rev. Stat. § 645.253, a licensee may disclose a buyer’s confidential
  information only to the real estate broker. Sharing that information with any other party,
  including any party the buyer negotiates with, is prohibited.
