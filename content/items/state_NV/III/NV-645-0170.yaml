stem: According to NRS 645.0045(2), the term agency does **NOT** include a relationship arising
  solely from negotiations or communications with a client of another broker unless which of the
  following occurs?
options:
  - Written permission from the principal in the transaction
  - Written permission from the other broker
  - Written permission from the client of the other broker
  - Written permission from the division
key: B
explanation: The statute explicitly states that the term agency does not include such a relationship
  unless there is written permission of the broker. Therefore, written permission from the other
  broker removes the exclusion. The most tempting distractor, written permission from the client of
  the other broker, is incorrect because the permission must come from the broker, not the client.
