stem: A licensee discovers a roof leak during a property showing and informs the buyer's agent but
  does not yet inform the seller. According to Nevada law, when must the licensee disclose this
  material fact to the parties to the transaction?
options:
  - The licensee must disclose the material fact as soon as practicable.
  - The licensee must disclose the material fact immediately after discovering it.
  - The licensee must disclose the material fact before the purchase agreement is signed.
  - The licensee must disclose the material fact only if the buyer requests disclosure.
key: A
explanation: NRS 645.252(1)(a) requires a licensee to disclose any material and relevant facts about
  the property as soon as practicable. The correct answer reflects this timing standard. The
  distractor suggesting disclosure before the purchase agreement is signed is incorrect because the
  duty is not tied to that event; the licensee must disclose as soon as practicable, which may occur
  after signing if the defect is discovered later.
