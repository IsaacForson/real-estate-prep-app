stem: Under Nevada law, what is the effect of a client's signed waiver that attempts to release a
  licensee from duties under a brokerage agreement?
options:
  - A valid waiver releasing the licensee from duties
  - A waiver that is enforceable after Division approval
  - A prohibited waiver that has no legal effect
  - A valid waiver for duties other than presenting offers
key: C
explanation: Nevada law prohibits a licensee from waiving any duties under a brokerage agreement;
  any such waiver is void and unenforceable. Therefore, a claim that a waiver releasing the licensee
  from duties is valid is incorrect.
