stem: According to Nevada law, what is a brokerage agreement?
options:
  - A brokerage agreement is a written contract between a client and a broker in which the broker
    agrees to accept valuable consideration from the client or another person for assisting,
    soliciting or negotiating the sale, purchase, option, rental or lease of real property, or the
    sale, exchange, option or purchase of a business.
  - A brokerage agreement is a written contract between a client and a broker in which the broker
    agrees to accept valuable consideration for managing residential properties and collecting rent
    on behalf of the owner.
  - A brokerage agreement is a written contract between a client and a broker in which the broker
    agrees to accept valuable consideration for providing legal advice and preparing closing
    documents for the transaction.
  - A brokerage agreement is a written contract between a client and a broker in which the broker
    agrees to accept valuable consideration for assisting with the sale, purchase, option, rental or
    lease of real property only, and excludes any property management responsibilities.
key: A
explanation: NRS 645.005 defines a brokerage agreement as a written contract between a client and a
  broker where the broker agrees to accept valuable consideration for assisting, soliciting or
  negotiating the sale, purchase, option, rental or lease of real property, or the sale, exchange,
  option or purchase of a business. The option that limits the agreement to real property only and
  excludes business transactions is incorrect because the statute includes both real property and
  business transactions.
