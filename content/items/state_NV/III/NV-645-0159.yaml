stem: A licensee receives a report from a certified home inspector stating that the roof is in good
  condition. Under Nevada law, unless the licensee has otherwise agreed in writing, what is the
  licensee's duty regarding verifying the inspector's statement?
options:
  - must obtain a second opinion from another certified inspector
  - must independently verify the accuracy of the inspector's statement
  - may rely on the inspector's statement without independent verification
  - must disregard the inspector's statement as inadmissible
key: C
explanation: NRS 645.252(4)(a) states that, unless otherwise agreed in writing, a licensee owes no
  duty to independently verify the accuracy of a statement made by a certified inspector. Therefore
  the licensee may rely on the inspector’s statement without independent verification. The
  distractor that requires independent verification contradicts the statutory exemption unless a
  written agreement exists.
