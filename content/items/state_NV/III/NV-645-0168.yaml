stem: A licensee terminates a brokerage agreement with a landlord on March 1, 2024. On January 15,
  2025, the licensee discloses the landlord's confidential rental rate to a prospective tenant
  without the landlord's permission or a court order. According to Nevada law, is the licensee
  permitted to make this disclosure?
options:
  - Yes, because the one-year confidentiality period expired on March 1, 2025.
  - No, because the disclosure occurs within the one-year confidentiality period.
  - Yes, because the disclosure was made to a prospective tenant rather than a competitor.
  - No, because the licensee is prohibited from disclosing information for two years.
key: B
explanation: The one-year confidentiality period runs from March 1, 2024 to March 1, 2025; a
  disclosure on January 15, 2025 falls within that window and is therefore prohibited. The claim
  that nine months is enough ignores the statutory requirement of a full year before disclosure is
  allowed.
citation:
