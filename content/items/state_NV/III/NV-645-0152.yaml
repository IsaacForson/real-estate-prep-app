stem: A licensee receives an earnest money deposit from a buyer and deposits it into the broker's
  trust account. Three days later, the licensee uses part of that money to pay personal expenses.
  According to Nevada law, what is the licensee prohibited from doing?
options:
  - Using trust funds for personal expenses
  - Failing to deposit earnest money in trust account
  - Not informing the buyer about the deposit
  - Keeping the earnest money in the broker's operating account
key: A
explanation: NRS 645.254(7) obligates licensees to account for all client-related money as soon as
  practicable. Using trust funds for personal expenses violates this accounting duty. Failing to
  deposit the earnest money, while problematic, is not directly addressed by the accounting
  requirement in this subsection.
