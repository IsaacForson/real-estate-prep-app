stem: Under Alaska Stat. § 08.88.341, which of the following is required for any real estate listing
  contract?
options:
  - Must be in writing and signed by the broker or associated licensee and the client.
  - Must include a definite expiration date for the agreement.
  - Must be notarized and filed with the commission before any showing occurs.
  - Must be recorded with the borough recorder's office within ten days of signing.
key: A
explanation: The statute requires that all real estate listings or management contracts be in
  writing and signed by the broker or associated licensee and the client. A definite expiration date
  is required only for exclusive listings, not all listings. Notarization and recording are not
  mandated by this statute.
citation:
  source: "### Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
    Brokers and Other Licensees (2025) — § 08.88.341"
  url: null
  quoted_text: All real estate listings or management contracts must be in writing and must be signed
    by the broker or associated licensee of the broker and by the client or an authorized
    representative of the client for whose benefit the real estate licensee will act.
