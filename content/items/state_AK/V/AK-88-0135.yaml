stem: A broker signs a written personal services contract with a property owner to locate a tenant
  for a residential unit. The broker shows the unit to several prospects, and one prospect signs a
  one-year lease. The property owner later refuses to pay the broker, arguing that the lease term
  was shorter than expected. Under Alaska Statute § 08.88.361, is the broker entitled to a
  commission?
options:
  - No, because a commission is only earned upon closing of a sale, even if a lease was signed
  - No, because the lease term was shorter than anticipated, even though the broker performed the
    service
  - Yes, because the broker fulfilled the contract terms by procuring a tenant who signed a lease
  - No, because the owner did not receive rent, despite the broker securing a tenant
key: C
explanation: Under § 08.88.361, a commission is earned when the broker fulfills the terms of a
  written personal services contract; locating a tenant who signs a lease satisfies the contract
  terms, so the broker has earned the commission regardless of lease length or owner’s objections.
