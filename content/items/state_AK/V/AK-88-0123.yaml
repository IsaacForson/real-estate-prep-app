stem: A broker has an exclusive listing contract for a residential property that does not specify an
  expiration date. Under Alaska Statute § 08.88.341, what is the status of this contract?
options:
  - The contract is invalid only if the property is commercial
  - The contract is valid if the broker and client agree to an expiration date later
  - The contract is invalid because exclusive listings must have a definite expiration date
  - The contract is valid because it is in writing and signed by the parties
key: C
explanation: Alaska Statute § 08.88.341 requires that every real estate exclusive listing or
  management contract include a definite expiration date. Since the contract in question lacks any
  expiration date, it does not satisfy this statutory requirement and is therefore invalid. The
  option suggesting the contract could become valid if the broker and client later agree on an
  expiration date is incorrect because the statute does not permit curing a missing expiration date
  by subsequent agreement; the date must be present in the original contract.
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
