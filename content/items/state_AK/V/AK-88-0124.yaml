stem: A broker and a client verbally agree to extend an existing exclusive listing contract for six
  months. Under Alaska Statute § 08.88.341, is this extension enforceable?
options:
  - The extension is invalid only if the original contract lacked an expiration date
  - The extension is valid if the broker documents the agreement in the file
  - The extension is invalid because renewal or extension must be in writing signed by the client
  - The extension is valid because both parties agreed to it
key: C
explanation: Alaska Statute § 08.88.341 requires that any renewal or extension of an exclusive
  listing contract be made in a written agreement signed by the client or the client’s authorized
  representative. Because the parties only agreed orally, the statutory writing requirement is not
  satisfied, so the extension is not enforceable. An answer that relies on merely documenting the
  oral agreement or on the parties’ mutual consent is therefore incorrect.
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
    Brokers and Other Licensees (2025) — § 08.88.341
  url: null
  quoted_text: All real estate exclusive listings or management contracts must have a definite
    expiration date that may be renewed or extended only by a written agreement signed by the client
    or the client's authorized representative.
