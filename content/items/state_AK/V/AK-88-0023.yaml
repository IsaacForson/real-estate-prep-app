stem: A licensee enters into an oral management contract with a property owner for six months. Under
  Alaska Stat. § 08.88.341, what is the status of this contract?
options:
  - The contract is enforceable because it was signed by both parties
  - The contract is enforceable because it includes a definite expiration date
  - The contract is not enforceable because the broker failed to disclose a conflict
  - The contract is not enforceable because it lacks a written agreement
key: D
explanation: The statute requires all real estate listings or management contracts to be in writing
  and signed by the broker and client. An oral management contract fails the writing requirement and
  is therefore not enforceable. The presence of a definite expiration date does not override the
  writing requirement.
citation:
  source: Alaska Stat. § 08.88.341
  url: null
  quoted_text: All real estate listings or management contracts must be in writing and must be signed
    by the broker or associated licensee of the broker and by the client or an authorized
    representative of the client for whose benefit the real estate licensee will act.
