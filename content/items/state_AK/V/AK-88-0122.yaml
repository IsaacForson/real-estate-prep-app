stem: Under Alaska Stat. § 08.88.660(c), after termination of a licensee relationship, which duty
  continues?
options:
  - The licensee must account for all money and other property received during the relationship.
  - The licensee must continue to seek additional buyers or lessees for the client.
  - The licensee must disclose confidential information to the client upon request.
  - The licensee must advise the client to obtain expert advice on unrelated matters.
key: A
explanation: "Alaska Stat. § 08.88.660(c) provides that when a licensee relationship ends, the
  licensee’s duties cease except for two specific obligations: (1) accounting for all money and
  other property received during the relationship, and (2) not disclosing confidential information.
  Consequently, the only duty that continues is the accounting duty. The statement that the licensee
  must disclose confidential information to the client upon request is incorrect because the statute
  expressly requires the licensee to keep such information confidential after termination."
citation:
  source: "### Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
    Brokers and Other Licensees (2025) — § 08.88.660"
  url: null
  quoted_text: Except as otherwise agreed to in writing, a licensee does not owe a further duty to a
    buyer, lessee, seller, or lessor after termination of the licensee relationship, except for the
    duties of accounting for all money and other property received during the relationship and not
    disclosing confidential information.
