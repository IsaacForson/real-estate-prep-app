stem: Under Alaska Stat. § 08.88.361, a broker has a written personal services contract to locate a
  buyer for a seller’s property. The broker presents a qualified buyer, but the seller decides not
  to sell. Has the broker earned a commission?
options:
  - The broker has not earned a commission because the seller changed his mind
  - The broker has earned a commission because the contract terms were fulfilled
  - The broker has not earned a commission because the property did not sell
  - The broker has earned a commission only if a purchase agreement was signed
key: B
explanation: Under AS 08.88.361, a commission is earned when the broker fulfills the terms of a
  written personal services contract. Locating a qualified buyer fulfills the contract terms, so the
  commission is earned regardless of whether the sale closes. The distractors confuse commission
  earning with closing the transaction.
