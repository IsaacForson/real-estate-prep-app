stem: Under Alaska Stat. § 08.88.341, a broker signs an exclusive listing agreement that includes a
  definite expiration date but also states the agreement will automatically renew for another term
  unless either party gives written notice. Is this automatic renewal provision enforceable?
options:
  - The contract is valid because it includes a definite expiration date.
  - The contract is invalid because automatic renewal requires a written client agreement.
  - The contract is valid because the parties can opt out with notice.
  - The contract is invalid because it lacks a signed expiration date.
key: B
explanation: Section 08.88.341 requires that any renewal or extension of an exclusive listing must
  be by a written agreement signed by the client. An automatic renewal clause that does not require
  such a written agreement violates this rule. The option stating that the contract is valid because
  the parties can opt out with notice is incorrect because an opt‑out notice does not satisfy the
  statutory requirement for a signed written renewal agreement.
