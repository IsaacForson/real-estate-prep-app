stem: Under Alaska Stat. § 08.88.341, which of the following is required for a real estate listing
  contract to be valid?
options:
  - The contract must be in writing and signed by the broker and client
  - The contract must be verbal and witnessed by a third party
  - The contract must be notarized and filed with the state
  - The contract must be confirmed by email between parties
key: A
explanation: The statute requires all real estate listings or management contracts to be in writing
  and signed by the broker or associated licensee and by the client or an authorized representative.
  Therefore the choice stating that the contract must be in writing and signed by the broker and
  client is correct. The choice stating that the contract must be verbal and witnessed by a third
  party is incorrect because a verbal agreement does not satisfy the writing requirement.
