stem: Under Alaska Stat. § 08.88.600(5), a personal services contract includes which of the following?
options:
  - An oral showing arrangement
  - A verbal commission promise
  - A written listing agreement
  - A required disclosure statement
key: C
explanation: The statute defines a personal services contract as including a listing, a fee
  agreement, a management contract, or any other agreement for an agreed fee or commission; a
  written listing agreement fits this definition. An oral showing arrangement is not listed as a
  type of personal services contract under the statute.
