stem: Under Alaska Statute § 08.88.341, which of the following is required for any real estate
  listing or management contract?
options:
  - A contract that is in writing and signed by the broker or associated licensee and the client or
    client's authorized representative
  - A contract that includes a definite expiration date and is notarized, must be signed in the
    presence of a notary public, and must be filed with the local county recorder's office
  - A contract that is recorded with the Alaska Real Estate Commission, must be submitted
    electronically through the commission's portal, and must include a copy of the broker's license
  - A contract that is approved by the broker's managing broker, must be countersigned by the branch
    manager, and must be retained in the brokerage's compliance file for three years
key: A
explanation: The statute states that all real estate listings or management contracts must be in
  writing and must be signed by the broker or associated licensee and the client or an authorized
  representative of the client. This requirement applies to every listing or management contract,
  regardless of whether it is exclusive. The other options add conditions that are not mandated for
  all contracts.
