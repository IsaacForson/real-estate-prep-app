stem: Under Alaska Stat. § 08.88.361, a broker has a written personal services contract to find a
  tenant for a landlord’s rental property. The broker shows the property to a qualified prospective
  tenant, who signs a lease agreement with the landlord, but the tenant later decides not to move in
  and the lease is terminated before occupancy. Has the broker earned a commission?
options:
  - Yes, because the broker fulfilled the contract terms.
  - No, because the lease did not result in occupancy.
  - No, because the broker must ensure the tenant moves in.
  - Yes, but the landlord must actually receive the rent.
key: A
explanation: Under Alaska Stat. § 08.88.361, a commission is earned when the broker fulfills the
  terms of a written personal services contract. Securing a signed lease satisfies those terms, so
  the broker has earned the commission. The idea that the broker must ensure the tenant moves in is
  incorrect because the statute does not require occupancy or rent payment; performance is measured
  by fulfilling the contract terms.
