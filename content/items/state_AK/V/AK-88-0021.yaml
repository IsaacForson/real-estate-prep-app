stem: Under Alaska Statute § 08.88.660, when does a licensee’s relationship with a buyer begin if
  the licensee shows the property to the buyer but no written agreement exists?
options:
  - The relationship begins when the licensee first meets the buyer
  - The relationship begins when the licensee shows the property to the buyer
  - The relationship begins when a written agreement is signed
  - The relationship begins when the buyer makes an offer
key: B
explanation: The statute states that a licensee relationship begins when the licensee represents or
  provides specific assistance; showing property qualifies as specific assistance, so the
  relationship starts at that point. The distractor claiming the relationship begins at first
  meeting is wrong because mere meeting does not constitute representation or specific assistance
  under the statute.
