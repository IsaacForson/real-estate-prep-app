stem: A licensee orally agrees with a seller to find a buyer and successfully does so, but there is
  no written personal services contract. Under Alaska Stat. § 08.88.361, is the licensee entitled to
  a commission?
options:
  - The licensee is not entitled to commission because no written personal services contract existed
  - The licensee is not entitled to commission because the licensee did not disclose a conflict
  - The licensee is entitled to commission because the seller orally agreed to pay
  - The licensee is entitled to commission because the seller benefited from the service
key: A
explanation: The statute states that a commission is earned only when the broker fulfills the terms
  of a written personal services contract. Since no written contract exists, the licensee has not
  earned a commission regardless of the seller's benefit or oral agreement. Failure to disclose a
  conflict is unrelated to the commission entitlement under this provision.
