stem: Under Alaska Statute § 08.88.361, when is a real estate broker considered to have earned a
  commission?
options:
  - When the broker advertises the property in a local newspaper today
  - When the broker shows the property to a prospective buyer during an open house
  - When the broker fulfills the terms of a written personal services contract
  - When the broker prepares a purchase agreement for the client in writing
key: C
explanation: The statute states that a commission is earned when the broker fulfills the terms of a
  written personal services contract. The other options describe events that do not trigger
  commission earning under this provision.
