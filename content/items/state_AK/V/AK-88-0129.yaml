stem: A licensee begins managing a rental property for an owner without a prior written property
  management contract. Under 12 AAC 64.550(b), what is the status of this activity?
options:
  - Prohibited unless the licensee obtains verbal approval from the owner
  - Prohibited unless the licensee has been employed by the owner for at least six months
  - Prohibited unless a prior written property management contract is in place
  - Prohibited unless the licensee has completed a property management course
key: C
explanation: The regulation prohibits a licensee from conducting property management activity for
  another person without a prior written property management contract. The activity is not permitted
  even if the licensee is also the owner, as the rule applies regardless of ownership.
