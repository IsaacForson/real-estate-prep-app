stem: According to Alaska Statute § 08.88.600, which of the following is included in the definition
  of a personal services contract?
options:
  - A disclosure agreement form
  - A verbal showing agreement
  - An advertisement for services
  - A listing agreement
key: D
explanation: The statute defines a personal services contract as including a listing agreement, a
  fee agreement, a management contract, or any other agreement for an agreed fee or commission.
  Therefore, a listing agreement is correct. The distractor 'A verbal showing agreement' is
  incorrect because the definition does not cover mere verbal agreements to show property; it
  requires a listing, fee agreement, management contract, or similar agreement for an agreed fee.
