stem: When is a commission earned under Alaska law?
options:
  - When the broker fulfills the terms of a written personal services contract.
  - When the broker receives a verbal agreement from the client.
  - When the broker shows the property to a prospective buyer.
  - When the broker deposits earnest money into escrow.
key: A
explanation: A commission is earned only when the broker fulfills the terms of a written personal
  services contract. A verbal agreement, merely showing the property, or depositing earnest money do
  not meet the statutory requirement. (Alaska Stat. § 08.88.361)
