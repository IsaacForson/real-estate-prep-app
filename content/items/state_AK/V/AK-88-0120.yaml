stem: Under Alaska Stat. § 08.88.600, a licensee who provides specific assistance to a prospective
  buyer but has no written agreement, does the licensee represent the buyer?
options:
  - The licensee represents the buyer because providing specific assistance creates representation
    unless the parties agree otherwise in writing.
  - The licensee represents the buyer because a written personal services contract signed by both
    parties is required for representation to exist.
  - The licensee represents the buyer because a written disclosure of the agency relationship must
    be provided at the time specific assistance begins.
  - The licensee represents the buyer because a signed listing agreement must be present and
    delivered to the client for representation to arise.
key: A
explanation: Under § 08.88.600(a), a licensee who provides real estate services to one party
  represents that party unless the parties agree otherwise in writing. Providing specific assistance
  constitutes real estate services, so representation exists absent a written agreement. The
  distractor B incorrectly imposes a written contract requirement for representation, which the
  statute does not.
