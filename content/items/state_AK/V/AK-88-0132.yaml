stem: Under Alaska Stat. § 08.88.361, a broker has a written personal services contract to locate a
  buyer for a seller’s property. Despite diligent effort, the broker fails to produce any offers,
  and the seller later sells the property to a relative without the broker’s involvement. Has the
  broker earned a commission?
options:
  - The broker has not earned a commission because the broker did not fulfill the contract terms.
  - The broker has earned a commission because the contract required only diligent effort.
  - The broker has not earned a commission because the seller sold to a relative.
  - The broker has earned a commission because the seller sold the property.
key: A
explanation: Under Alaska Stat. § 08.88.361, a commission is earned only when the broker fulfills
  the terms of the written personal services contract. Because the broker did not produce any offers
  despite diligent effort, the contract terms were not satisfied, so no commission is earned. The
  statement that mere diligent effort fulfills the requirement is incorrect.
