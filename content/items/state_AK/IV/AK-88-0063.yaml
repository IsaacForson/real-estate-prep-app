stem: A buyer's offer is rejected by the seller, and the buyer requests the return of the earnest
  money deposit, but the buyer's check has not yet cleared the bank. Under 12 AAC 64.250, may the
  broker delay returning the deposit?
options:
  - Yes, the broker may delay the return until one business day after the buyer's check has cleared.
  - No, the broker must return the deposit within one hour regardless of whether the check has
    cleared.
  - Yes, the broker may keep the deposit permanently because the buyer's offer was rejected.
  - No, the broker must return the deposit only after the seller signs a written release form.
key: A
explanation: 12 AAC 64.250(7) permits a broker to delay returning a rejected buyer's deposit until
  one business day after the buyer's check has cleared, rather than refusing to return it.
