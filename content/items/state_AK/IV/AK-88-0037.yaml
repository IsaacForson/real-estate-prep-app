stem: Under AS 08.88.341, what is required of an exclusive real estate listing contract?
options:
  - It must include an oral extension clause the client approves verbally at each renewal date.
  - It must include an automatic renewal clause extending the contract term each year without new
    signatures.
  - It must include a definite expiration date renewable only by the client's signed written
    agreement.
  - It must include a variable expiration date the broker alone may adjust as needed.
key: C
explanation: AS 08.88.341 requires exclusive listings to have a definite expiration date that may be
  renewed or extended only by a written agreement signed by the client.
citation:
  source: Alaska Stat. § 08.88.341
  url: null
  quoted_text: All real estate exclusive listings or management contracts must have a definite
    expiration date that may be renewed or extended only by a written agreement signed by the client
    or the client's authorized representative.
