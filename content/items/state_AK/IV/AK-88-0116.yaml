stem: Under AS 08.88.041(b), if no eligible broker is available from the Second Judicial District,
  how many brokers must be appointed from the state at large?
options:
  - Two brokers
  - One broker
  - Three brokers
  - Four brokers
key: A
explanation: The statute states that if no eligible broker is available from the Second Judicial
  District, two licensed real estate brokers or associate brokers shall be appointed from the state
  at large. The distractor claiming only one broker is required contradicts the explicit requirement
  for two brokers.
