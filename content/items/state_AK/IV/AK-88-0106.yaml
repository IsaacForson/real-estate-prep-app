stem: A licensee has been on inactive status for 18 months and wishes to return to active practice.
  Under AS 08.88.251(c), what must the licensee do to reactivate the license?
options:
  - Submit a new application for initial licensure and retake the examination.
  - Apply for an active license and pay the required fees.
  - Complete 30 hours of continuing education and submit proof to the commission.
  - Wait until the inactive period reaches 24 months before applying.
key: B
explanation: The statute allows reactivation by applying for an active license and paying the
  required fees if the inactive period is less than 24 months. Submitting a new initial application,
  completing continuing education, or waiting until 24 months have passed are not required under
  this provision.
