stem: During an investigation, the department believes a licensee has violated this chapter and
  wants to issue an order to stop the prohibited practice. What must happen first under AS
  08.88.037(b)?
options:
  - Notify the licensee in writing of the violation
  - Obtain approval from a majority of commission members
  - Provide the licensee with a hearing within 30 days
  - File a lawsuit in superior court to stop the practice
key: B
explanation: AS 08.88.037(b) requires the department to notify all commission members and obtain a
  majority approval before it may issue an order to stop a violation; thus 'Obtain approval from a
  majority of commission members' is the necessary step. The distractor 'Provide the licensee with a
  hearing within 30 days' describes a later procedural step that occurs only after approval and
  after notice to the licensee.
