stem: Under AS 08.88.061, which of the following tasks may the commission assign to assistants?
options:
  - Set continuing education fees for licensees
  - Conduct criminal background checks on applicants
  - Issue licenses to applicants who meet the qualifications
  - Approve advertising materials for licensees
key: C
explanation: AS 08.88.061 authorizes the commission to assign assistants to issue licenses to
  qualified applicants, so 'Issue licenses to applicants who meet the qualifications' is a permitted
  duty. The distractor 'Set continuing education fees for licensees' is not listed among the
  assistants’ powers; fee‑setting remains a commission function.
