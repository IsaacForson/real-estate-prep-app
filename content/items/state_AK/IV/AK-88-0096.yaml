stem: According to AS 08.88.041(a), what is the minimum licensing experience required for the five
  broker members of the Real Estate Commission?
options:
  - At least twelve years
  - At least eleven years
  - At least three years
  - At least seven years
key: C
explanation: Under AS 08.88.041(a), five commission members must be brokers licensed for at least
  three years before appointment, making 'At least three years' the correct requirement. The
  distractor 'At least two years' is incorrect because the statute specifies a three‑year minimum,
  not two.
