stem: Under AS 08.88.361, when is a commission considered earned for a real estate broker?
options:
  - When the broker receives payment from the client for the transaction.
  - When the broker advertises the property in a newspaper or online.
  - When the broker lists the property for sale on the multiple listing service.
  - When the broker fulfills the terms of a written personal services contract.
key: D
explanation: The statute states that a commission is earned when the broker fulfills the terms of a
  written personal services contract. Receiving payment from the client is not the triggering event;
  the contract performance is.
