stem: A broker allows associate licensees to record transactions without ever reviewing the
  transaction files for completeness or confirming that required forms are on file. A complaint
  alleges inadequate supervision. Under 12 AAC 64.125, is the broker's practice adequate
  supervision?
options:
  - Yes, because adequate supervision is satisfied once a licensee is properly licensed and
    registered.
  - No, because adequate supervision includes reviewing files for completeness before recording.
  - No, because adequate supervision requires the broker to personally attend every transaction
    closing.
  - Yes, because adequate supervision only requires that office policies be communicated to
    licensees.
key: B
explanation: 12 AAC 64.125(b)(1) defines adequate supervision to include reviewing files for
  completeness and accuracy and ensuring required forms are on file before recording a transaction.
