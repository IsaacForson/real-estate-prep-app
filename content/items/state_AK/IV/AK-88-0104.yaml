stem: An unlicensed person who completed an auctioneering program that included a course on real
  estate sales at a state‑certified school wants to conduct a real estate auction. A licensed broker
  will supervise and be present during the auction. Under Alaska law, may the person conduct the
  auction?
options:
  - No, because the program must be approved by the Alaska Real Estate Commission
  - Yes, because both statutory conditions are satisfied
  - No, because the supervising broker must be present but need not supervise
  - No, because the person must be licensed to conduct any auction
key: B
explanation: Under AS 08.88.165, an unlicensed person may conduct a real estate auction if they have
  completed an auctioneering program at a state‑certified school that includes a real estate sales
  course and a licensed broker supervises and is present during the auction. The scenario satisfies
  both conditions, so the auction is allowed.
citation:
  source: Alaska Stat. § 08.88.165
  url: null
  quoted_text: Notwithstanding AS 08.88.161 , a person who is not licensed under this chapter may
    conduct an auction of real estate if (1) the person has completed an auctioneering program at a
    school certified by an agency of this or another state, and the program included a course on
    real estate sales; and (2) a real estate broker licensed under this chapter or an associate real
    estate broker licensed under this chapter supervises and is present during the auction.
