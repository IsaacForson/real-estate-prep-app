stem: The Real Estate Commission has seven members. At a meeting, four members attend, but they all
  represent only the First Judicial District. Does this meeting satisfy the quorum requirements
  under AS 08.88.051(b)?
options:
  - Yes, because the majority requirement is satisfied.
  - Yes, because at least two judicial districts are represented.
  - No, because only one judicial district is represented.
  - No, because the majority requirement is not satisfied.
key: C
explanation: Quorum requires both representation from at least two judicial districts and a majority
  of members present. Although four members (a majority) attend, they represent only one district,
  so the quorum is not met. The distractor that focuses solely on the majority being satisfied
  ignores the district representation requirement.
