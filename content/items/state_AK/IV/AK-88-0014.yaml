stem: A real estate salesperson receives a referral fee from a mortgage broker for referring a
  client. Under Alaska law, may the salesperson accept this fee?
options:
  - The fee is permitted because the mortgage broker is licensed in another state.
  - The fee is permitted because the salesperson disclosed the referral to the employing broker.
  - The fee is not permitted because the fee must come from the employing broker.
  - The fee is permitted because the amount is less than $100.
key: C
explanation: Alaska law limits a real estate salesperson’s acceptance of fees or commissions to
  those received only from the salesperson’s employing broker. Consequently, a referral fee paid by
  a mortgage broker is not permissible, even if the salesperson disclosed the referral to the
  employing broker.
