stem: An Alaska licensee receives a commission from a transaction and wants to pay a referral fee to
  a licensed broker from Washington who assisted in finding a buyer. Under AS 08.88.401(e)(1), is
  this permissible?
options:
  - Yes, if the out-of-state licensee assisted in the act requiring a license
  - No, because payments to out-of-state licensees are prohibited
  - Yes, but only if the payment is less than half the commission
  - No, unless the out-of-state licensee is also licensed in Alaska
key: A
explanation: The statute permits a licensee to pay a person licensed in another jurisdiction if that
  person assisted the licensee in performing an act requiring a license. The other options
  incorrectly prohibit the payment or add unsupported conditions.
