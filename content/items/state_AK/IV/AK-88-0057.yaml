stem: During a commission investigation into a client complaint, a licensee tells the investigator a
  false version of events to make the complaint look unfounded. What is the regulatory consequence
  of this statement under 12 AAC 64.160?
options:
  - It is excused because investigations do not carry the same accuracy requirements as court
    testimony.
  - It is a private matter between the licensee and the client that the commission may not review.
  - It is grounds for suspension, revocation, or denial of the licensee's license.
  - It is grounds for a written warning only, with no effect on the licensee's license status.
key: C
explanation: 12 AAC 64.160(b) makes a false or misleading statement to the commission about an
  alleged violation grounds for suspension, revocation, or denial of a license.
citation:
  source: 12 Alaska Admin. Code § 64.160
  url: null
  quoted_text: Making a false or misleading statement to the commission regarding an alleged violation
    of AS 08.88 or the regulations set forth in this chapter or the qualifications of the licensee
    is grounds for suspension, revocation, or denial of a license.
