stem: Under AS 08.88.401(b)(2), an associate broker or real estate salesperson licensed in this
  state may accept a fee or commission for performance of an act requiring a license only from whom?
options:
  - The client directly
  - Another licensee in the same office
  - The real estate commission
  - The licensee's employing broker
key: D
explanation: The statute explicitly states that an associate broker or salesperson may accept a fee
  or commission only from the licensee's employing broker. The other options are incorrect because
  the law limits acceptance to the employing broker only.
