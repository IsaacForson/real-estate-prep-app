stem: A salesperson applies for a license transfer to a new broker on June 1 but has not yet
  received an amended license certificate from the commission. Under 12 AAC 64.075, how long may the
  salesperson work in the new broker's office while waiting?
options:
  - Indefinitely, as long as the transfer application remains pending with the commission.
  - Not at all, until the amended license certificate is physically received by the licensee.
  - Not more than 90 days while waiting for the amended license certificate.
  - Not more than 30 days while waiting for the amended license certificate.
key: D
explanation: 12 AAC 64.075(c) allows a licensee to work in the new employing broker's office for not
  more than 30 days while waiting for the amended license certificate.
