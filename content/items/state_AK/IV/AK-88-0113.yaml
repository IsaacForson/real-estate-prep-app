stem: Under 12 AAC 64.077(c), when the registered broker of an office notifies the commission in
  advance of an absence, who may sign for the broker of record on a license application?
options:
  - The broker or an associate broker designated to supervise during the absence
  - The salesperson assigned to the office for the broker of record
  - The client requesting the license application for the broker of record
  - The commission's designee reviewing the application for the broker of record
key: A
explanation: Under 12 AAC 64.077(c), only the broker or an associate broker designated by the
  registered broker to supervise transactions during the broker's absence may sign for the broker of
  record on a license application. The other individuals listed are not permitted to serve as
  signers under this rule.
