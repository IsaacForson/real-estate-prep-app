stem: A licensee who is representing the seller of a property shows the property to a prospective
  buyer who has expressed interest in purchasing it. The licensee has not obtained written consent
  to act as a neutral licensee. Under AS 08.88.610(b), is the licensee's action permissible?
options:
  - The licensee's action is impermissible because written consent to act as a neutral licensee must
    be obtained before showing the property to the buyer
  - The licensee's action is permissible because showing property to an interested buyer is allowed
    regardless of consent status
  - The licensee's action is impermissible, unless the buyer signs a purchase agreement before the
    showing
  - The licensee's action is permissible, provided the licensee later obtains written consent after
    the showing
key: A
explanation: Under AS 08.88.610(b), a licensee who represents the seller must obtain written consent
  to act as a neutral licensee before showing the property to a buyer who has expressed interest.
  Consequently, the statement that the action is permissible because showing the property is allowed
  regardless of consent is incorrect; the statute expressly requires prior written consent.
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
    Brokers and Other Licensees (2025) Sec. 08.88.610
  url: null
  quoted_text: (b) If preauthorization is not obtained under (a) of this section, when a buyer or
    lessee expresses an interest to the licensee in acquiring or leasing real estate and the
    licensee is representing the seller or lessor of the property, the licensee shall obtain written
    consent to act as a neutral licensee before the licensee shows the real estate.
