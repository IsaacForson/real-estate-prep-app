stem: A licensee representing a seller receives a written purchase offer at 9:00 a.m. but waits
  until 5:00 p.m. to present it to the seller, hoping a higher offer will arrive. Under AS
  08.88.615(a)(3), what is the licensee's obligation regarding the offer?
options:
  - The licensee must present the offer to the seller in a timely manner
  - The licensee may delay presentation if they believe a better offer is likely
  - The licensee must obtain the seller's consent before presenting any offer
  - The licensee must present the offer only if the property is not under an existing contract
key: A
explanation: AS 08.88.615(a)(3) requires the licensee to present all written offers, notices, and
  communications in a timely manner regardless of any existing contract or the party's status.
  Delaying presentation in anticipation of a higher offer violates this duty.
