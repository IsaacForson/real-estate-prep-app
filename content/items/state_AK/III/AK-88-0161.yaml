stem: A licensee working for Broker ABC represents two different sellers who are both trying to sell
  similar homes to the same buyer. Under AS 08.88.635(b), does this activity by itself constitute an
  adverse or detrimental act or create a conflict of interest?
options:
  - Under AS 08.88.635(b), this activity by itself creates a conflict of interest under AS 08.88.391.
  - Under AS 08.88.635(b), this activity does not by itself constitute an adverse or detrimental act
    or create a conflict of interest.
  - Under AS 08.88.635(b), this activity by itself constitutes an adverse or detrimental act toward
    the sellers.
  - Under AS 08.88.635(b), this activity requires the licensee to obtain written consent from the
    buyer.
key: B
explanation: Under AS 08.88.635(b), representing more than one seller in competing transactions for
  the same buyer does not by itself constitute an adverse or detrimental act or create a conflict of
  interest. Therefore the correct answer is that the activity does not create such an act or
  conflict. The statement that the activity constitutes an adverse act toward the sellers is
  incorrect because the statute explicitly says it does not.
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
