  url: null
  quoted_text: The representation of more than one seller or lessor by the same licensee or by
    different licensees working for the same real estate broker in competing transactions involving
    the same buyer or lessee does not by itself constitute action that is adverse or detrimental to
    the sellers or lessors or create a conflict of interest under AS 08.88.391 .
