stem: A licensee is aware that a murder occurred in a house eight months before the licensee first
  showed the property to a buyer. Before the buyer makes an offer, what must the licensee do under
  AS 08.88.615?
options:
  - Disclose to the buyer that a murder occurred on the property only if the buyer directly asks
    about it.
  - Disclose to the buyer that a murder occurred on the property before an offer is made or accepted.
  - Disclose to the buyer's lender that a murder occurred on the property before closing occurs.
  - Disclose to the seller that a murder occurred on the property before listing the property for
    sale.
key: B
explanation: Because the murder occurred within one year before the licensee first showed the
  property and the licensee is aware of it, AS 08.88.615(c) requires disclosure to the buyer before
  an offer is made or accepted.
