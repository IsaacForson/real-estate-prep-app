stem: What must a licensee begin any written statement of the conflict of interest with, according
  to AS 08.88.391(a)?
options:
  - The licensee must begin the written statement with the words 'Disclosure of Conflict of
    Interest' underlined and in bold.
  - The licensee must begin the written statement with a summary of the transaction details.
  - The licensee must begin the written statement with the date of the conflict identification.
  - The licensee must begin the written statement with the licensee's contact information.
key: A
explanation: The statute requires that any written statement of a conflict of interest begin with
  the exact phrase 'Disclosure of Conflict of Interest' formatted as underlined and bold. This
  language is mandated to ensure clear notice of the conflict. The option stating that the licensee
  must begin the written statement with a summary of the transaction details is incorrect because
  the statute does not require a summary of transaction details at the start of the statement; it
  specifies the precise wording.
