stem: Six months after a listing agreement ends, a former client's neighbor asks the licensee to
  reveal confidential financial details the client shared during the relationship, and no subpoena
  has been issued. What must the licensee do under AS 08.88.620?
options:
  - The licensee must share the information because the licensee relationship has already terminated.
  - The licensee must share the information because the request comes from someone outside the
    transaction.
  - The licensee must withhold the information absent written consent or a court order.
  - The licensee must withhold the information only until the former client is notified of the
    request.
key: C
explanation: AS 08.88.620(4) prohibits disclosing confidential information about a represented
  person without written consent, except under a subpoena or court order, even after the
  relationship ends.
