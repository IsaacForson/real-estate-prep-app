stem: A designated licensee who works for a broker represents a seller in one transaction. What may
  the same designated licensee do in a different transaction involving the same person?
options:
  - May act as a neutral licensee for both parties in the same transaction.
  - May represent the broker in a separate transaction for the same client.
  - May represent the same person as a buyer in a different transaction.
  - May disclose confidential information from the first transaction to the buyer.
key: C
explanation: AS 08.88.640(c) allows a designated licensee to represent a person as a seller or
  lessor in one transaction and as a buyer or lessee in another transaction involving the same
  person. Disclosing confidential information from the first transaction to the buyer would violate
  the duty of confidentiality unless authorized.
