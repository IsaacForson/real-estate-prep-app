stem: Under AS 08.88.610, when a real estate licensee obtains a buyer's written consent to act as a
  neutral licensee, what must be true about the consent form?
options:
  - The consent must be a separate form titled Waiver of Right To Be Represented.
  - The consent must appear within the standard purchase agreement paragraph.
  - The consent must appear as a verbal acknowledgment recorded by the broker.
  - The consent must appear as a signed addendum attached to the listing agreement.
key: A
explanation: AS 08.88.610(c) requires the written consent to be on a separate form that is not
  contained in another writing and is entitled Waiver of Right To Be Represented.
citation:
  source: Alaska Stat. § 08.88.610
  url: null
  quoted_text: A written consent under this section must be provided on a separate form, may not be
    contained in another writing, and must be entitled Waiver of Right To Be Represented.
