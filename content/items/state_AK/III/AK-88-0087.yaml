stem: According to AS 08.88.391(c), which of the following situations constitutes a conflict of
  interest for a real estate licensee?
options:
  - The licensee receives compensation from someone other than a party to the contract or another
    party having a financial interest in the transaction
  - The licensee provides general market information to a buyer without representing them in any
    capacity or role of the transaction
  - The licensee discloses a personal friendship with the seller but has no financial interest in
    the property and has no financial stake in the outcome
  - The licensee advertises the property on social media when acting solely as an advertiser for the
    listing broker in the transaction
key: A
explanation: AS 08.88.391(c)(4) defines a conflict of interest as receiving compensation from
  someone other than a party to the contract or another party having a financial interest in the
  transaction. The statement that the licensee receives such compensation therefore meets the
  statutory definition. The other answer choices describe activities—providing general market
  information, disclosing a personal friendship without a financial stake, and acting solely as an
  advertiser—that are not identified as conflicts of interest under the statute.
