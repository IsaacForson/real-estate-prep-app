stem: A listing agreement terminates when the seller sells the home directly to a neighbor without
  the broker's help. Two months later, the former licensee refuses to account for earnest money
  collected during the relationship, claiming all duties ended at termination. Is the licensee
  correct under AS 08.88.660?
options:
  - Yes, because termination of a licensee relationship eliminates every duty the licensee owed to
    the parties.
  - Yes, because accounting duties transfer entirely to the buyer once the relationship ends.
  - No, because a terminated licensee owes every original duty exactly as though the relationship
    continued.
  - No, the licensee still owes duties to account for trust money and protect confidential
    information.
key: D
explanation: AS 08.88.660(c) provides that after termination a licensee's duties end except for
  accounting for money or property received during the relationship and not disclosing confidential
  information.
citation:
  source: Alaska Stat. § 08.88.660
  url: null
  quoted_text: a licensee does not owe a further duty to a buyer, lessee, seller, or lessor after
    termination of the licensee relationship, except for the duties of accounting for all money and
    other property received during the relationship and not disclosing confidential information
