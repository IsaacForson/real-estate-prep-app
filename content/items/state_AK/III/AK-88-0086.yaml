stem: Under AS 08.88.615(a)(5), what duty does a real estate licensee owe regarding money received
  from a person to whom the licensee provides specific assistance?
options:
  - The licensee must provide a written accounting to the person at the close of each month.
  - The licensee must invest any received funds in an interest-bearing account unless directed
    otherwise.
  - The licensee must account for all money and other property received from or on behalf of the
    person in a timely manner.
  - The licensee must deposit all money received into an escrow account within one business day.
key: C
explanation: AS 08.88.615(a)(5) requires the licensee to account in a timely manner for all money
  and other property received from or on behalf of the person. The other options impose additional
  requirements not found in the statute, such as depositing into escrow within a specific timeframe
  or investing the funds.
