stem: A licensee discovers they have a leasehold interest in the property they are marketing for a
  client. Under AS 08.88.391(a), what actions must the licensee take regarding the conflict of
  interest?
options:
  - The licensee must disclose the conflict to affected persons, confirm in writing, verbally advise
    the person, and start any written statement with the underlined bold phrase 'Disclosure of
    Conflict of Interest'.
  - The licensee must disclose the conflict in writing to the client, obtain a signed waiver, and
    refrain from further action until the waiver is received immediately as required.
  - The licensee must verbally advise the client of the conflict, disclose it in writing, and then
    proceed with the transaction immediately as required.
  - The licensee must notify the Real Estate Commission in writing of the conflict, await approval,
    and then continue with the transaction immediately as required.
key: A
explanation: AS 08.88.391(a) requires the licensee to disclose the conflict to adversely affected
  persons, confirm it in writing, verbally advise the person, and begin any written statement with
  the underlined bold words 'Disclosure of Conflict of Interest'. The other options either omit
  required steps or add actions not mandated by the statute.
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
    Brokers and Other Licensees (2025) — § 08.88.391(a)
  url: null
  quoted_text: "(a) A real estate licensee who has a conflict of interest relating to a real estate
    transaction shall disclose that conflict of interest to the persons adversely affected by the
    conflict or their real estate licensees and confirm the conflict of interest in writing to the
    persons adversely affected by the conflict or their real estate licensees involved in the
    transaction as soon as possible after the conflict is identified. The licensee must also
    verbally advise the person of the conflict, and begin any written statement of the conflict of
    interest with these words, underlined and written in bold: Disclosure of Conflict of Interest."
