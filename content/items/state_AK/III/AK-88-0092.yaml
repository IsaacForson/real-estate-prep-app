stem: A designated licensee helped a client sell a house six months ago. The same client now wants
  to buy a different house and asks the same designated licensee to represent them in the purchase.
  Under AS 08.88.640(c), what is permissible for the designated licensee?
options:
  - Representing the client as a buyer after previously representing them as a seller in a separate
    transaction
  - Representing both the buyer and seller in the same transaction as a neutral licensee
  - Obtaining written consent to act as a neutral licensee before showing any property to the client
  - Disclosing any known material defects in the property's physical condition before making an offer
key: A
explanation: AS 08.88.640(c) expressly permits a designated real estate licensee to represent or
  assist a person as a seller or lessor in one transaction and as a buyer or lessee in another
  separate transaction. Acting as a neutral licensee for both parties in the same transaction is
  covered by subsection (b), not (c). Obtaining neutral consent and disclosing material defects are
  duties under other statutes and are not the permission described in AS 08.88.640(c).
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
    Brokers and Other Licensees (2025) — § 08.88.640
  url: null
  quoted_text: A designated real estate licensee may represent or provide specific assistance to a
    person who is a seller or lessor in one real estate transaction while representing or providing
    specific assistance to the person as a buyer or lessee in another real estate transaction.
