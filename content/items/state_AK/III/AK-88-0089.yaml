stem: A licensee wants to purchase a home for personal use and asks a licensee from a different
  brokerage to represent them. Is this permitted under 12 AAC 64.961?
options:
  - Regarding the licensee's personal real estate transaction, the licensee may not receive any
    assistance from another licensee.
  - Regarding the licensee's personal real estate transaction, the licensee may use another
    brokerage's licensee only if the transaction involves commercial property.
  - Regarding the licensee's personal real estate transaction, the licensee may use a licensee from
    another brokerage to represent them.
  - Regarding the licensee's personal real estate transaction, the licensee must use only licensees
    from their own brokerage.
key: C
explanation: 12 AAC 64.961 provides that a real estate licensee is not precluded from using the
  services of a licensee from another brokerage to represent or give specific assistance in a
  personal real estate transaction. The option stating that the licensee may use a licensee from
  another brokerage to represent them correctly reflects this allowance. The option stating that the
  licensee must use only licensees from their own brokerage is incorrect because the rule does not
  mandate such a restriction.
