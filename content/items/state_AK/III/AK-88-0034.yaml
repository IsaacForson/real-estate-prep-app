stem: A seller uses the Alaska Real Estate Commission's Residential Real Property Transfer
  Disclosure Statement when selling a home. Besides the property's physical condition, what
  additional notice does using this form satisfy under 12 AAC 64.930?
options:
  - Notice to the transferee to obtain private title insurance before closing on the property.
  - Notice to the transferee to schedule a termite inspection before closing on the property.
  - Notice to the transferee to investigate sex offenders and nearby agricultural operations.
  - Notice to the transferee to verify the property's flood zone designation with local government.
key: C
explanation: 12 AAC 64.930 states that using the adopted forms also satisfies AS 34.70.050's
  requirement to notify the transferee to investigate registered sex offenders and nearby
  agricultural facilities.
citation:
  source: 12 Alaska Admin. Code § 64.930
  url: null
  quoted_text: Use of these forms also complies with AS 34.70.050 regarding notice to the transferee
    to conduct investigations regarding convicted sex offenders residing in the neighborhood and
    whether there is an agricultural facility or operation in the vicinity.
