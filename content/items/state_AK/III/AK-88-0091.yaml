stem: A licensee represents the seller in a residential sale. A prospective buyer expresses interest
  in viewing the property. Before showing the property to the buyer, what must the licensee do under
  AS 08.88.610(b)?
options:
  - Disclose any known material defects in the property's physical condition before showing the
    property to the buyer
  - Obtain written consent to act as a neutral licensee before showing the property to the buyer
  - Provide a copy of the pamphlet outlining licensee relationship duties before showing the
    property to the buyer
  - Obtain preauthorization from the seller to act as a neutral licensee before showing the property
    to the buyer
key: B
explanation: AS 08.88.610(b) states that if preauthorization was not obtained, the licensee must
  obtain written consent to act as a neutral licensee before showing the real estate to a buyer or
  lessee who expresses interest while the licensee represents the seller or lessor. Preauthorization
  under subsection (a) is optional, not required. Providing the pamphlet and disclosing material
  defects are duties under other sections but are not the specific prerequisite under AS
  08.88.610(b).
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
    Brokers and Other Licensees (2025) — § 08.88.610
  url: null
  quoted_text: If preauthorization is not obtained under (a) of this section, when a buyer or lessee
    expresses an interest to the licensee in acquiring or leasing real estate and the licensee is
    representing the seller or lessor of the property, the licensee shall obtain written consent to
    act as a neutral licensee before the licensee shows the real estate.
