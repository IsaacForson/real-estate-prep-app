stem: A licensee representing the seller shows a property to a prospective buyer who has expressed
  interest, but the licensee has not obtained prior written consent to act as a neutral licensee.
  Under AS 08.88.610(b), what must the licensee do before showing the property?
options:
  - The licensee must obtain written consent to act as a neutral licensee before showing the real
    estate.
  - The licensee must show the property first and then obtain written consent from the buyer.
  - The licensee must provide only verbal consent to the buyer before showing the property.
  - The licensee must obtain written consent only after the buyer makes a written offer.
key: A
explanation: AS 08.88.610(b) states that if preauthorization is not obtained, the licensee shall
  obtain written consent to act as a neutral licensee before showing the real estate when
  representing the seller or lessor and the buyer expresses interest. Showing the property before
  obtaining written consent violates this requirement.
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
    Brokers and Other Licensees (2025) — § 08.88.610(b)
  url: null
  quoted_text: (b) If preauthorization is not obtained under (a) of this section, when a buyer or
    lessee expresses an interest to the licensee in acquiring or leasing real estate and the
    licensee is representing the seller or lessor of the property, the licensee shall obtain written
    consent to act as a neutral licensee before the licensee shows the real estate.
