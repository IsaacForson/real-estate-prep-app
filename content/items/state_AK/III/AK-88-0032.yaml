stem: A buyer sues a licensee in civil court solely because the licensee failed to disclose a
  conflict of interest under AS 08.88.391. What is the legal effect of that failure under the
  statute?
options:
  - The failure does not create a private cause of action, but commission discipline may still
    follow.
  - The failure voids the underlying real estate contract between the buyer and seller.
  - The failure automatically transfers the licensee's commission to the buyer as a penalty.
  - The failure creates an automatic private cause of action entitling the buyer to compensatory
    damages.
key: A
explanation: AS 08.88.391(b) states that a licensee's failure to disclose a conflict of interest
  does not give rise to a private cause of action, though the commission may still impose a
  disciplinary sanction.
