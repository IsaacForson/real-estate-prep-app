stem: A licensee represents Buyer X in a purchase transaction for Property A. At the same time, the
  licensee assists Buyer X as a neutral licensee in a lease transaction for Property B. Under AS
  08.88.605(b), is this arrangement allowed?
options:
  - The licensee must terminate the purchase representation before assisting in the lease
    transaction.
  - The licensee may not provide any services to Buyer X in the lease transaction while representing
    Buyer X in the purchase transaction.
  - The licensee must obtain written consent from Buyer X to serve in both capacities simultaneously.
  - The licensee may act as a licensee for the party in one transaction and not represent that party
    in a different transaction involving that party.
key: D
explanation: The statute explicitly permits a licensee to act as a licensee for a party in one
  transaction while not representing that party in a different transaction involving the same party.
  The distractor about requiring written consent incorrectly adds a condition not present in the
  rule.
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
