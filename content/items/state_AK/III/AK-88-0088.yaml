stem: A licensee shows a property that is owned by a third party (not the seller) to a prospective
  buyer. Does this activity by itself constitute an adverse or detrimental act or create a conflict
  of interest under AS 08.88.391?
options:
  - The licensee's action of showing property not owned by the seller does not by itself constitute
    an adverse or detrimental act or create a conflict of interest.
  - The licensee's action of showing property not owned by the seller generally constitutes an
    adverse or detrimental act and creates a conflict of interest.
  - The licensee's action of showing property not owned by the seller creates a conflict of interest
    only if the licensee receives compensation from the third-party owner.
  - The licensee's action of showing property not owned by the seller does not constitute an adverse
    or detrimental act or conflict of interest only if the licensee obtains written consent from the
    seller.
key: A
explanation: AS 08.88.635(a) provides that a licensee’s showing of real estate that the seller does
  not own or lease is not, by itself, an adverse or detrimental act toward the seller and does not
  create a conflict of interest. Therefore, the statement that the licensee’s action of showing
  property not owned by the seller does not by itself constitute an adverse or detrimental act or
  create a conflict of interest is correct. The other choices are incorrect because they either
  assert that the act always creates a conflict, tie the conflict to compensation, or require seller
  consent, none of which are required by the statute.
