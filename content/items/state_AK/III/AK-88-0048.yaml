stem: A brokerage has two designated licensees, one representing the seller and one representing the
  buyer in the same transaction, and neither is the broker. The seller's designated licensee learns
  confidential information from the seller. Under AS 08.88.640, what is true about that information
  as it relates to the broker?
options:
  - The information is imputed to the broker only after the transaction closes.
  - The information is imputed to the broker because dual designated licensees create shared
    knowledge.
  - The information is imputed to the broker automatically because both licensees share one broker.
  - The information is not imputed to the broker because the broker is not the designated licensee.
key: D
explanation: Under AS 08.88.640(d), unless the broker is itself the designated licensee, knowledge
  received by a designated licensee is not imputed to the broker or to another licensee working for
  the broker.
citation:
  source: Alaska Stat. § 08.88.640
  url: null
  quoted_text: the knowledge received by the designated licensee while representing or providing
    specific assistance to the person is not imputed to the real estate broker for whom the
    designated licensee works
