stem: Which of the following is prohibited under AS 08.88.401(a)(1) for a real estate licensee in Alaska?
options:
  - Falsely representing to have been awarded a degree or other designation.
  - Falsely representing to be a member of a professional organization.
  - Falsely representing to be affiliated with a franchise.
  - Falsely representing to have a real estate license from another state.
key: A
explanation: The statute explicitly prohibits a licensee from falsely representing to have been
  awarded a degree or other designation. The other options, while also prohibited under subsections
  (a)(2) and (a)(3), are not the specific act described in subsection (a)(1).
