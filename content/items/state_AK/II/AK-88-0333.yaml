stem: A licensee goes inactive on March 1. Four months later, the licensee receives a commission
  check from their former broker for a residential sale that closed while the licensee was actively
  licensed. Under Alaska Statute § 08.88.251(b), is the licensee permitted to receive this
  commission?
options:
  - The licensee may receive the commission because inactive licensees may collect payments for
    services performed while actively licensed.
  - The licensee may not receive the commission because inactive licensees are prohibited from
    receiving any compensation.
  - The licensee may receive the commission only if the broker provides written approval.
  - The licensee may not receive the commission unless the license is reactivated first.
key: A
explanation: AS 08.88.251(b) states that an inactive licensee may not perform licensed activities
  but may receive commissions or other payments from the broker for services performed while
  actively licensed. The other options incorrectly prohibit the commission or add unnecessary
  conditions.
