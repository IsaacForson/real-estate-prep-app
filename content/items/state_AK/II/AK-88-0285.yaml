stem: A broker who has been actively licensed in Alaska stops owning a real estate business and is
  not employed as a broker by any corporation, partnership, or LLC. According to AS 08.88.171(a),
  what is the status of the broker’s license?
options:
  - The broker's license remains active indefinitely because the broker continues to meet the
    experience requirements for renewal, even though they no longer own a real estate business or
    work for a brokerage.
  - The broker's license is suspended until the broker either becomes an owner of a real estate
    business again or is employed as an associate broker by another broker, after satisfying any
    required education.
  - The broker's license is automatically revoked and cannot be reinstated without retaking the
    broker exam, even if the broker later regains ownership or employment with a brokerage.
  - The broker's license continues active but the broker may not engage in any real estate activity
    until they regain ownership or become employed as an associate broker under another broker.
key: B
explanation: If a broker stops being an owner of a real estate business, the license is suspended
  until the broker satisfies education requirements and either regains ownership or becomes an
  associate broker employed by another broker. The statute explicitly provides for this suspension
  and conditional reinstatement. The other options either ignore the suspension requirement or
  incorrectly state revocation or unchanged status.
citation:
  source: Alaska Stat. § 08.88.011 et seq. (AS 08.88, Real Estate Brokers and Other Licensees) §
    08.88.171(a)
  url: null
  quoted_text: If the broker stops being an owner of a real estate business or stops being employed as
    a real estate broker by a foreign or domestic corporation, partnership, limited partnership, or
    limited liability company, the broker's license is suspended from the time the broker stops
    until the broker satisfies the educational requirements of AS 08.88.098 and (1) again becomes an
    owner of a real estate business or is again employed as a real estate broker by a foreign or
    domestic corporation, partnership, limited partnership, or limited liability company; or (2) is
    employed by another broker as an associate broker, in which case the real estate broker license
    shall be returned to the commission by the broker, and the commission shall issue the broker an
    associate real estate broker license.
