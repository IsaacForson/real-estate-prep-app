stem: Which of the following situations qualifies for the exemption from real estate licensing under
  Alaska Statute § 08.88.900(a)(16)?
options:
  - A person managing four residential units for other persons while holding a real estate
    salesperson license
  - A person managing four residential units for other persons without a real estate license
  - A person managing five residential units for other persons without a real estate license
  - A person managing three residential units for personal use without a real estate license
key: B
explanation: The exemption under Alaska Stat. § 08.88.900(a)(16) allows an unlicensed natural person
  to manage four or fewer residential units for others. The correct situation is a person managing
  exactly four residential units for other persons without a real estate license. Managing more than
  four units, managing units for personal use, or being licensed disqualifies the exemption.
