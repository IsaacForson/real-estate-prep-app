stem: A licensee holds both an active broker license and an active salesperson license under AS
  08.88.161. The licensee’s insurer notifies the commission that the premium was not paid, resulting
  in termination of coverage on May 10. According to 12 AAC 64.620, what is the status of the
  licensee’s licenses as of May 10?
options:
  - Broker license suspended; salesperson license active.
  - Salesperson license suspended; broker license active.
  - Both licenses are suspended effective May 10.
  - Neither license is suspended until notice is received.
key: C
explanation: The rule requires suspension of any license under AS 08.88.161 held by the licensee as
  of the date of termination of coverage, so both licenses are suspended on May 10. The other
  options incorrectly limit the suspension to one license or delay it.
