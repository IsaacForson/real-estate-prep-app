stem: An applicant has 40 months of active and continuous experience as a real estate licensee
  within the 50 months immediately preceding application. According to Alaska Statute §
  08.88.171(a), is the applicant eligible for a broker license?
options:
  - The applicant is ineligible because the experience is not within the 60‑month window
  - The applicant is ineligible because they have fewer than 36 months of experience
  - The applicant is ineligible because the experience is not continuous and active
  - The applicant is eligible because they have 36 months of experience within the 60‑month window
key: D
explanation: The statute requires at least 36 months of active and continuous experience within the
  60 months before application; having 40 months within a 50‑month period satisfies this. The
  distractor claiming insufficiency due to fewer than 36 months misapplies the threshold, as the
  applicant exceeds it.
