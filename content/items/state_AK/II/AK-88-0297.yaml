stem: According to AS 08.88.095(e), what occurs if a licensee fails to complete the required 30
  hours of education within one year of initial licensure?
options:
  - The license automatically lapses 30 days after the one‑year period.
  - The license remains inactive until education is completed.
  - The licensee must submit proof of education within 30 days.
  - The license is suspended by the commission for noncompliance.
key: A
explanation: The statute states that if the educational requirements are not completed within the
  one-year period, the license automatically lapses 30 days after the end of that period. The
  distractor suggesting suspension is incorrect because the law specifies lapse, not suspension, for
  this failure.
