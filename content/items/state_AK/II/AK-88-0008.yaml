stem: Which of the following individuals is exempt from the real estate licensing requirement under
  Alaska Statute § 08.88.900(a)(3)?
options:
  - A lawyer providing legal advice on a real estate transaction
  - A lawyer acting as a real estate agent for commission
  - A paralegal preparing closing documents for a buyer
  - A real estate broker offering legal advice to a client
key: A
explanation: AS 08.88.900(a)(3) exempts 'a lawyer performing duties as a lawyer,' which includes
  giving legal advice on a real estate transaction. The distractor 'A lawyer acting as a real estate
  agent for commission' is not exempt because the lawyer is acting as an agent, not performing
  lawyer duties.
