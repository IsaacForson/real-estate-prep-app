stem: An applicant completed the required real estate education courses on January 10, 2023. They
  submit their license application on July 20, 2024. Under 12 AAC 64.063(a)(2), is the applicant's
  education current?
options:
  - The applicant's education is current because the courses were completed less than 18 months
    before application.
  - The applicant's education is current because the courses were completed within 24 months before
    application.
  - The applicant's education is not current because the courses were completed more than 18 months
    before application.
  - The applicant's education is not current because the courses were completed less than 12 months
    before application.
key: C
explanation: The rule demands that education courses be completed within the 18 months immediately
  preceding the application date. As of July 20, 2024, the 18‑month window starts on January 20,
  2023, so courses finished on January 10, 2023 fall outside that period. The option claiming
  currency based on a 24‑month window is wrong because the longer period applies only to endorsement
  applicants.
