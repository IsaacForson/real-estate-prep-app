stem: According to 12 AAC 64.620, which party must notify the commission for a licensee's license to
  be suspended due to nonpayment of errors and omissions insurance premium?
options:
  - The broker (the supervising broker of the licensee)
  - The real estate commission (the regulatory body)
  - The insurance company or master insurance policy issuer
  - The licensee (the individual holding the license)
key: C
explanation: The rule states that the commission shall suspend a license when the licensee's
  insurance company or master insurance policy issuer notifies the commission of nonpayment
  resulting in termination of coverage. Therefore, the insurer or master policy issuer is the party
  that must trigger the suspension. The distractor that the licensee must notify is incorrect
  because the rule places the notification duty on the insurer, not the licensee.
citation:
  source: 12 Alaska Admin. Code § 64.010 et seq. § 64.620
  url: null
  quoted_text: If a licensee's insurance company or master insurance policy issuer notifies the
    commission that a licensee has not paid a premium resulting in termination of coverage, the
    commission shall suspend any license under AS 08.88.161 held by that licensee as of the date of
    termination of coverage.
