stem: Which of the following is required for a licensed real estate salesperson to act as a licensed
  assistant to another salesperson under Alaska Statute § 08.88.398?
options:
  - The licensed assistant must be employed by the same broker
  - The licensed assistant must be paid directly by the client
  - The licensed assistant must hold a broker license
  - The licensed assistant must work for more than one broker
key: A
explanation: AS 08.88.398(1) requires that the licensed assistant and the salesperson or associate
  broker they assist are both employed by the same broker. That requirement makes the statement that
  the licensed assistant must be employed by the same broker the correct answer. The other
  statements—being paid directly by the client, holding a broker license, or working for more than
  one broker—are not permitted under the statute.
