stem: Within how many months after the issuance of an initial license must a licensee complete 30
  hours of approved education under Alaska Statute § 08.88.095(a)?
options:
  - 6 months
  - 12 months
  - 18 months
  - 24 months
key: B
explanation: AS 08.88.095(a) requires a licensee to complete 30 hours of approved education within
  one year after the commission issues an initial license. One year equals 12 months, making the
  12‑month option correct. The 6‑month option confuses the timeframe with the biennial renewal
  period, while 18 and 24 months exceed the required period.
