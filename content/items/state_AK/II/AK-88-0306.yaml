stem: A broker licensed in Alaska stops being employed as a real estate broker by a corporation but
  continues to own a real estate business. According to Alaska Statute § 08.88.171(a), what must the
  broker do to have the license reinstated?
options:
  - The broker must satisfy the educational requirements of AS 08.88.098.
  - The broker must obtain a new broker license from another state.
  - The broker must cease ownership of the real estate business and become employed as an associate
    broker.
  - The broker must pay a reinstatement fee to the commission without further education.
key: A
explanation: The statute provides that a broker’s license is suspended if they stop being employed
  or stop being an owner, and remains suspended until they satisfy the educational requirements of
  AS 08.88.098 and either become an owner again or are employed as an associate broker. Since the
  broker remains an owner, only the education requirement must be met. The distractor suggesting a
  new out‑of‑state license is incorrect because reinstatement depends on meeting Alaska’s education
  rule.
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
    Brokers and Other Licensees (2025) — § 08.88.171
  url: null
  quoted_text: If the broker stops being an owner of a real estate business or stops being employed as
    a real estate broker by a foreign or domestic corporation, partnership, limited partnership, or
    limited liability company, the broker's license is suspended from the time the broker stops
    until the broker satisfies the educational requirements of AS 08.88.098 and (1) again becomes an
    owner of a real estate business or is again employed as a real estate broker by a foreign or
    domestic corporation, partnership, limited partnership, or limited liability company; or (2) is
    employed by another broker as an associate broker.
