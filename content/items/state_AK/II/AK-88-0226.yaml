stem: A licensee holds both an active broker license and an active salesperson license. The
  licensee's insurer notifies the commission that the licensee has not paid a premium, resulting in
  termination of coverage on May 5. According to 12 AAC 64.620, what is the status of the licensee's
  licenses on May 5?
options:
  - Neither the broker nor the salesperson license is suspended and both remain active
  - The broker license is suspended while the salesperson license remains active
  - Both the broker and salesperson licenses are suspended and cannot be used
  - The salesperson license is suspended while the broker license remains active
key: C
explanation: The regulation requires the commission to suspend any license under AS 08.88.161 held
  by the licensee as of the date of termination, so both the broker and salesperson licenses are
  suspended on that date. The other options incorrectly suggest only one license is affected or that
  no suspension occurs.
