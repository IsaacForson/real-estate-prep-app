stem: A licensee's insurer notifies the commission that the licensee has not paid a premium,
  resulting in termination of coverage on March 15. According to 12 AAC 64.620, when does the
  commission suspend the license?
options:
  - The license is suspended effective March 30.
  - The license is suspended effective April 1.
  - The license is suspended effective March 1.
  - The license is suspended effective March 15.
key: D
explanation: 12 AAC § 64.620 provides that the commission shall suspend any license as of the date
  of termination of coverage. Because coverage terminated on March 15, the suspension becomes
  effective that same day. The statement that the license is suspended effective March 30 is
  incorrect because the rule ties suspension to the termination date, not to a later date. The
  statement that the license is suspended effective April 1 is also incorrect for the same reason.
  The statement that the license is suspended effective March 1 is incorrect because that date
  precedes the termination of coverage.
