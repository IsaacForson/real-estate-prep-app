stem: A unit owner in a condominium organized under AS 34.08 manages the association’s common areas
  and collects dues from other owners. The owner is a member of the self‑managed community
  association and receives no compensation for this work. Under Alaska Statute § 08.88.900(a)(17),
  is the owner required to hold a real estate license to perform these management activities?
options:
  - "A: The owner is not required to hold a real estate license because the management is performed
    by a resident owner who is a member of a self‑managed community association"
  - The owner is required to hold a real estate license because the condominium is organized under
    AS 34.08
  - The owner is required to hold a real estate license because any collection of dues constitutes a
    real estate transaction
  - The owner is not required to hold a real estate license only if the owner also holds a property
    management license from another state
key: A
explanation: The exemption in subsection (a)(17) of Alaska Statute § 08.88.900 excludes from
  licensing a resident owner of a unit who manages community association property and is a member of
  a self‑managed association. The correct answer states that the owner is not required to hold a
  real estate license because the management is performed by a resident owner who is a member of a
  self‑managed community association. The option claiming that any collection of dues creates a
  licensing requirement is incorrect because the exemption applies regardless of dues collection.
  The option stating that an out‑of‑state property management license is needed is incorrect because
  no such license is required under the exemption. The option asserting that the owner must hold a
  license because the condominium is organized under AS 34.08 is incorrect because the exemption
  applies to property organized under either AS 34.07 or AS 34.08.
