stem: A licensee whose license has been suspended for failure to provide proof of errors and
  omissions insurance submits proof of insurance to the commission on June 8. The commission
  activates the license on June 10. According to 12 AAC 64.640, on what date may the licensee first
  conduct activities requiring a license?
options:
  - June 8
  - June 9
  - June 10
  - June 11
key: C
explanation: The rule provides that a licensee may not conduct licensed activities until proof of
  insurance is provided and the license is activated. Since activation occurs on June 10, activities
  may resume on that date. June 8 is incorrect because the license remains inactive until
  activation.
