stem: What proof must an applicant for an associate real estate broker license submit regarding
  errors and omissions insurance?
options:
  - Yes, because the applicant must submit proof of errors and omissions insurance.
  - No, because the applicant needs to show completion of education requirements.
  - Yes, because the applicant must provide a certificate of passing the broker exam.
  - No, because the applicant is exempt if they have errors and omissions insurance through their
    employer.
key: A
explanation: The statute requires an associate broker applicant to furnish satisfactory proof that
  errors and omissions insurance required under AS 08.88.172 has been obtained. This makes the
  option that states the applicant must submit proof of errors and omissions insurance correct. The
  option that states the applicant needs to show completion of education requirements is incorrect
  because showing education completion does not satisfy the insurance proof requirement.
