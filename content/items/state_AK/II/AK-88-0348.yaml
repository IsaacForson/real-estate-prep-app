stem: A licensee who operates as a sole proprietor of a real estate brokerage accepts a position as
  an employed broker with a franchised brokerage. What must the licensee do to comply with Alaska
  licensing law?
options:
  - Immediately surrender the broker license to the commission for cancellation.
  - Continue operating under the sole proprietorship without notifying the commission.
  - Wait until the next license renewal period to report the change in business association.
  - Promptly inform the commission of the change in business association that affects the license
    status.
key: D
explanation: Alaska Statute § 08.88.171(d) requires a licensee to promptly inform the commission of
  any change in business association that affects the status of the license. The shift from sole
  proprietor to employed broker constitutes such a change, so immediate notification is required.
  Continuing without notice violates the rule, surrendering the license is unnecessary, and delaying
  notice until renewal fails to meet the prompt requirement.
