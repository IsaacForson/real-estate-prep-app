stem: Which of the following is required to qualify for a limited license to practice community
  association management under Alaska Statute § 08.88.171(e)?
options:
  - Must have errors and omissions insurance
  - Must have at least 36 months of experience
  - Must have applied by January 1, 1999
  - Must be employed by a licensed broker
key: C
explanation: Subsection (e)(1) of AS 08.88.171 explicitly requires the applicant to have applied by
  January 1, 1999 to qualify for the limited license. The distractor about 36 months of experience
  is incorrect because the statute requires 24 months of community association management practice
  before that date, not 36 months.
