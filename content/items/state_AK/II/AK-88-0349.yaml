stem: A holder of a limited license to practice community association management wishes to advertise
  services as a 'broker' while managing a condominium association. What must the licensee do to
  remain compliant with Alaska law?
options:
  - Use the term "broker" in advertising because the limited license authorizes community
    association management.
  - Obtain a separate real estate broker license before using the term "broker" in any business
    context.
  - Use the term "broker" only when speaking with fellow community association managers.
  - Disclose to clients that the term "broker" is being used courtesy of the limited license.
key: B
explanation: Under Alaska Statute § 08.88.171(f), a limited license holder may not use the terms
  salesperson, broker, or associate broker for business purposes unless also licensed appropriately
  under other provisions of the chapter. Therefore, to advertise as a broker, the licensee must
  first obtain a broker license. The other options would still constitute prohibited use of the
  term.
