stem: A licensee whose license has been suspended for failure to provide proof of errors and
  omissions insurance wishes to earn income while the suspension is in effect. According to 12 AAC
  64.640, which activity may the licensee lawfully perform?
options:
  - Preparing purchase agreements for clients in residential transactions
  - Receiving a commission on a closed transaction from a broker
  - Showing residential properties to prospective buyers during open houses
  - Performing clerical tasks that do not require a real estate license
key: D
explanation: Under 12 AAC 64.640, a licensee may not perform any activity that requires a real
  estate license until proof of errors and omissions insurance is submitted and the license is
  reinstated. Clerical tasks that do not require a license are allowed.
