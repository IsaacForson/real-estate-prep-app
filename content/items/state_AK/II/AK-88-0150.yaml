stem: What activity may a holder of a limited license to practice community association management
  perform under Alaska law?
options:
  - Practicing community association management only
  - Practicing property management for residential properties
  - Practicing brokerage activities including listings
  - Practicing real estate sales and leasing
key: A
explanation: Under AS 08.88.171(f), a person issued a limited license to practice community
  association management may practice only that activity and does not qualify as a broker or
  associate broker for the listed real estate functions. The other options describe activities that
  require a full broker or salesperson license.
