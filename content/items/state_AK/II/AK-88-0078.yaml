stem: A licensee has been on inactive status for 30 months. According to AS 08.88.251(c), what must
  they do to regain an active license?
options:
  - Providing proof of continuing education for the inactive period
  - Meeting the requirements for initial licensure
  - Completing 30 hours of post‑licensing education
  - Submitting a renewal application and paying the renewal fee
key: B
explanation: AS 08.88.251(c) states that if a person has been in inactive status for 24 months or
  more, they must meet the requirements for initial licensure to be licensed again. Since 30 months
  exceeds the 24‑month threshold, meeting initial licensure requirements is necessary. Submitting a
  renewal application and paying the fee applies only to regular renewal, not to reactivation after
  prolonged inactivity.
