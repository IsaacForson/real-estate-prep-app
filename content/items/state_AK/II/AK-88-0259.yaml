stem: A licensee whose license has been suspended for failure to provide proof of errors and
  omissions insurance obtains a new policy and submits the certificate of insurance to the
  commission on June 3. The commission activates the license on June 10. According to 12 AAC 64.640,
  on which date may the licensee first conduct activities that require a license?
options:
  - June 4
  - June 3
  - June 11
  - June 10
key: D
explanation: The rule states the licensee may not conduct any licensed activities until proof is
  provided AND the license is activated. Since proof was submitted on June 3 and activation occurred
  on June 10, the earliest date for licensed activities is June 10.
