stem: Under 12 AAC 64.620, what event triggers the commission to suspend a licensee's license?
options:
  - The licensee fails to complete the required continuing education hours.
  - The licensee's insurer reports nonpayment of premium ending coverage.
  - The licensee is convicted of a felony unrelated to real estate transactions.
  - The licensee does not renew the license before the expiration date.
key: B
explanation: The commission must suspend a license when the licensee’s insurance company or master
  policy issuer notifies the commission that the licensee has not paid a premium and coverage has
  been terminated. The insurer’s report of nonpayment causing termination therefore triggers
  suspension under 12 AAC § 64.620. A failure to complete the required continuing‑education hours
  does not trigger suspension under this provision. A felony conviction unrelated to real‑estate
  transactions is not a trigger under this rule. Failure to renew the license before its expiration
  also does not trigger suspension under § 64.620.
