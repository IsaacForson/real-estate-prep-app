stem: Under Alaska Stat. § 08.88.071(a)(6), what is the purpose for which the commission may issue a
  temporary permit to the personal representative of a deceased broker's estate?
options:
  - To oversee the broker's trust account reconciliations and disbursements
  - To collect earnest money deposits from transaction parties for the brokerage
  - To conclude the affairs of the decedent broker's real estate business
  - To administer the broker's continuing education requirements for licensees
key: C
explanation: The statute explicitly states that the temporary permit is issued to secure proper
  administration in concluding the affairs of the decedent broker's real estate business. The other
  options describe functions not mentioned in this subsection, such as supervising branch offices,
  handling earnest money, or managing the recovery fund.
