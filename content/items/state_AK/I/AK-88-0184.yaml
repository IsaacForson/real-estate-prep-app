stem: Under Alaska Stat. § 08.88.071(a)(10), what authority does the Alaska Real Estate Commission have?
options:
  - The commission may levy civil fines as established in this chapter
  - The commission may set the recovery fund fee at exactly $125 for all licensees
  - The commission may waive errors and omissions insurance requirements for licensees
  - The commission may approve all advertising materials used by licensees
key: A
explanation: The statute explicitly states that the commission has the authority to levy civil fines
  as established in this chapter. The distractor about setting the recovery fund fee at exactly $125
  is incorrect because the fee is not to exceed $125 and is subject to adjustment based on the
  fund's balance.
