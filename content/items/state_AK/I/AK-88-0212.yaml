explanation: Alaska Stat. § 08.88.351(b)(1) requires a licensee to keep a complete record of any
  transaction in which the licensee acted as a principal for a minimum of three years. Roles such as
  client, agent, or customer do not meet the definition of principal and therefore are not subject
  to this record‑keeping requirement.
