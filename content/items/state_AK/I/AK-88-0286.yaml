stem: Under AS 08.88.167(f), how many days does a licensee have to pay a civil penalty after the
  commission enters an order levying the penalty, before the commission may initiate collection
  action?
options:
  - 60 days
  - 30 days
  - 20 days
  - 10 days
key: B
explanation: The statute states that a person must pay a civil penalty within 30 days after entry of
  the commission's order to avoid collection action. The 10‑day period applies only after a court
  judgment for a stayed order, not after the commission's order entry.
