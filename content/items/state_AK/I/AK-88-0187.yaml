stem: What is the maximum civil penalty that may be imposed under AS 08.88.167(b) for a single
  offense if the licensee realized no financial gain from the violation?
options:
  - The maximum civil penalty is $10,000.
  - The maximum civil penalty is $5,000.
  - The maximum civil penalty is $0.
  - The maximum civil penalty is $2,500.
key: B
explanation: The statute provides that a civil penalty may not exceed $5,000 or the amount of gain
  realized plus $5,000, whichever is greater. With zero gain, the greater amount is $5,000, making
  that the maximum penalty. The $10,000 distractor incorrectly doubles the base amount, which the
  statute does not authorize.
