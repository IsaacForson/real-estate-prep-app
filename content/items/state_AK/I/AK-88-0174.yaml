stem: Under Alaska Stat. § 08.88.037(b)(1), what must the department provide before issuing a
  temporary order directing a person to stop a prohibited act or practice?
options:
  - A court order authorizing the department to act
  - Approval from the governor of the state of Alaska
  - A written request submitted by the licensee
  - Reasonable notice and an opportunity for a hearing
key: D
explanation: Alaska Stat. § 08.88.037(b)(1) requires that the department give the person reasonable
  notice and an opportunity for a hearing before issuing a temporary order. The statute does not
  require a court order authorizing the department, nor does it require approval from the governor,
  nor a written request from the licensee. Consequently, only the statement that the department must
  provide reasonable notice and an opportunity for a hearing satisfies the statutory requirement.
