stem: A real estate licensee in Alaska lets their license lapse on January 1, 2024. For how long
  after the lapse must the licensee ensure that the commission has current contact information for
  the licensee?
options:
  - One year
  - Three years
  - Five years
  - Two years
key: D
explanation: Each licensee must ensure the commission has current contact information for two years
  after the license lapses, expires, is surrendered, suspended, or revoked. This two‑year duty is
  separate from the three‑year requirement to retain transaction records. Therefore, the licensee
  must maintain current contact information until January 1, 2026.
