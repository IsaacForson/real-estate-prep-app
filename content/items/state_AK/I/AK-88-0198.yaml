stem: A licensee gains $4,200 from conducting unlicensed brokerage activities. Under AS
  08.88.167(b), what is the maximum civil penalty the commission may levy for this offense?
options:
  - $14,200.00
  - $5,000.00
  - $4,200.00
  - $9,200.00
key: D
explanation: The penalty may not exceed the greater of $5,000 or the amount of gain realized plus
  $5,000. Adding the gain ($4,200) to $5,000 yields $9,200, which exceeds $5,000, so the maximum is
  $9,200. The $5,000 option ignores the gain, and $14,200 mistakenly doubles the gain.
