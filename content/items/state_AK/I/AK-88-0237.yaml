stem: A broker plans to move their principal office to a new address. According to Alaska Stat. §
  08.88.301, what must the broker do before moving?
options:
  - To notify the commission on a provided form and pay fees
  - To obtain approval from the local zoning board
  - To publish a notice in a newspaper of general circulation
  - To submit a new license application to the commission
key: A
explanation: The law requires the broker to notify the commission of the new address on a form
  provided by the commission and to pay any applicable fees before changing the office location. The
  other options involve steps not required by this statute, such as obtaining zoning approval,
  publishing a notice, or submitting a new license application.
citation:
  source: Alaska Stat. § 08.88.301
  url: null
  quoted_text: Before a real estate broker changes the location of the broker's principal office or of
    a branch office, the broker shall notify the commission of the new address and any other office
    changes on a form provided by the commission and pay the applicable fees.
