stem: A licensee obtains a final judgment against another licensee for fraud on March 1, 2024. The
  judgment becomes final and not subject to appeal on June 1, 2024. By what date must the claimant
  file a claim with the commission to be eligible for an award from the recovery fund?
options:
  - June 1, 2026
  - June 1, 2025
  - March 1, 2026
  - May 31, 2025
key: A
explanation: The two‑year period starts when the judgment is no longer appealable (June 1, 2024), so
  the deadline is June 1, 2026. Choosing March 1, 2026 incorrectly uses the judgment date instead of
  the finality date.
