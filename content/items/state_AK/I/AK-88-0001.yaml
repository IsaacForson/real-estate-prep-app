stem: What is the maximum civil penalty that the commission may levy for a person who engages in
  unlicensed real estate activity?
options:
  - The penalty may not exceed $2,500, unless the violation is repeated.
  - The penalty may not exceed the amount of gain realized, with no additional amount.
  - The penalty may not exceed $10,000, regardless of any gain.
  - The penalty may not exceed $5,000, or the amount of gain realized plus $5,000, whichever is
    greater.
key: D
explanation: The statute provides that a civil penalty may not exceed $5,000, or the amount of gain
  realized plus $5,000, whichever is greater. The option stating that the penalty may not exceed
  $5,000, or the amount of gain realized plus $5,000, whichever is greater, matches this rule. The
  option stating the penalty may not exceed the amount of gain realized, with no additional amount,
  is incorrect because it omits the $5,000 base amount. The option stating the penalty may not
  exceed $10,000 regardless of gain is incorrect because it imposes a flat cap not authorized by
  statute. The option stating the penalty may not exceed $2,500 unless the violation is repeated is
  incorrect because it sets a lower limit and adds a condition not present in the statute.
