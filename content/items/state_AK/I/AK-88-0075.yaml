stem: A broker closed a residential sale on June 1, 2024. The listing agreement had ended on May 15,
  2024. According to Alaska Stat. § 08.88.351(c), until what date must the broker retain the
  transaction records?
options:
  - June 1, 2027
  - May 15, 2027
  - June 1, 2026
  - May 15, 2026
key: A
explanation: The rule provides that the three-year record retention period continues until three
  years after the date a sales transaction closes or otherwise ends. Since the sale closed on June
  1, 2024, records must be retained until June 1, 2027. Choosing May 15, 2027 is incorrect because
  it relies on the listing agreement end date, but the later event (the closing) determines the
  retention period.
