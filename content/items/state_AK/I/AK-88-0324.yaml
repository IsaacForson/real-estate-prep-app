stem: A claimant receives a final arbitration award on January 10, 2025 that is not subject to
  appeal. According to AS 08.88.460(a)(3), by what date must the claimant file a claim to be
  eligible for an award from the recovery fund?
options:
  - January 10, 2028
  - January 10, 2026
  - January 10, 2027
  - January 10, 2029
key: C
explanation: AS 08.88.460(a)(3) requires the claim to be filed within two years after the date the
  award is no longer subject to appeal; adding two years to January 10, 2025 yields January 10,
  2027. The distractor listing only one year later incorrectly applies a one‑year period.
