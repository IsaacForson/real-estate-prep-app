stem: A licensee receives a notice from the department proposing a temporary order to cease a
  deceptive advertising practice. The licensee does not request a hearing within the time allowed.
  According to Alaska Stat. § 08.88.037(b)(1), what is the effect of the temporary order?
options:
  - It becomes final after 15 days.
  - It requires a hearing within 30 days.
  - It expires after 15 days.
  - It is enforced by the commission.
key: A
explanation: If the licensee does not request a hearing within 15 days after receiving the notice,
  the temporary order becomes final under the statute. The other options misstate the timing,
  hearing requirement, or enforcement authority.
