stem: A broker receives notice that the commission will inspect transaction records on Friday at
  6:00 p.m. Unless the broker agrees otherwise, what action may the broker take?
options:
  - Allow the inspection to proceed at the scheduled time.
  - Submit the records electronically to avoid the inspection.
  - Request a 24-hour delay to accommodate the inspection.
  - Refuse the inspection because it is outside the permitted hours.
key: D
explanation: The rule requires inspections to be conducted between 8:00 a.m. and 5:00 p.m., Monday
  through Friday, unless otherwise agreed. An inspection at 6:00 p.m. on Friday is outside those
  hours, so the broker may refuse unless they agree to the time. Allowing the inspection to proceed
  at the scheduled time violates the rule because it occurs outside the permitted hours without
  agreement.
