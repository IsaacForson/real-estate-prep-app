stem: Under 12 AAC 64.135(a), what is the minimum advance notice a broker must receive before the
  commission may inspect the broker's transaction records?
options:
  - 24 hours' advance notice
  - 48 hours' advance notice
  - 72 hours' advance notice
  - 96 hours' advance notice
key: C
explanation: The rule states that the broker must be given at least 72 hours' advance notice of an
  inspection. Therefore, 72 hours' advance notice is the minimum required. A distractor of 48 hours'
  advance notice is incorrect because it is less than the required minimum.
