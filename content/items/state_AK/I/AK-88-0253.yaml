stem: A licensee receives a written request from the commission for records related to a recent
  transaction. According to Alaska Stat. § 08.88.351(b)(3), what must the licensee do?
options:
  - The destruction of the records to protect client confidentiality
  - The submission of the records to the commission’s legal counsel
  - The making of the records available to the commission upon request
  - The retention of the records for an additional three years
key: C
explanation: The statute obligates a licensee to make records available to the commission when
  requested for an investigation. The correct option reflects this duty. The most tempting
  distractor suggests submitting records to legal counsel, which is not required by the rule.
