stem: A licensee is notified by the department that their books and records will be examined for a
  possible violation. According to Alaska Stat. § 08.88.037(b)(3), what may the department require
  the licensee to do?
options:
  - To pay the reasonable costs of the examination
  - To submit a written response within ten days
  - To attend a hearing within thirty days
  - To pay a civil fine of five thousand dollars
key: A
explanation: The statute authorizes the department to require the person whose records are being
  examined to pay the reasonable costs of that examination. The other options describe actions that
  are not mandated by this provision, such as responding to a complaint, attending a hearing, or
  paying a civil fine.
