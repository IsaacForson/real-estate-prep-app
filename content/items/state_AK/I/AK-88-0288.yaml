stem: A licensee’s civil penalty order is stayed pending appeal, and the court enters a final
  judgment in favor of the commission on June 5, 2025. Under AS 08.88.167(f), by what date must the
  licensee pay the penalty to avoid collection action?
options:
  - May 26, 2025
  - June 25, 2025
  - June 15, 2025
  - June 5, 2025
key: C
explanation: The statute requires payment within 10 days after a court judgment for a stayed order.
  Adding 10 days to June 5, 2025 yields June 15, 2025. Paying on June 5 provides no grace period,
  June 25 is 20 days late, and May 26 precedes the judgment.
