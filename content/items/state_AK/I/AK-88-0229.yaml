stem: A licensee keeps a separate file for the management of their own rental properties, not mixed
  with the broker's transaction files. According to Alaska Stat. § 08.88.351(b)(2), how long must
  the licensee retain these records?
options:
  - 12 months
  - 24 months
  - 36 months
  - 48 months
key: C
explanation: The rule explicitly states that a licensee who maintains records concerning management
  or sale of the licensee's own properties or client properties separate from the broker's file
  shall retain those records for a minimum of three years. Therefore, 36 months is the correct
  retention period. The distractor of 24 months incorrectly assumes a two‑year requirement, which
  the statute does not prescribe for these records.
