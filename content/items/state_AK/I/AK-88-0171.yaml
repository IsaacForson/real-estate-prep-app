stem: What may a real estate broker do under Alaska Stat. § 08.88.403?
options:
  - Contract with and pay an attorney or associate broker to review a transaction before closing
  - Keep a separate trust account for earnest money deposits in accordance with state law
  - Provide an accounting to any principal upon request as required by statute
  - Maintain transaction records for three years as mandated by the commission
key: A
explanation: The statute explicitly allows a broker to contract with and pay an attorney or
  associate broker to assist in reviewing a transaction before closing. The other options describe
  duties found elsewhere in the statutes, such as trust account requirements or record‑keeping
  obligations, which are not the authority granted by § 08.88.403.
