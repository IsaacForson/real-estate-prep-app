stem: A licensee repays in full all obligations to the real estate recovery fund. According to
  Alaska Stat. § 08.88.495, what effect does this repayment have on any disciplinary proceedings
  brought against the licensee under this chapter?
options:
  - Repayment in full of all obligations to the recovery fund reduces the penalty for disciplinary
    proceedings by half.
  - Repayment in full of all obligations to the recovery fund results in automatic license
    revocation.
  - Repayment in full of all obligations to the recovery fund does not nullify or modify the effect
    of disciplinary proceedings brought under this chapter.
  - Repayment in full of all obligations to the recovery fund nullifies any disciplinary proceedings
    brought under this chapter.
key: C
explanation: AS 08.88.495 expressly states that repayment in full of all obligations to the real
  estate recovery fund does not nullify or modify the effect of disciplinary proceedings brought
  under the provisions of this chapter. Therefore the commission may still pursue discipline. The
  distractor claiming that repayment nullifies proceedings directly contradicts the statutory
  language.
