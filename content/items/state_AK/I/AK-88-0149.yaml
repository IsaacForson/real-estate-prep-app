stem: An associate broker whose principal place of business is Office A also attempts to act as the
  direct supervisor of Office B, a branch office. According to Alaska Stat. § 08.88.311(a), is this
  permissible?
options:
  - Yes, because an associate broker may supervise any number of branch offices.
  - No, because an associate broker may serve as direct supervisor at only one office.
  - Yes, provided the associate broker also holds a broker license.
  - No, unless the associate broker obtains a temporary permit from the commission.
key: B
explanation: The statute limits an associate broker to serving as direct supervisor at only one
  office; supervising a second branch office exceeds that limit and is not allowed.
