stem: A real estate broker's associate broker makes a false promise to a client to induce a sale.
  The broker had no actual knowledge of the associate's statement and did not ratify the conduct
  after learning of it. Under Alaska Stat. § 08.88.071(c), is the broker liable for the associate's
  conduct?
options:
  - The broker is liable for the associate's false promise because the broker employed the associate.
  - The broker is not liable because the broker lacked actual knowledge of the associate's conduct
    and did not ratify it.
  - The broker is liable because the associate's conduct occurred within the scope of employment.
  - The broker is not liable only if the associate had a valid license at the time of the conduct.
key: B
explanation: Under § 08.88.071(c), an employee's conduct is attributable to the broker only if the
  broker has actual knowledge that the employee is going to engage in the conduct and agrees to it,
  either actively or by remaining silent, or ratifies the conduct after it occurs. Since the broker
  lacked actual knowledge and did not ratify, the conduct is not attributable, so the broker is not
  liable. The distractor that claims liability based solely on employment is incorrect because mere
  employment does not satisfy the statutory requirement of knowledge or ratification.
