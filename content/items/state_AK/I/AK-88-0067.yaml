stem: An individual engages in unlicensed real estate brokerage activity in Alaska and realizes a
  gain of $3,000. According to AS 08.88.167(b), what is the maximum civil penalty that may be
  imposed for this offense?
options:
  - $5,000.00
  - $3,000.00
  - $10,000.00
  - $8,000.00
key: D
explanation: Under AS 08.88.167(b), the civil penalty may not exceed $5,000 or the amount of gain
  realized plus $5,000, whichever is greater. For a $3,000 gain, gain plus $5,000 equals $8,000,
  which is greater than the $5,000 floor, so the maximum penalty is $8,000. The option stating
  $5,000 incorrectly ignores the gain, while the option stating $3,000 omits the mandatory $5,000
  addition.
citation:
  source: Alaska Stat. § 08.88.167(b)
  url: null
  quoted_text: A civil penalty levied under this section may not exceed $5,000, or the amount of gain
    realized plus $5,000, whichever is greater, for each offense.
