math:
  worked_solution: "Step 1: Identify gain = $3,000. Step 2: Compute gain plus $5,000 = $3,000 + $5,000
    = $8,000. Step 3: Determine the floor amount = $5,000. Step 4: Take the greater of $5,000 and
    $8,000 = $8,000. Therefore, the maximum civil penalty is $8,000."
  formulas:
