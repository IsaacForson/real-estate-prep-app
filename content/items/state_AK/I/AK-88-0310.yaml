stem: What must a broker deposit into the separate trust account required by Alaska Stat. §
  08.88.351(a)(3)?
options:
  - The broker must deposit earnest money deposits and purchase money only.
  - The broker must deposit all money collected in trust as required.
  - The broker must deposit only security deposits and contingency funds.
  - The broker must deposit only rental money and rental receipts.
key: B
explanation: Alaska Stat. § 08.88.351(a)(3) requires brokers to place every dollar they receive in a
  trust capacity into a separate trust account. This includes earnest money, purchase money,
  security deposits, contingency funds, rental money, rental receipts, and any other trust money.
  The option that limits deposits to only earnest money and purchase money is incorrect because it
  omits security deposits, contingency funds, rental money, rental receipts, and other trust money.
  The option that limits deposits to only security deposits and contingency funds is incorrect
  because it omits earnest money, purchase money, rental money, rental receipts, and other trust
  money. The option that limits deposits to only rental money and rental receipts is incorrect
  because it omits earnest money, purchase money, security deposits, contingency funds, and other
  trust money.
