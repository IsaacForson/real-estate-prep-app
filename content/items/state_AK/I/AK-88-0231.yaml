stem: A broker ends employment with a licensee who is a corporation and hands over the broker’s
  transaction records to that corporation. What must the broker do to comply with Alaska Stat.
  § 08.88.351(a)(6) regarding those records?
options:
  - The broker must transfer the records to the commission within thirty days and obtain a receipt
    for the transfer.
  - The broker must ensure by contract that the records are maintained and available for at least
    three years.
  - The broker must keep the records in the broker’s personal file indefinitely and ensure they
    remain accessible upon request.
  - The broker must destroy the records after one year and notify the commission in writing of the
    destruction.
key: B
explanation: Alaska Stat. § 08.88.351(a)(6) requires that when a broker delivers records to a
  partnership, corporation, or other business entity that is not another licensed broker upon
  termination of employment, the broker must have a contractual provision that the records be
  maintained and be available for a minimum of three years. The correct response reflects this
  contractual retention requirement, whereas the other choices describe actions not required by the
  statute.
