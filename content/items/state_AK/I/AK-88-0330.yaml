stem: A licensee represents a buyer in a residential transaction but does not inform the buyer that
  the licensee holds a real estate license or the name of the employing broker. According to 12 AAC
  64.130(9), what is the likely consequence if the commission discovers this omission?
options:
  - The licensee must complete extra continuing education hours.
  - The licensee must refund the commission to the client.
  - The licensee must face revocation or suspension of the license.
  - The licensee must pay a $250 filing fee to the recovery fund.
key: C
explanation: The rule lists failing to disclose one's license status or employing broker's name as
  grounds for revocation or suspension, so the licensee may face those actions. The $250 filing fee
  applies only to claims submitted to the real estate recovery fund, not to disclosure violations.
