stem: A buyer, who is a principal in a real estate transaction, requests an accounting of the
  earnest money deposit held by the broker. According to Alaska Stat. § 08.88.351(a)(2), what must
  the broker do?
options:
  - The broker must provide the accounting only after commission authorization.
  - The broker must provide the accounting only to the seller involved in the transaction.
  - The broker must provide the accounting to any principal in the transaction upon request.
  - The broker must provide the accounting to the buyer only if the transaction closes.
key: C
explanation: Under Alaska Stat. § 08.88.351(a)(2), a broker must provide upon request to any
  principal in a transaction an accounting for all money or other property collected or held in the
  course of each transaction. Therefore, the broker must provide the accounting to the principal
  upon request. The statement that the broker must provide the accounting only after commission
  authorization is incorrect because the duty to provide an accounting is not contingent on
  commission authorization.
