stem: A broker ends employment with a licensee who is another licensed broker and hands over the
  broker’s transaction records to that licensee. According to Alaska Stat. § 08.88.351(a)(6), what
  is the broker’s responsibility regarding those records?
options:
  - The broker is not required to ensure by contract the maintenance and availability of the records
    for a minimum of three years.
  - The broker must notify the commission within ten days of transferring the records and submit a
    copy of the transfer agreement.
  - The broker must ensure by contract the maintenance and availability of the records for a minimum
    of three years.
  - The broker must destroy the records within thirty days of transfer and provide written
    confirmation to the commission.
key: A
explanation: The statute imposes the contract‑maintenance requirement only when records are
  delivered to a partnership, corporation, or business entity other than another licensed broker;
  because the recipient is another licensed broker, the exemption applies and no contract is needed.
  The distractor that imposes the contract requirement incorrectly ignores this exemption.
