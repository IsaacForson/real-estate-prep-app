stem: A licensee receives community association assessment fees and deposits them into the
  association's operating account. Later, the operating account holds more money than needed for the
  next three months' budgeted expenses. Under Alaska Stat. § 08.88.351(b)(4), what must the licensee
  do?
options:
  - Transfer the excess funds to the community association reserve account as soon as practicable
  - Leave the excess in the operating account for future unexpected expenses
  - Return the excess to the association members as a refund
  - Commingle the excess with the licensee's personal funds for investment
key: A
explanation: The statute requires that if the operating account contains more money than estimated
  for the subsequent three months, the licensee shall transfer the excess to the reserve account as
  soon as practicable. Leaving it, refunding it, or commingling it violates the rule.
citation:
  source: Alaska Stat. § 08.88.011 et seq. — Alaska Statutes Title 08, Chapter 88 - Real Estate
    Brokers and Other Licensees (2025) — § 08.88.351
  url: null
  quoted_text: (4) shall promptly deposit community association funds or proceeds from periodic
    community association assessments into either a community association reserve account or a
    community association operating account; if, at any time, the community association operating
    account contains more money than is estimated to be needed for budgeted expenditures for the
    subsequent three months, the licensee shall transfer the excess funds to the community
    association reserve account as soon as practicable;
