stem: A licensee requests a hearing after receiving notice of a proposed temporary order to stop a
  deceptive practice under Alaska Stat. § 08.88.037(b)(1). Assuming the hearing is held, within how
  many days must the commission issue a final order after the hearing?
options:
  - 30 days
  - 10 days
  - 15 days
  - 5 days
key: B
explanation: The statute states that after a hearing is held, the commission shall issue a final
  order within 10 days. This timeline is distinct from the 15‑day period that applies when no
  hearing is requested and the temporary order becomes final by default. Therefore, the correct
  period after a hearing is 10 days.
