stem: According to Alaska Stat. § 08.88.351(a)(3), where must a broker deposit earnest money
  deposits collected in a transaction?
options:
  - A separate trust account in a bank
  - The broker's personal savings account
  - The broker's business operating account
  - The real estate recovery fund account
key: A
explanation: The statute directs brokers to deposit earnest money into a separate trust account in a
  bank, keeping those funds apart from personal or business accounts. Depositing the money into the
  broker's business operating account would commingle trust funds with operating funds, which the
  prohibition forbids.
