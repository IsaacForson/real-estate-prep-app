stem: A broker is authorized by the board of directors of a community association to collect and
  control association funds. Under Alaska Stat. § 08.88.351(a)(4), where must the broker keep these
  funds?
options:
  - In a general business account
  - In a separate account at a bank
  - In a personal savings account
  - In a trust account for transactions
key: B
explanation: The statute directs that when a broker is authorized to collect, control, or disburse
  association funds, those funds must be kept in a separate account in a financial institution.
  Placing the funds in a general business, trust, or personal account would commingle them and
  violate the requirement.
