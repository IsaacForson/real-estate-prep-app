stem: A licensee who owns rental property through a limited liability company must provide the
  employing broker with which of the following for each property owned, according to 12 AAC
  64.570(b)(2)(B)?
options:
  - Copies of the broker's advertising materials for the property.
  - Copies of the licensee's personal bank statements.
  - Copies of the property's zoning permits and tax assessments.
  - Copies of all financial records and rental agreements.
key: D
explanation: The rule obligates a licensee who owns rental property to provide the broker with
  copies of all financial records and rental agreements for each property. The correct option
  matches this requirement. The distractor about providing copies of the property's zoning permits
  is incorrect because those documents are not specified in the subsection.
