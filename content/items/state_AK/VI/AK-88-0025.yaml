stem: Which of the following is **NOT** a required component of a property management contract under
  12 AAC 64.550(b)?
options:
  - It includes the specific responsibilities of the property manager
  - It includes the authority and powers given by the property owner
  - It includes the period of the agreement and renewal terms
  - It includes a marketing plan for the property and tenant screening
key: D
explanation: Under 12 AAC 64.550(b), a property management contract must at minimum include the
  specific responsibilities of the property manager, the authority and powers given by the property
  owner, the period of the agreement, and the management fee. A marketing plan is not listed as a
  required component, making it the correct choice. The other options are required elements per the
  rule.
