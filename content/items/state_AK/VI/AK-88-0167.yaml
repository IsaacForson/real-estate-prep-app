stem: A licensee acting as a property manager wishes to transfer funds between two accounts
  maintained for the same property owner. What must the licensee have before making the transfer?
options:
  - Obtaining written authorization from the property owner.
  - Obtaining a separate listing agreement for the property.
  - Obtaining approval from the Alaska Real Estate Commission.
  - Obtaining a prior written property management contract.
key: A
explanation: The rule permits a property manager to transfer funds between accounts for the same
  owner only when they have written authorization from the owner. The correct option reflects this
  requirement. The distractor about obtaining a separate listing agreement is incorrect because a
  listing agreement does not satisfy the authorization requirement for fund transfers.
