stem: Under 12 AAC 64.550(e), what must a licensee who owns rental real property disclose in writing
  to all tenants and prospective tenants?
options:
  - That the licensee holds a real estate license and the name of the company with which the
    licensee is affiliated.
  - That the licensee has completed the required post‑license property management education.
  - That the licensee has obtained a property management contract for the property.
  - That the licensee will maintain a separate trust account for security deposits.
key: A
explanation: The rule requires a licensee who owns rental property to disclose in writing that they
  hold a real estate license and the name of their affiliated company. The correct option states
  this disclosure. The distractor about obtaining a property management contract is incorrect
  because the subsection does not mandate that disclosure.
