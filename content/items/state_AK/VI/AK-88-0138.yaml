stem: An applicant passed the real estate salesperson examination on May 10. According to 12 AAC
  64.060(e), what is the last date on which the applicant may submit a completed application to
  remain eligible for licensure?
options:
  - November 11
  - December 10
  - November 9
  - November 10
key: D
explanation: The regulation defines 'within six months after the individual has taken the
  examination' as the period beginning on the date the applicant passed the examination and ending
  on the same calendar day six months later. Adding six months to May 10 yields November 10 as the
  final permissible date. The other options are either one day off or incorrectly extend the period.
citation:
