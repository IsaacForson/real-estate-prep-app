    Real Estate Commission 12 AAC 64.060(e)
  url: null
  quoted_text: In this section and in AS 08.88.171 , 'within six months after the individual has taken
    the examination' means within the period that begins on the date the applicant passed the
    examination and ends on the same calendar day of the month that is six months after that
    examination date.
