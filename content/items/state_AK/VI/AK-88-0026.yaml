stem: What must a licensee have before conducting property management activity for another person,
  according to 12 AAC 64.550(b)?
options:
  - A prior written property management contract
  - A verbal agreement with the property owner
  - A disclosure statement to the prospective tenant
  - A copy of the property's recorded deed and lease
key: A
explanation: The rule states that a licensee may not conduct property management activity for
  another person without a prior written property management contract, making a written contract
  required. A verbal agreement does not satisfy this requirement.
