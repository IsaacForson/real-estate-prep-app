stem: An applicant who holds a current real estate license in another state seeks an Alaska
  salesperson license by endorsement. Which of the following is required under 12 AAC 64.059(c)?
options:
  - Submission of proof of having completed six contact hours of Alaska real estate license law
    course work
  - Submission of evidence of having owned a real estate business in the other state for the past
    six months
  - Submission of a signed statement from the applicant’s employing broker verifying at least 36
    months of experience
  - Submission of a broker training education certificate verifying 30 hours of broker training
key: A
explanation: For a salesperson license by endorsement, the applicant must submit evidence of
  completing six contact hours of course work on Alaska real estate license law as specified in 12
  AAC 64.063(c)(7). The other options describe requirements for broker or associate broker
  endorsements, not for a salesperson.
