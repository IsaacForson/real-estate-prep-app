stem: "A licensee collects a $1,200 security deposit from a tenant and deposits it into the
  licensee's personal checking account. Under 12 AAC 64.560, this action is:"
options:
  - It is considered fraudulent or dishonest conduct under AS 08.88.071
  - It is permitted if the licensee later moves the funds to a trust account
  - It is allowed only if the tenant gives written consent to the licensee
  - It is required to be reported to the commission within ten days
key: A
explanation: 12 AAC 64.560 states that failure to deposit prepaid rents or security deposits in a
  trust account as required by the Uniform Residential Landlord and Tenant Act is considered
  fraudulent or dishonest conduct. Depositing the security deposit into a personal account violates
  this rule, so the action is deemed fraudulent or dishonest. The other options incorrectly suggest
  the action is permissible or subject to different requirements.
