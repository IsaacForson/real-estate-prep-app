stem: A licensee collects a security deposit from a tenant and deposits the funds into his personal
  checking account instead of a trust account. What is the status of this action under Alaska law?
options:
  - Allowed as long as the funds are returned within 30 days
  - Considered fraudulent or dishonest conduct
  - Permissible if the licensee informs the tenant in writing
  - Only a violation if the amount exceeds $5,000
key: B
explanation: The rule provides that failure to deposit security deposits in a trust account as
  required by the Uniform Residential Landlord and Tenant Act is considered fraudulent or dishonest
  conduct. Therefore, depositing the funds personally is fraudulent or dishonest. Informing the
  tenant in writing does not excuse the failure to use a trust account.
