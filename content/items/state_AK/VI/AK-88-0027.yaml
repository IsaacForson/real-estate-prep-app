  quoted_text: Failure of a licensee engaged in property management to deposit prepaid rents or
    security deposits in a trust account as required by AS 34.03 (Uniform Residential Landlord and
    Tenant Act) is considered fraudulent or dishonest conduct within the meaning of AS 08.88.071
    (a)(3)(A)(iv).
