stem: A property manager has written authorization from the owner to transfer funds between two
  accounts maintained for the same property. What must the licensee do when making the transfer?
options:
  - Obtain a new property management contract for the transfer
  - Notify the real estate commission within 24 hours of the intended transfer
  - Make entries identifying the transaction in each ledger account
  - Obtain verbal approval from the property owner for the fund transfer
key: C
explanation: The rule requires written authorization and that the licensee make entries fully
  identifying the transaction in each ledger account affected. Therefore, the licensee must make
  proper entries. Verbal approval is insufficient because the rule mandates written authorization.
