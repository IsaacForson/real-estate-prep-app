stem: An owner of a residential duplex decides to lease one unit to a tenant and handles all
  negotiations, showings, and lease preparation himself. Under M.G.L. c. 112 § 87QQ, is the owner
  required to hold a real estate broker or salesperson license?
options:
  - The owner must hold a salesperson license because he is negotiating a lease.
  - The owner must hold a broker license because leasing property is a brokerage activity.
  - The owner must hold a license only if he receives a commission from the tenant.
  - The owner is not required to hold a license because he is acting as owner for his own property.
key: D
explanation: Section 87QQ exempts any person who, acting for himself as owner, performs broker or
  salesman acts with reference to real estate owned by him. The owner leasing his own property falls
  within this exemption, so no license is required. The distractors incorrectly impose a license
  requirement despite the statutory exemption.
