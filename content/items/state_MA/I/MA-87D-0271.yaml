stem: A licensee refuses to appear after being summoned by the Board to testify and produce
  documents. Under M.G.L. c. 112 § 87BBB, what action may the Board take?
options:
  - The Board may apply to the superior court for an order to compel witness appearance and
    production.
  - The Board may impose a fine of up to five hundred dollars on the witness for noncompliance.
  - The Board may suspend the witness's real estate license immediately without further hearing.
  - The Board may request the Attorney General to prosecute the witness for contempt of court.
key: A
explanation: Under M.G.L. c.112 §87BBB, the board may apply to the superior court for an order
  compelling a witness to appear, testify, or produce documents when the witness refuses to comply.
  This corresponds to the option stating that the board may apply to the superior court for an order
  to compel witness appearance and production. The board does not have the authority to impose fines
  directly; only a court may levy fines after contempt proceedings, so the option about imposing a
  fine of up to five hundred dollars is incorrect. The board cannot suspend a license without a
  further hearing, nor may it request the Attorney General to prosecute for contempt; those actions
  are not authorized by this statute, making the remaining options incorrect.
