stem: Under M.G.L. c. 112 § 87BBB, what compensation are witnesses summoned before the Board
  entitled to receive?
options:
  - The same fees and mileage paid to witnesses in civil cases in the courts.
  - Double the fees and mileage paid to witnesses in civil cases in the courts.
  - No compensation; witnesses serve voluntarily, receiving no fees or mileage.
  - Only mileage reimbursement is provided; no fees or additional compensation are paid.
key: A
explanation: M.G.L. c. 112 § 87BBB provides that witnesses summoned before the board shall be paid
  the same fees and mileage paid to witnesses in civil cases in the courts. Therefore the correct
  answer is the choice that states witnesses receive the same fees and mileage as civil‑court
  witnesses. The choice that proposes double fees and mileage is incorrect because the statute does
  not authorize a higher rate.
