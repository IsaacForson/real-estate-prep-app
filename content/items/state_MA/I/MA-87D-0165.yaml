stem: A real estate licensee receives a final finding from the Massachusetts Commission Against
  Discrimination that the licensee committed an unlawful practice in violation of Chapter 151B
  arising out of their occupation. The finding indicates that a prior violation occurred within two
  years of the current violation. Under M.G.L. c. 112 § 87AAA, what is the required suspension
  period for the licensee's license?
options:
  - One hundred and eighty days
  - One hundred and twenty days
  - Ninety days
  - Sixty days
key: C
explanation: M.G.L. c. 112 § 87AAA mandates that if the commission finds a violation occurred within
  two years of a prior final violation, the board shall suspend the license for a period of ninety
  days. The standard suspension for a first offense is sixty days, but the repeat offense provision
  triggers the longer ninety-day period.
