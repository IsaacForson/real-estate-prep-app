stem: The board votes to suspend a licensee's license but does not provide a written statement of
  reasons. Under M.G.L. c. 112 § 87BBB, what is missing that is required for a valid decision?
options:
  - A written decision signed and stating reasons
  - A verbal decision stating reasons and findings
  - A written decision unsigned but stating reasons
  - A written decision signed but lacking reasons
key: A
explanation: A board decision must be in writing, signed by the members making it, and contain a
  statement of the reasons. Without a written decision stating reasons, the decision is incomplete.
  Majority approval, notice, and a hearing are also required but the scenario specifically omits the
  written statement.
