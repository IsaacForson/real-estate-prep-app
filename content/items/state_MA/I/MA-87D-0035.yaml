stem: A licensee pays a referral fee to an individual who is not licensed as a broker or salesman in
  Massachusetts or any other state. Under M.G.L. c. 112 § 87AAA, what action may the Board of
  Registration take?
options:
  - A formal warning and mandatory continuing education
  - A requirement to repay the commission to the client
  - A suspension, revocation, or non-renewal of the license
  - A civil lawsuit filed by the unlicensed person
key: C
explanation: Section 87AAA(e) states that the board may suspend, revoke, or refuse to renew a
  license when the licensee has paid commissions or fees to or divided them with any person who is
  required to be licensed but is not. The other options describe remedies not authorized by this
  statutory provision.
