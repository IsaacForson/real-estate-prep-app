stem: A broker places an advertisement in a local newspaper that shows only the broker’s telephone
  number and street address, with no mention of the broker’s name. Under 254 CMR 3.00(9)(a), what
  action must the broker take to comply with the rule?
options:
  - The broker must display a copy of the license in the advertisement
  - The broker must include the name of the real estate broker in the advertisement
  - The broker must obtain written consent from the prospective client before publishing
  - The broker must ensure the advertisement is also posted on the broker’s website
key: B
explanation: The rule requires that all advertisements include the name of the real estate broker.
  Therefore, the broker must add the broker's name to the ad. Displaying the license in the
  advertisement is not required by this rule.
