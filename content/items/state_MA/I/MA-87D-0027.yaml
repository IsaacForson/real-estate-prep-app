stem: Which of the following individuals is exempt from the licensing requirements of M.G.L. c. 112
  §§ 87RR-87DDD under § 87QQ?
options:
  - A licensed auctioneer handling personal real estate transactions
  - A real estate salesperson employed by a brokerage firm
  - An independent contractor managing property for an owner
  - A mortgage loan officer working for a mortgage company
key: A
explanation: Section 87QQ expressly exempts a person acting as a licensed auctioneer from the broker
  and salesman licensing requirements. The other options describe activities that require a license
  because they involve performing brokerage or salesman acts for others without falling under the
  statutory exemption.
