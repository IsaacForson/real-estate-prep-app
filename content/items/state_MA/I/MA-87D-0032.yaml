stem: A licensee tells a prospective buyer that the property’s roof was replaced last year when it
  is actually 20 years old. Under M.G.L. c. 112 § 87AAA, what action may the Board of Registration
  take?
options:
  - Issue a cease-and-desist letter and require correction
  - A requirement to attend ethics training
  - A suspension, revocation, or non-renewal of the license
  - A monetary penalty and restitution order
key: C
explanation: Section 87AAA authorizes the board to suspend, revoke, or refuse to renew a license
  when the licensee has knowingly made any substantial misrepresentation. The distractor about
  attending ethics training is not a statutory disciplinary option listed for this violation.
