stem: Under M.G.L. c. 112 § 87BBB, what is the effect of filing an appeal on a board's decision to
  refuse renewal, suspend, or revoke a license?
options:
  - The appeal stays the decision while the court reviews it.
  - The appeal does not stay the decision; the sanction remains in effect.
  - The board must halt the decision until the court rules on the appeal.
  - The appeal suspends the decision only if the licensee posts a bond.
key: B
explanation: The statute expressly states that an appeal does not operate as a stay of the board's
  decision to refuse renewal, suspend, or revoke a license. Therefore the sanction remains in effect
  during the appeal. The other options incorrectly suggest a stay, a board halt, or a bond
  condition.
citation:
