stem: Under 254 CMR 3.00(10)(b), what must a broker's escrow account record clearly indicate?
options:
  - The date and from whom the broker received the money
  - The date and to whom the money was sent
  - The date of deposit and the interest rate earned
  - The date of withdrawal and the purpose of the withdrawal
key: A
explanation: 254 CMR 3.00(10)(b) requires escrow records to clearly indicate the date and the person
  from whom the broker received the money. Therefore, a record that states the date and from whom
  the money was received satisfies the requirement. A record that only shows the date and to whom
  the money was sent does not meet the statute because the law does not mandate that information.
  Likewise, noting the date of deposit with the interest rate earned, or the date of withdrawal with
  its purpose, does not fulfill the specific requirement of indicating the source of the funds.
