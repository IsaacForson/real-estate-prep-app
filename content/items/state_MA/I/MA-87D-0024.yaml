stem: A licensee receives a written decision from the Board suspending his license. Under M.G.L. c.
  112 § 87BBB, within how many days must he file an appeal to the superior court?
options:
  - Twenty days
  - Ten days
  - Thirty days
  - Five days
key: A
explanation: The law requires an appeal to be filed within twenty days following receipt of the
  board's notification. Ten days is the notice period for a hearing, not the appeal deadline, making
  it a common distractor.
