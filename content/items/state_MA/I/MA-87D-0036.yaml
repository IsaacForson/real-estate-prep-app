stem: The Board sends a licensee a notice dated April 1 stating that a hearing to consider
  suspension of his license will be held on April 10. Under M.G.L. c. 112 § 87BBB, is the notice
  sufficient?
options:
  - No, because the notice must be given at least fifteen days.
  - Yes, because the notice includes a statement of the grounds.
  - No, because at least ten days' written notice is required.
  - Yes, because the notice is given exactly nine days before the hearing.
key: C
explanation: The key is correct because §87BBB requires at least ten days' written notice before a
  hearing that may result in suspension or revocation; a notice dated April 1 for a hearing on April
  10 provides only nine days, which is insufficient. The distractor claiming the notice is
  sufficient because it is nine days before the hearing ignores the minimum ten‑day requirement.
