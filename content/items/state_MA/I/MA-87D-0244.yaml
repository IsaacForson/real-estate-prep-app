stem: According to 254 CMR 3.00(4), where must a broker or salesperson display their license?
options:
  - Displayed in a conspicuous location readily observable to the public
  - Displayed in a hallway near the entrance but not visible from the street
  - Displayed in a locked file cabinet at the main office reception desk
  - Displayed in a private office behind the broker's desk of the firm
key: A
explanation: The rule requires the license to be displayed in a conspicuous location that is readily
  observable to the general public. Displaying it in a locked file cabinet is not conspicuous and
  therefore violates the rule.
