stem: Under M.G.L. c. 112 § 87AAA, what must the Board of Registration do upon receiving a verified
  written complaint from an aggrieved person?
options:
  - The board shall investigate the action of any broker or salesman.
  - The board shall suspend, revoke, or refuse to renew any license.
  - The board shall issue a cease and desist order.
  - The board shall require the licensee to complete continuing education.
key: A
explanation: The statute states that upon a verified written complaint, the board shall investigate
  the action of any broker or salesman. This makes investigation mandatory. The other options
  describe permissive disciplinary actions that the board may take but is not required to take upon
  receiving a complaint. Therefore, only the option stating that the board shall investigate the
  action of any broker or salesman is correct.
