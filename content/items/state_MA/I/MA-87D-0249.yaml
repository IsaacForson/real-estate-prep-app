stem: A broker wishes to advertise in Massachusetts newspapers a land development located in Florida
  that is being promoted for sale. Under M.G.L. c. 112 § 87AAA, what must occur before the broker
  may engage in such advertising?
options:
  - The owner or developer must submit land details and proposed terms and deposit a
    board‑determined sum
  - The broker must secure a special out‑of‑state advertising permit from the board before proceeding
  - The broker must first sell one unit in the development before any advertising can begin in
    Massachusetts
  - The owner or developer must obtain board approval before advertising any out‑of‑state property
key: A
explanation: The law prohibits a broker from promoting out‑of‑state land developments unless the
  owner or developer has submitted full particulars to the board and deposited a sum to cover
  investigation costs. The broker cannot rely on a special advertising license; the obligation lies
  with the owner or developer.
