stem: A licensee is found guilty of violating clause (k) of M.G.L. c. 112 § 87AAA for publishing an
  advertisement that indicates a preference based on race. The Board of Registration imposes a fine
  of $1,800. Is this fine within the statutory range permitted by law?
options:
  - The fine is below the minimum allowed.
  - The fine is within the statutory range.
  - The fine is exactly the minimum allowed.
  - The fine is above the maximum allowed.
key: B
explanation: Under M.G.L. c. 112 § 87AAA a violation of clause (k) is punishable by a fine of not
  less than $1,000 nor more than $2,500. The imposed fine of $1,800 falls between those two limits,
  so the fine is permissible. The statement that the fine is below the minimum is incorrect because
  $1,800 exceeds the $1,000 minimum.
citation:
