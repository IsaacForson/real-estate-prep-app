math:
  worked_solution: |-
    Minimum fine = $1,000
    Maximum fine = $2,500
    Imposed fine = $1,800
    Check lower bound: $1,800 ≥ $1,000 → true
    Check upper bound: $1,800 ≤ $2,500 → true
    Both conditions are true, therefore the fine is within the statutory range.
