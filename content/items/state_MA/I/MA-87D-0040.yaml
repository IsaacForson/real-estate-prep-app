stem: Under M.G.L. c.112 § 87QQ, which of the following individuals is exempt from the real estate
  broker licensing requirements when performing brokerage acts?
options:
  - A person who acts as attorney in fact under a duly executed power of attorney from an owner of
    real estate authorizing the final consummation by performance of any contract for the sale,
    leasing or exchange of real estate
  - A person who regularly employs unlicensed assistants to show property to prospective buyers and
    receives compensation for such services in this state.
  - A person who accepts a referral fee from another broker for a real estate transaction in which
    they did not act as broker or salesman regularly
  - A person who advertises real estate services using a trade name that has not been registered
    with the Board of Registration of Real Estate Brokers and Salespersons today.
key: A
explanation: The statute expressly exempts a person acting as attorney in fact under a duly executed
  power of attorney from an owner of real estate who is authorized to consummate any contract for
  the sale, leasing or exchange of real estate. The other options describe activities that still
  require a license because they involve performing brokerage acts without the statutory exemption.
