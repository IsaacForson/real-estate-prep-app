stem: A licensee shows a property to a prospective buyer and, during the showing, states that the
  roof was replaced two years ago when it is actually 20 years old. The buyer relies on this
  statement and makes an offer. Under M.G.L. c. 112 § 87AAA, which action is the Board of
  Registration authorized to take?
options:
  - Issue a cease‑and‑desist order requiring the licensee to stop showing the property
  - Suspend, revoke, or refuse to renew the licensee’s license
  - Order the licensee to pay restitution equal to the difference in market value
  - Refer the matter to the local police department for criminal prosecution
key: B
explanation: Section 87AAA authorizes the Board to suspend, revoke, or refuse to renew a license
  when the licensee has knowingly made any substantial misrepresentation in performing an act
  authorized by the license. Stating that the roof was replaced two years ago when it is 20 years
  old is a knowing substantial misrepresentation, triggering the Board’s disciplinary authority. The
  other options describe actions not granted to the Board by this statute.
