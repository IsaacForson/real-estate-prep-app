stem: A licensee holds a buyer's earnest money deposit in his personal account for two months before
  remitting it to the seller. Under M.G.L. c. 112, § 87AAA, this conduct is grounds for the Board to
  do what?
options:
  - The board may issue a written warning only
  - The board may require the licensee to pay a fine
  - The board may suspend or revoke the license
  - The board may order continuing education
key: C
explanation: Section 87AAA(d) states that failing, within a reasonable time, to account for or remit
  any moneys belonging to others that have come into the licensee's possession is grounds for
  discipline, including suspension or revocation of the license. Therefore, the board may suspend or
  revoke the license. The distractor claiming the board may require the licensee to pay a fine is
  wrong because §87AAA does not authorize the board to impose fines; fines are specified elsewhere
  for unlicensed activity.
