stem: A seller knows the home is not legally required to disclose that a prior occupant died there,
  so the seller relies on M.G.L. c. 93, § 114 and says nothing. Later the buyer asks directly
  whether anyone died in the home, and the seller falsely answers no. Under § 114, is the seller
  protected from liability?
options:
  - No, because § 114 does not authorize a false statement
  - Yes, because § 114 fully shields any statement about the home
  - No, but the seller gave that answer after closing day
  - Yes, because the buyer did not ask about the home in writing
key: A
explanation: Section 114 states that its non-disclosure protection does not authorize a seller,
  lessor, or broker to make a misrepresentation of fact or false statement.
citation:
  source: M.G.L. c. 93, § 114
  url: null
  quoted_text: Notwithstanding the foregoing, the provisions of this section shall not authorize a
    seller, lessor or real estate broker or salesman to make a misrepresentation of fact or false
    statement.
