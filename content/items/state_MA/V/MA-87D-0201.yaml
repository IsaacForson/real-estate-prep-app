stem: A licensee is showing a home and the buyer asks, "Has anyone ever been suspected of having HIV
  while living here?" The licensee knows that a former tenant was suspected of HIV infection but
  answers, "No, there has **never** been any such suspicion." Under M.G.L. c. 93, § 114, is the
  licensee protected from liability for that answer?
options:
  - No, because the buyer’s question converts the suspicion into a material fact that must be
    disclosed.
  - Yes, because suspicion of HIV infection is not a material fact requiring disclosure.
  - No, because the statute does not authorize making a false statement about a psychologically
    impacted fact.
  - Yes, because the licensee may rely on the statute to avoid answering the question.
key: C
explanation: Under § 114, a suspicion of HIV infection is listed as a psychologically impacted fact
  that need not be disclosed, but the statute expressly states it does not authorize a seller,
  lessor, or broker to make a misrepresentation or false statement. By answering “No” when a
  suspicion existed, the licensee made a false statement, so protection does not apply. The options
  that claim the buyer’s question converts the suspicion into a material fact or that the
  non‑disclosure rule shields false statements are incorrect. The option suggesting the licensee may
  rely on the statute to avoid answering is also incorrect because the statute provides no such
  protection.
