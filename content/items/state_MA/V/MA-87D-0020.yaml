stem: Several consumers were separately harmed by the same deceptive pricing scheme. One of them
  wants to sue under M.G.L. c. 93A, § 9 on behalf of the whole group. Under § 9, what must the court
  find before that consumer may proceed as a class representative?
options:
  - That every other harmed consumer has personally joined the suit
  - That the group's total damages exceed a fixed dollar amount
  - That the consumer adequately and fairly represents the others
  - That the attorney general has already approved the class claim
key: C
explanation: Section 9 allows a consumer to sue on behalf of similarly injured persons only if the
  court finds in a preliminary hearing that the consumer adequately and fairly represents those
  other persons.
citation:
  source: M.G.L. c. 93A, § 9
  url: null
  quoted_text: if the court finds in a preliminary hearing that he adequately and fairly represents
