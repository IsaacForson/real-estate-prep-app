stem: Under 254 CMR 3.00(d), what must a broker do before entering into an agreement to act as a
  secondary or sub-agent for a seller or purchaser?
options:
  - Inform the seller or purchaser in writing that the sub-agent is exempt from fiduciary duties.
  - Inform the seller or purchaser in writing that the sub-agent must be licensed in Massachusetts.
  - Inform the seller or purchaser in writing that the sub-agent's actions may subject the seller or
    purchaser to vicarious liability.
  - Inform the seller or purchaser in writing that the sub-agent will receive a commission from the
    transaction.
key: C
explanation: Under 254 CMR 3.00(d), a broker must inform the seller or purchaser in writing that the
  sub-agent's actions may subject the seller or purchaser to vicarious liability before entering
  into a sub-agency agreement.
