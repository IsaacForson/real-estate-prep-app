stem: The attorney general sues a business, and the court finds the business used a deceptive
  practice that it knew or should have known violated M.G.L. c. 93A, § 2. Under § 4, what civil
  penalty may the court impose per violation?
options:
  - A civil penalty equal to the business's annual revenue
  - A civil penalty capped at the attorney general's filing cost
  - A civil penalty that the business itself sets by written offer
  - A civil penalty of not more than five thousand dollars
key: D
explanation: Section 4 authorizes a court to require a person who knew or should have known its
  practice violated section two to pay a civil penalty of not more than five thousand dollars for
  each violation.
