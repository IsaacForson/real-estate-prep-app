stem: Under M.G.L. c. 93, § 114, what is the legal effect of a property being psychologically
  impacted regarding disclosure?
options:
  - It must be disclosed only if known
  - It must be disclosed only if asked
  - It is not required to be disclosed
  - It must be disclosed to the buyer
key: C
explanation: The statute states that the fact or suspicion that real property may be or is
  psychologically impacted shall not be deemed to be a material fact required to be disclosed in a
  real estate transaction. Therefore, disclosure is not required. The distractor claiming it must be
  disclosed to the buyer contradicts the explicit language of the statute.
