stem: A buyer asks a licensee whether the property was ever occupied by someone suspected of having
  HIV. The licensee declines to answer the question. Under M.G.L. c. 93, § 114, is the licensee
  protected from liability for refusing to answer?
options:
  - Yes, because the buyer can seek damages under common law for fraudulent concealment.
  - No, because the licensee must answer all buyer inquiries truthfully.
  - No, because refusing to answer constitutes a misrepresentation of fact.
  - Yes, because the statute prohibits liability for failure to disclose psychologically impacted
    facts.
key: D
explanation: The statute provides that no cause of action shall arise for failure to disclose
  psychologically impacted facts; refusing to answer is a form of non-disclosure and therefore does
  not create liability. The most tempting distractor is B because the statute expressly bars
  common‑law actions for such failures, making that remedy unavailable.
