stem: A consumer wants to bring a private lawsuit against a broker under M.G.L. c. 93A, § 9 for a
  deceptive act. Before filing suit, what must the consumer first do?
options:
  - File a complaint with the Board of Registration first
  - Send a written demand for relief thirty days beforehand
  - Post a litigation bond with the superior court clerk first
  - Obtain a signed release from the broker's employing agency
key: B
explanation: Section 9 requires that at least thirty days before filing such an action, a written
  demand for relief describing the act and injury be mailed or delivered to the prospective
  respondent.
citation:
  source: M.G.L. c. 93A, § 9
  url: null
  quoted_text: At least thirty days prior to the filing of any such action, a written demand for
    relief, identifying the claimant and reasonably describing the unfair or deceptive act or
    practice relied upon and the injury suffered, shall be mailed or delivered to any prospective
    respondent.
