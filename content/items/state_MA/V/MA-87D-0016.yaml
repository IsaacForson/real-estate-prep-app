stem: A court finds for a consumer under M.G.L. c. 93A, § 9, but the consumer's actual damages turn
  out to be very small. Under § 9, how is the consumer's recovery set in that situation?
options:
  - Recovery is capped at half of the demand letter amount
  - Recovery is limited strictly to the consumer's filing fee
  - Recovery is set at actual damages or twenty-five dollars
  - Recovery is denied because damages are below a set floor
key: C
explanation: Section 9 provides that where the court finds for the petitioner, recovery is set at
  the amount of actual damages or twenty-five dollars, whichever amount is greater.
