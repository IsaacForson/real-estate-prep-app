explanation: Section 4 states that anyone who violates the terms of an injunction shall forfeit and
  pay a civil penalty of not more than ten thousand dollars for each violation. The lower amounts
  reflect the standard penalty for ordinary violations, but the injunction‑violation penalty is
  specifically set at $10,000.
