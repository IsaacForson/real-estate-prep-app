stem: Under M.G.L. c. 112, § 87AAA, what must the Board do upon receiving a verified written
  complaint from an aggrieved person?
options:
  - Investigate the broker’s alleged misconduct
  - Require the licensee to attend remedial training
  - Refer the matter to the district attorney
  - Suspend the license pending investigation
key: A
explanation: The statute says the board shall investigate the action upon a verified written
  complaint from an aggrieved person. Suspending the license is a possible outcome after
  investigation, not the immediate required step.
