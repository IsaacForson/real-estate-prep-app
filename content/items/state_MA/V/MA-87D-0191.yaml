stem: A licensee tells a prospective buyer that a property is definitely not haunted, although the
  licensee has no evidence to support that claim. Later, the buyer learns that the property was
  previously reported as the site of an alleged parapsychological phenomenon. Under M.G.L. c. 93, §
  114, is the licensee protected from liability for making that statement?
options:
  - Yes, because statements about paranormal activity are not required disclosures.
  - Yes, because the licensee had no intent to deceive.
  - No, because the section does not authorize a false statement.
  - No, because the buyer relied on the statement to their detriment.
key: C
explanation: The statute explicitly states that its provisions do not authorize a seller, lessor, or
  broker to make a misrepresentation of fact or false statement; claiming the property is definitely
  not haunted without basis constitutes a false statement if untrue. The most tempting distractor is
  A because while disclosure of psychologically impacted conditions is not required, the statute
  still prohibits false statements regardless of disclosure obligations.
