stem: The Attorney General believes a real estate company is using deceptive advertising. Before
  filing a lawsuit under M.G.L. c. 93A, § 4, what must the Attorney General do at **LEAST** five
  days prior to commencing the action?
options:
  - Obtain written consent from the defendant’s attorney
  - Notify the person and offer a chance to confer
  - Publish a notice of the lawsuit in a local newspaper
  - File a temporary restraining order in the appropriate court
key: B
explanation: The law requires the attorney general to notify the person of the intended action and
  give an opportunity to confer at least five days before filing suit, unless seeking a temporary
  restraining order. Filing a temporary restraining order is exempt from this notice requirement, so
  it is not the required step.
citation:
  source: "### M.G.L. c. 93A — Massachusetts General Laws c. 93A — Regulation of Business Practices
    for Consumers' Protection (§§ 2, 4, 9) (selected sections cited by the exam outline), official
