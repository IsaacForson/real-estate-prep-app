    malegislature.gov refuses connections from scripts § 4"
  url: null
  quoted_text: At least five days prior to the commencement of any action brought under this section,
    except when a temporary restraining order is sought, the attorney general shall notify the
    person of his intended action, and give the person an opportunity to confer with the attorney
    general in person or by counsel or other representative as to the proposed action.
