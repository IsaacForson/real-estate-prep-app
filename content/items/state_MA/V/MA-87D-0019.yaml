stem: A broker wants to purchase, for personal use, a house that a client has listed with the broker
  for sale. Under 254 CMR 3.00, what must happen before the broker may do this?
options:
  - The broker must transfer the listing to a different firm entirely
  - The broker must disclose the interest in writing to every party
  - The broker must first obtain a waiver from the Board itself
  - The broker must wait until the listing agreement has expired
key: B
explanation: The regulation requires that before acquiring an interest in property, the broker or
  salesperson shall fully disclose in writing to all parties to the transaction the nature of the
  interest.
