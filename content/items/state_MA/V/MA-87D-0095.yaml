stem: A licensee lists a property and, knowing that there have been no reports of paranormal
  activity, tells prospective buyers that the house is "definitely haunted" to increase interest.
  After closing, the buyers learn there was never any alleged parapsychological phenomenon and sue
  for misrepresentation. Under M.G.L. c. 93, § 114, is the licensee protected from liability?
options:
  - Under §114, the licensee is protected from liability because disclosure of psychologically
    impacted facts is not required.
  - Under §114, the licensee is protected from liability because the statement concerned a
    non‑material, supernatural claim.
  - Under §114, the licensee is not protected from liability because the section does not authorize
    a false statement.
  - Under §114, the licensee is protected from liability because the buyer assumed the risk of any
    alleged haunting.
key: C
explanation: Section 114 explicitly states that its provisions do not authorize a seller, lessor, or
  broker to make a misrepresentation of fact or false statement. Therefore, the licensee’s false
  claim about the property being haunted removes any statutory protection. The distractors that
  claim protection rely only on the non‑disclosure rule and ignore the prohibition on false
  statements.
