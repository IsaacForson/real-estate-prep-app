stem: Under M.G.L. c. 93A, § 4, how many days prior to filing a lawsuit (**EXCEPT** when seeking a
  temporary restraining order) must the Attorney General notify a person of intended action?
options:
  - Three days
  - Five days
  - Seven days
  - Ten days
key: B
explanation: The statute requires the Attorney General to give at least five days’ notice before
  commencing an action under § 4, unless a temporary restraining order is sought. This notice period
  allows the person to confer with the Attorney General. The three‑day and seven‑day options
  misstate the statutory minimum, and ten days exceeds the requirement.
