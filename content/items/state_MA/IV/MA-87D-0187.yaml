stem: Under Massachusetts law, what must a licensee provide to both the buyer and seller in a real
  estate transaction?
options:
  - A copy of the purchase and sale agreement
  - A written agency disclosure notice
  - A copy of the listing agreement
  - A receipt of earnest money deposit
key: A
explanation: The key is correct because subsection (i) of Section 87AAA requires licensees to give
  both buyer and seller a copy of the purchase and sale agreement; failure to do so is grounds for
  discipline. The distractor about a written agency disclosure notice, while required elsewhere, is
  not the specific requirement stated in subsection (i).
