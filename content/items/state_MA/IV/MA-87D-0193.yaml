stem: Which lease provision is void as against public policy under Massachusetts law?
options:
  - C) A clause requiring the tenant to pay a late fee after five days overdue.
  - B) A clause indemnifying the landlord for liability arising from the landlord's own negligence.
  - D) A clause permitting the landlord to show the unit to prospective buyers with 24 hours notice.
  - A) A clause requiring the tenant to maintain the premises in a clean condition.
key: B
explanation: The quoted text shows that any lease provision indemnifying the landlord for own
  negligence is void as against public policy. The distractor A describes a maintenance clause,
  which is permissible; C describes a late fee clause, which is not addressed by this provision; D
  describes a showing clause, which is allowed under other statutes.
