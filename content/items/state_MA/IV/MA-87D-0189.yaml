stem: A Massachusetts broker agrees to sell a property for a stated price and keeps any amount
  received above that price as commission. Which provision of Section 87AAA does this conduct
  violate?
options:
  - Accepted, given or charged any undisclosed commission, rebate or profit on expenditures for a
    principal
  - Accepted to act for more than one party without the knowledge and consent of all parties
  - Accepted a copy of the purchase and sale agreement for both buyer and seller
  - Accepted a net listing agreement to keep excess proceeds as commission
key: D
explanation: The key is correct because subsection (l) expressly forbids accepting a net listing
  agreement that allows the broker to keep excess proceeds as commission. The distractor about
  undisclosed commissions or rebates pertains to subsection (f), which addresses a different
  prohibited conduct.
