stem: A salesperson working under a broker receives a $5,000 earnest money check from a buyer.
  According to Massachusetts regulations, what must the salesperson do with the check?
options:
  - Immediately turn the check over to the employing broker
  - Promptly deposit the check into a personal escrow account
  - Quickly give the check to the buyer's attorney promptly
  - Immediately place the check in salesperson's trust account
key: A
explanation: Under 254 CMR 3.00(10)(c), a salesperson engaged by another broker must immediately
  turn over all deposit money received to the employing broker and may not hold client funds.
  Depositing into a personal account, holding the check, or giving it to an attorney violates this
  requirement.
citation:
