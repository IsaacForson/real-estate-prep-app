stem: Under Massachusetts regulations, what must a broker or salesperson provide to a prospective
  purchaser or seller of real estate at the first personal meeting to discuss a specific property?
options:
  - A list of recent comparable sales in the area
  - A signed purchase and sale agreement for the property
  - A copy of their current real estate license certificate
  - A written agency disclosure notice approved by the Board
key: D
explanation: "Under 254 CMR 3.00(13)(a), a broker or salesperson must provide a notice developed and
  approved by the board that clearly discloses the relationship with the prospective purchaser or
  seller. The other options describe actions not required by this rule: providing a license copy, a
  purchase agreement, or comparable sales does not satisfy the agency disclosure requirement."
citation:
