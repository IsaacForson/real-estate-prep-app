stem: A licensee prepares a purchase and sale agreement for a buyer and seller but provides the
  signed copy only to the buyer, not to the seller. Under M.G.L. c. 112, § 87AAA(i), what action may
  the board take regarding the licensee's license?
options:
  - The board may suspend, revoke, or refuse to renew the licensee's license.
  - The board may fine the licensee between one thousand and twenty-five hundred dollars.
  - The board may order the licensee to serve imprisonment of up to six months.
  - The board may require the licensee to complete additional continuing education coursework.
key: A
explanation: The board may suspend, revoke, or refuse to renew a license when it finds the licensee
  failed to give both buyer and seller a copy of the purchase and sale agreement, as stated in §
  87AAA(i). Therefore, the correct action is that the board may suspend, revoke, or refuse to renew
  the licensee's license. The distractor suggesting a fine or imprisonment applies only to
  violations of the steering prohibition in § 87AAA(k), not to this failure to provide the
  agreement. The other distractors describe actions not authorized by the statute for this
  violation.
