stem: A Massachusetts broker represents both the buyer and the seller in the same transaction
  without informing either party. Which provision of Section 87AAA does this conduct violate?
options:
  - Acted for more than one party without knowledge and consent
  - Acted as broker and undisclosed principal in same transaction
  - Acted to fail to account for or remit moneys belonging to others
  - Acted to accept undisclosed commission or rebate
key: A
explanation: The key is correct because subsection (c) prohibits acting for more than one party to a
  transaction without the knowledge and consent of all parties; the scenario directly matches this
  prohibition. The distractor about acting as broker and undisclosed principal relates to subsection
  (b), which is a different violation not present in the scenario.
