stem: A broker wants to assign an affiliated salesperson to act as the designated buyer's agent in a
  residential transaction. What must the broker do under Massachusetts regulations to lawfully
  establish this designated agency relationship?
options:
  - Provide the buyer with a written agency disclosure
  - Display the broker's license during the initial meeting
  - Obtain consent from buyer after advising of duties
  - Require the buyer to execute a purchase and sale contract
key: C
explanation: Under 254 CMR 3.00(13)(c), a broker may appoint an affiliated licensee as a designated
  buyer's agent only if the purchaser gives written consent after being advised of the duties the
  agent will owe. A verbal agreement, providing a license copy, or having the buyer sign a purchase
  agreement does not satisfy this requirement.
citation:
  source: 254 CMR 3.00 — 254 CMR 3.00 — Professional Standards of Practice (Board of Registration of
    Real Estate Brokers and Salespersons), official mass.gov PDF read via Internet Archive capture
    of 2025-11-01 because mass.gov returns 403 to scripts § 3.00(13)(c)
  url: null
  quoted_text: >-
    a real estate broker or salesperson may appoint one or more

    affiliated brokers or salespersons to act as a designated agent onbehalf of a prospective
    purchaser,

    provided the purchaser gives written consent after being advised that; (a) the designated
    buyer's

    agent will represent the purchaser and will owe the purchaser the duties of loyalty, full
    disclosure,

    confidentiality, to account for funds, reasonable care and obedience to lawful instruction
