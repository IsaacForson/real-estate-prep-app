stem: A buyer purchases registered land that is subject to an existing lease for six years. Under
  M.G.L. c. 185 § 46, how does this lease affect the buyer's title?
options:
  - The lease remains as an encumbrance on the title
  - The lease is extinguished upon registration
  - The lease is valid only if recorded in the registry of deeds
  - The lease is void because it exceeds seven years
key: A
explanation: The statute lists a lease for a term not exceeding seven years as an encumbrance that
  survives registration, so a six‑year lease continues to bind the buyer. The distractor claiming
  the lease is extinguished ignores this specific survival rule.
