stem: A deed conveys land to two married individuals and one single individual, stating that the
  grantees shall take 'as joint tenants.' Under M.G.L. c. 184 § 7, what type of ownership is
  created?
options:
  - A tenancy in common among all three grantees
  - A tenancy by the entirety between the married couple
  - A joint tenancy among all three grantees
  - A joint tenancy between the married couple only
key: C
explanation: The statute provides that in a conveyance to three or more persons, words creating a
  joint tenancy apply to all grantees regardless of marital status unless a contrary intent appears.
  Therefore, the joint tenancy language binds all three grantees. The distractors incorrectly limit
  the joint tenancy to the married couple or convert the estate to a tenancy in common or tenancy by
  the entirety.
