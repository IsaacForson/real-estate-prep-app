stem: Under Massachusetts law, if a deed to a husband and wife expressly states that they shall take
  as joint tenants, what type of ownership is created?
options:
  - Tenancy by the entirety ownership
  - Tenancy in common ownership
  - Joint tenancy ownership
  - Community property ownership
key: C
explanation: The statute provides that an express statement that grantees shall take as joint
  tenants creates a joint tenancy and not a tenancy by the entirety. Therefore, joint tenancy
  ownership is correct. Tenancy by the entirety ownership is incorrect because the express joint
  tenancy language overrides that form.
