    connections from scripts — § 7
  url: null
  quoted_text: A conveyance or devise of land to a person and his spouse which expressly states that
    the grantees or devisees shall take jointly, or as joint tenants, or in joint tenancy, or to
    them and the survivor of them shall create an estate in joint tenancy and not a tenancy by the
    entirety.
