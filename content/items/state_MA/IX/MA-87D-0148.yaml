stem: A deed conveys property to two individuals as tenants by the entirety, but the individuals are
  not married to each other. What type of ownership results?
options:
  - Tenancy in common ownership
  - Tenancy by the entirety ownership
  - Sole ownership interest
  - Joint tenancy ownership
key: D
explanation: The statute states that a conveyance to two persons as tenants by the entirety who are
  not married creates an estate in joint tenancy, not a tenancy in common. Thus joint tenancy
  ownership is correct. Tenancy by the entirety ownership is incorrect because that form only
  applies to married couples.
