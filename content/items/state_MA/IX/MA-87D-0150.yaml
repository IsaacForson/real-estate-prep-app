stem: A deed conveys land to a husband and wife with the language 'to them as joint tenants with
  right of survivorship'. Under M.G.L. c.184 §7, what type of estate is created?
options:
  - Joint tenancy
  - Community property
  - Tenancy by the entirety
  - Tenancy in common
key: A
explanation: The statute specifies that a conveyance to a spouse which expressly states that the
  grantees shall take jointly, or as joint tenants, or in joint tenancy, or to them and the survivor
  of them creates an estate in joint tenancy and not a tenancy by the entirety. Therefore the
  language 'joint tenants with right of survivorship' creates a joint tenancy. The distractor
  tenancy by the entirety is incorrect because the express joint tenancy language overrides that
  form.
citation:
  source: M.G.L. c. 184 — Massachusetts General Laws c. 184 — General Provisions Relative to Real
