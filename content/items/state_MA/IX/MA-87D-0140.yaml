stem: A married couple purchases a house and the deed states they take the property 'as joint
  tenants.' What type of ownership is created?
options:
  - Entirety tenancy arrangement
  - Joint tenancy arrangement
  - Common tenancy arrangement
  - Communal property arrangement
key: B
explanation: M.G.L. c.184 §7 provides that a conveyance to a husband and wife which expressly states
  they take as joint tenants creates a joint tenancy, not a tenancy by the entirety. The express
  language overrides the default tenancy by the entirety for married spouses.
citation:
  source: M.G.L. c. 184 — Massachusetts General Laws c. 184 — General Provisions Relative to Real
    Property (§ 7) (selected sections cited by the exam outline), official malegislature.gov section
    pages read via Internet Archive captures of 2025-10 to 2026-06 because malegislature.gov refuses
    connections from scripts — § 7
  url: null
  quoted_text: A conveyance or devise of land to a person and his spouse which expressly states that
    the grantees or devisees shall take jointly, or as joint tenants, or in joint tenancy, or to
    them and the survivor of them shall create an estate in joint tenancy and not a tenancy by the
    entirety.
