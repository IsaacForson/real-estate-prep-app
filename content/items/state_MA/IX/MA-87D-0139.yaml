stem: Absent any express language indicating joint tenancy, a conveyance of land to two persons
  creates what type of estate?
options:
  - Tenancy in common
  - Joint tenancy arrangement
  - Tenancy by entirety
  - Community property
key: A
explanation: Under M.G.L. c.184 §7, a conveyance to two or more persons creates an estate in common
  and not in joint tenancy unless the instrument expressly states joint tenancy. Without such
  language, the default is tenancy in common.
citation:
  source: M.G.L. c. 184 — Massachusetts General Laws c. 184 — General Provisions Relative to Real
    Property (§ 7) (selected sections cited by the exam outline), official malegislature.gov section
    pages read via Internet Archive captures of 2025-10 to 2026-06 because malegislature.gov refuses
    connections from scripts — § 7
  url: null
  quoted_text: A conveyance or devise of land to two or more persons or to husband and wife, except a
    mortgage or a devise or conveyance in trust, shall create an estate in common and not in joint
    tenancy, unless it is expressed in such conveyance or devise that the grantees or devisees shall
    take jointly, or as joint tenants, or in joint tenancy, or to them and the survivor of them, or
    unless it manifestly appears from the tenor of the instrument that it was intended to create an
    estate in joint tenancy.
