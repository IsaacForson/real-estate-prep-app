stem: A purchaser of registered land acquires a certificate of title that does not note any existing
  lease. The land is subject to a written lease for ten years that was executed before the purchase.
  Under M.G.L. c.185 §46, what is the effect of the lease on the purchaser's title?
options:
  - The purchaser takes title subject to the lease because leases over seven years are not exempt.
  - The lease is automatically void because it exceeds seven years.
  - The purchaser takes title free of the lease because all leases are exempt for up to seven years.
  - The lease is voidable at the purchaser's option because it was not noted.
key: A
explanation: M.G.L. c.185 §46 lists as an exception only leases for a term not exceeding seven
  years. A ten‑year lease exceeds that limit, so it is not exempt and remains an encumbrance unless
  noted on the certificate. The purchaser therefore takes title subject to the lease.
