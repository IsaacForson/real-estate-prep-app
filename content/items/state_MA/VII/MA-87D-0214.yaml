stem: A broker offers a license applicant a reduction in fees if the applicant agrees to undergo a
  genetic test. Under M.G.L. c. 151B § 4(19)(a), is this inducement permissible?
options:
  - The action is unlawful only if the test results are used to affect licensing
  - The action is unlawful because offering an inducement to undergo a genetic test is prohibited
  - The action is lawful because the broker is offering a legitimate discount
  - The action is lawful if the applicant accepts the offer voluntarily
key: B
explanation: Section 4(19)(a)(4) of Chapter 151B makes it unlawful to offer any inducement to
  undergo a genetic test or to disclose genetic information. Therefore the broker’s fee reduction
  for agreeing to a genetic test violates the statute. The answer choice stating that the action is
  unlawful only if the test results are used to affect licensing is incorrect because the
  prohibition applies regardless of the purpose of the inducement.
