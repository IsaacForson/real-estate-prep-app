stem: A property manager threatens to evict a tenant who has filed a fair‑housing complaint with
  MCAD, saying the tenant will lose the apartment if they continue to pursue the complaint. Under
  M.G.L. c. 151B § 4A, is the property manager’s action permissible?
options:
  - The property manager may threaten eviction because the tenant’s complaint is considered a
    nuisance.
  - The property manager may threaten eviction if the tenant has violated the lease agreement.
  - The property manager may not threaten eviction unless the tenant has previously been warned
    about lease violations.
  - The property manager may not threaten eviction; such conduct constitutes intimidation or
    interference with the exercise of a protected right.
key: D
explanation: Section 4A makes it unlawful to coerce, intimidate, threaten, or interfere with someone
  for exercising a right under the chapter, including filing a complaint. Threatening eviction for
  pursuing a complaint is intimidation and thus prohibited.
