stem: Under M.G.L. c. 151B § 4(19)(a)(1), which action is considered unlawful discrimination?
options:
  - Refusing to hire or employ a person based on their genetic information
  - Offering an inducement to undergo a genetic test for licensure
  - Collecting genetic information as a condition of employment or membership
  - Requiring a genetic test as a condition of obtaining a license
key: A
explanation: Subsection (1) explicitly prohibits refusing to hire or employ a person because of that
  person’s genetic information. Thus the description of refusing to hire or employ someone based on
  genetic information matches the prohibited conduct. Offering an inducement to undergo a genetic
  test for licensure is prohibited under subsection (2), which addresses the collection of genetic
  information as a condition of employment or membership, not under subsection (1).
