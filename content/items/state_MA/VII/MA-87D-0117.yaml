stem: Under M.G.L. c. 151B § 4(11), which situation is exempt from the prohibition against
  discrimination based on having children?
options:
  - The owner refuses to rent a unit in a three‑unit building where none of the units are occupied
    by an elderly or infirm person.
  - The owner refuses to rent a unit in a two‑unit building where the other unit is occupied by a
    tenant who is not the owner.
  - The owner refuses to rent a unit in a four‑unit building where the owner lives in one unit and
    claims children would be a hardship.
  - The owner refuses to rent a unit in a three‑unit building where one unit is occupied by a person
    aged 65 or older and the owner claims children would be a hardship.
key: D
explanation: The exemption applies because the building has three units and one unit is occupied by
  an elderly person (age 65 or older) and the owner asserts that children would constitute a
  hardship, which matches the condition in the law. The option describing a four‑unit building is
  incorrect because the exemption only covers buildings with three or fewer units. The option
  describing a two‑unit building where the other unit is rented to a tenant is incorrect because the
  exemption for an owner‑occupied two‑family dwelling requires the owner to live in the other unit,
  not a tenant. The option describing a three‑unit building with no elderly or infirm occupant is
  incorrect because the exemption requires at least one unit to be occupied by an elderly or infirm
  person for whom children would be a hardship.
