stem: During a scheduled MCAD meeting, only two of the three commissioners are present. Under M.G.L.
  c. 6 § 56, which of the following is true regarding the commission's ability to conduct business?
options:
  - The commission may conduct business because two commissioners constitute a quorum
  - The commission may not conduct business because three commissioners are required for a quorum
  - The commission may conduct business only if the chairman is among the two present
  - The commission may not conduct business unless all three commissioners are present
key: A
explanation: The law provides that two commissioners shall constitute a quorum for conducting the
  commission's business. Thus, with two present, the commission may conduct business. The distractor
  claiming three are required misstates the quorum rule.
citation:
