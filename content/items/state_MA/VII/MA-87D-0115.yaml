stem: A tenant with a mobility disability requests permission to install a ramp at the front
  entrance of their rental unit, which has six steps. The tenant offers to pay for the ramp. The
  landlord refuses, stating they are not required to pay for ramps over five steps. Under
  Massachusetts General Laws c. 151B, § 7A(1), is the landlord’s refusal permissible?
options:
  - The landlord may refuse because installing a ramp is not a reasonable modification
  - The landlord may refuse because they are not required to pay for modifications exceeding five
    steps
  - The landlord must allow the tenant to install the ramp at the tenant's expense
  - The landlord must pay for the ramp installation regardless of cost
key: C
explanation: Subsection 7A(1) prohibits refusing to permit a reasonable modification at the
  handicapped person's expense when needed for full enjoyment of the premises. The landlord is not
  required to pay for ramps over five steps, but may not block a tenant-funded modification.
  Therefore, the landlord must allow the tenant to install the ramp at their own expense.
