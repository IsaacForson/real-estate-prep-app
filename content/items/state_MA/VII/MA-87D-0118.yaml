stem: A landlord refuses to rent an apartment to a prospective tenant solely because the tenant
  receives Supplemental Nutrition Assistance Program (SNAP) benefits. Under M.G.L. c. 151B § 4(10),
  is the landlord's action lawful?
options:
  - The action is lawful because SNAP benefits are not classified as public assistance under the
    statute.
  - The action is unlawful because SNAP benefits constitute federal public assistance.
  - The action is lawful because the landlord may consider the source of income when screening
    tenants.
  - The action is unlawful only if the tenant also receives housing subsidies.
key: B
explanation: The landlord’s refusal is unlawful because SNAP benefits are a form of federal public
  assistance, and M.G.L. c. 151B § 4(10) prohibits discrimination based on receipt of such
  assistance. The claim that SNAP benefits are not classified as public assistance is incorrect; the
  statute expressly includes them. The assertion that a landlord may consider the source of income
  when it is public assistance is also incorrect; considering such assistance is prohibited. The
  statement that the prohibition applies only if the tenant also receives housing subsidies is
  incorrect; the ban applies regardless of any other assistance the tenant receives.
