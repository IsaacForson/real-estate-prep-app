stem: A real estate broker asks a license applicant to disclose whether they have a genetic marker
  for a certain condition as part of the application process. Under M.G.L. c. 151B § 4(19)(a), is
  the broker's action permissible?
options:
  - The action is unlawful because seeking genetic information is prohibited
  - The action is lawful because brokers may consider health-related risks
  - The action is unlawful only when the information is used to deny licensure
  - The action is lawful if the applicant voluntarily provides the information
key: A
explanation: The request to disclose a genetic marker is prohibited because M.G.L. c. 151B §
  4(19)(a)(5) bars any question about a person’s genetic information or that of family members. The
  prohibition applies regardless of whether the applicant volunteers the information, so the
  broker’s action is unlawful. The statement that the action is unlawful only when the information
  is used to deny licensure is incorrect because the law forbids the inquiry itself, not merely its
  use. Likewise, the suggestions that the broker may consider health‑related risks or that the
  request is permissible if the applicant voluntarily provides the information are also incorrect
  for the same reason.
