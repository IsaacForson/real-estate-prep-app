stem: A tenant in a privately owned rental building with fewer than ten units requests permission to
  install grab bars in the bathroom at their own expense. The landlord refuses, stating they are not
  required to allow modifications. Under M.G.L. c. 151B § 7A(1), is the landlord’s refusal
  permissible?
options:
  - The landlord’s refusal is lawful because the tenant offered to pay for the modification.
  - The landlord’s refusal is unlawful because the landlord cannot refuse a reasonable modification
    made at the tenant’s expense.
  - The landlord’s refusal is lawful because the modification would materially alter the
    marketability of the housing.
  - The landlord’s refusal is unlawful because the landlord must pay for the modification in
    privately owned rentals.
key: B
explanation: Under § 7A(1), a landlord may not refuse to permit a handicapped tenant to make a
  reasonable modification at the tenant’s expense when the modification is necessary for full
  enjoyment of the premises. The landlord’s outright refusal is therefore unlawful. The option
  stating that the landlord’s refusal is lawful because the tenant offered to pay for the
  modification is incorrect because the statute prohibits the refusal regardless of who pays. The
  option claiming the refusal is lawful due to a material alteration of marketability is incorrect
  because the modification is reasonable and does not constitute such an alteration. The option
  stating the landlord must pay for the modification is incorrect because the law requires the
  tenant to bear the cost.
