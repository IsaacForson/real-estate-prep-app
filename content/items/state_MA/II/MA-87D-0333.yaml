stem: Which of the following best defines 'real estate' for licensing purposes?
options:
  - Any and every estate or interest in land and the improvements thereon, whether corporeal or
    incorporeal, whether freehold or non-freehold, and whether or not said land is situated within
    the commonwealth.
  - Any and every estate or interest in land and the improvements thereon, whether corporeal or
    incorporeal, whether freehold or non-freehold, and only if said land is situated within the
    commonwealth.
  - Any and every estate or interest in land and the improvements thereon, whether corporeal or
    incorporeal, whether freehold or non-freehold, and only if said land is situated outside the
    commonwealth.
  - Any and every estate or interest in land and the improvements thereon, whether corporeal or
    incorporeal, whether freehold or non-freehold, and whether or not said land is situated within
    the commonwealth, but excluding leasehold interests.
key: A
explanation: According to M.G.L. c. 112, § 87PP, real estate is defined as any and every estate or
  interest in land and the improvements thereon, whether corporeal or incorporeal, whether freehold
  or non-freehold, and whether or not said land is situated within the commonwealth. This matches
  the definition that includes all estates and interests in land and improvements, regardless of
  corporeal/incorporeal, freehold/non-freehold, and location within the Commonwealth. One incorrect
  option limits the definition to land situated only within the Commonwealth; another limits it to
  land situated only outside the Commonwealth; a third incorrectly excludes leasehold interests.
