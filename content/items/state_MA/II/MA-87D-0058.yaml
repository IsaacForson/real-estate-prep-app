stem: An individual who has been a licensed salesman for three years wants to qualify for a broker
  license. According to Massachusetts law, what must the individual demonstrate in addition to
  completing 40 classroom hours of approved real estate instruction?
options:
  - Submission of a surety bond of five thousand dollars
  - Completion of a college degree in real estate or law
  - Proof of having sold at least ten properties in the past year
  - Active association with a real estate broker for three years as a salesman
key: D
explanation: The statute specifies that an individual applicant for a broker license who must take
  an examination shall submit proof of having been actively associated with a real estate broker for
  three years as a real estate salesman, plus the 40 classroom hours of additional instruction. The
  other options are not mentioned as prerequisites in the provided text.
citation:
  source: "### M.G.L. c. 112, §§ 87PP–87DDD — Massachusetts General Laws c. 112, §§ 87PP–87DDD — Real
    Estate Brokers and Salesmen (license law), official malegislature.gov section pages (15
    sections) read via Internet Archive captures of 2025-10 to 2026-06 because malegislature.gov
    refuses connections from scripts — § 87SS"
  url: null
  quoted_text: Every individual applicant for a license as a broker who is required to take an
    examination therefor shall, as a prerequisite to taking such examination, submit proof
    satisfactory to the board that he has been actively associated with a real estate broker for a
    period of 3 years as a real estate salesman and that he has completed additional courses in real
    estate subjects approved by the board, such courses to total 40 classroom hours of instruction.
