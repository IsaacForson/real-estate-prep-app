stem: Under Massachusetts law, what is the maximum criminal penalty for a licensee who violates the
  prohibition against soliciting residential property sales based on the prospective entry of a
  person of another race, religion, or ethnic origin into the neighborhood?
options:
  - A fine of not less than one thousand nor more than twenty-five hundred dollars, or imprisonment
    for not more than six months, or both
  - A fine of not less than five hundred nor more than one thousand dollars, or imprisonment for not
    more than three months, or both
  - A fine of not less than two thousand nor more than five thousand dollars, or imprisonment for
    not more than one year, or both
  - A fine of not less than one thousand nor more than twenty-five hundred dollars, or imprisonment
    for not more than one year, or both
key: A
explanation: "Section 87AAA provides that a violation of clause (k) is punishable by a fine of not
  less than one thousand nor more than twenty-five hundred dollars, or imprisonment for not more
  than six months, or both. The other answer choices are incorrect: one proposes a lower fine and
  shorter imprisonment, another proposes a higher fine and longer imprisonment, and the last keeps
  the fine range but increases the imprisonment term to one year."
