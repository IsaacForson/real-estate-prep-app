stem: Under M.G.L. c.112 § 87AAA, what is the licensee's duty regarding money belonging to others
  that comes into their possession?
options:
  - The licensee shall account for and remit the money within a reasonable time.
  - The licensee shall invest the money in an interest-bearing account.
  - The licensee shall retain the money as compensation for services rendered.
  - The licensee shall deposit the money into a personal checking account.
key: A
explanation: The statute states that a licensee who fails, within a reasonable time, to account for
  or remit any moneys belonging to others that have come into their possession may be disciplined.
  This establishes the duty to account for and remit such funds promptly. The distractor about
  depositing money into a personal checking account describes commingling, which is a separate
  prohibited act under subsection (h).
