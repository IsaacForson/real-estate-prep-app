stem: A salesperson who has just completed the required 40 classroom hours of real estate
  instruction wishes to apply for a salesman license. Under Massachusetts law, what else must the
  salesperson do before being allowed to take the licensing examination?
options:
  - Pass a background check for good moral character
  - Obtain a surety bond of five thousand dollars
  - Submit proof of completing the 40 classroom hours to the board
  - Secure employment as an independent contractor with a broker
key: C
explanation: The law requires every individual applicant for a salesman license who must take an
  examination to submit proof satisfactory to the board that they have completed the approved 40
  classroom hours of real estate instruction. This proof is a prerequisite to taking the
  examination. The other options pertain to licensing after examination or are not stated as
  pre‑exam requirements.
