stem: Under M.G.L. c.112 § 87AAA, if the Massachusetts Commission Against Discrimination issues a
  final finding that a licensee committed an unlawful practice, what is the length of the mandatory
  license suspension?
options:
  - 60 days
  - 30 days
  - 120 days
  - 90 days
key: A
explanation: The statute requires the board to suspend the license for a period of sixty days after
  receiving notice of a final finding of an unlawful practice from the Massachusetts Commission
  Against Discrimination. Therefore, the mandatory suspension is sixty days. The thirty‑day option
  is too short, while ninety and one‑hundred‑twenty days apply only when a prior violation within
  two years is present.
