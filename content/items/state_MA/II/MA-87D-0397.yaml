stem: The Board of Registration of Real Estate Brokers and Salespersons mails a license renewal
  notice to a broker twenty-five days before the license expires. Under Massachusetts law, is this
  notice compliant?
options:
  - Under Massachusetts law, the notice is compliant because the Board may mail notice at any time
    before expiration.
  - Under Massachusetts law, the notice is not compliant because the Board must mail notice not less
    than thirty days prior to expiration.
  - Under Massachusetts law, the notice is compliant as long as the broker receives it before
    expiration.
  - Under Massachusetts law, the notice is not compliant because the Board must mail notice not less
    than fifteen days prior to expiration.
key: B
explanation: Under Massachusetts law, the Board must mail renewal notices not less than thirty days
  prior to license expiration; therefore a notice mailed only twenty-five days before expiration
  does not satisfy this requirement. The claim that the Board may mail notice at any time before
  expiration is incorrect, as it contradicts the statutory timing rule.
