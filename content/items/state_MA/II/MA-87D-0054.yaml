stem: According to Massachusetts law, which of the following must an applicant provide to be
  eligible for a real estate broker or salesman license?
options:
  - Proof of 40 classroom hours
  - Evidence of good moral character
  - A surety bond of five thousand dollars
  - Intent to become a U.S. citizen
key: B
explanation: Under Massachusetts law, a license may not be issued unless the applicant shows
  evidence of good moral character. Intent to become a U.S. citizen, proof of 40 classroom hours,
  and a surety bond are not universal prerequisites for licensure.
