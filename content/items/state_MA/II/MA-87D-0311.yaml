stem: Under 254 CMR 3.00(2), what is the effect of a broker or salesperson appointing another
  affiliated broker or salesperson to represent a seller or purchaser?
options:
  - The appointed broker assumes full liability for the transaction.
  - The appointment creates a dual agency relationship automatically.
  - The appointing broker’s liability is limited to the acts of the appointed broker.
  - The appointing broker remains liable for any breach of duty by the appointed broker.
key: D
explanation: Under 254 CMR 3.00(2), appointing another affiliated broker or salesperson to represent
  a seller or purchaser does not limit the liability or responsibility of the appointing broker or
  salesperson for any breach of duty by the designated broker or salesperson
