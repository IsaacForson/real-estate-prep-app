stem: Under M.G.L. c. 112 § 87AAA, who may the Board of Registration of Real Estate Brokers and
  Salespersons investigate?
options:
  - The Board may investigate only licensed brokers and salesmen who have received a written
    complaint
  - The Board may investigate only owners or developers of out-of-state land developments advertised
    in the Commonwealth
  - The Board may investigate any broker or salesman, or any person who attempts to act as such
    within the Commonwealth
  - The Board may investigate only individuals who have been convicted of a criminal offence
    demonstrating lack of good moral character
key: C
explanation: The board may investigate any broker or salesman, or any person who attempts to act as
  such within the Commonwealth, as provided by M.G.L. c. 112 § 87AAA. The statute says the board
  may, and upon a verified complaint in writing of an aggrieved person shall, investigate the action
  of any broker or salesman or any person who attempts to act in such capacity within the
  Commonwealth. Therefore, the board’s authority extends to licensees and to unlicensed persons
  acting as brokers or salesmen. The option that limits investigations to only licensed brokers and
  salesmen who have received a written complaint is incorrect because it omits unlicensed persons
  and incorrectly requires a complaint as a precondition for the board’s authority to investigate.
