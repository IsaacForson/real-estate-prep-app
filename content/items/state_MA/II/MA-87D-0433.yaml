stem: A broker uses escrow funds collected from a buyer to pay his personal automobile loan directly
  from the escrow account. Under Massachusetts law, what action may the Board take regarding the
  broker's license?
options:
  - The Board may suspend, revoke, or refuse to renew the license for mishandling trust funds.
  - The Board may issue a written reprimand and require the licensee to complete remedial training.
  - The Board may impose a monetary penalty not exceeding one thousand dollars for the violation.
  - The Board may place the license on probation for a period of six months and require supervision.
key: A
explanation: The statute lists commingling of the principal's money with the licensee's own as a
  ground for suspension, revocation, or nonrenewal of a license. Using escrow funds to pay a
  personal loan constitutes commingling, triggering that authority. The distractor about issuing a
  written reprimand only is incorrect because the law does not limit the Board to that lesser
  sanction for commingling.
