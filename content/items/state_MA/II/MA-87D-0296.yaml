stem: A Massachusetts broker is convicted of a misdemeanor that the Board finds demonstrates a lack
  of good moral character. According to M.G.L. c. 112 § 87AAA, what action may the Board take
  regarding the broker's license?
options:
  - The Board may issue a written warning and require continuing education
  - The Board may automatically revoke the broker's license
  - The Board may suspend, revoke, or refuse to renew the broker's license
  - The Board may impose a fine of not less than $1,000 nor more than $2,500
key: C
explanation: Under M.G.L. c. 112, § 87AAA, if the Board finds that a broker’s misdemeanor conviction
  shows a lack of good moral character, the Board may suspend, revoke, or refuse to renew the
  broker’s license. The Board is not limited to a single action; it has discretion to choose any of
  those sanctions. The statement that the Board may issue a written warning and require continuing
  education is not authorized by this statute for such a conviction.
