stem: An applicant submits a broker license application on January 10. According to Massachusetts
  law, what is the earliest date the Board may issue the license, assuming all other requirements
  are met?
options:
  - January 21
  - January 19
  - January 18
  - January 20
key: D
explanation: The application must be on file for at least ten days before a license can be issued.
  Filing on January 10 makes the earliest possible issuance date January 20; January 19 would be
  only nine days later.
