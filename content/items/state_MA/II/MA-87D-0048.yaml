stem: Under 254 CMR 2.00(11) and M.G.L. c.112 § 87UU, if a corporation obtains a broker's license by
  designating an officer as broker of record, what is true about that officer's ability to act as a
  broker for personal transactions?
options:
  - The officer may act as a broker for personal transactions without any additional consent
  - The officer may act personally only if written corporate consent is filed with the board
  - The officer is prohibited from ever acting as a broker for personal transactions
  - The officer must surrender the corporate license before engaging in personal brokerage
key: B
explanation: The statute specifies that a designated officer or partner is entitled to perform all
  acts of a broker as an agent of the corporation but shall not act on his own behalf unless the
  written consent of the corporation is filed with the board. Therefore, the officer may act
  personally only with such written consent. Acting without consent is prohibited, and surrendering
  the corporate license is not required.
