stem: A Massachusetts real estate salesperson agrees to share her commission on a residential sale
  with an unlicensed friend who helped locate the buyer. Under Massachusetts law, what action may
  the Board of Registration of Real Estate Brokers and Salespersons take regarding her license?
options:
  - The board may suspend, revoke, or refuse to renew her license
  - The board may issue a reprimand and require her to complete extra continuing education
  - The board may impose a fine of one thousand dollars on her
  - The board may take no action because the unlicensed person lacked a license
key: A
explanation: Under § 87AAA(e), paying commissions or dividing them with an unlicensed person is
  grounds for suspension, revocation, or refusal to renew a license. The board cannot merely issue a
  reprimand and require additional continuing education for this violation. The statute does not
  authorize a fine of one thousand dollars for this offense. Finally, the board may take
  disciplinary action even though the friend who helped locate the buyer is unlicensed.
