stem: An individual applying for a Massachusetts broker license who is **NOT** an attorney must have
  maintained their principal place of abode within the Commonwealth for how long prior to licensure?
options:
  - Six months
  - One year
  - Two years
  - Three years
key: B
explanation: The statute specifies that an individual broker applicant must have had their principal
  place of abode within the Commonwealth for one year prior to licensure, unless exempt as an
  attorney. Therefore, one year is the required period. The distractor of six months is incorrect
  because the law sets a one‑year minimum, not six months.
