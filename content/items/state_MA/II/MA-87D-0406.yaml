stem: Under M.G.L. c.112 § 87AAA, what is the time period used to determine whether a violation of
  chapter 151B is considered a subsequent violation for enhanced suspension?
options:
  - Five years
  - One year
  - Three years
  - Two years
key: D
explanation: The statute states that if a violation occurs within two years of a prior final
  violation of chapter 151B, the board shall suspend the license for ninety days. Therefore, the
  two‑year period is the threshold for treating a violation as subsequent. The distractors represent
  other common time frames that are not mentioned in the law.
