stem: A Massachusetts broker wishes to advertise and sell lots in a Florida subdivision that is
  being promoted in Massachusetts media. The Florida developer has not submitted particulars to the
  Board or deposited any required sum. According to M.G.L. c. 112 § 87AAA, what must the broker do?
options:
  - The Broker must proceed with advertising and sales, provided they disclose that the Board has
    not inspected the property
  - The Broker must refrain from engaging in sale until developer submits particulars and deposits
    required sum
  - The Broker must seek Board approval before advertising the property, even if a waiver is not
    granted
  - The Broker must adjust the commission rate to account for the absence of Board inspection
key: B
explanation: The statute prohibits a broker from engaging in a sale in the Commonwealth of real
  property located in a land development in another state that is advertised in the Commonwealth
  unless the owner or developer has submitted full particulars and deposited a sum determined by the
  Board. Therefore, the broker must refrain from engaging in the sale until those conditions are
  satisfied. Proceeding with advertising and sales is prohibited regardless of disclosure; the
  statute does not allow the transaction to proceed based on a disclosure alone.
citation:
  source: M.G.L. c. 112, § 87AAA
  url: null
  quoted_text: No broker shall engage in a sale in the commonwealth of real property located in a land
    development in another state which is the subject of promotional advertising in the commonwealth
    unless the owner or developer of such land has submitted to the board full particulars regarding
    such land and the proposed terms of sale thereof and has deposited with the board such sum as it
    shall determine, to pay the expense of the investigation hereinafter prescribed
