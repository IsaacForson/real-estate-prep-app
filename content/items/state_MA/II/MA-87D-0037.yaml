stem: According to Massachusetts law, which of the following best describes a 'non-resident' for the
  purposes of real estate licensing?
options:
  - An individual whose principal place of abode is without the commonwealth.
  - An individual who owns property in Massachusetts but lives elsewhere.
  - An individual who works for a Massachusetts broker but lives in another state.
  - An individual who has a Massachusetts mailing address but resides abroad.
key: A
explanation: The definition of non‑resident in M.G.L. c. 112, § 87PP is an individual whose
  principal place of abode is without the commonwealth. Therefore the option stating that a
  non‑resident is an individual whose principal place of abode is without the commonwealth is
  correct. The option that says an individual who owns property in Massachusetts but lives elsewhere
  is incorrect because ownership of property does not determine residency; the statute looks at
  where the person’s principal home is located. The option that says an individual who works for a
  Massachusetts broker but lives in another state is incorrect because employment with a
  Massachusetts broker does not make someone a resident; residency depends on principal place of
  abode. The option that says an individual who has a Massachusetts mailing address but resides
  abroad is incorrect because a mailing address alone does not establish residency; the law requires
  the principal place of abode to be outside Massachusetts.
