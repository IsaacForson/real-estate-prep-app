stem: A broker appoints one affiliated salesperson to represent the seller and another affiliated
  salesperson to represent the purchaser, and both the seller and purchaser consent to the
  designations on the Board’s form. Under 254 CMR 3.00(3), what is the legal presumption regarding
  the broker’s agency relationship?
options:
  - The broker is presumed to be a dual agent.
  - The broker is presumed to be a single agent for the seller only.
  - The broker is presumed to be a single agent for the purchaser only.
  - No agency relationship is presumed under these circumstances.
key: A
explanation: The regulation provides that when an appointing broker designates affiliated brokers to
  represent both seller and purchaser with consent, the broker is presumed to be a dual agent. The
  other options incorrectly limit the presumption to single agency or deny any presumption.
citation:
  source: 254 CMR 3.00 — 254 CMR 3.00 — Professional Standards of Practice (Board of Registration of
    Real Estate Brokers and Salespersons), official mass.gov PDF read via Internet Archive capture
    of 2025-11-01 because mass.gov returns 403 to scripts § 3.00(3)
  url: null
  quoted_text: An appointing broker or salesperson who designates another affiliated broker or
    salesperson to represent the seller and an affiliated broker or salesperson to represent the
    purchaser shall be presumed to be a dual agent, provided that the seller and purchaser consent
    to such designation on a form developed by the Board.
