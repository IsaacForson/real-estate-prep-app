    sections) read via Internet Archive captures of 2025-10 to 2026-06 because malegislature.gov
    refuses connections from scripts — § 87XX"
  url: null
  quoted_text: Notwithstanding the foregoing, the license originally issued to an individual shall be
    valid until the anniversary of the licensee's date of birth next occurring more than twenty-four
    months after the date of issuance.
