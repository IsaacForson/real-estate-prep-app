stem: A broker license is issued to an individual on March 15, 2023. The licensee's date of birth is
  July 20, 1990. Under Massachusetts law, what is the expiration date of this license?
options:
  - July 20, 2024
  - March 15, 2025
  - July 20, 2025
  - July 20, 2026
key: C
explanation: Under M.G.L. c. 112 § 87XX, an individual license remains valid until the birthday
  anniversary that occurs more than twenty‑four months after the date of issuance. Adding
  twenty‑four months to March 15, 2023 yields March 15, 2025; the next birthday after that date is
  July 20, 2025, so the license expires on that date. The distractor "March 15, 2025" incorrectly
  assumes a simple two‑year term without the birthday extension required for individual licenses.
citation:
