stem: A salesman license applicant reviews the Board's schedule and sees that only six examination
  dates are offered for salesman licenses in the upcoming calendar year. According to Massachusetts
  law, is this schedule compliant?
options:
  - The schedule is compliant because the Board must offer exams at least six times per year
  - The schedule is not compliant because the Board must offer exams at least eight times per year
    for salesman licenses
  - The schedule is compliant because the Board may offer exams as few as four times per year
  - The schedule is not compliant because the Board must offer exams at least twelve times per year
key: B
explanation: The statute mandates that the Board offer salesman license examinations at least eight
  times each calendar year; offering only six dates fails to meet this minimum, making the schedule
  non‑compliant. The distractor claiming compliance because six meetings satisfy the requirement
  confuses the broker‑exam minimum with the salesman‑exam requirement.
