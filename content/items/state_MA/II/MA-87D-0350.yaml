stem: What is the required surety bond amount for an individual applying for a broker license in
  Massachusetts?
options:
  - $1,000
  - $5,000
  - $10,000
  - $2,500
key: B
explanation: The statute requires a broker license applicant to post a surety bond of five thousand
  dollars before the license can be issued or renewed. Therefore the correct amount is $5,000. The
  $2,500 distractor reflects half the required sum, which the statute does not mention.
