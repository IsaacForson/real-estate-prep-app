stem: An individual who is 17 years old submits a complete application for a Massachusetts broker
  license, including the required bond and proof of good moral character. Under Massachusetts law,
  what is the likely outcome?
options:
  - The license is issued after passing the examination
  - The license is issued but restricted to salesman activities
  - The license is issued pending parental consent
  - The license is denied because the applicant is under 18 years of age
key: D
explanation: The law explicitly states that no broker's license shall be issued to any individual
  under eighteen years of age, so a 17‑year‑old applicant must be denied regardless of other
  qualifications. The distractor suggesting issuance pending parental consent is incorrect because
  the statute provides no exception for minors.
