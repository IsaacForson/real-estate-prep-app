stem: A licensee receives a final finding from the Massachusetts Commission Against Discrimination
  for an unlawful practice; the commission also notes that the violation occurred within two years
  of a prior final violation of chapter 151B. Under M.G.L. c.112 § 87AAA, what is the length of the
  license suspension?
options:
  - 90 days
  - 60 days
  - 120 days
  - 30 days
key: A
explanation: The law provides for a sixty‑day suspension for a first discrimination finding, but if
  the violation occurred within two years of a prior final violation of chapter 151B, the board must
  suspend the license for ninety days. Hence the correct length is ninety days. The sixty‑day option
  would apply only absent a prior violation within the two‑year window.
