stem: A licensed salesperson in Massachusetts wishes to start her own sole proprietorship to list
  and sell residential properties. What must she do to comply with 254 CMR 3.00(6)?
options:
  - Affiliate with a licensed broker before engaging in any real estate activity
  - Register her sole proprietorship with the Board as a brokerage
  - Obtain a broker license before listing any property
  - Operate independently as long as she discloses her status to clients
key: A
explanation: The regulation expressly prohibits a salesperson from conducting real estate business
  without being engaged by a licensed broker. Therefore she must affiliate with a broker before
  acting. The other options either misstate the requirement or suggest permissible independent
  activity that the rule forbids.
