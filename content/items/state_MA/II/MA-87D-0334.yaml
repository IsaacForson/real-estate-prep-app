stem: A licensed salesperson in Massachusetts decides to open her own real estate brokerage to list
  and sell properties. Under Massachusetts law, what is the likely outcome?
options:
  - She may operate the brokerage independently because she holds a salesperson license.
  - She may operate the brokerage only if she also obtains a broker license.
  - She may operate the brokerage as long as she affiliates with a broker as an independent
    contractor.
  - She may operate the brokerage if she receives approval from the Board.
key: B
explanation: The law prohibits a salesman from conducting or operating his own real estate business;
  a salesperson may act only as the representative of a licensed broker. Therefore, to operate her
  own brokerage she must hold a broker license. The other options either allow operation under a
  salesperson license or rely on affiliations or board approval, which the statute does not permit.
citation:
  source: M.G.L. c. 112, § 87RR
  url: null
  quoted_text: No salesman may conduct or operate his own real estate business nor act except as the
    representative of a real estate broker who shall be responsible for the salesman and who must
    approve the negotiation and completion by the salesman of any transaction or agreement which
    results or is intended to result in the sale, exchange, purchase, renting or leasing of any real
    estate or in a loan secured or to be secured by mortgage or other encumbrance upon real estate.
