stem: A salesperson in Massachusetts receives a commission directly from a buyer for helping locate
  a property, without involving her sponsoring broker. Under Massachusetts law, what is the
  consequence?
options:
  - The salesperson must remit the commission to her sponsoring broker; accepting it directly
    violates the law.
  - The salesperson may keep the commission as long as she reports it to her broker.
  - The salesperson may accept the commission if she also holds a broker license.
  - The salesperson may accept the commission if the buyer agrees in writing.
key: A
explanation: The statute expressly forbids a salesman from accepting any fee, commission, or other
  valuable consideration from anyone except his licensed broker. Receiving a commission directly
  from a buyer therefore violates the law and the commission must be turned over to the sponsoring
  broker. The other options incorrectly suggest exceptions that the law does not provide.
