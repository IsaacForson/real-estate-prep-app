stem: A broker changes his residential address and moves to a new home. What action is required
  under 254 CMR 3.00(1)?
options:
  - Update his advertising materials to reflect the new business and residential address
  - Provide the Board written notice of the new business and residential address
  - Notify his clients of the address change via email and update Board records accordingly
  - Renew his license with the Board and submit proof of address change within thirty days
key: B
explanation: The rule mandates that a broker (and salesperson) give the Board written notice of any
  change to business or residential address at all times. Updating advertising or notifying clients
  does not satisfy this specific requirement. License renewal is unrelated to address reporting.
