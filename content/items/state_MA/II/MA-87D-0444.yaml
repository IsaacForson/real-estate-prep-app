stem: According to 254 CMR 3.00(4), what must each broker and salesperson do regarding their license?
options:
  - Renew their license every two years without displaying it publicly
  - Keep their license locked in a secure office drawer at all times
  - Submit their license number to the Board for annual verification and record keeping
  - Display a copy of their license in a conspicuous location observable to the public
key: D
explanation: The rule requires that every broker and salesperson display a copy of their license
  where the public can readily see it. This ensures transparency about licensure status. The other
  options describe actions not mandated by this section.
