stem: A corporation’s sole designated officer/partner, who holds an individual broker license, dies.
  The corporation wishes to continue brokering activities. Under Massachusetts law, what is the
  maximum period the corporation may continue to transact business as if its license were in full
  force, assuming it maintains the required bond and proceeds with due diligence to obtain a new
  license?
options:
  - Six months after the event
  - One year after the event
  - Two years after the event
  - Three years after the event
key: B
explanation: The statute provides that upon the death or disability of a sole designated
  officer/partner, the corporation may continue to transact business and exercise all broker rights
  for a period not to exceed one year from that event, provided it maintains the bond and pursues a
  new license with due diligence.
