stem: An individual applies for a broker license in Massachusetts but does not submit the required
  surety bond. What is the likely outcome under Massachusetts law?
options:
  - The application will be automatically approved after a background check.
  - The application may be approved if the applicant provides a letter of credit instead.
  - The application will be denied until the bond is provided.
  - The application will be approved pending submission of the bond within 30 days.
key: C
explanation: Massachusetts law (M.G.L. c. 112, § 87TT) requires that a broker's license not be
  issued until the applicant provides a $5,000 surety bond to the board. Without the bond, the
  application must be denied until the bond is submitted. The statute does not allow approval
  pending later submission of the bond, nor does it permit a letter of credit to substitute for the
  required bond.
