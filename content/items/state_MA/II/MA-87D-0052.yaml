stem: A Massachusetts broker deposits earnest money received from a buyer into his personal checking
  account instead of a separate trust account. Under Massachusetts law, what action may the Board
  take regarding his license?
options:
  - The board may suspend, revoke, or refuse to renew his license
  - The board may issue a reprimand and require him to attend ethics training
  - The board may assess a civil penalty of five hundred dollars against him
  - The board may take no action because the funds were eventually returned to the buyer
key: A
explanation: The key is correct because § 87AAA(d) and (h) treat failure to account for or remit
  others’ money and commingling of principal’s funds with the broker’s own as grounds for
  suspension, revocation, or refusal to renew a license. The option stating that the board may issue
  a reprimand and require him to attend ethics training is incorrect because the statute does not
  authorize the board to issue reprimands or require ethics training for this violation. The option
  stating that the board may assess a civil penalty of five hundred dollars against him is incorrect
  because no civil penalty amount is specified for this offense. The option stating that the board
  may take no action because the funds were eventually returned to the buyer is incorrect because
  returning the funds does not negate the violation.
