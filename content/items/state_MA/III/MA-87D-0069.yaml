stem: A broker continues to work with clients after his license has expired. Under 254 CMR
  3.00(14)(b), what is the broker's status?
options:
  - The broker is violating the regulation.
  - The broker may continue if clients are informed.
  - The broker may work under another's supervision.
  - The broker must stop all real estate activity.
key: A
explanation: The rule prohibits a broker or salesperson from practicing while the license is
  expired, revoked, suspended, or otherwise not valid. Therefore, continuing to work with an expired
  license constitutes a violation. The distractor suggesting the broker may continue if clients are
  informed is incorrect because the regulation provides no such exception; the prohibition is
  absolute regardless of client knowledge.
