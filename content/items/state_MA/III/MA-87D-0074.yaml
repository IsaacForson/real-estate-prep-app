stem: A seller agrees to pay a broker whatever amount exceeds $200,000 from the sale of their
  property. Under M.G.L. c. 112, § 87AAA, may the broker accept this arrangement?
options:
  - The broker may accept the arrangement because the seller set a minimum price.
  - The broker may not accept the arrangement because it constitutes a prohibited net listing.
  - The broker may accept the arrangement if the seller signs a written agreement.
  - The broker may not accept the arrangement only if the excess amount exceeds 10% of the sale
    price.
key: B
explanation: M.G.L. c. 112, § 87AAA defines a net listing as an agreement that authorizes the broker
  to keep any amount received above a stated price and expressly prohibits a broker from accepting
  such an arrangement. Because the seller’s offer would pay the broker any amount over $200,000, it
  is a prohibited net listing, so the broker may not accept it. The option stating that the broker
  may accept the arrangement if the seller signs a written agreement is incorrect because a written
  agreement does not cure the statutory prohibition. The option suggesting acceptance only when the
  excess exceeds 10% of the sale price is also incorrect; the percentage is irrelevant to the
  prohibition. The option that the broker may accept because the seller set a minimum price
  mischaracterizes the rule, as the minimum price does not remove the net‑listing restriction.
