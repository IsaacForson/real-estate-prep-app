stem: Under 254 CMR 3.00(10)(a), when must a broker deposit client funds received in a real estate
  transaction?
options:
  - The broker must deposit the funds in an escrow account within three business days.
  - The broker must hold the funds in a personal account until closing.
  - The broker must deposit the funds in an escrow account only after the transaction is consummated.
  - The broker must immediately deposit the funds in a bank escrow account.
key: D
explanation: The rule states that all money paid over to a broker to be held during the pendency of
  a transaction shall be immediately deposited in a bank escrow account. Therefore, the broker must
  deposit the funds immediately upon receipt. Keeping the funds in a personal account or delaying
  deposit violates this requirement.
