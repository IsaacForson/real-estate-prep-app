stem: Under M.G.L. c. 112, § 87PP, what distinguishes a real estate salesman from a real estate broker?
options:
  - A salesman may not advertise property under the broker's name
  - A salesman may not show a listed property to a prospective buyer
  - A salesman may not collect an earnest money deposit alone
  - A salesman may not complete the negotiation of a transaction
key: D
explanation: Section 87PP defines a salesman as someone performing the acts of a broker except for
  completing the negotiation of a transaction that results in a sale, exchange, purchase, rental, or
  lease.
citation:
  source: M.G.L. c. 112, § 87PP
  url: null
  quoted_text: an individual who performs any act or engages in any transaction included in the
    foregoing definition of a broker, except the completing of the negotiation of any agreement or
    transaction which results or is intended to result in the sale, exchange, purchase, renting or
    leasing of any real estate
