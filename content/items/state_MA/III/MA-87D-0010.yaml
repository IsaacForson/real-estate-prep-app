stem: A partnership applies for a Massachusetts broker's license and designates one partner to hold
  the license on the partnership's behalf, but that partner has never individually applied for a
  broker's license. Under M.G.L. c. 112, § 87UU, what is the result?
options:
  - The partnership receives a license valid for ninety days
  - The partnership receives the license once its fee is paid
  - The partnership cannot yet be issued a broker's license
  - The partnership may operate while the partner's exam is pending
key: C
explanation: Section 87UU provides that no broker's license shall be issued to a partnership unless
  the designated partner has already been issued a broker's license as an individual.
citation:
  source: M.G.L. c. 112, § 87UU
  url: null
  quoted_text: No broker's license shall be issued to a corporation, society, association or
    partnership unless an officer or partner so designated has been issued a broker's license as an
    individual.
