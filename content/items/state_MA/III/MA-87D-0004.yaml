stem: A salesperson who is engaged by a broker receives a tenant's security deposit check. Under 254
  CMR 3.00, what must the salesperson do with that money?
options:
  - Turn the money over to the employing broker right away
  - Hold the money personally until the tenancy is created
  - Deposit the money into the salesperson's own escrow account
  - Return the money directly to the tenant for safekeeping
key: A
explanation: The regulation states that no salesperson shall at any time hold client funds, so money
  received must go to the employing broker rather than be kept by the salesperson.
