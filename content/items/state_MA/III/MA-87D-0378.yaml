stem: Under M.G.L. c.112 § 87YY, where must a licensed resident broker maintain a usual place of
  business?
options:
  - The city where the broker resides
  - The state where the broker works
  - The Commonwealth of Massachusetts
  - The need for a signed lease before fee
key: C
explanation: Under M.G.L. c.112 § 87YY, a licensed resident broker must maintain a usual place of
  business somewhere within the Commonwealth of Massachusetts. The belief that the broker’s place of
  business must be in the city where the broker resides is incorrect; the law only requires the
  business to be located anywhere in Massachusetts.
