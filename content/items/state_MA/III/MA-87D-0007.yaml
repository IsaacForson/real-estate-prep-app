stem: A broker meets a prospective seller in person for the first time to discuss listing a specific
  property. Under 254 CMR 3.00, when must the broker give that seller the Board's agency disclosure
  notice?
options:
  - At the closing, along with the other transaction paperwork
  - Once a buyer has already submitted a written purchase offer
  - After the seller has signed a written listing agreement
  - At that first personal meeting to discuss the property
key: D
explanation: The regulation requires the agency disclosure notice to be provided at the time of the
  first personal meeting between the prospective purchaser or seller and the broker or salesperson
  to discuss a specific property.
