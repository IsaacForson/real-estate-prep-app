stem: A broker opens a branch office in another town. According to M.G.L. c. 112, § 87YY, what
  action must the broker take regarding the Board?
options:
  - Pay a fee for the new location
  - Obtain a new license application
  - Give written notice to the Board promptly
  - Cease operations at the original location
key: C
explanation: The statute requires a broker to promptly give written notice to the Board of any
  change of business location; the Board then issues a new license for the new location. The
  distractor suggesting the broker must obtain a new license application confuses the notice
  requirement with the licensing process.
