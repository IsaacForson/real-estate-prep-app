stem: A person currently holds an active Massachusetts real estate broker license. Under 254 CMR
  3.00, may that same person simultaneously hold an active salesperson license?
options:
  - No, but just during the first year after broker licensure
  - No, a licensee may hold just one license type
  - Yes, if the salesperson license was issued more recently
  - Yes, if the broker sponsors the person's salesperson license
key: B
explanation: The regulation bars a broker from also being licensed as a salesperson and bars a
  salesperson from also being licensed as a broker, so only one license type may be held at a time.
citation:
  source: 254 CMR 3.00, Section 3.00(5)
  url: null
  quoted_text: No broker shall also be licensed as a salesperson nor shall any salesperson be licensed
