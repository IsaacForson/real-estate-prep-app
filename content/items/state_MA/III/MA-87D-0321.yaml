explanation: The law sets the fine for a clause (k) violation at not less than one thousand nor more
  than twenty‑five hundred dollars, so the greatest possible fine is twenty‑five hundred dollars
  ($2,500). The option listing $1,000 reflects the minimum fine, not the maximum.
