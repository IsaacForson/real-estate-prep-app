stem: A Massachusetts broker pays a referral fee to an unlicensed acquaintance who helped locate a
  buyer. Under M.G.L. c. 112, § 87AAA, is this permissible?
options:
  - The payment is permissible because the acquaintance acted only as a referral source.
  - The payment is impermissible because the broker paid a fee to an unlicensed person.
  - The payment is permissible if the broker discloses the payment to the buyer.
  - The payment is impermissible only if the acquaintance also negotiated the sale.
key: B
explanation: The statute prohibits paying commissions or fees to any person who is required to be
  licensed as a broker or salesman but is not licensed. Therefore, paying a referral fee to an
  unlicensed acquaintance violates this rule, making the statement that the payment is impermissible
  because the broker paid a fee to an unlicensed person correct. The statement that the payment is
  permissible because the acquaintance acted only as a referral source is incorrect because the
  statute does not exempt referral services; any fee paid to an unlicensed person is prohibited
  regardless of the role.
