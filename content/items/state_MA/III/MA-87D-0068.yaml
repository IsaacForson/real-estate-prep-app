stem: A broker designates an affiliated broker to represent the seller and another affiliated broker
  to represent the purchaser, with both parties consenting on a Board-developed form. Under 254 CMR
  3.00(3), what is the broker presumed to be?
options:
  - A single agent representing the seller only.
  - A non-agent facilitator assisting the parties.
  - A dual agent representing both parties.
  - A sub-agent representing the purchaser.
key: C
explanation: The regulation provides that when an appointing broker designates one affiliated broker
  for the seller and another for the purchaser, with consent on a Board-developed form, the
  appointing broker is presumed to be a dual agent. This matches the scenario described. The
  distractor suggesting a single agent is incorrect because the rule creates a presumption of dual
  agency, not single agency, under these circumstances.
citation:
  source: 254 CMR 3.00 — 254 CMR 3.00 — Professional Standards of Practice (Board of Registration of
    Real Estate Brokers and Salespersons), official mass.gov PDF read via Internet Archive capture
    of 2025-11-01 because mass.gov returns 403 to scripts § 3.00(3)
  url: null
  quoted_text: An appointing broker or salesperson who designates another affiliated broker or
    salesperson to represent the seller and an affiliated broker or salesperson to represent the
    purchaser shall be presumed to be a dual agent, provided that the seller and purchaser consent
    to such designation on a form developed by the Board.
