stem: An owner offers to list a property with a broker on the condition that the broker's commission
  is simply whatever amount is collected above an unstated sale price. Under 254 CMR 3.00, may the
  broker accept this listing?
options:
  - No, unless the buyer also consents to the fee structure
  - Yes, because the broker may set commission after closing
  - No, a listing with an unspecified commission is barred
  - Yes, because the owner proposed the unusual fee structure
key: C
explanation: The regulation bars a broker or salesperson from accepting a net listing in which the
  commission on a sale or rental is left unspecified.
citation:
  source: 254 CMR 3.00, Section 3.00(11)(c)
  url: null
  quoted_text: A broker or salesperson shall not accept a “net” listing from an owner or landlord for
    the sale or rental of real property in which the commission is unspecified.
