stem: A broker receives a final finding from the Massachusetts Commission against discrimination for
  an unlawful practice under chapter 151B. This is the broker's second such violation within two
  years of a prior final finding. Under M.G.L. c. 112, § 87AAA, what suspension period must the
  board impose?
options:
  - A suspension of 60 days
  - A suspension of 120 days
  - A suspension of 90 days
  - A suspension of 30 days
key: C
explanation: The law requires a sixty‑day suspension for a first violation, but if the violation
  occurred within two years of a prior final finding, the board must impose a ninety‑day suspension.
  Since this is the second violation within two years, the correct period is ninety days. The
  sixty‑day option applies only to a first offense.
