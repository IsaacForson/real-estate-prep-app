stem: A licensed resident broker moves her office to a new address within Massachusetts and promptly
  gives written notice to the Board of the change. Under M.G.L. c. 112, § 87YY, what is the result?
options:
  - The broker must pay a fine of $1,000 for the violation
  - The Board issues a new license for the new location
  - The broker is required to attend a disciplinary hearing
  - The broker's license is automatically revoked
key: B
explanation: The rule states that when a broker promptly gives notice of a change of business
  location, the Board must issue a new license for the new location for the unexpired term of the
  license. Therefore, issuance of a new license is the correct result. The distractor about
  revocation applies only when notice is not given, not when it is provided.
