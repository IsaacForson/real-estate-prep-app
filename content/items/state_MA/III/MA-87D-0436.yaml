stem: "Under M.G.L. c. 112, § 87RR, a salesman may **not**:"
options:
  - Receiving a bonus from the broker for exceeding sales targets
  - Being affiliated with more than one broker at the same time
  - Attending a mandatory continuing education course
  - Showing property to prospective buyers on weekends
key: B
explanation: The statute explicitly prohibits a salesman from being affiliated with more than one
  broker simultaneously. Receiving a performance‑based bonus from the employing broker is not barred
  because the restriction on fees applies only to compensation from persons other than the licensed
  broker. Showing property on weekends and attending continuing education are unrestricted
  activities under this provision.
