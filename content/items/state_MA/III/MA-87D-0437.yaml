stem: A broker plans to run newspaper ads in Massachusetts promoting a subdivision located in
  Vermont. The Vermont developer has not yet provided the Board with details of the land or
  deposited any funds. Under M.G.L. c. 112, § 87AAA, may the broker proceed with the advertising?
options:
  - The broker may proceed with the advertising because the property is outside Massachusetts
  - The broker may proceed only if the developer submits particulars and deposits funds with the
    Board
  - The broker may proceed provided the ads do not mention the Board
  - The broker may not proceed under any circumstances when advertising out-of-state property
key: B
explanation: The law forbids advertising another state’s land development in Massachusetts unless
  the owner has filed full particulars and deposited funds with the Board. Since the developer has
  done neither, the broker cannot run the ads. The option that the broker may proceed if the ads
  avoid mentioning the Board is incorrect because the submission and deposit requirements apply
  regardless of any reference to the Board.
citation:
  source: M.G.L. c. 112, § 87AAA
  url: null
  quoted_text: No broker shall engage in a sale in the commonwealth of real property located in a land
    development in another state which is the subject of promotional advertising in the commonwealth
    unless the owner or developer of such land has submitted to the board full particulars regarding
    such land and the proposed terms of sale thereof and has deposited with the board such sum as it
    shall determine, to pay the expense of the investigation hereinafter prescribed.
