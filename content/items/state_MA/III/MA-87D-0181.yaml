stem: A licensed resident broker moves her office to a new address within Massachusetts but does not
  notify the Board of the change. Under M.G.L. c. 112, § 87YY, what is the likely consequence?
options:
  - The broker must retake the licensing exam
  - The broker's license is automatically suspended for 30 days
  - The broker's license remains valid without penalty
  - The broker's license is subject to revocation
key: D
explanation: The statute requires the broker to give written notice of any change of business
  location, and it states that failure to give such notice is grounds for revocation of the license.
  Consequently, the license can be revoked. The answer that says the license is automatically
  suspended for 30 days adds a penalty that the statute does not provide.
