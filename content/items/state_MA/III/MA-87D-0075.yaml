stem: A licensed salesperson decides to open their own real estate brokerage under their own name
  while still affiliated with their employing broker. According to M.G.L. c. 112, § 87RR, what is
  the result?
options:
  - The salesperson is permitted to open their own brokerage provided they notify the broker in
    writing.
  - The salesperson is permitted to open their own brokerage if they handle referral fees.
  - The salesperson is prohibited from conducting or operating their own real estate business.
  - The salesperson is permitted to open their own brokerage after obtaining a separate broker's
    license.
key: C
explanation: Section 87RR prohibits a salesperson from conducting or operating their own real estate
  business while affiliated with a broker; they must act only as a representative of the responsible
  broker. Therefore, opening a separate brokerage is not allowed. The other options suggest
  circumstances under which the salesperson could open a brokerage, but the statute does not permit
  any such independent operation.
citation:
  source: M.G.L. c. 112, § 87RR
  url: null
  quoted_text: No salesman may conduct or operate his own real estate business nor act except as the
    representative of a real estate broker who shall be responsible for the salesman and who must
    approve the negotiation and completion by the salesman of any transaction or agreement which
    results or is intended to result in the sale, exchange, purchase, renting or leasing of any real
    estate or in a loan secured or to be secured by mortgage or other encumbrance upon real estate.
