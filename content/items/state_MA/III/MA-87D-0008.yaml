stem: A broker meets with a prospective tenant for the first time and intends to charge that tenant
  a fee for finding an apartment. Under 254 CMR 7.00, when must the broker give the tenant written
  notice of the fee?
options:
  - At the broker's first meeting with the tenant
  - After a lease has already been signed by that tenant
  - When the tenant later asks in writing about the fee
  - Within thirty days after the tenancy actually begins
key: A
explanation: The regulation requires brokers charging a fee to a prospective tenant to give written
  notice of the fee at the first personal meeting between the broker or salesperson and that tenant.
