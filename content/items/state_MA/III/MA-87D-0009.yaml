stem: A salesperson is affiliated with Broker A and, without telling Broker A, begins accepting
  referral commissions directly from Broker B on separate deals. Under M.G.L. c. 112, § 87RR, why is
  this arrangement improper?
options:
  - A salesperson may not accept any commission from any broker
  - A salesperson may be affiliated with one broker at a time
  - A salesperson may not be paid on a per-transaction basis
  - A salesperson may not act as an independent contractor
key: B
explanation: Section 87RR provides that no salesman shall be affiliated with more than one broker at
  the same time nor accept compensation from anyone but his own licensed broker for such
  transactions.
citation:
  source: M.G.L. c. 112, § 87RR
  url: null
  quoted_text: No salesman shall be affiliated with more than one broker at the same time nor shall
    any salesman be entitled to any fee, commission or other valuable consideration or solicit or
    accept the same from any person except his licensed broker in connection with any such agreement
    or transaction.
