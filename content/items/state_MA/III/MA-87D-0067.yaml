stem: Under 254 CMR 3.00(e), what is the facilitator's duty regarding confidentiality of information
  received from a seller or purchaser?
options:
  - The facilitator may keep information confidential only with written consent.
  - The facilitator must disclose all information to the broker.
  - The facilitator has no duty of confidentiality regarding such information.
  - The facilitator must keep all information confidential.
key: C
explanation: The rule explicitly states that a facilitator does not have a duty of confidentiality
  regarding any information received from the seller or purchaser. Therefore, the correct answer is
  that the facilitator has no duty of confidentiality. The distractor claiming the facilitator must
  keep all information confidential is incorrect because the regulation imposes no such obligation.
