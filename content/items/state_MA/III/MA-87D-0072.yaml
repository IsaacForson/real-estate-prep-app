stem: "Under M.G.L. c. 112, § 87PP, a corporation is considered a 'non-resident' if it:"
options:
  - Is organized under the laws of another state and maintains a usual place of business outside the
    commonwealth.
  - Is organized under the laws of the commonwealth and does not maintain a usual place of business
    within the commonwealth.
  - Is organized under the laws of another state and does not maintain a usual place of business
    within the commonwealth.
  - Is organized under the laws of another state and maintains a usual place of business within the
    commonwealth.
key: C
explanation: M.G.L. c. 112, § 87PP defines a 'non-resident' corporation as one organized under the
  laws of another state that does not maintain a usual place of business within the commonwealth.
  The option stating that the corporation is organized under the laws of another state and does not
  maintain a usual place of business within the commonwealth is correct. The option suggesting the
  corporation maintains a usual place of business outside the commonwealth is incorrect because the
  statute specifically requires the absence of a usual place of business *within* the commonwealth,
  not merely outside it. The option claiming the corporation is organized under the laws of the
  commonwealth is incorrect because a corporation organized in Massachusetts is not a non-resident
  under this definition. Finally, the option stating the corporation maintains a usual place of
  business within the commonwealth is incorrect because maintaining such a place of business within
  the state disqualifies the corporation from being classified as a non-resident.
