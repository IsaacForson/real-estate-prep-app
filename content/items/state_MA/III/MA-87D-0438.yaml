stem: A broker closes a residential sale and provides the signed purchase and sale agreement to the
  buyer only. Under M.G.L. c. 112, § 87AAA, is this permissible?
options:
  - It is permissible provided the agreement is recorded with the registry of deeds
  - It is permissible because the buyer needs the document for financing
  - It is permissible if the seller waives the right to receive a copy
  - It is not permissible; both buyer and seller must receive a copy
key: D
explanation: The statute requires that a licensee give both the buyer and seller a copy of the
  purchase and sale agreement; providing it to only one party violates this duty. A seller’s waiver
  does not override the statutory requirement, and recording the deed does not satisfy the
  copy‑delivery obligation.
