  url: null
  quoted_text: Said notice shall be filed by delivery in hand to the conservation commission or its
    authorized representative or by certified mail, return receipt requested, to said commission,
    or, if none, to the board of selectmen in a town or the mayor of a city in which the proposed
    activity is to be located.
