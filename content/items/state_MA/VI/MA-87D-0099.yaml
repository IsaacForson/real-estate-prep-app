stem: Under M.G.L. c.131 §40, how must a notice of intention to remove, fill, dredge or alter a
  wetland be filed with the conservation commission?
options:
  - Submitted electronically via the state’s online portal for approval
  - Delivered in hand or sent by certified mail, return receipt requested
  - Mailed by regular post without return receipt or tracking number for the commission
  - Filed only with the board of selectmen regardless of project location
key: B
explanation: Under M.G.L. c.131 §40, a notice of intention to remove, fill, dredge or alter a
  wetland must be filed either by hand delivery to the conservation commission (or its authorized
  representative) or by certified mail with return receipt requested. Therefore, the correct choice
  is the one stating delivery in hand or certified mail, return receipt requested. Submitting the
  notice electronically is not permitted; regular mail without a return receipt does not satisfy the
  requirement; and filing solely with the board of selectmen is only appropriate when no
  conservation commission exists, which is not the general rule.
