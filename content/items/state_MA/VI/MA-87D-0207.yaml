stem: A licensee is assisting a property owner who is leasing a residential unit with an option to
  purchase. The prospective tenant‑buyer requests to conduct a lead paint inspection before signing
  the lease‑option agreement. What must the owner do under M.G.L. c.111 §197A(b)(1)?
options:
  - Providing the prospective tenant‑buyer with a copy of the most recent lead paint inspection
    report
  - Providing the prospective tenant‑buyer with a copy of the standard lead notification form only
  - Disclosing to the prospective tenant‑buyer any known information about lead hazards in the
    premises
  - Affording the prospective tenant-buyer a period of ten days or longer if agreed to conduct a
    lead inspection
key: D
explanation: Under M.G.L. c.111 §197A(b)(1), when the lessee‑prospective purchaser elects to have a
  lead inspection, the lessor‑prospective seller must give the lessee‑prospective purchaser at least
  ten days, or a longer period if the parties agree, to have the inspection performed. Therefore,
  the owner must allow the inspection period. Supplying only the standard lead‑hazard notification
  form or a copy of a prior inspection report does not meet the statutory duty to provide time for
  an inspection. Merely disclosing known lead hazards also does not satisfy the timing requirement.
