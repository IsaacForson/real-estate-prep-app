stem: Under M.G.L. c.131 §40, who is considered the 'applicant' for filing a notice of intention to
  remove, fill, dredge or alter a wetland?
options:
  - The landowner of the property where the activity is proposed.
  - The contractor performing the removal, fill, dredge, or alteration.
  - The person giving notice of intention to remove, fill, dredge or alter.
  - The municipal official receiving the notice of intention from the applicant.
key: C
explanation: Under M.G.L. c.131 §40, the term 'applicant' is defined as the person who gives notice
  of intention to remove, fill, dredge or alter a wetland. Therefore, the correct choice is the one
  stating that the applicant is the person giving notice of intention to remove, fill, dredge or
  alter. The other choices are incorrect because the landowner is not necessarily the one filing the
  notice, the contractor performs the work but is not required to give notice unless they also are
  the applicant, and the municipal official receives the notice rather than filing it.
