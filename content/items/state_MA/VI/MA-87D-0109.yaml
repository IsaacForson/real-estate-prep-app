  quoted_text: When a notice of intent proposes activity on a linear shaped project site longer than
    1,000 feet in length, notification shall be given to all abutters within 1,000 feet of the
    proposed project site. If the linear project site takes place wholly within an easement through
    another person's land, notice shall also be given to the landowner.
