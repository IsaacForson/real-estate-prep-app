stem: A licensee submits a notice of intention to install an underground utility line that runs
  1,200 feet along a roadway, wholly within an existing utility easement on private land. According
  to M.G.L. c.131 §40, to whom must written notification of the notice of intent be given?
options:
  - All abutters within 1,000 feet of the project site only.
  - All abutters within 1,000 feet of the project site and the landowner of the easement.
  - All abutters within 100 feet of the property line only.
  - All abutters within 100 feet of the property line and the municipal board.
key: B
explanation: For a linear project longer than 1,000 feet, the law requires notification to all
  abutters within 1,000 feet of the project site. Additionally, if the linear project is wholly
  within an easement through another's land, notice must also be given to the landowner of that
  easement. Therefore, both the abutters within 1,000 feet and the easement landowner must be
  notified. The answer limiting notification to only 100-foot abutters ignores the 1,000‑foot rule
  for linear projects. The answer that includes only the 1,000‑foot abutters omits the required
  notice to the easement landowner.
