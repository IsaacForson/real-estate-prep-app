stem: Under M.G.L. c.131 §40, if a notice of intent proposes activity on a linear shaped project
  site longer than 1,000 feet, within what distance must notification be given to abutters?
options:
  - 100 feet
  - 1,000 feet
  - 1,500 feet
  - 500 feet
key: B
explanation: The statute states that when a notice of intent proposes activity on a linear shaped
  project site longer than 1,000 feet, notification shall be given to all abutters within 1,000 feet
  of the proposed project site. Therefore, the required distance is 1,000 feet. The distractor of
  100 feet applies to tracts over 50 acres or land under water, not to linear sites over 1,000 feet.
