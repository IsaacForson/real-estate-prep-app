stem: A citizen sends a certified mail request to the conservation commission asking whether a
  proposed fill activity is subject to the Wetlands Protection Act. According to M.G.L. c.131 §40,
  within how many days must the commission issue a written determination?
options:
  - 10 days
  - 21 days
  - 30 days
  - 60 days
key: B
explanation: The law states that within twenty-one days of receiving a certified mail request, the
  conservation commission must make a written determination as to whether the section applies.
  Therefore, the commission has 21 days to issue the determination. The answer of 10 days is too
  short and does not match the statutory period. The answer of 30 days exceeds the required
  timeframe.
