stem: A licensee is assisting a client who plans to transfer ownership of a residential property to
  the client's sister. According to M.G.L. c.21A §13, what is required regarding a septic system
  inspection for this transfer?
options:
  - A septic system inspection must be conducted and the report submitted to the local board of
    health under the state environmental code
  - A septic system inspection must be waived for transfers between full siblings under the state
    environmental code
  - A septic system inspection must be conducted by a licensed sanitarian under the state
    environmental code
  - A septic system inspection must be performed if the property is over 10 years old under the
    state environmental code
key: B
explanation: M.G.L. c.21A §13 states that the department shall not require an inspection of a
  subsurface sewage disposal system if the transfer is of residential real property between full
  siblings. Therefore, no septic system inspection is required for a transfer between siblings. The
  other options incorrectly mandate an inspection, a licensed sanitarian, report submission, or a
  property age condition, which are not supported by the statute for this relationship.
citation:
  source: "### M.G.L. c. 21A — Massachusetts General Laws c. 21A — Executive Office of Environmental
    Affairs (§ 13 Title 5) (selected sections cited by the exam outline), official malegislature.gov
    section pages read via Internet Archive captures of 2025-10 to 2026-06 because malegislature.gov
    refuses connections from scripts — § 13"
  url: null
  quoted_text: "The department shall not require an inspection of a system for the treatment and the
    disposal of sanitary sewage below the ground surface if the transfer is of residential real
    property, and is between the following relationships: (1) between current spouses; (2) between
    parents and their children; (3) between full siblings; and (4) where the grantor transfers the
    real property to be held in a revocable or irrevocable trust, where at least one of the
    designated beneficiaries is of the first degree of relationship to the grantor."
