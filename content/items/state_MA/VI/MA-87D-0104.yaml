  url: null
  quoted_text: All buildings or structures occupied in whole or in part for residential purposes and
    not regulated by sections twenty-six A, twenty-six B or twenty-six C shall, upon the sale or
    transfer of such building or structure, be equipped by the seller with approved smoke detectors
    as provided in section twenty-six E.
