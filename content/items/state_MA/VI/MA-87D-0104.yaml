stem: A licensee lists a single-family home built in 1980 for sale. According to M.G.L. c.148 §26F,
  what must the seller do prior to closing?
options:
  - The seller must equip the building with approved smoke detectors as provided in section
    twenty-six E under the state fire prevention regulations
  - The seller must provide a lead paint notification brochure to the buyer under the state fire
    prevention regulations
  - The seller must obtain a letter of interim control for lead hazards under the state fire
    prevention regulations
  - The seller must conduct a septic system inspection and submit the report to the local board of
    health under the state fire prevention regulations
key: A
explanation: M.G.L. c.148 §26F requires that, upon the sale or transfer of residential buildings not
  regulated by sections 26A‑26C, the seller must equip the building with approved smoke detectors as
  specified in section 26E. The seller’s obligation is to install smoke detectors, not to provide
  lead paint notifications, obtain lead compliance letters, or conduct septic inspections. Those
  other actions pertain to different statutory requirements.
citation:
