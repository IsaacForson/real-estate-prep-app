stem: Under M.G.L. c. 64G §1, a licensee who, on behalf of a property owner, handles maintenance of
  a rental unit and takes reservation requests for guests is acting as which of the following?
options:
  - It is classified as an operator's agent because the licensee manages maintenance and takes
    reservation requests on behalf of the operator.
  - It is classified as an operator because the licensee owns the property and collects rent
    directly from guests.
  - It is classified as an intermediary because the licensee facilitates the sale of occupancy and
    charges a room charge to the general public.
  - It is classified as a hosting platform because the licensee provides a digital service for
    advertising and booking accommodations.
key: A
explanation: M.G.L. c. 64G §1 defines an operator's agent as a person who, on behalf of an operator,
  manages the operation or upkeep of a property offered for rent or books reservations at such a
  property. The licensee’s maintenance and reservation activities fit this definition exactly. The
  option describing an operator is incorrect because an operator must actually operate the rental
  property. The option describing an intermediary is incorrect because that role facilitates
  occupancy sales and charges a room charge, which is a broader role not limited to maintenance and
  bookings. The option describing a hosting platform is incorrect because that refers to a digital
  service, not a person performing maintenance or reservations.
