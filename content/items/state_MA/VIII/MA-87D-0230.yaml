    scripts
  url: null
  quoted_text: "''Operator's agent'', a person who on behalf of an operator of a bed and breakfast
    establishment, hotel, motel, short-term rental or lodging house: (i) manages the operation or
    upkeep of a property offered for rent; or (ii) books reservations at a property offered for
    rent; provided, however, that an ''operator's agent'' shall include, but not be limited to, a
    property manager, property management company or real estate agent."
