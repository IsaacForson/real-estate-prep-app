stem: According to M.G.L. c.64G §1, which statement correctly defines a 'bed and breakfast home'?
options:
  - A private owner-occupied house where not less than 4 rooms are let, a breakfast is included in
    the rent and all accommodations are reserved in advance.
  - A private owner-occupied house where not more than 3 rooms are let, a breakfast is included in
    the rent and all accommodations are reserved in advance.
  - A private owner-occupied house where not more than 3 rooms are let, breakfast is optional and
    accommodations may be walk-in.
  - A private owner-occupied house where not less than 4 rooms are let, breakfast is optional and
    accommodations may be walk-in.
key: B
explanation: M.G.L. c. 64G §1 defines a bed and breakfast home as a private owner-occupied house
  where not more than 3 rooms are let, a breakfast is included in the rent, and all accommodations
  are reserved in advance. The option describing a house with not less than 4 rooms let does not
  match this statutory definition.
