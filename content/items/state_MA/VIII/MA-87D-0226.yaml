stem: According to M.G.L. c. 64G §1, which of the following best defines a 'short-term rental'?
options:
  - A property that collects rent via a hosting platform, does not require advance reservations, and
    is not considered a short-term rental under this chapter.
  - A property that rents at least one room to an occupant, requires advance reservations for all
    accommodations, and is not a hotel, motel, lodging house, or bed and breakfast establishment.
  - A property that is owner-occupied, has exactly three rooms for rent with breakfast included, and
    requires advance reservations for all units.
  - A property that rents rooms for more than 31 consecutive days, includes breakfast in the rent,
    and is not a hotel, motel, lodging house, or bed and breakfast establishment.
key: B
explanation: M.G.L. c. 64G §1 defines a short-term rental as an owner-occupied, tenant-occupied, or
  non-owner-occupied property (such as an apartment, house, or cottage) that is not a hotel, motel,
  lodging house, or bed and breakfast establishment, where at least one room is rented and all
  accommodations are reserved in advance. The option describing a property that rents at least one
  room and requires advance reservations matches this statutory definition. The option describing a
  property that rents rooms for more than 31 consecutive days is incorrect because the statute does
  not impose a minimum duration, and the 31-day threshold is associated with other occupancy rules.
  The option specifying exactly three rooms with breakfast included is incorrect because the statute
  does not limit the number of rooms or require breakfast, which is a feature of bed and breakfast
  establishments. The option stating that a property is not considered a short-term rental if it
  does not require advance reservations is incorrect because advance reservation is a mandatory
  element of the definition.
