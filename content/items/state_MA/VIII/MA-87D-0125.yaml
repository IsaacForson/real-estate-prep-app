stem: Under M.G.L. c. 111 §127A, what is the maximum fine for a single violation of the state
  sanitary code that does **NOT** involve improper disposal of infectious or biologically dangerous
  medical waste?
options:
  - $2,500
  - $500
  - $5,000
  - $25,000
key: B
explanation: The statute states that penalties for violations of the state sanitary code do not
  exceed five hundred dollars for any one offence, unless the violation involves improper disposal
  of infectious or biologically dangerous medical waste. Therefore, the maximum fine for a
  non‑hazardous violation is $500. The other amounts either exceed the statutory limit or apply only
  to the specific hazardous‑waste violation.
