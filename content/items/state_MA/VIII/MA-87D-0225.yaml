stem: A local board of health has not taken action against a housing violation for several months.
  What may the Department of Public Health do under M.G.L. c.111 § 127A?
options:
  - The department may enforce the state sanitary code against the violator.
  - The department may impose a fine of up to $500 on the violator.
  - The department may file a complaint in the Superior Court to obtain an injunction.
  - The department may require the local board to reimburse affected tenants.
key: A
explanation: Under M.G.L. c.111 §127A, if a local board of health fails after a reasonable time to
  enforce the state sanitary code, the department may enforce the code against the violator.
  Therefore, the department may enforce the code against the violator. The distractor suggesting the
  department may impose a fine of up to $500 is incorrect because the statute assigns fine authority
  to the code itself, not to the department’s enforcement action.
citation:
  source: M.G.L. c. 111 § 127A
  url: null
  quoted_text: Local boards of health shall enforce said code in the same manner in which local health
    rules and regulations are enforced, but, if any such local boards fail after the lapse of a
    reasonable length of time to enforce the same, the department may in like manner enforce said
    code against any violator.
