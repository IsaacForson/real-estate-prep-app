stem: A tenant rents out their condominium unit to a guest for 20 days, with the reservation made in
  advance. Under M.G.L. c.64G §1, this arrangement is classified as what?
options:
  - An arrangement classified as a bed and breakfast establishment.
  - An arrangement classified as a lodging house.
  - An arrangement classified as a short-term rental.
  - An arrangement classified as a bed and breakfast home.
key: C
explanation: A short-term rental includes tenant-occupied property where at least one room is rented
  and all accommodations are reserved in advance. The scenario meets these criteria. A bed and
  breakfast establishment requires owner-occupancy and at least four rooms, which is not present.
citation:
  source: M.G.L. c. 64G — Massachusetts General Laws c. 64G — Room Occupancy Excise (§ 1) (selected
    sections cited by the exam outline), official malegislature.gov section pages read via Internet
    Archive captures of 2025-10 to 2026-06 because malegislature.gov refuses connections from
    scripts § 1
  url: null
  quoted_text: "''Short-term rental'', an owner-occupied, tenant-occupied or non-owner occupied
    property including, but not limited to, an apartment, house, cottage, condominium or a furnished
    accommodation that is not a hotel, motel, lodging house or bed and breakfast establishment,
    where: (i) at least 1 room or unit is rented to an occupant or sub-occupant; and (ii) all
    accommodations are reserved in advance; provided, however, that a private owner-occupied
    property shall be considered a single unit if leased or rented as such."
