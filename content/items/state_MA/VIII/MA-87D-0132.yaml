stem: According to M.G.L. c. 64G §1, which statement correctly defines a 'bed and breakfast
  establishment'?
options:
  - A private owner-occupied house where not less than 4 rooms are let, breakfast is excluded from
    the rent and reservations are not required
  - A private owner-occupied house where not less than 2 rooms are let, breakfast is optional and
    reservations may be made same-day
  - A private owner-occupied house where not more than 3 rooms are let, a breakfast is included in
    the rent and all accommodations are reserved in advance
  - A private owner-occupied house where not less than 4 rooms are let, a breakfast is included in
    the rent and all accommodations are reserved in advance
key: D
explanation: According to M.G.L. c. 64G §1, a bed and breakfast establishment is a private
  owner‑occupied house where not fewer than four rooms are let, breakfast is included in the rent,
  and all accommodations must be reserved in advance. The option that matches this description is
  correct. Any option that describes fewer than four rooms, makes breakfast optional, or does not
  require advance reservations contradicts the statutory definition and is therefore incorrect.
