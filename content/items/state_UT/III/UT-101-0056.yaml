stem: A licensee wishes to place a promotional sign on a seller's vacant lot. The seller has not
  given written consent. Under Utah Admin. Code R162-2f-401b(1)(g), what action must the licensee
  take before placing the sign?
options:
  - Obtain consent from the listing broker
  - Obtain written consent from the property owner
  - Obtain verbal consent from the property owner
  - Obtain consent after four years have passed
key: B
explanation: The rule prohibits placing a sign on real property without the owner's written consent,
  so the licensee must first obtain that written consent. Verbal consent does not satisfy the
  written requirement, making the option that suggests obtaining verbal consent from the property
  owner incorrect.
