  url: null
  quoted_text: "(l) pay a finder's fee or give any valuable consideration to an unlicensed person or
    entity for referring a prospect, except that: (i) a licensee may give a gift valued at $250 or
    less to an individual in appreciation for an unsolicited referral of a prospect that results in
    a real estate transaction;"
