stem: According to Utah Admin. Code R162-2f-401b(1)(l), what is the maximum value of a gift a
  licensee may give to an individual in appreciation for an unsolicited referral of a prospect that
  results in a real estate transaction?
options:
  - A gift valued at $300 or less may be given.
  - A gift valued at $200 or less may be given.
  - A gift valued at $250 or less may be given.
  - A gift valued at $150 or less may be given.
key: C
explanation: The rule explicitly permits a licensee to give a gift valued at $250 or less for an
  unsolicited referral that leads to a transaction. Any amount above this limit is not allowed under
  the exception. Therefore, the correct maximum is $250.
