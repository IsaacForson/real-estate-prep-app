stem: Under Utah Admin. Code R162-2f-401c(1)(h)(i), within how many business days must a principal
  broker deposit a client's money received in a real estate transaction into a trust account?
options:
  - Seven business days
  - Five business days
  - Three business days
  - Four business days
key: C
explanation: The rule requires deposit within three business days of receiving client money in a
  real estate transaction. Options stating one, two, or five days do not match the required
  timeframe.
