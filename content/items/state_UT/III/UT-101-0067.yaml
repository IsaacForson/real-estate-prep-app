stem: A licensee gives a $300 gift to an individual who provided an unsolicited referral that
  resulted in a real estate transaction. Under Utah Admin. Code R162-2f-401b(1)(l)(i), is this
  permissible?
options:
  - It is not permissible because the gift exceeds $250 in value.
  - It is permissible because the gift is under $500 in value.
  - It is permissible because the referral led to a transaction.
  - It is not permissible because gifts for referrals are prohibited.
key: A
explanation: The rule permits a licensee to give a gift valued at $250 or less to an individual for
  an unsolicited referral that results in a real estate transaction. A $300 gift exceeds this limit,
  so it is not permissible. The option stating that the gift is permissible because the referral led
  to a transaction fails to consider the dollar cap.
