stem: A principal broker receives a security deposit from a tenant in a property management
  transaction. According to Utah Admin. Code R162-2f-401c(1)(h)(ii), what must the broker do within
  three business days?
options:
  - Transfer funds to the tenant's personal account within five business days
  - Place funds in a short‑term CD and remit to owner after lease termination
  - Deposit funds into the broker's operating account and hold for thirty days
  - Deposit funds into the broker's trust account or send to property owner
key: D
explanation: The rule requires the broker to deposit the money into the broker's trust account or
  forward it to the property owner's account within three business days. Holding, investing, or
  returning the funds does not satisfy this requirement.
