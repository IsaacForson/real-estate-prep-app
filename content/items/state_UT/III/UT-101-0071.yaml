stem: A licensee refers a buyer to a lender and receives a referral fee from the lender for the
  referral. Under Utah Admin. Code R162-2f-401b(1)(m), is this permissible?
options:
  - Accepting the referral fee is permissible because it is less than $250.
  - Accepting the referral fee is permissible if disclosed to all parties.
  - Accepting the referral fee is prohibited when received from a lender.
  - Accepting the referral fee is permissible only if the licensee is also a mortgage loan
    originator.
key: C
explanation: Under Utah Admin. Code R162-2f-401b(1)(m), a licensee may not accept a referral fee
  from a lender or mortgage broker. The rule allows no exception based on the fee amount or
  disclosure, so receiving the fee is prohibited.
