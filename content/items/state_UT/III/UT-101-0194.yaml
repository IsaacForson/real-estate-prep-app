stem: A principal broker opens a second office in another city. According to Utah Code §
  61-2f-206(2), what must the principal broker do to legally operate that office?
options:
  - The principal broker must submit an application and pay the registration fee to the division.
  - The principal broker must pay the registration fee to the division but is not required to submit
    an application.
  - The principal broker must notify the division via email within 30 days of opening the branch
    office.
  - The principal broker must submit an application to the division but is not required to pay a fee.
key: A
explanation: Under Utah Code § 61-2f-206(2), a principal broker must register each branch office by
  submitting an application and paying the required registration fee. Both steps are mandatory for
  the branch office to be legally recognized. The option stating that the broker must pay the fee
  but is not required to submit an application is incorrect because omitting the application fails
  to satisfy the registration requirement, and the division will not consider the office registered
  without the application.
citation:
  source: "### Utah Code Ann. ch. 61-2f (Real Estate Licensing and Practices Act) — Utah Code Title
    61, Chapter 2f — Real Estate Licensing and Practices Act (current version), official Utah
    Legislature PDF read via Internet Archive capture of 2025-09-14 because le.utah.gov refuses
    connections from this network — § 61-2f-206(2)"
  url: null
  quoted_text: "To register a branch office with the division under this Subsection (2), a principal
    broker shall submit to the division: (i) an application in a form required by the division; and
    (ii) a registration fee established by the commission with the concurrence of the division under
    Section 63J-1-504."
