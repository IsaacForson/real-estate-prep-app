stem: A principal broker who already oversees the main brokerage office wishes to also be
  responsible for a separate property management company. Under Utah Code Ann. § 61-2f-206(4), is
  this permissible?
options:
  - The action is not permissible unless an exception is provided under this chapter or by a rule
    made by the commission
  - The action is permissible as long as the property management company is registered as a branch
    office
  - The action is permissible if the principal broker designates a branch broker to supervise the
    property management company
  - The action is not permissible unless the principal broker receives explicit authorization from
    the division to manage multiple entities
key: A
explanation: Under Utah Code Ann. § 61-2f-206, a principal broker may not be responsible for more
  than one registered entity at the same time unless an exception is provided under this chapter or
  by a rule made by the commission. Therefore, the action is not permissible unless such an
  exception applies. The option stating that the action is permissible if the property management
  company is registered as a branch office is incorrect because the statute does not allow
  permissibility based solely on branch office status. The option stating that the action is
  permissible if the principal broker designates a branch broker to supervise the property
  management company is also incorrect because the statute does not provide such an exception. The
  option stating that the action is not permissible unless the principal broker receives explicit
  authorization from the division to manage multiple entities is incorrect because the statute
  requires an exception under the chapter or a commission rule, not division authorization.
