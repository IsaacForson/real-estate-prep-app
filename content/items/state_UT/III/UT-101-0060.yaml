stem: "According to Utah Admin. Code R162-2f-102(1), a license is considered active only if the
  license holder:"
options:
  - Qualifying for licensure under Section 61-2f-203, paying applicable nonrefundable license fees,
    and affiliating with a principal brokerage
  - Qualifying for licensure under Section 61-2f-203, paying applicable nonrefundable license fees,
    and affiliating with a principal broker
  - Qualifying for licensure under Section 61-2f-203, paying applicable refundable license fees, and
    affiliating with a principal brokerage
  - Qualifying for licensure under Section 61-2f-203, paying applicable nonrefundable license fees,
    and employing a principal broker
key: A
explanation: The definition of an active license requires the applicant to qualify for licensure
  under Section 61-2f-203, pay applicable nonrefundable license fees, and affiliate with a principal
  brokerage. The option that states qualifying for licensure under Section 61-2f-203, paying
  applicable nonrefundable license fees, and affiliating with a principal brokerage matches all
  three criteria. The option that substitutes 'principal broker' for 'principal brokerage' is
  incorrect because affiliation must be with a brokerage, not an individual broker. The option that
  states fees are refundable is incorrect because fees must be nonrefundable. The option that
  requires employing a principal broker is incorrect because the requirement is to affiliate with a
  principal brokerage, not to employ a broker.
citation:
