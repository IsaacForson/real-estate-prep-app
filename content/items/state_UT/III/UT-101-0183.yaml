stem: A licensee represents both the buyer and the seller in the same residential transaction but
  only obtains verbal agreement from both parties to act as a dual agent. Under Utah Code
  § 61‑2f‑401, is this conduct grounds for disciplinary action?
options:
  - No, because verbal consent from both parties satisfies the requirement for informed written
    consent
  - No, because the licensee disclosed the dual agency arrangement to both parties after the
    transaction closed
  - Yes, because the licensee failed to obtain informed written consent from both parties
  - Yes, but only if the transaction involves commercial real estate rather than residential property
key: C
explanation: Utah Code § 61‑2f‑401(2) makes it a disciplinary violation for a licensee to act for
  more than one party in a transaction unless each party gives informed written consent. Because the
  licensee only obtained verbal agreement, the required written consent was not met, so the conduct
  is disciplinary. The suggestion that the licensee disclosed the dual‑agency arrangement after the
  transaction closed is incorrect, because disclosure after the fact does not satisfy the informed
  written‑consent requirement.
