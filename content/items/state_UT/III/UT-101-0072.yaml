stem: A principal broker wants to exercise active and reasonable supervision over affiliated
  licensees. According to Utah Admin. Code R162-2f-401c(3)(a), which action is required?
options:
  - Establish written policies, rules, and procedures
  - Ensure licensees complete a continuing education course
  - Require licensees to pay a monthly supervision fee
  - Conduct supervision only when a complaint is filed
key: A
explanation: The rule defines active and reasonable supervision as including the establishment of
  written policies, rules, and procedures. The other options describe unrelated or incorrect
  practices not mentioned in the rule.
