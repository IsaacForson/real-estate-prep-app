stem: What is the definition of 'Branch office' under Utah Admin. Code R162-2f-102?
options:
  - A principal broker's real estate brokerage office operated under a different trade name than the
    main office
  - A principal broker's real estate brokerage office that shares the same address as the main office
  - A principal broker's real estate brokerage office other than the principal broker's main office
  - A principal broker's real estate brokerage office located in a different county from the main
    office
key: C
explanation: The rule defines a branch office as a principal broker's real estate brokerage office
  other than the principal broker's main office. Options referring to county location, shared
  address, or trade name describe possible variations but are not part of the definition.
