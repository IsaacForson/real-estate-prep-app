stem: Under Utah Code Ann. § 61-2f-102(1), how is an "admonition" defined?
options:
  - A private warning issued to a licensee that identifies the individual and describes the violation
  - A public discipline that declares the conduct of a person as improper and does not identify the
    person
  - A formal reprimand that is recorded in the licensee's permanent file and may lead to suspension
  - A monetary penalty assessed by the commission for a violation of licensing statutes
key: B
explanation: Utah Code Ann. § 61‑2f‑102(1) defines an admonition as a public discipline that
  declares a person’s conduct improper but does not identify the person. The answer choice that
  describes a public discipline that declares the conduct of a person as improper and does not
  identify the person matches that definition. The other choices describe a private warning, a
  formal reprimand recorded in a permanent file, or a monetary penalty, which are not the statutory
  meaning of admonition.
