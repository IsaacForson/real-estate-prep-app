stem: According to Utah Code Ann. § 61-2f-103(5)(a), what is the standard term length for a member
  of the Utah Real Estate Commission?
options:
  - Four-year term
  - Five-year term
  - Two-year term
  - Three-year term
key: A
explanation: The statute specifies that each new or reappointed member serves a four-year term
  ending June 30. The three-year term is incorrect because the law sets the term at four years, not
  three.
