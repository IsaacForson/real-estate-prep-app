stem: According to Utah Admin. Code R162-2f-102, which of the following is included in the
  definition of 'Advertising'?
options:
  - A personal conversation
  - A verbal recommendation
  - A handwritten note card
  - A newspaper advertisement
key: D
explanation: The rule defines Advertising as a commercial message through newspaper, magazine,
  Internet, email, radio, television, direct mail promotions, business cards, door hangers, signs,
  other electronic communication, or any other medium. A newspaper advertisement fits this
  definition. A personal conversation, handwritten note card, or verbal recommendation are not
  listed as mediums and thus are not Advertising under the rule.
