stem: Under Utah Code Ann. § 61-2f-102(2)(a), how is an 'Advertisement' defined?
options:
  - A notice or announcement meant to promote the availability of real estate, an option on real
    estate, or a business opportunity for sale, exchange, auction, or lease; specifically solicit
    the public to contact that licensee for more information; or advertise the licensee's personal
    real estate investments
  - A notice or announcement meant to offer specific types of brokerage services; specifically
    solicit the public to contact that licensee for more information; or encourage the public to
    attend a real estate seminar hosted by a third party
  - A notice or announcement meant to promote the availability of real estate, an option on real
    estate, or a business opportunity for sale, exchange, auction, or lease; offer specific types of
    brokerage services; or specifically solicit the public to contact that licensee for more
    information
  - A notice or announcement meant to promote the availability of real estate, an option on real
    estate, or a business opportunity for sale, exchange, auction, or lease; offer specific types of
    brokerage services; or promote the sale of mortgage loans
key: C
explanation: The definition in Utah Code Ann. § 61-2f-102(2)(a) states that an advertisement is a
  notice or announcement meant to (i) promote the availability of real estate, an option on real
  estate, or a business opportunity for sale, exchange, auction, or lease; (ii) offer specific types
  of brokerage services; or (iii) specifically solicit the public to contact that licensee for more
  information. The correct option includes all three of these purposes. The first incorrect option
  omits the offer of brokerage services and instead adds promotion of the licensee’s personal real
  estate investments, which is not part of the statutory definition. The second incorrect option
  leaves out the promotion of real estate availability and replaces it with encouragement to attend
  a third‑party hosted seminar, which is also not included in the definition. The third incorrect
  option keeps the first two elements but substitutes solicitation of public contact with promotion
  of mortgage loan sales, which the statute does not list as an advertisement purpose.
