  quoted_text: >-
    (a) "Advertisement" means a notice or announcement meant to:

    (i) promote the availability of real estate, an option on real estate, or a business opportunity
    for sale, exchange, auction, or lease;

    (ii) offer specific types of brokerage services; or

    (iii) specifically solicit the public to contact that licensee for more information.
