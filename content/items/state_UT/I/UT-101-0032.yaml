stem: "A licensee forms an employment association with another licensed broker specifically to
  provide real estate services. Under Utah Admin. Code R162-2f-102, this relationship is best
  described as:"
options:
  - A licensee who forms an employment association
  - A licensee who refers a client to a friend
  - A licensee who hires an unlicensed assistant
  - A licensee who works alone without any assistance
key: A
explanation: The rule defines an affiliate, in reference to licensure, as forming an employment or
  non-employment association with another licensed individual or entity for the purpose of providing
  a real estate service. The scenario matches this definition. Hiring an unlicensed assistant,
  referring a client to an unlicensed friend, or working independently do not meet the affiliate
  definition because they lack either the licensed party or the purpose of providing a real estate
  service together.
