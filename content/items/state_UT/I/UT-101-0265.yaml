  url: null
  quoted_text: "Associate broker means an individual who is: (a) employed or engaged as an independent
    contractor by or on behalf of a principal broker to perform an act described in Subsection (29)
    for valuable consideration; and (b) licensed or is required to be licensed under this chapter as
    an associate broker."
