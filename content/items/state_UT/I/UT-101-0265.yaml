stem: According to Utah Code Ann. § 61-2f-102(4), what must be true for an individual to be
  classified as an associate broker?
options:
  - The individual must be employed or engaged as an independent contractor by or on behalf of a
    principal broker to perform an act described in Subsection (29) for valuable consideration and
    be licensed or required to be licensed as an associate broker.
  - The individual must be employed or engaged as an independent contractor by or on behalf of a
    principal broker to perform an act described in Subsection (29) for valuable consideration, hold
    an active sales agent license, and be affiliated with a franchise.
  - The individual must be licensed as an associate broker, have at least five years' experience in
    the real estate business, and be employed by a principal broker to perform any real estate
    service for valuable consideration.
  - The individual must be employed or engaged as an independent contractor by or on behalf of a
    principal broker to perform an act described in Subsection (29) for valuable consideration, hold
    an active associate broker license, and be a member of the local Realtors association.
key: A
explanation: The correct statement requires that an associate broker be employed or engaged as an
  independent contractor by or on behalf of a principal broker to perform an act described in
  Subsection (29) for valuable consideration, and that the individual be licensed or required to be
  licensed as an associate broker. The other choices are incorrect because they either omit the
  licensing requirement, add unrelated conditions such as holding a sales‑agent license or franchise
  affiliation, or require membership in a Realtors association, none of which are part of the
  statutory definition.
citation:
