stem: A licensee intends to represent both the buyer and seller in the same transaction as a limited
  agent. Under Utah Admin. Code R162-2f-102, what must the licensee obtain before proceeding?
options:
  - Written authorization obtained from the seller only to allow a licensee to act as a limited agent
  - Written authorization obtained from both principals to allow a licensee to act as a dual agent
  - Written authorization obtained from both principals to a single transaction to allow a licensee
    to act as a limited agent
  - Written authorization obtained from the buyer only to allow a licensee to act as a limited agent
key: C
explanation: Under Utah Admin. Code R162-2f-102, informed consent is defined as written
  authorization from both principals for a single transaction that permits the licensee to act as a
  limited agent. Therefore, before representing both parties as a limited agent, the licensee must
  obtain written authorization from both the buyer and seller for that single transaction. Options
  that require authorization from only one party or that refer to dual agency do not satisfy this
  requirement.
