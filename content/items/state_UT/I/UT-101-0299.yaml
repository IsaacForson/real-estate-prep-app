stem: Under Utah Code Ann. § 61-2f-102(3), how is the term 'Advertising' or 'advertise' defined?
options:
  - It means placing or directing the placement of an advertisement.
  - It means promoting the availability of real estate for sale or lease.
  - It means offering specific types of brokerage services to the public.
  - It means soliciting the public to contact a licensee for more information.
key: A
explanation: The statute defines "Advertising" or "advertise" as placing or directing the placement
  of an advertisement. The other options describe components of an advertisement itself, not the act
  of advertising.
