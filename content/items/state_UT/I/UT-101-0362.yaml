  - Two units
  - One unit
  - Three units
key: A
explanation: The definition states that residential property consists of a single-family one- to
  four-unit dwelling, so the maximum allowable units are four. The distractor "Three units" is
  incorrect because the definition permits up to four units, not limited to three.
