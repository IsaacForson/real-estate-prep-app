stem: Under Utah Code Ann. § 61-2f-102(5), how is a 'branch broker' defined?
options:
  - An individual who is an associate broker who independently operates a principal broker's branch
    office without supervision.
  - An individual who is a sales agent who assists a principal broker with client marketing duties.
  - An individual who is an associate broker who manages a principal broker's branch office under
    the supervision of the principal broker.
  - An individual who is a principal broker who oversees multiple branch offices within the same
    county.
key: C
explanation: The statute defines a branch broker as an associate broker who manages a principal
  broker's branch office under the supervision of the principal broker. The option stating that a
  branch broker is a sales agent who assists a principal broker with client marketing duties
  incorrectly removes the supervision requirement, which contradicts the definition.
