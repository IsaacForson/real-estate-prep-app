stem: According to Utah Admin. Code R162-2f-102, which of the following is explicitly included in
  the definition of 'Brokerage record'?
options:
  - Records of advertising campaigns
  - Trust account records
  - Personal tax returns of the broker
  - Lists of prospective buyers
key: B
explanation: The definition of brokerage record explicitly lists trust account records as one of the
  categories a principal broker must maintain. The other options are not mentioned in that
  definition. Therefore, trust account records is the correct choice.
