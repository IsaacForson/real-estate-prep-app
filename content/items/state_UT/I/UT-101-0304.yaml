stem: A brokerage fails to maintain records of all trust fund transactions for the period required
  by commission rules. Which statutory provision authorizes the Real Estate Commission to establish
  rules addressing this failure?
options:
  - The certification and conduct of real estate schools
  - Proper handling of money received by a licensee
  - Brokerage office procedures and recordkeeping requirements
  - The qualification and designation of an acting principal broker
key: C
explanation: The failure to keep trust fund records implicates brokerage office procedures and
  recordkeeping requirements, which the commission must regulate under subsection (vii). The other
  options address licensing, money handling, and commission qualifications, none of which directly
  govern recordkeeping.
