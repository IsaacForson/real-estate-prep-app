stem: "After a closing, a principal broker gives a buyer a bottle of wine to thank the buyer for
  using the brokerage’s services. Under Utah Admin. Code R162-2f-102, this gesture is classified
  as:"
options:
  - A principal broker who gives a lender a thank-you card
  - A principal broker who gives a buyer a bottle of wine after closing as appreciation
  - A principal broker who gives a coworker a holiday present
  - A principal broker who gives a buyer a gift to encourage using the brokerage
key: B
explanation: The rule defines a closing gift as any gift given by a principal broker, or a licensee
  affiliated with the principal broker, to a buyer or seller, lessor or lessee, in appreciation for
  having used the services of a real estate brokerage. The bottle of wine given after closing as
  appreciation fits this definition. Giving a gift to encourage use is an inducement gift, giving a
  coworker a present is not tied to a transaction, and giving a lender a card is not to a buyer or
  seller in appreciation.
