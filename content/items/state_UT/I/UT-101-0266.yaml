stem: A commissioner has just completed their second consecutive four-year term. What is true about
  their eligibility for reappointment?
options:
  - The commissioner may serve an unlimited number of consecutive terms as long as each term is four
    years.
  - The commissioner may not be appointed to another consecutive term but may serve again after a
    break.
  - The commissioner must wait at least two years before being eligible for any reappointment.
  - The commissioner may be appointed to a third consecutive term without restriction.
key: B
explanation: Under Utah Code Ann. § 61-2f-103(5)(d), a commission member may not serve more than two
  consecutive terms. Therefore, after serving two consecutive terms, the commissioner cannot be
  appointed to another consecutive term but may serve again after a break. The option stating that
  the commissioner may be appointed to a third consecutive term without restriction is incorrect
  because it would allow more than two consecutive terms.
