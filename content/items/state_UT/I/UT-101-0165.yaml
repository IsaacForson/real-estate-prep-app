stem: A member of the Utah Real Estate Commission resigns effective immediately. According to Utah
  Code Ann. § 61-2f-103(6), what must the governor do to fill the vacancy?
options:
  - Appoint a replacement who will serve the unexpired term, subject to Senate advice and consent
  - Appoint a replacement after the remaining commission members submit a nominee for the governor’s
    consideration
  - Appoint a replacement following a special election conducted among all licensed brokers in the
    state
  - Appoint a replacement who will serve a full four‑year term beginning the next July 1, as
    required for new appointments
key: A
explanation: Utah Code Ann. § 61‑2f‑103(6) requires the governor, with the Senate’s advice and
  consent, to appoint a replacement who will serve only the remainder of the unexpired term.
  Consequently, the option stating that the governor appoints a replacement who will serve the
  unexpired term, subject to Senate advice and consent, is correct. The option suggesting the
  governor must wait for commission members to submit a nominee is not provided for by the statute.
  The option describing a special election among all licensed brokers is also not authorized. The
  option that the appointee serves a full four‑year term beginning the next July 1 applies only to
  new appointments, not to filling a vacancy.
