stem: A consumer requests a list of all licensed real estate sales agents from the division.
  According to Utah Code Ann. § 61-2f-104, what must the consumer do?
options:
  - The consumer must receive the list free of charge from the division.
  - The consumer must pay the costs incurred by the division to make the list available.
  - The consumer must submit a written request to the division to obtain the list.
  - The consumer must hold an active real estate license to request the list.
key: B
explanation: Subsection (2) of § 61-2f-104 requires any person who requests a list to pay the costs
  incurred by the division to make the list available. Thus the consumer must pay those costs. The
  option stating that the consumer must submit a written request to the division to obtain the list
  is incorrect because the statute does not require the request to be in writing; it only requires
  payment of costs.
