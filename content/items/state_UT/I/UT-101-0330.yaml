stem: "A licensee keeps a copy of a duplicate deposit slip for earnest money funds received from a
  buyer. Under the definition of 'Brokerage record' in Utah Admin. Code R162-2f-102, this duplicate
  deposit slip is considered:"
options:
  - A deposit record
  - A conveyance record
  - An agency agreement
  - A licensing record
key: A
explanation: The definition defines deposit records as duplicate deposit slips, deposit advice, or
  equivalent documents. A conveyance record involves check images or wire transfer verifications.
  Licensing records and independent contractor agreements are separate categories. Hence, the
  duplicate deposit slip is a deposit record.
