stem: A consumer requests the division to provide a list of all licensed real estate sales agents in
  Utah. Under Utah Code Ann. § 61-2f-104(2), what must the consumer do?
options:
  - They must wait thirty days for the list to be prepared.
  - They must be a licensed real estate broker to receive the list.
  - They must pay the costs incurred by the division to make the list available.
  - They must provide a written request to the commission.
key: C
explanation: Under §61-2f-104(2), anyone who requests a list of licensees must pay the division's
  costs for providing that list. The rule does not impose a waiting period, require the requester to
  be a broker, or direct the request to the commission. Therefore, the consumer must cover the
  incurred expenses.
