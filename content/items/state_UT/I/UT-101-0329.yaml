stem: "A licensee receives an earnest money deposit via wire transfer and retains the wire transfer
  verification as proof. According to the definition of 'Brokerage record' in Utah Admin. Code
  R162-2f-102, this wire transfer verification is classified as:"
options:
  - A licensing record
  - A deposit record
  - A conveyance record
  - An advertising record
key: C
explanation: The definition specifies that conveyance records include wire transfer verification as
  an example. A deposit record refers to a duplicate deposit slip, not a wire transfer. Licensing
  and advertising records are unrelated to this scenario. Therefore, the wire transfer verification
  is a conveyance record.
