stem: A principal broker gives a prospective buyer a gift card before the buyer signs a purchase
  agreement, hoping to encourage the buyer to choose their brokerage. Under Utah Admin. Code
  R162-2f-102, how is this gift classified?
options:
  - The promotional item considered advertising under the rule
  - The branch office expense unrelated to client gifts
  - The closing gift given in appreciation for services already rendered
  - The inducement gift given as an incentive to use the brokerage’s services
key: D
explanation: Under Utah Admin. Code R162-2f-102, an inducement gift is any gift given by a principal
  broker (or an affiliated licensee) to a buyer or seller as an incentive to use the brokerage’s
  services. The scenario describes a gift card given before the buyer signs a purchase agreement to
  encourage choosing that brokerage, which matches this definition. Therefore the option describing
  an inducement gift given as an incentive to use the brokerage’s services is correct. The option
  describing a promotional item considered advertising is incorrect because the gift is not
  advertising. The option describing a branch office expense unrelated to client gifts is incorrect
  because the gift is a client gift, not an office expense. The option describing a closing gift
  given in appreciation for services already rendered is incorrect because the gift is given before
  any services are rendered, not after.
