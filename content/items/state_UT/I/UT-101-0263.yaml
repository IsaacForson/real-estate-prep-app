stem: A sales agent stops working with a broker and does not conduct real estate activities, but
  keeps their license current. Under Utah Admin. Code R162-2f-102, how is this license classified?
options:
  - An active license
  - An inactive license
  - An expired license
  - A suspended license
key: B
explanation: An inactive license is defined as a license that may not be used to conduct the
  business of real estate because the license holder is not affiliated with a principal broker, even
  if the license is otherwise current. The scenario describes a licensee not affiliated with a
  broker and not conducting real estate activities, matching this definition. An expired license, by
  contrast, refers to a license not renewed by the statutory deadline, which is a different concept.
