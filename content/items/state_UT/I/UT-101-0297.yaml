stem: Under Utah Admin. Code R162-2f-102, how is a 'closing gift' defined?
options:
  - Any gift given as an incentive to use the services
  - Any gift given in appreciation for having used the services
  - Any gift given to a third party service provider
  - Any gift given to a licensee for continuing education
key: B
explanation: Utah Admin. Code R162-2f-102 defines a closing gift as any gift given by a principal
  broker or an affiliated licensee to a buyer, seller, lessor, or lessee in appreciation for having
  used the brokerage’s services. This matches the option stating 'Any gift given in appreciation for
  having used the services'. The option stating 'Any gift given as an incentive to use the services'
  describes an inducement gift, which is given to encourage use of services rather than as
  appreciation after services have been rendered.
