stem: Only two commission members are present at a scheduled meeting. According to Utah Code Ann.
  § 61-2f‑103(9), what action can the commission take regarding business?
options:
  - The commission may proceed with voting because a simple majority of those present is sufficient.
  - The commission must adjourn the meeting until at least three members are present.
  - The commission can conduct business if the director authorizes the meeting.
  - The commission may issue informal recommendations but cannot take formal action.
key: B
explanation: Section 61‑2f‑103(9) provides that three members of the commission constitute a quorum
  for the transaction of business. With only two members present, a quorum does not exist, so the
  commission must adjourn the meeting until at least three members are present. Consequently, the
  statement that the commission must adjourn the meeting until at least three members are present is
  the correct answer. A statement that the commission may proceed with voting because a simple
  majority of those present is sufficient is incorrect because a quorum, not a simple majority, is
  required. Likewise, the ideas that the director can authorize the meeting or that only informal
  recommendations may be issued are not supported by the statute.
