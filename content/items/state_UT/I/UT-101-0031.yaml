stem: Under Utah Code Ann. § 61-2f-102, how is an 'associate broker' defined?
options:
  - An individual who is employed or engaged as an independent contractor by or on behalf of a
    principal broker to perform an act described in Subsection (29) for valuable consideration, and
    licensed or required to be licensed under this chapter as an associate broker.
  - An individual who is employed or engaged as an independent contractor by or on behalf of a
    principal broker to perform an act described in Subsection (29) for valuable consideration, and
    licensed as a sales agent under this chapter.
  - An individual who is employed or engaged as an independent contractor by or on behalf of a
    principal broker to perform an act described in Subsection (29) for valuable consideration, but
    not required to be licensed under this chapter.
  - An individual who is employed or engaged as an independent contractor by or on behalf of a
    principal broker to perform an act described in Subsection (29) for valuable consideration, and
    licensed as a principal broker under this chapter.
key: A
explanation: The statute defines an associate broker as someone employed or engaged as an
  independent contractor by a principal broker to perform an act described in Subsection (29) for
  valuable consideration and who is licensed or required to be licensed as an associate broker. The
  distractor that mentions a sales agent license incorrectly substitutes the license type, while the
  definition requires associate broker licensure.
