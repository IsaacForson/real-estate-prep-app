stem: Under Utah Code Ann. § 61-2f-103(2)(vi), what subject must the Real Estate Commission make
  rules concerning?
options:
  - The certification and conduct of real estate schools
  - The qualification and designation of an acting principal broker
  - Proper handling of money received by a licensee
  - Brokerage office procedures and recordkeeping requirements
key: C
explanation: "Subsection (vi) explicitly directs the commission to make rules for the proper
  handling of money received by a licensee under this chapter. The other options correspond to
  different subsections: (i) licensing, (vii) brokerage office procedures and recordkeeping, and
  (xii) inducement or closing gifts."
