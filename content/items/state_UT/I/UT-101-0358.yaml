stem: "A licensee prepares two purchase agreements for the same property: one shows the true price
  to the lender, while a second agreement with a higher price is kept secret from the lender. Under
  Utah Admin. Code R162-2f-102, how is this conduct classified?"
options:
  - Double contract agreement
  - Inducement gift certificate
  - Guaranteed sales plan
  - Limited agency arrangement
key: A
explanation: The definition of 'double contract' in R162-2f-102(17) expressly covers executing two
  or more purchase agreements where one is not disclosed to the prospective lender or loan funding
  entity, which matches the licensee’s conduct. The inducement gift certificate distractor describes
  a gift intended to incentivize a client, not a concealed contract, so it does not apply.
citation:
  source: "### Utah Admin. Code R162-2f (Real Estate Licensing and Practices Rules) — Utah
