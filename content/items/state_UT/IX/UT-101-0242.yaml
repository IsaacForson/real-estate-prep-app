stem: Which of the following actions constitutes commingling of trust funds under Utah Code Ann. §
  61-2f-401(4)(b)?
options:
  - Depositing earnest money into a separate escrow account
  - Using trust funds to pay personal expenses
  - Holding earnest money in a non-interest-bearing account
  - Returning earnest money to the buyer after contract termination
key: B
explanation: Subsection (4)(b) defines commingling as mixing trust funds with the licensee's own
  money, which is exactly what using trust funds to pay personal expenses does. Depositing earnest
  money into a separate escrow account is proper handling, holding funds in a non-interest-bearing
  account is permissible, and returning earnest money after termination is an appropriate
  disposition of funds.
