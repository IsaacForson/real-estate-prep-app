stem: A licensee has just completed a purchase agreement for a buyer client, with all parties
  signing. According to Utah Admin. Code R162-2f-401a, what must the licensee do next regarding the
  signed agreement?
options:
  - Retaining the signed agreement only in the brokerage's file
  - Sending the signed agreement to the Utah Division of Real Estate
  - Filing the signed agreement with the county recorder's office
  - Providing a copy of the signed agreement to the buyer client
key: D
explanation: The rule requires licensees to provide copies of a lease or purchase agreement,
  properly signed by each party, to the party for whom the licensee acts as an agent. Filing the
  agreement with the recorder is not mandated by this subsection; the duty is to deliver the copy to
  the client.
