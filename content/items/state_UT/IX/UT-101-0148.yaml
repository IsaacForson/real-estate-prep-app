stem: A licensee receives earnest money from a buyer during a real estate transaction. According to
  Utah Admin. Code R162-2f-401a, what must the licensee do with the money immediately?
options:
  - The licensee must immediately deliver money received in a real estate transaction to the
    principal broker for deposit
  - The licensee must hold money received in a real estate transaction in an escrow account until
    closing
  - The licensee must deposit money received in a real estate transaction into the licensee's
    personal trust account
  - The licensee must return money received in a real estate transaction to the buyer unless the
    seller authorizes retention
key: A
explanation: The rule requires immediate delivery of money received in a real estate transaction to
  the principal broker for deposit. Holding the money in escrow or a personal account, or returning
  it to the buyer, violates this requirement.
