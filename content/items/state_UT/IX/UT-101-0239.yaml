stem: Under Utah Code Ann. § 61-2f-401(10), what must a licensee disclose in writing in the
  purchase, sale, or rental of real estate?
options:
  - Disclosing the amount of earnest money received from the buyer before closing
  - Disclosing the brokerage name in advertisements placed by the licensee in Utah
  - Disclosing the licensee's agency relationship with the client in writing
  - Disclosing if the transaction is for the licensee or an undisclosed principal
key: D
explanation: Subsection (10) makes it grounds for disciplinary action to fail to disclose, in
  writing, whether the transaction is for the licensee or an undisclosed principal. Therefore the
  licensee must disclose that information. Disclosing the licensee's agency relationship is required
  elsewhere but not under this subsection.
