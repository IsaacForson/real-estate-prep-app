stem: According to Utah Admin. Code R162-2f-401a, which of the following is a licensee required to
  disclose in writing to clients, agents for other parties, and unrepresented parties before
  executing a binding purchase or lease agreement?
options:
  - The licensee must disclose the licensee's agency relationships
  - The licensee must disclose the licensee's continuing education hours
  - The licensee must disclose the licensee's preferred title company
  - The licensee must disclose the licensee's personal net worth
key: A
explanation: The rule requires disclosure of the licensee's agency relationships before a binding
  agreement is executed. The distractors pertain to personal financial details, education, or
  business preferences, which are not mandated disclosures under this subsection.
