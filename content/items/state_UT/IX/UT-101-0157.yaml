stem: A licensee first contacts another agent in a transaction to arrange a showing. According to
  Utah Admin. Code R162-2f-401a, what must the licensee disclose at that time?
options:
  - The licensee's agency relationship with the client.
  - The licensee's commission rate for the transaction.
  - The licensee's personal contact information.
  - The licensee's continuing education hours completed.
key: A
explanation: The rule states that upon initial contact with another agent in a transaction, the
  licensee must disclose the agency relationship between the licensee and the client. The other
  options are not required disclosures at that point.
