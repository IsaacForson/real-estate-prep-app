stem: "A principal broker pays a sales agent who is not affiliated with the principal broker at the
  time the sales agent earned the commission. Under Utah Code Ann. § 61-2f-401, this conduct is
  grounds for disciplinary action because:"
options:
  - Because the principal broker paid a sales agent who was not affiliated with the principal broker
    at the time the sales agent earned the compensation.
  - Because the principal broker failed to disclose in writing whether the transaction was for an
    undisclosed principal or for the broker's own account.
  - Because the principal broker commingled trust money received from a client with the broker's
    personal funds in the broker's business account.
  - Because the principal broker represented both the buyer and seller in the same transaction
    without obtaining their informed written consent.
key: A
explanation: The scenario matches subsection (6) of § 61-2f-401, which prohibits a principal broker
  from paying or offering to pay a sales agent or associate broker who is not affiliated with the
  principal broker at the time the compensation is earned. The distractor concerning failure to
  disclose an undisclosed principal is incorrect because the facts do not involve an undisclosed
  principal; they involve payment to an unaffiliated agent.
