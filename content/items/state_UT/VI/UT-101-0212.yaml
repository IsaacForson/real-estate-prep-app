stem: "A licensee places an online advertisement for a property that includes photographs and price
  but does not include the brokerage name or a clickable link to the brokerage’s website. Under Utah
  Code Ann. § 61-2f-401(12)(b), this conduct is:"
options:
  - The conduct is grounds for disciplinary action because the advertisement fails to include the
    brokerage name or a clickable link as required
  - The conduct is grounds for disciplinary action only if the advertisement is placed in a newspaper
  - The conduct is not grounds for disciplinary action because the licensee is not the principal
    broker
  - The conduct is not grounds for disciplinary action because the advertisement includes
    photographs and price
key: A
explanation: The key is correct because subsection 12(b) requires that an advertisement include the
  brokerage name or, if online, a clickable link to the brokerage’s website; omitting both violates
  the rule. The option stating that the conduct is not grounds for disciplinary action because the
  advertisement includes photographs and price is incorrect, as those details do not satisfy the
  brokerage identification requirement.
