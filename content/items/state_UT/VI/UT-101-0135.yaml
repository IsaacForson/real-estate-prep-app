    behind adminrules.utah.gov/public/rule/R162-2f/Current%20Rules) — § R162-2f-403 § R162-2f-102(2)
  url: null
  quoted_text: "'Advertising' means a commercial message through: (a) newspaper; (b) magazine; (c)
    Internet; (d) email; (e) radio; (f) television; (g) direct mail promotions; (h) business cards;
    (i) door hangers; (j) signs; (k) other electronic communication; or (l) any other medium."
