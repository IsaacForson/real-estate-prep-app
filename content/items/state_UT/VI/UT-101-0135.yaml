stem: Which of the following mediums is expressly included in the definition of 'Advertising' under
  Utah Admin. Code R162-2f-102(2)?
options:
  - A telemarketing call
  - A billboard advertisement
  - A word-of-mouth referral
  - A newspaper advertisement
key: D
explanation: The definition lists newspaper as one of the mediums through which advertising is a
  commercial message. Therefore, a newspaper advertisement is expressly included. A telemarketing
  call is not listed in the definition's enumerated mediums.
citation:
