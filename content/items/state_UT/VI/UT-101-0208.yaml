stem: Which of the following correctly states the two conditions under Utah Code Ann. §
  61-2f-402(5)(a) for when the division must commence an adjudicative proceeding?
options:
  - "The division must commence an adjudicative proceeding no later than: two years after the
    violation is reported to the division; or five years after the violation is reported to the
    division."
  - "The division must commence an adjudicative proceeding no later than: one year after the
    violation is reported to the division; or the date the brokerage is no longer required to keep
    and maintain records."
  - "The division must commence an adjudicative proceeding no later than: the date the brokerage is
    no longer required to keep and maintain records; or one year after the violation is reported to
    the division."
  - "The division must commence an adjudicative proceeding no later than: two years after the
    violation is reported to the division; or the date the brokerage is no longer required to keep
    and maintain records."
key: D
explanation: The statute requires the division to commence an adjudicative proceeding no later than
  the earlier of two years after the violation is reported or the date the brokerage is no longer
  required to keep and maintain records. The answer choice that states the two‑year period and the
  record‑keeping date matches this requirement. The choice that substitutes one year for the
  two‑year period does not satisfy the statute.
