stem: A licensee receives $5,000 as commission in consequence of a violation of the Utah Real Estate
  Licensing and Practices Act. Under Utah Code Ann. § 61-2f-405(2), what is the range of the
  additional penalty the licensee may be liable for?
options:
  - $5,000 to $15,000 dollars
  - $0 to $5,000 dollars
  - $15,000 to $20,000 dollars
  - $5,000 to $20,000 dollars
key: A
explanation: Under Utah Code Ann. § 61-2f-405(2), a licensee who receives money as a commission due
  to a violation is liable for an additional penalty of not less than the amount received and not
  more than three times that amount. For a $5,000 commission, the minimum penalty is $5,000 and the
  maximum is $15,000, giving a range of $5,000 to $15,000. The option stating a range of $0 to
  $5,000 is incorrect because it allows a minimum penalty of zero, which violates the 'not less
  than' requirement.
citation:
  source: Utah Code Ann. ch. 61-2f (Real Estate Licensing and Practices Act) — Utah Code Title 61,
    Chapter 2f — Real Estate Licensing and Practices Act (current version), official Utah
    Legislature PDF read via Internet Archive capture of 2025-09-14 because le.utah.gov refuses
    connections from this network — § 61-2f-405 61-2f-405(2)
  url: null
  quoted_text: If a person receives money or its equivalent, as commission, compensation, or profit by
    or in consequence of a violation of this chapter, that person is liable for an additional
    penalty of not less than the amount of the money received and not more than three times the
    amount of money received, as may be determined by the court.
  secondary: []
math:
  worked_solution: >-
    Step 1: Identify the amount received as commission: $5,000.

    Step 2: Calculate the minimum additional penalty: not less than the amount received → $5,000.

    Step 3: Calculate the maximum additional penalty: not more than three times the amount received
    → $5,000 × 3 = $15,000.

    Step 4: State the range: $5,000 to $15,000.
  formulas:
    - Minimum penalty = amount received
    - Maximum penalty = amount received × 3
