stem: Which of the following is expressly listed as grounds for disciplinary action under Utah Code
  Ann. § 61-2f-401?
options:
  - The licensee charges a competitive commission rate for services rendered to clients
  - The licensee provides a home warranty to a buyer at the closing of the transaction
  - The licensee makes a substantial misrepresentation in a licensure statement to a client
  - The licensee completes continuing education requirements every two years as required annually
key: C
explanation: Subsection (1)(a) expressly lists making a substantial misrepresentation, including in
  a licensure statement, as grounds for disciplinary action. Charging a competitive commission rate
  is not prohibited; it is a permissible business practice.
