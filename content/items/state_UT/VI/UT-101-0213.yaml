stem: "A licensee represents both the buyer and the seller in a residential purchase transaction but
  does not obtain their informed written consent to act for both parties. Under Utah Code Ann. §
  61-2f-401(2), this conduct is grounds for disciplinary action because:"
options:
  - it constitutes a substantial misrepresentation in a licensure statement.
  - it constitutes acting for more than one party in a transaction without the informed written
    consent of the parties.
  - it constitutes representing a principal broker other than the one with whom the licensee is
    affiliated.
  - it constitutes failing to account for or remit money that belongs to another.
key: B
explanation: The statute provides that acting for more than one party in a transaction without the
  informed written consent of the parties is grounds for disciplinary action. The scenario describes
  a licensee representing both buyer and seller without obtaining their informed written consent,
  which matches that prohibited conduct. The other options describe unrelated violations
  (misrepresentation, representing a different principal broker, failing to account for money) that
  are not supported by the facts.
