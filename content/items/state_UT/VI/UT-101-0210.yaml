stem: Under Utah Code Ann. § 61-2f-401(3)(c), which of the following actions is expressly listed as
  grounds for disciplinary action?
options:
  - The licensee representing as sales agent or having a contractual relationship similar to that of
    sales agent with a person other than a principal broker
  - The licensee acting as an associate broker or sales agent while not affiliated with a principal
    broker
  - The licensee representing or attempting to represent a principal broker other than the principal
    broker with whom the person is affiliated
  - The licensee acting for more than one party in a transaction without the informed written
    consent of the parties
key: A
explanation: The key is correct because subsection 3(c) expressly lists representing as a sales
  agent or having a similar contractual relationship with someone other than the principal broker as
  grounds for disciplinary action. The most tempting distractor describes acting as an associate
  broker or sales agent while not affiliated with a principal broker, which is grounds under
  subsection 3(a) but not under 3(c).
