stem: "A licensee acts as buyer's agent but is actually purchasing the property for himself and does
  not disclose this in writing. Under Utah Code Ann. § 61-2f-401(10), this conduct is grounds for
  disciplinary action because:"
options:
  - It constitutes advertising the availability of real estate in a false, misleading, or deceptive
    manner.
  - It constitutes a failure to disclose in writing whether the transaction is made for an
    undisclosed principal.
  - It constitutes a failure to furnish a copy of a document to the parties before and after
    execution.
  - It constitutes a failure to keep and make available transaction records for inspection.
key: B
explanation: Section 61-2f-401(10) mandates written disclosure of whether a transaction is for an
  undisclosed principal; failing to do so is grounds for discipline. The other options relate to
  furnishing documents, maintaining records, or deceptive advertising, which are addressed
  elsewhere.
