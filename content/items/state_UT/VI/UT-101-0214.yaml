stem: "A licensee prepares a purchase agreement for a buyer and seller but does not give either
  party a copy of the agreement before they sign it. Under Utah Code Ann. § 61-2f-401(8), this
  conduct is grounds for disciplinary action because:"
options:
  - it constitutes failing to voluntarily furnish a copy of a document to the parties before and
    after the execution of a document.
  - it constitutes commingling money described in Subsection (4)(a) with the licensee's own money.
  - it constitutes paying valuable consideration to a person not licensed under this chapter.
  - it constitutes failing to disclose, in writing, whether the purchase, sale, or rental is made
    for that person or for an undisclosed principal.
key: A
explanation: Utah Code Ann. § 61‑2f‑401(8) makes it disciplinary conduct to fail to voluntarily give
  each party a copy of a document both before and after it is signed. The answer that states the
  conduct “constitutes failing to voluntarily furnish a copy of a document to the parties before and
  after the execution of a document” directly reflects that requirement. The other answer choices
  describe different prohibited conduct—commingling the licensee’s money with client funds,
  providing valuable consideration to an unlicensed person, and not disclosing in writing whether a
  transaction is for the licensee or an undisclosed principal—which are covered by other subsections
  but not by subsection (8).
