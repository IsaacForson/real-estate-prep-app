stem: "A licensee receives an earnest money deposit and holds it for 60 days without accounting for
  or remitting the funds upon request. Under Utah Code Ann. § 61-2f-401, this conduct is grounds for
  disciplinary action because:"
options:
  - The licensee fails to account for or remit another's money promptly
  - The licensee charges a flat fee for brokerage services rendered to clients
  - The licensee provides a copy of the purchase agreement before signing
  - The licensee deposits earnest money into an escrow account promptly
key: A
explanation: Subsection (4)(a) provides that failing, within a reasonable time, to account for or to
  remit money that belongs to another and comes into the person's possession is grounds for
  disciplinary action. Depositing earnest money promptly is permissible; providing a copy of the
  agreement is not a violation; charging a flat fee is allowed.
