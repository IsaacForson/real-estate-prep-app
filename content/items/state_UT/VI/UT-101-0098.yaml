stem: "A double contract is defined as:"
options:
  - Executing two or more purchase agreements, both disclosed to the prospective lender or loan
    funding entity in the transaction
  - Executing two or more purchase agreements, one of which is not made known to the prospective
    lender or loan funding entity
  - Providing a verbal agreement to purchase property without written documentation, relying solely
    on oral representations
  - Executing a single purchase agreement with undisclosed terms to the prospective lender,
    intending to conceal the true price
key: B
explanation: Under Utah Admin. Code R162-2f-102(17), a double contract occurs when two or more
  purchase agreements are executed and at least one of those agreements is not disclosed to the
  prospective lender or loan funding entity. The option describing two or more agreements where one
  is undisclosed matches this definition, whereas the option describing both agreements as disclosed
  does not, because it fails the requirement that at least one agreement remains undisclosed.
