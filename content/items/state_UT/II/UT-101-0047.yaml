stem: A principal broker wants to renew their license and is not subject to ongoing criminal history
  monitoring. Under Utah Code Ann. § 61-2f-204, what must the broker submit at the time of filing
  the renewal application?
options:
  - The broker must submit fingerprint cards acceptable to the Department of Public Safety only.
  - The broker must submit a signed waiver acknowledging FBI Rap Back registration only.
  - The broker must submit fingerprint cards, a signed waiver, consent to a background check, and
    payment of the division's fee.
  - The broker must submit only payment of the division's fee for the background check.
key: C
explanation: For renewal, applicants who are not already subject to ongoing criminal history
  monitoring must submit fingerprint cards acceptable to the Department of Public Safety, a signed
  waiver acknowledging FBI Rap Back registration, consent to a fingerprint background check, and pay
  the division's fee. The correct option includes all four of these requirements. The other options
  each leave out at least one required item.
citation:
  source: Utah Code Ann. ch. 61-2f (Real Estate Licensing and Practices Act) — Utah Code Title 61,
    Chapter 2f — Real Estate Licensing and Practices Act (current version), official Utah
    Legislature PDF read via Internet Archive capture of 2025-09-14 because le.utah.gov refuses
    connections from this network — § 61-2f-204 § 61-2f-204(2)(f)
  url: null
  quoted_text: "(f) Each applicant for renewal or reinstatement of a license to practice as a sales
    agent, principal broker, associate broker, or a property manager, who is not already subject to
    ongoing monitoring of the individual's criminal history shall, at the time the application for
    renewal or reinstatement is filed: (i) submit fingerprint cards in a form acceptable to the
    Department of Public Safety; (ii) submit to the division a signed waiver in accordance with
    Subsection 53-10-108(4), acknowledging the registration of the applicant's fingerprints in the
    Federal Bureau of Investigation Next Generation Identification System's Rap Back Service; (iii)
    consent to a fingerprint background check by the Utah Bureau of Criminal Identification and the
    Federal Bureau of Investigation; and (iv) pay the fee the division establishes in accordance
    with Subsection (1)(d)(iv)."
