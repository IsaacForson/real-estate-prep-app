stem: A principal broker dies, and the brokerage does not appoint a replacement principal broker
  within the timeframe set by Utah Admin. Code R162-2f-202e. What may the division do to the
  brokerage's registration?
options:
  - Inactivate the brokerage's registration
  - Automatically transfer the registration to a licensee
  - Suspend every affiliated licensee's individual license
  - Revoke the registration without any further process
key: A
explanation: The rule allows the division to inactivate the registration of a real estate brokerage
  if it fails to replace its principal broker within 14 days of the broker's death or incapacity.
citation:
  source: Utah Admin. Code § R162-2f-202e
  url: null
  quoted_text: The division may inactivate the registration of a real estate brokerage if, upon the
    death or in capacity of its principal broker, the real estate brokerage fails to replace the
    principal broker within 14 days.
