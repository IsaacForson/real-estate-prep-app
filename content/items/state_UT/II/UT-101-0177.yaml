stem: An applicant is currently on parole for a conviction of aggravated assault, which includes an
  element of violence. Under Utah Admin. Code R162-2f-201, what must the applicant provide to
  complete the application?
options:
  - The applicant must submit documentation from two licensed, division‑approved therapists stating
    they do not pose an ongoing threat to the public.
  - The applicant must submit a letter from the parole officer confirming good conduct and
    compliance.
  - The applicant must submit a sworn affidavit of rehabilitation signed by a supervising judge.
  - The applicant must submit a copy of the parole agreement and a certificate of completed anger
    management training.
key: A
explanation: Subsection (b)(i) requires an applicant on probation or parole for a violent crime to
  submit current documentation from two licensed, division‑approved therapists stating they do not
  pose an ongoing threat to the public. Therefore, the applicant must provide that therapist
  documentation. The distractor suggesting a parole officer letter is insufficient because the rule
  specifically mandates therapist review.
citation:
  source: Utah Admin. Code R162-2f (Real Estate Licensing and Practices Rules) — Utah Administrative
    Code R162-2f — Real Estate Licensing and Practices Rules (current rule, effective Aug. 16,
