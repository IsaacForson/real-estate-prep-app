    behind adminrules.utah.gov/public/rule/R162-2f/Current%20Rules) — § R162-2f-201(b)(i)
  url: null
  quoted_text: (b)(i) An applicant who, as of the date of application, is serving probation or parole
    for a crime that contains an element of violence or physical coercion shall, to submit a
    complete application, provide for the commission's review current documentation from two
    licensed therapists, approved by the division, stating that the applicant does not pose an
    ongoing threat to the public.
