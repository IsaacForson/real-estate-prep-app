stem: An attorney licensed to practice law in Utah negotiates a real estate purchase contract solely
  while representing a client in a legal matter. Under Utah Code Ann. § 61-2f-202, is a real estate
  license required for this conduct?
options:
  - No, because the attorney is performing the duties of an attorney
  - No, because the transaction involves a family member of the attorney
  - Yes, because negotiating a contract requires a real estate license
  - Yes, because the exemption applies solely to court-appointed roles
key: A
explanation: The statute exempts services rendered by an attorney admitted to practice law in Utah
  while performing the attorney's duties as an attorney from the licensing requirement.
