stem: A principal broker wants to use a temporary exhibit booth at a trade show for 14 months to
  market listings. Under Utah Admin. Code R162-2f-205(2)(c), what must the broker do?
options:
  - Obtain a special marketing permit from the division
  - No registration needed because it's a temporary site
  - Register the booth as a branch office
  - Notify the division after 12 months of use
key: C
explanation: The rule allows use of a temporary site for 12 months or less without branch office
  registration. Since 14 months exceeds that limit, the broker must register the booth as a branch
  office.
