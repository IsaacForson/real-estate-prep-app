stem: A real estate school’s certification expired eight months ago and has not been renewed.
  According to Utah Admin. Code R162-2f-206a(4)(e), what must the school do to offer courses again?
options:
  - The school must submit a renewal application and pay the reinstatement fee.
  - The school must submit a new application for certification.
  - The school must submit a renewal application and pay the renewal fee.
  - The school must submit a renewal application and pay the late fee.
key: B
explanation: The rule provides that a certification expired for more than six months cannot be
  reinstated; the school must apply as a new applicant. Therefore, after eight months, renewal or
  reinstatement is not permissible. The distractor suggesting a renewal application with a
  reinstatement fee is wrong because reinstatement is only allowed within six months of expiration.
