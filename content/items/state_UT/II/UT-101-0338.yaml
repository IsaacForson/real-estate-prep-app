stem: Under Utah Admin. Code R162-2f-205(6), how long after a violation of the registration
  requirements may the division bring an enforcement action?
options:
  - Up to 2 years after the violation
  - Up to 3 years after the violation
  - Up to 4 years after the violation
  - Up to 5 years after the violation
key: C
explanation: The rule explicitly states that the division may not bring an enforcement action after
  the expiration of four years following the violation. Therefore, the maximum allowable period is
  four years. The distractor of five years is incorrect because it exceeds the statutory limit and
  would permit enforcement beyond the prohibited timeframe.
