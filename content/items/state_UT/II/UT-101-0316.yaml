stem: A licensee representing a buyer learns that the buyer cannot secure financing, a known
  material fact concerning the client's ability to perform. The licensee discloses this fact to the
  seller without the buyer's permission. Is this permitted under Utah Admin. Code R162-2f-401a?
options:
  - Not permitted, because the licensee must obtain the buyer's permission before disclosing any
    information
  - Permitted, but only if the licensee also discloses a known defect in the property
  - Not permitted, because the licensee must first inform the principal broker
  - Permitted, as the confidentiality duty excludes known material facts concerning the client's
    ability to perform
key: D
explanation: The rule exempts known material facts concerning the client's ability to perform from
  the confidentiality duty, allowing disclosure without permission. The most tempting distractor
  incorrectly asserts that permission is always required, ignoring the statutory exception.
