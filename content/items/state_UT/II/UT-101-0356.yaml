stem: A licensee receives a buyer's earnest money deposit via a duplicate deposit slip. According to
  Utah Admin. Code R162-2f-102(7)(f), which trust account record must be maintained?
options:
  - Conveyance records in the form of a deposit advice
  - Conveyance records in the form of a duplicate deposit slip
  - Deposit records in the form of a duplicate deposit slip
  - Deposit records in the form of a wire transfer verification
key: C
explanation: The rule requires that deposit records be kept in the form of a duplicate deposit slip,
  deposit advice, or equivalent document. Since the deposit was made via a duplicate deposit slip,
  that specific record must be retained. Conveyance records are not required for a deposit
  transaction.
