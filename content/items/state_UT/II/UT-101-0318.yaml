stem: A real estate school plans to begin a traditional prelicensing course on August 10. According
  to Utah Admin. Code R162-2f-206b(1), by what date must the school submit the certification
  application to the division?
options:
  - July 11
  - August 9
  - July 10
  - July 9
key: A
explanation: The rule requires submission no later than 30 days before the course start date.
  Counting back 30 days from August 10 gives July 11, which is the latest permissible date. The July
  10 option incorrectly assumes an earlier deadline is required.
