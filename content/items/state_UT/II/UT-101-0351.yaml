stem: Maria Lopez, who holds an active associate broker license in Nevada, applies for a Utah
  associate broker license. What may the division require regarding her prelicensing education under
  Utah Code Ann. § 61-2f-203?
options:
  - Completion of the 120‑hour division‑approved educational program for in‑state applicants
  - Providing proof of continuing education from the applicant’s home state jurisdiction
  - Completion of a division‑approved, state‑specific educational program with hours set by
    commission rule
  - Passing the Utah state‑specific examination instead of completing the required education
key: C
explanation: Subsection (1)(d)(ii)(B) allows the division to require an out‑of‑state broker to
  complete a division‑approved, state‑specific educational program consisting of hours designated by
  commission rule. The distractor 'Completion of the 120‑hour division‑approved educational program
  for in‑state applicants' is incorrect because the rule does not mandate the full 120‑hour program
  for applicants already licensed in another state.
