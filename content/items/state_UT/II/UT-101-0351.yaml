  url: null
  quoted_text: If on the day on which an applicant for an associate broker or a principal broker
    license applies for the license the applicant is licensed as a real estate broker in another
    state, the division may require the applicant to complete a division-approved, state-specific
    educational program consisting of the number of hours designated by rule the commission makes in
    accordance with Title 63G, Chapter 3, Utah Administrative Rulemaking Act, with the concurrence
    of the division.
