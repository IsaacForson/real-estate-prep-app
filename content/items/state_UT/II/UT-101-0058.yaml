stem: A licensee plans to teach a virtual-live continuing education course with 75 students. How
  many non‑instructor monitoring assistants must be present to satisfy Utah Admin. Code R162-2f-205?
options:
  - Three non-instructor monitoring assistants
  - One non-instructor monitoring assistant
  - Two non-instructor monitoring assistants
  - Four non-instructor monitoring assistants
key: C
explanation: For a class size between 51 and 100 students, the rule requires at least two
  non‑instructor monitoring assistants. The distractor "One non-instructor monitoring assistant"
  applies only to classes of 1‑50 students and is therefore insufficient for 75 students.
