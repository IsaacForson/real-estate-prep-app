    download behind adminrules.utah.gov/public/rule/R162-2f/Current%20Rules) — § R162-2f-202e(7)(a)"
  url: null
  quoted_text: "An acting principal broker may not: (a) agree to represent new clients; or (b)
    continue the business activities of the brokerage for more than four months after the occurrence
    of the death or incapacity of the principal broker."
