stem: A principal broker dies, and the brokerage designates an acting principal broker under Utah
  Admin. Code R162-2f-202e. Four months later, the acting broker attempts to sign a new listing
  agreement with a buyer. Is this permitted?
options:
  - Yes, provided the acting broker first notifies the division.
  - No, because an acting principal broker may not agree to represent new clients.
  - No, because the acting broker must close all pending transactions first.
  - Yes, because the acting broker may continue business activities for up to four months.
key: B
explanation: Rule R162-2f-202e(7)(a) explicitly prohibits an acting principal broker from agreeing
  to represent new clients. The four‑month limit in (7)(b) refers to continuing existing business
  activities, not taking new clients.
citation:
  source: "### Utah Admin. Code R162-2f (Real Estate Licensing and Practices Rules) — Utah
    Administrative Code R162-2f — Real Estate Licensing and Practices Rules (current rule, effective
