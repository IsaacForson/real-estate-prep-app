stem: A principal broker's license has lapsed into inactive status. Under Utah Code Ann. §
  61-2f-201, what must occur before that broker may conduct a real estate transaction again?
options:
  - The broker must complete new prelicensing education
  - The broker's license must be activated with the division
  - The broker must affiliate with another active principal broker
  - The broker must retake the licensing examination
key: B
explanation: The statute provides that an inactive principal broker may not conduct a real estate
  transaction until the broker's license is activated with the division.
