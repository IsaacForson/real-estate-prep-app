stem: Under Utah Code Ann. § 61-2f-201(1), what is the legal status of a person who engages in the
  business of a principal broker without a license?
options:
  - Unlawful activity
  - Lawful activity
  - Permitted activity
  - Exempt activity
key: A
explanation: The statute declares that unless a person is licensed under this chapter, it is
  unlawful for the person to engage in the business of a principal broker. Therefore, conducting
  such activity without a license is unlawful. The distractor "Lawful activity" is incorrect because
  the statute provides no exception that makes unlicensed principal broker activity lawful.
