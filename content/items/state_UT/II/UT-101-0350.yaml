stem: Juan Martinez, who has a prior felony conviction, applies for a Utah sales agent license. The
  division reviews his criminal history and denies his application. What may Juan Martinez do next
  under Utah Code Ann. § 61-2f-203?
options:
  - Submission of additional education hours to the division
  - Petition to the commission for de novo review
  - Waiting twelve months before reapplying
  - Request for agency review by the executive director
key: B
explanation: Under subsection (1)(a)(ii), if the division denies a license based on criminal
  history, the applicant may petition the commission for de novo review. The distractor 'Request for
  agency review by the executive director' is incorrect because such review is only available after
  the commission has reviewed the division's denial under a delegated authority scenario, which does
  not apply here.
