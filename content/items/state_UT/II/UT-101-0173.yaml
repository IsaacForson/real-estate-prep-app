stem: An applicant for a sales agent license was convicted of a class A misdemeanor for theft two
  years ago and served a jail sentence that ended six months ago. Under Utah Admin. Code
  R162-2f-201, how may the division treat this conviction when evaluating honesty, integrity,
  truthfulness, and reputation?
options:
  - The conviction may be considered as evidence of dishonesty and could lead to denial or a
    restricted license.
  - The conviction is automatically disqualifying and requires a five-year waiting period before
    reapplication.
  - The conviction only matters if the applicant is currently serving a jail sentence.
  - The conviction is irrelevant because it is classified as a misdemeanor rather than a felony.
key: A
explanation: R162-2f-201(1)(a) permits the division to deny a license or issue a restricted license
  when past incidents reflect negatively on an applicant’s honesty, integrity, truthfulness, or
  reputation. The rule also directs consideration of recent misdemeanor convictions involving theft
  or dishonest conduct. Therefore, the theft conviction can be treated as evidence of dishonesty and
  may result in denial or a restricted license, but the rule does not impose an automatic bar.
