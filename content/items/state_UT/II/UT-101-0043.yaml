stem: A sales agent's license expired 50 days ago. The licensee has not completed any continuing
  education since expiration. Under Utah Code Ann. § 61-2f-204, in addition to paying the renewal
  fee and late fee, what must the licensee provide to the division to have the license reinstated?
options:
  - The licensee must provide proof of completing 18 hours of continuing education within the past
    two years.
  - The licensee must provide proof of demonstrated competence as determined by the division.
  - The licensee must provide either proof of completing the required continuing education or proof
    of demonstrated competence.
  - The licensee must provide no additional proof; only the fees are required.
key: C
explanation: Under Utah Code Ann. § 61-2f-204, after the 30‑day grace period and up to one year
  after expiration, a license may be reinstated by paying the renewal and late fees and providing
  proof either that the required continuing education hours have been completed or that the licensee
  has demonstrated competence as determined by the division. Therefore, the correct response is the
  one that allows either proof of completed continuing education or proof of demonstrated
  competence. A response that requires only proof of continuing education is insufficient because
  demonstrating competence is an equally valid alternative.
