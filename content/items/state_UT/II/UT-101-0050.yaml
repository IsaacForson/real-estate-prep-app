stem: A licensee who is currently licensed as a sales agent in another state applies for a Utah
  sales agent license. Under Utah Code Ann. § 61-2f-203(1)(d)(i)(B), what may the division require
  regarding education?
options:
  - Completion of a division-approved, state-specific educational program of hours designated by
    commission rule
  - Completion of the standard 120-hour prelicensing course required for new Utah sales agents
  - Completion of a division-approved, state-specific educational program of 120 hours
  - Completion of a division-approved, state-specific educational program of 24 hours
key: A
explanation: Utah Code Ann. § 61‑2f‑203(1)(d)(i)(B) permits the division to require a state‑specific
  educational program whose required hours are set by a rule adopted by the commission. Therefore
  the correct answer is the option that states the hours are designated by commission rule. The
  alternatives that fix the program at 120 hours, at 24 hours, or that refer to the standard
  prelicensing course are not supported by the statute for out‑of‑state applicants.
citation:
  source: Utah Code Ann. ch. 61-2f (Real Estate Licensing and Practices Act) — Utah Code Title 61,
    Chapter 2f — Real Estate Licensing and Practices Act (current version), official Utah
    Legislature PDF read via Internet Archive capture of 2025-09-14 because le.utah.gov refuses
    connections from this network — § 61-2f-203(1)(d)(i)(B)
  url: null
  quoted_text: (B) If on the day on which an applicant for a sales agent license applies for the
    license the applicant is licensed as a real estate sales agent in another state, the division
    may require the applicant to complete a division-approved, state-specific educational program
    consisting of the number of hours designated by rule the commission makes in accordance with
    Title 63G, Chapter 3, Utah Administrative Rulemaking Act, with the concurrence of the division.
