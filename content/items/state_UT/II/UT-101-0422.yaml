stem: A sales agent’s license expired and went inactive eight months ago. The licensee has not taken
  the licensing exam since expiration but has completed 18 hours of continuing education within the
  past two years. Under Utah Code Ann. § 61-2f-204(3)(a)(ii), what may the licensee provide to the
  division to reactivate the license?
options:
  - A letter from the principal broker confirming the licensee’s intent to affiliate.
  - A signed waiver authorizing the division to share fingerprint data with the FBI.
  - Proof of passing the state and national components of the licensing exam within the last six
    months.
  - Proof of completing the continuing education hours that would have been required if the license
    had remained active.
key: D
explanation: Subsection (3)(a)(ii) explicitly allows reactivation via proof of completing the
  continuing education hours that would have been required had the license stayed active. The other
  options either describe alternative paths not permitted under this provision or unrelated
  requirements.
