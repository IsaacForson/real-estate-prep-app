stem: "A licensee posts on a social media platform a statement that simply identifies them as being
  engaged in the profession of real estate, without promoting any property, offering brokerage
  services, or soliciting the public to contact them. Under Utah Code Ann. § 61-2f-102(2)(b), this
  post is:"
options:
  - Requires prior approval from the division
  - Must include a disclaimer about licensing
  - Considered an advertisement under the statute
  - Not considered an advertisement under the statute
key: D
explanation: The statute expressly excludes from the definition of advertisement any social media
  post that merely identifies the person as engaged in the real estate profession without promoting
  property, offering services, or soliciting contact. The distractor claiming the post is considered
  an advertisement is incorrect because it lacks the promotional elements required to constitute an
  advertisement under the definition.
