stem: A licensee receives funds via wire transfer for a closing. According to Utah Admin. Code
  R162-2f-102(7)(f), which trust account record must be maintained?
options:
  - Deposit records in the form of a duplicate deposit slip
  - Conveyance records in the form of a wire transfer verification
  - Both deposit records and conveyance records
  - Neither deposit records nor conveyance records
key: B
explanation: The rule specifies that conveyance records must be kept in the form of a check image,
  wire transfer verification, or equivalent document. A wire transfer triggers the need for a
  conveyance record verifying the transfer. Deposit records are not required for this type of
  transaction.
