  - 12 hours of training
  - 24 hours of training
  - 120 hours of training
key: C
explanation: The rule states that the division‑created property manager program must require at
  least 24 hours of training. Therefore, 24 hours is the minimum required. The distractor of 120
  hours applies to sales agent and broker licenses, not property manager licenses.
