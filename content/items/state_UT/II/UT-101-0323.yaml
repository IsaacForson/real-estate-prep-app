stem: Under Utah Code Ann. § 61-2f-201(2)(a), an individual must be licensed as a principal broker,
  associate broker, or sales agent if they perform, offer to perform, or attempt to perform which
  act for valuable consideration?
options:
  - Buying, selling, or exchanging real estate for another person
  - Offering to buy, sell, or exchange real estate for another person
  - Managing real estate property for a single employer on a daily basis
  - Providing clerical assistance to a licensed broker on a daily basis
key: A
explanation: The statute explicitly lists buying, selling, or exchanging real estate for another
  person as an act that triggers the licensing requirement under subsection (2)(a). The distractor
  offering to buy, sell, or exchange real estate for another person is incorrect because that act is
  covered under subsection (2)(b), not subsection (2)(a).
