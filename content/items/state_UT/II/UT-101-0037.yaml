stem: Which of the following does **NOT** satisfy the minimum education requirement for licensure as
  a sales agent under Utah Admin. Code R162-2f-201?
options:
  - A high school diploma from an accredited institution issued by the state
  - A GED certificate issued by the state and recognized by the commission
  - Equivalent education as approved by the commission from a recognized authority
  - A private real estate school certificate not approved by the commission
key: D
explanation: The rule lists a high school diploma, a GED, or equivalent education approved by the
  commission as meeting the minimum education requirement; a private real estate school certificate
  not approved by the commission does not satisfy any of these criteria.
