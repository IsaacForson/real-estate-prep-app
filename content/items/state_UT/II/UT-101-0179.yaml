stem: An applicant for a sales agent license fails to disclose a prior misdemeanor on the
  application. The division's criminal background check reveals the undisclosed conviction. Under
  Utah Code Ann. § 61-2f-204(1)(e)(ii), what must the division do?
options:
  - Place a condition on the license
  - Review the application
  - Revoke the license
  - Place a restriction on the license
key: B
explanation: The statute states that if a criminal background check discloses that an applicant
  fails to accurately disclose a criminal history, the division shall review the application. The
  other actions—placing a condition, restriction, or revoking the license—are permissive, not
  required, and therefore incorrect as the mandatory step.
