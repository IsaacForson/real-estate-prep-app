stem: A principal broker dies and the brokerage designates an individual as acting principal broker
  under Utah Code Ann. § 61-2f-202(1)(a)(vii). Which action may the acting principal broker lawfully
  perform with respect to transactions pending on the day of the principal broker's death?
options:
  - Sign new listing agreements with buyers and sellers
  - Advertise as the principal broker to prospective clients
  - Distribute compensation for each pending transaction
  - Manage property for the brokerage's rental portfolio
key: C
explanation: The statute permits an acting principal broker to distribute compensation for each
  transaction pending on the day the principal broker dies, becomes incapacitated, or becomes unable
  to perform duties. The distractor suggesting the acting broker may sign new listing agreements is
  incorrect because the exemption applies only to pending transactions, not new business.
