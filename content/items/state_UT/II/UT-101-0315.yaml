stem: A licensee representing a seller learns that the roof leaks, a known material defect. The
  licensee discloses this defect to a prospective buyer without obtaining the seller's permission.
  Is this permitted under Utah Admin. Code R162-2f-401a?
options:
  - Not permitted, because the licensee must first inform the principal broker
  - Permitted, but only if the licensee also discloses the client's ability to perform
  - Not permitted, because the licensee must obtain the seller's permission before disclosing any
    information
  - Permitted, as the confidentiality duty excludes known material facts concerning property defects
key: D
explanation: The confidentiality duty excludes known material facts concerning defects, so
  disclosure without permission is allowed. The most tempting distractor claims permission is
  required, but the rule expressly exempts such defects from the confidentiality obligation.
