stem: Under Utah Code Ann. § 61-2f-204(1)(e)(ii), what must an applicant do regarding criminal
  history on the license application?
options:
  - Accurately disclose any criminal history
  - Provide a signed waiver for FBI Rap Back Service
  - Submit fingerprint cards with the application
  - Pay the division's fee for licensing
key: A
explanation: The statute states that if a criminal background check discloses that an applicant
  fails to accurately disclose a criminal history, the division may take action. Therefore,
  applicants must accurately disclose any criminal history on the application. The other options
  describe separate requirements (fingerprint cards, fee, waiver) but do not address the disclosure
  obligation.
