stem: A principal broker in Utah wishes to advertise and conduct real estate transactions under the
  assumed name 'Utah Elite Realty' without registering that name with the division. Under Utah
  Admin. Code R162-2f-205(1), what is required?
options:
  - The broker may proceed because assumed names are exempt from registration.
  - The broker must register the assumed name with the division before engaging in any activity.
  - The broker may operate under the assumed name only if it is also registered as a branch office.
  - The broker may use the assumed name only for property management activities.
key: B
explanation: Under Utah Admin. Code R162-2f-205(1), a principal broker must register an assumed name
  with the division before engaging in any real estate activity under that name. Therefore, the
  broker may not advertise or conduct transactions using 'Utah Elite Realty' until the assumed name
  is registered. The claim that assumed names are exempt from registration is incorrect; the rule
  provides no exemption for assumed names.
