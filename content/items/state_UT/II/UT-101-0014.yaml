stem: A regular salaried employee of a real estate owner manages the owner's rental property without
  a license. Under Utah Code Ann. § 61-2f-202, this exemption is limited by which condition?
options:
  - The employee reports annually to the division about the work
  - The employee needs a separate property manager certificate
  - The employee may not charge a management fee for the work
  - The employee may manage real estate for a single employer
key: D
explanation: The exemption for a regular salaried employee who manages an owner's real estate
  applies because the employee may manage real estate for only one employer.
