stem: A licensee who is not licensed under Utah law posts on a social media platform a flyer
  promoting a specific house for sale and includes their phone number for interested buyers to call.
  Under Utah Code Ann. § 61-2f-201(1)(c), is this conduct lawful?
options:
  - It is lawful because the post is on social media and not considered advertising.
  - It is lawful because the licensee is not receiving compensation for the post.
  - It is unlawful only if the licensee also engages in property management.
  - It is unlawful because it constitutes advertising without a license.
key: D
explanation: Under Utah Code Ann. § 61-2f-201(1)(c), advertising without a license is unlawful. The
  flyer promotes availability of real estate, which meets the statutory definition of advertising,
  so conducting it without a license is unlawful. The claim that the post is not advertising because
  it appears on social media is incorrect because the post promotes a specific property, thus it is
  considered advertising under the statute. The lack of compensation does not exempt the licensee
  from the licensing requirement, and engaging in property management does not change the fact that
  unlicensed advertising is prohibited.
