stem: Under Utah Admin. Code R162-2f-201(2), what is the maximum number of partial experience points
  a broker applicant may receive for documented agency agreements?
options:
  - Up to fifteen partial experience points
  - Up to thirty partial experience points
  - Up to forty-five partial experience points
  - Up to sixty partial experience points
key: A
explanation: The rule explicitly allows a broker applicant to receive partial experience points for
  up to 15 of the 60 required points when agency agreements are documented. Therefore, fifteen is
  the maximum permissible. The option suggesting thirty points exceeds the limit set by the rule and
  is not supported by the text.
citation:
  source: Utah Admin. Code R162-2f (Real Estate Licensing and Practices Rules) — Utah Administrative
    Code R162-2f — Real Estate Licensing and Practices Rules (current rule, effective Aug. 16,
