    behind adminrules.utah.gov/public/rule/R162-2f/Current%20Rules) — § R162-2f-201
  url: null
  quoted_text: A broker applicant may receive partial experience points for up to 15 of the 60
    required experience points if the applicant can successfully document from signed agency
    agreements or purchase contracts that the applicant created or confirmed their agency with the
    clients they represented.
