stem: Under Utah Code Ann. § 61-2f-404, what is the default maximum civil penalty per violation when
  the victim is **NOT** 65 years old or older and the licensee derived no gain exceeding $5,000 from
  the violation?
options:
  - $5,000 per violation
  - $7,500 per violation
  - $10,000 per violation
  - $12,500 per violation
key: A
explanation: Under Utah Code Ann. § 61-2f-404(1)(a)(ii)(A), the default maximum civil penalty is
  $5,000 per violation when there are no aggravating factors such as the victim being 65 years or
  older or the licensee gaining more than $5,000 from the violation. Since the stem specifies the
  victim is NOT 65 or older and the gain does not exceed $5,000, no aggravating factors apply, so
  the penalty is $5,000 per violation.
