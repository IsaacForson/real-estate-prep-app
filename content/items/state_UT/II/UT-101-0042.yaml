stem: Under Utah Admin. Code R162-2f-102, what does the term 'Active license' mean?
options:
  - A license granted to an applicant who qualifies for licensure under Section 61-2f-203 and this
    rule, pays applicable nonrefundable license fees, and affiliates with a principal brokerage.
  - A license granted to an applicant who qualifies for licensure under Section 61-2f-203 and this
    rule, pays applicable nonrefundable license fees, but does not affiliate with a principal
    brokerage.
  - A license granted to an applicant who qualifies for licensure under Section 61-2f-203 and this
    rule, does not pay applicable nonrefundable license fees, and affiliates with a principal
    brokerage.
  - A license granted to an applicant who qualifies for licensure under Section 61-2f-203 and this
    rule, pays applicable nonrefundable license fees, and affiliates with a principal brokerage only
    after completing continuing education.
key: A
explanation: An active license requires the applicant to qualify for licensure, pay the applicable
  nonrefundable license fees, and affiliate with a principal brokerage (Utah Admin. Code
  R162-2f-102).
