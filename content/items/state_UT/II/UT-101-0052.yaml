stem: Which of the following locations may be used to conduct real estate business without being
  registered as a branch office under Utah Admin. Code R162-2f-205(2)?
options:
  - A model home location
  - A permanent office location
  - A leased office space
  - A virtual office address
key: A
explanation: The rule lists a model home as a location that may be used without branch office
  registration; a permanent office location, leased office space, and virtual office address are not
  among the exemptions and therefore require registration as a branch office.
