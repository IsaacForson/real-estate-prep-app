stem: What is the maximum length of time a facility may be established as a temporary site for
  marketing activity without being required to register as a branch office under Utah Admin. Code
  R162-2f-205(2)(c)?
options:
  - Six months
  - Nine months
  - Twelve months
  - Eighteen months
key: C
explanation: The rule states that a facility established for 12 months or less as a temporary site
  for marketing activity may be used without registration as a branch office. Therefore, the maximum
  allowable period is twelve months.
