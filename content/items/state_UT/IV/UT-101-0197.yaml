stem: Under Utah Admin. Code R162-2f-401c(1)(h)(ii), within how many business days must a principal
  broker deposit money received from a client or tenant in a property management transaction into a
  trust account?
options:
  - The broker must deposit the money within eight business days
  - The broker must deposit the money within six business days
  - The broker must deposit the money within four business days
  - The broker must deposit the money within three business days
key: D
explanation: The rule explicitly states that within three business days of receiving money from a
  client or tenant in a property management transaction, the money must be deposited into a trust
  account maintained by the principal broker or forwarded to the property owner's account. The other
  timeframes do not match this requirement.
