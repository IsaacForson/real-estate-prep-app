  quoted_text: (ii) within three business days of receiving money from a client or a tenant in a
    property management transaction, deposit the money into a trust account maintained by the
    principal broker pursuant to Section R162-2f-403 or forward or deposit client or tenant money
    into an account maintained by the property owner;
