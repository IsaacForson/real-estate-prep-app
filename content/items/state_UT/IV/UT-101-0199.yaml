stem: David, an attorney admitted to practice law in Utah, prepares a purchase agreement and
  represents a client in the closing of a residential real estate transaction. Under Utah Code Ann.
  § 61-2f-202(2)(b), which statement correctly describes David's licensing requirement for these
  activities?
options:
  - The activity is exempt only if David also holds a real estate license.
  - The activity is required because David receives compensation for the services.
  - The activity is exempt because David is performing attorney duties as an attorney.
  - The activity is required because David is involved in a real estate transaction.
key: C
explanation: Utah Code Ann. § 61-2f-202(2)(b) exempts services rendered by an attorney admitted to
  practice law in this state when performing the attorney's duties as an attorney, subject to other
  provisions. David's preparation of a purchase agreement and representation at closing are attorney
  duties, so he is exempt. The statement that the activity is required because David is involved in
  a real estate transaction is incorrect because involvement in a real estate transaction does not
  automatically trigger licensing when the attorney is acting within his professional role.
