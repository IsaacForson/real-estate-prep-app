stem: "Under Utah Code Ann. § 61-2f-202(1)(a)(v), a regular salaried employee of a condominium
  homeowners' association who manages the association's common-area real estate is:"
options:
  - Licensee is exempt from licensing requirements
  - Licensee must be licensed as a property manager
  - Licensee must be licensed as an associate broker
  - Licensee must hold a real estate license
key: A
explanation: The statute exempts a regular salaried employee of a common interest association who
  manages real estate subject to the declaration covenants, conditions, and restrictions that
  established the association from licensing requirements. Therefore, the employee described is
  exempt and does not need a real estate license. The distractor suggesting a license is required
  ignores this specific exemption.
