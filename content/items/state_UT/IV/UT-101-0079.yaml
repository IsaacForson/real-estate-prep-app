stem: "Under Utah Code Ann. § 61-2f-202(1)(a)(iii), a regular salaried employee of the owner of real
  estate who performs property management services with reference to real estate owned by the
  employer may do so without a license only if:"
options:
  - They may manage real estate for more than one employer.
  - They must be employed by a licensed property management firm.
  - They must also hold a sales agent license issued by the division.
  - They may manage real estate for no more than one employer.
key: D
explanation: Under Utah Code Ann. § 61-2f-202(1)(a)(iii), the exemption applies only to employees
  who manage real estate for a single employer. Therefore, the statement that they may manage real
  estate for no more than one employer is correct. Allowing management for more than one employer
  exceeds the exemption; requiring employment by a licensed property management firm adds a
  condition not found in the statute; and requiring a sales agent license also adds a condition that
  the statute does not impose.
