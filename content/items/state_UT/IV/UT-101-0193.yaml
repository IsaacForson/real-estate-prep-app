stem: A regional manager for a rental agency oversees multiple properties but does not engage in any
  property management acts such as leasing, rent collection, or maintenance coordination. Under Utah
  Code Ann. § 61-2f-202.5(5), is the regional manager required to hold a real estate license?
options:
  - The regional manager is not required to hold a real estate license because they work for a
    rental agency.
  - The regional manager is required to hold a real estate license because they are a regional
    manager.
  - The regional manager is not required to hold a real estate license because they do not engage in
    acts described in Subsection 61-2f-102(20).
  - The regional manager is required to hold a real estate license because they oversee properties.
key: C
explanation: The key is correct because subsection 61-2f-202.5(5) exempts regional managers of
  rental agencies who do not engage in acts described in Subsection 61-2f-102(20). The most tempting
  distractor, D, incorrectly assumes that employment at a rental agency alone confers exemption,
  whereas the exemption depends on not performing property management acts.
