stem: A regular salaried employee of a commercial office building owner manages the building's
  property and also receives a fee to manage a residential rental property owned by a different
  individual. Under Utah Code Ann. § 61-2f-202(1)(a)(iii), is a real estate license required for the
  employee's property management activities?
options:
  - Yes, because the employee manages real estate for more than one employer.
  - No, because the employee is a regular salaried employee of the owner.
  - Yes, because managing residential property requires a license.
  - No, because property management for a single employer is exempt.
key: A
explanation: The exemption under subsection (1)(a)(iii) allows managing real estate for only one
  employer; managing for another employer eliminates the exemption, requiring a license. Distractor
  B incorrectly focuses only on the employee's salaried status without considering the extra
  management.
