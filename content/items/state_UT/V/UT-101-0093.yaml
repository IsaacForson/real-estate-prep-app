math:
  worked_solution: "Step 1: Identify the permissible gift limit for an unsolicited referral:
    $250.\\nStep 2: Identify the gift amount received: $300.\\nStep 3: Compare the gift amount to
    the limit: $300 > $250.\\nStep 4: Calculate the excess: $300 - $250 = $50.\\nStep 5: Since the
    gift amount exceeds the limit, the gift is not permissible."
  formulas:
