stem: A licensee receives a $300 gift from an unlicensed individual who referred a prospect that
  resulted in a lease transaction. According to Utah Admin. Code R162-2f-401b, is this permissible?
options:
  - The gift is permissible because it is under the $250 limit for property management referrals.
  - The gift is not permissible because it exceeds the $250 limit for unsolicited referrals.
  - The gift is permissible because licensees may give any gift as appreciation for a referral.
  - The gift is not permissible because referral fees from unlicensed persons are prohibited.
key: B
explanation: The rule allows a gift of up to $250 for an unsolicited referral that results in a real
  estate transaction; any amount over that limit is prohibited. Since the gift is $300, it exceeds
  the permissible amount, making it impermissible. The claim that the gift is not permissible
  because referral fees from unlicensed persons are prohibited incorrectly applies the property
  management tenant compensation exception, which does not apply to an unlicensed referral source.
