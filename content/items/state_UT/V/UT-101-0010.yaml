stem: A seller signs an exclusive brokerage agreement with a principal broker. While that agreement
  is in effect and before any sale closes, Utah Code Ann. § 61-2f-308 requires the broker to do
  which of the following when an offer arrives from a buyer?
options:
  - Reject the offer because the price is below list price
  - Accept delivery of the offer and present it to the client
  - Withhold the offer entirely until the listing period expires
  - Renegotiate the offer terms without the client's input
key: B
explanation: The statute requires a principal broker under an exclusive brokerage agreement to
  accept delivery of and present offers and counteroffers to the client.
