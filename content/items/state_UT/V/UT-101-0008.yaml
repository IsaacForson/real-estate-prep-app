stem: A seller declines to tell a buyer that a prior occupant died of natural causes in the house
  years earlier. Under Utah Code Ann. § 57-1-37, what liability exposure do the seller and the
  seller's agent face for this non-disclosure?
options:
  - Liability under the statute for the owner alone
  - Liability under the statute for the agent alone
  - Liability under the statute for both the owner and the agent
  - No liability under the statute for either party
key: D
explanation: The statute states that neither an owner nor the owner's agent is liable for failing to
  disclose that a property is stigmatized, so no liability arises from that fact alone.
