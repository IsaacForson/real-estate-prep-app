stem: "A principal broker intends to assign half of the commission to a sales agent. Before doing
  so, the broker provides written instructions to the title insurance agent that identify the
  property, the broker and the sales agent, and state that the instructions may not be altered by
  anyone other than the broker. The broker fails to include the amount of compensation each will
  receive. Under Utah Admin. Code R162-2f-401c(1)(d), the broker's written instructions are:"
options:
  - sufficient because they include the required identification and prohibition against alteration
  - insufficient because they lack the designation of compensation amounts
  - unnecessary because compensation assignment does not require written instructions
  - valid only if the sales agent also signs the instructions
key: B
explanation: The rule requires written instructions to include a designation of the amount of
  compensation that will be received by both the principal broker and the sales agent or associate
  broker. Because the broker omitted the compensation amounts, the instructions are insufficient.
  The option stating that the instructions are sufficient because they include the required
  identification and prohibition against alteration is incorrect, as identification and alteration
  prohibition alone do not satisfy the rule.
