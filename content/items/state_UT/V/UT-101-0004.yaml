stem: A sales agent prepares two purchase agreements for the same transaction with different prices,
  and only one version is shown to the buyer's lender. Which prohibition under Utah Admin. Code
  R162-2f-401b has the agent violated?
options:
  - Placement of a sign without owner consent
  - Acceptance of a referral fee from a lender
  - Sale of a listed property outside the listing broker
  - Use or proposal of a double contract
key: D
explanation: The rule bars a licensee from using or proposing the use of a double contract, which
  describes preparing two versions of an agreement and withholding one from the lender.
