stem: A licensee commits a violation of Utah Code Ann. § 61-2f-401 against a property owner the
  licensee knew to be a vulnerable adult. Under Utah Code Ann. § 61-2f-404, the commission may
  impose an enhanced civil penalty of up to which amount for that violation?
options:
  - Five thousand dollars
  - Two thousand dollars
  - Ten thousand dollars
  - One thousand dollars
key: C
explanation: The statute allows a civil penalty of up to ten thousand dollars for each violation
  when the person knew or should have known the property owner was 65 or older or a vulnerable
  adult.
citation:
  source: Utah Code Ann. § 61-2f-404
  url: null
  quoted_text: |-
    $10,000 for each violation, if the person knew or should have known that the property
    owner was an individual 65 years old or older, or a vulnerable adult
