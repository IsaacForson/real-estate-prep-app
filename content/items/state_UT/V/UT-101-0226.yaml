stem: "A buyer's principal broker wants to obtain written authorization directly from a seller to
  contact that seller about a property. Under Utah Code Ann. § 61-2f-308(3)(c), the broker:"
options:
  - The buyer's principal broker may not solicit from the seller a written authorization described
    in Subsection (4)(a)(ii).
  - The buyer's principal broker may solicit from the seller a written authorization described in
    Subsection (4)(a)(ii).
  - The buyer's principal broker must obtain written authorization from the seller's principal
    broker before contacting the seller.
  - The buyer's principal broker may contact the seller directly to discuss items, provide blank
    forms, and negotiate terms without any authorization.
key: A
explanation: Under Utah Code Ann. § 61-2f-308(3)(c), a buyer’s principal broker may not solicit from
  a seller a written authorization described in Subsection (4)(a)(ii). The option stating that the
  broker may not solicit such authorization correctly reflects this prohibition. The option stating
  that the broker may solicit such authorization is incorrect because it contradicts the statute.
  The option requiring the broker to obtain written authorization from the seller’s principal broker
  adds a condition not found in the law. The option allowing the broker to contact the seller
  directly to discuss items, provide blank forms, and negotiate terms without any authorization is
  also incorrect because the statute forbids soliciting such authorization.
