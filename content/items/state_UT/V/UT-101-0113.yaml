stem: "A principal broker who represents a seller contacts an unrepresented buyer to discuss the
  sale and provides the buyer with a blank purchase agreement. Under Utah Code Ann. § 61-2f-308(5),
  this conduct:"
options:
  - This conduct creates a dual agency relationship with the buyer
  - This conduct requires written consent from both parties before proceeding
  - This conduct does not create an agency relationship with the buyer
  - This conduct violates the exclusive brokerage agreement
key: C
explanation: The statute expressly lists contacting an unrepresented buyer directly and providing
  blank forms as conduct that does not create an agency relationship with the buyer. Therefore, the
  described conduct does not create such a relationship.
citation:
  source: Utah Code Ann. ch. 61-2f (Real Estate Licensing and Practices Act) — Utah Code Title 61,
    Chapter 2f — Real Estate Licensing and Practices Act (current version), official Utah
    Legislature PDF read via Internet Archive capture of 2025-09-14 because le.utah.gov refuses
    connections from this network — § 61-2f-308
  url: null
  quoted_text: "(5) The following conduct by a principal broker who represents a seller does not
    create an agency relationship with a buyer unrepresented by a principal broker: (a) contacting
    the buyer directly to discuss items related to a real estate transaction between the seller and
    buyer; (b) providing the buyer with blank forms; or (c) negotiating the terms of a real estate
    transaction between the seller and the buyer."
