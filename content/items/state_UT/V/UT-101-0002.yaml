stem: A licensee will represent both the buyer and the seller in the same transaction as a limited
  agent. Before acting in that capacity, Utah Admin. Code R162-2f-401a requires the licensee to
  obtain a written acknowledgment from each party affirming a waiver of which right?
options:
  - Neutral treatment of both parties
  - Undivided loyalty from the licensee
  - Safekeeping of entrusted funds and property
  - Reasonable care from the licensee
key: B
explanation: The rule requires each party in a limited agency to acknowledge in writing that the
  party waives undivided loyalty, absolute confidentiality, and full disclosure from the licensee.
