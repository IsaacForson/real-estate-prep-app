stem: "A buyer submits a written request for a detailed transaction status statement 20 days after
  the offer was accepted. Under Utah Admin. Code R162-2f-401c(1)(b)(i), the principal broker must:"
options:
  - provide the statement immediately upon receiving the request
  - provide the statement at the next 30-day interval
  - provide the statement only if the seller also requests it
  - wait until 30 days after acceptance to provide the statement
key: A
explanation: The rule requires the detailed statement to be provided upon the earlier of 30 days
  after acceptance or a buyer or seller making a demand. Since the buyer's demand occurred earlier,
  the broker must provide the statement upon receiving the request. The option that says 'provide
  the statement immediately upon receiving the request' incorrectly assumes the 30‑day period must
  elapse first.
