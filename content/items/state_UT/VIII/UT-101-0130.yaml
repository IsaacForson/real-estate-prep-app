stem: A party holds a tax title to a parcel for four years, has paid all taxes each year, and no one
  else has occupied the land. Another party claims ownership through adverse possession, asserting
  five years of occupation without paying taxes. Under Utah law, what presumption applies regarding
  ownership?
options:
  - The tax title holder is presumed the owner by adverse possession.
  - The legal title holder is presumed the owner because tax title requires five years.
  - Neither party is presumed owner; the matter must be litigated.
  - The adverse possessor is presumed the owner because occupation exceeded four years.
key: A
explanation: Under Utah Code Ann. § 78B-2-209, a party who establishes prima facie evidence of
  ownership under a tax title held for four years prior to the commencement of an action is presumed
  to be the owner of the property by adverse possession. Therefore the tax title holder is presumed
  the owner. The adverse possessor's five‑year claim does not override this presumption, the legal
  title holder is not presumed owner, and the law does create a presumption.
citation:
  source: "### Utah Code Ann. ch. 78B-2 (Statutes of Limitations) — Utah Code Title 78B, Chapter 2 —
