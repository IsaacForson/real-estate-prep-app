  url: null
  quoted_text: This presumption may be rebutted if it appears that the owner of the legal title or his
    predecessor has actually occupied or been in possession of the property under the title or that
    the tax title owner and his predecessors have failed to pay all the taxes levied or assessed
    upon the property within the four-year period.
