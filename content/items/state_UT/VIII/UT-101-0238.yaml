stem: A party holds a tax title to a parcel for four years, has failed to pay taxes in the second
  year, and the legal title owner has actually occupied the property during the third year. Under
  Utah Code § 78B-2-209(2), what is the effect on the presumption that the tax title holder is the
  owner by adverse possession?
options:
  - The presumption is rebutted, so the tax title holder is not presumed the owner.
  - The presumption stands because the tax title holder held the title for the full four-year period.
  - The presumption shifts to the legal title owner because of their occupancy.
  - The presumption requires the tax title holder to pay back the missed taxes before it applies.
key: A
explanation: "Under Utah Code § 78B-2-209(2), a tax title holder is presumed to be the owner by
  adverse possession, but that presumption can be rebutted if either the legal title owner has
  actually occupied the property or the tax title holder has failed to pay all taxes assessed during
  the four‑year period. In this scenario, both conditions are present: the legal title owner
  occupied the property in the third year and the tax title holder did not pay taxes in the second
  year. Either one alone is enough to rebut the presumption, so the tax title holder is not presumed
  the owner. The option claiming the presumption stands because the holder held the title for the
  full four years ignores the rebuttal rules. The option saying the presumption shifts to the legal
  title owner misstates the effect; the presumption is simply rebutted, not transferred. The option
  requiring payment of back taxes before the presumption applies adds a condition not found in the
  statute."
