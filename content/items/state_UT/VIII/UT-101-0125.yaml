stem: Under Utah law, what is presumed about the person establishing legal title to real property in
  an action for recovery?
options:
  - That the person establishing legal title has been in possession of the property
  - That the person establishing legal title has paid all taxes on the property
  - That the person establishing legal title has occupied the property adversely
  - That the person establishing legal title has held tax title for four years
key: A
explanation: The statute presumes that the person establishing legal title has been in possession of
  the property (Utah Code § 78B-2-208(1)(a)). The other options describe requirements for adverse
  possession or tax title, which are not presumed in a recovery action.
