stem: Under Utah Code § 78B-2-209(1), what is presumed regarding the person establishing legal title
  to the property in an action for recovery or possession of real property?
options:
  - The person establishing legal title is presumed to have paid all property taxes for the
    statutory period.
  - The person establishing legal title is presumed to have been in possession of the property for
    at least seven years.
  - The person establishing legal title is presumed to have occupied the property adversely to the
    true owner.
  - The person establishing legal title is presumed to have been in possession of the property
    within the time required by law.
key: D
explanation: Under Utah Code § 78B-2-209(1), the person establishing legal title is presumed to have
  been in possession of the property within the time required by law. Options that mention a
  seven‑year period, payment of property taxes, or adverse occupation are not part of this
  presumption.
