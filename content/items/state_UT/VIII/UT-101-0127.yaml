stem: Under Utah law, which statement correctly describes the tax payment requirement for
  establishing adverse possession?
options:
  - The possessor is exempt from tax payment if the land is used for residential purposes.
  - The possessor must have paid all taxes levied on the land for the seven‑year period.
  - The possessor must have paid at least half of the taxes levied during the seven‑year period.
  - The possessor must have paid all taxes levied on the land for the five‑year period.
key: B
explanation: The statute requires that the possessor have paid all taxes levied on the land for the
  seven‑year period. Therefore the statement that the possessor must have paid all taxes levied on
  the land for the seven‑year period is correct. The other statements are incorrect because the law
  does not provide an exemption for residential use, does not require only half payment, and does
  not use a five‑year period.
