stem: A property owner files an action to recover land from a neighbor who has openly occupied the
  land for six years without the owner's permission. The owner has a deed and occasionally visits
  the property. Under Utah law, what is the effect of the neighbor's six-year occupancy on the
  presumption that the owner has been in possession?
options:
  - The neighbor must also pay property taxes for the six years to rebut the presumption.
  - The neighbor’s six-year occupancy is sufficient to rebut the presumption, so the neighbor
    prevails.
  - The owner’s occasional visits reset the adverse possession clock, requiring a new seven-year
    period.
  - The neighbor’s six-year occupancy is insufficient to rebut the presumption, so the owner
    prevails.
key: D
explanation: Under Utah Code § 78B-2-208(2), the presumption that the legal title holder has been in
  possession can be rebutted only by showing adverse possession for at least seven years before the
  action is filed. Because the neighbor’s occupancy lasted only six years, the statutory period is
  not satisfied, so the presumption stands and the owner prevails. The distractor claiming six years
  is sufficient ignores the seven‑year requirement.
