stem: A claimant has occupied a parcel openly and continuously for seven years but failed to pay
  property taxes for two of those years. Under Utah Code § 78B-2-214, what is the effect on the
  claimant’s adverse possession claim?
options:
  - The claim is invalid because taxes were not paid for the full seven‑year period
  - The claim is valid because the occupancy period meets the seven‑year requirement
  - The claim is invalid only if the occupancy was less than seven years
  - The claim is valid if the claimant pays back taxes before filing suit
key: A
explanation: The statute requires both continuous occupation for seven years and payment of all
  taxes levied on the land during that period. Failure to pay taxes for any year defeats the claim,
  so the claim is invalid. The option suggesting validity based solely on occupancy overlooks the
  tax‑payment requirement.
citation:
