stem: A person has openly occupied a piece of land for eight years but failed to pay property taxes
  for two of those years. Under Utah adverse possession statutes, what is the correct conclusion?
options:
  - Adverse possession may be established because possession exceeded seven years
  - Adverse possession may not be established because the period must be exactly seven years
  - Adverse possession may be established if the owner did not object
  - Adverse possession may not be established because taxes were not paid for the entire period
key: D
explanation: Under Utah law, to acquire title by adverse possession a person must occupy the land
  continuously for seven years and pay all property taxes assessed during that entire period. If
  taxes are unpaid for any portion of the time, the requirement is not satisfied and the claim
  fails, regardless of how long the possession lasted. See Utah Code § 78B-2-214.
citation:
  source: "### Utah Code Ann. ch. 78B-2 (Statutes of Limitations) — Utah Code Title 78B, Chapter 2 —
