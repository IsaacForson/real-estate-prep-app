stem: A tenant has occupied a rental property for four years without the landlord's consent. The
  landlord sues to recover possession. Under Utah Code § 78B-2-208, what is presumed about the
  tenant's occupation of the property?
options:
  - The occupation is presumed to be adverse to the landlord's title.
  - The occupation is presumed to be under and in subordination to the landlord's legal title.
  - The occupation is presumed to have been made with payment of all property taxes.
  - The occupation is presumed to have been continuous for seven years.
key: B
explanation: Under Utah Code § 78B-2-208, occupation is presumed to be under and in subordination to
  the legal title. This presumption stands unless the occupant shows adverse possession for at least
  seven years. The other options describe situations that are not presumed under this rule.
