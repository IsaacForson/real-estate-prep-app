stem: Under Utah Code § 78B-2-208, what is the minimum period of adverse possession required to
  rebut the presumption that the legal title holder has been in possession of the property?
options:
  - Five years of continuous adverse possession
  - Seven years of continuous adverse possession
  - Ten years of continuous adverse possession
  - Fifteen years of continuous adverse possession
key: B
explanation: The statute provides that the presumption of possession by the legal title holder may
  be rebutted only after a showing of adverse possession for at least seven years. Therefore a
  seven‑year period is required. The five‑year option reflects a common misconception about adverse
  possession periods in some jurisdictions, but Utah law expressly demands seven years.
