stem: Under Utah Code § 78B-2-208, what is presumed regarding the person establishing legal title to
  the property?
options:
  - That the person establishing legal title holds a tax title for four years
  - That the person establishing legal title has occupied the property adversely for at least seven
    years
  - That the person establishing legal title has paid all property taxes for the past seven years
  - That the person establishing legal title has been in possession of the property
key: D
explanation: The statute creates a presumption that the person who establishes legal title has been
  in possession of the property. This presumption stands unless rebutted by proof of seven years of
  adverse possession. The distractor about tax payment incorrectly imports a requirement from §
  78B-2-214, which is not part of the presumption in § 78B-2-208.
