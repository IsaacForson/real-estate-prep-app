stem: A claimant holds a tax title to a parcel for four years, has paid all taxes, but the legal
  title owner has resided on the property during that period. What is the effect on the claimant's
  adverse possession claim under Utah law?
options:
  - The claimant's claim is barred because tax title must be held for seven years
  - The claimant must also show continuous occupation for seven years
  - The claimant automatically gains title after four years
  - The claimant's presumption of ownership may be rebutted by the owner's actual occupation
key: D
explanation: Under Utah Code § 78B-2-209(2), a tax title held for four years creates a presumption
  of ownership by adverse possession, but this presumption may be rebutted if the legal title owner
  has actually occupied the property. The claimant does not automatically gain title, nor is the
  claim barred solely by the four‑year period.
