stem: A person has occupied a parcel openly for five years, then abandoned possession for eight
  months, then resumed occupancy for another three years. Under Utah law, can the person establish
  adverse possession?
options:
  - Adverse possession is established because total occupancy exceeds seven years.
  - Adverse possession is not established because the occupation was not continuous for seven years.
  - Adverse possession is established if the person pays back taxes for the abandonment period.
  - Adverse possession is not established because the legal title holder remained in possession.
key: B
explanation: According to Utah Code § 78B-2-214, adverse possession requires continuous occupation
  for seven years. An eight‑month abandonment breaks that continuity, so the claim cannot succeed
  regardless of total time or tax payment. The distractor asserting that total occupancy exceeding
  seven years is sufficient misstates the continuity requirement.
