    connections from this network — § 61-2f-502"
  url: null
  quoted_text: '"Civil judgment" means a judgment in a civil action that: (a) is awarded in an action
    brought against a real estate licensee on the basis of fraud, misrepresentation, or deceit in a
    real estate transaction; and (b) awards actual damages.'
