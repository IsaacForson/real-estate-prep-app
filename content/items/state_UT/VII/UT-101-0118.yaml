stem: According to Utah Code Ann. § 61-2f-502, what constitutes a 'civil judgment' for purposes of
  the Real Estate Education, Research, and Recovery Fund?
options:
  - It is a judgment awarded in a civil action against a real estate licensee for fraud,
    misrepresentation, or deceit that awards actual damages.
  - It is a judgment entered in a criminal case that orders the licensee to pay restitution to a
    victim of fraud.
  - It is any court order that requires a licensee to pay a monetary penalty to the state real
    estate commission.
  - It is a settlement agreement reached before trial that compensates a party for undisclosed
    property defects.
key: A
explanation: A civil judgment under Utah Code Ann. § 61-2f-502 is a judgment entered in a civil
  action against a real estate licensee based on fraud, misrepresentation, or deceit that awards
  actual damages. This matches the option describing such a judgment. The other options describe
  criminal restitution, a state penalty order, or a pre‑trial settlement, none of which fit the
  statutory definition.
citation:
  source: "### Utah Code Ann. ch. 61-2f (Real Estate Licensing and Practices Act) — Utah Code Title
