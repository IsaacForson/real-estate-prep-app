stem: A buyer obtains a final judgment against a sales agent for fraud in a real estate transaction.
  To be eligible to claim from the Real Estate Education, Research, and Recovery Fund, what must the
  buyer do within 10 business days of filing the civil action that led to the judgment?
options:
  - Serve the division with a copy of the verified petition, as required by procedural rules before
    proceeding.
  - File a verified petition in the court where the final judgment is entered, seeking to enforce
    the judgment against the licensee.
  - Obtain a writ of execution against the licensee's property to satisfy the judgment debt.
  - Send a signed notification to the division alleging fraud, misrepresentation, or deceit by the
    licensee.
key: D
explanation: The law requires that, within 10 business days of bringing the civil action, the
  claimant must send the division a signed notification alleging fraud, misrepresentation, or deceit
  by a real estate licensee. Filing a petition, serving the division, or obtaining a writ of
  execution occur later in the process.
citation:
  source: Utah Code Ann. § 61-2f-506(2)(a)
  url: null
  quoted_text: A person may not bring a claim against the fund for money owed under a civil judgment
    unless, within 10 business days of the day on which the person brings the civil action that
    results in the civil judgment, the person sends to the division a signed notification alleging
    fraud, misrepresentation, or deceit by a real estate licensee.
