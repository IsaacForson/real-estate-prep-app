math:
  worked_solution: "The judgment amount is $20,000. The statutory cap for a single transaction is
    $15,000. Since the judgment exceeds the cap, the fund may pay only the cap amount: $15,000."
  formulas:
    - Maximum payment = min(judgment amount, statutory cap)
