stem: A claimant obtains a final judgment for $20,000 in actual damages from a single real estate
  transaction involving fraud by a licensee. Assuming the fund has sufficient money, what is the
  maximum amount the fund may pay for that judgment?
options:
  - $25,000
  - $20,000
  - $50,000
  - $15,000
key: D
explanation: The fund's liability is limited to $15,000 for a single transaction per Utah Code Ann.
  § 61-2f-506(3)(c)(i). The $20,000 option incorrectly uses the judgment amount without applying the
  statutory cap.
citation:
  source: Utah Code Ann. ch. 61-2f (Real Estate Licensing and Practices Act) — Utah Code Title 61,
