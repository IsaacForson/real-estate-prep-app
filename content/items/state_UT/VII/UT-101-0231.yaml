stem: What does the term 'Fund' mean under Utah Code Ann. § 61-2f-502(4)?
options:
  - The Real Estate Recovery Fund established under Section 61-2f-501
  - The Real Estate Education Fund financed by license fees under Section 61-2f-505
  - The Real Estate Education, Research, and Recovery Fund created in Section 61-2f-503
  - The Real Estate Research Fund administered by the division under Section 61-2f-504
key: C
explanation: The statute defines the Fund as the Real Estate Education, Research, and Recovery Fund
  created in Section 61-2f-503. One incorrect option describes a recovery fund established under a
  different section, another describes only the education component financed by license fees, and
  another describes only the research component administered by the division. None of those match
  the full definition.
