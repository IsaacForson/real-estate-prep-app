stem: A person who helped a licensee conceal defects in a property obtains a final judgment against
  the licensee for fraud. To be eligible to claim from the Real Estate Education, Research, and
  Recovery Fund, which condition must the person satisfy?
options:
  - The claimant must have received a discharge in bankruptcy.
  - The claimant must not be complicit in the fraud, misrepresentation, or deceit.
  - The claimant must have collected the judgment from the debtor.
  - The claimant must be the spouse of the judgment debtor.
key: B
explanation: Under Utah Code Ann. § 61-2f-506(1)(c), a claimant must not be complicit in the fraud,
  misrepresentation, or deceit that is the basis of the claim. The distractor about a bankruptcy
  discharge is incorrect because eligibility requires the judgment not be discharged in bankruptcy,
  not that the claimant must have received a discharge.
