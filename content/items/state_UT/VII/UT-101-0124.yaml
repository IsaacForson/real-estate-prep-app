stem: A corporation that holds a real estate broker license obtains a final judgment for $30,000 in
  actual damages due to fraud by its licensed agent. Assuming the fund has sufficient money, what is
  the maximum amount the fund may pay for that judgment?
options:
  - "Maximum reimbursement amount: $0"
  - "Maximum reimbursement amount: $15,000"
  - "Maximum reimbursement amount: $30,000"
  - "Maximum reimbursement amount: $50,000"
key: A
explanation: Under Utah Code Ann. § 61-2f-503, the real estate recovery fund reimburses only damages
  caused by individual licensees; it may not pay for a final judgment against an entity. Therefore,
  the maximum reimbursement is $0.
