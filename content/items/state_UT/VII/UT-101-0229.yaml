stem: A claimant has obtained a final judgment against a licensee for fraud and wishes to settle the
  claim against the Real Estate Education, Research, and Recovery Fund. According to Utah Code Ann.
  § 61-2f-507(2), which two conditions must be met for the division to settle the claim?
options:
  - The division initiates a review proceeding and the claimant requests a settlement.
  - The claimant files a verified petition and serves a copy on the division.
  - The claimant requests a settlement and the court approves the settlement.
  - The claimant is not complicit in the fraud and the judgment is not discharged in bankruptcy.
key: C
explanation: The statute permits the division to settle a claim against the fund only when the
  claimant asks for a settlement and the court that has the petition approves that settlement. The
  option stating that the division initiates a review proceeding and the claimant requests a
  settlement does not satisfy both requirements, so it is incorrect.
citation:
  source: Utah Code Ann. ch. 61-2f (Real Estate Licensing and Practices Act) — Utah Code Title 61,
    Chapter 2f — Real Estate Licensing and Practices Act (current version), official Utah
    Legislature PDF read via Internet Archive capture of 2025-09-14 because le.utah.gov refuses
    connections from this network — § 61-2f-507
  url: null
  quoted_text: "The division may settle a claim against the fund if: (a) the person who brings the
    claim requests a settlement; and (b) the court in which the petition is filed approves the
    settlement."
