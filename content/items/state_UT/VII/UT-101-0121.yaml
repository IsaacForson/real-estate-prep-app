stem: Under the Real Estate Education, Research, and Recovery Fund Act, a buyer obtains a final
  judgment for $18,000 in actual damages against a real estate brokerage (an LLC) for fraud in a
  transaction. Assuming the fund has sufficient money, what is the correct statement about the
  fund's ability to pay?
options:
  - The fund may pay up to $15,000 because it limits payment per transaction.
  - The fund may pay up to $18,000 because it reimburses actual damages.
  - The fund may not pay because it cannot reimburse judgments against entities.
  - The fund may not pay because the judgment exceeds the fund's per-licensee cap of $50,000.
key: C
explanation: Under Utah Code § 61-2f-503, the fund may only reimburse damages caused by an
  individual licensee; reimbursement is prohibited for a final judgment against an entity.
  Therefore, despite the judgment amount, the fund cannot pay anything. Options that suggest the
  fund could pay up to a transaction- or claim-based limit are incorrect because they ignore the
  prohibition on reimbursing judgments against entities.
