stem: Under Hawaii Revised Statutes § 467-1, which of the following is explicitly included in the
  definition of 'real estate'?
options:
  - Leaseholds in real property
  - Personal property such as furniture
  - Stocks and bonds in a portfolio
  - Intellectual property rights
key: A
explanation: The statute defines real estate as including lands, improvements thereon, leaseholds,
  and all other interests in real property, so leaseholds are explicitly part of the definition.
  Personal property such as furniture is not included because the definition limits real estate to
  interests in real property, not movable goods.
