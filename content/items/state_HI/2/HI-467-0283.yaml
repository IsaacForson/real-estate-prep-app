stem: Under Hawaii Revised Statutes § 467-1, which of the following is **NOT** included in the
  definition of 'real estate'?
options:
  - Lands and mineral rights
  - Improvements thereon and fixtures
  - Leaseholds and easements
  - Personal property and chattels
key: D
explanation: The statute defines real estate as lands, improvements thereon, leaseholds, and all
  other interests in real property. Personal property is not an interest in real property and
  therefore falls outside this definition. The distractor that lists lands and mineral rights is
  incorrect because mineral rights are considered interests in real property and are thus included.
