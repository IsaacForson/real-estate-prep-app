stem: A property manager is employed by a cooperative corporation to oversee the building's
  day-to-day operations. Under Hawaii law, would this person qualify as a custodian?
options:
  - Yes, because they are employed by the cooperative to oversee operations.
  - No, because the cooperative corporation is not a single owner under the statute.
  - Yes, because they oversee day-to-day operations of real property.
  - No, because they do not lease or rent any real estate.
key: B
explanation: Haw. Rev. Stat. § 467-1 defines a custodian as an individual employed by a single
  owner. The statute explicitly provides that a single owner does not include an association of
  owners of a cooperative. Therefore, a property manager employed by a cooperative corporation is
  not employed by a single owner and does not meet the definition of a custodian. The option
  suggesting that overseeing operations qualifies the individual is incorrect because the employment
  relationship with a single owner is a prerequisite for the custodian definition.
