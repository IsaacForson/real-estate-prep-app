stem: A licensee is hired by a condominium association to manage the common elements and collect
  monthly maintenance fees. Under Hawaii law, is this individual considered a custodian?
options:
  - No, because the association is not considered a single owner under the statute.
  - Yes, because they have responsibility to manage or care for real property.
  - Yes, because they are employed by the association to manage property.
  - No, because they collect monthly maintenance fees from unit owners.
key: A
explanation: Hawaii law defines a custodian as an individual who, for compensation, is employed by a
  single owner and has responsibility to manage or care for the real property. The definition
  expressly excludes an association of condominium owners from the meaning of “single owner.”
  Because the licensee works for the condominium association, which is not a single owner, the
  individual does not satisfy the statutory custodian requirement. Thus the statement that the
  association is not considered a single owner is correct. The other choices are incorrect because
  employment alone or fee collection does not meet the single‑owner condition required by Haw. Rev.
  Stat. ch. 467 § 467‑1.
citation:
