stem: Under Hawaii Revised Statutes § 467-1, which of the following is a necessary condition for an
  individual to be classified as a custodian?
options:
  - The individual must be employed as an employee by a single owner.
  - The individual must own the real estate being managed.
  - The individual must hold a real estate broker license.
  - The individual must receive a fee based on the property's sale price.
key: A
explanation: Hawaii Revised Statutes § 467-1 defines a custodian as an individual who, for
  compensation, is employed as an employee by a single owner and manages the property left in their
  trust. Therefore, employment as an employee by a single owner is required. The definition does not
  mandate that the individual hold a real estate broker license.
