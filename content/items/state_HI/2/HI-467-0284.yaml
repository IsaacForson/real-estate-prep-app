stem: Under Hawaii Revised Statutes § 467-1.5, which of the following best describes the
  relationship between a real estate broker and the broker's licensees?
options:
  - No employer-employee relationship is deemed to exist
  - The employer-employee relationship is deemed to exist
  - An employer-employee relationship is deemed to exist
  - Some employer-employee relationship is deemed to exist
key: A
explanation: The statute explicitly states that nothing in the chapter shall be deemed to create an
  employer-employee relationship between a broker and the broker's licensees. The distractor
  claiming the broker is the employer of the licensees contradicts this non‑deeming provision.
citation:
  source: Haw. Rev. Stat. ch. 467 — Hawaii Revised Statutes Chapter 467 — Real Estate Brokers and
    Salespersons — § 467-1 §467-1.5 Employer-employee relationship.
  url: null
  quoted_text: Nothing in this chapter or in any of the rules adopted to implement this chapter shall
    be deemed to create an employer-employee relationship between a real estate broker and the
    broker's licensees; provided that the commission shall have all power necessary to regulate the
    relationships, duties and liabilities among real estate brokers and real estate salespersons in
    order to protect the public.
