stem: A property manager is employed by a corporation that owns a single office building and is
  responsible for managing the building and collecting rent. Under Hawaii Revised Statutes § 467-1,
  does this individual qualify as a custodian?
options:
  - Yes, because the corporation is a single owner and the manager performs custodial duties.
  - No, because the corporation is considered an association of owners under the statute.
  - Yes, but only if the manager also leases units to tenants.
  - No, because the manager is not employed directly by an individual owner.
key: A
explanation: The definition of custodian applies to anyone employed by a single owner to manage
  property, and a corporation owning a single building qualifies as a single owner. The manager’s
  duties match the custodial role, and there is no leasing activity that would trigger the
  exclusion. The claim that the manager is not employed directly by an individual owner is incorrect
  because a corporation can be a single owner. The statement that the manager would qualify only if
  also leasing units is wrong because leasing activity would exclude the individual from the
  custodian definition. The assertion that the corporation is considered an association of owners is
  false because the statute excludes associations of owners of condominiums, cooperatives, or
  planned unit developments, not a corporation owning a single office building.
