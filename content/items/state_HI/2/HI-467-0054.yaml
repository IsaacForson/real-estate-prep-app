  url: null
  quoted_text: (d) The receipts, return receipts, or cancellation notices obtained under this section
    shall be kept on file in possession of the developer and shall be subject to inspection at any
    reasonable time by the commission or its staff or agents for a period of three years from the
    date the receipt or return receipt was obtained.
