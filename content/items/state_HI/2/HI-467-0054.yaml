stem: Under Hawaii Revised Statutes § 514B-86(d), how long must a developer retain the receipts,
  return receipts, or cancellation notices obtained under this section?
options:
  - One year from the date the receipt was obtained.
  - Two years from the date the receipt was obtained.
  - Three years from the date the receipt was obtained.
  - Five years from the date the receipt was obtained.
key: C
explanation: The statute requires the developer to keep the receipts, return receipts, or
  cancellation notices for three years from the date the receipt or return receipt was obtained. The
  two‑year option is incorrect because the law specifies a three‑year retention period.
