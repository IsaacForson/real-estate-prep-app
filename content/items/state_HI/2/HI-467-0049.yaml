stem: A beachfront resort consists of individual condominium units that each provide front desk,
  daily maid service, and restaurant access to guests staying less than thirty days. Under Hawaii
  Revised Statutes § 467-1, how are these units treated for the purpose of defining a 'hotel'?
options:
  - The units are automatically classified as hotels regardless of the services they provide.
  - The units are included in the definition of hotel because they provide transient lodging for
    less than thirty days.
  - The units are considered hotels only if they also offer bell service and telephone switchboard.
  - The units are excluded from the definition of hotel because they are part of a condominium
    project that provides customary hotel services.
key: D
explanation: Hawaii Revised Statutes § 467-1 excludes from the definition of hotel any units in a
  condominium project that provide customary hotel services. Because the units described offer front
  desk, maid service, and restaurant access, they meet the criterion for customary hotel services
  and are therefore excluded from the hotel definition. The option stating that the units are
  automatically classified as hotels ignores this specific statutory exclusion for condominium
  project units.
