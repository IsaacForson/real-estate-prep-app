stem: Under Hawaii Revised Statutes § 467-1, which of the following is **NOT** considered a 'single
  owner' for the purpose of defining a custodian or caretaker?
options:
  - A trust holding title to real estate property
  - A married couple holding title as tenants by entirety
  - A fee simple owner of residential property
  - An association of owners of a condominium
key: D
explanation: Under Hawaii Revised Statutes § 467-1, a 'single owner' excludes an association of
  owners of a condominium, cooperative, or planned unit development. Thus such an association is not
  a single owner for custodian purposes. A married couple holding title as tenants by entirety
  remains a single owner because they constitute one ownership entity. A trust holding title to real
  estate also counts as a single owner because it holds the property as one entity.
