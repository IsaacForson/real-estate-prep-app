stem: A purchaser has signed a binding condominium sales contract after receiving the developer's
  public report and waiving the cancellation right. Later, the developer announces a material change
  to the project. Under which Hawaii Revised Statutes section does the purchaser have a thirty-day
  right to rescind the contract?
options:
  - Section 514B-95
  - Section 467-14
  - Section 514B-87
  - Section 514B-86
key: C
explanation: Under Hawaii Revised Statutes § 514B-87(a), a purchaser who has entered into a binding
  condominium sales contract after receiving the public report and waiving the cancellation right
  may rescind the contract within thirty days if the developer later makes a material change to the
  project. This rescission right does not apply under § 514B-86, which covers the pre‑binding
  cancellation period, nor under § 514B-95 or § 467-14, which address other matters.
