stem: A property manager is employed by the association of owners of a planned unit development to
  oversee common areas and collect monthly dues. Under Hawaii Revised Statutes § 467‑1, does this
  individual qualify as a custodian?
options:
  - Yes, because the association is considered a single owner under the statute, which treats the
    collective as a single entity for licensing purposes.
  - No, because the association of owners of a planned unit development is expressly excluded from
    the definition of a single owner.
  - Yes, because the manager is an employee of the association and therefore acts as its agent in
    collecting dues.
  - No, because the manager also engages in leasing activities, which would make him a broker rather
    than a custodian.
key: B
explanation: Hawaii Revised Statutes § 467‑1 defines a “single owner” and expressly excludes an
  association of owners of a condominium, cooperative, or planned unit development. Because the
  association is not a single owner, the manager does not satisfy the custodian requirement. The
  manager’s status as an employee does not create a single‑owner relationship, and the fact that the
  manager also performs leasing activities does not affect the custodian analysis.
