stem: A property manager is hired as an independent contractor by a single owner to manage
  residential real estate and receives compensation for the services. Under Hawaii Revised Statutes
  § 467-1, does this individual qualify as a custodian or caretaker?
options:
  - The individual does not qualify as a custodian because they are not employed as an employee.
  - The individual does not qualify as a custodian because they work for a single owner.
  - The individual qualifies as a custodian because they manage real property.
  - The individual qualifies as a custodian because they receive compensation.
key: A
explanation: The statute defines a custodian as an individual who, for compensation, is employed as
  an employee by a single owner and manages the property. Being an independent contractor means the
  individual is not an employee, so they do not meet the definition. The distractor that focuses
  only on compensation ignores the employment requirement.
