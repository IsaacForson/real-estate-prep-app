stem: Under Hawaii Revised Statutes § 514B-83(b), what must a developer do when a pertinent or
  material change occurs in the project?
options:
  - Promptly amend the developer's public report to report any pertinent or material change or both.
  - Immediately halt all sales activities until the change is reviewed by the real estate commission.
  - Provide a verbal notice to all prospective purchasers at the next open house.
  - File a supplemental affidavit with the bureau of conveyances detailing the change.
key: A
explanation: "Under Hawaii Revised Statutes § 514B-83(b), a developer must promptly amend the public
  report to disclose any pertinent or material change. The correct choice states that the developer
  should promptly amend the developer's public report to report any pertinent or material change or
  both. The other choices are incorrect: halting sales is not required by the statute, giving a
  verbal notice at an open house is not mandated, and filing a supplemental affidavit with the
  bureau of conveyances is not prescribed."
