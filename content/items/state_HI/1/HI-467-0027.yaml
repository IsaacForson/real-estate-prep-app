stem: Under Hawaii Revised Statutes chapter 508D, how is a "common area" defined?
options:
  - It is real property that is designated as common area in or pursuant to a declaration, that is
    owned or leased by the association under the declaration, or that is otherwise available for the
    use of members of the association.
  - It is real property that is owned by the developer and used exclusively for recreational
    facilities, parking, or landscaping as part of the condominium project, and remains under the
    developer’s control until the condominium is fully turned over, at which point ownership may
    change.
  - It is real property that is subject to a leasehold interest held by the association and may be
    subleased to individual unit owners, and is limited to units that have been fully paid for, and
    cannot be used by non‑owners.
  - It is real property that is subject to a mortgage held by the association to finance
    improvements to the common elements, and the mortgage lien restricts any transfer of that
    property without the lender’s consent, making it unavailable for general member use.
key: A
explanation: Hawaii Revised Statutes § 508D‑1 defines a common area as real property that is
  designated as common area in or pursuant to a declaration, that is owned or leased by the
  association under the declaration, or that is otherwise available for the use of members of the
  association. The correct answer states exactly that definition. The other statements describe
  leasehold interests, mortgage‑encumbered property, or developer‑owned recreational land, which are
  not the statutory definition of a common area.
