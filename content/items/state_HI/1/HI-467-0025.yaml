stem: A licensee is assisting a buyer who is purchasing a property and the buyer expresses concern
  about possible boundary disputes. According to Hawaii Administrative Rules § 16-99-3(d), what
  should the licensee do?
options:
  - Recommend that the buyer seek legal counsel.
  - Recommend that a survey be conducted now.
  - Recommend that the seller lower the price.
  - Recommend that title be examined promptly.
key: B
explanation: The rule requires recommending a survey when the interest of either party requires it;
  the buyer's concern about boundary disputes creates such an interest. Recommending legal counsel
  is not required unless the interest specifically calls for legal counsel.
citation:
  source: Haw. Admin. Rules § 16-99-3(d)
  url: null
  quoted_text: The licensee shall recommend that title be examined, survey be conducted, or legal
    counsel be obtained when the interest of either party requires it.
