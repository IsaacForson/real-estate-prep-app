stem: A Hawaii seller and buyer wish to extend the buyer's examination period for the disclosure
  statement beyond the statutory fifteen days. What does the statute allow them to do?
options:
  - The parties may extend the examination period without any written agreement.
  - The parties may agree in writing to reduce or extend the time period for delivery, examination,
    and rescission.
  - The parties may extend the examination period only if the seller supplies an updated disclosure
    statement.
  - The parties may unilaterally extend the examination period by providing written notice to the
    other party.
key: B
explanation: Section 508D-5(c) permits the seller and buyer to agree in writing to reduce or extend
  the time period for delivery, examination, and rescission. The other options either allow
  unilateral action, omit the writing requirement, or add conditions not found in the statute.
