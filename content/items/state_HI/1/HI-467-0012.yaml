stem: Under chapter 508D, what is a "disclosure statement" in a Hawaii residential sale?
options:
  - A verbal summary the listing agent gives during an open house
  - A form the buyer's agent completes after closing occurs
  - A checklist the county recorder issues before a deed is filed
  - A written seller statement disclosing material facts
key: D
explanation: The statute defines a disclosure statement as a written statement prepared by the
  seller, or at the seller's direction, that purports to fully and accurately disclose all material
  facts relating to the property.
