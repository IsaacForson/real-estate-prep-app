stem: A Hawaii real estate salesperson accepts a listing for a single-family home and, during the
  showing, observes active termite damage in the garage but does not mention it to the prospective
  buyer. The buyer later discovers the damage and files a complaint. Which provision of Haw. Rev.
  Stat. § 467-14 could serve as basis for disciplinary action against the salesperson?
options:
  - Violation of Haw. Rev. Stat. § 467-14 (1) – making a misrepresentation concerning any real
    estate transaction, such as telling the buyer that the foundation is sound when severe cracks
    are present, which induces the buyer to rely on false information.
  - Violation of Haw. Rev. Stat. § 467-14 (18) – failing to ascertain and disclose all material
    facts concerning the property, such as not informing the buyer of observed termite damage, which
    could affect the property's value and the buyer's decision.
  - Violation of Haw. Rev. Stat. § 467-14 (7) – failing, within a reasonable time, to account for
    moneys belonging to others that are in the licensee's possession, such as using a client's
    earnest money deposit to pay personal expenses.
  - Violation of Haw. Rev. Stat. § 467-14 (4) – acting for both parties in a transaction without
    obtaining written consent from both parties, such as representing the seller and buyer in the
    same sale without their signed agreement.
key: B
explanation: The salesperson’s failure to disclose the observed termite damage constitutes a failure
  to ascertain and disclose a material fact, which is prohibited under subsection (18) of § 467-14.
  The option citing misrepresentation is incorrect because the scenario involves an omission, not an
  affirmative false statement.
