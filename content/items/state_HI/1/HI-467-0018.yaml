stem: A Hawaii residential property lies within a special flood hazard area officially designated on
  FEMA flood maps. Under the notification statute, what must the seller include in the disclosure
  statement?
options:
  - A private flood insurance quote obtained from a local agent
  - The material fact information about the flood hazard designation
  - A survey certifying the exact elevation of the building foundation
  - A written waiver releasing the buyer from flood insurance costs
key: B
explanation: When a property lies within a special flood hazard area designated under the National
  Flood Insurance Program, the statute requires the seller to include the material fact information
  in the disclosure statement provided to the buyer.
