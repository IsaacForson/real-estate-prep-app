stem: A Hawaii real estate salesperson receives an earnest money deposit from a buyer and places it
  in the broker’s trust account but fails to provide the buyer with an accounting of the funds
  within a reasonable time. Which violation of Haw. Rev. Stat. § 467-14 does this constitute?
options:
  - The licensee has violated § 467-14(1) by making a misrepresentation about the property's
    condition
  - The licensee has violated § 467-14(7) by failing to account for the earnest money within a
    reasonable time
  - The licensee has violated § 467-14(20) by failing to maintain a reputation for honesty
  - The licensee has violated § 467-14(15) by commingling the earnest money with personal funds
key: B
explanation: The salesperson’s failure to provide an accounting of the earnest money within a
  reasonable time directly violates the prohibition against failing, within a reasonable time, to
  account for moneys belonging to others in subsection (7). The distractor about commingling is
  incorrect because the facts show the money was kept in the trust account, not mixed with personal
  funds.
