stem: A Hawaii seller signs and dates the disclosure statement seven months before the buyer accepts
  the real estate purchase contract. The seller then delivers the statement to the buyer and obtains
  the buyer's acknowledgment of receipt. Under Haw. Rev. Stat. § 508D-4(1)(A), what is the status of
  the seller's action?
options:
  - The seller's action is permissible because the buyer acknowledged receipt of the statement.
  - The seller's action is impermissible because the signature was made more than six months before
    acceptance.
  - The seller's action is impermissible because the statement must be signed after acceptance.
  - The seller's action is permissible because the statement was signed before acceptance.
key: B
explanation: The statute requires the disclosure statement to be signed and dated by the seller
  within six months before or ten calendar days after acceptance of the purchase contract. Signing
  seven months before acceptance falls outside this window, making the action impermissible. The
  most tempting distractor claims permissibility based solely on the buyer's acknowledgment, but
  acknowledgment does not cure an untimely signature.
