stem: A Hawaii seller accepts a real estate purchase contract on June 1. By what latest date may the
  seller sign and date the disclosure statement to comply with chapter 508D?
options:
  - The seller may sign and date the disclosure statement on June 1.
  - The seller may sign and date the disclosure statement on June 11.
  - The seller may sign and date the disclosure statement on June 21.
  - The seller may sign and date the disclosure statement on July 1.
key: B
explanation: Section 508D‑4 requires the seller to sign and date the disclosure statement within six
  months before or within ten calendar days after the buyer’s acceptance of the purchase contract.
  Ten calendar days after June 1 is June 11, so that is the latest date the seller may sign. The
  choice stating the seller may sign on June 21 gives a date twenty days after acceptance, which
  exceeds the ten‑day limit, and the choice stating the seller may sign on July 1 is even later,
  also exceeding the permitted period.
