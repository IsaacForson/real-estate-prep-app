stem: Which statement correctly defines a “custodian or caretaker” under Haw. Rev. Stat. § 467‑1?
options:
  - An individual who, for compensation or valuable consideration, is employed as an employee by a
    single owner and has the responsibility to manage or care for that real property left in the
    individual's trust, provided that the term does not include any individual who leases or offers
    to lease, or rents or offers to rent, any real estate for more than a single owner.
  - An individual who, for compensation or valuable consideration, is employed as an employee by an
    association of owners of a condominium and has the responsibility to manage or care for that
    real property left in the individual's trust, provided that the term does not include any
    individual who leases or offers to lease, or rents or offers to rent, any real estate for more
    than a single owner.
  - An individual who, for compensation or valuable consideration, is employed as an independent
    contractor by a single owner and has the responsibility to manage or care for that real property
    left in the individual's trust, provided that the term does not include any individual who
    leases or offers to lease, or rents or offers to rent, any real estate for more than a single
    owner.
  - An individual who, for compensation or valuable consideration, is employed as an employee by a
    single owner and has the responsibility to manage or care for that real property left in the
    individual's trust, and may also lease or offer to lease real estate for more than a single
    owner.
key: A
explanation: Haw. Rev. Stat. § 467‑1 defines a custodian or caretaker as an individual who, for
  compensation or valuable consideration, is employed as an employee by a single owner and is
  responsible for managing or caring for the real property held in that owner’s trust. The
  definition expressly excludes any person who leases, offers to lease, rents, or offers to rent
  real estate for more than a single owner. The statement that describes an employee of a single
  owner with that responsibility and includes the exclusion clause therefore matches the statutory
  definition. The other statements are incorrect because they either refer to an association of
  owners, describe an independent contractor, or allow the caretaker to lease real estate for more
  than a single owner, which the statute prohibits.
