stem: Under Haw. Rev. Stat. § 508D-4, a seller is prohibited from selling residential real property
  unless the buyer does which of the following?
options:
  - The buyer pays the earnest money deposit to escrow account
  - The buyer signs a waiver releasing the contractor for defects
  - The buyer obtains a licensed home inspection report for safety
  - The buyer acknowledges receipt of the disclosure statement
key: D
explanation: The statute requires that the buyer acknowledge receipt of the disclosure statement
  before a sale may proceed. Failure to obtain this acknowledgement violates the prohibition on
  selling residential real property. The distractor about signing a waiver is incorrect because a
  waiver is treated as a material fact that must be disclosed, not a substitute for buyer
  acknowledgement.
