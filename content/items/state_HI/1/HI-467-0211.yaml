  url: null
  quoted_text: The broker shall keep in special bank accounts, separated from the broker's own funds,
    moneys coming into the broker's possession in trust for other persons, such as escrow funds,
    trust funds, clients' moneys, rental deposits, rental receipts, and other like items.
