stem: A Hawaii property manager receives a $1,200 rental deposit from a tenant. According to Haw.
  Admin. Rules § 16-99-3(e), what must the manager do with this money?
options:
  - Hold it in the manager's cash drawer until the lease ends
  - Transfer it to the owner's personal account without segregation
  - Use it to cover advertising costs for the property
  - Deposit it in a special bank account separated from the manager's own funds
key: D
explanation: Under Haw. Admin. Rules § 16-99-3(e), rental deposits must be deposited in a special
  bank account separated from the manager’s own funds. Holding the deposit in a cash drawer, using
  it for advertising, or transferring it to an owner’s personal account all violate this segregation
  requirement.
