stem: Under Haw. Rev. Stat. § 467-14(18), which of the following is **NOT** considered a material
  fact that a licensee must disclose?
options:
  - The fact that an occupant has AIDS or ARC or HIV test history.
  - The fact that the roof exhibits significant leakage during storms.
  - The fact that the property has a documented history of termite damage.
  - The fact that the property is located in a special flood hazard area.
key: A
explanation: The statute explicitly states that the fact an occupant has AIDS, ARC, or has been
  tested for HIV infection shall not be considered a material fact for disclosure purposes. The
  other options describe conditions that affect property value or habitability and therefore are
  material facts requiring disclosure.
