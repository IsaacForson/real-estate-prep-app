stem: A Hawaii real estate salesperson purchases a distressed property 200 days after the seller’s
  listing agreement with the salesperson’s broker expired. The property was listed with the broker
  at the time of the original listing. According to Haw. Rev. Stat. § 467-14(21), is the
  salesperson’s acquisition prohibited?
options:
  - The acquisition is permitted because it occurred within 365 days of the listing agreement’s
    expiration.
  - The acquisition is prohibited because it occurred within 365 days of the listing agreement’s
    expiration.
  - The acquisition is permitted because it occurred outside the 365‑day window.
  - The acquisition is prohibited because it occurred outside the 365‑day window.
key: B
explanation: The acquisition occurred 200 days after the listing agreement ended, which is within
  the 365‑day window specified in § 467‑14(21). Consequently, the salesperson’s purchase is
  prohibited. The distractor claiming the acquisition is permitted because it occurred within the
  window misstates the rule’s effect, while the other distractors introduce irrelevant conditions
  such as broker consent or the property’s listing status at the time of purchase.
