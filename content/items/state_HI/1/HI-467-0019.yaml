stem: A Hawaii property sits near a boundary line on a large-scale hazard map, and after a good
  faith review it is genuinely unclear whether the parcel falls inside a designated area. How does
  the statute resolve this ambiguity?
options:
  - The ambiguity is construed in favor of the buyer
  - The ambiguity voids the purchase contract right away
  - The ambiguity is construed in favor of the seller
  - The ambiguity is resolved instead by the real estate commission
key: C
explanation: When it is questionable whether a property lies within a designated hazard area because
  of the inherent ambiguity of boundary lines on large-scale maps, the statute directs that the
  ambiguity be construed in favor of the seller.
citation:
  source: Haw. Rev. Stat. § 508D-15
  url: null
  quoted_text: When it is questionable whether residential real property lies within any of the
    designated areas referred to in subsection (a) due to the inherent ambiguity of boundary lines
    drawn on maps of large scale, the ambiguity shall be construed in favor of the seller
