stem: A licensee representing a buyer learns that the property adjoins a newly constructed highway
  and the buyer is concerned about possible encroachment. What should the licensee do under Haw.
  Admin. Rules § 16-99-3(d)?
options:
  - Inform the buyer that encroachment concerns are not material facts
  - Recommend that a survey be conducted to determine the boundary
  - Advise the buyer to proceed with the purchase without further investigation
  - Suggest that the buyer obtain title insurance instead of a survey
key: B
explanation: The rule requires the licensee to recommend a survey, title examination, or legal
  counsel when the interest of either party requires it. The buyer's concern about encroachment
  triggers that interest, so a survey recommendation is appropriate. Advising to proceed without
  investigation ignores the duty to act on the party's interest.
