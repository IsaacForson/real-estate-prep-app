stem: A licensee represents both buyer and seller in a residential transaction but only obtains a
  general statement that they represent both parties, without detailed description. What must the
  licensee do to comply with Haw. Admin. Rules § 16-99-3.1(g)?
options:
  - Obtain written consent that is given verbally by both parties to the transaction
  - Obtain written consent that states the licensee represents both parties only
  - Obtain written consent that includes a full disclosure and brief description
  - Obtain written consent that includes a description but omits disclosure
key: C
explanation: The rule requires written consent that includes a full disclosure of the type of
  representation and a brief description of that representation for each party. A general statement
  lacking these details is insufficient, making the correct answer the option that adds both
  elements.
