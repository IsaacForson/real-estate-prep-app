stem: Under Haw. Rev. Stat. § 508D-1, how is a "material fact" defined?
options:
  - Any fact, defect, or condition, past or present, that would be expected to measurably affect the
    value to a reasonable person of the residential real property being offered for sale
  - Any fact, defect, or condition, past or present, that would be expected to affect the value to a
    reasonable person of the residential real property being offered for sale
  - Any fact, defect, or condition, past or present, that would be expected to measurably affect the
    value of the residential real property being offered for sale
  - Any fact, defect, or condition, past or present, that would be expected to measurably affect the
    value to a reasonable person of any real property being offered for sale
key: A
explanation: Haw. Rev. Stat. § 508D-1 defines a material fact as any fact, defect, or condition,
  past or present, that would be expected to measurably affect the value to a reasonable person of
  the residential real property being offered for sale. The statute expressly requires the effect to
  be measurable; an answer that leaves out the word “measurably” does not satisfy the definition.
