stem: "A broker holds rental deposits from two different tenants in the same trust account that is
  separate from the broker's business operating account. Under Haw. Admin. Rules § 16-99-3(e), this
  practice is:"
options:
  - The practice of holding rental deposits from multiple tenants in a single trust account separate
    from the broker's own funds is permitted
  - The practice of holding rental deposits from multiple tenants is allowed only with written
    consent from each tenant
  - The practice of holding rental deposits from multiple tenants requires a separate trust account
    for each tenant
  - The practice of holding rental deposits from multiple tenants in a single trust account separate
    from the broker's own funds
key: A
explanation: The rule only mandates that trust funds be kept separate from the broker's own funds;
  it does not require separate accounts for each tenant or tenant consent. Therefore, holding
  multiple tenants' deposits in one account that is separate from the broker's own funds is
  permissible.
