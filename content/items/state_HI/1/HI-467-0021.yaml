stem: Which of the following is specifically excluded from being considered a material fact under
  Hawaii Revised Statutes §467-14(18)?
options:
  - An occupant’s HIV test result
  - A known termite infestation
  - A pending zoning change
  - A history of flood damage
key: B
explanation: The statute states that "the fact that an occupant has AIDS or AIDS Related Complex
  (ARC) or has been tested for HIV. shall not be considered a material fact," making the HIV‑related
  fact the only excluded item. The other choices are not excluded and would be material facts.
