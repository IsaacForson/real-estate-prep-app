stem: A Hawaii buyer receives the seller's disclosure statement but never sends the seller any
  written notice about rescinding the purchase contract within the fifteen-day examination period.
  What is the legal effect of the buyer's silence?
options:
  - The seller automatically refunds the buyer's earnest deposit
  - The buyer is deemed to have accepted the disclosure statement
  - The buyer's fifteen-day period restarts from the next inspection
  - The purchase contract automatically becomes void
key: B
explanation: Failure to deliver the written rescission notification to the seller within the
  fifteen-day period is deemed an acceptance of the disclosure statement, so the contract simply
  continues.
