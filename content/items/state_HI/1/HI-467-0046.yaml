stem: A Hawaii real estate salesperson tells a prospective buyer that the property will definitely
  appreciate in value within the next year, knowing that market forecasts indicate no such
  guarantee. Under Haw. Rev. Stat. § 467-14(2), what action may the commission take?
options:
  - Require the salesperson to attend a fair housing workshop.
  - Refer the case to the Real Estate Recovery Fund for reimbursement.
  - Impose a civil penalty only if the buyer suffers actual financial loss.
  - Revoke license, suspend rights, fine licensee, or terminate registration.
key: D
explanation: Making false promises likely to mislead another is a listed cause for discipline,
  allowing the commission to revoke the license, suspend practice rights, fine the licensee, or
  terminate registration. The other options describe remedies not authorized by this statutory
  provision.
