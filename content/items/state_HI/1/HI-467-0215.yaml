stem: Which of the following is excluded from the definition of a 'transaction' under Hawaii
  Administrative Rules § 16-99-3.1(a)?
options:
  - A lease for one year or less
  - A lease for two years or less
  - A lease for ten years or less
  - A lease for five years or less
key: A
explanation: The rule defines 'transaction' as any sale, lease, rent, or exchange of real estate,
  including time shares and interests in residential cooperative housing corporations, but
  explicitly excludes leases for one year or less. Therefore, a lease for one year or less is not
  considered a transaction under this definition. The other options describe leases longer than one
  year, which are included in the definition.
citation:
  source: Haw. Admin. Rules § 16-99-1 et seq. — Hawaii Administrative Rules Title 16, Chapter 99 —
    Real Estate Brokers and Salespersons — § 16-99-3.1(a)
  url: null
  quoted_text: "'Transaction' means any sale, lease, rent, or exchange of real estate (residential,
    time share, industrial, or commercial) transaction or a sale or exchange of, or option
    involving, an interest in a residential cooperative housing corporation, but excluding leases
    for one year or less."
