stem: Under Haw. Rev. Stat. § 508D-1, how is 'residential real property' defined?
options:
  - Fee simple or leasehold real property containing one to four dwelling units, or a residential
    condominium or cooperative apartment primarily occupied as a residence.
  - Any real property that includes at least one dwelling unit, irrespective of ownership form or
    how the property is used.
  - Fee simple real property limited to a single‑family dwelling that serves as the owner’s primary
    residence.
  - Leasehold real property with five or more units, or a condominium whose principal use is
    commercial rather than residential.
key: A
explanation: The statute defines residential real property as fee simple or leasehold real property
  containing one to four dwelling units, or a residential condominium or cooperative apartment
  primarily occupied as a residence. The definition that includes any real property with at least
  one dwelling unit regardless of ownership or use is too broad because it omits the one‑to‑four
  unit limit and the ownership/form restrictions. The definition limited to fee simple single‑family
  homes that serve as the owner’s primary residence incorrectly excludes leasehold properties,
  properties with two‑to‑four units, and condominiums or cooperatives. The definition describing
  leasehold property with five or more units or a condominium whose principal use is commercial is
  contrary to the statute, which excludes properties with more than four units and residential
  condominiums used primarily as a residence.
citation:
  source: Haw. Rev. Stat. ch. 508D — Hawaii Revised Statutes Chapter 508D - Mandatory Seller
    Disclosures in Real Estate Transactions (data.capitol.hawaii.gov, section pages concatenated) —
    § 508D-1
  url: null
  quoted_text: "Residential real property means fee simple or leasehold real property on which
    currently is situated: (1) From one to four dwelling units; or (2) A residential condominium or
    cooperative apartment, the primary use of which is occupancy as a residence."
