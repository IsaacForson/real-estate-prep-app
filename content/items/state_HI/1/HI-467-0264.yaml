stem: According to Haw. Rev. Stat. ch. 467 — Hawaii Revised Statutes Chapter 467 — Real Estate
  Brokers and Salespersons — § 467-14(18), which of the following is **NOT** considered a material
  fact when disclosing information about a residential property?
options:
  - The fact that an occupant has AIDS or ARC is NOT a material fact.
  - A roof leak that requires repair is a material fact.
  - The property's location in a flood zone is a material fact.
  - The presence of lead-based paint is a material fact.
key: A
explanation: The statute explicitly states that the fact that an occupant has AIDS, AIDS Related
  Complex (ARC), or HIV test history shall not be considered a material fact. Therefore, the
  statement that this fact is NOT a material fact is correct. The other options describe conditions
  that are generally considered material because they affect property value or desirability.
