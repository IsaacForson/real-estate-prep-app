stem: On March 10, a broker applicant formerly employed by ABC Brokerage submits a written request
  for an experience certification statement. According to Haw. Admin. Rules § 16-99-3(q), by what
  date must the principal broker or broker-in-charge provide the statement?
options:
  - March 18
  - March 19
  - March 20
  - March 21
key: C
explanation: The rule requires the statement to be provided within ten days of receiving the written
  request. Counting ten calendar days from March 10 brings the deadline to March 20. The distractor
  “March 18” results from counting only eight days, omitting the start and end days.
citation:
  source: Haw. Admin. Rules § 16-99-3(q)
  url: null
  quoted_text: Within ten days of receiving a written request, it shall be the responsibility of the
    principal broker or broker-in-charge of the brokerage firm to provide broker applicants formerly
    or presently employed by or associated with them with an accurate experience certification
    statement in the form provided by the commission attesting to the length of time that the broker
    applicant has been actively associated with or employed full-time by the brokerage firm.
