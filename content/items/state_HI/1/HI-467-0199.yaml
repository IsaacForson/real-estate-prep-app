stem: A Hawaii seller signs a waiver releasing a contractor from liability for a construction defect
  that measurably affects the property's value. Under § 508D-4.5, what must the seller do with this
  information?
options:
  - Attach the waiver as an exhibit to the purchase contract
  - Include the waiver as a material fact in the disclosure statement
  - Verbally disclose the waiver to the buyer before closing
  - File the waiver with the county recorder's office
key: B
explanation: §508D-4.5 states that any release or waiver of liability for a defect that measurably
  affects value is a material fact that shall be contained in the disclosure statement. Attaching it
  as an exhibit, disclosing it verbally, or filing it with the recorder does not satisfy the
  statutory requirement to include it in the disclosure statement.
citation:
  source: Haw. Rev. Stat. ch. 508D — Hawaii Revised Statutes Chapter 508D - Mandatory Seller
    Disclosures in Real Estate Transactions (data.capitol.hawaii.gov, section pages concatenated) —
    [§508D-4.5] Release or waiver of construction defect.
  url: null
  quoted_text: Any release from or waiver of liability, or release from a warranty by a seller to any
    government agency, contractor as defined in section 444-1, or engineer, architect, land
    surveyor, or landscape architect licensed to practice that profession under chapter 464, for any
    defect, mistake, or omission in the design or construction of any residential real property that
    measurably affects the value of the residential real property is a material fact that shall be
    contained in a disclosure statement.
