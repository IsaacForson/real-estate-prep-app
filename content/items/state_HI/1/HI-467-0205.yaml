stem: A Hawaii real estate broker learns that the occupant of a listed property has AIDS. Under Haw.
  Rev. Stat. ch. 467 § 467-14(18), is the broker required to disclose this fact as a material fact?
options:
  - The broker may disclose the fact only if the buyer specifically asks about health conditions.
  - The broker must disclose the fact as a material fact because any health condition affecting
    occupants is considered material.
  - The broker must not disclose the fact as a material fact because the statute excludes AIDS, ARC,
    or HIV test history.
  - The broker may disclose the fact only if the property’s value is affected by the occupant’s
    condition.
key: C
explanation: The statute expressly provides that AIDS, ARC, or HIV test history shall not be
  considered a material fact, so disclosure is not required.
