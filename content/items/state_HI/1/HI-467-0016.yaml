stem: While reviewing a third-party inspection report, a Hawaii seller's agent learns of a material
  fact that contradicts the seller's disclosure statement. What does the statute require the agent
  to do with this information?
options:
  - Keep the information fully confidential until closing is done
  - Report the discrepancy to the multiple listing service instead
  - Wait patiently for the buyer to discover the problem entirely alone
  - Disclose the fact to the seller, the buyer, and the buyer's agent
key: D
explanation: When a seller's agent becomes aware of material facts inconsistent with the disclosure
  statement or a third-party inspection report, the agent must disclose those facts to the seller,
  the buyer, and the buyer's agent.
citation:
  source: Haw. Rev. Stat. § 508D-7
  url: null
  quoted_text: If the seller's agent is or becomes aware of any material facts inconsistent with or
    contradictory to the disclosure statement or the inspection report of a third party provided by
    the seller, the seller's agent shall disclose these facts to the seller, the buyer, and the
    buyer's agent.
