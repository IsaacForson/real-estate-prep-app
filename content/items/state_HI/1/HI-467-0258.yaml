stem: A seller provides the disclosure statement to the buyer on the eleventh calendar day after
  acceptance of the real estate purchase contract, and the buyer acknowledges receipt. Is the
  seller's action permissible under Haw. Rev. Stat. § 508D-5(a)?
options:
  - The seller's action is impermissible because it was delivered after the ten‑day limit
  - The seller's action is permissible because the buyer acknowledged receipt
  - The seller's action is permissible because it was delivered within ten days
  - The seller's action is impermissible because the disclosure statement was not signed
key: A
explanation: Section 508D-5(a) requires the seller to provide the disclosure statement no later than
  ten calendar days after acceptance. Providing it on the eleventh day violates this deadline,
  making the action impermissible. The distractor that cites buyer acknowledgement is irrelevant to
  the timing requirement.
