stem: A principal broker discovers that an associated salesperson's license has lapsed and takes no
  action to renew it or prevent the salesperson from continuing to work. Which duty under Haw. Rev.
  Stat. § 467-1.6 is the broker failing to fulfill?
options:
  - The principal broker shall set a policy on continuing education requirements for all associated
    real estate licensees in compliance with the statutory requirement.
  - The principal broker shall develop policies and procedures for the brokerage firm concerning the
    handling of real estate transactions and the conduct of associated licensees.
  - The principal broker shall ensure that the licenses of all associated real estate licensees and
    the brokerage firm license are current and active.
  - The principal broker shall maintain the brokerage firm's client trust accounts and oversee
    disbursements from those accounts.
key: C
explanation: The statute lists as a duty of the principal broker ensuring that the licenses of all
  associated real estate licensees and the brokerage firm license are current and active. Failing to
  act on a lapsed license violates this duty. The other options describe different responsibilities
  not implicated by the scenario.
