stem: A Hawaii buyer and seller sign a real estate purchase contract with no separate written
  agreement changing the standard disclosure timeline. Under the mandatory disclosure law, what is
  the seller's deadline for delivering the disclosure statement to the buyer, measured from
  acceptance of the contract?
options:
  - No later than ten calendar days from acceptance
  - No later than thirty calendar days from acceptance
  - No later than five calendar days from acceptance
  - No later than sixty calendar days from acceptance
key: A
explanation: The statute requires the seller, directly or through the seller's agent, to provide the
  disclosure statement to the buyer no later than ten calendar days from acceptance of the purchase
  contract.
citation:
  source: Haw. Rev. Stat. § 508D-5
  url: null
  quoted_text: No later than ten calendar days from acceptance of a real estate purchase contract, the
    seller, either directly or through the seller's agent, shall provide the disclosure statement to
    the buyer.
