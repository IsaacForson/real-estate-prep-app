stem: Under Haw. Admin. Rules § 16-99-3(o), what is the maximum initial duration of a temporary
  principal broker or broker-in-charge arrangement before it may be extended?
options:
  - Six calendar months
  - Thirty calendar days
  - Sixty calendar days
  - One calendar year
key: A
explanation: The rule states that a temporary principal broker or broker-in-charge arrangement shall
  not exceed a period of six months, establishing six months as the maximum initial length before an
  extension may be sought. The distractor stating thirty calendar days confuses the threshold for
  triggering the absence notification requirement with the duration limit for the temporary
  arrangement.
