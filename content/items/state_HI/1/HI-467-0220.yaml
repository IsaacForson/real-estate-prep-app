stem: Under Haw. Rev. Stat. § 467-14(21), acquiring an ownership interest in a distressed property
  is prohibited if the property is listed with the licensee or within how many days after the
  licensee's listing agreement for the distressed property has expired or is terminated?
options:
  - 365 days
  - 90 days
  - 730 days
  - 180 days
key: A
explanation: The statute explicitly states that acquiring an ownership interest in a distressed
  property is prohibited if the property is listed with the licensee or within three hundred
  sixty‑five days after the listing agreement has expired or terminated. Therefore the correct
  threshold is 365 days. The distractor of 180 days incorrectly halves the period, 730 days doubles
  it, and 90 days is unrelated to the provision.
