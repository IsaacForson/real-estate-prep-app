stem: A Hawaii broker receives a referral fee from a licensed broker in California who did not
  participate in any negotiations for the Hawaii transaction. Under Haw. Rev. Stat. § 467-14(14)(A),
  may the Hawaii broker accept this fee?
options:
  - The fee may be accepted because the out-of-state broker did not conduct negotiations in this
    State
  - The fee may be accepted because the out-of-state broker is licensed in any state
  - The fee may not be accepted because any fee split with another broker is prohibited
  - The fee may not be accepted because the Hawaii broker must share it equally
key: A
explanation: The exception in paragraph (14)(A) of Haw. Rev. Stat. § 467-14 allows a Hawaii broker
  to accept a referral fee from an out-of-state broker who does not conduct any of the negotiations
  for the Hawaii transaction. The statement that any fee split with another broker is prohibited
  ignores this exception and is therefore incorrect.
