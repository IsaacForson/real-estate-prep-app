stem: Under Haw. Rev. Stat. § 508D-1, how is a 'common area' defined?
options:
  - It means real property designated as common area in a declaration and owned by the association
    for member use.
  - It means real property leased by the association under the declaration and made available to
    members.
  - It means real property otherwise available for the use of members of the association in the
    common areas.
  - It means real property designated as common area in a declaration, owned or leased by the
    association, or otherwise available for members' use.
key: D
explanation: "The statute defines common area as real property designated as common area in or
  pursuant to a declaration, owned or leased by the association under the declaration, or otherwise
  available for the use of members of the association. The correct option includes all three
  elements: designation in a declaration, ownership or lease by the association, and availability
  for members' use; each of the other options omits at least one of these elements."
citation:
  source: Haw. Rev. Stat. ch. 508D — Hawaii Revised Statutes Chapter 508D - Mandatory Seller
