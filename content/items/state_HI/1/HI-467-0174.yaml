stem: Under Haw. Rev. Stat. § 467-14(18), what is a licensee required to do concerning material
  facts for each property they represent?
options:
  - Ascertain and disclose all material facts
  - Disclose only facts known to the seller
  - Only disclose facts that affect market value
  - Obtain a written waiver from the buyer
key: A
explanation: The statute requires licensees to ascertain and disclose all material facts concerning
  each property they represent so they can avoid error, misrepresentation, or concealment. The
  option stating that only facts affecting market value need be disclosed is too narrow and does not
  satisfy the broader duty.
