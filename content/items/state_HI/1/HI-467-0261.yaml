stem: A principal broker of a Hawaii brokerage firm will be absent from the principal place of
  business for 45 calendar days due to a medical leave. No other broker-in-charge is registered for
  the principal place of business. According to Haw. Admin. Rules § 16-99-3(o), what action must the
  principal broker take?
options:
  - No action is required because the broker's absence from the place is under sixty days.
  - Submit a signed written notice to the commission naming a temporary principal broker.
  - Obtain a licensed medical doctor's statement confirming inability to practice for the
    transaction.
  - Extend the temporary arrangement for up to an additional six months immediately.
key: B
explanation: Because the absence exceeds thirty calendar days and no other broker-in-charge is
  registered, the principal broker must submit a signed written notification designating a temporary
  principal broker. The distractor suggesting no action is required incorrectly treats the sixty‑day
  period as a threshold, when the rule’s thirty‑day trigger applies.
