stem: A seller’s property lies near the boundary of a special flood hazard area. The flood map is
  ambiguous at the property line, and the seller has made a good faith effort to determine whether
  the property is within the area. Under Haw. Rev. Stat. § 508D-15(c), how should the ambiguity be
  treated?
options:
  - The seller must disclose the property as located inside the flood hazard area despite the map’s
    uncertainty.
  - The ambiguity is resolved in favor of the seller, so no flood‑zone disclosure is required.
  - The seller should obtain an updated survey before deciding whether to disclose the flood risk.
  - The buyer assumes the risk of any undisclosed flood‑zone status and may later claim damages.
key: B
explanation: Under Haw. Rev. Stat. § 508D-15(c), when the boundary of a special flood hazard area is
  ambiguous, the ambiguity is construed in favor of the seller provided the seller has made a good
  faith effort to determine applicability. Therefore, the seller is not required to disclose based
  on the uncertain map. The option claiming the seller must disclose the property as inside the
  flood hazard area despite the map’s uncertainty is incorrect because the statute favors the seller
  in such cases. The option suggesting the seller should obtain an updated survey before deciding
  adds a requirement not present in the subsection. The option placing the risk on the buyer
  contradicts the seller‑favorable rule.
