stem: A Hawaii house was once the site of a past event that left no effect on the structure or
  physical environment of the property. Under the excluded-facts provision, how must a seller treat
  this information in the disclosure statement?
options:
  - It may be excluded as it is not a material fact
  - It is disclosed when the buyer asks about it
  - It is reported to the county recorder before the listing runs
  - It is disclosed automatically no matter the effect
key: A
explanation: The statute allows a seller to exclude the fact that the property was the site of an
  act or occurrence with no effect on its physical structure or environment, and this information is
  not deemed a material fact.
citation:
  source: Haw. Rev. Stat. § 508D-8
  url: null
  quoted_text: The residential real property was the site of an act or occurrence that had no effect
    on the physical structure or the physical environment of the residential real property, or the
    improvements located on the residential real property
