stem: A broker represents both the buyer and the seller in a residential transaction but does not
  obtain written consent from either party. Under which provision could the commission revoke the
  broker’s license?
options:
  - §467-14(18)
  - §467-14(14)
  - §467-14(7)
  - §467-14(4)
key: D
explanation: Paragraph (4) prohibits acting for both parties without first obtaining written consent
  from both parties, making it the basis for revocation. Paragraph (7) deals with accounting for
  others’ money, (14) with fee‑splitting, and (18) with failure to disclose material facts, none of
  which address dual representation without consent.
