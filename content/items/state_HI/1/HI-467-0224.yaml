  source: Haw. Admin. Rules § 16-99-3(r)
  url: null
  quoted_text: A broker licensee shall not sit for any Hawaii real estate broker or salesperson
    examination during the period in which the licensee has a real estate broker license unless
    specifically permitted by the commission.
