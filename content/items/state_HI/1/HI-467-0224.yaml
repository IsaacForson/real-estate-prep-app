stem: A Hawaii real estate broker who holds an active broker license wishes to take the salesperson
  licensing examination. What must the broker do under Haw. Admin. Rules § 16-99-3(r) to be allowed
  to sit for the exam?
options:
  - The broker must first relinquish their active broker license before applying for the exam.
  - The broker must have a sponsoring salesperson and complete a background check before sitting for
    the exam.
  - The broker must complete additional continuing education hours before being eligible for the
    exam.
  - The broker must obtain specific permission from the commission to sit for the salesperson
    examination.
key: D
explanation: The rule prohibits a broker licensee from sitting for any broker or salesperson
  examination while holding a broker license unless the commission specifically permits it.
