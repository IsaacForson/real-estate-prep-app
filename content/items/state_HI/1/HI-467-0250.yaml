stem: A property manager is hired by a single owner to oversee a rental building and also leases
  individual units to tenants. Under Haw. Rev. Stat. § 467-1, is this individual considered a
  custodian or caretaker?
options:
  - The individual is considered a custodian or caretaker because they manage the property for
    compensation.
  - The individual is not considered a custodian or caretaker because they are employed by multiple
    owners.
  - The individual is not considered a custodian or caretaker because they lease units to tenants.
  - The individual is considered a custodian or caretaker only if they do not receive valuable
    consideration.
key: A
explanation: Under Haw. Rev. Stat. § 467-1, a custodian or caretaker is any individual who, for
  compensation or valuable consideration, is employed by a single owner and has responsibility to
  manage or care for that real property. The exception excludes only those who lease or offer to
  lease, or rent or offer to rent, real estate for more than a single owner. Since the property
  manager works for a single owner and manages the property, they meet the definition and qualify as
  a custodian or caretaker. The claim that the individual is not a custodian or caretaker because
  they are employed by multiple owners is incorrect because the scenario specifies a single owner.
  The claim that leasing units to tenants automatically excludes the individual is incorrect because
  the exclusion applies only when leasing is done for more than one owner. The claim that the
  individual qualifies only if they do not receive valuable consideration is incorrect because the
  statute includes both compensation and valuable consideration as qualifying factors.
