stem: A Hawaii broker receives a rental deposit from a tenant while managing a property. What must
  the broker do with this money under Haw. Admin. Rules § 16-99-3(e)?
options:
  - Place the money in the broker's personal savings account at the main bank
  - Place the money in the broker's business operating account at the firm's headquarters
  - Place the money in a special trust account separate from the broker's own funds
  - Place the money in cash in the office safe until the tenant requests it
key: C
explanation: The rule mandates that trust money such as rental deposits be kept in special bank
  accounts separated from the broker's own funds. Placing the money in a personal or business
  account or holding it as cash violates this segregation requirement.
citation:
  source: Haw. Admin. Rules § 16-99-3(e)
  url: null
  quoted_text: The broker shall keep in special bank accounts, separated from the broker's own funds,
    moneys coming into the broker's possession in trust for other persons, such as escrow funds,
    trust funds, clients' moneys, rental deposits, rental receipts, and other like items.
