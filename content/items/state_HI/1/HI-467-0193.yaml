stem: Under Haw. Admin. Rules § 16-99-3.1(b), what two disclosures must the listing brokerage firm
  make in writing, dated, and signed by the seller and the listing brokerage firm at the time a
  listing is obtained?
options:
  - The listing brokerage firm must disclose whether the seller authorizes open house advertising
    and whether the seller authorizes repair credits.
  - The listing brokerage firm must disclose whether the seller authorizes dual agency and whether
    the seller authorizes refund of earnest money.
  - The listing brokerage firm must disclose whether the seller authorizes virtual tours and whether
    the seller authorizes price reductions.
  - The listing brokerage firm must disclose whether the seller authorizes subagent appointment via
    MLS and whether the seller authorizes commission sharing with subagents or buyer's agents.
key: D
explanation: The rule requires the listing brokerage firm to disclose in writing, dated, and signed
  by both the seller and the firm whether the seller authorizes the firm to appoint subagents
  through a multiple listing service and whether the seller authorizes the firm to share commissions
  with those subagents or with buyer's agents. This matches the content of the correct option. The
  other options describe disclosures not required by subsection (b).
