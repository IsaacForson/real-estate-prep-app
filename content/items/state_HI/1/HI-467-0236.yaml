stem: Which of the following is included in the definition of a 'declaration' under Hawaii Revised
  Statutes § 508D-1?
options:
  - It is a recorded document that grants the owner the right to veto any future development on
    adjacent lands.
  - It is a recorded document that imposes obligations on the owner regarding payment of property
    taxes.
  - It is a recorded document that only applies to properties owned by a single individual.
  - It is a recorded document that restricts or conditions the use of the real property being
    offered for sale.
key: D
explanation: The definition of declaration includes any recorded document that restricts or
  conditions the use of the real property being offered for sale (see §508D-1). The other options
  introduce obligations such as tax payments, veto rights, or limitation to single‑owner properties,
  which are not mentioned in the statute.
