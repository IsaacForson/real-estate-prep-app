stem: Under Hawaii Revised Statutes § 508D-1, how is a "condominium project" defined?
options:
  - A real estate condominium project; or a plan or project whereby a condominium of two or more
    units located within the condominium property regime have been sold or leased or are offered or
    proposed to be offered for sale or lease
  - A real estate cooperative project; or a plan or project whereby a cooperative of two or more
    units located within the cooperative property regime have been sold or leased or are offered or
    proposed to be offered for sale or lease
  - A real estate subdivision project; or a plan or project whereby a subdivision of two or more
    lots located within the subdivision property regime have been sold or leased or are offered or
    proposed to be offered for sale or lease
  - A real estate timeshare project; or a plan or project whereby a timeshare of two or more units
    located within the timeshare property regime have been sold or leased or are offered or proposed
    to be offered for sale or lease
key: A
explanation: Haw. Rev. Stat. § 508D-1 defines a condominium project as a real estate condominium
  project or a plan/project whereby a condominium of two or more units within the condominium
  property regime have been sold, leased, or offered for sale or lease. The option that replaces
  'condominium' with 'cooperative' does not match this definition.
