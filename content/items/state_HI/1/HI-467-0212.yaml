stem: A broker uses escrow funds to pay a personal credit‑card bill. Which provision of Haw. Admin.
  Rules § 16-99-3 is violated?
options:
  - Subsection (e) – requiring special bank accounts
  - Subsection (f) – requiring written financial obligations
  - Subsection (v) – prohibiting conversion of other people's money
  - Subsection (u) – prohibiting modification of signed instruments
key: C
explanation: Subsection (v) explicitly states that a licensee shall not convert other people’s
  moneys to the licensee’s own use. Using escrow funds for a personal bill is a direct conversion of
  trust money. The other subsections address account separation, written obligations, and instrument
  modifications, which are not the core violation here.
