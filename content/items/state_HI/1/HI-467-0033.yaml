stem: A real estate salesperson works exclusively under a broker and receives commission-based
  compensation. Under Haw. Rev. Stat. § 467-1.5, what is the legal effect of this affiliation
  regarding the relationship between the broker and the salesperson?
options:
  - The broker is considered the employer and the salesperson an employee for tax and labor law
    purposes.
  - The affiliation creates an employer-employee relationship that the commission may regulate.
  - No employer-employee relationship is deemed to exist between the broker and the salesperson by
    virtue of this chapter.
  - The broker and salesperson are automatically partners in a joint venture.
key: C
explanation: Hawaii Revised Statutes § 467‑1.5 makes clear that nothing in the chapter creates an
  employer‑employee relationship between a broker and the broker’s licensees. Consequently, the
  choice stating that the broker is the employer and the salesperson an employee is incorrect, as is
  the choice asserting that the affiliation creates an employer‑employee relationship that the
  commission may regulate. The choice describing the broker and salesperson as automatically
  partners in a joint venture is also incorrect because the statute does not provide for a
  joint‑venture relationship.
