stem: A principal broker expressly agrees to handle a salesperson's license application and has
  verified completeness and appropriate fees. What must the broker do next to comply with Haw. Rev.
  Stat. § 467-1.6(b)(4)?
options:
  - File the documents in the broker’s records and take no further action regarding the application.
  - Mail or deliver the appropriate documents to the commission by the required deadline.
  - Submit the documents to the commission within 10 days of verifying completeness and fees.
  - Notify the salesperson that the application is pending and await further instructions from the
    commission.
key: B
explanation: After verifying completeness and fees, Haw. Rev. Stat. § 467-1.6(b)(4) requires the
  principal broker to mail or deliver the documents to the commission by the required deadline.
  Simply retaining the documents in the broker’s records does not satisfy this duty; the broker must
  transmit them to the commission. Stating that the broker must submit the documents within 10 days
  adds a deadline not found in the statute, and merely notifying the salesperson and awaiting
  further instructions does not fulfill the transmission requirement.
