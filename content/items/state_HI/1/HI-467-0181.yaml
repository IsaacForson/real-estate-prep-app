stem: Under Haw. Admin. Rules § 16-99-3.1(f), what is the default authority of a real estate
  salesperson employed by a brokerage firm regarding agency disclosures?
options:
  - Mandate that the broker handle all disclosure duties personally
  - Prohibit the salesperson from making disclosures without broker approval
  - Require the salesperson to obtain written consent before making any disclosures
  - Authorize the salesperson to make disclosures unless the broker restricts them in writing
key: D
explanation: The rule states that a salesperson is authorized to make required disclosures on behalf
  of the brokerage firm unless the firm restricts them in writing. Therefore, the salesperson may
  make disclosures absent such a restriction. The distractor requiring written permission for each
  disclosure contradicts the default authority granted by the rule.
citation:
  source: Haw. Admin. Rules § 16-99-3.1(f)
  url: null
  quoted_text: Unless specifically restricted by the real estate brokerage firm in writing, any real
    estate salesperson, employed by or associated with a real estate brokerage firm, shall be
    authorized to make the required disclosures on behalf of the real estate brokerage firm.
