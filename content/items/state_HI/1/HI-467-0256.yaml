stem: A salesperson presents a signed purchase agreement to the principal broker for filing. What
  must the principal broker do with this document under Haw. Rev. Stat. § 467-1.6(b)(2)?
options:
  - The principal broker must ensure the document is included in the brokerage firm's records,
    contracts, and documents.
  - The principal broker must return the document to the salesperson for correction and request a
    revised version.
  - The principal broker must submit the document to the real estate commission for approval and
    retain a copy.
  - The principal broker must destroy the document after the transaction closes and notify the
    parties of the termination.
key: A
explanation: The statute requires the principal broker to be responsible for the brokerage firm's
  records, contracts, and documents, which includes maintaining filed purchase agreements.
  Returning, submitting to the commission, or destroying the document is not mandated by this
  provision.
