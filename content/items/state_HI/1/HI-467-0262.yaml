stem: A broker applicant formerly employed by a Hawaii brokerage firm submits a written request for
  an experience certification statement. According to Haw. Admin. Rules § 16-99-3(q), within how
  many days must the principal broker or broker-in-charge provide the statement?
options:
  - Five business days
  - Thirty calendar days
  - Fifteen calendar days
  - Ten calendar days
key: D
explanation: The rule requires the principal broker to provide the experience certification
  statement within ten days of receiving a written request, making ten calendar days the correct
  interval. The distractor of fifteen calendar days mistakenly applies the disclosure statement
  examination period from Hawaii’s seller disclosure law, which is not referenced in this rule.
