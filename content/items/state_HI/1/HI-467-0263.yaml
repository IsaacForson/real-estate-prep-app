stem: A licensee deposits a client's earnest money into his personal account and uses it to pay
  personal bills. What disciplinary action may the commission take under Haw. Admin. Rules §
  16-99-3(w)?
options:
  - The commission may issue a written warning to the licensee.
  - The commission may revoke or suspend the licensee's license.
  - The commission may impose a monetary fine on the licensee.
  - The commission may require the licensee to attend continuing education.
key: B
explanation: Under Haw. Admin. Rules § 16-99-3(w), any violation of the chapter may be cause for
  revocation or suspension of the license. Converting a client's earnest money to personal use
  violates subsection (v), triggering this penalty. A written warning is not mentioned as a possible
  consequence in the rule.
