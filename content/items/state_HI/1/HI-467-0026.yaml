stem: A licensee is representing a seller who owns a property and is considering buying it for
  personal use. According to Hawaii Administrative Rules § 16-99-3(g), what must the licensee do
  before accepting any offer?
options:
  - Reveal the interest to the purchaser in writing before any offer.
  - Reveal the interest to the principal broker in writing before any offer.
  - Reveal the interest to the seller in writing before any offer.
  - Reveal the interest to the purchaser verbally before any offer.
key: A
explanation: The rule mandates that the licensee reveal the interest to the purchaser, lessee, or
  tenant in writing prior to accepting any offer. Disclosing only to the principal broker or seller
  does not satisfy the requirement, and verbal disclosure is insufficient.
