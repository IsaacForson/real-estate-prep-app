stem: A Hawaii seller's agent cannot obtain the completed disclosure statement from the seller and
  has no written confirmation that the buyer received one. What must the seller's agent do under the
  statute?
options:
  - Prepare the disclosure statement personally for the seller
  - Cancel the purchase contract without notifying either party
  - Notify the buyer in writing of the buyer's disclosure rights
  - Withhold the buyer's earnest money until a statement is signed
key: C
explanation: When the seller's agent cannot obtain the disclosure statement and lacks written
  assurance the buyer received it, the agent must notify the buyer in writing of the buyer's
  disclosure and rescission rights, without being required to prepare the statement.
citation:
  source: Haw. Rev. Stat. § 508D-7
  url: null
  quoted_text: the seller's agent shall notify the buyer in writing of the buyer's rights to the
    disclosure statement and rights of rescission provided by this chapter. However, the seller's
    agent shall not be required to prepare the disclosure statement.
