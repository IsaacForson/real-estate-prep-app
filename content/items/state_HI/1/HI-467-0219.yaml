stem: A licensee wishes to place a 'For Sale' sign on a property listed by the brokerage firm. Under
  Haw. Admin. Rules § 16-99-3(l), what must the licensee do before placing the sign?
options:
  - The licensee must obtain written owner/seller approval and principal broker consent
  - The licensee must verbally inform the owner of the intention to place the sign
  - The licensee must place the sign and later obtain retroactive approval
  - The licensee must obtain approval only from the principal broker if the owner is unavailable
key: A
explanation: The rule prohibits placing any sign or advertisement indicating a property is for sale,
  rent, lease, or exchange without the written authorization of the owner or seller and approval of
  the principal broker or broker-in-charge. Therefore, the licensee must secure both written
  owner/seller approval and principal broker consent before placing the sign. The other options
  either lack the required written authorization, rely on verbal notice, or delay approval, which
  violates the rule.
