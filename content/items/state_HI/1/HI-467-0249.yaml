stem: Under Haw. Rev. Stat. § 467-1, what must be true of every real estate salesperson concerning
  supervision?
options:
  - The salesperson must receive a salary or hourly wage from the broker and report all earnings
    monthly.
  - The salesperson must be under the direction of a broker for all real estate transactions.
  - The salesperson must hold an active broker license and renew it every two years as required.
  - The salesperson must be employed directly by the broker and may not act independently in any
    transaction.
key: B
explanation: Hawaii Revised Statutes § 467-1 requires that every real estate salesperson be under
  the direction of a broker for all real estate transactions. The requirement that the salesperson
  receive a salary or hourly wage and report earnings monthly is not mandated by the statute;
  supervision does not dictate compensation form. The statement that the salesperson must hold an
  active broker license and renew it every two years is incorrect because a salesperson license is
  distinct from a broker license. The claim that the salesperson must be employed directly by the
  broker and may not act independently is also incorrect; the law permits salespersons to work as
  independent contractors as long as they remain under the broker's direction.
