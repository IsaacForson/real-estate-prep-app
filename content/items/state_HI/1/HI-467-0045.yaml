stem: A Hawaii real estate broker represents both the buyer and the seller in a residential
  transaction but does not obtain written consent from either party. Under Haw. Rev. Stat. §
  467-14(4), what action may the commission take?
options:
  - Refer the matter to the county prosecutor for criminal prosecution.
  - Revoke license, suspend rights, fine broker, or terminate registration.
  - Impose a fine only if the broker also commingles funds.
  - Require the broker to complete additional continuing education hours.
key: B
explanation: The statute authorizes the commission to revoke a license, suspend the right to use it,
  fine the licensee, or terminate any registration or certificate for violations such as acting for
  both parties without written consent. The other options describe actions not authorized by this
  provision.
