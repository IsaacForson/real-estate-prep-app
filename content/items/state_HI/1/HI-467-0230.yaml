stem: A Hawaii broker receives $7,500 in earnest money from a buyer and deposits the amount into the
  broker's personal checking account. Which provision of Haw. Admin. Rules § 16-99-3 is violated?
options:
  - Subsection (a) – duty to protect the public against fraud, misrepresentation, or unethical
    practices as outlined in the conduct standards
  - Subsection (e) – requirement to keep trust funds separated from the broker's own funds at all
    times
  - Subsection (v) – prohibition on converting other people's moneys to the licensee's own use for
    personal benefit
  - Subsection (f) – requirement that financial obligations and commitments be in writing and copies
    given to all parties involved
key: C
explanation: Depositing earnest money into the broker's personal account constitutes conversion of
  other people's money to the licensee's own use, which is directly prohibited by subsection (v).
  While subsection (e) also requires separation, the specific act of conversion is addressed by
  subsection (v).
