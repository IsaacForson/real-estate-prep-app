stem: A buyer receives the seller's disclosure statement on June 1. On June 18 the buyer decides to
  rescind the purchase contract but does not deliver written notification of rescission to the
  seller until June 20. What is the effect of the buyer's delay under Haw. Rev. Stat. § 508D-5(b)?
options:
  - The contract is terminated automatically and the buyer may seek damages for nondisclosure.
  - The seller is required to refund the buyer’s earnest money deposit without delay.
  - The rescission is ineffective and the disclosure statement is considered accepted under the
    statute.
  - The rescission remains valid because the buyer made the decision within the fifteen‑day review
    period.
key: C
explanation: "Under Haw. Rev. Stat. § 508D-5(b), a buyer who decides to rescind must deliver written
  notice to the seller within the fifteen‑day review period. If the notice is not delivered within
  that period, the disclosure statement is deemed accepted and the rescission is ineffective. The
  buyer’s decision to rescind on June 18, with notice delivered on June 20, misses the deadline, so
  the disclosure statement is considered accepted and the contract remains in force. The other
  answer choices are incorrect: one assumes that the decision alone terminates the contract, another
  imposes a refund requirement not provided by the statute, and the last claims the rescission
  remains valid despite the late notice."
