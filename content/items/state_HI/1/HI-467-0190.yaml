stem: A licensee who left Brokerage Alpha three months ago receives a referral fee from Brokerage
  Alpha for a client introduced while still affiliated with Alpha. The licensee is now affiliated
  with Brokerage Beta. Under Haw. Admin. Rules § 16-99-3(k), may Brokerage Beta pay the referral fee
  directly to the licensee?
options:
  - No, because the brokerage firm must pay the former brokerage firm directly.
  - No, because the licensee must first return the fee to Brokerage Alpha.
  - Yes, but only if the licensee obtains written consent from Brokerage Alpha.
  - Yes, because the exemption for compensation from a former brokerage firm applies.
key: D
explanation: Under § 16-99-3(k), the requirement to pay another brokerage firm directly does not
  apply when the licensee receives compensation from a former brokerage firm for commission earned
  while affiliated with that firm. Hence, Brokerage Beta may pay the referral fee directly to the
  licensee. The distractor claiming payment must go to the former brokerage firm ignores the
  specific exemption for former‑brokerage compensation.
citation:
  source: Haw. Admin. Rules § 16-99-3(k)
  url: null
  quoted_text: This requirement shall not apply in cases where the licensee or the licensee’s estate
    is receiving compensation from a former brokerage firm for commission earned while the licensee
    was affiliated with that former brokerage firm, regardless of whether the licensee is on
    inactive status or on forfeited status or deceased.
