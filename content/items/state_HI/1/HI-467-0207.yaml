stem: Under Hawaii Revised Statutes § 508D-5(a), within how many calendar days after acceptance of a
  real estate purchase contract must the seller provide the disclosure statement to the buyer?
options:
  - Ten calendar days
  - Thirty calendar days
  - Fifteen calendar days
  - Five calendar days
key: A
explanation: The statute states that the seller must provide the disclosure statement no later than
  ten calendar days after acceptance of the purchase contract. Therefore, ten calendar days is the
  correct period. The distractor of fifteen calendar days refers to the buyer's examination and
  rescission period, not the seller's delivery deadline.
