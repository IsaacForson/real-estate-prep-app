stem: Under Hawaii's mandatory seller disclosure law, how many calendar days does a buyer have to
  examine the disclosure statement and decide whether to rescind the purchase contract after
  receiving it?
options:
  - Ten calendar days
  - Fifteen calendar days
  - Five calendar days
  - Thirty calendar days
key: B
explanation: The statute states that upon receipt of the disclosure statement, the buyer shall have
  fifteen calendar days to examine it and decide whether to rescind the contract. The ten‑day period
  applies to the seller’s delivery deadline, not the buyer’s examination period.
citation:
  source: Haw. Rev. Stat. ch. 508D — Hawaii Revised Statutes Chapter 508D - Mandatory Seller
    Disclosures in Real Estate Transactions (data.capitol.hawaii.gov, section pages concatenated) —
    § 508D-5
  url: null
  quoted_text: "Upon receipt of the disclosure statement, the buyer shall have fifteen calendar days
    to: (1) Examine the disclosure statement; and (2) Decide whether to rescind the real estate
    purchase contract."
