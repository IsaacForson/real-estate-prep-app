  url: null
  quoted_text: A temporary principal broker or broker-in-charge arrangement shall not exceed a period
    of six months unless, prior to expiration of the initial six-month period, the principal broker
    requests and obtains, upon a showing of good cause for such extension, approval of the
    commission to extend the temporary arrangement for up to an additional six months.
