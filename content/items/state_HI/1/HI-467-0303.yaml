stem: What is the maximum total duration allowed for a temporary principal broker or
  broker-in-charge arrangement, including any permitted extension, under Haw. Admin. Rules §
  16-99-3(o)?
options:
  - Six months
  - Eighteen months
  - Nine months
  - Twelve months
key: D
explanation: The rule states that a temporary arrangement shall not exceed six months unless the
  principal broker obtains commission approval to extend it for up to an additional six months.
  Therefore, the longest permissible total period is six months plus six months, or twelve months.
  The distractor “Nine months” incorrectly assumes only a partial extension is allowed.
