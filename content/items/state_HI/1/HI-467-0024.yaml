stem: Under Hawaii Administrative Rules § 16-99-3(d), when must a licensee recommend that title be
  examined, a survey be conducted, or legal counsel be obtained?
options:
  - When the interest of either party requires it.
  - When the licensee suspects fraud or misrepresentation.
  - When the property value exceeds $500,000.
  - When the transaction involves a lease agreement.
key: A
explanation: The rule explicitly states that a licensee shall recommend title examination, survey,
  or legal counsel when the interest of either party requires it. The distractor about suspicion of
  fraud is incorrect because the rule does not tie the recommendation to fraud suspicions.
