stem: A Hawaii broker supervises licensees and sets office policies, but the broker does not treat
  them as employees. Under § 467-1.5, what authority does the real estate commission retain
  regarding the broker‑licensee relationship?
options:
  - The commission has no authority to regulate the relationship because no employer-employee
    relationship exists.
  - The commission may regulate the relationship, duties, and liabilities among brokers and
    licensees to protect the public.
  - The commission may only intervene if a written employment contract is present.
  - The commission’s authority is limited to licensing examinations only.
key: B
explanation: The statute states that the commission shall have all power necessary to regulate the
  relationships, duties, and liabilities among brokers and licensees to protect the public,
  irrespective of whether an employer-employee relationship exists. Therefore, the commission
  retains broad regulatory authority. The distractor claiming no authority ignores the commission’s
  express regulatory power under the same provision.
