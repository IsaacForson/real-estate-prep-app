stem: Under Haw. Rev. Stat. § 467-9(b), which of the following is prohibited in a real estate
  broker's license name unless approved by the commission?
options:
  - The name of a licensed broker employed by the applicant
  - The name of a franchise registered with the business division
  - The initials of an unlicensed individual
  - The name of a broker whose license is held by the applicant
key: C
explanation: "The statute prohibits a broker's license name from containing the name, initials, or
  nickname of an unlicensed person, a salesperson, or a broker whose license is not associated with
  the applicant. Therefore, the initials of an unlicensed individual are prohibited. The other
  options describe names that are expressly allowed: a franchise name, a broker whose license is
  associated, and a licensed broker employed by the applicant."
