stem: Under Hawaii Revised Statutes § 467-1.5, what is the effect of the chapter and its rules on
  the relationship between a real estate broker and the broker's licensees?
options:
  - It creates an employer-employee relationship between the broker and the licensees.
  - It creates an employer-employee relationship only if the licensee works full-time.
  - It does not create an employer-employee relationship between the broker and the licensees.
  - It creates an employer-employee relationship only if the broker pays a salary.
key: C
explanation: The statute explicitly states that nothing in the chapter or its rules shall be deemed
  to create an employer-employee relationship between a broker and the broker's licensees.
  Therefore, the correct answer is that no such relationship is deemed created. The distractor
  claiming an employer-employee relationship is created contradicts the statute's plain language.
