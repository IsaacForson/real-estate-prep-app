stem: Under Haw. Rev. Stat. § 467-12(a), what must a licensed real estate broker do with respect to
  the broker's license and any associating salesperson's license?
options:
  - The broker must display the broker's license and make the salesperson's license available upon
    request.
  - The broker must display only the broker's license in the office at the principal place of
    business.
  - The broker must display both licenses publicly at all times in the principal place of business.
  - The broker must keep the licenses in a secure, locked file at the principal place of business.
key: A
explanation: Haw. Rev. Stat. § 467-12(a) requires the broker to display the broker's license and
  make any associating salesperson's license available upon request. The other options are incorrect
  because they either require displaying only the broker's license, require displaying both licenses
  publicly at all times, or require keeping the licenses in a secure locked file, none of which
  match the statute.
citation:
  source: Haw. Rev. Stat. § 467-12(a)
  url: null
  quoted_text: A licensed real estate broker shall have and maintain a definite place of business in
    the State, in compliance with this chapter and the rules of the commission, and shall display
    therein the real estate broker's license and upon request make available any associating real
    estate salesperson's license.
