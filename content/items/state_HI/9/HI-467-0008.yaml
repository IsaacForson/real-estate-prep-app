stem: When a Hawaii brokerage firm opens a trust fund account instead of using a neutral escrow
  depository, who must the account designate as trustee?
options:
  - The commission's designated executive officer
  - The principal broker of the brokerage firm
  - The bank's local branch manager on file
  - The buyer who is named in the purchase contract
key: B
explanation: The trust fund account rule requires that the account designate the principal broker as
  trustee, and that all such accounts provide for payment of the funds upon demand.
citation:
  source: Haw. Admin. Rules § 16-99-4
  url: null
  quoted_text: The trust fund account shall designate the principal broker as trustee and all trust
    fund accounts, including interest bearing accounts, shall provide for payment of the funds upon
    demand.
