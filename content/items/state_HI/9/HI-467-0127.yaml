stem: A Hawaii licensee is assisting a seller who is selling the property as a For Sale By Owner.
  According to Haw. Admin. Rules § 16-99-3(f), what must the licensee disclose to the seller?
options:
  - The licensee must disclose only the amount of commission to be paid in the transaction.
  - The licensee must disclose who, if anyone, the licensee represents and who will pay a
    commission, if any.
  - The licensee must disclose only the licensee's representation in the transaction to the seller.
  - The licensee must disclose that no commission will be paid in the transaction to the seller.
key: B
explanation: Hawaii Administrative Rules § 16-99-3(f) requires that when a licensee assists a seller
  in a For Sale By Owner situation, the licensee must disclose who, if anyone, the licensee
  represents and who will pay a commission, if any. The option stating that the licensee must
  disclose who, if anyone, the licensee represents and who will pay a commission, if any, correctly
  reflects this requirement. The other options either omit the disclosure of who will pay a
  commission, limit the disclosure to only the licensee's representation, or incorrectly state that
  no commission will be paid.
