stem: A Hawaii broker pays a salesperson a regular salary, provides health insurance, and directs
  the salesperson’s daily activities. According to § 467-1.5, what is the legal nature of the
  relationship between the broker and the salesperson?
options:
  - The relationship is not an employer-employee relationship, despite the broker’s control and
    compensation.
  - The relationship is an employer-employee relationship because the broker pays a salary.
  - The relationship is an employer-employee relationship because the broker directs daily
    activities.
  - The relationship is an independent contractor relationship only if the salesperson signs a
    written agreement.
key: A
explanation: § 467-1.5 provides that no employer-employee relationship is deemed created regardless
  of the broker’s control, compensation, or benefits provided. Thus, even with a salary and
  direction, the relationship is not an employer-employee relationship. The distractors incorrectly
  suggest that salary or direction alone creates such a relationship, which the statute prohibits.
