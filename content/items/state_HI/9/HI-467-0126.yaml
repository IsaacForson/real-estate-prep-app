stem: A Hawaii broker plans to open a branch office in a different town. What must the broker do
  before the branch office may begin operating under Haw. Rev. Stat. § 467-12(b)?
options:
  - The broker must obtain a registration for the branch office under the chapter and commission
    rules.
  - The broker must notify the real estate commission of the branch office opening within ten days.
  - The broker must hire a licensed broker-in-charge for the branch office before opening.
  - The broker must advertise the branch office in a local newspaper prior to operation.
key: A
explanation: Under Haw. Rev. Stat. § 467-12(b), a broker must obtain a registration for a branch
  office before it may operate. Simply notifying the commission within ten days, hiring a
  broker‑in‑charge, or advertising in a newspaper does not satisfy this requirement; the
  registration must be secured prior to opening the branch office.
