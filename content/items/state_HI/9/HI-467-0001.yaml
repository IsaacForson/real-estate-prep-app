stem: Under Hawaii's principal broker statute, which of the following is a duty specifically
  assigned to the principal broker of a brokerage firm?
options:
  - Approving the advertising budget for each branch office
  - Negotiating personally on every listing the firm takes
  - Overseeing the client trust accounts and firm records
  - Filing the brokerage firm's annual state tax return
key: C
explanation: The principal broker is responsible for the client trust accounts, disbursements from
  those accounts, and the brokerage firm's accounting practices, placing that oversight squarely on
  the principal broker rather than on individual salespersons.
