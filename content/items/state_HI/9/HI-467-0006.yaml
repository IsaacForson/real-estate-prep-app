stem: A Hawaii broker receives an earnest money deposit from a buyer on a pending purchase.
  According to the commission's conduct rule, how must the broker hold this money?
options:
  - In cash kept inside a locked drawer at the main office
  - In the buyer's own bank account under the broker's name
  - In the broker's own personal checking account until closing
  - In a special account separate from the broker's own funds
key: D
explanation: The rule requires the broker to keep moneys coming into the broker's possession in
  trust for other persons, such as escrow funds and rental deposits, in special bank accounts
  separated from the broker's own funds.
citation:
  source: Haw. Admin. Rules § 16-99-3
  url: null
  quoted_text: The broker shall keep in special bank accounts, separated from the broker's own funds,
    moneys coming into the broker's possession in trust for other persons, such as escrow funds,
    trust funds, clients' moneys, rental deposits, rental receipts, and other like items.
