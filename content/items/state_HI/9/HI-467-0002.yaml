stem: Hawaii's real estate licensing chapter exempts a person handling real property under which
  type of legal authority from the licensing requirement?
options:
  - Prior experience closing similar real estate deals
  - Verbal approval given by a neighboring property owner
  - Personal familiarity with the local rental market
  - Court-appointed authority as a trustee in bankruptcy
key: D
explanation: The exception applies to a person acting as a receiver, trustee in bankruptcy, personal
  representative, or trustee acting under a trust agreement or under court authorization, not to
  informal experience or approvals.
citation:
  source: Haw. Rev. Stat. § 467-2
  url: null
  quoted_text: To any person acting as a receiver, trustee in bankruptcy, personal representative, or
    trustee acting under any trust agreement, deed of trust, or will, or otherwise acting under any
    order of authorization of any court
