stem: An unlicensed individual in Hawaii places a newspaper ad offering to negotiate the sale of a
  neighbor's house for a fee. Which statement best reflects how chapter 467 treats this conduct?
options:
  - Advertising is allowed if the neighbor consents in writing
  - Advertising is permitted so long as no sale ever closes
  - Advertising as a broker with no license is prohibited
  - Advertising is allowed once within a twelve-month period
key: C
explanation: The chapter bars a person from acting as, advertising as, or assuming to act as a real
  estate broker without first obtaining a license, so the advertisement alone is a violation.
citation:
  source: Haw. Rev. Stat. § 467-7
  url: null
  quoted_text: No person within the purview of this chapter shall act as real estate broker or real
    estate salesperson, or shall advertise, or assume to act as real estate broker or real estate
    salesperson without a license previously obtained
