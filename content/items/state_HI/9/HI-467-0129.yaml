stem: A Hawaii licensee changes employing brokerage firm on June 1. According to Hawaii
  administrative rules, what must the licensee do by June 11 to remain in compliance?
options:
  - Notify the commission in writing on the prescribed form within five days of the change
  - Notify the commission in writing on the prescribed form within ten days of the change
  - Notify the commission in writing on the prescribed form within fifteen days of the change
  - Notify the commission in writing on the prescribed form immediately upon the change
key: B
explanation: Hawaii administrative rules require that a licensee who changes employing brokerage
  firm notify the commission in writing on the prescribed form within ten days of the change, or
  place the license on inactive status. The option that says 'Notify the commission in writing on
  the prescribed form within ten days of the change' matches this requirement. The options that
  specify five days, fifteen days, or immediate notice do not comply with the rule.
citation:
  source: Haw. Admin. Rules § 16-99-1 et seq. — Hawaii Administrative Rules Title 16, Chapter 99 —
    Real Estate Brokers and Salespersons — § 16-99-5
  url: null
  quoted_text: Any individual licensee who changes employing or associating brokerage firm shall
    notify the commission in writing, on a form provided by the commission, within ten days of the
    change, or immediately place the individual's license on inactive status.
