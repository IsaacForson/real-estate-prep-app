stem: A Hawaii corporation wants to engage in real estate brokerage. Under Hawaii law, what
  condition must be satisfied for the commission to issue the corporation a broker license?
options:
  - The corporation must have a principal broker who is an officer or employee and holds a current
    active real estate broker's license.
  - The corporation must have a principal broker who is a shareholder but not an employee although
    they may own stock.
  - The corporation must have a principal broker who works as an independent consultant and is not
    employed by the corporation.
  - The corporation must have a principal broker who holds only a salesperson license and cannot act
    as a broker.
key: A
explanation: Under Haw. Rev. Stat. § 467-8, a corporation may be licensed only if its real estate
  brokerage business is under the direct management of a principal broker who is an officer or
  employee and holds a current active broker's license. The other options do not meet this
  requirement.
citation:
  source: Haw. Rev. Stat. ch. 467 — Hawaii Revised Statutes Chapter 467 — Real Estate Brokers and
    Salespersons — § 467-8
  url: null
  quoted_text: Any corporation unless the real estate brokerage business thereof is under the direct
    management of a principal broker who is an officer or employee thereof and holds a current
    active real estate broker's license.
