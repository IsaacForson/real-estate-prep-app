stem: A broker requires licensees to attend weekly sales meetings and reimburses them for
  advertising costs. According to Haw. Rev. Stat. § 467-1.5, what is the legal nature of the
  relationship between the broker and the licensees?
options:
  - It is a joint venture limited to advertising expenses.
  - It is not an employer‑employee relationship, despite the broker’s control and compensation.
  - It is an employer‑employee relationship because the broker controls the licensees’ activities.
  - It is a partnership where profits are shared equally.
key: B
explanation: Haw. Rev. Stat. § 467‑1.5 provides that nothing in the chapter or its implementing
  rules shall be deemed to create an employer‑employee relationship between a real estate broker and
  the broker’s licensees. Consequently, even though the broker directs the licensees’ activities and
  reimburses advertising costs, the relationship is not an employer‑employee one. The other answer
  choices describe a joint‑venture limited to advertising expenses, an employer‑employee
  relationship, or a partnership, none of which are supported by the statute.
