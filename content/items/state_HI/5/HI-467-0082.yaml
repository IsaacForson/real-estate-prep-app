stem: Under Haw. Rev. Stat. § 467-1, which of the following activities is expressly included in the
  definition of a "real estate broker"?
options:
  - Negotiating the sale of personal property for a fee
  - Managing or offering to manage any real estate for others
  - Preparing a title abstract for a client transaction
  - Conducting a market analysis without compensation
key: B
explanation: The definition of a real‑estate broker includes managing or offering to manage any real
  estate for others, as stated in Haw. Rev. Stat. § 467‑1. Preparing a title abstract for a client
  transaction is not included because the statute limits broker activities to real‑estate matters,
  not title work. Conducting a market analysis without compensation is not listed among the broker’s
  statutory functions. Negotiating the sale of personal property for a fee involves personal
  property, which the definition does not cover.
