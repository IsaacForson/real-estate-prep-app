stem: Under Haw. Rev. Stat. § 467-1, the term 'real estate' includes which of the following?
options:
  - Intellectual property rights
  - Personal property holdings
  - Leasehold interests in land
  - Stocks and bonds portfolio
key: C
explanation: The statute defines real estate as lands, improvements thereon, leaseholds, and all
  other interests in real property, so leasehold interests in land are included. Personal property
  holdings are not part of this definition because the statute expressly limits real estate to
  interests in real property, not personal property.
