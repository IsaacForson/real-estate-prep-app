stem: A licensee is employed by a single owner to manage and care for a rental property, but does
  not lease or rent the property. Which term best describes this individual under Haw. Rev. Stat. §
  467-1?
options:
  - Custodian or caretaker
  - Real estate broker
  - Real estate salesperson
  - Hotel operator
key: A
explanation: The definition of 'custodian or caretaker' covers an individual employed by a single
  owner for compensation to manage or care for real property left in trust, provided they do not
  lease or rent the property. Since the scenario describes management without leasing, the
  individual fits this definition. A real estate broker or salesperson would involve leasing or
  negotiating transactions, which is absent here.
