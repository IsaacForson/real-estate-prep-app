stem: "A property manager oversees the common areas of a condominium association for a fee, but does
  not lease any units. Under Haw. Rev. Stat. § 467-1, this individual would **NOT** be considered a
  custodian or caretaker because:"
options:
  - Because they receive no compensation for their services
  - Because the single owner exclusion does not apply to condominium associations
  - Because they are hired as independent contractors rather than employees
  - Because they regularly lease units to tenants
key: B
explanation: The statute specifies that a 'single owner' does not include an association of owners
  of a condominium, cooperative, or planned unit development. Therefore, managing a condominium
  association's common areas excludes the individual from the custodian or caretaker definition. The
  other options are incorrect because the individual is compensated, may be an employee or
  contractor, and does not lease units.
