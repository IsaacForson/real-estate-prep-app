stem: According to Haw. Rev. Stat. § 467-1, which of the following activities, when performed for
  compensation, constitutes acting as a real estate broker?
options:
  - Negotiating purchase of real estate for compensation
  - Advertising property for sale without compensation
  - Managing one's own personal residence real property
  - Providing legal advice on a real estate contract
key: A
explanation: The definition of a real estate broker includes anyone who, for compensation,
  negotiates the purchase or sale or exchange of real estate. Therefore, negotiating a purchase for
  compensation meets the broker definition. Advertising property for sale without compensation does
  not satisfy the compensation requirement, so it does not make the individual a broker under the
  statute.
