stem: A licensee is assisting a client in the sale of a going‑concern business that includes a
  leasehold interest in a retail space. According to Hawaii Revised Statutes § 467-1, how should
  this transaction be treated for licensing purposes?
options:
  - It is considered a real estate transaction only to the extent that the leasehold interest is
    involved
  - It is exempt from licensing because the leasehold term is less than one year
  - It requires a separate business broker license under Hawaii law
  - It is not a real estate transaction because the primary asset is a business
key: A
explanation: Under Hawaii Revised Statutes § 467‑1, any transaction that involves real estate is
  deemed a real estate transaction to the extent that the real estate component is involved, even
  when other property such as a business is also part of the deal. Because the leasehold interest is
  real property, the transaction is treated as a real estate transaction for licensing purposes. The
  choice stating that the leasehold makes the deal a real estate transaction therefore reflects the
  statute. The alternative that claims an exemption based on lease term, the one that requires a
  separate business broker license, and the one that declares the transaction not to be real estate
  all conflict with the statutory definition.
