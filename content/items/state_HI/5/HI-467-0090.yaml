stem: A seller knows that a prior occupant of the residential property tested positive for HIV.
  Under Haw. Rev. Stat. § 508D-8, may this fact be excluded from the mandatory seller's disclosure
  statement?
options:
  - The fact must be disclosed unless the buyer agrees otherwise.
  - The fact may be excluded from the disclosure statement.
  - The fact may be excluded only with written buyer consent.
  - The fact must be disclosed in the disclosure statement.
key: B
explanation: Hawaii Revised Statutes § 508D‑8 permits a seller to omit from the mandatory disclosure
  any fact that an occupant was tested for HIV. Accordingly, the seller may exclude the prior
  occupant’s HIV test result from the disclosure statement. The other choices require disclosure or
  buyer consent, which the statute does not mandate.
