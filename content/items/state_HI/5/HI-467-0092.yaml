stem: An individual is employed by a single owner to manage an apartment building and also leases
  units to multiple tenants. According to Haw. Rev. Stat. § 467-1, which term best describes this
  individual?
options:
  - Real estate salesperson
  - Property manager agent
  - Custodian caretaker
  - Real estate broker
key: D
explanation: Managing real estate for others for compensation falls under the broker definition,
  which includes managing or offering to manage any real estate for others. The individual also
  leases units, which disqualifies them from being a custodian or caretaker because the statute
  excludes anyone who leases or rents real estate for more than a single owner from that term.
