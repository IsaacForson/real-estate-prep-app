stem: A buyer acquires an easement across a neighbor’s land to access a property. Under Hawaii
  Revised Statutes § 467-1, is this easement considered part of "real estate"?
options:
  - Only if the easement is appurtenant to the dominant estate
  - Yes, because it is an interest in real property
  - Only if the easement is recorded with the bureau of conveyances
  - No, because easements are classified as personal property
key: B
explanation: The definition includes "all other interests in real property," which encompasses
  easements. Thus the easement is part of real estate. The claim that easements are personal
  property contradicts the statute, and the recording or appurtenance conditions are not required
  for inclusion.
