stem: Under Hawaii Revised Statutes § 467-1, which of the following is expressly included in the
  definition of "real estate"?
options:
  - Leaseholds
  - Mortgage notes
  - Personal property
  - Corporate stock
key: A
explanation: The definition explicitly lists leaseholds as part of real estate. Personal property,
  corporate stock, and mortgage notes are not included because the definition limits real estate to
  lands, improvements thereon, leaseholds, and other interests in real property.
