stem: A seller in Maui County is preparing a disclosure statement for a residential property that
  lies within the boundaries of a special flood hazard area as shown on FEMA flood maps. The county
  has produced tax map key–based maps showing the flood hazard area. According to Haw. Rev. Stat. §
  508D-15(a), what must the seller do?
options:
  - The seller must include the material fact information in the disclosure statement.
  - The seller may include the material fact information at the seller's discretion.
  - The seller is not required to disclose any information about flood hazard areas.
  - The seller must also disclose any permitted or unpermitted erosion control structures.
key: A
explanation: Under Haw. Rev. Stat. § 508D-15(a), when residential real property lies within a
  designated area and maps that designate the area by tax map key are available, the seller shall
  include the material fact information in the disclosure statement. The statute uses the word
  "shall," which imposes a mandatory duty rather than a permissive one, so the seller is required to
  include this information.
