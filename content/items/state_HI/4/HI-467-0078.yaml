stem: According to Hawaii Revised Statutes chapter 514B, how is a 'material fact' defined?
options:
  - It means any fact, defect, or condition, past or present, that, to a reasonable person, would be
    expected to measurably affect the value of the project, unit, or property being offered or
    proposed to be offered for sale.
  - It means a change not previously disclosed in the most recent public report that renders the
    information contained in the public report or any disclosure statement inaccurate.
  - It means the percentage of undivided interest in the common elements appurtenant to each unit,
    as expressed in the declaration, and any specified percentage of the common interest means such
    percentage of the undivided interests in the aggregate.
  - It means a portion of the common elements designated by the declaration or by operation of
    section 514B‑35 for the exclusive use of one or more but fewer than all of the units.
key: A
explanation: The definition of 'material fact' in §514B‑3 explicitly states it is any past or
  present fact, defect, or condition that a reasonable person would expect to measurably affect the
  property’s value. The other option describes a 'pertinent change,' which concerns undisclosed
  alterations that affect report accuracy, not the intrinsic effect on value.
