stem: Under Hawaii law, when it is questionable whether residential real property lies within a
  designated flood hazard area due to map ambiguity, how is the ambiguity resolved?
options:
  - The ambiguity is resolved in favor of the buyer, requiring no further action from the seller.
  - The ambiguity is resolved in favor of the seller, provided a good faith effort has been made to
    determine applicability.
  - The ambiguity is settled by a court determination to resolve the dispute before any disclosure
    can be made.
  - The ambiguity is addressed by obtaining a new survey before the seller can complete the
    disclosure statement.
key: B
explanation: Haw. Rev. Stat. ch. 508D § 508D‑15 provides that when boundary lines on large‑scale
  maps are ambiguous, the ambiguity shall be construed in favor of the seller, provided a good‑faith
  effort has been made to determine whether the disclosure requirement applies. Therefore, the
  statement that the ambiguity is resolved in favor of the seller, provided a good‑faith effort has
  been made, is the correct answer. The choice that favors the buyer is incorrect because the
  statute expressly directs the construction toward the seller.
