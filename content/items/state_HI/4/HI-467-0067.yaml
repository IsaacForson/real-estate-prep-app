stem: Under Hawaii Revised Statutes chapter 514B, how is a 'limited common element' defined?
options:
  - A portion of the common elements designated by the declaration or by operation of section
    514B‑35 for the exclusive use of one or more but fewer than all of the units.
  - Any area within a condominium building that is owned jointly by all unit owners and maintained
    for their common use, enjoyment, and access to shared facilities.
  - A unit that has been legally subdivided into two or more distinct ownership interests, each
    evidenced by a separate deed and capable of independent transfer.
  - The underlying land parcel, together with all associated easements, rights, and appurtenances,
    that supports the condominium building and its common elements.
key: A
explanation: Hawaii Revised Statutes section 514B-3 defines a limited common element as a portion of
  the common elements designated by the declaration or by operation of section 514B-35 for the
  exclusive use of one or more but fewer than all of the units. The option describing an area owned
  jointly by all unit owners for common use refers to a standard common element, not a limited one,
  and is therefore incorrect.
