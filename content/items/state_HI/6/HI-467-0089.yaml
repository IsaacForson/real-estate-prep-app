stem: A licensee wishes to act as agent for both the buyer and the seller in a transaction. What
  must the licensee obtain to comply with Hawaii agency disclosure rules?
options:
  - Written consent from the buyer only
  - Written consent from the seller only
  - Written consent from both buyer and seller
  - Written consent from either party only
key: C
explanation: The rule prohibits dual agency without the written consent of both the buyer and the
  seller. Consent from only one party or from either party alone does not satisfy this requirement.
