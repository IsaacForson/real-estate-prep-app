stem: A buyer receives the mandatory disclosure statement on June 10. By what date must the buyer
  decide whether to rescind the real estate purchase contract under Hawaii Revised Statutes §
  508D-5(b)?
options:
  - Within eighteen calendar days of receiving the disclosure statement
  - Within eight calendar days of receiving the disclosure statement
  - Within fifteen calendar days of receiving the disclosure statement
  - Within twelve calendar days of receiving the disclosure statement
key: C
explanation: The statute provides that upon receipt of the disclosure statement, the buyer shall
  have fifteen calendar days to examine the statement and decide whether to rescind the contract.
  Therefore, the buyer must decide within fifteen calendar days of receipt. The distractor
  suggesting ten days is incorrect because the statutory period is fifteen days, not ten.
