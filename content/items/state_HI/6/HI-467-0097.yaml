stem: What is the requirement regarding delivery of a copy of an agreement when parties sign as
  cotenants?
options:
  - The licensee must deliver a separate copy to each party signing the agreement.
  - The licensee must deliver the copy within three business days after signatures are obtained.
  - The licensee must deliver the copy only if the parties request it.
  - The licensee must deliver only one copy to parties signing as cotenants.
key: D
explanation: Under Hawaii Revised Statutes § 467-13, a licensee must deliver a copy of the agreement
  at the time the signatures are obtained, but only one copy is required when the parties are
  cotenants. The requirement that a separate copy be delivered to each party is incorrect because
  the rule does not mandate individual copies for cotenants. The requirement to deliver the copy
  within three business days after signatures is incorrect because delivery must occur at the time
  of signing, not after a delay. The requirement to deliver the copy only if the parties request it
  is incorrect because the statute obligates the licensee to provide the copy regardless of a
  request.
