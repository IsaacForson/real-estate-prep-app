stem: A brokerage firm receives a referral fee from another brokerage firm for a client. To comply
  with Hawaii Administrative Rules §16-99-3(k), how must the brokerage firm compensate the licensee
  of the other firm?
options:
  - Pay the other brokerage firm directly
  - Pay the licensee directly for the referral
  - Pay through the broker's trust account
  - Pay after obtaining consent from commission
key: A
explanation: The rule prohibits compensating a licensee of another brokerage firm unless payment is
  made directly to the other brokerage firm or caused to be made directly to that firm. Paying the
  other brokerage firm directly satisfies this requirement. Paying the licensee directly violates
  the rule because it bypasses the required direct payment to the brokerage firm.
