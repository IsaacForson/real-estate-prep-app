stem: A broker receives an earnest money deposit from a buyer and deposits the funds into the
  broker's personal checking account. Which statement is correct regarding this action under Hawaii
  Administrative Rules?
options:
  - The action violates the requirement to keep trust funds in special accounts separated from the
    broker's own funds.
  - The action is allowed if the broker obtains written consent from the buyer now.
  - The action is permissible because the funds are held for less than 30 days today.
  - The action is permissible provided the broker reconciles the account monthly and reports
key: A
explanation: Under Haw. Admin. Rules § 16-99-3(e), trust funds must be kept in special accounts
  separated from the broker's own funds. Depositing earnest money into a personal account violates
  this requirement, regardless of holding period or consent.
