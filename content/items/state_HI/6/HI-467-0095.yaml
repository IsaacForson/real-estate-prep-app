stem: Under Hawaii Administrative Rules §16-99-3(e), what must a broker do with moneys received in
  trust for other persons?
options:
  - Deposit them into the broker's business savings account for temporary holding.
  - Keep them in special bank accounts separated from the broker's own funds.
  - Invest them in money-market funds pending client approval.
  - Hold them in the broker's trust account alongside personal funds.
key: B
explanation: The rule requires brokers to keep trust moneys in special bank accounts separated from
  their own funds. Depositing them into a personal account violates this separation requirement.
