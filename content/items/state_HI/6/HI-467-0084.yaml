stem: Under Hawaii Revised Statutes § 467-13, when must a licensee deliver a copy of an agreement to
  the parties who signed it?
options:
  - The licensee must deliver the copy within 24 hours after obtaining signatures.
  - The licensee must deliver the copy at the time the signature is obtained.
  - The licensee must deliver the copy before receiving any compensation.
  - The licensee must deliver the copy after the contract is recorded.
key: B
explanation: The statute requires the licensee to deliver a copy of the agreement at the time the
  signature is obtained. A 24‑hour deadline, pre‑compensation delivery, or post‑recording delivery
  are not mentioned in the law.
