stem: A licensee representing a buyer in a residential purchase transaction wishes to begin
  negotiations with the seller. What must the licensee do to comply with Hawaii agency disclosure
  rules?
options:
  - Obtain written consent from both the buyer and seller to represent both parties.
  - Disclose the agency relationship to the seller before negotiations are initiated.
  - Inform the listing brokerage firm of the buyer's intent to purchase.
  - Provide the buyer with a written agency disclosure after negotiations conclude.
key: B
explanation: The rule requires a licensee representing a buyer to disclose the agency to the seller
  before negotiations are initiated. Informing only the listing brokerage firm of the buyer's intent
  does not satisfy the required agency disclosure.
citation:
  source: Haw. Admin. Rules § 16-99-3.1(h)
  url: null
  quoted_text: A licensee representing a buyer shall disclose, orally or in writing, such agency to
    the seller, or the listing brokerage firm if there is a listing brokerage firm, before
    negotiations are initiated.
