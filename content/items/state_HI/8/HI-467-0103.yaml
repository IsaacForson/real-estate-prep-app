stem: Which of the following actions constitutes commingling of client funds under Hawaii
  Administrative Rules?
options:
  - Keeping an uncashed check after acceptance of an offer when directed by the seller
  - Keeping undisputed commissions in the client trust account beyond a reasonable time after they
    have been earned
  - Keeping a minimum balance in the client trust account to keep the account open
  - Keeping an uncashed check until acceptance of an offer when directed by the buyer
key: B
explanation: Under Haw. Admin. Rules § 16-99-4, commingling includes retaining undisputed
  commissions, management fees, or other fees in the client trust account beyond a reasonable time
  after they are earned. Therefore, keeping undisputed commissions in the trust account beyond a
  reasonable time after they have been earned constitutes commingling. The other actions
  listed—keeping an uncashed check after acceptance of an offer when directed by the seller, keeping
  a minimum balance to keep the account open, and keeping an uncashed check until acceptance of an
  offer when directed by the buyer—are not considered commingling under the rule.
citation:
  source: Haw. Admin. Rules § 16-99-4
  url: null
  quoted_text: Commingling of the client's funds with other moneys shall include, but not be limited
    to, keeping undisputed commissions, management fees, and other fees in the brokerage firm’s
    client trust account beyond a reasonable time after those commissions, management fees, and
    other fees have been earned.
