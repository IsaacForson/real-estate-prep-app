stem: Under Haw. Admin. Rules §16-99-3(d), when must a licensee recommend that title be examined,
  survey be conducted, or legal counsel be obtained?
options:
  - When the seller has not disclosed known defects
  - When the interest of either party requires it
  - When the buyer is represented by an attorney
  - When the property is located in a flood zone
key: B
explanation: The rule directs the licensee to recommend title examination, survey, or legal counsel
  when the interest of either party requires it. Limiting the recommendation to buyer request,
  post‑closing, or commercial properties contradicts the rule’s language.
