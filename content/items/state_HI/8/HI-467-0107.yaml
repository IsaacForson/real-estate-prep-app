stem: Under Haw. Admin. Rules §16-99-3(f), when a licensee assists with a real property rental
  management agreement, what must the licensee ensure?
options:
  - Ensure the agreement is in writing, states exact terms, and give copies to all parties
  - Ensure the agreement is oral, outlines general terms, and give copies to the broker only
  - Ensure the agreement is in writing, states exact terms, and give copies to the principal broker
    only
  - Ensure the agreement is in writing, omits specific terms, and give copies to all parties
key: A
explanation: The rule requires the licensee to see that financial obligations and commitments,
  including rental management agreements, are in writing, express the exact agreements, set forth
  essential terms, and that copies are placed in the hands of all parties. Ensuring a written
  agreement with exact terms and providing copies satisfies this duty. Allowing oral agreements,
  even if later documented, fails the requirement that the agreement be in writing at the time of
  execution.
citation:
  source: Haw. Admin. Rules § 16-99-3(f)
  url: null
  quoted_text: The licensee, for the protection of all parties with whom the licensee deals, shall see
    that financial obligations and commitments regarding real estate transactions, including real
    property rental management agreements, are in writing, express the exact agreements of the
    parties, and set forth essential terms and conditions, and that copies of those agreements, at
    the time they are executed, are placed in the hands of all parties involved.
