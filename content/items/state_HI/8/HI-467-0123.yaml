stem: A broker holds an earnest money deposit in an interest-bearing trust account. The written
  agreement between the buyer and the broker states that the broker will pay any early withdrawal
  penalty. If the buyer withdraws the funds early and incurs a $50 penalty, who is responsible for
  paying the penalty under Hawaii Administrative Rules?
options:
  - The buyer must pay the penalty under the written agreement.
  - The broker must pay the penalty under the written agreement.
  - The principal broker's employer must pay the penalty under the written agreement.
  - The escrow depository must pay the penalty under the written agreement.
key: B
explanation: The rule mandates that the parties to the agreement determine in writing who pays any
  early withdrawal penalty. Since the agreement assigns that duty to the broker, the broker must pay
  the penalty. The other options misassign responsibility to the buyer, employer, or escrow
  depository.
citation:
  source: Haw. Admin. Rules § 16-99-4(c)
  url: null
  quoted_text: For interest bearing accounts, these same parties to the real estate agreement shall
    also agree in writing as to who shall pay for any early withdrawal penalty.
