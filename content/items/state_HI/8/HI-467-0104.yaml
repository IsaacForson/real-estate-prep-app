stem: According to Hawaii Administrative Rules, which of the following must be included in the
  records of trust funds retained by a brokerage firm?
options:
  - Reason for the brokerage firm's profit, including commission splits and overhead allocation
  - Names of the persons from whom funds are received, for whom deposited, and to whom disbursed
  - Number of employees assigned to the trust account, including their job titles and shift schedules
  - Average monthly balance of the trust account, broken down by property type and transaction date
key: B
explanation: The rule requires that trust fund records clearly indicate the names of the persons
  from whom funds are received, for whom deposited, and to whom disbursed. The other options
  describe information that is not mandated by the rule for trust fund records.
