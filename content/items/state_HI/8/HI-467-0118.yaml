stem: A licensee wants to advertise a property as available for rent in a newspaper. According to
  Haw. Admin. Rules §16-99-3(l), what must the licensee obtain before placing the advertisement?
options:
  - The licensee must obtain written authorization from the seller and approval of the principal
    broker.
  - The licensee must obtain verbal approval from the seller and written consent from the principal
    broker.
  - The licensee must obtain written authorization from the principal broker only.
  - The licensee must obtain approval from the seller, but no principal broker involvement is
    required.
key: A
explanation: Haw. Admin. Rules §16-99-3(l) prohibits placing any sign or advertisement indicating a
  property is for sale, rent, lease, or exchange without the written authorization of the owner or
  seller and approval of the principal broker or broker-in-charge. Therefore, both written seller
  authorization and principal broker approval are required. The option stating that only seller
  approval is needed is incorrect because verbal approval does not satisfy the written authorization
  requirement.
citation:
