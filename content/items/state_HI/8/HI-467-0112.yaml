stem: A principal broker receives a buyer's gold watch as trust property on a Monday. Under Hawaii
  Administrative Rules, by when must the broker place the watch in a secure place located in the
  State?
options:
  - By the next business day
  - By the second business day
  - By the fifth business day
  - By the end of the same business day
key: A
explanation: The rule requires that personal property received in trust be safeguarded by placing it
  in a secure place by the next business day. Placing it by the end of the same day is not required,
  and waiting until the second day is too late.
citation:
  source: Haw. Admin. Rules § 16-99-4(e)
  url: null
  quoted_text: Each principal broker or broker-in-charge who receives personal property, other than
    funds, in trust for other people, shall safeguard the property by placing the property by the
    next business day in a secure place located in the State.
