stem: A salesperson receives a cash deposit from a buyer on a Tuesday and receives no written
  instructions otherwise. When must the salesperson deliver the cash to the principal broker under
  Hawaii Administrative Rules?
options:
  - By the next business day
  - By the third business day
  - By the end of the same business day
  - By the fifth business day
key: A
explanation: The rule requires that property received in trust be delivered to the principal broker
  by the next business day after receipt unless otherwise instructed in writing. Delivering by the
  end of the same day is too soon and not required.
