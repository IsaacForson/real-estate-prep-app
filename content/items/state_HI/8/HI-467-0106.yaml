stem: A licensee receives a written purchase offer on a property that is listed under an unexpired
  exclusive listing agreement. According to Haw. Admin. Rules §16-99-3(j), what must the licensee do
  with the offer?
options:
  - Wait until the seller reviews the offer before forwarding it to the listing broker
  - File the offer in the office records and notify the listing broker at the next meeting
  - First consult with the buyer to confirm the offer details before sending it onward
  - Transmit the offer immediately to the listing broker who holds the exclusive listing
key: D
explanation: The rule mandates that a licensee transmit immediately all written offers to the
  listing broker with an unexpired exclusive listing. Transmitting the offer right away fulfills
  this obligation. Waiting for the seller to review the offer delays transmission and contradicts
  the immediate requirement.
citation:
  source: Haw. Admin. Rules § 16-99-3(j)
  url: null
  quoted_text: A licensee shall transmit immediately all written offers in any real estate transaction
    as defined in section 16-99-3.1 to the listing broker who has a written unexpired exclusive
    listing contract covering the property.
