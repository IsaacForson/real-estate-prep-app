stem: A licensee receives two written purchase offers on a property listed under an unexpired
  exclusive listing agreement before the seller has accepted any offer. What must the licensee do
  with the offers?
options:
  - The licensee must transmit both offers to the seller directly without involving the listing
    broker.
  - The licensee must transmit the first offer to the listing broker and discard the second offer.
  - The licensee must hold the offers until the seller selects one, then transmit only the selected
    offer to the listing broker.
  - The licensee must transmit both offers immediately to the listing broker, who then must transmit
    them to the seller for decision.
key: D
explanation: Haw. Admin. Rules §16-99-3(j) requires a licensee to transmit immediately all written
  offers to the listing broker with an unexpired exclusive listing, who must then transmit each
  offer to the seller immediately. When multiple offers are received before acceptance, any other
  formal written offer must be immediately transmitted to the owner for decision. Thus, both offers
  go to the listing broker for forwarding to the seller. The option stating that the licensee must
  transmit the first offer to the listing broker and discard the second offer is wrong because the
  licensee must not hold offers; transmission must be immediate.
citation:
  source: Haw. Admin. Rules § 16-99-1 et seq. — Hawaii Administrative Rules Title 16, Chapter 99 —
    Real Estate Brokers and Salespersons — § 16-99-3(j)
  url: null
  quoted_text: In the event that more than one formal written offer on a specific property is made
    before the owner has accepted an offer, any other formal written offer presented to the broker,
    whether by a prospective purchaser or another broker, shall be immediately transmitted to the
    owner for decision.
