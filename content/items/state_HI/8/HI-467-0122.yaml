stem: Under Hawaii Administrative Rules, for an interest-bearing trust fund account, which parties
  must agree in writing as to who shall pay for any early withdrawal penalty?
options:
  - Only the owner of the funds must agree in writing.
  - Only the principal broker must agree in writing.
  - The owner, principal broker, and parties must agree in writing.
  - The brokerage firm's employees must agree in writing.
key: C
explanation: The rule requires that for interest-bearing trust accounts, the same parties to the
  real estate agreement must agree in writing who pays any early withdrawal penalty. The other
  options incorrectly limit the responsibility to only one party or to the firm's employees.
citation:
  source: Haw. Admin. Rules § 16-99-4(c)
  url: null
  quoted_text: For interest bearing accounts, these same parties to the real estate agreement shall
    also agree in writing as to who shall pay for any early withdrawal penalty.
