stem: Under Haw. Admin. Rules §16-99-3(l), before placing a sign indicating a property is for sale,
  what must a licensee obtain?
options:
  - Owner and broker approval
  - Seller and broker consent
  - Owner and agent permission
  - Seller and broker notice
key: A
explanation: The rule requires written authorization from the owner or seller and approval of the
  principal broker or broker-in-charge before placing any sign or advertisement indicating a
  property is for sale, rent, lease, or exchange. Verbal buyer approval, a signed buyer contract, or
  commission notice do not satisfy this requirement.
