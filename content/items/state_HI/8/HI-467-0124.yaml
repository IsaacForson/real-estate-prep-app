stem: A salesperson receives a buyer's signed purchase agreement to hold in trust for the buyer.
  Under Hawaii Administrative Rules, how long must the salesperson's principal broker retain records
  of this personal property?
options:
  - The records must be retained for five years.
  - The records must be retained for two years.
  - The records must be retained for one year.
  - The records must be retained for three years.
key: D
explanation: The rule requires the principal broker to keep records of all personal property other
  than trust funds for at least three years. The other options specify shorter or longer periods
  that do not match the minimum retention period.
citation:
  source: Haw. Admin. Rules § 16-99-4(f)
  url: null
  quoted_text: The principal broker or broker-in-charge shall retain for at least three years records
    of all personal property other than trust funds coming into the possession of the principal
    broker or broker-in-charge as trustee.
