stem: Under Haw. Admin. Rules §16-99-4(c), if there is no written agreement regarding disbursement
  of accrued interest on a client trust account, to whom must the interest be paid?
options:
  - The principal broker
  - The real estate commission
  - The broker-in-charge
  - The owner of the funds
key: D
explanation: The rule states that in the absence of a written agreement, any interest accrued shall
  be paid to the owner of the funds. The principal broker or broker-in-charge may not retain that
  interest unless agreed otherwise, making those options incorrect.
