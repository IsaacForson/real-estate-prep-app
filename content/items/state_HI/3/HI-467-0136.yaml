stem: Under the Hawaii Residential Landlord‑Tenant Code, what does the term "premises" include?
options:
  - A dwelling unit, appurtenances, grounds, and facilities held out for tenant use plus any other
    area whose use is promised to the tenant
  - The dwelling unit alone, without any shared facilities, appurtenances, grounds, or held‑out
    amenities for tenants
  - The dwelling unit and any tenant‑owned personal property, excluding appurtenances, grounds, and
    facilities held out for tenant use
  - The building structure and land, but excluding any appurtenances, grounds, facilities, or
    amenities held out for tenant use
key: A
explanation: Section 521‑8 defines “premises” as a dwelling unit, its appurtenances, the grounds,
  and facilities that the landlord holds out for tenant use, and any other area or facility whose
  use is promised to the tenant. The answer that describes exactly that definition—dwelling unit,
  appurtenances, grounds, facilities held out for tenant use, plus any other promised area—is the
  correct choice. The alternative that limits the definition to the dwelling unit alone omits the
  required appurtenances, grounds, and facilities. The answer that adds tenant‑owned personal
  property includes items not in the statutory definition. The answer that limits “premises” to the
  building structure and land excludes the appurtenances, grounds, and facilities that the statute
  expressly includes.
