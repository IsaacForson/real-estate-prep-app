stem: According to Hawaii Revised Statutes § 521‑8, what does the term “premises” include?
options:
  - A dwelling unit, appurtenances thereto, grounds, and facilities held out for the use of tenants
    generally, including parking spaces.
  - A dwelling unit, appurtenances thereto, grounds, and facilities held out for the use of tenants
    generally and any other area or facility whose use is promised to the tenant.
  - A dwelling unit, appurtenances thereto, grounds, and facilities held out for the use of tenants
    generally, but not any other area or facility whose use is promised to the tenant.
  - A dwelling unit, appurtenances thereto, grounds, and facilities held out for the use of tenants
    generally, plus any additional structures not used by tenants.
key: B
explanation: Section 521‑8 defines “premises” as a dwelling unit, its appurtenances, the grounds,
  facilities held out for the use of tenants generally, and any other area or facility whose use is
  promised to the tenant. The answer that includes both the general facilities and the promised‑use
  clause matches this definition exactly. The answer that lists only the dwelling unit,
  appurtenances, grounds and general facilities omits the promised‑use language and is therefore
  incomplete.
