stem: A tenant in Hawaii pays rent by check and requests a receipt from the landlord. According to
  Hawaii Revised Statutes § 521-43(e), what must the landlord provide?
options:
  - A written receipt for the rent paid
  - A notice posted in the elevator lobby
  - A copy of the signed rental agreement
  - A statement of the tax ID number
key: A
explanation: "Under Hawaii Revised Statutes § 521‑43(e), when rent is paid by check the landlord
  must furnish a written receipt if the tenant requests one. Thus the landlord must provide a
  written receipt for the rent paid. The other answer choices describe unrelated duties: posting a
  notice in an elevator lobby, providing a copy of the signed rental agreement, and giving a
  statement of the tax identification number are not required by this subsection."
