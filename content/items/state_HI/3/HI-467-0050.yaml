stem: According to the Hawaii Residential Landlord-Tenant Code, what does "normal wear and tear" mean?
options:
  - deterioration or depreciation in value by ordinary and reasonable use but does not include items
    missing from the dwelling unit
  - damage resulting from tenant neglect, misuse, or unauthorized alterations to the premises or
    fixtures or equipment
  - any modification made to the rental unit without the landlord's written consent and approval or
    authorization for structural changes
  - the expense of repairing or replacing fixtures due to ordinary wear over the lease term or due
    to tenant-caused damage or neglect
key: A
explanation: The statute defines normal wear and tear as deterioration or depreciation from ordinary
  and reasonable use, excluding missing items. The option describing damage from tenant neglect is
  incorrect because such damage goes beyond ordinary wear and tear.
