stem: A tenant receiving public assistance in Hawaii has a rental agreement requiring rent to be
  paid on or before the third day after the public assistance check is usually received. The tenant
  wishes to change the due date to a later date. According to Hawaii Revised Statutes § 521-21(b),
  what must the tenant do to establish a new due date?
options:
  - Make a one-time payment covering the days between the original and new due dates
  - Provide written notice to the landlord at least 30 days in advance
  - Pay an additional month's rent as a fee for the change
  - Obtain a court order approving the new due date
key: A
explanation: Section 521-21(b) allows a tenant receiving public assistance to establish a new due
  date by making a one-time payment to cover the period between the original due date and the newly
  established date. The other options describe actions not authorized by the statute for this
  purpose.
citation:
  source: Haw. Rev. Stat. ch. 521 — Hawaii Revised Statutes Chapter 521 - Residential Landlord-Tenant
    Code (data.capitol.hawaii.gov, section pages concatenated) — § 521-21
  url: null
  quoted_text: When a rental agreement with a public assistance recipient requires that the rent be
    paid on or before the third day after the day on which the public assistance check is usually
    received, the tenant shall have the option of establishing a new due date by making a one-time
    payment to cover the period between the original due date and the newly established date.
