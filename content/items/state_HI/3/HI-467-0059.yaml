stem: A landlord in Hawaii wishes to increase the rent for a month-to-month tenancy effective August
  1. According to Hawaii Revised Statutes § 521-21(d), what is the latest date the landlord may give
  the written notice to the tenant?
options:
  - The notice may be given on June 18.
  - The notice may be given on June 17.
  - The notice may be given on June 16.
  - The notice may be given on June 15.
key: B
explanation: Section 521-21(d) requires written notice of a rent increase at least forty‑five
  consecutive days before the effective date. Counting back forty‑five days from August 1 gives
  June 17 as the latest date the notice may be given. A notice dated June 18 would be less than
  forty‑five days before the increase, while notices dated June 16 or June 15 would be earlier than
  required and therefore also permissible but not the latest permissible date.
citation:
  source: Haw. Rev. Stat. ch. 521 — Hawaii Revised Statutes Chapter 521 - Residential Landlord-Tenant
    Code (data.capitol.hawaii.gov, section pages concatenated) — § 521-21(d)
  url: null
  quoted_text: (d) When the tenancy is from month to month, the amount of rent for such tenancy shall
    not be increased by the landlord without written notice given forty-five consecutive days prior
    to the effective date of the increase.
