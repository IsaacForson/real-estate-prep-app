stem: A Hawaii tenant has been absent from the rental unit for twenty-two consecutive days without
  giving written notice to the landlord, and the landlord has not received any rent payments during
  that period. According to Hawaii Revised Statutes § 521-44(d), what may the landlord do with the
  security deposit?
options:
  - Retain the entire security deposit as allowed by law
  - Return the entire security deposit to the tenant
  - Retain only half of the security deposit for damages
  - Provide the tenant with a written notice of intent to sue
key: A
explanation: If a tenant is absent for twenty days or more without written notice and the landlord
  has not received rent during that period, the tenant is deemed to have wrongfully quit, allowing
  the landlord to retain the entire security deposit. Returning the deposit or retaining only half
  would be inconsistent with the statute, and providing a notice of intent to sue is not required
  under this provision.
