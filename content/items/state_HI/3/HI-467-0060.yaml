stem: A tenant in Hawaii fails to pay the monthly rent of $2,200 on time. According to Hawaii
  Revised Statutes § 521-21(f), what is the maximum late charge the landlord may impose?
options:
  - The maximum late charge is $150.
  - The maximum late charge is $160.
  - The maximum late charge is $176.
  - The maximum late charge is $180.
key: C
explanation: Section 521‑21(f) limits a late charge to no more than eight percent of the rent due.
  Eight percent of $2,200 is $176, which is the maximum permissible charge. The amounts $150 and
  $160 are lower than the allowed maximum, and the amount $180 exceeds the statutory cap.
citation:
