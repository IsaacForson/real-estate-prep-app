    Code (data.capitol.hawaii.gov, section pages concatenated) — § 521-21(f)
  url: null
  quoted_text: (f) Where the rental agreement provides for a late charge payable to the landlord for
    rent not paid when due, the late charge shall not exceed eight per cent of the amount of rent
    due.
