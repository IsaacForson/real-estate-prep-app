stem: Under Hawaii Revised Statutes § 521-71(a), how many days' written notice must a landlord give
  to terminate a month-to-month tenancy?
options:
  - 45 days
  - 28 days
  - 120 days
  - 10 days
key: A
explanation: The statute states that for a month-to-month tenancy, the landlord may terminate by
  notifying the tenant in writing at least forty-five days in advance. Therefore, forty‑five days is
  the required notice period. The twenty‑eight‑day option applies when the tenant gives notice, not
  the landlord.
