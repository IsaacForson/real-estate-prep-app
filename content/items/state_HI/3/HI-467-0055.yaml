stem: Under Hawaii's Residential Landlord-Tenant Code, what information must a landlord disclose to
  a tenant in writing at or before the commencement of tenancy regarding management and ownership?
options:
  - Disclosure of the landlord's social security number and bank account details for verification
    purposes.
  - Disclosure of the names and addresses of each person authorized to manage the premises and each
    owner or agent for service of process.
  - Disclosure of the tenant's employment history, credit score, and previous rental references for
    screening.
  - Disclosure of the property's assessed value, annual property tax amount, and insurance coverage
    details.
key: B
explanation: The statute requires landlords to disclose the name and address of each authorized
  manager and each owner or agent for service of process at or before tenancy begins. The option
  about social security numbers is not mentioned in the statute and therefore incorrect.
citation:
  source: Haw. Rev. Stat. ch. 521 — Hawaii Revised Statutes Chapter 521 - Residential Landlord-Tenant
    Code (data.capitol.hawaii.gov, section pages concatenated) — § 521-43
  url: null
  quoted_text: "A landlord or any person authorized to enter into a rental agreement on the landlord's
    behalf shall disclose to the tenant in writing at or before the commencement of the tenancy the
    name and address of: (1) Each person authorized to manage the premises; and (2) Each person who
    is an owner of the premises or who is authorized to act for or on behalf of the owner for the
    purpose of service of process and receiving and receipting for rents, notices, and demands."
