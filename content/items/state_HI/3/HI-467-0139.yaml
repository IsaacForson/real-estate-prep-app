stem: A Hawaii landlord who lives on Maui owns a rental unit on Oahu and does not deal directly with
  the tenant. According to Hawaii Revised Statutes § 521-43(f), what must the landlord do regarding
  the rental agreement?
options:
  - Designate an agent residing on Oahu to act on the landlord's behalf
  - Provide the tenant with a written copy of the rental agreement
  - Furnish a written receipt for rent at the time of payment
  - A notice posted in the elevator lobby and mailed to tenants
key: A
explanation: The rule requires an out‑of‑state landlord to name a local agent on the rental
  agreement. Subsection (f) states that any owner or landlord who resides without the State or on
  another island from where the rental unit is located shall designate on the written rental
  agreement an agent residing on the same island where the unit is located to act in the owner's or
  landlord's behalf. Therefore the landlord must designate an agent residing on Oahu. Providing a
  copy of the rental agreement is required by subsection (d) but does not satisfy the out‑of‑state
  agent requirement.
