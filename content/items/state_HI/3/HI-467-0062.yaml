stem: Under Hawaii Revised Statutes § 521-43(h), what must a landlord provide to all tenants in writing?
options:
  - A copy of the signed rental agreement
  - The landlord's general excise tax number
  - Notice of the property manager's address
  - A written receipt for each rent payment
key: B
explanation: The statute requires landlords to provide their general excise tax number to all
  tenants so they can file for a low-income tax credit. While landlords must also furnish a copy of
  the rental agreement under subsection (d), that obligation applies only when there is a written
  rental agreement, not to all tenants universally.
