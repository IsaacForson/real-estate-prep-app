stem: A landlord and tenant in Hawaii enter into a written six-month lease agreement with no special
  payment terms. According to Hawaii Revised Statutes § 521-21(b), when is rent payable under this
  agreement?
options:
  - In a single payment at the beginning of the six-month term
  - In equal monthly installments payable at the end of each month
  - In equal monthly installments payable at the beginning of each month
  - In weekly installments payable each Friday
key: C
explanation: Section 521-21(b) provides that, unless otherwise agreed, rent for longer terms is
  payable in equal monthly installments at the beginning of each month. Since the six-month lease
  has no special payment terms, rent follows this default rule. The other options either misstate
  the timing, frequency, or default rule.
