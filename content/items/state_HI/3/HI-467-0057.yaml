stem: A landlord in Hawaii terminates a rental agreement and wishes to retain part of the security
  deposit for cleaning costs. According to the Hawaii Residential Landlord-Tenant Code, within how
  many days after termination must the landlord provide the tenant with written notice of the
  retention and return any remaining deposit?
options:
  - 14 days
  - 21 days
  - 7 days
  - 30 days
key: A
explanation: The statute mandates that the security deposit, or any remainder after lawful
  deductions, must be returned to the tenant no later than fourteen days after termination, and the
  landlord must provide written notice of any retention within that same period. The seven‑day
  option incorrectly shortens the required timeframe.
citation:
  source: Haw. Rev. Stat. ch. 521 — Hawaii Revised Statutes Chapter 521 - Residential Landlord-Tenant
    Code (data.capitol.hawaii.gov, section pages concatenated) — § 521-44
  url: null
  quoted_text: The security deposit, or the portion of the security deposit remaining after the
    landlord has claimed and retained amounts authorized under this section, if any, shall be
    returned to the tenant not later than fourteen days after the termination of the rental
    agreement. If the landlord does not furnish the tenant with the written notice and other
    information required by this subsection, within fourteen days after the termination of the
    rental agreement, the landlord shall not be entitled to retain the security deposit or any part
    of it, and the landlord shall return the entire amount of the security deposit to the tenant.
