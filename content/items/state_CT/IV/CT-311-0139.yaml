stem: According to Conn. Gen. Stat. §20-327b(d), what must be included on each page of the written
  residential condition report template?
options:
  - Yes, the property's tax map number must be included on each page.
  - Yes, page numbers must be included on each page.
  - Yes, the licensee's brokerage logo must be included on each page.
  - Yes, a disclaimer about lead paint must be included on each page.
key: B
explanation: The statute explicitly requires that the template include page numbers on each page.
  The tax map number, brokerage logo, and lead paint disclaimer are not mentioned in this subsection
  as required elements.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-327b
  url: null
  quoted_text: "Such templates shall: Fit on pages being not more than eight and one-half inches in
    height and eleven inches in width, with type size no smaller than nine-point type, other than
    checkboxes or section headers, which may be in a smaller size; include the address of the
    subject property on each page; include page numbers on each page; include section headings in
    bold type and include space for the buyer and the seller's initials on each page, except the
    signature page."
