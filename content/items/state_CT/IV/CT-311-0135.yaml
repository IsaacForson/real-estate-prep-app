stem: A seller completing the Residential Foundation Condition Report for a property in a
  municipality affected by crumbling foundations becomes aware of cracking in the concrete
  foundation that may be related to pyrrhotite. According to Conn. Gen. Stat. §
  20-327b(h)(2)(B)(ii), what action must the seller take on the report?
options:
  - Attach a separate engineer's report instead of explaining
  - Mark the question as not applicable and skip explanation
  - Leave the question blank and note no explanation needed
  - Provide a written explanation of the observed damage
key: D
explanation: The rule requires the seller to explain any known damage or deterioration, including
  that caused by pyrrhotite. Therefore, the seller must provide a written explanation of the
  observed damage. The distractor suggesting to mark the question as not applicable is wrong because
  the seller's awareness triggers the explanation requirement, not an N/A response.
