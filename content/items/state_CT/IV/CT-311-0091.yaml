stem: A licensee lists a condominium for sale. According to Conn. Gen. Stat. § 20-327h(b), what must
  the licensee attach to the purchase agreement at closing?
options:
  - A copy of the property's energy-efficiency certificate issued by the local building department
  - A copy of the residential condition report completed by a licensed inspector
  - A copy of the hazardous waste facilities notice provided by the state environmental agency
  - A photocopy of the fair housing disclosure form signed by the prospective purchaser
key: D
explanation: The statute requires attaching a photocopy (or exact reproduction) of the fair housing
  disclosure form, signed by the prospective purchaser, to the purchase agreement at closing.
  Failure to attach does not void the agreement but is still required.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-327h
  url: null
  quoted_text: each person who offers a residential real property in the state for sale, exchange or
    for lease with option to buy shall attach a photocopy, duplicate original, facsimile
    transmission or other exact reproduction or duplicate of such disclosure form, signed by the
    prospective purchaser, to any purchase agreement, option or lease containing a purchase option,
    at the time of closing.
