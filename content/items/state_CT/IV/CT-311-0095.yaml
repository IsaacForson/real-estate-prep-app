stem: Under Conn. Gen. Stat. § 20-327i(a), when a buyer or renter uses an interpreter who is **NOT**
  the licensee or an employee, what must the licensee provide and obtain?
options:
  - Providing a written disclosure of the interpreter's qualifications and a copy of the purchase
    agreement.
  - Providing a form containing the prescribed language and obtaining signatures of both the buyer
    and the interpreter.
  - Providing a notarized affidavit stating the interpreter's fluency in both languages.
  - Providing a separate contract between the interpreter and the licensee for services rendered.
key: B
explanation: The statute requires the licensee to supply a form with the set language and to obtain
  signatures from both the party and the interpreter. Providing only a disclosure of qualifications
  or a separate contract does not satisfy this requirement.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-327i
  url: null
  quoted_text: "If a real estate licensee engages in the real estate business and a buyer or renter of
    real estate uses an interpreter, other than the real estate licensee or an employee of the real
    estate licensee, in conducting a real estate transaction or negotiations, the real estate
    licensee shall provide to the buyer or renter and interpreter, and obtain the buyer's or
    renter's and interpreter's signatures on, forms containing the following language:"
