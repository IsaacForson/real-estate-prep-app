stem: A licensee lists a duplex (two dwelling units) for sale. When must the residential condition
  report be provided to the prospective buyer?
options:
  - The report must be provided after the buyer signs the purchase agreement
  - The report must be provided at the time of the first showing
  - The report must be provided prior to the buyer executing any binder
  - The report must be provided only if the buyer requests it
key: C
explanation: Subsection (a) requires the report to be given at any time prior to the buyer's
  execution of a binder, contract, option, or lease containing a purchase option. Providing it only
  at the first showing does not satisfy this timing requirement.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-327b
  url: null
  quoted_text: Except as otherwise provided in this section, each person who offers residential
    property in the state for sale, exchange or for lease with option to buy, shall provide a
    written residential condition report or reports to the prospective purchaser at any time prior
    to the prospective purchaser's execution of any binder, contract to purchase, option or lease
    containing a purchase option.
