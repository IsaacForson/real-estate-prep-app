stem: A seller completing the Residential Foundation Condition Report for a property in a
  municipality affected by crumbling foundations knows that pyrrhotite is present in the concrete
  foundation. According to Conn. Gen. Stat. § 20-327b(h)(2)(B)(i), what action must the seller take
  on the report?
options:
  - Provide an explanation of knowledge
  - Leave the question unanswered
  - Mark the question as not applicable
  - Attach an additional engineering report
key: A
explanation: The rule requires the seller to explain any knowledge of pyrrhotite presence when
  answering the question. Leaving it blank, marking it N/A, or attaching a separate report does not
  satisfy the disclosure obligation.
