stem: Despite providing a Residential Foundation Condition Report, what must a real estate broker
  still do under Conn. Gen. Stat. § 20-327b(h)(3)(A)?
options:
  - Disclose any material facts about the property
  - Complete the report on behalf of the seller
  - Obtain a licensed engineer's foundation inspection
  - Provide a warranty for the foundation condition
key: A
explanation: Subsection (h)(3)(A) states that the report does not relieve a broker of the obligation
  to disclose any material facts. The other options describe actions that are either buyer’s rights
  or prohibited warranties.
