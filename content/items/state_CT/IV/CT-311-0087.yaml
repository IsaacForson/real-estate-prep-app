stem: A licensee offers to complete the Residential Foundation Condition Report on behalf of the
  seller who is transferring a property in a municipality affected by crumbling foundations. Under
  Conn. Gen. Stat. § 20-327b(h)(1), is the licensee permitted to complete the form for the seller?
options:
  - The licensee may complete the form if the seller provides written authorization
  - The licensee may complete only the buyer's certification section
  - The licensee may complete the form provided the seller reviews the answers
  - The licensee may not complete the form on behalf of the seller
key: D
explanation: "The instructions to sellers in subsection (h)(1) explicitly state: 'YOUR REAL ESTATE
  LICENSEE CANNOT COMPLETE THIS FORM ON YOUR BEHALF.' This prohibits licensees from completing the
  form for sellers regardless of authorization or review. Therefore, the licensee may not complete
  the form on behalf of the seller. The other options incorrectly suggest permissible scenarios that
  are not allowed by the statute."
