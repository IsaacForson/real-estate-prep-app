stem: According to Conn. Gen. Stat. §20-327b(d), what is the maximum allowable height and width for
  the written residential condition report template?
options:
  - 11 inches high by 8.5 inches wide
  - 8.5 inches high by 11 inches wide
  - 11 inches high by 11 inches wide
  - 8.5 inches high by 8.5 inches wide
key: B
explanation: The statute requires the template to fit on pages not more than eight and one-half
  inches in height and eleven inches in width. Therefore, the correct dimensions are 8.5 inches high
  by 11 inches wide. The distractor reversing height and width is incorrect because the statute
  specifies height first, then width.
