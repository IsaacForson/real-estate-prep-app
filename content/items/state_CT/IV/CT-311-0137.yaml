stem: According to Conn. State Agencies Reg. § 20-328-4a(b), what statement must a licensee include
  in all listing and buyer agency agreements?
options:
  - This agreement is subject to the Connecticut General Statutes prohibiting discrimination in
    commercial and residential real estate transactions (C.G.S. Title 46a, Chapter 814c).
  - This agreement is subject to the Connecticut General Statutes requiring disclosure of all known
    environmental hazards and radon testing.
  - This agreement is subject to the Connecticut General Statutes mandating a five-hundred-dollar
    credit for missing condition reports as required by local ordinance.
  - This agreement is subject to the Connecticut General Statutes governing the licensing of real
    estate appraisers and home inspectors.
key: A
explanation: The regulation explicitly requires the exact statement about discrimination
  prohibitions to be placed in all listing and buyer agency agreements. The distractor about
  environmental hazards is incorrect because it describes a different disclosure requirement not
  mandated by this regulation.
citation:
  source: Regs., Conn. State Agencies § 20-328-4a(b)
  url: null
  quoted_text: "A licensee shall place in all listing and buyer agency agreements a statement in the
    following form: This agreement is subject to the Connecticut General Statutes prohibiting
    discrimination in commercial and residential real estate transactions (C.G.S. Title 46a, Chapter
    814c)."
