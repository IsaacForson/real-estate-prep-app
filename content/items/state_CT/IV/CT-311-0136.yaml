stem: A buyer receives the Residential Foundation Condition Report and signs the buyer's
  certification. According to the buyer's certification text in Conn. Gen. Stat. § 20-327b(h)(4),
  what does the buyer acknowledge regarding the seller's knowledge?
options:
  - The buyer acknowledges that the seller remains liable for any undisclosed potential foundation
    problems
  - The buyer acknowledges that the seller must repair any foundation issues before the sale closes
  - The buyer acknowledges that the seller warrants the foundation is free of any structural defects
  - The buyer acknowledges that the seller lacks knowledge of property parts, including the
    foundation
key: D
explanation: The buyer certification states that the buyer understands there are parts of the
  property, including the foundation, for which the seller has no knowledge. Thus, the buyer
  acknowledges the seller's lack of knowledge regarding those parts. The distractor claiming a
  warranty is incorrect because the text explicitly says the report does not constitute a warranty.
