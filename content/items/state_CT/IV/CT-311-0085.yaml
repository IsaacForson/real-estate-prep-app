stem: A builder sells a newly constructed condominium that includes an implied warranty under
  chapter 827. Under Conn. Gen. Stat. §20-327b(b)(3), is a residential condition report required?
options:
  - Exempt from the residential condition report requirement
  - Subject to the residential condition report requirement
  - Requires a warranty disclosure instead of a condition report
  - Exempt only if the property is a single-family dwelling
key: A
explanation: The statute exempts transfers of newly-constructed residential real property for which
  an implied warranty is provided under chapter 827. Thus, no residential condition report is
  required. The distractor asserting the report is required fails to recognize this exemption for
  new construction with warranty.
