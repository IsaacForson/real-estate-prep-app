stem: According to the buyer's certification in the Residential Foundation Condition Report, what
  does the buyer acknowledge regarding the seller's knowledge of the property?
options:
  - The buyer acknowledges that the seller has knowledge of all parts of the property, including the
    foundation and any structural components.
  - The buyer acknowledges that the seller may have knowledge of some parts but not the foundation
    and understands that the report is limited to the seller's actual knowledge.
  - The buyer acknowledges that the seller has no knowledge of parts of the property, including the
    foundation, and the report does not encompass those parts
  - The buyer acknowledges that the seller is responsible for inspecting the foundation and any
    structural issues related to it.
key: C
explanation: The buyer's certification states that the buyer understands there are parts of the
  property, including the foundation, for which the seller has no knowledge and that the report does
  not cover those parts. Therefore the correct answer is the option stating that the buyer
  acknowledges the seller lacks knowledge of parts of the property, including the foundation, and
  that the report does not encompass those parts.
