stem: A seller fails to furnish the required written residential condition report and provides the
  purchaser with the $500 credit at closing. The seller knows of a defect that significantly impairs
  the property's value and is required to be disclosed under § 20-327b. Is the seller excused from
  disclosing that defect because of the credit?
options:
  - The seller is excused from disclosing the defect because the $500 credit satisfies the
    disclosure obligation.
  - The seller is not excused from disclosing the defect; the credit does not relieve the duty to
    disclose known material defects.
  - The seller is excused from disclosing the defect only if the defect does not significantly
    impair the property's value.
  - The seller is not required to disclose the defect if the purchaser signs a waiver acknowledging
    the credit.
key: B
explanation: Subsection (b) of § 20-327c states that a seller who provides the credit is not excused
  from disclosing any defect that meets the criteria of being subject to disclosure, within the
  seller's actual knowledge, and significantly impairing value, health/safety, or useful life. The
  distractor claiming the credit excuses disclosure directly contradicts this provision.
citation:
