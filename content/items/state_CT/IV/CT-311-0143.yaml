stem: A licensee offers a residential property for sale and provides the purchaser with the fair
  housing disclosure form required by Conn. Gen. Stat. § 20-327h(a), but forgets to attach the
  signed form to the purchase agreement at closing. What is the effect of this omission on the
  validity of the purchase agreement?
options:
  - The purchase agreement is void because the required disclosure form was not attached.
  - The purchase agreement is subject to a civil penalty of five hundred dollars for the missing
    attachment.
  - The purchase agreement is voidable at the option of the purchaser due to the missing attachment.
  - The purchase agreement remains valid and enforceable despite the missing attachment.
key: D
explanation: Subsection (c) of § 20-327h expressly provides that failure to attach the required
  disclosure form does not void an otherwise valid purchase agreement, option, or lease containing a
  purchase option. The distractor claiming the agreement is void is therefore incorrect under the
  statute.
citation:
  source: Conn. Gen. Stat. § 20-327h(c)
  url: null
  quoted_text: Failure on the part of the person who offers the property for sale, exchange or lease
    with option to buy to attach the disclosure form required by subsection (b) of this section
    shall not void an otherwise valid purchase agreement, option or lease containing a purchase
    option.
