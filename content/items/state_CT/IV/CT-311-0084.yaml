stem: A homeowner transfers his residential property to his sister with no money exchanged. Under
  Conn. Gen. Stat. §20-327b(b)(2), is a residential condition report required?
options:
  - Requires a separate affidavit of consideration
  - Requires a home inspection instead of a condition report
  - Exempt from the residential condition report requirement
  - Subject to the residential condition report requirement
key: C
explanation: The statute exempts transfers to a sibling where no consideration is paid. Therefore,
  no residential condition report is required. The distractor claiming the report is required
  overlooks this specific family-transfer exemption.
