stem: What effect do representations made by the seller in the residential foundation condition
  report have on the buyer?
options:
  - They constitute an express warranty
  - They constitute an implied warranty
  - They do not constitute a warranty
  - They create a guarantee against defects
key: C
explanation: Conn. Gen. Stat. § 20-327b(h)(3)(B) provides that any representations made by the
  seller in the residential foundation condition report do not constitute a warranty to the buyer.
  Therefore, the correct answer is that they do not constitute a warranty. The options stating that
  they constitute an express warranty, an implied warranty, or create a guarantee against defects
  are incorrect because the statute explicitly says no warranty is created.
