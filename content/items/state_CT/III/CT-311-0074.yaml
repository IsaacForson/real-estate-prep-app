stem: A salesperson completes her two‑year renewal period but does not finish the required
  continuing education. She reports to the department three months after her license period expired
  that she has now completed the CE. What fee must she pay under Conn. Gen. Stat. § 20-319(e)?
options:
  - $400
  - $625
  - $500
  - $315
key: B
explanation: The statute imposes a $625 fee when CE is completed more than two months but not later
  than four months after the license period expired. The $315 fee applies only if completion occurs
  within two months of expiration.
citation:
  source: Conn. Gen. Stat. § 20-319(e)
  url: null
  quoted_text: (1) Three hundred fifteen dollars if such licensee reports to the department, in a form
    and manner prescribed by the department, that such real estate licensee failed to satisfy such
    continuing education requirements during such license period but completed such continuing
    education requirements not later than two months after such license period expired; or (2) Six
    hundred twenty-five dollars if such licensee reports to the department, in a form and manner
    prescribed by the department, that such real estate licensee failed to satisfy such continuing
    education requirements during such license period but completed such continuing education
    requirements more than two months after such license period expired but not later than four
    months after such license period expired.
