stem: A broker appoints one affiliated salesperson to solely represent the buyer as a designated
  buyer's agent and appoints a different affiliated salesperson to solely represent the seller as a
  designated seller's agent in the same transaction. What form of agency does this arrangement
  create?
options:
  - Designated agency relationship
  - Subagency relationship
  - Dual agency relationship
  - Undisclosed agency relationship
key: A
