stem: Under Conn. Gen. Stat. § 20-325a(b), what is required for an agent to sign a listing agreement
  on behalf of the property owner?
options:
  - The agent must have oral permission from the owner to sign the agreement
  - The agent must be authorized by a written document to act on behalf of the owner
  - The agent must be a licensed broker in the state of Connecticut
  - The agent must have previously closed at least three transactions for the owner
key: B
explanation: "Under Conn. Gen. Stat. § 20-325a(b), an agent may sign a listing agreement only if the
  agent has been authorized by a written document to act on behalf of the property owner. This
  written authorization documents the agent's authority and makes it enforceable. The other options
  describe situations that the statute does not require: having only oral permission from the owner,
  being a licensed broker in Connecticut, or having previously closed at least three transactions
  for the owner. Since the statute mandates written authorization, the option stating that the agent
  must be authorized by a written document to act on behalf of the owner is correct."
