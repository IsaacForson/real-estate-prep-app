stem: Under Conn. Gen. Stat. § 20-311, what does the term 'Associate broker' mean?
options:
  - A real estate broker who is affiliated with a supervising licensee as an independent contractor
    or employed by a supervising licensee and has the authority to engage in the real estate
    business on behalf of such supervising licensee
  - A real estate broker who is affiliated with a supervising licensee as an independent contractor
    but does not have the authority to engage in the real estate business on behalf of such
    supervising licensee
  - A real estate broker who is employed by a supervising licensee but lacks the authority to engage
    in the real estate business on behalf of such supervising licensee
  - A real estate broker who works independently without any supervising licensee and may engage in
    the real estate business on their own behalf
key: A
explanation: An associate broker is a real estate broker who is affiliated with a supervising
  licensee either as an independent contractor or as an employee and who has the authority to
  conduct real estate activities on behalf of that supervising licensee, as defined in Conn. Gen.
  Stat. § 20-311.
