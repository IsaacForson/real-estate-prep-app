stem: Under Conn. Gen. Stat. § 20-311a(b), what restriction applies to the political party
  affiliation of members of the Connecticut Real Estate Commission?
options:
  - The commission shall not have a bare majority of members from the same political party.
  - The commission shall ensure that no more than half of its members belong to the same political
    party.
  - The commission shall require that at least one member represents each political party.
  - The commission shall maintain equal numbers of Democrats and Republicans on its board.
key: A
explanation: The statute explicitly states that 'Not more than a bare majority of the commission
  shall be members of the same political party.' This means the commission cannot have a majority
  (more than half) of its members from any single party. The other options either impose a stricter
  limit, require party representation, or demand equal numbers, none of which match the language of
  the law.
