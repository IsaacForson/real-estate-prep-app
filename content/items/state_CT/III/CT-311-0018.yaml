stem: An unrepresented seller asks the buyer's agent, during negotiations, to identify who the
  agent's client is. Under the disclosure statute, what must the buyer's agent do?
options:
  - Refuse to answer because client identity is confidential information
  - Disclose in writing the client's identity upon the seller's request
  - Disclose the client's identity if the seller has retained an attorney
  - Wait until closing to disclose which party the agent actually represents
key: B
explanation: The statute requires a licensee who represents a party in a transaction to disclose,
  upon request, the identity of the licensee's client to any party not represented by another
  licensee.
