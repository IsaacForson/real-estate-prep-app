stem: A broker is entitled to compensation in installments for a lease, with a portion due after the
  tenant takes possession. The broker records a claim for lien after the tenant takes possession but
  before the payment is due. Under Conn. Gen. Stat. § 20-325a(g), to what extent is the lien
  effective?
options:
  - The lien is effective for the full amount of the installment payment, regardless of whether the
    tenant still owes the landlord.
  - The lien is effective only to the extent that moneys are still owed to the transferor or lessor
    by the transferee or lessee.
  - The lien is effective only if the broker also records a separate claim for the portion due
    before possession.
  - The lien is effective only if the broker records the claim before the tenant takes possession.
key: B
explanation: Subsection (g) states that a claim for lien recorded after conveyance or lease is
  effective only to the extent moneys are still owed to the transferor or lessor by the transferee
  or lessee. The correct option states that the lien is effective only to the extent that moneys are
  still owed to the transferor or lessor by the transferee or lessee. The other options either
  ignore the limitation, add unrelated conditions, or incorrectly deny effectiveness.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-325a(g)
  url: null
  quoted_text: any claim for lien for those payments due after the conveyance or lease may be recorded
    at any time subsequent to the conveyance or lease of the real property and prior to the date on
    which the payment is due but shall only be effective as a claim for lien against the real
    property to the extent moneys are still owed to the transferor or lessor by the transferee or
    lessee
