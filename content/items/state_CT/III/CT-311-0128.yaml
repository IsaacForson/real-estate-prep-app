stem: Under Connecticut regulations, what is a 'net listing'?
options:
  - A listing where the broker's commission is a fixed percentage of the sale price to the seller
  - A listing where the broker receives as commission all excess moneys over the minimum sales price
    agreed with the seller
  - A listing where the broker must refund any amount over the agreed minimum price to the seller
  - A listing where the broker's commission is limited to the minimum sales price to the seller
key: B
explanation: "The regulation defines a net listing as a contract in which the broker receives as
  commission all excess moneys over the minimum sales price agreed upon with the seller. The correct
  option matches this definition. The other options describe different commission arrangements: one
  where the broker refunds any excess amount, one where commission is a fixed percentage of the sale
  price, and one where commission is limited to the minimum price."
citation:
  source: Regs., Conn. State Agencies § 20-328-1a
  url: null
  quoted_text: “Net listing” means a listing contract in which the broker receives as a commission all
    excess moneys over and above the minimum sales price agreed upon by the broker and seller;
