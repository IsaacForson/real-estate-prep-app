stem: A salesperson works for a broker as an independent contractor, receiving commission splits but
  no salary, and is not an employee. Under the chapter 392 definitions, what is the salesperson's
  relationship to the broker?
options:
  - The salesperson is affiliated with the supervising broker
  - The salesperson is considered an associate broker
  - The salesperson is not affiliated with the supervising broker
  - The salesperson is considered a custodial broker
key: A
explanation: The definition of affiliated includes an independent contractor relationship, so the
  salesperson is affiliated with the broker. The option stating that the salesperson is considered
  an associate broker is incorrect because the definition expressly treats independent contractor
  status as affiliation. The options stating that the salesperson is not affiliated with the
  supervising broker and that the salesperson is considered a custodial broker describe distinct
  roles that require additional criteria not met here.
