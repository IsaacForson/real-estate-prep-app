stem: A broker appoints Salesperson A to represent only the buyer and Salesperson B to represent
  only the seller in the same transaction, under separate written agreements. What agency
  relationship does this arrangement create under Conn. Gen. Stat. § 20-325i?
options:
  - Each salesperson owes fiduciary duties solely to their respective client and is not deemed a
    dual agent.
  - The appointment is invalid because only one designated agent may be appointed per transaction.
  - The brokerage is engaged in dual agency because both parties are represented by affiliated
    licensees.
  - The salespersons act as transaction brokers who owe no fiduciary duty to either party.
key: A
explanation: The statute provides that a designated agent’s primary responsibility is to satisfy the
  duties owed to the client they represent, and such an agent shall not be deemed a dual agent
  unless one individual represents both parties in the same transaction. Since each salesperson
  represents only one party, they are not dual agents. The arrangement therefore creates separate
  single agency relationships.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-325i
  url: null
  quoted_text: Upon such designation, the responsibility to satisfy the respective duties as a
    seller's or landlord's agent or as a buyer's or tenant's agent shall be the primary
    responsibility of the individual so designated, who shall not be deemed a dual agent, except in
    the case of an individual designated to represent both a seller and buyer in the same
    transaction.
