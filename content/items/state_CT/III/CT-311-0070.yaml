stem: A broker performed services under a written contract with a prospective buyer for the purchase
  of real property. The buyer has accepted the conveyance and the broker has recorded the claim for
  lien. Under Conn. Gen. Stat. § 20-325a(i), when must the claim for lien be filed at the latest?
options:
  - No later than thirty days after the conveyance or the tenant takes possession of the real
    property.
  - No later than sixty days after the conveyance or the tenant takes possession of the real
    property.
  - No later than fifteen days after the conveyance or the tenant takes possession of the real
    property.
  - No later than the date of conveyance or the tenant takes possession of the real property.
key: A
explanation: Subsection (i) states that if the broker's written contract is with a prospective
  buyer, the claim for lien must be filed no later than thirty days after the conveyance or the
  tenant takes possession of the real property. The distractor suggesting sixty days incorrectly
  doubles the statutory period.
citation:
