stem: Under Conn. Gen. Stat. § 20-311e, where must the Connecticut Real Estate Commission deposit
  all moneys received from fees?
options:
  - Deposit the moneys with the State Treasurer
  - Deposit the moneys into the Real Estate Guaranty Fund
  - Deposit the moneys to the University of Connecticut
  - Deposit the moneys into the commission's own operating account
key: A
explanation: The statute requires the commission to deposit all fee moneys with the State Treasurer.
  Only the portions earmarked for the University of Connecticut or the Real Estate Guaranty Fund are
  excluded from becoming part of the General Fund. Therefore, the correct destination is the State
  Treasurer. Depositing into the Guaranty Fund or to the University applies only to those specific
  portions, not to all moneys.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-311e
  url: null
  quoted_text: The commission shall deposit all moneys received by it from fees in accordance with the
    provisions of this chapter with the State Treasurer, and they shall, except as to that portion
    thereof required to be paid over to The University of Connecticut under the provisions of
    section 10a-125 , or that portion required to be paid to the Real Estate Guaranty Fund pursuant
    to this chapter, become part of the General Fund.
