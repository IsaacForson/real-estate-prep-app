stem: A licensee meets a prospective buyer for the first time to discuss the buyer's home search.
  Under the disclosure statute, what must the licensee tell the prospective buyer no later than that
  meeting?
options:
  - The exact total commission the licensee will earn if a sale eventually closes
  - The specific properties the licensee intends to show during the search
  - The types of agency relationships available and a confidentiality warning
  - The identity of every other buyer the licensee currently represents
key: C
explanation: The statute requires that, not later than the first personal meeting, a licensee
  disclose the types of available agency relationships and warn against sharing confidential
  information before a representation agreement exists.
citation:
  source: Conn. Gen. Stat. § 20-325d
  url: null
  quoted_text: "Not later than the first personal meeting, a real estate licensee shall: (1) Disclose
    in writing to a prospective party (A) the types of agency relationships available to the
    prospective party, and (B) that the prospective party should not share confidential information
    with the real estate licensee"
