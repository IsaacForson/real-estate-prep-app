stem: An unlicensed individual negotiates, for a fee paid by the seller, the sale of a house that
  belongs to someone else. Under the chapter 392 definitions, this negotiating activity for a fee is
  described by which term?
options:
  - Advertising conducted on behalf of a school
  - Engaging in the real estate business for a fee
  - Acting as a custodial broker for an incapacitated broker
  - Serving as a designated broker for a business entity
key: B
explanation: The statute defines engaging in the real estate business as acting for another for a
  fee or other valuable consideration to negotiate, sell, exchange, buy, or rent an interest in real
  estate.
