stem: A broker who is licensed and is temporarily appointed to conclude the real estate business
  matters of another broker who has died is acting in which capacity under Conn. Gen. Stat. §
  20-311?
options:
  - The associate broker who is affiliated with a supervising licensee and has authority to engage
    in the real estate business on behalf of that licensee
  - The leasing agent who collects security deposits and attempts to negotiate rentals for a
    property owner for a fee
  - The custodial broker who is licensed and temporarily appointed to conclude the real estate
    business matters of a deceased or incapacitated broker
  - The designated buyer agent who represents a named buyer client under a buyer representation
    agreement
key: C
explanation: The description matches the definition of a custodial broker, a licensed broker
  temporarily appointed to conclude the business matters of a deceased or incapacitated broker. The
  description of an associate broker involves ongoing affiliation with a supervising licensee and
  authority to act on that licensee’s behalf, which is not a temporary appointment for a deceased
  broker.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-311
  url: null
  quoted_text: “Custodial broker” means any individual who is (A) licensed as a real estate broker,
    and (B) temporarily appointed solely to (i) conclude the real estate business matters of another
    broker who is deceased or incapacitated, (ii) transition such matters to a real estate broker
    who is alive and not incapacitated, or (iii) assist in transitioning the deceased or
    incapacitated broker's ownership interest in a business entity that is engaged in the real
    estate business for the purpose of satisfying the requirements established in section 20-312
