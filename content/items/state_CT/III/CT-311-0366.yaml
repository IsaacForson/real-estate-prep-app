stem: According to Conn. Gen. Stat. § 20-325g, when must a written dual agency consent agreement be
  executed to create a conclusive presumption of informed consent?
options:
  - After the purchase agreement is signed but before the closing of the transaction.
  - Prior to executing any contract for purchase, sale, or lease of real estate.
  - At the same time as the listing agreement is signed for the property.
  - Within 24 hours after the buyer makes a written offer.
key: B
explanation: The statute explicitly states that the written consent must be executed prior to
  executing any contract or agreement for the purchase, sale, or lease of real estate to trigger the
  conclusive presumption of informed consent. This timing requirement is strict; consent obtained
  after a contract is signed does not create the presumption. The other options either delay consent
  beyond the required point or tie it to unrelated events.
