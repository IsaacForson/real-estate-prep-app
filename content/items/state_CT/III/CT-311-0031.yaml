stem: According to Conn. Gen. Stat. § 20-311, how is an 'Associate broker' defined?
options:
  - The real estate broker who is affiliated with a supervising licensee as an independent
    contractor or employed by a supervising licensee, and has the authority to engage in the real
    estate business on behalf of such supervising licensee
  - The real estate broker who is not affiliated with any supervising licensee and engages in the
    real estate business solely for personal profit, and does not act on behalf of any supervising
    licensee, operating independently without any authority to bind such licensee in transactions
  - The real estate salesperson who is employed by a supervising licensee and is limited to showing
    properties without negotiating offers, and may not prepare offers, counteroffers, or any
    contractual documents on behalf of clients
  - The individual who holds a real estate license but is not affiliated with any supervising
    licensee and may not engage in the real estate business for a fee, and is prohibited from
    receiving compensation for any real estate services, regardless of whether they act as a broker
    or salesperson
key: A
explanation: The definition of an associate broker requires affiliation with a supervising licensee
  and authority to act on that licensee's behalf, which matches the description of a real estate
  broker who is affiliated with a supervising licensee as an independent contractor or employed by a
  supervising licensee, and has the authority to engage in the real estate business on behalf of
  such supervising licensee. The description of a broker who is not affiliated with any supervising
  licensee and engages in the real estate business solely for personal profit contradicts the
  affiliation requirement.
