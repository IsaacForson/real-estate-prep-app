explanation: The definition of 'designated buyer agent' applies to a licensee who is designated by
  their broker to solely represent a named buyer or tenant client during a buyer representation
  agreement. The scenario matches this definition exactly. The distractor 'designated seller agent'
  is incorrect because the licensee represents a buyer, not a seller.
