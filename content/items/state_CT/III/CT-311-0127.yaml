math:
  worked_solution: "Total fees collected: $12,000. Subtract amount for University of Connecticut:
    $12,000 - $2,000 = $10,000. Subtract amount for Real Estate Guaranty Fund: $10,000 - $1,000 =
    $9,000. The remaining amount is $9,000."
