stem: The Connecticut Real Estate Commission collects $12,000 in fees during a quarter. Of this
  amount, $2,000 must be paid to The University of Connecticut under section 10a-125 and $1,000 must
  be paid to the Real Estate Guaranty Fund. According to Conn. Gen. Stat. § 20-311e, what happens to
  the remaining $9,000?
options:
  - It becomes part of the General Fund after deposit with the State Treasurer
  - It is retained by the commission for operating expenses
  - It is returned to the fee payers as a refund payment
  - It is split equally between the University of Connecticut and the Guaranty Fund
key: A
explanation: After setting aside the required amounts for the University of Connecticut and the
  Guaranty Fund, the remainder of the fees becomes part of the General Fund when deposited with the
  State Treasurer, as required by Conn. Gen. Stat. § 20-311e.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-311e
  url: null
  quoted_text: The commission shall deposit all moneys received by it from fees in accordance with the
    provisions of this chapter with the State Treasurer, and they shall, except as to that portion
    thereof required to be paid over to The University of Connecticut under the provisions of
    section 10a-125 , or that portion required to be paid to the Real Estate Guaranty Fund pursuant
    to this chapter, become part of the General Fund.
