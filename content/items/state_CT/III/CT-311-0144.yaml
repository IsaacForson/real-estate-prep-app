stem: Under Conn. Gen. Stat. § 20-311(1), which of the following is **NOT** considered "advertising"?
options:
  - An email blast to prospective buyers announcing a new listing
  - A video tour posted on a real estate website
  - A newspaper advertisement promoting a property for sale
  - A press release sent to a newspaper for public relations with no charge
key: D
explanation: Under Conn. Gen. Stat. § 20-311(1), a press release sent to a newspaper for public
  relations purposes with no charge is excluded from the definition of advertising. The other
  options describe communications that promote a property for sale or lease and therefore constitute
  advertising.
