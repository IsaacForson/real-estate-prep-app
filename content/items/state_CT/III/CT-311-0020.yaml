stem: A broker's written contract for a commission does not have any contingencies left except the
  closing of title, and the broker records a claim for lien before the property is actually
  conveyed. Under the broker's lien statute, what is the legal effect of recording at that point?
options:
  - The lien does not attach because liens may be recorded after conveyance
  - The lien attaches automatically once the listing agreement is signed
  - The lien is void because brokers may not record liens on real property
  - The lien attaches because recording occurred before the conveyance
key: D
explanation: The statute provides that the lien does not attach until the broker is entitled to
  compensation without remaining contingencies and has recorded the claim for lien prior to the
  actual conveyance or lease of the property.
citation:
  source: Conn. Gen. Stat. § 20-325a
  url: null
  quoted_text: the lien provided for in this section shall not attach until the broker is entitled to
    compensation, without any contingencies, other than closing or transfer of title, under the
    terms set forth in the written listing or buyer representation contract and the broker has
    recorded the claim for lien prior to the actual conveyance
