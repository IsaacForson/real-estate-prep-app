stem: Two salespersons have a dispute over a commission and both agree to submit it to the Real
  Estate Commission for arbitration. Under Conn. Gen. Stat. § 20-311f, what authority allows the
  commission to resolve this disagreement?
options:
  - The commission's power to discipline licensees
  - The commission's power to adopt regulations
  - The commission's power to act as a board of arbitration
  - The commission's power to issue subpoenas
key: C
explanation: The statute expressly grants the commission the power to act as a board of arbitration
  to consider and decide any dispute over commissions arising between brokers or salespersons that
  is voluntarily submitted by the parties. The distractor about subpoena power is incorrect because
  § 20-311f does not mention subpoena authority.
