stem: According to Conn. Gen. Stat. § 20-325a(l), which of the following must be included in a claim
  for lien filed by a real estate broker?
options:
  - The claimant's name, the owner's name, a description of the real property, the amount of the
    lien, and the broker's email address.
  - The claimant's name, the owner's name, a description of the real property, the amount of the
    lien, and the broker's business address.
  - The claimant's name, the owner's name, a description of the real property, the amount of the
    lien, and the date the broker first met the client.
  - The claimant's name, the owner's name, a description of the real property, the amount of the
    lien, and the broker's real estate license number.
key: D
explanation: Subsection (l) explicitly requires the claim for lien to state the claimant's name, the
  owner's name, a description of the real property, the amount of the lien, and the broker's real
  estate license number, along with a sworn statement and signature. The distractor substituting the
  date the broker first met the client is incorrect because the statute does not require that date.
