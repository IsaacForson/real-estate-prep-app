stem: A broker employs a salesperson and designates that salesperson to represent only a specific
  buyer client in a transaction, under a buyer representation agreement. What is this salesperson
  called?
options:
  - Leasing agent
  - Designated seller agent
  - Designated buyer agent
  - Promotional note
key: C
explanation: The statute defines a designated buyer agent as a licensee designated by the broker to
  solely represent a named buyer or tenant client during the term of a buyer representation
  agreement; therefore the salesperson is a designated buyer agent. The other options describe
  different roles that do not match this definition.
