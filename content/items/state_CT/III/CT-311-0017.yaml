stem: A broker and a salesperson disagree over how a commission should be split and both voluntarily
  agree to submit the dispute to the Real Estate Commission. What authority allows the commission to
  resolve this disagreement?
options:
  - The commission's power to act as an arbitration board over such disputes
  - The commission's power to unilaterally revoke both parties' real estate licenses
  - The commission's authority to issue a binding criminal fine on either party
  - The commission's exclusive jurisdiction to hear civil contract claims
key: A
explanation: The statute gives the commission power to act as a board of arbitration to decide
  commission disputes between brokers or salespersons that the parties voluntarily submit to it.
citation:
  source: Conn. Gen. Stat. § 20-311f
  url: null
  quoted_text: The commission shall have the power to act as a board of arbitration to consider and
    decide any dispute over commissions arising between brokers or salespersons that is voluntarily
    submitted to the commission by the parties
