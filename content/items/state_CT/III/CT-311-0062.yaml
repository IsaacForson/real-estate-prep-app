stem: Where must the Connecticut Real Estate Commission deposit fees it receives, **EXCEPT** for
  amounts required to be paid to the University of Connecticut or the Real Estate Guaranty Fund?
options:
  - The State Treasurer’s account
  - The State of Connecticut General Fund
  - The Real Estate Guaranty Fund
  - The University of Connecticut Fund
key: B
explanation: The statute says that after depositing fees with the State Treasurer, any amount not
  required to be paid to the University of Connecticut or the Guaranty Fund becomes part of the
  General Fund. Therefore, the residual goes to the General Fund. The State Treasurer’s account is
  only the initial deposit location, not the final fund after the statutory exclusions.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-311e
  url: null
  quoted_text: The commission shall deposit all moneys received by it from fees in accordance with the
    provisions of this chapter with the State Treasurer, and they shall, except as to that portion
    thereof required to be paid over to The University of Connecticut under the provisions of
    section 10a-125 , or that portion required to be paid to the Real Estate Guaranty Fund pursuant
    to this chapter, become part of the General Fund.
