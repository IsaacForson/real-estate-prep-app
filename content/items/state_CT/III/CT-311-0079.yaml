stem: A licensee wishes to send the required first-meeting disclosures to a prospective buyer via
  email. Is this permissible under Connecticut law?
options:
  - Under Connecticut law, the disclosures may be delivered electronically to the prospective party.
  - Under Connecticut law, the disclosures must be provided in writing at the first meeting.
  - Under Connecticut law, the disclosures may be sent electronically if the prospective party
    consents.
  - Under Connecticut law, the disclosures may not be transmitted by electronic means unless
    otherwise agreed.
key: A
explanation: Connecticut statute expressly states that the disclosures required pursuant to this
  subsection may be delivered electronically to the prospective party. Therefore, electronic
  delivery is allowed without needing the prospective party’s consent or a paper copy.
