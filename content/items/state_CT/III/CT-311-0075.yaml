  url: null
  quoted_text: For listing agreements entered into on or after October 1, 2004, if the broker permits
    licensees not affiliated with the broker to advertise the real estate, the real estate broker
    shall disclose such permission and all exceptions to the advertising on the listing agreement
    and obtain the owner’s or lessor’s authorization for such advertising.
