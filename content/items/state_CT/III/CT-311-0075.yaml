stem: A broker wants to allow salespersons who are not affiliated with his brokerage to advertise
  listings. According to Regs., Conn. State Agencies § 20-328-6a(a)(1), what must the broker do
  before permitting such advertising?
options:
  - Disclosing permission and exceptions and obtaining owner’s authorization
  - Obtaining owner’s authorization and disclosing permission
  - Disclosing permission and obtaining owner’s authorization
  - Providing written advertising consent to the property owner
key: A
explanation: The regulation requires the broker to disclose both the permission and all exceptions
  to the advertising on the listing agreement and to obtain the owner’s or lessor’s authorization.
  Options that omit the exception disclosure or substitute a different action do not satisfy the
  rule.
