stem: Under Conn. Gen. Stat. § 20-325a(b)(6), what statement must be included in a contract or
  authorization pertaining to real property?
options:
  - "The statement must read: “THE REAL ESTATE BROKER MAY BE ENTITLED TO CERTAIN LIEN RIGHTS
    PURSUANT TO SECTION 20-325b OF THE CONNECTICUT GENERAL STATUTES”."
  - "The statement must read: “THE REAL ESTATE BROKER MAY BE ENTITLED TO CERTAIN LIEN RIGHTS
    PURSUANT TO SECTION 20-325a OF THE CONNECTICUT GENERAL STATUTES”."
  - "The statement must read: “THE REAL ESTATE BROKER IS GUARANTEED TO RECEIVE A LIEN PURSUANT TO
    SECTION 20-325a OF THE CONNECTICUT GENERAL STATUTES”."
  - "The statement must read: “THE REAL ESTATE BROKER MAY BE ENTITLED TO CERTAIN LIEN RIGHTS
    PURSUANT TO SECTION 20-325a OF THE CONNECTICUT GENERAL STATUTES, AND MUST BE NOTARIZED”."
key: B
explanation: The statute requires the exact wording that the broker may be entitled to certain lien
  rights pursuant to § 20-325a. The other choices either change the wording, cite a different
  statute section, claim a guaranteed lien, or add a notarization requirement, none of which appear
  in the law.
