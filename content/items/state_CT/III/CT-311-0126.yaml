stem: A Connecticut real estate broker collects $5,000 in license renewal fees from salespersons and
  submits them to the Real Estate Commission. According to Conn. Gen. Stat. § 20-311e, where must
  the commission deposit these fees?
options:
  - Deposit the fees into the Real Estate Guaranty Fund
  - Deposit the fees to the University of Connecticut
  - Deposit the fees with the State Treasurer
  - Deposit the fees into the commission's own account
key: C
explanation: The statute mandates that all fee moneys be deposited with the State Treasurer, unless
  a specific portion is required to be paid to the University of Connecticut or the Real Estate
  Guaranty Fund. Since the scenario does not mention any such required payments, the entire $5,000
  must go to the State Treasurer. The other options describe destinations that apply only to
  exempted portions, not to the full amount.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-311e
  url: null
  quoted_text: The commission shall deposit all moneys received by it from fees in accordance with the
    provisions of this chapter with the State Treasurer, and they shall, except as to that portion
    thereof required to be paid over to The University of Connecticut under the provisions of
    section 10a-125 , or that portion required to be paid to the Real Estate Guaranty Fund pursuant
    to this chapter, become part of the General Fund.
