stem: An individual who is not a real estate licensee collects security deposits and attempts to
  negotiate rental agreements for a property owner in exchange for a fee. Under Conn. Gen. Stat. §
  20-311, how is this individual classified?
options:
  - The leasing agent who acts as an agent for a principal for a fee and engages in leasing or
    renting activity including collecting security deposits and attempting to negotiate rentals
  - The associate broker who is affiliated with a supervising licensee and has authority to engage
    in the real estate business on behalf of that licensee
  - The custodial broker who is licensed and temporarily appointed to conclude the real estate
    business matters of a deceased broker
  - The designated seller agent who represents a named seller or landlord client of the real estate
    broker during the term of a listing agreement
key: A
explanation: The definition of a leasing agent covers any non‑licensee who acts as an agent for a
  principal for a fee and engages in leasing activity such as collecting security deposits and
  attempting to negotiate rentals, which fits the scenario. The associate broker who is affiliated
  with a supervising licensee and has authority to engage in the real estate business on behalf of
  that licensee does not apply because the individual is not affiliated with a supervising licensee.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-311
  url: null
  quoted_text: “Leasing agent” means any individual, other than a real estate licensee, who (A) acts
    as an agent for a principal for a commission, fee or other valuable consideration, and (B)
    engages in leasing or renting activity, including, but not limited to, (i) collecting security
    deposits, (ii) offering or attempting to negotiate a rental, or (iii) collecting, offering or
    attempting to collect rent for the use of real estate;
