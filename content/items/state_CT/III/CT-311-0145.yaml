stem: A broker dies, and another licensed broker is appointed to wrap up the deceased broker's
  listings and transfer them to a living broker. Under Conn. Gen. Stat. § 20-311(8), what is the
  appointed broker called?
options:
  - Designated broker
  - Associate broker
  - Custodial broker
  - Supervising licensee
key: C
explanation: The statute defines a custodial broker as a licensed broker temporarily appointed
  solely to conclude the real estate business matters of another broker who is deceased or
  incapacitated; thus the appointed broker is a custodial broker. The other options describe a
  designated broker, an associate broker, and a supervising licensee, which are different licensing
  roles that do not match this temporary appointment.
