stem: A licensee refers a homebuyer client to a mortgage lender and, in exchange, the lender pays
  the licensee a referral fee. What does Connecticut law say about this payment?
options:
  - The referral fee is permitted if the buyer consents to it in writing
  - The referral fee is permitted for commercial real estate transactions
  - No licensee may receive a fee for referring a buyer to a lender
  - The referral fee is permitted if disclosed on the closing statement
key: C
explanation: The statute prohibits a real estate licensee from receiving a fee, commission, or other
  referral fee for referring a buyer of real property to a mortgage broker or lender.
citation:
  source: Conn. Gen. Stat. § 20-320a
  url: null
  quoted_text: No real estate licensee, no person affiliated with a real estate licensee, and no
    person engaging in the real estate business may receive a fee, commission or other form of
    referral fee for the referral of any buyer of real property
