stem: Under Conn. Gen. Stat. § 20-325b, which type of agreement fixing compensation is exempt from
  the required commission notice?
options:
  - Written listing agreements
  - Oral compensation agreements
  - Buyer representation agreements
  - Lease agreements over one year
key: B
explanation: The statute requires the notice only in written agreements that fix compensation; oral
  agreements are not subject to this requirement. Therefore, an oral agreement for compensation does
  not need to contain the notice. The distractor “Written listing agreements” is incorrect because
  such agreements are written and thus must include the notice.
