stem: A real estate brokerage corporation changes its designated broker on April 10. By what date
  must the corporation notify the commission of this change to comply with Connecticut law?
options:
  - April 17
  - April 20
  - May 10
  - May 15
key: C
explanation: Under Conn. Gen. Stat. § 20-312(c), a brokerage must notify the commission within
  thirty days of a designated broker change. Counting thirty days from April 10 gives May 10 as the
  latest permissible date. April 17 and April 20 are earlier dates within the thirty‑day window,
  while May 15 is after the deadline.
citation:
  source: Conn. Gen. Stat. § 20-312(c)
  url: null
  quoted_text: Such business entity shall notify the commission of any change in the identity of, or
    contact information for, such designated broker not later than thirty days after such change
    becomes effective.
