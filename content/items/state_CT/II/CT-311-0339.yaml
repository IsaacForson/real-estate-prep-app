stem: A licensee changes the listing price of a property on Wednesday at 2:00 PM. By what date and
  time must the licensee update the listing to comply with Conn. Regs § 20-328-5a(d)?
options:
  - Saturday 2:00 PM
  - Friday 2:00 PM
  - Sunday 2:00 PM
  - Thursday 2:00 PM
key: A
explanation: Adding seventy‑two (72) hours to Wednesday 2:00 PM yields Saturday 2:00 PM, which
  satisfies the update deadline. The Thursday 2:00 PM option represents only forty‑eight (48) hours
  later, which is insufficient under the rule.
citation:
  source: Regs., Conn. State Agencies § 20-328-5a(d)
  url: null
  quoted_text: Updating such listing within seventy-two (72) hours after any change to the listing;
  secondary: []
math:
