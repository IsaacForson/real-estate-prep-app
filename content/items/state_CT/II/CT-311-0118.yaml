stem: A licensee hires an unlicensed assistant to handle paperwork and pays them a salary. Under
  Connecticut law, is the assistant considered affiliated with the licensee?
options:
  - It is affiliated because the assistant has an employer-employee relationship with the licensee.
  - It is not affiliated because the assistant is not a licensed real estate professional.
  - It is affiliated only if the assistant holds a real estate license.
  - It is not affiliated because the assistant performs only clerical tasks.
key: A
explanation: Conn. Gen. Stat. § 20-311(2) defines ‘affiliated’ as having a working relationship with
  a real estate licensee by way of an employer‑employee or independent‑contractor relationship.
  Because the assistant is paid a salary, they have an employer‑employee relationship with the
  licensee, so they are affiliated. The idea that the assistant is not affiliated because they lack
  a real estate license is incorrect; affiliation does not depend on the assistant’s licensure.
citation:
