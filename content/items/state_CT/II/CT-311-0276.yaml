stem: Under Conn. Gen. Stat. § 20-311f, if a dispute over commissions between two brokers is **NOT**
  voluntarily submitted to the Real Estate Commission, what action may the commission take regarding
  arbitration?
options:
  - The commission may impose a fine on both brokers for failing to submit
  - The commission may refer the dispute to the Attorney General for prosecution
  - The commission may still act as a board of arbitration and decide the dispute
  - The commission may take no action to arbitrate the dispute
key: D
explanation: The statute grants the commission arbitration power only for disputes that are
  voluntarily submitted by the parties. When a dispute is not voluntarily submitted, the commission
  lacks authority to act as a board of arbitration, so it may not take any arbitration action. The
  other options either exceed the granted power or introduce actions not authorized by this
  provision.
citation:
  source: Conn. Gen. Stat. § 20-311f
  url: null
  quoted_text: The commission shall have the power to act as a board of arbitration to consider and
    decide any dispute over commissions arising between brokers or salespersons that is voluntarily
    submitted to the commission by the parties to such dispute.
