stem: A licensee sends an email to past clients announcing a new office location and offering a free
  market analysis. Under Connecticut law, is this email considered advertising?
options:
  - It is advertising because it is written or photographic material disseminated via electronic
    mail.
  - It is not advertising because it is a press release delivered to a media outlet for general
    information.
  - It is not advertising because it is stockholder communication such as an annual report.
  - It is advertising because it includes outdoor signage distributed to the public.
key: A
explanation: Under Conn. Gen. Stat. § 20-311(1)(A)(iii), advertising includes written or
  photographic material disseminated via electronic mail, which describes the licensee's email. The
  statement that the email is not advertising because it is a press release delivered to a media
  outlet for general information is incorrect; the press‑release exemption applies only when no
  charge is imposed by the media outlet, which is not relevant here.
