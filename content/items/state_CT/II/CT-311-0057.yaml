stem: Under Connecticut law, what happens to fees collected by the Real Estate Commission that are
  **NOT** required to be paid to the University of Connecticut or the Real Estate Guaranty Fund?
options:
  - The fees are deposited with the State Treasurer and become part of the General Fund.
  - The fees are forwarded to the Real Estate Guaranty Fund to support claims.
  - The fees are transferred to the University of Connecticut for real estate education programs.
  - The fees are retained by the commission to cover its administrative costs.
key: A
explanation: Under Conn. Gen. Stat. § 20-311e, fees received by the commission must be deposited
  with the State Treasurer; except for amounts earmarked for the University of Connecticut or the
  Real Estate Guaranty Fund, the remainder becomes part of the General Fund. Therefore, the correct
  answer is that the fees are deposited with the Treasurer and become part of the General Fund. The
  distractor claiming the fees are retained by the commission for operational expenses contradicts
  the statutory requirement that fees be deposited with the Treasurer and not kept by the
  commission.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-311e
  url: null
  quoted_text: The commission shall deposit all moneys received by it from fees in accordance with the
    provisions of this chapter with the State Treasurer, and they shall, except as to that portion
    thereof required to be paid over to The University of Connecticut under the provisions of
    section 10a-125 , or that portion required to be paid to the Real Estate Guaranty Fund pursuant
    to this chapter, become part of the General Fund
