stem: A licensee is found guilty of three separate violations of §20-320(a). What is the maximum
  total fine that may be imposed?
options:
  - $5,000
  - $10,000
  - $15,000
  - $20,000
key: C
explanation: Each violation can draw a fine up to $5,000; three violations therefore allow a maximum
  total of 3 × $5,000 = $15,000. The distractor $10,000 assumes only two violations, which
  undercounts the number of violations.
