stem: Under Conn. Gen. Stat. § 20-312(c), how many days does a business entity have to notify the
  commission of a change in the contact information for its designated broker?
options:
  - Twenty days
  - Twenty-five days
  - Thirty days
  - Thirty-five days
key: C
explanation: Under Conn. Gen. Stat. § 20-312(c), a business entity must notify the commission of any
  change in the identity of, or contact information for, its designated broker within thirty days
  after the change becomes effective. This thirty‑day period is the statutory requirement, making
  the thirty‑day option correct.
