stem: A broker wants a real estate licensee's compensation structure to qualify the licensee as an
  independent contractor rather than an employee for workers' compensation purposes. What must the
  written contract require regarding the licensee's pay?
options:
  - A fixed hourly wage that stays the same regardless of sales or leases
  - A flat monthly salary supplemented by occasional output bonuses
  - A retainer paid up front before any sales or leasing activity begins
  - A commission tied to gross sales, directly related to output
key: D
explanation: The statute requires the licensee be paid a commission based on gross sales or leases,
  directly related to sales or other output, without deduction for taxes.
citation:
  source: Conn. Gen. Stat. § 20-312b
  url: null
  quoted_text: The real estate licensee shall be paid a commission based on such real estate
    licensee's gross sales or leases, if any, without deduction for taxes, which commission shall be
    directly related to sales, leases or other output
