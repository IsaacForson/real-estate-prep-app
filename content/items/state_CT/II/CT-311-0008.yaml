stem: A broker deposits client trust deposits into the broker's personal operating account instead
  of a separate escrow account and uses the mixed funds to cover office expenses. Which listed
  ground for suspension or revocation of the broker's license does this conduct establish?
options:
  - Made a false promise of a character likely to influence or persuade
  - Commingled funds of others with the real estate licensee's own funds
  - Failed to deliver immediately a copy of an instrument to a party
  - Entered into a listing contract with an automatic continuation clause
key: B
explanation: The statute lists commingling funds of others with the licensee's own funds, or failing
  to keep those funds in an escrow or trust account, as a ground for suspension or revocation.
