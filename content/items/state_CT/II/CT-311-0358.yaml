stem: A broker receives an earnest money deposit on Monday, May 6, 2024, the date the purchase
  agreement is signed by all parties. Under Conn. Gen. Stat. § 20-324k(c), by what date must the
  broker deposit the money into an escrow or trust account?
options:
  - Tuesday, May 7, 2024
  - Wednesday, May 8, 2024
  - Thursday, May 9, 2024
  - Friday, May 10, 2024
key: C
explanation: The rule requires deposit within three banking days after the agreement is signed.
  Starting from Monday, May 6, the first banking day is Tuesday May 7, second is Wednesday May 8,
  third is Thursday May 9. Therefore the broker must deposit by Thursday, May 9, 2024. The
  distractor Tuesday, May 7 incorrectly counts only one banking day.
