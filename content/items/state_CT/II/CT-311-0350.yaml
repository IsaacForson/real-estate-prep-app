  url: null
  quoted_text: Every person required by chapter 392 of the Connecticut General Statutes, and the
    regulations promulgated thereunder, to prepare, obtain or keep documents, and every person in
    charge, or having custody, of such documents, shall maintain such documents in an auditable
    format for no less than seven years.
