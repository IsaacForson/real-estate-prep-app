stem: Under Conn. Regs §20-328-5a(e)(1), what must a salesperson include in any print advertisement?
options:
  - The salesperson's name as it appears on the license and a phone number or email address
  - The supervising licensee's name as it appears on the license and a phone number or email address
  - The broker's license number, office address, telephone number, email address, and fax number
  - The MLS identification number, property address, listing date, price range, and financing terms
key: A
explanation: The rule requires a print advertisement to contain the salesperson’s name exactly as it
  appears on the license and a phone number or email address for that salesperson. The choice that
  lists the supervising licensee’s name and contact information is incorrect because the regulation
  applies to the salesperson, not the supervising licensee. The choices that add the broker’s
  license number, office address, telephone, email, fax, or MLS identification, property address,
  listing date, price range, and financing terms are also incorrect because those details are not
  required by the regulation.
citation:
  source: "### Regs., Conn. State Agencies §§ 20-328-1a to 20-328-33 — Regulations of Connecticut
    State Agencies, Title 20 § 20-328 - Real Estate Brokers and Salesmen (eRegulations official PDF)
    — § 20-328-5a"
  url: null
  quoted_text: Any salesperson or associate broker advertising in print shall include in such
    advertisement (A) the name of the salesperson or associate broker as it appears on such person’s
    license, and (B) a phone number or email address for such salesperson or associate broker.
