stem: Under Conn. Gen. Stat. § 20-320(a), what is the maximum fine per violation that the Real
  Estate Commission may impose on a licensee who has made a material misrepresentation?
options:
  - $2,500
  - $10,000
  - $5,000
  - $1,000
key: C
explanation: The statute authorizes a fine of not more than five thousand dollars per violation for
  material misrepresentation. Therefore the maximum fine is $5,000. The distractor $2,500 is
  incorrect because it understates the statutory cap.
