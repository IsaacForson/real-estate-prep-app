stem: Under Conn. Gen. Stat. § 20-320a, which of the following is prohibited?
options:
  - Paid referral of a buyer to an attorney
  - Unpaid referral of a buyer to an attorney
  - Referral of a seller to an attorney
  - Referral of a buyer to a contractor
key: A
explanation: The statute explicitly prohibits paid referral of any buyer of real property to an
  attorney, mortgage broker, or lender. Therefore, a paid referral to an attorney is prohibited. An
  unpaid referral is not covered by the prohibition, making it permissible.
