stem: The Connecticut Real Estate Commission has eight members. What is the minimum number of
  members required to constitute a quorum under Conn. Gen. Stat. § 20-311b(a)?
options:
  - A quorum of the Connecticut Real Estate Commission requires at least 6 members
  - A quorum of the Connecticut Real Estate Commission requires at least 7 members
  - A quorum of the Connecticut Real Estate Commission requires at least 4 members
  - A quorum of the Connecticut Real Estate Commission requires at least 5 members
key: D
explanation: The statute defines a quorum as a majority of the members. With eight members, a
  majority is five, so at least five members are needed for a quorum. Four members constitute less
  than a majority and therefore do not meet the quorum requirement.
