stem: "Under Conn. Gen. Stat. § 20-311f, the Real Estate Commission may act as a board of
  arbitration to consider and decide disputes over commissions arising between brokers or
  salespersons only if:"
options:
  - The dispute is submitted by one party only
  - The dispute is voluntarily submitted by both parties
  - The dispute is ordered by a court
  - The dispute involves any real estate transaction
key: B
explanation: The statute limits the commission’s arbitration power to disputes that are voluntarily
  submitted by the parties. Therefore, only when both parties voluntarily submit the dispute may the
  commission act as a board of arbitration. The other options describe situations not covered by the
  grant of power.
