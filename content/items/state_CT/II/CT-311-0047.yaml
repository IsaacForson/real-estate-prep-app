stem: A leasing agent employed by a development owner wishes to show commercial property for lease
  to a prospective tenant. Is this permitted under Connecticut law?
options:
  - Yes, provided the development owner gives written permission and the leasing agent only shows
    properties that are already under lease negotiation
  - Yes, if the leasing agent obtains a separate broker license before showing the property, but
    only after completing state-approved broker education
  - No, unless the leasing agent also holds an active real estate salesperson license issued by the
    Connecticut Real Estate Commission
  - No, leasing agents shall not engage in any activity that requires a real estate broker's or real
    estate salesperson's license, including leasing commercial real estate
key: D
explanation: Under Connecticut law, leasing agents are prohibited from performing any act that
  requires a broker or salesperson license, which includes showing commercial real estate for lease.
  Neither employer approval nor obtaining another license overrides this restriction.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-324 l
  url: null
  quoted_text: Leasing agents shall not engage in any activity that requires a real estate broker's or
    real estate salesperson's license, including, but not limited to, selling, offering, listing,
    negotiating, referring or showing for sale, entering into lease-to-own agreements or leasing
    commercial real estate.
