stem: Under Connecticut law, what is the liability of a broker for the actions of a salesperson
  affiliated as an independent contractor?
options:
  - Broker liability depends on whether the salesperson was acting within the scope of employment.
  - Broker is liable to the same extent as if the salesperson had been employed by the broker.
  - Broker is not liable because the salesperson is classified as an independent contractor.
  - Broker liability is limited to actions that occur during office hours.
key: B
explanation: Under Conn. Gen. Stat. § 20-312a, a broker is liable to the same extent as if the
  salesperson had been employed by the broker. This makes the statement that the broker’s liability
  mirrors that of an employer correct. The claim that the broker is not liable because the
  salesperson is an independent contractor is incorrect because the statute removes the
  independent‑contractor shield for third‑party actions.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-312a
  url: null
  quoted_text: In any action brought by a third party against a real estate salesperson affiliated
    with a real estate broker as an independent contractor, such broker shall be liable to the same
    extent as if such affiliate had been employed as a real estate salesperson by such broker.
