stem: A leasing agent hired by a development owner wishes to begin showing apartments to prospective
  tenants. What must the leasing agent have before engaging in any leasing activity?
options:
  - A written contract from the development owner must be obtained.
  - A verbal agreement with the development owner is sufficient.
  - A signed permission from each prospective tenant must be secured.
  - A real estate broker's license must be held by the leasing agent.
key: A
explanation: The leasing agent statute requires that a leasing agent obtain a written contract from
  the development owner to demonstrate employment prior to engaging in any leasing activity. Without
  this written contract, the agent cannot lawfully show the property. The distractor suggesting a
  verbal agreement is insufficient because the statute explicitly calls for a written contract.
