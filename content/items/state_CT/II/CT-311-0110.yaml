stem: Under Connecticut law, what type of real property may a leasing agent engage in leasing or renting?
options:
  - Leasing agents may lease or rent residential property only
  - Leasing agents may lease or rent any property regardless of occupancy
  - Leasing agents may lease or rent commercial property only
  - Leasing agents may lease or rent both residential and commercial property
key: A
explanation: The statute expressly limits leasing agents to leasing or renting real property that is
  exclusively used for residential occupancy. Therefore, the correct answer is that they may lease
  or rent residential property only. The distractor suggesting they may also handle commercial
  property is incorrect because the law prohibits leasing agents from engaging in any real estate
  business beyond residential occupancy.
citation:
