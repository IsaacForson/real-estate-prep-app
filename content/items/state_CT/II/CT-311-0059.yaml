stem: Two brokers in Connecticut have a disagreement over the amount of a cooperative commission
  earned on a sale. Both agree to submit the dispute to the Real Estate Commission for resolution.
  Under Connecticut law, what action may the commission take regarding this dispute?
options:
  - The commission may refer the dispute to the Department of Consumer Protection.
  - The commission may impose a monetary fine on both brokers for violating arbitration rules.
  - The commission may require the brokers to resolve the dispute through the judicial system.
  - The commission may act as a board of arbitration to consider and decide the dispute.
key: D
explanation: Conn. Gen. Stat. § 20-311f grants the commission the power to act as a board of
  arbitration to consider and decide any dispute over commissions that is voluntarily submitted by
  the parties. Thus, the commission may arbitrate the commission disagreement between the brokers.
  The distractor suggesting the commission may require the brokers to go to court is incorrect
  because the statute provides arbitration authority, not authority to compel litigation.
