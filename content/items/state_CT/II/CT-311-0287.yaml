stem: A licensee representing a seller learns that the property was the site of a felony five years
  ago. Under Connecticut law, is the licensee required to disclose this fact to prospective buyers?
options:
  - No, the licensee must disclose the felony history to all prospective buyers
  - No, the licensee is not required to disclose because it is a nonmaterial fact
  - No, the licensee must disclose only if the buyer asks about criminal history
  - No, the licensee must disclose only if the felony occurred within the last year
key: B
explanation: Under Conn. Gen. Stat. § 20-311(21), a property suspected to be the site of a death or
  felony is deemed a nonmaterial fact, which triggers no disclosure obligation. Therefore the
  licensee is not required to disclose the felony history. The statement that the licensee must
  disclose the felony history to all prospective buyers incorrectly asserts a duty to disclose,
  which contradicts the statutory definition.
