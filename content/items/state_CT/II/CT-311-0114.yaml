stem: A salesperson creates a Facebook page to advertise listings. According to Conn. Regs
  §20-328-5a(f), what must the salesperson include in the Facebook page?
options:
  - The salesperson's name as it appears on the license, prominently displayed, and a link to a
    compliant website
  - The supervising licensee's name as it appears on the license, prominently displayed, and a link
    to a compliant website
  - The broker's license number, office address, telephone number, and email address
  - The MLS identification number, property address, listing date, price range, and financing terms
key: A
explanation: Conn. Regs § 20‑328‑5a(f) requires that any social‑media advertisement display the
  salesperson’s name exactly as it appears on the license and include a link to an internet website
  that meets the requirements of subsection (g). Requiring the supervising licensee’s name, the MLS
  identification number, property address, listing date, price range, financing terms, or the
  broker’s license number, office address, telephone number, and email address is not required by
  the rule.
citation:
  source: "### Regs., Conn. State Agencies §§ 20-328-1a to 20-328-33 — Regulations of Connecticut
    State Agencies, Title 20 § 20-328 - Real Estate Brokers and Salesmen (eRegulations official PDF)
    — § 20-328-5a"
  url: null
  quoted_text: Any salesperson or associate broker advertising via publishing or posting on a social
    media website or a computer or mobile phone application, a text message or similar messaging
    service or an email shall include the name of the salesperson or associate broker as it appears
    on the salesperson’s or associate broker’s license, prominently displayed, and a link to an
    internet website that complies with the requirements for internet websites set forth in
    subsection (g) of this section.
