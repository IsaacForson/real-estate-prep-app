stem: A licensee pays a fee for license renewal to the Connecticut Real Estate Commission. Assuming
  the fee is **NOT** required to be paid to the University of Connecticut or the Real Estate
  Guaranty Fund, what happens to that money?
options:
  - Retained by the Commission to cover administrative and personnel costs
  - Refunded to the licensee after the fee is processed
  - Deposited with the State Treasurer to become part of the General Fund
  - Placed in a special escrow account for future commission use
key: C
explanation: Under Conn. Gen. Stat. § 20-311e, the commission must deposit all fees it receives with
  the State Treasurer, except any portion that is required to be paid to the University of
  Connecticut or the Real Estate Guaranty Fund; the remaining amount becomes part of the General
  Fund. The option stating the money is retained by the Commission contradicts this statutory
  requirement.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-311e
  url: null
  quoted_text: The commission shall deposit all moneys received by it from fees in accordance with the
    provisions of this chapter with the State Treasurer, and they shall, except as to that portion
    thereof required to be paid over to The University of Connecticut under the provisions of
    section 10a-125 , or that portion required to be paid to the Real Estate Guaranty Fund pursuant
    to this chapter, become part of the General Fund.
