stem: Under Conn. Gen. Stat. § 20‑325a(b), what does the term “owner” refer to in the context of a
  listing contract?
options:
  - The owner of the property interest that is the subject of the listing agreement.
  - The party who pays the broker’s commission after a successful sale.
  - The individual who occupies the property as a tenant under a lease.
  - The person who holds legal title to the real property being listed.
key: A
explanation: Conn. Gen. Stat. § 20‑325a(b) defines “owner” as the owner of the property interest
  that is the subject of the listing agreement. Thus the correct answer is the statement that the
  owner is the owner of the property interest that is the subject of the listing agreement, because
  the statutory definition focuses on the interest being listed, not necessarily on who holds legal
  title. The other statements describe the commission‑paying party, a tenant, or the legal title
  holder, none of which match the statutory definition.
