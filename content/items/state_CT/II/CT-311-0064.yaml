stem: A prospective buyer sends a written request to a seller's agent asking whether the property
  was ever the site of a suicide, stating that this information is important to the purchase
  decision. What must the agent do under Connecticut law?
options:
  - The agent must obtain a court order before disclosing any such information, and cannot provide
    any written or verbal notice without judicial approval, even if the buyer submits a written
    request
  - The agent may ignore the request unless the property is known to be stigmatized, and the agent
    is not required to investigate or provide any disclosure, regardless of the buyer’s written
    inquiry.
  - The agent must disclose any known suicide history verbally to the buyer at the showing, and no
    written notice is required, even if the seller objects, because verbal disclosure satisfies the
    law.
  - The agent must provide a written disclosure of any known homicide, felony, or suicide history;
    if the owner refuses, the agent must inform the buyer in writing of the refusal
key: D
explanation: Conn. Gen. Stat. § 20‑329ee requires that when a purchaser submits a written request
  about a possible homicide, felony, or suicide at the property, the owner’s agent must give the
  buyer a written disclosure of any known history. If the owner refuses to disclose, the agent must
  inform the buyer in writing of that refusal. The correct answer reflects this written‑disclosure
  duty. The other answers are incorrect because they either prescribe verbal disclosure, allow the
  request to be ignored, or require a court order, none of which satisfy the statutory requirement.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-329ee
  url: null
  quoted_text: if a purchaser or lessee of real estate, who was in the process of making a bona fide
    offer, advises an owner of real estate or his or her agent, in writing, that knowledge that the
    property was at any time suspected to have been the site of a homicide, other felony or a
    suicide is important to the purchaser's decision to purchase or lease the property, the owner
    through his or her agent shall report any findings to the purchaser or lessee, in writing
    subject to and consistent with applicable laws of privacy. If the owner refuses to disclose such
    information, his or her agent shall so advise the purchaser or lessee in writing.
