stem: A broker has a written contract with a prospective buyer to purchase a single-family home. The
  buyer accepts the conveyance on May 10, 2024. Under Conn. Gen. Stat. § 20-325a(i), what is the
  latest date by which the broker must file the claim for lien?
options:
  - May 20, 2024
  - June 9, 2024
  - July 10, 2024
  - May 31, 2024
key: B
explanation: Subsection (i) states that any claim for lien shall be filed by the broker no later
  than thirty days after the conveyance or the tenant takes possession of the real property. Thirty
  days after May 10, 2024 is June 9, 2024, which is the latest permissible filing date.
