stem: A business entity updates the contact information for its designated broker on May 5. By what
  date must it notify the commission to comply with Connecticut law?
options:
  - May 30
  - May 31
  - June 1
  - June 4
key: D
explanation: Under § 20-312(c), the business entity must notify the commission of any change in the
  contact information for its designated broker within thirty days after the change. Adding thirty
  days to May 5 brings the deadline to June 4. The distractor June 1 results from adding only
  twenty‑seven days, which falls short of the required thirty‑day period.
citation:
