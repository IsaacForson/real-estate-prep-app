stem: A licensee pressures an appraiser to assign a higher value to a property in order to
  facilitate a loan approval. Under Conn. Gen. Stat. § 20-320b, what violation has the licensee
  committed?
options:
  - Engaging in influencing a residential real estate appraisal
  - Engaging in commingling client funds with personal funds
  - Engaging in failing to deliver a copy of a contract to a party
  - Engaging in making a material misrepresentation about property
key: A
explanation: Conn. Gen. Stat. § 20-320b prohibits a real estate licensee from influencing
  residential real estate appraisals. Pressuring an appraiser to assign a higher value to obtain
  loan approval is precisely that prohibited conduct, making the option that describes influencing a
  residential real estate appraisal the correct answer.
