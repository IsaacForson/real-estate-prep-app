stem: A salesperson employed by a broker makes a material misrepresentation to a buyer about the
  property's age. The broker had no knowledge of the misrepresentation. Under Connecticut law, what
  is the broker's liability?
options:
  - The broker is not liable because the broker had no knowledge of the misrepresentation.
  - The broker is liable for the salesperson's misrepresentation.
  - The broker is liable only if the broker benefited financially from the misrepresentation.
  - The broker is liable only if the broker directly supervised the salesperson.
key: B
explanation: Section 20-320(b) provides that a person is not relieved of responsibility for the
  conduct of their agents or employees merely by complying with the chapter. Thus the broker remains
  liable for the salesperson's misrepresentation even without personal knowledge. The distractor
  claiming no liability ignores this vicarious responsibility provision.
