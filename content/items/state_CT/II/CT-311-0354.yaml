stem: A Connecticut licensee refers a prospective buyer to an attorney for legal advice and does not
  receive any payment or other compensation for the referral. Under Conn. Gen. Stat. § 20-320a, is
  this referral permitted?
options:
  - Yes, but only if the attorney is also a licensed real estate broker
  - No, unless the licensee first obtains written consent from the buyer
  - Yes, because the statute only prohibits paid referrals
  - No, because any referral to an attorney is prohibited
key: C
explanation: § 20‑320a prohibits only paid referrals to an attorney, mortgage broker, or lender; an
  unpaid referral is expressly allowed. Hence the licensee’s referral without compensation is
  permitted. The distractor “No, because any referral to an attorney is prohibited” misstates the
  rule by ignoring the payment requirement.
