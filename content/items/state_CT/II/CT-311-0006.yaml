stem: A listing broker receives a written purchase offer on an exclusively listed property. What
  does the regulation on duties to parties require the listing broker to do with that offer?
options:
  - Hold the offer until a second, competing offer later arrives for comparison
  - Present the offer after the listing agreement's marketing period ends
  - Forward the offer to the department first, before showing it to the seller
  - Submit the offer to the seller, owner or lessor as quickly as possible
key: D
explanation: The regulation requires the listing broker to submit all offers or counter-offers to
  the seller, owner or lessor as quickly as possible.
