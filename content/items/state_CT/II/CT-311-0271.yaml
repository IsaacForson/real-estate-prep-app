stem: What is the maximum fine that may be imposed for a wilful violation of the escrow or trust
  account statute under Connecticut law?
options:
  - A fine of not more than one thousand dollars.
  - A fine of not more than five thousand dollars.
  - A fine of not more than two thousand dollars.
  - A fine of not more than five hundred dollars.
key: A
explanation: The statute states that a broker who wilfully violates any provision of the escrow
  account requirement shall be fined not more than one thousand dollars or imprisoned not more than
  six months or both. Therefore the maximum fine is $1,000. The distractors of $500, $2,000, and
  $5,000 correspond to other penalty amounts in the law but do not apply to this specific violation.
