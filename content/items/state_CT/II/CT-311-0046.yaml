stem: A Connecticut licensee refers a homebuyer to an attorney for legal advice and, in exchange,
  the attorney pays the licensee a referral fee. What does Connecticut law say about this payment?
options:
  - The licensee may accept the fee if the buyer is informed of the arrangement in writing
  - The licensee may accept the fee provided the attorney is not affiliated with the licensee
  - The licensee may not receive any fee, commission or other form of referral fee for referring a
    buyer to an attorney
  - The licensee may receive a fee only if the attorney is licensed to practice in Connecticut
key: C
explanation: The law prohibits any licensee from receiving a fee, commission, or other referral fee
  for referring a buyer to an attorney admitted to practice in the state. The other options
  incorrectly suggest conditions under which the fee could be accepted.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-320a
  url: null
  quoted_text: No real estate licensee, no person affiliated with a real estate licensee, and no
    person engaging in the real estate business may receive a fee, commission or other form of
    referral fee for the referral of any buyer of real property to (1) an attorney-at-law admitted
    to practice in this state or any person affiliated with such attorney
