stem: Under Conn. Gen. Stat. § 20-325b, a broker prepares a written listing agreement that specifies
  a 6% commission. The required notice is printed in 8‑point boldface type but is placed in a shaded
  textbox with a border, making it stand out significantly from the preceding text. Does the
  agreement satisfy the statutory notice requirement?
options:
  - The agreement complies because the notice stands out significantly from the preceding text, even
    though it is less than ten point boldface.
  - The agreement does not comply because the notice must be at least ten point boldface type,
    regardless of any other formatting.
  - The agreement complies because the notice is boldface type, satisfying the statutory requirement
    for emphasis.
  - The agreement does not comply because the notice must be both at least ten point boldface type
    and stand out significantly.
key: A
explanation: The statute requires the notice to be in not less than ten‑point boldface type OR in a
  manner that otherwise stands out significantly from the preceding text. The notice here is less
  than ten point but is presented in a shaded textbox that makes it stand out significantly,
  satisfying the alternative condition. Therefore the agreement complies. The agreement does not
  comply because the notice must be at least ten point boldface type, regardless of any other
  formatting.
