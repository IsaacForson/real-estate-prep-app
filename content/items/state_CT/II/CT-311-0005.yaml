stem: A licensee's affiliation with a broker ends, and the licensee promptly turns over all required
  records to the broker. Under the regulation on termination, by when must the broker deliver the
  required written accounting?
options:
  - Within one calendar year of termination, if the licensee requests it in writing
  - Within sixty days of the termination, regardless of when records are turned over
  - Within ten days of turnover, or forty-five days of termination, whichever is earlier
  - Within thirty days of the turnover, or ninety days of termination, whichever is later
key: C
explanation: The regulation requires the broker to give the licensee a written accounting within ten
  days of the records turnover or forty-five days of the termination, whichever date is earlier.
