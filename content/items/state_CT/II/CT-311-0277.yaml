stem: Under Connecticut law, which type of real estate agreement is exempt from the required
  commission notice under Conn. Gen. Stat. § 20-325b?
options:
  - Written lease agreements exceeding one year
  - Oral agreements for the sale of real property
  - Written buyer representation agreements
  - Written listing agreements for residential sales
key: B
explanation: Under Conn. Gen. Stat. § 20-325b, the commission notice is required only in written
  agreements that set a broker’s compensation. Oral agreements for the sale of real property are not
  written, so they are exempt from the notice requirement. Written listing agreements, however, must
  include the notice because they are written agreements that fix compensation.
