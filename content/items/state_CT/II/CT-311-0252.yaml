stem: A broker places a newspaper advertisement for a residential listing that states "For sale by
  owner" and does not include the broker's name anywhere in the ad. Under Connecticut law, is this
  advertisement permissible?
options:
  - A. Yes, because the broker is not required to disclose identity in print advertisements.
  - B. No, because the advertisement indicates the offer is being made by a private party not
    engaged in the real estate business.
  - C. Yes, as long as the broker's telephone number appears elsewhere in the advertisement.
  - D. No, because the broker failed to include the supervising licensee's email address in the
    advertisement.
key: B
explanation: The regulation prohibits a broker from advertising property in a manner that indicates
  the offer is being made by a private party not engaged in the real estate business.
citation:
  source: Regs., Conn. State Agencies § 20-328-5a(c)
  url: null
  quoted_text: No broker shall advertise to sell, buy, exchange, rent or lease the property of another
    in a manner indicating the offer to sell, buy, exchange, rent or lease such property is being
    made by a private party not engaged in the real estate business.
