stem: A buyer sends a written request to the seller's agent asking whether the property was ever the
  site of a felony, stating that this information is important to the purchase decision. The owner
  refuses to disclose. What must the agent do under Connecticut law?
options:
  - The agent must ignore the request because the owner refused to disclose.
  - The agent must tell the buyer verbally that the owner refused to disclose the information.
  - The agent must provide a written disclosure of any known felony history to the buyer.
  - The agent must inform the buyer in writing that the owner refused to disclose the information.
key: D
explanation: If the owner refuses to disclose homicide, felony, or suicide information after a
  written request, the agent must advise the purchaser or lessee in writing of the refusal (Conn.
  Gen. Stat. § 20-329ee). Telling the buyer verbally that the owner refused to disclose is
  insufficient because the agent cannot disclose unknown information and must instead report the
  refusal in writing.
