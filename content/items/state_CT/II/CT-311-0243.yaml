stem: Two supervising licensees jointly advertise a property for sale. According to Conn. Regs
  §20-328-5a(h), what must the advertisement include?
options:
  - Displaying the name and phone number of both supervising licensees
  - Displaying only the name of the supervising licensee who initiated the advertisement
  - Displaying only the phone numbers of the supervising licensees
  - Displaying neither the names nor phone numbers if the advertisement is online
key: A
explanation: The regulation requires that when a supervising licensee advertises on behalf of or in
  coordination with another supervising licensee, the advertisement must display the name and phone
  number of all supervising licensees responsible for the advertisement. Therefore, both names and
  phone numbers must be shown. The distractor about only the initiating licensee’s name is incorrect
  because the rule requires all responsible licensees to be named.
citation:
  source: Regs., Conn. State Agencies §§ 20-328-1a to 20-328-33 — Regulations of Connecticut State
    Agencies, Title 20 § 20-328 - Real Estate Brokers and Salesmen (eRegulations official PDF) — §
    20-328-5a
  url: null
  quoted_text: (h) Any print advertising by a supervising licensee for property or services shall
    prominently display such supervising licensee’s name as it appears on the supervising licensee’s
    license and a phone number or email address for such supervising licensee. If the advertisement
    is made on behalf of or in coordination with another supervising licensee, the advertisement
    shall display the name and phone number of all supervising licensees responsible for the
    advertisement.
