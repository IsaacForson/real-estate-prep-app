stem: A licensee refers a prospective buyer to a mortgage broker and receives a $75 fee from the
  mortgage broker for the referral. Under Conn. Gen. Stat. § 20-320a, is this referral permissible?
options:
  - Yes, because the fee is nominal and disclosed to the buyer.
  - No, because the mortgage broker is not an attorney or lender.
  - No, because a fee for referring a buyer to a mortgage broker is prohibited.
  - Yes, because the licensee received the fee from the mortgage broker.
key: C
explanation: The statute bans any paid referral of a buyer to a mortgage broker. Receiving a fee for
  such a referral is therefore prohibited regardless of disclosure or the fee’s amount. The notion
  that the referral is allowed because the broker is not an attorney misses the statutory scope.
