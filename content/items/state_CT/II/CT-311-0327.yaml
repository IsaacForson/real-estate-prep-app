stem: Under Conn. Gen. Stat. § 20-311, which of the following is **NOT** included in the definition
  of a "promotional note"?
options:
  - A promissory note that was executed more than three years prior to being offered for sale
  - A promissory note that is secured by a trust deed executed on unimproved real property
  - A promissory note that subordinate, or may become subordinate, to any other trust deed on such
    property
  - A promissory note that finances the first purchase of improved real property
key: A
explanation: Under the statute, a promotional note includes a note that is secured by a trust deed
  on unimproved real property, a note that is subordinate or may become subordinate to another trust
  deed, and a note that finances the first purchase of improved real property. The only
  characteristic that excludes a note is being executed more than three years before it is offered
  for sale.
