stem: A broker wants to designate a salesperson as a designated buyer agent for a specific buyer
  with a buyer representation agreement in place. What must be true about the salesperson’s
  relationship to the broker?
options:
  - The licensee must be employed by or affiliated with the broker
  - The licensee must hold an associate broker license
  - The licensee must be a member of a team with a team name
  - The licensee must have completed a designated agency course
key: A
explanation: Under Conn. Gen. Stat. § 20-311(12), a designated buyer agent is a licensee who is
  designated by the broker by whom the licensee is employed, or with whom the licensee is
  affiliated, solely to represent a named buyer or tenant. Therefore, the licensee must be employed
  by or affiliated with the broker. Holding an associate broker license, being on a team, or
  completing a course are not required by this definition.
