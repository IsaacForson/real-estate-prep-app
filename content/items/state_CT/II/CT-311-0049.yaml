stem: A salesperson works for a broker as an employee and also performs independent‑contractor work
  for another broker. Under Connecticut law, how is the salesperson’s relationship to each broker
  classified?
options:
  - Affiliated relationship
  - Associate broker status
  - Designated agent role
  - Custodial broker function
key: A
explanation: The definition of “affiliated” in Conn. Gen. Stat. § 20-311(2) includes both
  employer‑employee and independent‑contractor relationships, so the salesperson is affiliated with
  each broker. “Associate broker status” is incorrect because an associate broker must be a broker
  authorized to act on behalf of a supervising licensee, which is not required for mere affiliation.
