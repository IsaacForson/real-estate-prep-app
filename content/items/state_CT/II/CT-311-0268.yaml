  url: null
  quoted_text: “Commercial real estate transaction” means any transaction involving the sale,
    exchange, lease or sublease of real property other than (A) real property containing any
    building or structure occupied, or intended to be occupied, by not more than four families, or
    (B) a single building lot to be used for family or household purposes;
