stem: A licensee facilitates the sale of a five-unit apartment building. Under Connecticut law, is
  this transaction considered a commercial real estate transaction?
options:
  - The transaction is considered a commercial real estate transaction because the property contains
    more than four families.
  - The transaction is not considered a commercial real estate transaction because the property is
    residential real property.
  - The transaction is considered a commercial real estate transaction only if the building is used
    for commercial purposes.
  - The transaction is not considered a commercial real estate transaction because apartment
    buildings are exempt from commercial real estate transaction rules.
key: A
explanation: Under Conn. Gen. Stat. § 20-311(5), a commercial real estate transaction includes any
  transaction involving real property other than property containing a building occupied by not more
  than four families. A five-unit apartment building houses more than four families, so it does not
  fall under the exclusion and therefore qualifies as a commercial real estate transaction. The
  statement that the property is residential real property applies only to one‑to‑four‑family
  properties, so it is incorrect. Adding a requirement that the building be used for commercial
  purposes is unnecessary because the statute’s definition hinges on the number of families, not the
  use. Claiming that apartment buildings are exempt from commercial real estate transaction rules
  contradicts the statute, which provides no such exemption.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
