stem: A Connecticut broker agrees to accept a commission from both the buyer and the seller in a
  residential transaction. The broker informs both parties of this arrangement before the closing
  date. Under Conn. Regs § 20-328-8a(d), is the broker permitted to accept compensation from both
  parties?
options:
  - Yes, because prior notification to all parties satisfies the requirement
  - No, because the regulation requires notification before accepting compensation from more than
    one party
  - Yes, but only if the compensation comes from the buyer’s lender
  - No, unless the broker also obtains written consent from the broker’s supervising licensee
key: A
explanation: Under Conn. Regs § 20-328-8a(d), a licensee may accept compensation from more than one
  party provided that all parties to the transaction are notified prior to closing. The broker
  notified both the buyer and the seller before closing, so the arrangement is permissible. The
  option stating that the broker is not permitted because the regulation requires notification
  before accepting compensation from more than one party is incorrect; the regulation does not
  prohibit dual compensation, it only imposes the notification requirement.
citation:
  source: Regs., Conn. State Agencies §§ 20-328-1a to 20-328-33 — Regulations of Connecticut State
    Agencies, Title 20 § 20-328 - Real Estate Brokers and Salesmen (eRegulations official PDF) — §
    20-328-8a
  url: null
  quoted_text: A licensee shall not accept compensation from more than one party in a real estate
    transaction without notifying all parties to the transaction prior to the closing.
