stem: A broker seeks to recover commission under the substantial compliance provision of Conn. Gen.
  Stat. § 20-325a(d) based on an oral listing agreement. Is the broker entitled to recover
  commission under this provision?
options:
  - Yes, if the broker substantially complied with all other statutory requirements.
  - No, because the substantial compliance allowance applies only to written agreements.
  - Yes, provided the owner signed the oral agreement and later ratified it in writing.
  - No, unless the oral agreement concerned commercial real property and was witnessed by a third
    party.
key: B
explanation: The statute's substantial compliance allowance under subsection (d) applies only to
  written agreements, so an oral listing agreement cannot qualify. The option suggesting recovery if
  the owner signed the oral agreement is incorrect because the writing requirement cannot be waived
  by signature alone.
