stem: Under Connecticut regulations, when advertising real estate listed with another broker, what
  must the licensee disclose to the public?
options:
  - That the supervising licensee’s name appears in the advertisement
  - That the property is not listed with the licensee
  - That the listing has been updated within the past 72 hours
  - That the listing broker has granted permission
key: B
explanation: Connecticut regulations require that when advertising a property listed with another
  broker, the licensee must disclose that the property is not listed with the licensee (Regs., Conn.
  State Agencies § 20-328-5a(d)(3)).
