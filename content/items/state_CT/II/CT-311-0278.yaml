stem: A Connecticut licensee refers a prospective buyer to an attorney for legal advice and does not
  receive any payment or other compensation for the referral. Under Conn. Gen. Stat. § 20-320a, is
  this referral permitted?
options:
  - Yes, but only if the attorney is also a licensed real estate broker
  - Yes, because the statute only prohibits paid referrals
  - No, because any referral to an attorney is prohibited regardless of payment
  - No, because the licensee must disclose the referral to the buyer in writing
key: B
explanation: Section 20-320a prohibits only paid referrals to attorneys, mortgage brokers, or
  lenders; an unpaid referral is not prohibited. Thus the licensee’s unpaid referral is permitted.
  The option stating that any referral to an attorney is prohibited regardless of payment is
  incorrect because the statute does not ban all referrals, only those involving payment.
