stem: Under Connecticut law, which of the following best defines 'confidential information'?
options:
  - It is defined as any information that is publicly available through online property listings or
    government websites, including tax assessment data, zoning maps, recorded deeds, plat maps,
    environmental reports, building permits, school district ratings, and crime statistics
    accessible via the town clerk's office, state environmental agency, or local assessor's office,
    and that a licensee may freely share with clients without restriction
  - It is defined as any fact concerning a property's physical condition, such as structural
    defects, environmental hazards, or zoning violations, that is known to the licensee but not
    disclosed to the client, and that must be disclosed under the state's disclosure law, and
    includes any details about prior renovations, pest infestations, water damage, foundation
    cracks, roof leaks, or hazardous materials that affect the property's market value or
    habitability
  - It is defined as any communication between a licensee and a client regarding the terms of a
    purchase agreement, including counteroffers, addenda, disclosures, financing details, and
    closing statements, such as emails, letters, text messages, or signed documents exchanged during
    negotiation of the sale, and that must be kept confidential under the licensee's duty of loyalty
  - It is defined as any fact concerning a person's assets, expenses, income, liabilities,
    motivations to purchase, rent or sell real property and previous offers received or made to
    purchase or lease real property which (A) a client has not authorized for release, or (B) is not
    (i) a matter of general knowledge, (ii) part of a public record or file to which access is
    authorized pursuant to section 1-210, or (iii) otherwise subject to disclosure under any other
    provision of the general statutes or regulations of Connecticut state agencies
key: D
explanation: The definition of confidential information in Conn. Gen. Stat. § 20-311(7) covers facts
  about a person's finances, motivations, and prior offers that are not authorized for release or
  are not public knowledge. The option describing physical property conditions, the option
  describing publicly available information, and the option describing communications about purchase
  agreements do not match this statutory definition.
