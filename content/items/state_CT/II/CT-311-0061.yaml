stem: Under Connecticut law, what is meant by a 'nonmaterial fact concerning real property'?
options:
  - A fact that does not require disclosure and gives rise to no cause of action
  - A fact that must be disclosed to all parties in a transaction
  - A fact that, if undisclosed, could lead to a cause of action for fraud
  - A fact that relates to property tax assessments
key: A
explanation: Under Conn. Gen. Stat. § 20-329dd, a nonmaterial fact concerning real property requires
  no disclosure and creates no cause of action. Therefore the statement that such a fact does not
  require disclosure and gives rise to no cause of action is correct. The statement that such a fact
  must be disclosed to all parties in a transaction is incorrect because the statute imposes no
  disclosure duty.
