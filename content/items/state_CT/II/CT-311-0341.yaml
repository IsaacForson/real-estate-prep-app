stem: Under Conn. Gen. Stat. § 20-325b, what statement must each written agreement fixing
  compensation contain?
options:
  - The notice that the amount or rate of real estate broker compensation is not fixed by law and is
    set by each broker individually and may be negotiable.
  - The notice that the broker's commission is determined by state law and cannot be negotiated
    between the parties.
  - The notice that the buyer is responsible for paying the broker's commission regardless of any
    negotiation.
  - The notice that the seller must pay a commission rate set by the Real Estate Commission and is
    not negotiable.
key: A
explanation: Conn. Gen. Stat. § 20-325b requires that every written agreement fixing broker
  compensation include the notice that the amount or rate of compensation is not fixed by law, that
  each broker sets it individually, and that it may be negotiable between the client and the broker.
  Language stating that the commission is set by state law, that the buyer must pay regardless of
  negotiation, or that the seller must pay a non‑negotiable rate conflicts with the statutory
  requirement.
