stem: A tenant takes possession of leased premises on June 1, 2024. Under Conn. Gen. Stat. §
  20-325a(k), what is the latest date by which a broker must provide written notice related to the
  lease to satisfy the six‑month requirement?
options:
  - 12/01/2025
  - 12/01/2024
  - 11/30/2024
  - 06/01/2025
key: B
explanation: Six months after June 1, 2024 is December 1, 2024, which is the latest permissible date
  for the broker’s notice under the six‑month rule. November 30 falls short, while the June 2025 and
  December 2025 dates exceed the allowed interval.
