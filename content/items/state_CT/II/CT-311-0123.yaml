stem: "Under Conn. Gen. Stat. § 20-311e, fees received by the Connecticut Real Estate Commission
  that are **not** required to be paid to the University of Connecticut or the Real Estate Guaranty
  Fund are:"
options:
  - Deposited with the State Treasurer to become part of the General Fund
  - Placed in a special escrow account for future commission use
  - Retained by the Commission to cover administrative and personnel costs
  - Refunded to the licensee after the fee is processed
key: A
explanation: The statute requires the commission to deposit all fees with the State Treasurer, and
  any portion not earmarked for the University of Connecticut or the Real Estate Guaranty Fund
  becomes part of the General Fund. Therefore, the correct destination is the General Fund via
  deposit with the Treasurer. The distractor suggesting retention by the Commission is incorrect
  because the statute mandates deposit with the State Treasurer, not retention by the commission.
citation:
