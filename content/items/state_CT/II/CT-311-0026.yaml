  url: null
  quoted_text: If an associate broker's affiliation with a supervising licensee is terminated, the
    associate broker shall notify the department of such termination not later than fourteen
    calendar days after such termination or such associate broker's affiliation with another
    supervising licensee, whichever occurs first.
