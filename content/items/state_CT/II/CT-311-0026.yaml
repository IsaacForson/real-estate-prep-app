stem: An associate broker's affiliation with a supervising licensee ends on June 1. By what date
  must the associate broker notify the department of this termination?
options:
  - June 08
  - June 14
  - June 15
  - June 22
key: C
explanation: The law requires notification not later than fourteen calendar days after termination.
  Fourteen days after June 1 is June 15, so the associate broker must notify the department by that
  date.
