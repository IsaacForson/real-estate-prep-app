stem: A real estate team changes its supervising licensee on March 1. By what date must the team
  send notice of this change to the department to comply with Connecticut law?
options:
  - March 13
  - March 8
  - April 1
  - March 31
key: A
explanation: Notice must be sent not later than twelve days after the change. Adding twelve days to
  March 1 gives March 13 as the latest permissible date. March 8 is too early, March 31 and April 1
  exceed the twelve‑day limit.
citation:
  source: Conn. Gen. Stat. § 20-312(f)
  url: null
  quoted_text: A team shall send notice to the department disclosing any change to the information
    contained in the team's registration form. The team shall send such notice to the department, on
    a form and in a manner prescribed by the Commissioner of Consumer Protection, not later than
    twelve days after the date of such change.
