stem: A licensee refers a prospective buyer to an attorney for legal advice and receives a $200
  referral fee from the attorney. Under Connecticut law, is this referral permissible?
options:
  - The referral is permissible because the attorney is not a real estate licensee.
  - The referral is prohibited under §20-320a, which bars any paid referral of a buyer to an
    attorney.
  - The referral is allowed if the licensee discloses the fee to the buyer before closing.
  - The referral is permissible because the fee is less than $500.
key: B
explanation: §20-320a explicitly prohibits paid referrals of any buyer of real property to an
  attorney, mortgage broker, or lender; receiving a fee from the attorney for such a referral
  violates this statute regardless of disclosure or the attorney’s licensing status. The claim that
  the referral is permissible because the attorney is not a real estate licensee incorrectly focuses
  on the attorney’s lack of a real estate license, which does not excuse the prohibition.
