stem: Under Connecticut law, the Real Estate Commission consists of eight members appointed by the
  Governor. Which of the following accurately reflects the required professional composition of the
  commission at the time of appointment?
options:
  - Four brokers, two salespersons, and two public members.
  - Three brokers, two salespersons, and three public members.
  - Two brokers, three salespersons, and three public members.
  - Three brokers, three salespersons, and two public members.
key: B
explanation: The statute requires three brokers, two salespersons, and three public members at the
  time of appointment. The option stating four brokers, two salespersons, and two public members
  does not match this requirement. The option stating three brokers, two salespersons, and three
  public members matches the statutory composition exactly. The option stating two brokers, three
  salespersons, and three public members has too few brokers and too many salespersons. The option
  stating three brokers, three salespersons, and two public members has too many salespersons and
  too few public members.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-311a(b)
  url: null
  quoted_text: The commission shall consist of eight persons, electors of the state, appointed by the
    Governor. Three of the members shall be at the time of appointment licensed real estate brokers,
    two of the members shall be at the time of appointment licensed real estate salespersons and
    three of the members shall be public members.
