stem: A broker accepts an earnest money deposit from a buyer, and all necessary parties sign the
  purchase agreement on a Monday. The broker is not personally entitled to keep that money. Under
  the escrow account statute, by when must the broker deposit those funds into the escrow or trust
  account?
options:
  - Within three banking days of the date the buyer first viewed the property
  - Within thirty calendar days of the scheduled closing date
  - Before the listing agreement is signed by the seller or owner
  - Within three banking days after every party signs the purchase agreement
key: D
explanation: The statute requires a broker holding money to which the broker is not entitled to
  deposit it in the escrow or trust account within three banking days of the date the agreement is
  signed by all necessary parties.
