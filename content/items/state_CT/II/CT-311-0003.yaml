stem: An associate broker wants to begin engaging in the real estate business under a supervising
  licensee. What must occur before the associate broker may do so?
options:
  - The supervising licensee must know of and consent to the associate broker's activity
  - The associate broker must obtain a notarized letter from the prior supervising broker
  - The associate broker must first complete a separate department background check
  - The associate broker must file a bond directly with the Real Estate Commission
key: A
explanation: An associate broker may not engage in the real estate business unless the supervising
  licensee knows the associate broker is doing so and has consented to it.
citation:
  source: Conn. Gen. Stat. § 20-312c
  url: null
  quoted_text: No associate broker shall engage in the real estate business unless the supervising
    licensee that is responsible for controlling and supervising the associate broker (1) knows that
    such associate broker is engaging in the real estate business, and (2) has consented to such
    associate broker engaging in the real estate business
