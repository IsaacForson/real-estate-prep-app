stem: A salesperson affiliated with Broker X as an independent contractor negligently misrepresents
  the size of a lot to a buyer, resulting in the buyer’s financial loss. The buyer sues the
  salesperson. Under Connecticut law, what is Broker X’s liability?
options:
  - Broker X is not liable because the salesperson is classified as an independent contractor.
  - Broker X's liability is limited to losses arising from office hours worked.
  - Broker X's liability depends on whether the salesperson was under direct supervision at the time
    of the misrepresentation.
  - Broker X is liable to the same extent as if the salesperson had been an employee of Broker X.
key: D
explanation: Under Conn. Gen. Stat. § 20-312a, a broker is liable for a third‑party claim against an
  affiliated salesperson who is an independent contractor to the same extent as if the salesperson
  were an employee. Therefore, Broker X is liable to the same extent as if the salesperson had been
  an employee of Broker X. The claim that Broker X is not liable because the salesperson is an
  independent contractor is incorrect because the statute removes that defense. The claim that
  liability is limited to losses arising from office hours worked is incorrect because the statute
  imposes full broker liability irrespective of where the misrepresentation occurred. The claim that
  liability depends on direct supervision is incorrect because the statute does not condition broker
  liability on the level of supervision.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-312a
  url: null
  quoted_text: In any action brought by a third party against a real estate salesperson affiliated
    with a real estate broker as an independent contractor, such broker shall be liable to the same
    extent as if such affiliate had been employed as a real estate salesperson by such broker.
