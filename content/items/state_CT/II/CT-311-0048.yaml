  quoted_text: “Real estate salesperson” or “salesperson” means any individual who is affiliated with
    a supervising licensee to (A) engage in the real estate business for or on behalf of such
    supervising licensee, or (B) if such individual is acting for another person as a designated
    seller agent or designated buyer agent, engage in the real estate business;
