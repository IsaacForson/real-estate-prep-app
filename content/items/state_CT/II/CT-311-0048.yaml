stem: Which term is defined as "any individual who is affiliated with a supervising licensee to
  engage in the real estate business for or on behalf of such supervising licensee"?
options:
  - Designated buyer agent
  - Real estate salesperson
  - Associate broker licensee
  - Leasing agent representative
key: B
explanation: The definition of “real estate salesperson” in Conn. Gen. Stat. § 20-311(27) states
  that a salesperson is any individual affiliated with a supervising licensee to engage in the real
  estate business for or on behalf of that supervisor. The other options describe roles that either
  require additional authority (associate broker) or specific representation duties (designated
  buyer agent, leasing agent) and therefore do not match the given definition.
