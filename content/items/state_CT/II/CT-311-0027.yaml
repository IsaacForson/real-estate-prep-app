stem: A licensee's affiliation with a broker ends on May 10. The licensee turns over all records to
  the broker on May 12. Has the licensee complied with the regulation requiring turnover of
  information and records?
options:
  - Yes, because the records were turned over within three days.
  - No, because the licensee should have turned over the records within ten days.
  - No, because the records must be turned over immediately upon termination.
  - Yes, because the broker received the records before the accounting deadline.
key: C
explanation: The regulation states that upon termination of affiliation, a licensee shall
  immediately turn over to the broker any and all information and records obtained during the
  affiliation. Turning over records two days later does not satisfy the immediate requirement.
