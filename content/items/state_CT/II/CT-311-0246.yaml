stem: A Connecticut broker recorded a claim for lien on March 10, 2024, based on a written listing
  agreement. The broker did not file a foreclosure complaint until April 10, 2025. Under Conn. Gen.
  Stat. § 20-325a(k)(2), what is the status of the lien?
options:
  - The lien remains valid because the broker substantially complied with subsection (b)
  - The lien remains valid because the foreclosure complaint was filed within one year of recording
  - The lien is extinguished because the foreclosure complaint was filed after one year of recording
  - The lien is extinguished because the underlying contract was oral
key: C
explanation: Subsection (k)(2) provides that a lien is extinguished if foreclosure is not commenced
  within one year after recording the claim. Recording on March 10, 2024 and filing on April 10,
  2025 exceeds that period, so the lien is extinguished. The distractor claiming the lien remains
  valid because the filing was within one year is incorrect because the filing occurred after the
  one‑year deadline.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-325a(k)(2)
  url: null
  quoted_text: A person claiming a lien shall, unless the claim is based upon an option to purchase
    the real property, within one year after recording the claim for lien, commence foreclosure by
    filing a complaint. Failure to commence foreclosure within one year after recording the lien
    shall extinguish the lien.
