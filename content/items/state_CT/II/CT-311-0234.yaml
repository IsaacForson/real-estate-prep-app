stem: Under Connecticut law, within how many days must a real estate team send notice to the
  department after a change to the information contained in its registration form?
options:
  - 7 days
  - 10 days
  - 12 days
  - 30 days
key: C
explanation: The rule requires a team to send notice of any registration change not later than
  twelve days after the change occurs. The twelve‑day period is explicitly stated in the statute.
  The seven‑day and ten‑day options are too short, and the thirty‑day option applies to designated
  broker changes, not team registration changes.
citation:
  source: Conn. Gen. Stat. § 20-312(f)
  url: null
  quoted_text: A team shall send notice to the department disclosing any change to the information
    contained in the team's registration form. The team shall send such notice to the department, on
    a form and in a manner prescribed by the Commissioner of Consumer Protection, not later than
    twelve days after the date of such change.
