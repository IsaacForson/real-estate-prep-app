stem: Under Connecticut law, a real estate salesperson is affiliated with a broker as an independent
  contractor. If a third party sues that salesperson over the salesperson's conduct, what is the
  supervising broker's liability?
options:
  - Liable if the broker personally directed the salesperson's specific conduct
  - Liable after the department formally revokes the salesperson's license
  - Liable to the same extent as if the salesperson had been the broker's employee
  - Liable when the salesperson's independent contractor agreement has already expired
key: C
explanation: The statute makes the broker liable to the same extent as if the affiliated salesperson
  had been the broker's employee, regardless of the independent contractor arrangement.
