stem: Which of the following communications is **NOT** considered "advertising" under Conn. Gen.
  Stat. § 20-311?
options:
  - A) A press release sent to a newspaper for general information, with no charge imposed
  - D) A billboard announcing an open house for a residential property
  - B) An email blast promoting a new listing to prospective buyers
  - C) A television commercial advertising a forthcoming subdivision
key: A
explanation: The definition of advertising in Conn. Gen. Stat. § 20‑311 expressly excludes a press
  release or other communication delivered to a media outlet for general information when the media
  outlet imposes no charge. The remaining answer choices involve promoting a property or service
  through electronic, broadcast, or outdoor media, which are included in the statutory definition of
  advertising. Consequently, only the press release described is not advertising.
