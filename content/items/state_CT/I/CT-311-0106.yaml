stem: According to Connecticut law, how are members of the Connecticut Real Estate Commission
  compensated for their service on the commission?
options:
  - They are not compensated but may be reimbursed for necessary expenses.
  - They receive a monthly stipend equal to state minimum wage.
  - They receive a salary set by the Governor annually.
  - They are paid a stipend for each meeting they attend.
key: A
explanation: The statute states that commission members shall not be compensated for their services
  but shall be reimbursed for necessary expenses incurred in the performance of their duties.
  Therefore, they receive no salary but may be reimbursed for expenses. The other options
  incorrectly suggest forms of compensation not authorized by law.
