stem: Two brokers have a disagreement over a commission and voluntarily submit the dispute to the
  Connecticut Real Estate Commission for resolution. According to Connecticut law, what authority
  does the Commission have?
options:
  - The commission lacks authority to act unless the dispute involves a salesperson.
  - The commission may act as a board of arbitration to decide the dispute.
  - The commission may only mediate the dispute but cannot decide it.
  - The commission must refer the dispute to the courts for resolution.
key: B
explanation: The statute expressly gives the commission the power to act as a board of arbitration
  to consider and decide any dispute over commissions arising between brokers or salespersons that
  is voluntarily submitted by the parties. Hence, the commission may decide the dispute. The
  distractor suggesting the commission may only mediate is incorrect because the law authorizes a
  decision, not just mediation.
