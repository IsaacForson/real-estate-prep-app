stem: A brokerage changes its designated broker. According to Connecticut law, within how many days
  must the brokerage notify the commission of this change?
options:
  - 10 days
  - 15 days
  - 30 days
  - 60 days
key: C
explanation: Conn. Gen. Stat. § 20-312(c) mandates that a business entity notify the commission of
  any change in the identity or contact information for its designated broker not later than thirty
  days after the change becomes effective. The other intervals do not meet the thirty‑day
  requirement.
