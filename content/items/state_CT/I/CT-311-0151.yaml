stem: Where must the Connecticut Real Estate Commission deposit fees it receives, **EXCEPT** for
  amounts required to be paid to the University of Connecticut or the Real Estate Guaranty Fund?
options:
  - The State Treasurer's Office
  - The University of Connecticut
  - The Real Estate Guaranty Fund
  - The General Fund Account
key: A
explanation: The statute requires the commission to deposit all moneys received from fees with the
  State Treasurer. After deposit, amounts not earmarked for the University of Connecticut or the
  Guaranty Fund become part of the General Fund, but the deposit itself is made with the State
  Treasurer. Therefore, the correct destination for the deposit is the State Treasurer's Office.
