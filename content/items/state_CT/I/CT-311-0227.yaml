stem: A business entity changes its designated broker on April 5. By what date must it notify the
  commission of the change?
options:
  - May 4
  - May 5
  - May 6
  - May 7
key: B
explanation: Under Conn. Gen. Stat. § 20-312(c), a business entity must notify the commission of a
  change in its designated broker not later than thirty days after the change becomes effective.
  Adding thirty days to April 5 yields May 5. The distractor “May 4” results from mistakenly
  counting only twenty‑nine days.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 - Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) - § 20-312(c)
  url: null
  quoted_text: Such business entity shall notify the commission of any change in the identity of, or
    contact information for, such designated broker not later than thirty days after such change
    becomes effective.
