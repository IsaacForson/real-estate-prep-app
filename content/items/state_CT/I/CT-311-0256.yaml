stem: A business entity changes its designated broker on April 15, 2025 and fails to notify the
  commission within the required period. What is the earliest date on which the commission could
  consider the violation to have occurred under Conn. Gen. Stat. § 20-312(c)?
options:
  - May 14, 2025
  - May 15, 2025
  - May 16, 2025
  - May 17, 2025
key: C
explanation: The entity must notify the commission not later than thirty days after the change,
  making May 15, 2025 the final day to comply. Failure to notify by that date means the violation
  first occurs on the following day, May 16, 2025. May 15 is the last permissible date, not a
  violation date.
