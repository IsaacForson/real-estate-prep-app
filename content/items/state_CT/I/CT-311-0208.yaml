stem: "Under Conn. Gen. Stat. § 20-311, a communication addressed to a person who has executed a
  contract for the purchase of a subdivider's lands is considered advertising only if:"
options:
  - It is considered advertising only if the communication concerns the sale of additional lands.
  - It is considered advertising only if the communication is sent via electronic mail.
  - It is considered advertising only if the communication includes photographs of the property.
  - It is considered advertising only if the communication is sent more than once to the same person.
key: A
explanation: The statute provides that such a communication is excluded from advertising unless it
  concerns the sale of additional lands. Thus, the communication is considered advertising only when
  it concerns the sale of additional lands. The distractor that focuses on the method of
  transmission (e.g., email) misstates the controlling condition, which is the content concerning
  additional lands.
