stem: A Connecticut real estate school submits an application to register a new prelicensing course.
  Which of the following items must be included in the application under Conn. Gen. Stat. §
  20-314e(a)?
options:
  - The list of all prospective students who have completed required prerequisite education and paid
    tuition for the course offering
  - The marketing plan for the course including promotional materials budget and instructor
    biography submitted to the department for approval
  - The outline of the course content detailing the total duration and time spent on each subject
    for the course
  - The copy of the school's most recent financial statement submitted together with the
    instructor's required qualifications for the course
key: C
explanation: Subsection (a)(1) requires an outline of the course content detailing the total
  duration and time spent on each subject. The other items, such as a financial statement, are not
  mandated by this subsection.
