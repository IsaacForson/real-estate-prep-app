stem: An applicant for a real estate broker's license took the national testing service examination
  in another state 18 months ago and received a satisfactory score. According to Conn. Gen. Stat. §
  20-314(c), what action may the commission take regarding the uniform portion of the written
  examination requirement?
options:
  - Waive the requirement
  - Require the examination
  - Double the fee
  - Extend the deadline
key: A
explanation: The statute allows the commission to waive the uniform portion if the applicant took
  the national exam in another state within two years and has a satisfactory score. Eighteen months
  is within that period, so waiver is permissible. Requiring the examination would ignore the waiver
  provision.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-314
  url: null
  quoted_text: The commission or commissioner may waive the uniform portion of the written examination
    requirement in the case of an applicant who has taken the national testing service examination
    in another state within two years from the date of application and has received a score deemed
    satisfactory by the commission or commissioner.
