stem: Under Conn. Gen. Stat. § 20-314(b), what is the initial registration fee for a school registration?
options:
  - The fee is fifty dollars only.
  - The fee is one hundred dollars.
  - The fee is one hundred fifty dollars.
  - The fee is two hundred dollars.
key: B
explanation: The statute explicitly states that the initial registration fee and renewal fee for
  each school registration shall be one hundred dollars. Therefore the correct amount is $100. The
  distractor of fifty dollars refers to the course registration fee under § 20-314e(a), not the
  school registration fee.
