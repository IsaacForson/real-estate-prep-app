    392 - Real Estate Licensees (2025 supplement) — § 20-311b"
  url: null
  quoted_text: The commission shall hold meetings and hearings in Hartford, in space provided by the
    Commissioner of Administrative Services, or at such places outside of Hartford as shall be
    determined by the chairman of the commission.
