stem: The Connecticut Real Estate Commission wishes to hold a meeting in New Haven to discuss
  pending license applications. According to Connecticut law, who determines whether the commission
  may hold a meeting outside Hartford?
options:
  - The Commissioner
  - The Governor
  - The chairman
  - The majority
key: C
explanation: The law states that meetings outside Hartford shall be determined by the chairman of
  the commission. Therefore, the chairman has the authority to approve a meeting location outside
  Hartford. The Commissioner, Governor, or a majority of members do not have this specific authority
  under the statute.
