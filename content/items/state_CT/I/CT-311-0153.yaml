stem: Under Conn. Gen. Stat. § 20-312(c), how many days does a business entity have to notify the
  commission of a change in the identity or contact information for its designated broker after the
  change becomes effective?
options:
  - Seven days
  - Fourteen days
  - Thirty days
  - Sixty days
key: C
explanation: The statute requires a business entity to notify the commission of any change to its
  designated broker’s identity or contact information within thirty days after the change becomes
  effective, making thirty days the correct answer. The distractor “Fourteen days” reflects the
  notice period for associate broker terminations, which does not apply to designated broker
  updates.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-312(c)
  url: null
  quoted_text: Such business entity shall notify the commission of any change in the identity of, or
    contact information for, such designated broker not later than thirty days after such change
    becomes effective.
  secondary: []
math:
  worked_solution: The statute states that notification must be made not later than thirty days after
    the change becomes effective. Therefore, the required number of days is 30.
