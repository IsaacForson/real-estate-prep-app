stem: Under Conn. Gen. Stat. § 20-314(f), a real estate broker's license expired on January 10, 2023
  and was not renewed. The licensee attempts to reinstate the license on January 10, 2026, having
  not worked in Connecticut during the lapse and having completed the required continuing education.
  What is the result?
options:
  - The license may be reinstated after paying only the renewal fee.
  - The license is ineligible for reinstatement and must apply for a new license.
  - The license may be reinstated after paying the renewal fee and late fees.
  - The license may be reinstated without paying any fees due to military service exemption.
key: B
explanation: The statute provides that if a license has lapsed for at least three years, the former
  licensee is ineligible for reinstatement and must apply for a new license. The lapse from January
  10, 2023 to January 10, 2026 is exactly three years, triggering this ineligibility. The other
  options incorrectly assume reinstatement is possible or that fees are waived.
