stem: An associate broker creates a printed flyer advertising a residential property for sale but
  omits the supervising licensee's name. Under Conn. Gen. Stat. § 20-312c(d), is this flyer
  compliant?
options:
  - Yes, as long as the broker's name appears somewhere in the flyer.
  - No, the associate broker must include the supervising licensee's name in all advertisements.
  - No, unless the advertisement is published in print media only.
  - Yes, because the flyer is not considered an advertisement under the statute.
key: B
explanation: The rule requires the supervising licensee's name to be included at a prominent
  location in all advertisements; omitting it violates the statute. The distractor that suggests
  including the broker's name instead is incorrect because the name of the supervising licensee, not
  the broker, is required.
