stem: A Connecticut real estate licensee's two-year license period ended on April 30, 2025. The
  licensee completed the required continuing education on June 10, 2025. What fee must the licensee
  pay to the department for failing to satisfy the continuing education requirement?
options:
  - $625.00
  - $000.00
  - $315.00
  - $125.00
key: C
explanation: The license period ended April 30, 2025 and continuing education was completed June 10,
  2025, which is within two months after expiration. According to Conn. Gen. Stat. § 20-319(e)(1),
  the fee is three hundred fifteen dollars. Therefore the correct amount is $315.00. The $625.00
  distractor applies only if completion occurs more than two months but not later than four months
  after expiration.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-319(e)(1)
  url: null
  quoted_text: Three hundred fifteen dollars if such licensee reports to the department, in a form and
    manner prescribed by the department, that such real estate licensee failed to satisfy such
    continuing education requirements during such license period but completed such continuing
    education requirements not later than two months after such license period expired;
  secondary: []
math:
  worked_solution: |-
    Determine license period end date: April 30, 2025.
    Determine completion date: June 10, 2025.
    Calculate elapsed time: 1 month 10 days (~1.33 months).
    Since elapsed ≤ 2 months, apply the $315 fee.
  formulas:
