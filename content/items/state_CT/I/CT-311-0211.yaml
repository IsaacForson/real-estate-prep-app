stem: A real estate team in Connecticut changes its supervising licensee on July 1, 2025. The team
  had previously filed its initial registration with the department. What fee must the team pay to
  the department for this change?
options:
  - $08.00
  - $15.00
  - $25.00
  - $50.00
key: C
explanation: Under Conn. Gen. Stat. § 20-319a(c), a fee of twenty‑five dollars shall be paid to the
  department for any change made to, or transfer of, a team's registration after the team files an
  initial registration. Therefore the correct amount is $25.00. The $08.00 distractor resembles the
  biennial continuing education processing fee, which does not apply to team registration changes.
