stem: A Connecticut real estate school's registration was issued on September 1, 2023. Assuming the
  school does **NOT** renew early, on what date will the registration expire?
options:
  - September 1, 2025
  - September 1, 2024
  - September 1, 2027
  - September 1, 2026
key: A
explanation: Under Conn. Gen. Stat. § 20-314(b), each school registration issued pursuant to this
  section shall expire biennially, meaning every two years. Adding two years to September 1, 2023
  gives an expiration date of September 1, 2025. The September 1, 2024 distractor assumes an annual
  renewal, while the September 1, 2026 distractor adds three years instead of two.
