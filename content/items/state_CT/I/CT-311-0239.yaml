stem: Under Conn. Gen. Stat. § 20-314(c), an applicant for a real estate broker's license may be
  waived from the uniform portion of the written examination if they have taken the national testing
  service examination in another state within what time frame prior to application?
options:
  - Six months period
  - One year period
  - Two years period
  - Three years period
key: C
explanation: The statute waives the uniform exam portion for applicants who have taken the national
  exam in another state within two years of applying and have a satisfactory score. The one‑year
  period is a common misconception; the law specifies two years.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-314
  url: null
  quoted_text: The commission or commissioner may waive the uniform portion of the written examination
    requirement in the case of an applicant who has taken the national testing service examination
    in another state within two years from the date of application and has received a score deemed
    satisfactory by the commission or commissioner.
