stem: A proprietary school has developed a prelicensing course curriculum and wishes to begin
  offering it to prospective salespersons in Connecticut. Under Conn. Gen. Stat. § 20-314d(2), what
  must the school do before it may offer any prelicensing or continuing education course in the
  state?
options:
  - The school must maintain an active registration with the department.
  - The school must submit annual financial statements to the department.
  - The school must obtain a bond from the Commissioner of Consumer Protection.
  - The school must secure approval of each instructor from the Real Estate Commission.
key: A
explanation: The statute plainly states that no school shall offer any prelicensing or continuing
  education course unless it maintains an active registration with the department under this
  section. Thus, maintaining an active registration is a prerequisite for offering courses. The
  option concerning instructor approval is incorrect because the law specifies that regulations
  shall not require approval of instructors at such schools.
