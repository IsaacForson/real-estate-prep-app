stem: An associate broker terminates affiliation with a supervising licensee on March 1 and
  affiliates with a different supervising licensee on March 10. According to Conn. Gen. Stat. §
  20-312c(c), by what date must the associate broker notify the department of the termination?
options:
  - March 31
  - April 10
  - March 24
  - March 15
key: D
explanation: The statute requires notification not later than fourteen calendar days after the
  earlier of termination or affiliation with another supervising licensee. Termination occurred on
  March 1, which is earlier than the March 10 affiliation, so the notice is due by March 15. March
  24 would be fourteen days after the later affiliation, which the rule does not use.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-312c(c)
  url: null
  quoted_text: If an associate broker's affiliation with a supervising licensee is terminated, the
    associate broker shall notify the department of such termination not later than fourteen
    calendar days after such termination or such associate broker's affiliation with another
    supervising licensee, whichever occurs first.
