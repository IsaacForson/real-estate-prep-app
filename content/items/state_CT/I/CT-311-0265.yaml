stem: A licensee terminates affiliation with a broker on March 1 and turns over all required
  information and records to the broker on March 5. According to Conn. State Agencies Reg. §
  20-328-10a(b), by what date must the broker provide the written accounting to the licensee?
options:
  - March 15
  - March 25
  - April 5
  - April 15
key: A
explanation: The broker must provide the accounting within ten days of the licensee turning over the
  records (March 5 + 10 days = March 15) or within forty‑five days of termination
  (March 1 + 45 days = April 15), whichever occurs earlier. The earlier date is March 15. The
  April 15 date reflects the forty‑five‑day deadline but ignores the earlier ten‑day trigger.
