stem: A licensee receives a referral fee for recommending a mortgage lender to a buyer but does not
  negotiate any real estate transaction. Under Conn. Gen. Stat. § 20-311, is this activity
  considered engaging in the real estate business?
options:
  - It is considered engaging in the real estate business because the licensee acted for another
    party.
  - It is not considered engaging in the real estate business because the fee was not paid by the
    buyer.
  - It is considered engaging in the real estate business because the licensee received a fee for a
    real‑related service.
  - It is not considered engaging in the real estate business because no negotiation or offer for
    real estate occurred.
key: D
explanation: Under Conn. Gen. Stat. § 20-311, to 'engage in the real estate business' means, while
  acting for another and for a fee, commission or other valuable consideration, to negotiate for or
  offer, or attempt to list for sale, sell, exchange, buy or rent an interest in real estate.
  Receiving a referral fee for a mortgage lender does not involve such negotiation or offer, so the
  activity does not meet the definition. The statement that it is considered engaging because the
  licensee acted for another party is incorrect because mere referral without negotiation does not
  satisfy the statutory definition.
