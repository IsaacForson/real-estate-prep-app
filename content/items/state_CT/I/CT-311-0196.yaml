stem: A member of the Connecticut Real Estate Commission is found to have violated state ethics
  laws. The Governor decides to remove the member for cause. What procedural step must the Governor
  take before the removal is effective?
options:
  - Providing notice and an opportunity to be heard
  - Obtaining a majority vote from the commission
  - Filing a complaint with the Department of Consumer Protection
  - Waiting until the member's term expires
key: A
explanation: The statute states the Governor may remove any member for cause upon notice and an
  opportunity to be heard. The other options are not required by law for removal.
