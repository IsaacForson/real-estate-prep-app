stem: A commissioner incurs $150 in mileage to attend a commission meeting in Hartford. May the
  commissioner be reimbursed for this expense?
options:
  - Yes, members shall be reimbursed for necessary expenses incurred while performing duties.
  - No, members are not compensated for any expenses related to commission duties.
  - Yes, but reimbursement requires prior approval from the commission chairperson.
  - No, unless the expense is directly tied to a licensing examination activity.
key: A
explanation: Under the statute, members are not compensated for their services but are reimbursed
  for necessary expenses incurred while performing their duties. Mileage for attending a commission
  meeting is a necessary expense related to duty performance, so it is reimbursable. The claim that
  members receive no compensation for any expenses overlooks the reimbursement provision for
  necessary expenses.
