math:
  worked_solution: The commissioner incurred $150 in mileage. According to Conn. Gen. Stat. § 20-311a,
    members shall be reimbursed for necessary expenses incurred in the performance of their duties.
    Attending a commission meeting is a duty, so the $150 mileage is a necessary expense and thus
    reimbursable. Therefore, the reimbursable amount is $150.
