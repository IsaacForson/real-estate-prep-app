stem: Which individual meets the definition of an associate broker under Conn. Gen. Stat. § 20-311?
options:
  - A broker who operates independently under his own license
  - A broker who is employed by a supervising licensee and may act on their behalf
  - A salesperson who provides services to a broker under a commission split
  - A broker who only refers clients to other brokers without conducting transactions
key: B
explanation: An associate broker must be affiliated with a supervising licensee and have authority
  to act on their behalf; the broker employed by a supervising licensee who may act on their behalf
  meets both criteria. A broker who operates independently under his own license lacks supervision,
  a salesperson who provides services to a broker under a commission split describes a salesperson
  rather than a broker, and a broker who only refers clients to other brokers without conducting
  transactions lacks authority to engage in business on behalf of another.
