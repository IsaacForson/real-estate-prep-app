stem: A licensee is renewing her two-year real estate license in Connecticut and must pay the
  continuing education processing fee. What is the amount of this fee?
options:
  - $25.00
  - $4.00
  - $15.00
  - $8.00
key: D
explanation: Under Conn. Gen. Stat. § 20-319(b), each real estate licensee shall pay a biennial
  eight‑dollar continuing education processing fee. Therefore the correct amount is $8.00. The $4.00
  distractor reflects the former annual fee that was replaced by the biennial $8 fee.
