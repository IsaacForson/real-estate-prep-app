stem: A licensee terminates affiliation with a broker on January 10 and turns over the required
  information and records to the broker on February 20. By what date must the broker provide the
  written accounting to the licensee?
options:
  - Mar 02
  - Feb 20
  - Feb 24
  - Mar 10
key: C
explanation: Per Conn. State Agencies Reg. § 20-328-10a(b), the broker must provide the written
  accounting within ten days of the licensee turning over the records or within forty‑five days of
  termination, whichever is earlier. Ten days after February 20 is March 2; forty‑five days after
  January 10 is February 24. The earlier date is February 24, so the broker must provide the
  accounting by that date. The option stating Feb 24 reflects the forty‑five‑day limit from
  termination, which is the earlier deadline.
