stem: The Governor appoints three licensed real estate brokers, two licensed real estate
  salespersons, and three public members to the Connecticut Real Estate Commission. All three public
  members reside in the same congressional district, leaving two districts with no commission
  member. Does this appointment satisfy the statutory requirement regarding congressional district
  representation?
options:
  - Yes, because the public members are electors of the state
  - No, because the statute requires at least one member from each congressional district
  - Yes, because the commission has the required number of brokers and salespersons
  - No, because the public members must be from different districts
key: B
explanation: The statute explicitly requires that there be at least one member from each
  congressional district. Having all three public members in the same district leaves two districts
  unrepresented, violating this requirement. One incorrect option cites the broker and salesperson
  counts as sufficient, while another incorrect option claims the public members must be from
  different districts; neither satisfies the statutory requirement that at least one member come
  from each congressional district.
