stem: A licensee emails a corporation's annual report to its shareholders as part of routine
  investor relations. Under Conn. Gen. Stat. § 20-311, how is this email classified?
options:
  - The communication is considered advertising only if the licensee receives a fee.
  - The communication is considered advertising only if it includes photographs.
  - The communication is not considered advertising.
  - The communication is considered advertising.
key: C
explanation: According to Conn. Gen. Stat. § 20-311(1)(B)(i), stockholder communications—including
  annual reports—are expressly excluded from the definition of advertising. Therefore, the email of
  the annual report is not considered advertising. The distractor that labels it advertising
  overlooks the statutory exemption for stockholder communications.
