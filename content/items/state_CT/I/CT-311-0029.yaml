stem: The Connecticut Real Estate Commission is convened to vote on a license renewal application.
  What condition must be satisfied for the Commission to have authority to act on this matter?
options:
  - The Commission must have a majority of its members present to exercise its powers
  - The Commission must have at least one member present to exercise its powers
  - The Commission must have all members present to act on licensing matters
  - The Commission must have the chairperson present to exercise its powers
key: A
explanation: A majority of the commission members must be present to constitute a quorum, which is
  necessary for the commission to exercise its powers, including voting on license renewals. Having
  only one member or only the chairperson present does not meet the quorum requirement. Requiring
  all members to be present imposes a stricter condition than the law demands.
