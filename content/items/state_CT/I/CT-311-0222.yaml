stem: A Connecticut real estate school plans to offer a prelicensing course entirely through
  recorded video lectures with no live interaction. According to Conn. Gen. Stat. § 20-314e(d), what
  is the outcome regarding department approval?
options:
  - The course will be approved if the school includes periodic interactive assessments.
  - The course will be approved because electronic means are allowed.
  - The course will be denied because it lacks a live online format.
  - The course will be approved only if offered in-person.
key: C
explanation: The statute provides that the department shall not approve any prelicensing course
  unless it is offered in-person or via electronic means that incorporates a live online format.
  Recorded video lectures lack real-time audio communication, so they do not satisfy the live-online
  requirement and therefore cannot be approved. The distractor about interactive assessments
  pertains to subsection (f), which only applies when electronic means lack real-time audio, but the
  course still fails the live-online condition of subsection (d).
