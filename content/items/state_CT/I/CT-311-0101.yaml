stem: A real estate team changes its supervising licensee. According to Conn. Gen. Stat. §
  20-312(f), within how many days must the team send notice of this change to the department?
options:
  - Twelve days.
  - Fifteen days.
  - Seven days.
  - Ten days.
key: A
explanation: The statute requires that a team send notice of any change to its registration
  information not later than twelve days after the date of the change. Thus, twelve days is the
  correct timeframe. The distractor of ten days is incorrect because the law specifies twelve days,
  not ten.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-312(f)
  url: null
  quoted_text: A team shall send notice to the department disclosing any change to the information
    contained in the team's registration form. The team shall send such notice to the department, on
    a form and in a manner prescribed by the Commissioner of Consumer Protection, not later than
    twelve days after the date of such change.
