stem: What is the application fee for a real estate salesperson license in Connecticut?
options:
  - The fee is exactly eighty dollars
  - The fee is exactly one hundred twenty dollars
  - The fee is exactly five hundred seventy dollars
  - The fee is exactly one thousand one hundred thirty dollars
key: A
explanation: Under Conn. Gen. Stat. § 20-314(c), the application fee for a real estate salesperson's
  license is eighty dollars. The fee for a broker's license is one hundred twenty dollars, while the
  initial license fees for salesperson and broker applications are five hundred seventy dollars and
  one thousand one hundred thirty dollars, respectively. Therefore, the eighty-dollar amount applies
  only to the salesperson application fee.
