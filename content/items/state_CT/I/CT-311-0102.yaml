stem: A limited liability company seeks a real estate broker license in Connecticut. Under Conn.
  Gen. Stat. § 20-312(b)(5)(C), what minimum percentage of the company's interest must be owned or
  controlled by licensed real estate brokers?
options:
  - Forty-nine percent.
  - Sixty percent.
  - Fifty percent.
  - Fifty-one percent.
key: D
explanation: The statute provides that for a limited liability company to qualify for a broker
  license, licensed brokers must own or control at least fifty-one percent of the interest.
  Therefore, fifty-one percent is the required minimum. The distractor of fifty percent is incorrect
  because the law demands at least fifty-one percent, not fifty.
