stem: Under Conn. Gen. Stat. § 20-314a(b), the commission may exempt an applicant for a real estate
  broker's license from the experience requirement if the applicant is unable to meet the
  requirement solely because of discrimination based on which of the following?
options:
  - The applicant has been subjected to discrimination based on age or disability.
  - The applicant has been subjected to discrimination based on religion or gender.
  - The applicant has been subjected to discrimination based on national origin or ancestry.
  - The applicant has been subjected to discrimination based on race, creed, or color.
key: D
explanation: The statute allows an exemption only when the applicant's inability to meet the
  experience requirement is due to discrimination based on race, creed, or color. The other options
  mention protected classes such as age, disability, religion, gender, national origin, or ancestry,
  which are not covered by this provision, so they are incorrect.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-314a
  url: null
  quoted_text: (b) The commission or department may exempt any applicant for a real estate broker's
    license from the requirements concerning experience under the provisions of subsection (d) of
    section 20-314 , if the commission or department determines that such applicant is unable to
    meet such requirements solely because such applicant has been subjected to discrimination based
    on race, creed or color, which discrimination interfered with such applicant's ability to meet
    such requirements.
