stem: A Connecticut real estate school intends to offer its prelicensing curriculum entirely via
  live video conferencing. Under Conn. Gen. Stat. § 20-314a(a), what must be true for the school to
  avoid disapproval solely because the instruction is electronic?
options:
  - The course must obtain separate approval for each instructor from the Commissioner.
  - The course must satisfy the requirements established in section 20-314e.
  - The course must be registered with the department before any instruction begins.
  - The course must be offered at least partially in a physical classroom setting.
key: B
explanation: The statute provides that a course may not be disapproved solely for being offered by
  electronic means if it satisfies the requirements established in section 20-314e. Therefore,
  meeting those requirements is the condition that prevents disapproval on electronic‑means grounds.
  The option requiring a physical classroom component is incorrect because the law does not mandate
  any in‑person instruction when the electronic course meets the statutory requirements.
