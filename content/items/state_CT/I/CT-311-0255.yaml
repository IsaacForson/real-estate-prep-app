stem: A real estate team changes its supervising licensee on March 10, 2025. By what date must the
  team send notice of this change to the department under Conn. Gen. Stat. § 20-312(f)?
options:
  - March 26, 2025
  - March 24, 2025
  - March 22, 2025
  - March 20, 2025
key: C
explanation: The team must notify the department not later than twelve days after the change. March
  10 plus twelve days equals March 22, 2025. March 20 is too early, while March 24 and March 26
  exceed the allowed period.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-312(f)
  url: null
  quoted_text: A team shall send notice to the department disclosing any change to the information
    contained in the team's registration form. The team shall send such notice to the department, on
    a form and in a manner prescribed by the Commissioner of Consumer Protection, not later than
    twelve days after the date of such change.
