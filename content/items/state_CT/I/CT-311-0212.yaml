stem: Under Conn. Gen. Stat. § 20-314(c), how long after paying the application fee is an applicant
  entitled to take the real estate licensing examination?
options:
  - A period of three years
  - A period of six months
  - A period of two years
  - A period of one year
key: D
explanation: The statute states that each payment of the application fee entitles the applicant to
  take the examination within the one-year period from the date of payment. Therefore, the correct
  period is one year. A six‑month period is incorrect because the law specifies a full year, not a
  shorter interval.
