explanation: The statute states that not more than a bare majority of the commission may be members
  of the same political party. With eight members, a bare majority is five, so up to five may share
  a party affiliation. The distractor suggesting four members is incorrect because four is less than
  a bare majority and does not represent the maximum allowed.
