stem: Mr. Davis, a licensed broker who also operates a Connecticut real estate school, registers
  four new prelicensing courses for the next licensing period. What total fee must he pay to the
  department for these course registrations?
options:
  - $100.00
  - $150.00
  - $200.00
  - $250.00
key: C
explanation: Each course registration costs fifty dollars per Conn. Gen. Stat. § 20-314e(a).
  Multiplying four courses by $50.00 yields a total of $200.00. The $150.00 distractor results from
  multiplying three courses instead of four, and the $250.00 distractor adds an extra $50.00
  erroneously.
