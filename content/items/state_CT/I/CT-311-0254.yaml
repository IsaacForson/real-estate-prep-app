stem: Under Conn. Gen. Stat. § 20-312(f), a team must send notice of a change to its registration
  form to the department within how many days after the change?
options:
  - Six days
  - Ten days
  - Twelve days
  - Fourteen days
key: C
explanation: The rule states that a team shall send notice of any change to its registration form
  not later than twelve days after the date of such change. Therefore twelve days is the required
  period. Ten days is a common misconception but does not match the statutory language.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-312(f)
  url: null
  quoted_text: A team shall send notice to the department disclosing any change to the information
    contained in the team's registration form. The team shall send such notice to the department, on
    a form and in a manner prescribed by the Commissioner of Consumer Protection, not later than
    twelve days after the date of such change.
