stem: After the Governor appoints eight individuals to the Connecticut Real Estate Commission, all
  appointees reside in the state's first congressional district. Which statement correctly describes
  the compliance of this appointment with Connecticut law?
options:
  - The appointment is non‑compliant because the commission requires equal representation from each
    district
  - The appointment is non‑compliant because at least one member must come from each congressional
    district
  - The appointment is compliant because members may reside in any district as electors
  - The appointment is compliant because the commission meets broker and salesperson quotas
key: B
explanation: The statute requires at least one member from each congressional district; having all
  appointees from the first district violates this requirement. The distractor claiming equal
  representation is required is incorrect because the law only mandates at least one member per
  district, not equal numbers.
