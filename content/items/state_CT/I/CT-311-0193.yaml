stem: A real estate team wants to register the name 'Johnson Associates Team'. Under Conn. Gen.
  Stat. § 20-312(e)(1)(C), why would this name be rejected?
options:
  - Inclusion of the term 'associates' implying a business entity
  - Exceeding the allowed character limit for team names
  - Missing the full name of a licensed broker or salesperson
  - Absence of the 'at/of' phrase before the supervising licensee's name
key: A
explanation: The rule prohibits any term that implies the team is a business entity, such as
  'associates', 'company', or 'LLC'. The name includes 'associates', so it violates this provision.
  Missing the full name of a licensee is not automatically disqualifying because the name may
  instead be followed by 'at/of' and the supervising licensee’s name.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
