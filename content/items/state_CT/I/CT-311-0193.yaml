  url: null
  quoted_text: (C) With the exception of “team”, not include any abbreviation, term or phrase,
    including, but not limited to, “associates”, “company”, “corporation”, “group”, “LLC”, “real
    estate” or “realty”, that implies that such team is a business entity;
