stem: A licensee sends a press release to a local newspaper announcing a new office opening, and the
  newspaper does not charge for publication. How is this communication classified under Conn. Gen.
  Stat. § 20-311?
options:
  - The communication is considered advertising.
  - The communication is not considered advertising.
  - The communication is considered advertising only if it includes photographs.
  - The communication is considered advertising only if the licensee receives a fee.
key: B
explanation: Under Conn. Gen. Stat. § 20-311(1)(B)(iv), a press release delivered to a media outlet
  for general information or public relations purposes is not considered advertising when no charge
  is imposed by the media outlet. Since the newspaper did not charge for publication, the
  communication falls within this exemption. The distractor that calls it advertising ignores the
  statutory exemption for unpaid press releases.
