stem: An associate broker posts a social media advertisement for a rental unit and places the
  supervising licensee's name only in a hashtag at the end of the post. According to Conn. Gen.
  Stat. § 20-312c(d), does this satisfy the disclosure requirement?
options:
  - No, the name must be displayed at a prominent location in the advertisement.
  - Yes, because any inclusion of the name meets the requirement.
  - No, unless the advertisement is boosted with paid promotion.
  - Yes, provided the broker's license number is also included in the post.
key: A
explanation: The statute mandates that the supervising licensee's name appear at a prominent
  location in all advertisements; placing it only in a hashtag does not satisfy the prominence
  requirement. The distractor claiming any inclusion is sufficient misinterprets the prominence
  standard.
