stem: Under Conn. Gen. Stat. § 20-312(d), what is the maximum fine the Real Estate Commission may
  impose per violation for engaging in the real estate business without a license?
options:
  - Ten thousand dollars per violation.
  - Two thousand five hundred dollars per violation.
  - One thousand dollars per violation.
  - Five thousand dollars per violation.
key: D
explanation: The statute states that the Real Estate Commission may impose a fine of not more than
  five thousand dollars per violation for unlicensed real estate activity. Therefore, five thousand
  dollars is the correct maximum. The distractor of one thousand dollars is incorrect because the
  statute sets the ceiling at five thousand, not one thousand.
