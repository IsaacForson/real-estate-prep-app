stem: According to Conn. Gen. Stat. § 20-312c(d), what must an associate broker include in all of
  their advertisements?
options:
  - The associate broker's license number displayed in the header of all advertisements
  - The issue date of the associate broker's license at a prominent location in all advertisements
  - The brokerage's telephone number and email address at a prominent location in all advertisements
  - The name of the supervising licensee at a prominent location in all advertisements
key: D
explanation: The statute requires associate brokers to include the name of the supervising licensee
  who controls and supervises them at a prominent location in all advertisements. The other options
  describe information that is not mandated by this provision.
