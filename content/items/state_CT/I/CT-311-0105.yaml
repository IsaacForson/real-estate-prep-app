stem: If six members of the Connecticut Real Estate Commission are registered with the same
  political party, is this composition permissible under Connecticut law?
options:
  - It is permissible because the law allows up to a bare majority of members from the same party.
  - It is permissible because the law does not restrict party affiliation beyond the bare majority
    requirement.
  - It is not permissible because the commission must have equal numbers of members from each
    political party.
  - It is not permissible because more than a bare majority of the commission would be from the same
    party.
key: D
explanation: With eight members, a bare majority is five; six members from the same party exceeds
  that limit, making the composition impermissible. The distractor claiming permissibility
  misapplies the bare majority rule.
