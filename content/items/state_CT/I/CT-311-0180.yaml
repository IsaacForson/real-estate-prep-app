stem: Under Conn. Gen. Stat. § 20-314a(b), what condition must the commission or department find to
  exempt an applicant for a real estate broker's license from the experience requirement?
options:
  - The commission or department determines that the applicant is unable to meet the experience
    requirement solely because the applicant has been subjected to discrimination based on race,
    creed, or color that interfered with the ability to meet the requirement.
  - The commission or department determines that the applicant has completed the required
    prelicensing education, has passed the state licensing examination, has fulfilled all other
    statutory prerequisites including the required ethics course and mandatory continuing education
    hours, but lacks the required sales experience.
  - The commission or department determines that the applicant has been a licensed salesperson for
    at least two years, has completed the required prelicensing and postlicensing courses, has
    maintained an active license in good standing, but has not yet satisfied the experience
    threshold for broker licensure.
  - The commission or department determines that the applicant has paid the examination fee,
    submitted a clean criminal background check, provided proof of identity and residency, and
    satisfied all administrative requirements, yet has not demonstrated the necessary experience.
key: A
explanation: The statute explicitly allows an exemption from the experience requirement when the
  applicant's inability to meet that requirement is solely due to discrimination based on race,
  creed, or color that interfered with the ability to meet the requirement. The other options
  describe situations that do not involve the required discrimination finding and therefore do not
  satisfy the statutory condition for exemption.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-314a(b)
  url: null
  quoted_text: (b) The commission or department may exempt any applicant for a real estate broker's
    license from the requirements concerning experience under the provisions of subsection (d) of
    section 20-314 , if the commission or department determines that such applicant is unable to
    meet such requirements solely because such applicant has been subjected to discrimination based
    on race, creed or color, which discrimination interfered with such applicant's ability to meet
    such requirements.
