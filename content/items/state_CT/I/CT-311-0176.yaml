stem: During a scheduled meeting, only three of the eight commission members are present. The
  commission attempts to vote on a license renewal. According to Connecticut law, what is the
  result?
options:
  - The vote is valid because any number present can act
  - The vote is valid if the chairman approves
  - The vote is invalid because a quorum is not present
  - The vote is valid only if the matter concerns licensing
key: C
explanation: A majority of the commission members is required to constitute a quorum for exercising
  the commission’s powers. With only three of eight members present, a majority is lacking, so the
  commission lacks authority to act and the vote is invalid. The other options incorrectly suggest
  that the vote could be valid under other conditions.
