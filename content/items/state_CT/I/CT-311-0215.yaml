stem: A buyer suffers losses due to a seller's agent's fraudulent misrepresentation and seeks
  payment from the Real Estate Guaranty Fund. What must the buyer do at the time of filing the
  lawsuit to satisfy the statutory requirement?
options:
  - To notify the commission or department in writing at the time the action is commenced
  - To notify the commission or department orally at the time the action is filed
  - To notify the commission or department in writing only after receiving a court judgment
  - To notify the commission or department in writing within ten days after the lawsuit is filed
key: A
explanation: Under Conn. Gen. Stat. § 20-324e(a), an aggrieved person who commences an action that
  may result in payment from the Guaranty Fund must notify the commission or department in writing
  at the time the action begins. This written notice is a prerequisite for later seeking fund
  payment. The distractors describe alternative timings or forms of notice that the statute does not
  accept.
