stem: Five members of the Connecticut Real Estate Commission are registered as members of the same
  political party. Is this composition permissible under Connecticut law?
options:
  - No, because the law prohibits any party from having more than half the members.
  - Yes, because the law allows up to a bare majority of members from the same political party.
  - No, because the law requires exactly four members from each party.
  - Yes, as long as at least one member is from each congressional district.
key: B
explanation: The law states that not more than a bare majority of the commission may be members of
  the same political party. A bare majority of an eight‑member commission is five, so five members
  from one party is allowed.
