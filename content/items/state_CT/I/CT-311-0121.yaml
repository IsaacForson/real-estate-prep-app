stem: Under Conn. Gen. Stat. § 20-311, a licensee emails a prospective buyer a property description
  with photographs. Is this communication considered advertising?
options:
  - It is considered advertising because written or photographic material sent via electronic mail
    is included in the definition.
  - It is not considered advertising because electronic mail communications are excluded from the
    definition.
  - It is considered advertising only if the email is also posted on a public website.
  - It is not considered advertising because the recipient is a prospective buyer, not the general
    public.
key: A
explanation: The definition explicitly includes written or photographic material disseminated via
  electronic mail as advertising. Therefore, the email with a property description and photos
  qualifies as advertising. The distractor claiming email is excluded contradicts the statutory
  language.
