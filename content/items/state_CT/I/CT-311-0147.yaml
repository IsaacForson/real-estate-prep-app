stem: What must the chairperson of the Connecticut Real Estate Commission do before assuming office
  according to Conn. Gen. Stat. § 20-311d?
options:
  - Be appointed by the Governor of Connecticut after confirmation by the State Senate to serve as
    chairperson
  - Take and file an oath of office before the first commission meeting, as required by state ethics
    law
  - Be bonded under section 4-20 with the condition to faithfully perform duties and account for
    funds
  - Receive a stipend for attending commission meetings as chairperson, as outlined in the
    commission's bylaws
key: C
explanation: The statute requires the chairperson to be bonded under section 4-20, with the
  condition that the chairperson faithfully perform the duties of the office and account for all
  funds received pursuant to the office. The oath requirement applies to all members under a
  different subsection, not specifically to the chairperson under §20-311d. Compensation is
  prohibited for commission members, and election by the commission is not mentioned.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-311d
  url: null
  quoted_text: The chairperson of the commission shall be bonded under the provisions of section 4-20
    , in such sum as the State Insurance and Risk Management Board may prescribe, with the condition
    that the chairperson faithfully perform the duties of the office and account for all funds
    received pursuant to the office.
