stem: The Governor appoints the eight members of the Connecticut Real Estate Commission on May 10.
  By what date must the commission meet to organize, according to Connecticut law?
options:
  - The commission must meet by May 31.
  - The commission must meet by June 9.
  - The commission must meet by June 15.
  - The commission must meet by July 10.
key: B
explanation: The law requires the commission to meet within thirty days after the appointment of its
  members to organize. Counting thirty days from May 10 leads to June 9 as the deadline. Options
  earlier than June 9 do not satisfy the thirty‑day requirement, and later options exceed it.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
    Real Estate Licensees (2025 supplement) — § 20-311b
  url: null
  quoted_text: Within thirty days after the appointment of the members of the commission, the
    commission shall meet in the city of Hartford for the purpose of organizing by selecting such
    officers other than a chairperson as the commission may deem necessary and appropriate.
