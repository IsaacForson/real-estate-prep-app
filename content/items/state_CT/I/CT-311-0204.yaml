stem: A broker and a salesperson bring a commission dispute before the commission but do not submit
  a voluntary written request for arbitration. What is the commission’s authority to decide the
  dispute?
options:
  - It has no authority to decide the dispute.
  - It may decide if the parties later agree to arbitrate.
  - It may act as arbitrator only after voluntary submission.
  - It must refer the dispute to a court for resolution.
key: C
explanation: Under Conn. Gen. Stat. ch. 392, § 20‑311f, the commission may serve as a board of
  arbitration only when the dispute is voluntarily submitted by the parties. If no voluntary written
  request for arbitration is made, the commission lacks authority to decide the dispute.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-311f
  url: null
  quoted_text: The commission shall have the power to act as a board of arbitration to consider and
    decide any dispute over commissions arising between brokers or salespersons that is voluntarily
    submitted to the commission by the parties to such dispute
