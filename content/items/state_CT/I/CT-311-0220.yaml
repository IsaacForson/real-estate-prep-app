stem: Which of the following individuals is eligible to serve as a public member of the Connecticut
  Real Estate Commission?
options:
  - A non‑resident of Connecticut who is a registered voter in another state
  - A licensed real estate broker who is a registered voter in Connecticut
  - A registered voter in Connecticut who is not a licensed real estate broker or salesperson
  - A licensed real estate salesperson who is a registered voter in Connecticut
key: C
explanation: Under Conn. Gen. Stat. § 20-311a(b), public members must be electors of the state and
  cannot be licensed real estate brokers or salespersons. The choice that describes a registered
  voter in Connecticut who is not a licensed broker or salesperson meets both requirements. The
  other choices describe a licensed salesperson, a non‑resident voter, or a licensed broker, none of
  which are eligible as public members.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
