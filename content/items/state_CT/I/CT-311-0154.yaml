math:
  worked_solution: "Step 1: Total fees collected = $12,000.\\nStep 2: Amount to be paid to the
    University of Connecticut = $4,000.\\nStep 3: Amount to be paid to the Real Estate Guaranty Fund
    = $1,000.\\nStep 4: Calculate remaining amount = Total - (UConn amount + Guaranty Fund amount) =
    $12,000 - ($4,000 + $1,000) = $12,000 - $5,000 = $7,000.\\nStep 5: By statute, the remaining
    amount goes to the General Fund."
