stem: The Connecticut Real Estate Commission collects $12,000 in licensing fees during a month.
  Statute requires $4,000 to be paid to the University of Connecticut and $1,000 to the Real Estate
  Guaranty Fund. Where does the remaining $7,000 belong after the Commission deposits the fees with
  the State Treasurer?
options:
  - Real Guaranty Fund
  - University of CT
  - The General Fund
  - Treasurer Office
key: C
explanation: Under Conn. Gen. Stat. ch. 392, § 20-311e, after depositing all fees with the State
  Treasurer, any amount not required to be paid to the University of Connecticut or the Real Estate
  Guaranty Fund becomes part of the General Fund. Therefore, the remaining $7,000 belongs to the
  General Fund.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-311e
  url: null
  quoted_text: The commission shall deposit all moneys received by it from fees in accordance with the
    provisions of this chapter with the State Treasurer, and they shall, except as to that portion
    thereof required to be paid over to The University of Connecticut under the provisions of
    section 10a-125 , or that portion required to be paid to the Real Estate Guaranty Fund pursuant
    to this chapter, become part of the General Fund.
