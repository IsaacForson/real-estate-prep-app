stem: A real estate salesperson works as an independent contractor for a broker, showing homes and
  negotiating offers. According to Conn. Gen. Stat. § 20-311, how is the salesperson's relationship
  to the broker classified?
options:
  - Not affiliated because the salesperson is not an employee
  - Not affiliated unless a written employment contract exists
  - Affiliated due to an independent contractor relationship
  - Affiliated only if the salesperson also receives a salary
key: C
explanation: The definition of "affiliated" includes both employer‑employee and
  independent‑contractor relationships, so a salesperson who works as an independent contractor is
  considered affiliated with the broker. The choice stating the salesperson is not affiliated
  because he is not an employee is incorrect because affiliation does not require employment. The
  choice that says affiliation exists only if a written employment contract exists is incorrect
  because a written contract is not required. The choice that limits affiliation to situations where
  the salesperson also receives a salary is incorrect because no salary is needed for affiliation.
