stem: Under Connecticut law, where must the Real Estate Commission deposit fees it receives,
  **EXCEPT** for amounts earmarked for the University of Connecticut or the Real Estate Guaranty
  Fund?
options:
  - The commission must deposit the fees with the State Treasurer.
  - The commission must deposit the fees in a separate escrow account.
  - The commission must deposit the fees directly into the Real Estate Guaranty Fund.
  - The commission may retain the fees for its operating expenses.
key: A
explanation: The statute requires the commission to deposit all moneys received from fees with the
  State Treasurer, except amounts required for UConn or the Guaranty Fund, which become part of the
  General Fund. Therefore, the correct destination is the State Treasurer. The distractor suggesting
  a separate escrow account is incorrect because the law does not mandate such an account for fee
  deposits.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-311e
  url: null
  quoted_text: The commission shall deposit all moneys received by it from fees in accordance with the
    provisions of this chapter with the State Treasurer, and they shall, except as to that portion
    thereof required to be paid over to The University of Connecticut under the provisions of
    section 10a-125 , or that portion required to be paid to the Real Estate Guaranty Fund pursuant
    to this chapter, become part of the General Fund.
