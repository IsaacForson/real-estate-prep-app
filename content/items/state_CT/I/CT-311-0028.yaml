stem: A licensed real estate salesperson serving as a member of the Connecticut Real Estate
  Commission resigns effective immediately. According to Connecticut law, what action must the
  Governor take regarding the vacancy?
options:
  - The Governor must leave the vacancy unfilled until the next appointment cycle
  - The Governor must appoint a successor to serve the unexpired term and until a new successor
    qualifies
  - The Governor must require the remaining members to vote to fill the vacancy
  - The Governor must appoint a successor to serve a full new term starting next fiscal year
key: B
explanation: The law requires the Governor to appoint a successor who serves for the unexpired
  portion of the vacated term and until that successor’s own successor is appointed and qualifies.
  Leaving the vacancy open or letting the remaining members vote internally does not satisfy this
  requirement. Appointing someone to a full new term contradicts the provision limiting the
  appointment to the unexpired portion.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
