stem: Under Conn. Gen. Stat. § 20-312(g), what must a real estate team include in all of its
  advertisements?
options:
  - The team must include the name of the team's supervising licensee at a prominent location in all
    advertisements.
  - The team must include the team's registration number at a prominent location in all
    advertisements.
  - The team must include the broker's license number at a prominent location in all advertisements.
  - The team must include the team's email address at a prominent location in all advertisements.
key: A
explanation: The statute requires teams to include the name of the supervising licensee at a
  prominent location in all advertisements. The distractor about the registration number is
  incorrect because the law does not mandate displaying the team's registration number in ads.
