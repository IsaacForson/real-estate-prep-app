stem: A school wants to hire an instructor to teach a continuing education course on real estate
  finance. Which qualification satisfies the requirement under Conn. Gen. Stat. § 20-314(c) for the
  instructor?
options:
  - At least five years of experience as a practicing real estate licensee
  - At least three years of experience as a practicing real estate licensee
  - At least five years of experience as a real estate appraiser
  - At least five years of experience teaching real estate courses in a informal setting
key: A
explanation: The statute requires the instructor to have at least five years of experience as a
  practicing real estate licensee. Having only three years of experience or experience in a
  different role does not meet this requirement.
