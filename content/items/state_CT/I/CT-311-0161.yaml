stem: According to Connecticut law, what is the minimum age at which a person may be issued a real
  estate license?
options:
  - The minimum age for licensure is sixteen years
  - The minimum age for licensure is eighteen years
  - The minimum age for licensure is twenty-one years
  - The minimum age for licensure is not specified
key: B
explanation: The statute explicitly states that no real estate license shall be issued to anyone
  younger than eighteen years of age, establishing eighteen as the minimum. The option stating
  twenty-one years is incorrect because the law does not set the minimum age at that level.
