stem: Under Conn. Gen. Stat. § 20-311, a licensee sends a press release to a newspaper announcing a
  new property listing; the newspaper publishes it at no charge. Is this communication considered
  advertising?
options:
  - It is considered advertising because the press release promotes a property listing.
  - It is not considered advertising because press releases to media outlets with no charge are
    excluded from the definition.
  - It is considered advertising because any written material disseminated via online means
    qualifies as advertising.
  - It is not considered advertising because only paid media communications are considered
    advertising.
key: B
explanation: The definition excludes press releases delivered to media outlets for general
  information or public relations purposes when no charge is imposed. Since the newspaper published
  the release at no charge, it is not advertising. The distractor that calls it advertising ignores
  this specific exclusion.
