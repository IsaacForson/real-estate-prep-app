stem: Which of the following is included in the definition of 'advertising' under Conn. Gen. Stat. §
  20-311?
options:
  - It is a press release sent to a newspaper for general information with no charge imposed.
  - It is a stockholder communication, such as an annual report, that is excluded from advertising.
  - It is a written or photographic material disseminated via online electronic mail.
  - It is a prospectus required by a federal agency to be delivered to a prospective purchaser.
key: C
explanation: "The definition of advertising includes written or photographic material disseminated
  via online, telephonic notification, electronic mail or other electronic means. The other options
  are explicitly excluded: press releases with no charge, stockholder communications, and federally
  required prospectuses are not advertising."
