stem: According to Conn. Gen. Stat. § 20-312(c), within how many days must a business entity notify
  the commission of a change in the identity or contact information for its designated broker?
options:
  - Fifteen days
  - Sixty days
  - Thirty days
  - Five days
key: C
explanation: Conn. Gen. Stat. § 20-312(c) requires that a business entity notify the commission of
  any change in the identity or contact information for its designated broker not later than thirty
  days after the change becomes effective. Therefore the correct answer is thirty days. Fifteen days
  is incorrect because it confuses the timeline for team supervising licensee changes, which is
  twelve days.
