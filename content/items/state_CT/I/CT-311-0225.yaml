stem: The Governor appoints five members of the Connecticut Real Estate Commission who are
  registered Democrats and three members who are registered Republicans. Does this appointment
  comply with the statutory limitation on political party representation?
options:
  - Yes, because a bare majority of eight members is five
  - No, because the statute prohibits any political party from having a majority of members
  - No, because the commission must have an equal number of members from each major party
  - Yes, because the Governor may appoint any combination of party affiliations
key: A
explanation: Under Conn. Gen. Stat. § 20-311a(b), not more than a bare majority of the commission
  may belong to the same political party. For an eight‑member commission, a bare majority is five,
  so five Democrats and three Republicans does not exceed that limit. The claim that the Governor
  may appoint any combination of party affiliations is incorrect, as is the claim that the
  commission must have equal numbers from each major party, and the claim that the statute prohibits
  any party from having a majority is also incorrect.
