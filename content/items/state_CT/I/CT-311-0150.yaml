stem: According to Connecticut law, how are members of the Connecticut Real Estate Commission
  compensated for their service on the commission?
options:
  - They receive a fixed annual salary established by state statute.
  - They receive no compensation but are reimbursed for necessary expenses.
  - They receive a stipend based on the number of licenses issued.
  - They receive a per‑diem allowance for each commission meeting.
key: B
explanation: The statute explicitly states that commission members shall not be compensated for
  their services but shall be reimbursed for necessary expenses incurred in the performance of their
  duties. Therefore, the correct description is that they receive no compensation but are reimbursed
  for necessary expenses. The distractor about a fixed annual salary is incorrect because the law
  prohibits any compensation beyond expense reimbursement.
