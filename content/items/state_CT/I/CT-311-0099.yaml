stem: The Connecticut Real Estate Commission collects $15,000 in license fees during a quarter, none
  of which is designated for the University of Connecticut or the Real Estate Guaranty Fund. Where
  must this money be deposited?
options:
  - The commission must deposit the fees into its own operating account.
  - The commission must deposit the fees into the State Treasurer's General Fund.
  - The commission must deposit the fees into a trust account for future refunds.
  - The commission must deposit the fees into the Real Estate Guaranty Fund.
key: B
explanation: Because the law requires deposit of all fees with the State Treasurer, and amounts not
  earmarked for UConn or the Guaranty Fund become part of the General Fund, the $15,000 must go into
  the General Fund. The distractor proposing deposit into the commission's operating account is
  wrong as the statute does not permit the commission to retain fees for its own use.
citation:
  source: Conn. Gen. Stat. ch. 392, § 20-311e
  url: null
  quoted_text: The commission shall deposit all moneys received by it from fees in accordance with the
    provisions of this chapter with the State Treasurer, and they shall, except as to that portion
    thereof required to be paid over to The University of Connecticut under the provisions of
    section 10a-125 , or that portion required to be paid to the Real Estate Guaranty Fund pursuant
    to this chapter, become part of the General Fund.
