stem: Which of the following best describes a 'designated buyer agent'?
options:
  - A real estate licensee who represents both buyer and seller in the same transaction without
    separate agreements.
  - A real estate licensee who is designated by the broker to represent a named buyer or tenant
    client during a buyer representation agreement.
  - A real estate licensee who is employed by a broker to handle property management duties.
  - A real estate licensee who acts as an independent contractor for a broker while negotiating
    offers.
key: B
explanation: Under Conn. Gen. Stat. § 20-311(12), a designated buyer agent is a real estate licensee
  who is designated by the broker to solely represent a named buyer or tenant client during a buyer
  representation agreement. The option stating that a licensee represents both buyer and seller in
  the same transaction describes dual agency, which is not the definition of a designated buyer
  agent. The option stating that a licensee is employed by a broker to handle property management
  duties pertains to property management, not buyer agency. The option stating that a licensee acts
  as an independent contractor for a broker while negotiating offers describes an independent
  contractor role, which does not capture the designated buyer agent relationship.
citation:
  source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Connecticut General Statutes Chapter 392 -
