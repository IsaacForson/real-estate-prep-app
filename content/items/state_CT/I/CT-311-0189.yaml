  url: null
  quoted_text: “Designated buyer agent” means a real estate licensee who is designated by the real
    estate broker by whom such real estate licensee is employed, or with whom such real estate
    licensee is affiliated, solely to represent a named buyer or tenant client of the real estate
    broker during the term of a buyer representation agreement or authorization;
