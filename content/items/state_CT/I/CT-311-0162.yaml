stem: Under Conn. Gen. Stat. § 20-311, which of the following communications is considered advertising?
options:
  - A prospectus required by a federal agency and delivered to a prospective purchaser
  - A stockholder communication such as an annual report distributed to shareholders
  - An email to a prospective buyer containing a property description and photographs
  - A press release sent to a newspaper for general information, with no charge imposed
key: C
explanation: The definition of advertising includes written or photographic material disseminated
  via electronic mail, making the email with photos advertising. A press release with no charge is
  excluded under (1)(B)(iv), a stockholder communication under (1)(B)(i), and a federal agency
  prospectus under (1)(B)(ii).
