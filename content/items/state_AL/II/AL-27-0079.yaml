stem: A qualifying broker who offers vacation time-sharing plans fails to retain copies of contracts
  from each sale for the required period. According to Ala. Code § 34-27-52(2), for how long must
  the contract be retained after parties have completely performed their obligations?
options:
  - For at least two years after parties have completely performed their obligations
  - For at least five years after parties have completely performed their obligations
  - For at least three years after parties have completely performed their obligations
  - For at least one year after parties have completely performed their obligations
key: C
explanation: Ala. Code § 34-27-52(2) mandates that copies of each sale contract be retained for at
  least three years after the parties have fully performed their obligations. The option stating a
  two-year retention period is a frequent error because other recordkeeping rules in the statute
  reference two-year periods, but the specific contract requirement is three years.
citation:
