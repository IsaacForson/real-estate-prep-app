stem: A salesperson licensed under Qualifying Broker XYZ places an online advertisement that reads
  'Expert Agent – Jane Doe – Helping You Buy or Sell Homes' without displaying the name 'XYZ Realty'
  in the ad. Under Ala. Code § 34-27-1(b)(15), what violation has occurred?
options:
  - Advertising without the qualifying broker's name appearing prominently as required.
  - Advertising that contains a false promise about guaranteed sale price.
  - Advertising that includes the qualifying broker's name but in a smaller font than other text.
  - Advertising that uses the term 'for sale' but omits the property address.
key: A
explanation: The rule prohibits a salesperson from advertising as a real estate agent without the
  qualifying broker's name appearing prominently; the advertisement omits the broker's name
  entirely, thus violating this provision. The distractor about a smaller font still includes the
  name, which does not match the scenario of omitting the name.
