stem: A vacation time‑sharing plan opens an off‑site sales office but does not designate a
  qualifying broker for that office. Under Ala. Code § 34-27-1(i), what is the result?
options:
  - Not allowed as a branch sales office
  - Allowed as a branch sales office
  - Allowed after paying a transfer fee
  - Allowed if the main broker supervises
key: A
explanation: The statute permits an off‑site office to be designated a branch sales office only if a
  qualifying broker is designated for each such office. Without that designation, the office may not
  be recognized as a branch sales office. The other options either ignore the requirement or add
  conditions not supported by the text.
citation:
  source: Ala. Code § 34-27-1(i)
  url: null
  quoted_text: A representative of the vacation time-sharing plan authorized to do so may designate an
    office located off the site of the time-sharing project as a branch sales office of the vacation
    time-sharing plan provided that a qualifying broker is designated for each such branch sales
    office.
