stem: Under Ala. Admin. Code § 790-X-1-.05(2), who is responsible for supervising the showing of
  property located in Alabama and any subsequent negotiations in a co-brokerage agreement?
options:
  - The Alabama qualifying broker
  - The out-of-state principal broker
  - The seller's representative broker
  - The buyer's representative broker
key: A
explanation: The administrative code directs that the Alabama qualifying broker must supervise the
  showings and any ensuing negotiations. The out‑of‑state broker cannot perform this supervisory
  role, and neither the buyer’s nor the seller’s representative broker is assigned that duty.
