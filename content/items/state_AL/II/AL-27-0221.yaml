stem: According to Ala. Code § 34-27-2(a)(3), how is a 'buyer's agreement' defined?
options:
  - An agreement between a real estate company and a person through which the company agrees to
    assist the person with the sale of real property in exchange for a fee, whether as a fiduciary
    or non-fiduciary.
  - An agreement between a real estate company and a person through which the company agrees to
    assist the person with the purchase of real property in exchange for a fee, whether as a
    fiduciary or non-fiduciary.
  - An agreement between a real estate company and a person through which the company agrees to
    assist the person with the management of real property in exchange for a fee, whether as a
    fiduciary or non-fiduciary.
  - An agreement between a real estate company and a person through which the company agrees to
    assist the person with the lease of real property in exchange for a fee, whether as a fiduciary
    or non-fiduciary.
key: B
explanation: The definition in Ala. Code § 34-27-2(a)(3) specifies that a buyer’s agreement is an
  agreement where a real estate company assists a person with the purchase of real property for a
  fee, acting either as a fiduciary or non‑fiduciary. The correct option matches this wording
  exactly. An option that says the company assists with the sale of real property does not match the
  statute. Options that say the company assists with management or lease also do not match the
  statutory definition.
