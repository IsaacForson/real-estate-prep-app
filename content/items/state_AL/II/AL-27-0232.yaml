stem: A county tax assessor, while performing his official duties, prepares a deed for a
  county-owned property to be sold. Under Ala. Code § 34-27-2(b)(5), is the tax assessor required to
  hold a real estate license?
options:
  - The tax assessor must hold a real estate license because preparing a deed is a real estate
    activity.
  - The tax assessor is exempt from licensure only if the transaction involves residential property.
  - The tax assessor is not required to hold a real estate license when performing official duties
    as a public officer.
  - The tax assessor must obtain a license if the county receives compensation for the deed
    preparation.
key: C
explanation: Under Ala. Code § 34-27-2(b)(5), public officers performing their official duties are
  exempt from licensure. The option that limits the exemption to residential property is incorrect,
  as the exemption applies regardless of property type.
