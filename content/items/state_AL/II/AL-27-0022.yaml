stem: At a live auction of real estate, an unlicensed helper relays bids called out from the crowd
  to the licensed auctioneer but does not solicit or negotiate any sale. Under the rule on license
  requirements, why is this helper exempt from licensure?
options:
  - The rule exempts helpers only if the auctioneer is unlicensed.
  - The rule exempts helpers paid a flat hourly wage rather than commission.
  - The rule exempts ground men who only relay bids to the auctioneer.
  - The rule exempts anyone assisting an auctioneer regardless of duties performed.
key: C
explanation: The rule on license requirements provides that persons commonly referred to as ground
  men are not required to be licensed, provided their activities are limited to relaying crowd
  participation bids to the auctioneer.
