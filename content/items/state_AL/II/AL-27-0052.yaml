stem: According to Ala. Code § 34-27-2(a)(11), how is a 'listing agreement' defined?
options:
  - An agreement between a company and a tenant wherein the company agrees to assist the tenant in
    leasing real property in exchange for a fee, whether as a fiduciary or non-fiduciary.
  - An agreement between two brokers to share commission on a transaction regardless of which broker
    procures the buyer or seller, and to cooperate in marketing the property.
  - An agreement between a broker and a buyer wherein the broker agrees to assist the buyer in the
    purchase of real property in exchange for a fee, whether as a fiduciary or non-fiduciary.
  - An agreement between a company and an owner wherein the company agrees to assist the owner in
    the sale of the owner’s real property in exchange for a fee, whether as a fiduciary or
    non-fiduciary.
key: D
explanation: Ala. Code § 34‑27‑2(a)(11) defines a listing agreement as an agreement between a
  company and an owner in which the company assists the owner in selling the owner’s real property
  for a fee, whether fiduciary or non‑fiduciary. The other answer choices describe a tenant‑leasing
  agreement, a broker‑to‑broker commission‑sharing arrangement, and a buyer‑representation
  agreement, none of which match the statutory definition of a listing agreement.
