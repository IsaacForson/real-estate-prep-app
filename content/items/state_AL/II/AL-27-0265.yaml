  url: null
  quoted_text: (1) It shall be a Class A misdemeanor for any person, natural or legal, while within
    the borders of the State of Alabama, to participate in the sale or attempted sale of any
    time-share plan unless licensed to do so by the commission or exempted from such licensure by
    the laws of the State of Alabama or the United States, regardless of whether the vacation
    time-sharing plan is itself located within the State of Alabama.
