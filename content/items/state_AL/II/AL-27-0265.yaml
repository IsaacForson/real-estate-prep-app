stem: A licensee sells a vacation time-sharing plan in Alabama without holding a license from the
  Commission and without being exempt. Under Ala. Code § 34-27-62(a)(1), how is this act classified?
options:
  - The act is a Class B misdemeanor.
  - The act is not a violation.
  - The act is a civil violation only.
  - The act is a Class A misdemeanor.
key: D
explanation: The statute expressly declares that participating in the sale of a time-share plan
  without licensure is a Class A misdemeanor. Therefore the correct classification is a Class A
  misdemeanor. The distractor labeling it a civil violation only ignores the criminal penalty
  provision.
