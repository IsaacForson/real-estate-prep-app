stem: An applicant for an original broker license has already paid the Recovery Fund fee when
  obtaining a temporary license. Under Ala. Code § 34-27-33(c)(3), what fee is the applicant **NOT**
  required to pay again when the original license is issued?
options:
  - The original license fee payment that must be submitted with the application.
  - The course completion fee payment that must be made before receiving the original license.
  - The examination fee payment for the reciprocal license test.
  - The Recovery Fund fee payment required before the original license is issued.
key: D
explanation: The statute specifies that an applicant who has already paid the Recovery Fund fee does
  not need to pay another Recovery Fund fee to obtain the original license. The original license
  fee, however, must still be paid, making that distractor incorrect.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
