stem: A cemetery operator sells a burial plot to a family and handles the paperwork without a real
  estate license. Under Ala. Code § 34-27-2(b)(9), is the operator required to have a real estate
  license?
options:
  - The cemetery operator is exempt from licensure only if the plot is located in a municipal
    cemetery.
  - The cemetery operator must obtain a license if the sale includes additional services like grave
    opening.
  - The cemetery operator is not required to hold a real estate license when selling or transferring
    cemetery lots.
  - The cemetery operator must hold a real estate license because selling burial plots is a real
    estate transaction.
key: C
explanation: The exemption in Ala. Code § 34-27-2(b)(9) excludes the sale, lease, or transfer of
  cemetery lots from real‑estate licensing requirements. The statement that a license is required
  for such sales contradicts this exemption.
