stem: An Alabama qualifying broker signs a co-brokerage agreement on July 3 and files a copy with
  the commission on July 14. Under Ala. Code § 34-27-3(b), what is the status of this filing?
options:
  - Compliant because the filing occurred within the 10‑day period.
  - Non‑compliant because the filing occurred after the 10‑day period.
  - Compliant because the filing occurred exactly on the 10th day.
  - Non‑compliant because the filing occurred before the agreement was signed.
key: B
explanation: The filing on July 14 is one day after the July 13 deadline (10 days after the July 3
  signing), so it exceeds the allowed period and is non‑compliant. The option stating the filing
  occurred within the 10‑day period is incorrect because the filing was made after the deadline.
