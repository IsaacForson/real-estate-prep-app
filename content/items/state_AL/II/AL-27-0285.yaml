stem: A licensee who operates from a qualifying broker’s office decides to store all transaction
  files at a friend’s house for convenience, even though the friend’s house is not the licensee’s
  place of business. Under Ala. Code § 34-27-2(a)(13)(c), what is the result of this action?
options:
  - The licensee is in compliance because the friend’s house is a secure location.
  - The licensee must also keep a duplicate copy at the place of business.
  - The licensee violates the requirement to keep business records and files at the place of
    business.
  - The licensee may store records anywhere as long as they are accessible electronically.
key: C
explanation: Storing records at a location that is not the place of business breaches the rule that
  all business records and files shall be kept at the place of business, making the option that
  states the licensee violates the requirement to keep business records and files at the place of
  business correct. The option stating that the licensee must also keep a duplicate copy at the
  place of business is incorrect because merely keeping a duplicate copy at the place of business
  does not satisfy the requirement; the primary records must still be kept at the place of business.
