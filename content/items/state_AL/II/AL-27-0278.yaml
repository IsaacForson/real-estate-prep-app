stem: A salesperson who obtained an original license after completing the required 30‑hour
  post‑license course is preparing for the first license renewal. Under Ala. Code § 34-27-33(c)(4),
  what continuing education requirement applies to this salesperson for the first renewal?
options:
  - No continuing education is required for the first renewal.
  - Fifteen clock hours of approved continuing education must be completed.
  - Thirty clock hours of approved continuing education must be completed.
  - The salesperson must repeat the 30‑hour post‑license course.
key: A
explanation: The law provides that a holder of an original license who has satisfactorily completed
  the postlicense course is exempt from continuing education requirements for the first renewal.
  Therefore, the salesperson needs no continuing education at this stage, making the fifteen‑hour
  option incorrect.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text §
    34-27-33(c)(4)"
  url: null
  quoted_text: The holder of an original license who has satisfactorily completed the postlicense
    course and whose original license has been issued, shall not be subject to the continuing
    education requirements in this chapter for the first renewal of his or her original license.
