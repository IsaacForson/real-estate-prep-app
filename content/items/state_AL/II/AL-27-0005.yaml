stem: A person who offers to lease residential property in Alabama for a fee, but holds no real
  estate license, is most directly violating which provision of Ala. Code § 34-27-30?
options:
  - Subsection (10) – presenting oneself as able to perform a licensed act
  - Subsection (2) – offering to sell, exchange, purchase, rent, or lease real estate
  - Subsection (5) – auctioning or offering to auction real estate
  - Subsection (1) – selling, exchanging, purchasing, renting, or leasing real estate
key: B
explanation: Section 34-27-30(2) makes it unlawful for an unlicensed person to offer to lease real
  estate for a fee. Offering to lease falls under this subsection, so the unlicensed person violates
  the law. Subsection (1) concerns actually performing the lease, not merely offering to do so.
