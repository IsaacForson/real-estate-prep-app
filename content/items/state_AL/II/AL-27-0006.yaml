stem: If a licensee submits a false statement to the Alabama Real Estate Commission regarding
  continuing education, what criminal penalty applies under Ala. Code § 34-27-11(b)?
options:
  - A civil fine of up to $1,000
  - Revocation of the license only
  - A Class A misdemeanor
  - No penalty unless fraud is proven
key: C
explanation: Under §34-27-11(b), filing a false statement with the commission is a Class A
  misdemeanor punishable upon conviction. Submitting false continuing‑education information
  constitutes such a false statement, triggering the misdemeanor penalty. A civil fine or license
  revocation alone does not reflect the statutory penalty for false filings.
