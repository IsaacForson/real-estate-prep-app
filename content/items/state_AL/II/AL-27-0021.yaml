stem: A homeowner personally negotiates and signs the sale contract for her own house without paying
  any commission to a third party. Under the license law's exemptions, why does she **NOT** need a
  real estate license for this transaction?
options:
  - She is performing clerical duties that do not require a license.
  - She is acting under a co-brokerage agreement with a licensed broker.
  - She is relaying bids as a ground man during an auction.
  - She is an owner selling her own real estate.
key: D
explanation: The definitions and exemptions section excludes an owner from the licensing requirement
  when managing or consummating a transaction involving his or her own real estate, which covers a
  homeowner selling her own house.
citation:
  source: Ala. Code § 34-27-2
  url: null
  quoted_text: Any owner in the managing of, or in consummating a real estate transaction involving,
    his or her own real estate or the real estate of his or her spouse, child, or parent.
