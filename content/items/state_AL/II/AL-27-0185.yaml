stem: A resident manager of an apartment complex in Alabama collects rent and shows units to
  prospective tenants but does not hold a real estate license. Under the license law exemptions, why
  is this manager **NOT** required to be licensed?
options:
  - The manager is exempt because showing units to tenants does not constitute a licensed activity.
  - The manager is exempt because managing an apartment building or complex is exempt from licensing
    requirements.
  - The manager is exempt because all property managers are exempt regardless of property type.
  - The manager is exempt because collecting rent is considered clerical work.
key: B
explanation: Ala. Code § 34-27-2(b)(7) exempts a person who acts as the manager of an apartment
  building or complex, as long as they are not an on‑site manager of a condominium building or
  complex. In the scenario the manager oversees an apartment complex (non‑condominium), so the
  exemption applies. The claim that showing units to tenants is not a licensed activity
  misidentifies the basis of the exemption; the exemption rests on the managerial role, not on that
  specific act. The assertion that all property managers are exempt regardless of property type is
  incorrect because the statute excludes on‑site condominium managers. The statement that collecting
  rent is clerical work also misstates the law; the exemption is not based on classifying rent
  collection as clerical.
