stem: A seller of vacation time-sharing ownership plans receives $60,000 in cash and $40,000 in
  receivables from purchasers. According to Ala. Code § 34-27-58(b)(1), what is the minimum total
  amount that must be deposited in an escrow account?
options:
  - $25,000
  - $50,000
  - $75,000
  - $100,000
key: B
explanation: The rule mandates at least 50 percent of combined cash and receivables, which equals
  $50,000. The distractor “$25,000” results from applying 25 percent instead of the required 50
  percent.
citation:
  source: Ala. Code § 34-27-58(b)(1)
  url: null
  quoted_text: Deposit with an escrow agent no less than 50 percent of the cash and receivables
    received from the purchasers of such plans, such receivables to be assessed at net principal
    value.
  secondary: []
math:
  worked_solution: |-
    1. Cash = $60,000
    2. Receivables = $40,000
    3. Sum = $60,000 + $40,000 = $100,000
    4. Required deposit = 0.5 × $100,000 = $50,000
  formulas:
    - Required deposit = 0.5 × (Cash + Receivables)
