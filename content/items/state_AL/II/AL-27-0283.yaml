stem: According to Ala. Code § 34-27-2(a)(13)(c), where must a licensee’s business records and files
  be kept?
options:
  - At the Alabama Real Estate Commission’s central office in Montgomery.
  - At the licensee’s personal residence unless a separate office is maintained.
  - At the place of business as required by law or Real Estate Commission rules.
  - At a secure off‑site storage facility approved by the commission.
key: C
explanation: According to Ala. Code § 34-27-2(a)(13)(c), a licensee must keep all business records
  and files at the place of business as required by law or Real Estate Commission rules. Therefore
  the option stating that records must be kept at the place of business as required by law or Real
  Estate Commission rules is correct. The option suggesting records may be kept at the licensee’s
  personal residence unless a separate office is maintained is incorrect because the rule requires
  the place of business, not a personal residence, unless that residence is the licensed office,
  which the option does not specify. The option proposing records be kept at the Alabama Real Estate
  Commission’s central office in Montgomery is incorrect because the rule does not require storage
  at the commission’s office. The option proposing records be kept at a secure off‑site storage
  facility approved by the commission is also incorrect because the rule mandates the place of
  business, not an off‑site facility.
