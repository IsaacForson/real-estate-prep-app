stem: Under Ala. Code § 34-27-2(b)(6), which of the following actions by an unlicensed employee
  would require the employee to obtain a real estate license?
options:
  - The employee schedules appointments for property showings.
  - The employee files transaction documents for the broker.
  - The employee answers telephone inquiries for the broker.
  - The employee physically shows a listed property to a prospective buyer.
key: D
explanation: The exemption for clerical or administrative duties applies only if the person does not
  physically show listed property. Physically showing a listed property removes the exemption and
  requires a license. Scheduling appointments remains exempt as long as no showing occurs.
