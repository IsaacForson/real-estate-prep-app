stem: According to Ala. Code § 34-27-81(2), how is a 'broker' defined?
options:
  - A person who obtains information or advice about real estate from a licensee
  - A person who has an agency agreement with a broker for brokerage services in real estate
  - Any person who assists parties in a transaction without acting as an agent or fiduciary
  - Any person licensed as a real estate broker pursuant to Articles 1 and 2 of this chapter
key: D
explanation: The definition of broker in Ala. Code § 34-27-81(2) states that a broker is any person
  licensed as a real estate broker pursuant to Articles 1 and 2 of this chapter. The distractor
  describing a person who assists parties without being an agent or fiduciary actually defines a
  transaction facilitator, not a broker.
