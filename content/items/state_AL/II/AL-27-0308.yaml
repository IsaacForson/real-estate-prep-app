stem: A seller of a vacation time-sharing ownership plan provides the contract but fails to include
  the total financial obligation in boldface type. What is the consequence under Ala. Code §
  34-27-59?
options:
  - The failure to disclose the total financial obligation in boldface type constitutes a violation
    of the article.
  - The seller must pay a civil penalty of one thousand dollars for the omission, as determined by
    the Alabama Real Estate Commission.
  - The contract is considered void and unenforceable due to the missing disclosure, and the seller
    may be subject to disciplinary action.
  - The buyer may exercise the five‑day right to cancel without penalty, but only if the seller
    fails to honor the cancellation request.
key: A
explanation: Section 34-27-59 expressly makes it a violation to fail to disclose the total financial
  obligation in the required boldface type. The statute does not specify a monetary penalty, so the
  distractor about a fixed fine is not supported by the text.
