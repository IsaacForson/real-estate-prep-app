stem: A licensee receives electronic notification of a declined payment on May 1 and does not submit
  any payment. According to Ala. Code § 34-27-1(g), what is the status of the license on June 2?
options:
  - License remains active despite the missed deadline
  - License becomes inactive until payment is submitted
  - License is automatically revoked for nonpayment
  - License lapses and must be reapplied
key: B
explanation: The licensee must submit payment within 30 days of electronic notification; missing
  that deadline causes the license to become inactive until the payment is made. On June 2, which is
  beyond the 30‑day window, the license is inactive pending payment.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text Ala.
    Code § 34-27-1(g)"
  url: null
  quoted_text: the licensee shall have 30 days, upon electronic notification from the commission, to
    submit full and valid payment for the initial fee or fine and an additional fee for submitting
    the faulty payment, not to exceed the maximum amount allowed by Section 8-8-15. Failure to
    submit full and valid payment within 30 days of electronic notification by the commission shall
    result in the licensee’s license becoming inactive until the licensee submits full payment.
