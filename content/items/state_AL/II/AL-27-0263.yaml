stem: A licensee receives a final judgment in a civil suit related to a real estate transaction on
  April 2. By what date must the licensee notify the Alabama Real Estate Commission of the
  judgment's outcome under Ala. Code § 34-27-1(d)?
options:
  - April 15
  - April 20
  - April 12
  - April 10
key: C
explanation: Under Ala. Code § 34-27-1(d), a licensee must notify the Commission of the outcome of a
  civil or criminal action within 10 days of receiving notice. Starting from April 2, adding ten
  calendar days yields April 12 as the latest day to comply.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text §
    34-27-1(d)"
  url: null
  quoted_text: Every licensee under this article shall be required to notify the Alabama Real Estate
    Commission of the outcome of any civil or criminal action of the type described in subsection
    (c) of this section within 10 days of the notice to the licensee of such outcome.
  secondary: []
math:
  worked_solution: "Start date: April 2. Add the 10‑day notice period: April 2 + 10 days = April 12."
  formulas:
