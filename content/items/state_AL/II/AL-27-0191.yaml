stem: In a co-brokerage agreement between an Alabama qualifying broker and an out-of-state principal
  broker for a property located in Alabama, whose name must appear in all advertising of the
  property?
options:
  - In this agreement, both brokers' names must appear in all advertising.
  - In this agreement, the Alabama qualifying broker's name must appear in all advertising.
  - In this agreement, neither broker's name is required to appear in all advertising.
  - In this agreement, the out-of-state broker's name must appear in all advertising.
key: B
explanation: The statute requires that the Alabama broker's name appear in all advertising of real
  property located in the state. The option stating that neither broker's name is required to appear
  in all advertising is incorrect because the rule only mandates the Alabama broker's name.
