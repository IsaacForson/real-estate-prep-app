stem: A newly examined salesperson receives a temporary license and immediately begins working with
  buyers, planning to complete her post-license coursework whenever it is convenient. Under the
  examinations statute, why is this approach risky for keeping her license?
options:
  - An original license cannot issue until the course is complete.
  - The post-license course may be completed at any time before retirement.
  - The post-license course is required only for broker applicants.
  - A temporary license permits skipping the post-license course.
key: A
explanation: Section 34-27-33 states that the holder of a temporary license shall not be issued an
  original license until he or she has satisfactorily completed the 30-hour post-license course
  prescribed by the commission, so delaying the course puts her original licensure at risk.
