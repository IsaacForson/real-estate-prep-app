stem: How is an 'associate broker' defined?
options:
  - Any broker other than a qualifying broker
  - A broker who is also a qualifying broker
  - A broker licensed exclusively for residential property
  - A salesperson employed by a broker
key: A
explanation: According to Ala. Code § 34-27-2(a)(1), an associate broker is any broker other than a
  qualifying broker. Therefore the option stating 'Any broker other than a qualifying broker'
  correctly reflects this definition. The option stating 'A broker who is also a qualifying broker'
  is incorrect because a qualifying broker cannot be an associate broker. The options describing a
  broker licensed exclusively for residential property and a salesperson employed by a broker
  describe different roles not covered by the definition.
