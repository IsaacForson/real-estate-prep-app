stem: Under Ala. Code § 34-27-2(b)(1), which of the following persons is exempt from the licensing
  requirements of Articles 1 and 2 of this chapter?
options:
  - An owner managing his or her own real estate
  - A clerical employee who shows listed property
  - An associate broker who negotiates leases
  - A salesperson employed by a qualifying broker
key: A
explanation: The exemption in §34-27-2(b)(1) expressly excludes an owner who is managing his or her
  own real estate or that of a close family member from licensing requirements. Therefore, an owner
  managing his or her own real estate is not required to hold a license. A salesperson employed by a
  qualifying broker must be licensed because the exemption does not apply to employees performing
  brokerage activities.
