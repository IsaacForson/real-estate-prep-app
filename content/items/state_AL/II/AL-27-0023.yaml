stem: A real estate company's receptionist, who holds no license, begins showing listed homes to
  prospective buyers on her own. Under the rule on clerical and office employees, what is wrong with
  this?
options:
  - A receptionist may show property only with the buyer's written consent.
  - An unlicensed clerical employee may not show listed property.
  - A receptionist may show property as long as a broker is not present.
  - A receptionist may show property only if paid a commission.
key: B
explanation: The rule on clerical and office employees states that no such employee shall physically
  show listed property, solicit or accept listings, or negotiate sales unless properly licensed.
citation:
  source: Ala. Admin. Code Rule 790-X-1-.04
  url: null
  quoted_text: No such employee of a licensee or any other person shall physically show listed
    property, solicit or accept listings, negotiate sales or leases, hold himself out as engaged in
    the real estate business or perform any other act for which a license is required unless
    properly licensed.
