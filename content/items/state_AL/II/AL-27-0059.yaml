stem: An Alabama qualifying broker signs a co-brokerage agreement with a licensed out-of-state
  principal broker on March 5. To comply with Ala. Code § 34-27-3(b), by what date must the broker
  file a copy of the agreement with the Alabama Real Estate Commission?
options:
  - March 10.
  - March 15.
  - March 20.
  - March 25.
key: B
explanation: The statute requires the Alabama qualifying broker to file the agreement ‘not more than
  10 days after the agreement is signed’ (Ala. Code § 34‑27‑3(b)). Ten days after March 5 is
  March 15, which is the latest permissible filing date. The choice “March 10.” is earlier than the
  deadline but does not satisfy the required filing window; filing after March 15 would violate the
  rule.
