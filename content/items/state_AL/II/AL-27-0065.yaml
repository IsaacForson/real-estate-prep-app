stem: A licensee with an inactive license shows a property to a prospective buyer. Under Ala. Code §
  34-27-35(k), what is the status of this action?
options:
  - The action is permitted if the licensee discloses status.
  - The action is permitted with a qualifying broker's supervision.
  - The action is prohibited under the inactive license rule.
  - The action is permitted because no commission is charged.
key: C
explanation: Ala. Code § 34-27-35(k) explicitly provides that no act for which a license is required
  shall be performed under an inactive license. Showing a property requires a license, so the action
  is prohibited regardless of commission or disclosure.
