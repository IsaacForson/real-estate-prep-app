stem: A licensee changed her residential address on April 5 and notified the Alabama Real Estate
  Commission on May 10. According to Ala. Code § 34-27-1(n), what is the status of this
  notification?
options:
  - Within the required 30‑day period
  - After the required 30‑day period
  - Within the allowed 60‑day period
  - After the allowed 60‑day period
key: B
explanation: The licensee notified the commission 35 days after the address change, which exceeds
  the 30‑day window mandated by Ala. Code § 34-27-1(n). Hence the notification was not made within
  the required period and is non‑compliant. The other options either misstate the time frame or
  incorrectly suggest compliance.
