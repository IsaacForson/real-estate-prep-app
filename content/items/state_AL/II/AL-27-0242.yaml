stem: A licensee receives $8,000 from the Recovery Fund toward a settlement and must repay the
  amount plus interest at the statutory rate for one year. What is the total repayment amount?
options:
  - $8,960
  - $8,000
  - $10,000
  - $9,600
key: A
explanation: The statute requires repayment of the amount paid from the Fund plus interest at the
  rate of 12 percent a year. For an $8,000 payment, interest is $8,000 × 0.12 = $960, making the
  total $8,960. The $9,600 option would arise from mistakenly applying a 20 percent rate.
citation:
  source: Ala. Code § 34-27-1 et seq. § 34-27-31(a)(6)
  url: null
  quoted_text: until he or she has repaid in full, plus interest at the rate of 12 percent a year, the
    amount paid from the Recovery Fund.
