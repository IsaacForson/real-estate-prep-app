stem: A licensee who is a member of a team advertises her services using the team name but does not
  include the name of at least one team member in the advertisement. Which requirement of Ala. Code
  § 34-27-39(e) is violated?
options:
  - Including the name of the company with whom the licensee is licensed in the advertisement
  - Including the term "team" or "group" in the team name and stating the licensee's individual
    license number in the advertisement
  - Including written authorization from the qualifying broker to use the team name in the
    advertisement
  - Including the name of at least one of the team members in the advertisement
key: D
explanation: Ala. Code § 34-27-39(e)(1) requires that any advertisement by a licensee acting as part
  of a team include the name of at least one team member. In the scenario the licensee uses only the
  team name and omits any team member's name, violating this requirement. The correct answer states
  that the advertisement must include the name of at least one team member. The option about written
  broker authorization is incorrect because the rule does not require such authorization for team
  name use. The option mentioning the term "team" or "group" and a license number is incorrect;
  while the rule does require the team name to contain "team" or "group", the scenario already meets
  that, and adding a license number is not required. The option about including the company name is
  incorrect because the rule does not mandate the company name in team advertisements; only a team
  member's name is needed.
