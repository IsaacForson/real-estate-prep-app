stem: Under Ala. Code § 34-27-1(g), what is the maximum fine per count that the Alabama Real Estate
  Commission may impose for a violation of this section or any rule?
options:
  - One thousand dollars ($1,000) per count
  - One hundred dollars ($100) per count
  - Five hundred dollars ($500) per count
  - Two thousand five hundred dollars ($2,500) per count
