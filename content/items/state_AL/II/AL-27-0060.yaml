stem: An Alabama qualifying broker signs a co-brokerage agreement with an out-of-state principal
  broker on March 10. By what date must the broker file a copy of the agreement with the Alabama
  Real Estate Commission to comply with Ala. Code § 34-27-3(b)?
options:
  - March 15
  - March 20
  - March 25
  - March 30
key: B
explanation: The statute requires the Alabama qualifying broker to file the agreement with the
  commission not more than ten days after it is signed. Adding ten days to March 10 yields a filing
  deadline of March 20. Filing on March 15 is premature, while March 25 is late.
