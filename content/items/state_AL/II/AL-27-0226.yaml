stem: A licensed funeral director sells a cemetery lot to a buyer without holding a real estate
  license. Under Ala. Code § 34-27-2(b)(9), is the funeral director required to have a real estate
  license for this transaction?
options:
  - Yes, because selling a cemetery lot is considered a real estate transaction requiring a license.
  - Yes, because the exemption applies only to transactions involving the sale of residential
    property.
  - No, because transactions involving the sale, lease, or transfer of cemetery lots are exempt from
    licensing requirements.
  - No, because any sale of burial property is exempt from licensing requirements.
key: C
explanation: The correct answer reflects that Ala. Code § 34-27-2(b)(9) exempts transactions
  involving the sale, lease, or transfer of cemetery lots from real‑estate licensing requirements.
  The option that claims a license is required for selling a cemetery lot is incorrect because the
  statute provides an exemption for such transactions. The option that says the exemption applies
  only to residential property sales is incorrect because the statute does not impose that
  limitation. The option that states any sale of burial property is exempt is incorrect because it
  broadens the exemption beyond the specific cemetery‑lot provision.
