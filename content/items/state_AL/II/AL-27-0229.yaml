stem: A licensee is preparing to show a commercial property to a limited liability company. Under
  Ala. Code § 34-27-82(d), is the licensee required to provide the written disclosure form described
  in subsection (c) before showing the property?
options:
  - Yes, because the disclosure form must be provided before any brokerage service for the client
  - No, because dealings with limited liability companies are exempt from subsection (c)
  - Yes, unless licensee obtains informed consent from company before showing property
  - No, but only if the licensee also acts as a transaction facilitator for a corporate client
key: B
explanation: Ala. Code § 34-27-82(d) expressly exempts licensees from providing the disclosure form
  when engaging in transactions with entities such as limited liability companies. Therefore, no
  disclosure form is required before showing the property to an LLC. The distractor asserting that a
  disclosure form is always required ignores this statutory exemption.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text §
    34-27-82(d)"
  url: null
  quoted_text: A licensee shall not be required to comply with the provisions of subsection (c) when
    engaged in transactions with any corporation, nonprofit corporation, professional corporation,
    professional association, limited liability company, partnership, any partnership created under
    the Alabama Partnership Law, Chapter 8A of Title 10A, real estate investment trust, business
    trust, charitable trust, family trust, or any governmental entity in transactions involving real
    estate.
