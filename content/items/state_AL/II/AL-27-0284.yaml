stem: A salesperson who lives in a rural area and operates from a home office that meets the
  place‑of‑business requirements (separate entrance, business telephone, not used for living) wants
  to know where to store the company’s transaction files. Under Ala. Code § 34-27-2(a)(13)(c), where
  must the files be kept?
options:
  - At the salesperson’s personal vehicle for convenience and quick access.
  - At a locked drawer at the salesperson’s personal bedroom for added security.
  - At the place of business (the home office) as required by law or Real Estate Commission rules.
  - At the qualifying broker’s main office in the city of the firm.
key: C
explanation: The rule requires that all business records and files be kept at the licensee’s place
  of business. For a salesperson who operates from a qualifying home office, that home office meets
  the place‑of‑business requirements and therefore is the required location for storing the
  company’s transaction files. Storing the files in a personal vehicle or in a bedroom drawer does
  not satisfy the requirement because those locations are not the licensed place of business.
