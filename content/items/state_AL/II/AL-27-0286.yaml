stem: An applicant receives notice from the Alabama Real Estate Commission on April 10 that their
  license application has been refused. Under Ala. Code § 34-27-37(a), by what date must the
  applicant file a request for a hearing to preserve the right to be heard?
options:
  - May 5
  - April 30
  - April 25
  - April 20
key: C
explanation: The statute gives the applicant 15 days after delivery of the notice to request a
  hearing. Fifteen days after April 10 is April 25, so the request must be filed by that date.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text Ala.
    Code § 34-27-37(a)"
  url: null
  quoted_text: If the commission refuses to license an applicant, notice of the refusal shall be given
    to the applicant, and he or she may, within 15 days after delivery of the notice, file a request
    for a hearing.
