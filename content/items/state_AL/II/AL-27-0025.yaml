stem: An applicant passes the salesperson examination on March 1 and is issued a temporary license
  shortly after. If the applicant has **NOT** completed the required post-license course and had an
  original license issued by the following March 1, what happens to the temporary license?
options:
  - It converts automatically to an inactive company license.
  - It is extended for an additional year without any coursework.
  - It expires and lapses one year after issuance.
  - It is upgraded automatically to a reciprocal license.
key: C
explanation: Section 34-27-33 provides that a temporary license is valid only for one year following
  the first day of the month after its issuance, after which it automatically expires and lapses if
  the original license has not been issued.
citation:
  source: Ala. Code § 34-27-33
  url: null
  quoted_text: A temporary license shall be valid only for a period of one year following the first
    day of the month after its issuance.
