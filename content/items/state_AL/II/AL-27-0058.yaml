stem: An out-of-state principal broker has already completed two co-brokerage transactions with an
  Alabama qualifying broker in the current calendar year. How many more co-brokerage transactions
  may the broker legally conduct with that Alabama qualifying broker before reaching the statutory
  limit?
options:
  - The broker may conduct three additional co-brokerage transactions.
  - The broker may conduct two additional co-brokerage transactions.
  - The broker may conduct one additional co-brokerage transaction.
  - The broker may conduct zero additional co-brokerage transactions.
key: C
explanation: Ala. Code § 34-27-3(a)(3) limits a co‑brokerage agreement to three transactions per
  calendar year for each licensed out‑of‑state principal broker. Because two transactions have
  already been completed, only one more transaction can be done without exceeding the limit. The
  statement that the broker may conduct one additional co‑brokerage transaction would bring the
  total to three, which complies with the statutory maximum; any statement allowing more than one
  additional transaction would exceed the limit.
