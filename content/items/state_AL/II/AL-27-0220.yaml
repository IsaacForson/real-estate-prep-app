stem: A licensed proprietary school does not have an administrator approved by the commission. Under
  Ala. Code § 34-27-1(e) and (g), which action may the commission take?
options:
  - The commission may impose a $100 fine for each day the administrator remains unapproved.
  - The commission may suspend the school's license for a period not exceeding two years.
  - The commission may revoke the school's license immediately without providing an opportunity for
    a hearing.
  - The commission may require the school to cease all instruction until a new administrator is
    hired.
key: B
explanation: The commission must require schools to have an approved administrator, and for any
  violation of this section or its rules, the commission may reprimand, fine, suspend for up to two
  years, or revoke the license. Suspension up to two years is expressly authorized, whereas
  immediate revocation without hearing is not specified.
