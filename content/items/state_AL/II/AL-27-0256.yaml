stem: A salesperson who served as a member of the Alabama State Legislature for the entire license
  renewal period submits proof of service instead of continuing education hours. Under Ala. Code §
  34-27-35(j)(1), is this sufficient to meet the renewal requirement?
options:
  - Yes, because legislative service is deemed equivalent to the 15 clock hours of continuing
    education.
  - No, because only completed continuing education course work satisfies the requirement.
  - Yes, but only if the service is documented with a passing grade in the legislative session.
  - No, because legislative service does not count toward any renewal requirement.
key: A
explanation: Time served as a member of the state Legislature during each license renewal period is
  deemed equivalent to the 15 hours of course work and satisfies the continuing education
  requirement (Ala. Code § 34-27-35(j)(1)). The option stating that only completed continuing
  education course work satisfies the requirement is incorrect because the law accepts legislative
  service as equivalent. The option that adds a passing grade condition is incorrect because no such
  condition is required. The option claiming legislative service does not count toward any renewal
  requirement is incorrect because the law provides that it does.
