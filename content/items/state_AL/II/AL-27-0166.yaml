stem: An attorney-at-law prepares a deed for a client as part of legal representation and does not
  charge a separate real estate fee. Under Ala. Code § 34-27-2(b)(2), is the attorney required to
  hold a real estate license?
options:
  - The attorney must hold a license because deed preparation is a real estate activity
  - The attorney is exempt from licensure when performing duties as an attorney-at-law
  - The attorney must obtain a license only if the client pays a separate fee
  - The attorney is exempt only if the transaction involves residential real estate
key: B
explanation: Ala. Code § 34-27-2(b)(2) exempts an attorney-at-law performing his or her duties as an
  attorney-at-law from licensing requirements. Since the attorney is preparing a deed as part of
  legal representation and not charging a separate real estate fee, the attorney is exempt. The
  statement that the attorney is exempt from licensure when performing duties as an attorney-at-law
  correctly reflects this rule. The claim that the attorney must hold a license because deed
  preparation is a real estate activity is incorrect because the exemption applies when the attorney
  acts in their legal capacity.
