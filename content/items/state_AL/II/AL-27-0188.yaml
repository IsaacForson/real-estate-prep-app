stem: A bank employee acting as a trustee for a client's real estate holdings negotiates the sale of
  a property on behalf of the trust without holding a real estate license. Under the license law
  exemptions, why is this employee **NOT** required to be licensed?
options:
  - The employee is exempt because acting as a trustee is exempt from licensing requirements.
  - The employee is exempt because all bank employees are exempt from licensing requirements.
  - The employee is exempt because negotiating a sale on behalf of a trust does not require a
    license.
  - The employee is exempt because the transaction involves no commission.
key: A
explanation: Ala. Code § 34-27-2(b)(4) exempts persons acting as a receiver, trustee, administrator,
  executor, or guardian, or acting under a court order or authority of a trust instrument or will.
  Because the employee is serving as a trustee for the client’s real estate holdings, this exemption
  applies and a license is not required. The claim that all bank employees are exempt is incorrect;
  the exemption is limited to specific fiduciary roles such as trustee, not to bank employees
  generally. The claim that negotiating a sale on behalf of a trust does not require a license
  misstates the law; the exemption is based on the trustee capacity, not on the act of negotiating a
  sale.
