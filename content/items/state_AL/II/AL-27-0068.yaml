stem: A seller of a vacation time-sharing ownership plan informs a buyer that the contract can be
  cancelled only within three days of signing. Under Ala. Code § 34-27-56, this conduct is most
  directly a violation of which provision?
options:
  - Violation of the requirement to honor a buyer’s cancellation request.
  - Violation of the prohibition against misrepresenting the buyer’s right to cancel.
  - Violation of the duty to place 50 percent of cash in escrow.
  - Violation of the obligation to furnish an inventory of furniture.
key: B
explanation: "Ala. Code § 34-27-56 expressly prohibits any misrepresentation of the buyer’s right to
  cancel as provided by the article. Telling a buyer that a three-day cancellation period exists
  when the law provides a different period constitutes such a misrepresentation. The other options
  refer to distinct statutory duties: honoring a cancellation request is covered under Ala. Code §
  34-27-54, escrow requirements are addressed in Ala. Code § 34-27-58, and the inventory disclosure
  obligation is found in Ala. Code § 34-27-53(3)(c). None of those provisions address the
  misrepresentation of cancellation rights."
citation:
  source: Ala. Code § 34-27-56
  url: null
  quoted_text: It shall be a violation of this article for any seller of vacation time-sharing plans,
    or his or her assignees, to misrepresent in any manner the buyer’s right to cancel provided by
    this article.
