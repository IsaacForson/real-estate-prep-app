stem: What is the maximum total dollar amount of co-brokerage transactions an out-of-state principal
  broker may conduct in Alabama in any calendar year?
options:
  - $50,000,000
  - $25,000,000
  - $100,000,000
  - $75,000,000
key: A
explanation: Under Ala. Code § 34-27-3(a)(4), an out-of-state principal broker may not exceed fifty
  million dollars ($50,000,000) in co-brokerage transactions in any calendar year, making
  $50,000,000 the correct limit. The $25,000,000 option understates the cap, while $75,000,000 and
  $100,000,000 exceed the statutory maximum.
citation:
