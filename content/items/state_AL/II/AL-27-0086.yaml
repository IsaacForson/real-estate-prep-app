stem: A licensee holds escrow funds for a client but does not maintain a record showing the owner of
  the funds, deposit date, withdrawal date, and other pertinent information for more than three
  years. Which prohibited act under Ala. Code § 34-27-1(b)(8)c does this constitute?
options:
  - Failing to remit client funds to the entitled party within a reasonable time.
  - Failing to prevent commingling of client funds with personal funds.
  - Failing to deposit client funds in a separate federally insured Alabama account.
  - Failing to keep a complete record of client funds for at least three years showing required
    details.
key: D
explanation: The statute requires keeping records for at least three years with specified details;
  the licensee's failure to do so violates this provision. The distractor about depositing funds in
  a separate account describes a different requirement under subsection (b)(8)b and is not supported
  by the scenario.
