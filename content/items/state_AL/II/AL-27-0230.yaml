stem: A licensee acting as a transaction facilitator wishes to list a residential property for sale
  on behalf of a buyer. Under Ala. Code § 34-27-82(e), what is required before the licensee may list
  the property for compensation?
options:
  - A written brokerage agreement with the buyer for the property
  - An oral agreement to act as a transaction facilitator with the buyer
  - Notice to the Alabama Real Estate Commission of the listing
  - A written disclosure form signed by the buyer before any brokerage service
key: A
explanation: Ala. Code § 34-27-82(e) mandates that a written brokerage agreement be in place prior
  to listing or submitting an offer for compensation, even when the licensee is acting as a
  transaction facilitator. The distractor suggesting only a disclosure form is sufficient overlooks
  this separate agreement requirement for listing activities.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text §
    34-27-82(e)"
  url: null
  quoted_text: Notwithstanding subsection (d), a written brokerage agreement is required prior to a
    licensee either listing for sale or submitting an offer on a property on behalf of a consumer,
    customer, or client for compensation.
