stem: How is a 'license period' defined?
options:
  - That period of time beginning on January 1 of a year designated by the commission to be the
    first year of a license period and ending on December 31 of the year designated by the
    commission as the final year of that license period.
  - That period of time beginning on October 1 of a year designated by the commission to be the
    first year of a license period and ending on October 1 of the year designated by the commission
    as the final year of that license period.
  - That period of time beginning on July 1 of a year designated by the commission to be the first
    year of a license period and ending on June 30 of the year designated by the commission as the
    final year of that license period.
  - That period of time beginning on October 1 of a year designated by the commission to be the
    first year of a license period and ending on midnight September 30 of the year designated by the
    commission as the final year of that license period.
key: D
explanation: The license period runs from October 1 of the first designated year to midnight
  September 30 of the final designated year, as defined in Ala. Code § 34-27-2(a)(10). The option
  stating that the license period begins January 1 and ends December 31 does not match this
  definition.
