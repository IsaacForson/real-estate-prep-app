stem: Under Ala. Code § 34-27-61, what is the maximum monetary penalty the Alabama Real Estate
  Commission may impose for a violation of the vacation time-sharing provisions?
options:
  - The commission may impose a fine of $25.
  - The commission may impose a fine of $500.
  - The commission may impose a fine of $1,000.
  - The commission may impose a fine of $2,000.
key: C
explanation: The statute states that a person found guilty of violating the article is subject to a
  monetary penalty of not less than $25 nor more than $1,000. Therefore the maximum fine is $1,000.
  The distractor stating $2,000 exceeds the statutory cap and is incorrect.
