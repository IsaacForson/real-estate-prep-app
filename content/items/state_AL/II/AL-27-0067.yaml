stem: A seller of a vacation time-sharing ownership plan receives $120,000 in cash from purchasers.
  According to Ala. Code § 34-27-58(b)(1), what is the minimum amount that must be deposited in an
  escrow account?
options:
  - $90,000
  - $30,000
  - $60,000
  - $120,000
key: C
explanation: The statute requires the seller to deposit no less than 50 percent of the cash
  received. Fifty percent of $120,000 is $60,000, making the option stating '$60,000' the correct
  minimum. The option stating '$30,000' represents only 25 percent, which fails to meet the 50
  percent threshold. The options stating '$90,000' and '$120,000' exceed the minimum; while they
  would satisfy the requirement, they are not the minimum amount mandated by the rule.
citation:
  source: Ala. Code § 34-27-58(b)(1)
  url: null
  quoted_text: Deposit with an escrow agent no less than 50 percent of the cash and receivables
    received from the purchasers of such plans, such receivables to be assessed at net principal
    value.
  secondary: []
math:
  worked_solution: "Step 1: Identify the required percentage: 50% = 0.50. Step 2: Multiply the cash
    received by the percentage: $120,000 × 0.50 = $60,000. Step 3: The result is the minimum deposit
    required."
