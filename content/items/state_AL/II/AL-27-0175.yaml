stem: An out-of-state broker participating in a co-brokerage agreement with an Alabama qualifying
  broker makes a material misrepresentation about a property's square footage. Under Ala. Admin.
  Code § 790-X-1-.05(3), who is liable for this misrepresentation?
options:
  - Liability falls on the buyer
  - Liability falls on the Alabama qualifying broker
  - Liability falls on the out-of-state broker
  - Liability falls on both brokers
key: B
explanation: The rule states the Alabama qualifying broker shall be liable for all acts of the
  out-of-state broker arising from the agreement. Therefore, the Alabama broker bears liability for
  the out-of-state broker's misrepresentation. The other options incorrectly assign liability to the
  out-of-state broker alone, both brokers, or the buyer.
