stem: An Alabama qualifying broker enters a co-brokerage agreement with an out-of-state broker for a
  property sale. The buyer and seller do not agree in writing to relieve the Alabama broker of
  earnest money responsibility. Who must hold the earnest money in escrow?
options:
  - The Alabama qualifying broker must hold the earnest money in escrow
  - The earnest money may be released to the seller immediately upon contract signing
  - The earnest money may be held by either broker if the buyer agrees
  - The out-of-state broker must hold the earnest money
key: A
explanation: The statute and administrative rule require the Alabama qualifying broker to hold
  earnest money in escrow unless both buyer and seller agree in writing to relieve that
  responsibility; absent such agreement, the Alabama broker must hold the funds. The other options
  incorrectly assign the duty to the out-of-state broker, allow unilateral relief, or permit
  premature release.
