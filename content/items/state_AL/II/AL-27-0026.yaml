stem: An applicant's real estate license application was rejected in another state eighteen months
  ago solely because she failed the written licensing examination there. Under the requirements for
  licensure, how should the commission treat her Alabama application?
options:
  - The prior rejection automatically disqualifies her for five years regardless of the reason.
  - The prior rejection bars licensure until she reapplies in the original state first.
  - The prior rejection bars licensure for any rejection within two years.
  - The rejection does not bar licensure since it was exam-based only.
key: D
explanation: Section 34-27-32 disqualifies an applicant only when a license application was rejected
  in another state on grounds other than failing a written examination within the two prior years,
  so an examination-only rejection does not itself bar licensure.
