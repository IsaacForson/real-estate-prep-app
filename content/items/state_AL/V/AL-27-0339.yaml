stem: An Alabama licensee who moves to a new residence within the state and becomes a resident of
  Alabama must, within how many days, submit a notice of change of address to the Alabama Real
  Estate Commission?
options:
  - 15 days
  - 20 days
  - 5 days
  - 10 days
key: A
explanation: Ala. Code § 34-27-31(c)(2) requires a person who holds a current Alabama license and
  moves to become a resident of the state to submit a notice of change of address within 10 days.
  The other time periods do not satisfy this requirement.
