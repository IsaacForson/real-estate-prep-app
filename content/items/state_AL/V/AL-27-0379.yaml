stem: "Under Ala. Code § 34-27-31(b)(4), the Recovery Fund may make a payment to a licensee or
  bonding company only if:"
options:
  - When the licensee or bonding company suffered actual compensatory damages from the transaction.
  - When the licensee or bonding company had issued a corporate surety bond to the judgment debtor.
  - When the licensee or bonding company was a principal party to the real estate transaction on
    which the judgment was based.
  - When the licensee or bonding company was named as a defendant in the underlying lawsuit.
key: C
explanation: The rule states the fund is not liable for payments to a licensee or bonding company
  unless that licensee or bonding company was a principal party to the real estate transaction on
  which the judgment was based. Therefore, payment is allowed only when that condition is met. The
  distractor about being named as a defendant is incorrect because mere defendantship does not
  satisfy the principal‑party requirement.
