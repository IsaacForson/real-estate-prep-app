stem: A salesperson learns that a criminal indictment has been filed against him for fraud unrelated
  to real estate. Under Ala. Code § 34-27-31(j), what must the salesperson do?
options:
  - The salesperson must notify the commission in writing by certified mail within 10 days
  - The salesperson must notify the commission by email within 10 days
  - The salesperson must notify the commission by telephone within 10 days
  - The salesperson must notify the commission in person within 10 days
key: A
explanation: The statute mandates that licensees notify the commission in writing by certified mail
  within 10 days after notice of any criminal prosecution. Notifying by email, telephone, or in
  person does not meet the written certified mail requirement.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text — §
    34-27-31"
  url: null
  quoted_text: Each licensee shall notify the commission within 10 days after notice to him or her of
    the institution of any criminal prosecution against him or her, or of a civil summons and
    complaint against him or her, if the subject matter of the civil complaint involves a real
    estate transaction or involves the goodwill of an existing real estate business. The
    notification shall be in writing by certified mail
