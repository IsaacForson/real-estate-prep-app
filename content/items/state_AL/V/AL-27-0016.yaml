stem: Under Ala. Code § 34-27-31(b)(2), what is the maximum amount the Recovery Fund will pay for
  claims based on judgments or settlements against any one person?
options:
  - Fifty thousand dollars
  - Twenty-five thousand dollars
  - Ten thousand dollars
  - One hundred thousand dollars
key: A
explanation: Subsection (b)(2) states that payments for claims based on judgments or settlements
  against any one person shall not exceed fifty thousand dollars ($50,000) in the aggregate.
  Therefore, the fund’s per‑person limit is $50,000. The $25,000 option reflects the separate
  per‑transaction limit, which does not govern the per‑person cap.
