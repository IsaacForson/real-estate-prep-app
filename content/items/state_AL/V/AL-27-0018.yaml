stem: A broker faces a judgment of $70,000 from a single transaction, with two claimants each
  seeking $35,000. What is the maximum total amount the Recovery Fund may pay for this transaction?
options:
  - Thirty-five thousand dollars
  - Seventy thousand dollars
  - Fifty thousand dollars
  - Twenty-five thousand dollars
key: D
explanation: Under Ala. Code § 34-27-31(b)(3), the Recovery Fund’s aggregate payment for claims
  arising out of the same transaction cannot exceed twenty‑five thousand dollars ($25,000),
  regardless of how many claimants are involved. Therefore, even though two claimants each seek
  $35,000, the fund may pay no more than $25,000 in total. The $50,000 amount mistakenly applies a
  per‑person limit, and the $70,000 amount uses the combined judgment figure.
