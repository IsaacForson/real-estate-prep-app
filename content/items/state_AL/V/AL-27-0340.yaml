stem: An applicant for an Alabama real estate license is responsible for paying which of the
  following costs?
options:
  - The cost of the criminal history background check
  - The commission's administrative fee for license issuance
  - The recovery fund fee for an original license
  - The fee for furnishing a copy of the license
key: A
explanation: Ala. Code § 34-27-31(m) states that the applicant shall assume the cost of the criminal
  history check. The other fees listed are not assigned to the applicant under this provision.
