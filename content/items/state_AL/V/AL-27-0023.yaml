stem: Under Ala. Code § 34-27-31(c), what is the recovery fund fee for issuance of a reciprocal license?
options:
  - The same as the fee for an original license pursuant to Section 34-27-31
  - Twice the fee for an original license pursuant to Section 34-27-31
  - A fee determined annually by the Alabama Real Estate Commission
  - Half the fee for an original license pursuant to Section 34-27-31
key: A
explanation: The rule states that the recovery fund fee for a reciprocal license is the same as the
  fee for an original license under Section 34-27-31. Therefore the correct amount mirrors the
  original license fee. The distractor suggesting half or twice the fee contradicts the explicit
  equality mandated by the statute.
