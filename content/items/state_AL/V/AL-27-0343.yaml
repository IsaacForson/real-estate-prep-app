stem: Under Ala. Code § 34-27-31(e)(1), what must an aggrieved person do when commencing an action
  that may result in collection from the Recovery Fund?
options:
  - Provide the commission with a copy of the complaint within five business days of filing.
  - Notify the commission in writing by certified mail, return receipt requested, at the time of
    commencement.
  - File a verified claim with the commission within 10 days after the judgment is entered.
  - Pay a thirty‑dollar Recovery Fund fee before filing the lawsuit in civil court to satisfy the
    claim.
key: B
explanation: The statute requires the aggrieved person to notify the commission in writing by
  certified mail, return receipt requested, at the time the action is commenced. The other options
  describe actions not required by this subsection, such as filing a claim after judgment or paying
  a fee.
citation:
