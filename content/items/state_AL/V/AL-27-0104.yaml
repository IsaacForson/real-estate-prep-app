  - $15.00
  - $30.00
  - $60.00
key: C
explanation: The statute requires a $30 fee deposit to the Recovery Fund for each original license
  application. Therefore $30.00 is correct. The $15.00 distractor mistakenly halves the amount,
  while $60.00 doubles it, and $0.00 omits the required payment.
