stem: Under Ala. Code § 34-27-31(b)(3), what is the maximum amount the Recovery Fund will pay for
  claims arising out of the same transaction, regardless of the number of claimants?
options:
  - $25,000
  - $100,000
  - $50,000
  - $10,000
key: A
explanation: Subsection (b)(3) states that payments for claims arising out of the same transaction
  shall not exceed twenty-five thousand dollars ($25,000) in the aggregate, regardless of the number
  of claimants. The $50,000 limit applies only to claims against any one person under subsection
  (b)(2). Therefore, the correct amount is $25,000.
