stem: A licensee receives a civil summons and complaint alleging fraud in a residential sale, which
  involves a real estate transaction. Under Ala. Code § 34-27-31(j), what must the licensee do?
options:
  - Notify the commission in writing by certified mail within 5 days, including a copy of the
    summons and complaint.
  - Notify the commission in writing by certified mail within 10 days, including a copy of the
    summons and complaint.
  - Notify the commission in writing by regular mail within 10 days, including a copy of the summons
    and complaint.
  - Notify the commission in writing by certified mail within 10 days, but only if the charge is
    criminal.
key: B
explanation: The statute mandates that a licensee notify the commission in writing by certified mail
  within 10 days after notice of a civil summons and complaint involving a real estate transaction,
  and include a copy of the summons and complaint. Using regular mail, a shorter time frame, or
  limiting to criminal charges does not satisfy the requirement.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text — §
    34-27-31(j)"
  url: null
  quoted_text: Each licensee shall notify the commission within 10 days after notice to him or her of
    the institution of any criminal prosecution against him or her, or of a civil summons and
    complaint against him or her, if the subject matter of the civil complaint involves a real
    estate transaction or involves the goodwill of an existing real estate business. The
    notification shall be in writing by certified mail and shall include a copy of the summons and
    complaint.
