stem: If the Recovery Fund balance drops below $500,000, what is the assessment requirement for a
  licensee who is on inactive status?
options:
  - The licensee must pay a $30 fee per license
  - The licensee must pay no fee
  - The licensee must pay a $60 fee per license
  - The licensee must pay a $15 fee per license
key: B
explanation: Under Ala. Code § 34‑27‑31(d), a licensee on inactive status is not required to
  contribute to the fund when the balance is below $500,000. The $30 fee per license applies only to
  active licensees under the same provision, so the inactive licensee owes nothing.
