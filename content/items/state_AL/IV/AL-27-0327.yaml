stem: Under Ala. Code § 34-27-1(a), what is the required surety bond amount for a broker applying
  for an original or renewal license?
options:
  - $5,000
  - $10,000
  - $15,000
  - $20,000
key: B
explanation: The statute explicitly states that an applicant for a broker license must furnish a
  surety bond in the amount of $10,000. The $5,000 amount applies only to time-sharing salesmen.
  Therefore the correct bond amount for a broker is $10,000.
