stem: Under Ala. Code § 34-27-51(3), what must be included in all advertising of any vacation
  time-sharing plan?
options:
  - A statement that the seller is offering a time-sharing interest.
  - A statement that the seller is offering a fee simple ownership interest.
  - A statement that the seller is offering a lease plan.
  - A statement that the seller is offering a points-based vacation club.
key: A
explanation: Ala. Code § 34-27-51(3) requires that every advertisement for a vacation time-sharing
  plan include a clear statement that the seller is offering a time-sharing interest. Stating that
  the seller is offering a fee simple ownership interest does not satisfy this requirement.
