stem: A qualifying broker fails to keep a copy of a listing agreement for two years after the
  transaction closes. Which statement is correct under Ala. Code § 34-27-1(b)(30)?
options:
  - Compliance because the transaction closed over one year ago
  - Violation of the requirement to keep records for at least three years
  - Permission to discard the record with mutual written agreement
  - Exemption for properties valued under one hundred thousand dollars
key: B
explanation: The statute mandates that qualifying brokers retain copies of all contracts, leases,
  listings, and related records for at least three years. Keeping the record for only two years
  violates that requirement. The distractor claiming compliance because the transaction closed over
  one year ago ignores the three‑year minimum retention period.
