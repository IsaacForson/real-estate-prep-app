stem: A buyer cancels a vacation time‑sharing ownership contract after using the unit for 2 weeks of
  a 4‑week ownership period. The total contract price is $4,000. Under Ala. Code § 34-27-55(2), what
  is the maximum amount the seller must refund within 30 days of the cancellation notice?
options:
  - $3,000
  - $4,000
  - $1,000
  - $2,000
key: D
explanation: The buyer received half the contract benefit, so the pro rata portion is $2,000; the
  seller must refund the amount paid that exceeds this portion, which is $2,000, and must do so
  within 30 days. The full price is incorrect because the seller may retain the pro rata share for
  benefits received.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text §
    34-27-55(2)"
  url: null
  quoted_text: If the buyer has received any benefits pursuant to the contract, fail to refund within
    30 days after receipt of notification of cancellation made pursuant to Section 34-27-53 or
    Section 34-27-54 any and all payments made by the buyer to the seller which exceed a pro rata
    portion of the total price, taking into consideration the cost of use of the time-share
    facilities at an average rental rate per unit for all time-share units, representing the
    proportion of any contract benefits actually received by the buyer during the time preceding
    cancellation.
  secondary: []
math:
  worked_solution: |-
    Proportion of use = weeks used / total weeks = 2 / 4 = 0.5
    Pro rata portion = total price × proportion = $4,000 × 0.5 = $2,000
    Amount to refund = total price – pro rata portion = $4,000 – $2,000 = $2,000
  formulas:
    - proportion = weeks used / total weeks
    - pro rata portion = total price × proportion
    - refund = total price – pro rata portion
