    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text §
    34-27-1(d)"
  url: null
  quoted_text: The commission shall charge a license fee for each licensed principal school and shall
    charge a fee for each branch school in the amount of two hundred fifty dollars ($250) per year
    for each year or portion of a year remaining in the respective license period.
