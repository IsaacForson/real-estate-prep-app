stem: A branch school in Alabama is licensed for nine months of a licensing year. What license fee
  must the commission charge for that branch school under Ala. Code § 34-27-1(d)?
options:
  - $125
  - $208
  - $250
  - $500
key: C
explanation: The statute charges a fee of $250 per year or portion of a year for each branch school.
  Since nine months is a portion of a year, the full $250 fee applies. The $125 amount is the
  renewal fee for a principal school, not the branch school fee.
citation:
