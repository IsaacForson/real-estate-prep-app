stem: Under Ala. Code § 34-27-1(h), what must be true for each company or branch office regarding
  its qualifying broker?
options:
  - The qualifying broker must submit a monthly report to the commission.
  - The qualifying broker must be a resident of Alabama.
  - The qualifying broker must have held a license for at least five years.
  - The qualifying broker must be licensed at that address.
key: D
explanation: Ala. Code § 34-27-1(h) requires that each company or branch office be under the
  direction and supervision of a qualifying broker licensed at that address. The option stating the
  broker must be a resident of Alabama is incorrect because the statute does not impose a residency
  requirement for this role. The option requiring five years of licensure is incorrect because no
  specific duration of licensure is mandated in this subsection. The option requiring a monthly
  report is incorrect because this specific reporting duty is not found in § 34-27-1(h).
