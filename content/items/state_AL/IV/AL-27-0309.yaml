stem: What is the maximum monetary penalty the Alabama Real Estate Commission may impose for a
  single violation of the vacation time-sharing license law under Ala. Code § 34-27-61?
options:
  - A fine of $25.
  - A fine of $500.
  - A fine of $1,000.
  - A fine of $2,000.
key: C
explanation: The statute provides that a violator may be subject to a monetary penalty of not less
  than $25 nor more than $1,000. Therefore the maximum allowable fine is $1,000. A fine of $2,000
  exceeds this statutory limit and is not permitted.
