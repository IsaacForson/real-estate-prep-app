stem: If a proprietary school's surety bond is revoked or cancelled by the surety company, how many
  days does the school have to obtain a new bond and file it with the commission under Ala. Code §
  34-27-1(c)?
options:
  - 15 days.
  - 20 days.
  - 5 days.
  - 10 days.
key: D
explanation: The statute states that the school shall have 10 days to obtain a new bond and file it
  with the commission after revocation or cancellation. The other options represent incorrect
  timeframes.
