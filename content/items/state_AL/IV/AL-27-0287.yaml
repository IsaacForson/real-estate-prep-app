stem: According to Ala. Code § 34-27-53(1), what must be included in a vacation time-sharing
  contract at the time of its execution?
options:
  - The buyer's social security number and date of birth.
  - The actual date the contract is signed by all parties.
  - The seller's federal tax identification number and address.
  - The copy of the property deed and survey for the unit.
key: B
explanation: The statute requires the actual date the contract is signed by all parties to be
  included in the contract. The distractor about the buyer's social security number is not required
  by this subsection.
