stem: Jordan works as the on-site manager of an apartment complex in Mobile, handling leasing and
  maintenance but not showing units to prospective tenants. Is Jordan required to hold a real estate
  license under Alabama law?
options:
  - The individual must be licensed because they perform on-site maintenance and leasing tasks.
  - The individual must be licensed because they receive compensation for leasing and maintenance
    duties.
  - The individual must be licensed because they handle leasing agreements for tenants.
  - The individual is exempt because they manage an apartment building and do not show property
key: D
explanation: Under Section 34-27-2(b)(7), persons acting as managers of an apartment building or
  complex are exempt from licensing requirements, provided they are not on-site managers of a
  condominium. Jordan manages an apartment complex and does not show property, so the exemption
  applies. The idea that handling leasing activities requires a license is incorrect because the
  exemption covers such duties when the person does not show property.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text
    Section 34-27-2(b)(7)"
  url: null
  quoted_text: Persons acting as the manager for an apartment building or complex. However, this
    exception shall not apply to a person acting as an on-site manager of a condominium building or
    complex.
