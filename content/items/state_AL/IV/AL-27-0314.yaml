stem: A salesperson who obtained an Alabama license eight months ago applies for first renewal.
  Under Ala. Code § 34-27-35(j)(2), is the salesperson required to complete continuing education for
  this renewal?
options:
  - Yes, the salesperson must complete 15 clock hours of continuing education.
  - No, the salesperson is not required to complete continuing education for the first renewal.
  - Yes, the salesperson must complete 7.5 clock hours of continuing education.
  - Yes, the salesperson must complete 30 clock hours of continuing education.
key: B
explanation: Ala. Code § 34-27-35(j)(2) states that an applicant for first renewal who has been
  licensed for not more than one year is not required to comply with the continuing education
  requirement for that first renewal. Because the salesperson has been licensed only eight months,
  which is within the one‑year period, no continuing education is needed for this renewal. The
  option stating that 15 clock hours are required incorrectly applies the standard continuing
  education rule to a first‑year renewal. The options suggesting 7.5 or 30 clock hours also impose a
  continuing education obligation that the statute does not require for a first renewal within the
  first year.
citation:
