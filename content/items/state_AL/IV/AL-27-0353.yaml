stem: Under Ala. Code § 34-27-1(b)(11), a salesperson who owns a corporation to receive referral
  fees is exempt from which requirement?
options:
  - The corporation must be licensed as a real estate brokerage
  - The corporation must maintain a separate federally insured trust account
  - The corporation is not required to be licensed under this chapter
  - The corporation may engage in any activity requiring a real estate license
key: C
explanation: The exemption in subdivision (b)(11) explicitly states that a business organization
  owned by a salesperson or associate broker for the purpose of receiving payments contemplated in
  that subdivision is not required to be licensed under this chapter. Therefore, the corporation
  does not need a real estate broker license. The other options describe obligations that are not
  imposed by this exemption.
citation:
  source: "### Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate
    Brokers (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current
    text § 34-27-1(b)(11)"
  url: null
  quoted_text: The business organization shall not be required to be licensed under this chapter, and
    shall not engage in any other activity requiring a real estate license.
