stem: Which of the following activities is exempt from licensing requirements under Ala. Code §
  34-27-2(b)(6)?
options:
  - Performing clerical duties while physically showing listed property
  - Performing clerical duties without physically showing listed property
  - Negotiating a sale price for a client without holding a real estate license
  - Preparing a purchase agreement for a buyer without being licensed
key: B
explanation: The exemption permits persons performing general clerical or administrative duties for
  a broker so long as they do not physically show listed property. Performing clerical duties
  without showing property therefore falls within the exemption. Performing clerical duties while
  showing property requires a license because the exemption’s condition is violated.
