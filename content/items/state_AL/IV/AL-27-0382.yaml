stem: A seller of a vacation time-sharing lease plan receives $12,000 in cash and $3,000 in
  receivables from a purchaser. According to Ala. Code § 34-27-58(a)(1), how much must the seller
  place in escrow?
options:
  - $9,000
  - $7,500
  - $6,000
  - $3,750
key: B
explanation: The seller must place 50 percent of the total cash and receivables in escrow. Adding
  $12,000 and $3,000 gives $15,000; half of $15,000 is $7,500. The other amounts result from
  applying the percentage to only one component or using an incorrect percentage.
citation:
  source: Ala. Code § 34-27-58(a)(1)
  url: null
  quoted_text: Place in escrow 50 percent of the cash and receivables received from the purchasers of
    such plans, such receivables to be assessed at net principal value.
  secondary: []
math:
  worked_solution: |-
    Total cash and receivables = $12,000 + $3,000 = $15,000
    Escrow amount = $15,000 × 0.50 = $7,500
  formulas:
    - Escrow = (Cash + Receivables) × 0.50
