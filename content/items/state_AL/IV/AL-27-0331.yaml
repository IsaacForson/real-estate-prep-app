stem: A salesperson fails to submit proof of completing the required 15 clock hours of continuing
  education by September 30 of the final year of the license period. According to Ala. Code §
  34-27-35(j)(1), what is the consequence for the salesperson’s license?
options:
  - The license will be placed on inactive status on the following October 1 and subject to
    reactivation requirements
  - The license will be revoked immediately and the salesperson must reapply as a new applicant
  - The license will remain active but the salesperson will be fined $150
  - The license will be placed on probation for six months with no additional requirements
key: A
explanation: The law provides that missing the continuing‑education deadline results in the license
  being placed on inactive status effective the following October 1 and that the licensee must
  satisfy all reactivation requirements. Revocation, a fine, or probation are not prescribed for
  this specific failure.
citation:
