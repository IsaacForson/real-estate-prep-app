stem: Under Ala. Code § 34-27-1(b)(15), what must a salesperson include in any advertisement where
  they hold themselves out as a real estate agent?
options:
  - The property's MLS listing number and address
  - The date the salesperson's license was issued
  - The salesperson's personal phone number
  - The qualifying broker's name or trade name
key: D
explanation: The statute requires that a salesperson’s advertising must include the qualifying
  broker’s name or trade name presented prominently. Omitting that information violates the rule.
  The distractor about the salesperson’s personal phone number is incorrect because the law does not
  mandate that detail in advertisements.
