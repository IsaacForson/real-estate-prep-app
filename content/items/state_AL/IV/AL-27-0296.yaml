stem: Maria is employed as the on-site manager of a condominium complex in Birmingham. Her duties
  include showing vacant units to prospective tenants and collecting rent. According to Ala. Code §
  34-27-2(b)(7), which statement is correct?
options:
  - She must hold a real estate license because she manages a condominium complex
  - She is exempt from licensing requirements as she manages an apartment building
  - She is exempt from licensing requirements because she only collects rent
  - She must hold a real estate license only if she also negotiates lease terms
key: A
explanation: The exemption for managers applies only to apartment buildings or complexes, not to
  on-site managers of condominium buildings or complexes. Since Maria manages a condominium complex,
  she is not exempt and must hold a license to perform activities such as showing units. The
  distractor about managing an apartment building incorrectly applies the exemption to the wrong
  property type.
