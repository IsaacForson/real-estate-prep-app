stem: The Governor makes an ad interim appointment to the Alabama Real Estate Commission while the
  Legislature is not in session. By when must the Senate confirm this appointment under Ala. Code §
  34-27-7(b)?
options:
  - Within 30 days following the Governor's ad interim appointment
  - At the next following regular or special session of the Legislature
  - Within 10 days after the Legislature reconvenes
  - At the next regular session of the Legislature only
key: B
explanation: Ad interim appointments must be confirmed by the Senate at the next following regular
  or special session of the Legislature. A 30‑day deadline is not required by the law, nor is
  confirmation limited to the next regular session only or tied to a specific number of days after
  the Legislature reconvenes.
citation:
  source: Ala. Code § 34-27-7(b)
  url: null
  quoted_text: Ad interim appointments shall be confirmed by the Senate at the next following regular
    or special session of the Legislature. Failure by the Senate to confirm shall result in a
    vacancy on the board that shall be filled by appointment by the Governor and confirmation by the
    Senate while the Legislature is in session.
