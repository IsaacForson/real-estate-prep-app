stem: A licensee who is part of a team places an advertisement that includes the team name but does
  not include the name of the company with whom they are licensed. Which requirement under Ala. Code
  § 34-27-39(e) is violated?
options:
  - Include the name of the company with whom the licensee is licensed in the advertisement
  - Include the name of at least one team member in the advertisement
  - Receive written authorization from the qualifying broker before using the team name in any
    advertisement
  - Include the term “team” or “group” in the team name and use it in all marketing materials
key: A
explanation: Ala. Code § 34-27-39(e)(2) requires that any advertisement by a licensee acting as part
  of a team include the name of the company with whom the licensee is licensed. The scenario omits
  that company name, violating the requirement. The correct option states that the advertisement
  must include the company's name.
