stem: A licensee wishes to be a member of two different teams simultaneously. According to Ala. Code
  § 34-27-39(d), is this permissible?
options:
  - Yes, if the teams are affiliated with different qualifying brokers
  - No, unless the licensee obtains written authorization from both qualifying brokers
  - Yes, as long as the licensee provides separate member lists to each qualifying broker
  - No, because a person may not be a member of more than one team
key: D
explanation: The statute plainly states that no person shall be a member of more than one team, so
  the licensee may not join two teams. The suggestion that providing separate member lists to each
  qualifying broker would allow membership in two teams does not override this prohibition.
