stem: Under Ala. Code § 34-27-1(k), what are the start and end dates of an approval or license
  period for schools, instructors, administrators, or courses?
options:
  - December 1 through November 30
  - November 1 through October 31
  - January 1 through December 31
  - October 1 through September 30
key: D
explanation: The statute explicitly states that approval and license periods run from October 1 of
  the first year through September 30 of the final year of the approval period. Therefore, the
  correct dates are October 1 through September 30. The distractor “January 1 through December 31”
  incorrectly assumes a calendar year period, which is not supported by the text.
