stem: A salesperson licensed under Broker Beth receives a $500 commission from a builder for
  referring a buyer. According to Ala. Code § 34-27-1(b)(14), which statement is correct?
options:
  - The salesperson may keep the commission because it was earned from a third party.
  - The salesperson must remit the commission to Broker Beth, the qualifying broker.
  - The salesperson may accept the commission if the builder is also a licensed broker.
  - The salesperson may accept the commission only if the buyer is a relative.
key: B
explanation: Under Ala. Code § 34-27-1(b)(14), a salesperson may not accept a commission or other
  valuable consideration for performing any act requiring a license from anyone other than the
  qualifying broker. Therefore the salesperson must remit the $500 commission received from the
  builder to Broker Beth. The other options incorrectly permit the salesperson to keep or accept the
  commission under conditions not allowed by the statute.
