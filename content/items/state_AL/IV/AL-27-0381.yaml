explanation: The statute requires the seller to place in escrow 50 percent of the cash and
  receivables received from purchasers of a vacation time-sharing lease plan. This escrow protects
  the purchaser’s right to a refund if the accommodations become unavailable. The other percentages
  are not supported by the text.
