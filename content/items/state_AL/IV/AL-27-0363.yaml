stem: A licensee submits a false statement on their license application claiming they have never
  been convicted of a felony, when in fact they were convicted of a misdemeanor involving moral
  turpitude five years ago. Which prohibited act under Ala. Code § 34-27-1(b)(1) does this
  constitute?
options:
  - Procuring or attempting to procure a license for himself or herself or another by fraud,
    misrepresentation, or deceit, or by making a material misstatement of fact in an application for
    a license.
  - Engaging in misrepresentation or dishonest or fraudulent acts when selling, buying, trading, or
    renting real property of his or her own or of a spouse, child, or parent.
  - Making a material misrepresentation or failing to disclose to a potential purchaser or lessee
    any latent structural defect or any other defect known to the licensee.
  - Making any false promises of a character likely to influence, persuade, or induce any person to
    enter into any contract or agreement.
key: A
explanation: The key is correct because Ala. Code § 34-27-1(b)(1) prohibits procuring a license by
  fraud, misrepresentation, deceit, or making a material misstatement of fact on the application.
  The scenario involves a false statement about a prior conviction, which is a material misstatement
  on the application. The option describing misrepresentation in property transactions does not
  apply to the licensing application context.
