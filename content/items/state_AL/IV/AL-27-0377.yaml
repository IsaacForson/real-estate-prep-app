stem: A licensee advertises a vacation time-sharing plan in a newspaper advertisement that includes
  the company name and the team name but does not include any statement about offering a
  time-sharing interest. Which provision of Ala. Code § 34-27-51 is violated?
options:
  - Violation of subsection (4)
  - Violation of subsection (3)
  - Violation of subsection (2)
  - Violation of subsection (1)
