stem: A licensee receives an earnest money deposit from a buyer and deposits it into the licensee’s
  personal checking account at a local bank. Which statement is correct under Ala. Code §
  34-27-1(b)(8)(b)?
options:
  - The deposit is allowed if the licensee keeps a written record of the funds
  - The deposit violates the rule requiring client funds to be held in a separate federally insured
    account
  - The deposit is permissible because the personal account is also federally insured
  - The deposit is acceptable if the funds are returned to the buyer within one business day
key: B
explanation: The rule requires that all funds belonging to others be deposited in a separate
  federally insured Alabama account; placing them in a personal account violates that requirement.
  The distractor suggesting the deposit is allowed if the personal account is also federally insured
  misses the requirement that the account be separate from the licensee’s own funds.
