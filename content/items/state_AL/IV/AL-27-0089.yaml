stem: Which requirement must a proprietary school meet to operate under Ala. Code § 34-27-1(e)?
options:
  - Having a branch school in any county.
  - Having a licensed instructor.
  - Having an approved administrator.
  - Having a $10,000 surety bond.
key: C
explanation: The statute requires all schools to name and have approved by the commission a school
  administrator responsible for the school’s actions. Therefore, having an approved administrator is
  mandatory. A licensed instructor alone does not satisfy the administrator requirement.
