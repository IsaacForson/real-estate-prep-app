stem: Under Ala. Code § 34-27-55(1), how many days does a seller have to refund all payments after
  receiving a buyer's cancellation notice if the buyer has **NOT** received any benefits under the
  contract?
options:
  - 10 days
  - 30 days
  - 15 days
  - 20 days
key: D
explanation: The statute requires a refund within 20 days after receipt of notice of cancellation
  when the buyer has received no benefits. The 30‑day period applies only when benefits have been
  received.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text §
    34-27-55(1)"
  url: null
  quoted_text: Fail to refund any and all payments made by the buyer under the contract and return any
    negotiable instrument, other than checks, executed by the buyer in connection with the contract
    or services within 20 days after receipt of notice of cancellation made pursuant to Section
    34-27-53, if the buyer has not received any benefits pursuant to the contract.
