stem: Under Ala. Code § 34-27-35(g), what penalty must a licensee pay if the renewal form is filed
  between September 1 and September 30 of the final year of the license period?
options:
  - The licensee must pay no penalty; only the renewal fees are required
  - The licensee must pay a one‑hundred‑dollar ($100) penalty in addition to the renewal fees
  - The licensee must pay a one‑hundred‑fifty‑dollar ($150) penalty in addition to the renewal fees
  - The licensee must pay a two‑hundred‑fifty‑dollar ($250) penalty in addition to the renewal fees
key: C
explanation: The statute explicitly states that filing during the September 1‑through‑September 30
  window triggers a $150 penalty in addition to the regular renewal fees. The $100 and $250 amounts
  are not mentioned in the law, and the claim of no penalty ignores the prescribed penalty
  provision.
