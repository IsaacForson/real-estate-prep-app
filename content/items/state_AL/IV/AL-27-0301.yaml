key: A
explanation: "The definition of qualifying broker is exactly as stated in Ala. Code §
  34-27-2(a)(15): a broker under whom a sole proprietorship, corporation, partnership, branch
  office, or lawfully constituted business organization as the Legislature may from time to time
  provide is licensed, or a broker licensed as a company to do business as a sole proprietorship who
  is responsible for supervising the acts of the company or proprietorship and all real estate
  licensees licensed therewith. The incorrect option that adds a provision excluding inactive
  brokers introduces a condition that does not appear in the statute."
