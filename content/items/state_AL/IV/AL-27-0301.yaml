stem: What is the definition of a 'qualifying broker' under Ala. Code § 34-27-2(a)(15)?
options:
  - A broker under whom a sole proprietorship, corporation, partnership, branch office, or lawfully
    constituted business organization as the Legislature may from time to time provide is licensed,
    or a broker licensed as a company to do business as a sole proprietorship who is responsible for
    supervising the acts of the company or proprietorship and all real estate licensees licensed
    therewith
  - A broker under whom a sole proprietorship, corporation, partnership, branch office, or lawfully
