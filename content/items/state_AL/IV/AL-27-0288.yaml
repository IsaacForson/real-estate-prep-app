  quoted_text: (c) It shall be a violation of this article for the seller of a vacation time-sharing
    ownership plan to fail to furnish the buyer with an inventory of all furniture, fixtures and
    appliances which will be located in the accommodation during the time period purchased under a
    vacation time-sharing ownership plan or at closing.
