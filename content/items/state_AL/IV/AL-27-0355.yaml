    text § 34-27-1(d)(2)"
  url: null
  quoted_text: the commission may decline to issue an order requiring any accused person or business
    entity to cease and desist from engaging in activities requiring a license under this chapter
    when the accused person or business entity is not licensed under this chapter. In this instance,
    the commission shall proceed to give appropriate notice of the violations and hold a hearing.
