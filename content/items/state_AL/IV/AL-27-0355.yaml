stem: An unlicensed individual advertises real estate services in Alabama without holding a license.
  The Alabama Real Estate Commission decides not to issue a cease and desist order but instead to
  hold a hearing on the alleged violations. Which provision of Ala. Code § 34-27-1 allows the
  commission to take this action?
options:
  - The commission may decline to issue a cease and desist order and instead hold a hearing when the
    accused is unlicensed
  - The commission may only hold a hearing after issuing a cease and desist order that becomes final
  - The commission must issue a cease and desist order for any unlicensed activity
  - The commission may impose a fine but cannot hold a hearing without first issuing a cease and
    desist order
key: A
explanation: Subdivision (d)(2) states that the commission may decline to issue a cease and desist
  order for unlicensed activity and instead proceed to give notice and hold a hearing. This
  provision provides the discretion the commission exercised. The other options misstate the
  commission's authority by imposing mandatory actions or incorrect prerequisites.
citation:
  source: "### Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate
