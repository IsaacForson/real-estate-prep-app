stem: A licensee meets a prospective buyer at a property showing (not an open house) and begins
  discussing the property's features. The licensee has not yet disclosed any confidential
  information. Which of the following is required before the licensee may continue showing the
  property and discussing its features?
options:
  - A written brokerage agreement must be signed before any property showing may occur.
  - Both a written brokerage agreement and a written disclosure form must be obtained.
  - Neither a written brokerage agreement nor a written disclosure form is required at this point.
  - A written disclosure form describing brokerage services must be provided to the buyer.
key: D
explanation: Under Ala. Code § 34-27-82(c), a licensee must provide a written disclosure form
  describing brokerage services before any confidential information is disclosed and before
  providing any brokerage service, such as showing a property to a prospective buyer. A written
  brokerage agreement is only required before listing for sale or submitting an offer, not at this
  stage.
citation:
  source: Ala. Code § 34-27-82(c)
  url: null
  quoted_text: The licensee shall provide a written disclosure form to a consumer for signature
    describing the types of brokerage services, as identified in subsection (a), that are available
    to clients and customers of real estate brokerage companies, as soon as reasonably possible and
    before any confidential information is disclosed to any other person by a licensee.
