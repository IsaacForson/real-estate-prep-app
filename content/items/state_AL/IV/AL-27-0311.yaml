stem: A lender provides funds for a vacation time‑sharing project; later the escrow account shows a
  deficiency caused by worthless receivables. Under Ala. Code § 34-27-61, what is the lender’s
  liability to contribute funds to cure the deficiency?
options:
  - The lender has liability to contribute funds to the escrow deficiency.
  - The lender has no liability to contribute funds to the escrow deficiency.
  - The lender has a duty to contribute funds to the escrow deficiency.
  - The lender has an obligation to contribute funds to the escrow deficiency.
key: B
explanation: The proviso in Section 34-27-61 says that a lender who has advanced funds has no
  liability to contribute funds to cure an escrow deficiency arising from worthless receivables.
  Consequently the lender bears no such liability. The distractor claiming the lender must
  contribute funds contradicts this statutory proviso.
