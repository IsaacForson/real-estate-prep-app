    Section 34-27-61"
  url: null
  quoted_text: In the event of an escrow deficiency, a lender who has advanced funds to a project
    shall have no liability to contribute funds to the escrow to cure the deficiency, and the
    lender’s lien on the property shall not be affected by the deficiency.
