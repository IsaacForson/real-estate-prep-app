stem: After the death of its qualifying broker, Gamma Company appoints a temporary qualifying broker
  who receives the temporary license on March 1. Assuming no fully licensed broker is appointed,
  until what date may Gamma Company legally operate under the temporary qualifying broker?
options:
  - The latest permissible date is October 1.
  - The latest permissible date is September 1.
  - The latest permissible date is March 1 of next year.
  - The latest permissible date is August 31.
key: B
explanation: The correct answer is that the company may operate under a temporary qualifying broker
  for no more than six months after the commission issues the temporary license. Ala. Code §
  34-27-1(l) provides this six‑month limit. Starting from March 1, six months later is September 1,
  so operation may continue through that date. The option stating August 31 falls short of the
  six‑month period, the option stating October 1 exceeds it, and the option stating March 1 of the
  following year incorrectly assumes a one‑year period.
