stem: Under Ala. Code § 34-27-1(c), what is the required surety bond amount for a proprietary school
  offering commission-approved prelicense or postlicense courses?
options:
  - A $10,000 surety bond
  - A $20,000 surety bond
  - A $25,000 surety bond
  - A $30,000 surety bond
key: B
explanation: The statute requires proprietary schools to furnish a surety bond in the amount of
  twenty thousand dollars ($20,000). Therefore, a $20,000 bond satisfies the requirement. A $10,000
  bond is insufficient because it is half the mandated amount.
