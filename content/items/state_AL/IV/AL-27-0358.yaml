stem: A licensee has a final judgment entered against them for misrepresentation in a real estate
  transaction. Under Ala. Code § 34-27-1(b), what happens to the license?
options:
  - The license is automatically suspended.
  - The license is placed on inactive status.
  - The license remains active until appealed.
  - The license is revoked immediately.
key: A
explanation: The statute provides that when a final judgment resulting from licensed activity is
  rendered, the license shall be automatically suspended. Thus the license is suspended, not revoked
  or placed on inactive status. Revocation only follows a hearing after suspension, so the
  immediate‑revocation option is wrong.
citation:
  source: Ala. Code § 34-27-1(b)
  url: null
  quoted_text: If at any time a final judgment is rendered against a licensee under this article and
    the final judgment shall result from or involve any activity covered by this article, the
    license of the licensee shall be automatically suspended.
