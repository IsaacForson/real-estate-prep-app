stem: Under Ala. Code § 34-27-1(b), a licensee is exempt from which requirement when selling real
  property located in another state or county?
options:
  - The requirement to obtain municipal sign permits
  - The requirement to report criminal convictions to the commission
  - The requirement to comply with Section 40-12-150
  - The requirement to pay Recovery Fund fees
key: C
explanation: Under Ala. Code § 34-27-1(b), a licensee is exempt from the requirements of Section
  40-12-150 when selling real property located in another state or county. Therefore, the correct
  answer is the requirement to comply with Section 40-12-150. The distractor about Recovery Fund
  fees is incorrect because the exemption does not apply to fund contributions.
