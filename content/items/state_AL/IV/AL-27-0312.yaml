stem: Which licensees are exempt from the continuing education requirement under Ala. Code §
  34-27-35(j)(2)?
options:
  - Licensees who are 65 years old or older by September 30, 2000 and have been licensed for at
    least 10 years prior to that date
  - Licensees who are under 65 years old and have been licensed for less than 10 years
  - Licensees who are under 65 years old but have been licensed for at least 10 years
  - Licensees who are 65 years old or older by September 30, 2000 but have been licensed for less
    than 10 years
key: A
explanation: The exemption applies to licensees who are 65 or older by September 30, 2000 and have
  been licensed for at least 10 years prior to that date. Licensees who are under 65 and have been
  licensed for less than 10 years do not meet the age requirement. Licensees who are under 65 but
  have been licensed for at least 10 years also do not meet the age requirement. Licensees who are
  65 or older by September 30, 2000 but have been licensed for less than 10 years do not meet the
  licensure duration requirement.
