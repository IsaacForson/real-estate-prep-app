stem: Under Ala. Code § 34-27-101(c), what is the maximum amount of additional damages a court may
  award for a violation of the real estate license law?
options:
  - Double damages
  - Quadruple damages
  - Triple damages
  - Actual damages
key: C
explanation: The statute allows a court to award actual damages plus up to three times the actual
  damages as additional damages. Therefore, the maximum additional damages are three times the
  actual damages. Options suggesting double or quadruple damages are incorrect because they either
  fall short of the statutory maximum or exceed it.
