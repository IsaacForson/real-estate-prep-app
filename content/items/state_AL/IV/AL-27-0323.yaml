stem: A vacation time‑sharing seller closes a sale and retains the contract for only two years after
  the buyer has fulfilled all obligations. What is the minimum retention period required for such
  contracts?
options:
  - The contract must be kept for at least three years after the parties have fully performed their
    obligations
  - The contract must be kept for at least two years after the parties have fully performed their
    obligations
  - The contract must be kept for at least three years after the date of sale, regardless of
    performance
  - The contract must be kept for at least one year after the parties have fully performed their
    obligations
key: A
explanation: Ala. Code § 34-27-52(2) requires that each sale contract be retained for at least three
  years after the parties have completely performed their obligations. Keeping it for only two years
  fails to meet this minimum, making the practice a violation. Stating that the contract must be
  kept for at least two years after the parties have fully performed their obligations shortens the
  required period.
