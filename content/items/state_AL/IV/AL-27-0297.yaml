stem: John, acting under a power of attorney for his uncle, receives a commission for helping sell
  the uncle's house. According to Ala. Code § 34-27-2(b)(3), does John need a real estate license?
options:
  - John must hold a real estate license because he received compensation for the transaction
  - John is exempt from licensing requirements because he acted under a power of attorney
  - John is exempt from licensing requirements because he acted in good faith
  - John must hold a real estate license only if he also negotiated the sale price
key: A
explanation: The exemption for persons acting under a power of attorney requires that they act
  without compensation. Because John received a commission, he does not meet the exemption’s
  condition and must hold a license. The distractor that claims exemption based solely on acting
  under a power of attorney ignores the compensation requirement.
