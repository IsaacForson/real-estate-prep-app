stem: A person holds an active real estate broker license but does not hold a time-sharing sales
  license. According to Ala. Code § 34-27-1(f), what must they do before serving as qualifying
  broker for a vacation time-sharing plan?
options:
  - Obtain a time-sharing sales license
  - Notify the commission of a change of address
  - Complete 30 hours of continuing education
  - Pay a $100 license transfer fee
key: A
explanation: The qualifying broker must have a current, active real estate broker’s license as well
  as a time-sharing sales license. Completing continuing education is not mentioned as a requirement
  for qualifying broker status in this provision.
