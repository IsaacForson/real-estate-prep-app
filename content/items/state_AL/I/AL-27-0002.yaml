stem: Jane Doe, a licensed broker, lists a home located in Georgia for sale. Under § 34-27-10(b), is
  Jane subject to the requirements of Section 40-12-150?
options:
  - No, because the property is situated in another state
  - Yes, because all brokers must follow Section 40-12-150 regardless of location
  - No, because Section 40-12-150 applies only to rental transactions
  - Yes, because the rule applies to any real estate activity
key: A
explanation: Section 34-27-10(b) expressly states that a licensee shall not be subject to the
  requirements of Section 40-12-150 when selling or offering for sale realty situated in another
  state or county. Since the property is in Georgia, Jane is not subject to those requirements. The
  other choices misinterpret the exemption.
