stem: A broker in Montgomery must also comply with a city ordinance that requires all real estate
  advertisements to include the broker’s license number. Under Ala. Code § 34-27-10(a), how do the
  chapter requirements relate to this city ordinance?
options:
  - The chapter requirements are superseded by the city ordinance
  - The chapter requirements are in addition to the city ordinance
  - The chapter requirements are replaced by the city ordinance
  - The chapter requirements are only applicable if the city ordinance is silent
key: B
explanation: The statute says the requirements of this chapter shall be in addition to the
  requirements of existing or future laws or ordinances. Therefore, the chapter requirements add to,
  not replace, the city ordinance. The option stating they are superseded is incorrect because the
  law does not allow the chapter to be overridden by local ordinances.
