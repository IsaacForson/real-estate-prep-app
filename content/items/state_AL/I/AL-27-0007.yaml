stem: Under Ala. Code § 34-27-7(c), how many years of prior Alabama residency and citizenship are
  required for a person to be eligible for appointment to the Alabama Real Estate Commission?
options:
  - Seven years.
  - Ten years.
  - Five years.
  - Fifteen years.
key: B
explanation: The statute explicitly states that each appointee must have been a resident and citizen
  of Alabama for at least ten years prior to appointment. Therefore, ten years is the minimum
  required period. Options stating five or seven years fall short of this requirement, while fifteen
  years exceeds the minimum but is not mandated.
