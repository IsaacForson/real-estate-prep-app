stem: Under Ala. Code § 34-27-7(d), if a Black member serving on the Alabama Real Estate Commission
  completes a term and is **NOT** reappointed, how must the successor Black member be appointed
  regarding congressional districts?
options:
  - Appointed from the same congressional district as the predecessor to maintain continuity
  - Appointed from any congressional district in the state to ensure broad representation
  - Appointed from a different congressional district, rotating equally among the remaining districts
  - Appointed from the district with the highest population to reflect demographic balance
key: C
explanation: The law requires each successor Black member to be appointed from a different
  congressional district, with rotation equally among the remaining districts. The distractor
  suggesting appointment from any district ignores the rotation requirement.
