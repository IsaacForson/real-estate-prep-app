stem: The Alabama Real Estate Commission proposes a rule that clarifies the definition of 'listing'
  but conflicts with a state statute that defines an activity requiring a license. Under Ala. Code §
  34-27-8.1(c), what is the effect of this conflict?
options:
  - The rule is invalid because it conflicts with a licensing statute
  - The rule is valid only if approved by the Alabama Real Estate Commission
  - The rule is valid because it clarifies the definition of a licensed activity
  - The rule is invalid only if it reduces competition in the marketplace
key: A
explanation: The rule is invalid because the statute prohibits any rule that conflicts with a
  statute defining a licensed activity, even if the rule clarifies a definition. The distractor
  claiming validity based on clarification ignores the prohibition on conflicting with licensing
  statutes.
