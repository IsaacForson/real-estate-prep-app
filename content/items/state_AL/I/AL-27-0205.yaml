stem: A licensee submits a renewal application to the Alabama Real Estate Commission that contains a
  false statement about continuing education hours. Under Ala. Code § 34-27-11(b), what is the
  consequence?
options:
  - A Class A misdemeanor
  - A Class B misdemeanor
  - A Class C felony
  - A civil infraction
key: A
explanation: The statute provides that filing a false or untrue document with the commission is a
  Class A misdemeanor. A Class B misdemeanor is incorrect because the law specifies Class A for this
  offense.
citation:
  source: Ala. Code § 34-27-11(b)
  url: null
  quoted_text: Any person who files with the commission any notice, statement, or other document or
    information required under the provisions of this chapter which is false or untrue or contains
    any material misstatement of fact commits a Class A misdemeanor and, on conviction, shall be
    punished accordingly.
