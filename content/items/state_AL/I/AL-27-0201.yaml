key: B
explanation: The statute explicitly states that licensees under this chapter shall be exempt from
  the provisions of Section 5-19-22, making that the correct exemption. The distractor Section
  40-12-150 is incorrect because that exemption applies only when selling property located in
  another state or county, not as a blanket exemption for all licensees.
