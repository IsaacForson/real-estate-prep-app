stem: A licensee in Huntsville must also comply with a county ordinance that requires brokers to
  maintain a trust account for earnest money. Under Ala. Code § 34-27-10(a), is the licensee
  required to follow both the chapter requirements and the county ordinance?
options:
  - The licensee must follow only the county ordinance because it is more specific.
  - The licensee must follow only the chapter requirements because state law supersedes local
    ordinances.
  - The licensee must follow neither because the chapter requirements are optional.
  - The licensee must follow both the chapter requirements and the county ordinance.
key: D
explanation: Subsection (a) provides that the chapter’s requirements are in addition to existing or
  future laws or ordinances of any state, county, or municipality regulating real estate brokers.
  Therefore the licensee must obey both the chapter and the county ordinance. The distractor
  claiming only chapter requirements apply because state law supersedes local ordinances contradicts
  the ‘in addition to’ language.
