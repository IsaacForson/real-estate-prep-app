stem: The Governor receives a list of three nominees for a commission seat from the Alabama
  Professional Real Estate Society. Two of the nominees are members of the Society; the third is
  not. According to Ala. Code § 34-27-7(a), which statement is correct about the Governor's
  appointment?
options:
  - The Governor must appoint the nominee who is not a member of the Society.
  - The Governor may appoint any of the three nominees, as long as at least one nominee on the list
    is not a member of the Society.
  - The Governor may appoint any nominee only if all three nominees are not members of the Society.
  - The Governor cannot make an appointment unless the Society provides a list of at least five
    nominees.
key: B
explanation: The law requires that at least one nominee for each seat not be a member of the Real
  Estate Society or trade association, and it directs the Governor to appoint one of the three
  nominated persons. Therefore, the Governor may choose any nominee provided the list includes at
  least one non‑member. The option stating that the Governor must appoint the non‑member nominee
  incorrectly restricts the appointment to that nominee only, while the option stating that the
  Governor may appoint any nominee only if all three nominees are non‑members adds an unnecessary
  condition.
citation:
