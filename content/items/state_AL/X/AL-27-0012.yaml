stem: A broker pays a cash referral fee to a former client who holds no real estate license, as
  thanks for referring a buyer. Which disciplinary rule does this violate?
options:
  - Paying a fee to a person who holds no real estate license.
  - Failing to disclose a latent structural defect to a purchaser.
  - Making a false promise to induce a person into a contract.
  - Failing to voluntarily furnish a copy of a signed lease.
key: A
explanation: Section 34-27-36 bars a licensee from paying compensation or a fee to anyone other than
  a licensee or a multiple listing service, which forbids paying a referral fee to an unlicensed
  person.
