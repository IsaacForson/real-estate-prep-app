stem: A broker agrees to list an owner's home, promising the owner a set net amount and keeping any
  sale proceeds above that amount as his own commission. Why does this arrangement subject the
  broker to discipline?
options:
  - It is treated as an unlawful net listing agreement.
  - It fails to disclose closing costs to the buyer and seller.
  - It fails to include a fixed expiration date in the listing.
  - It amounts to publishing a misleading advertisement.
key: A
explanation: Section 34-27-36 treats an agreement stipulating a net price to the owner with the
  broker keeping any excess as his commission as a prohibited net listing agreement, regardless of
  how the parties label it.
