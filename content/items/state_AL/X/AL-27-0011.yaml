stem: A salesperson represents both the buyer and the seller in the same sale but never informs
  either party or obtains their consent. Which disciplinary violation has the salesperson committed?
options:
  - Placing a sign on a property without the owner's written consent.
  - Publishing an advertisement that is likely to deceive the public.
  - Failing to furnish a copy of a signed listing agreement promptly.
  - Acting for more than one party without required consent.
key: D
explanation: Section 34-27-36 prohibits a licensee from acting for more than one party in a
  transaction without the knowledge and written consent of all parties for whom the licensee acts,
  which describes undisclosed dual representation.
