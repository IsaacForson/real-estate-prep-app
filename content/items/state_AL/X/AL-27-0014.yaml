stem: A group of licensees under the same company wants to name their team "Summit Realty
  Corporation" in their advertising. Why would this name violate the advertising rule for teams?
options:
  - It fails to include the name of any team member.
  - It omits the required word describing group size.
  - It suggests the team is a real estate company.
  - It fails to include the name of the licensed company.
key: C
explanation: The rule on advertising teams states that a team's name must not use terms that could
  lead the public to believe the team is a real estate company, rather than a distinct group within
  a company, and "Corporation" is exactly that kind of prohibited term.
