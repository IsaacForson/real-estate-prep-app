stem: A licensee wants to purchase a property that his own brokerage was hired to sell. Before
  acquiring any interest in that property, what must the licensee do regarding the seller?
options:
  - Obtain verbal approval from the qualifying broker only.
  - Disclose the interest only if the seller later asks about it.
  - Wait until after closing to mention the personal interest.
  - Provide prior written disclosure to all parties.
key: D
explanation: The obligations statute requires a licensee to act on behalf of himself, his immediate
  family, or an entity in which he has a personal interest only with prior timely written disclosure
  of that interest to all parties to the transaction.
citation:
  source: Ala. Code § 34-27-84
  url: null
  quoted_text: To act on behalf of the licensee or his or her immediate family, or on behalf of any
    other individual, organization, or business entity in which the licensee has a personal interest
    only with prior timely written disclosure of this interest to all parties to the transaction.
