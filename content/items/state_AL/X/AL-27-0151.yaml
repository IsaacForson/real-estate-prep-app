stem: A licensee receives notice of a criminal indictment related to a real estate transaction but
  does not inform the commission within the required time frame. What is the effect of this failure
  under Ala. Code § 34-27-31(i)?
options:
  - The licensee must pay a $500 fine to the commission.
  - The licensee is required to attend a disciplinary hearing within 30 days.
  - The licensee waives any rights to recover from the Recovery Fund.
  - The commission must automatically suspend the licensee’s license.
key: C
explanation: The statute states that the failure of an aggrieved person to strictly comply with all
  of the provisions of this section shall constitute a waiver of any rights under this section.
  Thus, not providing the required notice within 10 days results in the licensee losing the ability
  to seek recovery from the Recovery Fund.
