stem: A licensee's check to the commission for a fine is declined by the bank. Once the commission
  electronically notifies the licensee of the decline, how many days does the licensee have to
  submit full and valid payment?
options:
  - Six months after notification.
  - 30 days after notification.
  - 5 days after notification.
  - 45 days after notification.
key: B
explanation: Section 34-27-36 gives a licensee 30 days after electronic notification of a declined
  payment to submit full and valid payment plus the additional fee for the faulty payment.
citation:
  source: Ala. Code § 34-27-36
  url: null
  quoted_text: If a licensee presents a form of payment to the commission, or to any third party on
    the commission’s behalf, which is declined or rejected by a financial institution or merchant
    service company, the licensee shall have 30 days, upon electronic notification from the
    commission, to submit full and valid payment for the initial fee or fine and an additional fee
    for submitting the faulty payment, not to exceed the maximum amount allowed by Section 8-8-15.
