stem: Under Ala. Code § 34-27-39(e), what must a licensee include in an advertisement that
  identifies them as part of a real estate team?
options:
  - Including the term “team” or “group” in the team name
  - Including the property address in the advertisement
  - Including the licensee’s personal phone number in the advertisement
