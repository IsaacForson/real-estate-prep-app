stem: A buyer sues a licensee after discovering that information the licensee repeated from the
  seller turned out to be false. The licensee had no reason to doubt the seller's statement. Under
  the liability statute, what result follows?
options:
  - The licensee is automatically liable for repeating any false statement from a client.
  - The licensee is not liable because he had no reason to know it was false.
  - The licensee is liable because a licensee must independently verify all client statements.
  - The licensee is liable only if the buyer signed a written agency agreement.
key: B
explanation: The statute states a licensee shall not be liable for providing false information
  supplied by a client, customer, or other licensee unless the licensee knows or should have known
  the information was false, which shields a licensee who had no reason to doubt the source.
citation:
  source: Ala. Code § 34-27-86
  url: null
  quoted_text: A licensee shall not be liable for providing false information to a party in a real
    estate transaction if the false information was provided to the licensee by a client of the
    licensee or by a customer or by another licensee unless the licensee knows or should have known
    that the information was false.
