stem: According to Alabama law, what is a 'material fact' in a real estate transaction?
options:
  - A fact that is of significance to a reasonable party which affects the party’s decision to enter
    into a real estate contract.
  - Any fact known to the broker that could influence the price or terms of a real estate
    transaction.
  - A detail about the property that must be disclosed only if it affects the buyer’s ability to
    obtain financing.
  - Information that is considered trivial unless the seller elects to reveal it during negotiations.
key: A
explanation: The definition of material fact in Ala. Code § 34-27-81(11) states it is a fact
  significant to a reasonable party that affects the decision to enter into a contract. The option
  stating that a material fact is any fact known to the broker that could influence the price or
  terms of a real estate transaction is incorrect because it limits the fact to what the broker
  knows and to price or terms, which is narrower than the statutory definition.
