stem: "According to Ala. Code § 34-27-81, a transaction facilitator is best described as:"
options:
  - A licensee who represents both the buyer and seller in a transaction only after obtaining
    informed written consent from all parties involved.
  - A licensee who represents only one party in a real estate transaction and owes fiduciary duties
    solely to that party.
  - A licensee who assists one or more parties in a contemplated real estate transaction without
    being an agent or fiduciary or advocate for the interest of that party to a transaction.
  - A licensee who must provide written disclosure of available brokerage services before discussing
    any confidential information with a consumer.
key: C
explanation: Ala. Code § 34-27-81(15) defines a transaction facilitator as a licensee who assists
  parties in a transaction without acting as an agent, fiduciary, or advocate for any specific
  party. The option describing a licensee who assists without being an agent, fiduciary, or advocate
  matches this statutory definition. The option describing a licensee who represents both parties
  with consent describes a dual agent. The option describing a licensee who represents only one
  party describes a single agent. The option describing a requirement to provide written disclosure
  before discussing confidential information describes a different regulatory duty, not the
  definition of a transaction facilitator.
