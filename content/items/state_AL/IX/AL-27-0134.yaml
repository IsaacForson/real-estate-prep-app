  quoted_text: (15) TRANSACTION FACILITATOR. A licensee who assists one or more parties in a
    contemplated real estate transaction without being an agent or fiduciary or advocate for the
    interest of that party to a transaction. The term has the same meaning as “Transaction Broker”
    provided in Act 98-618.
