stem: A licensee meets a consumer at a coffee shop and discusses general market trends, then later
  shows a property to the consumer. When must the licensee provide the Real Estate Brokerage
  Services Disclosure form to the consumer?
options:
  - The licensee must provide the disclosure form after the consumer signs a brokerage agreement.
  - The licensee must provide the disclosure form when the consumer requests it.
  - The licensee must provide the disclosure form after the consumer has viewed the property.
  - The licensee must provide the disclosure form before the consumer views the property.
key: D
explanation: Under Ala. Code § 34-27-82(c), the disclosure must occur prior to providing any
  brokerage service, which includes showing a property to a prospective buyer. Therefore, the form
  must be given before the showing. The licensee must provide the disclosure form after the consumer
  has viewed the property is incorrect because disclosure is required before any brokerage service,
  which precedes signing a brokerage agreement.
citation:
