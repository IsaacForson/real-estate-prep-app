stem: Under what circumstance may a licensee disclose confidential information obtained from a client?
options:
  - When the licensee believes the information is helpful
  - When the qualifying broker requests the information
  - When the information becomes public knowledge
  - When the licensee considers the information immaterial
key: C
explanation: The confidentiality obligation permits disclosure when the information becomes public
  knowledge, as stated in the exceptions to the duty to keep information confidential. The other
  options are not listed as lawful exceptions under the rule.
