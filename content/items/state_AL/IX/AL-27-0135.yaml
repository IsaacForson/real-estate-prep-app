stem: Under Ala. Code § 34-27-81, what is a transaction facilitator?
options:
  - A licensee who assists one or more parties in a contemplated real estate transaction without
    being an agent or fiduciary or advocate for the interest of that party to a transaction.
  - A licensee who is any person licensed as a real estate broker pursuant to Articles 1 and 2 of
    this chapter.
  - A licensee who is engaged by and represents through an agency agreement a single party in a real
    estate transaction.
  - A licensee who, with the informed written consent of both parties to a transaction, represents
    both the seller and the buyer in the same real estate transaction.
key: A
explanation: "The statutory definition of a transaction facilitator under Ala. Code § 34-27-81(15)
  is a licensee who assists one or more parties in a contemplated real estate transaction without
  being an agent, fiduciary, or advocate for any party’s interest. This matches the description of a
  licensee who assists one or more parties ... without being an agent or fiduciary or advocate for
  the interest of that party to a transaction. The other options describe different roles: a
  licensee who is any person licensed as a real estate broker (which is a broader category), a
  licensee who represents a single party through an agency agreement (single agent), and a licensee
  who, with informed written consent, represents both seller and buyer in the same transaction (dual
  agent). None of these fit the definition of a transaction facilitator."
