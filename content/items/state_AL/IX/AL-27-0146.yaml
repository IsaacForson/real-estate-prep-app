stem: Under RECAD, what must a qualifying broker include in the agency disclosure office policy for
  single agency services?
options:
  - A copy of the sales contract form containing agency disclosure
  - A copy of the agency agreement form(s) for single agency
  - A copy of the dual agency agreement form(s) used in transactions
  - A copy of the transaction facilitator agreement form(s) for clients
key: B
explanation: The rule states that all qualifying brokers who offer single agency shall include a
  copy of their agency agreement form(s) in their office policy. The sales contract form is required
  elsewhere but not for the single agency disclosure.
