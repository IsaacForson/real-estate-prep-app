stem: A licensee wishes to represent both the buyer and the seller in the same transaction as a dual
  agent. What must the licensee obtain before proceeding?
options:
  - Verbal consent from the buyer only
  - Written informed consent of both parties
  - Disclosure to the qualifying broker only
  - Signed agency agreement with the seller only
key: B
explanation: The rule states that a licensee may provide brokerage services as a dual agent only
  with the prior written, informed consent of all clients in the transaction. Thus, written informed
  consent of both the buyer and seller is required. Verbal consent or consent from only one party
  does not satisfy the requirement.
