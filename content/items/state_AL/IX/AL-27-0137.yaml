stem: Under Ala. Code § 34-27-82(d), is a licensee required to provide the Real Estate Brokerage
  Services Disclosure form when assisting a limited liability company in purchasing real estate?
options:
  - The licensee is required to provide the disclosure form to the consumer for any real estate
    transaction.
  - The licensee is not required to provide the disclosure form when the consumer is a limited
    liability company.
  - The licensee is required to provide the disclosure form when the limited liability company has a
    single member.
  - The licensee is not required to provide the disclosure form for transactions involving
    residential property.
key: B
explanation: Ala. Code § 34‑27‑82(d) exempts a licensee from the disclosure‑form requirement when
  the transaction involves a corporation, limited liability company, partnership, trust, or
  governmental entity. Consequently, the licensee does not have to give the Real Estate Brokerage
  Services Disclosure form when the buyer is an LLC. The statement that the form must be provided
  for any real‑estate transaction is incorrect because the statute provides this exemption. The
  statement that the form is required when the LLC has a single member is also incorrect; the
  exemption applies regardless of the number of members. The statement that the form is not required
  only for residential‑property transactions is wrong because the exemption is not limited to
  residential property.
citation:
  source: Ala. Code § 34-27-82(d)
  url: null
  quoted_text: A licensee shall not be required to comply with the provisions of subsection (c) when
    engaged in transactions with any corporation, nonprofit corporation, professional corporation,
    professional association, limited liability company, partnership, any partnership created under
    the Alabama Partnership Law, Chapter 8A of Title 10A, real estate investment trust, business
    trust, charitable trust, family trust, or any governmental entity in transactions involving real
    estate.
