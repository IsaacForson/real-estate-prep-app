    34-27-82(c)"
  url: null
  quoted_text: The disclosure must occur at least prior to a licensee providing any brokerage service,
    which includes a licensee showing a property as to a prospective buyer but does not include a
    seller’s agent conducting an open house as to prospective buyers.
