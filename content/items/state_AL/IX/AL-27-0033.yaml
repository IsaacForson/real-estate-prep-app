stem: A licensee shows a property to a prospective buyer before providing the written brokerage
  services disclosure form. Under Alabama law, is this permissible?
options:
  - Permissible, because showing a property is not considered a brokerage service under the
    disclosure rule.
  - Permissible, as long as the licensee obtains verbal consent from the buyer before the showing.
  - Not permissible, because showing a property is a brokerage service and disclosure must occur
    before any such service.
  - Not permissible, only if the licensee is acting as a seller’s agent conducting an open house.
key: C
explanation: Ala. Code § 34-27-82(c) requires the disclosure to occur prior to providing any
  brokerage service, which includes showing a property to a prospective buyer. Therefore showing
  without prior disclosure is not allowed. The claim that showing a property is not a brokerage
  service is incorrect because showing a property is expressly included as a brokerage service.
