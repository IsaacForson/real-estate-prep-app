stem: According to Ala. Code § 34-27-81, which of the following best defines a single agent?
options:
  - A licensee who, with the informed written consent of all parties, represents both the seller and
    the buyer in the same transaction
  - A licensee who provides brokerage services to a consumer but is not a client of the broker
  - A licensee who is engaged by and represents through an agency agreement only one party in a real
    estate transaction
  - A licensee who assists one or more parties in a contemplated real estate transaction without
    being an agent or fiduciary for any party
key: C
explanation: Section 34‑27‑81(14) defines a single agent as a licensee who is engaged by and
  represents, through an agency agreement, only one party in a real‑estate transaction. A licensee
  who, with the informed written consent of all parties, represents both the seller and the buyer is
  a dual agent. A licensee who provides brokerage services to a consumer but is not a client of the
  broker is a transaction facilitator. A licensee who assists parties without being an agent or
  fiduciary is a customer.
