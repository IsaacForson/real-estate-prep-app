stem: According to Ala. Admin. Code § 790-X-3-.14, how often must a qualifying broker explain the
  agency disclosure office policy to all licensees?
options:
  - The qualifying broker must explain the policy once every six months.
  - The qualifying broker must explain the policy at least once a year.
  - The qualifying broker must explain the policy only when a licensee requests it.
  - The qualifying broker must explain the policy only upon initial hiring.
key: B
explanation: The rule states that the qualifying broker shall explain the agency disclosure office
  policy to all licensees at least once a year. This makes the annual explanation the correct
  frequency. The other options suggest intervals not supported by the rule.
