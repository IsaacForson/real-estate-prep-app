    34-27-81(8)"
  url: null
  quoted_text: DUAL AGENCY. An agency relationship in which a licensee, with the informed written
    consent of all parties to a transaction, represents both the seller and the buyer in the same
    real estate transaction once all parties have signed a consent agreement.
