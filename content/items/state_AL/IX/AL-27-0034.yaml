stem: A licensee wishes to represent both the buyer and the seller in the same transaction without
  obtaining written consent from the parties. According to Alabama law, is this allowed?
options:
  - Allowed, if the licensee obtains written consent from either the buyer or the seller only.
  - Not allowed, unless the licensee is also the qualifying broker for both parties.
  - Not allowed, because dual agency requires the informed written consent of all parties to the
    transaction.
  - Allowed, as long as the licensee informs both parties verbally before the transaction begins.
key: C
explanation: Ala. Code § 34-27-81(8) defines dual agency as requiring the informed written consent
  of all parties to the transaction. Acting without such consent violates the statute. Stating that
  verbal consent is sufficient is incorrect because the law requires informed written consent.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
