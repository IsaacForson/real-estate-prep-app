stem: A broker licensed in Alabama whose principal business is real estate broker supervises
  salespersons only 20 hours per week. Under Alabama law, may this broker serve as qualifying broker
  for a salesperson?
options:
  - Under Alabama law, the broker may serve as qualifying broker because the licensing and principal
    business requirements are satisfied.
  - Under Alabama law, the broker may serve as qualifying broker because part-time supervision meets
    the full-time supervision requirement.
  - Under Alabama law, the broker may not serve as qualifying broker because the full-time
    supervision requirement is not met.
  - Under Alabama law, the broker may not serve as qualifying broker because a company license is
    also required.
key: C
explanation: The statute requires a qualifying broker to be in a position to actually supervise the
  real estate activities of associate brokers or salespersons on a full‑time basis. Supervising only
  20 hours per week fails this requirement, so the broker cannot serve. The distractor claiming
  part‑time supervision satisfies the requirement is incorrect because the rule explicitly demands
  full‑time supervision.
citation:
