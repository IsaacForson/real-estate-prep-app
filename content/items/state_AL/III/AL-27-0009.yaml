stem: Under Alabama law, what is the fee for a salesperson or associate broker to change their
  qualifying broker?
options:
  - Twenty-five dollars ($25)
  - Fifty dollars ($50)
  - Seventy-five dollars ($75)
  - One hundred fifty dollars ($150)
key: A
explanation: The statute specifies that a fee of twenty-five dollars ($25) must be paid for a change
  of qualifying broker, after which a new license certificate is issued for the unexpired term of
  the original license. This amount applies uniformly to all listed license changes, including
  changes of qualifying broker, personal name, business location, business name, and status from
  inactive to active. The other dollar amounts correspond to different fees or penalties elsewhere
  in the code.
