stem: A sole proprietorship wishes to change its qualifying broker. What must the sole
  proprietorship do to effect the change under Alabama law?
options:
  - Paying a $25 fee and filing a request for transfer with the commission while assuming liability
    for the licensee.
  - Paying a $25 fee and notifying the salesperson in writing and sending the license certificate to
    the commission.
  - Paying a $25 fee and completing fifteen clock hours of continuing education before the change.
  - Paying a $25 fee and submitting a petition to the circuit court for approval.
key: A
explanation: The law requires the new qualifying broker to file a transfer request and assume
  liability, and upon paying the $25 fee a new license certificate is issued for the unexpired term.
citation:
  source: Ala. Code § 34-27-34(b)
  url: null
  quoted_text: The new qualifying broker shall file with the commission a request for the transfer and
    a statement assuming liability for the licensee. On payment of a fee of twenty-five dollars
    ($25), a new license certificate shall be issued to the salesperson or associate broker for the
    unexpired term of the original license.
