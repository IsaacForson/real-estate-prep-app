stem: A salesperson has successfully changed their qualifying broker. What must the new qualifying
  broker do to complete the transfer?
options:
  - File a request for the transfer and a statement assuming liability with the commission.
  - Pay a twenty‑five dollar fee to the Alabama Real Estate Commission for the license change.
  - Complete fifteen clock hours of approved continuing education coursework for license renewal.
  - Submit a written notice to the commission and send a copy to the current qualifying broker.
key: A
explanation: The new qualifying broker must file a request for the transfer and a statement assuming
  liability with the commission, per Ala. Code § 34-27-34(b). The distractor about paying a
  twenty‑five dollar fee refers to the fee that accompanies the transfer but is not the action that
  completes it.
