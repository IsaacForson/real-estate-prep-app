stem: Under Alabama law, what three conditions must a person meet to serve as a qualifying broker
  for a salesperson or associate broker?
options:
  - The person must be licensed in Alabama, have their principal business as real estate broker, and
    be a resident of the state for at least five years.
  - The person must be licensed in Alabama, have their principal business as real estate broker, and
    be able to supervise licensees full‑time.
  - The person must be licensed in Alabama, have their principal business as real estate broker, and
    have completed 15 clock hours of continuing education.
  - The person must be licensed in Alabama, have their principal business as real estate broker, and
    be employed by the commission.
key: B
explanation: The statute states that a broker may serve as qualifying broker only if licensed in
  Alabama, his or her principal business is that of a real estate broker, and he or she shall be in
  a position to actually supervise the real estate activities of the associate broker or salesperson
  on a full‑time basis. The other options add requirements not found in the law.
citation:
