  url: null
  quoted_text: (a)(1) A broker may serve as qualifying broker for a salesperson or associate broker
    only if licensed in Alabama, his or her principal business is that of a real estate broker, and
    he or she shall be in a position to actually supervise the real estate activities of the
    associate broker or salesperson on a full-time basis.
