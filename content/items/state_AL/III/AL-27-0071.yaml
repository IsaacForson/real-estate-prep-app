stem: A qualifying broker wishes to terminate his or her status as qualifying broker for a real
  estate company. What must the qualifying broker do under Alabama law?
options:
  - Submit written notice to the qualifying broker of the parent company only, and email it to the
    attorney.
  - Submit written notice to the commission only, and file it with the real estate association.
  - Submit written notice to the company only, and retain a copy for personal records, and keep a
    duplicate for the broker's file.
  - Submit written notice to the company or the qualifying broker of the parent company, and to the
    commission.
key: D
explanation: The statute allows termination of qualifying broker status for a company by submitting
  written notice to the company or the qualifying broker of the parent company and to the
  commission. The other options either omit required parties or add unnecessary steps.
citation:
  source: Ala. Code § 34-27-34(d)
  url: null
  quoted_text: A person who wishes to terminate his or her status as a qualifying broker for a company
    may do so by submitting written notice to the company or qualifying broker of the parent company
    and the commission.
