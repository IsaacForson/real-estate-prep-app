stem: A qualifying broker decides they no longer wish to serve as the qualifying broker for a
  particular salesperson. Which action must the qualifying broker take to terminate that status
  under Alabama law?
options:
  - Simply inform the salesperson verbally and update the Commission’s online portal within ten days
  - Notify the salesperson and Commission in writing, then send the license certificate or confirm
    it is lost or destroyed
  - Pay a twenty‑five dollar fee to the Commission and submit a new license application for the
    salesperson
  - File a formal petition with the circuit court and await a judge’s order before notifying the
    salesperson
key: D
explanation: To terminate qualifying broker status for a licensee, the broker must notify both the
  licensee and the commission in writing and either send the licensee’s license certificate to the
  commission or verify in writing that the certificate has been lost or destroyed. Verbal notice,
  court petitions, or fee payments alone do not satisfy the statutory requirement. The correct
  procedure ensures proper record‑keeping and accountability.
