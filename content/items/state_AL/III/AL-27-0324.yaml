stem: Under Ala. Code § 34-27-35(a), where must an active salesperson's license certificate be
  publicly displayed?
options:
  - At the Alabama Real Estate Commission office
  - At the licensee's home address on record
  - At the address shown on the license certificate
  - At the qualifying broker's main office location
key: C
explanation: The rule states that each license certificate shall be kept by the qualifying broker
  and shall be publicly displayed at the address which appears on the license certificate.
  Displaying it at the broker's office or elsewhere does not satisfy this requirement.
