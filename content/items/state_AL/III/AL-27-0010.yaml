stem: A salesperson whose license has been inactive for eighteen months wishes to return to active
  practice. What must the salesperson complete before the license can be activated for the first
  time in the license period?
options:
  - Fifteen clock hours of approved continuing education coursework
  - Thirty clock hours of approved continuing education coursework
  - Forty-five clock hours of approved continuing education coursework
  - Zero clock hours of approved continuing education coursework
key: A
explanation: To activate an inactive license for the first time in a license period, the licensee
  must complete fifteen clock hours of approved continuing education coursework. This requirement is
  distinct from the additional fifteen hours needed to renew the license on active status for the
  next period. The other hour amounts either exceed the requirement or incorrectly suggest no
  education is needed.
