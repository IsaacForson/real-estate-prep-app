stem: A qualifying broker in Alabama holds both an individual broker license and a company license
  as the qualifying broker for that company. If the broker legally changes their personal name, what
  total fee must they pay to update the name on both licenses under Alabama law?
options:
  - $75.00
  - $0.00
  - $25.00
  - $50.00
key: D
explanation: The fee for a change of personal name of a qualifying broker is $25 for each license on
  which the name appears. Because the broker holds two licenses (an individual broker license and a
  company license), the total fee is 2 × $25 = $50. The $25 distractor only accounts for one license
  and ignores the company license where the name also appears.
citation:
  source: Ala. Code § 34-27-34(b)(2)
  url: null
  quoted_text: "A fee of twenty-five dollars ($25) shall also be charged for any of the following
    license changes:"
