stem: A salesperson wishes to change their qualifying broker. What is the first step the salesperson
  must take under Alabama law?
options:
  - Submit a written notice to the commission and send a copy to the current qualifying broker.
  - Pay a twenty‑five dollar fee to the Alabama Real Estate Commission for the license change.
  - Complete fifteen clock hours of approved continuing education coursework for license renewal.
  - File a formal petition with the circuit court and await a judge’s order before proceeding.
key: A
explanation: The licensee must give written notice to the commission and send a copy to the current
  qualifying broker, as required by Ala. Code § 34-27-34(b). The distractor about paying a
  twenty‑five dollar fee describes the fee for the license change, which is a separate step after
  the notice is given.
