stem: A licensee changes their business address and calls the commission to inform them 15 days
  after the move. According to Ala. Code § 34-27-35(h), what is missing for the notification to be
  valid?
options:
  - The notification must be in writing.
  - The notification must be approved by the qualifying broker.
  - The notification must be sent via certified mail.
  - The notification must include a fee of twenty‑five dollars.
key: A
explanation: The statute requires the notice to be in writing; a telephone call is oral and does not
  meet this requirement. Certified mail, a fee, or qualifying‑broker approval are not mentioned in
  the rule, so they are not necessary for validity.
