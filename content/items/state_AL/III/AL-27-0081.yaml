stem: A salesperson changes their business name. What must the salesperson do to obtain a new
  license certificate under Alabama law?
options:
  - Paying a $25 fee and requesting a new license certificate for the unexpired term.
  - Paying a $25 fee and notifying the commission and qualifying broker in writing.
  - Paying a $25 fee and completing fifteen clock hours of continuing education.
  - Paying a $25 fee and submitting written notice to the company or qualifying broker of the parent
    company.
