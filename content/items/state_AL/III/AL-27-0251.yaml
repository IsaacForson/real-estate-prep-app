stem: A salesperson licensed under a qualifying broker makes a misrepresentation that causes a buyer
  to suffer damages. Under Alabama law, who is responsible to the injured buyer for the damages
  caused by the salesperson's violation?
options:
  - The qualifying broker is responsible
  - The salesperson is responsible
  - Both parties are responsible
  - Neither party is responsible
key: C
explanation: Under Ala. Code § 34-27-34, the qualifying broker is liable for damages caused by any
  licensee's violation, and the licensee remains personally liable. Therefore both the broker and
  the salesperson are responsible.
citation:
  source: "Ala. Code § 34-27-1 et seq. — Code of Alabama Title 34, Chapter 27 - Real Estate Brokers
    (Arts. 1-4: License Law, Time-Sharing, RECAD) - Alabama Legislature (ALISON) current text — §
    34-27-34"
  url: null
  quoted_text: Additionally, the qualifying broker shall be responsible to an injured party for the
    damage caused by any violation of this chapter by any licensee engaged by the qualifying broker.
    This subsection does not relieve a licensee from liability that he or she would otherwise have.
