stem: A qualifying broker wishes to terminate their status as the qualifying broker for a real
  estate company. What action must they take under Alabama law?
options:
  - Submit written notice to the company or qualifying broker of the parent company and the
    commission.
  - Notify the licensee and send the license certificate to the commission or verify it is lost or
    destroyed.
  - Give notice in writing to the commission and send a copy to the current qualifying broker.
  - Pay a twenty‑five dollar fee to the Alabama Real Estate Commission for the license change.
key: A
explanation: To terminate status as qualifying broker for a company, the broker must submit written
  notice to the company or parent company’s qualifying broker and to the commission, as stated in
  Ala. Code § 34-27-34(d). The distractor about notifying the licensee and sending the license
  certificate applies only when ending a qualifying broker’s relationship with an individual
  licensee, not a company.
