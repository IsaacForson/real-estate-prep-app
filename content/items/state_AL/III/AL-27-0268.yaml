stem: A salesperson changes their business address and notifies the commission in writing 45 days
  after the move. According to Ala. Code § 34-27-35(h), what is the status of this notification?
options:
  - It satisfies the requirement because notice was eventually given.
  - It is untimely and does not meet the statutory requirement.
  - It is acceptable if the salesperson also pays a late fee.
  - It is acceptable if the salesperson also notifies their qualifying broker.
key: B
explanation: The rule mandates that notice be given within 30 days of the address change; a
  notification made after 45 days is untimely and fails to satisfy the requirement. Simply giving
  notice later, paying a late fee, or notifying the qualifying broker does not cure the defect
  because the statute does not provide for those alternatives.
citation:
  source: Ala. Code § 34-27-35(h)
  url: null
  quoted_text: Each licensee shall notify the commission in writing of any change in his or her
    business or residence address within 30 days of the change.
