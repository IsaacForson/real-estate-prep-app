stem: Under Alabama law, how many days does a licensee have to notify the commission in writing of a
  change in their business or residence address?
options:
  - Ten days after the change occurs.
  - Fifteen days after the change occurs.
  - Thirty days after the change occurs.
  - Sixty days after the change occurs.
key: C
explanation: The statute requires licensees to notify the commission in writing of any address
  change within 30 days of the change. This makes the thirty‑day period correct. The ten‑day and
  fifteen‑day options are too short, and the sixty‑day option exceeds the statutory limit.
citation:
