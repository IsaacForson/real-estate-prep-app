stem: Under Alabama law, what must occur before a salesperson can perform any act requiring a
  license after changing qualifying brokers?
options:
  - The salesperson must pay a $25 fee to the commission
  - The salesperson must file a written notice with the circuit court
  - The salesperson must receive a new active license from the commission
  - The salesperson must complete 15 clock hours of continuing education
key: C
explanation: The statute provides that a salesperson shall not perform any act for which a license
  is required after changing qualifying brokers until a new active license has been issued by the
  commission. The other options describe requirements that are not mandated for this situation.
citation:
  source: Ala. Code § 34-27-34(e)
  url: null
  quoted_text: A salesperson or associate broker shall not perform any act for which a license is
    required after his or her association with his or her qualifying broker has been terminated, or
    if he or she changes qualifying brokers, until a new active license has been issued by the
    commission.
