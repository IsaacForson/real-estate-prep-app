stem: According to Ala. Admin. Code § 790-X-3-.03, what must a real estate salesperson or associate
  broker do with trust funds received in their possession?
options:
  - The salesperson must pay over the funds to the qualifying broker immediately upon receipt.
  - The salesperson must deposit the funds into a federally insured account within three days.
  - The salesperson must hold the funds in a personal escrow account until closing.
  - The salesperson must remit the funds to the Alabama Real Estate Commission within 24 hours.
key: A
explanation: The rule requires that each salesperson or associate broker pay over to the qualifying
  broker all trust funds received immediately upon receipt. The other options describe actions not
  mandated by this subsection.
citation:
  source: Ala. Admin. Code ch. 790-X-1 to 790-X-5 — Alabama Administrative Code, Agency 790 - Alabama
