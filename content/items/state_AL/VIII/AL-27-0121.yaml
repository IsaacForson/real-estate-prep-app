stem: A salesperson receives an earnest money check from a buyer and gives it to the qualifying
  broker. Where must the broker deposit the funds?
options:
  - The broker must deposit the funds in the broker’s personal checking account.
  - The broker must deposit the funds in any bank account of the broker’s choosing.
  - The broker must deposit the funds in a separate federally insured account located in Alabama.
  - The broker must deposit the funds in an escrow account outside Alabama.
key: C
explanation: Ala. Code § 34-27-36(b)(8)(b) requires that earnest money funds be deposited in a
  separate federally insured account located in Alabama. The correct answer states that the broker
  must deposit the funds in a separate federally insured account located in Alabama. Depositing the
  funds in the broker’s personal checking account fails because the account must be separate from
  the broker’s personal funds. Depositing the funds in any bank account of the broker’s choosing
  fails because the account must be both separate and federally insured and situated in Alabama.
  Depositing the funds in an escrow account outside Alabama fails because the account must be
  located in Alabama.
