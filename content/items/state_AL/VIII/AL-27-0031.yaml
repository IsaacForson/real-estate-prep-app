stem: A qualifying broker has held trust funds for a completed sale. According to Ala. Admin. Code §
  790-X-3-.03, within how many business days must the broker disburse the funds after the
  transaction is consummated?
options:
  - The qualifying broker must disburse the funds within 3 business days of consummation.
  - The qualifying broker must disburse the funds within 10 business days of consummation.
  - The qualifying broker must disburse the funds within 7 business days of consummation.
  - The qualifying broker must disburse the funds within 15 business days of consummation.
key: C
explanation: The rule requires prompt disbursement of trust funds within 7 business days of the
  consummation of the transaction. The other options propose incorrect timeframes.
citation:
  source: Ala. Admin. Code ch. 790-X-1 to 790-X-5 — Alabama Administrative Code, Agency 790 - Alabama
    Real Estate Commission (Chapters 790-X-1 through 790-X-5) - Legislative Services Agency current
    text — § 790-X-3-.03
  url: null
  quoted_text: Unless otherwise stated in this rule, each qualifying broker shall promptly disburse to
    the appropriate party or parties any trust funds within 7 business days of the consummation of
    the transaction for which the funds were deposited.
