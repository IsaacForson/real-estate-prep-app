stem: According to Ala. Admin. Code § 790-X-3-.03, what must be true of the qualifying broker
  concerning the financial institution that holds trust account funds?
options:
  - The qualifying broker must be a customer of the institution and have authority to deposit,
    withdraw, and write checks
  - The qualifying broker must maintain a separate non‑interest‑bearing account for each client
  - The qualifying broker must obtain written consent from the Alabama Real Estate Commission before
    opening the account
  - The qualifying broker must submit monthly statements to the Commission for all trust accounts
key: A
explanation: Ala. Admin. Code § 790‑X‑3‑.03 requires the qualifying broker to be a customer of the
  financial institution that holds the trust accounts and to be one of the persons authorized to
  deposit, withdraw, and write checks on those accounts. The rule does not require a separate
  non‑interest‑bearing account for each client, does not require written consent from the Commission
  before opening the account, and does not mandate monthly statements to the Commission.
