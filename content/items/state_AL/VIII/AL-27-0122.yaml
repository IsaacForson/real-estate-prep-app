stem: A qualifying broker deposits earnest money received from a buyer into the broker’s personal
  business account. What violation has occurred?
options:
  - Commingling of trust funds with personal funds.
  - Failure to disclose latent structural defects.
  - Failure to remit funds within a reasonable time.
  - Failure to provide a copy of the listing to the buyer.
key: A
explanation: "Ala. Code § 34-27-36(b)(8)(a) prohibits commingling trust funds with personal funds.
  By depositing the buyer’s earnest money into his personal business account, the broker commingled
  trust funds with his own funds, which is a violation. The other options describe different
  violations: failing to disclose latent structural defects, failing to remit funds within a
  reasonable time, and failing to provide a copy of the listing to the buyer."
