stem: A licensee's check for a fine is returned for insufficient funds. The commission sends
  electronic notification, but the licensee does not submit a valid payment within 35 days. What is
  the status of the license under Ala. Code § 34-27-36(g)?
options:
  - License is automatically renewed.
  - License is suspended for 6 months.
  - License is revoked immediately.
  - License remains inactive until paid.
key: D
explanation: Section 34-27-36(g) states that failure to submit full and valid payment within 30 days
  of electronic notification results in the license becoming inactive until full payment is
  submitted. After 35 days with no payment, the license remains inactive. The distractor suggesting
  immediate revocation is incorrect because revocation requires a formal complaint, hearing, and
  commission action, not automatic for late payment.
