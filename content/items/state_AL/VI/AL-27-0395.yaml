stem: Under Ala. Code § 34-27-38(a), what must a party appealing a commission’s final order post
  with the clerk of the circuit court?
options:
  - The party must post a $100 appeal bond with the clerk of the circuit court
  - The party must post a $200 appeal bond with the clerk of the circuit court
  - The party must post a $500 appeal bond with the clerk of the circuit court
  - The party is not required to post an appeal bond with the clerk of the circuit court
key: B
explanation: The statute requires that a party appealing a decision post a $200 appeal bond with the
  clerk of the circuit court. This bond is a prerequisite for the appeal to be considered. The other
  amounts listed are not specified in the rule. Therefore, the correct answer is the $200 appeal
  bond.
