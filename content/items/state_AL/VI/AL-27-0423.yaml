stem: If the Alabama Real Estate Commission issues a final order on March 1, 2025, by what date must
  a licensee file a notice of appeal to preserve the right to appeal?
options:
  - April 1, 2025
  - March 30, 2025
  - April 2, 2025
  - March 31, 2025
key: D
explanation: Under Ala. Code § 34-27-38, a notice of appeal must be filed within 30 days after the
  commission’s final order. Starting from March 1, 2025, the 30‑day period ends on March 31, 2025.
  Therefore, March 31, 2025 is the correct deadline. March 30, 2025 falls one day short; April 1,
  2025 and April 2, 2025 exceed the allowed period.
