stem: A licensee keeps trust account records for only two years before destroying them. Which
  prohibited conduct does this constitute under Ala. Code § 34-27-36?
options:
  - Failing to keep money belonging to others separate from personal funds
  - Failing to deposit funds in a separate federally insured account
  - Failing to furnish a copy of the listing agreement to the buyer
  - Failing to keep trust account records for at least three years
key: D
explanation: Subsection (b)(8)(c) prohibits failing to keep for at least three years a complete
  record of funds belonging to others. Keeping records for only two years violates this specific
  provision. The other options describe violations of different subsections (a) and (b) of paragraph
  (8) or paragraph (10).
