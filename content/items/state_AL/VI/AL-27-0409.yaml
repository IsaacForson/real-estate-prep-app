stem: A licensee repeatedly publishes false advertisements that likely deceive the public. After an
  investigation, the Alabama Real Estate Commission finds probable cause. What action may the
  commission take under Ala. Code § 34-27-36(c) to stop the ongoing violation?
options:
  - The commission may issue a public reprimand.
  - The commission may require the licensee to complete additional education.
  - The commission may seek an injunction to enjoin the act or practice.
  - The commission may revoke the license immediately.
key: C
explanation: Section 34-27-36(c) authorizes the commission, through the Attorney General, to
  institute legal actions to enjoin the act or practice and enforce compliance. Seeking an
  injunction directly stops the ongoing violation, whereas education or reprimand are penalties that
  do not immediately halt the conduct. Revocation requires a hearing and is not the immediate remedy
  for ongoing false advertising.
