stem: A licensee receives electronic notification from the commission on March 1 that a payment for
  a fine was declined. The licensee does not submit full and valid payment until September 2. What
  is the status of the license under Ala. Code § 34-27-36(g)?
options:
  - The license becomes inactive until the payment is made.
  - The license lapses because payment was not submitted within six months.
  - The license remains active because payment was eventually made.
  - The license is revoked immediately for failing to pay.
key: B
explanation: Failure to submit payment within six months after electronic notification results in
  the license lapsing. Since payment was made after six months, the license lapses. The distractor
  "The license becomes inactive until the payment is made" applies only if payment is late but
  within the 30‑day period.
