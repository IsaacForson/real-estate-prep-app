stem: A licensee prepares a purchase agreement for a buyer but does not give the buyer a copy until
  after closing. Which violation does this constitute under Ala. Code § 34-27-36?
options:
  - Failing to disclose a known latent structural defect affecting the property to the buyer
  - Failing to furnish a copy of the purchase agreement to the buyer with reasonable promptness
  - Failing to deposit earnest money in a separate federally insured account in Alabama
  - Failing to retain transaction records including contracts and closings for at least three years
key: B
explanation: The statute requires licensees to voluntarily furnish a copy of each contract to each
  party executing the document with reasonable promptness; delaying delivery until after closing
  breaches this duty. The latent defect disclosure option, while also a violation, addresses a
  different statutory subsection and does not match the described failure to provide the contract
  copy.
