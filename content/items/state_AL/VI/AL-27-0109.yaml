stem: Under Ala. Code § 34-27-36(a)(1), what must the commission do if probable cause is found?
options:
  - The commission shall require the licensee to complete continuing education
  - The commission shall file a formal complaint and hold a hearing
  - The commission shall impose a fine of up to $5,000
  - The commission shall issue a cease and desist order
key: B
explanation: The subsection states that if probable cause is found, a formal complaint shall be
  filed and the commission shall hold a hearing on the formal complaint. Imposing a fine or
  requiring education may occur after a hearing, but is not required upon a finding of probable
  cause.
