stem: A licensee shows a home to a prospective buyer and knows that the basement has a significant
  crack in the foundation but does not inform the buyer. Which prohibited conduct does this
  constitute under Ala. Code § 34-27-36?
options:
  - Making a material misrepresentation or failing to disclose to a potential purchaser or lessee
    any latent structural defect or any other defect known to the licensee.
  - Making a material misrepresentation or failing to disclose to a potential purchaser or lessee
    any trivial or insignificant defect known to the licensee.
  - Making a material misrepresentation or failing to disclose to a potential purchaser or lessee
    any pending zoning change that could affect property value.
  - Making a material misrepresentation or failing to disclose to a potential purchaser or lessee
    any upcoming special assessment levied by the municipality.
key: A
explanation: The licensee’s failure to disclose a known latent structural defect violates the
  prohibition against making a material misrepresentation or failing to disclose such defects to a
  potential purchaser. The distractor about trivial or insignificant defects is incorrect because
  the statute specifies that latent defects are those that would be a significant factor to a
  reasonable person, not minor issues.
