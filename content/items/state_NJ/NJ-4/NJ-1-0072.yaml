stem: Under New Jersey Statutes, what is the limitation period for filing a civil action that may
  result in a court order for payment from the real estate guaranty fund?
options:
  - Three years
  - Two years
  - Six years
  - Four years
key: C
explanation: The statute states that any civil action which may result in a court order for payment
  from the real estate guaranty fund shall be instituted within six years of the accrual of the
  cause of action. Therefore, the six‑year period is correct. The three‑year option is a common
  misstatement of the limitation period for other types of actions.
