stem: After the New Jersey Real Estate Commission delivers a certified copy of a court order for
  payment from the guaranty fund to the State Treasurer together with an assignment of the judgment
  creditor's interest in the judgment, what must the State Treasurer do?
options:
  - Make payment to the claimant from the real estate guaranty fund.
  - Return the certified order to the commission for additional verification.
  - Require the claimant to first exhaust all other remedies.
  - Hold the payment pending approval from the Attorney General.
key: A
explanation: The statute provides that upon delivery by the Commission to the State Treasurer of a
  certified copy of the court order together with an assignment of the judgment creditor's right,
  title and interest in the judgment to the extent of the amount of the court order, the State
  Treasurer shall make payment to the claimant from the real estate guaranty fund. Therefore, the
  Treasurer must make the payment. Holding funds or requiring exhaustion of remedies is not
  authorized by this provision.
