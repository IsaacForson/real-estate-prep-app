stem: A developer offers a prospective purchaser a free weekend stay at the timeshare property and a
  discounted golf package. The aggregate good‑faith value of these incidental benefits is $1,500,
  and the purchaser paid $8,000 for the timeshare interest. Under the New Jersey Real Estate
  Timeshare Act, is this permissible?
options:
  - Yes, because the incidental benefits are voluntary and disclosed.
  - No, because the incidental benefits exceed 20 percent of the purchase price.
  - Yes, because the developer may offer any incidental benefits as long as they are not exchange
    programs.
  - No, because free use of accommodations is prohibited as an incidental benefit.
key: D
explanation: The statute states that an incidental benefit does not include an offer of the use of
  the accommodations on a free or discounted one‑time basis. Offering a free weekend stay violates
  this prohibition regardless of the 20 % value limit. The distractor focusing on the percentage
  overlooks the separate ban on free accommodations.
