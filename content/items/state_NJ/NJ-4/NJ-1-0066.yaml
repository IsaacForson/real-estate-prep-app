stem: A real estate broker refuses to hire a salesperson because the applicant is homosexual.
  According to the New Jersey Law Against Discrimination, is this action lawful?
options:
  - A. Lawful, because sexual orientation is not a protected class under the law.
  - B. Unlawful, because affectional or sexual orientation is a protected class under the law.
  - C. Lawful, if the broker can prove the applicant lacks required experience.
  - D. Unlawful only if the broker also makes disparaging remarks about the applicant's religion.
key: B
explanation: The Law Against Discrimination lists affectional or sexual orientation as a protected
  characteristic, so refusing to hire someone because of homosexuality is an unlawful employment
  practice. The claim that sexual orientation is not a protected class is incorrect. The suggestions
  that the action could be lawful based on the applicant's experience or only unlawful if the broker
  also makes disparaging remarks about religion introduce irrelevant conditions that do not change
  the unlawful nature of the discrimination.
