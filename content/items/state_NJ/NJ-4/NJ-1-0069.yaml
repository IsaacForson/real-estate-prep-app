stem: A consumer discovers that a broker embezzled funds from a closing that occurred on March 15,
  2021. By what date must they file a civil action to seek payment from the real estate guaranty
  fund?
options:
  - March 15, 2026
  - March 15, 2027
  - March 15, 2028
  - March 15, 2029
key: B
explanation: Under the guaranty fund statute, a civil action for payment must be instituted within
  six years of the accrual of the cause of action. Six years after March 15, 2021 is March 15, 2027,
  making that the correct deadline. March 15, 2026 is only five years later, which is too soon,
  while March 15, 2028 exceeds the six-year limit.
