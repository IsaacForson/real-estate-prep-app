    Disclosure Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official
    full-text statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive
    capture of 2025-08-08 — § 15-38"
  url: null
  quoted_text: Any civil action which may result in a court order for payment from the real estate
    guaranty fund shall be instituted within six years of the accrual of the cause of action
