stem: Under the New Jersey Real Estate Timeshare Act, which of the following best defines the term
  "Accommodation"?
options:
  - Any apartment, condominium or cooperative unit, cabin, lodge, hotel or motel room, or other
    private or commercial structure containing toilet facilities therein that is designed and
    available, pursuant to applicable law, for use and occupancy as a residence by one or more
    individuals which is a part of the timeshare property.
  - The share of funds required for the payment of common expenses, including casualty and liability
    insurance and maintenance costs, which is assessed from time to time against each timeshare
    interest by the association, and is used to fund the reserve account for future repairs.
  - The organized body consisting of the purchasers of interests in a timeshare property that
    manages the common elements, enforces the timeshare instrument, and oversees the collection of
    assessments, but does not define the physical unit itself.
  - Any written, oral or electronic communication that is directed to or targeted to persons within
    the State and contains a promotion, inducement or offer to sell a timeshare plan, including
    brochures, pamphlets, radio and television scripts, electronic media, telephone and direct mail
    solicitations.
key: A
explanation: The statute defines “Accommodation” as a residential unit such as an apartment,
  condominium, cooperative unit, cabin, lodge, hotel or motel room, or other structure with toilet
  facilities that is designed and available for occupancy as a residence and is part of the
  timeshare property. The other answer choices describe a solicitation communication, the
  association of owners, and the assessment of common expenses, which are separate definitions in
  the same act.
