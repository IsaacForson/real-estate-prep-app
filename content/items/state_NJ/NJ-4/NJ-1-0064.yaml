stem: Which of the following constitutes "Advertising" under the New Jersey Real Estate Sales Full
  Disclosure Act?
options:
  - A. A newspaper advertisement offering subdivided lands for sale.
  - B. A stockholder's annual report distributed to investors.
  - C. A private email between two friends discussing vacation plans.
  - D. A verbal conversation at a community meeting about local zoning.
key: A
explanation: Under N.J. Stat. Ann. tit. 45, ch. 15, § 15-16.27, 'Advertising' means the publication,
  or causing to be published, of any information offering subdivided lands for sale by means of a
  newspaper or periodical. Therefore, a newspaper advertisement offering subdivided lands for sale
  meets this definition. A stockholder's annual report, a private email between friends, and a
  verbal conversation at a community meeting do not involve such an offer in a newspaper or
  periodical, so they are not considered advertising under the act.
