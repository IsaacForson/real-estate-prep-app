stem: A claimant seeks payment from the real estate guaranty fund for embezzlement that occurred
  after the effective date of P.L.1993, c.51. What must the claimant do before the court can order
  payment from the fund?
options:
  - Filing a certification of criminal complaint
  - Obtaining a written waiver from the broker
  - Providing proof of residency and identification
  - Submitting a copy of the broker's license please
key: A
explanation: The statute requires that no payment order be entered unless the claimant files a
  certification affirming that a criminal complaint alleging the misappropriation of funds has been
  filed with a law enforcement agency. Thus, filing such certification is necessary. Obtaining a
  waiver from the broker is not required by the guaranty fund provisions.
citation:
  source: "### N.J. Stat. Ann. tit. 45, ch. 15 — New Jersey Statutes Title 45, Chapter 15 — Real
    Estate Brokers and Salespersons (N.J.S.A. 45:15-1 to 45:15-42, incl. Real Estate Sales Full
    Disclosure Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official
    full-text statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive
    capture of 2025-08-08 — § 15-37"
  url: null
  quoted_text: No order shall be entered unless the claimant, either at the time of filing the civil
    action or thereafter, files a certification affirming that a criminal complaint alleging the
    misappropriation of funds by the broker, broker-salesperson, or salesperson or unlicensed
    employee has been filed with a law enforcement agency of this State or of a county or
    municipality in this State.
