stem: Under N.J.S.A. 46:15-6(b), what must be appended to a deed when the transfer of real property
  is exempt from any fee established under section 3 of P.L.1968, c.49 or section 2 of P.L.2003,
  c.113?
options:
  - An affidavit verifying the property's assessed value.
  - An affidavit attesting to the grantee's residency status.
  - An affidavit confirming the payment of the fee.
  - An affidavit stating the basis for the exemption.
key: D
explanation: The statute requires that if a transfer is exempt from any realty transfer fee, an
  affidavit stating the basis for the exemption must be attached to the deed. The other options
  describe affidavits that the law does not mandate for an exempt transfer.
citation:
  source: N.J. Stat. Ann. tit. 46, ch. 15 — New Jersey Statutes Title 46, Chapter 15 — Realty Transfer
    Fee (N.J.S.A. 46:15-1 et seq.), extracted from the New Jersey Legislature's official full-text
    statutes download (STATUTES-TEXT.zip dated 2025-08-07) read via Internet Archive capture of
    2025-08-08 — § 15-6(b)
  url: null
  quoted_text: If the transfer is exempt from any fee established under section 3 of P.L.1968, c.49
    (C.46:15-7) or section 2 of P.L.2003, c.113 (C.46:15-7.1), an affidavit stating the basis for
    the exemption shall be appended to the deed.
