stem: A landowner owns 6 acres of land that has been used to grow vegetables for sale for the past
  three years. The landowner applies for farmland assessment under the Farmland Assessment Act.
  According to N.J. Stat. Ann. § 54:4-23.2, what is the correct assessment value for this land?
options:
  - The land's value for agricultural or horticultural use.
  - The land's value based on comparable farmland sales.
  - The land's market value for residential development.
  - The land's value determined by the local assessor's office.
key: A
explanation: Under N.J. Stat. Ann. § 54:4-23.2, land not less than 5 acres in area, actively devoted
  to agricultural or horticultural use for at least two successive years, shall be assessed at its
  value for agricultural or horticultural use upon proper application. The land is 6 acres and has
  been used for vegetables for sale for the past three years, satisfying the acreage, use, and
  duration requirements. Therefore its assessment must reflect its agricultural or horticultural
  value. The distractor suggesting value based on comparable farmland sales is incorrect because the
  statute ties assessment to the land's agricultural use value, not to market sales of similar
  farmland.
citation:
