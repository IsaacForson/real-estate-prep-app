math:
  worked_solution: The land is 6 acres, which is ≥5 acres required. It has been used for vegetables
    for sale for the past three years, which is ≥2 successive years required. Therefore the land
    qualifies for farmland assessment and must be assessed at its value for agricultural or
    horticultural use.
