stem: An applicant for a real estate salesperson license was convicted of a sex offense that
  requires registration two years ago. According to N.J. Stat. Ann. § 45:15-12.1, what action must
  the commission take regarding the application?
options:
  - Approve probation
  - Deny the license
  - Impose $5k fine
  - Refer to AG
key: B
explanation: The statute prohibits issuing or renewing a license to anyone known to have been
  convicted of a sex offense that would qualify for registration. Therefore, the commission must
  deny the application.
