stem: A licensee advises a client to clear trees from a freshwater wetland to improve the view.
  Under N.J.S.A. 13:9B-3, is a freshwater wetlands permit required before cutting the trees?
options:
  - Under the act, a permit is required because destruction of plant life, including the cutting of
    trees, is a regulated activity
  - Under the act, a permit is not required because tree cutting is considered routine maintenance
    and is exempt
  - Under the act, a permit is not required if the trees are less than six inches in diameter
  - Under the act, a permit is required only if more than ten trees are removed
key: A
explanation: The statute includes the destruction of plant life, including the cutting of trees, as
  a regulated activity requiring a permit. The claim that tree cutting is considered routine
  maintenance and is exempt is not supported by the statute.
