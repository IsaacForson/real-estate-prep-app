stem: According to N.J.S.A. 45:15-16.2a, which of the following licensees is exempt from the
  biennial continuing education requirement?
options:
  - No, a broker with 20 years of experience must complete continuing education.
  - Yes, a salesperson licensed with a real estate referral company is exempt.
  - No, a salesperson with five years of experience must complete continuing education.
  - No, a broker-salesperson with 30 years of experience must complete continuing education.
key: B
explanation: The statute explicitly exempts a salesperson licensed with a real estate referral
  company from the continuing education requirement for biennial license renewal. A broker with only
  20 years of experience does not qualify for the 40‑year exemption, so the statement that such a
  broker must complete continuing education is correct and thus not the exempt case.
