stem: A licensee intends to place a decorative rock wall in a freshwater wetland to create a garden
  feature. Does this activity require a freshwater wetlands permit?
options:
  - No, because decorative rocks are natural materials and exempt.
  - Yes, because placing obstructions is a regulated activity.
  - No, because the wall does not involve soil disturbance.
  - Yes, only if the wall exceeds 4 feet in height.
key: B
explanation: Placing obstructions is expressly listed as a regulated activity under subsection (5)
  of the definition of regulated activity. Therefore a permit is required. The statute provides no
  exemption for natural materials, no height threshold, and does not require soil disturbance for
  this activity.
