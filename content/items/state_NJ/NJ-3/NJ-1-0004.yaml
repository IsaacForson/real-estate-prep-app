stem: A licensed real estate instructor is found to have engaged in conduct demonstrating
  incompetency and bad faith toward students. Applying N.J. Stat. Ann. § 45:15-10.11, what may the
  commission do?
options:
  - Suspend or revoke the instructor's license or impose a fine
  - Refer the matter to the county prosecutor exclusively
  - Require the instructor to repeat the pre-licensure course
  - Transfer the instructor's license to another approved school
key: A
explanation: Section 45:15-10.11 authorizes the commission to suspend or revoke a school or
  instructor license, or impose fines, upon proof the licensee engaged in conduct demonstrating
  unworthiness, incompetency, bad faith, or dishonesty.
