stem: Under N.J. Stat. Ann. § 45:15-16b, what must any advertisement for a rebate include?
options:
  - The advertisement must include a disclosure concerning the purchaser's obligation to pay any
    applicable taxes for receipt of the rebate and a notice that the purchaser should contact a tax
    professional concerning the tax implications.
  - The advertisement must include a statement that the rebate is contingent upon the use of other
    services offered by the broker, and must also be displayed in a font size of at least 12 points.
  - The advertisement must include the broker's license number and the property address being
    advertised, and must also be displayed in a font size of at least 12 points.
  - The advertisement must include the exact commission rate being offered and the date the rebate
    will be paid, and must also be displayed in a font size of at least 12 points.
key: A
explanation: The statute requires that any rebate advertisement include a disclosure about the
  purchaser's tax obligation and a notice to consult a tax professional. The statement that the
  advertisement must include the broker's license number and property address is not required by
  this provision.
citation:
  source: "### N.J. Stat. Ann. tit. 45, ch. 15 — New Jersey Statutes Title 45, Chapter 15 — Real
    Estate Brokers and Salespersons (N.J.S.A. 45:15-1 to 45:15-42, incl. Real Estate Sales Full
    Disclosure Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official
    full-text statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive
    capture of 2025-08-08 because njleg.state.nj.us refuses connections from this network — §
    15-16b"
  url: null
  quoted_text: "Any advertisement for a rebate allowed pursuant to paragraph (2) of subsection k. of
    R.S.45:15-17 shall include: (1) A disclosure concerning the purchaser's obligation to pay any
    applicable taxes for receipt of the rebate; and (2) A notice that the purchaser should contact a
    tax professional concerning the tax implications of receiving the rebate."
