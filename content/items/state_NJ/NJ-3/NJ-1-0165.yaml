stem: A builder conveys a newly constructed warehouse that has never been occupied. Under N.J.S.A.
  46:15-5(g), how is this transfer classified for purposes of the realty transfer fee?
options:
  - A transfer of a previously occupied office property
  - A transfer of a vacant land property
  - A transfer of a newly constructed property
  - A transfer of a renovated building property
key: C
explanation: The statute defines 'new construction' as any conveyance of property upon which there
  is an entirely new improvement not previously occupied or used for any purpose. A newly
  constructed warehouse never occupied fits this definition. The distractor describing vacant land
  is incorrect because vacant land lacks a new improvement.
