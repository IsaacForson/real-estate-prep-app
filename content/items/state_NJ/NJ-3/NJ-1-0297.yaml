stem: What is the maximum number of continuing education hours a New Jersey real estate licensee
  must complete for biennial license renewal, unless exempt?
options:
  - 16 hours
  - 20 hours
  - 8 hours
  - 12 hours
key: A
explanation: Under N.J.S.A. 45:15-16.2a, the commission requires licensees to complete not more than
  16 hours of continuing education for biennial renewal, unless exempt. The distractor of 12 hours
  is a common mistaken recall of the requirement for some other states.
