stem: Under N.J.S.A. 45:15-17, how are multiple violations arising from separate real estate
  transactions treated for disciplinary purposes?
options:
  - Each transaction is considered a separate offense.
  - Violations are combined only when they involve the same client.
  - All violations from related transactions are treated as a single offense.
  - Only the initial transaction in a series is deemed an offense.
key: A
explanation: The statute explicitly states that each transaction shall be construed as a separate
  offense, so each violation is treated independently. Combining violations into a single offense
  contradicts this provision. Therefore, the correct answer is that each transaction is a separate
  offense.
