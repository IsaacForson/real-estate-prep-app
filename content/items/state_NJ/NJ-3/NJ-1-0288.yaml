stem: According to the Freshwater Wetlands Protection Act, how is a 'transition area' defined?
options:
  - An area of land within a freshwater wetland that is used for recreational activities such as
    hiking and birdwatching.
  - An area of land adjacent to a freshwater wetland which minimizes adverse impacts on the wetland
    or serves as an integral component of the wetlands ecosystem.
  - An area of land that is permanently submerged under water and supports only aquatic plant life.
  - An area of land adjacent to a freshwater wetland that is designated for agricultural use and is
    exempt from permit requirements.
key: B
explanation: The statute defines a transition area as land adjacent to a freshwater wetland that
  minimizes adverse impacts or serves as an integral component of the wetlands ecosystem.
