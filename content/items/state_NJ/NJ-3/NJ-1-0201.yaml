stem: Under N.J. Stat. Ann. § 46:8-46, how many days after the statement is made available by the
  Department of Community Affairs must a landlord distribute a copy to each existing tenant?
options:
  - The landlord must distribute the statement within fifteen days.
  - The landlord must distribute the statement within thirty days.
  - The landlord must distribute the statement within ten days.
  - The landlord must distribute the statement within sixty days.
key: B
explanation: The statute requires distribution within 30 days after the statement is made available.
  Therefore, the correct answer is thirty days. The distractor stating fifteen days is incorrect
  because the law specifies a 30‑day period, not a shorter interval.
