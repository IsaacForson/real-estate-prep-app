stem: A broker opens a second office in another town and places a licensed salesperson in charge of
  that office. Under N.J. Stat. Ann. § 45:15-12, what is required for the broker to legally operate
  this second office as a branch office?
options:
  - The broker must obtain a branch office license and place a broker-salesperson in charge
  - The broker must obtain a branch office license and place a licensed salesperson in charge
  - The broker must obtain a branch office license and may operate without a supervisor
  - The broker must obtain a branch office license and may employ unlicensed assistants only
key: A
explanation: The statute requires that a branch office be under the direct supervision of a
  broker-salesperson. Therefore, the broker must obtain a branch office license and ensure a
  broker-salesperson, not merely a salesperson, supervises the office. The option that only requires
  a licensed salesperson in charge, the option that allows operation without a supervisor, and the
  option that permits only unlicensed assistants do not satisfy this supervision requirement.
