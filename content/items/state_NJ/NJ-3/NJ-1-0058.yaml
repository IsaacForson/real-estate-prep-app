stem: An applicant for a real estate salesperson license was convicted of burglary three years ago.
  According to N.J. Stat. Ann. § 45:15-12.1, what action must the commission take regarding the
  application?
options:
  - License issued after probation
  - License denied outright
  - License issued with fine
  - Application referred to AG
key: B
explanation: The statute bars issuance of a license to anyone convicted within five years of
  burglary, robbery, or certain other offenses. Since the conviction occurred three years ago, the
  commission must deny the license. Issuing the license, even with conditions, would violate the
  bar.
