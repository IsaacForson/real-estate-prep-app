stem: A licensed real estate broker who is a partner in a licensed partnership has had his
  individual license revoked. Under N.J. Stat. Ann. § 45:15-12.4, what must the broker do within the
  period fixed by the commission to prevent the partnership's license from being revoked?
options:
  - Transfer his partnership interest to a family member immediately
  - Pay a fine of $5,000 to the commission promptly
  - Sever his connection to the partnership and divest his interest
  - Complete continuing education courses thoroughly
key: C
explanation: The statute provides that, to avoid revocation of the partnership license, the
  connection of the revoked partner to the partnership must be severed and his interest divested.
  Paying a fine or transferring interest to a family member does not satisfy this requirement.
