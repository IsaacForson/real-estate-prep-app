stem: A builder plans to construct a housing development with four single-family homes in the
  Pinelands area. According to N.J. Stat. Ann. tit. 13, ch. 18A, is this development considered a
  'major development' under the Pinelands Protection Act?
options:
  - Classification as a major development due to exceeding the five-unit threshold
  - Classification as not a major development because it has fewer than five dwelling units
  - Classification as a major development because it involves residential construction
  - Classification as not a major development because it is under three acres
key: B
explanation: According to N.J. Stat. Ann. tit. 13, ch. 18A, a major development is defined as any
  housing development of five or more dwelling units. Since the proposed development contains only
  four units, it does not meet that threshold and therefore is not a major development. The option
  stating that the development is not a major development because it has fewer than five dwelling
  units correctly reflects this rule.
