stem: Under the Freshwater Wetlands Protection Act, which of the following activities is expressly
  defined as a regulated activity requiring a freshwater wetlands permit?
options:
  - Removing soil from a freshwater wetland
  - Painting a house near a freshwater wetland
  - Installing a solar panel near a freshwater wetland
  - Hosting a picnic in a freshwater wetland
key: A
explanation: The act defines 'regulated activity' to include the removal, excavation, disturbance or
  dredging of soil, sand, gravel, or aggregate material. Therefore, removing soil from a freshwater
  wetland requires a permit. Painting a house near a wetland is not listed as a regulated activity
  under the statute.
