stem: A landlord posts the annual statement of tenant and landlord rights in a locked maintenance
  closet accessible only to building staff. Has the landlord complied with the posting requirement
  under the Truth-in-Renting Act?
options:
  - The landlord is compliant because the statement is posted in a maintenance closet.
  - The landlord is not compliant because the statement is not prominent and accessible to all
    tenants.
  - The landlord is compliant because a copy of the statement is posted somewhere on the premises.
  - The landlord is not compliant because the landlord failed to provide a copy to each tenant.
key: B
explanation: The statute requires that the statement be posted in one or more locations so that it
  is prominent and accessible to all tenants. Posting in a locked closet accessible only to staff
  fails to meet the prominence and accessibility requirement. Providing a copy to each tenant is a
  separate distribution duty, not the posting requirement at issue.
