stem: A broker who already has a main office in Newark opens a second office in Trenton and places a
  licensed broker-salesperson in charge. What must the broker do to operate the Trenton office
  legally under N.J. Stat. Ann. § 45:15-12?
options:
  - Maintain a separate trust account for the Trenton office
  - Provide written disclosure of any promotion over $1,000 to Trenton clients
  - Obtain a branch office license and pay a $50 fee
  - Display the broker's license certificate at the Trenton office
key: C
explanation: The statute requires a branch office license for each additional place of business,
  issued upon payment of a $50 fee, provided the branch is under the direct supervision of a
  broker-salesperson. The other options describe duties that apply elsewhere (displaying licenses,
  trust accounts, promotion disclosures) but are not the specific requirement for opening a second
  office.
citation:
  source: N.J. Stat. Ann. tit. 45, ch. 15 — New Jersey Statutes Title 45, Chapter 15 — Real Estate
    Brokers and Salespersons (N.J.S.A. 45:15-1 to 45:15-42, incl. Real Estate Sales Full Disclosure
    Act 45:15-16.27 et seq.) § 15-12
  url: null
  quoted_text: In case a real estate broker maintains more than one place of business, a branch office
    license shall be issued to such broker for each branch office so maintained in this State;
    provided, however, that the said branch office or offices are under the direct supervision of a
    broker-salesperson.  The branch office license or licenses shall be issued upon the payment of a
    fee of $50 for each license so issued.
