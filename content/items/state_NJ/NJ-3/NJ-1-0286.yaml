math:
  worked_solution: >-
    Threshold = 5,000 sq ft

    Actual cleared area = 6,000 sq ft

    Comparison: 6,000 sq ft > 5,000 sq ft → condition satisfied

    Purpose: parking lot (non‑agricultural)

    Since both size (>5,000 sq ft) and non‑agricultural purpose are met, the activity qualifies as
    major development.
