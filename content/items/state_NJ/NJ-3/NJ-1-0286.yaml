stem: A licensee advises a client who plans to clear 6,000 square feet of land for a parking lot in
  the Pinelands area. According to N.J. Stat. Ann. tit. 13, ch. 18A, is this activity considered a
  major development under the Pinelands Protection Act?
options:
  - The activity does not qualify as a major development
  - The activity qualifies as a major development
  - The activity qualifies only if the parcel is less than three acres
  - The activity qualifies only if it is for agricultural purposes
key: B
explanation: The Pinelands Protection Act defines major development as any grading, clearing, or
  disturbance of an area exceeding 5,000 square feet for purposes other than agricultural or
  horticultural. Clearing 6,000 square feet for a parking lot is non‑agricultural and exceeds the
  5,000‑square‑foot threshold, therefore the activity meets the definition of major development.
