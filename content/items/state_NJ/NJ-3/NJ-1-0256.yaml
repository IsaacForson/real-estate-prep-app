  - $5,000
  - $20,000
  - $15,000
key: B
explanation: The statute states a penalty of not more than $5,000 for the first violation and not
  more than $10,000 for any subsequent violation. Therefore, the maximum for a first violation is
  $5,000. The $10,000 figure applies only to subsequent violations.
