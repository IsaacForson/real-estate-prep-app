stem: A landowner fills a freshwater wetland with soil to create a building pad. Does this activity
  require a freshwater wetlands permit?
options:
  - The activity does not require a permit because filling with soil is considered landscaping and
    exempt.
  - The activity requires a permit only if the fill exceeds one hundred cubic yards.
  - The activity requires a permit because dumping, discharging or filling with any materials is a
    regulated activity.
  - The activity does not require a permit because the act only applies to wetlands larger than one
    acre.
key: C
explanation: The definition lists dumping, discharging or filling with any materials as a regulated
  activity, so filling a wetland with soil requires a permit. The distractor claiming exemption for
  landscaping fill is incorrect because the act does not exempt filling activities.
