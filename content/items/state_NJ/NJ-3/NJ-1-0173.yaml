stem: A landlord resides in one unit of a four-unit residential building and rents out the other
  three units. According to the Truth-in-Renting Act, is this landlord subject to the act's
  requirements?
options:
  - Yes, because the building contains more than three dwelling units
  - No, because the owner occupies one of the units
  - Yes, only if the landlord requires electronic payment
  - No, because the landlord gives receipts for cash payments
key: A
explanation: The definition of landlord excludes owner‑occupied premises of not more than three
  dwelling units; since the building has four units, the exclusion does not apply and the landlord
  remains subject to the act. The claim that occupancy of one unit automatically exempts the
  landlord ignores the four‑unit threshold.
