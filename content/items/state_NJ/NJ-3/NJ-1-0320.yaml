stem: A person who advertises himself as a real estate broker without holding a license is
  discovered by the commission. According to N.J. Stat. Ann. § 45:15-17, may the commission
  investigate this person's actions?
options:
  - Yes, but only if the person has previously held a license.
  - No, unless the person also receives compensation from a licensed broker.
  - Yes, the commission may investigate the person's actions.
  - No, the commission may not investigate because the person is not licensed.
key: C
explanation: The statute expressly authorizes the commission to investigate any person who assumes,
  advertises or represents himself as being authorized to act as a real estate broker without being
  licensed. Therefore investigation is permitted. The claim that investigation is allowed only if
  the person also receives compensation from a licensed broker is incorrect, because the statute
  permits investigation regardless.
