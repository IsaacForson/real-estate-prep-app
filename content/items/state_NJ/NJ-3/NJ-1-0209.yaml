stem: A licensee commits three separate violations of the real estate license law. What is the
  maximum total administrative penalty the commission may impose under N.J. Stat. Ann. § 45:15-17?
options:
  - $25,000.00
  - $15,000.00
  - $10,000.00
  - $5,000.00
key: A
explanation: The first violation carries a maximum penalty of $5,000; each subsequent violation may
  be up to $10,000. For three violations, the maximum total is $5,000 + $10,000 + $10,000 = $25,000.
  The $15,000.00 option would only apply if the second violation were limited to $5,000.
