stem: According to N.J.S.A. 13:9B-3, what must the Department of Environmental Protection use when
  designating a freshwater wetland?
options:
  - The 4‑parameter approach (hydrology, soils, vegetation, and wildlife) from the April 1, 1987
    interim‑final draft Wetland Identification and Delineation Manual
  - The department’s discretion to choose any method it deems appropriate from the April 1, 1987
    interim‑final draft Wetland Identification and Delineation Manual
  - The 3‑parameter approach (hydrology, soils, vegetation) from the April 1, 1987 interim‑final
    draft Wetland Identification and Delineation Manual
  - The 2‑parameter approach (hydrology and vegetation) from the April 1, 1987 interim‑final draft
    Wetland Identification and Delineation Manual
key: C
explanation: The statute explicitly states that when designating a wetland, the department shall use
  the 3‑parameter approach (hydrology, soils, vegetation) from the April 1, 1987 interim‑final draft
  Wetland Identification and Delineation Manual. This requirement is mandatory, not discretionary.
  The other options either alter the number of parameters or suggest departmental discretion, which
  contradicts the directive.
