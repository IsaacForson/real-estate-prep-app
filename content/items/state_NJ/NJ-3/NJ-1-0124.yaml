stem: A landowner has 6 acres of land used for growing corn and soybeans for sale, has been so
  devoted for the past 3 years, but has not yet submitted an application to the local tax assessor.
  According to N.J. Stat. Ann. § 54:4-23.2, is the land eligible for farmland assessment?
options:
  - The land is ineligible for farmland assessment because the owner has not submitted an
    application to the assessor
  - The land is eligible for farmland assessment only if the owner also receives payments from a
    soil conservation program
  - The land is ineligible for farmland assessment because corn and soybeans are not considered
    agricultural use
  - The land is eligible for farmland assessment because it is over five acres, devoted to
    agricultural use for at least two years.
key: A
explanation: The statute requires that the land’s value be based on agricultural use only on
  application of the owner and approval thereof. Without an application, the land does not receive
  farmland assessment valuation regardless of meeting acreage, use, and duration requirements.
