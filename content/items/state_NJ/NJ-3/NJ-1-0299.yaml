stem: A salesperson licensed with a real estate referral company completes 12 hours of approved
  continuing education during their renewal period. Is this continuing education required for
  biennial license renewal under N.J.S.A. 45:15-16.2a?
options:
  - No, they are exempt from the continuing education requirement.
  - Yes, because they completed at least 12 hours of continuing education.
  - Yes, because they completed at least 16 hours of continuing education.
  - Yes, because they completed at least 8 hours of continuing education.
key: A
explanation: The statute explicitly states that a salesperson licensed with a real estate referral
  company shall not be required to complete the continuing education requirements as a condition of
  biennial license renewal, regardless of hours completed. The distractors incorrectly assume a
  hour‑based requirement applies.
