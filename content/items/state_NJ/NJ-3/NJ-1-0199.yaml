stem: A landowner has ten acres of woodland used exclusively for sustainable forestland (producing
  timber for sale) but has not established a forest stewardship plan. According to N.J. Stat. Ann.
  tit. 54, ch. 4, is this land considered in agricultural use for farmland assessment?
options:
  - Classification as not agricultural use because the woodland exceeds five acres
  - Classification as agricultural use because the land is devoted to timber production
  - Classification as not agricultural use because the landowner lacks a forest stewardship plan
  - Classification as agricultural use because sustainable forestland automatically qualifies
key: C
explanation: The statute provides that land devoted as sustainable forestland is not deemed
  agricultural use unless the landowner fulfills additional conditions, including establishing a
  forest stewardship plan. Since the plan is missing, the land does not qualify. The statement that
  sustainable forestland automatically qualifies is incorrect.
