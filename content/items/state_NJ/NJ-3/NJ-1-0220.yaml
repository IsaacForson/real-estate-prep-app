stem: Under N.J. Stat. Ann. § 45:15-12, what must be prominently displayed in a real estate broker's
  main office?
options:
  - The advertising materials of the broker and all licensed persons in his employ
  - The recent sales transactions log of the broker and all licensed persons in his employ
  - The personal identification card of the broker and all licensed persons in his employ
  - The license certificate of the broker and all licensed persons in his employ
key: D
explanation: The statute requires that a broker's main office display the license certificate of the
  broker and all licensed persons employed there. The distractor about advertising materials is
  incorrect because the law does not mandate their display in the office.
