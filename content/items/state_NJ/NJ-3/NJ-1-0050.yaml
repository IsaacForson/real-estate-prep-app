    Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official full-text
    statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive capture of
    2025-08-08 because njleg.state.nj.us refuses connections from this network — § 15-12
  url: null
  quoted_text: In case a real estate broker maintains more than one place of business, a branch office
    license shall be issued to such broker for each branch office so maintained in this State;
    provided, however, that the said branch office or offices are under the direct supervision of a
    broker-salesperson. The branch office license or licenses shall be issued upon the payment of a
    fee of $50 for each license so issued.
