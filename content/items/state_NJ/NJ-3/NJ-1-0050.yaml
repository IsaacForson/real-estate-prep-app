stem: A broker who already has a main office in Newark opens a second office in Trenton and places a
  licensed broker-salesperson in charge. What must the broker do to operate the Trenton office
  legally under N.J. Stat. Ann. § 45:15-12?
options:
  - Ensure the Trenton office is open only by appointment
  - Display the broker's license certificate only at the main office
  - Register the Trenton office as a referral company
  - Obtain a branch office license and pay a $50 fee
key: D
explanation: The law requires a branch office license for each additional place of business, issued
  upon payment of a $50 fee, provided the branch is under the direct supervision of a
  broker-salesperson. Thus the broker must obtain a branch office license and pay the fee. The
  option stating that the broker need only display the license at the main office is incorrect
  because referral companies are governed by a different provision and do not replace the branch
  office licensing requirement.
