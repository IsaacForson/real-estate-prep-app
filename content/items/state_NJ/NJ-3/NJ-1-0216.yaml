stem: A seller conveys title to a buyer via deed. The transfer is exempt from any fee established
  under section 3 of P.L.1968, c.49 or section 2 of P.L.2003, c.113. What must be appended to the
  deed?
options:
  - An affidavit stating the basis for the exemption
  - A statement of the true consideration for the transfer
  - A copy of the seller's driver's license
  - A warranty deed from the prior owner
key: A
explanation: If a transfer is exempt from the realty transfer fee, an affidavit explaining the
  exemption must be attached to the deed. A statement of true consideration is required only when
  the transfer is subject to the fee.
