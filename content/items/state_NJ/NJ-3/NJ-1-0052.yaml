stem: According to N.J. Stat. Ann. § 46:15-5(f), how is a 'senior citizen' defined for purposes of
  the Realty Transfer Fee?
options:
  - Any resident of New Jersey aged 62 years or older
  - Any resident of New Jersey receiving federal disability benefits
  - Any resident of New Jersey aged 60 years or older
  - Any resident of New Jersey who is permanently and totally disabled
key: A
explanation: The statute defines a senior citizen as any resident of New Jersey aged 62 years or
  older. The option stating any resident aged 60 years or older is incorrect because the definition
  requires age 62 or older. The options describing disability benefits or permanent total disability
  are incorrect because disability status is not part of this definition.
