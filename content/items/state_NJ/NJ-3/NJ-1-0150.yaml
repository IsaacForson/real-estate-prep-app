stem: Under N.J. Stat. Ann. § 45:15-12.5, which individual is exempt from the requirement to
  maintain a special trust or escrow account for funds received in real estate transactions?
options:
  - A broker-salesperson
  - An out-of-state broker
  - A broker doing commercial leases
  - A broker who is also an attorney
key: A
explanation: The statute explicitly states that the trust-account requirement does not apply to an
  individual licensed as a broker-salesperson. The other options describe brokers who remain subject
  to the requirement because they are not broker-salespersons.
