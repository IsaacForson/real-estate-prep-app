stem: A broker advertises a rebate to buyers but the advertisement does not include any disclosure
  about the purchaser's obligation to pay applicable taxes for the rebate. Under N.J.S.A.
  45:15-16b(a)(1) and (b), which statement is correct?
options:
  - The advertisement is permissible if the broker provides the disclosure verbally to the buyer.
  - The advertisement is acceptable as long as the rebate is paid after closing.
  - The advertisement is compliant because it includes the rebate amount and terms.
  - The advertisement violates the rule because it lacks the required tax disclosure and notice.
key: D
explanation: The statute mandates that any advertisement for a rebate include a disclosure
  concerning the purchaser's obligation to pay applicable taxes and a notice to consult a tax
  professional, with text size at least equal to the advertisement’s text. Omitting the tax
  disclosure violates this requirement. The third distractor is wrong because the disclosure must be
  written and displayed in the advertisement, not merely given verbally.
