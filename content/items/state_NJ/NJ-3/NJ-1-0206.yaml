stem: A homeowner wants to install a drainage ditch to lower the water table in a freshwater
  wetland. Does this activity require a freshwater wetlands permit?
options:
  - The activity does not require a permit because the wetland is not designated as a significant
    resource.
  - The activity requires a permit because draining or disturbing the water level is a regulated
    activity.
  - The activity requires a permit only if the ditch alters more than ten percent of the wetland
    area.
  - The activity does not require a permit because the work is classified as routine maintenance.
key: B
explanation: The regulated activity definition includes drainage or disturbance of the water level
  or water table, thus installing a drainage ditch requires a permit. The distractor claiming
  exemption for drainage ditches is incorrect because the act provides no exemption for this
  activity.
