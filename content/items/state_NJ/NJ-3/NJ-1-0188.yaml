stem: A licensee plans to install an underground gas pipeline across a freshwater wetland. Does this
  activity require a freshwater wetlands permit?
options:
  - Yes, because installing a gas pipeline involves excavation/disturbance of soil, which is a
    regulated activity.
  - Yes, because installing a gas pipeline is exempt when using directional drilling that avoids
    surface disturbance.
  - Yes, because installing a gas pipeline requires a permit only if the wetland is classified as
    'high quality'.
  - Yes, because installing a gas pipeline only requires a permit if it crosses a designated wetland
    buffer zone.
key: A
explanation: Installing a gas pipeline entails excavation or disturbance of soil, which is expressly
  listed as a regulated activity under subsection (1) of the definition of regulated activity.
  Therefore a permit is required. The other options introduce exemptions or thresholds not found in
  the statute.
