stem: Under N.J. Stat. Ann. § 45:15-17, what is the maximum administrative penalty the commission
  may impose for a second violation of the real estate license law?
options:
  - $15,000
  - $10,000
  - $20,000
  - $5,000
key: B
explanation: The statute allows a penalty of not more than $5,000 for the first violation and not
  more than $10,000 for any subsequent violation, so the maximum for a second violation is $10,000.
  The $5,000 option applies only to a first violation.
