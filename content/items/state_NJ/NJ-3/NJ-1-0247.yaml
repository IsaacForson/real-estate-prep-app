stem: A landowner has land used for growing tomatoes for sale, actively devoted.
options:
  - The landowner must submit an application to the assessor and obtain approval
  - The landowner must take no action; the land automatically qualifies
  - The landowner must pay a fee to the Department of Environmental Protection
  - The landowner must obtain a forest stewardship plan for the land
key: A
explanation: The statute provides that land meeting the acreage and use qualifications shall be
  valued for agricultural use "on application of the owner, and approval thereof as hereinafter
  provided." Therefore the landowner must apply and receive approval. The distractor claiming
  automatic qualification is incorrect because the statute expressly conditions the agricultural
  value on the owner's application and subsequent approval.
