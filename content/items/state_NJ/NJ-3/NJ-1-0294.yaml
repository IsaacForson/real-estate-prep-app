stem: A tenant signs a waiver refusing to receive the annual statement of tenant and landlord
  rights. According to the Truth-in-Renting Act, does this waiver affect the landlord's obligations
  under the act?
options:
  - The landlord may charge a fee for providing the statement.
  - The landlord's responsibilities remain unchanged.
  - The landlord is no longer required to distribute the statement.
  - The landlord only needs to post the statement in a common area.
key: B
explanation: The statute explicitly states that a tenant's waiver or refusal does not alter the
  landlord's responsibilities under any provision. The distractor 'The landlord is no longer
  required to distribute the statement.' incorrectly suggests the waiver removes the duty.
citation:
  source: N.J. Stat. Ann. tit. 46, ch. 8 — New Jersey Statutes Title 46, Chapter 8 — Landlord and
    Tenant (incl. Truth-in-Renting Act 46:8-43 et seq.) (N.J.S.A. 46:8-1 et seq.), extracted from
    the New Jersey Legislature's official full-text statutes download (STATUTES-TEXT.zip dated
    2025-08-07) read via Internet Archive capture of 2025-08-08 — § 8-43 § 46:8-49
  url: null
  quoted_text: No waiver or refusal by a tenant of his right to receive a copy of the statement as
    provided herein shall alter the responsibilities of the landlord under any provision of this
    act.
