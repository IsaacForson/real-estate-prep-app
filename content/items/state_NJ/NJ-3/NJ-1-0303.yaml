stem: Under N.J.S.A. 45:15-16.2a, a salesperson who is licensed through a real estate referral
  company is exempt from which requirement?
options:
  - Paying the biennial license renewal fee
  - Submitting a change of address notice
  - Completing continuing education hours
  - Maintaining errors and omissions insurance
key: C
explanation: The statute explicitly states that a salesperson licensed with a real estate referral
  company shall not be required to complete the continuing education requirements as a condition of
  biennial license renewal. Therefore, the correct answer is completing continuing education hours.
  The distractor about paying the renewal fee is incorrect because the exemption applies only to
  continuing education, not to the fee itself.
