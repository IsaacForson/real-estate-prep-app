stem: A broker-salesperson has been actively licensed for exactly 40 years and is applying for
  biennial license renewal. Under N.J.S.A. 45:15-16.2a, is this person required to complete
  continuing education?
options:
  - The licensee must complete continuing education only if they work with a referral company.
  - The licensee must complete the continuing education requirement.
  - The licensee is exempt because they have reached the 40‑year threshold.
  - The licensee is exempt only if they have more than 45 years of experience.
key: C
explanation: The statute provides that the continuing education requirement does not apply to any
  real estate broker or broker-salesperson who has been a real estate broker or broker-salesperson
  for 40 years or more. Since the licensee has exactly 40 years of experience, they fall within this
  exemption. The distractor suggesting exemption only after more than 45 years is incorrect because
  the threshold is 40 years, not 45.
