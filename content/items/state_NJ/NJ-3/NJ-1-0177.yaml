stem: Under N.J. Stat. Ann. § 46:8-44, what is the maximum number of dwelling units in an
  owner-occupied premises that excludes a person from being considered a 'landlord' under the
  Truth-in-Renting Act?
options:
  - One dwelling unit
  - Two dwelling units
  - Three dwelling units
  - Eleven dwelling units
key: C
explanation: The statute excludes owner‑occupied premises of not more than three dwelling units from
  the definition of landlord, so the maximum is three. The option stating two dwelling units is
  incorrect because the exclusion applies up to three units.
citation:
  source: N.J. Stat. Ann. tit. 46, ch. 8 — New Jersey Statutes Title 46, Chapter 8 — Landlord and
