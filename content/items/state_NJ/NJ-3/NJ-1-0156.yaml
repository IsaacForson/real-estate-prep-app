  - The words "trust account" or "escrow account"
  - The words 'client name' or 'property address'
  - The words 'bank routing number' or 'account number'
key: B
explanation: The statute requires that all checks and deposit slips for the trust/escrow account
  contain the words "trust account" or "escrow account". The license number, client name, and bank
  routing numbers are not mandated by this provision.
