stem: A buyer purchases a house for $250,000 cash and agrees to assume the seller's mortgage of
  $80,000. The property has unpaid real property taxes of $2,000 for the current year that will be
  paid by the buyer at closing. According to N.J.S.A. 46:15-5(c), what is the consideration for the
  deed?
options:
  - $332,000
  - $250,800
  - $250,000
  - $330,000
key: D
explanation: Consideration includes the cash paid and the assumed mortgage amount, but excludes
  liens for real property taxes. Thus, $250,000 + $80,000 = $330,000. The distractor adding the
  $2,000 tax lien incorrectly includes an amount that the statute excludes.
citation:
  source: N.J. Stat. Ann. tit. 46, ch. 15 — New Jersey Statutes Title 46, Chapter 15 — Realty Transfer
    Fee (N.J.S.A. 46:15-1 et seq.), extracted from the New Jersey Legislature's official full-text
    statutes download (STATUTES-TEXT.zip dated 2025-08-07) read via Internet Archive capture of
    2025-08-08 — § 15-5
  url: null
  quoted_text: including the remaining amount of any prior mortgage to which the transfer is subject
    or which is to be assumed and agreed to be paid by the grantee and any other lien or encumbrance
    thereon not paid, satisfied or removed in connection with the transfer of title. The amount of
    liens for real property taxes, water or sewerage charges for the current or any subsequent year,
    or by way of added assessment or other adjustment, as well as of other like liens or
    encumbrances of a current and continuing nature ordinarily adjusted between the parties
    according to the period of ownership shall be excluded as an element in determining the
    consideration
  secondary: []
math:
  worked_solution: "Step 1: Identify cash paid: $250,000. Step 2: Identify assumed mortgage: $80,000.
    Step 3: Add them: $250,000 + $80,000 = $330,000. Step 4: Note that real property tax liens are
    excluded per statute, so no addition. Final consideration: $330,000."
  formulas:
    - Consideration = Cash + Assumed Mortgage (tax liens excluded)
