stem: Under N.J. Stat. Ann. § 45:15-17, what is the maximum administrative penalty the commission
  may impose for a first violation of the real estate license law?
options:
  - $2,500
  - $5,000
  - $7,500
  - $10,000
key: B
explanation: The statute states that the commission may impose a penalty of not more than $5,000 for
  a first violation and not more than $10,000 for any subsequent violation. Therefore, the maximum
  for a first violation is $5,000. The $10,000 figure applies only to second or later violations.
