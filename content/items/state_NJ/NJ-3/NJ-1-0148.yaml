stem: A landowner submitted a farmland assessment application in March 2023. According to N.J. Stat.
  Ann. § 54:4-23.3a, by what date must the first on‑site inspection be completed at the latest?
options:
  - By December 31, 2023
  - By December 31, 2024
  - By December 31, 2025
  - By December 31, 2026
key: C
explanation: The rule states the inspection must occur during one of the first three years in which
  applications are received. For a 2023 application, the first three years are 2023, 2024, and 2025,
  so the latest permissible date is the end of 2025. Choosing the end of 2024 would be too early
  because the inspection could lawfully be delayed to 2025.
citation:
