stem: A licensee prepares a deed for recording where the transfer of real property is exempt from
  any fee established under section 3 of P.L.1968, c.49 or section 2 of P.L.2003, c.113. According
  to N.J.S.A. 46:15-6(b), what must be appended to the deed?
options:
  - A certified copy of the prior mortgage document
  - A statement of the true consideration for transfer
  - A notarized power of attorney form for recording
  - An affidavit stating the basis for exemption
key: D
explanation: The rule requires that when a transfer is exempt from the realty transfer fee, an
  affidavit stating the basis for the exemption must be appended to the deed. The distractor asking
  for a statement of the true consideration applies only when the transfer is subject to the fee,
  not when it is exempt.
