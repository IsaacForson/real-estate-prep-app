stem: An owner occupies one unit of her three-unit building and rents out the other two units. Based
  on N.J. Stat. Ann. § 46:8-44, is she a 'landlord' under the Truth-in-Renting Act?
options:
  - No, because the building lacks a resident superintendent
  - Yes, because she rents more than one dwelling unit
  - Yes, because the leases each run for a full calendar year
  - No, owner-occupied premises of that size are excluded
key: D
explanation: Section 46:8-44 excludes owner-occupied premises of not more than three dwelling units
  from the statutory definition of landlord under the Truth-in-Renting Act.
citation:
  source: N.J. Stat. Ann. § 46:8-44
  url: null
  quoted_text: '"Landlord" means any person who rents or leases or offers to rent or lease, for a term
    of at least one month, dwelling units, except dwelling units in rental premises containing not
    more than two such units, or in owner-occupied premises of not more than three dwelling units,
    or in hotels, motels or other guest houses serving transient or seasonal guests.'
