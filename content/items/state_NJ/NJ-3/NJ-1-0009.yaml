explanation: Section 46:15-5 defines a deed as a recordable written instrument that conveys or
  transfers title to a freehold interest in real property from a grantor to a grantee.
citation:
  source: N.J. Stat. Ann. § 46:15-5
  url: null
  quoted_text: '"Deed" means a written instrument entitled to be recorded in the office of a county
    recording officer which purports to convey or transfer title to a freehold interest in any
    lands, tenements or other realty in this State by way of grant or bargain and sale thereof from
    the named grantor to the named grantee.'
