stem: A broker lists a property and, at the time of signing the sales contract, fails to give the
  buyer a fully executed copy of the contract. Under N.J.S.A. 45:15-17, may the commission consider
  this a violation?
options:
  - Yes, but only if the buyer requests the copy in writing.
  - Yes, because failure to provide a fully executed copy is a ground for penalty.
  - No, because providing a copy is only required after closing.
  - No, unless the broker also misrepresented the property.
key: B
explanation: The statute lists failure to provide a fully executed copy of a sale or rental contract
  at the time of execution as a ground for penalty. Thus the commission may treat this as a
  violation. The other options incorrectly limit the requirement to after closing, to a buyer
  request, or to additional misrepresentation.
