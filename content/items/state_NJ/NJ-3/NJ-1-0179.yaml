stem: A landlord receives the statement of tenant and landlord rights on April 10 and distributes
  copies to existing tenants on May 15. Has the landlord complied with the distribution requirement
  under N.J. Stat. Ann. § 46:8-46?
options:
  - The landlord has complied because distribution occurred within 30 days.
  - The landlord has complied because distribution occurred before the statement was made available.
  - The landlord has not complied because distribution must occur within 15 days.
  - The landlord has not complied because distribution occurred after 30 days.
key: D
explanation: From April 10 to May 15 is 35 days, exceeding the 30‑day limit, so the landlord has not
  complied. The option claiming compliance because distribution occurred within 30 days ignores the
  actual elapsed time.
