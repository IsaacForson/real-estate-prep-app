stem: Under N.J.S.A. 46:15-5(c), which of the following is excluded from the amount of consideration
  when determining the realty transfer fee?
options:
  - The purchase price paid in cash at closing
  - Real property taxes for the current year
  - The monetary value of personal property included in the sale
  - The balance of a prior mortgage assumed by the grantee
key: B
explanation: Under N.J.S.A. 46:15-5(c), liens for real property taxes for the current or any
  subsequent year are excluded from the consideration used to calculate the realty transfer fee.
  Amounts such as the purchase price, assumed mortgage balances, and the value of personal property
  are included in consideration.
citation:
  source: N.J. Stat. Ann. tit. 46, ch. 15 — New Jersey Statutes Title 46, Chapter 15 — Realty Transfer
    Fee (N.J.S.A. 46:15-1 et seq.), extracted from the New Jersey Legislature's official full-text
    statutes download (STATUTES-TEXT.zip dated 2025-08-07) read via Internet Archive capture of
    2025-08-08 — § 46:15-5
  url: null
  quoted_text: The amount of liens for real property taxes, water or sewerage charges for the current
    or any subsequent year, or by way of added assessment or other adjustment, as well as of other
    like liens or encumbrances of a current and continuing nature ordinarily adjusted between the
    parties according to the period of ownership shall be excluded as an element in determining the
    consideration
