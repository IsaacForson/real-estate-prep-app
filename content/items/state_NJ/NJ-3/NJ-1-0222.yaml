stem: An applicant for a real estate salesperson license was convicted of forgery three years ago.
  According to N.J. Stat. Ann. § 45:15-12.1, what action must the commission take regarding the
  application?
options:
  - The commission must approve the license application
  - The commission must issue a provisional license
  - The commission must deny the license application
  - The commission must refer the applicant to the Attorney General
key: C
explanation: The statute bars issuance of a license to anyone convicted of forgery within the
  preceding five years, so the commission must deny the application. The distractor suggesting the
  commission should approve the license is incorrect because the law explicitly prohibits issuance
  for such a conviction.
