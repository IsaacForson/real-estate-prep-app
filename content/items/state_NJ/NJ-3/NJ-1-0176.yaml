stem: A developer drives pilings to support a boardwalk in a freshwater wetland. Under the
  Freshwater Wetlands Protection Act, does this activity require a freshwater wetlands permit?
options:
  - Yes, but only if the wetland is classified as a transition area.
  - No, because the pilings are temporary and do not constitute a permanent structure.
  - No, because constructing a boardwalk is exempt from permit requirements.
  - Yes, because driving pilings is a regulated activity requiring a permit.
key: D
explanation: Driving pilings is defined as a regulated activity under N.J. Stat. Ann. § 13:9B-3 and
  therefore requires a freshwater wetlands permit. The other options incorrectly claim exemptions or
  limitations not present in the statute.
