stem: A seller conveys title to a buyer via deed. The transfer is subject to the realty transfer
  fee. What must be contained in the deed, acknowledgment, proof of execution, or an appended
  affidavit?
options:
  - A copy of the recent property survey
  - A copy of the prior mortgage agreement
  - An affidavit stating the basis for exemption
  - A statement of the true consideration for the transfer
key: D
explanation: When a transfer is subject to the realty transfer fee, the law requires a statement of
  the true consideration to be included in the deed or related documents. An exemption affidavit is
  only needed when the transfer is exempt.
citation:
  source: N.J. Stat. Ann. tit. 46, ch. 15 — New Jersey Statutes Title 46, Chapter 15 — Realty Transfer
    Fee (N.J.S.A. 46:15-1 et seq.), extracted from the New Jersey Legislature's official full-text
    statutes download (STATUTES-TEXT.zip dated 2025-08-07) read via Internet Archive capture of
    2025-08-08 — § 15-6
  url: null
  quoted_text: If the transfer is subject to any fee established under section 3 of P.L.1968, c.49
    (C.46:15-7) or section 2 of P.L.2003, c.113 (C.46:15-7.1), a statement of the true consideration
    for the transfer shall be contained in the deed, the acknowledgment, the proof of the execution,
    or an appended affidavit by one of the parties to the deed or that party's legal representative.
