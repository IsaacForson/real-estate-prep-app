stem: What is required to legally engage in a regulated activity in a freshwater wetland under the
  Freshwater Wetlands Protection Act?
options:
  - The licensee must submit a letter of intent to the municipal planning board.
  - The licensee must ensure compliance with the Coastal Area Facility Review Act.
  - The licensee must obtain a freshwater wetlands permit before engaging in the activity.
  - The licensee may proceed without a permit if the activity lasts less than one day.
key: C
explanation: The statute defines a freshwater wetlands permit as a permit to engage in a regulated
  activity issued pursuant to the act, so a permit is required. The distractor about a letter of
  intent is incorrect because the act does not authorize such a letter as a substitute for a permit.
