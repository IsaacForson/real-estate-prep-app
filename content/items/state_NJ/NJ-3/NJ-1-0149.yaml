stem: If the first on‑site inspection for a farmland assessment application was conducted in 2024,
  what is the latest year by which the next inspection must occur under N.J. Stat. Ann. §
  54:4-23.3a?
options:
  - In 2027
  - In 2026
  - In 2028
  - In 2025
key: A
explanation: After the initial inspection, the statute requires inspections not less frequently than
  once every three years. An inspection in 2024 therefore necessitates the next one by 2027 at the
  latest. Selecting 2026 would violate the minimum three‑year interval.
