  - 5 parameters
key: B
explanation: The Freshwater Wetlands Protection Act requires the department to use the
  three‑parameter approach—hydrology, soils, and vegetation—when designating a freshwater wetland,
  so the correct answer is three parameters. (See N.J. Stat. Ann. § 13:9B‑3.)
