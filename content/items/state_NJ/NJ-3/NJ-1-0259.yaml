stem: A salesperson completes 10 hours of approved continuing education during their renewal period.
  Does this satisfy the continuing education requirement for biennial license renewal, assuming they
  are **NOT** exempt?
options:
  - No, because they must complete exactly 16 hours of continuing education.
  - No, because they need at least 12 hours of continuing education.
  - Yes, but only if they also complete 6 hours of ethics continuing education.
  - Yes, because they have completed not more than 16 hours of continuing education.
key: D
explanation: The rule requires licensees to complete not more than 16 hours of continuing education;
  completing 10 hours meets this requirement. The options stating an exact or minimum hour
  requirement are incorrect, and the option that adds an ethics condition is unsupported.
