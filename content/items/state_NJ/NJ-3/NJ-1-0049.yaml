stem: What must every real estate broker maintain?
options:
  - A designated main office open to the public
  - A separate escrow account for each transaction
  - A minimum of two branch offices
  - A written policy on advertising
key: A
explanation: Under N.J. Stat. Ann. § 45:15-12, every real estate broker is required to maintain a
  designated main office that is open to the public. The option stating that a broker must maintain
  a designated main office open to the public matches this requirement. The option about a separate
  escrow account for each transaction is not required by this section; escrow account rules appear
  elsewhere in the statutes.
