stem: A broker receives $12,000 in earnest money from a buyer and deposits it into his personal
  checking account. Which violation of N.J. Stat. Ann. § 45:15-12.5 does this constitute?
options:
  - Failure to maintain a special trust or escrow account for broker monies
  - Failure to display the license certificate at the office
  - Failure to pay the branch office license fee
  - Failure to provide a written disclosure of a promotion over $1,000
key: A
explanation: The statute requires every broker to deposit all monies received while acting as a real
  estate broker into a special trust or escrow account maintained at an approved institution.
  Depositing earnest money into a personal checking account violates this requirement. The option
  about failing to display the license certificate at the office concerns office display rules,
  which are unrelated to the handling of earnest money under this section.
