  url: null
  quoted_text: Every individual, partnership or corporation licensed as a real estate broker shall
    maintain in a State or federally chartered bank, savings bank, savings and loan association or
    other depository institution physically located and authorized to transact business in this
    State and approved by the commission a special account into which the broker shall deposit and
    maintain all monies received while acting in the capacity of a real estate broker, or as escrow
    agent, or as the temporary custodian of funds of others in real estate transactions in this
    State.
