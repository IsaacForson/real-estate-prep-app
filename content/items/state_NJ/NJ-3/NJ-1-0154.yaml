stem: A licensee intends to place fill soil in a freshwater wetland to construct a driveway. Based
  on the definition of "regulated activity" in the New Jersey Freshwater Wetlands Protection Act, is
  a freshwater wetlands permit required for this action?
options:
  - A permit is required because filling with soil is considered filling with any materials, which
    is a regulated activity
  - A permit is not required because the activity involves only soil, which is not listed as a
    regulated material
  - A permit is not required because filling with soil is considered normal landscaping and is
    exempt under the act
  - A permit is required only if the fill exceeds 10 cubic yards, otherwise it is exempt
key: A
explanation: Filling with any materials is a regulated activity under N.J.S.A. 13:9B-3(3). Placing
  fill soil in a freshwater wetland constitutes filling, so a permit is required. The distractors
  incorrectly claim exemptions or size limits that are not present in the statute.
