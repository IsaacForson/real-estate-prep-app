stem: According to N.J.S.A. 40:55D-2, which of the following is a purpose of the Municipal Land Use Law?
options:
  - To increase municipal tax revenue through higher property assessments and allocate additional
    funds for community infrastructure projects and support sustainable growth
  - To require municipalities to prioritize industrial development over residential use and exempt
    factories from zoning restrictions and promote economic vitality
  - To encourage municipal action to guide the appropriate use or development of all lands in this
    State, in a manner which will promote the public health, safety, morals, and general welfare
  - To mandate that all new construction include affordable housing units and provide subsidies for
    low-income families while ensuring compliance with state regulations
key: C
explanation: The statute lists promoting public health, safety, morals, and general welfare as a
  purpose of the Municipal Land Use Law. The other options describe goals not mentioned in the
  statute.
