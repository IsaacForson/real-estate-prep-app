    2025-08-08 because njleg.state.nj.us refuses connections from this network — § 15-12.1
  url: null
  quoted_text: No license shall be issued or renewed by the commission to any person known by it to
    have been convicted of any sex offense that would qualify the person for registration pursuant
    to section 2 of P.L.1994, c.133 (C.2C:7-2) or under an equivalent statute of another state or
    jurisdiction.
