stem: An applicant for a real estate salesperson license was convicted of a sex offense that
  requires registration under Megan’s Law. According to N.J. Stat. Ann. § 45:15-12.1, what action
  must the commission take regarding the application?
options:
  - Approval of the license application despite the conviction.
  - Denial of the license application based on the conviction.
  - Referral of the applicant to the Attorney General for evaluation.
  - Hold of the license application pending further review.
key: B
explanation: The statute prohibits issuing or renewing a license to anyone known to have been
  convicted of a sex offense requiring registration. Therefore the commission must deny the
  application. The option stating that the license application should be approved despite the
  conviction contradicts the statutory prohibition.
