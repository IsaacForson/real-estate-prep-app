    2025-08-08 because njleg.state.nj.us refuses connections from this network — § 15-12.1
  url: null
  quoted_text: No license shall be issued by the commission to any person known by it to have been,
    within five years theretofore, convicted of forgery, burglary, robbery, any theft offense other
