stem: A real estate applicant was convicted of robbery four years ago. According to N.J. Stat. Ann.
  § 45:15-12.1, what action must the commission take regarding the license application?
options:
  - Issue the license after the applicant completes a rehabilitation program
  - Refer the case to the Attorney General for prosecution
  - Issue the license because the conviction is older than five years
  - Deny the license because the conviction is within five years
key: D
explanation: The law bars issuance of a license to anyone convicted of robbery within the preceding
  five years. Since the conviction occurred four years ago, it falls within that window, requiring
  denial. The option suggesting issuance because the conviction is older than five years misapplies
  the time period.
