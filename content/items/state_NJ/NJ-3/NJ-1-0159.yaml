stem: Under the Farmland Assessment Act, for how many successive years immediately preceding the tax
  year must land be actively devoted to agricultural or horticultural use to qualify for farmland
  assessment?
options:
  - One year
  - Two years
  - Three years
  - Four years
key: B
explanation: The statute explicitly requires land to have been devoted for at least the two
  successive years immediately preceding the tax year in issue. Therefore, two years is the minimum
  period needed. The distractor of three years incorrectly adds an extra year not required by the
  law.
