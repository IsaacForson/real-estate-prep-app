stem: A broker commits a second violation of the real estate license law after having been
  previously penalized for a first violation. What is the maximum administrative penalty the
  commission may impose for this subsequent violation under N.J. Stat. Ann. § 45:15-17?
options:
  - $5,000
  - $10,000
  - $15,000
  - $20,000
key: B
explanation: The statute specifies a penalty of not more than $5,000 for a first violation and not
  more than $10,000 for any subsequent violation. The distractor listing $5,000 is incorrect because
  that amount applies only to a first offense, not a subsequent one.
