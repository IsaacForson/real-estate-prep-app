stem: A tenant in Jersey City proposes to include a lease provision that waives the tenant’s right
  to receive the annual statement of tenant and landlord rights, and the landlord agrees to include
  it in the written lease. Assuming this is the only violation of the Truth-in-Renting Act, is the
  landlord liable for a penalty under N.J.S.A. 46:8-48?
options:
  - The landlord is not liable because the lease provision originated from the tenant.
  - The landlord is liable for a penalty because the lease provision violates the tenant’s right to
    receive the statement.
  - The landlord is liable for a penalty only if the tenant did not sign the lease.
  - The landlord is not liable because the statement must be provided in English and Spanish.
key: A
explanation: The statute provides an exception that shields the landlord from penalty when the
  prohibited lease provision originated from the tenant, not the landlord. Since the tenant proposed
  the waiver, the landlord is not liable. The other options either ignore this exception or rely on
  irrelevant factors.
citation:
  source: N.J. Stat. Ann. § 46:8-48
  url: null
  quoted_text: No landlord shall be liable to any penalty under section 5 of this act nor any lease
    termination by a tenant under section 6 of this act, for any lease provision in violation of
    section 6 of this act where the proposal to include such lease provision originated from the
    tenant and not such landlord.
