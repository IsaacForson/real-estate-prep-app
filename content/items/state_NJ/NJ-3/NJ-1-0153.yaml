stem: According to the New Jersey Freshwater Wetlands Protection Act, what is the definition of a
  "freshwater wetland"?
options:
  - An area that is inundated or saturated by surface water or groundwater at a frequency and
    duration sufficient to support, and that under normal circumstances does support, a prevalence
    of vegetation typically adapted for life in saturated soil conditions, commonly known as
    hydrophytic vegetation
  - An area that is inundated only by tidal waters and supports vegetation adapted to saline
    conditions, typically found in coastal marshes and estuaries, and is subject to regular tidal
    flooding that influences soil salinity and plant community composition
  - An area that is dry for most of the year but becomes saturated during heavy rainfall events,
    supporting only temporary pools and moisture-tolerant grasses, and the saturated period
    typically lasts less than two weeks before evaporation returns the soil to dry conditions
  - An area that supports only upland vegetation and is rarely inundated by water, relying solely on
    precipitation for soil moisture, and the vegetation consists of species such as oak, hickory,
    and grasses that require well‑drained soils
key: A
explanation: The statute defines a freshwater wetland as an area inundated or saturated by surface
  or groundwater sufficiently to support hydrophytic vegetation under normal circumstances. The
  other options describe tidal wetlands, temporary saturation, or upland areas, which do not match
  the statutory definition.
