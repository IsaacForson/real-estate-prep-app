stem: A leasehold interest for 99 years or more in a residential property is transferred. The
  assessed value of the property for local real property tax purposes is $180,000, and the county
  percentage level established for the current year is 115%. According to N.J.S.A. 46:15-5(c), what
  is the consideration for the transfer?
options:
  - $180,000
  - $207,000
  - $153,000
  - $156,522
key: B
explanation: "The consideration for a 99‑year‑or‑more leasehold interest equals the assessed value
  adjusted by the county percentage level: $180,000 × 1.15 = $207,000. The other amounts result from
  failing to adjust, using the inverse percentage, or dividing instead of multiplying."
citation:
  source: N.J. Stat. Ann. tit. 46, ch. 15 — New Jersey Statutes Title 46, Chapter 15 — Realty Transfer
    Fee (N.J.S.A. 46:15-1 et seq.), extracted from the New Jersey Legislature's official full-text
    statutes download (STATUTES-TEXT.zip dated 2025-08-07) read via Internet Archive capture of
    2025-08-08 — § 15-5(c)
  url: null
  quoted_text: In the case of a leasehold interest for 99 years or more as defined in subsection (a)
    of this section, the consideration shall be in the amount of the assessed value of the property
    at the date of the transaction for the purpose of levying local real property taxes adjusted to
    reflect the true value in accordance with the county percentage level established for the
    current year.
  secondary: []
math:
  worked_solution: |-
    115% ÷ 100 = 1.15
    $180,000 × 1.15 = $207,000
  formulas:
    - Consideration = Assessed Value × (County Percentage Level / 100)
