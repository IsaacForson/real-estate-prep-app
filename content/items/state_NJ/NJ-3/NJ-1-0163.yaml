stem: A landlord receives the annual statement of tenant and landlord rights from the Department of
  Community Affairs on June 1. By what date must the landlord distribute a copy of the statement to
  existing tenants?
options:
  - By June 30
  - By July 1
  - By May 31
  - By August 1
key: B
explanation: The law requires distribution within 30 days after the statement is made available by
  the department. Adding 30 days to June 1 yields July 1.
