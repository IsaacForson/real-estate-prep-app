stem: A landowner owns 6 acres of land that has been used to grow vegetables for sale for the past
  12 months. The landowner applies for farmland assessment under the Farmland Assessment Act.
  According to N.J. Stat. Ann. § 54:4-23.2, what is the correct outcome?
options:
  - The land qualifies for farmland assessment and is assessed at its agricultural value.
  - The land does not qualify for farmland assessment because it has not been devoted for at least
    two successive years.
  - The land qualifies for farmland assessment only if the owner submits a forest stewardship plan.
  - The land qualifies for farmland assessment but must be assessed at market value until the second
    year is completed.
key: B
explanation: The Farmland Assessment Act requires that land be devoted to agricultural or
  horticultural use for at least the two successive years immediately preceding the tax year (N.J.
  Stat. Ann. § 54:4-23.2). Since the land has only been used for vegetables for the past 12 months,
  it does not meet this two‑year requirement and therefore does not qualify for farmland assessment.
  The suggestion that qualification depends on submitting a forest stewardship plan applies only to
  woodland, not to vegetable crops.
