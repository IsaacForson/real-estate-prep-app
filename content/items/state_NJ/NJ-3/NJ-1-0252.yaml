stem: A broker-salesperson has been licensed for 42 years and is applying for biennial license
  renewal. Under N.J.S.A. 45:15-16.2a, is this person required to complete continuing education?
options:
  - Yes, they must complete up to 16 hours of continuing education.
  - Yes, they must complete 8 hours of continuing education.
  - No, they are exempt because they have 40 or more years of experience.
  - No, but they must still complete 4 hours of continuing education.
key: C
explanation: The statute exempts brokers or broker-salespersons with 40 or more years of experience
  from the continuing education requirement. Since the broker-salesperson has 42 years, they are
  exempt, making options requiring any CE incorrect.
