stem: A licensee plans to construct a small pier by driving wooden pilings into a freshwater
  wetland. Under N.J.S.A. 13:9B-3, is a freshwater wetlands permit required before driving the
  pilings?
options:
  - Under the act, a permit is required because driving pilings is a regulated activity
  - Under the act, a permit is not required because driving pilings is considered linear development
  - Under the act, a permit is not required because the pier is temporary and does not disturb the
    wetland
  - Under the act, a permit is required only if the pilings exceed three feet in length
key: A
explanation: The statute lists driving of pilings as a regulated activity, which requires a
  freshwater wetlands permit. The claim that a permit is not required because driving pilings is
  considered linear development is incorrect, because the definition of linear development does not
  exempt regulated activities.
