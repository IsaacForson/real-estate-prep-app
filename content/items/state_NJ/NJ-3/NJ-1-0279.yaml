stem: A licensee plans to install a septic system that requires excavation of soil in an area
  identified as a freshwater wetland. Under N.J.S.A. 13:9B-3, is a freshwater wetlands permit
  required before beginning the excavation?
options:
  - Yes, a permit is required because excavation of soil is a regulated activity
  - No, a permit is not required because septic system installation is exempt
  - No, a permit is not required because only filling with materials requires a permit
  - No, a permit is not required because the activity affects less than one acre of wetland
key: A
explanation: The definition of regulated activity includes the removal, excavation, disturbance or
  dredging of soil, sand, gravel, or aggregate material. Excavation for a septic system therefore
  constitutes a regulated activity requiring a freshwater wetlands permit. The exemptions listed do
  not apply to excavation, and size thresholds are not mentioned in the statute for this activity.
