stem: A licensee's client plans to install an underground gas pipeline across a freshwater wetland
  to connect two properties. Does this activity require a freshwater wetlands permit under the Act?
options:
  - No, because pipeline installation is considered linear development and is exempt
  - No, because the activity involves the placement of obstructions, which is not regulated
  - Yes, because installing the pipeline requires excavation or disturbance of soil, a regulated
    activity
  - Yes, but the permit requirement does not depend on pipeline length
key: C
explanation: The Act defines regulated activity to include removal, excavation, disturbance or
  dredging of soil (N.J. Stat. Ann. § 13:9B-3). Installing a pipeline entails excavation of soil,
  thus a permit is required. The claim that pipeline installation is exempt as linear development is
  not supported by the Act.
