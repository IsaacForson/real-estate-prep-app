stem: An applicant for a real estate salesperson license was convicted of burglary six years ago.
  According to N.J. Stat. Ann. § 45:15-12.1, what action must the commission take regarding the
  license application?
options:
  - Imposition of fine
  - Placement on probation
  - Denial of application
  - Approval of application
key: D
explanation: The statute bars licensure only for convictions within five years; a conviction six
  years old is outside that period, so the commission may issue the license. The denial option
  applies only to recent convictions within the five-year window.
