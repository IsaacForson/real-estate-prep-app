stem: A broker-salesperson has been actively licensed as a broker-salesperson for 38 years and is
  applying for biennial license renewal. Under N.J.S.A. 45:15-16.2a, is this person required to
  complete continuing education?
options:
  - No, they are exempt because they have over 35 years of experience.
  - Yes, but they only need to complete 8 hours of continuing education.
  - Yes, they must complete the continuing education requirement.
  - No, they are exempt because they have over 30 years of experience.
key: C
explanation: The exemption applies only to those with 40 or more years of experience; at 38 years
  the licensee does not qualify and must complete the CE requirement (up to 16 hours). The
  distractor claiming exemption for over 30 years misstates the threshold.
citation:
  source: "### N.J. Stat. Ann. tit. 45, ch. 15 — New Jersey Statutes Title 45, Chapter 15 — Real
    Estate Brokers and Salespersons (N.J.S.A. 45:15-1 to 45:15-42, incl. Real Estate Sales Full
    Disclosure Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official
    full-text statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive
    capture of 2025-08-08 because njleg.state.nj.us refuses connections from this network — §
    15-16.2a"
  url: null
  quoted_text: This subsection shall not apply to any real estate broker or broker-salesperson who has
    been a real estate broker or broker-salesperson for 40 years or more, which shall include any
    equivalent experience in any other jurisdiction as determined by the commission.
