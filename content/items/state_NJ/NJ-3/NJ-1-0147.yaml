stem: Under N.J. Stat. Ann. § 54:4-23.3a, how often must the Commissioner of the Department of
  Environmental Protection conduct an on-site inspection after the initial three‑year period?
options:
  - A biennial inspection
  - An annual inspection
  - A quinquennial inspection
  - A triennial inspection
key: D
explanation: The statute requires that after the first three years, inspections occur not less
  frequently than once every three years, making a triennial inspection correct. An annual
  inspection would be more frequent than the minimum required.
