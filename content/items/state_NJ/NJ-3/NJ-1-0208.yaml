stem: A broker opens three branch offices in different towns, each under the direct supervision of a
  broker-salesperson. What is the total fee the broker must pay to the commission for the branch
  office licenses under N.J. Stat. Ann. § 45:15-12?
options:
  - $50.00
  - $100.00
  - $150.00
  - $200.00
key: C
explanation: Each branch office license requires a $50 fee. Multiplying $50 by three offices yields
  $150. The $100.00 option corresponds to only two offices.
