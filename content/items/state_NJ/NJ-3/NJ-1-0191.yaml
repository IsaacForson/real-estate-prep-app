stem: A landowner files a farmland assessment application on July 1, 2021. The Commissioner’s first
  on‑site inspection takes place on August 1, 2024. According to N.J. Stat. Ann. § 54:4-23.3a, is
  this inspection timing compliant?
options:
  - The inspection timing is compliant because it occurred after the first three years.
  - The inspection timing is compliant because it occurred within the first three years after
    application.
  - The inspection timing is not compliant because it occurred within the first three years.
  - The inspection timing is not compliant because it occurred after the first three years.
key: D
explanation: The statute requires the on‑site inspection to occur "during one of the first three
  years in which applications are received." An inspection in August 2024 falls outside the
  2021‑2023 window, violating this requirement. Therefore the timing is not compliant. The
  distractor asserting compliance because the inspection occurred within the first three years is
  incorrect, as the inspection actually occurred after that period.
