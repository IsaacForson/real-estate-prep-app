stem: A contractor excavates soil to install a septic system in an area identified as a freshwater
  wetland. Under the Freshwater Wetlands Protection Act, does this activity require a freshwater
  wetlands permit?
options:
  - Yes, but only if the wetland has been officially designated by the Department of Environmental
    Protection.
  - No, because installing a septic system is exempt from permit requirements.
  - Yes, because excavation of soil is a regulated activity requiring a permit.
  - No, because the activity occurs only near, not in, the freshwater wetland.
key: C
explanation: Excavation of soil is expressly listed as a regulated activity under the act, which
  requires a freshwater wetlands permit. The exemption for installing a septic system is not
  mentioned in the provided text, so it does not apply.
