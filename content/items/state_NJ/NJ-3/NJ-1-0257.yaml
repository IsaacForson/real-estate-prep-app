stem: A broker voluntarily surrendered her license in January. In March, the commission receives a
  verified complaint alleging false promises that occurred in February while she was still licensed.
  May the commission investigate under N.J.S.A. 45:15-17?
options:
  - Yes, the commission may investigate
  - No, the commission may not investigate
  - Yes, but only if the broker re‑applies
  - No, unless the surrender was involuntary
key: A
explanation: The statute provides that the lapse or suspension of a license, or the voluntary
  surrender of a license, does not deprive the commission of jurisdiction to investigate, provided
  the alleged charges arose while the licensee was duly licensed. Since the alleged conduct occurred
  in February while the broker was still licensed, the commission may proceed.
