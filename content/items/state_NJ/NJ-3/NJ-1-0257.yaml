    Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official full-text
    statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive capture of
    2025-08-08 because njleg.state.nj.us refuses connections from this network — § 15-17
  url: null
  quoted_text: The lapse or suspension of a license by operation of law or the voluntary surrender of
    a license by a licensee shall not deprive the commission of jurisdiction to proceed with any
    investigation as herein provided or prevent the commission from taking any regulatory action
    against such licensee, provided, however, that the alleged charges arose while said licensee was
    duly licensed.
