stem: A natural person works under a licensed broker through a referral company, only referring
  prospects to that broker and receiving compensation solely from that broker. According to N.J.
  Stat. Ann. § 45:15-3, how is this person classified?
options:
  - The individual is classified as a real estate salesperson who works through a referral company.
  - The individual is classified as a real estate broker who also performs salesperson duties.
  - The individual is classified as a real estate broker who supervises sales activities.
  - The individual is classified as a real estate referral company that employs salespersons.
key: A
explanation: The definition of a real estate salesperson licensed with a real estate referral
  company matches someone employed under a broker via a referral company whose activities are
  limited to referring prospects and who receives compensation only from that broker. The other
  options describe roles requiring broker licensing or supervision, which the scenario does not
  satisfy.
