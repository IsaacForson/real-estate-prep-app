stem: A broker‑salesperson receives an earnest money deposit from a buyer and deposits it into her
  personal checking account. Is this permissible under N.J. Stat. Ann. § 45:15‑12.5?
options:
  - The action is permissible because the special‑account requirement does not apply to individuals
    licensed as broker‑salespersons
  - The action is impermissible because all licensees must deposit trust funds into a
    commission‑approved escrow account
  - The action is permissible provided the broker‑salesperson also holds a broker license in the
    same state
  - The action is impermissible because earnest money must be held in a separate interest‑bearing
    account
key: A
explanation: The statute explicitly states that the provisions requiring a special trust or escrow
  account do not apply to an individual licensed as a broker‑salesperson. Hence, depositing earnest
  money into a personal account is not prohibited by this rule. The other options incorrectly impose
  the broker‑level requirement on broker‑salespersons or add conditions not found in the statute.
