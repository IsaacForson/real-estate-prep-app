stem: What must be true about the size of the text for the disclosure and notice in a rebate
  advertisement under N.J.S.A. 45:15-16b?
options:
  - The disclosure and notice text must be equal to or larger than the advertisement text.
  - The disclosure and notice text must be smaller than the advertisement text.
  - The disclosure and notice text must be at least 12 points larger than the advertisement text.
  - The disclosure and notice text must be exactly the same size as the advertisement text.
key: A
explanation: Under N.J.S.A. 45:15-16b(b), the disclosure and notice must be clearly and
  conspicuously displayed, and the size of the text in the notice and disclosure must be equal to or
  larger than the size of the text used for the advertisement.
