stem: A landowner has 4 acres of land that has been actively devoted to agricultural use for the
  past three years. Does this land qualify for farmland assessment under N.J. Stat. Ann. §
  54:4-23.2?
options:
  - No, because the land is less than the required five acres.
  - Yes, because the land meets the required years of agricultural use.
  - No, because the land has not been used for five successive years.
  - Yes, because the land has been used agriculturally for more than two years.
key: A
explanation: To qualify for farmland assessment, N.J. Stat. Ann. § 54:4-23.2 requires land of not
  less than 5 acres in area. Since the landowner’s parcel is only 4 acres, it does not satisfy the
  acreage requirement despite meeting the years-of-use condition. The distractor suggesting
  qualification based on years of use is incorrect because both acreage and duration must be
  satisfied.
