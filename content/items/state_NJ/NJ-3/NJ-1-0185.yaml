stem: A buyer purchases a house for $300,000 cash and agrees to assume the seller's mortgage of
  $50,000. The property has unpaid water charges of $1,500 for the current year that will be paid by
  the buyer at closing. According to N.J.S.A. 46:15-5(c), what is the consideration for the deed?
options:
  - $351,500
  - $350,000
  - $300,000
  - $400,000
key: B
explanation: The consideration consists of the cash payment plus any assumed mortgage, while water
  charges are expressly excluded from consideration. Adding the cash ($300,000) and assumed mortgage
  ($50,000) yields $350,000; the $1,500 water charges are not included. The incorrect option that
  adds the water charges results from mistakenly treating them as part of the consideration.
citation:
  source: N.J. Stat. Ann. tit. 46, ch. 15 § 46:15-5(c)
  url: null
  quoted_text: The amount of liens for real property taxes, water or sewerage charges for the current
    or any subsequent year, or by way of added assessment or other adjustment, as well as of other
    like liens or encumbrances of a current and continuing nature ordinarily adjusted between the
    parties according to the period of ownership shall be excluded as an element in determining the
    consideration, notwithstanding that such amount is to be paid by the grantee.
  secondary: []
math:
  worked_solution: |-
    Step 1: Identify cash payment = $300,000.
    Step 2: Identify assumed mortgage = $50,000.
    Step 3: Add cash and mortgage: $300,000 + $50,000 = $350,000.
    Step 4: Note water charges of $1,500 are excluded per N.J.S.A. 46:15-5(c) and are not added.
    Step 5: Consideration = $350,000.
  formulas:
    - Consideration = Cash + Assumed Mortgage (excluded liens not added)
