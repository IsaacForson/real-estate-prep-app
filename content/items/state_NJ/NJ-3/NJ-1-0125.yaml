stem: A developer proposes to clear 6,000 square feet of land for a commercial parking lot in the
  Pinelands area. According to N.J. Stat. Ann. § 13:18A-3(g), is this considered a major
  development?
options:
  - The project qualifies as a major development because it involves clearing more than 5,000 square
    feet for a non-agricultural purpose
  - The project does not qualify as a major development because the cleared area is less than three
    acres
  - The project qualifies as a major development only if it also includes construction of a housing
    development with five or more units
  - The project does not qualify as a major development because agricultural use is exempt from the
    clearing threshold
key: A
explanation: Under N.J. Stat. Ann. § 13:18A-3(g), major development includes any grading, clearing,
  or disturbance of an area exceeding 5,000 square feet for purposes other than agricultural or
  horticultural. The proposed clearing of 6,000 square feet for a commercial parking lot exceeds
  this threshold, so it qualifies as a major development.
