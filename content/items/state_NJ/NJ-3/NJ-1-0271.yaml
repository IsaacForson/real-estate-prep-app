  url: null
  quoted_text: Every landlord shall distribute one copy of the statement prepared and made available
    pursuant to the provisions of this act to each of their tenants within 30 days after it has been
    made available by the department and shall thereafter provide a copy of the current statement to
    each new tenant at or prior to the time he assumes occupancy of the dwelling. In addition, every
    landlord shall keep a copy of the current statement posted in one or more locations so that the
    statement is prominent and accessible to all his tenants.
