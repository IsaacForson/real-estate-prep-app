stem: A landlord receives the annual statement of tenant rights from the Department of Community
  Affairs and posts it in the laundry room of the building, but does not give a copy to each
  existing tenant. Thirty days have passed since the statement was made available. Which statement
  best describes the landlord's compliance?
options:
  - The landlord is exempt because the building contains fewer than three rental units.
  - The landlord must also provide a receipt for any cash rent collected.
  - The landlord has complied because posting the statement satisfies the requirement.
  - The landlord has not complied because distribution to each tenant is required within 30 days.
key: D
explanation: N.J. Stat. Ann. tit. 46, ch. 8 — § 46:8-46 requires landlords to distribute one copy of
  the statement to each tenant within 30 days after it is made available and to keep a copy posted.
  Posting alone does not fulfill the distribution duty, the owner‑occupied exemption does not
  relieve this duty, and receipts pertain to cash payments, not distribution.
