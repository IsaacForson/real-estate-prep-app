stem: Under the Farmland Assessment Act, what is the minimum period of active agricultural or
  horticultural devotion required for land to qualify for assessment based on its agricultural
  value?
options:
  - One year of active devotion
  - Two successive years of active devotion
  - Three years of active devotion
  - Five years of active devotion
key: B
explanation: The statute specifies that land must have been actively devoted for at least the two
  successive years immediately preceding the tax year in issue. Therefore, two successive years is
  the required period. The option stating one year is incorrect because the law explicitly demands
  two successive years.
