stem: A licensee seeks to install an underground sewer pipe that will traverse a freshwater wetland.
  According to the New Jersey Freshwater Wetlands Protection Act, is a freshwater wetlands permit
  required for this installation?
options:
  - A permit is required because installing a sewer pipe involves placing obstructions and/or
    filling, which are regulated activities
  - A permit is not required because linear development activities such as sewer pipes are expressly
    exempt from permit requirements
  - A permit is required only if the pipe diameter exceeds 24 inches; smaller installations are
    exempt
  - A permit is not required because the installation occurs entirely beneath the wetland surface
    and does not disturb the water table
key: A
explanation: Installing a sewer pipe entails placing obstructions and/or filling materials within
  the wetland, both of which are listed as regulated activities under subsections (3) and (5). The
  statute provides no exemption for underground utilities or subsurface work, so a permit is
  required.
