stem: A landlord receives the annual statement of tenant and landlord rights from the Department of
  Community Affairs and places it in a filing cabinet but does not post it in any rental unit. Has
  the landlord complied with the posting requirement under N.J. Stat. Ann. § 46:8-46?
options:
  - The landlord has not complied because the statement must be distributed to each tenant.
  - The landlord has not complied because the statement must be posted prominently.
  - The landlord has complied because the statement is retained on file.
  - The landlord has complied because tenants can request a copy.
key: B
explanation: The law requires landlords to keep a copy of the statement posted in one or more
  locations so that it is prominent and accessible to all tenants. Merely retaining the statement on
  file or relying on tenant requests does not satisfy this posting duty.
