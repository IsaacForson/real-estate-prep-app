stem: Under N.J.S.A. 45:15-16(a), from whom may a real estate salesperson accept a commission?
options:
  - His employer or contracting broker who is licensed
  - The buyer or seller involved in the transaction
  - Any licensed real estate broker in the state
  - The closing agent or escrow company handling closing
key: A
explanation: The statute states that a salesperson may accept commission only from his employer or
  contracting broker, who must be a licensed real estate broker. Therefore, the correct answer is
  that the salesperson may accept commission from his employer or contracting broker who is
  licensed. The distractor suggesting the buyer or seller is incorrect because the statute prohibits
  accepting commission from any person other than the employer or contracting broker.
