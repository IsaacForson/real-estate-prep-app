stem: A corporation applies for a New Jersey broker license. Its board of directors includes a
  17‑year‑old member. According to N.J. Stat. Ann. § 45:15-9, what is the correct determination?
options:
  - The application is approved because the corporation meets the age requirement.
  - The application is denied because a director is under 18 years of age.
  - The application is approved pending a waiver from the commission.
  - The application is denied because the corporation lacks a resident director.
key: B
explanation: The statute requires every director of a corporation applying for a broker license to
  be at least 18 years old. Since one director is 17, the corporation fails this requirement and the
  application must be denied. The distractor claiming approval because the corporation meets the age
  requirement is wrong because the rule applies to each director individually, not to the
  corporation as a whole.
