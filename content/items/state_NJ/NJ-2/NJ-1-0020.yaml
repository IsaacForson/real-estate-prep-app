stem: A licensed salesperson who completed the standard salesperson pre-licensure coursework applies
  for a broker license without any additional education. Based on N.J. Stat. Ann. § 45:15-10.1, what
  is the problem with this application?
options:
  - Broker applicants need no coursework beyond passing the state exam
  - Broker applicants repeat just the fair housing course segment
  - Broker applicants finish a longer course of study overall
  - Broker applicants complete the same coursework as salespersons
key: C
explanation: Section 45:15-10.1 requires broker and broker-salesperson applicants to complete 150
  hours of pre-licensure education, twice the 75 hours required of salesperson applicants, including
  additional ethics instruction.
