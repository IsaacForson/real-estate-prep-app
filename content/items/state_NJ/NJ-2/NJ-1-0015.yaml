stem: A woman regularly negotiates rental agreements for property owners in exchange for a
  commission but has never obtained a license. Under the definition in N.J. Stat. Ann. § 45:15-3,
  which term describes her conduct?
options:
  - Acting as a bona fide owner leasing her property
  - Acting as a real estate broker without a license
  - Acting as an attorney handling a real estate closing
  - Acting as a court-appointed receiver of real estate
key: B
explanation: Section 45:15-3 defines a real estate broker as anyone who, for a fee or commission,
  negotiates the sale, exchange, purchase, or rental of real estate for others.
citation:
  source: N.J. Stat. Ann. § 45:15-3
  url: null
  quoted_text: A real estate broker, for the purposes of R.S.45:15-1 et seq., is defined to be a
    person, firm or corporation who, for a fee, commission or other valuable consideration, or by
    reason of a promise or reasonable expectation thereof, lists for sale, sells, exchanges, buys or
    rents, or offers or attempts to negotiate a sale, exchange, purchase or rental of real estate or
    an interest therein
