stem: An applicant is 19 years old and has completed a General Educational Development (GED)
  certificate but has not completed high school. Under N.J. Stat. Ann. § 45:15-9, is the applicant
  eligible for a real estate salesperson license?
options:
  - Yes, because the GED satisfies the high school education requirement.
  - No, because only a traditional high school diploma is accepted.
  - Yes, but only if the applicant also completes 60 hours of pre-licensing education.
  - No, because the applicant must be at least 21 years old.
key: A
explanation: The statute requires the equivalent of a high school education, which a GED satisfies,
  making the applicant eligible. The claim that only a traditional diploma is accepted ignores the
  equivalency provision. Pre‑licensing hours are a separate requirement not addressed in this
  section, and the minimum age is 18, not 21.
