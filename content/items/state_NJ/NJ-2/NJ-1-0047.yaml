stem: An applicant for a New Jersey real estate salesperson license has a prior conviction for
  disorderly conduct. Under N.J. Stat. Ann. § 45:15-9, what may the commission consider when
  reviewing the application?
options:
  - The commission may only consider the applicant's credit score.
  - The commission may investigate and require proof of good moral character.
  - The commission must approve the license because the offense is unrelated to real estate.
  - The commission must automatically deny the license due to any criminal record.
key: B
explanation: The statute requires applicants to furnish evidence of good moral character and
  authorizes the commission to investigate and require such proof. Denial is not automatic, approval
  is not guaranteed, and credit score is not mentioned as a criterion.
