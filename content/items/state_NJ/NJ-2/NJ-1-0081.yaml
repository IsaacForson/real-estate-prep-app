stem: A limited partnership applies for a broker license; its general partner is a corporation that
  is not licensed as a broker in New Jersey. Under N.J. Stat. Ann. § 45:15-9, what is the correct
  determination?
options:
  - The license will be granted because the limited partnership has a broker-salesperson as an
    employee.
  - The license will be granted if the corporation employs a licensed broker as an officer.
  - The license will be granted after the partnership pays a $50 fee.
  - The license will be denied because the general partner must be a broker.
key: D
explanation: The law provides that a limited partnership may receive a broker license only if its
  general partner qualifies as and holds a broker license to act on the partnership’s behalf. If the
  general partner is a corporation, that corporation must itself be licensed as a broker and have an
  officer who holds the authorized broker license. Since the corporation is not licensed, the
  license must be denied.
