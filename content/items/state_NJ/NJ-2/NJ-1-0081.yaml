    Estate Brokers and Salespersons (N.J.S.A. 45:15-1 to 45:15-42, incl. Real Estate Sales Full
    Disclosure Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official
    full-text statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive
    capture of 2025-08-08 because njleg.state.nj.us refuses connections from this network — § 15-9"
  url: null
  quoted_text: No license as a broker shall be granted to a limited partnership unless its general
    partner qualifies as and holds a license as a broker to transact business in the name of and on
    behalf of the limited partnership. In the event that a corporation is a general partner of a
    limited partnership, no license as a broker shall be granted to the limited partnership unless
    the corporation is licensed as a broker and one of the officers of the corporation qualifies as
    and holds a license as the corporation's authorized broker.
