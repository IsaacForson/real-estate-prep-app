stem: Maria owns a duplex and handles all leasing, rent collection, and showing of the units
  herself, without holding a real estate license. Under N.J. Stat. Ann. § 45:15-4, is Maria required
  to have a real estate license for these activities?
options:
  - Maria must obtain a license because she is leasing property to tenants.
  - Maria does not need a license as she is a bona fide owner performing acts on her own property.
  - Maria must obtain a license only if she collects rent from tenants.
  - Maria does not need a license because she is not advertising the units for rent.
key: B
explanation: Under N.J. Stat. Ann. § 45:15-4, a bona fide owner who performs acts with reference to
  property they own is exempt from licensing requirements. Maria’s activities of leasing, collecting
  rent, and showing her own duplex fall within this owner exemption, so she does not need a license.
  The idea that leasing always requires a license overlooks this exemption for owners managing their
  own property.
