stem: An applicant has completed 70 hours of real estate coursework, including 2 hours of ethics
  training and 1 hour of fair housing instruction. Under N.J. Stat. Ann. § 45:15-10.1(a), how many
  additional total hours of real estate education must the applicant complete to be eligible for the
  salesperson examination?
options:
