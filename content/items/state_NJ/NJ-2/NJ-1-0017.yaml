stem: Before a newly hired salesperson may begin working under a broker in New Jersey, what does
  N.J. Stat. Ann. § 45:15-3.2 require?
options:
  - A verbal understanding confirmed by the Real Estate Commission
  - A notarized letter of recommendation from a prior employer
  - A surety bond filed with the county recording office clerk
  - A written agreement signed by the broker and the salesperson
key: D
explanation: Section 45:15-3.2 requires a written agreement signed by both the broker and the
  broker-salesperson or salesperson before the salesperson may commence business activity for the
  broker.
citation:
  source: N.J. Stat. Ann. § 45:15-3.2
  url: null
  quoted_text: No broker-salesperson or salesperson shall commence business activity for a broker and
    no broker shall authorize a broker-salesperson or salesperson to act on the broker's behalf
    until a written agreement, as provided in this subsection, has been signed by the broker and
    broker-salesperson or salesperson.
