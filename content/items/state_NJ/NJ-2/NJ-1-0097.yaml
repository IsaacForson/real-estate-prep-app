stem: A housing referral aide employed in a federally funded program also charges a fee to a tenant
  for providing a list of rental units. Under N.J. Stat. Ann. § 45:15-1.1, is the aide required to
  hold a real estate license for this activity?
options:
  - The aide must hold a license because the exemption under § 45:15-1.1 applies only to duties
    performed within the program.
  - The aide does not need a license because providing a list of rental units is not considered
    engaging in the business of a real estate broker.
  - The aide must hold a license because any fee for locating rental housing requires a license,
    even if exempt under other statutes.
  - The aide does not need a license because the exemption applies while performing duties in the
    federally funded program.
key: A
explanation: Under N.J. Stat. Ann. § 45:15-1.1, the exemption applies only while the aide is
  performing duties in the federally funded program; charging a fee for providing a rental list is
  outside those duties, so the aide must be licensed. The statement that providing a list of rental
  units is not considered engaging in the business of a real estate broker is incorrect because the
  exemption is limited to program duties.
