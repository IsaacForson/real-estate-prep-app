stem: A salesperson who is licensed with a real estate referral company applies for biennial license
  renewal. According to N.J. Stat. Ann. § 45:15-16.2a, what continuing education requirement
  applies?
options:
  - Sixteen hours of continuing education
  - Eight hours of continuing education
  - No continuing education requirement
  - Twenty-four hours of continuing education
key: C
explanation: The statute exempts salespersons licensed with a real estate referral company from the
  continuing education requirement for biennial renewal. Therefore, no continuing education is
  required. The sixteen‑ and twenty‑four‑hour distractors reflect the standard maximum, and the
  eight‑hour option is not mentioned in the law.
