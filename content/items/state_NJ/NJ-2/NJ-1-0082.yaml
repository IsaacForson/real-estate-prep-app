    Estate Brokers and Salespersons (N.J.S.A. 45:15-1 to 45:15-42, incl. Real Estate Sales Full
    Disclosure Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official
    full-text statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive
    capture of 2025-08-08 because njleg.state.nj.us refuses connections from this network — § 15-9"
  url: null
  quoted_text: No license as a broker shall be granted to a general partnership or corporation unless
    at least one of the partners or officers of said general partnership or corporation qualifies as
    and holds a license as a broker to transact business in the name and on behalf of said general
    partnership or corporation as its authorized broker and no such authorized broker shall act as a
    broker on his own individual account unless he is also licensed as a broker in his individual
    name; the license of said general partnership or corporation shall cease if at least one partner
    or officer does not hold a license as its authorized broker at all times. A change in the status
    of the license of an authorized broker to an individual capacity or vice versa shall be effected
    by application to the commission accompanied by a fee of $50.
