stem: A broker who is the authorized broker for a corporation decides to act as a broker in his
  individual name as well. Under N.J. Stat. Ann. § 45:15-9, what must he do to maintain both
  licenses?
options:
  - Complete an additional 30 hours of ethics education.
  - Obtain a separate broker license for his individual activities without any fee.
  - Submit a new application and pay a $50 fee to change the license status.
  - Cease acting as the corporation's authorized broker before engaging in individual brokerage.
key: C
explanation: The statute says an authorized broker may not act on his own individual account unless
  he is also licensed as a broker in his individual name, and that a change in the status of the
  license of an authorized broker to an individual capacity or vice versa requires an application to
  the commission accompanied by a $50 fee. Therefore, the broker must submit an application and pay
  the fee to add the individual license.
