stem: An applicant with a bachelor's degree in finance and three years of experience as a leasing
  agent seeks a waiver of the educational requirements for a broker license. Under N.J. Stat. Ann. §
  45:15-10.2, what must the commission determine to grant the waiver?
options:
  - Whether the applicant is employed by a licensed real estate brokerage firm
  - Whether the applicant has completed 150 hours of approved real estate coursework
  - Whether the applicant has passed the state-administered broker licensing examination
  - Whether the applicant meets the standard for substantial equivalence
key: D
explanation: The statute allows the commission to waive educational requirements if the applicant's
  education or experience is substantially equivalent to those requirements, which the commission
  must judge. The other options describe unrelated conditions.
citation:
  source: N.J. Stat. Ann. tit. 45, ch. 15 — New Jersey Statutes Title 45, Chapter 15 — Real Estate
    Brokers and Salespersons (N.J.S.A. 45:15-1 to 45:15-42, incl. Real Estate Sales Full Disclosure
    Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official full-text
    statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive capture of
    2025-08-08 because njleg.state.nj.us refuses connections from this network — § 15-10.2
  url: null
  quoted_text: The commission may waive some or all of the educational requirements for licensure
    established pursuant to subsection a. of section 1 of P.L.1966, c.227 (C.45:15-10.1) in the case
    of an applicant whose education or experience is in the judgment of the commission substantially
    equivalent to those educational requirements.
