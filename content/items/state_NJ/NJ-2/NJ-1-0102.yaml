stem: Under N.J. Stat. Ann. § 45:15-10.1(b), how many total hours of real estate education must an
  applicant complete to be eligible for the broker examination?
options:
  - 75 hours
  - 120 hours
  - 150 hours
  - 100 hours
key: C
explanation: The statute requires broker applicants to complete 150 hours of real estate education
  in the aggregate. The 75‑hour figure applies only to salesperson applicants, while 100 and 120
  hours are not mentioned in the law.
