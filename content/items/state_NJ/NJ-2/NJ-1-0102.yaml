  quoted_text: As a prerequisite to admission to an examination, every individual applicant for
    licensure as a real estate broker or broker-salesperson shall give evidence of satisfactory
    completion of 150 hours in the aggregate of such courses of education in real estate and related
    subjects at a school licensed by the commission as the commission shall by regulation prescribe.
