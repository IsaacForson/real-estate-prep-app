stem: Under N.J. Stat. Ann. § 45:15-9, what is required for a corporation to be licensed as a real
  estate broker in New Jersey?
options:
  - At least one officer must hold a broker license as the corporation's authorized broker.
  - All officers must hold broker licenses and be residents of New Jersey.
  - The corporation must have been in business for at least three years.
  - The corporation must submit a certificate of good standing from the Secretary of State.
key: A
explanation: "Under N.J. Stat. Ann. § 45:15-9, a broker license shall not be granted to a
  corporation unless at least one of its officers holds a broker license as the corporation's
  authorized broker. The other options add requirements not found in the statute: requiring all
  officers to be licensed, a three‑year business history, or a certificate of good standing."
citation:
  source: "### N.J. Stat. Ann. tit. 45, ch. 15 — New Jersey Statutes Title 45, Chapter 15 — Real
    Estate Brokers and Salespersons (N.J.S.A. 45:15-1 to 45:15-42, incl. Real Estate Sales Full
    Disclosure Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official
    full-text statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive
    capture of 2025-08-08 because njleg.state.nj.us refuses connections from this network — § 15-9"
  url: null
  quoted_text: No license as a broker shall be granted to a general partnership or corporation unless
    at least one of the partners or officers of said general partnership or corporation qualifies as
    and holds a license as a broker to transact business in the name and on behalf of said general
    partnership or corporation as its authorized broker
