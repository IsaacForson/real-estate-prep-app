stem: An applicant submits a broker license application on a self‑created form instead of the
  commission’s prescribed form. Based on N.J. Stat. Ann. § 45:15-9, what is the likely outcome?
options:
  - The application is processed after a fee penalty is applied.
  - The application is accepted because the information is complete.
  - The application is forwarded to the attorney general for review.
  - The application is rejected for not using the prescribed form.
key: D
explanation: The statute mandates that license applications be submitted on forms prescribed by the
  commission; using a self‑created form violates this requirement and results in rejection. The
  distractor asserting the application would be accepted if the information is complete is incorrect
  because compliance with the prescribed form is compulsory regardless of completeness.
