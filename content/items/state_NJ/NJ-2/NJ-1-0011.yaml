stem: Which activity requires a person to hold a New Jersey real estate license under N.J. Stat.
  Ann. § 45:15-1?
options:
  - Attending a real estate closing as an invited guest
  - Advertising oneself as authorized to act as a broker
  - Reading a listing agreement shared by a curious friend
  - Touring a neighbor's open house on a Sunday afternoon
key: B
explanation: Section 45:15-1 prohibits any person from advertising or representing himself as
  authorized to act as a broker, broker-salesperson, or salesperson without first obtaining a
  license.
citation:
  source: N.J. Stat. Ann. § 45:15-1
  url: null
  quoted_text: No person shall engage either directly or indirectly in the business of a real estate
    broker, broker-salesperson, or salesperson, temporarily or otherwise, and no person shall
    advertise or represent himself as being authorized to act as a real estate broker,
    broker-salesperson, or salesperson, or to engage in any of the activities described in
    R.S.45:15-3, without being licensed so to do as hereinafter provided.
