  url: null
  quoted_text: Every applicant for a license as a broker or broker-salesperson shall have first been
    the holder of a New Jersey real estate salesperson's license and have been actively engaged on a
    full-time basis in the real estate brokerage business in this State as a real estate salesperson
    for three years immediately preceding the date of application
