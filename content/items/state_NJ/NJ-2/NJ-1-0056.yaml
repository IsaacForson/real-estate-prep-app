stem: A real estate salesperson licensed in New Jersey has worked full-time for 24 months and
  applies for a broker license. According to N.J. Stat. Ann. § 45:15-9, what is the correct
  determination?
options:
  - The applicant is eligible with an out-of-state broker license.
  - The applicant is eligible for the broker license.
  - The applicant is ineligible due to insufficient experience.
  - The applicant is eligible after extra education.
key: C
explanation: The law requires three years of full-time experience as a New Jersey salesperson before
  applying for a broker license; 24 months is insufficient. The distractor about holding a broker
  license from another state does not apply because the applicant lacks that credential.
