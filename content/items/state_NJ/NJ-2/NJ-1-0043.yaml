stem: What educational requirement must an applicant for a New Jersey real estate broker,
  broker‑salesperson, or salesperson license meet?
options:
  - A high school education equivalent
  - A bachelor’s degree in real estate
  - A passing score on the state real estate exam
  - Completion of a 60‑hour pre‑license course
key: A
explanation: Under N.J.S.A. 45:15-9, every applicant for a broker, broker‑salesperson, or
  salesperson license must have the equivalent of a high school education. The statute does not
  require a bachelor’s degree, a specific pre‑license course, or passing the exam before licensure.
