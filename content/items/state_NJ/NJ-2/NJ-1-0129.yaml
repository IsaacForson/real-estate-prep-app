stem: Under N.J. Stat. Ann. § 45:15-3, which statement correctly defines a real estate
  broker-salesperson?
options:
  - A natural person who is qualified to be licensed as a real estate broker but who is employed or
    contracted by and operates under the supervision of a licensed real estate broker to perform the
    functions of a real estate broker as defined herein.
  - A natural person who is qualified to be licensed as a real estate broker but who is employed or
    contracted by and operates under the supervision of a licensed real estate broker to perform the
    functions of a real estate appraiser as defined herein.
  - A natural person who is qualified to be licensed as a real estate broker but who is employed or
    contracted by and operates under the supervision of a licensed real estate broker to perform the
    functions of a real estate salesperson as defined herein.
  - A natural person who is qualified to be licensed as a real estate broker but who is employed or
    contracted by and operates independently of any licensed real estate broker to perform the
    functions of a real estate broker as defined herein.
key: C
explanation: Under N.J. Stat. Ann. § 45:15-3, a broker‑salesperson is a natural person who meets the
  qualifications for a broker license but, for compensation, works under the supervision of a
  licensed broker to perform the functions of a real estate salesperson as defined in the statute.
