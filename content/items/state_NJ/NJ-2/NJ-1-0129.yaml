  quoted_text: A real estate broker-salesperson, for the purposes of R.S.45:15-1 et seq., is defined
    to be any natural person who is qualified to be licensed as a real estate broker but who, for
    compensation, valuable consideration or commission, or other thing of value, or by reason of a
    promise or reasonable expectation thereof, is employed or contracted by and operates under the
    supervision of a licensed real estate broker to perform the functions of a real estate
    salesperson as defined herein.
