stem: Under N.J. Stat. Ann. § 45:15-1.2, what is the penalty for an unlicensed person who charges a
  fee for locating rental housing before a lease is executed?
options:
  - The person is subject to a fine of not less than $200 or imprisonment for not more than 30 days,
    or both.
  - The person is subject to a fine of not less than $500 or imprisonment for not more than 60 days,
    or both.
  - The person is subject to a fine of not less than $100 or imprisonment for not more than 15 days,
    or both.
  - The person is subject to a fine of not less than $1,000 or imprisonment for not more than 90
    days, or both.
key: A
explanation: Under N.J. Stat. Ann. § 45:15-1.2, an unlicensed person who charges or accepts a fee
  for locating rental housing before lease execution is a disorderly person subject to a fine of not
  less than $200 or imprisonment for not more than 30 days, or both. The option stating a fine of
  not less than $500 or imprisonment for not more than 60 days, or both incorrectly increases the
  fine and imprisonment amounts, which are not supported by the statute.
