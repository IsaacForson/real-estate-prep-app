stem: A licensee shows a property to a prospective buyer and receives a commission for the showing,
  but no lease or sale is executed. Under N.J. Stat. Ann. § 45:15-2, does this act constitute
  engaging in business as a real estate broker or salesperson?
options:
  - The act constitutes engaging in business because any single act, transaction or sale constitutes
    engaging in business.
  - The act does not constitute engaging in business because no lease or sale was executed.
  - The act constitutes engaging in business only if the showing results in a signed lease or sale.
  - The act does not constitute engaging in business because the licensee did not negotiate a
    purchase or sale.
key: A
explanation: The statute defines engaging in business as any single act, transaction or sale; thus a
  showing for commission qualifies as an act that constitutes engaging in business. The option
  stating that the act does not constitute engaging in business because no lease or sale was
  executed is incorrect because the statute does not require a lease or sale to be executed for the
  act to count.
