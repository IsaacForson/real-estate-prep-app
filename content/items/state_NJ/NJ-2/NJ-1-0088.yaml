stem: A salesperson applicant completes a 75‑hour pre‑licensure course that includes 2 hours of
  ethics training and 1 hour of fair housing instruction. Under N.J. Stat. Ann. § 45:15-10.1(a),
  does this course satisfy the educational requirement for the salesperson examination?
options:
  - Yes, because the fair‑hour requirement is satisfied
  - No, because the ethics training is insufficient
  - Yes, because the total hours meet the 75‑hour minimum
  - No, because the course lacks any instruction on real estate law
key: B
explanation: The regulation requires at least three hours of ethics training; the course provides
  only two hours, so the ethics requirement is not met. While the course meets the total hour
  requirement and includes the required fair‑housing hour, the insufficient ethics training means
  the course does not satisfy the educational requirement.
