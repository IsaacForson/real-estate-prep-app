stem: Under N.J. Stat. Ann. § 45:15-1.1, a housing referral aide performing duties in a federally
  funded employment program is treated as which of the following?
options:
  - A person automatically licensed as a real estate salesperson
  - A person exempt from state and federal housing laws
  - A person not treated as engaged in a broker's business
  - A person required to complete broker pre-licensure courses
key: C
explanation: Section 45:15-1.1 provides that a housing referral aide performing duties under a
  federally funded employment program is not deemed to be engaged in the business of a broker,
  broker-salesperson, or salesperson.
citation:
  source: N.J. Stat. Ann. § 45:15-1.1
  url: null
  quoted_text: A person employed in a participant position as a housing referral aide under any
    program established and funded pursuant to the Comprehensive Employment and Training Act of
    1973, Pub.L. 93-203, 29 U.S.C. 801 et seq., while performing his duties in such position, shall
    not be deemed to be engaged in the business of a real estate broker, broker-salesperson or
    salesperson under the provisions of chapter 15 of Title 45 of the Revised Statutes.
