stem: A real estate school applying for a license in the first 12 months of a two‑year term seeks
  licensure for three locations. What is the total license fee the school must pay under N.J. Stat.
  Ann. § 45:15-10.6?
options:
  - $400
  - $600
  - $800
  - $1,000
key: C
explanation: The statute sets the license fee at $400 for the first location and $200 for each
  additional location during the first 12 months of a two‑year term. For three locations, the fee is
  $400 + 2 × $200 = $800. The $600 option would correspond to only two locations, and $1,000 to four
  locations.
