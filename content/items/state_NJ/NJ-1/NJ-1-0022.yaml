stem: A person who has been a licensed New Jersey real estate salesperson for two years applies for
  a broker license. Based on the statute, is the applicant eligible?
options:
  - No, unless the applicant passes an additional examination.
  - Yes, because holding a salesperson license satisfies the broker requirement.
  - Yes, if the applicant also holds a broker license from another state.
  - No, because the applicant must have three years of experience as a salesperson.
key: D
explanation: The statute (N.J. Stat. Ann. tit. 45, ch. 15, § 15‑9(a)) requires that an applicant for
  a broker license have been actively engaged as a licensed salesperson for three full years
  immediately before filing the application. Because the applicant has only two years of experience,
  the requirement is not satisfied, so the applicant is not eligible. The answer choice stating that
  the applicant is ineligible unless an additional examination is passed is incorrect; the law does
  not add an extra exam, it only mandates the three‑year experience requirement.
