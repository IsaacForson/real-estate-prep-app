stem: A licensee is found guilty of failure to account for or to pay over moneys belonging to others
  for the first time. What is the maximum penalty the commission may impose?
options:
  - $2,500.00
  - $4,000.00
  - $5,000.00
  - $7,500.00
key: C
explanation: Under N.J. Stat. Ann. § 45:15-17, the commission may impose a penalty of not more than
  $5,000 for a first violation and not more than $10,000 for any subsequent violation. The $4,000.00
  distractor might be mistaken for a lower statutory cap, but the statute explicitly sets the
  first‑violation maximum at $5,000.
