stem: Under N.J. Stat. Ann. § 45:15-17.1, how much notice must the commission give a licensee before
  entering a temporary suspension order?
options:
  - At least 24 hours
  - At least 48 hours
  - At least 72 hours
  - At least 10 days
key: A
explanation: The statute requires the commission to give at least 24 hours notice before a temporary
  suspension order and to offer a hearing. Therefore, the correct notice period is 24 hours. The
  distractor of 48 hours is incorrect because the rule specifies a minimum of 24 hours, not a longer
  period.
