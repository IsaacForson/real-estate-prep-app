stem: Under N.J. Stat. Ann. § 45:15-19.1, which conviction requires the commission to revoke a
  licensee's license automatically?
options:
  - Conviction of forgery offense
  - Conviction of simple assault
  - Conviction of petty shoplifting
  - Conviction of disorderly conduct
key: A
explanation: The statute states that the commission shall revoke forthwith the license of a licensee
  convicted of forgery, burglary, robbery, any theft or related offense (except shoplifting),
  criminal conspiracy to defraud, or any crime arising out of real estate activities. Therefore a
  forgery conviction triggers automatic revocation. The most tempting distractor, conviction of
  petty shoplifting, is incorrect because shoplifting is expressly excluded from the list of
  offenses that lead to revocation.
