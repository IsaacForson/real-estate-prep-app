stem: A commissioner resigns with one year remaining in the term. The Governor appoints a
  replacement to fill the vacancy. According to the statute, what is the length of the replacement’s
  term?
options:
  - Three-year term
  - One-year term
  - Two-year term
  - Unexpired term
key: D
explanation: The statute provides that members to fill vacancies shall be appointed by the Governor
  for the unexpired term. Thus, a replacement serves only the remaining portion of the predecessor’s
  term, not a full three-year term. The distractor 'Three-year term' describes a regular appointment
  after a term expires, which does not apply to a vacancy.
