stem: A department representative appointed to the New Jersey Real Estate Commission expects to
  receive an annual salary. Based solely on the statute, is the representative entitled to a salary?
options:
  - The representative is entitled to an annual salary of $15,000, as set forth in the commission’s
    internal compensation policy for the president.
  - The representative is entitled to an annual salary of $10,000, as set forth in the commission’s
    internal compensation policy for regular members.
  - The representative is not entitled to any salary because the statute provides that the
    department representative serves without compensation.
  - The representative is entitled to a salary only if they also hold a real estate broker license,
    according to a common misconception about commission compensation rules.
key: C
explanation: The statute explicitly states that the department representative serves without
  compensation, so no salary is payable. The other options incorrectly assign a salary or add
  conditions not present in the law.
