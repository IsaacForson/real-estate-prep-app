stem: A 22-year-old college graduate with a high school diploma applies for a real estate
  salesperson license in New Jersey. She submits the required $50 application fee and provides
  fingerprints for a background check. Which additional requirement must she satisfy to be eligible
  for licensure?
options:
  - The applicant must be a resident of the State of New Jersey.
  - The applicant must have three years of salesperson experience.
  - The applicant must hold a broker license from another state.
  - The applicant must provide evidence of good moral character.
key: D
explanation: Under N.J.S.A. 45:15-9, the applicant must furnish evidence of good moral character.
  Having satisfied the age, education, fee, and fingerprint requirements, providing this evidence is
  the remaining step for licensure. The option stating three years of experience is incorrect
  because that prerequisite applies only to broker applicants, not to salesperson applicants.
