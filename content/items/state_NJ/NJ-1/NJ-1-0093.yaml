stem: Which of the following entities is exempt from paying any license or license renewal fee for a
  real estate school license in New Jersey?
options:
  - A privately owned proprietary real estate school
  - An accredited college or university located in New Jersey
  - A real estate brokerage firm offering pre‑licensing courses
  - A nonprofit organization that is not accredited
key: B
explanation: Under N.J. Stat. Ann. § 45:15-10.6(c), any accredited college or university located in
  the State or any public adult education program conducted by a board of education that qualifies
  for licensure as a real estate school shall be issued a license without payment of any license or
  license renewal fee. A privately owned proprietary school does not qualify for this exemption.
