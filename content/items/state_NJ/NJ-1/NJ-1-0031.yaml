stem: A person who has been a licensed New Jersey real estate salesperson for four years applies for
  a broker license. Based on the statute, is the applicant eligible?
options:
  - No, the applicant must have at least five years of experience.
  - No, the applicant must have held a broker license in another state.
  - Yes, the applicant meets the three‑year experience requirement.
  - Yes, but only if the applicant also holds a college degree.
key: C
explanation: The statute requires three years as a salesperson for broker licensure; four years
  satisfies this requirement. The claim that five years are needed contradicts the three‑year
  minimum.
