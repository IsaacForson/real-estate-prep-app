stem: A commissioner who is neither the president nor the department representative serves a full
  year on the New Jersey Real Estate Commission. What annual compensation does this commissioner
  receive?
options:
  - The commissioner receives $5,000 per year.
  - The commissioner receives $10,000 per year.
  - The commissioner receives $15,000 per year.
  - The commissioner receives no compensation per year.
key: B
explanation: The statute provides that each commissioner other than the president and the department
  representative receives a salary of $10,000 per year. The president receives $15,000, and the
  department representative serves without compensation. Therefore, a regular commissioner earns
  $10,000 annually. The $5,000 figure is unsupported, the $15,000 applies only to the president, and
  the 'no compensation' option applies only to the department representative.
