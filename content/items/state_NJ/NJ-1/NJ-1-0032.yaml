stem: A commissioner is accused of misconduct and the Governor considers removal. What must the
  Governor do to lawfully remove the commissioner?
options:
  - Remove the commissioner after a majority vote of the remaining commissioners.
  - Remove the commissioner at any time without notice or hearing.
  - Remove the commissioner for cause after providing notice and an opportunity to be heard.
  - Remove the commissioner only if the commissioner consents to the removal.
key: C
explanation: The statute allows the Governor to remove a commissioner for cause upon notice and
  opportunity to be heard. Removing without notice or cause is not permitted.
