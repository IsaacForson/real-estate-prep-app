stem: A licensee submits a certified copy of a commission record to a court as evidence. According
  to the statute, what condition must the copy meet to be received in evidence with the same effect
  as the original?
options:
  - The copy must be duly certified and authenticated by the commission's seal.
  - The copy must be less than one year old at the time of submission.
  - The copy must be accompanied by a sworn affidavit signed by the licensee.
  - The copy must be notarized by a public notary for verification.
key: A
explanation: The statute provides that copies duly certified and authenticated by the commission's
  seal are received in evidence with the same effect as the original. The distractor about
  notarization is wrong because the law specifies the commission's seal, not a notary, as the
  required authentication.
