stem: Who must submit fingerprints and written consent for a criminal history record background
  check when applying for a real estate school license in New Jersey?
options:
  - The applicant must submit fingerprints and written consent for a criminal history record
    background check to the commission for licensure as a real estate school pursuant to N.J. Stat.
    Ann. § 45:15-10.6
  - The applicant and any officer, director, partner, or owner of a controlling interest must submit
    fingerprints and written consent for a criminal history record background check to the
    commission for licensure as a real estate school pursuant to N.J. Stat. Ann. § 45:15-10.6
  - The commission staff must submit fingerprints and written consent for a criminal history record
    background check to the commission for licensure as a real estate school pursuant to N.J. Stat.
    Ann. § 45:15-10.6
  - The officers and directors must submit fingerprints and written consent for a criminal history
    record background check to the commission for licensure as a real estate school pursuant to N.J.
    Stat. Ann. § 45:15-10.6
key: B
explanation: The statute explicitly requires both the applicant and any officer, director, partner,
  or owner of a controlling interest to submit fingerprints and written consent for the background
  check. The distractor that lists only the applicant is incorrect because it omits the mandatory
  inclusion of those control‑interest individuals.
citation:
