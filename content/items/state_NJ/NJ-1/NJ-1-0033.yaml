    Disclosure Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official
    full-text statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive
    capture of 2025-08-08 because njleg.state.nj.us refuses connections from this network — §
    15-10.6"
  url: null
  quoted_text: Any applicant filing for licensure pursuant to this section and any officer, director,
    partner or owner of a controlling interest of a corporation or partnership filing for licensure
    pursuant to this section shall submit to the commission, the applicant's name, address,
    fingerprints and written consent for a criminal history record background check to be performed.
