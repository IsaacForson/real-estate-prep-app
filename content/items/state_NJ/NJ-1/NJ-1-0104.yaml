stem: A consumer submits a signed, written complaint alleging that a licensee made false promises.
  Under N.J. Stat. Ann. § 45:15-17, what must the commission do?
options:
  - Investigate the licensee's conduct immediately
  - Wait for additional evidence before proceeding
  - Refer the complaint to the agency for review
  - Take no action unless the complaint is sworn
key: A
explanation: The statute requires the commission to investigate upon receipt of a verified complaint
  in writing, so it must investigate the licensee's conduct. Waiting for additional evidence is not
  required; the commission must act on the complaint as received.
