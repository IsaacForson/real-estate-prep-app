    capture of 2025-08-08 because njleg.state.nj.us refuses connections from this network — § 15-17"
  url: null
  quoted_text: The commission may, upon its own motion, and shall, upon the verified complaint in
    writing of any person, investigate the actions of any real estate broker, broker-salesperson, or
    salesperson
