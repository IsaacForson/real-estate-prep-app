stem: What qualification is required of every member of the New Jersey Real Estate Commission,
  regardless of their category?
options:
  - The member must be a representative of an appropriate state department.
  - The member must have previously served as a public official in New Jersey.
  - The member must have been a resident of New Jersey for at least 10 years.
  - The member must have been a licensed real estate broker for at least 10 years.
key: C
explanation: "The statute states that each commissioner must have been a resident of the State for
  at least 10 years, which applies to all members. The other options describe qualifications that
  apply only to specific categories: broker experience is required for five members, department
  representation for one member, and prior public service is not mentioned."
