stem: What is the minimum age requirement for an applicant seeking a real estate broker,
  broker-salesperson, or salesperson license in New Jersey?
options:
  - 21 years of age
  - 18 years of age
  - 30 years of age
  - 25 years of age
key: B
explanation: The statute states that every applicant for a broker, broker-salesperson, or
  salesperson license must be at least 18 years old. Therefore, the correct answer is 18 years of
  age. The distractor of 21 years of age is incorrect because New Jersey does not impose a higher
  age threshold for real estate licensure.
