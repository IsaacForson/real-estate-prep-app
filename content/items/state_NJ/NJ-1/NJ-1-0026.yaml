stem: A broker whose main office is located outside New Jersey wants to employ unlicensed assistants
  at a New Jersey branch office. Under N.J. Stat. Ann. § 45:15-20, is this permissible?
options:
  - The broker may employ only licensed brokers at the branch office
  - The broker may employ assistants if they hold a real estate license from any state
  - The broker may employ assistants who hold New Jersey broker-salesperson or salesperson licenses
  - The broker may employ unlicensed assistants at the branch office
key: C
explanation: The statute provides that a broker whose main office is outside this State may only
  provide brokerage services concerning real estate located within the State either personally or
  through persons in the broker's employ or with whom the broker has contracted who are holders of
  real estate broker-salesperson or salesperson licenses issued by the commission. Therefore
  employing assistants who hold New Jersey broker‑salesperson or salesperson licenses is allowed.
  The most tempting distractor, employing unlicensed assistants, is incorrect because the law
  requires those persons to be licensed as broker‑salespersons or salespersons in New Jersey.
