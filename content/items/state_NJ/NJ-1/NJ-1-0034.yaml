  quoted_text: A licensed broker whose main office is not located within this State shall only provide
    brokerage services concerning real estate located within this State either personally or through
    persons in the broker's employ or with whom the broker has contracted who are the holders of
    real estate broker-salesperson or salesperson licenses issued by the commission.
