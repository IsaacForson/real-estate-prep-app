stem: A broker whose main office is in Pennsylvania wants to list a residential property in Newark
  for sale. Under N.J. Stat. Ann. § 45:15-20, which of the following is true regarding the broker’s
  ability to provide brokerage services for that property?
options:
  - The broker may act personally, but employees or contractors must hold New Jersey licenses.
  - The broker must obtain a New Jersey broker license before providing any services.
  - The broker may only work through a New Jersey-licensed agent; personal performance is barred.
  - The broker must open a branch office in New Jersey and employ only New Jersey licensees there.
key: A
explanation: Under N.J. Stat. Ann. § 45:15-20, a broker whose main office is outside New Jersey may
  provide brokerage services for New Jersey real estate either personally or through employed or
  contracted persons who hold New Jersey broker‑salesperson or salesperson licenses. Therefore, the
  broker may act personally but must ensure any employees or contractors performing brokerage
  services are New Jersey‑licensed. The distractor claiming the broker must obtain a New Jersey
  license is incorrect because the statute permits personal performance without a New Jersey
  license.
