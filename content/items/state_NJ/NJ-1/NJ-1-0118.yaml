stem: A person who has been a resident of New Jersey for 9 years applies to be a member of the New
  Jersey Real Estate Commission. Based on the statute, is the applicant eligible?
options:
  - The applicant is eligible because they meet the residency requirement.
  - The applicant is not eligible because they must have been a resident for at least 10 years.
  - The applicant is eligible if they have been a real estate broker for 10 years.
  - The applicant is not eligible unless they are the department representative.
key: B
explanation: The statute requires commission members to have been residents of the state for at
  least 10 years, so a 9‑year resident is not eligible. The distractor that ties eligibility to
  broker experience is incorrect because the residency requirement is independent of broker
  experience.
