stem: A real estate school license is issued on March 15, 2024. What is the latest possible
  expiration date for this license under New Jersey statute?
options:
  - March 14, 2026
  - March 16, 2026
  - March 15, 2026
  - March 15, 2025
key: C
explanation: The law states that a school license shall expire on a date fixed by the commission
  that is not more than two years from the date of issuance. Therefore the latest permissible
  expiration date is exactly two years later, March 15, 2026. The option showing only one year is
  incorrect because it does not represent the maximum allowed term.
