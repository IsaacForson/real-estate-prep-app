    Disclosure Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official
    full-text statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive
    capture of 2025-08-08 because njleg.state.nj.us refuses connections from this network — §
    15-10.5"
  url: null
  quoted_text: No person, with the exception of a guest lecturer, may teach real estate education
    courses, the attendance and successful completion of which shall constitute the fulfillment of
    the educational prerequisites for licensure established pursuant to section 1 of P.L.1966, c.227
    (C.45:15-10.1) unless licensed as a real estate instructor pursuant to this amendatory and
    supplementary act.
