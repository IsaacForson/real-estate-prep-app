stem: A licensee who is not a guest lecturer wishes to teach a pre‑licensing real estate course in
  New Jersey. What must the licensee do to comply with the statute?
options:
  - Obtain a real estate broker license
  - Obtain a real estate instructor license
  - Obtain a real estate salesperson license
  - Obtain a real estate school license
key: B
explanation: The statute prohibits anyone except a guest lecturer from teaching pre‑licensing
  courses without holding a real estate instructor license. Thus the licensee must obtain an
  instructor license; a broker, salesperson, or school license does not satisfy this requirement.
