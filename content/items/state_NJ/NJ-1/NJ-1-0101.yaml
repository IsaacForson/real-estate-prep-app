stem: A member of the public requests to inspect commission records. Under the statute, what must
  the commission do regarding this request?
options:
  - The commission may allow the inspection only if the requester pays a fee.
  - The commission must refer the request to the Commissioner of Insurance.
  - The commission must deny the request unless the requester shows a legitimate interest.
  - The commission must allow the inspection under regulations it prescribes.
key: D
explanation: "The statute declares that all commission records shall be open to public inspection
  under regulations prescribed by the commission. This obligates the commission to allow inspection
  subject to its own regulations. The distractors are incorrect: the statute does not require a
  legitimate interest, does not authorize a fee, and does not assign the request to the Commissioner
  of Insurance."
