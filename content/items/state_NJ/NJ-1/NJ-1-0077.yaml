stem: What is the non-refundable application fee for a real estate instructor license in New Jersey?
options:
  - $050.00
  - $075.00
  - $100.00
  - $125.00
key: A
explanation: Under N.J. Stat. Ann. § 45:15-10.7, every application for licensure as a real estate
  instructor must be accompanied by an application fee of $50, which is non-refundable. The $075.00
  distractor might be confused with the instructor criminal history record check fee, but the
  statute specifies only the application fee amount; the criminal history fee is separate and
  varies.
