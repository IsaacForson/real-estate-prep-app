stem: Under N.J. Stat. Ann. § 45:15-18, before revoking a licensee's license (**NOT** a temporary
  suspension), how many days prior to the hearing must the commission provide written notice of the
  charges?
options:
  - At least 20 days
  - At least 15 days
  - At least 5 days
  - At least 10 days
key: D
explanation: Section 45:15-18 mandates that, except for temporary suspensions, the commission must
  provide written notice of charges at least ten days before the hearing and afford an opportunity
  to be heard. Therefore, the required notice period is ten days. The distractor of five days is
  incorrect because it falls short of the statutory minimum.
