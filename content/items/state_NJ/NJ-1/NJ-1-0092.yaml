    Act 45:15-16.27 et seq.), extracted from the New Jersey Legislature's official full-text
    statutes download (STATUTES-TEXT.zip, dated 2025-08-07) read via Internet Archive capture of
    2025-08-08 because njleg.state.nj.us refuses connections from this network — § 15-18
  url: null
  quoted_text: With the exception of a temporary suspension imposed by the commission pursuant to
    section 23 of P.L.1993, c.51 (C.45:15-17.1), the commission shall, before suspending or revoking
    any license, and at least ten days prior to the date set for the hearing, notify in writing the
    licensee of any charges made, and afford him an opportunity to be heard in person or by counsel.
