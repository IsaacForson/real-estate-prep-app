stem: A person who has been a resident of New Jersey for 9 years and has been a licensed real estate
  broker for 12 years applies to be appointed to the New Jersey Real Estate Commission. Based solely
  on the statute, is the person eligible for appointment?
options:
  - The person is eligible for appointment because they satisfy the broker experience requirement.
  - The person is eligible for appointment because they satisfy the residency requirement.
  - The person is ineligible for appointment because they fail to meet the residency requirement.
  - The person is ineligible for appointment because they are not a department representative.
key: C
explanation: The residency requirement of at least 10 years applies to all commission members; the
  applicant has only 9 years of residency, making them ineligible. Broker experience alone does not
  override the residency rule, and department representative status is not required for eligibility.
