stem: A broker's license is temporarily suspended by the New Jersey Real Estate Commission. Under
  N.J. Stat. Ann. § 45:15-17.2, what action may the commission take regarding the broker's accounts?
options:
  - The commission must notify the broker after freezing
  - The commission may only freeze trust accounts
  - The commission must freeze all accounts
  - The commission may freeze some or all accounts
key: D
explanation: Under § 45:15-17.2, when a broker's license is temporarily suspended, the commission
  may order that some or all of the broker's accounts be frozen. The word “may” indicates
  discretion, and the scope is “some or all,” not necessarily all accounts. Thus, the correct answer
  reflects the commission's permissive authority. The distractor stating the commission must freeze
  all accounts is wrong because the statute does not mandate freezing and allows partial freezing.
