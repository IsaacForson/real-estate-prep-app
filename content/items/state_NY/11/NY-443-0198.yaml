stem: A prospective salesperson has completed a pre‑licensing course that includes the required 2
  hours of Municipal Agencies instruction. Which statement about their training is correct?
options:
  - The candidate needs an additional hour of Municipal Agencies training.
  - The candidate must repeat the Municipal Agencies module before scheduling the exam.
  - The candidate may substitute Municipal Agencies hours with Real Estate Finance hours.
  - The candidate has satisfied the Municipal Agencies requirement for licensure.
key: D
explanation: Having completed the mandated 2 hours of Municipal Agencies instruction fulfills the
  subject requirement, so no further action is needed. Needing an extra hour, repeating the module,
  or substituting with another subject are not permitted under the rule.
