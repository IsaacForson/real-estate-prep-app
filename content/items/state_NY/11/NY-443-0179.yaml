stem: A broker is reviewing a salesperson’s course syllabus to ensure it meets New York licensing
  requirements. The syllabus allocates 1 hour to Municipal Agencies. According to state regulations,
  what is the status of this course?
options:
  - It fails because total course hours are below eighty.
  - It satisfies the requirement because total hours equal eighty.
  - It fails because Municipal Agencies must be at least two hours.
  - It satisfies because Municipal Agencies is not required.
key: C
explanation: The regulation mandates exactly two hours for the Municipal Agencies subject.
  Allocating only one hour violates this requirement, rendering the course noncompliant regardless
  of total hours. Hence the course fails.
