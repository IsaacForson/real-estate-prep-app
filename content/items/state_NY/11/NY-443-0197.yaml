stem: A salesperson finds that a pre‑licensing course syllabus lists the Municipal Agencies subject
  for 3 hours. To comply with New York DOS regulations, what must the course provider do?
options:
  - The course must reduce Municipal Agencies instruction to 2 hours.
  - The course must add one hour of Municipal Agencies instruction.
  - The course must increase Municipal Agencies instruction to 4 hours.
  - The course must keep Municipal Agencies instruction at 3 hours.
key: A
explanation: The rule mandates exactly 2 hours for the Municipal Agencies subject, so a syllabus
  showing 3 hours must be reduced to 2 hours. Increasing to 4 hours or keeping at 3 would exceed the
  requirement, and adding an hour would result in 4 hours, which also violates the rule.
