stem: A salesperson finishes a pre‑licensing course that contains 45 minutes of mortgage brokerage
  instruction. Under New York regulations, is the course acceptable for licensure?
options:
  - The course fails to meet the one‑hour mortgage brokerage requirement
  - The course is unacceptable because it lacks a separate finance module
  - The course meets the one‑hour mortgage brokerage requirement
  - The course is acceptable because it includes mortgage brokerage instruction
key: A
explanation: The rule mandates at least one hour of mortgage brokerage instruction, so 45 minutes is
  insufficient and the course fails the requirement. The option claiming acceptability based on any
  mortgage brokerage instruction is wrong because the duration must be at least one hour.
