stem: According to 19 NYCRR §175.3(a), a real estate broker managing property for a client may
  **NOT** accept which of the following without the client's full knowledge and consent?
options:
  - A late fee gathered from the tenant
  - A referral fee from another broker
  - A management fee charged to the client
  - A commission on expenses for the client
key: D
explanation: The rule prohibits a broker from accepting any commission, rebate, or profit on
  expenditures made for the client without the client's full knowledge and consent. A commission on
  expenses for the client is such a profit, so it is barred. Charging a management fee for services
  rendered is permissible compensation and not a profit on client expenditures.
