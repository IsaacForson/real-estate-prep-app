stem: A broker holds a tenant's security deposit but fails to pay the interest required by law.
  Under 19 NYCRR §175.3(b), what is the consequence?
options:
  - The broker must return the deposit without interest
  - The broker may retain the interest as compensation
  - The broker may face disciplinary action by the Secretary of State
  - The broker is exempt if the deposit is held less than sixty days
key: C
explanation: The regulation states that failure to pay, apply, or credit any required interest
  constitutes grounds for disciplinary action by the Secretary of State, so the broker may face
  discipline. The distractor about returning the deposit without interest is wrong because the rule
  does not mandate that remedy; it focuses on the interest obligation and disciplinary consequences.
