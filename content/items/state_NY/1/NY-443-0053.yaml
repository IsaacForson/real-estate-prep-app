stem: A tenant association authorized in writing by the NYC commissioner to manage city‑owned
  residential property wants to lease those units. Under NY Real Property Law §440-a, what is the
  effect?
options:
  - The association is subject to broker licensing before leasing any units.
  - The association is exempt from licensing requirements for the properties it manages.
  - The association is obligated to employ a licensed salesperson to conduct leasing activities.
  - The association is required to register with the Department of State as a property manager.
key: B
explanation: The statute expressly exempts tenant associations and not‑for‑profit corporations
  authorized in writing by the NYC commissioner from the licensing provisions with respect to the
  properties they manage. Therefore, no license is required for leasing those city‑owned units.
citation:
  source: "### N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — §
    440-a"
  url: null
  quoted_text: Notwithstanding anything to the contrary in this section, tenant associations and
    not-for-profit corporations authorized in writing by the commissioner of the department of the
    city of New York charged with enforcement of the housing maintenance code of such city to manage
    residential property owned by such city or appointed by a court of competent jurisdiction to
    manage residential property owned by such city shall be exempt from the licensing provisions of
    this section with respect to the properties so managed.
