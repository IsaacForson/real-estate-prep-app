stem: Under 19 NYCRR § 177.2, which type of instruction is **NOT** acceptable as meeting continuing
  education requirements for a real estate licensee?
options:
  - A typing skills course offered by a public vocational school
  - A real estate law update course offered by a regionally accredited university
  - A sales and marketing seminar offered by a real estate‑related professional society
  - A technology competency course offered by a real estate board
key: A
explanation: Section 177.2(b) explicitly states that offerings in mechanical office and business
  skills, such as typing, basic computer skills training, and similar subjects, are not acceptable
  for continuing education. The other options describe real‑estate‑related content or are provided
  by approved entities, which are permissible.
