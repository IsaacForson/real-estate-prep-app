stem: A licensee is unable to renew their license due to induction into the armed forces of the
  United States. Under NY Real Property Law §441(2), which requirement is the licensee exempt from?
options:
  - Attending cultural competency training as required
  - Taking the written examination for license renewal
  - Submitting proof of continuing education completion
  - Paying the required renewal fee to the department
key: B
explanation: The statute provides that a person unable to renew due to induction or enlistment in
  the armed forces shall not be required to take or pass the written examination. The distractor
  about paying the renewal fee is not exempted under this provision.
