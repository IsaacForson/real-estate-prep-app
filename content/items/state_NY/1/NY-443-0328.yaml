stem: For a real estate salesperson in their initial two-year licensing term, how many hours of
  agency-related instruction must be completed as part of continuing education?
options:
  - Three hours of agency-related instruction
  - One hour of agency-related instruction
  - Two hours of agency-related instruction
  - Four hours of agency-related instruction
key: C
explanation: The statute specifies that, except in the initial two-year term for salespersons, two
  hours of agency-related instruction are required. Therefore, two hours is the correct answer. The
  distractor of one hour reflects the general rule that applies to all other licensees, not to
  salespersons in their initial term.
