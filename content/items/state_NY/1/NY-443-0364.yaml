stem: A licensee was active as an associate broker for 24 months five years ago and has been
  inactive since. Does this licensee meet the experience requirement to be appointed as an office
  manager under NY Real Property Law §440(6)?
options:
  - Yes, because the licensee has 24 months of active experience.
  - No, because the licensee has less than 24 months of active experience.
  - Yes, because the licensee has at least two years of active experience.
  - No, because the experience must be within the last four years.
key: D
explanation: The rule requires the active experience to occur within the four‑year period preceding
  appointment; experience from five years ago does not satisfy this condition. Therefore the
  licensee does not qualify. The distractor “Yes, because the licensee has 24 months of active
  experience” is incorrect because, although the amount of experience meets the minimum, it is not
  recent enough to fulfill the recency requirement.
