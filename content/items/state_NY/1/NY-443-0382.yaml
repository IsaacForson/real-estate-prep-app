stem: An agent representing a buyer informs the buyer of the buyer’s rights and obligations under
  the property condition disclosure article only after the buyer has already signed a binding
  contract of sale. According to NY Real Property Law § 466, what is the effect on the agent’s
  liability?
options:
  - The agent has no liability because the duty applies only to sellers.
  - The agent is relieved if the seller later provides the disclosure.
  - The agent’s liability is limited to a $500 fine.
  - The agent may be liable for a violation of this article.
key: D
explanation: Section 466 requires an agent representing a buyer to timely inform the buyer of the
  buyer’s rights and obligations, specifically before the buyer signs a binding contract of sale.
  Failure to perform this duty means the agent has not satisfied the section’s requirements and may
  be liable for a violation of the article.
citation:
  source: N.Y. Real Prop. Law art. 14 — Real Property Law Article 14 (§§ 460 to 467), Property
    Condition Disclosure in the Sale of Residential Real Property — NY DOS booklet, March 2026 — §
    466
  url: null
  quoted_text: An agent representing a buyer of residential real property, or, if the buyer is not
    represented by an agent, the agent representing a seller of residential real property and
    dealing with a prospective buyer, shall have the duty to timely (in any event, before the buyer
    signs a binding contract of sale) inform such buyer of the buyer’s rights and obligations under
    this article.
