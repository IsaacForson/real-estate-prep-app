stem: A seller owns a single-family house that they have rented out to tenants for the past three
  years. They are now selling the house. Under NY Real Property Law §462(1), must the seller
  complete and sign a property condition disclosure statement?
options:
  - The seller is not required to complete and sign a property condition disclosure statement
    because the property is rented to tenants.
  - The seller is not required to complete and sign a property condition disclosure statement for
    any rental property.
  - The seller must complete and sign a property condition disclosure statement only if the seller
    occupies the property.
  - The seller must complete and sign a property condition disclosure statement because the property
    qualifies as residential real property.
key: D
explanation: The definition of residential real property includes a one‑ to four‑family dwelling
  used or occupied, or intended to be used or occupied, wholly or partly, as the home or residence
  of one or more persons. A rented single‑family house meets this definition, so the seller must
  provide the disclosure statement. The distractor claiming no requirement because the property is
  rented is incorrect because the definition does not exclude rental use.
citation:
  source: N.Y. Real Prop. Law art. 14 — Real Property Law Article 14 (§§ 460 to 467), Property
    Condition Disclosure in the Sale of Residential Real Property — NY DOS booklet, March 2026 — §
    462
  url: null
  quoted_text: “Residential real property” means real property improved by a one to four family
    dwelling used or occupied, or intended to be used or occupied, wholly or partly, as the home or
    residence of one or more persons, but shall not refer to (a) unimproved real property upon which
    such dwellings are to be constructed or (b) condominium units or cooperative apartments or (c)
    property on a homeowners’ association that is not owned in fee simple by the seller.
