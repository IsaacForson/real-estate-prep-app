stem: Under NY Real Property Law §440(2), what is an associate real estate broker?
options:
  - A licensed real estate broker who elects to work under the name and supervision of another
    broker while retaining their broker license
  - A licensed real estate salesperson who elects to work under the name and supervision of a broker
    while retaining their salesperson license
  - A licensed real estate broker who employs salespersons and receives a commission from their
    transactions
  - A licensed real estate broker who works independently without supervision and retains their
    broker license
key: A
explanation: The statute defines an associate real estate broker as a licensed broker who chooses to
  work under another broker’s name and supervision while keeping their broker license, which
  corresponds to the option describing a licensed real estate broker who elects to work under the
  name and supervision of another broker while retaining their broker license. The option describing
  a licensed real estate salesperson who elects to work under the name and supervision of a broker
  while retaining their salesperson license is incorrect because an associate broker must already
  hold a broker license.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — §
    440(2)
  url: null
  quoted_text: Associate real estate broker means a licensed real estate broker who shall by choice
    elect to work under the name and supervision of another individual broker or another broker who
    is licensed under a partnership, trade name, limited liability company or corporation.
