stem: Under NY Real Property Law §462, which type of property is exempt from the requirement to
  complete and sign a property condition disclosure statement?
options:
  - A two‑family dwelling used as a rental
  - A single‑family home owned by the seller
  - A four‑family residence occupied by the owner
  - A condominium unit in a building
key: D
explanation: The statute defines “residential real property” and expressly excludes condominium
  units, cooperative apartments, unimproved land, and HOA property not owned in fee simple.
  Therefore a seller of a condominium unit does not have to complete the disclosure statement. The
  other options describe property types that fall within the definition and thus trigger the
  requirement.
