stem: A real estate salesperson fails to submit proof of continuing education attendance before the
  license expiration date because they were hospitalized, which is not their fault. What may the
  department of state do under New York Real Property Law § 441(b)?
options:
  - No, the license expires and cannot be renewed without proof submission.
  - Yes, but only if the licensee provides proof within a grace period.
  - No, the licensee must wait for department approval before any renewal.
  - Yes, the department may issue a temporary renewal license for submitting proof.
key: D
explanation: Subsection (b) states that the department may issue a temporary renewal license for a
  period it deems appropriate to allow submission of the required proof when the failure to submit
  is not due to the licensee's fault. The distractor claiming the license automatically expires
  ignores this explicit discretionary authority.
