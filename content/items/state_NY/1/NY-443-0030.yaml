stem: A broker changes their principal business address and has two associated salespersons. What
  total filing fee must accompany the notice of address change under New York Real Property Law §
  441-a(5)?
options:
  - $10
  - $20
  - $30
  - $40
key: C
explanation: Subsection (5) requires a filing fee of ten dollars for each licensee named in the
  notice. The broker and two salespersons constitute three licensees, so the total fee is 3 × $10 =
  $30. The distractors either undercount the number of licensees or overcount the fee per licensee.
