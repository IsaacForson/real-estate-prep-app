stem: A seller of a two-family home in New York completes the Property Condition Disclosure
  Statement and gives it to the buyer's agent after the buyer has already signed a binding contract
  of sale. Under NY Real Property Law §462(1), is the seller's action compliant with the disclosure
  requirement?
options:
  - Under NY Real Property Law §462(1), the seller's action is compliant because the disclosure
    statement was delivered to the buyer's agent.
  - Under NY Real Property Law §462(1), the seller's action is non‑compliant because the disclosure
    statement must be delivered prior to the buyer signing a binding contract of sale.
  - Under NY Real Property Law §462(1), the seller's action is compliant because the seller
    completed the form based on actual knowledge.
  - Under NY Real Property Law §462(1), the seller's action is non‑compliant because the seller
    failed to attach a copy to the real estate purchase contract.
key: B
explanation: The law requires the disclosure statement to be delivered to the buyer or buyer’s agent
  prior to the buyer signing a binding contract of sale. Delivering it after the contract is signed
  violates this timing requirement, making the seller’s action non‑compliant. The distractor
  claiming compliance because the statement was delivered to the agent ignores the mandatory
  pre‑signing timing.
