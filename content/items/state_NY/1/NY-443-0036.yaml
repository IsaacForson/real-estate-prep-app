  quoted_text: Every seller of residential real property pursuant to a real estate purchase contract
    shall complete and sign a property condition disclosure statement as prescribed by subdivision
    two of this section and cause it, or a copy thereof, to be delivered to a buyer or buyer’s agent
    prior to the signing by the buyer of a binding contract of sale.
