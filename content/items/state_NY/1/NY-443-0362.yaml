stem: Under NY Real Property Law §440(6), what is the minimum number of years of active associate
  broker experience required within the four-year period preceding appointment as an office manager?
options:
  - Four years of active associate broker experience
  - Three years of active associate broker experience
  - Two years of active associate broker experience
  - One year of active associate broker experience
key: C
explanation: The rule states that an associate real estate broker must have been active as a
  licensed associate broker for at least two of the four years preceding appointment as an office
  manager. Therefore, two years is the minimum required. The distractor “One year of active
  associate broker experience” is incorrect because the rule requires a minimum of two years, not
  one.
