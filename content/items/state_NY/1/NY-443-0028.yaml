stem: Under New York Real Property Law § 441(a), what is the minimum continuing education
  instruction a licensee must complete regarding recent legal matters?
options:
  - Two hours of instruction
  - Three hours of instruction
  - One hour of instruction
  - Four hours of instruction
key: C
explanation: Subsection (a) requires at least one hour of instruction pertaining to recent legal
  matters governing the practice of real estate brokers and salespersons in New York, which may
  include statutes, laws, regulations, rules, codes, department of state opinions and decisions, and
  court decisions. The distractor of two hours incorrectly applies to agency-related instruction for
  the initial two-year licensing term for salespersons, not to recent legal matters.
