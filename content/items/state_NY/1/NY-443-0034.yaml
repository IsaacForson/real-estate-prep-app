stem: A corporation organized under N.Y. Real Prop. Law art. 12-A wishes to have its president and
  two other officers act as real estate brokers. How many broker licenses must the corporation
  obtain?
options:
  - The corporation must obtain one license
  - The corporation must obtain three licenses
  - The corporation must obtain four licenses
  - The corporation must obtain two licenses
key: B
explanation: The corporation's license entitles one officer (president or designee) to act as
  broker; each additional officer who wants to act as broker requires a separate license. Thus two
  additional licenses are needed, for a total of three. The option 'two licenses' incorrectly counts
  only the additional officers.
