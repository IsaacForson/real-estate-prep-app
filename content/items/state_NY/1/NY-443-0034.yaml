  url: null
  quoted_text: For each other officer who shall desire to act as a real estate broker in behalf of
    such corporation an additional license expiring on the same date as the license of the
    corporation shall be applied for and issued, as hereinbefore provided, the fee for which shall
    be the same as the fee required by this section for the license to the corporation.
