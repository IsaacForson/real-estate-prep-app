stem: Under NY Real Property Law §441(1)(b), what is the minimum number of hours of approved real
  estate coursework an applicant must complete to qualify for an initial broker’s license?
options:
  - 77 hours
  - 22.5 hours
  - 30 hours
  - 152 hours
key: D
explanation: The statute requires the applicant to have attended for at least one hundred fifty-two
  hours and successfully completed a real estate course approved by the secretary of state. This
  establishes the 152‑hour minimum for a broker’s license. The 77‑hour figure applies only to
  salesperson licensing, not to the broker requirement.
