stem: A mortgagor transfers residential real property to the mortgagee by deed in lieu of
  foreclosure. Is a property condition disclosure statement required?
options:
  - A disclosure statement is required in this transaction
  - A disclosure statement is required only for bank-owned mortgages
  - A disclosure statement is not required in this transaction
  - A disclosure statement is required only for older properties
key: C
explanation: Under N.Y. Real Prop. Law §463(2), a transfer to a mortgagee (or its affiliate or
  agent) by a mortgagor by deed in lieu of foreclosure is exempt from the property condition
  disclosure requirement. Therefore, no disclosure statement is needed in this transaction. The
  option stating that a disclosure statement is required in this transaction is incorrect because
  the statute provides an exemption, not a requirement. The options that limit the requirement to
  bank‑owned mortgages or to older properties add conditions that are not present in the exemption.
