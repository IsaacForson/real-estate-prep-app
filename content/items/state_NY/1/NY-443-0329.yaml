stem: A licensee forgets to submit proof of continuing education attendance before the license
  expiration date. According to NY Real Property Law § 441(b), what is the effect on the license?
options:
  - The license expires and cannot be renewed temporarily
  - The department may issue a temporary renewal license
  - The license is automatically extended for 30 days
  - The licensee must retake the state licensing examination
key: A
explanation: The law allows a temporary renewal license only when the failure to submit proof is not
  due to the licensee's fault. Since forgetting is considered fault, the department may not issue a
  temporary renewal and the license expires. The distractor suggesting a temporary renewal
  incorrectly assumes the department can always issue one.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
