stem: According to NY Real Property Law §441(a), what does the term 'implicit bias' mean?
options:
  - It is defined as the explicit attitudes that affect an individual’s understanding, actions and
    decisions in a deliberate manner.
  - It is defined as the learned behaviors that affect an individual’s understanding, actions and
    decisions in a habitual manner.
  - It is defined as the conscious beliefs that affect an individual’s understanding, actions and
    decisions in an intentional manner.
  - It is defined as the attitudes or stereotypes that affect an individual’s understanding, actions
    and decisions in an unconscious manner.
key: D
explanation: The statute defines implicit bias as the attitudes or stereotypes that affect an
  individual’s understanding, actions and decisions in an unconscious manner. The other options
  describe conscious, explicit, or learned behaviors, which do not match the statutory definition.
