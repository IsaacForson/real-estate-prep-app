stem: According to NY Real Property Law §462, which of the following is **NOT** considered
  residential real property for the purpose of the property condition disclosure statement?
options:
  - A condominium unit not owned in fee simple
  - A single-family home used as a rental property
  - A two-family house occupied as a primary residence
  - A three-family dwelling occupied by the owner
key: A
explanation: The definition of residential real property explicitly excludes condominium units,
  cooperative apartments, unimproved land, and HOA property not owned in fee simple. Therefore a
  condominium unit is not residential real property for disclosure purposes. The two-family house,
  single-family home, and three-family dwelling all meet the definition of a one‑to‑four family
  dwelling used as a residence.
