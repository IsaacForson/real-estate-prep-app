stem: A seller is transferring ownership of a townhouse that is part of a homeowners’ association,
  but the seller holds only a leasehold interest and does not own the property in fee simple. Under
  NY Real Property Law §462, is the seller required to complete and sign a property condition
  disclosure statement?
options:
  - No, the seller is not required to complete and sign a property condition disclosure statement
  - Yes, the seller must complete and sign a property condition disclosure statement for the
    transaction
  - Yes, the seller must complete and sign a property condition disclosure statement only for
    single‑family homes
  - No, the seller is not required to complete and sign a property condition disclosure statement
    for leaseholds
key: A
explanation: The statute defines residential real property to exclude property on a homeowners’
  association that is not owned in fee simple by the seller. Since the seller only has a leasehold
  interest, the property is not residential real property and no disclosure statement is required.
  The distractor incorrectly applies the disclosure requirement to all property interests in an HOA.
