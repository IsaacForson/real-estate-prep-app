stem: Under NY Real Property Law §441-c(1)(a), what portion of a fine imposed by the Department of
  State for license discipline must be allocated to the anti‑discrimination in housing fund?
options:
  - Ten percent of the fine
  - Fifty percent of the fine
  - Seventy percent of the fine
  - Twenty percent of the fine
key: B
explanation: The statute states that fifty percent of all moneys received for such fines shall be
  payable to the anti‑discrimination in housing fund. Therefore fifty percent is correct. The
  distractor "Twenty percent of the fine" understates the required allocation.
