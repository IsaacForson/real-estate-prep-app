stem: Alex, who is 19 years old, wishes to obtain a real estate broker license in New York State.
  Based on the licensing requirements, which statement is correct?
options:
  - Alex is ineligible because he must be at least 20 years old.
  - Alex is eligible because he is over 18 years old.
  - Alex is ineligible only if he has a criminal conviction.
  - Alex is eligible if he holds a college degree.
key: A
explanation: The law sets the broker age threshold at twenty years or older, so a 19‑year‑old does
  not meet the requirement and is ineligible. The distractor claiming eligibility because the
  applicant is over eighteen ignores the higher broker‑specific age threshold.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — § 440-a
  url: null
  quoted_text: No person shall be entitled to a license as a real estate broker under this article,
    either as an individual or as a member of a co-partnership, or as a member or manager of a
    limited liability company or as an officer of a corporation, unless they are twenty years of age
    or over.
