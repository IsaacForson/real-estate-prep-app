stem: A New York real estate broker who is not registered under article 23-A of the General Business
  Law wishes to pay part of a commission earned from the sale of a cooperative apartment to an
  individual who holds a real estate broker license in another state and regularly engages in
  brokerage business there. Under NY Real Property Law § 442, is this payment permissible?
options:
  - A) Yes, because the individual is licensed in another state.
  - B) Yes, because the payment is for a cooperative sale.
  - C) No, because the broker lacks article 23-A registration.
  - D) No, because paying commissions to unlicensed persons is generally prohibited.
key: C
explanation: Under N.Y. Real Prop. Law § 442, a New York broker may pay part of a commission to an
  out‑of‑state broker only if the New York broker is registered under article 23‑A of the General
  Business Law. Because the broker in the scenario lacks that registration, the exception does not
  apply and the general prohibition on paying commissions to unlicensed persons stands. The idea
  that the out‑of‑state license alone permits the payment ignores the registration requirement, and
  the notion that the cooperative nature of the transaction matters is also incorrect. The claim
  that paying commissions to unlicensed persons is always prohibited is too broad, as the statute
  provides an exception when the New York broker is properly registered.
citation:
