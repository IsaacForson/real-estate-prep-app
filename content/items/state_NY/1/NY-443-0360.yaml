stem: Under NY Real Property Law § 466, what is the effect on an agent’s liability if the agent
  fails to inform a seller of the seller’s obligations under the property condition disclosure
  article?
options:
  - The agent must pay a statutory fine of one thousand dollars
  - The agent may be liable for a violation of this article
  - The agent has no liability under this article
  - The agent’s license is automatically suspended for sixty days
key: B
explanation: Under NY Real Property Law §466, an agent who performs the duties imposed by the
  section has no liability for a violation of the property condition disclosure article. Therefore,
  if the agent fails to inform the seller of the seller’s obligations under that article, the agent
  may be liable for a violation.
