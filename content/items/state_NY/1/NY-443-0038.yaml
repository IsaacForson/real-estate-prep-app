stem: For a broker’s license application under NY Real Property Law § 441, which of the following
  must the applicant furnish?
options:
  - Proof of having attended and successfully completed at least twenty‑two and one‑half hours of an
    approved real estate course
  - Proof of having attended and successfully completed at least one hundred fifty‑two hours of an
    approved real estate course
  - Proof of having attended and successfully completed at least two hours of an approved real
    estate course
  - Proof of having attended and successfully completed at least seventy‑seven hours of an approved
    real estate course
key: B
explanation: Section 441(b) requires a broker applicant to furnish proof of having attended and
  successfully completed at least 152 hours of an approved real estate course. The 77‑hour
  requirement applies only to salesperson applicants, not brokers.
