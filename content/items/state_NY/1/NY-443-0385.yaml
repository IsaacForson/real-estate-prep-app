stem: A seller is transferring ownership of a cooperative apartment in New York. Under NY Real
  Property Law §462, is the seller required to complete and sign a property condition disclosure
  statement?
options:
  - No, the seller is not required to complete and sign a property condition disclosure statement
    unless it's a condo
  - No, the seller is not required to complete and sign a property condition disclosure statement
    for a co‑op
  - Yes, the seller must complete and sign a property condition disclosure statement only for
    single‑family homes
  - Yes, the seller must complete and sign a property condition disclosure statement for a co‑op in
    the transaction
key: B
explanation: Cooperative apartments are expressly excluded from the definition of residential real
  property in §462. Consequently, sellers of co‑op units are not obligated to provide a property
  condition disclosure statement. The distractor that requires disclosure for co‑ops misapplies the
  rule to an exempt property type.
