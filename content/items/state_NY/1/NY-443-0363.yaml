stem: A licensee has been actively working as an associate broker for 18 months, then was inactive
  for 12 months, and then active again for 18 months over the past four years. Does this licensee
  meet the experience requirement to be appointed as an office manager under NY Real Property Law
  §440(6)?
options:
  - Yes, because the licensee has 36 months of active experience.
  - No, because the licensee has less than 24 months of active experience.
  - Yes, because the licensee has only 12 months of active experience.
  - No, because the active periods must be consecutive to count.
key: A
explanation: The licensee has 36 months of active experience, which exceeds the required 24 months
  (two years) within the four‑year period, so the requirement is satisfied. The distractor “No,
  because the licensee has less than 24 months of active experience” is incorrect because the
  licensee actually has more than 24 months of active experience.
