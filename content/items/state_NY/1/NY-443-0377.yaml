stem: A salesperson applicant submits a completed license application but omits the certificate
  showing completion of the required seventy‑seven‑hour approved real estate course. According to NY
  Real Property Law §441(1‑A)(d), what action must the Department of State take?
options:
  - The issuance of the license pending proof
  - The denial of the license application
  - The requirement to retake the course
  - The issuance of a conditional license
key: B
explanation: The key is correct because §441(1‑A)(d) states that no salesperson’s license shall be
  issued unless the application is accompanied by proof of completing the seventy‑seven‑hour course;
  omission of such proof requires denial. The most tempting distractor, “The issuance of the license
  pending proof,” is incorrect because the statute does not allow pending issuance; proof must
  accompany the application.
