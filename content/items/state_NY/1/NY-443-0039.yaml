stem: A licensed salesperson who completed a seventy‑seven‑hour approved real estate course
  (including six hours of fair housing) five years ago is applying for a broker license. Under NY
  Real Property Law § 441(c), how many additional hours of approved real estate coursework must the
  applicant still complete to meet the broker license requirement?
options:
  - The applicant must still complete one hundred fifty‑two hours of approved real estate coursework
    to meet the broker license requirement
  - The applicant must still complete zero hours of approved real estate coursework to meet the
    broker license requirement
  - The applicant must still complete seventy‑five hours of approved real estate coursework to meet
    the broker license requirement
  - The applicant must still complete seventy‑seven hours of approved real estate coursework to meet
    the broker license requirement
key: C
explanation: Section 441(c) allows the department to credit the seventy‑seven hours already
  completed against the one hundred fifty‑two‑hour broker requirement. Subtracting the credited
  hours leaves seventy‑five hours still needed.
