stem: A broker license applicant completed a three‑hour cultural competency workshop offered by a
  local real estate association. Does this satisfy the cultural competency requirement for the
  broker license application under NY Real Property Law § 441(b)?
options:
  - has taken any class on cultural competency training
  - has completed a class of at least two hours cultural competency
  - has completed a class approved by secretary of state
  - has completed a class cultural competency within last five years
