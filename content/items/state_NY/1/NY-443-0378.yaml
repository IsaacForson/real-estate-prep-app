stem: A broker applicant submits all required information but does not include evidence of having
  passed the state written examination. According to NY Real Property Law §441(1)(b), what is the
  likely outcome?
options:
  - The requirement to retake the examination
  - The issuance of a temporary license pending exam
  - The denial of the license application
  - The automatic approval based on experience
key: C
explanation: The key is correct because §441(1)(b) requires the applicant to furnish sufficient
  proof of having taken and passed a written examination; failure to provide such proof leads to
  denial of the application. The most tempting distractor, “The issuance of a temporary license
  pending exam,” is incorrect because the statute does not provide for a temporary license; the
  proof must be submitted with the application.
