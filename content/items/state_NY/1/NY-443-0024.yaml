stem: A broker’s license expired on June 30, 2022. The broker did not submit a renewal application
  until August 1, 2024. According to NY Real Property Law §441(2), what must the broker do to renew
  the license?
options:
  - Pass the written examination
  - Submit only the renewal fee
  - Submit proof of continuing education
  - Submit an affidavit of experience
key: A
explanation: If a licensee does not apply for renewal within the two‑year renewal period, the
  department requires the applicant to qualify by passing the written examination. The broker’s
  delay of over two years triggers this requirement. Simply paying the fee or submitting continuing
  education or experience affidavits does not satisfy the statutory condition.
