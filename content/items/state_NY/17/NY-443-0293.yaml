math:
  worked_solution: |-
    Total required hours = 80 hours (Instruction 77 + Final Examination 3).
    Income Tax Issues in Real Estate Transactions allocated hours = 3 hours.
    If omitted, course hours = 80 - 3 = 77 hours.
    Shortfall = 80 - 77 = 3 hours.
