stem: If a salesperson’s pre‑licensing course omits Income Tax Issues in Real Estate Transactions
  entirely, how many total hours would the course be short of the required 80‑hour New York
  salesperson pre‑licensing total?
options:
  - 2 hours
  - 1 hours
  - 4 hours
  - 3 hours
key: D
explanation: The syllabus shows a total of 80 hours (77 hours of instruction plus 3 hours of final
  examination) and allocates 3 hours to Income Tax Issues in Real Estate Transactions. Removing this
  subject reduces the total to 77 hours, leaving a shortfall of 3 hours.
citation:
