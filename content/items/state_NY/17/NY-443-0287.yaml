stem: A salesperson’s pre‑licensing course includes 2 hours of Legal Issues, 1 hour of Income Tax
  Issues, and 3 hours of Law of Agency. Does the course meet the New York requirement for Income Tax
  Issues in Real Estate Transactions?
options:
  - Yes, because the course includes at least 3 hours of Income Tax Issues.
  - No, because the course includes only 1 hour of Income Tax Issues.
  - Yes, because the total hours of the course exceed 3 hours.
  - No, because Legal Issues must be allocated 10 hours in the syllabus.
key: B
explanation: The syllabus requires 3 hours for Income Tax Issues; the course provides only 1 hour,
  so it fails the requirement. Saying that 1 hour satisfies the rule is incorrect, using total hours
  to justify sufficiency is incorrect, and claiming Legal Issues must be 10 hours is incorrect.
