stem: A real estate salesperson has completed 2 hours of instruction on Income Tax Issues in Real
  Estate Transactions as part of their required pre‑licensing course. According to NY DOS
  regulations, what is the status of this training?
options:
  - It fully satisfies the requirement.
  - It falls short by exactly 1 hour.
  - It exceeds the requirement by 1 hr.
  - It is irrelevant to licensing requirements.
key: B
explanation: Under §176.3, the salesperson must complete three hours of income‑tax instruction;
  having only two hours leaves them one hour short. Thus the training falls short by exactly one
  hour. The option claiming the training fully satisfies the requirement is wrong because two hours
  does not meet the three‑hour mandate.
