stem: Which of the following correctly states the number of hours that must be devoted to Income Tax
  Issues in Real Estate Transactions in a New York salesperson’s pre‑licensing course?
options:
  - 1 hour
  - 2 hours
  - 3 hours
  - 4 hours
key: C
explanation: The regulation specifies that 3 hours must be devoted to Income Tax Issues in Real
  Estate Transactions. Therefore the answer stating 3 hours is correct. The most tempting distractor
  is "2 hours" because it reflects a common mistake of recalling a lower requirement, but the rule
  explicitly states 3 hours.
