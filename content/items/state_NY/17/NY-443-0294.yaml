stem: A salesperson’s pre‑licensing course divides the required instruction on Income Tax Issues in
  Real Estate Transactions into three equal sessions of one hour each. Does this schedule satisfy
  the New York requirement for this subject?
options:
  - Yes, because the total hours meet the three‑hour requirement.
  - No, because the subject must be taught in a single continuous block.
  - Yes, but only if the sessions are held on separate consecutive days.
  - No, because the subject must be allocated exactly three hours each day.
key: A
explanation: The New York salesperson pre‑licensing requirement specifies a total of three hours for
  Income Tax Issues in Real Estate Transactions; it does not prescribe how those hours must be
  distributed. Therefore, three one‑hour sessions satisfy the requirement regardless of scheduling.
