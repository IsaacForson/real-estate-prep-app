stem: A real estate broker is buying a house for a client and holds an 8% ownership interest in the
  house. Under New York regulation, to whom must the broker disclose this interest?
options:
  - Disclosure to all parties is required
  - Disclosure to the client is required
  - Disclosure to the seller is required
  - Disclosure to no one is required
key: A
explanation: New York regulation requires a broker who has an ownership interest in property being
  purchased for a client to disclose that interest to every party involved in the transaction.
  Therefore the correct answer is the option stating that disclosure to all parties is required. The
  other options are incorrect because limiting disclosure to no one, to only the client, or to only
  the seller does not satisfy the rule’s requirement to inform all parties.
