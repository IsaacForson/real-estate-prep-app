stem: A real estate broker who is acting as the listing agent for a seller decides to purchase the
  seller's property for his own personal use. Under 19 N.Y.C.R.R. § 175.5, what must the broker do
  before completing the purchase?
options:
  - The broker must disclose his interest in the property to the seller only.
  - The broker must disclose his interest in the property to all parties to the transaction.
  - The broker is not required to disclose his interest because he is not buying the property for a
    client.
  - The broker must obtain written consent from the seller's attorney before proceeding.
key: C
explanation: §175.5 requires disclosure only when the broker buys property 'for a client' in which
  the broker has an interest. Here the broker is buying for himself, not for a client, so no
  disclosure is required under this rule.
