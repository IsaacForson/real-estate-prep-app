stem: A real estate broker has agreed to purchase an investment property on behalf of a buyer client
  and holds a 10% ownership interest in the property. According to 19 NYCRR §175.5, when must the
  broker disclose this interest under New York regulation?
options:
  - Before signing the purchase contract on behalf of the client
  - Before presenting the purchase offer to the client
  - Before showing the property to the prospective buyer
  - Before discussing financing terms with the lender
key: A
explanation: Under 19 NYCRR §175.5, a broker who holds any personal ownership interest in a property
  must disclose that interest to all parties before buying the property for a client. Signing the
  purchase contract on behalf of the client constitutes the act of buying, so the disclosure must
  occur prior to that step. Merely presenting an offer or discussing financing terms does not yet
  constitute the broker buying the property, so disclosure is not required at those points.
