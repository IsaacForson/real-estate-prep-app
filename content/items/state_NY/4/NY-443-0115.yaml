stem: A seller provides a property condition disclosure statement but accidentally omits a defect in
  the roof. According to N.Y. Real Prop. Law § 465, what is the seller's liability for this
  omission?
options:
  - The seller is liable for the actual damages suffered by the buyer because any omission triggers
    liability.
  - The seller is liable only if the omission was willful; otherwise, there is no liability under
    this article.
  - The seller must pay a statutory fine of two thousand dollars to the Department of State.
  - The seller must refund the purchase price and cover all repair costs regardless of intent.
key: B
explanation: §465(2) limits liability to willful failures to perform the article's requirements; an
  accidental omission is not willful, so no liability arises under this provision.
citation:
  source: N.Y. Real Prop. Law art. 14 — Real Property Law Article 14 (§§ 460 to 467), Property
