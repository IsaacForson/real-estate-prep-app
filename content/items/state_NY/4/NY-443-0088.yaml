stem: A real estate broker is listing a commercial property for sale on behalf of a seller client.
  The broker personally owns a 30% interest in the property. Under New York regulation 19 NYCRR
  §175.5, what is the broker’s obligation regarding disclosure of this interest before accepting the
  listing?
options:
  - Must disclose the interest to all parties to the transaction
  - Must disclose the interest only if it exceeds twenty percent
  - No disclosure required because broker is not buying for client
  - Must disclose the interest only to the seller client
key: C
explanation: The regulation requires disclosure only when the broker buys property for a client;
  since the broker is listing property for sale, no disclosure is required. The statement that
  disclosure is needed only if the interest exceeds twenty percent is incorrect because the rule
  does not set a percentage threshold; it applies only to purchase situations. The statement that
  disclosure must be made only to the seller client is incorrect because, when disclosure is
  required (in a purchase scenario), it must be made to all parties to the transaction. The
  statement that disclosure must be made to all parties to the transaction is incorrect because the
  duty to disclose does not arise in a listing situation.
