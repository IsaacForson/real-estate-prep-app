stem: What must all approved real estate salesperson courses do regarding the course syllabus?
options:
  - Use the syllabus when teaching the salesperson course
  - Submit the syllabus to the Department for biennial review
  - Attach a copy of the syllabus to each enrollment agreement
  - Update the syllabus annually based on legal changes
key: A
explanation: All approved courses must use the syllabus when teaching the salesperson course (see 19
  NYCRR §176.3(b)). The option that says 'Submit the syllabus to the Department for biennial review'
  is incorrect because the rule does not require submission for review; it only requires use of the
  syllabus in instruction.
