stem: A real estate broker is purchasing a condominium unit for a client and holds a 12% ownership
  interest in the unit. According to New York regulation, when must the broker disclose this
  interest to the parties involved?
options:
  - The broker must disclose the interest to all parties before proceeding with the purchase
  - The broker must disclose the interest only to the client before proceeding with the purchase
  - The broker must disclose the interest to all parties after closing before proceeding with the
    purchase
  - The broker must not disclose the interest if it is less than 10% before proceeding with the
    purchase
key: A
explanation: The regulation requires the broker to disclose any ownership interest to all parties
  before moving forward with the purchase; therefore the option stating that the broker must
  disclose the interest to all parties before proceeding is correct. Options that limit disclosure
  to the client, allow nondisclosure for small interests, or delay disclosure until after closing do
  not satisfy the rule.
citation:
  source: 19 N.Y.C.R.R. Parts 175-179 — 19 NYCRR Parts 175 to 179 — Department of State real estate
    regulations — NY DOS booklet, March 2026 — § 175.5
  url: null
  quoted_text: Before a real estate broker buys property for a client in the ownership of which the
    broker has an interest, he shall disclose his interest to all parties to the transaction.
