stem: A prelicensing course for real estate salespersons allocates 2 hours to Valuation Process and
  Pricing Properties and 4 hours to License Law and Regulations. According to the syllabus in 19
  NYCRR §176.3, does the course satisfy the required hours for these two subjects?
options:
  - The course satisfies the requirement because the total hours equal the required combined hours.
  - The course does not satisfy the requirement because each subject's hours differ from the
    required number.
  - The course satisfies the requirement because it exceeds the minimum required for each subject.
  - The course does not satisfy the requirement because it lacks the final examination hours.
key: B
explanation: The required hours for each subject are three; allocating two and four hours fails to
  meet the required number for either subject. The claim that the course satisfies the requirement
  because the total hours equal the required combined hours is incorrect because the requirement is
  per subject, not based on combined totals.
