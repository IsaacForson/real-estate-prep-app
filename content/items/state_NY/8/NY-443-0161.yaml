stem: A proprietary real‑estate school designs a 78‑hour salesperson course that omits the Valuation
  Process and Pricing Properties unit entirely. According to the regulations, is this course
  acceptable for licensure?
options:
  - The course is acceptable because it exceeds the 80‑hour total.
  - The course is acceptable if the school substitutes another subject.
  - The course is unacceptable because it omits a required subject.
  - The course is unacceptable unless the school obtains a waiver.
key: C
explanation: Regulations require all approved courses to use the prescribed syllabus, which includes
  the Valuation Process and Pricing Properties unit; omitting that unit makes the course
  unacceptable. The option claiming acceptability with a substitute subject is wrong because the
  syllabus must be followed exactly, not altered.
