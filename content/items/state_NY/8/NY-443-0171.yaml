stem: A salesperson has completed 2 hours of Valuation Process and Pricing Properties and 70 hours
  of other instruction. How many additional hours of Valuation Process and Pricing Properties must
  they complete to satisfy both the subject requirement and the 80‑hour total?
options:
  - 3 hour
  - 5 hour
  - 1 hour
  - 8 hour
key: D
explanation: The salesperson needs 8 more hours to reach the 80‑hour total (80 − (70+2) = 8) and
  only 1 more hour to meet the 3‑hour valuation requirement (3 − 2 = 1). To satisfy both, they must
  complete the larger deficit, which is 8 hours of valuation instruction. The distractor 1 hour only
  meets the valuation requirement but leaves the total short.
