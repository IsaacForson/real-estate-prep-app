math:
  worked_solution: |-
    total deficit = 80 − (70 + 2) = 8
    valuation deficit = 3 − 2 = 1
    max(8, 1) = 8 hour
  formulas:
    - total deficit = total required − (other hours + completed valuation hours)
    - valuation deficit = required valuation hours − completed valuation hours
    - additional valuation hours = max(total deficit, valuation deficit)
