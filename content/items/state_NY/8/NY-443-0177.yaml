stem: A salesperson has completed 78 hours of prelicensing instruction, including 3 hours of
  Valuation Process and Pricing Properties. According to the regulations, is the salesperson
  eligible to sit for the licensing examination?
options:
  - The salesperson is eligible because the total hours exceed the required 77 hours of instruction.
  - The salesperson is eligible because the valuation requirement is satisfied.
  - The salesperson is not eligible because the valuation hours are below the required three.
  - The salesperson is not eligible because the total instruction hours are insufficient.
key: D
explanation: The salesperson must complete 80 total hours, with at least 3 hours in valuation.
  Having 78 total hours leaves a deficit of 2 hours, making the candidate ineligible despite meeting
  the valuation requirement. The distractor claiming eligibility because total hours exceed 77
  ignores the 80‑hour total requirement.
