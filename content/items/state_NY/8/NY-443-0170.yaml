explanation: The syllabus allocates 3 hours to Valuation Process and Pricing Properties out of a
  total of 80 hours, so the percentage is (3/80)×100 = 3.75 percent. The distractor 5.00 percent
  results from mistakenly using 4 hours instead of 3.
