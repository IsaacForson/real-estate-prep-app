stem: A prelicensing course provider designs a syllabus with 80 total hours, allocating 2 hours to
  Valuation Process and Pricing Properties. According to 19 NYCRR §176.3, is this course acceptable
  for licensure?
options:
  - The course is acceptable because the total hours meet the 80‑hour requirement.
  - The course is not acceptable because the valuation hours are below the required three.
  - The course is not acceptable because the course omits the final examination hours.
  - The course is acceptable because the course includes both valuation and other required subjects.
key: B
explanation: The regulations require exactly 3 hours for Valuation Process and Pricing Properties.
  Providing only 2 hours fails to meet this requirement, rendering the course unacceptable despite
  satisfying the total‑hour rule. The distractor claiming acceptability because total hours are met
  ignores the specific valuation hour mandate.
