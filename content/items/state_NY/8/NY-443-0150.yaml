stem: A salesperson completes a pre‑licensing course that omits any instruction in valuation process
  and pricing properties. Does this course satisfy the syllabus requirement for that subject?
options:
  - The course nearly satisfies the syllabus requirement for valuation.
  - The course does not satisfy the syllabus requirement for valuation.
  - The course mostly satisfies the syllabus requirement for valuation.
  - The course partially satisfies the syllabus requirement for valuation.
key: B
explanation: §176.3(a) mandates 3 hours of study for 'Valuation Process and Pricing Properties'. A
  course with zero hours for this subject fails to meet the mandatory requirement, so it does not
  satisfy it. The option claiming satisfaction incorrectly assumes the subject can be omitted.
