stem: A prelicensing course provider proposes to reduce the Valuation Process and Pricing Properties
  segment to two hours and increase the Real Estate Finance segment from five to six hours to keep
  the total at eighty hours. According to 19 NYCRR §176.3, is this course acceptable for licensure?
options:
  - Yes, because the total instructional hours still add up to the required eighty.
  - No, because the syllabus mandates exactly three hours for Valuation Process and Pricing
    Properties.
  - Yes, because the Real Estate Finance segment can absorb the extra hour to keep the total at
    eighty.
  - No, because the course must also include a final examination of three hours to meet the total
    requirement.
key: B
explanation: The key is correct because §176.3 requires exactly three hours of instruction in
  Valuation Process and Pricing Properties for the salesperson prelicensing course; reducing that
  segment to two hours violates the requirement regardless of adjustments to other subjects. The
  distractor claiming the course is acceptable because the total instructional hours still equal
  eighty is wrong because the rule mandates specific hour allocations for each subject, not merely a
  total hour count.
