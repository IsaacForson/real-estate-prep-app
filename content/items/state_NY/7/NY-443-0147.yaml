stem: During completion of the Property Condition Disclosure Statement, a seller knows that there is
  an abandoned underground fuel storage tank on the property that is not leaking. How should the
  seller answer question 21 regarding fuel storage tanks?
options:
  - Select NA
  - Select No
  - Select Yes
  - Select Unkn
key: C
explanation: Question 21 asks whether there have ever been fuel storage tanks above or below ground
  on the property; a prior or existing tank triggers a Yes response regardless of current use or
  leakage (§462). Hence “Select Yes” is the proper answer. The distractor “Select Unkn” would be
  wrong because the seller has actual knowledge of the tank, so marking unknown contradicts the
  instruction to answer based on actual knowledge.
