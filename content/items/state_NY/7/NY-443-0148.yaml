stem: A seller of residential real property in New York learns that the property is located in a
  Special Flood Hazard Area and the buyer's mortgage is from a federally regulated lender. How
  should the seller answer question 13 of the Property Condition Disclosure Statement?
options:
  - The seller must answer Yes.
  - The seller must answer Unkn.
  - The seller must answer NA.
  - The seller must answer No.
key: A
explanation: Under §462, sellers must answer 'Yes' to question 13 when the property is subject to a
  federal flood‑insurance requirement. The note in the statute states that homes in the Special
  Flood Hazard Area with federally regulated lenders are required to obtain and maintain flood
  insurance. Therefore the correct response is 'Yes'. The distractor 'No' would be incorrect because
  the note explicitly imposes the requirement under those conditions.
