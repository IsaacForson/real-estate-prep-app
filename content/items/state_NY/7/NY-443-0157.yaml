stem: A seller knows that the residential property they are selling is located wholly within a
  FEMA-designated Special Flood Hazard Area (SFHA). The buyer’s agent asks whether the seller must
  disclose this fact on the Property Condition Disclosure Statement. What is the seller’s
  obligation?
options:
  - Leaving the SFHA question blank and providing no explanation on the disclosure form
  - Providing a FEMA elevation certificate rather than answering the SFHA question
  - Answering “No” to the SFHA question because the buyer can obtain private insurance
  - Answering “Yes” to the SFHA question and attaching an explanatory note if desired
key: D
explanation: Under N.Y. Real Prop. Law § 462, a seller with actual knowledge that the property lies
  wholly within a FEMA‑designated Special Flood Hazard Area must answer “Yes” to the SFHA question
  on the Property Condition Disclosure Statement and may attach an explanatory note. Leaving the
  question blank or providing no explanation fails to disclose known floodplain information.
  Substituting a FEMA elevation certificate for the required answer does not satisfy the disclosure
  requirement. Answering “No” because the buyer could obtain private insurance contradicts the
  seller’s actual knowledge and is therefore incorrect.
