stem: A salesperson has completed the Real Estate Mathematics (1 hour) and Municipal Agencies (2
  hours) portions of the required course. How many hours of the course remain to be completed?
options:
  - 77 hours
  - 75 hours
  - 81 hours
  - 79 hours
key: A
explanation: The total course is 80 hours; subtracting the completed 1 + 2 = 3 hours leaves 77 hours
  remaining. The distractor of 75 hours results from mistakenly subtracting 5 hours instead of 3.
