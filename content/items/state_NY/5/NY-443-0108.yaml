stem: A salesperson has completed 68 hours of coursework, including 5 hours of Real Estate Finance.
  How many more hours of any subject are needed to reach the 80‑hour total pre‑licensing
  requirement?
options:
  - 15 hours
  - 10 hours
  - 20 hours
  - 12 hours
key: D
explanation: Under 19 NYCRR §176.3, the salesperson pre‑licensing curriculum requires a total of 80
  hours, with 5 hours allocated to Real Estate Finance. Having already completed 68 hours (which
  includes the required 5 finance hours), the salesperson needs 80 − 68 = 12 additional hours of any
  subject to meet the total. The 10‑hour option incorrectly assumes a total requirement of 78 hours,
  perhaps by mistakenly subtracting the finance hours from the total before calculating the
  remainder.
