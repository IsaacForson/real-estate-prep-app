stem: If a salesperson course includes all subjects listed in 19 NYCRR §176.3(a) and adds a 2‑hour
  elective, what must the course do to remain compliant?
options:
  - The course should cut Real Estate Finance to 3 hours and keep elective
  - The course should add the elective and increase total hours to 82
  - The course should omit the elective and keep the syllabus unchanged
  - The course should keep the elective and reduce Legal Issues to 8 hours
key: C
explanation: §176.3(b) states that all approved courses must use the course syllabus exactly as
  provided. Adding an elective changes the required hours and subjects, which is not permitted.
  Therefore the course must omit the elective to remain compliant. The distractor suggesting a
  reduction in Real Estate Finance hours still deviates from the mandated 5‑hour requirement.
