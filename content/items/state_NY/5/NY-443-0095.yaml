stem: A pre-licensing course provides 70 hours of instruction and 3 hours for the final examination.
  Does this course satisfy the total hour requirement under 19 NYCRR §176.3?
options:
  - Yes, because the course includes the required final examination hours.
  - No, because the course exceeds the instruction hour limit.
  - Yes, because the course meets the instruction hour requirement.
  - No, because the course provides fewer than the required eighty total hours.
key: D
explanation: The rule requires a total of eighty hours; seventy hours of instruction plus three
  hours of final exam equals seventy‑three hours, which is insufficient. The option asserting
  sufficiency based only on instruction hours is wrong because it ignores the final examination
  hours and the total requirement.
