stem: A salesperson completes a pre-licensing course that includes 3 hours of Taxes and Assessments,
  74 hours of other subjects, and 3 hours for the final examination. Does this course meet the state
  licensing requirement?
options:
  - The course satisfies the Taxes and Assessments requirement only
  - The course exceeds the licensing requirement
  - The course meets the licensing requirement
  - The course does not meet the licensing requirement
key: C
explanation: The course totals 3 + 74 + 3 = 80 hours, which matches the required 80 hours (77 hours
  of instruction plus a 3‑hour final examination) set forth in 19 NYCRR § 176.3. The option stating
  that the course exceeds the licensing requirement is incorrect because the total equals, not
  exceeds, the required hours.
