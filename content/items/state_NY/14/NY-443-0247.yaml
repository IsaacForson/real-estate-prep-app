stem: A salesperson's pre‑licensing course includes 4 hours of Taxes and Assessments instruction.
  Based on 19 NYCRR §176.3(a), does this satisfy the state requirement for that subject?
options:
  - Yes, it meets the exact requirement.
  - No, it exceeds the requirement.
  - Yes, it exceeds the minimum requirement.
  - No, it falls short of the requirement.
key: B
explanation: The rule requires exactly three hours for Taxes and Assessments; providing four hours
  exceeds that requirement and therefore does not satisfy the mandated syllabus. The distractor
  claiming that exceeding the minimum requirement is sufficient is wrong because the syllabus
  demands the precise hour allocation.
