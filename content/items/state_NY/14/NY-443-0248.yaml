stem: If a pre‑licensing course devotes the minimum required hours to Taxes and Assessments, what
  percentage of the total 80‑hour course does this represent?
options:
  - 4.00%
  - 2.50%
  - 5.00%
  - 3.75%
key: D
explanation: Three hours out of eighty equals 0.0375, or 3.75 % when multiplied by one hundred. The
  distractor of 5.00 % results from mistakenly using four hours instead of three.
citation:
  source: 19 N.Y.C.R.R. Parts 175-179 — 19 NYCRR Parts 175 to 179 — Department of State real estate
    regulations — NY DOS booklet, March 2026 — § 176.3(a)
  url: null
