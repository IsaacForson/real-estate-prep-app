stem: A salesperson completes a pre-licensing course that includes 3 hours of Taxes and Assessments,
  75 hours of other subjects, and 2 hours for the final examination. Does this course meet the state
  licensing requirement?
options:
  - No, it does not meet the requirement because the final examination must be 3 hours.
  - No, it does not meet the requirement because all subjects except the final examination match the
    syllabus.
  - No, it does not meet the requirement because the total instructional hours equal 80.
  - No, it does not meet the requirement because the Taxes and Assessments hours are less than
    required.
key: A
explanation: The syllabus in §176.3(a) requires exactly 3 hours for the final examination as part of
  the 80‑hour total. Although the course sums to 80 hours, the final examination is only 2 hours,
  violating the required distribution. The statement that the final examination must be 3 hours is
  correct; meeting the total hour count alone does not satisfy the syllabus—the specific hour
  allocations must also be correct.
