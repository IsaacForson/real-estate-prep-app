stem: "A landlord publishes an advertisement stating 'No children allowed' for a rental apartment
  that is not restricted to older persons. Under New York Human Rights Law, this advertisement is:"
options:
  - Unlawful because it expresses a limitation based on familial status.
  - Lawful if the building contains no more than two family units.
  - Lawful because familial status is not a protected class under New York law.
  - Lawful if the owner resides in the building.
key: A
explanation: Under N.Y. Exec. Law art. 15 § 296(5)(a)(3), it is unlawful to publish an advertisement
  that expresses a limitation based on familial status unless an exemption applies. No exemption for
  familial status exists in this scenario, making the advertisement unlawful. The claim that the
  advertisement would be lawful if the building contained no more than two family units is incorrect
  because the owner‑residence exemption only applies to buildings with no more than two families,
  which is not indicated in the scenario.
