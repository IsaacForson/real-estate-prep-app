stem: "An owner of a two-family building lives in one unit and refuses to rent the other unit to a
  prospective tenant because of the tenant's race. Under New York Human Rights Law, this refusal
  is:"
options:
  - Lawful because the owner resides in one of the two units.
  - Unlawful because race discrimination is prohibited in housing.
  - Lawful only if the building contains more than two families.
  - Unlawful unless the owner does not reside in the building.
key: A
explanation: The law exempts from all prohibitions in paragraph (a) the rental of a housing
  accommodation in a building with no more than two families if the owner resides in one unit. Since
  the owner lives in one unit of a two‑family building, the race‑based refusal is lawful. The
  statement that race discrimination is prohibited in housing is incorrect because the exemption
  permits race discrimination in this specific circumstance.
citation:
