stem: An owner filed a statement with the Secretary of State wishing not to be solicited, but the
  current cease and desist list has not yet been updated to include the owner’s name. A broker sends
  a postcard advertising a listing to that owner. How should the broker’s action be evaluated under
  § 442-h(3)(a)?
options:
  - The broker’s action is permissible because cease and desist zones only apply to telephone
    solicitation.
  - The broker’s action is permissible because the owner’s name does not yet appear on the current
    cease and desist list.
  - The broker’s action is allowed if the postcard is sent via electronic mail rather than regular
    mail.
  - The broker’s action constitutes a prohibited solicitation because the owner’s name is on the
    cease and desist list.
key: B
explanation: Under § 442-h(3)(a), a broker may not solicit a listing from an owner only if that
  owner’s name appears on the current cease and desist list prepared by the Secretary of State.
  Because the owner filed a statement wishing not to be solicited but the list has not yet been
  updated to include the name, the owner’s name is not on the current list. Therefore, sending a
  postcard advertising a listing to that owner is permissible. The option stating that cease and
  desist zones only apply to telephone solicitation is incorrect because the prohibition applies to
  any solicitation, including mail. The option stating that the action is allowed if the postcard is
  sent via electronic mail rather than regular mail is incorrect because the rule does not
  distinguish between electronic and regular mail; both constitute solicitation. The option stating
  that the action constitutes a prohibited solicitation because the owner’s name is on the cease and
  desist list is incorrect because, as explained, the name is not yet on the current list.
