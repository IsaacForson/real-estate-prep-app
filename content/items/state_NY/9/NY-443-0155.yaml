stem: Under New York Executive Law §296(5)(a)(1), which action is an unlawful discriminatory practice?
options:
  - Refusing to rent a housing accommodation because of the applicant's marital status
  - Offering a lower rent to a tenant who is a veteran in New York
  - Providing a preferential lease term to a family with children for example
  - Advertising a unit as 'ideal for young professionals' in the city
key: A
explanation: The statute prohibits refusing to sell, rent, lease or otherwise deny housing because
  of marital status among other protected classes. Offering a lower rent based on veteran status is
  not prohibited by the listed classes; providing a preferential term to families with children is
  not prohibited; advertising as 'ideal for young professionals' is not a prohibited statement under
  the enumerated classes.
