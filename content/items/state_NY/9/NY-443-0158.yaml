stem: A real estate licensee refuses to show a house to a prospective buyer who uses a wheelchair.
  Which protected characteristic does this action violate under NY Exec Law §296(5)(c)(1)?
options:
  - The action violates the prohibition against discrimination based on race
  - The action violates the prohibition against discrimination based on religion
  - The action violates the prohibition against discrimination based on disability
  - The action violates the prohibition against discrimination based on sex
key: C
explanation: Refusing to show because of disability is prohibited under §296(5)(c)(1). The claim
  that the action is based on religion is incorrect because the refusal is due to disability, not
  religion.
