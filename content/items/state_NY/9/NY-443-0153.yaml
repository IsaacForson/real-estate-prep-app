stem: "A broker publishes an advertisement stating 'Adults only, no children' for a rental apartment
  in a building that is not designated as senior housing. Under New York Executive Law §
  296(5)(a)(3), this advertisement is:"
options:
  - It is lawful because the building is owner-occupied
  - It is unlawful because it expresses a familial status limitation
  - It is lawful because familial status is not a protected class
  - It is unlawful because it discriminates based on age
key: B
explanation: The statute prohibits printing any statement that expresses a limitation as to familial
  status, which includes restrictions on children. Therefore, the advertisement is unlawful. The
  distractor claiming it is lawful because the building is owner-occupied is incorrect because that
  exemption applies only to buildings with not more than two families where the owner resides, a
  condition not present in the scenario.
