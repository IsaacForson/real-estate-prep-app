stem: Under New York Real Property Law § 443, a licensee who contracts to locate residential
  property for a buyer, or who finds a buyer and presents an offer to the seller while negotiating
  on the buyer's behalf, is acting as which type of agent?
options:
  - Designated sales agent
  - Broker's agent
  - Buyer's agent
  - Listing agent
key: C
explanation: New York Real Property Law § 443 defines a buyer's agent as an agent who contracts to
  locate property for a buyer or who finds a buyer and negotiates the purchase on the buyer's
  behalf.
