stem: A listing agent is about to sign a listing agreement with a seller for a single-family home.
  Under Real Property Law § 443, when must the agent provide the seller with the agency disclosure
  form and obtain a signed acknowledgment?
options:
  - Within three business days after the listing agreement is signed
  - At the first open house held for the property
  - Prior to entering into the listing agreement with the seller
  - At the closing table when title transfers
key: C
explanation: Section 443 requires a listing agent to provide the disclosure form and obtain a signed
  acknowledgment from the seller prior to entering into the listing agreement.
citation:
  source: N.Y. Real Prop. Law art. 12-A, § 443
  url: null
  quoted_text: A listing agent shall provide the disclosure form set forth in subdivision four of this
    section to a seller or landlord prior to entering into a listing agreement with the seller or
    landlord and shall obtain a signed acknowledgment from the seller or landlord, except as
    provided in paragraph e of this subdivision.
