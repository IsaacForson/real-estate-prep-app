stem: During a sale, a buyer asks the seller's agent to negotiate a lower price on the buyer's
  behalf. Under the New York agency disclosure form, why is the seller's agent **NOT** obligated to
  do so?
options:
  - A seller's agent may only negotiate through the listing broker
  - A seller's agent does not represent the interests of the buyer
  - A seller's agent must first obtain the seller's written consent
  - A seller's agent needs a separate license to negotiate for buyers
key: B
explanation: The disclosure form makes clear that a seller's agent represents only the seller's
  interests and does not represent the interests of the buyer, so no duty exists to negotiate for
  the buyer.
