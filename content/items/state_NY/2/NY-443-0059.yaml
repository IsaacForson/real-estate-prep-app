stem: According to the disclosure form for landlord-tenant transactions, which of the following is a
  fiduciary duty owed by a landlord's agent to the landlord?
options:
  - Negotiate rent
  - Disclose defects
  - Act as agent
  - Reasonable care
key: D
explanation: According to New York Real Property Law Article 12-A, §442-l, a landlord's agent owes
  the fiduciary duties of reasonable care, undivided loyalty, confidentiality, full disclosure,
  obedience, and duty to account to the landlord. Therefore, reasonable care is a duty owed. The
  option that suggests disclosing defects, the option that suggests negotiating rent for the tenant,
  and the option that suggests acting as a broker's agent are not fiduciary duties owed to the
  landlord by the landlord's agent.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — § 442-l
  url: null
  quoted_text: "A landlord's agent has, without limitation, the following fiduciary duties to the
    landlord: reasonable care, undivided loyalty, confidentiality, full disclosure, obedience and
    duty to account."
