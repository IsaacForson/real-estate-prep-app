    443(3)(c)
  url: null
  quoted_text: A buyer’s agent or tenant’s agent shall provide the form to the seller, seller’s agent,
    landlord or landlord’s agent at the time of the first substantive contact with the seller or
    landlord and shall obtain a signed acknowledgment from the seller, landlord or the listing agent
