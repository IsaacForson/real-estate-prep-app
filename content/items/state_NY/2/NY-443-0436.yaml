stem: A buyer's agent meets a prospective seller at an open house and discusses the property's
  price. According to NY Real Property Law §443(3)(c), what must the buyer's agent do at that
  moment?
options:
  - Providing the disclosure form and obtaining a signed acknowledgment from the seller
  - Providing the disclosure form and obtaining a signed acknowledgment from the buyer
  - Providing the disclosure form and obtaining a signed acknowledgment from the landlord
  - Providing the disclosure form and obtaining a signed acknowledgment from the tenant
key: A
explanation: The statute obliges a buyer’s agent to provide the disclosure form to the seller,
  seller’s agent, landlord or landlord’s agent at the time of the first substantive contact with the
  seller or landlord and obtain a signed acknowledgment. Giving the form to the buyer herself would
  satisfy the buyer‑side requirement but not the obligation that arises when the agent first
  contacts the seller.
citation:
