stem: Under NY Real Property Law § 442-l, what must a broker obtain before acting as a dual agent
  with designated sales agents in a landlord‑tenant transaction?
options:
  - Written informed consent from either the tenant or landlord
  - Written disclosure signed by both the tenant and landlord
  - Written informed consent from both the tenant and landlord
  - Verbal informed consent from both the tenant and landlord
key: C
explanation: The statute permits a broker to designate sales agents for each party only after the
  tenant and landlord provide their informed consent in writing. Without such written consent, the
  broker lacks authority to act as a dual agent with designated sales agents. The distractor
  suggesting a verbal agreement is incorrect because the law explicitly requires written consent.
  The other distractors describe unrelated requirements not mentioned in the provision.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — § 442-l
  url: null
  quoted_text: If the tenant and the landlord provide their informed consent in writing, the
    principals and the real estate broker who represents both parties as a dual agent may designate
    a sales agent to represent the tenant and another sales agent to represent the landlord.
