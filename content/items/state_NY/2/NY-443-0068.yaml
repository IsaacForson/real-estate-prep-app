stem: A broker asks the State real estate board to adopt a rule that would mandate specific formats
  for maintaining transaction records of client funds. Under New York Real Property Law § 442-k(1),
  may the board adopt such a rule?
options:
  - The board may adopt the rule because it pertains to broker conduct involving client funds.
  - The board may not adopt the rule because transaction records are reserved for the Secretary of
    State.
  - The board may adopt the rule only after consulting the Secretary of State prior to
    implementation.
  - The board may not adopt the rule unless the broker consents in writing.
key: B
explanation: Section 442-k(1) expressly reserves records of transactions to be maintained for the
  exclusive regulatory authority of the Secretary of State, so the board lacks authority to adopt
  such a rule. The distractor suggesting the board may adopt because it pertains to broker conduct
  ignores this specific reservation.
