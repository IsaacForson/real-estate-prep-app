stem: A licensee obtained a signed acknowledgment from a seller on January 10, 2022. Under NY Real
  Property Law § 443(d), what is the earliest date on which the licensee may first destroy the
  acknowledgment?
options:
  - January 10, 2024
  - January 10, 2025
  - January 10, 2023
  - January 10, 2026
key: B
explanation: The law requires the licensee to maintain a copy of the signed acknowledgment for not
  less than three years. Therefore the acknowledgment may be destroyed only after three full years
  have elapsed from the date it was obtained. Adding three years to January 10, 2022 yields January
  10, 2025 as the earliest permissible destruction date. The one‑year option (January 10, 2024)
  violates the minimum retention period, while the later dates exceed the required minimum and are
  not the earliest allowable date.
