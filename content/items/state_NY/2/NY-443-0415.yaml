math:
  worked_solution: |-
    Identify the date the acknowledgment was obtained: January 10, 2022.
    Add the required retention period of three years: January 10, 2022 + 3 years = January 10, 2025.
    The earliest date the acknowledgment may be destroyed is January 10, 2025.
  formulas:
