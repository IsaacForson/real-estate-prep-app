stem: Under 19 NYCRR § 175.7, a broker may receive compensation from more than one party only if
  which condition is met?
options:
  - The broker must disclose compensation from multiple parties to the department of state.
  - The broker may accept compensation from both parties if the transaction is commercial.
  - The broker may receive compensation from more than one party only with the full knowledge and
    consent of the client.
  - The broker may receive compensation from more than one party without informing the client.
key: C
explanation: The rule states that a broker shall not receive compensation from more than one party
  except with the full knowledge and consent of the broker’s client. Therefore, compensation from
  multiple parties is permissible only when the client knows and consents. The other options either
  omit the consent requirement or add conditions not found in the rule.
