stem: According to 19 NYCRR § 175.19(b), what is prohibited for a real estate broker?
options:
  - The broker must receive compensation from more than one party without client consent
  - The broker must negotiate directly with an owner who has an exclusive listing with another broker
  - The broker must enter into a net listing contract for the sale of real property
  - The broker must fail to disclose a material defect in rental property
key: C
explanation: Under 19 NYCRR § 175.19(b), a broker is prohibited from making or entering into a net
  listing contract for the sale of real property. Therefore, entering into such a contract is not
  permitted. The distractor about negotiating with an owner who has an exclusive listing with
  another broker describes a different prohibition under § 175.8, not the net listing ban.
