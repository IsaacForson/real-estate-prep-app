stem: A seller's agent meets a prospective buyer at an open house and begins discussing property
  features. According to NY Real Property Law §443(3)(b), what must the seller's agent do at that
  moment?
options:
  - Providing the disclosure form and obtaining a signed acknowledgment from the buyer
  - Providing the disclosure form and obtaining a signed acknowledgment from the seller
  - Providing the disclosure form and obtaining a signed acknowledgment from the landlord
  - Providing the disclosure form and obtaining a signed acknowledgment from the tenant's agent
key: A
explanation: The law requires a seller’s agent to provide the disclosure form to a buyer, buyer’s
  agent, tenant or tenant’s agent at the time of the first substantive contact with the buyer or
  tenant and obtain a signed acknowledgment. Providing the form to the seller herself is incorrect
  because the rule directs the disclosure to the buyer side of the transaction.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
