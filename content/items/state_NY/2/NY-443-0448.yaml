stem: Under NY Real Property Law § 442(6), when may the Secretary of State grant a real estate
  broker or salesperson license to an applicant who is a member of the household of an armed forces
  member without requiring the applicant to submit additional evidence of competency?
options:
  - If the applicant's out-of-state license was issued under standards deemed by the secretary to be
    no less rigorous than those required for New York licensure
  - If the applicant has lived in New York continuously for at least one year immediately preceding
    the application date
  - If the applicant's out-of-state license remained active and valid for no more than two years
    before the application
  - If the applicant passes the New York State real estate licensing examination administered by the
    Department of State
key: A
explanation: The statute specifies that a license may be granted without further evidence of
  competency when the applicant's out-of-state license, certification, or registration was granted
  in compliance with standards that are, in the judgment of the secretary, no less rigorous than
  those required for licensure in New York. The distractor about residency is incorrect because the
  law does not impose a residency requirement for this exemption.
