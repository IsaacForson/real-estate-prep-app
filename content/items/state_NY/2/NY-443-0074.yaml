stem: When must a buyer's agent provide the agency disclosure form to a prospective buyer under New
  York Real Property Law § 443.3(c)?
options:
  - The agent must provide the disclosure form after the buyer signs the purchase contract.
  - The agent must provide the disclosure form when the buyer requests a copy of the form.
  - The agent must provide the disclosure form at the first substantive contact with the buyer.
  - The agent must provide the disclosure form prior to entering into an agreement to act as the
    buyer's agent.
key: D
explanation: Section 443.3(c) requires a buyer’s agent to provide the disclosure form to the buyer
  prior to entering into an agreement to act as the buyer’s agent and to obtain a signed
  acknowledgment. Therefore, the correct timing is before the buyer’s agency agreement is signed.
  The description that the agent provides the form after the buyer signs the purchase contract
  applies to a seller’s or landlord’s agent under § 443.3(b).
