stem: A broker in a cease and desist zone established by the Secretary of State receives a request
  to list a property from an owner who has filed an owner’s statement with the Secretary of State
  expressing a wish not to be solicited. According to NY Real Property Law § 442-h(3)(a), what is
  the broker permitted to do?
options:
  - Refrain from soliciting the listing
  - Solicit the listing after providing written disclosure
  - Solicit the listing if the owner later consents verbally
  - Solicit the listing after obtaining Secretary approval
key: A
explanation: The statute prohibits any broker from soliciting a listing from an owner who has filed
  a cease‑and‑desist statement and whose name appears on the current cease‑and‑desist list. The most
  tempting distractor, soliciting after providing written disclosure, still violates the outright
  ban on solicitation.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — §
    442-h(3)(a)
  url: null
  quoted_text: no real estate broker, salesperson or other person regularly engaged in the trade or
    business of buying and selling real estate shall solicit a listing from any owner who has filed
    a statement with the Secretary of State if such owner’s name appears on the current cease and
    desist list prepared by the Secretary of State.
