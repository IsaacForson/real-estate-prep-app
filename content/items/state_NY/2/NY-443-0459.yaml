stem: A broker who represents the seller in a residential transaction receives the agreed commission
  from the seller and also accepts a referral fee from the buyer’s agent. Under 19 NYCRR §175.7, is
  this permissible?
options:
  - The broker's action is permissible only if the seller gave full knowledge and consent to
    receiving compensation from more than one party.
  - The broker's action is impermissible unless the broker also obtains the buyer’s written consent.
  - The broker's action is impermissible because receiving any compensation from the buyer’s agent
    violates the prohibition.
  - The broker's action is permissible because the broker disclosed the dual compensation to both
    parties.
key: A
explanation: The rule allows compensation from more than one party only with the full knowledge and
  consent of the broker’s client (the seller). Mere disclosure to both parties does not satisfy this
  requirement, making the first distractor incorrect.
