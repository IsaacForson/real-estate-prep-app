stem: Under NY Real Property Law §443(k), which party may **NOT** provide direction and instruction
  directly to a broker's agent?
options:
  - Providing instructions to the broker's agent as the tenant's agent
  - Providing instructions to the broker's agent as the seller
  - Providing instructions to the broker's agent as the buyer's agent
  - Providing instructions to the broker's agent as the listing agent
key: B
explanation: The statute explicitly states that the seller, buyer, landlord or tenant cannot provide
  instructions or direction directly to the broker’s agent. The listing agent, buyer’s agent or
  tenant’s agent are authorized to provide such direction, making the seller the correct choice.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — §
    443(k)
  url: null
  quoted_text: The broker’s agent does not have a direct relationship with the seller, buyer, landlord
    or tenant and the seller, buyer, landlord or tenant can not provide instructions or direction
    directly to the broker’s agent.
