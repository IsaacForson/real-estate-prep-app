stem: Under New York Real Property Law § 442, a real estate broker may pay part of a commission to
  an unlicensed corporation or limited liability company only if
options:
  - each shareholder/member is a licensed associate broker or salesperson associated with the broker
  - each shareholder/member is a licensed attorney admitted to practice in New York
  - each shareholder/member is a licensed appraiser certified by the state
  - each shareholder/member is a licensed home inspector registered with the department
key: A
explanation: The statute permits a broker to pay part of a commission to an unlicensed corporation
  or LLC only when each shareholder or member is individually associated with the broker as a duly
  licensed associate broker or salesperson. This ensures that only qualified licensees indirectly
  receive compensation through the entity. The option stating that each shareholder/member is a
  licensed attorney admitted to practice in New York is incorrect because the law does not allow
  attorneys to satisfy this requirement. Similarly, options requiring licensed appraisers or home
  inspectors are incorrect because those professions are not listed as qualifying associates.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — § 442
  url: null
  quoted_text: provided, however, that notwithstanding any other provision of this section, it shall
    be permissible for a real estate broker to pay any part of a fee, commission, or other
    compensation received to an unlicensed corporation or an unlicensed limited liability company if
    each of its shareholders or members, respectively, is associated as an individual with the
    broker as a duly licensed associate broker or salesman.
