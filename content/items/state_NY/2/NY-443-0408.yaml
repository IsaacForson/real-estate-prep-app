stem: An owner filed a statement with the Secretary of State wishing not to be solicited in a cease
  and desist zone established in January. In July, the owner asks when the cease and desist list
  will next be updated. Under NY Real Property Law §442-h(3)(b), when will the list be revised and
  reprinted?
options:
  - The list will be revised and reprinted only after a public hearing is held
  - The list will be revised and reprinted every six months from the date of filing
  - The list will be revised and reprinted upon receipt of a complaint from any broker
  - The list will be revised and reprinted by December 31 of the current year
key: D
explanation: Subsection 3(b) of §442-h mandates that each cease and desist list be revised and
  reprinted at least annually on or before December 31st. Therefore, after a January filing, the
  next required update occurs by December 31 of the same year. The other options propose intervals
  or triggers not prescribed by the rule.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — §
    442-h(3)(b)
  url: null
  quoted_text: Each list shall be revised and reprinted at least annually on or before December 31st
    and shall be made available to the public and to real estate brokers at a reasonable price to be
    set by the Secretary of State and approved by the Director of the Division of the Budget.
