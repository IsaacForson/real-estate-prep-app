    443(3)(a)
  url: null
  quoted_text: A listing agent shall provide the disclosure form set forth in subdivision four of this
    section to a seller or landlord prior to entering into a listing agreement with the seller or
    landlord and shall obtain a signed acknowledgment from the seller or landlord.
