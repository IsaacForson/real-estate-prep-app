stem: Before the listing agent may enter into a listing agreement with the seller, what must the
  agent do?
options:
  - Provide the agency disclosure form to the seller and obtain a signed acknowledgment.
  - Provide the agency disclosure form to the seller when the seller asks for it.
  - Provide the agency disclosure form to the seller after the listing agreement is signed.
  - Provide the agency disclosure form to the seller and keep it for the agent’s records.
key: A
explanation: Under §443.3(a), a listing agent must provide the disclosure form to the seller or
  landlord prior to entering into a listing agreement and obtain a signed acknowledgment. Providing
  the form only when the seller asks for it is incorrect because the agent must provide the form
  regardless of whether the seller requests it.
