stem: A broker offers to share part of her earned commission directly with the buyer as a closing
  credit. Under New York's commission-splitting statute, that payment to the buyer must **NOT** be
  made for what?
options:
  - Selecting the title company used for the closing transaction
  - Attending the closing on behalf of the buyer personally
  - Reviewing the signed purchase contract terms carefully
  - Performing licensed brokerage activity in the transaction
key: D
explanation: New York's commission-splitting statute bars a broker from paying a buyer or seller any
  part of a commission for performing licensed brokerage activity, since only licensees may be
  compensated for such work.
citation:
  source: N.Y. Real Prop. Law art. 12-A, § 442
  url: null
  quoted_text: Such fee, commission, or other compensation must not be made to the seller, buyer,
    landlord or tenant for performing any activity requiring a license under this article.
