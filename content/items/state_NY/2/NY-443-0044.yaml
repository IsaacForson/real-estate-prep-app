stem: A buyer's agent meets a prospective buyer at an open house and discusses showing properties.
  Before the buyer signs a buyer agency agreement, what must the agent do according to NY Real
  Property Law §443?
options:
  - Providing the disclosure form to the buyer’s agent instead of directly to the buyer during the
    first substantive contact
  - Providing the disclosure form to the buyer after the buyer agency agreement has been signed for
    the transaction
  - Providing the disclosure form to the buyer and obtaining a signed acknowledgment before signing
    the buyer agency agreement
  - Obtaining a signed acknowledgment from the buyer before discussing any property details with
    them during the initial meeting
key: C
explanation: Under §443(3)(c), a buyer’s agent must provide the disclosure form and obtain a signed
  acknowledgment prior to entering into a buyer agency agreement. Providing the form and obtaining
  acknowledgment after the agreement is signed does not satisfy this requirement.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — §
    443(3)(c)
  url: null
  quoted_text: c. A buyer’s agent or tenant’s agent shall provide the disclosure form to the buyer or
    tenant prior to entering into an agreement to act as the buyer’s agent or tenant’s agent and
    shall obtain a signed acknowledgment from the buyer or tenant, except as provided in paragraph e
    of this subdivision.
