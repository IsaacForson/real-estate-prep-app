stem: According to New York Real Property Law § 442-l, which of the following is a fiduciary duty
  owed by a landlord's agent to the landlord?
options:
  - Rent guarantee clause
  - Fee splitting agreement
  - Undivided loyalty
  - Profit maximization
key: C
explanation: The statute explicitly lists undivided loyalty as one of the fiduciary duties owed by a
  landlord's agent to the landlord. The distractor "Profit maximization" is not a fiduciary duty;
  the law requires loyalty to the client, not profit maximization.
citation:
  source: N.Y. Real Prop. Law art. 12-A § 442-l
  url: null
  quoted_text: "A landlord’s agent has, without limitation, the following fiduciary duties to the
    landlord: reasonable care, undivided loyalty, confidentiality, full disclosure, obedience and
    duty to account."
