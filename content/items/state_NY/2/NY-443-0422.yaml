stem: Under NY Real Property Law § 442-k(1), which of the following acts is reserved for the
  exclusive regulatory authority of the Secretary of State?
options:
  - The act of commingling
  - The act of prescribing
  - The act of advising
  - The act of establishing
key: A
explanation: The statute lists commingling money of a principal among the matters reserved for the
  Secretary of State’s exclusive regulatory authority. The other acts—prescribing course content,
  advising the Secretary of State, and establishing rules for school approval—are powers of the
  State real estate board, not reserved to the Secretary.
