stem: Under NY Real Property Law § 442-h(2)(b), what must a broker obtain before establishing a new
  principal office in a geographic area subject to a nonsolicitation order?
options:
  - Authorization from the State real estate board
  - Approval from the local municipal authority
  - Written consent from the homeowners association
  - Prior approval from the Secretary of State
key: D
explanation: The law explicitly states that a broker may not establish a new principal or branch
  office in a nonsolicitation area without first securing prior approval from the Secretary of
  State. The most tempting distractor, written consent from homeowners, is not sufficient; the
  statute requires the Secretary’s approval, not homeowner consent.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — §
    442-h(2)(b)
  url: null
  quoted_text: No real estate broker shall establish a new principal office or branch office within
    any geographic area which is the subject of a nonsolicitation order without prior approval from
    the Secretary of State.
