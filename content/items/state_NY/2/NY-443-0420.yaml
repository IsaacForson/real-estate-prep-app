stem: A landlord’s agent meets a prospective tenant at a property showing and begins discussing
  lease terms. According to NY Real Property Law §443.3(b), what must the landlord’s agent do before
  proceeding further?
options:
  - Providing the disclosure form and delivering a copy to the tenant only
  - Providing the disclosure form and obtaining a signed acknowledgment from the landlord
  - Providing the disclosure form and obtaining a signed acknowledgment from the tenant
  - Providing the disclosure form and delivering a copy to the landlord only
key: C
explanation: The law requires a landlord’s agent to provide the agency disclosure form to the tenant
  and obtain a signed acknowledgment at the time of the first substantive contact with the tenant.
  This ensures the tenant is informed of the agency relationship before any further discussion.
  Delivering a copy only or obtaining acknowledgment from the landlord does not satisfy the
  statutory requirement.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
