    443.3(b)
  url: null
  quoted_text: A seller’s agent or landlord’s agent shall provide the disclosure form set forth in
    subdivision four of this section to a buyer, buyer’s agent, tenant or tenant’s agent at the time
    of the first substantive contact with the buyer or tenant and shall obtain a signed
    acknowledgment from the buyer or tenant
