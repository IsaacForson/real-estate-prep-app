stem: A broker represents both the tenant and landlord in a lease transaction and appoints
  Salesperson X to represent the tenant and Salesperson Y to represent the landlord, but does not
  obtain written informed consent from either party. Under NY Real Property Law § 442-l, what is the
  legal consequence?
options:
  - The broker's license is subject to immediate suspension
  - The broker must pay a civil penalty of five hundred dollars
  - The broker must disclose the arrangement to the parties after closing
  - The broker may not act as a dual agent with designated sales agents
key: D
explanation: The statute allows a broker to designate sales agents only when the tenant and landlord
  give their informed consent in writing. Absent that written consent, the broker lacks authority to
  act as a dual agent with designated sales agents. The distractor referencing a civil penalty is
  incorrect because the provision does not prescribe any monetary fine for this violation. The other
  distractors describe consequences not supported by the cited text.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — § 442-l
  url: null
  quoted_text: If the tenant and the landlord provide their informed consent in writing, the
    principals and the real estate broker who represents both parties as a dual agent may designate
    a sales agent to represent the tenant and another sales agent to represent the landlord.
