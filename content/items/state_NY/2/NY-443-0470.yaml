stem: Under NY Real Property Law §442-b, what is the required timing for a broker to notify the
  Department of State after a real estate salesperson's association with the broker is terminated?
options:
  - The broker must notify the Department of State within three business days of the termination.
  - The broker must notify the Department of State by the end of the next business day.
  - The broker must notify the Department of State within 24 hours of the termination.
  - The broker must notify the Department of State forthwith (immediately) after the termination.
key: D
explanation: The statute requires the broker to forthwith notify the Department of State upon
  termination of a salesperson’s association, meaning immediate notification without delay. The
  distractor that specifies a 24‑hour window adds a time period not found in the law and therefore
  is incorrect.
