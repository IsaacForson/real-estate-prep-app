stem: "A broker wants to pay part of a commission to an unlicensed limited liability company. The
  LLC has two members: one is a licensed salesperson associated with the broker, and the other is
  not licensed. Is this permissible under NY Real Property Law § 442?"
options:
  - It is permissible because the LLC is unlicensed but at least one member is licensed.
  - It is permissible because the broker may pay any part of a commission to any unlicensed entity.
  - It is not permissible because the LLC includes a member who is not licensed as an associate.
  - It is not permissible because the LLC must be a licensed broker to receive compensation.
key: C
explanation: NY Real Property Law § 442 allows a broker to pay any portion of a commission to an
  unlicensed corporation or limited liability company only when each shareholder or member is
  associated with the broker as a duly licensed associate broker or salesperson. Because the LLC
  includes a member who is not licensed, the payment is not permissible. The statement that a broker
  may pay any part of a commission to any unlicensed entity is incorrect; the statute limits the
  permission to LLCs whose members are all licensed associates.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
