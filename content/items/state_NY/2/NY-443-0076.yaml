stem: A broker's agent is engaged by a listing agent to assist in locating a buyer for a residential
  property. Under NY Real Property Law §443, who is liable for the broker's agent's acts?
options:
  - The listing agent
  - The buyer's agent
  - The broker's agent
  - The seller's agent
key: A
explanation: Under §443, a listing agent, buyer’s agent, or tenant’s agent who provides direction
  and instruction to a broker’s agent assumes liability for that broker’s agent’s acts. Because the
  listing agent engaged the broker’s agent, the listing agent bears that liability. The buyer’s
  agent would only be liable if it had engaged the broker’s agent, which it did not in this
  scenario.
