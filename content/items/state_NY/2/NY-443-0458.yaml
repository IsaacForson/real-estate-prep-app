stem: "Under 19 NYCRR §175.8, a broker may negotiate the sale of property directly with an owner who
  has an existing written exclusive authority contract with another broker only if:"
options:
  - The broker has obtained written consent from the owner
  - The broker is unaware of the existing exclusive contract
  - The broker offers to reduce the commission rate
  - The property is located outside New York State
key: B
explanation: The regulation prohibits direct negotiation only when the broker knows of the owner’s
  exclusive contract with another broker; therefore, lack of knowledge permits the negotiation. The
  distractor suggesting written consent from the owner is incorrect because the rule does not
  provide an exception based on the owner’s consent.
