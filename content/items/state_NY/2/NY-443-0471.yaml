stem: A broker terminates a salesperson's association on Monday morning. When must the broker notify
  the Department of State under NY Real Property Law §442-b?
options:
  - The broker must notify the Department of State within 24 hours of the termination.
  - The broker must notify the Department of State by the close of the next business day.
  - The broker must notify the Department of State forthwith (immediately) after the termination.
  - The broker must notify the Department of State within three business days of the termination.
key: C
explanation: Section 442‑b mandates that the broker shall forthwith notify the Department of State,
  which means immediately upon the termination. Options that impose a 24‑hour limit,
  end‑of‑next‑business‑day, or three‑business‑day period introduce specific timeframes not present
  in the statute and are therefore incorrect.
