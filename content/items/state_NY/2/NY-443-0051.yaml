stem: After a cease and desist zone is established under New York Real Property Law § 442-h(3)(a),
  what is prohibited for a real estate broker regarding an owner who has filed a statement with the
  Secretary of State wishing **NOT** to be solicited?
options:
  - Charging the owner a fee for market analysis.
  - Referring the owner to another broker.
  - Soliciting a listing from that owner.
  - Providing the owner with comparative market data.
key: C
explanation: The statute prohibits brokers from soliciting a listing from any owner who has filed a
  statement in a cease and desist zone if the owner's name appears on the current cease and desist
  list. The other activities are not prohibited by this rule.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — §
    442-h(3)(a)
  url: null
  quoted_text: no real estate broker, salesperson or other person regularly engaged in the trade or
    business of buying and selling real estate shall solicit a listing from any owner who has filed
    a statement with the Secretary of State if such owner’s name appears on the current cease and
    desist list prepared by the Secretary of State.
