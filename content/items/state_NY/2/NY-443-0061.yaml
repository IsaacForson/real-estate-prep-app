stem: A broker's agent, while assisting a listing agent in locating a tenant, negligently fails to
  disclose a material defect in the rental property. Under the disclosure statute, who may be held
  liable for the broker's agent's negligence?
options:
  - The tenant is liable because they suffered the harm from the undisclosed defect.
  - The listing agent is liable because they provided direction and instruction to the broker's
    agent.
  - The landlord is liable because they ultimately hired the listing agent.
  - The broker's agent alone is liable because they are an independent contractor.
key: B
explanation: The statute states that the listing agent or tenant's agent who provides direction and
  instruction to a broker's agent will have liability for the broker's agent's acts. Therefore, the
  listing agent may be held liable. The distractor suggesting the broker's agent alone is liable is
  incorrect because the law imposes liability on the supervising agent who directs the work.
citation:
