stem: A broker learns that a homeowner has signed an exclusive right-to-sell listing agreement with
  another broker. The homeowner asks the broker to show the property and discuss price. What must
  the broker do under 19 NYCRR § 175.8?
options:
  - The broker must decline to negotiate the sale directly with the homeowner
  - The broker must proceed with showing the property as long as no commission is accepted
  - The broker must inform the homeowner that dual agency is permitted
  - The broker must obtain written consent from the other broker before showing the property
key: A
explanation: Section 175.8 forbids a broker from negotiating the sale of property directly with an
  owner who has an existing exclusive listing with another broker. Since the homeowner already has
  such an agreement, the broker must decline to negotiate. The distractor that permits showing the
  property as long as no commission is accepted still constitutes negotiation and is therefore
  prohibited.
