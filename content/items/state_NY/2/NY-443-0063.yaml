stem: A buyer's agent first meets a seller at an open house showing the seller's property. When must
  the buyer's agent provide the agency disclosure form to the seller?
options:
  - Only when the seller specifically requests the disclosure form
  - Upon first substantive contact with the seller or landlord
  - Before signing a buyer agency agreement with the buyer
  - After the purchase contract is signed by both parties
key: B
explanation: Under NY Real Prop Law §443.3(c), a buyer’s agent must provide the disclosure form to
  the seller at the time of the first substantive contact with the seller or landlord and obtain a
  signed acknowledgment. The option 'Before signing a buyer agency agreement with the buyer' is
  incorrect because the timing is tied to contact with the seller, not the buyer agency agreement.
citation:
  source: N.Y. Real Prop. Law art. 12-A — Real Property Law Article 12-A (§§ 440 to 443-a), Real
    Estate Brokers and Salespersons — NY DOS 'Real Estate License Law' booklet, March 2026 — § 443.3
  url: null
  quoted_text: A buyer’s agent or tenant’s agent shall provide the form to the seller, seller’s agent,
    landlord or landlord’s agent at the time of the first substantive contact with the seller or
    landlord and shall obtain a signed acknowledgment from the seller, landlord or the listing agent
