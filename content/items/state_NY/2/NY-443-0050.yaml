stem: Before a broker may act as a dual agent with designated sales agents in a landlord‑tenant
  transaction, what must the broker obtain under New York Real Property Law § 442-l?
options:
  - Consent after lease signing
  - No consent needed for low rent
  - Written consent from both sides
  - Verbal consent from landlord only
key: C
explanation: The statute requires advance informed consent in writing from both landlord and tenant
  before acting as a dual agent with designated sales agents. The distractor "Verbal consent from
  landlord only" is wrong because consent must be written and obtained from both parties, not merely
  verbal or from one side.
