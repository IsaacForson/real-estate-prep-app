stem: A broker enters into a net listing agreement with a seller, authorizing the broker to retain
  the difference between the sale price and a specified net amount to the seller, violating 19 NYCRR
  § 175.19(b). Under New York Real Property Law § 441-c, which of the following actions may the
  Department of State take?
options:
  - Impose a fine of $5,000 today.
  - Impose a fine of $2,000 today.
  - Require broker to complete training.
  - Order the broker to pay damages.
key: B
explanation: The statute permits a fine not exceeding two thousand dollars, so a $2,000 fine is
  allowable. A $5,000 fine exceeds the limit, while requiring training and ordering damages are not
  authorized penalties under § 441-c.
