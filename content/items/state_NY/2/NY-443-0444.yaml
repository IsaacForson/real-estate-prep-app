stem: Under 19 NYCRR § 175.7, what must a real estate broker do regarding the party for whom he is
  acting?
options:
  - Disclose his commission rate to both parties.
  - Make it clear for which party he is acting.
  - Obtain written consent from both parties before showing property.
  - Receive compensation only from the party he represents.
key: B
explanation: The regulation explicitly states that a broker shall make it clear for which party he
  is acting. This duty is unconditional and does not depend on disclosing commission rates or
  obtaining consent from both parties. The distractor about disclosing commission rates is incorrect
  because §175.7 does not require that disclosure.
