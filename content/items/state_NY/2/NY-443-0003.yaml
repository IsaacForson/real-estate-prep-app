stem: Which of the following facts about residential property is explicitly excluded from the
  definition of a material defect for disclosure purposes under New York law?
options:
  - That the property has a defective roof causing water intrusion
  - That the property's foundation has a structural crack
  - That the property was previously the site of a homicide
  - That the property's electrical system violates current code
key: C
explanation: New York law provides that the property being the site of a homicide, suicide, or other
  death is not a material defect or fact that must be disclosed.
