stem: Under New York's agency disclosure statute, a dual agent is a licensee acting in which
  combination of roles in the same transaction?
options:
  - Acting as a buyer's agent and a seller's agent, or a tenant's agent and a landlord's agent
  - Acting as a buyer's agent and a broker's agent, or a listing agent and a tenant's agent
  - Acting as a seller's agent and a broker's agent, or a buyer's agent and a designated sales agent
  - Acting as a listing agent and a landlord's agent, or a seller's agent and a broker's agent
key: A
explanation: New York's Real Property Law defines a dual agent as an agent acting as a buyer's agent
  and a seller's agent, or as a tenant's agent and a landlord's agent, within the same transaction.
