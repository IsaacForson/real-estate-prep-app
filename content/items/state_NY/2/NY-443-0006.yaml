stem: A broker wants to personally purchase a property that a client has listed with the broker's
  own firm. Under 19 NYCRR § 175.4, what must the broker do before acquiring any interest in that
  property?
options:
  - Obtain a written appraisal from an independent licensed appraiser
  - Disclose the broker's true position to the listing owner
  - Refer the listing to another broker within the same firm
  - Reduce the agreed commission rate on the listing
key: B
explanation: Section 175.4 forbids a broker from buying property listed with the broker, or
  acquiring any interest in it, without first making the broker's true position clearly known to the
  listing owner.
citation:
  source: 19 N.Y.C.R.R. § 175.4
  url: null
  quoted_text: A real estate broker shall not directly or indirectly buy for himself property listed
    with him, nor shall he acquire any interest therein without first making his true position
    clearly known to the listing owner.
