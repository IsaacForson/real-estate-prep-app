stem: A landlord and tenant have signed the disclosure form indicating advance informed consent to
  dual agency with designated sales agents. The broker, however, does not appoint a designated sales
  agent for the tenant and instead acts as the agent for both parties. Under NY Real Property Law §
  442-l, what is the consequence?
options:
  - The broker must pay a fine of one thousand dollars
  - The broker may not act as a dual agent in the transaction
  - The broker must disclose dual agency after the lease is signed
  - The broker's license is automatically revoked
key: B
explanation: The disclosed consent authorized only a dual agency with designated sales agents, not a
  plain dual agency. Acting as a dual agent without appointing designated sales agents exceeds the
  scope of the consent given, so the broker is not permitted to act as a dual agent in that
  transaction. The distractor about a fine is incorrect because the statute does not specify a
  monetary penalty for this violation. The remaining distractors describe actions not required or
  authorized by the provision.
