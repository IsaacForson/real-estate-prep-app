stem: An unlicensed individual negotiated a commercial lease and now sues in a New York court to
  recover a commission for that work. Under Real Property Law § 442-d, what must the plaintiff plead
  and prove to maintain the action?
options:
  - Licensure as a broker or salesperson when the claim arose
  - A fully executed written lease agreement existed
  - Written acknowledgment of the plaintiff's role by the landlord
  - That the commission requested was reasonable in amount
key: A
explanation: Real Property Law § 442-d bars a court action to recover compensation for brokerage
  services unless the plaintiff alleges and proves being a duly licensed broker or salesperson when
  the cause of action arose.
