stem: A salesperson applicant completes a pre‑licensing course that includes six hours of
  instruction on Condominiums and Cooperatives and only three hours of instruction on Real Estate
  Finance, which requires five hours. Under New York regulations, how many of the Condominiums and
  Cooperatives hours may be applied to satisfy the Real Estate Finance requirement?
options:
  - 3 hours
  - 2 hours
  - 1 hour
  - 0 hours
key: D
explanation: The syllabus specifies exact hour requirements for each subject, and all approved
  courses must follow this syllabus. Hours earned in one subject cannot be substituted for another
  subject's requirement, so excess Condominiums and Cooperatives hours do not count toward the
  Finance deficit. Therefore none of the six hours may be applied to the Finance requirement.
