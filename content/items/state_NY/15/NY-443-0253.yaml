stem: A salesperson applicant completes a pre‑licensing course that includes instruction on all
  required subjects except Condominiums and Cooperatives. Under New York regulations, is the
  applicant eligible for licensure based on this course?
options:
  - No, because Condominiums and Cooperatives is a required subject in the pre‑licensing curriculum.
  - Yes, as long as the course includes at least four hours of Real Estate Finance instruction.
  - Yes, because the missing subject can be waived under hardship provisions.
  - No, unless the applicant completes an additional two hours of Property Management training.
key: A
explanation: New York regulations require that the pre‑licensing curriculum include instruction on
  Condominiums and Cooperatives; omitting that subject means the course does not meet the licensing
  requirement, so the applicant is not eligible. The regulations do not provide a waiver for missing
  this subject.
