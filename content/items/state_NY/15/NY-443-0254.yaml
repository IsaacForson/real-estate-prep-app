stem: A salesperson applicant completes a pre‑licensing course that includes two hours of
  instruction on Condominiums and Cooperatives and follows the mandated course syllabus. Under New
  York regulations, is the applicant eligible for licensure based on this course?
options:
  - Yes, because following the syllabus satisfies all subject requirements.
  - No, because the Condominiums and Cooperatives instruction is insufficient; four hours are
    required.
  - Yes, as long as the total course hours reach the eighty‑hour minimum.
  - No, unless the applicant also completes four hours of Human Rights and Fair Housing instruction.
key: B
explanation: The regulations mandate four hours of instruction for Condominiums and Cooperatives;
  providing only two hours fails to meet that requirement regardless of syllabus compliance. The
  claim that total course hours override subject‑specific hour rules is incorrect.
