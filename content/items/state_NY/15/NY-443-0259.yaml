stem: A salesperson’s pre‑licensing course includes four hours of Condominiums and Cooperatives
  instruction and satisfies all other subject hour requirements, but the course totals only 78
  hours. Under New York regulations, is the course approved for licensure?
options:
  - The course is approved because it meets the Condominiums and Cooperatives requirement.
  - The course is approved because the total hours are within the allowable range.
  - The course is not approved because the total hours fall short of the required 80.
  - The course is not approved because it exceeds the Condominiums and Cooperatives requirement.
key: C
explanation: The regulations require a total of 80 hours of instruction and examination (77 hours of
  coursework plus a 3‑hour final exam). A course with only 78 hours does not meet this total, so it
  cannot be approved even if each subject’s hours are satisfied.
