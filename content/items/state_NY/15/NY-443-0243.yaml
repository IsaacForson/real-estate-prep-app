stem: A salesperson completes a pre‑licensing course that includes six hours of instruction on
  Condominiums and Cooperatives. Under New York regulations, how many of those hours may be counted
  toward the required four‑hour requirement for that subject?
options:
  - Only four hours of instruction
  - All six hours of instruction
  - None of the hours of instruction
  - Only two hours of instruction
key: A
explanation: Although the course provides six hours, only four hours may be applied to meet the
  mandatory four‑hour requirement; excess hours cannot be counted toward it. The distractor
  asserting that all six hours count mistakenly treats extra instruction as creditable.
