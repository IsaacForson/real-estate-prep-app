explanation: The Instruction block is fixed at 77 hours. Subtracting the required 4 hours for
  Condominiums and Cooperatives leaves 73 hours for the remaining subjects. The distractor of 74
  hours would result from subtracting only 3 hours, which does not meet the mandated 4‑hour
  allocation.
