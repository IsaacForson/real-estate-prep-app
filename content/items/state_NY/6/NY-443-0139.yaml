stem: A salesperson completes a pre‑licensing course that includes exactly 3 hours of Land Use
  Regulations and no instruction in any other required subject. According to the NY DOS syllabus,
  does this course satisfy the state’s licensing requirements for a real estate salesperson?
options:
  - The course satisfies the licensing requirement because total instructional hours exceed the
    state minimum.
  - The course does not satisfy the licensing requirement because it exceeds the allowed hours for
    Land Use Regulations.
  - The course does not satisfy the licensing requirement because it omits instruction in other
    required subjects.
  - The course satisfies the licensing requirement because it meets the Land Use Regulations hour
    mandate.
key: C
explanation: The syllabus requires every listed subject to be taught at the specified hour level;
  omitting any subject fails the approval standard. The distractor that focuses only on meeting the
  Land Use Regulations hour mandate ignores the compulsory inclusion of all other topics.
