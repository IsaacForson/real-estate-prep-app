stem: A salesperson completes a pre‑licensing course that includes only two hours of Land Use
  Regulations. Does this course satisfy the state’s land use regulation requirement for licensure?
options:
  - The course is insufficient because it provides only 2 of the required 3 hours.
  - The course is sufficient because total instructional hours exceed 80 by a significant margin.
  - The course is insufficient because it omits land use regulation entirely from the curriculum.
  - The course is sufficient because the missing hour can be completed through continuing education.
key: A
explanation: The rule requires three hours of Land Use Regulations; providing only two fails to meet
  that specific requirement. The distractor claiming sufficiency because total instructional hours
  exceed 80 is wrong because the land use regulation requirement is separate and cannot be satisfied
  by excess hours in other subjects.
