stem: A broker is preparing a salesperson pre‑licensing syllabus and has already allocated 2 hours
  to the Land Use Regulations topic. To comply with NY DOS regulations, what is the minimum number
  of additional hours the broker must add to the Land Use Regulations segment?
options:
