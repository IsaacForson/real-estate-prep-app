stem: A school has allocated hours to all subjects except Land Use Regulations. The sum of hours for
  all other subjects (including Instruction and Final Examination) is 77 hours. How many hours must
  be allocated to Land Use Regulations to reach the total required 80 hours?
options:
  - 5 hours
  - 4 hours
  - 3 hours
  - 2 hours
key: C
explanation: According to 19 N.Y.C.R.R. § 176.3, Land Use Regulations is allocated 3 hours in the
  salesperson pre‑licensing course. The total required hours are 80. Subtracting the given 77 hours
  for all other subjects from 80 leaves 3 hours for Land Use Regulations. Choosing 5 hours would
  result from mistakenly subtracting 75, a common error.
