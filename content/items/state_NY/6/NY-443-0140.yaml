stem: A salesperson completes a pre‑licensing course that includes 4 hours of Real Estate Finance
  and 6 hours of Construction and Environmental Issues. According to the NY DOS syllabus, does the
  course meet the minimum required hours for each of these two subjects?
options:
  - The course meets the minimum for both subjects because it exceeds the required hours for
    Construction and Environmental Issues.
  - The course meets the minimum for both subjects because the average of the two subjects meets the
    requirement.
  - The course does not meet the minimum for both subjects because it falls short of the required
    hours for Real Estate Finance.
  - The course does not meet the minimum for both subjects because it exceeds the allowed hours for
    Construction and Environmental Issues.
key: C
explanation: Real Estate Finance mandates five hours; providing only four hours falls short of that
  requirement. Although Construction and Environmental Issues is satisfied with six hours, the
  shortfall in Finance means the course does not meet the minimum for both subjects. The distractor
  that cites exceeding Construction hours incorrectly assumes one subject’s excess can compensate
  for another’s deficit.
