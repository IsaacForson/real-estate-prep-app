stem: Under NY DOS regulation §176.3(b), what must all approved real estate salesperson
  pre-licensing courses use?
options:
  - A textbook approved by the Department of State
  - A standardized exam from a third-party provider
  - The course syllabus outlined in §176.3(a)
  - A lesson plan created by the individual instructor
key: C
explanation: 19 N.Y.C.R.R. §176.3(b) requires that all approved real estate salesperson
  pre-licensing courses use the course syllabus outlined in §176.3(a). Therefore, the correct answer
  is the option stating that the course must use the course syllabus outlined in §176.3(a). The
  other options are incorrect because the rule does not mandate a state‑approved textbook, a
  third‑party standardized exam, or an instructor‑created lesson plan.
