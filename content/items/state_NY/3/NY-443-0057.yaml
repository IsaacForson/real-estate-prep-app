stem: Under NY Real Property Law §462, how is "residential real property" defined for the property
  condition disclosure statement?
options:
  - "Definition: real property improved by a one to four family dwelling used or occupied, or
    intended to be used or occupied, wholly or partly, as the home or residence of one or more
    persons, but shall not refer to (a) unimproved real property upon which such dwellings are to be
    constructed or (b) condominium units or cooperative apartments or (c) property on a homeowners’
    association that is not owned in fee simple by the seller"
  - "Definition: real property improved by a one to four family dwelling used or occupied, or
    intended to be used or occupied, wholly or partly, as the home or residence of one or more
    persons, including unimproved real property upon which such dwellings are to be constructed, and
    also including any vacant land regardless of intended future use, as well as any land held for
    speculative development."
  - "Definition: real property improved by a one to four family dwelling used or occupied, or
    intended to be used or occupied, wholly or partly, as the home or residence of one or more
    persons, including condominium units, cooperative apartments, and any other form of shared
    ownership interest such as timeshare interests or fractional ownership."
  - "Definition: real property improved by a one to four family dwelling used or occupied, or
    intended to be used or occupied, wholly or partly, as the home or residence of one or more
    persons, but shall not refer to property on a homeowners’ association that is owned in fee
    simple by the seller, and shall also exclude any property subject to a leasehold estate or any
    property held under a ground lease."
key: A
explanation: Under NY Real Property Law §462, residential real property means a one‑to‑four family
  dwelling used or occupied as a home, and excludes unimproved land for future dwellings,
  condominium or cooperative units, and HOA property not owned in fee simple. The first wrong option
  incorrectly adds unimproved land and vacant land to the definition. The second wrong option
  incorrectly adds condominium units, cooperative apartments, and other shared ownership interests.
  The third wrong option incorrectly omits the exclusions for unimproved land and condos/coops while
  also misstating the HOA condition by excluding only fee‑simple HOA property and adding leasehold
  exclusions.
