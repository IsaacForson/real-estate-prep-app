stem: A broker earns interest on funds held in a special trust account and wishes to retain that
  interest as personal income. Under 19 NYCRR §175.1, what is the broker permitted to do with the
  accrued interest?
options:
  - The broker may keep the interest as additional income.
  - The broker may apply the interest to reduce commission with client consent.
  - The broker may remit the interest to the state.
  - The broker may deposit the interest into a personal account.
key: B
explanation: The rule provides that accrued interest shall not be retained by the broker except when
  applied to, and deducted from, earned commission with the consent of all parties. Thus, the broker
  may only use the interest to reduce commission with client consent. Keeping the interest as income
  violates the prohibition on retention.
