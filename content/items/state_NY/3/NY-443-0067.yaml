stem: A licensee is preparing to list a condominium unit for sale. Under NY Real Property Law §462,
  is the seller required to complete and sign a property condition disclosure statement?
options:
  - The seller is not required to provide a disclosure statement
  - The seller must provide a disclosure statement for homes
  - The seller is not required to provide a disclosure statement unless asked
  - The seller must provide a disclosure statement for the buyer
key: A
explanation: The definition of residential property expressly excludes condominium units, so the
  disclosure statement requirement does not apply. The statement that the seller is not required to
  provide a disclosure statement correctly reflects this exclusion. The option suggesting the seller
  must provide a statement for the buyer is incorrect because condos are not residential real
  property under the statute.
