stem: Which of the following is included in the definition of “residential real property” under NY
  Real Property Law §462?
options:
  - A vacant lot intended for construction
  - A cooperative apartment in a building
  - A condominium unit in a building
  - A two‑family dwelling used as home
key: D
explanation: The definition expressly includes real property improved by a one‑to‑four family
  dwelling used or occupied, or intended to be used or occupied, as a home or residence. A
  two‑family dwelling used as a home meets this criterion. Condominium units, cooperative
  apartments, and vacant land are explicitly excluded from the definition.
