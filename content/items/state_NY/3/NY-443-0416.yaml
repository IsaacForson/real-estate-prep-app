stem: According to 19 NYCRR §175.1, what must a broker do with a principal’s money before it is
  deposited into the special bank account?
options:
  - The broker must place the money in a federally insured money market fund.
  - The broker must safeguard the money in a secure location to prevent loss or misappropriation.
  - The broker must combine the money with personal funds in a separate account.
  - The broker must invest the money in a state‑approved bond.
key: B
explanation: The regulation requires that money received for a principal be safeguarded in a secure
  location until it can be deposited into the special bank account; therefore the broker must
  safeguard the money in a secure location to prevent loss or misappropriation. The distractor
  suggesting placement in a federally insured money market fund is incorrect because the rule limits
  deposits to federally insured bank accounts only.
