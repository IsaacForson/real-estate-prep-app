stem: When completing the property condition disclosure statement under NY Real Prop Law §462.2,
  what should a seller do if they do **NOT** know the answer to a question?
options:
  - Leave the item blank
  - Mark the item as "NA"
  - Check "Unkn" (Unknown)
  - Estimate based on homes
key: C
explanation: Under NY Real Prop Law §462.2, sellers should check 'Unkn' (Unknown) when they do not
  know the answer to a question on the property condition disclosure statement. Leaving the item
  blank or marking it as 'Not Applicable' does not follow the required procedure, and providing an
  estimate is also incorrect.
