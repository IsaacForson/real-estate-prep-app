stem: A licensee completes a three‑hour course that covers the current year’s trends in real estate
  practices and changes in laws as identified by the commission. Does this course satisfy the
  commission core course requirement under the Idaho Real Estate License Law?
options:
  - The course does not satisfy the commission core course requirement because it does not include
    any instruction on real estate law changes and omits the yearly curriculum updates.
  - The course does not satisfy the commission core course requirement because it exceeds the
    four‑hour limit and fails to address the annual trends specified by the commission.
  - The course satisfies the commission core course requirement because it is within the four‑hour
    limit and covers the commission‑identified curriculum for the current year.
  - The course satisfies the commission core course requirement because it is exactly four classroom
    hours long and includes instruction on current real estate practices.
key: C
explanation: Idaho Code § 54-2004 requires that a commission core course cover the
  commission‑identified curriculum for the current year and contain no more than four classroom
  hours. The described three‑hour course meets both criteria, so it satisfies the requirement. The
  option stating that the course does not satisfy the requirement because it exceeds the four‑hour
  limit and fails to address the annual trends is incorrect, as the course is only three hours long
  and does cover the commission‑identified curriculum.
