  quoted_text: Commission core course means the annual course covering the twelve (12) month period
    between July 1 and June 30, which contains curriculum identified by the commission that stresses
    that year’s trends in real estate practices and changes in laws in real estate-related
    industries. A core course must contain no more than four (4) classroom hours of instruction.
