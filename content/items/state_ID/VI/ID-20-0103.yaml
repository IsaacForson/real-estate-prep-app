stem: Under Idaho Code § 54-2004, which of the following scenarios constitutes 'acting in this state'?
options:
  - A licensee who lists a property located in Oregon for sale and negotiates with a buyer residing
    in Oregon.
  - A licensee who lists a property located in Montana for sale and negotiates with a buyer residing
    in Montana.
  - A licensee who lists a property located in Idaho for sale and negotiates with a buyer residing
    in Oregon.
  - A licensee who lists a property located in Washington for sale and negotiates with a buyer
    residing in Washington.
key: C
explanation: The definition of 'acting in this state' includes dealing with any interest in real
  property situated in Idaho. Listing an Idaho property satisfies this requirement regardless of the
  buyer's residence. The scenario where the licensee lists a Montana property and negotiates with a
  Montana buyer might be mistakenly thought to constitute acting in this state because the licensee
  is engaged in a real estate transaction, but the definition requires the property to be situated
  in Idaho or the client to be an Idaho resident.
