stem: Which statement best describes a 'branch office' under the Idaho Real Estate License Law?
options:
  - An office used exclusively for property management activities and not for brokerage transactions
  - An office that must be licensed regardless of the broker's licensing status and complies with
    chapter requirements
  - An office located in the same building as the main office with a separate entrance and its own
    signage
  - An office operated by a licensed real estate broker or licensed legal business entity, separate
    and apart from the main office
key: D
explanation: "The Idaho Real Estate License Law defines a branch office as an office operated by a
  licensed real estate broker or a licensed legal business entity that is separate and apart from
  the main office (Idaho Code § 54-2004(5)). Therefore, the statement that matches this definition
  is the one describing an office operated by a licensed real estate broker or licensed legal
  business entity, separate and apart from the main office. The other statements are incorrect: an
  office used exclusively for property management does not meet the definition; an office that must
  be licensed regardless of the broker's licensing status adds requirements not in the definition;
  and an office located in the same building as the main office with a separate entrance and its own
  signage does not capture the requirement of being operated by a licensed broker or entity and
  being separate from the main office."
