stem: What does the term 'properly licensed' mean?
options:
  - A license or a change in license that has been made effective by the commission.
  - A license that has been renewed within the past two years and is current.
  - A license issued by any state real estate commission and currently active.
  - A license that is currently inactive but may be renewed within twelve months.
key: A
explanation: "The statute defines 'properly licensed' as a license or a change in license that has
  been made effective by the commission. The correct option reflects this definition exactly. The
  other options are incorrect because they add requirements that are not part of the definition:
  proper licensing does not depend on recent renewal, does not require the license to be issued by
  any state, and does not apply to an inactive license that may be renewed later."
