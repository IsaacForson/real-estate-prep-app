stem: "An Idaho broker prepares two separate purchase agreements for the same residential property:
  one showing a sale price of $300,000 to the buyer and another showing a sale price of $280,000 to
  the lender to secure a higher loan amount. The broker does not disclose the second agreement to
  the buyer or lender. Under Idaho Code § 54-2054(5), is the broker's conduct permissible?"
options:
  - The broker's conduct is permissible because the broker disclosed both agreements to the buyer
    and lender.
  - The broker's conduct is not permissible only if the broker received a kickback from the lender.
  - The broker's conduct is permissible because the different prices reflect legitimate negotiation
    differences.
  - The broker's conduct is not permissible because it constitutes a double contract as defined in
    section 54-2004.
key: D
explanation: The claim that different prices reflect legitimate negotiation differences is incorrect
  because differing prices for the same property to different parties still constitute a prohibited
  double contract.
