stem: "Under Idaho Code § 54-2054(2), a real estate broker may pay a part of a commission to an
  unlicensed legal business entity only if:"
options:
  - The broker may pay a commission to an unlicensed legal business entity only if all of the
    entity’s shareholders, members or other persons having a similar ownership interest are active
    real estate licensees and an owner licensed under the broker performed the licensed activities
    for which the payment is made.
  - The broker may pay a commission to an unlicensed legal business entity only if all of the
    entity’s shareholders, members or other persons having a similar ownership interest are active
    real estate licensees and any unlicensed employee of the broker performed the licensed
    activities for which the payment is made.
  - The broker may pay a commission to an unlicensed legal business entity only if at least one of
    the entity’s shareholders, members or other persons having a similar ownership interest is an
    active real estate licensee and an owner licensed under the broker performed the licensed
    activities for which the payment is made.
  - The broker may pay a commission to an unlicensed legal business entity only if all of the
    entity’s shareholders, members or other persons having a similar ownership interest are active
    real estate licensees and the broker performed the licensed activities for which the payment is
    made, regardless of licensing status.
key: A
explanation: Idaho Code § 54-2054(2) permits payment to an unlicensed legal business entity only
  when all owners are active licensees and an owner licensed under the broker performed the licensed
  activities. The option stating that an unlicensed employee performed the licensed activities is
  incorrect because unlicensed individuals cannot perform licensed activities, and the statute
  requires the work to be done by an owner licensed under the broker.
