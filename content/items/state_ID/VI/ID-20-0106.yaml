stem: A buyer purchases a going concern that includes the goodwill of an established restaurant and
  the building it occupies. Under the Idaho Real Estate License Law, does this transaction qualify
  as a business opportunity?
options:
  - The transaction does not qualify as a business opportunity because the business is newly
    established and lacks goodwill.
  - The transaction does not qualify as a business opportunity because it involves only the sale of
    real property without any business goodwill.
  - The transaction qualifies as a business opportunity because it includes the goodwill of an
    established business and involves the sale of real property.
  - The transaction qualifies as a business opportunity because it includes a lease of the real
    property along with the business assets.
key: C
explanation: The transaction qualifies as a business opportunity because it includes the goodwill of
  an established business (the restaurant) and involves the sale of real property (the building).
  Under Idaho Code § 54-2004, a business opportunity is defined as an established business, goodwill
  of an established business, or any interest therein, other than a lease, combined with a sale or
  transfer of real property. The scenario meets this definition. The claim that the business is
  newly established and lacks goodwill is incorrect because the restaurant is described as
  established with goodwill. The claim that the transaction involves only the sale of real property
  without any business goodwill is incorrect because the goodwill of the restaurant is part of the
  purchase. The claim that the transaction includes a lease of the real property along with the
  business assets is incorrect because the building is being sold, not leased, and the definition
  explicitly excludes leases from the business opportunity concept.
