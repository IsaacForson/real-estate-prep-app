stem: A sales associate receives a commission directly from a buyer for showing a property.
  According to Idaho Code § 54-2054(9), is this permissible?
options:
  - The commission may not be accepted directly from the buyer because fees must be paid through the
    broker
  - The commission may be accepted directly from the buyer if the buyer is also licensed
  - The commission may be accepted directly from the buyer if the broker approves
  - The commission may be accepted directly from the buyer if shared with another associate
key: A
explanation: Subsection (9) states that a sales associate may accept compensation only from the
  broker with whom they are licensed. Accepting payment directly from the buyer violates this rule,
  regardless of broker approval or sharing with another associate. The distractor suggesting broker
  approval makes it permissible is incorrect because the source of payment must be the broker.
citation:
  source: Idaho Code § 54-2054
  url: null
  quoted_text: No sales associate shall accept any commission, compensation or fee for the performance
    of any acts requiring a real estate license from any person except the real estate broker with
    whom the sales associate is licensed.
