stem: Under Idaho Code § 54-2004, which of the following individuals meets the definition of a
  'designated broker'?
options:
  - An individual who is licensed as a real estate broker in Oregon and who is designated by the
    brokerage company to supervise the brokerage company and associated licensees.
  - An individual who is licensed as a real estate broker in Idaho and who is designated by the
    brokerage company to supervise the brokerage company and associated licensees.
  - An individual who is licensed as a real estate broker in Idaho and who works as a salesperson
    under another broker but is not designated by the brokerage company.
  - An individual who is licensed as a real estate broker in Idaho and who supervises associated
    licensees but is not designated by the brokerage company.
key: B
explanation: The definition of 'designated broker' requires both an Idaho real estate broker license
  and designation by the brokerage company to supervise the brokerage company and associated
  licensees. Only the option describing an Idaho-licensed broker who is designated by the brokerage
  company to supervise the brokerage company and associated licensees satisfies both criteria. The
  scenario where an individual supervises licensees but lacks the formal designation might be
  mistakenly considered sufficient, but the definition explicitly requires the designation by the
  brokerage company.
