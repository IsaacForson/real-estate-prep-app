stem: A real estate salesperson holds an active license from another state but is not licensed in
  Idaho. Under Idaho Code § 54-2004, how is this individual classified?
options:
  - The individual classified as an out-of-state sales associate
  - The individual classified as an out-of-state broker
  - The individual classified as having an inactive license
  - The individual classified as a designated broker
key: A
explanation: Idaho Code § 54-2004 defines an 'out-of-state sales associate' as a person who holds
  the equivalent of an active Idaho salesperson or associate broker license in another jurisdiction
  and is not licensed in Idaho. Since the individual holds a salesperson-equivalent license, they
  fit this definition. The distractor describing an out-of-state broker is incorrect because the
  license held is for salesperson activity, not broker activity.
