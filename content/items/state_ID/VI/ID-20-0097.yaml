stem: A licensee offers a $150 gift card to an unlicensed acquaintance to encourage them to send
  buyer leads. Under Idaho Code § 54-2054(3), is this allowed?
options:
  - Offering a gift card to an unlicensed person for leads is allowed if the value is under $200
  - Offering a gift card to an unlicensed person for leads is allowed if disclosed in writing
  - Offering a gift card to an unlicensed person for leads is allowed if the person is a friend
  - Offering a gift card to an unlicensed person for leads is prohibited because it is a finder’s fee
key: D
explanation: Subsection (3) of Idaho Code § 54-2054 defines any offer of monetary value to an
  unlicensed person to induce prospects as a prohibited finder’s fee, with no exception for low
  value, personal relationship, or disclosure. Therefore the gift‑card offer is not allowed. The
  claim that it is allowed if the value is under $200 is wrong because the rule contains no monetary
  threshold.
citation:
  source: Idaho Code § 54-2054
  url: null
  quoted_text: Any offer of monetary value, by an Idaho licensee, to any person who is not licensed in
    Idaho or any state or jurisdiction, made for the purpose of inducing such unlicensed person to
    secure prospects to buy, sell, option, or otherwise dispose of an interest in real property
    shall be considered to be splitting fees with an unlicensed person, and is prohibited.
