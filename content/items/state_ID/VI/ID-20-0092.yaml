stem: Which of the following best describes an "active license" under the Idaho Real Estate License Law?
options:
  - A license that has been renewed but is presently inactive.
  - A license that has not been inactivated, expired, terminated, suspended, or revoked.
  - A license that is temporarily suspended but may be reinstated after paying a fee.
  - A license that has been revoked but can be reissued after a hearing.
key: B
explanation: Subsection (3) of Idaho Code § 54-2004 defines an active license as a license that has
  not been inactivated, expired, terminated, suspended, or revoked. This matches the option stating
  that an active license is one that has not been inactivated, expired, terminated, suspended, or
  revoked. The option that adds a condition about renewal and present inactivity is incorrect
  because the statutory definition does not include those requirements.
