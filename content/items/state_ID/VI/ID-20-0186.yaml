stem: A broker who holds an active Idaho broker license and has no associate brokers or salespersons
  licensed under them is best described as which of the following under the Idaho Real Estate
  License Law?
options:
  - Designated broker
  - Limited broker
  - Out-of-state broker
  - Associate broker
key: B
explanation: Idaho Code § 54‑2004(30) defines a limited broker as a broker individually qualified to
  do business in Idaho who may not have associate brokers or salespersons licensed with that broker.
  The described broker fits that definition, making limited broker the correct term. A designated
  broker, who supervises the brokerage and any associate brokers or salespersons, does not match the
  scenario because no licensees are under the broker.
