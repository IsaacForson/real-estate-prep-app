stem: "An actively licensed broker in Idaho prepares a written price opinion of a property's
  estimated value for a lender to use in underwriting a home equity loan. The opinion complies with
  the requirements of section 54-4105. Under Idaho Real Estate License Law, this activity is best
  described as:"
options:
  - A broker price opinion, because it is a written price opinion prepared by an actively licensed
    broker for a purpose other than a prospective listing or sale.
  - A comparative market analysis, because it is a written price opinion prepared by an actively
    licensed broker for a purpose other than a prospective listing or sale.
  - An appraisal, because it is a written price opinion prepared by an actively licensed broker for
    a purpose other than a prospective listing or sale.
  - A prospectus, because it is a written price opinion prepared by an actively licensed broker for
    a purpose other than a prospective listing or sale.
key: A
explanation: Subsection (6) defines a broker price opinion as a written price opinion of the
  estimated price for identified real property prepared or rendered by an actively licensed broker
  or associate broker, for a purpose other than a prospective listing or sale, and that complies or
  purports to comply with the requirements and content provision of section 54-4105. The scenario
  matches this definition exactly. An appraisal is a distinct regulated activity not covered by this
  definition.
