stem: Under Idaho Code § 54-2054(1), what must a person allege and prove to bring a court action for
  collection of a fee for acts requiring a real estate license?
options:
  - An actively licensed broker or salesperson in Idaho at the time the contract was signed.
  - An actively licensed broker or salesperson in Idaho at the time the alleged cause of action
    arose.
  - An actively licensed broker or salesperson in Idaho at the time the fee was earned.
  - An actively licensed broker or salesperson in Idaho at the time the brokerage agreement was
    terminated.
key: B
explanation: Under Idaho Code § 54-2054(1), a person must allege and prove they were an actively
  licensed broker or salesperson in Idaho at the time the alleged cause of action arose to sue for a
  fee. The option stating that the person must be licensed at the time the fee was earned is
  incorrect because the statute does not require proving licensure at that point.
