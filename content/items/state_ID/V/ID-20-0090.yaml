stem: A broker has completed a sale and received signed closing statements from the escrow agent.
  The broker wishes to withdraw their commission now. Under Idaho Code § 54-2046(4), what must occur
  before the broker can disburse any portion of the commission?
options:
  - Obtaining written, signed authorization from the buyer and seller
  - Receiving a court order authorizing the disbursement
  - Delivering signed closing statements and confirming buyer and seller payment
  - Waiting until the closing agent provides a receipt for the disbursement
key: C
explanation: Subsection (4) allows commission disbursement only after either written authorization
  from the buyer and seller OR delivery of signed closing statements to the broker and payment to
  the parties. Since the scenario provides no written authorization, the broker must have delivered
  the signed closing statements and confirmed payment. The distractor about obtaining written
  authorization describes an alternative condition that is not satisfied in the given facts.
citation:
  source: Idaho Code § 54-2046(4)
  url: null
  quoted_text: No disbursement of any portion of the broker’s commission shall take place without
    prior written, signed authorization from the buyer and seller or until copies of the closing
    statements, signed by the buyer and seller, have been delivered to the broker and until the
    buyer or seller has been paid the amount due as determined by the closing statement.
