stem: A licensee receives a rebate from a title company for directing a client’s transaction to that
  company. According to Idaho Code § 54-2054(6), what must the licensee do regarding this rebate?
options:
  - Disclose the intent to receive the rebate in writing to all parties prior to closing.
  - Disclose the rebate verbally to the buyer and seller at the closing table of the transaction.
  - Disclose the intent to receive the rebate in writing to the broker only in the transaction.
  - Disclose the rebate after closing in a written statement to the parties prior to any
    disbursement.
key: A
explanation: The statute requires a licensee who legally receives a fee or rebate from a service
  provider to disclose the intent to receive such payment in writing to all parties to the
  transaction prior to closing. Therefore, the licensee must provide written disclosure to all
  parties before closing. The option proposing verbal disclosure at closing fails to meet both the
  written and prior-to-closing requirements.
citation:
  source: Idaho Code § 54-2054
  url: null
  quoted_text: However, a licensee legally receiving any fee or rebate from any person providing
    direct services to either the buyer or the seller in connection with a regulated real estate
    transaction is required to disclose the licensee’s intent to receive such fee, rebate or
    compensation in writing to all parties to the transaction prior to closing.
