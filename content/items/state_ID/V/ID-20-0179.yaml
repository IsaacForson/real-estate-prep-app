stem: A broker wants to disburse earnest money to the seller for repairs before closing, but the
  purchase agreement does not specify a condition for such disbursement. According to Idaho Code §
  54-2046(2), what must the broker have before making this disbursement?
options:
  - Written and signed authorization from the parties to the transaction
  - Written and signed authorization from the broker only
  - Written and signed authorization from the escrow agent
  - Written and signed authorization from the lender
key: A
explanation: Subsection (2) prohibits any advance disbursement without the required written and
  signed authorization from the parties to the transaction. Authorization from the broker, escrow
  agent, or lender does not satisfy this requirement.
