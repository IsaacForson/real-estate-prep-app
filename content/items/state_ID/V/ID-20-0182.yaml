stem: According to Idaho Code § 54-2048(2), how must a responsible broker show proof of delivery of
  the closing statement to the buyer and seller?
options:
  - Retain only the electronic version of the closing statement without any signatures
  - Provide a verbal confirmation of delivery and note it in the broker’s log
  - Send the closing statement via regular mail and keep a photocopy of the mailed statement
  - Obtain signatures on copies of the closing statement and keep them in the transaction file
key: D
explanation: Idaho Code § 54-2048(2) requires the broker to obtain the parties’ signatures on copies
  of the closing statement and retain those copies in the transaction file. Providing a verbal
  confirmation or sending the statement via regular mail does not satisfy the statutory requirement
  for signed copies.
