stem: Which duty must the responsible broker perform according to Idaho Code § 54-2048(1)?
options:
  - Ensuring the correctness and delivery of detailed closing statements
  - Ensuring timely submission of license renewal applications to the commission
  - Ensuring that all advertising materials contain the broker's license number
  - Ensuring receipt of earnest money deposits before presenting offers
key: A
explanation: The responsible broker must ensure the correctness and delivery of detailed closing
  statements under subsection (1). This duty applies even if a third‑party escrow agent handles the
  closing. The distractor about authorizing pre‑closing disbursements is incorrect because
  § 54‑2046(2) prohibits such disbursements without written authorization, making it a restriction
  rather than a duty.
