stem: What is the length of a regular term for a commissioner appointed to the Idaho real estate
  commission under Idaho Code § 54-2006(2)?
options:
  - The term lasts three (3) years
  - The term lasts four (4) years
  - The term lasts six (6) years
  - The term lasts two (2) years
key: B
explanation: The statute provides that a regular appointment commences on July 1 of the year of
  appointment and is for a term of four (4) years. Therefore, the correct length is four years. The
  option stating two years confuses the term with a different period, and the option stating six
  years incorrectly adds two extra years.
