stem: A corporation acts as a real estate broker without a license in Idaho and is convicted. Where
  will any civil penalty assessed by the court under Idaho Code § 54-2065 be credited?
options:
  - To the state general fund account
  - To the occupational licenses fund
  - To the local county treasury fund
  - To the real estate recovery fund
key: B
explanation: Section 54-2065 explicitly provides that all civil penalties shall be credited to the
  occupational licenses fund. The state general fund account, local county treasury fund, and real
  estate recovery fund are incorrect destinations.
