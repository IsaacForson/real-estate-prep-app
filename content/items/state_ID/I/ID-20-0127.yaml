  url: null
  quoted_text: >-
    Whenever a real estate broker terminates a sales associate for a violation of any of the
    provisions of sections

    54-2060

    through

    54-2062

    , Idaho Code, the broker shall promptly file a written statement of the facts in reference
    thereto with the commission
