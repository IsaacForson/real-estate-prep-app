stem: A broker terminates a sales associate for violating Idaho Code § 54-2061. According to Idaho
  Code § 54-2079, what must the broker do?
options:
  - The broker shall promptly file a written statement of the facts with the commission.
  - The broker must return any earnest money held by the sales associate.
  - The broker must submit a copy of the conviction document to the commission within twenty days.
  - The broker must notify the sales associate's clients within five days.
key: A
explanation: Section 54-2079 requires a broker who terminates a sales associate for a violation of
  sections 54-2060 through 54-2062 to promptly file a written statement of the facts with the
  commission. The twenty‑day reporting rule applies to the licensee’s own convictions, not to the
  broker’s termination report.
citation:
