stem: Under Idaho Code § 54-2058(1), after receiving a written complaint alleging injury or fraud,
  what action must the executive director take?
options:
  - Dismiss the complaint when no licensee is named.
  - Conduct a formal hearing within thirty days.
  - Perform an investigation of the alleged facts.
  - Refer the complaint to the county prosecutor.
key: C
explanation: The statute directs the executive director to perform an investigation of the facts
  alleged upon receipt of a written complaint. Holding a hearing or referring the complaint are not
  required at this stage, and dismissal is contrary to the directive.
citation:
  source: Idaho Code § 54-2058
  url: null
  quoted_text: Upon receipt of a written complaint from anyone who claims to have been injured or
    defrauded as a result of such action, or upon information received by the executive director,
    the executive director shall perform an investigation of the facts alleged against such real
    estate broker or salesperson or such unlicensed person.
