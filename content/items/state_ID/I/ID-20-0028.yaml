stem: A licensee is accused of violating Idaho real estate law in Ada County. Which official has the
  duty to prosecute the violation?
options:
  - The Idaho real estate commission
  - The Idaho Attorney General
  - The district court administrator
  - The Ada County prosecuting attorney
key: D
explanation: Idaho Code § 54-2064 makes it the duty of each county's prosecuting attorney to
  prosecute all violations of the chapter occurring in that county. Consequently, the Ada County
  prosecuting attorney must handle the case. The commission itself does not prosecute violations in
  court.
