stem: Under Idaho Code § 54-2061(1)(c), which of the following judgments may serve as grounds for
  disciplinary action against a licensee?
options:
  - A judgment for breach of contract in a real estate sale
  - A judgment for fraud in a real estate-related transaction
  - A judgment for unpaid property taxes in the county
  - A judgment for violating local zoning ordinances
key: B
explanation: The statute specifies that a judgment entered against a licensee in a civil action
  based on fraud, misrepresentation, deceit, or gross negligence related to a real estate
  transaction is grounds for discipline. A judgment for fraud in a real estate-related transaction
  matches this description exactly. A judgment for breach of contract in a real estate sale lacks
  the required fraud or deceit element and therefore does not qualify under this provision.
