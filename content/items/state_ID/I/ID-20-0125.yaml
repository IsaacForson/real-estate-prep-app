stem: Under Idaho Code § 54-2066, what authority does the commission have to address ongoing
  violations of the real estate license law?
options:
  - The commission may impose a civil penalty of up to five thousand dollars.
  - The commission may issue a cease and desist order to stop the violation.
  - The commission may institute injunction proceedings in district court.
  - The commission may suspend the licensee's license pending further investigation.
key: C
explanation: Idaho Code § 54-2066 expressly authorizes the commission to institute injunction
  proceedings in district court to restrain violations of the chapter, regardless of whether an
  adequate remedy at law exists. The option about issuing a cease and desist order describes
  authority under § 54-2067, not § 54-2066.
citation:
  source: Idaho Code § 54-2066
  url: null
  quoted_text: The commission is hereby authorized to institute injunction proceedings in the district
    court of competent jurisdiction, pursuant to the Idaho rules of civil procedure, for cause
    shown, to restrain any person or persons from violating any provision of this chapter regardless
    of whether or not there exists an adequate remedy at law.
