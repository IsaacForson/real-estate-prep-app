stem: Under Idaho Code § 54-2061(2), what is considered prima facie evidence of a licensee's
  conviction or court action for disciplinary purposes?
options:
  - A certified copy of the licensee's real estate license issued by the Idaho Real Estate Commission
  - A letter from the licensee's employer confirming continued employment in real estate
  - A sworn statement submitted by the licensee to the commission within the required timeframe
  - A court record showing conviction, legal incompetency, or civil judgment, or certified copies
    thereof
key: D
explanation: The statute states that the court’s record of conviction, order determining legal
  competency, or the order entering judgment in a civil case, or certified copies thereof, shall be
  prima facie evidence of a conviction or the court’s action. A sworn statement from the licensee is
  not specified as prima facie evidence.
