stem: According to Idaho Code § 54-2006(2), how long may a commissioner continue to hold office
  after the expiration of their term?
options:
  - The commissioner may hold office only until the last day of the term
  - The commissioner may hold office until a specific date set by the governor
  - The commissioner may hold office until a qualified successor is appointed
  - The commissioner may hold office indefinitely, with no limitation
key: C
explanation: The statute explicitly says each commissioner shall hold office until a qualified
  successor is appointed, allowing service beyond the term until a replacement is named. The option
  limiting service to the last day of the term ignores this provision, and the option suggesting a
  governor‑set date adds a condition not found in the law.
