stem: A licensee receives a written request from the Idaho Real Estate Commission to produce all
  closing statements for transactions in the past year. The licensee refuses to provide the
  documents. Under Idaho Code § 54-2060(5), what may the commission do?
options:
  - Treat the refusal as misconduct
  - Impose a civil penalty up to $5,000
  - Issue a formal reprimand promptly
  - Suspend the license immediately
key: A
explanation: The statute defines failure or refusal, upon lawful demand, to disclose information or
  produce records as misconduct. Therefore the commission may treat the refusal as misconduct. The
  distractor "Impose a civil penalty up to $5,000" describes a possible disciplinary sanction, but
  the cited subsection only establishes the act as misconduct, not the penalty itself.
