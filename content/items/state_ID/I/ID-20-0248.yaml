stem: The governor appoints a new commissioner to the Idaho real estate commission on March 15,
  2024. Assuming it is a regular appointment, on what date does the commissioner's term commence
  under Idaho Code § 54-2006(2)?
options:
  - The term commences on July 1, 2025
  - The term commences on March 15, 2025
  - The term commences on July 1, 2024
  - The term commences on March 15, 2024
key: C
explanation: The law states that a regular appointment shall commence on July 1 of the year of
  appointment. Since the appointment occurs in 2024, the term begins July 1, 2024. Choosing the
  appointment date ignores the statutory start date, and selecting a date in 2025 mistakenly adds a
  full year.
