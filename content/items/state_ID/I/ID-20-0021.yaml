  - Twenty (20) days
key: D
explanation: Under Idaho Code § 54-2061(3), a licensee must forward a copy of the legal document
  evidencing a conviction, declaration of incompetency, or civil judgment to the commission within
  twenty (20) days. Therefore, the correct reporting period is twenty days. The ten‑day option is
  incorrect because the statute specifies twenty days, not ten.
