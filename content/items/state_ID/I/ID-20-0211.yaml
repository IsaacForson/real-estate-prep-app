stem: A licensee has repaid in full all obligations to the recovery fund. Under Idaho Code §
  54-2078, what effect does this have on the commission's ability to take disciplinary action for a
  separate violation of the real estate license law?
options:
  - It does not nullify or modify the effect of any other disciplinary proceeding
  - It bars the commission from taking any further disciplinary action for one year
  - It requires the commission to issue a warning instead of suspension or revocation
  - It obligates the licensee to complete additional continuing education
key: A
explanation: The statute provides that repayment in full of the recovery fund does not nullify or
  modify the effect of any other disciplinary proceeding, so the commission may still act for a
  separate violation. The option suggesting a bar on further action contradicts this provision.
