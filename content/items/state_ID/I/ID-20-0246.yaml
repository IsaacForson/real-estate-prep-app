stem: A natural person is convicted of acting as a real estate salesperson without a license in
  Idaho. What is the maximum criminal fine that may be imposed under Idaho Code § 54-2065?
options:
  - A fine of not more than $5,000
  - A fine of not more than $1,000
  - A fine of not more than $2,500
  - A fine of not more than $10,000
key: A
explanation: The statute states that a natural person acting without a license shall be punished by
  a fine of not to exceed five thousand dollars ($5,000). Therefore, the maximum criminal fine is
  $5,000. The $2,500 distractor is incorrect because the law sets a higher cap, and the $10,000
  amount applies only to limited liability companies or corporations, not natural persons.
citation:
  source: Idaho Code § 54-2065
  url: null
  quoted_text: Any person acting as a real estate broker or real estate salesperson within the meaning
    of this chapter without a license as herein provided shall be guilty of a misdemeanor and, upon
    conviction thereof, if a natural person, be punished by a fine of not to exceed five thousand
    dollars ($5,000).
