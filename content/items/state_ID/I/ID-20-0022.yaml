explanation: Idaho Code § 54-2061(3) requires a licensee who has been convicted to forward a copy of
  the conviction document to the commission within twenty days. Hence, the licensee must submit the
  conviction document within that timeframe. Submitting a written statement of facts or acting
  immediately does not satisfy the specific twenty‑day document‑submission requirement.
