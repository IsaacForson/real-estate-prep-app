stem: A licensee is convicted of a felony for embezzlement in a court of competent jurisdiction.
  Under Idaho Code § 54-2061(1)(a), what disciplinary action may the commission take?
options:
  - Suspending or revoking the licensee's license
  - Issuing a cease and desist order to the licensee
  - Assessing a civil penalty up to $5,000
  - Requiring additional continuing education
key: A
explanation: The statute allows the commission to take disciplinary action, including suspension or
  revocation, when a licensee has been convicted of a felony. The option describing suspending or
  revoking the licensee's license reflects this authorized action. The option describing assessing a
  civil penalty up to $5,000 applies to unlicensed practice under § 54-2065, not to disciplinary
  action for a felony conviction.
