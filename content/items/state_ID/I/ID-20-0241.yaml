  source: Idaho Code § 54-2061(1)(a)
  url: null
  quoted_text: "The commission may also take disciplinary action against a licensee including, but not
    limited to, suspension or revocation of a license where, in a court of competent jurisdiction,
    the licensee: (a) Has been convicted of a felony, or has been convicted of a misdemeanor
    involving fraud, misrepresentation, or dishonest or dishonorable dealing or which otherwise
    demonstrates the licensee’s lack of trustworthiness to engage in the real estate business;"
