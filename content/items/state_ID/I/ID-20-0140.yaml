stem: A licensee in Idaho is accused of violating a provision of the real estate license law. Under
  Idaho Code § 54-2066, what action is the commission authorized to take to stop the violation?
options:
  - The commission may issue a cease and desist order immediately.
  - The commission may suspend the licensee's license pending a hearing.
  - The commission may institute injunction proceedings in district court to restrain the violation.
  - The commission may require the licensee to pay restitution to the affected party.
key: C
explanation: The statute authorizes the commission to institute injunction proceedings in the
  district court of competent jurisdiction to restrain any person from violating any provision of
  the chapter. A cease and desist order is covered under a different section (54-2067), not 54-2066.
citation:
  source: Idaho Code § 54-2066
  url: null
  quoted_text: The commission is hereby authorized to institute injunction proceedings in the district
    court of competent jurisdiction, pursuant to the Idaho rules of civil procedure, for cause
    shown, to restrain any person or persons from violating any provision of this chapter regardless
    of whether or not there exists an adequate remedy at law.
