stem: A broker closed a transaction on August 20, 2022. Until what date must the broker retain the
  transaction file records under Idaho Code § 54-2049?
options:
  - December 31, 2023
  - December 31, 2024
  - December 31, 2025
  - December 31, 2026
key: C
explanation: Records must be kept for three calendar years after the year the transaction closed;
  adding 2023, 2024, and 2025 yields a retention deadline of December 31, 2025. The December 31,
  2024 option results from counting only two years after the closed year, a frequent error.
