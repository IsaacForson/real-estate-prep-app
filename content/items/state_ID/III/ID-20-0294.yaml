stem: Under Idaho Code § 54-2045(4), what must a sales associate do with earnest money, option
  money, promissory notes, or other consideration received in connection with a real estate
  transaction?
options:
  - Deposit the funds into the broker's trust account after one business day.
  - Immediately deliver the consideration to the broker or the broker's office.
  - Keep the funds in a personal account until the broker gives instructions.
  - Promptly return the consideration to the payer without informing the broker.
key: B
explanation: The rule requires the sales associate to immediately deliver all consideration to the
  broker or broker's office. The distractors incorrectly apply deposit timelines, allow personal
  retention, or permit return without broker knowledge, which the statute does not allow.
citation:
  source: Idaho Code § 54-2045(4)
  url: null
  quoted_text: All consideration, including cash, checks held in uncashed form and promissory notes,
    received by a sales associate in connection with a real estate transaction shall be immediately
    delivered to the broker or the broker’s office.
