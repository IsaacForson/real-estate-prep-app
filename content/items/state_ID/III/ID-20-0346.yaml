stem: Under Idaho Code § 54-2016(4)(f), if a brokerage maintains a separate real estate trust
  account for a branch office, where must all records and related files for that account be
  maintained?
options:
  - At the branch office where the account is held
  - At the main office of the brokerage firm
  - In a centralized electronic filing system
  - With the Idaho Real Estate Commission
key: A
explanation: The statute requires that records and related files for a separate branch office trust
  account be maintained at the branch office. Keeping them at the main office or elsewhere violates
  this requirement.
