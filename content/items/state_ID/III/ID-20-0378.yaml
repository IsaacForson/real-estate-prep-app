  url: null
  quoted_text: A ledger record must also be created when the broker or associate receives a check to
    be held for later deposit. However, such a check must be accompanied by written instructions in
    the purchase and sale agreement or offer to withhold deposit until a time certain, such as
    acceptance of the offer by the seller.
