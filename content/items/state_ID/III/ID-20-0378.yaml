stem: A broker receives an earnest money check from a buyer on Tuesday. The purchase and sale
  agreement includes written instructions signed by both parties to withhold deposit until the
  seller accepts the offer. What action is required of the broker under Idaho Code § 54-2045(2)?
options:
  - The broker creates a ledger record and returns the check to the buyer uncashed.
  - The broker creates a ledger record and deposits the check into the trust account immediately.
  - The broker creates a ledger record and deposits the check into the broker's business account.
  - The broker creates a ledger record and holds the check per the written instructions.
key: D
explanation: The rule requires a ledger record when a check is received for later deposit, but only
  if accompanied by written instructions to withhold deposit until a certain time. The broker must
  therefore create the ledger record and hold the check as directed. Depositing immediately,
  returning the check, or placing it in a business account would violate the instruction.
