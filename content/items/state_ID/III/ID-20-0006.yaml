stem: An actively licensed salesperson wants to purchase a house for personal use from a
  for-sale-by-owner seller. How must the salesperson conduct this purchase?
options:
  - Through any brokerage of the salesperson's own choosing at that time
  - Through the broker with whom the salesperson is currently licensed
  - Without any brokerage involvement since the property is unlisted
  - Through the commission's staff acting as a neutral transaction agent
key: B
explanation: Idaho law requires an actively licensed person who is buying or selling real property
  in a regulated transaction to conduct the transaction through the broker with whom the person is
  licensed, listed or not.
citation:
  source: Idaho Code § 54-2055
  url: null
  quoted_text: Each actively licensed person buying or selling real property or any interest therein,
    in a regulated real estate transaction, must conduct the transaction through the broker with
    whom he is licensed, whether or not the property is listed.
