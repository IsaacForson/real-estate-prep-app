stem: A broker opens a separate real estate trust account for a licensed branch office but decides
  to keep all trust account records at the company's main office for convenience. Under Idaho Code §
  54-2016(4)(f), is this practice permissible?
options:
  - Yes, if the main office can produce records upon request
  - No, because records must be kept at the branch office
  - Yes, provided the broker notifies the commission in writing
  - No, unless duplicate records are also kept at the main office
key: B
explanation: The rule mandates that records for a branch office trust account be maintained at the
  branch office; locating them at the main office is not allowed. The other options incorrectly
  suggest exceptions that the statute does not provide.
citation:
  source: Idaho Code § 54-2016(4)(f)
  url: null
  quoted_text: If a separate real estate trust account is maintained for a branch office, all records
    and related files for that account shall be maintained at the branch office.
