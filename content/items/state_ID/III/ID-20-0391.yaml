stem: Under Idaho Code § 54-2039(3), when does a change in designated broker become effective?
options:
  - Effective immediately upon the commission's receipt of the notice, before approval.
  - Effective after a ten‑business‑day period following submission of the notice.
  - Effective upon the commission's receipt and approval of the written notice.
  - Effective at the beginning of the subsequent licensing renewal cycle.
key: C
explanation: The rule states that a change in designated broker is not effective until the
  commission receives and approves the written notice. Therefore, effectiveness occurs upon
  approval, not upon submission or after a set period. The distractor that claims effectiveness upon
  submission is incorrect because approval is required.
