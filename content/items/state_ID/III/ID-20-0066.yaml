stem: Under Idaho Code § 54-2049, for how long must a broker retain transaction files after the year
  in which a transaction is closed?
options:
  - One calendar year
  - Two calendar years
  - Three calendar years
  - Four calendar years
key: C
explanation: The statute requires brokers to keep transaction files for three calendar years after
  the year in which the transaction closed, the event occurred, funds were disbursed, or the
  agreement expired. The distractor of two calendar years is incorrect because it shortens the
  required period by one year.
