stem: A buyer submits a signed offer to purchase with earnest money to a broker on Tuesday.
  According to Idaho Code § 54-2051(2), what must the broker do immediately upon receiving the
  offer?
options:
  - Deposit the earnest money in a trust account by end of day
  - Provide a copy of the offer to the buyer as a receipt
  - Submit the offer to the seller within 24 hours
  - File the offer with the commission
key: B
explanation: The statute requires the broker or salesperson to provide a copy of the offer to
  purchase to the buyer as a receipt immediately upon receiving any offer signed and dated by the
  buyer and any consideration. The other options describe actions not mandated by this subsection.
