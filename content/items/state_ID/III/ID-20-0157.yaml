stem: A broker wants to open an interest-bearing trust account for a single transaction. The buyer
  provides written consent, but the seller does not. According to Idaho Code § 54-2043, may the
  broker proceed with the interest-bearing trust account?
options:
  - The broker may proceed if the transaction closes within 30 days.
  - The broker may not proceed because interest-bearing accounts are prohibited for single
    transactions.
  - The broker may proceed because the buyer's written consent satisfies the requirement.
  - The broker may not proceed because written direction from both parties is required.
key: D
explanation: Section 54-2043 requires written direction from both parties to the transaction before
  an interest‑bearing trust account may be used for a single transaction. The buyer’s consent alone
  does not meet this requirement. The distractor about a 30‑day closing period is not mentioned in
  the statute.
