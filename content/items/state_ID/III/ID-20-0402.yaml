stem: A broker changed license status on April 1, 2023. For a real estate transaction that closed on
  September 30, 2021, under Idaho Code § 54-2056(6), until what date must the broker make the trust
  account records available to the commission?
options:
  - December 31, 2024
  - September 30, 2024
  - April 1, 2026
  - December 31, 2025
key: A
explanation: Records must be available for three years following the year of closure; a 2021
  transaction requires availability through the end of 2024. September 30, 2024 incorrectly adds
  three calendar years to the closing date.
