stem: A brokerage submits a notice to change its designated broker to the Idaho Real Estate
  Commission on June 1. The commission approves the change on June 4. According to Idaho Code §
  54-2039(3), when does the change in designated broker become effective?
options:
  - Effective immediately upon submission of the notice on June 1.
  - Effective ten (10) business days after submission.
  - Effective upon the commission's approval on June 4.
  - Effective at the start of the next licensing period.
key: C
explanation: The law provides that a change in designated broker is effective only after the
  commission receives and approves the written notice. Since approval occurred on June 4, the change
  becomes effective on that date. The distractor claiming effectiveness upon submission ignores the
  approval requirement.
citation:
