stem: A broker wants to designate an associate broker as the branch manager for a new branch office.
  The associate broker completed the required business conduct and office operations course four
  years ago. Under Idaho Code § 54-2016(4)(b), is this designation permissible?
options:
  - The designation is permitted because the broker can waive the course requirement for experienced
    managers
  - The designation is permitted if the associate broker holds an active license at the time of
    designation
  - The designation is not permitted because the course must have been completed within the three
    years preceding designation
  - The designation is permitted because any prior completion of the course satisfies the requirement
key: C
explanation: The statute requires that a branch manager must have completed the commission‑approved
  business conduct and office operations course within three years immediately prior to designation.
  Completing the course four years ago fails this timing requirement, so the designation is not
  permitted. Distractor A incorrectly suggests any prior completion suffices.
citation:
  source: Idaho Code § 54-2016(4)(b)
  url: null
  quoted_text: The designated broker shall designate in the application a branch manager, who shall be
    an associate broker and who, within three (3) years immediately prior to the designation, shall
    have completed a commission-approved business conduct and office operations course, to regularly
    occupy and be responsible for the supervision of the branch office.
