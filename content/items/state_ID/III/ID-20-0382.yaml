stem: A broker receives compensation from both the buyer and the seller in a transaction but does
  not provide written disclosure to either party before closing. Under Idaho Code § 54-2054(7), is
  this arrangement permissible?
options:
  - The arrangement is impermissible because dual compensation is prohibited
  - The arrangement is permissible because disclosure was made after closing
  - The arrangement is impermissible due to lack of prior disclosure
  - The arrangement is permissible if disclosed to the buyer only
key: C
explanation: The rule prohibits accepting compensation from more than one party without first making
  full written disclosure. Since no disclosure was provided before closing, the arrangement is
  impermissible. The distractor “The arrangement is permissible if disclosed to the buyer only” is
  wrong because disclosure must be made to all parties involved, not just the buyer.
citation:
  source: Idaho Code § 54-2054(7)
  url: null
  quoted_text: No licensed real estate broker or salesperson shall charge or accept compensation from
    more than one (1) party in any one (1) transaction, without first making full disclosure in
    writing of the broker’s intent to do so, to all parties involved in the transaction.
