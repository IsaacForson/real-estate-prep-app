stem: A licensee receives a rebate from a title company for directing clients to that company.
  According to Idaho Code § 54-2054(6), what must the licensee disclose in writing to all parties to
  the transaction prior to closing?
options:
  - The title company’s license status
  - The licensee’s intent to receive the rebate
  - The permissibility of the rebate under the rule
  - The amount of the rebate received
key: B
explanation: The rule requires a licensee who legally receives a fee or rebate from a service
  provider to disclose the intent to receive that fee, rebate, or compensation in writing to all
  parties before closing. Disclosing the amount is not mandated by the statute.
citation:
  source: Idaho Code § 54-2054(6)
  url: null
  quoted_text: However, a licensee legally receiving any fee or rebate from any person providing
    direct services to either the buyer or the seller in connection with a regulated real estate
    transaction is required to disclose the licensee’s intent to receive such fee, rebate or
    compensation in writing to all parties to the transaction prior to closing.
