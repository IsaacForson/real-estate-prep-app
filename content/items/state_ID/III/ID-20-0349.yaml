stem: A sales associate who is not actively licensed at the time a cause of action arises attempts
  to sue a client for an unpaid commission. What is the result under Idaho Code § 54-2054(1)?
options:
  - The court will automatically award the commission to the sales associate regardless of licensure
    status
  - The sales associate may not bring or maintain any court action for commission collection
  - The sales associate must pay a fine equal to double the amount of the commission sought
  - The sales associate may proceed with the lawsuit if the client agrees in writing
key: B
explanation: Idaho Code § 54-2054(1) prohibits a person from bringing or maintaining a court action
  for compensation unless they were actively licensed at the time the cause of action arose.
  Therefore, the sales associate cannot sue for the commission. The other options describe outcomes
  not supported by the statute.
