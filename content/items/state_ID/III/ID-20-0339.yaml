stem: A licensed branch office of an Idaho brokerage wants to place a sign on a property advertising
  the branch's services. According to Idaho Code § 54-2053(3), what must the branch office's
  advertising clearly and conspicuously contain?
options:
  - The branch office's contact phone number
  - The branch office's mailing address
  - The broker's licensed business name
  - The branch office's displayed name
key: C
explanation: Idaho Code § 54-2053(3) requires that any advertising by a licensed branch office
  clearly and conspicuously include the broker’s licensed business name. The other options—providing
  the branch office’s phone number, mailing address, or displayed name—are not required by this
  provision.
