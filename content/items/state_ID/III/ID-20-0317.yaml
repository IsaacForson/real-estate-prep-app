stem: A sales associate terminates his licensed association with a broker effective Friday, March 1,
  2024. By what date must the associate provide written notice to the broker under Idaho Code §
  54-2056(1)?
options:
  - March 7, 2024
  - March 6, 2024
  - March 5, 2024
  - March 4, 2024
key: B
explanation: The rule requires notice within three business days after the effective date; counting
  March 4, 5, and 6 as the three business days makes March 6 the deadline. The March 5 option
  results from counting only two business days, a common mistake.
citation:
