stem: Under Idaho Code § 54-2048, who is deemed the responsible broker in a transaction where the
  broker lists and sells any real property?
options:
  - The broker who holds entrusted funds in a trust account
  - The broker who lists and sells any real property
  - The cooperating broker in a cooperative sale
  - The broker who delivers funds to the closing agency
key: B
explanation: The statute explicitly states that the broker who lists and sells any real property
  shall be deemed the responsible broker in the transaction. The other options describe situations
  where a different broker may be deemed responsible under other provisions, but not when the broker
  both lists and sells the property.
