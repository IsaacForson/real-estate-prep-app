stem: A buyer and seller disagree over earnest money, and the broker believes it is not reasonably
  possible to disburse the funds. Under Idaho Code § 54-2047(3), what must the broker do?
options:
  - The broker should immediately refund the earnest money to the buyer unless otherwise agreed.
  - The broker should disburse the earnest money to the listing broker as compensation.
  - The broker should deposit the earnest money into the broker’s operating account.
  - The broker should hold the funds and provide written notice to all parties of the decision to
    hold pending a court order.
key: D
explanation: The rule permits the broker to hold disputed funds when disbursement is not reasonably
  possible and requires written notice to all parties of that decision. Immediate refund or
  disbursement to the broker’s own account is not authorized without agreement or court order.
citation:
  source: Idaho Code § 54-2047(3)
  url: null
  quoted_text: If the broker does not believe it is reasonably possible to disburse the disputed
    funds, the broker may hold the funds until ordered by a court of proper jurisdiction to make a
    disbursement. The broker shall give all parties written notice of any decision to hold the funds
    pending a court order for disbursement.
