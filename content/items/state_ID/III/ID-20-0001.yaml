stem: Under Idaho real estate license law, which persons may be named by a broker in advertising of
  Idaho real property?
options:
  - Licensees who currently hold an active Idaho real estate license
  - Any individual holding an active license from a neighboring state
  - Any salesperson who has completed pre-licensing coursework only
  - Any office employee of the brokerage, whether licensed or not
key: A
explanation: The advertising statute limits who a broker may name in advertising of Idaho property
  to persons who are actively licensed in Idaho, regardless of other training or out-of-state
  credentials.
citation:
  source: Idaho Code § 54-2053
  url: null
  quoted_text: Only licensees who are actively licensed in Idaho may be named by an Idaho broker in
    any type of advertising of Idaho real property, may advertise Idaho property in Idaho or may
    have a sign placed on Idaho property.
