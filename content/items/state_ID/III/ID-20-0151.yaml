stem: A broker opens a real estate trust account and deposits $150 of firm funds to cover expected
  bank charges. After a month, the broker incurs $20 in bank charges paid from the account. The
  broker then deposits an additional $100 of firm funds to replenish the account. What is the new
  balance of broker or firm funds in the account, and does it comply with Idaho law?
options:
  - $230 and permissible
  - $230 and not permissible
  - $150 and permissible
  - $250 and not permissible
key: A
explanation: The balance is calculated as $150 initial deposit minus $20 charges plus $100 deposit =
  $230, which is below the $300 limit for broker or firm funds in a trust account. The distractor
  '$230 and not permissible' incorrectly states the balance violates the limit.
