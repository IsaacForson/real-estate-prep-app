stem: An actively licensed broker decides to surrender his designated broker status and become a
  sales associate. Under Idaho Code § 54-2056(6), what must the broker do regarding the trust
  accounts and transaction file records he was responsible for while a designated broker?
options:
  - Closure of all trust accounts and transfer of funds to the commission
  - Written notice to the commission of the location of all trust accounts and transaction file
    records
  - Continued maintenance of the records at the broker’s office without further action
  - Verbal notice to the commission of the new license status only
key: B
explanation: When a broker changes status away from being a designated broker, the statute requires
  written notice to the commission of the location of all trust accounts and transaction file
  records for which the broker was responsible. Simply keeping the records without notifying the
  commission does not satisfy this duty.
citation:
  source: Idaho Code § 54-2056(6)
  url: null
  quoted_text: When an actively licensed broker changes to a license status other than that of a
    designated broker, that individual must notify the commission in writing of the location of all
    trust accounts and transaction file records which the broker was responsible for during the term
    of licensure as a designated broker.
