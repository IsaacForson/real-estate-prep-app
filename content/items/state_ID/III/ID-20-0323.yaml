stem: A broker wants to designate an associate broker as the branch manager for a new branch office.
  The associate broker completed the required business conduct and office operations course four
  years ago. Under Idaho Code § 54-2016(4)(b), is this designation permissible?
options:
  - The designation is permitted because the course completion remains valid for licensing purposes
  - The designation is not permitted because course must be finished within three years prior
  - The designation is permitted if the associate broker maintains an active license in good standing
  - The designation is not permitted because only designated brokers may supervise branch office
    operations
key: B
explanation: The rule requires the course to have been completed within three years immediately
  prior to designation; completing it four years ago fails this requirement. The distractor about
  maintaining an active license ignores the specific timing rule for the course.
citation:
  source: Idaho Code § 54-2016(4)(b)
  url: null
  quoted_text: The designated broker shall designate in the application a branch manager, who shall be
    an associate broker and who, within three (3) years immediately prior to the designation, shall
    have completed a commission-approved business conduct and office operations course, to regularly
    occupy and be responsible for the supervision of the branch office.
