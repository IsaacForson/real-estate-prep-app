stem: Under Idaho Code § 54-2040(5), which action by a broker would be prohibited?
options:
  - An action where the broker allows a licensed associate broker to use the license to open a
    branch office under the broker's active management
  - An action where the broker uses the license to advertise properties listed by another brokerage
  - An action where the broker lends the license to a licensed salesperson to work as an independent
    contractor under the broker's supervision
  - An action where the broker permits an unlicensed individual to use the license to establish a
    property management firm while the broker does not actively manage it
key: D
explanation: The statute forbids a broker from lending or permitting the use of the broker’s license
  to enable anyone to establish a brokerage business when the broker does not actively manage and
  have full control. Permitting an unlicensed person to use the license for a property management
  firm without the broker’s active management violates this prohibition. The distractor describing
  supervision of a licensed salesperson under the broker’s oversight is permissible because the
  broker retains active management and control.
citation:
  source: Idaho Code § 54-2040(5)
  url: null
  quoted_text: A broker shall not lend or permit the use of the broker’s license, whether for
    compensation or not, to enable anyone licensed or unlicensed to, in fact, establish or carry on
    a business for which a real estate broker’s license is required, wherein the broker does not
    actively manage and have full control.
