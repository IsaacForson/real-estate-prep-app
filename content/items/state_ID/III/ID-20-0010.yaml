stem: A broker wants to pay a share of a commission to an unlicensed legal business entity. Under
  what condition does license law permit this payment?
options:
  - The entity has filed articles of organization with the secretary of state
  - The entity's owners hold licenses and a licensed owner did the work
  - The payment is routed first through an escrow account before disbursement
  - The entity agrees in writing to obtain its own license within ninety days
key: B
explanation: The compensation statute permits a broker to pay a share of a commission to an
  unlicensed legal business entity only if all of the entity's owners are active real estate
  licensees and an owner licensed under the broker performed the licensed activities.
