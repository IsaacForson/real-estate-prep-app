stem: A broker is preparing to disburse earnest money to the escrow closing agent for a transaction
  scheduled to close on June 15, 2025. Under Idaho Code § 54-2046(3), by what date must the broker
  make the disbursement to the escrow agent?
options:
  - June 14, 2025.
  - June 10, 2025.
  - June 16, 2025.
  - June 15, 2025.
key: D
explanation: The rule states that disbursement to the escrow agent shall be made on or before the
  day of closing. Therefore the latest permissible date is the closing date itself; disbursement
  after closing is not allowed, and earlier dates are permissible but not required.
citation:
  source: Idaho Code § 54-2046(3)
  url: null
  quoted_text: When set forth in the purchase and sale agreement that funds are to be disbursed to the
    person or company named as the escrow closing agent or agency, such disbursement shall be made
    to the person, company, agent or agency on or before the day of closing, and a receipt for such
    disbursement shall be retained in the broker’s transaction file.
