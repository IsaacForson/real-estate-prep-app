stem: A sole proprietor seeking a real estate license completed the required business conduct and
  office operations course 2 years and 11 months ago. Under Idaho Code § 54-2016(2)(c), does this
  satisfy the course requirement for licensure?
options:
  - The course completion is insufficient because it must have been completed within the two‑year
    period.
  - The course completion is sufficient because it occurred within the three‑year period.
  - The course completion is sufficient because any prior completion satisfies the requirement.
  - The course completion is insufficient because it must have been completed within the one‑year
    period.
key: B
explanation: The statute requires the course to be completed within three years immediately prior to
  the application for license. Completion 2 years and 11 months ago falls within that window, so the
  requirement is satisfied. The distractor asserting a two‑year requirement misstates the statutory
  period.
