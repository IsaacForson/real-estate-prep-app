stem: A broker wishes to open an interest-bearing trust account for a single transaction. According
  to Idaho Code § 54-2043, which of the following is required?
options:
  - The account must remain open for at least six months
  - Funds must be deposited with a state-chartered bank only
  - Written direction from both parties to the transaction
  - Approval from the Idaho Real Estate Commission
key: C
explanation: Idaho Code § 54-2043 requires written direction from both parties to the transaction
  before a broker may establish an interest‑bearing trust account for a single transaction. The
  statute does not mention commission approval, a minimum term, or a restriction to state‑chartered
  banks. Therefore, the correct choice is the written direction requirement.
