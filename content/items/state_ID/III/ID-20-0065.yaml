stem: A brokerage LLC plans to advertise its services under the assumed name "Idaho Home Experts"
  but has not yet filed a certificate of assumed name with the Idaho secretary of state. What must
  the LLC do before using this assumed name in advertising?
options:
  - Provide proof of filing a certificate of assumed name with Idaho secretary of state
  - Obtain written approval from the Idaho real estate commission
  - Publish a notice of the assumed name in a local newspaper for two weeks
  - Take no action; assumed names may be used freely
key: A
explanation: Under Idaho Code § 54-2016(1)(g), a legal business entity doing business under an
  assumed name must provide satisfactory proof of having legally filed a certificate of assumed name
  with the Idaho secretary of state. Therefore the LLC must provide that proof before using the
  assumed name. The other options are not required by statute.
