stem: A broker wants to pay a portion of a commission received from a regulated real estate
  transaction to an unlicensed legal business entity. Under Idaho Code § 54-2054(2), which condition
  must be satisfied for such a payment to be permissible?
options:
  - The unlicensed entity must be a title company licensed in another state.
  - All owners of the entity must be active real estate licensees.
  - The broker must first obtain written permission from the commission.
  - The payment must be less than 25% of the total commission.
key: B
explanation: The statute allows payment to an unlicensed legal business entity only if all of its
  owners are active real estate licensees and an owner licensed under the broker performed the
  licensed activities for which the payment is made. The other options are not conditions specified
  in the rule.
