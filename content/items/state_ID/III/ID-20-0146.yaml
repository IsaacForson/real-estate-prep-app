stem: Under Idaho Code § 54-2053, what must be clearly and conspicuously contained in all
  advertising of listed property?
options:
  - The broker’s licensed business name
  - The property’s legal description
  - The licensee’s personal phone number
  - The date the property was listed
key: A
explanation: The statute requires that all advertising of listed property clearly and conspicuously
  contain the broker’s licensed business name. The other options describe information that is not
  mandated by this provision.
