stem: A broker wants to disburse earnest money from a trust account to the seller as part of a
  closing, but the buyer and seller have not provided written authorization. According to Idaho Code
  § 54-2046(1), what must the broker do?
options:
  - The broker must disburse the funds anyway because the closing statement shows the amount due
  - The broker must obtain written, signed authorization from the parties before disbursing
  - The broker must disburse the funds and later obtain retroactive authorization
  - The broker must hold the funds indefinitely until a court orders disbursement
key: B
explanation: The rule prohibits any disbursement without a written, signed authorization from the
  parties or a court order. Therefore the broker must obtain the required authorization before
  disbursing. The option that says the broker may disburse based on the closing statement, the
  option that allows disbursement with later authorization, and the option that requires holding
  funds until a court order each violate the rule.
