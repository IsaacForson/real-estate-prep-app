stem: A licensed business entity’s designated broker has had his license suspended by the
  commission. How many business days does the entity have to designate another qualified individual
  as designated broker before its license is terminated?
options:
  - Five business days
  - Seven business days
  - Ten business days
  - Fifteen business days
key: C
explanation: The statute gives the entity ten business days to name a replacement broker; after that
  period the entity’s license is terminated. The five‑day option confuses this period with other
  notice requirements.
citation:
  source: Idaho Code § 54-2016(1)(d)
  url: null
  quoted_text: If the individual so designated has a license refused, revoked, suspended or otherwise
    made inactive by the commission, or if the individual designated broker voluntarily surrenders
    the individual license or ceases to be connected with the entity in the manner required above,
    the business entity shall have ten (10) business days in which to designate another qualified
    individual as designated broker before the entity’s license is terminated, and the licenses of
    all associated licensees are made inactive.
