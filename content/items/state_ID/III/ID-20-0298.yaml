stem: A broker agrees to receive a portion of the commission from the buyer and the remainder from
  the seller in a residential transaction. The broker provides written disclosure to both parties
  before closing. Under Idaho Code § 54-2054(7), is this arrangement permissible?
options:
  - The arrangement is permissible because written disclosure was given to both parties before
    closing
  - The arrangement is permissible because verbal disclosure was given to both parties before closing
  - The arrangement is not permissible because written disclosure was given to only the buyer before
    closing
  - The arrangement is not permissible because written disclosure was given to both parties after
    closing
key: A
explanation: Idaho Code § 54-2054(7) requires a broker who intends to accept compensation from more
  than one party in a transaction to disclose that intent in writing to all parties involved before
  closing. The correct option states that written disclosure was given to both parties before
  closing, which satisfies the requirement. The option that mentions verbal disclosure fails because
  the rule demands written disclosure. The options that indicate disclosure was given to only one
  party or that disclosure occurred after closing fail because the rule requires disclosure to all
  parties and that it occur before closing.
citation:
  source: Idaho Code § 54-2054(7)
  url: null
  quoted_text: No licensed real estate broker or salesperson shall charge or accept compensation from
    more than one (1) party in any one (1) transaction, without first making full disclosure in
    writing of the broker’s intent to do so, to all parties involved in the transaction.
