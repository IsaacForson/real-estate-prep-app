stem: A brokerage operates a satellite office where earnest money checks are deposited and held, but
  the brokerage does not obtain a separate branch office license for that location. Under Idaho Code
  § 54-2016(4)(e), is this arrangement permissible?
options:
  - Yes, provided the brokerage maintains a centralized trust account at the main office
  - No, unless the satellite office also handles original transaction files
  - Yes, because the satellite office is considered part of the main office
  - No, because holding trust funds at the satellite office requires a separate branch office license
key: D
explanation: The statute states that a separate branch office license is required when trust funds
  or original transaction records are kept at a location other than the main office. Since earnest
  money (trust funds) is held at the satellite office, a license is needed.
