stem: A brokerage company's designated broker leaves the company and no replacement broker has yet
  been designated, but the original broker's license has not been revoked. Who remains responsible
  for the pending transactions and trust account funds?
options:
  - Each individual sales associate, who is responsible for that associate's own files
  - The brokerage's unlicensed office administrator, by default
  - The commission staff, acting temporarily in place of any broker
  - The original designated broker, responsible until a new broker is designated
key: D
explanation: Where a designated broker has left and no new broker has been designated, the original
  designated broker remains responsible for trust account funds, pending transactions, and records
  unless that broker's own license was revoked.
