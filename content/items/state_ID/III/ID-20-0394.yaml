stem: According to Idaho Code § 54-2042(2), how must each real estate trust account be identified on
  checks, deposit slips, and with the depository?
options:
  - The account must be identified by the broker's license number on checks, deposit slips, and with
    the depository.
  - The account must be identified by the term "real estate trust account" on checks, deposit slips,
    and with the depository.
  - The account must be identified by the account number only on checks, deposit slips, and with the
    depository.
  - The account must be identified by the term "escrow account" on checks, deposit slips, and with
    the depository.
key: B
explanation: The rule requires the term "real estate trust account" to appear on checks, deposit
  slips, and with the depository; the other options incorrectly substitute the broker's license
  number, "escrow account", or the account number alone.
