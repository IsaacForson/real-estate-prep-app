stem: A sales associate obtains a signed buyer representation agreement from a prospective buyer.
  According to Idaho Code § 54-2050(4), what must the sales associate do with this agreement?
options:
  - Provide a true and legible copy to the designated broker or broker's office prior to the end of
    the next business day
  - Immediately file the original agreement with the Idaho Real Estate Commission for record keeping
  - Keep the agreement in her personal files until the transaction closes and then destroy it
  - Send the agreement to the buyer's lender for approval and retain a copy for the broker
key: A
explanation: Idaho Code § 54-2050(4) requires a sales associate who obtains a signed brokerage
  representation agreement to provide a true and legible copy to the designated broker or broker's
  office prior to the end of the next business day. Filing the original with the commission is not
  mandated by this provision.
citation:
  source: Idaho Code § 54-2050
  url: null
  quoted_text: A sales associate who obtains a signed brokerage representation agreement of any kind
    shall provide a true and legible copy of such representation agreement to the designated broker
    or broker's office prior to the end of the next business day.
