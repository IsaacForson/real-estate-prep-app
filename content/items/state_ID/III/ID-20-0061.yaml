stem: A broker receives an earnest money check from a buyer on a Monday. Under Idaho Code §
  54-2045(1), by what deadline must the broker deposit the funds unless the parties provide written
  instructions to the contrary?
options:
  - The broker must deposit the funds within five business days.
  - The broker must deposit the funds by the end of the same day.
  - The broker must deposit the funds within three business days.
  - The broker must deposit the funds by the end of the next banking day.
key: D
explanation: The statute requires deposit on or before the banking day immediately following
  receipt, which for a Monday receipt is Tuesday. Options allowing three or five days exceed this
  limit unless written instructions specify otherwise.
citation:
  source: Idaho Code § 54-2045(1)
  url: null
  quoted_text: All moneys received by a broker for another in a real estate transaction are to be
    deposited on or before the banking day immediately following the receipt day of such funds,
    unless written instructions signed by the party or parties having an interest in the funds
    direct the broker to do otherwise.
