stem: In a cooperative sale, one broker lists the property while a different cooperating broker
  locates the buyer, and the listing broker holds the entrusted funds in a real estate trust account
  while the transaction is pending. Which broker is deemed responsible for the transaction?
options:
  - The broker who is holding the entrusted funds pending the transaction
  - The cooperating broker who located the buyer and represents that buyer
  - Whichever broker's sales associate first wrote the initial offer
  - The closing agent who handles the final settlement statement
key: A
explanation: In a cooperative sale, the broker who holds entrusted funds in a real estate trust
  account while the transaction is pending is deemed the broker responsible for the transaction.
citation:
  source: Idaho Code § 54-2048
  url: null
  quoted_text: In the case of a cooperative sale, the broker who holds entrusted funds in a real
    estate trust account while the transaction is pending, or who delivers or transfers the funds to
    the closing agency or any authorized party other than the cooperating broker in the transaction,
    shall be deemed the broker responsible for the transaction.
