stem: Under Idaho Code § 54-2055(2), what must a licensee disclose in writing to a buyer or seller
  when the licensee is buying or selling their own real property?
options:
  - That they hold an active Idaho real estate license
  - That they have errors and omissions insurance coverage
  - That they are a licensed broker or sales associate
  - That they have completed the required business conduct course
key: A
explanation: The rule requires a licensee to disclose in writing that they hold an active Idaho real
  estate license when buying or selling their own property. The other options describe having errors
  and omissions insurance, being a licensed broker or sales associate, and completing the required
  business conduct course, which are not mandated by this subsection for such disclosure.
