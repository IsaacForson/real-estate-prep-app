stem: Under Idaho Code § 54-2056(6), for how long must a broker make trust account and transaction
  file records available to the commission after changing license status?
options:
  - Two (2) years
  - Seven (7) years
  - Three (3) years
  - Five (5) years
key: C
explanation: The rule requires that records be available to the commission for three (3) years
  following the year in which each transaction was closed. The distractor “One (1) year” shortens
  the required period and therefore does not satisfy the statutory retention requirement.
