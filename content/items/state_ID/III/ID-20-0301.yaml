stem: A broker opens a real estate trust account and deposits $120 of firm funds to cover
  anticipated bank charges. During the month, the broker incurs $15 in bank charges paid from the
  account. To replenish the account, the broker deposits an additional $80 of firm funds. What is
  the resulting balance of broker or firm funds in the trust account, and does it comply with Idaho
  law?
options:
  - $200 and non‑compliant
  - $105 and compliant
  - $185 and compliant
  - $250 and compliant
key: C
explanation: The broker’s funds are calculated as $120 initial deposit minus $15 in charges, leaving
  $105, then plus an $80 replenishment equals $185. Under Idaho Code § 54-2042(7), broker or firm
  funds must not exceed $300, so $185 is compliant. The $105 and compliant option is incorrect
  because it omits the second deposit.
