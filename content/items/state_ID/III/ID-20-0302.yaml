stem: A broker opens an interest‑bearing trust account and deposits earnest money from two separate
  sales transactions into the same account, with written consent from both buyers and sellers. Is
  this permissible under Idaho Code § 54-2043?
options:
  - Yes, because written consent from all parties overrides the one‑transaction requirement.
  - No, because the account may contain funds relating to only one transaction per the rule.
  - Yes, as long as the broker maintains separate records for each transaction.
  - No, unless the broker receives a specific commission waiver for multiple transactions.
key: B
explanation: Idaho Code § 54-2043(2) requires that an interest‑bearing trust account for a single
  transaction contain only the funds relating to that one transaction. This limitation applies
  regardless of written consent or separate record‑keeping. Therefore, commingling funds from two
  transactions is not allowed. The option suggesting consent overrides the rule is incorrect because
  the statute does not provide such an exception.
