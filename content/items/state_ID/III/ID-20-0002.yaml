stem: When is advertising by an Idaho licensee considered misleading under license law?
options:
  - When it fails to list every amenity present at the advertised property
  - When, taken as a whole, it creates a real probability of deceiving the audience
  - When it omits the seller's stated asking price from printed materials
  - When it uses a noticeably smaller font size than the brokerage's standard listings
key: B
explanation: The statute defines advertising as misleading when the information, taken as a whole,
  presents a distinct probability that it will deceive the persons it is intended to influence.
citation:
  source: Idaho Code § 54-2053
  url: null
  quoted_text: Information is misleading if, when taken as a whole, there is a distinct probability
    that such information will deceive the persons whom it is intended to influence.
