stem: A limited liability company (LLC) seeks to be licensed as a real estate brokerage entity.
  According to Idaho Code § 54-2016(1)(c)(iii), who may serve as the individual designated broker
  for the LLC?
options:
  - An individual who is a shareholder of the LLC
  - An individual who is a member or manager of the LLC
  - An individual who is a licensed employee of the LLC
  - An individual who is a creditor of the LLC
key: B
explanation: The statute specifies that for a limited liability company, the individual designated
  broker must be a member or manager of the LLC. The other options do not satisfy this positional
  requirement.
