  - Three business days
  - Two business days
  - One business days
key: B
explanation: Under Idaho Code § 54-2056(1), a sales associate who terminates his licensed
  association with a broker shall provide the broker written notice of the termination no later than
  three (3) business days after the effective date. The other options represent incorrect notice
  periods.
