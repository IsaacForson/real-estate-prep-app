stem: A broker knowingly uses a double contract in a transaction. What consequence does Idaho law
  impose for this conduct?
options:
  - The conduct is considered negligent and requires the broker to pay a fine to the commission
  - The conduct is a minor infraction that results in a written reprimand only
  - The conduct is deemed a technical error that mandates mandatory continuing education
  - The conduct is flagrant misconduct and subjects the licensee to disciplinary action
key: D
explanation: Under Idaho Code § 54-2054(5), using a double contract is deemed flagrant misconduct
  and subjects the licensee to disciplinary action by the commission. The statute does not mandate
  automatic license revocation, refund of commissions, or additional education as the direct
  consequence.
