stem: A broker receives an earnest money check from a buyer on Monday morning. The purchase and sale
  agreement contains no written instructions to delay deposit. According to Idaho Code § 54-2045(1),
  by what deadline must the broker deposit the funds?
options:
  - By the end of Tuesday
  - By the end of the third business day
  - By the end of Wednesday
  - By the end of Monday
key: A
explanation: The rule requires deposit on or before the banking day immediately following the
  receipt day. With receipt on Monday and no written instructions, the latest permissible deposit is
  the next banking day, Tuesday. Therefore the correct answer is the option stating deposit by the
  end of Tuesday. Choosing a deadline later than Tuesday (such as the third business day or
  Wednesday) would violate the rule, and choosing an earlier deadline (such as Monday) does not
  represent the latest allowable time requested.
citation:
  source: Idaho Code § 54-2045(1)
  url: null
  quoted_text: All moneys received by a broker for another in a real estate transaction are to be
    deposited on or before the banking day immediately following the receipt day of such funds,
    unless written instructions signed by the party or parties having an interest in the funds
    direct the broker to do otherwise.
