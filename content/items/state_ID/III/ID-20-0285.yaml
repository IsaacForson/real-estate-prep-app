stem: A broker cannot obtain the buyer’s and seller’s signatures on the closing statement. According
  to Idaho Code § 54-2048(2), what must the broker retain in the transaction file to prove delivery
  of the closing statement?
options:
  - A photocopy of the signed closing statement retained in the file
  - An email printout showing delivery to the buyer and seller
  - A copy of the transmittal letter sent by certified mail, return receipt requested
  - A handwritten note documenting verbal confirmation of receipt
key: C
explanation: The rule states that when signatures of the parties cannot be obtained, a copy of the
  closing statement transmittal letter sent by certified mail, return receipt requested, or a
  written certification of delivery signed by an officer of the escrow closing agency shall be
  retained in the broker’s transaction files. The correct option is a copy of the transmittal letter
  sent by certified mail, return receipt requested. The other options do not satisfy the statutory
  proof of delivery.
