stem: Under Idaho Code § 54-2045(1), a broker may deposit earnest money later than the next banking
  day if which of the following occurs?
options:
  - The broker holds the check in uncashed form pending clearance.
  - The earnest money amount is less than five hundred dollars.
  - The parties provide written instructions signed by the interested parties.
  - The broker decides it is convenient to delay the deposit.
key: C
explanation: The statute permits a delayed deposit only when the parties with an interest in the
  funds provide written instructions authorizing the delay. The broker’s personal convenience does
  not override the requirement, and the amount of the earnest money or the form of the check does
  not affect the timing rule.
citation:
  source: Idaho Code § 54-2045(1)
  url: null
  quoted_text: All moneys received by a broker for another in a real estate transaction are to be
    deposited on or before the banking day immediately following the receipt day of such funds,
    unless written instructions signed by the party or parties having an interest in the funds
    direct the broker to do otherwise.
