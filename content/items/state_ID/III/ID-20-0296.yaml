stem: A sales associate receives an earnest money check from a buyer on a Wednesday. According to
  Idaho Code § 54-2045(4), what must the sales associate do with the check?
options:
  - Hold the check in a personal file until the broker requests it.
  - Immediately deliver the check to the broker or the broker's office.
  - Endorse the check and deposit it into the associate's own account.
  - Deposit the check into the broker's trust account by the end of the next banking day.
key: B
explanation: The statute requires that any consideration received by a sales associate be
  immediately delivered to the broker or the broker's office. Holding the check in a personal file
  until the broker requests it does not satisfy this immediate delivery requirement. Endorsing the
  check and depositing it into the associate's own account violates the requirement to deliver the
  check to the broker. Depositing the check into the broker's trust account by the end of the next
  banking day also fails to meet the immediate delivery mandate.
citation:
  source: Idaho Code § 54-2045(4)
  url: null
  quoted_text: All consideration, including cash, checks held in uncashed form and promissory notes,
    received by a sales associate in connection with a real estate transaction shall be immediately
    delivered to the broker or the broker’s office.
