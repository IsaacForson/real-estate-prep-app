stem: Under Idaho Code § 54-2044, what must a designated broker do regarding trust account records
  each month?
options:
  - The broker must reconcile and balance each trust account with ledger records, the check
    register, and the bank statement at least once each month.
  - The broker must maintain a separate trust account for each individual transaction and retain
    supporting documentation.
  - The broker must file a copy of each trust account statement with the Idaho Real Estate
    Commission each quarter.
  - The broker must submit a monthly summary of trust account activity to the sponsoring broker for
    review.
key: A
explanation: The rule explicitly requires the broker to reconcile and balance each trust account
  with ledger records, the check register, and the bank statement at least monthly. Filing
  statements with the commission is not mandated by this section.
