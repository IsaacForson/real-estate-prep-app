stem: A licensee who is actively licensed in Idaho decides to buy a parcel of land for personal use
  directly from the owner. According to Idaho Code § 54-2055(2), by what deadline must the licensee
  provide the written disclosure of their active Idaho real estate license to the seller?
options:
  - Before presenting the purchase agreement
  - At the time the purchase agreement is presented
  - Within three days after signing the contract
  - At the closing of the real estate transaction
key: B
explanation: Idaho Code § 54-2055(2) requires a licensee to disclose in writing their active Idaho
  real estate license no later than at the time the purchase and sale agreement is presented to the
  other party. Therefore, the correct timing is when the agreement is presented. The other answer
  choices describe moments that are either earlier or later than this required point.
