stem: Under Idaho Code § 54-2050(3), which provision is prohibited in a buyer or seller
  representation agreement unless the agreement is completely nonexclusive and contains no financial
  obligation?
options:
  - The confidentiality clause
  - The standard escalation clause
  - The automatic renewal clause
  - The mandatory arbitration clause
key: C
explanation: The subsection forbids any clause that requires the signing party to notify the broker
  of intent to cancel after the expiration date unless the agreement is nonexclusive and has no
  financial obligation. This describes an automatic renewal clause. The arbitration clause, while
  sometimes included in contracts, is not prohibited by this provision.
citation:
  source: Idaho Code § 54-2050(3)
  url: null
  quoted_text: No buyer or seller representation agreement shall contain a provision requiring the
    party signing the agreement to notify the broker of the party’s intention to cancel the
    agreement after the definite expiration date, unless the representation agreement states that it
    is completely nonexclusive and it contains no financial obligation, fee or commission due from
    the party signing the agreement.
