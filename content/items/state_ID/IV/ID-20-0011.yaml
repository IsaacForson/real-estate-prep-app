stem: How may a brokerage agency relationship with a buyer or seller be created under Idaho law?
options:
  - In a written document signed by the buyer, seller, and brokerage
  - By an oral agreement confirmed later at the closing table by both parties
  - By a verbal understanding reached during an initial phone consultation
  - By implication from the brokerage's ongoing course of dealing over time
key: A
explanation: Idaho law states that a buyer or seller is not represented unless the buyer or seller
  and the brokerage agree to representation in a separate written document, and no agency may be
  created orally or by implication.
citation:
  source: Idaho Code § 54-2084
  url: null
  quoted_text: A buyer or seller is not represented by a brokerage in a regulated real estate
    transaction unless the buyer or seller and the brokerage agree, in a separate written document,
    to such representation. No type of agency representation may be assumed by a brokerage, buyer or
    seller or created orally or by implication.
