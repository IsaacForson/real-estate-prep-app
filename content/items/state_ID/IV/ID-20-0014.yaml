stem: A brokerage already represents a seller and now wants to also represent the buyer in the same
  transaction as a limited dual agent. What does Idaho law require before the brokerage may do this?
options:
  - A separate insurance rider naming both clients of the transaction
  - A verbal acknowledgment from each client noted in the transaction file
  - Approval from the real estate commission granted on a case-by-case basis
  - The express written consent of every client involved in the transaction
key: D
explanation: A brokerage may represent both the buyer and the seller in the same transaction only as
  a limited dual agent and only with the express written consent of all other clients involved in
  the transaction.
