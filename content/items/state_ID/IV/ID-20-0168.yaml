stem: A buyer and seller agree to change the earnest money amount in a signed purchase offer. Under
  Idaho Code § 54-2051(5), what must they do to make the change valid?
options:
  - Notify the lender of the change.
  - Have the broker sign the change.
  - Initial and date the change.
  - Submit a new purchase offer.
key: C
explanation: Idaho Code § 54-2051(5) states that all changes made to any offer to purchase or other
  real estate purchase agreement shall be initialed and dated by the parties to the transaction.
  Therefore, the buyer and seller must initial and date the change to the earnest money amount. The
  distractor suggesting the broker must sign the change is not supported by the statute, which
  places the responsibility on the parties.
