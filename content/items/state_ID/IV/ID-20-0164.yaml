stem: A sales associate receives a signed purchase offer from a buyer accompanied by an earnest
  money check. What must the sales associate do immediately upon receiving the offer under Idaho
  Code § 54-2051(2)?
options:
  - The sales associate must provide a copy of the offer to the buyer as a receipt
  - The sales associate must deposit the earnest money check into the broker’s trust account within
    24 hours
  - The sales associate must submit the offer to the seller’s attorney for review
  - The sales associate must notify the buyer’s lender of the offer receipt
key: A
explanation: Idaho Code § 54-2051(2) requires that immediately upon receiving any offer to purchase
  signed and dated by the buyer and any consideration, the broker or salesperson provide a copy of
  the offer to the buyer as a receipt. The other options describe actions not mandated by this
  subsection.
