stem: Under Idaho's brokerage representation act, what is the nature of the duties a brokerage owes
  a represented client, absent a written agreement providing for greater duties?
options:
  - Duties that are not fiduciary in nature or subject to equitable remedies
  - Duties identical to those owed under the traditional common law of agency
  - Duties that automatically expand to fiduciary status once a contract is signed
  - Duties that a court may convert into fiduciary duties at its own discretion
key: A
explanation: Unless greater duties are specifically agreed to in writing, the statute provides that
  duties owed to a represented client are not fiduciary in nature and are not subject to equitable
  remedies for breach of fiduciary duty.
citation:
  source: Idaho Code § 54-2094
  url: null
  quoted_text: the duties and obligations owed to a represented client in a regulated real estate
    transaction are not fiduciary in nature and are not subject to equitable remedies for breach of
    fiduciary duty.
