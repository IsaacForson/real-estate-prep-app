stem: A licensee has just had first substantial business contact with a prospective buyer. What must
  the licensee give the buyer at that point under Idaho law?
options:
  - A copy of the brokerage's current errors and omissions insurance policy
  - A completed comparative market analysis of comparable recent sales
  - The agency disclosure brochure that the real estate commission approved
  - A signed exclusive buyer representation agreement for the buyer to review
key: C
explanation: A licensee must give a prospective buyer or seller the agency disclosure brochure
  adopted or approved by the commission at the first substantial business contact, before any
  representation agreement is required.
