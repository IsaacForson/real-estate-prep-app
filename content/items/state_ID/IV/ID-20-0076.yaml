stem: A licensee prepares a purchase and sale agreement for a transaction where the buyer is
  represented and the seller is not. The licensee has not yet disclosed the brokerage's relationship
  to the seller. Under Idaho Code § 54-2085(3), is this permissible?
options:
  - The licensee may disclose the relationship after the purchase and sale agreement is signed.
  - The licensee must disclose the relationship no later than the preparation or presentation of the
    purchase and sale agreement.
  - The licensee may rely on the buyer's written representation agreement to satisfy the disclosure
    requirement to the seller.
  - The licensee must wait until closing to disclose the relationship to the seller.
key: B
explanation: The rule requires the brokerage to determine the relationship and disclose it to both
  parties no later than the preparation or presentation of the purchase and sale agreement.
  Disclosing after the agreement is signed violates this timing requirement. Relying on the buyer's
  representation agreement does not fulfill the duty to disclose the brokerage's relationship to the
  seller.
citation:
  source: Idaho Code § 54-2085(3)
  url: null
  quoted_text: A brokerage’s relationship with a buyer or seller as an agent, nonagent, limited dual
    agent, or limited dual agent with assigned agents must be determined and all necessary
    agreements executed no later than the preparation of a purchase and sale agreement. A brokerage
    must disclose its relationship to both buyer and seller in any transaction no later than the
    preparation or presentation of a purchase and sale agreement.
