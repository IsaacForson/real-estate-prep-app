stem: According to Idaho Code § 54-2088(3), what specific language must be included in the express
  written consent to limited dual agency?
options:
  - A statement that the brokerage will advocate for the client who presents the highest purchase
    offer, even if that conflicts with the other client's interests
  - The consent to limited dual representation and assigned agency disclosure beginning with
    "CONSENT TO LIMITED DUAL REPRESENTATION AND ASSIGNED AGENCY"
  - A promise that the brokerage will disclose all confidential information obtained from either
    party to the other party, ensuring full transparency
  - An agreement that the designated broker will act as an exclusive agent for the seller,
    representing only the seller's interests in the transaction
key: B
explanation: The statute requires the consent to contain the specific language set forth in
  subsection (3), beginning with the heading "CONSENT TO LIMITED DUAL REPRESENTATION AND ASSIGNED
  AGENCY" and including the acknowledgments about the agency disclosure brochure and limited dual
  agent duties. The option stating that the brokerage will advocate for the client with the highest
  offer is incorrect because a limited dual agent may not advocate for one client over another. The
  option promising that the brokerage will disclose all confidential information to both parties is
  incorrect because a limited dual agent must keep confidential information confidential unless
  disclosure is authorized. The option stating that the designated broker will act as an exclusive
  agent for the seller is incorrect because limited dual agency involves representing both parties,
  not exclusive representation.
