stem: A brokerage has entered into a written representation agreement with a seller client. Which
  obligation does the brokerage now owe that seller beyond the nonagent customer duties?
options:
  - Personally financing part of the buyer's earnest money if requested
  - Promoting the client's best interests in good faith and fair dealing
  - Waiving the brokerage's right to any commission on the transaction
  - Guaranteeing that the sale will close within sixty days of listing it
key: B
explanation: Once a written contract for representation exists, the brokerage owes the client a duty
  to promote the client's best interests in good faith, honesty, and fair dealing, beyond the
  ministerial duties owed to customers.
