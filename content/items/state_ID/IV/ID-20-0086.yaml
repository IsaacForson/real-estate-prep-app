stem: A sales associate receives a signed purchase offer from a buyer on Tuesday morning. Under
  Idaho Code § 54-2051(3), by what time must the sales associate provide a true and legible copy of
  the offer to the designated broker or broker’s office?
options:
  - The sales associate must provide the copy by the end of the same business day.
  - The sales associate must provide the copy by the end of the next business day.
  - The sales associate must provide the copy within 24 hours of receipt.
  - The sales associate must provide the copy by the close of business on the day of receipt.
key: B
explanation: The rule requires that a sales associate provide a true and legible copy of any
  document signed by a buyer or seller to the designated broker or broker’s office prior to the end
  of the next business day. Therefore, the copy must be delivered by the end of the next business
  day. The distractor suggesting the same business day is incorrect because the statute explicitly
  allows until the end of the following business day.
