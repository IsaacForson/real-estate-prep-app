stem: "According to Idaho Code § 54-2089, a written agreement that only provides for payment of
  compensation to a brokerage:"
options:
  - It simply creates an agency relationship between the brokerage and the client.
  - It actually constitutes an agreement for agency representation.
  - It does not constitute an agreement for agency representation or create an agency relationship.
  - It indeed requires the brokerage to disclose any dual agency arrangement.
key: C
explanation: Under Idaho Code § 54-2089, a written agreement solely for payment of compensation does
  not create an agency relationship or constitute an agreement for agency representation. Therefore
  the statement that it does not constitute an agreement for agency representation or create an
  agency relationship is correct. The other statements are incorrect because the statute says such
  an agreement does not create an agency relationship or constitute an agreement for agency
  representation.
