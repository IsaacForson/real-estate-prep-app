stem: Under Idaho Code § 54-2089, what is the legal effect of a written agreement that provides only
  for payment of compensation to a brokerage?
options:
  - It creates an agency relationship between the client and the brokerage.
  - It does not constitute an agreement for agency representation.
  - It requires the brokerage to disclose all known material facts.
  - It must be notarized and recorded with the county recorder.
key: B
explanation: Idaho Code § 54-2089 states that payment of compensation or a written agreement only
  for payment of compensation to a brokerage shall not constitute an agreement for agency
  representation or otherwise create an agency relationship. Therefore, such an agreement does not
  create an agency relationship. The distractor claiming it creates an agency relationship
  contradicts the statute.
