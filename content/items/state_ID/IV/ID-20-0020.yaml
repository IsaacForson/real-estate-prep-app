stem: A listing broker receives a second written offer on a property just days before the scheduled
  closing of an already-accepted first offer. What must the broker do with the second offer?
options:
  - Discard it automatically because an earlier offer has already been accepted
  - Tender it to the seller promptly, since closing has not yet occurred
  - Hold it until the first pending transaction either closes or falls through
  - Return it to the second buyer unopened along with the earnest money
key: B
explanation: A broker or sales associate must, as promptly as practicable, tender to the seller
  every written offer to purchase obtained on the property, up until the time of closing, regardless
  of an earlier accepted offer.
