stem: A client's written representation agreement with a brokerage has just terminated. Absent any
  other written agreement, which duties does the brokerage continue to owe that former client?
options:
  - Continuing to negotiate on the former client's behalf indefinitely
  - Providing free market updates for as long as the client owns the home
  - Representing the former client automatically in any future transaction
  - Accounting for moneys and property received during the representation
key: D
explanation: After termination of representation, a brokerage owes no further duty except accounting
  for all moneys and property received during the representation and maintaining the confidentiality
  of confidential client information.
