stem: Under Idaho Code § 54-2088(4)(a), which of the following pieces of information may a limited
  dual agent **NOT** disclose without the express written consent of the client to whom the
  information pertains?
options:
  - The buyer's willingness to pay more than the listing price
  - The name of the buyer's mortgage lending institution
  - The property's street address, city, and zip code
  - The listed price of the property as advertised
key: A
explanation: The statute prohibits a limited dual agent from disclosing that a buyer is willing to
  pay more than the listing price without the client's express written consent (Idaho Code §
  54-2088(4)(a)(i)). The property's street address, city, and zip code is not listed as prohibited
  information under that subsection, so it may be disclosed without consent.
