stem: A licensee is required by the commission to complete a specific course as part of a
  disciplinary action. After completing the course, they attempt to claim the classroom hours toward
  their continuing education requirement for license renewal. Can they receive continuing education
  credit for this commission‑ordered education?
options:
  - The licensee may receive continuing education credit only if the course is unrelated to the
    violation.
  - The licensee may not receive continuing education credit for commission‑ordered education.
  - The licensee may receive continuing education credit after paying a fee to the commission.
  - The licensee may receive continuing education credit for commission‑ordered education if the
    course is approved.
key: B
explanation: Idaho Code § 54-2023(5) provides that no licensee shall obtain continuing education
  credit for education ordered by the commission as part of a disciplinary action. Therefore, the
  licensee cannot claim those hours for renewal. The statement that the licensee may receive
  continuing education credit only if the course is unrelated to the violation is incorrect because
  the statute bars credit regardless of whether the course is approved.
