stem: A licensee places their broker license on inactive status and later applies to reactivate it
  after the initial licensing period. During the inactive period, the licensee completes six (6)
  classroom hours of continuing education. According to Idaho Code § 54-2023(2), can those six hours
  be applied toward the continuing education requirement for the next renewal?
options:
  - No, the six hours are considered 'spent' and cannot be reused for renewal.
  - Yes, the six hours can be applied toward the continuing education requirement for the next
    renewal.
  - Yes, but only if the licensee also completes the two required commission core courses.
  - No, unless the six hours were earned within the same license period as the renewal.
key: A
explanation: Idaho Code § 54-2023(2) provides that continuing‑education credit hours used to
  reactivate an inactive license are treated as ‘spent’ and may not be applied toward the
  continuing‑education requirements for any subsequent renewal. Because the six classroom hours were
  used for reactivation, they cannot be counted again for the next renewal. Any answer suggesting
  the hours can be reused or that additional conditions affect their use is contrary to the statute.
