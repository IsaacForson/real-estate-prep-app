stem: An out-of-state broker who holds an active license in good standing in another state wishes to
  obtain a certificate of waiver of the national portion of the Idaho real estate exam. According to
  Idaho Code § 54-2015(2), what must the broker's written request include?
options:
  - Provide mailing address
  - Provide insurance proof
  - Provide license copy
  - Provide consent statement
key: A
explanation: The statute requires the waiver request to indicate the individual’s mailing address to
  which the commission will deliver the certificate of waiver. Thus, providing the mailing address
  is correct. Providing insurance proof, a license copy, or a consent statement relates to other
  licensing requirements but is not part of the waiver request under this provision.
