  url: null
  quoted_text: The commission may issue a nontransferable cooperative license to any out-of-state
    broker. The cooperative license shall authorize the out-of-state broker to work in cooperation
    with an actively licensed Idaho real estate designated broker for the purpose of one (1) Idaho
    commercial real estate transaction.
