stem: According to Idaho Code § 54-2011(2), what type of license may the Idaho Real Estate
  Commission issue to an out-of-state broker who wishes to cooperate with an Idaho designated broker
  on a single Idaho commercial real estate transaction?
options:
  - A nontransferable cooperative license
  - A temporary salesperson license
  - A limited broker license
  - A provisional license
key: A
explanation: Subsection (2) of § 54-2011 authorizes the commission to issue a nontransferable
  cooperative license to an out-of-state broker for cooperation with an actively licensed Idaho
  designated broker on one Idaho commercial real estate transaction. The other license types are not
  described for this purpose in the cited subsection.
