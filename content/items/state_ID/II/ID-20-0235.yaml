stem: What is the maximum annual premium that the Idaho Real Estate Commission may set for errors
  and omissions insurance coverage under Idaho Code § 54-2013?
options:
  - $250 per year.
  - $100 per year.
  - $200 per year.
  - $150 per year.
key: A
explanation: The statute states that if the commission cannot obtain coverage at a premium not to
  exceed $250 per year per licensee, the insurance requirement is void, establishing $250 as the
  maximum allowable premium. The $100, $150, and $200 figures are below this statutory ceiling and
  therefore incorrect.
