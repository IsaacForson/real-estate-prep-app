stem: When a broker closes a branch office, what must the broker provide to the commission according
  to Idaho Code § 54-2056(4)?
options:
  - A fee of $50 for the branch license cancellation and handling
  - A copy of the branch office's trust account records and documents
  - Written notice of branch closure advising of licensees' new status
  - A list of all active listings and pending contracts under management
key: C
explanation: The statute mandates that immediately upon closing a branch office, the broker must
  provide the commission written notice of the closure advising of the new status of all licensees
  licensed with the closed branch. This notice informs the commission of the status change for
  affected licensees. The other options describe actions not required by this provision.
