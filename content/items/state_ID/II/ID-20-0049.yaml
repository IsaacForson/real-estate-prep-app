stem: What is the definition of an “active license” under Idaho Code § 54‑2004?
options:
  - The status of a real estate license that is suspended pending a commission hearing
  - The status of a real estate license that has been inactivated but not expired or terminated
  - The status of a real estate license that has not been inactivated, expired, terminated,
