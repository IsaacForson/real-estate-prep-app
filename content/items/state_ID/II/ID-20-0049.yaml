  - The status of a real estate license that is expired but may be renewed within thirty days
key: C
explanation: Idaho Code § 54‑2004(3) defines an active license as a license that has not been
  inactivated, expired, terminated, suspended, or revoked. A license described as having been
  inactivated does not satisfy this definition because the statute requires the license to be free
  of any inactivation, expiration, termination, suspension, or revocation.
