stem: An Idaho limited liability company acts as a real estate broker without a license and is
  convicted. According to Idaho Code § 54-2065, what is the maximum criminal fine that may be
  imposed on the company?
options:
  - $7,500
  - $20,000
  - $5,000
  - $10,000
key: D
explanation: The statute provides that a limited liability company or corporation convicted of
  acting without a license shall be fined not to exceed ten thousand dollars ($10,000). Thus the
  maximum criminal fine for the company is $10,000. The $5,000 option is incorrect because that
  amount applies only to natural persons, not to business entities under this provision.
