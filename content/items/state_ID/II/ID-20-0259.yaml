stem: A maintenance worker employed by an apartment complex owner is tasked with purchasing a vacant
  lot adjacent to the complex for the owner’s expansion plans. The worker acts within the scope of
  employment and receives no separate compensation for the transaction. Under Idaho Code §
  54-2003(1)(b), is the worker required to hold an Idaho real estate license to complete the
  purchase?
options:
  - No, because any real estate transaction requires a license
  - No, because the worker is an employee acting within scope of employment
  - No, unless the worker also holds an active Idaho license
  - No, only if the worker receives a commission for the transaction
key: B
explanation: Subsection (1)(b) exempts acquisition of real property by a regular employee of the
  owner when acting within the scope of employment. Since the worker is purchasing the lot for the
  owner and acting within scope, no license is required. The claim that any real estate transaction
  requires a license ignores this statutory exception.
