stem: A corporation is found guilty of acting as a real estate broker without a license in Idaho.
  Under Idaho Code § 54-2065, what is the maximum civil penalty that may be assessed against the
  corporation?
options:
  - $12,000
  - $8,000
  - $15,000
  - $10,000
key: D
explanation: The law allows the court to assess a civil penalty against a limited liability company
  or corporation in an amount not to exceed ten thousand dollars ($10,000). Hence the maximum civil
  penalty for the corporation is $10,000. The $5,000 distractor is wrong because that limit applies
  to natural persons, not to corporations, as specified in the same subsection.
