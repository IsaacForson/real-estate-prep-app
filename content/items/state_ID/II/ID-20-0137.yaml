stem: A licensee changes their personal telephone number. According to Idaho Code § 54-2018(9),
  within how many business days must the licensee provide written notice to the commission?
options:
  - Ten (10) business days
  - Five (5) business days
  - Seven (7) business days
  - Fifteen (15) business days
key: A
explanation: The rule requires that notice of any change in personal name, address of personal
  residence, or personal telephone number be given within ten (10) business days of the change.
  Therefore, the correct period is ten business days. The other options represent incorrect
  timeframes not supported by the statute.
citation:
  source: Idaho Code § 54-2018(9)
  url: null
  quoted_text: An individual licensee, whether active or inactive, shall provide written notice to the
    commission, in the form and manner approved by the commission, of any change of his personal
    name, address of personal residence or personal telephone number. Notice shall be provided
    within ten (10) business days of the change.
