stem: An individual who is currently and actively licensed as a real estate salesperson in State X,
  which has a written reciprocity agreement with Idaho, applies for a primary Idaho salesperson
  license. According to Idaho Code § 54-2015(1), what must the applicant provide to satisfy the
  licensing requirements?
options:
  - The applicant must also complete a commission-approved business conduct and office operations
    course
  - The applicant must provide a current, certified license history from State X showing any
    disciplinary action
  - The applicant must be applying for a designated broker or branch office manager license
  - The applicant must pass the Idaho state portion of the real estate salesperson exam
key: B
explanation: Idaho Code § 54-2015(1) requires an out‑of‑state applicant for a primary Idaho
  salesperson license to furnish a current, certified license history from the other state that
  indicates any disciplinary action taken against the license and the license’s status and standing
  in that state.
citation:
