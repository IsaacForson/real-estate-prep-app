stem: An actively licensed Idaho real estate associate broker lists a mobile home for a friend and
  receives a commission for the service. Under Idaho Code § 54-2003, what is the associate broker's
  obligation?
options:
  - The licensee is exempt from licensing requirements because mobile homes are considered personal
    property
  - The licensee may proceed without any additional requirements if the transaction does not involve
    real property
  - The licensee must still comply with licensing requirements because the statute applies
    regardless of any exemption
  - The licensee must obtain a separate mobile home brokerage endorsement before proceeding
key: C
explanation: Idaho Code § 54-2003(3) requires an active licensee who, while acting on behalf of
  another, for compensation or a promise of compensation, sells, lists, buys or negotiates, or
  offers to sell, list, buy or negotiate, a mobile home, manufactured home or floating home to
  comply with this chapter, even if the activity would not otherwise require a license. Therefore,
  the associate broker must follow all licensing requirements. The statement that mobile homes are
  personal property and thus exempt does not relieve an active licensee of this duty.
citation:
  source: Idaho Code § 54-2003(3)
  url: null
  quoted_text: An active licensee who, while acting on behalf of another, for compensation or for a
    promise or expectation of compensation, sells, lists, buys or negotiates, or offers to sell,
    list, buy or negotiate, the purchase or sale of a mobile home, manufactured home or floating
    home as defined by Idaho law, shall comply with this chapter regardless of whether such activity
    would otherwise require an Idaho real estate license.
