stem: Under Idaho Code § 54-2004, what is the definition of “business opportunity”?
options:
  - An established business, goodwill of an established business, or any interest therein, other
    than a lease, or any one (1) or combination thereof, where a sale or transfer of real property
    is involved in the transaction.
  - An established business, goodwill of an established business, or any interest therein, other
    than a lease, or any one (1) or combination thereof, where a sale or transfer of personal
    property is involved in the transaction.
  - An established business, goodwill of an established business, or any interest therein, including
    a lease, or any one (1) or combination thereof, where a sale or transfer of real property is
    involved in the transaction.
  - An established business, goodwill of an established business, or any interest therein, other
    than a lease, or any one (1) or combination thereof, where a sale or transfer of real property
    is not involved in the transaction.
key: A
explanation: The definition is taken verbatim from Idaho Code § 54-2004(12), which states that a
  business opportunity includes an established business, its goodwill, or any interest therein
  (excluding a lease) when a sale or transfer of real property is involved. The distractor that
  substitutes “personal property” for “real property” is incorrect because the definition
  specifically ties the concept to real property transactions.
citation:
