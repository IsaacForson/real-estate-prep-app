stem: An applicant submits fingerprints for the required national criminal history check, but the
  commission returns the fingerprints as illegible. What must the applicant do next according to
  Idaho Code § 54-2012?
options:
  - The applicant must submit a new fingerprint card and file the new fingerprints with the
    commission.
  - The applicant must provide a written waiver request to the commission and await further
    instructions.
  - The applicant must retake the prelicense education course and submit proof of completion.
  - The applicant must pay an additional exam fee and provide a receipt to the commission.
key: A
explanation: The correct answer is A because § 54-2012(1)(j) directs that if fingerprints are
  returned as illegible, the applicant must be fingerprinted again and submit the new prints. The
  distractor suggesting a written waiver request is wrong; the statute provides no waiver option for
  illegible fingerprints.
