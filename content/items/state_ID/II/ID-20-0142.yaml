stem: A sales associate decides to terminate their association with a broker. According to Idaho
  Code § 54-2056(1), within how many business days after the effective date must the sales associate
  provide written notice to the broker?
options:
  - 7 business days
  - 3 business days
  - 1 business day
  - 5 business days
key: B
explanation: The statute requires the sales associate to provide written notice no later than three
  (3) business days after the effective date. One day is insufficient; five or seven days exceed the
  limit.
citation:
  source: Idaho Code § 54-2056(1)
  url: null
  quoted_text: A sales associate who terminates his licensed association with a broker shall provide
    the broker written notice of the termination no later than three (3) business days after the
    effective date.
