stem: An out-of-state broker wants to cooperate with an Idaho broker on a commercial real estate
  transaction. According to Idaho Code § 54-2017(1), which of the following must be included in the
  application for a cooperative license?
options:
  - The applicant must also complete a commission-approved business conduct and office operations
    course within the past three years
  - The applicant must provide the name, license number, physical address and verified statement of
    consent and signature of the Idaho broker with whom cooperation is sought
  - The applicant must obtain a surety bond in the amount of fifty thousand dollars payable to the
    Idaho Real Estate Commission
  - The applicant must submit a copy of the out-of-state broker’s federal tax return for the
    previous year
key: B
explanation: Idaho Code § 54‑2017(1)(c) requires that a cooperative‑license application contain the
  name, license number, physical address, and a verified statement of consent signed by the Idaho
  broker with whom the out‑of‑state broker intends to cooperate. That requirement makes the
  statement about providing those details and the broker’s consent the only correct choice. A
  requirement to complete a business‑conduct course applies only to designated brokers under
  § 54‑2016, not to cooperative‑license applicants. No surety‑bond requirement is listed in the
  cooperative‑license provisions. Submitting a federal tax return is not a statutory requirement for
  a cooperative license.
