stem: A licensee writes a check for a license renewal fee that is returned for insufficient funds.
  According to Idaho Code § 54-2020(5), what determines the amount of the fee the commission may
  assess for the insufficient funds check?
options:
  - The commission may set any amount up to twenty-five dollars
  - The fee equals the original license renewal fee
  - The amount allowed by law for insufficient funds checks
  - The fee is waived if the licensee pays within ten days
key: C
explanation: Subsection (5) of § 54-2020 provides that the fee for insufficient funds checks is ‘the
  amount allowed by law for insufficient funds checks or other types of insufficient payment.’ Thus
  the fee is based on the applicable law, not a commission‑set limit. The option suggesting the
  commission may set any amount up to $25 is not supported by the statute.
