stem: Two Idaho-licensed brokers agree to jointly list and sell a commercial property, each
  representing different parties. According to Idaho Code § 54-2004(18), how is this transaction
  classified?
options:
  - A cooperative sale
  - A double contract
  - A broker price opinion
  - A regulated transaction
key: A
explanation: Under Idaho Code § 54-2004(18), a cooperative sale is defined as a transaction
  involving two or more brokers. The scenario describes two brokers working together to list and
  sell a property, each representing different parties, which matches that definition. A double
  contract is not a term defined in the statute for this situation. A broker price opinion refers to
  an estimate of a property's value, not a joint listing arrangement. A regulated transaction is too
  general; while the activity is regulated, the specific term for two brokers cooperating is
  'cooperative sale'.
