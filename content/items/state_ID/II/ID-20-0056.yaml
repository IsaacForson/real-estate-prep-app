stem: An applicant has completed 80 classroom hours of real estate education in another state and
  wants to obtain an Idaho salesperson license. Assuming the commission does **NOT** grant a waiver,
  how many additional classroom hours must the applicant complete to meet the prelicense education
  requirement?
options:
  - 90 classroom hours
  - 100 classroom hours
  - 10 classroom hours
  - 20 classroom hours
key: C
explanation: Under Idaho Code § 54-2022(1)(a), a salesperson license requires a total of ninety (90)
  classroom hours. Subtracting the eighty hours already completed leaves ten additional hours
  needed. The distractor suggesting ninety additional hours incorrectly assumes the applicant needs
  another full requirement rather than the difference.
