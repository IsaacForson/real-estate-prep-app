stem: Under Idaho Code § 54-2015(2), what may an individual who holds an active license in good
  standing in another state or jurisdiction obtain upon written request to the Idaho Real Estate
  Commission?
options:
  - A certificate of waiver of the national portion of the exam required for Idaho licensure
  - A temporary Idaho salesperson license valid for ninety days, issued after passing the state exam
  - Exemption from the state portion of the licensing exam, which is not granted under this provision
  - Automatic issuance of an Idaho broker license upon verification of an out-of-state license
key: A
explanation: Idaho Code § 54-2015(2) allows an actively licensed out-of-state applicant to request
  and receive a certificate that waives the national portion of the Idaho licensing exam. This
  corresponds to the option describing a certificate of waiver of the national portion of the exam
  required for Idaho licensure. The other options are incorrect because the statute does not provide
  automatic broker licensure, a temporary salesperson license, or an exemption from the state
  portion of the exam.
