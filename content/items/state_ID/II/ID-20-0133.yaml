stem: A sole proprietor seeking an Idaho real estate license must, according to Idaho Code
  § 54‑2016(2)(c), have completed what within three years prior to applying for the license?
options:
  - Complete a commission‑approved federal fair housing and anti‑discrimination course
  - Complete a commission‑approved property management and leasing course
  - Complete a commission-approved business conduct and office operations course
  - Complete a commission‑approved prelicense education and exam preparation course
key: C
explanation: Idaho Code § 54‑2016(2)(c) requires the designated broker of a sole‑proprietor
  applicant to have satisfactorily completed a commission‑approved business conduct and office
  operations course within three years before the license application. Consequently, the choice that
  describes completing a commission‑approved business conduct and office operations course satisfies
  the statutory requirement. The other choices describe courses on fair housing, property
  management, or exam preparation, which do not meet this specific condition.
