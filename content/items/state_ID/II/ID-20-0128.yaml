  url: null
  quoted_text: Each licensee applying to renew an Idaho broker or salesperson license on active
    status, and each Idaho broker or salesperson applying to change from inactive to active license
    status after having renewed the license on inactive status, shall successfully complete two (2)
    commission core courses, plus twelve (12) classroom hours of continuing education credit.
