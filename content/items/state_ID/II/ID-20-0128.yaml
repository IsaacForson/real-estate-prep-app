stem: How many classroom hours of continuing education credit must a licensee complete each renewal
  period to renew an active Idaho broker or salesperson license, according to Idaho Code § 54-2023?
options:
  - The licensee must complete six (6) classroom hours of continuing education credit.
  - The licensee must complete eighteen (18) classroom hours of continuing education credit.
  - The licensee must complete twelve (12) classroom hours of continuing education credit.
  - The licensee must complete twenty-four (24) classroom hours of continuing education credit.
key: C
explanation: Under Idaho Code § 54-2023(1), each licensee renewing an active broker or salesperson
  license must complete two commission core courses plus twelve classroom hours of continuing
  education credit. Therefore, twelve hours is the required amount. The six‑hour option confuses the
  requirement with the number of core courses, while the eighteen‑ and twenty‑four‑hour options add
  extra hours not mandated by the statute.
citation:
