stem: An applicant takes the Idaho real estate licensing exam but does not achieve a passing score.
  According to Idaho Code § 54-2014, what must the applicant do to retake the exam?
options:
  - Waiting six months and paying a re-exam fee
  - Submitting a new application and paying exam fee
  - Retaking the national portion and paying the fee
  - Requesting a waiver and paying the exam fee
key: B
explanation: If an applicant fails to pass the exam, they may register for another attempt and must
  submit a new exam fee. The statute does not require a waiting period or allow retaking only one
  portion without a new fee. Thus, submitting a new application and paying the fee is the required
  action.
