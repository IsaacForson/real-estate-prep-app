stem: An applicant knowingly misrepresents their years of experience on the license application.
  According to Idaho Code § 54-2019(1)(b), what action may the Idaho Real Estate Commission take?
options:
  - Require education for applicant
  - Impose a monetary fine only
  - Issue a provisional license
  - Deny the license application
key: D
explanation: The statute lists fraud, deception, misrepresentation, or similar unlawful means in the
  application as grounds for denial. Therefore, the commission may deny the application. The
  distractor suggesting the applicant must complete education is not authorized by this provision.
