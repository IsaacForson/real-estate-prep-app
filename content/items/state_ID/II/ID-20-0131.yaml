stem: Under Idaho Code § 54-2016(1)(d), how many business days does a business entity have to
  designate another qualified individual as designated broker after the current designated broker's
  license becomes inactive?
options:
  - "Number of business days: 5"
  - "Number of business days: 10"
  - "Number of business days: 15"
  - "Number of business days: 20"
key: B
explanation: The rule states that if the designated broker’s license is refused, revoked, suspended,
  made inactive, surrendered, or the broker ceases to be connected, the business entity has ten (10)
  business days to designate another qualified broker before the entity’s license is terminated.
  Therefore, ten business days is correct. The distractor “Five (5) business days” understates the
  time allowed, while “Fifteen (15) business days” and “Twenty (20) business days” exceed the period
  specified in the statute.
