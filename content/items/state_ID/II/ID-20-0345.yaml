stem: A licensee receives a request from the Idaho Real Estate Commission for proof of errors and
  omissions insurance coverage. If the licensee fails to provide the required certificate within the
  time specified by statute, what action may the commission take?
options:
  - Imposing a financial penalty on the licensee
  - Inactivating the license until proof is provided
  - Automatically renewing the license with a surcharge
  - Requiring additional continuing education
key: B
explanation: Failure to produce the certificate of coverage within thirty days of a request may
  result in license inactivation. The statute does not authorize a fine or automatic renewal as the
  remedy for this specific failure. Therefore, inactivating the license until proof is provided is
  the correct action.
citation:
  source: Idaho Code § 54-2013(6)
  url: null
  quoted_text: A licensee failing to produce a certificate of coverage within thirty (30) days of a
    request to do so may have his license inactivated by the commission and shall not be entitled to
    reactivate the license unless and until he provides to the commission a certificate of coverage
    reflecting proof of insurance meeting the requirements of the commission.
