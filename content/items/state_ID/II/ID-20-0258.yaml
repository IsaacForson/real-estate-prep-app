stem: According to Idaho Code § 54-2003(1)(a), which activity is exempt from the requirement to hold
  an Idaho real estate license?
options:
  - Leasing a commercial building on behalf of a client
  - Buying a parcel of land for personal use
  - Purchasing a rental property for investment
  - Selling a friend's house for a commission
key: B
explanation: The exemption in subsection (1)(a) applies to the purchase, option, exchange or sale of
  any interest in real property or business opportunity for a person’s own account or use. Buying a
  parcel of land for personal use fits this description, so no license is required. Purchasing a
  rental property for investment is not for personal use, thus the exemption does not apply and a
  license would be needed.
