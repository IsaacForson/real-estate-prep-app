stem: Under Idaho Code § 54-2036(2)(b), what is the minimum classroom hour requirement for a
  continuing education course to be certified?
options:
  - At least one (1) classroom hour
  - At least two (2) classroom hours
  - At least three (3) classroom hours
  - At least four (4) classroom hours
key: A
explanation: The statute explicitly states that each continuing education course must contain at
  least one (1) classroom hour. Therefore, the minimum requirement is one hour. The answer choice
  that says at least two (2) classroom hours is incorrect because it raises the minimum beyond what
  the statute requires. Likewise, the choices stating at least three (3) or four (4) classroom hours
  exceed the statutory minimum.
