stem: Under the Michigan Occupational Code, which of the following best describes a 'control person'?
options:
  - An individual who is a sole proprietor, partner, officer, director, shareholder, member,
    manager, or holds a responsible position in a business entity
  - An individual who holds a real estate broker license and supervises associate brokers within a
    brokerage firm
  - An individual who completes a prelicensure classroom course of at least 20 clock hours to
    satisfy state licensing requirements
  - An individual who works as a real estate salesperson under an independent contractor agreement
    while affiliated with a brokerage
key: A
explanation: The definition of 'control person' in MCL 339.2501(e) includes sole proprietors,
  partners, officers, directors, shareholders, members, managers, or anyone holding a responsible
  position in a business entity. The option describing an individual who is a sole proprietor,
  partner, officer, director, shareholder, member, manager, or holds a responsible position in a
  business entity matches this definition. The options describing an individual who holds a real
  estate broker license and supervises associate brokers within a brokerage firm, an individual who
  completes a prelicensure classroom course of at least 20 clock hours to satisfy state licensing
  requirements, and an individual who works as a real estate salesperson under an independent
  contractor agreement while affiliated with a brokerage do not match the statutory definition.
citation:
  source: Mich. Comp. Laws § 339.2501(e)
  url: null
  quoted_text: '"Control person" means an individual who is a sole proprietor, is a partner in a
    partnership or limited partnership, is an officer, director, or shareholder in a corporation, is
    a member or manager in a limited liability company, or holds a responsible position in any other
    form of business entity authorized under the laws of this state or the state in which the entity
    is organized or formed.'
