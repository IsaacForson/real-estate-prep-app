stem: Under the Michigan Occupational Code, what does the term 'reinstatement' mean?
options:
  - It means the granting of a license to a person whose license has lapsed for failure to renew
    within 60 days after the expiration date.
  - It means the granting of a license or registration, with or without limitations or conditions,
    to a person whose license or registration has been revoked.
  - It means the granting of a registration to a person whose registration has lapsed for failure to
    renew within 60 days after the expiration date.
  - It means the granting of approval or recognition of a continuing education program required by
    an article.
key: B
explanation: The definition of reinstatement in MCL 339.402(b) states that reinstatement is the
  granting of a license or registration, with or without limitations or conditions, to a person
  whose license or registration has been revoked. A statement that describes granting a license
  after a 60‑day lapse refers to relicensure, which is a different process. Thus the choice that
  matches the statutory definition is the correct answer.
