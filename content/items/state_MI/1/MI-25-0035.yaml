stem: Under MCL 339.514(2), if the board does **NOT** determine the appropriate penalty within the
  time limit, who may determine the appropriate penalty and issue a final order?
options:
  - May be the director
  - May be the broker
  - May be the examiner
  - May be the complainant
key: A
explanation: When the board fails to act within the prescribed 60‑day period, the director may step
  in to determine the penalty and issue a final order for occupations regulated under articles 8 to
  25. The examiner only prepares the hearing report and does not have authority to set penalties.
