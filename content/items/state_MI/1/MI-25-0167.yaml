math:
  worked_solution: "Required commission percentage: 75%. Actual commission percentage: 60%. Since 60%
    < 75%, the second condition is not met."
  formulas:
    - "Threshold comparison: required commission percentage ≥ 75%; actual commission percentage =
      60%; result = actual < required"
