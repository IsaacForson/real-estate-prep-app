stem: A consumer files a complaint against a licensed real estate salesperson. According to the
  Michigan Occupational Code, which person may the department designate to investigate the
  complaint?
options:
  - A person appointed by the department director regardless of qualifications
  - A licensed real estate broker who supervised the salesperson and is available for interview
  - A person meeting licensure qualifications for an occupation regulated under article 7, 20, or 22
  - Any department employee who has received a complaint and is assigned to the case
key: C
explanation: The statute limits investigators to those who meet the licensure qualifications for an
  occupation regulated under article 7, 20, or 22. This matches the correct option. The distractor
  suggesting any department employee ignores the qualification restriction.
