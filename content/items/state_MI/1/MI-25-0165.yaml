stem: Under MCL 339.2501, what does the term “Control person” mean?
options:
  - An individual who is a sole proprietor, is a partner in a partnership or limited partnership, is
    an officer, director, or shareholder in a corporation, is a member or manager in a limited
    liability company, or holds a responsible position in any other form of business entity
    authorized under the laws of this state or the state in which the entity is organized or formed
  - An individual who holds a real estate broker license, employs at least one salesperson, is
    responsible for supervising all licensed activities conducted under the broker’s
    license—including property management and sales—must also maintain a separate trust account,
    file annual financial statements, and obtain continuing education credits, none of which define
    a control person
  - An individual who provides property management services for a fee, maintains a separate trust
    account for client funds, must renew the license every two years to continue practicing, must
    also be a licensed real estate broker and may act as an escrow agent, but these duties are
    unrelated to the statutory definition of a control person
  - An individual who is employed by a real estate broker to provide brokerage services as an
    independent contractor, receives compensation primarily through a salary or hourly wage, does
    not hold any ownership interest in the brokerage firm, does not have decision‑making authority
    over the broker’s business, is not listed on any corporate or partnership filings, and is not a
    member or manager of any LLC
key: A
explanation: The statutory definition in MCL 339.2501(e) describes a control person as an individual
  who is a sole proprietor, a partner in a partnership or limited partnership, an officer, director,
  or shareholder in a corporation, a member or manager in a limited liability company, or who holds
  a responsible position in any other business entity authorized under the laws of this state or the
  state where the entity is organized. The other answer choices describe an independent‑contractor
  relationship, the supervisory duties of a broker, and property‑management licensing requirements,
  none of which match the definition of a control person.
