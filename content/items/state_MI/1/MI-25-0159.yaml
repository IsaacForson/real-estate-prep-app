stem: Under MCL 339.207(3), within how many days must the department process a request for licensure
  or approval of a school, institution, or other person offering training or education after
  submission of a completed application?
options:
  - 30 days
  - 90 days
  - 120 days
  - 60 days
key: B
explanation: The statute requires the department to process a request under subsection (1) within 90
  days after the submission of the completed application. This 90‑day period includes the time
  allowed for board recommendation. Therefore, the correct answer is 90 days. The 60‑day option
  confuses this processing deadline with the 60‑day period a board has to approve a limitation on an
  initial license.
