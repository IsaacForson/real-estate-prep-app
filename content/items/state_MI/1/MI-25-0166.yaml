stem: A real estate salesperson applicant is scheduled to take the state licensing examination.
  Under MCL 339.206(2), which action is permitted regarding the administration, scoring, and
  monitoring of the examination?
options:
  - The applicant may delegate any or all of those duties to a board or any other person.
  - The department may not delegate any of those duties to any other person.
  - The department may delegate any or all of those duties to a board or any other person.
  - The board may delegate any or all of those duties to the department or any other person.
key: C
explanation: Under MCL 339.206(2), the department is responsible for administering, scoring, and
  monitoring the licensing examination, but it may delegate any or all of those duties to a board or
  any other person. Therefore, the statement that the department may delegate any or all of those
  duties to a board or any other person is correct. The statement that the applicant may delegate
  those duties is incorrect because the statute gives that authority only to the department, not to
  applicants. The statement that the department may not delegate any duties is incorrect because the
  statute explicitly allows delegation. The statement that the board may delegate those duties is
  incorrect because the statute does not grant the board authority to delegate administration,
  scoring, or monitoring.
