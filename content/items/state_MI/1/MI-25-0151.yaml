stem: According to MCL 339.2501, what does the term 'Associate broker' mean?
options:
  - An individual who meets the requirements for licensure as a real estate broker under this
    article and who is licensed as a real estate salesperson under section 2505 to provide real
    estate brokerage services as an employee or independent contractor of a real estate broker
  - An individual who meets the requirements for licensure as a real estate broker under this
    article and who is licensed as an associate real estate broker under section 2505 to provide
    property management services as an employee or independent contractor of a real estate broker
  - An individual who meets the requirements for licensure as a real estate broker under this
    article and who is licensed as an associate real estate broker under section 2505 to provide
    real estate brokerage services as an employee or independent contractor of a real estate broker
  - An individual who meets the requirements for licensure as a real estate salesperson under this
    article and who is licensed as an associate real estate broker under section 2505 to provide
    real estate brokerage services as an employee or independent contractor of a real estate broker
key: C
explanation: MCL 339.2501 defines an associate broker as an individual who meets the requirements
  for licensure as a real estate broker under this article and who is licensed as an associate real
  estate broker under section 2505 to provide real estate brokerage services as an employee or
  independent contractor of a real estate broker. The option stating that the individual meets the
  requirements for licensure as a real estate salesperson does not match this definition.
