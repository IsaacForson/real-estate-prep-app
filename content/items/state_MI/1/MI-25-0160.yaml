stem: A licensee has provided an electronic mail address to the department and authorized the
  department in writing to send notices to that address, and has consented to electronic service.
  Under MCL 339.204(6), how may the department deliver a renewal notice to this licensee?
options:
  - By first-class mail, but electronic mail if authorized
  - By electronic mail only if the licensee agrees in writing
  - By first-class mail unless the licensee chooses electronic mail
  - By electronic mail rather than by first-class mail
key: D
explanation: The rule states that if the licensee has provided an electronic mail address,
  authorized the department in writing to use that address, and consented to electronic service, the
  department may deliver notices by electronic mail rather than by first‑class mail. Therefore, the
  correct answer is that the department may send the notice by electronic mail instead of
  first‑class mail. The distractor suggesting the department may use electronic mail only if the
  licensee agrees in writing omits the requirements of providing the address and authorizing the
  department, making it incorrect.
