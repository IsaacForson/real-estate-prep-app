stem: Under MCL 339.2503(1), which of the following describes an exemption from the real estate
  licensing requirements?
options:
  - A person who, as owner, sells a detached single-family dwelling that has never been occupied and
    that was built by the person while licensed under article 24
  - A person who, as owner, always sells a detached single-family dwelling that has been previously
    occupied and that was built by the person while licensed under article 24
  - A person who, as owner, always sells a detached single-family dwelling that has never been
    occupied and that was built by the person while not licensed under article 24
  - A person who, as owner, always sells a detached single-family dwelling that has never been
    occupied and that was built by the person while licensed under article 24 and is currently
    occupied
key: A
explanation: The exemption applies when the owner sells a detached single-family dwelling that has
  never been occupied and was built while the owner held a license under article 24. The distractor
  about a previously occupied dwelling is incorrect because the exemption requires the dwelling to
  have never been occupied.
citation:
  source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980) MCL 339.2503(1)
  url: null
  quoted_text: This article does not apply to a person that, as owner, sells or offers for sale a
    detached, single family dwelling, duplex, triplex, or quadruplex, that has never been occupied
    and that was built by the person while licensed under article 24.
