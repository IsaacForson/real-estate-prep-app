stem: A licensee pays the required examination fee and is scheduled for the exam but does not
  attend. What happens to the examination fee under MCL 339.407(2)?
options:
  - Warning and permission to reschedule
  - Payment of a reexamination fee
  - Forfeiture of the examination fee
  - Refund of the examination fee
key: C
explanation: Under MCL 339.407(2), a licensee who fails to appear for a scheduled examination
  forfeits the examination fee already paid. Therefore, the correct outcome is forfeiture of the
  fee. The distractor suggesting payment of a reexamination fee describes a possible next step but
  does not state what happens to the original fee; the rule only addresses forfeiture, not
  subsequent payment. The other distractors incorrectly suggest a refund or a warning, which are not
  supported by the cited provision.
