  url: null
  quoted_text: A temporary license or registration issued under subsection (2) is valid for 6 months
    and may be renewed for 1 additional 6‑month term if the department determines the temporary
    licensee or registrant continues to meet the requirements of subsection (2) and needs additional
    time to fulfill the requirements for initial licensure or registration in this state.
