stem: A spouse of an active-duty member of the armed forces holds a current real estate salesperson
  license in good standing from Ohio. Under MCL 339.213(2) and (3), what is the maximum total period
  for which a temporary Michigan license may be issued, including renewal?
options:
  - 12 months
  - 9 months
  - 24 months
  - 6 months
key: A
explanation: Subsection (2) authorizes a temporary license for qualified military dependents, and
  subsection (3) states that such a license is valid for six months and may be renewed for an
  additional six‑month term, giving a maximum of twelve months. The distractor B (9 months)
  incorrectly assumes only a partial renewal.
citation:
