stem: Under MCL 339.205, who is responsible for promulgating rules to implement articles 1 through 6
  of the Michigan Occupational Code?
options:
  - The appropriate board for each occupation
  - The governor of the state of Michigan
  - The legislature of the state of Michigan
  - The department responsible for rulemaking
key: D
explanation: The statute explicitly states that the department shall promulgate rules to implement
  articles 1 through 6 and any additional rules needed to fulfill its role. Boards do not have this
  rulemaking authority; they only make recommendations or administer specific programs under the
  department's rules.
