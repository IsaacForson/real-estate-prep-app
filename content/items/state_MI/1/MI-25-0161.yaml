stem: A department employee who is a licensed real estate broker (regulated under article 25) is
  being considered to investigate a complaint against a real estate salesperson. According to MCL
  339.201, may the department designate this employee as the investigator?
options:
  - Yes, any department employee may serve as an investigator for complaints.
  - Yes, the employee may serve as an investigator due to their real estate broker license.
  - No, the employee may not serve as an investigator; their license is not for articles 7, 20, or
    22.
  - No, only unlicensed department employees may serve as investigators for complaints.
key: C
explanation: MCL 339.201 limits investigators to persons who meet the qualifications for licensure
  established for an occupation regulated under article 7, 20, or 22. A real estate broker license
  falls under article 25, so the employee does not qualify. The statement that the employee may not
  serve as an investigator because their license is not for articles 7, 20, or 22 correctly states
  the prohibition. The statement that the employee may serve as an investigator due to their real
  estate broker license is tempting but incorrect because holding a real estate broker license does
  not satisfy the article‑7/20/22 requirement.
