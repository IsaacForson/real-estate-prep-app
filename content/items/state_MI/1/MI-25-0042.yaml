stem: A licensee submits an application for licensure but fails to complete all required
  requirements within one year after the department receives the application. According to MCL
  339.409, what happens to the fees already paid?
options:
  - The fees are refunded to the licensee after a written request is submitted.
  - The licensee may pay an additional fee to extend the deadline by six months.
  - The department will waive the fees and allow the licensee to retake the examination.
  - The fees are forfeited to the department and the application is considered void.
key: D
explanation: MCL 339.409(3) provides that if the required requirements are not completed within one
  year after the department receives the application, the fees paid shall be forfeited to the
  department and the application shall be void. The option stating that the fees are forfeited to
  the department and the application is considered void correctly reflects this rule. The option
  suggesting a refund after a written request is incorrect because the statute mandates forfeiture,
  not refund. The option stating the department will waive the fees and allow retaking the
  examination is incorrect as the statute does not provide for waiver or retake. The option allowing
  payment of an additional fee to extend the deadline by six months is incorrect because the statute
  does not permit extension via additional fee.
