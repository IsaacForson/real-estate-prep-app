stem: Under MCL 339.202a(2)(a), what must an individual include in a request for a preliminary
  determination?
options:
  - A detailed description of any criminal proceedings that resulted in a judgment against the
    individual
  - A letter of recommendation from a current employer detailing the applicant's professional
    conduct and experience
  - A copy of the individual's high school diploma accompanied by transcripts showing graduation date
  - A statement of net worth including assets, liabilities, and recent bank account balances
key: A
explanation: The statute requires that a request for a preliminary determination include a detailed
  description of any criminal proceedings that resulted in a judgment against the individual. The
  other items, while possibly useful, are not mandated by the provision.
