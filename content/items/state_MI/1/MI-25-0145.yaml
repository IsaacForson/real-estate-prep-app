explanation: "The definition of 'Licensee' in MCL 339.105(2)(a) states it is a person that is
  licensed or required to be licensed under this act. The other options describe situations not
  covered by the definition: holding a temporary permit, completing education, or employing
  assistants do not alone make someone a licensee under the code."
