stem: A Michigan state-licensed residential real estate appraiser is engaged to appraise a
  commercial office building for a loan underwriting. The appraiser proceeds with the appraisal and
  signs the report using the residential license number. Under the Michigan Occupational Code, what
  is the consequence for this action?
options:
  - The appraiser is subject to disciplinary penalties under article 6.
  - The appraiser must pay a $15,000 fine for the violation.
  - The appraiser's license is automatically revoked by the department.
  - The appraiser must complete additional continuing education hours.
key: A
explanation: Performing appraisal services without the appropriate license is a violation. Under
  Mich. Comp. Laws § 339.2635(1)(e) the violation is punishable by the disciplinary penalties set
  out in article 6. The $15,000 monetary penalty applies only to a different subsection that
  addresses pre‑approval or payment conditions, not to the act of providing services without the
  proper license.
