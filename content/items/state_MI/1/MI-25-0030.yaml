stem: A Michigan real estate licensee moves to a new address and fails to notify the department
  within 30 days. Under MCL 339.204, what may result from this failure?
options:
  - The licensee may lose renewal eligibility
  - The licensee may be required to retrain
  - The licensee may face disciplinary action
  - The licensee may incur a monetary fine
key: C
explanation: MCL 339.204(4) states that failure to notify the department of an address change does
  not extend the expiration date and may result in disciplinary action. Therefore, disciplinary
  action is a possible outcome, while the expiration date is not extended.
