stem: After a hearing, a licensee is ordered to make restitution for damages caused by a violation.
  According to MCL 339.603, what action may the department take regarding the licensee's license?
options:
  - The license may be limited to non‑residential transactions.
  - The license may be placed on probation for one year.
  - The license may be revoked immediately.
  - The license may be suspended until restitution is made.
key: D
explanation: MCL 339.603 states that if restitution is required, the license or certificate of
  registration may be suspended until the restitution is made. Revocation, probation, or limitation
  are not authorized by this section for a restitution requirement.
