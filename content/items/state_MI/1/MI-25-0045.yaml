stem: Under MCL 339.602(e), what is the maximum administrative fine that may be assessed to a person
  licensed under this act?
options:
  - A fine of up to $10,000.00.
  - A fine of up to $5,000.00.
  - A fine of up to $20,000.00.
  - A fine of up to $15,000.00.
key: A
explanation: MCL 339.602(e) explicitly states that the administrative fine for a licensed person
  shall not exceed $10,000.00. The $5,000.00 option understates the statutory maximum, while the
  $15,000.00 and $20,000.00 options exceed it.
