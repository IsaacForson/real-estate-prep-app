stem: A real estate broker submits a completed application for license renewal. How many days does
  the department have to approve the application under MCL 339.411?
options:
  - The department must approve the application within 60 days of receipt.
  - The department must approve the application within 15 days of receipt.
  - The department must approve the application within 30 days of receipt.
  - The department must approve the application within 90 days of receipt.
key: C
explanation: MCL 339.411(7) provides that for real estate brokers and associate brokers licensed
  under article 25, the department must approve a completed application within 30 days. The 90‑day
  period applies to other occupations, and the 15‑day period pertains to notification of an
  incomplete application. Therefore, the option stating that the department must approve the
  application within 30 days of receipt is correct.
