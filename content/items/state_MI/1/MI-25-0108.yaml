stem: According to MCL 339.213(2), what two pieces of proof must an applicant provide to qualify for
  a temporary license based on military dependency?
options:
  - Proof of veteran status and proof of completing continuing education within the past two years
    as required by the department
  - Proof of Michigan residency for at least one year and proof of completing 40 hours of
    pre‑licensing education
  - Proof that the applicant has not been denied a license and proof of passing the Michigan real
    estate salesperson exam
  - Proof of being a dependent of a member of the armed forces and proof of holding a current
    license in good standing from another state
key: D
explanation: MCL 339.213(2) requires an applicant for a temporary license based on military
  dependency to submit (1) proof that the applicant is a dependent of a member of the armed forces,
  the uniformed services, or a veteran, and (2) proof of a current real‑estate license in good
  standing from another state or foreign jurisdiction. The other answer choices are incorrect
  because they ask for residency, continuing‑education, or passing the Michigan exam—requirements
  that are not listed in the statute.
