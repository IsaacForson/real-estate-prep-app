stem: Under the Michigan Occupational Code, what does the term "Board" mean when referring to a
  specific occupation article?
options:
  - The agency created in that article composed principally of members of the regulated occupation
  - The individual licensed to practice the occupation in question under this act
  - The agency created under this act that oversees all regulated occupations statewide
  - The department official appointed by the governor to oversee investigations and hearings
key: A
explanation: The definition states that in each article dealing with a specific occupation, the
  Board is the agency created in that article composed principally of members of the regulated
  occupation. This matches the correct option. The distractor about overseeing all occupations
  incorrectly expands the Board's scope beyond the specific article.
