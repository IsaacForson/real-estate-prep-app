stem: An individual receives an adverse preliminary determination from the department regarding
  their good moral character for a license application. What effect does this determination have
  under the Michigan Occupational Code?
options:
  - A permanent bar to obtaining any license under this act, regardless of later qualifications
  - A requirement to complete additional education before reapplying for any license under this act
  - Allowing subsequent application for a license or registration after receiving the determination
  - An automatic trigger of a formal complaint against the individual for further review
key: C
explanation: The statute explicitly states that an adverse preliminary determination does not
  prevent the individual from subsequently applying for a license or registration. This matches the
  correct option. The distractor claiming a permanent bar incorrectly adds a restriction not present
  in the rule.
