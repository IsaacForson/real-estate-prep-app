stem: A client signs a listing agreement that waives the broker's duty to conduct open houses but
  retains all other services. Does this constitute a limited service agreement under MCL
  339.2501(j)?
options:
  - The agreement does not constitute a limited service agreement because the client did not waive
    any services
  - The agreement constitutes a limited service agreement because the client knowingly waived
    certain enumerated services in part
  - The agreement does not constitute a limited service agreement because the waiver was not in
    writing
  - The agreement constitutes a limited service agreement because the broker reduced the commission
    rate
key: B
explanation: MCL 339.2501(j) defines a limited service agreement as a written service provision
  agreement where the client knowingly waives certain enumerated services in whole or part. Waiving
  the duty to conduct open houses is a partial waiver of an enumerated service, satisfying the
  definition. The claim that the agreement is a limited service agreement because the broker reduced
  the commission rate is incorrect; reducing commission does not constitute a waiver of an
  enumerated service as required by the statute.
citation:
  source: "### Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980) — Michigan
    Compiled Laws, Occupational Code (1980 PA 299), MCL 339.101–339.2919 — includes Article 25 (Real
    Estate Brokers and Salespersons, MCL 339.2501–339.2518) — official Michigan Legislature
    compiled-act PDF read via Internet Archive capture of 2026-01-09 because legislature.mi.gov's
    Check Point WAF blocks scripts and headless browsers — § 339.2501"
  url: null
  quoted_text: '"Limited service agreement" means a written service provision agreement by which a
    real estate broker and client establish an agency relationship in which certain enumerated
    services, as set forth in section 2512d(3)(b), (c), and (d), are knowingly waived in whole or
    part by the client.'
