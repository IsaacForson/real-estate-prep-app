stem: The department receives a complaint against a real estate salesperson and considers
  designating an unlicensed department employee to investigate. According to the Michigan
  Occupational Code, what may the department **NOT** do?
options:
  - Close the complaint without investigation
  - Require the salesperson to attend continuing education
  - Designate that employee as the investigator
  - Issue a warning to the salesperson
key: C
explanation: MCL 339.201 limits investigators to persons who meet the qualifications for licensure
  established for an occupation regulated under article 7, 20, or 22. An unlicensed department
  employee does not meet those qualifications, so the department may not designate that employee as
  an investigator. The other actions are not prohibited by this provision.
