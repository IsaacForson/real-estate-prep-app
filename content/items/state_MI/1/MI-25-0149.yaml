stem: A prospective real estate salesperson submits a completed application on the department's
  prescribed form and includes the required fee. Assuming the applicant satisfies all licensure
  requirements, what action must the department take under MCL 339.202(1)?
options:
  - Return the application for missing information
  - Issue a license or registration to the applicant
  - Refer the applicant to the attorney general
  - Place the application on hold pending board review
key: B
explanation: Under MCL 339.202(1), the department shall issue a license or registration to a person
  who meets the licensure or registration requirements. The other actions are not required by the
  statute when requirements are satisfied.
