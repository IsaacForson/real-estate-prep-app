  - 60 days
  - 45 days
  - 30 days
key: B
explanation: The rule states that the board must meet and make a determination within 60 days after
  receiving the hearing examiner's report. The 30‑day period applies to a respondent's acceptance of
  a citation, not to the board's penalty determination.
