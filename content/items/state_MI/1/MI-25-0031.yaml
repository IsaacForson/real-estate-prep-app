stem: After an investigation finds no violation, the department closes a complaint and forwards the
  reasons for closure to the respondent and complainant. According to MCL 339.504(2), what may the
  respondent and complainant do to potentially reopen the complaint?
options:
  - Request a formal hearing within 10 days.
  - File a new complaint with the department.
  - Pay a reinstatement fee to the department.
  - Submit additional information to the department.
key: D
explanation: The statute states that when a complaint is closed because no violation is found, the
  reasons are forwarded to the parties, who may then provide additional information to reopen the
  complaint. Submitting additional information is the only action expressly permitted for reopening.
  Filing a new complaint or requesting a hearing are not described as reopening mechanisms in this
  subsection.
citation:
  source: Mich. Comp. Laws § 339.504(2)
  url: null
  quoted_text: If the report of the investigative unit of the department does not disclose a violation
    of this act or a rule promulgated or an order issued under this act, the complaint shall be
    closed by the department. The reasons for closing the complaint shall be forwarded to the
    respondent and complainant, who then may provide additional information to reopen the complaint.
