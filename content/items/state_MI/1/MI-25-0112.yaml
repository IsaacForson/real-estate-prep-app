stem: A broker applicant seeks a license, and the department notifies the appropriate board of its
  intent to impose a limitation on the license. The board does not respond within 60 days. Under MCL
  339.203(2), what may the department do?
options:
  - The denial of the license application
  - The requirement to wait for board approval
  - The imposition of the limitation
  - The referral to the attorney general
key: C
explanation: The law provides that if the notified board neither approves nor disapproves the
  limitation within 60 days after receiving the department's notice, the department may impose the
  limitation. Waiting for board approval is not required when the board fails to act within that
  period.
