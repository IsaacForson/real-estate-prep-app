stem: Under Mich. Comp. Laws § 339.2512(1)(k)(iv), what is the maximum amount of a broker's own
  money that may be deposited in each trust account to cover bank service charges and minimum
  balance requirements?
options:
  - $1,000.00
  - $2,000.00
  - $500.00
  - $5,000.00
key: B
explanation: The rule permits a broker to deposit up to $2,000.00 of its own money in each trust
  account to cover bank service charges and minimum balance requirements. The $1,000.00 distractor
  is incorrect because it is less than the allowed maximum.
