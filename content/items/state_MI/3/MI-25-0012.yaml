stem: What must a listing agreement between a broker and a seller or lessor contain under Michigan's
  occupational code?
options:
  - A clause allowing the broker to unilaterally extend the term of the listing
  - An itemized list of every repair the seller has agreed to complete before the closing date
  - Language stating that discrimination based on religion, race, or disability is prohibited
  - A detailed schedule of showings that the broker commits to conduct each week
key: C
explanation: The occupational code requires a listing agreement between a broker and a seller or
  lessor to contain language stating that discrimination based on religion, race, color, national
  origin, age, sex, disability, familial status, or marital status is prohibited.
citation:
  source: Mich. Comp. Laws § 339.2515
  url: null
  quoted_text: >-
    A listing agreement entered into between the broker and seller or lessor of property shall
    contain language

    that discrimination because of religion, race, color, national origin, age, sex, disability,
    familial status, or marital

    status on the part of the real estate broker, real estate salesperson, seller, or lessor is
    prohibited.
