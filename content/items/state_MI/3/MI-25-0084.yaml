stem: What must a nonresident applicant file to become a real estate broker or salesperson in Michigan?
options:
  - The certificate of good standing from the home state
  - The completed background check authorization
  - The irrevocable consent to service of process
  - The surety bond filed with the department
key: C
explanation: Under MCL 339.2514, a nonresident applicant shall file an irrevocable consent that an
  action may be commenced against the applicant, making service on the department as valid as direct
  service. The surety bond, certificate of good standing, and background check are not mentioned as
  requirements for nonresident licensure in this statute.
