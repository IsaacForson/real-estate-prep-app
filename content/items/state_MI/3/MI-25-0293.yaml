stem: A licensee is charged with a violation under Mich. Comp. Laws § 339.2515 and wishes to pursue
  immediate legal remedies in circuit court. Under Mich. Comp. Laws § 339.2515(3), what is the
  effect of this article on the licensee's right to pursue those remedies?
options:
  - The article allows the department to override any court decision regarding the charge.
  - The article requires the licensee to first exhaust all administrative remedies before court
    action.
  - The article bars the licensee from pursuing any remedies until the department's charge is
    resolved.
  - The article does not diminish the licensee's right to pursue direct and immediate legal or
    equitable remedies.
key: D
explanation: The statute provides that this article shall not diminish the right of a party to
  pursue and utilize direct and immediate legal or equitable remedies in a court of competent
  jurisdiction. Therefore, the answer stating that the article does not diminish the licensee's
  right to pursue those remedies is correct. The answer claiming the department can override any
  court decision is incorrect because the statute does not grant the department such authority. The
  answer saying the licensee must first exhaust administrative remedies is incorrect because the
  article preserves the right to go directly to court. The answer stating the licensee is barred
  from pursuing remedies until the department's charge is resolved is incorrect because the article
  expressly preserves the right to pursue remedies immediately.
