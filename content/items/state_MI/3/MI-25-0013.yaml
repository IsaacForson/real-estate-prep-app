stem: When must a licensee disclose the types of agency relationships available to a potential buyer
  or seller in a real estate transaction?
options:
  - After the purchase agreement has been fully executed by both parties
  - When the transaction involves a residential rental property of four units or fewer
  - After the licensee has already begun negotiating on the client's behalf
  - Before the buyer or seller discloses confidential information to the licensee
key: D
explanation: The statute requires a licensee to disclose all types of agency relationships available
  and the duties each creates before the potential buyer or seller discloses any confidential
  information to the licensee.
citation:
  source: Mich. Comp. Laws § 339.2517
  url: null
  quoted_text: >-
    A licensee shall disclose to a potential buyer or seller in a real estate transaction all types
    of agency

    relationships available and the licensee's duties that each agency relationship creates before
    the disclosure by the

    potential buyer or seller to the licensee of any confidential information specific to that
    potential buyer or seller.
