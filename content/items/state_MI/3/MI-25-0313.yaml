stem: A seller knows that the roof leaks but marks 'unknown' on the disclosure statement. Under
  Mich. Comp. Laws § 565.957(2), what is the seller's obligation regarding known conditions?
options:
  - Waiting for the buyer to ask about the roof
  - Consulting a contractor before completing the form
  - Leaving the condition marked as unknown
  - Reporting known conditions affecting the property
key: D
explanation: The law obligates the seller to report any known conditions affecting the property on
  the disclosure statement. Marking a known leak as 'unknown' violates this duty. The distractor
  about leaving the condition marked as unknown is wrong because the seller must disclose known
  conditions, not conceal them.
