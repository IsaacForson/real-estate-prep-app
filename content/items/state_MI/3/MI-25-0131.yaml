stem: When must a student present a state-issued photo identification to receive a certificate of
  completion for a prelicensure course under Michigan's administrative rules?
options:
  - After finishing the prelicensure course requirements
  - Before receiving the certificate of completion
  - Before attending the final exam session
  - Upon submitting the enrollment application
key: B
explanation: The rule states that a student must present a state‑issued photo identification before
  receiving the certificate of completion. Therefore, presentation must occur prior to certificate
  issuance. Presenting ID after completing the course or at the start does not satisfy the timing
  requirement, and presenting upon enrollment is too early relative to the certificate.
