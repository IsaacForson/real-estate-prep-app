stem: A salesperson places an online advertisement offering to lease her own condominium, using only
  her name and phone number. The salesperson owns the condominium. Is this advertisement permissible
  under Mich. Comp. Laws § 339.2512(4)?
options:
  - The advertisement is permissible because the salesperson owns the property
  - The advertisement is permissible because the property is the salesperson's principal residence
  - The advertisement is impermissible because the salesperson did not include the broker's contact
    information
  - The advertisement is impermissible because the salesperson used only her name and phone number
key: A
explanation: The rule allows a salesperson to advertise real property for rent or lease under her
  own name only if she is the owner of the property. The distractor incorrectly applies the
  principal‑residence rule, which pertains to sales advertisements, not leases.
