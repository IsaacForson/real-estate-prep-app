stem: A broker provides daily direct communication and written operating policies to a salesperson
  but never reviews the salesperson's practice or reports. Does this satisfy the broker's
  supervision duty under Michigan's occupational code?
options:
  - Under Michigan's occupational code, this satisfies the supervision duty because direct
    communication and written policies are sufficient.
  - Under Michigan's occupational code, this does not satisfy the supervision duty because review of
    practice and review of reports are required.
  - Under Michigan's occupational code, this does not satisfy the supervision duty because written
    policies must be provided monthly.
  - Under Michigan's occupational code, this satisfies the supervision duty as long as the
    salesperson receives weekly guidance.
key: B
explanation: Supervision under §339.2512f(1) requires at least direct communication, review of
  practice, review of reports, analyses and guidance, and written operating policies. Because the
  broker never reviews the salesperson's practice or reports, the supervision duty is not satisfied.
  The option stating that direct communication and written policies are sufficient incorrectly
  treats them as sufficient.
