  url: null
  quoted_text: If a process or pleading mentioned in this article is served upon the department it
    shall be by duplicate copies, 1 of which shall be filed in the department and the other
    immediately forwarded by registered mail to the main office of the applicant against which the
    process or pleading is directed.
