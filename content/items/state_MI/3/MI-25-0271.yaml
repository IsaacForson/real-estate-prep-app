stem: How many copies of a process or pleading must be sent to the department when it is served upon
  the department under MCL 339.2514?
options:
  - Three copies must be sent.
  - Four copies must be sent.
  - One copy must be sent.
  - Two copies must be sent.
key: D
explanation: The statute requires that a process or pleading served on the department be made by
  duplicate copies, with one copy filed and the other forwarded, meaning two copies are required.
  The distractor stating one copy is sufficient omits the requirement for a second copy to be
  forwarded.
