stem: Under Michigan's occupational code, what is the consequence if a broker contracts with a
  salesperson in a manner that limits the broker's authority to supervise the salesperson?
options:
  - The contract is prohibited
  - The contract is void and unenforceable
  - The broker must pay a fine
  - The salesperson must terminate the contract
key: A
explanation: The statute states that a broker shall not contract with a salesperson in a way that
  limits the broker's supervisory authority, making such a contract prohibited. The distractor
  claiming the contract is void and unenforceable adds a consequence not stated in the rule.
