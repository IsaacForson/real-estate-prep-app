stem: A real estate salesperson wishes to advertise for sale her own home, which is her principal
  residence, using only her name and phone number. Is this advertisement permissible under Mich.
  Comp. Laws § 339.2512(4)?
options:
  - Yes, because the property is the salesperson's principal residence.
  - No, because the property is not the salesperson's principal residence.
  - Yes, because the salesperson owns the property.
  - No, because the salesperson does not own the property.
key: A
explanation: Under § 339.2512(4), a salesperson may advertise under their own name to sell real
  property only if the property is their principal residence. Since the home is the salesperson's
  principal residence, the advertisement is permissible. The distractor citing ownership is
  incorrect because ownership alone does not satisfy the exception for sales advertisements; the
  rule requires the property to be the principal residence.
