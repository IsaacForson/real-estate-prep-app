stem: Which of the following actions is prohibited for a licensee under MCL 339.2512(1)(b)?
options:
  - Failing to provide a written agency disclosure to a prospective buyer or seller in a real estate
    transaction
  - Failing to deposit earnest money into a trust account within two banking days, as required by law
  - Failing to disclose any known material defects about the property, to the client
  - Failing to obtain a signed purchase agreement before showing the property, to the client
key: A
explanation: Under MCL 339.2512(1)(b), a licensee must provide a written agency disclosure to a
  prospective buyer or seller in a real estate transaction as required under section 2517; failing
  to do so is prohibited conduct. The duty to deposit earnest money into a trust account within two
  banking days is a trust‑account timing duty found elsewhere in the statute, not subsection (1)(b).
