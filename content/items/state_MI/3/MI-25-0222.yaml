stem: A broker employs a salesperson and includes in their employment contract a clause that the
  broker will not review the salesperson's practice or reports. Under Michigan's occupational code,
  is this contract permissible?
options:
  - No, because it limits the broker's authority to supervise the salesperson.
  - Yes, because the broker still provides direct communication and written operating policies to
    the salesperson.
  - No, unless the salesperson agrees in writing to waive supervision.
  - Yes, as long as the broker provides daily direct communication in person or by telephone.
key: A
explanation: The law prohibits a broker from contracting with an employed salesperson in any way
  that limits the broker's authority to supervise, which includes reviewing practice and reports.
  Therefore a contract that omits those reviews is not allowed. Providing other supervisory duties
  does not override the prohibition. See MCL 339.2512f(2).
