stem: If a salesperson's termination is effective May 15, on what date must they cease performing
  regulated acts under Mich. Comp. Laws § 339.2507(3)?
options:
  - May 14, 2025
  - May 15, 2025
  - May 16, 2025
  - May 17, 2025
key: B
explanation: The statute bars a salesperson from performing regulated acts after the date of
  termination, meaning the prohibition begins on the effective termination date itself. Therefore
  the salesperson must cease on May 15. Selecting May 16 would allow an extra day of prohibited
  activity.
