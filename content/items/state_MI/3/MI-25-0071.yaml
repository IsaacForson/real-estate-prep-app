stem: Under Michigan's administrative rules, what must a licensee do before receiving a certificate
  of completion for a prelicensure course conducted in a traditional classroom setting?
options:
  - Submit a renewal application for the course to the school
  - Pass a state licensing exam administered by the department
  - Present a state-issued photo identification or acceptable alternative
  - Complete at least 50% of the required course hours
key: C
explanation: R 339.22624(5)(a) requires that for traditional classroom courses, a student or
  licensee must present a state‑issued photo identification or other acceptable alternative form of
  identification before the certificate is issued. Passing a state exam is not a condition for
  course completion, and the attendance requirement is 100%, not 50%.
