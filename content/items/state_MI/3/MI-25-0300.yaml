stem: Under MCL 339.2512(1)(c), what conduct by an associate real estate broker or real estate
  salesperson is prohibited?
options:
  - The act of changing a business location without notifying the department
  - The act of representing another broker without the employer's knowledge and consent
  - The act of failing to give a written agency disclosure to a buyer or seller
  - The act of sharing a fee with an unlicensed person for a referral
key: B
explanation: The cited subsection prohibits an associate broker or salesperson from representing
  another broker without the employer's knowledge and consent. Changing a business location without
  notification is prohibited under subsection (e), not (c), making that distractor incorrect.
