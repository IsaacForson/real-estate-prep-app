stem: A licensee wishes to obtain a waiver of the continuing education requirement. By what deadline
  must the waiver request be submitted to the department?
options:
  - Within 30 days after the license expires
  - Before the license expiration date
  - Within 60 days after the license expires
  - At any time during the license cycle
key: B
explanation: R 339.22630 states that a request for a waiver of continuing education must be received
  by the department before the expiration date of the license. Submitting after the license has
  expired does not satisfy the requirement, making the 30‑day‑after option incorrect.
