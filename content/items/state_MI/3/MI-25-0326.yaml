stem: A Michigan real estate broker adopts an assumed name 'Sunrise Properties' for advertising and
  signs a lease using that name. The broker has not yet notified the department. According to Mich.
  Comp. Laws § 339.2512(5), when must the broker notify the department of the assumed name?
options:
  - The broker must notify the department within 30 days after adopting the assumed name.
  - The broker must notify the department immediately upon first use of the assumed name in
    advertising.
  - The broker must notify the department with the next license renewal application.
  - The broker must notify the department only if the assumed name is used in a written contract.
key: A
explanation: "The statute requires a broker to notify the department of an assumed name either with
  the license application or within 30 days after adoption, whichever is earlier. Since the broker
  already holds a license, the 30‑day period applies. The other options misstate the timing: waiting
  for renewal, limiting notice to written contracts, or requiring immediate notice are not supported
  by the law."
