stem: A real estate school concludes its last prelicensure course on Friday, July 5. According to
  Michigan's administrative rules, by what date must the school submit the names of students who
  successfully completed the course to the department?
options:
  - Submit the names by July 8, 2024
  - Submit the names by July 10, 2024
  - Submit the names by July 12, 2024
  - Submit the names by July 15, 2024
key: C
explanation: Rule R 339.22624(7) requires submission within 5 business days of the course's
  conclusion. Counting five business days after Friday, July 5 (excluding weekends) leads to Friday,
  July 12 as the deadline.
