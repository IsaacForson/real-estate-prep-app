stem: A property owner offers a current tenant $400 for referring a prospective tenant who signs a
  lease. The monthly rent for the unit is $500. Under Mich. Comp. Laws § 339.2512b(a), does this
  referral fee constitute participation in a real estate transaction?
options:
  - No, because the fee is exactly one month's rent.
  - No, because the fee is less than one month's rent.
  - Yes, because any fee for a referral is participation.
  - Yes, because the fee exceeds one month's rent.
key: B
explanation: Under Mich. Comp. Laws § 339.2512b(a), an owner may pay an existing tenant a referral
  fee of up to one month's rent without the fee being considered participation in a real estate
  transaction. Here the fee is $400 and the monthly rent is $500, so the fee is less than one
  month's rent. Therefore the fee does not constitute participation.
