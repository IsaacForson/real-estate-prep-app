stem: According to Mich. Comp. Laws § 339.2515(1), a listing agreement must contain language that
  discrimination because of which of the following factors is prohibited?
options:
  - Discrimination based on religion
  - Discrimination based on sexual orientation
  - Discrimination based on political affiliation
  - Discrimination based on income level
key: A
explanation: The statute explicitly lists religion among the protected classes for which
  discrimination is prohibited in listing agreements. Therefore, the agreement must include language
  prohibiting discrimination based on religion. Sexual orientation is not mentioned in the statute,
  so it is not a required protected class under this provision.
