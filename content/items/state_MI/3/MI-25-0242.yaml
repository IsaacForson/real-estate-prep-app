stem: A real estate school wants to advertise its approved prelicensure course to the public.
  According to Michigan's administrative rules, what must the advertisement include to comply with
  the requirement for courses held out as fulfilling the prelicensure education requirement?
options:
  - The advertisement must include the instructor’s qualifications and contact information
  - The advertisement must include the school’s website address and email address
  - The advertisement must include the course title and number of clock hours
  - The advertisement must include the name of the approved school
key: D
explanation: Rule R 339.22627 requires that all advertising for approved real estate courses held
  out as fulfilling the prelicensure education requirement include the name of the approved school.
  The option stating that the advertisement must include the name of the approved school meets this
  requirement. The option stating that the advertisement must include the school’s website address
  and email address does not meet this requirement.
