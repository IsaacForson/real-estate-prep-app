stem: Under MCL 339.2515(2), who bears the burden of proof in disciplinary proceedings against a
  licensee?
options:
  - The court bears the burden of proof.
  - The complainant bears the burden of proof.
  - The licensee bears the burden of proof.
  - The department bears the burden of proof.
key: D
explanation: Under MCL 339.2515(2), the department bears the burden of proof in disciplinary
  proceedings against a licensee. The court, the complainant, and the licensee do not bear this
  burden; placing it on any of them contradicts the statutory requirement.
