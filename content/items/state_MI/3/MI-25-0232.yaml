stem: A nonresident corporation applies to become a real estate broker in Michigan. According to MCL
  339.2514, how must the instrument containing the consent to service of process be authenticated?
options:
  - By the acknowledged signature of a member or officer of the corporation
  - By the corporate seal affixed to the consent instrument
  - By a notarized signature of the applicant on the consent form
  - By the certified copy of the resolution authorizing the application
key: B
explanation: The statute states that an instrument containing a consent shall be authenticated by a
  seal if the applicant is a corporation; otherwise, by the acknowledged signature of a member or
  officer. Therefore, for a corporation, the seal is required.
