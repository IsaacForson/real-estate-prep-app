  quoted_text: However, any deposit in the trust account of the broker for which the buyer and seller
    have made claim must remain in the broker's trust account until a civil action has determined to
    whom the deposit must be paid, or until the buyer and seller have agreed, in writing, to the
    disposition of the deposit.
