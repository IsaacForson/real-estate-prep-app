stem: A buyer and seller both claim entitlement to an earnest money deposit after a real estate
  transaction fails to close. Under Mich. Admin. Code R 339.22313(9), what must the broker do with
  the deposit?
options:
  - Hold the deposit in trust until a civil action or written agreement
  - Forward the deposit to the closing attorney for disbursement
  - Transfer the deposit to the escrow agent for immediate distribution
  - Deposit the funds into the broker's operating account immediately
key: A
explanation: The rule requires that any deposit for which the buyer and seller have made claim must
  remain in the broker's trust account until a civil action determines entitlement or the parties
  agree in writing to its disposition. Therefore, the broker must hold the deposit in trust under
  those conditions. The distractor suggesting immediate disbursement to the buyer violates the
  requirement to wait for resolution.
