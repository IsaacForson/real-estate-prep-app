stem: A broker wants to supervise a real estate salesperson in compliance with Michigan's
  occupational code. Which combination of practices satisfies that supervisory duty?
options:
  - Reviewing tax returns and requiring weekly attendance at continuing education classes
  - Cosigning every check the salesperson writes and auditing personal bank statements
  - Direct communication, review of practice and reports, and written policies
  - Assigning a mentor from a different brokerage to shadow the salesperson
key: C
explanation: The occupational code defines supervision of a salesperson to include regular direct
  communication, review of the salesperson's practice and reports, guidance on performance, and
  providing written operating policies and procedures.
citation:
  source: Mich. Comp. Laws § 339.2512f
  url: null
  quoted_text: >-
    A real estate broker or associate real estate broker shall supervise the work of a real estate
    salesperson. For

    purposes of this subsection, supervision of a real estate salesperson includes at least all of
    the following:

    (a) Direct communication in person or by radio, telephone, or electronic communication, on a
    regular basis.

    (b) Review of the practice of the salesperson.
