stem: A proprietary real estate school’s prelicensure course approval expires on June 30, 2024. By
  what date must the school submit the renewal application to remain compliant?
options:
  - April 30, 2024
  - May 1, 2024
  - May 30, 2024
  - June 1, 2024
key: B
explanation: Rule R 339.22619(3) requires a renewal application to be submitted at least 60 days
  before the expiration date; 60 days before June 30, 2024 is May 1, 2024.
citation:
  source: Mich. Admin. Code R 339.22101–339.22667 R § 339.22619
  url: null
  quoted_text: To maintain course approval, a proprietary real estate school shall submit to the
    department a renewal application on the form approved by the department at least 60 days before
    the expiration date of the course approval.
