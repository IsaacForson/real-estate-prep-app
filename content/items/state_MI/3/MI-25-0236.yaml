stem: A right-to-list home sale agreement includes an early termination option allowing the owner to
  terminate by paying the broker the initial consideration, but the explanation of the early
  termination option appears on page 2 of the agreement. Under Michigan's occupational code, what is
  the status of this agreement?
options:
  - The agreement is enforceable because the early termination consideration meets the statutory
    limit
  - The agreement is void and unenforceable because the term exceeds two years
  - The agreement is enforceable because the term is under two years
  - The agreement is void and unenforceable because the early termination explanation is not on the
    first page
key: D
explanation: The agreement fails to satisfy MCL 339.2512g(1)(d)(ii), which requires the explanation
  of the early termination option to appear on the first page. Because that requirement is missing,
  the agreement is void and unenforceable regardless of the term length or consideration amount.
