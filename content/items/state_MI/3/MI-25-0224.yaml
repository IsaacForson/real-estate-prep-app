stem: Under Michigan's occupational code, what language must a listing agreement between a broker
  and a seller or lessor contain to satisfy the statutory prohibition on discrimination?
options:
  - The listing agreement must include a statement that discrimination because of religion, race,
    color, national origin, age, sex, disability, familial status, or marital status is prohibited
    in any real estate transaction.
  - The listing agreement must include a statement that discrimination because of religion, race,
    color, national origin, or age is prohibited in any real estate transaction.
  - The listing agreement must include a statement that discrimination because of familial status or
    marital status is prohibited in any real estate transaction.
  - The listing agreement must include a statement that discrimination because of sex or disability
    is prohibited in any real estate transaction.
key: A
explanation: Mich. Comp. Laws § 339.2515 requires that a listing agreement contain language
  prohibiting discrimination based on religion, race, color, national origin, age, sex, disability,
  familial status, or marital status. The correct option lists all of these protected classes, while
  each incorrect option omits at least one of them.
