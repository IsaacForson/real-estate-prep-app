stem: A licensee receives the name of a prospective buyer from an unlicensed acquaintance and pays
  the acquaintance $150 as a referral fee. Under Michigan law, the licensee's action is
options:
  - Under Michigan law, the licensee's action is permissible because the payment is for a
    commercially prepared list of names
  - Under Michigan law, the licensee's action is impermissible because sharing a fee with an
    unlicensed person for providing a name is prohibited
  - Under Michigan law, the licensee's action is permissible because the acquaintance is not acting
    as a broker
  - Under Michigan law, the licensee's action is impermissible because the licensee failed to obtain
    written consent from the employer
key: B
explanation: Under Mich. Comp. Laws § 339.2512(1)(h), a licensee may not share a fee, commission, or
  other valuable consideration with an unlicensed person for providing the name of a potential buyer
  or seller, unless the payment is for a commercially prepared list of names. Since the payment was
  for an individual's name, the exemption does not apply, making the action impermissible. The
  distractor claiming permissibility because the payment is for a commercially prepared list is
  incorrect because the scenario involves payment for a single name, not a list.
