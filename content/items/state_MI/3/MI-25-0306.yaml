stem: A nonresident corporation seeks Michigan real estate broker licensure and submits its consent
  to service of process authenticated by the acknowledged signature of its president, but without a
  corporate seal. According to MCL 339.2514, is the consent sufficient for licensure?
options:
  - The consent must also include a certified copy of a resolution.
  - The document being notarized satisfies the requirement.
  - The signature alone satisfies the authentication requirement.
  - The corporate seal is required for corporate applicants.
key: D
explanation: Under MCL 339.2514, a corporation’s consent to service of process must be authenticated
  by a corporate seal; a mere acknowledged signature does not satisfy this requirement. Therefore,
  the consent submitted without a seal is insufficient for licensure.
