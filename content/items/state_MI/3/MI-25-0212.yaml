stem: Under Mich. Comp. Laws § 339.2507(2), when must a broker notify a salesperson in writing after
  delivering or mailing the salesperson's license to the department?
options:
  - Notification five days after license delivery
  - Notification ten days after license delivery
  - Notification at the time of license delivery or mailing
  - Notification two days after license delivery
key: C
explanation: The rule requires the broker to notify the salesperson at the exact time the license is
  delivered or mailed to the department. A delay of two days after license delivery, as in the
  option stating 'Notification two days after license delivery', would violate this simultaneous
  notice requirement.
citation:
  source: Mich. Comp. Laws § 339.2507(2)
  url: null
  quoted_text: A real estate broker, at the time it delivers or mails a real estate salesperson's
    license to the department under subsection (1), shall notify the real estate salesperson in
    writing, delivered or mailed to the last known residence address of the real estate salesperson,
    that advises the real estate salesperson that the real estate broker has delivered or mailed the
    license to the department.
