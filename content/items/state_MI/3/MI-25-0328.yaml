stem: A Michigan real estate broker decides to advertise properties under the name 'Great Lakes
  Homes', which is different from the name on the broker's license and has not been submitted to the
  department as an assumed name. According to Mich. Comp. Laws § 339.2512(5), is this advertisement
  permissible?
options:
  - The advertisement is permissible because the broker can choose any business name for advertising.
  - The advertisement is permissible only if the name is exactly the same as the name on the
    broker's license.
  - The advertisement is permissible if the broker includes the license number in the advertisement.
  - The advertisement is not permissible because the broker must use the licensed name or an
    authorized assumed name.
key: D
explanation: "The advertisement is not permissible because the broker must use the name on the
  license or an assumed name that has been authorized by law. The other options are incorrect: one
  suggests the broker may freely choose any business name for advertising, another claims only the
  licensed name may be used (ignoring that an authorized assumed name is also allowed), and the
  third asserts that including the license number makes an unauthorized name acceptable."
citation:
  source: Mich. Comp. Laws § 339.2512(5)
  url: null
  quoted_text: A real estate broker shall not conduct business or advertise under a name other than
    that in which the broker's license is issued or under an assumed name that is authorized by law.
