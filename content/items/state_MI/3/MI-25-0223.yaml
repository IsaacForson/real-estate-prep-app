stem: A broker pays an owner $5,000 as initial consideration for a right-to-list home sale
  agreement. The agreement includes an early termination option allowing the owner to terminate by
  paying the broker $5,500. Assuming the termination occurs one year after the agreement date, is
  the early termination provision enforceable under Michigan's occupational code?
options:
  - No, because the consideration exceeds the initial amount plus 6% annual interest for one year.
  - Yes, because the broker may charge any amount the owner agrees to pay for early termination.
  - No, because the interest must be compounded monthly, making the allowed amount higher.
  - Yes, because the termination payment of $5,500 is less than twice the initial consideration.
key: A
explanation: Under MCL 339.2512g(1)(d)(i), the early‑termination consideration may not exceed the
  initial amount plus 6% simple interest per annum. For a $5,000 initial payment, one year’s
  interest is $300, so the maximum allowable termination payment is $5,300. The proposed $5,500
  exceeds that limit, making the provision unenforceable. The option stating that the broker may
  charge any amount the owner agrees to pay for early termination is incorrect because the law caps
  the amount at the initial consideration plus statutory interest. The option claiming that a
  payment less than twice the initial consideration is permissible is also incorrect because the
  allowable amount is based on the interest limit, not a multiple of the initial payment.
