math:
  worked_solution: |-
    Step 1: Identify initial consideration P = $5,000.
    Step 2: Identify annual interest rate r = 6% = 0.06.
    Step 3: Identify time t = 1 year.
    Step 4: Compute simple interest I = P × r × t = $5,000 × 0.06 × 1 = $300.
    Step 5: Compute maximum allowable termination amount = P + I = $5,000 + $300 = $5,300.
    Step 6: Compare proposed termination payment $5,500 to maximum $5,300.
    Step 7: Since $5,500 > $5,300, the provision exceeds the statutory limit and is unenforceable.
  formulas:
    - "Simple interest: I = P × r × t"
    - Total allowable amount = P + I
