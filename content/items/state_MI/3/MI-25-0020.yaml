stem: A seller accepts an offer and the sales agreement is fully executed. A second offer arrives
  afterward, and the licensee does not forward it to the seller. Under Michigan's administrative
  rules, is the licensee subject to discipline for failing to submit the later offer?
options:
  - Yes, because withholding any offer is treated as misrepresentation of a material fact
  - No, because a licensee is not required to present offers once a listing exists
  - No, unless the service agreement requires that subsequent offers be presented
  - Yes, because offers received before closing have to be forwarded to the seller
key: C
explanation: The rule provides that a licensee is not subject to disciplinary action for failing to
  submit additional offers received after the seller has already accepted an offer and the sales
  agreement is fully executed, unless the service provision agreement requires that subsequent
  offers be presented.
citation:
  source: Mich. Admin. Code, Rule 339.22307
  url: null
  quoted_text: |-
    A licensee is not subject to disciplinary action for failing to submit to the seller
    any additional offers to purchase that are received after the seller has accepted an offer
    and the sales agreement is fully executed, unless a service provision agreement requires
    that subsequent offers be presented.
