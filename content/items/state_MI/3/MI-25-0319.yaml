stem: What does the term 'affiliated licensees' mean?
options:
  - Individuals licensed as salespersons or associate brokers who are employed by the same broker
  - Individuals licensed as salespersons or associate brokers who work under the same supervisory
    broker
  - Individuals licensed as salespersons or associate brokers who share the same office address
  - Individuals licensed as salespersons or associate brokers who have completed continuing
    education together
key: A
explanation: Mich. Comp. Laws § 339.2517(11)(a) defines affiliated licensees as individuals licensed
  as salespersons or associate brokers who are employed by the same broker. The other options
  describe different relationships that are not part of the statutory definition.
