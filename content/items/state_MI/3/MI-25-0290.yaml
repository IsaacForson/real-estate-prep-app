stem: Broker X designates Salesperson A as the designated agent for the buyer and Salesperson B
  (also affiliated with Broker X) as the designated agent for the seller in the same transaction.
  According to Mich. Comp. Laws § 339.2517(8), what is the correct statement?
options:
  - The broker acts as a dual agent for both parties
  - Salesperson A and Salesperson B are not considered dual agents
  - The designated agents must disclose to each other's clients
  - Salesperson A and Salesperson B are considered dual agents
key: B
explanation: Michigan Comp. Laws § 339.2517(8) provides that two designated agents who are
  affiliated licensees may each represent a different party in the same transaction and shall not be
  considered dual agents. Consequently, the statement that the two salespersons are not dual agents
  is correct, while the statements that they are dual agents or that the broker is a dual agent are
  incorrect.
