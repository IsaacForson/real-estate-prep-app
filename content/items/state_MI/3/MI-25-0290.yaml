  quoted_text: Except as otherwise provided in subsection (7), a client with a designated agency
    agreement is not considered to have an agency relationship with any affiliated licensees of the
    designated agent. Two designated agents who are affiliated licensees may each represent a
    different party in the same transaction and shall not be considered dual agents.
