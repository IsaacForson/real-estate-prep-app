stem: A broker receives notice that an offer to purchase has been accepted, and money belonging to
  others is now payable to the broker. Under Michigan's occupational code, when must the broker
  deposit those funds into the trust or escrow account?
options:
  - Not later than 2 banking days after receiving notice of acceptance
  - Not later than 5 banking days after receiving notice of acceptance
  - Not later than 10 calendar days after receiving notice of acceptance
  - Not later than the closing date specified in the purchase agreement
key: A
explanation: The occupational code requires a broker to deposit money belonging to others into a
  separate custodial trust or escrow account not later than 2 banking days after receiving notice
  that an offer to purchase has been accepted by all parties.
citation:
  source: Mich. Comp. Laws § 339.2512
  url: null
  quoted_text: >-
    A real estate broker shall deposit, not later than 2 banking days after the broker has received
    notice that an

    offer to purchase is accepted by all parties, money that belongs to others and is made payable
    to the real estate

    broker into a separate custodial trust or escrow account maintained by the real estate broker
    with a bank, savings

    and loan association, credit union, or recognized depository until the transaction involved is
    consummated or

    terminated, at which time the real estate broker shall account for the full amount received.
