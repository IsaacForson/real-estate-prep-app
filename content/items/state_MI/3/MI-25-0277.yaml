stem: A licensed real estate broker who has not received department approval to teach prelicensure
  classes begins offering such a class. Under Michigan administrative rules, is this individual
  considered an Instructor?
options:
  - The individual who possesses a law degree from an accredited institution to be considered an
    instructor
  - The individual who must be approved by the department to teach prelicensure classes to be
    considered an instructor
  - The individual who holds a broker license and is qualified to teach prelicensure classes to be
    considered an instructor
  - The individual who has completed the required prelicensure education and holds a salesperson
    license to be considered an instructor
key: B
explanation: The rule defines an Instructor as an individual who is approved to teach prelicensure
  classes pursuant to section 2504(4) of the code. Merely holding a broker license does not confer
  approval, so the individual is not an Instructor without department approval.
