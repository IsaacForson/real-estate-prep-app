stem: Under Michigan's occupational code, when a licensee is charged with a violation, who bears the
  burden of proof?
options:
  - The licensee
  - The complainant
  - The department
  - The court clerk
key: C
explanation: MCL 339.2515(2) states that the department shall at all times bear the burden of proof
  to all charges made against a party. The licensee does not need to prove innocence, nor does the
  complainant or court carry this burden in the administrative process.
