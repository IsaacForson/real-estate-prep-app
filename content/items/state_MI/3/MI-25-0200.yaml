key: C
explanation: The key is correct because Mich. Comp. Laws § 339.2512(4) permits a salesperson to
  advertise under his or her own name only when the property is the salesperson's principal
  residence. The most tempting distractor is B, which suggests that holding a broker's license
  allows the exemption, but the statute does not mention licensure status as a condition for this
  exception.
