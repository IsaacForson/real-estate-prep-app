stem: A broker receives written notice of termination from a salesperson on March 3. By what date
  must the broker deliver or mail the salesperson's license to the department under Mich. Comp. Laws
  § 339.2507(1)?
options:
  - March 9, 2025
  - March 10, 2025
  - March 8, 2025
  - March 11, 2025
key: C
explanation: The broker must deliver or mail the license within five days of receiving the written
  notice. Counting five days from March 3 brings the deadline to March 8. Choosing March 9
  incorrectly adds a sixth day.
