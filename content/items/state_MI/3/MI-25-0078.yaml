stem: A right-to-list home sale agreement is oral, signed by all owners, has a one-year term, and
  includes an early termination option explained on the first page. Is this agreement enforceable
  under Michigan's occupational code?
options:
  - Under Michigan's occupational code, the agreement is enforceable because the term is less than
    two years.
  - Under Michigan's occupational code, the agreement is unenforceable because it must be in writing.
  - Under Michigan's occupational code, the agreement is enforceable because it is signed by all
    owners and includes the required early termination explanation.
  - Under Michigan's occupational code, the agreement is unenforceable because the early termination
    option must be explained in the last page.
key: B
explanation: Mich. Comp. Laws § 339.2512g(1)(a) provides that a right-to-list home sale agreement is
  void and unenforceable if it is not in writing. Because the agreement described is oral, it fails
  the writing requirement and is unenforceable regardless of its term, signatures, or
  early‑termination explanation. The claim that the agreement is enforceable because the term is
  less than two years ignores this writing requirement.
