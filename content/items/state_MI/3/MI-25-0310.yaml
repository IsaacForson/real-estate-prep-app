stem: A broker's sole principal associate broker died on March 1. The broker's salesperson continues
  working for the broker until September 1 (six months later), then leaves to work for another
  licensed broker. Under Mich. Admin. Code R 339.22221, is the salesperson eligible to receive a new
  license without charge from the department at that time?
options:
  - Yes, but only if the new license is issued in the same term as the original.
  - No, because the salesperson must wait until the one‑year period ends before changing employers.
  - Yes, because the transfer happened during the one‑year wind‑up period.
  - No, because the license remains active until the statutory suspension takes effect.
key: D
explanation: The free license provision in R 339.22221(4) applies only after a license has been
  suspended under subrule (3), which occurs one year after the death or disability. Since the
  salesperson moved after six months, before suspension, the condition for a free license is not
  met. Therefore the salesperson is not eligible for a free license at that time. The distractor
  suggesting eligibility during the wind‑up period confuses the wind‑up allowance with the
  free‑license condition.
