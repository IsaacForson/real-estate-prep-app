  quoted_text: One year after the date of death or disability of a broker’s sole associate principal
    broker, the licenses of all affiliated real estate salespersons and associate real estate
    brokers who are employed by the broker are automatically suspended, pending a replacement of the
    sole principal associate broker or change of employer and the issuance of a new license.
