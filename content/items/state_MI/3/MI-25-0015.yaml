stem: A licensee holds a deposit under a purchase agreement that names an escrowee other than the
  real estate broker. Under Michigan's occupational code, when must the licensee deliver the deposit
  to that named escrowee?
options:
  - Not later than 7 calendar days after the purchase agreement is signed by the buyer
  - Not later than 2 banking days after the licensee receives notice of acceptance
  - Not later than 30 days after the licensee first receives the deposit
  - Not later than the date the title company schedules the closing
key: B
explanation: The occupational code requires a licensee holding a deposit designated for another
  escrowee to cause the deposit to be delivered to that named escrowee not later than 2 banking days
  after the licensee receives notice that the offer to purchase is accepted by all parties.
citation:
  source: Mich. Comp. Laws § 339.2512
  url: null
  quoted_text: >-
    If a purchase agreement signed by a seller and purchaser provides that an escrowee other than a
    real estate

    broker shall hold a deposit, a licensee in possession of that deposit shall cause the deposit to
    be delivered to the

    named escrowee not later than 2 banking days after the licensee receives notice that an offer to
    purchase is

    accepted by all parties.
