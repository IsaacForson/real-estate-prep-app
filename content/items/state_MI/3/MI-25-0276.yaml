stem: According to Michigan administrative rules, what does the term Disability mean for a real
  estate broker?
options:
  - The determinable physical or mental characteristic that prevents a broker from performing duties
    under the code
  - The characteristic that arises from age and limits a broker's ability to travel freely
  - The temporary illness or injury that stops a broker from working for more than thirty
    consecutive days
  - The condition that applies to salespersons but not to brokers under Michigan rules
key: A
explanation: The rule defines Disability as a determinable physical or mental characteristic that
  prevents a broker from performing duties under the code. The option stating that disability is a
  characteristic that arises from age and limits a broker's ability to travel freely is incorrect
  because the rule does not limit disability to age‑related travel restrictions. The option stating
  that disability is a temporary illness or injury that stops a broker from working for more than
  thirty consecutive days is incorrect because the rule does not require a specific duration or
  limit disability to temporary conditions. The option stating that disability applies to
  salespersons but not to brokers is incorrect because the rule’s definition applies to brokers (and
  likewise to salespersons) without such a distinction.
