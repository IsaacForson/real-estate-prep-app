    compiled-act PDF read via Internet Archive capture of 2026-01-09 because legislature.mi.gov's
    Check Point WAF blocks scripts and headless browsers — § 339.2507"
  url: null
  quoted_text: If a real estate salesperson is discharged or terminates employment with a real estate
    broker by giving the employer a written notice of the termination, the real estate broker shall
    deliver or mail by certified mail to the department, within 5 days, the real estate
    salesperson's license.
