stem: A real estate salesperson tenders a written notice of termination to her broker effective
  today. Under Mich. Comp. Laws § 339.2507(1), within how many days must the broker deliver or mail
  the salesperson's license to the department?
options:
  - Three days
  - Five days
  - Seven days
  - Ten days
key: B
explanation: The statute mandates that the broker deliver or mail the license within five days of
  receiving a written notice of termination. Three days is too short, while seven or ten days exceed
  the required period.
