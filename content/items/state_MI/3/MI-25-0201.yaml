stem: A Michigan-licensed real estate salesperson places an online advertisement offering to sell a
  client's vacant land, using only the salesperson's name and contact information. The vacant land
  is not the salesperson's principal residence. Under Mich. Comp. Laws § 339.2512(4), is this
  advertisement permissible?
options:
  - No, because the salesperson disclosed the employing broker's address
  - No, because the property is not the salesperson's principal residence
  - No, because online ads are exempt from the rule under Michigan law
  - No, because the advertisement did not include the broker's business name
key: B
explanation: The key is correct because the rule prohibits advertising under the salesperson's own
  name unless the property is the salesperson's principal residence. The most tempting distractor is
  C, which incorrectly claims that online ads are exempt from the rule.
citation:
  source: Mich. Comp. Laws § 339.2512(4)
  url: null
  quoted_text: (4) A real estate salesperson shall not advertise to sell real property under his or
    her own name unless the property is the principal residence of the salesperson.
