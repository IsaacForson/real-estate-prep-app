stem: Under Mich. Comp. Laws § 565.957(1), what must a seller's agent do upon receiving the seller's
  completed disclosure statement?
options:
  - Providing a copy to the buyer or the buyer's agent
  - Attaching the statement to the sales agreement
  - Filing the statement with the county recorder
  - Submitting the statement to the department
key: A
explanation: The statute requires that upon receiving the seller's completed disclosure statement,
  the seller's agent must provide a copy to the buyer or the buyer's agent. This ensures the buyer
  receives the disclosure information. The distractor about filing with the county recorder is
  incorrect because the law does not impose that requirement.
