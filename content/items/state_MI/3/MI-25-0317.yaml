stem: According to Mich. Admin. Code R 339.22221(1), if a broker’s sole principal associate broker
  dies or becomes disabled, what is the maximum time the department will allow affiliated real
  estate licensees to either wind up the business or designate a new sole principal associate
  broker?
options:
  - Up to 1 year
  - Up to 2 years
  - Up to 6 months
  - Up to 9 months
key: A
explanation: The rule states the department shall allow a reasonable time not to exceed 1 year for
  licensees to wind up the business or designate a new sole principal associate broker. Therefore,
  the maximum allowable period is one year. The distractor 'Up to 6 months' understates the allowed
  time, while 'Up to 2 years' exceeds the limit set by the rule.
