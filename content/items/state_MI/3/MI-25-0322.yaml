stem: "Under Mich. Admin. Code R 339.22305(2), a service provision agreement that includes a clause
  requiring the client to notify the broker of their intention to cancel the agreement after the
  expiration date is:"
options:
  - The clause is permissible if the client agrees
  - The clause is prohibited under this rule
  - The clause is required for enforceability
  - The clause is permissible only if the broker provides a copy
key: B
explanation: The rule explicitly states that a service provision agreement must not contain a
  provision requiring the party signing the agreement to notify the broker of the party's intention
  to cancel upon or after the expiration date. Therefore, such a clause is prohibited regardless of
  client agreement or broker provision of a copy. The distractor suggesting permissibility misstates
  the rule's prohibition.
