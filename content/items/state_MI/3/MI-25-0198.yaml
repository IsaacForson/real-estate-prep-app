stem: A broker encounters a reference to Michigan Administrative Code R 339.22667 in a 2022
  continuing education manual. Based on the current administrative rules, what should the broker
  conclude about this rule?
options:
  - The rule remains enforceable and must be followed
  - The rule has been rescinded and no longer applies
  - The rule applies only to property management activities
  - The rule was amended in 2020 to include escrow requirements
key: B
explanation: The administrative rules explicitly state that R 339.22667 is rescinded, meaning it is
  no longer in effect. Therefore, the broker should conclude that the rule does not apply. The other
  options incorrectly suggest the rule is still active, limited in scope, or amended.
