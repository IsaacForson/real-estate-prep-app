stem: A licensee begins discussing a prospective buyer's motivation and budget at an open house
  before receiving any written agency disclosure. According to Mich. Comp. Laws § 339.2517(1), what
  must the licensee do before receiving this confidential information?
options:
  - Provide a written disclosure of agency relationships and duties
  - Submit a copy of the property's deed to the brokerage
  - Obtain a signed buyer representation agreement
  - Verify the buyer's pre‑approval letter from a lender
key: A
explanation: The law requires a licensee to disclose all agency relationships and duties before the
  client reveals any confidential information. Obtaining a buyer agreement or verifying financing
  does not satisfy this prerequisite disclosure.
citation:
  source: "### Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980) — Michigan
    Compiled Laws, Occupational Code (1980 PA 299), MCL 339.101–339.2919 — includes Article 25 (Real
    Estate Brokers and Salespersons, MCL 339.2501–339.2518) — official Michigan Legislature
    compiled-act PDF read via Internet Archive capture of 2026-01-09 because legislature.mi.gov's
    Check Point WAF blocks scripts and headless browsers — § 339.2517"
  url: null
  quoted_text: A licensee shall disclose to a potential buyer or seller in a real estate transaction
    all types of agency relationships available and the licensee's duties that each agency
    relationship creates before the disclosure by the potential buyer or seller to the licensee of
    any confidential information specific to that potential buyer or seller.
