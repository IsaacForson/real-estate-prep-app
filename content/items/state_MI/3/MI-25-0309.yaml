stem: A broker's license lapsed on January 10. On January 15, a salesperson affiliated with that
  broker begins working for a different licensed broker. Under Mich. Admin. Code R 339.22219(2),
  when may the department issue a new license to the salesperson without charge?
options:
  - Only if the new license is issued during the same term as the original license.
  - Immediately upon employment with the new broker, without any additional fee.
  - After a mandatory 30‑day waiting period and payment of a processing fee.
  - Only after the broker’s license is reinstated and the salesperson has completed additional
    education.
key: A
explanation: Under R 339.22219(2), a new license without charge is issued only if the license is
  issued during the same term as the original license. The scenario does not provide term
  information, but the rule limits the free license to that condition. The distractor suggesting
  immediate issuance ignores the term requirement.
