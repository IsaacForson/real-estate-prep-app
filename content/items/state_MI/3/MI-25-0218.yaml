stem: Under Mich. Comp. Laws § 339.2518(b), a licensee is **NOT** liable for failure to disclose
  which of the following?
options:
  - That the property has a leaking roof
  - That the property was the site of a homicide
  - That the property has termites
  - That the property is subject to a mechanic's lien
key: B
explanation: The statute expressly exempts licensees from liability for failure to disclose that the
  property was or was suspected to have been the site of a homicide, suicide, or other occurrence
  prohibited by law with no material effect on the property, whereas a leaking roof is a material
  condition that must be disclosed under the seller disclosure act, so failure to disclose it could
  lead to liability.
