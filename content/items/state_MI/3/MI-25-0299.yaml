stem: A property manager acting for a landlord collects rent from a tenant and also negotiates a
  lease renewal with the same tenant without informing either party. Under Mich. Comp. Laws §
  339.2512(1)(a), is this conduct prohibited?
options:
  - Yes, because the property manager acted for more than one party without their knowledge.
  - No, because property management is exempt from the prohibition.
  - Yes, because the property manager failed to provide written agency disclosure.
  - No, because the tenant consented to the arrangement verbally.
key: B
explanation: The rule prohibits acting for more than one party without knowledge, except in cases
  involving property management. Since the scenario involves property management, the prohibition
  does not apply. The 'Yes, because the property manager acted for more than one party without their
  knowledge' distractor is incorrect because it ignores the property management exception.
