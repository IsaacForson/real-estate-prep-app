stem: A real estate salesperson places an online advertisement offering to lease a client's
  condominium, using only the salesperson's name and phone number. The salesperson does not own the
  condominium. Under Michigan's occupational code, is this advertisement permissible?
options:
  - The advertisement is permissible because the salesperson used their own name
  - The advertisement is impermissible because the salesperson is not the owner of the property
  - The advertisement is permissible because the property is a condominium
  - The advertisement is impermissible because the salesperson did not include the broker's
    telephone number
key: B
explanation: MCL 339.2512(4) prohibits a salesperson from advertising real property for rent or
  lease under his or her own name unless the salesperson is the owner of the property. Since the
  salesperson does not own the condominium, the advertisement is impermissible.
