stem: A licensee wishes to act as a transaction coordinator in a residential sale. According to
  Mich. Comp. Laws § 339.2517(5), what must the licensee do before providing transaction
  coordination services?
options:
  - Provide proper notice to all parties to the transaction
  - Obtain written consent from the buyer and seller
  - Disclose the agency relationship in writing to the client
  - Submit a transaction coordination form to the department
key: A
explanation: The statute states that a licensee may act as a transaction coordinator upon proper
  notice to all parties to a real estate transaction; therefore providing such notice is required.
  Obtaining written consent or submitting a form to the department is not mandated by this
  provision.
