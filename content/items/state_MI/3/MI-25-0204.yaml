stem: A real estate school offering a distance learning prelicensure course holds ARELLO
  certification as a secondary provider. If the ARELLO certification is withdrawn, what happens to
  the school's approval to offer distance learning courses under Michigan's administrative rules?
options:
  - The approval to offer distance learning courses continues unaffected because the school can
    self-certify
  - The approval to offer distance learning courses is automatically transferred to another
    ARELLO-certified provider
  - The approval to offer distance learning courses is suspended until ARELLO certification is
    reinstated or the school obtains department approval
  - The approval to offer distance learning courses is revoked permanently and cannot be reinstated
key: C
explanation: Under R 339.22626(3)(b), withdrawal or expiration of ARELLO certification suspends the
  approval to offer distance learning courses until certification is reinstated or the school
  secures department approval under subrule (4). The other options misstate the consequence.
