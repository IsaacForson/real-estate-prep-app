stem: A licensee represents both the buyer and the seller in a residential sale without informing
  either party. Under MCL 339.2512(1)(a), what is the consequence?
options:
  - Resulting in no violation if the parties later consent
  - Resulting in permissible representation because the licensee is a property manager
  - Resulting in penalties under article 6 of the occupational code
  - Resulting in permissible dual agency with written consent
key: C
explanation: MCL 339.2512(1)(a) provides that, except in property management, a licensee who acts
  for more than one party in a transaction without the knowledge of the parties is subject to the
  penalties set forth in article 6 of the occupational code. Because the licensee represented both
  buyer and seller in a residential sale without informing either party, the licensee incurs those
  penalties. The option stating that resulting in no violation if the parties later consent is
  incorrect because written consent after the fact does not negate the lack of knowledge at the time
  of representation. The option stating that resulting in permissible representation because the
  licensee is a property manager is incorrect as the scenario involves a residential sale, not
  property management. The option stating that resulting in permissible dual agency with written
  consent is incorrect because dual agency requires informed consent before representation, not
  after the fact.
