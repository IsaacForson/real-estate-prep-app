stem: A Michigan real estate broker adopts an assumed name 'Lakeview Realty' on April 10. According
  to Michigan's occupational code, by what date must the broker notify the department of this
  assumed name?
options:
  - April 10
  - April 30
  - May 10
  - May 20
key: C
explanation: The statute requires a broker to notify the department within 30 days after adopting an
  assumed name (or with the license application, whichever is earlier). Adding 30 days to April 10
  gives May 10, so that is the deadline. April 30 is only 20 days after adoption, which is too
  early; May 20 is 40 days after adoption, which exceeds the allowed period.
