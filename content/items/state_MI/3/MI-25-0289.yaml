stem: A buyer requests that the broker waive the service of 'Acceptance of delivery and presentation
  of offers and counteroffers to buy, sell, or lease your property' in a limited service agreement.
  According to Mich. Comp. Laws § 339.2517(4), is this waiver permissible?
options:
  - No, because limited service agreements cannot waive any services
  - Yes, because that service is explicitly listed as eligible for waiver
  - Yes, but only if the buyer also waives the other two services
  - No, because that service is not listed as eligible for waiver
key: B
explanation: The limited service agreement form enumerates ‘Acceptance of delivery and presentation
  of offers and counteroffers’ as a service that may be waived. The distractor claiming the service
  is not listed contradicts the explicit enumeration in the statute.
