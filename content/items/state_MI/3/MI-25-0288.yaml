stem: Unless knowingly waived by execution of a limited service agreement, what must a real estate
  broker or salesperson provide to the client at a minimum according to Mich. Comp. Laws §
  339.2517(2)?
options:
  - The duties described in § 2512d(2) and the services described in § 2512d(3)
  - The duties described in § 2512d(3) and the services described in § 2512d(2)
  - The duties described in § 2512d(1) and the services described in § 2512d(3)
  - The duties described in § 2512d(2) and the services described in § 2512d(4)
key: A
explanation: The statute explicitly states that, absent a knowing waiver via a limited service
  agreement, the licensee must provide the duties in §2512d(2) and the services in §2512d(3). The
  distractor focusing only on reasonable care and skill omits the required services and other
  duties.
