stem: A real estate school plans to have an instructor begin teaching an approved prelicensure
  course on August 15. By what date must the school submit the instructor's qualifications to the
  department to comply with Michigan's administrative rules?
options:
  - June 16
  - June 1
  - July 1
  - July 16
key: A
explanation: The rule requires submission of instructor qualifications at least 60 days before
  instruction begins. Counting back 60 days from August 15 gives June 16 as the latest date that
  satisfies this requirement. June 1 is earlier than necessary but still meets the rule; however,
  the question asks for the deadline, so June 16 is correct. July 1 and July 16 fall after the
  60‑day cutoff and would violate the rule.
