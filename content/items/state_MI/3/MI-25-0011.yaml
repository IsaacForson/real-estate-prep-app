stem: Under Michigan's real estate administrative rules, what is a licensee prohibited from doing
  when seeking to secure a commission for an owner, seller, or buyer?
options:
  - Charging a flat referral fee approved in advance by the employing broker
  - Becoming a party to a net service provision agreement
  - Negotiating the commission rate directly with the client
  - Advertising the property in a local print publication
key: B
explanation: The administrative rule prohibits a licensee from becoming a party to a net service
  provision agreement for an owner, seller, or buyer as a means of securing a real estate
  commission.
citation:
  source: Mich. Admin. Code, Rule 339.22315
  url: null
  quoted_text: |-
    A licensee shall not become a party to a net service provision agreement
    for an owner, seller, or buyer as a means of securing a real estate commission.
