stem: According to Michigan's occupational code, what must a real estate salesperson include in any
  advertisement for real property?
options:
  - A salesperson must include the business name of the employing broker in larger type size than
    the salesperson's name, as required by the advertising rules, and must be displayed in all
    media.
  - A salesperson must include the telephone number or street address of the employing broker only,
    as required by the advertising rules, and must be displayed in all media.
  - A salesperson must include the salesperson's own name and telephone number, as permitted when
    advertising the principal residence, and must be displayed in all media.
  - A salesperson must include the telephone number or street address of the employing broker and
    the business name of the employing broker in equal or greater type size than the name of the
    associate broker, salesperson, or cooperating group.
key: D
explanation: The occupational code (MCL 339.2512) requires that any advertisement placed by a real
  estate salesperson include both the telephone number or street address of the employing broker and
  the business name of the employing broker. These items must be presented in type size that is
  equal to or larger than the salesperson’s name. An option that states the salesperson must include
  only the salesperson’s own name and telephone number fails to include the broker’s required
  information. An option that requires only the broker’s telephone number or street address omits
  the broker’s business name. An option that requires the broker’s business name in larger type than
  the salesperson’s name but does not mention the broker’s telephone number or street address leaves
  out a required element. Only the option that includes both the broker’s telephone number or street
  address and the broker’s business name, displayed in type size equal to or greater than the
  salesperson’s name, satisfies the statutory requirement.
