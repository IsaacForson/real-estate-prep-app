stem: A right-to-list home sale agreement is in writing, signed by only one of two co-owners, for a
  period of 18 months, and includes the required early termination option and explanation on the
  first page. Is the agreement enforceable under Michigan's occupational code?
options:
  - The agreement is not enforceable because it lacks a written termination option
  - The agreement is enforceable because it is in writing and includes the required termination
    option
  - The agreement is not enforceable because it is not signed by all owners
  - The agreement is enforceable because the period is less than 2 years
key: C
explanation: The statute provides that a right-to-list home sale agreement is void and unenforceable
  if it is not signed by all owners with an ownership interest. The distractor claiming
  enforceability because the agreement is in writing and includes the termination option ignores the
  signature requirement.
