stem: "A licensee shows a property to a prospective buyer but does not provide a written agency
  disclosure before discussing the property's price. According to the Michigan Occupational Code,
  this conduct:"
options:
  - Is permitted if the licensee later provides the disclosure.
  - Is only a violation if the buyer signs a purchase agreement.
  - Is a violation subject to penalties under article 6.
  - Is allowed because the buyer is not yet a client.
key: C
explanation: Subsection (1)(b) of section 339.2512 states that a licensee who does not provide a
  written agency disclosure to a prospective buyer or seller in a real estate transaction is subject
  to the penalties set forth in article 6. The scenario describes exactly that omission, so it is a
  violation. The distractors incorrectly suggest the disclosure can be delayed, that the buyer’s
  status matters, or that a purchase agreement is required for the violation to occur.
