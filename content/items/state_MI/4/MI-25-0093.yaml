stem: A broker hires an associate broker as a designated agent for a buyer client but does not
  execute a written designated agency agreement. According to Mich. Comp. Laws § 339.2517(6), what
  is the client's agency relationship?
options:
  - The client has an agency relationship only with the designated associate broker
  - The client has an agency relationship with the broker and all affiliated licensees
  - The client has no agency relationship until a written agreement is signed
  - The client has a dual agency relationship with the broker and the associate broker
key: B
explanation: Mich. Comp. Laws § 339.2517(6) provides that when no written designated agency
  agreement is executed, the client is deemed to have an agency relationship with the broker and all
  affiliated licensees. The option stating that the client’s relationship is limited to the
  designated associate broker is incorrect because the law treats the broker and all affiliated
  licensees as the client’s agents. The option claiming no relationship exists without a written
  agreement contradicts the statute, which creates the relationship by default. The option
  describing a dual agency relationship is inaccurate because dual agency requires the client’s
  informed consent to represent both parties, which is not established here.
