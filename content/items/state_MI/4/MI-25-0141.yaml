stem: "A broker signs an agreement with a salesperson stating that the broker cannot give the
  salesperson instructions on how to show properties. According to Mich. Comp. Laws § 339.2512f(2),
  this agreement is:"
options:
  - The agreement is allowed because the salesperson provides written consent to the broker
  - The agreement is permissible because it outlines the salesperson's independent duties
  - The agreement is prohibited because it limits the broker's authority to supervise the salesperson
  - The agreement is valid because it applies only to salespersons with fewer than two years of
    experience
key: C
explanation: The key is correct because subsection (2) prohibits a broker from contracting with a
  salesperson in a manner that limits the broker's authority to supervise the salesperson.
  Distractor C is tempting but incorrect because consent does not override the statutory prohibition
  on limiting supervisory authority.
