stem: A broker employs a salesperson but never reviews the salesperson's reports. According to Mich.
  Comp. Laws § 339.2512f(1), which statement is correct?
options:
  - The broker is compliant because maintaining direct communication fulfills all supervision
    obligations
  - The broker is violating supervision because review of the salesperson's reports is required
  - The broker may delegate report review to an associate broker to fulfill supervision duties
  - The broker is exempt from supervision if the salesperson has over two years experience
key: B
explanation: Mich. Comp. Laws § 339.2512f(1) requires that a broker review the salesperson's reports
  as part of supervision; failing to do so violates the requirement. The statement that the broker
  is compliant because maintaining direct communication fulfills all supervision obligations is
  incorrect because direct communication alone does not satisfy all supervision duties.
