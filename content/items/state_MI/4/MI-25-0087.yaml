stem: A seller enters into a limited service agreement with a broker under Mich. Comp. Laws §
  339.2517(2). Which of the following services may **NOT** be waived by the seller?
options:
  - Acceptance of delivery and presentation of offers
  - Assistance in developing and presenting offers
  - Marketing of the client's property as agreed
  - Assistance after execution to complete transaction
key: C
explanation: Subsection (2) states that, unless knowingly waived by a limited service agreement, a
  broker must provide the services described in section 2512d(3). The limited service agreement
  provision (subsection 4) specifies that only the services under section 2512d(3)(b), (c), and (d)
  may be waived. Marketing of the client's property corresponds to subsection (2)(a) and therefore
  may not be waived. The other three options correspond to waivable services (b), (c), and (d).
