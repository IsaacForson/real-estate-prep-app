stem: According to Mich. Comp. Laws § 339.2517(11)(a), how is the term "affiliated licensees" defined?
options:
  - Individuals licensed as salespersons or associate brokers who are supervised by a managing broker
  - Individuals licensed as salespersons or associate brokers who have passed the state exam within
    the last year
  - Individuals licensed as salespersons or associate brokers who work independently of any broker
  - Individuals licensed as salespersons or associate brokers who are employed by the same broker
key: D
explanation: The definition of affiliated licensees is individuals licensed as salespersons or
  associate brokers who are employed by the same broker. The option stating they are supervised by a
  managing broker adds a supervision requirement that is not in the statute. The option stating they
  have passed the state exam within the last year adds a recency condition that is not part of the
  definition. The option stating they work independently of any broker contradicts the definition,
  which requires employment by the same broker.
