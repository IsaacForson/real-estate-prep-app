stem: Under Mich. Comp. Laws § 339.2512f(1), which of the following is included in the supervision
  of a real estate salesperson?
options:
  - Maintaining direct communication in person or by radio, telephone, or electronic communication
    on a regular basis
  - Setting the salesperson's commission split and ensuring timely payments to the broker
  - Providing the salesperson with a company vehicle and covering all associated insurance costs
  - Approving the salesperson's personal time off and coordinating coverage with other licensees
key: A
explanation: The key is correct because subsection (1)(a) explicitly lists direct communication in
  person or by radio, telephone, or electronic communication on a regular basis as part of
  supervision. The most tempting distractor, B, is incorrect because setting commission splits is
  not mentioned as a supervisory duty in the statute.
