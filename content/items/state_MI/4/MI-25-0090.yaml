stem: A broker receives notice on Tuesday that an offer to purchase a client's property has been
  accepted by all parties. According to the Michigan Occupational Code, by what deadline must the
  broker deposit the client's earnest money into a separate custodial trust or escrow account?
options:
  - By the end of Wednesday.
  - By the end of Thursday.
  - By the end of Sunday.
  - By the end of Saturday.
key: B
explanation: The rule requires deposit not later than 2 banking days after notice of acceptance.
  Tuesday notice makes Wednesday and Thursday the two banking days, so the deposit must be made by
  the end of Thursday. The other options either ignore the 2‑day requirement or incorrectly count
  weekends as banking days.
