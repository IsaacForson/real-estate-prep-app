stem: A real estate broker compensates an associate broker with a written agreement stating the
  associate is not an employee for tax purposes, but only 50% of the associate’s annual compensation
  comes from sales commissions. According to the Michigan Occupational Code, does this relationship
  qualify as an independent contractor relationship?
options:
  - No, because the associate receives any commission income
  - No, because less than 75% of compensation is from commissions
  - No, because the broker pays a salary instead of commissions
  - No, because a written agreement does not exist
key: B
explanation: For an independent contractor relationship under Mich. Comp. Laws § 339.2501(h), both a
  written tax‑nonemployee agreement and at least 75% of annual compensation from commissions are
  required. Here the associate receives only 50% from commissions, so the second condition fails;
  therefore the relationship does not qualify as an independent contractor.
