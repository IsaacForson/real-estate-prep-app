stem: According to the Michigan Occupational Code, what is a service provision agreement?
options:
  - A buyer agency agreement or listing agreement executed by a real estate broker and a client that
    establishes an agency relationship
  - A period of 50 to 60 minutes of actual classroom instruction, not including outside assignments
    and reading
  - A written service provision agreement where a broker and client establish an agency relationship
    but waive certain enumerated services in whole or in part.
  - A written agreement in which the real estate broker does not consider the associate real estate
    broker as an employee for federal and state income tax purposes
key: A
explanation: "The definition states that a service provision agreement is a buyer agency agreement
  or listing agreement executed by a real estate broker and a client that establishes an agency
  relationship. The other options describe different concepts: an independent‑contractor
  relationship condition, a clock‑hour classroom requirement, and a limited‑service agreement that
  waives certain services."
