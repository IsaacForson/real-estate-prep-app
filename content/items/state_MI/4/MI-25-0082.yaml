stem: "A real estate broker and a client sign a written service provision agreement that establishes
  an agency relationship but specifies that the client knowingly waives the broker's duty to conduct
  property showings. Under the Michigan Occupational Code, this agreement is best described as:"
options:
  - A service provision agreement
  - A limited service agreement
  - A independent contractor relationship
  - A principal-broker employment contract
key: B
explanation: The definition of a limited service agreement covers a written service provision
  agreement where the client knowingly waives certain enumerated services. Waiving property showings
  falls under such a waiver, making it a limited service agreement. A plain service provision
  agreement does not involve waived services.
