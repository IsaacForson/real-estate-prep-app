stem: Under the Michigan Occupational Code, which of the following is a duty that a licensee acting
  under a service provision agreement owes to a client?
options:
  - The duty is to advertise the property as 'for sale by owner'.
  - The duty is to provide property management services.
  - The duty is loyalty to the interest of the client.
  - The duty is to deposit earnest money in a personal account.
key: C
explanation: The duty of loyalty to the interest of the client is expressly listed in subsection
  (2)(c) of section 339.2512d as a duty owed by a licensee under a service provision agreement. The
  distractor about providing property management services is incorrect because property management
  duties are governed by section 339.2512c, not by the service provision agreement duties.
