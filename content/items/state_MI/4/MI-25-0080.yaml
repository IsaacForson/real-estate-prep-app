stem: Under Mich. Comp. Laws § 339.2517(9), a designated agent who represents a client in an agency
  capacity may disclose confidential information to which of the following without breaching any
  duty?
options:
  - Only a branch office manager
  - Only a supervisory broker
  - Only a licensed assistant
  - Only a managing broker
key: B
explanation: Subsection (9) states that a designated agent shall not disclose confidential
  information to any licensee, whether or not an affiliated licensee, except that the agent may
  disclose to any supervisory broker for the purpose of seeking advice or assistance for the benefit
  of the client. Therefore, disclosure only to a supervisory broker is permitted. Disclosure to any
  affiliated licensee or any licensee is prohibited unless the recipient is a supervisory broker.
