stem: A licensee meets a potential buyer at an open house and begins discussing the buyer's
  preferences and budget. According to Mich. Comp. Laws § 339.2517(1), when must the licensee
  disclose the types of agency relationships available and the duties each creates?
options:
  - The licensee must disclose before the buyer shares any confidential information
  - The licensee must disclose after the buyer shares confidential information
  - The licensee must disclose when presenting the first property to the buyer
  - The licensee must disclose only after the buyer signs a purchase agreement
key: A
explanation: MCL 339.2517(1) requires the licensee to disclose all available agency relationships
  and the duties each creates before the potential buyer or seller shares any confidential
  information with the licensee. Stating that disclosure should occur after the buyer shares
  confidential information reverses the required timing and is incorrect. Stating that disclosure
  should occur when presenting the first property or only after signing a purchase agreement adds
  conditions not found in the statute.
