stem: "A licensee assists a client in leasing a single-family home for one year. Under the
  Elliott-Larsen Civil Rights Act, this activity is considered:"
options:
  - A loan origination activity
  - A prohibited discriminatory act
  - A real estate transaction
  - A security deposit arrangement
key: C
explanation: The Elliott-Larsen Civil Rights Act defines a real estate transaction as the sale,
  exchange, rental, or lease of real property, or an interest in real property. Leasing a
  single-family home is a lease of real property, thus it qualifies as a real estate transaction.
  The activity is not inherently discriminatory, nor does it involve a security deposit or loan
  origination.
