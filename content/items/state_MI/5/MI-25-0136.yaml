stem: Under Michigan's usury act, which of the following is considered a reasonable and necessary
  charge that a lender may require a borrower to pay in addition to interest?
options:
  - Recording fees
  - Interest over 7%
  - Prepayment penalty 2%
  - Monthly service fee
key: A
explanation: The statute defines reasonable and necessary charges as recording fees; title
  examination or title insurance; the preparation of a deed, appraisal, or credit report; plus a
  loan processing fee. Recording fees are explicitly listed. Interest over 7% exceeds the usury
  limit, a prepayment penalty of 2% exceeds the allowed 1%, and a monthly service fee is not
  enumerated as a permissible charge.
