stem: A tenant has occupied a rental unit for 14 months and obtains a physician's notarized
  statement stating they are incapable of living independently. Under Michigan law, how may the
  tenant terminate the lease?
options:
  - A. By giving 60-day written notice to the landlord
  - B. By giving 30-day written notice to the landlord
  - C. By giving 90-day written notice to the landlord
  - D. By giving immediate notice to the landlord
key: A
explanation: Under Mich. Comp. Laws § 554.601a(1)(b), a tenant who becomes incapable of living
  independently, as certified by a physician in a notarized statement, may terminate the lease by
  giving 60-day written notice to the landlord. The option stating that the tenant may give
  immediate notice is incorrect because the rule requires a 60-day notice period; immediate
  termination is not permitted.
