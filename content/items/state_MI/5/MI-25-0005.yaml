stem: A tenant has occupied a rental unit for 14 months and becomes eligible for a subsidized senior
  citizen housing unit during the lease term. Under Michigan law, how may the tenant terminate the
  lease?
options:
  - By subletting the unit to a new replacement tenant approved in writing by the landlord
  - By giving 60 days' written notice after occupying the unit for more than 13 months
  - By paying the remaining rent balance in full before vacating the premises
  - By giving the landlord 30 days' written notice at any point during the lease term
key: B
explanation: Michigan law requires a rental agreement to allow a tenant who has occupied the unit
  for more than 13 months to terminate the lease with 60 days' written notice once the tenant
  becomes eligible for subsidized senior citizen housing and provides proof of that eligibility.
citation:
  source: Mich. Comp. Laws § 554.601a
  url: null
  quoted_text: >-
    A rental agreement shall provide that a tenant who has occupied a rental unit for more than 13

