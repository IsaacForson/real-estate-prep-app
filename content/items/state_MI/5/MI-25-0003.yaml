stem: Under the Elliott-Larsen Civil Rights Act, how is a real estate broker or salesperson defined
  for purposes of real estate transactions?
options:
  - A person licensed by the state who lists, sells, exchanges, rents, or leases real property for
    consideration
  - A person who holds an ownership interest in real property offered for sale to the public
  - A person employed exclusively by a broker to manage property for a fixed annual salary
  - A person, whether licensed or not, who lists, sells, or leases real property for consideration
key: D
explanation: The act defines a real estate broker or salesperson broadly as a person, whether
  licensed or not, who lists, sells, purchases, exchanges, rents, or leases real property for the
  expectation of consideration.
citation:
  source: Mich. Comp. Laws § 37.2501
  url: null
  quoted_text: >-
    "Real estate broker or salesperson" means a person, whether licensed or not, who, for or with
    the expectation

    of receiving a consideration, lists, sells, purchases, exchanges, rents, or leases real property
