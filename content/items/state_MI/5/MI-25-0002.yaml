stem: Which payment is excluded from the definition of a security deposit under Michigan's
  landlord-tenant statute?
options:
  - An amount paid as prepayment of the first full rental period under the lease agreement
  - An amount paid in excess of the average rent charged for the remaining lease term
  - An amount paid for an option to purchase, absent intent to evade the act
  - An amount held by the landlord as a condition of returning the unit in required condition
key: C
explanation: The statute excludes from the security deposit definition an amount paid for an option
  to purchase under a lease with an option to purchase, unless the tenant shows the payment was
  intended to evade the act.
