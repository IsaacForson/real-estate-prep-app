stem: Under Michigan's security deposit statute, a person authorized to manage a rental unit is
  treated as a landlord if that person does which of the following?
options:
  - Occupies the unit as a tenant while forwarding collected rent to the recorded owner
  - Acts as a rental agent or receives rent, other than as a bona fide purchaser
  - Purchases the rental unit in good faith and collects rent as a bona fide purchaser
  - Inspects the rental unit periodically without collecting rent or other fees
key: B
explanation: The statute defines a landlord to include a person authorized to manage the premises
  who acts as a rental agent or receives rent, other than as a bona fide purchaser, and who has no
  obligation to forward the receipts to someone else.
citation:
  source: Mich. Comp. Laws § 554.601
  url: null
  quoted_text: A person authorized to exercise any aspect of the management of the premises, including
    a person that, directly or indirectly, acts as a rental agent or receives rent, other than as a
    bona fide purchaser, and that has no obligation to deliver the receipts to another person.
