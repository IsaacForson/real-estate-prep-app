stem: A lender requires a borrower to maintain an interest-bearing deposit account as a condition of
  a mortgage loan secured by a rental property (non-owner-occupied). Under Michigan's usury act, is
  this requirement permissible?
options:
  - Yes, because any lender may require such an account as additional security
  - No, because subsection (13) applies only to owner-occupied dwelling loans
  - Yes, because the account serves as additional security for the loan
  - No, because the borrower must maintain excess funds in the account
key: B
explanation: Subsection (13) permits an interest‑bearing deposit account only when the primary
  security is a dwelling to be occupied by the owner. Because the property is a rental
  (non‑owner‑occupied), the requirement is not allowed. The options stating that the requirement is
  permissible because any lender may require such an account as additional security, and that the
  account serves as additional security for the loan, overlook the owner‑occupancy limitation, and
  the option stating that the borrower must maintain excess funds in the account adds an unrelated
  requirement.
citation:
