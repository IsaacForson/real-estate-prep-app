stem: Under Mich. Comp. Laws § 438.31c(15), which entity may require a borrower to maintain an
  interest-bearing account for the purpose of making biweekly payments?
options:
  - a mortgage broker licensed under the occupational code who arranges the loan for the borrower,
    negotiates terms with lenders, and collects fees for services rendered, yet possesses no
    statutory power to mandate that the borrower maintain an interest-bearing account for biweekly
    payments.
  - a title insurance company issuing the policy for the real estate transaction being financed,
    which is licensed under Michigan law to protect the lender against any title defects and to
    ensure that the mortgage loan is secured by a clear and marketable title throughout the life of
    the loan, and also provides coverage for any liens or encumbrances that may arise after closing,
    thereby safeguarding the lender's investment.
  - a regulated depository financial institution or its service corporations, subsidiaries or
    affiliates may require, or may have required, as a condition of the making of the mortgage loan
    or land contract, that the borrower maintain an interest bearing account with any depository
    institution for the purpose of making the biweekly payments.
  - a real estate salesperson acting as a dual agent in the transaction for the buyer and seller,
    who is licensed under the Michigan Occupational Code to facilitate negotiations and disclose
    confidential information, but who lacks any authority to impose financial conditions such as
    requiring an interest-bearing account for biweekly payments.
key: C
explanation: Subsection (15) expressly permits a regulated depository financial institution or its
  service corporations, subsidiaries or affiliates to require an interest-bearing account for
  biweekly payments, making the option that describes a regulated depository financial institution
  or its service corporations, subsidiaries or affiliates correct. The option that describes a
  mortgage broker is incorrect because the statute does not authorize a mortgage broker to impose
  such a requirement.
