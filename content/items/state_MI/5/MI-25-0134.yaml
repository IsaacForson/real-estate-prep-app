stem: A lender requires a borrower to pay two discount points as a condition of making a loan
  secured by a single-family owner-occupied dwelling. The loan is not being made to qualify for sale
  under any federal program. Under Michigan's usury act, is this practice permitted?
options:
  - Yes, because the lender may collect any fees, discounts, or points as a condition of the loan
  - No, because points are considered interest and exceed the statutory rate limit
  - Yes, because discount points are permitted as a condition of the loan
  - No, because points as a condition are prohibited except for federal program loans
key: D
explanation: The statute prohibits imposing points as a condition of making a loan unless the points
  are required to qualify the loan for sale under a federal program. Since this loan is not for such
  a program, the practice is not permitted. Claims that points are always allowed are incorrect, and
  the claim that points are considered interest is also incorrect.
citation:
