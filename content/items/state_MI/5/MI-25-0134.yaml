  url: null
  quoted_text: except that a lender may impose and collect, as a condition of making a loan, all fees,
    discounts, points, or other charges that lenders are permitted or required to impose, collect,
    or pay in order to qualify the loan for sale, in whole or in part, or in order to obtain a
    purchase commitment, under any program authorized by federal statute or regulation.
