stem: A condominium developer's disclosure statement omits a material fact, causing the remaining
  statements to appear misleading in context. Under the Condominium Act, has the developer violated
  the disclosure requirements?
options:
  - No, because the act prohibits affirmative misstatements but does not address omissions of fact
  - No, because disclosure statements are advisory and impose no binding legal duty on the developer
  - Yes, because an omission that renders the statements misleading is itself a violation
  - Yes, but a violation requires proof that the developer acted with malicious intent
key: C
explanation: The Condominium Act prohibits a developer from omitting a material fact when the
  omission makes the required disclosures misleading in light of the circumstances, so the omission
  itself is a violation regardless of the developer's intent.
citation:
  source: Mich. Comp. Laws § 559.184a
  url: null
  quoted_text: |-
    With regard to any documents required under this section, a developer shall not make an
    untrue statement of a material fact or omit to state a material fact necessary in order to make
    the statements made, in the light of the circumstances under which they were made, not
    misleading.
