stem: Under Mich. Comp. Laws § 438.31c(2)(c), a lender charges a prepayment fee equal to 2% of the
  prepayment amount made 18 months after the loan date. Which statement correctly describes the
  legality of this fee?
options:
  - The fee is permitted because any prepayment fee is allowed within the first three years.
  - The fee is permitted because the fee is less than 5% of the prepayment amount.
  - The fee is not permitted because prepayment fees are prohibited after the first year.
  - The fee is not permitted because it exceeds the 1% maximum allowed for prepayments made within
    three years.
key: D
explanation: The statute limits prepayment fees to no more than 1% of the prepayment amount if made
  within three years of the loan date; any higher fee is impermissible. Because the fee is 2% and
  the prepayment occurred at 18 months (within the three‑year window), it exceeds the allowed
  maximum. The statement that any prepayment fee is allowed within the first three years misstates
  the 1% cap.
