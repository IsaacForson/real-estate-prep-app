stem: A Michigan lender makes 12 mortgage loans in a calendar year. Under Mich. Comp. Laws §
  438.31c(14), what is the maximum number of those loans for which the lender may require an
  interest-bearing deposit account as a condition?
options:
  - 3 loans
  - 2 loans
  - 4 loans
  - 5 loans
key: B
explanation: Under subsection (14), a lender may not require a deposit account on more than 20% of
  its loans; 20% of 12 loans is 2.4, so the maximum whole number not exceeding that limit is 2
  loans. Therefore the choice stating '2 loans' is correct. The choice stating '3 loans' would be
  25%, exceeding the permitted percentage.
