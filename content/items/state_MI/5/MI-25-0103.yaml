  quoted_text: A lender or seller who offers 5 or more mortgages or land contracts in any 1 calendar
    year may not require a deposit account established pursuant to subsection (13) as a condition of
    making a mortgage or land contract on more than 20% of the mortgages or land contracts made by
    the lender or seller in any 1 calendar year.
