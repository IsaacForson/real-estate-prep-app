stem: "A lender wishes to charge a loan processing fee in addition to interest on a mortgage loan.
  Under Mich. Comp. Laws § 438.31a, the fee is permissible if it is:"
options:
  - A fee that is considered a discount or point charged to increase the lender's yield, which under
    the statute is treated as an illegal usury charge.
  - A fee that is considered a reasonable and necessary actual expense incurred by the lender in
    connection with the loan.
  - A fee that is considered a prepayment penalty for early loan payoff, which is prohibited as a
    charge separate from interest.
  - A fee that is considered part of the interest subject to the 7% statutory limit, meaning it
    would be counted toward the usury cap and thus not permissible as a separate processing fee.
key: B
explanation: MCL 438.31a permits a lender to collect a loan‑processing fee when the fee is a
  reasonable and necessary actual expense incurred in connection with the loan. Such fees are listed
  among the permissible charges and are not counted toward the 7 % usury ceiling. Charges that are
  merely discounts, points, or prepayment penalties are not included in the definition of reasonable
  and necessary charges and therefore cannot be charged in addition to interest.
