stem: A seller conveys a lot in an unincorporated area that abuts a road that has not been accepted
  as a public road. The seller fails to provide the purchaser with a written disclosure that the
  road is private and not maintained by the county road commission. Under the Land Division Act,
  what is the legal effect of the sale contract?
options:
  - The contract is void unless ratified by both parties
  - The contract is binding and cannot be rescinded
  - The contract is voidable at the option of the purchaser
  - The contract is enforceable but the seller may be fined
key: C
explanation: The Land Division Act requires a written disclosure that the road is private and not
  maintained by the county road commission; failure to do so makes any contract or agreement of sale
  entered into in violation voidable at the option of the purchaser. Thus the contract is voidable,
  not automatically void. The other options misstate the remedy.
