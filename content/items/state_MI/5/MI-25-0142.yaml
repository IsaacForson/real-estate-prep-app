stem: Which of the following best describes senior citizen housing under Michigan's Landlord-Tenant Act?
options:
  - C. Housing for individuals 62 years of age or older that receives no government subsidy but is
    privately owned
  - B. Housing for individuals 55 years of age or older that is privately owned and receives no
    government assistance
  - D. Housing for individuals 62 years of age or older that is owned and managed by a nonprofit
    corporation
  - A. Housing for individuals 62 years of age or older that is subsidized in whole or in part under
    any local, state, or federal program
key: D
explanation: Under Mich. Comp. Laws § 554.601(e), senior citizen housing is defined as housing for
  individuals 62 years of age or older that is subsidized in whole or in part under any local,
  state, or federal program. The option describing housing for individuals 55 years of age or older
  that is privately owned and receives no government assistance does not meet the age or subsidy
  requirement.
