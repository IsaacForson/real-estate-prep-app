stem: What is the maximum interest rate that parties may stipulate in writing under Michigan's usury
  statute?
options:
  - 7% per annum
  - 8% per annum
  - 5% per annum
  - 6% per annum
key: A
explanation: The statute expressly allows parties to agree in writing to any rate of interest not
  exceeding 7% per annum. Any rate above this limit would violate the usury statute unless an
  specific exemption applies. The 8% per annum option exceeds the statutory maximum and is therefore
  not permitted.
