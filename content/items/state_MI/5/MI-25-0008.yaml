stem: Before selling a residential condominium unit, what must a developer provide to a prospective
  purchaser under the Condominium Act?
options:
  - Copies of the recorded master deed, purchase agreement, and disclosure statement
  - A verbal summary of the association's bylaws presented at the closing table
  - A credit report and income verification prepared for the prospective purchaser
  - A certificate of occupancy issued by the municipality within the preceding 30 days
key: A
explanation: The Condominium Act requires a developer to give a prospective purchaser of a
  residential condominium unit copies of the recorded master deed, a conforming purchase agreement,
  a condominium buyer's handbook, and a disclosure statement about the project.
citation:
  source: Mich. Comp. Laws § 559.184a
  url: null
  quoted_text: |-
    The developer shall provide copies of all of the following documents to a prospective
    purchaser of a condominium unit, other than a business condominium unit
