stem: Under Michigan's Landlord-Tenant Act, which of the following is included in the definition of
  'senior citizen housing'?
options:
  - Housing for individuals 62 years of age or older that is subsidized in whole or in part under
    any local, state, or federal program
  - Housing for individuals 55 years of age or older that is privately owned and market-rate for sale
  - Housing for individuals 65 years of age or older that receives no government assistance
    whatsoever
  - Housing for individuals 60 years of age or older that is owned by a nonprofit organization in
    the community
key: A
explanation: The statute defines senior citizen housing as housing for individuals 62 years of age
  or older that is subsidized in whole or in part under any local, state, or federal program. The
  correct choice matches this definition. A choice describing housing for individuals 55 years of
  age or older that is privately owned and market-rate for sale is incorrect because the age
  requirement is 62 and the housing must be subsidized. A choice describing housing for individuals
  65 years of age or older that receives no government assistance whatsoever is incorrect because
  the housing must be subsidized. A choice describing housing for individuals 60 years of age or
  older that is owned by a nonprofit organization in the community is incorrect because the housing
  must be subsidized and the age threshold is 62. (Mich. Comp. Laws § 554.601)
