stem: A lender extends a loan secured by a first lien on a single-family owner-occupied dwelling.
  Which of the following actions is prohibited under Michigan's usury act?
options:
  - Requiring borrower deposit
  - Charging a prepayment fee
  - Collecting recording fees
  - Providing settlement statement
key: A
explanation: The statute prohibits a lender from directly or indirectly requiring a deposit to be
  maintained by the borrower (other than an escrow account) as a condition of the loan for a
  single-family dwelling. Charging a prepayment fee up to 1% is allowed, collecting recording fees
  is permissible as a reasonable charge, and providing a loan settlement statement is required.
