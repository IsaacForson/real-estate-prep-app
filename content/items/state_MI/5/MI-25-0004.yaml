stem: A seller lists a lot in an unincorporated area that abuts a road never accepted as public.
  Under the Land Division Act, what must the seller do before completing the sale?
options:
  - Inform the purchaser in writing, in a separate instrument, that the road is private
  - Record a plat amendment with the county assessor before including the road in the sale
  - Obtain written approval from the county road commission before listing the lot
  - Pave the road to current public safety standards before closing the transaction
key: A
explanation: The Land Division Act requires a seller to disclose in writing, on a separate
  instrument attached to the conveyance, that an unaccepted street or road is private and not
  required to be maintained by the county road commission before selling the abutting lot.
citation:
  source: Mich. Comp. Laws § 560.261
  url: null
  quoted_text: >-
    No person shall sell any lot in a recorded plat or any parcel of unplatted land in an

    unincorporated area if it abuts a street or road which has not been accepted as public unless
    the seller first

    informs the purchaser in writing on a separate instrument to be attached to the instrument
    conveying any

    interest in such lot or parcel of land of the fact that the street or road is private and is not
    required to be

    maintained by the board of county road commissioners.
