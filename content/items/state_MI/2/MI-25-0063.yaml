stem: A licensee finds a reference to R 339.22667 in an outdated continuing‑education manual.
  According to the Michigan Administrative Code, what should the licensee do regarding this
  reference?
options:
  - The licensee should disregard the reference because the rule is rescinded
  - The licensee should follow the reference as it remains in effect
  - The licensee should seek clarification from the department before acting
  - The licensee should apply the reference only to residential transactions
key: A
explanation: Because R 339.22667 has been rescinded, it no longer has legal effect, so the licensee
  should not rely on it. Following the rescinded rule would be incorrect, and seeking clarification
  or applying it to particular transactions would also be inappropriate.
