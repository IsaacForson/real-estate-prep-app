stem: A real estate broker enters into a written agreement with an associate broker stating that the
  associate broker is not an employee for federal and state income tax purposes. Under this
  agreement, 60% of the associate broker's annual compensation comes from commissions from real
  estate sales. According to MCL 339.2501(h), does this relationship qualify as an independent
  contractor relationship?
options:
  - The relationship qualifies as an independent contractor relationship because the written
    agreement satisfies condition (i) and the commission percentage is irrelevant.
  - The relationship does not qualify as an independent contractor relationship because less than
    75% of the associate broker's compensation is from commissions, failing condition (ii).
  - The relationship does not qualify as an independent contractor relationship because the broker
    must also provide benefits to the associate broker for the relationship to qualify.
  - The relationship qualifies as an independent contractor relationship because any written
    agreement that avoids employee status automatically creates an independent contractor
    relationship.
key: B
explanation: The statute requires both a written agreement that avoids employee status and at least
  75% of compensation from commissions. While the written agreement satisfies condition (i), the 60%
  commission share fails condition (ii). Therefore the relationship does not qualify. The option
  that claims the relationship qualifies because the written agreement satisfies condition (i) and
  the commission percentage is irrelevant incorrectly ignores the commission threshold.
citation:
