stem: An individual who teaches real estate courses at a local community college but holds no real
  estate license wishes to be approved as an instructor for a prelicensure course. Under R
  339.22621(1), is this individual qualified to be an instructor?
options:
  - The individual is not qualified because department licensure is required
  - The individual is qualified because teaching at an accredited institution meets the requirement
  - The individual is qualified only if they also hold a real estate law certification
  - The individual is not qualified because a real estate license is mandatory
key: B
explanation: Rule R 339.22621(1)(a) lists teaching at an accredited institution of higher learning
  as a minimum qualification for instructors, so the individual qualifies. The distractor claiming a
  license is mandatory is wrong because the rule does not require a real estate license for
  instructor approval.
