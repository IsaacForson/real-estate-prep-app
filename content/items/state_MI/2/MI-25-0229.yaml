stem: Under MCL 339.204(2), which of the following is a valid reason for a board to waive the
  continuing education requirement for license renewal?
options:
  - The licensee failed to submit the renewal application.
  - The licensee's disability prevented attendance.
  - The licensee did not pay the renewal fee.
  - The licensee wishes to take a vacation.
key: B
explanation: The rule permits a board to waive the CE requirement if the licensee's failure to
  attend was due to disability, military service, absence from the continental United States, or
  circumstances beyond the licensee's control that the board considers sufficient cause. The
  disability scenario matches this provision. The distractor about failing to submit the renewal
  application relates to renewal timing, not a waiver basis for CE.
