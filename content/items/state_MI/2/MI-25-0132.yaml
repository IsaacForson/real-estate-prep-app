    Estate Brokers and Salespersons, MCL 339.2501–339.2518) — official Michigan Legislature
    compiled-act PDF read via Internet Archive capture of 2026-01-09 because legislature.mi.gov's
    Check Point WAF blocks scripts and headless browsers — § 339.2506"
  url: null
  quoted_text: If he or she receives notice that his or her license is suspended or revoked, a real
    estate broker who is an individual, or an associate real estate broker who is the sole associate
    real estate broker for a real estate broker that is a business entity, shall immediately forward
    to the department his or her license and pocket card, the licenses and pocket cards of all real
    estate salespersons and nonprincipal associate real estate brokers issued under the real estate
    broker, and all of the real estate broker's branch office licenses.
