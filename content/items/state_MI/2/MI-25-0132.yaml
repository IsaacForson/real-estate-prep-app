stem: A real estate broker who operates as an individual receives notice that their license has been
  suspended. According to Michigan Occupational Code Article 25, what must the broker do
  immediately?
options:
  - The broker must forward only their own license and pocket card to the department, ignoring all
    other associated personnel documents.
  - The broker must wait 45 days before forwarding any documents to the department, allowing time to
    gather all necessary paperwork.
  - The broker must notify the salespersons to forward their own pocket cards to the department,
    while retaining all branch office licenses.
  - The broker must forward their license and pocket card, the licenses and pocket cards of all
    salespersons and nonprincipal associate brokers, and all branch office licenses to the
    department.
key: D
explanation: For an individual broker (or sole associate broker) receiving notice of suspension or
  revocation, the broker must forward their license and pocket card, plus the licenses and pocket
  cards of all salespersons and nonprincipal associate brokers, and all branch office licenses to
  the department immediately (MCL 339.2506(4)). The option stating that the broker must forward
  their license and pocket card, the licenses and pocket cards of all salespersons and nonprincipal
  associate brokers, and all branch office licenses to the department correctly states this
  requirement. The option suggesting the broker forward only their own license and pocket card is
  incorrect because it omits the required forwarding of salespersons' and associate brokers'
  licenses and pocket cards, as well as branch office licenses.
citation:
