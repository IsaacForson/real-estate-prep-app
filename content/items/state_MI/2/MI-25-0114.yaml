stem: What is the definition of an "associate broker" under Michigan Occupational Code Article 25?
options:
  - An individual who meets the requirements for licensure as a real estate broker and is licensed
    as an associate real estate broker to provide brokerage services as an employee or independent
    contractor of a real estate broker.
  - An individual who is licensed as a real estate salesperson and works under the supervision of a
    real estate broker, and is not required to hold a broker’s license.
  - A sole proprietor who owns a real estate brokerage and employs associate brokers, who may also
    act as the principal broker, but this description does not define an associate broker.
  - A person who holds a responsible position in a business entity authorized under state law, but
    who does not necessarily meet the licensing requirements for a real estate broker.
key: A
explanation: Michigan Comp. Laws § 339.2501(a) states that an associate broker (or associate real
  estate broker) is an individual who meets the requirements for licensure as a real estate broker
  and who is licensed as an associate real estate broker to provide real estate brokerage services
  as an employee or independent contractor of a real estate broker.
