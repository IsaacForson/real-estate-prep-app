stem: According to Michigan Administrative Code R 339.22217, what credit is given for managing at
  **LEAST** 10 units located in Michigan for 3 or more years when calculating the time an applicant
  has been engaged in the real estate business for a broker or associate broker license?
options:
  - Six months of credit
  - One year of credit
  - Zero years of credit
  - Two years of credit
key: B
explanation: The rule states that an applicant shall be given 1 year of credit for managing at least
  10 units located in the state of Michigan for 3 or more years. The other options do not match this
  provision.
