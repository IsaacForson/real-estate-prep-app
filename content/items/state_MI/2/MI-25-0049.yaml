stem: Under Michigan Occupational Code Article 25, what is the minimum number of clock hours of
  approved prelicensure classroom courses an individual applicant must complete to qualify for a
  real estate broker's license?
options:
  - At least 120 clock hours
  - At least 90 clock hours
  - At least 60 clock hours
  - At least 40 clock hours
key: B
explanation: The statute requires an individual applicant to successfully complete at least 90 clock
  hours of approved prelicensure classroom courses in real estate. The 40‑hour figure applies to the
  salesperson prelicensure requirement, not the broker requirement.
citation:
