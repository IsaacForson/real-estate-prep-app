stem: Under Mich. Admin. Code R 339.22305(1), what must a licensee provide at the time of signing a
  service provision agreement?
options:
  - Provide a true executed copy of the agreement to the signing parties.
  - Give the parties a written summary of the agreement’s terms.
  - Notify the parties in writing of the broker’s commission rate.
  - File the agreement with the department and retain a copy for records.
key: A
explanation: The rule requires the licensee to provide a true executed copy of the service provision
  agreement to the parties at the time of signing. The other options describe actions that are not
  mandated by this provision, such as giving a summary, notifying about commission, or filing with
  the department.
