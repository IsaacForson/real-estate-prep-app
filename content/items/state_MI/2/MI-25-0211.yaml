stem: A broker opened a trust or escrow account on January 1, 2022. According to Michigan
  administrative rules, what is the earliest date by which the broker may destroy the account’s
  records?
options:
  - January 1, 2023
  - January 1, 2024
  - January 1, 2025
  - January 1, 2026
key: C
explanation: Records must be kept for not less than three years from the date the account was
  opened. Three years after January 1, 2022 is January 1, 2025, which is the earliest permissible
  destruction date. Destroying them after only two years would violate the three‑year minimum.
