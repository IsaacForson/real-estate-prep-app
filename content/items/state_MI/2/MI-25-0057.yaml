stem: A proprietary real estate school’s prelicensure course approval expires on October 31. By what
  date must the school submit its renewal application to maintain approval?
options:
  - The deadline is August 31
  - The deadline is September 1
  - The deadline is September 30
  - The deadline is October 1
key: B
explanation: Under R 339.22619(3), a renewal application must be submitted at least 60 days before
  the expiration date. Counting back 60 days from October 31 lands on September 1, making that the
  correct deadline. The distractor “September 30” is wrong because it is only 30 days prior, not the
  required 60 days.
