stem: An individual who was convicted of embezzlement five years ago applies for a real estate
  broker license. According to MCL 339.2505(2), what is the department’s required action regarding
  this application?
options:
  - The department shall not issue a real estate broker's license to the individual
  - The department shall issue the license after the individual pays a fine of $1,000
  - The department shall issue the license if the individual completes additional continuing
    education
  - The department shall issue the license but place the individual on probation for one year
key: A
explanation: Under MCL 339.2505(2), the department must deny a real estate broker's license to any
  applicant who has been convicted of embezzlement or misappropriation of funds, regardless of when
  the conviction occurred. The option stating the department shall not issue the license reflects
  this mandatory prohibition. The option suggesting the license could be issued after paying a fine
  contradicts the statute because no fine or other condition can override the ban. The option
  proposing issuance after additional continuing education also conflicts with the rule, as the
  statute allows no exceptions based on education. The option proposing issuance with probation
  likewise violates the statute, which provides for no conditional licensing in such cases.
