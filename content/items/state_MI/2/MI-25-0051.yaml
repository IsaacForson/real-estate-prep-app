stem: A licensee attends an approved continuing education course and wishes to verify identity to
  the course provider. According to Michigan Occupational Code Article 25, which two items must the
  licensee present?
options:
  - The licensee must present either the pocket card or the license identification number, and a
    government‑issued photo ID.
  - The licensee must present both the pocket card and the license identification number, and a
    government‑issued photo ID.
  - The licensee must present the pocket card, and either an operator's license or a utility bill.
  - The licensee must present the license identification number, and either a bank statement or a
    government‑issued photo ID.
key: A
explanation: The rule requires the licensee to show either the pocket card or the license
  identification number, plus a government‑issued photo ID such as an operator's/chauffeur's
  license, state personal ID card, or other government‑issued photo identification. The correct
  answer states that the licensee must present either the pocket card or the license identification
  number, and a government‑issued photo ID, which matches the rule.
