  quoted_text: (i) Present the licensee's pocket card, or provide the licensee's license
    identification number, from the department to the course provider. (ii) Present the licensee's
    operator's license or chauffeur's license issued under the Michigan vehicle code, 1949 PA 300,
    MCL 257.1 to 257.923, an official state personal identification card issued under 1972 PA 222,
    MCL 28.291 to 28.300, or other government-issued photo identification to the course provider.
