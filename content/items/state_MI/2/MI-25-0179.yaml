stem: According to Michigan administrative rules, how long before submitting an application must a
  real estate broker’s prelicensure classroom education have been completed to be considered
  current?
options:
  - 48 months
  - 24 months
  - 12 months
  - 36 months
key: D
explanation: The rule states that broker prelicensure education must be completed not more than 36
  months before the date of application, unless an active salesperson license was held during that
  period. Therefore, the maximum allowable age of the education is 36 months. Options of 12 or 24
  months are too restrictive, and 48 months exceeds the limit.
