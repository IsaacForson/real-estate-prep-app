stem: According to Michigan Occupational Code Article 25, how many hours of continuing education
  involving laws, rules, and court cases regarding real estate must a licensee complete each year of
  a license cycle?
options:
  - Not less than 1 hour
  - Not less than 2 hours
  - Not less than 4 hours
  - Not less than 3 hours
key: B
explanation: The statute requires a licensee to complete not less than 2 hours of courses that
  involve laws, rules, and court cases regarding real estate each year of the license cycle (see
  subsection 2)(a)(i)). Therefore, the correct answer is ‘Not less than 2 hours.’ The distractor
  ‘Not less than 1 hour’ is incorrect because the rule explicitly sets the minimum at two hours, not
  one.
