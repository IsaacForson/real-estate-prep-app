stem: According to MCL 339.2501(l), what is the term for a control person who is licensed as an
  associate real estate broker but is **NOT** designated as a principal?
options:
  - Associate broker
  - Principal
  - Nonprincipal
  - Control person
key: C
explanation: MCL 339.2501(l) defines a nonprincipal as a control person licensed as an associate
  broker who is not designated as a principal. The distractor 'Associate broker' is incorrect
  because it omits the requirement that the person is not a principal.
