stem: Under MCL 339.2503(1), which of the following activities is exempt from the licensing
  requirements of Article 25?
options:
  - A person who, as owner, always sells a quadruplex that has been occupied and built by the person
    while licensed under article 24
  - A person who, as owner, always sells a duplex that has been previously occupied and was built by
    someone else
  - A person who, as owner, sells a detached single-family dwelling that has never been occupied and
    that was built by the person while licensed under article 24
  - A person who, as owner, always sells a triplex that was built by the person while not licensed
    under article 24
key: C
explanation: Under MCL 339.2503(1), an owner who sells a detached single-family dwelling, duplex,
  triplex, or quadruplex that has never been occupied and was built by the owner while licensed
  under article 24 is exempt from licensing requirements. The option describing an owner selling a
  quadruplex that has been occupied and built by the owner while licensed under article 24 fails
  because the property was previously occupied. The option describing an owner selling a duplex that
  has been previously occupied and was built by someone else fails because the property was
  previously occupied and was not built by the owner while licensed under article 24. The option
  describing an owner selling a triplex that was built by the owner while not licensed under article
  24 fails because the dwelling was built when the owner lacked the required article 24 license.
