stem: An applicant for a real estate broker license completed the required 90 clock hours of
  prelicensure classroom education 40 months ago. During the past 30 months, the applicant has held
  an active real estate salesperson license. Under Michigan administrative rules, is the applicant’s
  prelicensure education still valid for the broker license application?
options:
  - Yes, the active salesperson license waives the 36‑month limit.
  - No, the education must be completed within 36 months regardless of salesperson licensure.
  - Yes, but only if the applicant also completed 9 hours of civil rights education.
  - No, the applicant must retake the entire prelicensure course.
key: A
explanation: "The rule provides an exception: the 36‑month limit does not apply if the applicant
  held an active real estate salesperson license during that period. Since the applicant maintained
  an active salesperson license for the past 30 months, the education remains valid despite being 40
  months old. The distractor that insists on the 36‑month limit ignores this statutory exception."
