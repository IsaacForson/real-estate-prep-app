stem: According to Michigan Administrative Code R 339.22101(1)(d), how is the term 'Instructor' defined?
options:
  - An individual who is employed by a real estate school to administer course schedules.
  - An individual who is a holder of a master's degree in business administration and teaches real
    estate courses at a community college.
  - An individual who is licensed as a real estate broker and has completed at least 30 clock hours
    of continuing education.
  - An individual who is approved to teach prelicensure classes pursuant to section 2504(4) of the
    code, MCL 339.2504.
key: D
explanation: The rule defines an instructor as someone approved to teach prelicensure classes under
  section 2504(4) of the code. The option stating that an instructor is a broker with continuing
  education confuses licensing with teaching approval and does not match the definition.
