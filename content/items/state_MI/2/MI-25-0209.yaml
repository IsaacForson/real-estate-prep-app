stem: According to Michigan administrative rules, what type of account must a trust or escrow
  account be maintained in?
options:
  - An interest-bearing savings account
  - A non-interest-bearing demand account
  - A money market savings account
  - A certificate of deposit account
key: B
explanation: The rule requires a trust or escrow account to be kept in a demand account only and
  specifies it must be non‑interest‑bearing. Therefore, a non‑interest‑bearing demand account is
  correct. An interest‑bearing savings account would violate the prohibition on interest.
