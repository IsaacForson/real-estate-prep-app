stem: A licensee completed their continuing education certification on June 1, 2023. According to
  Michigan Occupational Code Article 25, until what date must they retain evidence of completion to
  satisfy the department’s requirement?
options:
  - June 1, 2024
  - June 1, 2026
  - June 1, 2027
  - June 1, 2025
key: C
explanation: The rule states that a licensee shall retain evidence demonstrating compliance with
  continuing education requirements for not less than 4 years after the date of certification. Four
  years after June 1, 2023 is June 1, 2027, which is the earliest date the evidence may be
  discarded. The other options represent shorter retention periods that do not meet the four‑year
  minimum.
