stem: Under Michigan Occupational Code Article 25, what exception allows an applicant for a real
  estate broker's license to bypass the requirement that the 90 clock hours of prelicensure
  education be completed within the 36 months preceding the application?
options:
  - The applicant has completed the 90 hours as part of a salesperson licensing course.
  - The applicant is employed by a licensed real estate broker at the time of application.
  - The applicant has held an active real estate salesperson license for that 36‑month period.
  - The applicant possesses a law degree or a bachelor's degree in business or finance.
key: C
explanation: The statute explicitly waives the 36‑month prelicensure education window when the
  applicant has held an active salesperson license for that entire period. The distractor about
  possessing a law degree is incorrect because educational credentials may substitute for the 90
  hours but do not waive the timing requirement.
citation:
  source: "### Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980) — Michigan
