stem: A Michigan real estate broker maintains a main office in Ann Arbor and opens a branch office
  in a city located 30 miles from the nearest boundary of Ann Arbor. According to MCL 339.2505(3),
  what must the broker do regarding supervision of the branch office?
options:
  - The broker must ensure the branch office is under the direct supervision of an associate broker
    who is physically present on a regular basis.
  - The broker must employ a licensed salesperson to be physically present at the branch during
    ordinary business hours.
  - The broker must file a notice with the department exempting the branch from supervision because
    it is within the same county.
  - The broker must obtain a separate branch office license only if the branch exceeds fifty miles
    from the main office.
key: A
explanation: Under MCL 339.2505(3), if a branch office is located more than 25 miles from the
  nearest boundary of the municipality containing the main office, the broker must ensure the branch
  is under the direct supervision of an associate broker who is physically present on a regular
  basis. The correct option states this requirement. The option that suggests employing a licensed
  salesperson for physical presence is incorrect because the rule requires an associate broker, not
  a salesperson, for direct supervision. The option that proposes filing a notice to exempt the
  branch from supervision is incorrect; the rule does not provide such an exemption based on county
  location. The option that claims a separate branch office license is needed only when the branch
  exceeds fifty miles is incorrect; the rule concerns supervision, not licensing, and the distance
  threshold is twenty‑five miles, not fifty.
