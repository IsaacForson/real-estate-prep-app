stem: An applicant for a real estate broker license resided in City X for four months and worked as
  a real estate salesperson there for two months, resided in City Y for five months and worked as a
  salesperson there for four months, and resided in City Z for eight months without performing any
  real estate activity. According to MCL 339.2505(1)(a), which address(es) must the applicant
  include in the application?
options:
  - The applicant must list the addresses of City X and City Y, because they worked as a salesperson
    there
  - The applicant must list the address of City Z only, because they resided there for eight months
  - The applicant must list the address of City Z only, because they worked as a salesperson there
    for six months
  - The applicant must list the addresses of City X, City Y, and City Z, because each location
    involved either residence or sales activity
key: B
explanation: The rule requires listing each former place where the applicant resided for 60 days or
  more, or acted as a salesperson for 60 days or more, within the five years preceding the
  application. City Z meets the residence threshold (eight months), while City X and City Y fall
  short on both residence and salesperson duration. Therefore only City Z's address must be
  included. The option stating that the applicant must list City Z only because they worked as a
  salesperson there for six months incorrectly focuses on salesperson activity that does not reach
  the 60‑day threshold.
