stem: Under Michigan Occupational Code Article 25, how is an associate broker defined?
options:
  - A sole proprietorship that employs real estate salespersons to conduct transactions and is
    required to hold a broker’s license, which does not define an associate broker.
  - A business entity that holds a responsible position in a partnership or corporation and must be
    licensed as a broker, but the term associate broker refers to an individual, not a business
    entity.
  - An individual who meets the requirements for licensure as a real estate broker and is licensed
    as an associate broker to provide brokerage services as an employee or independent contractor of
    a broker
  - A control person who is licensed as a real estate salesperson and works under a broker’s
    supervision, possibly acting as a managing officer, yet an associate broker must meet broker
    licensure requirements, not merely a salesperson license.
key: C
explanation: Under MCL 339.2501, an associate broker is an individual who meets the broker licensure
  requirements and is licensed as an associate broker to provide real‑estate brokerage services as
  an employee or independent contractor of a broker. The correct option describes exactly that. A
  sole proprietorship employing salespersons, a business entity holding a partnership position, and
  a control person licensed only as a salesperson each describe different roles that do not satisfy
  the statutory definition of an associate broker.
