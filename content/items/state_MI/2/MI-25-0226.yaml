stem: For an individual applying for a real estate broker license who has **NOT** held an active
  real estate salesperson license during the preceding period, how many months before the date of
  application must the required 90 clock hours of approved prelicensure classroom education have
  been completed to be considered current?
options:
  - 24 months
  - 12 months
  - 48 months
  - 36 months
key: D
explanation: The statute requires a broker applicant who has not held an active salesperson license
  to finish the 90‑hour prelicensure education within the 36 months preceding the application date.
  This 36‑month window is the statutory limit; therefore 36 months is correct. The 24‑month option
  reflects the salesperson prelicensure period but does not apply to the broker requirement.
citation:
  source: Mich. Comp. Laws § 339.2504(1)(b)(iii)
  url: null
  quoted_text: The applicant must complete the 90 hours within the 36-month period preceding the date
    of the application unless the applicant has held an active license as a real estate salesperson
    for that period.
