stem: A builder constructed and personally sold 6 residential units over a 12‑month period. How many
  years of experience credit toward the 3‑year broker license experience requirement does this yield
  under MCL 339.2505(7)(b)(ii)?
options:
  - 2 years of credit
  - 3 years of credit
  - 0 years of credit
  - 1 year of credit
key: D
explanation: The rule grants 1 year of credit for each 12‑month period in which a builder built and
  personally sold or leased at least 5 residential, commercial, or industrial units. Selling 6
  residential units meets the threshold, so the builder receives 1 year of credit. The other options
  either under‑credit or over‑credit the experience.
