stem: A real estate salesperson submits a completed transfer application with the required fees to
  the department on May 10, and the pocket card shows a date of May 10 on the back. Assuming the
  application is complete and the new broker is licensed, how many days may the salesperson rely on
  the pocket card as proper evidence of licensing?
options:
  - 30 days
  - 45 days
  - 60 days
  - 90 days
key: B
explanation: Under MCL 339.2506(5), the department shall consider the pocket card as proper evidence
  of licensing for 45 days from the latest date written on the back of the card when a complete
  transfer application and fees are received. Therefore, the salesperson may rely on the pocket card
  for 45 days. The 30‑day distractor confuses the period with other renewal timelines, while 60‑ and
  90‑day options are not supported by the statute.
