stem: An entity advertises that its real estate courses satisfy the prelicensure education
  requirements for a Michigan broker license, but the entity has not received approval from the
  department. Under Michigan Administrative Code R 339.22101(1)(f), is this entity considered a real
  estate school?
options:
  - Yes, because the entity advertises its courses.
  - No, because the entity omits civil rights instruction.
  - Yes, because offering real estate courses makes a school.
  - No, because the entity lacks department approval.
key: D
explanation: Under Mich. Admin. Code R 339.22101(1)(f), a real estate school must be approved by the
  department and must represent that its courses fulfill prelicensure education requirements. Since
  the entity lacks department approval, it does not meet the definition of a real estate school.
