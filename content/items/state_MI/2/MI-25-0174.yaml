stem: Under MCL 339.2506(3), what must a licensee do if they change their principal business location?
options:
  - Notify only the broker of the change
  - File a new license application with the department
  - Give written notice to the department of the change
  - Wait until the next license renewal to report the change
key: C
explanation: The statute requires a licensee to give written notice to the department of any change
  of either a principal or branch business location. Simply notifying the broker or waiting for
  renewal does not satisfy this requirement.
