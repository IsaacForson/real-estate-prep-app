stem: Under MCL 339.204(6), which of the following must be true for the department to send a license
  renewal notice by electronic mail instead of first-class mail?
options:
  - The licensee must have provided an electronic mail address to the department, authorized the
    department in writing to use that address, and agreed in writing to consent to service of
    notices at that address.
  - The licensee must have provided an electronic mail address to the department and authorized the
    department to use that address, but written consent is not required.
  - The licensee must have provided an electronic mail address to the department, and the department
    may use it without any additional authorization.
  - The licensee must have provided an electronic mail address to the department, and the department
    may send notices by email only if the licensee has not opted out.
key: A
explanation: Under the rule, the department may use electronic mail only if the licensee has
  provided an email address, authorized the department in writing to use that address, and agreed in
  writing to consent to service of notices at that address. The option that says the licensee must
  have provided an email address and authorized the department to use that address but does not
  require written consent omits the required written consent, making it incorrect.
