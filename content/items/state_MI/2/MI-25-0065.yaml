stem: A Michigan real estate licensee moves to a new residence but fails to notify the department of
  the address change within 30 days. The department sends the renewal application to the licensee's
  old address, and the licensee does not receive it before the license expiration date. What is the
  effect on the license expiration date under MCL 339.204(4)?
options:
  - The license expiration date is extended by 30 days after the licensee fails to notify the
    department of a new address.
  - The license expiration date remains unchanged, and the license may be subject to disciplinary
    action if not renewed by that date.
  - The license expiration date is automatically renewed for another cycle regardless of
    notification.
  - The license expiration date is voided, requiring the licensee to retake the prelicensure
    examination.
key: B
explanation: Under MCL 339.204(4), the failure to notify the department of a change of address does
  not extend the expiration date of a license or registration and may result in disciplinary action.
  Therefore, the license expires on its original date, and the licensee may face discipline for not
  renewing on time. The distractor that suggests an automatic extension is incorrect because the
  statute explicitly states the expiration date is not extended.
