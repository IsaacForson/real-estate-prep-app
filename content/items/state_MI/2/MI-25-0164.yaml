stem: A real estate broker whose license expired two years ago wishes to be relicensed without
  examination using the continuing education pathway. According to Michigan Occupational Code
  Article 25, which of the following must be true?
options:
  - The broker must complete 6 clock hours of continuing education and pay the required fees.
  - The broker must complete 12 clock hours of continuing education and pay the required fees.
  - The broker must complete 18 clock hours of continuing education and pay the required fees.
  - The broker must pass the real estate broker examination and pay the required fees.
key: B
explanation: Under Mich. Comp. Laws § 339.2502a(4)(c), an individual seeking relicensure without
  examination within three years must complete 6 clock hours of continuing education for each year
  or partial year since expiration. For a two‑year lapse, this totals 12 hours. The other options
  either under‑require, over‑require, or incorrectly require an exam.
