stem: "An owner who sells six residential properties in a twelve‑month period as their principal
  vocation and does **not** engage a real estate broker must:"
options:
  - Continuing without a license as the owner
  - Obtaining a real estate salesperson license
  - Obtaining a limited service agreement
  - Obtaining a real estate broker license
key: D
explanation: Under Mich. Comp. Laws § 339.2502b(1)(a), an owner who sells more than five residential
  properties in any twelve‑month period as a principal vocation must obtain a real estate broker
  license unless they engage a broker to handle those sales. Selling six properties exceeds the
  five‑sale threshold, so the owner must obtain a broker license. Continuing without a license
  violates the rule. A salesperson license does not satisfy the requirement because the activity
  exceeds the limit for which a salesperson may act. A limited service agreement does not substitute
  for the required broker license.
