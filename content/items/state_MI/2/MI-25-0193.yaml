stem: A real estate salesperson completes a 12‑hour course that awards the Certified Residential
  Specialist (CRS) designation. According to MCL 339.2504a(2)(d), how many of those hours may be
  applied toward the salesperson’s continuing education requirement for the current license cycle?
options:
  - Twenty‑four clock hours
  - Twelve clock hours
  - Six clock hours
  - Zero clock hours
key: B
explanation: Subsection (2)(d) explicitly states that hours from a course completed to obtain a
  professional designation are counted toward the total continuing education hours required in a
  license cycle. Therefore the full 12 hours apply. The six‑hour distractor mistakenly assumes only
  half of the course hours count, which contradicts the rule that all hours are counted.
