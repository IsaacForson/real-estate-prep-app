stem: A broker opened a trust or escrow account on March 15, 2022. According to Michigan
  administrative rules, what is the earliest date by which the broker may destroy the account’s
  records?
options:
  - March 15, 2026
  - March 15, 2025
  - March 15, 2024
  - March 15, 2023
key: B
explanation: Records must be maintained for a period of not less than 3 years from the date of
  inception. Adding three years to March 15, 2022 yields March 15, 2025 as the earliest permissible
  destruction date. The option of March 15, 2024 would only satisfy a two‑year retention period,
  which is insufficient under the rule.
