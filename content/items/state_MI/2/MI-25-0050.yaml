stem: An individual who has held an active real estate salesperson license for the past 36 months
  completed the required 90 clock hours of prelicensure classroom courses four years ago. Under
  Michigan Occupational Code Article 25, is this individual eligible to receive a real estate
  broker's license based on the prelicensure education requirement?
options:
  - Under the rule, the applicant is eligible because the 36‑month preceding‑period requirement is
    waived for active salesperson license holders.
  - Under the rule, the applicant is not eligible because the 90 hours must be completed within the
    36 months preceding the application.
  - Under the rule, the applicant is eligible only if the coursework was completed within the last
    12 months.
  - Under the rule, the applicant is not eligible because the applicant must retake the entire
    90‑hour course within the 36 months preceding the application.
key: A
explanation: The statute exempts applicants who have held an active salesperson license for the
  36‑month period from the requirement that the 90 hours be completed within that period, allowing
  older coursework to satisfy the broker prelicensure education requirement. The distractor
  incorrectly states that the 36‑month window always applies regardless of salesperson licensure.
