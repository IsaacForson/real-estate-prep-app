stem: Under MCL 339.2503(1), which of the following situations is exempt from the licensing
  requirements of Article 25?
options:
  - An owner selling a detached single‑family home never occupied and built while holding an
    Article 24 license.
  - An attorney‑in‑fact selling a relative’s rental property under a recorded power of attorney that
    is always a full‑time business.
  - A court‑appointed guardian managing the sale of a triplex that has always been rented for two
    years.
  - A licensed builder selling a newly constructed duplex that has always been occupied for six
    months.
key: A
explanation: Under MCL 339.2503(1), the licensing requirements do not apply to an owner who sells a
  detached single‑family home, duplex, triplex, or quadruplex that has never been occupied and was
  built by the owner while the owner held an Article 24 license. The correct option describes
  exactly that situation. The other options describe properties that have been occupied or involve
  parties who are not owners building under an Article 24 license, so they do not qualify for the
  exemption.
