stem: According to MCL 339.2504a(8), what must be true for a continuing education course to be
  considered an eligible continuing education course for license renewal purposes?
options:
  - A course completed within the first six months of the license cycle and reported to the
    department
  - A course that is at least three clock hours long and covers real estate law topics
  - A course that meets department standards and, if completed, counts toward continuing education
    requirements
  - A course offered by a Michigan-accredited educational institution approved by the department
key: C
explanation: The definition in subsection (8) requires that the course meet the standards set by the
  department by rule under subsection (2)(f) and, if successfully completed, count toward the
  licensee's continuing education requirements. A course offered by an accredited institution is not
  sufficient unless it also meets those department standards.
