stem: Under Michigan Occupational Code Article 25, if a real estate broker receives a license after
  the start of a license cycle, what is the effect on the continuing education requirement for that
  cycle?
options:
  - The department requires the licensee to complete double the standard continuing education hours
    to compensate for the late start.
  - The department may prorate the required continuing education hours for the year in which the
    license is issued.
  - The department exempts the licensee from any continuing education requirement for that license
    cycle.
  - The department requires the full continuing education hours for the entire cycle regardless of
    the license issue date.
key: B
explanation: The rule permits the department to prorate the continuing education hours for the year
  in which the license is issued when the license begins mid‑cycle. The distractor claiming the full
  hours are still required ignores this express proration authority.
citation:
  source: "### Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980) — Michigan
    Compiled Laws, Occupational Code (1980 PA 299), MCL 339.101–339.2919 — includes Article 25 (Real
    Estate Brokers and Salespersons, MCL 339.2501–339.2518) — official Michigan Legislature
    compiled-act PDF read via Internet Archive capture of 2026-01-09 because legislature.mi.gov's
    Check Point WAF blocks scripts and headless browsers — § 339.2504a(6)"
  url: null
  quoted_text: If a real estate broker, associate real estate broker, or salesperson receives a
    license that is issued after the beginning of the current license cycle for that license, the
    department may prorate the number of hours of eligible continuing education that licensee is
    required to complete under subsections (1) and (2) for the year of the license cycle in which
    the license is issued.
