stem: What is a 'clock hour' for a classroom course delivered through distance learning?
options:
  - The period required for a student to process the amount of material provided in 50 minutes of
    distance learning instruction.
  - The period of 50 to 60 minutes of actual classroom instruction, not including outside
    assignments and reading.
  - The period required for a student to process the amount of material provided in 60 minutes of
    distance learning instruction.
  - The period of 60 minutes of actual classroom instruction, including outside assignments and
    reading.
key: A
explanation: The statute defines a clock hour for distance learning as the period required for a
  student to process the amount of material provided in 50 minutes of distance learning instruction.
  The option stating 'The period required for a student to process the amount of material provided
  in 50 minutes of distance learning instruction' matches this definition. The option stating 'The
  period of 50 to 60 minutes of actual classroom instruction, not including outside assignments and
  reading' describes classroom instruction time, not the processing time for distance learning
  material, so it is incorrect. The option stating 'The period required for a student to process the
  amount of material provided in 60 minutes of distance learning instruction' incorrectly uses 60
  minutes instead of the 50 minutes specified in the statute. The option stating 'The period of 60
  minutes of actual classroom instruction, including outside assignments and reading' also refers to
  classroom instruction and includes outside work, which does not match the distance‑learning
  definition.
