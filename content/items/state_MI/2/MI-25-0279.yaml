stem: The department notifies the appropriate board of its intent to impose a limitation on a
  licensee’s renewal. The board does not respond within 30 days. Under MCL 339.204(3), what may the
  department do?
options:
  - The department may impose the limitation without further board approval.
  - The department must withdraw the notice and cannot impose a limitation.
  - The department must wait another 30 days before taking any action.
  - The department may impose the limitation only if the licensee consents in writing.
key: A
explanation: The rule provides that if the notified board does not approve or disapprove the
  limitation within 30 days after receipt of the notification, the department may impose the
  limitation. The statement that the department must withdraw the notice and cannot impose a
  limitation is incorrect.
