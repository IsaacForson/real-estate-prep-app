stem: Under Michigan Occupational Code Article 25, does an owner who sells four residential
  properties in a twelve‑month period and advertises that they are principally engaged in the sale
  of real estate need to obtain a real estate broker license?
options:
  - No, because selling fewer than five properties exempts the owner from licensing requirements.
  - No, unless the owner receives compensation from a real estate broker for the sales.
  - Yes, but only if the owner also sells more than five properties in the same period.
  - Yes, because advertising as principally engaged satisfies the principal vocation criterion under
    section 2502b(1)(b).
key: D
explanation: Advertising that one is principally engaged in real estate sales satisfies the
  criterion in 2502b(1)(b) for engaging in the sale of real estate as a principal vocation.
  Therefore, a broker license is required regardless of selling fewer than five properties. The
  exemption based on sales volume does not apply when the principal vocation criterion is met.
