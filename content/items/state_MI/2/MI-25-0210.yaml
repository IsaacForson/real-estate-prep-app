stem: A buyer and seller disagree over who is entitled to an earnest money deposit after a purchase
  agreement falls through. According to Michigan administrative rules, what must the broker do with
  the deposit?
options:
  - Return the deposit to the buyer immediately upon request
  - Hold the deposit until a court decides or parties agree in writing
  - Disburse the deposit to the seller as liquidated damages per agreement
  - Place the deposit in an interest-bearing account until resolved
key: B
explanation: The rule states that an earnest money deposit for which the buyer and seller have made
  claim must remain in the trust account until a civil action determines payment or the parties
  agree in writing to its disposition. Hence the broker must hold the deposit. Returning it
  immediately would violate the requirement to wait for resolution.
