stem: Under Michigan Occupational Code Article 25, what is the definition of an 'associate broker'?
options:
  - An individual who meets the requirements for licensure as a real estate broker under this
    article and who is licensed as an associate real estate broker under section 2505 to provide
    real estate brokerage services as an employee or independent contractor of a real estate broker.
  - An individual who meets the requirements for licensure as a real estate salesperson under this
    article and who is licensed as a real estate salesperson under section 2505 to provide real
    estate brokerage services as an employee or independent contractor of a real estate broker.
  - An individual who is licensed as a real estate broker under this article and who employs
    associate brokers to provide real estate brokerage services to the public.
  - An individual who holds a real estate broker license and provides brokerage services
    independently as a sole proprietor without employing other licensed agents.
key: A
explanation: The definition of associate broker is explicitly stated in Mich. Comp. Laws §
  339.2501(a). The other options incorrectly describe a salesperson, a broker employing associates,
  or a sole proprietor broker, which do not match the statutory definition.
citation:
  source: Mich. Comp. Laws § 339.2501(a)
  url: null
  quoted_text: '"Associate broker" or "associate real estate broker" means an individual who meets the
    requirements for licensure as a real estate broker under this article and who is licensed as an
    associate real estate broker under section 2505 to provide real estate brokerage services as an
    employee or independent contractor of a real estate broker.'
