stem: A licensee changes the address of their principal business location. What must the licensee do?
options:
  - The broker must forward only their own license and pocket card to the department.
  - The licensee must give written notice to the department of the change.
  - The licensee must obtain a temporary license before operating at the new location.
  - The licensee must notify only the broker of the change in location.
key: B
explanation: Under MCL 339.2506(3), a licensee must give written notice to the department whenever
  the principal or branch business location changes. The option stating that the licensee must give
  written notice to the department of the change correctly reflects this requirement. The option
  suggesting that only the broker's license and pocket card must be forwarded is incorrect because
  no new license application is needed for a location change. The option stating that the licensee
  must obtain a temporary license before operating at the new location is incorrect because a
  location change does not require a temporary license. The option stating that the licensee must
  notify only the broker of the change is incorrect because notice must be given to the department,
  not just the broker.
