stem: A real estate salesperson gives their broker written notice of termination of employment. What
  must the broker do within 5 days?
options:
  - The broker must refund any prepaid commissions to the salesperson.
  - The broker must immediately forward the salesperson's pocket card to the department.
  - The broker must retain the salesperson's license for at least 30 days before returning it.
  - The broker must deliver or mail by certified mail the salesperson's license to the department
    within 5 days.
key: D
explanation: When a salesperson terminates employment by giving written notice, the broker must
  deliver or mail the salesperson's license to the department by certified mail within five days
  (MCL 339.2507(1)). The option stating that the broker must refund any prepaid commissions to the
  salesperson does not reflect this requirement. The option stating that the broker must retain the
  salesperson's license for at least 30 days before returning it is incorrect because the license
  must be sent to the department within five days, not retained. The option stating that the broker
  must immediately forward the salesperson's pocket card to the department is incorrect because only
  the license, not the pocket card, is required to be sent upon termination.
