stem: According to Michigan Occupational Code Article 25, what must a licensee have on their person
  while acting as a real estate broker, associate broker, or salesperson?
options:
  - A photocopy of the broker's license or temporary license
  - Their pocket card, temporary license, or a photocopy/digital image
  - A written notice of any change of business or branch location
  - The department's acknowledgment of receipt of application
key: B
explanation: The statute requires a licensee to possess their own pocket card or temporary license,
  or a photocopy or digital image of that credential, while engaging in regulated activities. A
  distractor that claims a photocopy of the broker's license satisfies the requirement is incorrect
  because the rule specifies the licensee’s own credential, not the broker’s.
citation:
  source: "### Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980) — Michigan
    Compiled Laws, Occupational Code (1980 PA 299), MCL 339.101–339.2919 — includes Article 25 (Real
    Estate Brokers and Salespersons, MCL 339.2501–339.2518) — official Michigan Legislature
    compiled-act PDF read via Internet Archive capture of 2026-01-09 because legislature.mi.gov's
    Check Point WAF blocks scripts and headless browsers — § 339.2506"
  url: null
  quoted_text: An individual licensed under this article shall not act as a real estate broker,
    associate real estate broker, or real estate salesperson if he or she does not have, on his or
    her person, his or her pocket card or temporary license or a photocopy or digital image of that
    pocket card or temporary license.
