stem: When a real estate salesperson terminates employment with a broker, what must the broker do
  within five days under Michigan Occupational Code Article 25?
options:
  - Deliver or mail the salesperson's license to the department by certified mail
  - Forward the salesperson's pocket card to the department
  - Provide the salesperson with a copy of the broker's license
  - Notify the department in writing of the termination within five days
key: A
explanation: Subsection (1) of §339.2507 states that if a salesperson is discharged or terminates
  employment, the broker shall deliver or mail by certified mail to the department, within 5 days,
  the salesperson's license. The distractor about notifying the department in writing confuses the
  requirement with the broker's duty to notify the salesperson, not the department.
