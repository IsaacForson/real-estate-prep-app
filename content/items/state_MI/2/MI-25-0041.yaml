stem: A real estate salesperson whose license expired two years ago wishes to be relicensed without
  examination using the continuing education pathway. Which of the following must be true?
options:
  - Passing the examination required for a real estate salesperson license
  - Completing 6 clock hours of continuing education for each year and partial year since the
    license expired
  - Completing 40 clock hours of prelicensure courses in the 12‑month period preceding the
    application
  - Paying only the application processing fee and late renewal fee
key: B
explanation: For relicensure without examination under the continuing education option, the
  applicant must have completed 6 clock hours of continuing education for each year and partial year
  since the license expired, as required by §339.2502a(6)(a). The other options describe actions
  that are either not required (passing the exam), insufficient (40 hours of prelicensure), or
  incomplete (paying only fees), and therefore do not satisfy the continuing education pathway.
