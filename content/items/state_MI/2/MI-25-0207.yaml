stem: A principal of a limited liability company that holds a real estate broker's license wishes to
  show properties and negotiate offers for clients. According to MCL 339.2508(2), what must the
  principal do before performing those acts?
options:
  - Obtain a real estate salesperson license
  - Apply for and obtain an associate real estate broker's license
  - Notify the department of the change in principal status
  - Complete six hours of continuing education
key: B
explanation: The statute requires each principal to apply for and obtain an associate real estate
  broker's license before performing acts regulated under the article. The distractor about
  obtaining a salesperson license is incorrect because principals must hold an associate broker
  license, not a salesperson license.
