stem: A Michigan real estate salesperson completes a 3‑hour continuing education course in March and
  successfully completes the exact same course again in September. According to Michigan
  Occupational Code Article 25, how many additional continuing education hours toward the license
  renewal requirement does the second completion provide?
options:
  - 0 hours
  - 1.5 hours
  - 3 hours
  - 6 hours
key: A
explanation: Subsection 2)(e) provides that repeating an eligible continuing education course does
  not earn additional hours toward the requirements. Thus the second completion yields 0 additional
  hours. The distractor ‘3 hours’ incorrectly assumes each completion adds hours regardless of
  repetition.
