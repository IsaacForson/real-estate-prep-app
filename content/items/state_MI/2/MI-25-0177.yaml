stem: According to MCL 339.2506(1), what is the legal consequence for a licensee who does **NOT**
  have their pocket card, temporary license, or a photocopy/digital image of it on their person
  while attempting to perform a regulated act?
options:
  - They must cease the activity and may not act as a licensee.
  - They must apply for a temporary license within 24 hours.
  - They must notify the department within five business days.
  - They may continue under the direct supervision of a licensed broker.
key: A
explanation: The statute states that a licensed individual shall not act as a broker, associate
  broker, or salesperson if they do not have their pocket card, temporary license, or a copy on
  their person. Therefore, the licensee must refrain from performing any regulated act. The
  distractor that suggests applying for a temporary license within 24 hours is incorrect because the
  rule does not provide a grace period or remedial action; it simply prohibits acting without the
  required credential.
citation:
  source: Mich. Comp. Laws § 339.2506(1)
  url: null
  quoted_text: An individual licensed under this article shall not act as a real estate broker,
    associate real estate broker, or real estate salesperson if he or she does not have, on his or
    her person, his or her pocket card or temporary license or a photocopy or digital image of that
    pocket card or temporary license.
