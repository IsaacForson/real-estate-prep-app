stem: A real estate broker advertises a virtual office with no physical location as the place where
  clients may consult and do business. Under MCL 339.2501(m), is this considered a place of
  business?
options:
  - Yes, because the broker advertises the virtual office to the public.
  - No, because a place of business must be a physical location.
  - Yes, because clients can consult and do business via the virtual office.
  - No, because the broker does not have a signed lease for the virtual space.
key: B
explanation: MCL 339.2501(m) defines a place of business as a physical location that the broker
  represents to the public as a place for consultation or business. A virtual office without a
  physical location does not meet this definition. The distractor citing lack of a lease is
  incorrect because the definition does not require a lease.
