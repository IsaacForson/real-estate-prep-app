stem: According to MCL 339.2509(2), what is the maximum number of associate real estate broker's
  licenses an individual may hold as a nonprincipal?
options:
  - Zero associate broker licenses
  - One associate broker license
  - Two associate broker licenses
  - Unlimited associate broker licenses
key: B
explanation: The statute explicitly states that an individual shall not hold more than one associate
  real estate broker's license as a nonprincipal. Therefore, the maximum allowed is one. The
  distractor suggesting zero is incorrect because the statute permits holding one license as a
  nonprincipal.
