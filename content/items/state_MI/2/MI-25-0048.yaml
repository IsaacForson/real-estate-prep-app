stem: A real estate salesperson receives notice that their license has been suspended. According to
  Michigan Occupational Code Article 25, what must the salesperson do immediately?
options:
  - Forward their pocket card to the department and their broker must forward the salesperson's
    license to the department
  - Forward both their pocket card and license to the department, and the broker must forward all
    salespersons' licenses
  - Wait until the broker receives a new wall license before taking any action
  - Notify the department in writing within five days of the suspension
key: A
explanation: Subsection (4) of §339.2506 requires a suspended salesperson to forward their pocket
  card to the department, while the broker must forward the salesperson's license. The distractor
  that has the salesperson also forwarding their license is incorrect because the rule assigns that
  duty to the broker, not the salesperson.
citation:
  source: "### Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980) — Michigan
    Compiled Laws, Occupational Code (1980 PA 299), MCL 339.101–339.2919 — includes Article 25 (Real
    Estate Brokers and Salespersons, MCL 339.2501–339.2518) — official Michigan Legislature
    compiled-act PDF read via Internet Archive capture of 2026-01-09 because legislature.mi.gov's
    Check Point WAF blocks scripts and headless browsers — § 339.2506"
  url: null
  quoted_text: If he or she receives notice that his or her license is suspended or revoked, a real
    estate salesperson, or an associate real estate broker that is not the sole associate real
    estate broker for a real estate broker that is a business entity, shall immediately forward his
    or her pocket card to the department and the real estate broker to which the individual was
    licensed shall immediately forward the salesperson's or associate real estate broker's license
    to the department.
