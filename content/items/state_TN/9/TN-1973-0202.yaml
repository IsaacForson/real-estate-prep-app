stem: A buyer’s offer to purchase a property is rejected, and the buyer submits a written request
  for return of the earnest money. According to Tennessee Real Estate Commission rules, within how
  many calendar days must the licensee disburse the earnest money absent a compelling reason?
options:
  - The licensee must disburse the earnest money within fifteen (15) calendar days.
  - The licensee must disburse the earnest money within ten (10) calendar days.
  - The licensee must disburse the earnest money within twenty-one (21) calendar days.
  - The licensee must disburse the earnest money within twenty-eight (28) calendar days.
key: C
explanation: Rule (9) states that absent a demonstration of a compelling reason, earnest money must
  be disbursed, interpleaded, or turned over to an attorney within twenty‑one calendar days from the
  date of receipt of a written request for disbursement. The fourteen‑day distractor is a common
  misstatement and is not supported by the rule.
