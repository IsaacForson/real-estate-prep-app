    scripts — § 1260-02-.09"
  url: null
  quoted_text: Absent a demonstration of a compelling reason, earnest money shall be disbursed,
    interpleaded, or turned over to an attorney with instructions to interplead the funds within
    twenty-one (21) calendar days from the date of receipt of a written request for disbursement.
