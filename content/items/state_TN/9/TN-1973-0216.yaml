stem: A licensee accepts an offer to purchase property and receives earnest money from the buyer.
  The offer does not contain any special deposit instructions. According to Tennessee Real Estate
  Commission rules, what must the licensee do with the earnest money?
options:
  - The licensee shall deposit the earnest money promptly into an escrow or trustee account
  - The licensee shall hold the earnest money in the licensee's personal account until closing
  - The licensee shall wait until the seller signs the contract before depositing the earnest money
  - The licensee shall deposit the earnest money only after the buyer's loan is approved
key: A
explanation: The rule states that trust money must be deposited promptly into an escrow or trustee
  account upon acceptance of the offer unless the offer provides different deposit instructions.
  Holding the money in a personal account or delaying deposit violates the prompt deposit
  requirement and risks commingling.
