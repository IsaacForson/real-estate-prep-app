stem: A principal broker includes a clause in the purchase agreement stating that earnest money will
  be deposited into an escrow account but does not name the escrow company. What must the broker do
  to comply with Tennessee Real Estate Commission rules?
options:
  - To specify the name and address of the escrow holder in the contract
  - To disclose the interest rate that will accrue on the earnest money
  - To obtain a written amendment naming a different escrow holder
  - To deposit the earnest money into a non-interest-bearing trust account
key: A
explanation: The rule requires that when a contract authorizes a principal broker to place trust
  money in an escrow account, the broker must clearly specify the name and address of the person or
  firm who will actually hold the trust money. Therefore, the broker must amend the contract to
  include that information. Specifying an interest rate is only required if an interest-bearing
  account is used, which is not mandated here.
