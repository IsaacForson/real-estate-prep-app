stem: A licensee holds a client’s earnest money in an interest-bearing escrow account. Under
  Tennessee Real Estate Commission rules, what must the licensee maintain regarding the interest
  earned?
options:
  - The interest may be kept by the licensee as compensation
  - No records needed if interest is less than $100
  - A summary of total interest earned annually
  - A detailed accounting of interest earned for each deposit
key: D
explanation: The rule mandates that the licensee keep a detailed and accurate accounting of the
  precise sum of interest earned for each separate deposit. An annual summary alone does not satisfy
  this per‑deposit accounting requirement.
