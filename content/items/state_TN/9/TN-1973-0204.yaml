stem: A licensee receives a postdated check as earnest money from a buyer, and the purchase offer
  does not contain any provision allowing postdated checks. What must the licensee do with the
  check?
options:
  - The licensee must accept the postdated check for deposit.
  - The licensee must accept the postdated check if the bank guarantees payment.
  - The licensee must deposit the postdated check after its date.
  - The licensee must refuse to accept the postdated check.
key: D
explanation: Rule (10) prohibits accepting a postdated check for payment of trust money unless the
  offer expressly provides otherwise. Since the offer lacks such a provision, the licensee must
  refuse to accept the check. Accepting it or depositing it later would violate the prohibition.
