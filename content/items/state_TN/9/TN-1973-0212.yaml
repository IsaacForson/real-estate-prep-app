stem: A licensee receives trust money after an offer is accepted and the offer does not contain any
  statement about when the money must be deposited. When must the licensee deposit the money into an
  escrow or trustee account under Tennessee Real Estate Commission rules?
options:
  - Deposit the money promptly upon acceptance of the offer.
  - Deposit the money within 24 hours of acceptance of the offer.
  - Deposit the money within three business days of acceptance of the offer.
  - Deposit the money at the closing of the transaction.
key: A
explanation: Rule 11 states that trust money shall be deposited promptly upon acceptance of the
  offer unless the offer specifies a different deposit deadline. Since the offer contains no such
  statement, the deposit must be made promptly. The other options impose specific timeframes or
  defer deposit to closing, which are not required by the rule.
