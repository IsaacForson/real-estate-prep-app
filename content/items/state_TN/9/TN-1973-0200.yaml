stem: An affiliated broker receives an earnest money deposit from a buyer. What must the affiliated
  broker do with the money under Tennessee Real Estate Commission rules?
options:
  - The affiliated broker must deposit the money into his or her own business escrow account within
    three business days.
  - The affiliated broker must hold the money in a personal savings account until the closing date.
  - The affiliated broker must disburse the money to the seller upon receipt of a written request.
  - The affiliated broker must pay the money over to the principal broker with whom he or she is
    affiliated immediately upon receipt.
key: D
explanation: The rule requires an affiliated broker to remit all trust money to the principal broker
  immediately upon receipt. Depositing the funds into the affiliate’s own account, holding them
  personally, or disbursing to the seller without the principal broker’s involvement violates this
  requirement.
