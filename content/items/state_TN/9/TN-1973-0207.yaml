stem: A broker receives a security deposit for a residential lease. Under Tennessee Real Estate
  Commission rules, where must this trust money be held?
options:
  - In the broker's personal checking account
  - In the same escrow account used for sales transactions
  - In a separate escrow account designated for lease trust money
  - In any account, provided the funds are not commingled with personal funds
key: C
explanation: Paragraph (12) of Tenn. Comp. R. & Regs. § 1260-02-.09 requires that all trust money
  received and held which relates to the lease of property be held in one or more separate escrow or
  trustee accounts. Therefore, the answer stating that the security deposit must be placed in a
  separate escrow account designated for lease trust money is correct. The answer suggesting the
  same escrow account used for sales transactions is incorrect because the rule mandates a separate
  account for lease trust money.
