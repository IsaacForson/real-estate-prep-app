stem: According to Tennessee Real Estate Commission rules, what must each principal broker maintain
  for holding trust money?
options:
  - No account if the broker acts as facilitator
  - A joint account with the affiliated broker
  - A separate escrow or trustee account
  - An interest-bearing account only
key: C
explanation: The rule explicitly requires each principal broker to keep a separate escrow or trustee
  account for trust money received in a fiduciary capacity. A joint account with an affiliated
  broker would violate the separation requirement and is therefore incorrect.
