stem: A principal broker instructs the buyer to deposit earnest money directly with a title company
  named in the contract. When is the principal broker relieved of responsibility for the trust money
  under Tennessee Real Estate Commission rules?
options:
  - Upon the expiration of the option period in the lease agreement
  - Upon the signing of the purchase agreement by both parties
  - Upon receipt of the trust money by the specified escrow agent
  - Upon the clearance of the earnest money check by the bank
key: C
explanation: The rule provides that a principal broker is relieved of responsibility for trust money
  upon receipt of the trust money by the specified escrow agent. Therefore, once the title company
  receives the funds, the principal broker's responsibility ends. The signing of the agreement or
  clearance of the check does not trigger this relief under the rule.
