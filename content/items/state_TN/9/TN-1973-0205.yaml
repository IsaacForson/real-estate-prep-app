stem: According to Tennessee Real Estate Commission rules, which statement correctly describes the
  Commission's position on interest-bearing escrow or trustee accounts?
options:
  - Interest-bearing escrow or trustee accounts are neither required nor prohibited by the
    Commission.
  - Interest-bearing escrow or trustee accounts are permitted only for lease-related trust money.
  - Interest-bearing escrow or trustee accounts are required for all trust money.
  - Interest-bearing escrow or trustee accounts are prohibited unless the broker obtains a special
    license.
key: A
explanation: The Tennessee Real Estate Commission rule 1260-02-.09 specifies that interest-bearing
  escrow or trustee accounts are neither required nor prohibited. Therefore, the statement that
  interest-bearing escrow or trustee accounts are neither required nor prohibited by the Commission
  is correct. The other statements incorrectly impose a requirement, a prohibition, or a limitation
  to lease-related trust money, which the rule does not contain.
