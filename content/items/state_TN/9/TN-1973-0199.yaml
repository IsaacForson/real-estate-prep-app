stem: According to Tennessee Real Estate Commission rules, what is commingling?
options:
  - The act of a licensee maintaining funds belonging to others in the same bank account that
    contains his or her personal or business funds.
  - The act of a licensee depositing trust money into an interest-bearing escrow account without
    disclosure.
  - The act of a licensee holding earnest money for more than twenty-one days without a compelling
    reason.
  - The act of a licensee failing to deposit trust money promptly upon acceptance of an offer.
key: A
explanation: The rule defines commingling as a licensee keeping others’ funds in the same account
  that holds the licensee’s personal or business money. The other options describe prohibited
  actions such as undisclosed interest-bearing deposits, holding earnest money beyond the allowed
  period without cause, or delayed deposit, none of which match the definition of commingling.
