stem: Under Tennessee Real Estate Commission rules, who is responsible at all times for trust money
  accepted by a principal broker or an affiliated broker?
options:
  - The escrow agent
  - The affiliated broker
  - The principal broker
  - The buyer's agent
key: C
explanation: The rule states that principal brokers are responsible at all times for trust money
  accepted by them or their affiliated brokers, in accordance with the contract. This places the
  duty on the principal broker, not the affiliated broker. Therefore, the correct answer is the
  principal broker. The affiliated broker is incorrect because responsibility remains with the
  principal broker even when the affiliated broker receives the funds.
