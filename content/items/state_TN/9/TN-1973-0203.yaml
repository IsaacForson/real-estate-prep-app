stem: A buyer submits a written request for the return of earnest money. Assuming no compelling
  reason exists, within how many calendar days must the principal broker disburse, interplead, or
  turn over the funds to an attorney for interpleader under Tennessee Real Estate Commission rules?
options:
  - The principal broker must disburse, interplead, or turn over the funds to an attorney for
    interpleader within 7 calendar days.
  - The principal broker must disburse, interplead, or turn over the funds to an attorney for
    interpleader within 14 calendar days.
  - The principal broker must disburse, interplead, or turn over the funds to an attorney for
    interpleader within 21 calendar days.
  - The principal broker must disburse, interplead, or turn over the funds to an attorney for
    interpleader within 30 calendar days.
key: C
explanation: The rule states that, absent a compelling reason, earnest money must be disbursed,
  interpleaded, or turned over to an attorney for interpleader within twenty‑one calendar days of
  receiving a written disbursement request. The other timeframes do not match this requirement.
