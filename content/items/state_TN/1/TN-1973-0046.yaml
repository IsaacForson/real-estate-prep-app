stem: An applicant appears before the Tennessee Real Estate Commission requesting licensure after a
  felony conviction and is denied. According to Tenn. Comp. R. & Regs. 1260-01-.01(5)(d), what is
  the consequence?
options:
  - The applicant may reapply immediately after submitting additional documents to the Commission,
    attending a mandatory interview, and receiving written approval before any new examination
    scheduling.
  - The applicant must complete additional continuing education hours as required by the Commission,
    submit proof of completion, and wait for official notification before being allowed to reapply
    for licensure.
  - The applicant who appears before the Commission requesting licensure and who is denied will not
    be eligible for reconsideration for six (6) months from the date of denial, regardless of any
    subsequent rehabilitation efforts.
  - The applicant must obtain a certificate of employability issued under T.C.A. § 40-29-107,
    provide proof of rehabilitation, and await Commission review before any future licensure
    application will be considered.
key: C
explanation: Rule (5)(d) states that an applicant who appears before the Commission requesting
  licensure and is denied will not be eligible for reconsideration for six months from the date of
  denial. The distractor suggesting immediate reapplication after submitting documents is incorrect
  because the rule imposes a mandatory waiting period regardless of any additional documentation.
