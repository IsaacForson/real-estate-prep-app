stem: An applicant was convicted of a felony theft of money eleven years ago and is submitting an
  application for a real estate broker license today. According to Tenn. Comp. R. & Regs.
  1260-01-.01, what must the applicant do?
options:
  - Submitting the Commission-prescribed form and court disposition
  - Appearing before the Commission for a case‑by‑case review
  - Taking no additional steps beyond the standard application
  - Waiting six months before submitting the application
key: C
explanation: Under Tenn. Comp. R. & Regs. 1260-01-.01(5), because the conviction occurred more than
  ten years ago, the rule does not require any additional submission or appearance; only the
  standard application is needed. Submitting the form or appearing before the Commission would be
  unnecessary.
