stem: An applicant for a Tennessee real estate license has been convicted of a theft-related
  misdemeanor within the past eight years. Which action is required by the Commission rules?
options:
  - The applicant must submit a sworn affidavit from the arresting officer detailing the incident.
  - The applicant must appear before the Commission only if the court record is sealed.
  - The applicant must complete the Commission's form and submit certified court disposition copies.
  - The applicant must wait five years after the conviction before submitting any licensing
    documents.
key: C
explanation: The rule mandates that applicants with certain recent convictions must complete a
  prescribed form and submit certified copies of the court disposition. Waiting ten years or
  appearing only under specific conditions misstates the requirement.
