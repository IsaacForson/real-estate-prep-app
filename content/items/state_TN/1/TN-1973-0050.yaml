stem: An applicant who has a felony conviction and is required to appear before the Tennessee Real
  Estate Commission for licensure consideration must ensure which of the following before the
  hearing?
options:
  - Have their principal broker (or intended principal broker) present at the hearing
  - Submit a completed licensure application to the Commission before the hearing
  - Provide a court‑issued letter confirming the conviction has been expunged
  - Pay a non‑refundable hearing fee to the Commission and wait for approval
key: B
explanation: The rule explicitly states that the applicant shall ensure the presence of his or her
  principal broker (or intended principal broker) when appearing before the Commission. The other
  options describe actions not required by the rule for this appearance.
citation:
