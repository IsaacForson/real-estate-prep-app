stem: Under Tenn. Comp. R. & Regs. 1260-01-.01(5)(d), how long must an applicant wait before being
  eligible for reconsideration after being denied licensure by the Commission?
options:
  - Nine (9) months
  - Three (3) months
  - Six (6) months
  - Twelve (12) months
key: C
explanation: The rule states that an applicant who appears before the Commission requesting
  licensure and is denied will not be eligible for reconsideration for six (6) months from the date
  of denial. Therefore, the correct waiting period is six months. The three‑month option is
  incorrect because the rule specifies a six‑month bar, not three.
