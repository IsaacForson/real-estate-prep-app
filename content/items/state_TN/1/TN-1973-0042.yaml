stem: A license applicant in Tennessee has a certificate of employability under T.C.A. § 40-29-107
  and a prior felony conviction. What must the applicant do under the Real Estate Commission rules?
options:
  - The applicant must submit only the certificate of employability to the Commission.
  - The applicant must appear before the Commission for a case‑by‑case review of the conviction.
  - The applicant must wait six months before reapplying after any denial.
  - The applicant must complete a remedial education course before appearing.
key: B
explanation: The rule requires an applicant with a certificate of employability to appear before the
  Commission for a case‑by‑case consideration of the criminal record. Simply submitting the
  certificate is insufficient, as appearance is mandatory.
