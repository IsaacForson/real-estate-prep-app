stem: Under Tenn. Comp. R. & Regs. § 1260-01-.01, which statement is true regarding an applicant who
  has passed the real estate examination?
options:
  - The applicant is automatically issued a license upon passing the examination.
  - The applicant must still satisfy additional requirements before licensure may be granted.
  - The applicant may begin practicing real estate immediately after passing the examination.
  - The applicant is exempt from submitting any further documentation to the Commission.
key: B
explanation: Under Tenn. Comp. R. & Regs. § 1260-01-.01, an applicant who passes an examination is
  not necessarily qualified for licensure. Therefore the applicant must still satisfy additional
  requirements—such as completing required education, submitting a license application, and
  obtaining Commission approval—before a license can be issued. The statement that the applicant may
  begin practicing immediately is incorrect because licensure has not been granted. The statement
  that the applicant is exempt from any further documentation is also incorrect, as additional
  paperwork is required. The statement that a license is automatically issued upon passing the
  examination is likewise wrong.
