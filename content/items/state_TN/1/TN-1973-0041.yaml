stem: According to Tennessee Real Estate Commission rules, what is true about an applicant who
  passes the broker examination?
options:
  - The applicant is automatically eligible for licensure upon passing the exam.
  - The applicant must still satisfy additional requirements before licensure.
  - The applicant may begin practicing immediately under supervision.
  - The applicant is exempt from submitting a criminal background check.
key: B
explanation: The rule explicitly states that passing an examination does not guarantee licensure, so
  the applicant must still meet other requirements. The distractor claiming automatic eligibility
  contradicts this provision.
