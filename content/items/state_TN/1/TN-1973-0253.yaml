stem: An applicant was denied licensure by the Tennessee Real Estate Commission on March 1, 2025.
  According to Tenn. Comp. R. & Regs. 1260-01-.01(5)(d), what is the earliest date the applicant may
  request reconsideration?
options:
  - March 1, 2026
  - September 1, 2025
  - March 1, 2024
  - September 1, 2026
key: B
explanation: The rule bars reconsideration for six months after a denial; adding six months to March
  1, 2025 gives September 1, 2025 as the earliest permissible date. March 1, 2026 would be twelve
  months, which is too long.
citation:
  source: Tenn. Comp. R. & Regs. 1260-01-.01(5)(d)
  url: null
  quoted_text: An applicant who appears before the Commission requesting licensure and who is denied
