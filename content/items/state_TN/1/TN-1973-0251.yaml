stem: According to Tenn. Comp. R. & Regs. 1260-01-.01, when must an applicant submit the
  Commission-prescribed form and certified copies of court disposition for a felony conviction that
  occurred within the past ten years?
options:
  - Submitting the Commission-prescribed form and certified copies with the application
  - Submitting the Commission-prescribed form and certified copies six months after a denial
  - Submitting the Commission-prescribed form and certified copies thirty days after the conviction
  - Submitting the Commission-prescribed form and certified copies after passing the examination
key: A
explanation: The rule requires the form and documents to be submitted as part of the application
  process for examination. Waiting thirty days, waiting until after passing, or waiting six months
  after a denial are not specified in the rule.
