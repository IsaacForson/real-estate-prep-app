stem: Maria wants to schedule her Tennessee brokers examination. She contacts the Tennessee Real
  Estate Commission directly to request a test date. According to Tenn. Comp. R. & Regs.
  1260-01-.01(2), what must she do?
options:
  - Pay the examination fee to the Commission and await written confirmation of receipt
  - Wait for the Commission to assign her a testing vendor, date, and location
  - Submit her application to the Commission’s licensing division for approval before scheduling
  - Follow the testing vendor’s procedures for appointments, required information, and deadlines
key: D
explanation: The rule requires broker examination applicants to follow the procedures published by
  the testing vendor approved by the Commission concerning appointments, information, and deadlines.
  Waiting for the Commission to assign a vendor or submitting directly to the Commission does not
  satisfy this requirement.
