  source: Tenn. Comp. R. & Regs. 1260-01 § 1260-01-.01(5)(b)
  url: null
  quoted_text: Submit certified copies of the court disposition or other document acceptable to the
    Commission for each conviction, plea of guilty or nolo contendere or a copy of the order or
