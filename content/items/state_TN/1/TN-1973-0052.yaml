stem: Joshua has two felony convictions from the past seven years. He is applying for a Tennessee
  real estate license. According to Tenn. Comp. R. & Regs. 1260-01-.01(5)(b), what must Joshua
  submit for each conviction?
options:
  - A written explanation of the circumstances surrounding each conviction
  - A certified copy of the court disposition or other acceptable document for each conviction
  - A letter from his employer attesting to his rehabilitation for each conviction
  - A copy of his fingerprint card submitted to the TBI for each conviction
key: B
explanation: The rule mandates that for each conviction, plea, or disciplinary sanction within the
  past ten years, the applicant must submit certified copies of the court disposition or other
  acceptable document. A written explanation or employer letter does not meet this requirement.
