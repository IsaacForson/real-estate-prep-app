stem: An applicant who was convicted of a felony involving theft of money five years ago wishes to
  apply for a real estate broker license. According to Tenn. Comp. R. & Regs. § 1260-01-.01, which
  action must the applicant take?
options:
  - The applicant must provide a letter from the court clerk stating that no record exists.
  - The applicant must wait six months after a denial before reapplying for licensure.
  - The applicant must submit a completed Commission-prescribed form detailing the conviction.
  - The applicant must appear before the Commission without the presence of a principal broker.
key: C
explanation: Tenn. Comp. R. & Regs. § 1260-01-.01 requires any applicant with a theft‑related felony
  to complete and submit the specific form prescribed by the Commission that asks for details of the
  conviction, plea, and any disciplinary sanctions. Therefore the applicant must submit that
  Commission‑prescribed form. Providing only a letter from the court clerk does not satisfy the
  statutory requirement. There is no statutory waiting period after a denial, so waiting six months
  is unnecessary. The rule does not require the applicant to appear before the Commission without a
  principal broker present.
