stem: An applicant who must appear before the Tennessee Real Estate Commission due to a
  theft‑related misdemeanor conviction within the past ten years must also ensure the presence of
  which individual at the hearing?
options:
  - The applicant’s sponsoring broker from the employing firm
  - The examination administrator’s representative from the testing vendor
  - The applicant’s legal counsel from the attorney’s office
  - The applicant’s principal broker (or intended principal broker)
key: D
explanation: The rule requires the applicant to ensure the presence of his or her principal broker
  (or intended principal broker) when appearing before the Commission regarding a conviction (Tenn.
  Comp. R. & Regs. 1260-01-.01(5)(c)). An attorney is not mandated by this provision, making that
  distractor incorrect.
