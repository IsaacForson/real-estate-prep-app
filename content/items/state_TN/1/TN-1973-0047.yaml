stem: Under Tenn. Comp. R. & Regs. 1260-01-.01(3), which statement is true regarding an applicant
  who passes the examination?
options:
  - An applicant who passes the examination is automatically granted a license.
  - An applicant who passes the examination must complete additional education before licensure.
  - An applicant who passes the examination must wait six months before applying.
  - An applicant who passes the examination is not necessarily qualified for licensure.
key: D
explanation: The rule explicitly states that passing the examination does not guarantee
  qualification for licensure. Therefore, the correct answer reflects that licensure depends on
  additional requirements beyond the exam. The other options incorrectly suggest automatic
  licensure, extra education, or a waiting period, which are not supported by the cited rule.
