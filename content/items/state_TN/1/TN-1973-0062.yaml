stem: According to Tenn. Comp. R. & Regs. 1260-01-.01(5), what is the look-back period for felony or
  theft-related misdemeanor convictions that trigger additional licensing requirements?
options:
  - Ten (10) years
  - Fifteen (15) years
  - Five (5) years
  - Seven (7) years
key: A
explanation: The rule states that if within the past ten (10) years an applicant has been convicted
  of a felony or theft‑related misdemeanor, they must submit forms and appear before the Commission.
  Therefore the look‑back period is ten years. The five‑year and seven‑year distractors are
  incorrect because the rule specifies ten years, and fifteen years exceeds the period set by the
  rule.
