stem: A Tennessee real estate license applicant received a disciplinary sanction from another
  state’s real estate commission eight years ago for improper advertising. According to Tenn. Comp.
  R. & Regs. 1260-01-.01(5), what is the first step the applicant must take to satisfy the
  Commission’s requirements?
options:
  - Submitting a completed form prescribed by the Commission containing information relevant to the
    disciplinary sanction
  - Submitting certified copies of the disciplinary order issued by the other state's licensing
    board for the sanction
  - Submitting a letter from the other state's licensing board confirming that no further action was
    taken regarding the sanction
  - Submitting a written request to the Commission for a hearing to evaluate the impact of the
    sanction on eligibility
key: A
explanation: The first step under subsection (5)(a) is to complete and submit a form prescribed by
  the Commission containing information relevant to the conviction, plea, or disciplinary sanction.
  Submitting certified copies or a letter from the court clerk pertains to subsection (5)(b) and is
  not the initial requirement.
