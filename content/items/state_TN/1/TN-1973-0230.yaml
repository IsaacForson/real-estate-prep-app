stem: Under Tenn. Comp. R. & Regs. 1260-01-.01(5)(b), what must an applicant submit for each felony
  or theft‑related misdemeanor conviction, plea of guilty or nolo contendere, or disciplinary
  sanction?
options:
  - A completed Commission‑prescribed form detailing the conviction and plea information
  - Proof of completion of a state‑approved rehabilitative education program
  - Certified copies of the court disposition or other acceptable document showing the action and
    its basis
  - A letter from the court clerk confirming that no arrest or charge record exists
key: C
explanation: Under Tenn. Comp. R. & Regs. 1260-01-.01(5)(b), applicants must submit certified copies
  of the court disposition or another document the Commission accepts for each conviction, guilty
  plea, nolo contendere, or disciplinary sanction. The answer choice that describes a completed
  Commission‑prescribed form refers to the separate requirement in subdivision (5)(a) and therefore
  does not satisfy this provision.
