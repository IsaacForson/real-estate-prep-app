stem: An applicant for a Tennessee real estate license was convicted of a felony twelve years ago
  and has no other criminal history. According to Tenn. Comp. R. & Regs. 1260-01-.01, what is the
  applicant required to do regarding this conviction?
options:
  - The applicant must submit the form prescribed by the Commission and certified copies of the
    court disposition
  - The applicant has no additional requirements beyond the standard application process for
    licensure
  - The applicant must appear before the Commission to determine if the conviction constitutes
    grounds for denial
  - The applicant must submit a letter from the court clerk stating the absence of the record
key: B
explanation: Because the conviction occurred twelve years ago, it falls outside the ten‑year
  look‑back period specified in the rule, so the additional requirements of subsection (5) do not
  apply. The applicant only needs to complete the standard application process. The option to submit
  a form and appear before the Commission is incorrect because those steps are required only for
  convictions within the past ten years.
