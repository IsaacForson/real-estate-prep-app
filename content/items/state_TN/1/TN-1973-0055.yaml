stem: An applicant with a felony conviction from three years ago appears before the Tennessee Real
  Estate Commission to determine whether the conviction constitutes grounds for denial of a license.
  According to Tenn. Comp. R. & Regs. 1260-01-.01(5)(c), what must the applicant ensure regarding
  presence at the hearing?
options:
  - Ensuring the presence of his or her principal broker (or intended principal broker) at the
    hearing
  - Ensuring the presence of an attorney licensed in Tennessee representing the applicant at the
    hearing
  - Ensuring the presence of a family member providing emotional support at the hearing
  - Ensuring the presence of the testing vendor representative approved by the Commission at the
    hearing
key: A
explanation: Subsection (5)(c) requires the applicant to ensure the presence of his or her principal
  broker (or intended principal broker) in accordance with rule 1260-01-.19 when appearing before
  the Commission to determine if the conviction constitutes grounds for denial. The other options
  describe individuals not mandated by the rule.
