stem: Under Tenn. Comp. R. & Regs. 1260-01-.01(4), which of the following actions is the Tennessee
  Real Estate Commission prohibited from taking when an applicant possesses a certificate of
  employability under T.C.A. § 40-29-107?
options:
  - Denying the license based solely on the applicant's past criminal record
  - Requiring the applicant to appear before the Commission for a case‑by‑case review
  - Requesting certified copies of the court disposition for the conviction
  - Considering the applicant's rehabilitation efforts during the review
key: A
explanation: The rule explicitly states that a person with a certificate of employability shall not
  be denied a license based solely on their past criminal record, so denial on that basis is
  prohibited. Requiring an appearance before the Commission is actually mandated, not prohibited,
  making it an incorrect choice.
