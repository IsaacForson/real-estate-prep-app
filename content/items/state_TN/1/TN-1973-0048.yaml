stem: An applicant holds a certificate of employability under T.C.A. § 40-29-107 and has a prior
  felony theft conviction. According to Tenn. Comp. R. & Regs. 1260-01-.01(4), what must the
  Tennessee Real Estate Commission do before making a licensing decision?
options:
  - The Commission must deny the license based solely on the applicant's criminal record.
  - The Commission must grant the license because the applicant holds a certificate of employability.
  - The Commission must require the applicant to appear before it for a case‑by‑case review of
    eligibility.
  - The Commission must refer the applicant to the Attorney General for further investigation.
key: C
explanation: Under Tenn. Comp. R. & Regs. 1260-01-.01(4), a holder of a certificate of employability
  may not be denied a license solely because of a prior criminal conviction; the applicant must be
  required to appear before the Commission so the Commission can consider eligibility on a
  case‑by‑case basis. Consequently, a statement that the Commission must deny the license
  automatically, or that it must grant the license automatically, is incorrect. Likewise, a
  requirement that the Commission refer the applicant to the Attorney General is not provided for in
  the rule.
