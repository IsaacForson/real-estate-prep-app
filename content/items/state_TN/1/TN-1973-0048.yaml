  quoted_text: if a person possesses a certificate of employability pursuant to T.C.A. § 40-29-107,
    that person shall not be denied the issuance of a license based solely on the person’s past
    record of criminal activity but shall instead be required to appear before the Commission for
    the purpose of the Commission considering on a case-by-case basis whether to grant or deny the
