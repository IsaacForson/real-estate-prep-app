stem: An applicant’s misdemeanor theft of services charge is ten years old, and the court clerk
  confirms that no record of the arrest or charge exists. According to Tenn. Comp. R. & Regs.
  1260-01-.01(5)(b)2, what must the applicant submit?
options:
  - The applicant must submit certified copies of the court disposition for each charge.
  - The applicant must appear before the Commission for a case‑by‑case review.
  - The applicant must submit a letter from the court clerk stating the absence of the record(s).
  - The applicant must complete and submit the form prescribed by the Commission.
key: C
explanation: When the court has no record due to the age of the record or any other reason, the rule
  requires the applicant to submit a letter from the court clerk confirming the absence of the
  record. The other options describe steps that are either irrelevant (certified copies when none
  exist), required in other contexts (the form), or occur later in the process (appearance before
  the Commission).
