stem: An applicant appears before the Tennessee Real Estate Commission to request licensure after a
  theft-related felony conviction and is denied. According to Tenn. Comp. R. & Regs. § 1260-01-.01,
  when may the applicant next seek reconsideration?
options:
  - The applicant may seek reconsideration one year after the date of denial.
  - The applicant may seek reconsideration three months after the date of denial.
  - The applicant may seek reconsideration six months after the date of denial.
  - The applicant may seek reconsideration immediately following the denial.
key: C
explanation: The rule states that an applicant who is denied after appearing before the Commission
  cannot be eligible for reconsideration for six months from the date of denial. Therefore, the
  choice that the applicant may seek reconsideration immediately after the denial is incorrect
  because the six‑month waiting period is required.
