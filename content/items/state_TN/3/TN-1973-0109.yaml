stem: A licensee posts a property video on Instagram. The firm name is shown in the video caption,
  but the telephone number is only accessible by clicking a link in the bio that leads to a separate
  contact page. According to Tenn. Comp. R. & Regs. § 1260-02-.12(6)(b), what is required for the
  firm name and telephone number?
options:
  - The licensee must display the firm name and telephone number directly on the video image.
  - The licensee must ensure the firm name and telephone number are no more than one click away from
    the viewable page.
  - The licensee must include the firm name and telephone number in the video's audio narration.
  - The licensee must post the firm name and telephone number as a comment under the video.
key: B
explanation: The rule requires that the firm name and telephone number be no more than one click
  away from the viewable page on social media. The option stating that the licensee must ensure the
  firm name and telephone number are no more than one click away from the viewable page satisfies
  this requirement. The option stating that the licensee must display the firm name and telephone
  number directly on the video image is incorrect because the rule does not require the information
  to appear on the video itself; it only limits the number of clicks needed to access it.
