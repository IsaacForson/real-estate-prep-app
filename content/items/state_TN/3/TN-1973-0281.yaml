    scripts — § 1260-02-.12(4)(a)"
  url: null
  quoted_text: Any licensee using a franchise trade name or advertising as a member of a cooperative
    group shall clearly and unmistakably indicate in the advertisement his name, firm name and firm
    telephone number (all as registered with the Tennessee Real Estate Commission) adjacent to any
    specific properties advertised for sale or lease in any media.
