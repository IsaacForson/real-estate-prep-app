stem: A licensee operating under the 'Coldwell Banker' franchise advertises a specific listing on
  their website, displaying the property photo and price. Under Tenn. Comp. R. & Regs. §
  1260-02-.12(4)(a), what must the licensee include adjacent to that property advertisement?
options:
  - The firm name and the licensee's email address
  - The franchise name and firm telephone number
  - The licensee's name, firm name, and firm telephone number
  - The franchise name and the firm's website URL
key: C
explanation: The rule requires a licensee using a franchise trade name to clearly and unmistakably
  indicate his name, firm name, and firm telephone number adjacent to any specific properties
  advertised. Therefore, the correct answer includes all three elements. The distractor that omits
  the licensee's name fails to meet the requirement to identify the individual licensee.
citation:
  source: "Tenn. Comp. R. & Regs. 1260-02 — Tenn. Comp. R. & Regs. ch. 1260-02 — Tennessee Real Estate
