stem: Which of the following is **NOT** considered advertising?
options:
  - A Facebook post promoting a listing
  - A yard sign advertising a property for sale
  - A branded t-shirt given to clients
  - An email signature with name and phone
key: C
explanation: Under Tenn. Comp. R. & Regs. § 1260-02-.12, advertising does not include promotional
  materials such as hats, pens, notepads, t-shirts, name tags, business cards, or sponsorship of
  charitable and community events. A branded t-shirt given to clients is therefore not advertising.
  In contrast, a Facebook post promoting a listing is a social‑media communication that the rule
  treats as advertising.
