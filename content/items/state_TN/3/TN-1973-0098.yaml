stem: "According to Tenn. Comp. R. & Regs. § 1260-02-.12(4)(b), when a licensee uses a franchise
  trade name on business cards, the licensee must clearly and unmistakably indicate:"
options:
  - The licensee must display his name, firm name, and office address.
  - The licensee must display his name, firm name, and email address.
  - The licensee must display his name, firm name, and firm telephone number.
  - The licensee must display his name, firm name, and website URL.
key: C
explanation: Tenn. Comp. R. & Regs. § 1260-02-.12(4)(b) requires that any business card using a
  franchise trade name include the licensee’s personal name, the firm’s name, and the firm’s
  telephone number as registered with the Commission. The answer that states the licensee must
  display his name, firm name, and firm telephone number meets that requirement. The other answer
  choices each replace the required telephone number with an email address, a website URL, or an
  office address, which the regulation does not mandate.
