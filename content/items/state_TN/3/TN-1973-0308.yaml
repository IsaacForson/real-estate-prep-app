stem: A licensee's YouTube channel features a property tour video; the firm name and telephone
  number appear in the video description, which requires one click to view. Is the advertisement
  compliant under Tenn. Comp. R. & Regs. § 1260-02-.12(6)(b)?
options:
  - Yes, because the firm name and telephone number are accessible within one click.
  - No, because the firm name and telephone number must be visible without any clicks.
  - Yes, because YouTube is not considered social media under the rule.
  - No, because the licensee must also include the firm name in the video itself.
key: A
explanation: The rule requires the firm name and telephone number to be no more than one click away;
  one click satisfies this requirement, making the advertisement compliant. The distractor claiming
  visibility without any clicks is incorrect because the rule permits up to one click, not zero
  clicks only.
