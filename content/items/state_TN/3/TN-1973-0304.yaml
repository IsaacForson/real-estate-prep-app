stem: According to Tenn. Comp. R. & Regs. § 1260-02-.12, which of the following is exempt from the
  definition of advertising?
options:
  - A t-shirt given to clients bearing the licensee's name
  - A website displaying property listings
  - A social media post promoting a recent sale
  - A flyer advertising a specific property for sale
key: A
explanation: The rule explicitly states that advertising does not include promotional materials such
  as t-shirts given to clients, so a t-shirt bearing the licensee's name is not considered
  advertising. A flyer advertising a specific property promotes the sale of real property and
  therefore falls under the definition of advertising.
