stem: "Under Tenn. Comp. R. & Regs. § 1260-02-.12, promotional materials such as hats, pens, and
  notepads given to clients are classified as:"
options:
  - Advertising that must show the firm name and phone.
  - Exempt from the definition of advertising.
  - Requires principal broker approval before distribution.
  - Follows the same rules as website ads for online promos.
key: B
explanation: The rule explicitly states that advertising does not include promotional materials such
  as hats, pens, notepads, t-shirts, name tags, business cards, and the sponsorship of charitable
  and community events. Therefore, hats, pens, and notepads given to clients fall under this
  exemption and are not considered advertising. A common misconception is that any item bearing the
  firm’s information must be treated as advertising, such as the idea that these items must show the
  firm name and phone, but the rule carves out these specific promotional items. Requirements like
  needing principal broker approval before distribution or following the same rules as website ads
  for online promos do not apply to exempt materials.
