stem: According to Tenn. Comp. R. & Regs. § 1260-02-.12(3)(a), a licensee is prohibited from
  advertising in a manner that suggests the licensee is **NOT** engaged in which activity?
options:
  - Mortgage lending services
  - Property management
  - Home inspection services
  - Real estate business
key: D
explanation: The rule states that a licensee shall not advertise to sell, purchase, exchange, rent,
  or lease property in a manner indicating that the licensee is not engaged in the real estate
  business. Therefore, advertising that suggests the licensee is not in the real estate business is
  prohibited. Property management is not mentioned in this provision, so suggesting the licensee is
  not engaged in property management would not violate this rule.
