stem: "According to Tenn. Comp. R. & Regs. § 1260-02-.12(2), the term 'firm name' means:"
options:
  - The name of the individual licensee as registered with the Tennessee Real Estate Commission
  - The d/b/a name only, if applicable, as registered with the Tennessee Real Estate Commission
  - Either the full firm name as licensed with the Commission or the d/b/a name, if applicable
  - The franchise trade name displayed on all promotional materials used by the licensee
key: C
explanation: The rule defines 'firm name' as either the full firm name as licensed with the
  Commission or the d/b/a name if applicable. The option stating that the firm name is either the
  full firm name as licensed with the Commission or the d/b/a name, if applicable matches this
  definition. The option stating that the firm name is the name of the individual licensee as
  registered with the Tennessee Real Estate Commission is incorrect because it refers only to the
  individual licensee's name, which is not the definition of firm name.
