stem: A licensee offers a free home warranty to a prospective buyer to induce the buyer to sign an
  agency agreement. Under Tenn. Comp. R. & Regs. § 1260-02-.12(7)(b), what must be true about this
  offer?
options:
  - The offer must be made in writing but details may be in the contract
  - The offer must be made in writing only, without disclosure of details
  - The offer must be made in writing and disclose details on its face
  - The offer must be made verbally with details disclosed later today
key: C
explanation: The rule specifies that any offer, guaranty, warranty, or the like made to induce an
  individual to enter into an agency relationship must be made in writing and must disclose all
  pertinent details on the face of the offer or advertisement. Therefore, the offer must be in
  writing with the details shown on its face. An offer made in writing only, without disclosure of
  details, fails to meet the disclosure requirement.
