stem: A licensee places a yard sign advertising a house for sale that is listed by another
  brokerage. The licensee did not obtain written permission from the listing broker. Which rule does
  this violate?
options:
  - The rule requiring firm name and telephone number in all advertising
  - The rule prohibiting ads for another licensee's property without written permission
  - The rule requiring firm name and telephone number on each website page
  - The rule prohibiting false misleading or deceptive advertising claims
key: B
explanation: Tenn. Comp. R. & Regs. § 1260-02-.12 prohibits a licensee from advertising property
  listed by another licensee without written authorization from the listing agent or listing broker.
  Placing a yard sign for another broker's listing without permission violates this provision. The
  other options describe different advertising requirements that are not directly implicated by the
  unauthorized third-party listing scenario.
