stem: A licensee wants to advertise a property that is listed by another brokerage on their website.
  Under Tenn. Comp. R. & Regs. § 1260-02-.12(3)(e), what must the licensee obtain before publishing
  the advertisement?
options:
  - The licensee must obtain written authorization from the listing agent or listing broker.
  - The licensee must obtain written authorization from the property owner only.
  - The licensee must obtain verbal permission from the listing agent.
  - The licensee must obtain no authorization if the property is vacant.
key: A
explanation: The rule prohibits advertising property listed by another licensee without written
  authorization from the listing agent or listing broker, so the licensee must secure that written
  permission. The distractor suggesting verbal permission from the listing agent is insufficient
  because the rule requires written authorization.
