stem: A licensee operates a real estate website that displays property listings. The firm name and
  telephone number appear on the homepage but are missing from the 'Contact' page. According to
  Tenn. Comp. R. & Regs. § 1260-02-.12(5)(a), what must the licensee do to comply?
options:
  - The licensee must include the firm name only, as the telephone number is optional.
  - The licensee must ensure the firm name and telephone number conspicuously appear on each page of
    the website.
  - The licensee must add a disclaimer that some listings may not belong to the firm.
  - The licensee must obtain written authorization from the property owners before displaying
    listings.
key: B
explanation: Tenn. Comp. R. & Regs. § 1260-02-.12(5)(a) requires that the firm name and the firm
  telephone number listed on file with the Commission must conspicuously appear on each page of the
  website. The option stating that the licensee must ensure the firm name and telephone number
  conspicuously appear on each page of the website is correct. The option suggesting the licensee
  must add a disclaimer that some listings may not belong to the firm is incorrect because that
  requirement is addressed in a different subsection and does not satisfy the specific visibility
  requirement for firm identification.
