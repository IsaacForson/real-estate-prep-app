stem: A licensee posts a property listing on a Facebook page for the firm. Under Tenn. Comp. R. &
  Regs. § 1260-02-.12(6)(b), what must be true about the firm name and telephone number on that
  page?
options:
  - The firm name and telephone number must be visible without any click
  - The firm name and telephone number must be accessible with one click
  - The firm name and telephone number must be listed in the page bio
  - The firm name and telephone number must be included in every post
key: B
explanation: The rule requires that the firm name and firm telephone number listed on file with the
  Commission be no more than one click away from the viewable page. Therefore, the information must
  be accessible with at most one click. Requiring the information to be visible without any click is
  stricter than the rule demands, so it is not required.
