stem: "According to Tenn. Comp. R. & Regs. § 1260-02-.12(6)(a), the term “social media” means:"
options:
  - Internet-based applications or platforms that allow the public to create and share content and
    information.
  - Internet-based applications or platforms that are used exclusively for professional networking.
  - Internet-based applications or platforms that require a paid subscription to access.
  - Internet-based applications or platforms that are limited to video sharing only.
key: A
explanation: The rule defines social media as internet‑based applications or platforms that allow
  the public to create and share content and information, explicitly naming Facebook, Twitter,
  Instagram and LinkedIn as examples. The distractor describing platforms limited to video sharing
  only is incorrect because the definition is broader and not restricted to a single media type.
