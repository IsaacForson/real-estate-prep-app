stem: A licensee sponsors a community clean‑up event and places the firm’s logo on volunteer shirts.
  According to Tenn. Comp. R. & Regs. § 1260-02-.12, is this activity subject to the advertising
  requirements such as displaying the firm name and telephone number?
options:
  - Yes, because any public display of the logo is considered advertising under the rule.
  - No, because sponsorship of charitable and community events is excluded from the definition of
    advertising.
  - Yes, unless the event is private and no public advertising is involved.
  - No, only if the licensee also promotes the event through paid advertising.
key: B
explanation: The rule’s definition of advertising expressly excludes sponsorship of charitable and
  community events, so placing the firm’s logo on volunteer shirts for a community clean‑up is not
  advertising and does not trigger the firm‑name‑and‑telephone‑number requirement. The claim that
  any public logo display is advertising overlooks this exemption. The suggestion that the activity
  would be advertising only if the event were private or if flyers were distributed adds irrelevant
  conditions, because the sponsorship itself is already outside the scope of advertising. The notion
  that the licensee must also promote the event through paid advertising incorrectly adds a
  requirement that the rule does not impose.
