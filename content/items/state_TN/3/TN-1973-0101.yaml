stem: A licensee's real estate website includes property listings but omits the firm name and
  telephone number on the 'About Us' page. According to Tennessee advertising rules, this omission
  constitutes a violation of which provision?
options:
  - The rule requiring all advertising to be supervised by the principal broker
  - The rule requiring firm name and telephone number on each website page
  - The rule prohibiting ads that show only a franchise name without the firm name
  - The rule requiring listing information to be kept current and accurate
key: B
explanation: Tennessee advertising rules require that the firm name and the firm telephone number
  listed on file with the Commission must conspicuously appear on each page of the website. Omitting
  this information on the “About Us” page violates that specific requirement. The other options
  refer to supervision, franchise naming, and listing accuracy, none of which address the missing
  firm contact information on a website page.
