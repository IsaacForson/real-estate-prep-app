stem: According to Tennessee Real Estate Commission advertising rules, what must all advertising
  that promotes a licensee or the sale or lease of real property include?
options:
  - The licensee's personal email address displayed on all promotional materials
  - The firm name and firm telephone number as listed on file with the Commission
  - The licensee's social media handles used for professional networking
  - The licensee's photograph and brokerage logo featured in print ads
key: B
explanation: The regulation requires that advertising list the firm name and the firm telephone
  number as filed with the Commission (Tenn. Comp. R. & Regs. 1260‑02‑.12). Options that provide
  only a personal email address, social‑media handles, or a photograph and logo do not meet this
  requirement.
