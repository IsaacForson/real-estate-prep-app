stem: A licensee hands out business cards at a networking conference. Under Tenn. Comp. R. & Regs. §
  1260-02-.12, are these business cards considered advertising that must include the firm name and
  telephone number?
options:
  - No, because business cards are promotional materials exempt from advertising rules.
  - Yes, because they promote the licensee and must display firm contact information.
  - No, only if the card is distributed to a prospective client as part of a solicitation.
  - Yes, unless the card also displays a property listing or price information.
key: A
explanation: The rule states that advertising does not include promotional materials that advertise
  a licensee such as hats, pens, notepads, t-shirts, name tags, business cards, and the sponsorship
  of charitable and community events. Therefore, handing out business cards at a conference does not
  require the firm name and telephone number to be displayed. The option claiming that business
  cards must display firm contact information is incorrect because the rule explicitly exempts
  business cards from the advertising definition. The option that limits the exemption to cards
  given to prospective clients adds a condition not found in the rule; the exemption applies
  regardless of who receives the card. The option that ties the exemption to the presence of a
  property listing or price information is also incorrect, as the rule’s exemption does not depend
  on such content.
