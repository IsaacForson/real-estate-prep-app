stem: According to Tenn. Comp. R. & Regs. § 1260-02-.12, which of the following is considered
  advertising?
options:
  - A branded t-shirt given to clients
  - A flyer advertising a property for sale
  - Sponsorship of a local charity event
  - A name tag with the licensee's name
key: B
explanation: The rule defines advertising to include signs, flyers, letterheads, e-mail signatures,
  websites, social media communications, and video or audio recordings transmitted through internet
  or broadcast streaming. A flyer advertising a property for sale is expressly included as an
  example of advertising. A branded t-shirt, sponsorship of a charitable event, and a name tag are
  listed as promotional materials that are excluded from the definition of advertising.
