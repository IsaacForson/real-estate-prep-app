stem: According to Tenn. Comp. R. & Regs. § 1260-02-.12(3)(b), what size requirement applies to the
  firm name in advertising?
options:
  - The firm name must appear in letters the same size or larger than the licensee's name
  - The firm name must appear in letters at least twice the size of the licensee's name
  - The firm name must appear in letters smaller than the licensee's name
  - The firm name must appear in letters the same size as the licensee's team name
key: A
explanation: The rule explicitly states that the firm name must appear in letters the same size or
  larger than those spelling out the name of a licensee or any team, group, or similar entity.
  Therefore, the correct answer is the option that matches this size‑parity requirement. The
  distractor suggesting the name must be at least twice as large adds a multiplier that the rule
  does not require.
