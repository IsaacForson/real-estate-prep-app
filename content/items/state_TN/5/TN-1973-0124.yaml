stem: Under Tenn. Comp. R. & Regs. 1260-02-.09(11), when must trust money be deposited into an
  escrow or trustee account?
options:
  - Trust money must be deposited within a reasonable time after receipt of the offer.
  - Trust money must be deposited promptly upon acceptance unless the offer states otherwise.
  - Trust money must be deposited at the time the offer is accepted and the contract is signed.
  - Trust money must be deposited after the broker obtains written approval from the principal
    broker.
key: B
explanation: The rule requires deposit promptly upon acceptance of the offer unless the offer
  specifies a different deposit deadline. Depositing within a reasonable time after receipt is not
  the standard; the trigger is acceptance of the offer.
