stem: A buyer submits a written offer to purchase a property. According to Tenn. Comp. R. & Regs.
  1260-02-.08, what must the licensee do with the offer?
options:
  - The licensee must tender the offer promptly to the seller
  - The licensee must hold the offer until a contract is signed
  - The licensee must notify the seller in writing within 24 hours
  - The licensee must deposit earnest money accompanying the offer
key: A
explanation: The rule requires the licensee to promptly tender every written offer to purchase or
  sell obtained on a property until a contract is signed by all parties. Holding the offer until a
  contract is signed contradicts the prompt tendering requirement.
