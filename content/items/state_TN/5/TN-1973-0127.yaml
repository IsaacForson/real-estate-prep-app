stem: "A licensee deposits her personal savings into the same bank account where she holds earnest
  money received from clients. According to Tenn. Comp. R. & Regs. 1260-02-.09(13), this action is:"
options:
  - Permitted because the funds are from the same source.
  - Prohibited as commingling of funds.
  - Allowed if the account is interest-bearing.
  - Required to maintain accurate records.
key: B
explanation: According to Tenn. Comp. R. & Regs. 1260-02-.09(13), commingling of funds contained
  within firm accounts is expressly prohibited. Depositing personal savings into the same account as
  clients’ earnest money constitutes commingling, which is not allowed. The idea that depositing
  personal savings is required to maintain accurate records is incorrect because the prohibition
  applies regardless of whether the funds originate from the same source.
