stem: A principal broker is holding trust money from a buyer's earnest money deposit. Which of the
  following situations does **NOT** allow the principal broker to properly disburse the trust money
  under Tenn. Comp. R. & Regs. 1260-02-.09(7)?
options:
  - Upon the rejection of an offer to purchase the property
  - Upon securing a written agreement signed by all parties
  - Upon receipt of a written request for disbursement
  - Upon the order of a court of competent jurisdiction
key: C
explanation: Rule.09(7) lists specific circumstances when a principal broker may disburse trust
  money, and receipt of a written request for disbursement is not among them. The rejection of an
  offer is permitted under subsection (d).
citation:
  source: "Tenn. Comp. R. & Regs. 1260-02 — Tenn. Comp. R. & Regs. ch. 1260-02 — Tennessee Real Estate
    Commission rules: Rules of Conduct (rev. Sept. 2025), official Secretary of State PDF read via
    Internet Archive capture of 2026-04-16 because publications.tnsosfiles.com returns 403 to
    scripts — § 1260-02-.09"
  url: null
  quoted_text: "(7) A principal broker may properly disburse trust money: (a) Upon a reasonable
    interpretation of the contract which authorizes him to hold the trust money; (b) Upon securing a
    written agreement which is signed by all parties having an interest in such and is separate from
    the contract which authorizes him to hold the trust money; (c) At the closing of the
    transaction; (d) Upon the rejection of an offer to purchase, sell, rent, lease, exchange or
    option real estate; (e) Upon the withdrawal of an offer not yet accepted to purchase, sell,
    rent, lease, exchange or option real estate; (f) Upon filing an interpleader action in a court
    of competent jurisdiction; or (g) Upon the order of a court of competent jurisdiction."
