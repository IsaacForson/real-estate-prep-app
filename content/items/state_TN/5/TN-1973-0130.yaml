stem: An affiliated broker receives an earnest money check from a buyer after showing a property.
  What must the affiliated broker do with the trust money upon receipt?
options:
  - Pay over the check to the principal broker with whom he is affiliated immediately
  - Deposit the check into his personal checking account for safekeeping
  - Hold the check in his own escrow account until closing
  - Return the check to the buyer unless the seller signs a purchase agreement
key: A
explanation: Under Tenn. Comp. R. & Regs. 1260-02-.09(3), an affiliated broker must pay over all
  trust money to the principal broker with whom he is affiliated immediately upon receipt.
  Depositing the money personally or holding it in a separate account violates the requirement, and
  returning it to the buyer is not permitted absent a contract provision.
