stem: Under Tennessee real estate licensing rules, when must trust money be deposited into an escrow
  or trustee account after an offer is accepted?
options:
  - Trust money must be deposited promptly upon acceptance of the offer unless the offer states
    otherwise
  - Trust money must be deposited within 12 hours of offer acceptance unless the offer states
    otherwise
  - Trust money must be deposited within five business days of offer acceptance unless the offer
    states otherwise
  - Trust money must be deposited at the closing of the transaction unless the offer specifies
    earlier
key: A
explanation: The rule states trust money shall be deposited promptly upon acceptance of the offer
  unless the offer contains a different deposit instruction. The 24‑hour option imposes a specific
  deadline not found in the rule.
