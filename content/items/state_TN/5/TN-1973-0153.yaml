stem: A licensee uses electronic recordkeeping for transaction files. What must be true about
  accessibility of those documents?
options:
  - Documents must be accessible in an organized format within twenty‑four (24) hours of any request
    for inspection by Commission representatives.
  - Documents must be accessible within eight (8) hours of any request for inspection by Commission
    representatives.
  - Documents must be accessible only during normal daytime working hours for Commission inspection.
  - Documents must be accessible exclusively to the licensee and not to Commission representatives
    for inspection.
key: A
explanation: The rule requires that retained documents be readily accessible in an organized format
  within twenty‑four hours of any Commission inspection request. The other time frames or
  restrictions are not prescribed by the rule.
