stem: A Tennessee Real Estate Commission representative requests inspection of a specific closing
  statement that is stored electronically. The licensee’s firm uses an electronic recordkeeping
  system. According to Tennessee Real Estate Commission rules, within what time frame must the
  licensee make the document readily accessible?
options:
  - Forty‑eight (48) hours
  - Twenty‑four (24) hours
  - Eight (8) hours
  - Two (2) hours
key: B
explanation: The rule requires that all documents required to be retained be readily accessible in
  an organized format providing ease of identification within twenty‑four hours of any request for
  inspection by Commission representatives. This makes the twenty‑four‑hour option correct. The
  forty‑eight‑hour distractor is incorrect because the rule specifies twenty‑four hours, not
  forty‑eight.
