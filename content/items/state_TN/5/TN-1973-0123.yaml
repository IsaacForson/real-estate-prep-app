stem: A buyer submits a written request for the return of earnest money after the seller rejects the
  offer. The licensee holding the earnest money has no compelling reason to delay. According to
  Tennessee Real Estate Commission rules, within how many calendar days must the licensee disburse,
  interplead, or turn over the earnest money to an attorney for interpleader?
options:
  - Fourteen (14) calendar days
  - Twenty‑one (21) calendar days
  - Seven (7) calendar days
  - Thirty (30) calendar days
key: B
explanation: The rule states that absent a compelling reason, earnest money must be disbursed,
  interpleaded, or turned over to an attorney for interpleader within twenty‑one calendar days of
  receiving a written request for disbursement. This makes the twenty‑one‑day option correct. The
  fourteen‑day distractor is incorrect because the rule specifies twenty‑one days, not fourteen.
