stem: A principal broker whose firm uses electronic recordkeeping must develop and utilize a
  retention schedule that does which of the following?
options:
  - The retention schedule must ensure records are destroyed after one year, regardless of any legal
    requirement.
  - The retention schedule must safeguard security, authenticity, and accuracy for the entire
    required retention period.
  - The retention schedule must allow commingling of trust money with personal funds, as long as the
    broker documents the mixing.
  - The retention schedule must require paper copies of all electronic records, even if the
    electronic system is secure and accessible.
key: B
explanation: The rule requires the principal broker to develop a retention schedule that safeguards
  security, authenticity, and accuracy for the entire required retention period. Destroying records
  after one year contradicts the required three‑year retention period.
