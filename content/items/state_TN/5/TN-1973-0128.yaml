stem: "A property management company collects security deposits from tenants for leased residential
  units. Under Tenn. Comp. R. & Regs. 1260-02-.09(12), these deposits must be held:"
options:
  - In the same escrow account used for sales transactions, contrary to the requirement.
  - In one or more separate escrow or trustee accounts distinct from the sales escrow account.
  - In the licensee's personal checking account for convenience.
  - Only if the deposits exceed $1,000, as some might think.
key: B
explanation: The rule requires that trust money related to lease property be held in one or more
  separate escrow or trustee accounts, in addition to any account used for sales transactions.
  Therefore, security deposits from tenants must be placed in a separate account. Placing the
  deposits in the licensee's personal checking account is incorrect because commingling lease trust
  money with sales trust money violates the separation requirement.
