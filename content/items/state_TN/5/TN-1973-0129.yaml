stem: Under Tenn. Comp. R. & Regs. 1260-02-.01(1), what is required for a licensee to engage in real
  estate activity in an office?
options:
  - There must be a principal broker devoted to the full time management of the office
  - The office must have at least two licensed affiliate brokers present
  - The licensee must be sponsored by a principal broker who works part-time
  - The licensee must obtain a separate permit from the local government
key: A
explanation: The rule states that no licensee may engage in any real estate activity in an office
  unless there is a principal broker devoted to the full time management of that office. The other
  options either reduce the broker's time commitment, add unnecessary staffing, or introduce an
  unrelated permit requirement.
