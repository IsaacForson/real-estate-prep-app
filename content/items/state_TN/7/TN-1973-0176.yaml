stem: A licensee advertises the office in a local newspaper and lists the office telephone number in
  a directory, but does not maintain a mail drop at the office. According to Tenn. Comp. R. & Regs.
  1260-02-.03(3)(a), is the licensee deemed to maintain a branch office?
options:
  - The licensee is not deemed to maintain a branch office because advertising alone is insufficient
    for branch status.
  - The licensee is deemed to maintain a branch office only when a mail drop is also maintained.
  - The licensee is deemed to maintain a branch office because advertising the office satisfies the
    criterion.
  - The licensee is not deemed to maintain a branch office unless telephone calls are solicited.
key: C
explanation: Under.03(3)(a), a licensee is deemed to maintain a branch office if they advertise the
  office, have a mail drop, or solicit telephone calls. Advertising alone satisfies the criterion,
  so the licensee is deemed to maintain a branch office. The distractor incorrectly adds a mail drop
  requirement.
