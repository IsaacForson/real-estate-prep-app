stem: According to Tenn. Comp. R. & Regs. 1260-02-.05, how may a post office box be used in relation
  to a licensed real estate firm's business address?
options:
  - It must be accompanied by a written certification of zoning compliance.
  - It may be included in the business address for the purpose of receiving mail.
  - It may be used as the sole business location for the firm.
  - It must be displayed on the outside of the firm's place of business.
key: B
explanation: The rule explicitly prohibits using a post office box as a business location but allows
  it to be included in the business address for receiving mail. Therefore, the correct description
  is that the post office box may be included in the address for mail receipt. The option about
  displaying a sign confuses this rule with the signage requirement in.03(1).
