stem: A licensee maintains a mail drop registered with the United States Postal Service at an office
  and solicits telephone calls to that office, but does not advertise the office. According to Tenn.
  Comp. R. & Regs. 1260-02-.03(3)(a), is the licensee deemed to maintain a branch office?
options:
  - Yes, but only if the licensee also advertises the office in addition to the other actions.
  - No, because advertising the office is also required to qualify as a branch office.
  - Yes, because maintaining a mail drop or soliciting telephone calls each independently qualifies
    as a branch office.
  - No, because none of the three criteria for a branch office are satisfied.
key: C
explanation: "Tenn. Comp. R. & Regs. 1260-02-.03(3)(a) establishes that any one of the following
  actions is sufficient to deem a licensee as maintaining a branch office: advertising the office,
  having a registered mail drop, or soliciting telephone calls. Because the licensee has a mail drop
  and solicits telephone calls, the requirement is met without the need for advertising. The option
  suggesting that advertising is required is incorrect because the rule specifies that any single
  criterion is sufficient."
citation:
  source: "Tenn. Comp. R. & Regs. ch. 1260-02 — Tennessee Real Estate Commission rules: Rules of
    Conduct (rev. Sept. 2025), official Secretary of State PDF read via Internet Archive capture of
    2026-04-16 because publications.tnsosfiles.com returns 403 to scripts — § 1260-02-.03"
  url: null
  quoted_text: 1. Advertises the office in any manner for the purpose of attracting the public; 2. Has
    a mail drop at the office which is registered with and served by the United States Postal
    Service; or 3. Invites or solicits telephone calls to the office (by such means as advertising
    or listing in a telephone directory).
