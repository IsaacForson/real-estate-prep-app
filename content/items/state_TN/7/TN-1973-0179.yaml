stem: "A licensee lists a post office box as the mailing address on all advertising while
  maintaining a physical office location elsewhere. According to Tennessee Real Estate Commission
  rules, this practice is:"
options:
  - Permitted because a post office box may be used for telephone solicitation as a business location
  - Permitted because a post office box may be included in a business address for receiving mail
  - Permitted because a post office box may be used as the sole business address for receiving mail
  - Permitted because a post office box may be advertised as the main office without a physical
    location
key: B
explanation: The rule allows a post office box to be included in a business address for receiving
  mail, so using it as a mailing address while maintaining a physical office is permitted. The
  option claiming it is prohibited unless approved misstates the rule, as no approval is needed for
  this permissible use.
