stem: A licensee submits an application for a change of location but does not include a written
  certification of zoning compliance. According to Tenn. Comp. R. & Regs. 1260-02-.03(2), what is
  the likely outcome?
options:
  - The application will be accepted without the certification.
  - The application will be denied due to missing certification.
  - The application will be accepted but the licensee will be fined.
  - The application will be pending until the certification is submitted.
key: B
explanation: The rule requires that an application for a license or change of location be
  accompanied by a written certification of zoning compliance. Without this certification, the
  application is incomplete and will be denied. The distractor about a fine is not supported by the
  rule.
