stem: "A licensee advertises a satellite office in a local newspaper to attract the public.
  According to Tennessee Real Estate Commission rules, this office is considered a:"
options:
  - An office classified as a branch office
  - An office classified as a model home
  - An office classified as a principal office
  - An office classified as a temporary office
key: A
explanation: Advertising an office to attract the public meets the definition of a branch office
  under the rule. A model home exemption requires additional conditions such as no mail drop and not
  being the sole sales office, which are not satisfied by mere advertising.
