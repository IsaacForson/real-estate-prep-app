stem: A licensee does not advertise the office and has no mail drop, but lists the office telephone
  number in a directory to solicit calls. According to Tenn. Comp. R. & Regs. 1260-02-.03(3)(a), is
  the licensee deemed to maintain a branch office?
options:
  - Yes, because inviting or soliciting telephone calls qualifies as maintaining a branch
  - No, because advertising and a mail drop are both required to constitute a branch
  - Yes, but only if the licensee also advertises the office in a newspaper
  - No, unless the licensee also maintains a mail drop at the office
key: A
explanation: The rule states that a licensee is deemed to maintain a branch if they invite or
  solicit telephone calls to the office, regardless of advertising or mail drop. Therefore,
  soliciting calls alone is sufficient. The distractor claiming both advertising and a mail drop are
  required misreads the rule, which lists the three alternatives separately.
citation:
  source: Tenn. Comp. R. & Regs. 1260-02-.03(3)(a)
  url: null
  quoted_text: "(a) For purposes of T.C.A. § 62-13-309(d), a licensee is deemed to maintain a “branch”
    if the licensee: 1. Advertises the office in any manner for the purpose of attracting the
    public; 2. Has a mail drop at the office which is registered with and served by the United
    States Postal Service; or 3. Invites or solicits telephone calls to the office (by such means as
    advertising or listing in a telephone directory)."
