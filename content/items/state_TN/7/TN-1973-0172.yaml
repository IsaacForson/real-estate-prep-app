stem: Under Tenn. Comp. R. & Regs. 1260-02-.05, may a licensed real estate firm include a post
  office box in its business address for the purpose of receiving mail?
options:
  - Yes, but only if the post office box is the sole business address.
  - Yes, but only if the firm also maintains a physical office location.
  - No, a post office box cannot be used in any part of the business address.
  - Yes, it is permitted to include a post office box in the business address for receiving mail.
key: D
explanation: Under Tenn. Comp. R. & Regs. 1260-02-.05, a post office box may be included in a
  business address for receiving mail. The restriction applies only to using a post office box as
  the business location itself. Therefore the statement that a post office box may be included in
  the business address for receiving mail is the correct choice. The statements that require the
  post office box to be the sole address, that require an additional physical office, or that forbid
  any use of a post office box are incorrect because the rule does not impose those conditions.
