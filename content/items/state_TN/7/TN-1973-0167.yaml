stem: A licensee advertises the office in a local newspaper and maintains a mail drop registered
  with the USPS, but does not solicit telephone calls. According to Tenn. Comp. R. & Regs.
  1260-02-.03(3)(a), is the licensee deemed to maintain a branch office?
options:
  - Yes, the licensee is deemed to maintain a branch office.
  - No, because soliciting telephone calls is required for a branch office.
  - Yes, but only if the licensee also solicits telephone calls.
  - No, because having a mail drop alone does not constitute a branch office.
key: A
explanation: The rule provides that any one of three criteria—advertising the office, having a
  USPS‑registered mail drop, or soliciting telephone calls—is sufficient to deem a licensee to
  maintain a branch office. Since the licensee both advertises and maintains a mail drop, the branch
  office condition is met regardless of telephone solicitation.
