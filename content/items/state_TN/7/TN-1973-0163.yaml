stem: What must a licensed real estate firm display on the outside of its place of business
  according to Tennessee Real Estate Commission rules?
options:
  - A sign showing the firm's registered name
  - A sign showing the firm's website address
  - A sign showing the broker's license number
  - A sign showing the firm's telephone number
key: A
explanation: The rule requires each licensed real estate firm to conspicuously display a sign
  containing the firm's name as registered with the Commission. The broker's license number is not
  mentioned as a required element of the sign.
