stem: What must be included on the sign displayed outside a licensed real estate firm's place of
  business according to Tennessee Real Estate Commission rules?
options:
  - The firm's registered name
  - The firm's license number
  - The broker's personal name
  - The firm's telephone number
key: A
explanation: The rule requires the sign to contain the name of the firm as registered with the
  Commission, making 'The firm's registered name' correct. The firm's license number is not required
  on the sign, so that option is incorrect.
citation:
  source: Tenn. Comp. R. & Regs. 1260-02-.03(1)
  url: null
  quoted_text: Each licensed real estate firm shall conspicuously display on the outside of the firm’s
    place of business a sign which contains the name of the real estate firm as registered with the
    Commission.
