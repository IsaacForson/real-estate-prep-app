stem: "A licensee wishes to use a post office box as the sole business address for their real estate
  firm. Under Tennessee Real Estate Commission rules, this practice is:"
options:
  - The use of a post office box is permitted as a business location for receiving mail
  - The use of a post office box is prohibited as a business location unless used for mail only
  - The use of a post office box is permitted only if a physical office is also maintained
  - The use of a post office box is prohibited unless the box is also listed as a mailing address
key: B
explanation: The rule prohibits using a post office box as a business location, but allows it to be
  included in a business address solely for receiving mail. Using a PO box as the sole business
  address violates the prohibition; it is only permissible when the PO box is used for mail only,
  not as a business location.
