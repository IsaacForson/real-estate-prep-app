stem: According to Tennessee Real Estate Commission rules, what is the definition of 'commingling'?
options:
  - The act of maintaining others' funds in the same account as personal or business funds.
  - The act of keeping trust money in a separate escrow account for each transaction.
  - The act of depositing earnest money within three business days of receipt.
  - The act of using an interest-bearing account without disclosing the arrangement to the client.
key: A
explanation: Tenn. Comp. R. & Regs. 1260-02-.09 defines commingling as maintaining funds belonging
  to others in the same bank account that contains personal or business funds. The option describing
  the segregation of trust money in a separate escrow account is incorrect because it describes
  proper handling of funds, not commingling.
