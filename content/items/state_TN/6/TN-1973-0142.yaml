stem: An affiliated broker receives a $5,000 earnest money deposit from a buyer on Tuesday morning.
  According to Tennessee Real Estate Commission rules, what must the affiliated broker do with this
  trust money?
options:
  - The affiliated broker must pay over the trust money to the principal broker immediately upon
    receipt.
  - The affiliated broker must deposit the trust money into an interest-bearing escrow account
    within 24 hours.
  - The affiliated broker must hold the trust money in a separate escrow account until the closing
    of the transaction.
  - The affiliated broker must return the trust money to the buyer within three business days.
key: A
explanation: The rule requires an affiliated broker to pay over all trust money to the principal
  broker immediately upon receipt. The option stating that the broker must deposit the money into an
  interest-bearing escrow account within 24 hours is incorrect because the rule does not permit the
  affiliated broker to retain the funds; they must be turned over to the principal broker. The
  option stating that the broker must return the money to the buyer within three business days is
  incorrect because earnest money is held for the transaction, not returned unless the deal falls
  apart. The option stating that the broker must hold the money in a separate escrow account until
  closing is incorrect because the affiliated broker cannot retain trust money; it must be paid over
  to the principal broker immediately.
