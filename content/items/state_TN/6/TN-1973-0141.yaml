stem: According to Tennessee Real Estate Commission rules, what is the definition of 'commingling'?
options:
  - The act of a licensee maintaining funds belonging to others in the same bank account that
    contains his or her personal or business funds.
  - The act of a licensee depositing trust money into an interest-bearing escrow account without
    first obtaining written consent from the payor.
  - The act of a licensee holding trust money for more than twenty-one calendar days before
    disbursement without first obtaining authorization from the principal broker.
  - The act of a licensee failing to disclose interest earned on escrow funds to the payor before
    the closing of the transaction without first obtaining written consent.
key: A
explanation: "The rule defines commingling as a licensee maintaining others' funds in the same
  account that holds the licensee's personal or business funds. This matches the option that states:
  'The act of a licensee maintaining funds belonging to others in the same bank account that
  contains his or her personal or business funds.' The option that describes depositing trust money
  into an interest‑bearing escrow account without first obtaining written consent from the payor is
  not commingling but a separate rule concerning interest‑bearing accounts."
