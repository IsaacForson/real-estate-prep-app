stem: Under Tennessee Real Estate Commission rules, which of the following best defines 'trust money'?
options:
  - Money belonging to others received by a licensee who is acting as an agent or facilitator in a
    real estate transaction, or any money held by a licensee who acts as the temporary custodian of
    funds belonging to others.
  - Money received by a licensee from a client for personal services rendered, which is not related
    to any real estate transaction and therefore not considered trust funds under commission rules.
  - Any funds deposited into a licensee's business account regardless of source, provided the
    licensee maintains accurate records of the deposits and withdrawals for audit purposes.
  - Money that a licensee invests on behalf of a client in interest-bearing accounts, assuming the
    client has given written consent for such investment and the earnings are remitted to the
    client.
key: A
explanation: "The rule defines trust money as money belonging to others received by a licensee
  acting as an agent or facilitator in a real estate transaction, or as money held by a licensee
  serving as a temporary custodian of funds belonging to others. This is exactly what the option
  stating that definition says. The other options describe funds that are not trust money: investing
  client money in interest‑bearing accounts, depositing any funds into a business account, and
  receiving payment for personal services unrelated to a real estate transaction."
