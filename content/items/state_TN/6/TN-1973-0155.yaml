stem: According to Tennessee Real Estate Commission rules, when is a principal broker relieved of
  responsibility for trust money held by another escrow agent?
options:
  - Receipt of the trust money by the specified escrow agent
  - Receipt of a written request for disbursement from the parties
  - Filing of an interpleader action in a court of competent jurisdiction
  - Deposit of trust money into an interest-bearing account
key: A
explanation: The rule states that a principal broker is relieved of responsibility when the
  specified escrow agent actually receives the trust money. Simply depositing the money, receiving a
  written request, or filing an interpleader does not relieve the broker’s responsibility under the
  rule.
citation:
  source: "Tenn. Comp. R. & Regs. 1260-02 — Tenn. Comp. R. & Regs. ch. 1260-02 — Tennessee Real Estate
