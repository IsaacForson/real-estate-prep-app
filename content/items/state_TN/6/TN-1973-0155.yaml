    scripts — § 1260-02-.09"
  url: null
  quoted_text: Where a contract authorizes an individual or entity other than the principal broker to
    hold trust money, the principal broker will be relieved of responsibility for the trust money
    upon receipt of the trust money by the specified escrow agent.
