stem: A licensee receives a $7,500 earnest money deposit from a buyer on April 1. The transaction
  falls through and the buyer requests return of the funds on April 10. The licensee holds the money
  until May 15 before returning it. According to Tennessee Real Estate Commission rules, what is the
  licensee's obligation regarding the timing of disbursement?
options:
  - The licensee must wait until the closing of the transaction to disburse the trust money.
  - The licensee must disburse the trust money promptly, without unreasonable delay.
  - The licensee may disburse the trust money at any time, provided it is eventually returned to the
    buyer.
  - The licensee may retain the trust money until a written agreement is signed by all parties.
key: B
explanation: Under Tenn. Comp. R. & Regs. 1260-02-.09(8), trust money must be disbursed in a proper
  manner without unreasonable delay. Holding the funds for over a month after the buyer's request
  constitutes an unreasonable delay, so the licensee must disburse promptly. Retaining the money
  until a written agreement is signed or delaying arbitrarily is not permitted; disbursement is not
  limited to the closing.
