stem: A buyer offers to pay earnest money with a check dated two weeks in the future. The purchase
  offer does not contain any exception allowing postdated checks. According to Tennessee Real Estate
  Commission rules, what must the licensee do with this check?
options:
  - Deposit the check and notify the buyer that funds will be available after the date
  - Accept the check and deposit it into the escrow account immediately
  - Refuse to accept the check as payment for the earnest money
  - Accept the check but hold it until the date written on the check before depositing
key: C
explanation: The rule prohibits accepting a postdated check for trust money unless the offer
  expressly provides otherwise. Since the offer lacks such an exception, the licensee must refuse
  the check. Accepting and holding the check until its date still constitutes acceptance, which is
  prohibited.
