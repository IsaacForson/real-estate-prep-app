stem: An affiliated broker receives a $2,500 earnest money deposit from a buyer on Wednesday.
  According to Tennessee Real Estate Commission rules, what must the affiliated broker do with this
  trust money?
options:
  - The affiliated broker must hold the money in a personal escrow account for up to three business
    days.
  - The affiliated broker must deposit the money into their own business account until closing.
  - The affiliated broker must pay the money over to the principal broker immediately upon receipt.
  - The affiliated broker must transfer the money to the buyer's attorney upon request.
key: C
explanation: The rule requires an affiliated broker to pay over all trust money to the principal
  broker immediately upon receipt, making the option that states the affiliated broker must pay the
  money over to the principal broker immediately upon receipt correct. The option stating the
  affiliated broker must deposit the money into their own business account until closing would
  constitute commingling and is prohibited.
