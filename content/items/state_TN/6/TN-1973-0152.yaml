stem: A licensee intends to place a buyer's earnest money deposit into an interest‑bearing escrow
  account. What must the licensee do at the time of contract execution according to Tennessee Real
  Estate Commission rules?
options:
  - Obtain written approval from the principal broker and ensure the funds are deposited into a
    designated escrow account within one business day
  - Notify the Tennessee Real Estate Commission in writing of the intent to place the deposit in an
    interest‑bearing escrow account before accepting the funds
  - Deposit the funds into an escrow account selected by the principal broker within 24 hours of
    receipt and give the payer a written receipt
  - Disclose to the payor that the deposit will be placed in an interest-bearing account and execute
    a written agreement indicating how any interest earned will be disposed
key: D
explanation: Tenn. Comp. R. & Regs. 1260‑02‑.09 requires the licensee to disclose to the payor that
  the deposit will be placed in an interest‑bearing escrow or trustee account and to have both
  parties sign a written agreement describing how any earned interest will be handled. The answer
  choice that requires notifying the Tennessee Real Estate Commission in writing before accepting
  the funds is incorrect because the rule does not impose a commission‑notification requirement.
