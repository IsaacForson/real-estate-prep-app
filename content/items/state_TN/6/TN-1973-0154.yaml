stem: A broker deposits personal funds into the same bank account that holds clients' earnest money.
  Under Tennessee Real Estate Commission rules, is this permitted?
options:
  - Yes, if the account is interest-bearing and the interest is paid to the client
  - No, commingling of funds contained within firm accounts is expressly prohibited
  - Yes, as long as the broker keeps separate ledgers for personal and client funds
  - No, unless the broker obtains written permission from the principal broker
key: B
explanation: Tenn. Comp. R. & Regs. § 1260-02-.09 expressly prohibits the commingling of funds
  contained within firm accounts. This rule forbids mixing personal funds with client earnest money
  in the same account. The prohibition applies regardless of whether the broker maintains separate
  ledgers for personal and client funds.
