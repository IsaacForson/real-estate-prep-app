stem: A seller submits a written request for the return of earnest money five days after the offer
  is rejected. Assuming no compelling reason exists, within how many calendar days must the
  principal broker disburse, interplead, or turn over the earnest money to an attorney under
  Tennessee Real Estate Commission rules?
options:
  - 7 days
  - 14 days
  - 21 days
  - 30 days
key: C
explanation: Under Tenn. Comp. R. & Regs. 1260-02-.09, absent a compelling reason, earnest money
  must be disbursed, interpleaded, or turned over to an attorney within twenty-one calendar days of
  the date of receipt of a written request for disbursement. The 14-day and 30-day timeframes do not
  match the statutory requirement.
