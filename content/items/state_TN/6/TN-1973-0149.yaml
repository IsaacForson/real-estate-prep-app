stem: According to Tennessee Real Estate Commission rules, what is expressly prohibited concerning
  commingling of funds?
options:
  - Commingling of trust money with personal or business funds is allowed if disclosed to the client.
  - Commingling of funds contained within firm accounts is expressly prohibited.
  - Commingling of funds contained within firm accounts is allowed with written consent.
  - Commingling of lease deposits with sales trust money is permitted if the amounts are equal.
key: B
explanation: Tenn. Comp. R. & Regs. 1260-02-.09(13) states that commingling of funds contained
  within firm accounts is expressly prohibited. Therefore the statement that commingling of funds
  contained within firm accounts is expressly prohibited is the correct answer. The other choices
  are incorrect because they allow commingling in various situations, which the rule forbids.
