stem: A seller receives a written request for return of earnest money on March 5. Assuming no
  compelling reason exists, by what date must the licensee disburse, interplead, or turn over the
  earnest money to an attorney for interpleader?
options:
  - The licensee must act by March 26.
  - The licensee must act by March 12.
  - The licensee must act by March 19.
  - The licensee must act by April 4.
key: A
explanation: The rule states that absent a compelling reason, earnest money must be disbursed,
  interpleaded, or turned over to an attorney within twenty‑one calendar days from the date of
  receipt of a written request. Adding 21 days to March 5 yields March 26, making the statement that
  the licensee must act by March 26 correct. The statement that the licensee must act by April 4
  exceeds the 21‑day limit and is therefore wrong.
