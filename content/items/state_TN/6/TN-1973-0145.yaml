stem: According to Tennessee Real Estate Commission rules, how is 'trust money' defined?
options:
  - The act of a licensee maintaining funds belonging to others in the same bank account that
    contains his or her personal or business funds without prior written consent
  - Money belonging to others received by a licensee acting as an agent in a real estate
    transaction, or any money held by a licensee as temporary custodian of others' funds
  - Funds deposited by a licensee into a personal savings account for future business expenses,
    subject to approval by the principal broker
  - Money held by a broker on behalf of a principal broker for office overhead, provided the funds
    are properly recorded in the broker's ledger
key: B
explanation: The rule defines trust money as money belonging to others received by a licensee acting
  as an agent in a real estate transaction, or any money held by a licensee as temporary custodian
  of others' funds. The option describing money held by a broker on behalf of a principal broker for
  office overhead describes commingling, which is a different concept.
