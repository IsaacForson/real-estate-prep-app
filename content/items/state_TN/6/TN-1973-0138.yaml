stem: An affiliated broker receives an earnest money deposit from a buyer. What must the affiliated
  broker do with the money under Tennessee Real Estate Commission rules?
options:
  - The affiliated broker must return the money to the buyer within 24 hours.
  - The affiliated broker must pay the money over to the principal broker immediately.
  - The affiliated broker must place the money in a separate escrow account under his or her own
    name.
  - The affiliated broker must deposit the money into his or her personal checking account.
key: B
explanation: Under Tenn. Comp. R. & Regs. 1260-02-.09, an affiliated broker must pay over all trust
  money to the principal broker immediately upon receipt. Therefore, the affiliated broker must give
  the earnest money deposit to the principal broker right away. Placing the funds in the broker's
  personal checking account would be commingling, which is prohibited.
