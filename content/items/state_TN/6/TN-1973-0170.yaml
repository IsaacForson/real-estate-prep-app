stem: An affiliated broker receives a $1,200 lease security deposit from a tenant. What must the
  affiliated broker do with the money under Tennessee Real Estate Commission rules?
options:
  - Pay it over to the principal broker with whom he is affiliated immediately upon receipt
  - Deposit it into the principal broker’s escrow account immediately upon receipt
  - Hold it in the principal broker’s escrow account until disbursement authorized
  - Return it to the tenant within three business days unless the lease provides otherwise
key: A
explanation: Under Tenn. Comp. R. & Regs. § 1260-02-.09(3), an affiliated broker must pay over all
  trust money received from a tenant to the principal broker immediately upon receipt; depositing it
  into the principal broker’s escrow account does not satisfy this requirement.
