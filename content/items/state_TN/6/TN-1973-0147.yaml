stem: A principal broker in Tennessee receives an earnest money deposit from a buyer and a lease
  security deposit from a tenant. Where must the principal broker hold these funds according to
  Tennessee Real Estate Commission rules?
options:
  - In a separate escrow or trustee account designated for trust money.
  - In the broker's personal checking account for convenience.
  - In the firm's general operating account to simplify bookkeeping.
  - In an interest-bearing investment account to earn income for the brokerage.
key: A
explanation: Rule (2) requires each principal broker to maintain a separate escrow or trustee
  account for holding any trust money received in a fiduciary capacity. Therefore the broker must
  place both the earnest money and the lease security deposit in a separate escrow or trustee
  account. The other options describe improper commingling or unauthorized accounts.
