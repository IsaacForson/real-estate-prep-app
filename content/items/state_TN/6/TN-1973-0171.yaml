stem: A principal broker in Tennessee learns that an affiliated broker has received an earnest money
  deposit from a buyer. Who remains responsible for the trust money under Tennessee Real Estate
  Commission rules?
options:
  - The principal broker remains responsible for the trust money in accordance with the terms of the
    contract
  - The affiliated broker remains responsible for the trust money in accordance with the terms of
    the contract
  - Both the principal and affiliated broker share responsibility for the trust money in accordance
    with the terms of the contract
  - Neither the principal nor the affiliated broker has responsibility for the trust money in
    accordance with the terms of the contract
key: A
explanation: Under Tennessee Real Estate Commission Rules §1260-02-.09(4), principal brokers are
  responsible at all times for trust money accepted by them or their affiliated brokers. The
  affiliated broker does not retain responsibility; the principal broker remains liable.
