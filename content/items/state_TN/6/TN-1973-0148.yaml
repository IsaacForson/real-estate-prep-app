stem: According to Tennessee Real Estate Commission rules, which of the following conditions
  requires a principal broker to secure a written agreement signed by all parties having an interest
  in the trust money, separate from the contract authorizing the broker to hold the funds, before
  disbursing the earnest money?
options:
  - The broker may release the funds at the closing of the transaction after obtaining verbal
    consent from all parties involved.
  - The broker may disburse the funds upon receipt of a signed mutual release agreement from the
    buyer and seller.
  - The broker may disburse the funds when the seller rejects the buyer's offer and provides written
    notice of rejection.
  - The broker must obtain a written agreement signed by buyer, seller, and broker that is separate
    from the purchase contract before releasing the funds.
key: D
explanation: The Tennessee Real Estate Commission rules require that before a principal broker
  disburses earnest money held in trust, the broker must obtain a written agreement signed by every
  party with an interest in the trust money, and this agreement must be separate from the contract
  that authorizes the broker to hold the funds. The correct option states that the broker must
  obtain such a written agreement signed by buyer, seller, and broker, separate from the purchase
  contract, before releasing the funds. The other options describe situations where the broker would
  disburse the money without first securing that separate written agreement—for example, releasing
  funds at closing after only verbal consent, disbursing upon a mutual release agreement, or
  disbursing when the seller rejects the buyer’s offer. Those scenarios do not satisfy the rule’s
  requirement for a separate written agreement signed by all interested parties (Tenn. Comp. R. &
  Regs. § 1260-02-.09(7)(b)).
