stem: A licensee is released from a firm on Monday. Under Commission rule, what must the licensee do
  regarding real estate activity before a change of affiliation is processed?
options:
  - continue working under the former principal broker's supervision for ten more days
  - begin working independently without any broker affiliation
  - immediately register a new firm name with the county clerk's office
  - refrain from real estate activities until the affiliation change is processed
key: D
explanation: The rule states that a released licensee shall not engage in activities defined in
  section 62-13-102 until a change of affiliation is received and processed by the Commission.
citation:
  source: Tenn. Comp. R. & Regs. § 1260-02-.02
  url: null
  quoted_text: The licensee shall not engage in any activities defined in § 62-13-102 until a change
    of affiliation is received and processed by the Commission.
