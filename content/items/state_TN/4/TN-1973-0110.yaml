stem: "Under Tennessee Real Estate Commission rule 1260-02-.01(1), a licensee may **not** engage in
  any real estate activity in an office unless:"
options:
  - The office displays the firm's registered broker name
  - The principal broker devotes full time to managing the office
  - The licensee holds an active Tennessee license and current insurance
  - The office is located in a commercially zoned district
key: B
explanation: The rule explicitly states that a licensee may not engage in real estate activity in an
  office unless there is a principal broker devoted to the full time management of such office. The
  other options describe unrelated requirements such as signage, continuing education, or zoning,
  which are not conditions for office activity under this rule.
