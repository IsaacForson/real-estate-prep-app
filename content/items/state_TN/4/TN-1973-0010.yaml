  - file a probate claim against the broker's estate
  - obtain a court order compelling the release
  - submit a completed Affidavit for Release
key: D
explanation: The rule directs a licensee to submit an Affidavit for Release to the Commission when
  the principal broker is deceased or otherwise unable or unwilling to sign a release.
