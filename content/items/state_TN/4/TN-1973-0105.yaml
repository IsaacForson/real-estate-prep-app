stem: A Tennessee real estate firm uses a model home in a new subdivision as its only location for
  meeting clients and conducting sales activities. The model home is advertised only in conjunction
  with the main office's advertising, has no mail drop, and the principal broker supervises
  licensees working from it. Under the Commission's rule on model homes and modular units, is the
  model home required to be licensed as a branch office?
options:
  - The model home must be licensed as a branch office because it lacks a mail drop
  - The model home is exempt from branch licensing because it meets all five requirements
  - The model home is exempt from branch licensing because the principal broker supervises licensees
  - The model home must be licensed as a branch office because it is the sole sales office for the
    firm
key: D
explanation: The rule exempts a model home from branch licensing only if it is not the sole sales
  office for the firm; since the firm uses it as its only location, the exemption does not apply and
  a branch license is required. The most tempting distractor claims exemption because the model home
  lacks a mail drop, but lacking a mail drop is just one of five requirements and does not override
  the sole‑sales‑office prohibition.
