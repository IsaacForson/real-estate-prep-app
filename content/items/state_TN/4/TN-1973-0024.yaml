stem: A principal broker wants to terminate a licensee's affiliation using TREC Form 1. Which
  submission method satisfies the Commission's rule for the form to be effective?
options:
  - announcing the termination verbally at a scheduled Commission meeting
  - filing the form through the licensee's personal attorney
  - hand-delivering, mailing, or e-mailing the form to the Commission
  - posting the form on the firm's public website for member review
key: C
explanation: The rule requires that a TREC Form 1 be hand-delivered, mailed, or e-mailed to the
  Commission (or submitted on a Commission-designated form) to be effective.
