stem: A firm completes an online transfer request for an affiliated licensee. The receiving
  principal broker verified an active license and current insurance beforehand, the submission is
  complete, and it carries an electronic signature. Which additional fact confirms the transfer is
  valid?
options:
  - the licensee has notified the prior firm by certified mail
  - the local association of realtors has approved the move
  - payment for the online submission has been received
  - the licensee's file has been closed for at least a week
key: C
explanation: The rule conditions a valid online transfer on the submission being complete,
  electronically signed, and accompanied by received payment, along with the broker's prior
  verification.
