stem: A Tennessee licensee wants to change the location of her firm's office to a new building. What
  must accompany the application for a change of location according to the Commission's rule on
  offices?
options:
  - A written certification of compliance with zoning laws and ordinances
  - A copy of the firm's current errors and omissions insurance policy
  - A signed affidavit from the principal broker affirming supervision
  - A receipt showing payment of the required application fee to the Commission
key: A
explanation: The rule explicitly states that an application for a change of location must be
  accompanied by a written certification of compliance with zoning laws and ordinances. The most
  tempting distractor suggests a receipt for the application fee, but payment of fees is not cited
  as a required attachment in the rule.
