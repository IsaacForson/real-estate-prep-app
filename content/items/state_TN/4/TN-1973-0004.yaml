stem: "A principal broker receives a licensee's completed TREC Form 1 requesting termination of
  affiliation. Under the termination-of-affiliation rule, the broker's supervisory responsibility
  for the licensee's future acts ends when:"
options:
  - the broker notifies the licensee's new firm by telephone
  - the Commission receives the release form or submission
  - the licensee signs a new independent contractor agreement
  - thirty days pass from the date the broker mailed the form
key: B
explanation: The rule ties the end of supervisory responsibility to the Commission's receipt of the
  release form or online submission, not to any other event.
