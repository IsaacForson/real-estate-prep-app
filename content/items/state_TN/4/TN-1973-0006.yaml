stem: "A licensee ends her affiliation with a firm and wants to keep working buyer representation
  agreements she secured while affiliated there. Under the termination-of-affiliation rule, she may
  take and use those agreements only if:"
options:
  - the agreements are less than ninety days old
  - the new firm agrees to split future commissions with the old firm
  - she reimburses the firm for marketing costs already spent
  - the principal broker authorizes it specifically in writing
key: D
explanation: The rule bars a departing licensee from taking or using listings or buyer
  representation agreements secured through the firm unless the principal broker specifically
  authorizes it in writing.
citation:
