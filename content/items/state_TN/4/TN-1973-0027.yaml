stem: A licensee demands release from her firm and can readily be located. Under Commission rule,
  what must the principal broker do with the license?
options:
  - destroy the license and issue a written notice of destruction
  - promptly grant the release and return the license to the licensee
  - hold the license for thirty days pending a Commission audit
  - forward the license directly to the licensee's new principal broker
key: B
explanation: The rule requires that a demand for release be promptly granted and that the principal
  broker return the license to the licensee.
