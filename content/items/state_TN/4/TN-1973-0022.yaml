stem: A Tennessee principal broker must satisfy which two conditions before a licensee may be
  engaged by that broker, according to Commission rule?
options:
  - being engaged primarily in real estate and accessible during normal daytime hours
  - holding a broker license for at least three years and personally maintaining a branch office
  - supervising no more than ten affiliate brokers and carrying E&O coverage
  - residing in Tennessee and completing annual continuing education hours
key: A
explanation: The rule conditions a licensee's engagement by a principal broker on that broker being
  engaged primarily in the real estate business and accessible during normal daytime working hours.
