stem: A principal broker receives an online transfer request for an affiliate broker. The submission
  is complete, includes an electronic signature, and payment has been received. However, the broker
  did not verify that the affiliate broker had an active Tennessee license and current errors and
  omissions insurance before submission. Under the termination‑of‑affiliation rule, is the transfer
  valid?
options:
  - The transfer is invalid because the affiliate broker did not submit a paper form
  - The transfer is valid because the submission was complete and signed
  - The transfer is invalid because the broker failed to verify the licensee’s active license and
    insurance
  - The transfer is valid because the buyer’s payment was received in full before verification
key: C
explanation: The rule requires the receiving principal broker to verify that the affiliate licensee
  holds an active Tennessee license and current errors and omissions insurance before submitting an
  online transfer request. Because this verification was not performed, the transfer is invalid
  regardless of a complete submission, electronic signature, or receipt of payment. Statements that
  the transfer is valid because the submission was complete and signed, or because payment was
  received, focus on other conditions that alone do not satisfy the rule.
