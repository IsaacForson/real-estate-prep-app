stem: What must a Tennessee real estate firm conspicuously display on the outside of its place of
  business, under Commission rule?
options:
  - a directory listing affiliate brokers currently employed there
  - the principal broker's individual license number on file
  - the firm's errors and omissions insurance certificate number
  - a sign with the firm's name as registered with the Commission
key: D
explanation: The rule requires each licensed firm to conspicuously display a sign on the outside of
  its place of business containing the name of the firm as registered with the Commission.
