stem: A principal broker receives a completed TREC Form 1 from a licensee requesting termination of
  affiliation. The licensee cannot be located to return the license. What must the principal broker
  do with the received form?
options:
  - The principal broker returns the original form to the licensee promptly.
  - The principal broker retains a copy of the executed form for records.
  - The principal broker destroys the form after Commission processing.
  - The principal broker files the form with the Commission within ten days.
key: B
explanation: Under Tenn. Comp. R. & Regs. § 1260-02-.02(1), the principal broker must retain a copy
  of the executed termination form or confirmation of online submission, regardless of whether the
  licensee can be located to receive the license. Therefore, the correct action is to retain a copy
  of the form for records. Returning the original form to the licensee would fail to satisfy the
  retention requirement, and filing the form with the Commission or destroying it are not required
  by the rule.
