stem: A licensee works at an office where the principal broker spends half of his time managing the
  office and half managing a separate property management company. Under Tennessee rule
  1260-02-.01(1), may the licensee engage in real estate activity at that office?
options:
  - The licensee may not engage unless the office has a visible firm sign
  - The licensee may engage because the broker is still primarily in real estate
  - The licensee may engage if the broker is accessible during daytime hours
  - The licensee may not engage because the broker is not devoted to full time office management
key: D
explanation: The rule prohibits any real estate activity in an office unless the principal broker is
  devoted to the full time management of that office. Splitting time between office management and
  another business fails to meet that devotion requirement, so the licensee may not engage. The
  other options incorrectly rely on primary business engagement, accessibility, or signage, which
  are not the controlling standard for office activity under this provision.
