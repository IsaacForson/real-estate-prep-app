stem: If an affiliated licensee is deceased or physically unable to sign a release or make an online
  submission, or refuses to sign a release or make an online submission, what must the principal
  broker requesting termination of affiliation submit to the Commission?
options:
  - A completed TREC Form 1 or an online submission
  - A notification that no further action is required
  - A written request to the Commission for processing
  - A completed Affidavit for Release submitted to the Commission
key: A
explanation: The rule states that when the affiliated licensee cannot sign or refuses, the principal
  broker must submit a completed TREC Form 1 or make an online submission. The Affidavit for Release
  applies only when the principal broker is unavailable, not the licensee. A written request or a
  notification of no action is not prescribed by the rule.
