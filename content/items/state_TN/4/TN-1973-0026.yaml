stem: An affiliate broker leaves Firm A for Firm B and, without permission, brings copies of buyer
  representation agreements she signed while at Firm A to solicit those same buyers at Firm B. Which
  rule does this conduct violate?
options:
  - the rule against using buyer agreements secured through the former firm
  - the rule requiring principal brokers to be accessible during normal daytime hours
  - the rule requiring courses to include a comprehensive final examination
  - the rule requiring firms to display a sign bearing the firm's registered name
key: A
explanation: A licensee who terminates affiliation with a firm may not take or use buyer
  representation agreements secured through that firm unless the principal broker authorizes it in
  writing.
citation:
  source: Tenn. Comp. R. & Regs. § 1260-02-.02
  url: null
  quoted_text: When a licensee terminates his affiliation with a firm, he shall neither take nor use
    any property listings or buyer representation agreements secured through the firm, unless
    specifically authorized by the principal broker in writing.
