stem: A broker devotes most of his time to a separate consulting business and is rarely present at
  his real estate office during the day, though he is primarily engaged in real estate. Does this
  arrangement satisfy the Commission's supervision rule for principal brokers?
options:
  - Yes, because the supervision rule applies to affiliate brokers rather than principal brokers
  - No, because a principal broker has to be accessible during normal daytime working hours
  - No, because a principal broker has to personally close every pending transaction
  - Yes, because primary engagement in the real estate business alone satisfies the rule
key: B
explanation: The supervision rule requires a principal broker to be accessible during normal daytime
  working hours, so rarely being present at the office fails that condition.
