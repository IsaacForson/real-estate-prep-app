stem: "Under Tennessee rule, a licensee may **NOT** engage in any real estate activity in an office
  unless there is a principal broker who:"
options:
  - The principal broker is engaged primarily in the real estate business
  - The principal broker is accessible during normal daytime working hours
  - The principal broker is devoted to the full time management of such office
  - The principal broker holds a current errors and omissions insurance policy
key: C
explanation: Tenn. Comp. R. & Regs. 1260-02-.01 requires that a principal broker be devoted to the
  full-time management of the office for any licensee to engage in real estate activity there. The
  other options describe conditions that do not satisfy this specific statutory requirement.
