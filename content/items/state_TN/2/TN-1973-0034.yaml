stem: A Commission-approved course consists of six classroom hours. Under the rule on course
  completion requirements, what minimum attendance is required for that course?
options:
  - 70%, because attendance percentages mirror the passing score requirement
  - 50%, because half attendance is enough to satisfy short courses
  - 80%, because attendance percentages do not vary with course length
  - 100%, because courses of eight or fewer hours require full attendance
key: D
explanation: The rule sets an 80% attendance minimum generally, but requires 100% attendance when a
  course consists of eight or fewer classroom hours, which covers a six-hour course.
citation:
  source: Tenn. Comp. R. & Regs. § 1260-05-.03
  url: null
  quoted_text: A minimum attendance requirement of eighty percent (80%), except that such requirement
    shall be one hundred percent (100%) if the course consists of eight (8) or fewer classroom
    hours.
