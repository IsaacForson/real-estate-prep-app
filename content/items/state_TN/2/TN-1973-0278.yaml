stem: Under the Tennessee course requirements rule, what minimum attendance requirement must an
  approved real estate course of ten classroom hours impose?
options:
  - The course must have no minimum attendance requirement.
  - The course must have a one hundred percent minimum attendance requirement.
  - The course must have an eighty percent minimum attendance requirement.
  - The course must have a fifty percent minimum attendance requirement.
key: C
explanation: The rule specifies that courses longer than eight classroom hours require an eighty
  percent minimum attendance requirement. Therefore, a ten‑hour course must meet the eighty percent
  standard. The one hundred percent requirement applies only to courses of eight hours or fewer,
  making the option that states a one hundred percent requirement incorrect.
