stem: Under Tenn. Comp. R. & Regs. 1260-01-.16, what penalty fee must a licensee pay to reinstate a
  license that was suspended due to a lapse in E&O coverage for more than one hundred twenty (120)
  days but less than six (6) months?
options:
  - $200.00
  - $500.00
  - $1,000.00
  - $400.00
key: B
explanation: For a lapse exceeding 120 days but under six months, the rule imposes a flat $500
  penalty fee. The $200 and $400 amounts apply only to lapses within 120 days, depending on
  back‑dating.
