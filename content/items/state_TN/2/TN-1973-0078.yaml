stem: A licensee currently affiliated with Firm A wishes to move her affiliation to Firm B. Under
  Tennessee Commission rule, what must she do to effect this change of affiliation?
options:
  - Submit the request to the principal broker of Firm A for approval.
  - Notify the Tennessee Real Estate Commission directly of the change.
  - Wait for Firm B to initiate the change with the Commission.
  - File a written notice with the Commission’s licensing division.
key: A
explanation: The rule requires each licensee in a firm to obtain any desired change of affiliation
  or status through the firm’s principal broker. Therefore, the licensee must submit the request to
  her current principal broker. The distractor of notifying the Commission directly bypasses the
  required broker involvement.
