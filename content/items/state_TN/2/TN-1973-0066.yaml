stem: Under Tenn. Comp. R. & Regs. 1260-01-.16, what is the penalty fee for a license suspended due
  to a lapse in E&O coverage for more than thirty (30) days but within one hundred twenty (120) days
  if the licensee’s insurance carrier back-dated the E&O insurance policy to indicate continuous
  coverage?
options:
  - $200.00
  - $400.00
  - $500.00
  - $1,000.00
key: A
explanation: The rule states that for a lapse of more than 30 days but within 120 days, the fee is
  $200 if the carrier back-dated the policy to show continuous coverage. The $400 option applies
  when the carrier did not back-date the policy.
