stem: "An applicant for an affiliate broker license holds a college degree with a major in real
  estate. Under the course requirements rule, this applicant is deemed to have completed the sixty
  hour basic principles course if the transcript shows a three-hour principles course plus:"
options:
  - any single real estate elective with a passing grade
  - membership in a collegiate real estate honor society
  - a graduate degree earned within the past five years
  - two more courses totaling at least sixty hours
key: D
explanation: The rule requires the transcript to show a three-hour principles course plus at least
  two more courses totaling sixty or more hours of real estate instruction.
