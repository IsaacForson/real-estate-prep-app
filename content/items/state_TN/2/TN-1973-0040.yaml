stem: An affiliate broker's license is suspended for failure to maintain E&O insurance. Fifteen days
  later, the affiliate broker provides the Commission proof of complying E&O coverage. Under
  Commission rule, what is the consequence for the principal broker?
options:
  - automatic loss of the principal broker's own license
  - no penalty, if proof of complying insurance arrives within thirty days
  - a formal hearing, required even though proof of insurance was timely provided
  - a mandatory one-thousand-dollar penalty regardless of when proof is provided
key: B
explanation: The rule imposes no penalty on the principal broker if the affiliated licensee provides
  compliant proof of E&O insurance within thirty days of the license suspension.
citation:
  source: Tenn. Comp. R. & Regs. § 1260-01-.16
  url: null
  quoted_text: "there shall be no penalty to the principal broker if either of the following two (2)
    circumstances occur within thirty (30) days of that affiliated licensee’s license suspension: 1.
    The affiliated licensee has provided proof of insurance which complies with the required terms
    and conditions of coverage to the Commission"
