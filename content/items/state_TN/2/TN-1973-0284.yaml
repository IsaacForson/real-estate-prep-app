stem: Under the Tennessee course requirements rule, a candidate holding a law degree is deemed to
  have completed the sixty hour basic principles course if the law school transcript shows
  successful completion of at **LEAST** one 3 hour course in real property and at least how many
  other hours of classroom instruction in contracts and agency?
options:
  - 30 hours
  - 45 hours
  - 60 hours
  - 90 hours
key: C
explanation: The rule states that a law degree holder must complete at least 60 other hours of
  classroom instruction in contracts and agency in addition to the 3‑hour real property course. The
  30‑hour option mistakenly assumes the 3‑hour course itself satisfies the total requirement.
