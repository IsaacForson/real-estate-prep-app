  quoted_text: >-
    1) No principal broker shall permit a broker, affiliate broker or time-share salesperson under
    his

    supervision to engage in the real estate business unless the broker, affiliate broker or time-

    share salesperson has been issued a valid license and is covered by an errors and

    omissions insurance policy
