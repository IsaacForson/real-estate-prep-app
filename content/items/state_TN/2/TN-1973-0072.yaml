stem: A principal broker knows that one of his affiliate brokers let their errors and omissions
  insurance expire two weeks ago but still allows that affiliate to conduct showings and negotiate
  offers. Under the Tennessee licensing rule, what is the principal broker's obligation?
options:
  - The principal broker must allow the affiliate to continue working but require proof of insurance
    within 48 hours.
  - The principal broker must report the affiliate to the Commission immediately for operating
    without insurance.
  - The principal broker must retain the affiliate's license but suspend the affiliate's commission
    privileges.
  - The principal broker must stop permitting the affiliate to engage in real estate business until
    the affiliate obtains errors and omissions insurance.
key: D
explanation: The rule states that a principal broker shall not permit a supervised licensee to
  engage in real estate business unless that licensee is covered by errors and omissions insurance.
  Therefore the broker must stop allowing the affiliate to work until proper insurance is secured.
  Allowing the affiliate to continue working while requiring proof of insurance within a short
  period still permits engagement before insurance is in place, which violates the requirement.
citation:
