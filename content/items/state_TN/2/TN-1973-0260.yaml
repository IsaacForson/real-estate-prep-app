stem: According to Tenn. Comp. R. & Regs. 1260-01-.16(2)(a), what must a principal broker ensure at
  all times regarding affiliated licensees?
options:
  - That all affiliated licensees maintain a trust account for client funds
  - That all affiliated licensees hold errors and omissions insurance as required by law
  - That all affiliated licensees complete continuing education every two years
  - That all affiliated licensees submit monthly sales reports to the Commission
key: B
explanation: The rule states that a principal broker shall ensure, at all times, that all licensees
  affiliated with that principal broker hold E&O insurance as required by law. The other options
  describe responsibilities not mentioned in this subsection.
