stem: A licensee holds a valid real estate license issued by another state and wishes to practice in
  Tennessee. Under Tennessee Commission rule, what must she do regarding her out-of-state license?
options:
  - File copies of the nonresident license with both the Tennessee Real Estate Commission office and
    her principal broker.
  - Submit the out-of-state license to the Commission for conversion to a Tennessee license after
    completing additional continuing education hours.
  - Keep the out-of-state license on file at her brokerage office and also maintain a digital copy
    in the office records for easy access.
  - Provide a notarized affidavit attesting to the validity of the out-of-state license and submit
    it to the Commission for verification of good standing.
key: A
explanation: The rule mandates that all Tennessee licensees holding nonresident licenses issued in
  other states shall file copies of such licenses in the Office of the Tennessee Real Estate
  Commission and with their principal broker. Thus, filing copies with both entities is required.
  The distractor of submitting for conversion is not mentioned in the rule.
