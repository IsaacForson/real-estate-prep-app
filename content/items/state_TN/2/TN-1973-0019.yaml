stem: "Several affiliate brokers under one principal broker let their errors and omissions insurance
  lapse. Under the lapsed insurance rule, this pattern by itself constitutes:"
options:
  - a criminal violation referred to the district attorney
  - grounds for dissolving the firm's business license
  - the principal broker failing to supervise adequately
  - automatic revocation of the principal broker's own license
key: C
explanation: The rule states that a principal broker's failure to ensure affiliated licensees hold
  required insurance constitutes a failure to exercise adequate supervision over those licensees.
citation:
  source: Tenn. Comp. R. & Regs. § 1260-01-.16
  url: null
  quoted_text: |-
    A principal broker shall ensure, at all times, that all licensees affiliated with that
    principal broker shall hold E&O insurance as required by law. A failure to do so shall
    constitute failing to exercise adequate supervision over the activities of a licensed
    affiliated broker.
