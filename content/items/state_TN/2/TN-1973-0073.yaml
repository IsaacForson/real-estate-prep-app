stem: Under Tenn. Comp. R. & Regs. 1260-01-.16, what penalty fee must a licensee pay to reinstate a
  license that was suspended due to a lapse in E&O coverage for more than thirty (30) days but
  within one hundred twenty (120) days if the licensee is broker-released, retires, or voluntarily
  surrenders their license?
options:
  - $500
  - $1000
  - $200
  - $400
key: C
explanation: The rule specifies a $200 penalty when the licensee is broker-released, retires, or
  voluntarily surrenders the license during a suspension of 30–120 days for E&O lapse. The $400
  distractor applies when the insurance carrier did not back-date the policy, which is a different
  condition.
