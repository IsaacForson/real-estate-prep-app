stem: A licensee terminates affiliation with a firm and wants to continue using a buyer
  representation agreement they secured while affiliated. Under the rule, what must they do?
options:
  - Obtain written authorization from the principal broker
  - Notify the Tennessee Real Estate Commission in writing
  - Wait ten days after termination before acting
  - Submit a new license application to the Commission
key: A
explanation: The rule prohibits using property listings or buyer representation agreements after
  termination unless the principal broker gives written authorization; the other actions do not
  satisfy this requirement.
citation:
