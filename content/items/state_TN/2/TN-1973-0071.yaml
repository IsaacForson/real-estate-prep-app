stem: A licensee whose license was revoked for failure to maintain errors and omissions insurance
  has reapplied for licensure and paid all required fees. According to Tenn. Comp. R. & Regs.
  1260-01-.16(b), what else must the licensee do before the license can be reissued?
options:
  - Pass all required examinations for licensure unless the Commission waives the requirement
  - Provide a letter of recommendation from a current broker affirming professional competence
  - Submit proof of errors and omissions insurance coverage that meets state requirements
  - Complete a new sixty-hour principles course approved by the Tennessee Real Estate Commission
key: A
explanation: The rule specifies that for reissuance of a revoked license, the individual must pass
  all required examinations for licensure unless the Commission waives such examinations. The
  distractor about submitting proof of errors and omissions insurance coverage is incorrect because,
  while insurance is required for licensure, the rule does not list it as a separate step for
  reissuance beyond the penalty fee payment already made.
