  url: null
  quoted_text: Where a principal broker does not accept any authorized consent order for failure to
    supervise an affiliated licensee’s E&O insurance, the hearing shall be held before an
    administrative law judge sitting alone, pursuant to the Uniform Administrative Procedures Act,
    compiled at title 4, chapter 5.
