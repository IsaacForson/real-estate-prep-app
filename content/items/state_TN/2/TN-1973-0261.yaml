stem: A principal broker receives a consent order offering to settle a matter of inadequate
  supervision of an affiliated licensee who failed to maintain E&O insurance. The principal broker
  declines the consent order. According to Tenn. Comp. R. & Regs. 1260-01-.16(2)(c)(3), what is the
  next step?
options:
  - The matter is dismissed without further action
  - The Commission imposes a fine of $1,000 immediately
  - A hearing is held before an administrative law judge sitting alone
  - The principal broker’s license is automatically revoked
key: C
explanation: The rule provides that if the principal broker does not accept any authorized consent
  order, the hearing shall be held before an administrative law judge sitting alone pursuant to the
  Uniform Administrative Procedures Act. The other options are not specified in the rule.
