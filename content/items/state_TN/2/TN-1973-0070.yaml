stem: A principal broker has an affiliated licensee whose license is suspended for failure to
  maintain errors and omissions insurance. Thirty-one days after the suspension, the licensee has
  not provided proof of insurance and the principal broker has not released the licensee. According
  to Tenn. Comp. R. & Regs. 1260-01-.16(c), what action may the Tennessee Real Estate Commission
  take?
options:
  - Automatically revoke the principal broker's license for failure to supervise
  - Impose a one thousand dollar civil penalty immediately upon the violation
  - Authorize a formal hearing and offer a consent order with civil penalties
  - Require the principal broker to complete additional continuing education hours
key: C
explanation: After thirty days of suspension without proof of insurance or release, the rule
  authorizes a formal hearing and offers a consent order with civil penalties to address the
  principal broker’s failure to supervise. The distractor about automatically revoking the principal
  broker's license is incorrect because the rule does not mandate revocation; it only authorizes a
  hearing and consent order.
