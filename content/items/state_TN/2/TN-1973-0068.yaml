stem: Under Tenn. Comp. R. & Regs. 1260-01-.16, what total penalty fee must a licensee pay to
  reinstate a license that was suspended due to a lapse in E&O coverage for eight (8) months?
options:
  - $700.00
  - $800.00
  - $500.00
  - $600.00
key: B
explanation: For a lapse of six months up to one year, the rule assesses $500 plus $100 for each
  month or portion thereof from month six through twelve. Eight months yields $500 + (3 × $100) =
  $800. The $500 option omits the monthly surcharge.
