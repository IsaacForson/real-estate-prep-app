  quoted_text: 3. For a license suspended due to a lapse in E&O coverage for six (6) months up to one
    (1) year, a Five Hundred Dollar ($500.00) penalty fee plus a penalty fee of One Hundred Dollars
    ($100.00) per month, or portion thereof, for months six (6) through twelve (12).
