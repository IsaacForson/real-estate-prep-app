stem: A principal broker’s affiliated licensee has a license suspended for failure to maintain E&O
  insurance. Forty-five days after suspension, the licensee has not provided proof of insurance and
  has not been released by the principal broker. Under Tenn. Comp. R. & Regs. 1260-01-.16, what
  action may the Commission take regarding the principal broker?
options:
  - Impose a $200 consent order penalty
  - Impose a $400 consent order penalty
  - Authorize a hearing and consent order
  - Take no action due to the 30‑day limit
key: C
explanation: After the 30‑day period with no proof of insurance or release, the Commission
  authorizes a formal hearing and also sends a consent order offering informal settlement. The
  specific penalty amount depends on later actions, so imposing a set amount is premature.
citation:
  source: Tenn. Comp. R. & Regs. 1260-01-.16
  url: null
  quoted_text: After the aforementioned thirty (30) day period, if the affiliated licensee has neither
    provided the required proof of insurance nor been released by the principal broker, the
    Commission authorizes a formal hearing on the matter of the principal broker’s failure to
    exercise adequate supervision over an affiliated licensee who failed to maintain E&O insurance
    but also authorizes that a consent order shall be sent to the principal broker, offering that
    principal broker the opportunity to settle the matter informally
