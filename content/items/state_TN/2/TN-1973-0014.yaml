citation:
  source: Tenn. Comp. R. & Regs. § 1260-01-.02
  url: null
  quoted_text: |-
    An applicant may be excused from the “uniform principles of real estate” portion of the
    examination if he:
    1. Holds a license in another state and has successfully completed an examination
    approved by the Tennessee Real Estate Commission; and
    2. Has attained on the “uniform principles” portion of such examination at least the
    minimum passing score requirement.
