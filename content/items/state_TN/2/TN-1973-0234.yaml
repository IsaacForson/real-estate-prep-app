stem: A licensee’s license was suspended for a lapse in E&O coverage that lasted nine (9) months.
  What total penalty fee must the licensee pay to reinstate the license?
options:
  - $900.00
  - $1,000.00
  - $700.00
  - $800.00
key: A
explanation: The rule imposes a $500 base fee plus $100 for each month from month 6 through month
  12. For nine months, months 6‑9 equal four months, so $500 + (4 × $100) = $900. The $800 choice
  miscounts the months, and $700 and $1,000 are unrelated amounts.
citation:
  source: Tenn. Comp. R. & Regs. 1260-01 § 1260-01-.16
  url: null
  quoted_text: '"For a license suspended due to a lapse in E&O coverage for six (6) months up to one
    (1) year, a Five Hundred Dollar ($500.00) penalty fee plus a penalty fee of One Hundred Dollars
    ($100.00) per month, or portion thereof, for months six (6) through twelve (12)."'
  secondary: []
math:
  worked_solution: Months beyond 5 = 9 - 5 = 4 months. Additional fee = 4 × $100 = $400. Total penalty
    = $500 + $400 = $900.
  formulas:
    - Penalty = $500 + $100 × (Months – 5)
    - Total = Base + (Monthly fee × Number of months beyond 5)
