stem: Under Tenn. Comp. R. & Regs. 1260-01-.16, what is the penalty fee for reinstatement of a
  license suspended for more than thirty (30) days but within one hundred twenty (120) days when the
  insurance carrier did **NOT** back-date the E&O policy?
options:
  - Two Hundred Dollars ($200.00)
  - Four Hundred Dollars ($400.00)
  - Five Hundred Dollars ($500.00)
  - One Thousand Dollars ($1,000.00)
key: B
explanation: The rule states that for a suspension lasting more than 30 days but within 120 days,
  the fee is $400 if the carrier did not back-date the policy. The $200 amount applies only when the
  carrier did back-date the coverage.
