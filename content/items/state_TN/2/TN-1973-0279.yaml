stem: A course sponsor seeks approval for a twelve‑hour real estate continuing education course.
  Under the Tennessee course requirements rule, what must the course include to be approved for
  continuing education credit?
options:
  - The course must include neither a comprehensive final examination nor a minimum passing
    requirement.
  - The course must include a seventy percent minimum passing requirement but no comprehensive final
    examination.
  - The course must include a comprehensive final examination but no minimum passing requirement.
  - The course must include a comprehensive final examination and a seventy percent minimum passing
    requirement.
key: D
explanation: For courses exceeding eight classroom hours, the rule mandates both a seventy percent
  minimum passing requirement and a comprehensive final examination. A twelve‑hour course therefore
  must include both elements. Options that omit either component fail to satisfy the rule.
