    1260-05-.03"
  url: null
  quoted_text: A minimum passing requirement of seventy percent (70%) and a comprehensive final
    examination (or equivalent measure of achievement), if the course consists of more than eight
    (8) classroom hours. However, courses taken by affiliate brokers or brokers of eight (8)
    classroom hours or less may be approved for continuing education or post licensing credit
    without a comprehensive final examination being given.
