stem: A principal broker’s affiliated licensee has a license suspended for failure to maintain
  errors and omissions insurance. Ten days after the suspension, the principal broker releases the
  licensee. What is the consequence for the principal broker under Tenn. Comp. R. & Regs.
  1260-01-.16?
options:
  - The principal broker incurs a $400 penalty.
  - The principal broker incurs a $200 penalty.
  - The principal broker incurs a $500 penalty.
  - The principal broker incurs no penalty.
key: D
explanation: The rule states that a principal broker incurs no penalty if, within thirty days of a
  licensee’s suspension for failure to maintain E&O insurance, the broker releases the affiliated
  licensee. Since the release occurred ten days after suspension, no penalty applies. The $200
  penalty distractor is incorrect because it only applies when the licensee is reinstated (or the
  carrier back‑dates the policy) and the broker does not release the licensee within the thirty‑day
  window.
