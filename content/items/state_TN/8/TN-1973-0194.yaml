stem: A licensee has an exclusive buyer representation agreement with a buyer. The buyer attends an
  open house hosted by another licensee and begins discussing the property. According to Tennessee
  Real Estate Commission rules, what must the licensee have advised the buyer in writing to do in
  this situation?
options:
  - Immediately submit a written offer to purchase the property through the licensee
  - Immediately cease all communication with the other licensee and leave the open house
  - Immediately inform the other licensee that the buyer is represented by the licensee
  - Immediately pay a referral fee to the other licensee for the lead
key: C
explanation: The rule requires that, when entering an exclusive buyer representation agreement, the
  licensee must advise the buyer to immediately inform any other licensee the buyer may come into
  contact with (for example, at an open house) that he or she is represented by the licensee. The
  distractor about submitting an offer is not required by the rule.
