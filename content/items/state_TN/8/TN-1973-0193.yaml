stem: "Under Tennessee Real Estate Commission rules, a licensee may use a post office box:"
options:
  - Using the post office box as the sole business address on all advertising and websites
  - Using the post office box to receive mail only, but not as the business location
  - Using the post office box as the business address on contracts with clients
  - Using the post office box to meet clients in person for closings
key: B
explanation: The rule states that use of a post office box as a business location is prohibited, but
  a post office box may be included in a business address for the purpose of receiving mail.
  Therefore, the licensee may use it only to receive mail, not as the sole business address. The
  distractor suggesting use as the sole business address contradicts the prohibition.
