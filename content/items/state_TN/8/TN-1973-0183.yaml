stem: A broker receives a written offer to purchase a property but waits two days before presenting
  it to the seller. Under Tennessee Real Estate Commission rules, is this action permissible?
options:
  - Under Tennessee Real Estate Commission rules, the broker may delay presenting an offer if the
    buyer requests it.
  - Under Tennessee Real Estate Commission rules, the broker’s action is permissible if the seller
    has not yet signed a contract.
  - Under Tennessee Real Estate Commission rules, the broker’s action is permissible because the
    offer was eventually presented.
  - Under Tennessee Real Estate Commission rules, the broker’s action is prohibited because offers
    must be tendered promptly.
key: D
explanation: The rule requires brokers to promptly tender every written offer to purchase or sell
  obtained on a property until a contract is signed by all parties. Waiting two days to present the
  offer violates this prompt tendering requirement, making the action impermissible. The suggestion
  that a broker may delay presenting an offer if the buyer requests it is incorrect because eventual
  presentation does not satisfy the rule’s promptness standard. Tenn. Comp. R. & Regs. § 1260-02-.08
  states that a broker or affiliate broker promptly shall tender every written offer to purchase or
  sell obtained on a property until a contract is signed by all parties.
