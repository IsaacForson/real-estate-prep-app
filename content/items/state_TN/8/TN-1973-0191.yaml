stem: A buyer has signed an exclusive buyer representation agreement with Licensee A. While visiting
  an open house, the buyer speaks with Licensee B about the property. According to Tenn. Comp. R. &
  Regs. 1260-02-.36, what must the buyer do?
options:
  - Inform Licensee B immediately that they are represented by Licensee A
  - Contact Licensee A first before speaking to Licensee B about the property
  - Ignore Licensee B because they are not the representing licensee
  - Submit a written notice to the Tennessee Real Estate Commission within 24 hours
key: A
explanation: The rule requires the buyer to immediately inform any other licensee they encounter
  that they are represented by their own licensee. Therefore the correct response is to inform
  Licensee B immediately that they are represented by Licensee A. The other options are not required
  by the rule; the buyer may speak with other licensees but must disclose representation.
