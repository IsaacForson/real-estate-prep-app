stem: Under Tennessee Real Estate Commission rules, how is an exclusive buyer representation
  agreement defined?
options:
  - An agreement where the licensee represents both the buyer and seller in the same transaction
  - An agreement that allows the licensee to represent multiple buyers for the same property
    simultaneously
  - An agreement in which a licensee is engaged to represent a buyer in the purchase of a property
    to the exclusion of all other licensees
  - An agreement that requires the buyer to pay a commission regardless of which licensee procures
    the property
key: C
explanation: Tenn. Comp. R. & Regs. § 1260-02-.36 defines an exclusive buyer representation
  agreement as an agreement in which a licensee is engaged to represent a buyer in the purchase of a
  property to the exclusion of all other licensees. The option describing a dual agency arrangement
  is incorrect because that describes a different type of representation. The option regarding
  representing multiple buyers is incorrect because the rule focuses on excluding other licensees
  from representing the same buyer, not on the number of buyers represented. The option regarding
  commission payment regardless of procuring licensee is incorrect because it describes a fee
  structure rather than the definition of exclusivity.
