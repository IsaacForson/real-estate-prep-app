stem: A licensee includes both a physical street address and a post office box number in all
  advertising and on their website, stating that the post office box is used for receiving mail.
  Under Tenn. Comp. R. & Regs. 1260-02-.05, is this permissible?
options:
  - No, because use of a post office box as a business location is prohibited
  - No, unless the licensee also maintains a physical office at the post office box location
  - Yes, but only if the physical address is not listed and the post office box is used exclusively
    for mailing
  - Yes, because a post office box may be included in a business address for the purpose of
    receiving mail
key: D
explanation: The rule prohibits using a post office box as a business location but allows including
  a post office box in a business address for receiving mail. Since the licensee lists both
  addresses and states the PO box is for mail, this is permissible. The statement that any use of a
  post office box is prohibited incorrectly treats any PO box use as prohibited.
