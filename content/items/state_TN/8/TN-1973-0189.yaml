stem: A licensee maintains a physical office at 123 Main Street and also lists a post office box
  number for receiving mail on all advertising and the website. Under Tennessee Real Estate
  Commission rules, is this practice permissible?
options:
  - It is permissible because the post office box is used only for receiving mail while the physical
    office serves as the business location.
  - It is prohibited because any use of a post office box as part of a business address is
    disallowed under the rule.
  - It is prohibited unless the licensee obtains written approval from the Tennessee Real Estate
    Commission to use a post office box.
  - It is permissible only if the licensee lacks a physical office and uses the post office box as
    the sole business location.
key: A
explanation: Under Tennessee Real Estate Commission rules, a post office box may not be used as a
  business location, but it may be included in a business address for the purpose of receiving mail.
  Therefore, maintaining a physical office at 123 Main Street while also listing a post office box
  for mail is permissible. The option stating that it is permissible because the post office box is
  used only for receiving mail while the physical office serves as the business location correctly
  reflects this rule. The option claiming that any use of a post office box as part of a business
  address is disallowed misstates the rule. The option requiring written approval from the
  Commission adds a condition not present in the rule. The option limiting permissibility to cases
  where no physical office exists incorrectly restricts the allowance.
