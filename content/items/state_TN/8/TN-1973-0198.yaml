stem: A buyer has an exclusive buyer representation agreement with Licensee A. While at an open
  house hosted by Licensee B, the buyer informs Licensee B that they are represented by Licensee A.
  Under Tenn. Comp. R. & Regs. 1260-02-.36, is the buyer's action permissible?
options:
  - No, because the buyer must first obtain written consent from Licensee A before speaking to
    another licensee.
  - Yes, because the buyer informed the other licensee of their representation as required.
  - Yes, but only if the buyer also refrained from viewing the property without Licensee A.
  - No, because the buyer should not have discussed the property with another licensee.
key: B
explanation: Under Tenn. Comp. R. & Regs. 1260-02-.36(2), a buyer under an exclusive buyer
  representation agreement must immediately inform any other licensee they encounter that they are
  represented by their licensee. By informing Licensee B of their representation, the buyer complied
  with this requirement, making the action permissible. The distractor claiming the buyer should not
  have discussed the property is incorrect because the rule does not prohibit discussion; it only
  requires disclosure of representation.
