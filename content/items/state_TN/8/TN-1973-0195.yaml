stem: A broker obtains a proper acceptance of an offer to purchase from the seller. Under Tennessee
  Real Estate Commission rules, what must the broker do promptly?
options:
  - To notify the buyer’s lender that the contract is now binding and provide a copy
  - To file the acceptance with the Tennessee Real Estate Commission within 24 hours
  - To request the seller to note any contingencies on the acceptance and return it to the offeror
  - To deliver true executed copies of the acceptance, signed by the seller, to the buyer and seller
key: D
explanation: The rule states that upon obtaining a proper acceptance of an offer to purchase, the
  broker shall promptly deliver true executed copies of the acceptance, signed by the seller, to
  both the purchaser and the seller. The distractor about filing with the commission is not required
  by this rule.
