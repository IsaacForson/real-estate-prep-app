stem: A broker obtains a signed acceptance of a written offer to purchase from the seller and
  promptly delivers the executed copy to the seller but fails to provide a copy to the purchaser.
  Under Tennessee Real Estate Commission rules, is this action permissible?
options:
  - The broker's action is not permissible only if the offer was for a commercial property.
  - The broker's action is not permissible because the rule requires delivery of executed copies to
    both the purchaser and the seller.
  - The broker's action is permissible because delivering the copy to the seller satisfies the
    rule's requirement.
  - The broker's action is permissible if the purchaser waives the right to receive a copy in
    writing.
key: B
explanation: The rule requires that upon obtaining a proper acceptance, the broker promptly deliver
  true executed copies signed by the seller to both the purchaser and the seller. Therefore, failing
  to give a copy to the purchaser is not permissible. The rule does not allow the purchaser to waive
  this right, so the action remains impermissible.
