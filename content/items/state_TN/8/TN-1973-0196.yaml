stem: A licensee lists only a post office box as their business address on all advertising and
  signage. Under Tenn. Comp. R. & Regs. § 1260-02-.05, is this permissible?
options:
  - It is permissible because a post office box may be used for receiving mail.
  - It is impermissible unless the licensee obtains a waiver from the Commission.
  - It is permissible if the licensee also maintains a physical office elsewhere.
  - It is impermissible because using a post office box as a business location is prohibited.
key: D
explanation: The rule states that a post office box may be listed only for mail receipt and may not
  be presented as the broker’s business location. Therefore, using a post office box as the address
  on advertising or signage is prohibited. A statement that a post office box may be used for
  receiving mail but not as the business location is accurate, while any claim that a waiver or a
  physical office elsewhere makes it permissible is incorrect. Tenn. Comp. R. & Regs. § 1260-02-.05.
