stem: Under Tenn. Comp. R. & Regs. § 1260-02-.36, which of the following must a licensee advise and
  confirm in writing to a buyer when entering an exclusive buyer representation agreement?
options:
  - That the buyer should arrange property viewings through the licensee and not contact other
    licensees directly.
  - That the buyer must pay a retainer fee before any property viewings are arranged, scheduled, or
    confirmed.
  - That the licensee will earn a commission if the buyer purchases the property through any other
    agent.
  - That the buyer may terminate the agreement early without incurring any financial penalty or fee.
key: A
explanation: Tenn. Comp. R. & Regs. § 1260-02-.36 requires the licensee to advise the buyer that all
  arrangements to view or inspect a property must be made through the licensee and that the buyer
  should not contact other licensees directly. The answer stating the buyer should arrange property
  viewings through the licensee and not contact other licensees directly satisfies this requirement.
  The other answer choices describe requirements—such as a retainer fee, a commission from another
  agent, or an early termination without penalty—that the rule does not impose.
