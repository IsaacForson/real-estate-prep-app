stem: A broker receives a written purchase offer from a buyer on Friday afternoon but waits until
  Monday morning to present it to the seller. Under Tenn. Comp. R. & Regs. § 1260-02-.08, is the
  broker's delay permissible?
options:
  - The broker's delay is impermissible because the broker must tender each written offer until a
    contract is signed.
  - The broker's delay is permissible because weekends and holidays are excluded from the prompt
    tender requirement.
  - The broker's delay is permissible as long as the offer remains unaccepted and the seller has not
    yet signed any contract.
  - The broker's delay is impermissible only if the buyer later withdraws the offer before the
    seller signs the contract.
key: A
explanation: The rule requires a broker to promptly tender every written offer obtained on a
  property until a contract is signed by all parties; delaying until Monday violates this duty. The
  statement that the broker's delay is impermissible because the broker must tender each written
  offer until a contract is signed correctly reflects the rule. The statement that the delay is
  permissible because weekends and holidays are excluded is incorrect because the rule provides no
  such exception.
