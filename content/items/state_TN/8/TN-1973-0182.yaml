stem: A licensee lists only a post office box as their business address on all advertising and their
  website. Under Tennessee Real Estate Commission rules, is this permissible?
options:
  - Under Tennessee Real Estate Commission rules, a post office box may be used as a business
    location if the licensee also maintains a street address.
  - Under Tennessee Real Estate Commission rules, using a post office box as a business location is
    prohibited.
  - Under Tennessee Real Estate Commission rules, a post office box may be used as a business
    location only with a waiver from the Commission.
  - Under Tennessee Real Estate Commission rules, using a post office box as a business location is
    permitted.
key: B
explanation: According to Tenn. Comp. R. & Regs. § 1260-02-.05, use of a post office box as a
  business location is prohibited, although a post office box may be included in a business address
  for receiving mail. Therefore listing only a post office box as the business address violates the
  rule. The idea that a post office box may be used as a business location only with a waiver from
  the Commission is incorrect because the rule does not provide for such a waiver; it only allows a
  post office box to be part of the address for mail receipt.
