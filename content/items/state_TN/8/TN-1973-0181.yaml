stem: Which of the following is **NOT** required to be advised and confirmed in writing to a buyer
  under an exclusive buyer representation agreement?
options:
  - That the buyer must provide a pre-approval letter and proof of funds before viewing any property
    or making an offer.
  - That the buyer should make all arrangements to view or inspect a property through the licensee
    and should not directly contact other licensees.
  - That the buyer will owe a commission if they purchase a property without the licensee's
    assistance through another licensee or directly from an owner.
  - That the buyer should immediately inform any other licensee the buyer may come into contact with
    that he or she is represented by the licensee.
key: A
explanation: According to Tenn. Comp. R. & Regs. § 1260-02-.36, a licensee must advise and confirm
  in writing to a buyer under an exclusive buyer representation agreement that the buyer should
  arrange property viewings through the licensee, inform any other licensee encountered of the
  representation, and disclose whether the buyer would owe a commission if the purchase occurs
  without the licensee’s assistance through another licensee or directly from an owner. The
  requirement that the buyer provide a pre‑approval letter and proof of funds before viewing any
  property or making an offer is not among these mandated advisements, making that statement the
  correct answer.
citation:
  source: "Tenn. Comp. R. & Regs. 1260-02 — Tenn. Comp. R. & Regs. ch. 1260-02 — Tennessee Real Estate
    Commission rules: Rules of Conduct (rev. Sept. 2025), official Secretary of State PDF read via
    Internet Archive capture of 2026-04-16 because publications.tnsosfiles.com returns 403 to
    scripts — § 1260-02-.36"
  url: null
  quoted_text: "When entering into any such agreement a licensee must advise and confirm in writing to
    such buyer the following: (1) That the buyer should make all arrangements to view or inspect a
    property through the licensee and should not directly contact other licensees; (2) That the
    buyer should immediately inform any other licensee the buyer may come into contact with (for
    example, at an open house) that he or she is represented by the licensee; and (3) Whether the
    buyer will owe a commission in the event the buyer purchases a property without the assistance
    of the licensee through another licensee or directly from an owner."
