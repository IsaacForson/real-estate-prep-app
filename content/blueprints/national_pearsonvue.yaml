id: national_pearsonvue
vendor: pearsonvue
title: "Pearson VUE national/general real estate outline (internal blueprint)"
source_document: "Pearson VUE publication 099913 (National/General Exam Content Outline for Salespersons and Brokers)"
source_url: "https://www.pearsonvue.com/content/dam/VUE/vue/en/documents/publications/099913.pdf"
source_version_or_date: "Effective January 2025 or later (PDF is the tracked-changes edition; header also carries a residual 'June 2020' date from the prior version). Counts below are the NEW (post-revision) values."
accessed: 2026-09-08
copyright_note: "Structure and counts recorded for internal blueprint use; vendor text not reproduced. Labels are our own paraphrases."
notes: >
  The published PDF shows tracked changes (old count struck, new count added, e.g. "SALES 11 9").
  Where a subtopic count is given as a range (e.g. 2 to 3), `items` holds the lower bound and
  `items_range` the published range. Per-domain cognitive splits are published for every domain;
  the exam-level totals below are our sums of those (Salesperson K40/A27/An13 = 80; Broker K20/A28/An32 = 80).
  Pretest items are unscored and indistinguishable from scored items. Domain VIII (math) has no
  Knowledge-level items in either exam.
exams:
  salesperson:
    scored_items: 80
    pretest_items: 5
    cognitive_split:
      knowledge: 40
      application: 27
      analysis: 13
    domains:
