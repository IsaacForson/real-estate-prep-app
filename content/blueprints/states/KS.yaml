notes: "Kansas state outline (effective 6/11/24) gives item counts per domain for salesperson (2+4+5+8+11 = 30) and broker (2+3+8+8+15+4 = 40) plus 10 pretest items each; subtopic counts are not published. Domain VI is broker-only. Cached statute text: K.S.A. 58-3034 through 58-3087 and BRRETA 58-30,101 through 58-30,113 (one file per section from ksrevisor.gov). K.A.R. agency 86 text is not yet cached: krec.ks.gov returns 403 to scripts and sos.ks.gov's KAR pages expose no static agency-86 file; K.A.R. section numbers cited here follow the current agency 86 numbering (86-1 licensing, 86-3 practice) and should be verified against the KREC law book once obtainable."
