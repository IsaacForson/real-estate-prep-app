notes: "One state outline (55 scored + 5-10 pretest) serves salesperson, broker, and instructor candidates; the broker exam therefore mirrors the salesperson domains (subtopics identical to salesperson, omitted to avoid duplication). Domain counts are published as ranges (4-6, 7-9, 13-15 x3); midpoints 5/8/14/14/14 sum to 55. LAC rule chapter/section citations follow the LII/State Register chapter map (Ch. 3 applications, 5 exams, 7 fees, 9 renewals, 15 transfers, 18 broker responsibilities, 19 teams, 25 advertising, 26 property management, 27 escrow, 29 escrow disbursement, 35-38 disclosures, 39 offers, 41 investigations). The LAC PDF itself (doa.la.gov) is Cloudflare-blocked for scripted and headless fetches, so rule text is NOT in the statute cache; Civil Code articles in domain IV are cited for grounding but also not cached."
