# 092200), which embeds the "Alaska Real Estate Law Content Outline for Salesperson and Broker Exams"
# (publication 092202, effective September 14, 2023). Labels are OUR paraphrases (SPEC §3.2).
# Domain ids follow the bulletin's Roman numerals; subtopic ids append the bulletin's letters.
