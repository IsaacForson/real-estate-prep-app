notes: >
  The bulletin gives per-domain counts for salesperson (40) and broker (60) exams; two domains are
  published as ranges (III: sales 10-12 / broker 9-11; V: 4-6 both). We use the midpoints (III=11 sales,
  10 broker; V=5) so domains sum exactly to scored_items; `items_range` records the published range.
  Domain VII is broker-only. Pretest: 5-10 unscored items. Statute refs: AS 08.88 (Real Estate Brokers
  and Other Licensees; licensee-relationships article at AS 08.88.600-.695) and 12 AAC 64 (Real Estate
  Commission regulations). Topics grounded outside AS 08.88 (Residential Real Property Transfer
  Disclosure AS 34.70, Common Interest Ownership Act AS 34.08, Landlord and Tenant Act AS 34.03) are
  cited but not yet cached.
