notes: >-
  Entry exam is the associate broker exam (national 75 / state 50); recorded under `salesperson` to mirror the
  state record. PSI numbers the state outline as bullets with lettered subtopics; domain ids 1-5 are ours in
  bulletin order. Ground truth cached in content/statutes/NM from NMREC's official 2021 web-edition License Law
  and Rules book (statute §§ 61-29-1 to -29 as 'N.M. Stat. Ann. § 61-29'; rules as '16.61 NMAC', 325K chars —
  refs must carry a '§ 16.61.x.y' key so the pipeline slices rather than sending the whole doc). The 2021 book
  predates rule amendments after Jan. 3, 2021 and does not include Chapter 5 topics (property tax, liens,
  water, Human Rights Act, PID/HOA statutes) — those refs are currently unmatched; nmonesource.com was not
  attempted after RLD's page offered the compiled book directly.
