notes: >-
  WEIGHTS-ONLY blueprint: DOS publishes no exam content outline and no item count (its pages state the exam is
  multiple choice, based on the 77-hour curriculum, 1.5 hours, reported pass/fail). Domain `items` are percentage
  points derived from the 77-hour Salesperson Syllabus hour allocations (3,11,10,3,5,3,5,3,6,1,2,1,1,3,4,10,3,1,2
  hours; weight_pct = hours/77); scored_items 100 is a placeholder, and the state record keeps total_items null.
  Because the exam is not split, this blueprint covers the whole curriculum, including general topics whose refs
  point at NY statutes outside the license law. Ground truth cached in content/statutes/NY from the DOS 'Real
  Estate License Law' booklet (March 2026): RPL art. 12-A, RPL art. 14, Exec. Law art. 15 excerpts, and 19 NYCRR
  Parts 175-179. Refs to other NY laws (RPTL, Town Law, Banking Law, EPTL, etc.) are not yet cached; every general-topic subtopic therefore also cites 19 NYCRR § 176.3 (the required prelicensing subjects) so the node resolves to cached text. No broker
  blueprint: DOS publishes no broker outline either (exam based on the 152-hour curriculum).
