# New York blueprint — WEIGHTS ONLY. The DOS-administered salesperson exam is not split into national and
# state portions and DOS publishes neither an item count nor a content outline: its pages say only that the
# written exam is multiple choice, based on the 77-hour salesperson curriculum, 1.5 hours, pass/fail. The
# closest official structure is the DOS "Real Estate Salesperson Syllabus" (77-hour curriculum, 2022), whose
# 19 subjects carry hour allocations. Domain `items` below are PERCENTAGE POINTS (hours / 77, rounded so the
# domains sum to 100), NOT item counts; scored_items = 100 is a placeholder. Labels are OUR paraphrases.
