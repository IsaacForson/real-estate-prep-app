notes: "The 093801 outline gives one combined outline for both exams with per-domain counts (Sales 20/8/6/6 = 40; Broker 15/8/8/5 + broker-only domains V (6) and VI (8) = 50) and states 5-10 pretest items on each state exam; the handbook (#093800) table lists 10 pretest items. Subtopic I.C (broker license requirements) is marked broker-only in the outline and is omitted from the salesperson exam here. Subtopic counts are not published. Grounding: the Oklahoma Real Estate License Code (59 O.S. §§ 858-101 to 858-605) and OAC Title 605 are cached from OREC's Code and Rules Book (Nov. 1, 2025). Domain III.D relies on the Oklahoma Residential Landlord and Tenant Act (41 O.S. §§ 101-136) and the Nonresidential Landlord and Tenant Act (41 O.S. §§ 201-231), and domain IV on the Residential Property Condition Disclosure Act (60 O.S. §§ 831-839); neither is reprinted in the Code and Rules Book, and OSCN (oscn.net) refused scripted fetches, so those sections are not yet cached."
