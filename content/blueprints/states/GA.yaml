notes: "The 7/1/2026 bulletin prints item counts per section: salesperson supplement 16+21+15 = 52 (matching the state record's 52 state items taken from the sample score report), broker supplement 31+12+5 = 48; the bulletin publishes no per-subtopic counts and no time limits. Cached text for GA is limited to three GREC-hosted official rule PDFs (520-1-.02 Definitions, 520-1-.04 Obtaining a License, and the 520-1-.05(1)(f) broker-CE amendment). O.C.G.A. Title 43 ch. 40, Title 10 ch. 6A (BRRETA) and Title 8 ch. 3 art. 4 (fair housing) are published officially only through LexisNexis's JavaScript viewer (no static text), and rules.sos.ga.gov returns 403 to scripts while its archived copies are the Fastcase terms-of-use wall, so the remaining rule and statute text is not yet cached. Rule titles beyond 520-1-.07 could not be listed from the source and are cited by number."
