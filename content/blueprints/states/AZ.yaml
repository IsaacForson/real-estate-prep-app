# Arizona state-portion blueprint. Source: Pearson VUE publication 090301 (Arizona Real Estate Content
# Outlines): "Arizona Real Estate Salesperson Licensing Examination Content Outline" (effective January 1,
# 2026) and "Arizona Real Estate Broker's Examination Content Outline" (effective September 23, 2019).
# Labels are OUR paraphrases (SPEC §3.2). Domain ids follow the bulletin's Roman numerals.
id: state_AZ
vendor: pearsonvue
title: "Arizona state-portion outline (internal blueprint)"
source_document: "Pearson VUE publication 090301 — Arizona Real Estate Content Outlines (salesperson state-specific outline; single-exam broker outline)"
source_url: "https://www.pearsonvue.com/content/dam/VUE/vue/en/documents/publications/090301.pdf"
source_version_or_date: "Publication 090301 dated 01/2026; salesperson state outline effective January 1, 2026; broker outline effective September 23, 2019"
accessed: 2026-09-08
copyright_note: "Structure and counts recorded for internal blueprint use; outline text not reproduced. Labels are our own paraphrases."
notes: >
  Salesperson: 60 scored state items + 5 pretest, eleven domains with published counts; subtopic counts
  are not published. Broker: Arizona gives ONE 180-item exam (plus 15 pretest) that mixes general and
  Arizona-specific content, so the broker blueprint below covers the whole exam (state record
  broker_exam.total_items = 180). The bulletin prints counts for 28 of 29 broker domains; domain XXIII
  (deed of trust / mortgage / agreement for sale) has no printed count and is set to 3 so the total is
  180 — flagged as derived. Statute refs: A.R.S. Title 32, ch. 20 (cached: arts. 1-7, 9-10) and
  Commissioner's Rules A.A.C. Title 4, ch. 28 (R4-28-xxx; not yet cached — azsos.gov blocked automated
  fetch). Consumer-protection, property, tax, and water-law topics cite other A.R.S. titles (not cached).
