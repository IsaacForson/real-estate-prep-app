notes: "The PSI state outline lists six unnumbered topic headings with per-exam item counts; ids 1-6 follow the bulletin's order and sub-ids follow its internal numbering where present. Escrow Accounts and Virginia Fair Housing have no published subtopics, so each has a single grounding subtopic. The bulletin's 'HOA/POA disclosures' topic is grounded in the Resale Disclosure Act (Va. Code § 55.1-2307 et seq., effective 2023), which replaced the former POA (§ 55.1-1808 et seq.) and Condominium Act resale-certificate provisions; 'Megan's Law' and 'Stigmatized Properties' are grounded in § 55.1-703 and § 55.1-713. The Common Interest Community Act subtopic (6.3) is broker-only per the bulletin. Broker exam: 50 items with the same six domains (13/7/7/12/6/5). Ground-truth text ingested from law.lis.virginia.gov full-chapter pages (Title 54.1 ch. 21 and ch. 23.3; 18 VAC 135-20 and 135-50; Title 36 ch. 5.1; Title 55.1 chs. 7, 12, 18, 19, 23.1; Title 56 ch. 10.3)."
