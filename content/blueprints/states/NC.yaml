notes: >-
  Entry exam is the broker exam (national 80 / state 60 scored + 5 pretest each); recorded under `salesperson`
  to mirror the state record. The bulletin gives eight state categories with counts but no subtopics; subtopics
  are ours. Ground truth cached in content/statutes/NC: 21 NCAC 58A from the NC Office of Administrative Hearings
  compilation, ingested as one doc per rule Section (citations like '21 NCAC 58A .0101-0120') so a rule ref
  such as '21 NCAC 58A .0116' resolves to its Section's text. Chapter 93A statute text is NOT cached — ncleg.gov and ncleg.net return
  Cloudflare 403 'Attention Required' to curl and WebFetch and the browser pane was denied; NCREC hosts only
  the 'License Law and Rules Comments' commentary (not statute text) and links back to ncleg. Refs to G.S.
  chapters 42, 45A, 47, 47C/47E/47F, 105 are likewise uncached until ncleg is reachable.
