notes: "Outline #094401 (01/2026): Sales Agent State Law (effective Jan. 1, 2026) I 3 / II 4 / III 9 / IV 10 / V 8 / VI 6 = 40 scored + 10 pretest. Broker State Law (effective Apr. 15, 2020) I 3 / II 4 / III 9 / IV 11 / V 8 / VI 5 / VII 10 = 50 scored + 5-10 pretest, including 10 case-study items (domain VII). The broker outline's page 09 in the PDF lists domains IV-VII; domains I-III of the broker outline are identical in count to the sales agent outline. Subtopic counts are not published. Grounding: NOT YET CACHED. statutes.capitol.texas.gov serves a JavaScript shell for every path tried (Docs/OC/htm/OC.1101.htm, /docs/..., GetStatute.aspx, the .pdf path; XHR-style headers made no difference); trec.texas.gov connections timed out; the Texas SOS TAC viewer has moved to a JavaScript Appian portal. Section numbers for Occ. Code ch. 1101 and 22 TAC chs. 531, 535, 537 are from general knowledge of the Act and rules and should be verified against cached text. Domain VI cites Property, Family, Estates, Tax, Business & Commerce, and Natural Resources Code sections and the Texas Constitution."
