notes: "Outline #094502 (04/2025; state outlines effective July 15, 2016) publishes domain counts as ranges. Salesperson: I 3, II 8, III 4-5, IV 3, V 15-17, VI 4-5, VII 1-2, VIII 1-3, IX 6-8 (50 scored, 5-10 pretest) — recorded as 3/8/4/3/16/5/2/2/7 = 50. Broker: I 5-7, II 15-17, III 33-35, IV 9-11, V 2-3, VI 8-10, VII 4-6, VIII 6-8 (90 scored, 5-10 pretest) — recorded as 6/16/34/10/3/9/5/7 = 90. Each `items` value is within the published range; the ranges themselves are recorded here and in the domain order. Domains IV, IX (salesperson) and V, VII, VIII (broker) have no published subtopics; the single subtopics under them are our grounding nodes. Grounding: NOT YET CACHED. le.utah.gov (Utah Code 61-2f) refused connections; rules.utah.gov redirects to the JavaScript-only eRules portal (adminrules.utah.gov); realestate.utah.gov returned a Cloudflare 403. Section numbers for Utah Code 61-2f (parts 1 general, 2 licensing, 3 conduct, 4 enforcement, 5 recovery fund) and R162-2f (-101/-102 title and definitions, -2xx licensing, -301 branch offices, -401a affirmative duties, -401b prohibited conduct, -401c broker duties, -403 trust accounts) and the Title 57, 38, 73, 59, 25, 77 and 78B provisions are from general knowledge and should be verified against cached text."
