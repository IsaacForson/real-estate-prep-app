notes: "PROVISIONAL COUNTS. Vermont publishes no state-exam content outline: PSI administers only the national exam (its Vermont bulletin is not publicly linked), and OPR administers the state exam inside the online application without publishing item counts, time, or pass score. The OPR FAQ answers 'Where do I find the state exam?' by pointing to the Statutes, Rules & Resources page, so the exam's subject matter is taken to be 26 V.S.A. ch. 41, the Commission's Administrative Rules, and the general OPR statute (3 V.S.A. § 129a). scored_items is set to a provisional 40 (a common state-portion length) with a 10/8/12/10 split weighted toward trust accounts, agency/disclosure, and unprofessional conduct — the topics the statute itself emphasizes; the state record's salesperson_exam.state_items remains null and unverified, so lint does not enforce equality. Replace these counts if OPR ever publishes the exam specification. GROUND TRUTH: 26 V.S.A. ch. 41 (28.7k chars) and 3 V.S.A. ch. 5 were ingested from legislature.vermont.gov (fetched with curl and converted locally; the pipeline's direct fetch fails on that site's TLS certificate). The Administrative Rules PDF and every other OPR PDF on outside.vermont.gov return an F5 WAF 'Error 403 - Forbidden' (site tn2-lon) to curl, WebFetch, and a real browser session on 2026-09-08, so the rules text is NOT cached; rule references are therefore given only at the whole-rule level (Code Vt. R. 04-030-290) alongside verified statute sections, and the pipeline will draft rule-dependent nodes from the statute text only until the rules can be ingested from an official copy."
