# Vermont state-exam blueprint. Vermont's state (jurisprudence) exam is self-administered by the
# Office of Professional Regulation inside the online license application (since Feb 27, 2021);
# no vendor bulletin or published content outline exists. OPR's FAQ directs candidates to the
# "Statutes, Rules & Resources" page (26 V.S.A. ch. 41, the Commission's Administrative Rules,
# and OPR policies) as the exam's subject matter, so this blueprint is structured from the statute
# and rules themselves. Item counts are PROVISIONAL (see notes). Labels are our own paraphrases.
