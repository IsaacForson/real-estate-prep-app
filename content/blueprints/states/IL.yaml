notes: "PSI publishes both percentages and per-column item counts for the Illinois state portion: Broker 10/40/25/25 % = 4/16/10/10 of 40 items; Managing Broker 5/30/15/10/40 % = 3/15/7/5/20 of 50 items. The bulletin marks several sub-bullets 'managing broker only' inside domains III and IV; we keep them in the shared domains and place the Managing Broker-only domain V under exams.broker. The Illinois entry-level license is Broker, mirrored by the state record's salesperson_exam (40 state items). Cached text: 225 ILCS 454 (full act) and 68 Ill. Adm. Code Part 1450 (entire part), both official ilga.gov pages read via Internet Archive captures (March/August 2025) because ilga.gov refuses connections from this environment. Other Illinois acts cited (765 ILCS 77, 775 ILCS 5, 35 ILCS 200, 770 ILCS 15, 420 ILCS 46, etc.) are not yet cached."
