title: "Arkansas state-portion outline (internal blueprint)"
source_document: "Pearson VUE publication 090402 — Arkansas Real Estate and Property Management Content Outlines (salesperson law portion; unified broker exam)"
source_url: "https://www.pearsonvue.com/content/dam/VUE/vue/en/documents/publications/090402.pdf"
source_version_or_date: "Salesperson law-portion outline and Unified Broker outline effective December 1, 2025"
accessed: 2026-09-08
copyright_note: "Structure and counts recorded for internal blueprint use; outline text not reproduced. Labels are our own paraphrases."
notes: >
  Salesperson: 30 scored Arkansas-law items (+10 pretest) in five domains with published counts.
  Broker: the "Arkansas Unified Real Estate Broker" exam is a single 120-item exam (+10 pretest) mixing
  general and Arkansas content, published as percentages; `weight_pct` holds the published weight and
  `items` is our largest-remainder rounding onto 120 (5/12/7/12/22/14/12/6/18/12). Statute refs:
  Ark. Code Ann. Title 17, ch. 42 (License Law) and the Arkansas Real Estate Commission Rules
  ("Regulations", Rules 1-16), both cached from AREC's official compilations. Time-share law is
  Ark. Code Ann. § 18-14-101 et seq. (included in the cached AREC compilation).
