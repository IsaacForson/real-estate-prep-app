# Arkansas state-portion blueprint. Source: Pearson VUE publication 090402 (Arkansas Real Estate and
# Property Management Content Outlines): "Arkansas Real Estate Salesperson Examination Content Outline"
# and "Arkansas Unified Real Estate Broker Examination Content Outline", both effective December 1, 2025.
# Labels are OUR paraphrases (SPEC §3.2). Domain ids follow the bulletin's Roman numerals.
id: state_AR
