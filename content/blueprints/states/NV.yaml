notes: >-
  Pearson publishes percentage weights (sales 2/3/20/24/20/23/3/5; broker 5/5/20/20/15/22/8/5). Salesperson
  items are the largest-remainder rounding onto 40 (1/1/8/10/8/9/1/2); broker onto 50 (3/2/10/10/8/11/4/2 —
  the four 2.5-point domains were split 3/2/8/2 to reach 50). Subtopics the outline marks "(Broker Only)" carry
  broker_only: true but appear under salesperson for structure. No Nevada ground truth is cached: leg.state.nv.us
  (NRS 645 / NAC 645) returns Cloudflare 403 'Sorry, you have been blocked' to curl, WebFetch and the browser
  pane; NRED's site links only to leg.state.nv.us, and its own 'Nevada Law and Reference Guide' (5th ed. 2020,
  red.nv.gov/.../law_guide.pdf, PDF structure partially corrupt) is narrative commentary with footnoted NRS/NAC
  cites rather than statute text, so it was NOT ingested. NRS/NAC section refs above were checked against that
  guide's footnotes where possible and should be verified once the statute text is cached.
