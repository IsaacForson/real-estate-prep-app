  salesperson item counts (2+3+22+3); the state record (content/states/NJ.yaml) was updated to national_items 80 /
  state_items 30 on that basis, with grading still 'combined' (one 70% cut score). Broker: 3+4+30+3 = 40 of 115
  questions (120 points). Domain ids are ours (the bulletin does not number these blocks). No New Jersey statute
  text is cached: lis.njleg.state.nj.us, www.njleg.state.nj.us and pub.njleg.state.nj.us all refused connections
  (curl exit 000, WebFetch ECONNREFUSED, browser pane navigation denied); the DOBI site only links to the
  legislature and to LexisNexis for N.J.A.C. 11:5. Drafting for NJ is blocked until 45:15 / 11:5 text is ingested.
