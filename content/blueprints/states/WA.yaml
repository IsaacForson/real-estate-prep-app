# Candidate Information Bulletin ("State Content Outline for Broker and Managing Broker
# Examinations"). Washington's entry-level license is "Broker" (= salesperson elsewhere) and the
# supervisory license is "Managing Broker"; exams.salesperson below = Broker exam, exams.broker =
# Managing Broker exam. Labels are our own paraphrases; outline text is not reproduced (SPEC §3.2).
