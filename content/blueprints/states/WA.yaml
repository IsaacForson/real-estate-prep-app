notes: "The bulletin gives per-domain counts, two of them as ranges: General Rules 'Broker 4-5' and Brokerage Relationships 'Broker 4-5'. Because the Broker exam totals exactly 30 (Licensing 8 + Statutes/Rules 13 fixed), one of the two ranged domains has 4 items and the other 5; we assign 4 to General Rules and 5 to Agency (either allocation is consistent with the bulletin). The bulletin labels both the Statutes/Rules domain and the Agency domain 'III'; we number Agency 'IV' and the Managing Broker scenario block 'V'. Managing Broker: 44 items worth 48 points (6/9/18/7 plus 4 two-point scenario items). Ground-truth text ingested from app.leg.wa.gov full-chapter pages: RCW 18.85, RCW 18.86, WAC 308-124, -124A, -124B, -124C, -124D, -124E, -124H, -124I (WAC 308-124F and -124G do not exist; the leg.wa.gov 'full' pages also list repealed dispositions, so refs cite only sections currently in force)."
