notes: "Pearson VUE publishes weights, not counts, for the Idaho state portion: salesperson 5/10/40/25/5/15 % on 40 items -> 2/4/16/10/2/6 (sum 40); broker 4/4/30/20/10/12/20 % on 50 items -> 2/2/15/10/5/6/10 (sum 50). Domain VII is broker-only. Idaho Code sections 54-2001 to 54-2097 (Idaho Real Estate License Law, incl. the Brokerage Representation Act 54-2082 et seq.) are cached one file per section from official legislature.idaho.gov pages read via Internet Archive 2025 captures (legislature.idaho.gov and dopl.idaho.gov refuse connections from this environment; the DOPL License Law & Rules booklet PDF has no archived copy). IDAPA 33.01.01 (commission rules) is not yet cached; the outline's rule-based topics are grounded here in the statute sections that authorize them. Domain VI general-topic refs point to Idaho Code titles 6, 32, 42, 45, 50, 55, 63 and 67, not yet cached."
