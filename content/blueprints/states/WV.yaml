notes: "Pearson VUE's outline uses Roman-numeral domains with lettered subtopics and gives item counts only at the domain level; ids here mirror that numbering (Fair Housing has no lettered subtopics, so a single V.1 grounding node is used). Salesperson 9/17/15/4/5 = 50; broker 9/14/11/4/4/18 = 60 (Trust Fund moves from Real Estate Practice to Broker Management on the broker exam). Ground truth was ingested from the Commission's own compiled 'West Virginia Real Estate License Act and Legislative Rules' PDF (July 2025) hosted on rec.wv.gov, split into the statute (W. Va. Code § 30-40-1 to -28) and the legislative rules (174 CSR 1, 2, 3, 4, 6, 7); code.wvlegislature.gov and www.wvlegislature.gov both return a JavaScript challenge (HTTP 403 'Just a moment...') to non-browser clients. The West Virginia Fair Housing Act (W. Va. Code § 5-11A-1 et seq.) is not part of the license act and is not yet cached; the fair-housing subtopic also cites the license-act discipline provisions that incorporate discrimination as a ground for action."
