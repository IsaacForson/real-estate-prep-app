# California blueprint. California gives ONE 150-item salesperson exam (200 for brokers) with no separate
# national/state split, so this blueprint covers the whole exam (README: scored_items = total_items).
# Source: DRE "Salesperson Examination Content" and "Broker Examination Content" pages, which publish
# seven topic areas with approximate percentage weights and unweighted subtopic lists. Labels are OUR
# paraphrases (SPEC §3.2). Domain ids are ours ("1"-"7", in DRE's order); DRE does not number them.
id: state_CA
vendor: state
title: "California salesperson/broker exam outline (internal blueprint)"
source_document: "California DRE — Salesperson Examination Content (SalesExamContent.html) and Broker Examination Content (BrokerExamContent.html)"
source_url: "https://www.dre.ca.gov/examinees/SalesExamContent.html"
source_version_or_date: "DRE examinee pages as published September 2026 (undated; DRE revises topic lists periodically)"
accessed: 2026-09-08
copyright_note: "Structure and weights recorded for internal blueprint use; DRE topic wording not reproduced. Labels are our own paraphrases."
notes: >
  DRE publishes only approximate percentages (15/17/14/9/8/25/12) and identical topic lists for both
  exams; `weight_pct` holds the published weight and `items` is our largest-remainder rounding onto 150
  (salesperson: 22/26/21/13/12/38/18; the two .5 remainders were resolved toward the two largest domains)
  and 200 (broker: 30/34/28/18/16/50/24, exact). Subtopic counts are not published. Passing: 70%
  salesperson, 75% broker. Statute refs: Real Estate Law (Cal. Bus. & Prof. Code §§ 10000-10580,
  cached by chapter from leginfo) and Regulations of the Real Estate Commissioner (Cal. Code Regs.
  tit. 10, § 2705 et seq., cached from DRE's compilation); Civil Code and other codes cited but not cached.
