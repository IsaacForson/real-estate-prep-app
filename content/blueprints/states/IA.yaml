notes: "The bulletin presents the state portion as a 12-row topic table (no numbering); we number rows 1-12 in table order. Salesperson counts sum to 40 (2+3+4+3+3+7+6+5+1+2+2+2), broker to 40 (2+4+4+2+4+5+4+3+1+2+6+3). The bulletin still names Iowa Admin. Code 193E, but the Real Estate Commission rules were editorially transferred to 481 IAC chapters 2001-2022 (IAC Supplement 6/10/26; legis.iowa.gov 193E agency PDF is now a transfer notice), so rule refs use the 481—20xx chapter numbers. Cached: Iowa Code ch. 543B and 481 IAC chapters 2001-2022 (all official legis.iowa.gov PDFs)."
