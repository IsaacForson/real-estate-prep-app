notes: >-
  Domain ranges: the bulletin publishes II as 7-8 and IV as 17-18 items for salespersons (III 17-18 and IV 15 for
  brokers); we fix II=8/IV=17 (salesperson) and III=17 (broker) so domains sum to 50, recorded in items_range.
  Ground truth cached in content/statutes/NE: License Act (OCR of NREC's scanned License Manual PDF, Aug. 2026
  ed. — nebraskalegislature.gov was unreachable), Title 299 rules by chapter, Title 305 procedure rules, agency
  statutes 76-2401 to 76-2430, SPCD statute 76-2,120, and the Trust Account Manual. The Nebraska Fair Housing
  Act (20-301 et seq.) and Title 301 agency rules are NOT cached; V.B currently resolves only to 81-885.24.
