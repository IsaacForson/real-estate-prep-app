notes: "Florida's sales associate exam is a single 100-item exam scored 75/100 to pass; the state record carries total_items 100 with state_items null, so scored_items here is the whole exam. The CIB publishes percentages per content area (I 1%, II 6%, III 2%, IV 7%, V 12%, VI 3%, VII 3%, VIII 8%, IX 7%, X 5%, XI 12%, XII 9%, XIII 4%, XIV 6%, XV 1%, XVI 8%, XVII 2%, XVIII 3%, XIX 1% = 100%), recorded as items on 100. Areas I-VII are Florida license law and brokerage practice; VIII-XIX are general topics tested as they operate under Florida law, so their refs point to the Florida chapters the CIB lists as references (chs. 83, 95, 163, 190, 193, 196, 197, 201, 404, 494, 553, 689, 695, 697, 701, 712, 718-721, 725, 760). Broker outline (March 2024 CIB) percentages: 43/9/6/11/4/12/5/4/1/1/1/3 = 100. Cached statute text: ch. 475 pt. I (2025 Florida Statutes, Online Sunshine page via Internet Archive capture) and ch. 61J2 (DBPR/FREC Florida Real Estate Law Book PDF, effective Sept. 2022, via Internet Archive capture); leg.state.fl.us, flsenate.gov and www2.myfloridalicense.com all refused connections from this environment. Other cited chapters are not yet cached."
