notes: "Outline #093901 (03/2026): salesperson state exam 5/8/10/11/6 = 40 scored + 10 pretest; broker state exam 4/6/10/10/5/5 = 40 scored + 10 pretest; both effective March 16, 2026. The outline publishes per-domain counts only (no subtopic counts); subtopics marked '(Broker only)' in the outline carry broker_only here. Grounding: 49 Pa. Code ch. 35 (verified section-by-section against the cached text) and the Real Estate Seller Disclosure Law (68 Pa.C.S. §§ 7301-7315, cached from the Commission's posted copy). The Real Estate Licensing and Registration Act (63 P.S. § 455.101 et seq.) could not be fetched from palegis.us / legis.state.pa.us (connection refused), so RELRA section numbers were assigned from the cross-references in 49 Pa. Code ch. 35 and general knowledge of the Act's structure (§ 455.201 definitions; § 455.301 license required; § 455.304 exclusions; §§ 455.401-455.404a Commission; §§ 455.511-455.561 license qualifications; §§ 455.601-455.604 licensing, CE, and prohibited acts; §§ 455.606-455.606f relationships; § 455.608 consumer information; §§ 455.801-455.806 Recovery Fund; § 455.901 penalties) — verify against the Act's text once cached. Human Relations Act (43 P.S.), Landlord and Tenant Act (68 P.S. § 250.101 et seq.), Uniform Condominium Act and Uniform Planned Community Act (68 Pa.C.S.) are not yet cached."
