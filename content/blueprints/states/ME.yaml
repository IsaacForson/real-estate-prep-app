# Maine state-portion blueprint. Source: Pearson VUE "Maine Real Estate State Content Outlines" (#092005),
# Maine Real Estate Law Examinations Content Outline effective September 1, 2026 (the prior outline,
# revalidated July 10, 2024, ran through August 31, 2026 and has identical counts; the new one adds flood
# risk and property-access disclosures under II.G). Labels are OUR paraphrases (SPEC §3.2).
