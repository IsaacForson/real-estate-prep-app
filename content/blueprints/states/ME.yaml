notes: "Maine has no broker examination (Associate Broker and Broker licenses are earned by experience/education), so no `broker` blueprint. The same outline also governs the separate 50-item Maine Law exam (reciprocity/reinstatement) with counts 2/18/12/13/5; that exam does not satisfy the Sales Agent law portion and is not modeled here. Domain counts 2/15/10/8/5 = 40 are published. The statute cache holds all of 32 M.R.S. ch. 114 and the Commission's rule chapters 300-410 (Ch. 410 Minimum Standards of Practice sections: 1 advertising, 2 self-interest, 3 market value, 4 net listings, 5 documents, 6 compensation disclosure, 7 disclosed dual agency, 8 appointed agents, 9 relationship disclosure, 10 written agreements, 11 inducements, 12 offer confidentiality, 13 licensee duty, 14-20 property disclosures, 21 referral fees; Ch. 400: 1-2 designated broker, 3 trust accounts). Titles 12, 14, 30-A, 33, 36, 38 cited in domains IV-V are not cached."
