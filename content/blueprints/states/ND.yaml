  40-item state total, same for salesperson and broker). Domain `items` (8/8/18/6 salesperson; 7/7/20/6 broker) are
  OUR allocation weighted by subtopic count and the extra broker-only subtopics; revise if NDREC/PSI publish
  counts. Subtopics marked BROKER ONLY in the bulletin carry broker_only: true. Ground truth cached in
  content/statutes/ND: N.D.C.C. ch. 43-23 and N.D. Admin. Code chs. 70-02-01 through 70-02-05 (ndlegis.gov).
  Chapters 43-23.1 (Subdivided Land) and 43-23.2 (Recovery Fund) are not yet cached.
