notes: >
  74 scored state items in eight domains with published counts (2/5/11/7/23/5/10/11); subtopic counts
  are not published. PSI says a small number (5-10) of unscored experimental items may be added. The
  same state portion is used for the Continuing Education and Reciprocal Licensure exams. Statute refs:
  C.R.S. Title 12, art. 10, pt. 2 (Brokers and Salespersons) and pt. 4 (Brokerage Relationships), cached
  from the Division of Real Estate's 2026 Colorado Real Estate Manual ch. 1; 4 CCR 725-1 (Commission
  rules; chapters 1-9 cited as "ch. N" plus rule numbers where known) cached from the Secretary of
  State's official PDF; Commission Position Statements (CP-n) cached from Manual ch. 3. No broker block:
  Colorado has only the one exam.
