# Colorado state-portion blueprint. Colorado has no salesperson license; the entry-level license is
# Associate Broker and everyone takes the single Broker exam, so (as in content/states/CO.yaml) the
# `salesperson` block describes that entry-level Broker exam's state portion. Source: PSI Colorado Real
# Estate Broker Candidate Information Bulletin, "State Portion Content Outline". Labels are OUR
# paraphrases (SPEC §3.2). PSI does not number the eight state domains; ids "1"-"8" are ours, in PSI's order.
id: state_CO
