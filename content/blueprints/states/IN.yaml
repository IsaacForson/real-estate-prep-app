notes: "Indiana licenses only brokers (managing brokers supervise); the Pearson VUE state outline is a single Broker outline with five domains and published counts 5+9+12+17+7 = 50 plus 5-10 pretest items, mirrored by the state record's salesperson_exam (state_items 50). No separate advanced-license outline exists, so exams.broker is omitted. Cached text: 876 IAC articles 1, 2, 5, 6, 7, 8 and 9 (2024 edition PDFs from the official iac.iga.in.gov archive, read via Internet Archive captures). Indiana Code art. 25-34.1 itself is NOT cached: iga.in.gov serves the Code only through a JavaScript application (all URL forms return the app shell), no static/PDF copy is archived, and in.gov (PLA) refuses connections from this environment; IC section refs here follow the current article structure (ch. 1 definitions, 2 commission, 3 licensing, 4 license maintenance/trust accounts, 6 discipline, 7 recovery fund, 9 education, 10 agency relationships, 11 broker price opinions) and should be verified once the text is obtained."
