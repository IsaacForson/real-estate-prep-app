notes: "The bulletin lists six unnumbered Kentucky topic groups with sales associate/broker counts; we number them 1-6 in outline order. Sales associate counts sum to 50 (5+10+18+6+8+3); broker counts to 50 (7+8+18+6+8+3). Team/group management and brokerage management are broker-only sub-bullets within domain 3. 201 KAR Chapter 11 was consolidated in 2021: only 11:011, 11:105, 11:121, 11:170, 11:190, 11:210 and 11:220 remain in effect (all others repealed), so rule refs use only those seven. Cached text: KRS 324.010-324.990 (49 non-repealed sections) and the seven current 201 KAR 11 regulations, all from official apps.legislature.ky.gov pages read via Internet Archive captures because the live site refuses connections from this environment."
