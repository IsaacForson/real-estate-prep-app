notes: "Bulletin state-section outlines: Broker 6/3/5/12/5/4/15 = 50; Principal Broker 7/5/5/8/4/6/15 = 50; 5-10 unscored experimental items may be added. The bulletin's domains are unnumbered; ids 1-7 are ours, in bulletin order, and subtopic ids follow the bulletin's sub-list order (the Principal Broker list in domain 7 skips item 12, so subtopic 7.12 is intentionally absent there). Subtopic counts are not published. Grounding: ORS chapter 696 and OAR chapter 863 are the citation roots; oregonlegislature.gov (ORS text) and the Secretary of State OARD site (OAR 863) refused scripted fetches from this environment, so the cached OAR text is the Agency's official permanent-rule filing implementing HB 3137 (Oct. 9, 2025; effective Jan. 1, 2026), which reprints most of OAR 863 divisions 14, 15, 20, 22, 24 and 25. ORS 696 and the related-statute chapters in domain 7 (ORS 86, 87, 90, 92, 93, 94, 100, 105, 197, 215, 308, 311, 446, 465, 537, 659A) are not yet cached."
