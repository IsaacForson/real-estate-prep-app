notes: "Pearson VUE publishes every Wyoming domain as an item RANGE (e.g. Licensing 'Sales 7-9'); the `items` values are our single-point allocation chosen so domains sum exactly to 40 (salesperson: 4/8/16/12) and 50 (broker: 4/5/15/12/14), and `items_range` preserves the published range. Domain V is broker-only. Subtopic ids mirror the outline's lettering. Ground truth: statute text extracted from the Wyoming Legislature's Title 33 PDF (chapter 28 pages) plus Title 1 ch. 18 (foreclosure sales/redemption), Title 1 ch. 21 art. 12 (residential rental property), Title 1 ch. 23 (statute of frauds), and Title 34 ch. 4 (foreclosure by advertisement) for the 'Additional Topics' domain; Commission rules chapters 1-8 were ingested from the PDFs the Commission publishes on its own rules page (realestate.wyo.gov, hosted as Google Drive files). 'Land Description' has no Wyoming statute of its own; it is grounded only loosely (definitions and foreclosure-notice description requirements)."
