notes: >-
  The bulletin publishes one state outline for both salesperson and broker (40 items each); the broker exam
  section mirrors the salesperson section with collapsed subtopics. The bulletin cites RSA/Rea sections per
  topic; statute_refs reproduce those citations. No New Hampshire ground truth is cached: gc.nh.gov (RSA
  331-A and Rea 100-700) returns a WAF "Web Page Blocked" 403 to curl, WebFetch and the browser pane, and
  the OPLC laws page links back to gc.nh.gov. Drafting for NH is blocked until RSA 331-A / Rea text is ingested.
