notes: >-
  One state outline serves both licenses (40 items; national 80 salesperson / 75 broker). PSI presents the state
  outline as four unnumbered blocks with lettered subtopics; domain ids 1-4 are ours in bulletin order, and
  subtopics the bulletin marks "(broker only)" carry broker_only: true. No Ohio ground truth is cached:
  codes.ohio.gov (ORC 4735, OAC 1301:5) never answered — TCP timeouts for curl (http and https), ECONNREFUSED
  for WebFetch, and the browser pane navigation was denied; legislature.ohio.gov timed out likewise, and the
  Division's laws-and-rules portal page is a JS shell that only links to codes.ohio.gov. Drafting for OH is
  blocked until ORC 4735 / OAC 1301:5 text is ingested. Section refs for OAC 1301:5 are from memory and should
  be verified against the text once cached.
