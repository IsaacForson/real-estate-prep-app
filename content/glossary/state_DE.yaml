  - term: advertisement
    definition: Any public notice placed by a licensee must include the brokerage's licensed name so the
      public knows whom the licensee represents and who is accountable.
    source: REP Ref. Brokerage Practice
    quoted_text: Most states require that every advertisement placed by a licensee — print, sign,
      website, social media post, email — identify the brokerage by its licensed name
    related_terms: []
    items:
      - DE-2901-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: approval
    definition: Approval refers to the Commission's endorsement of a form (e.g., an approved contingency
      addendum) that licensees may use instead of drafting language from scratch.
    source: REP Ref. Brokerage Practice
    quoted_text: The licensee should either use an approved contingency addendum that covers the
      situation or refer the buyer to an attorney to draft the language
    related_terms: []
    items:
