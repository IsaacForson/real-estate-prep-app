    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: brokerage
    definition: A brokerage is the business entity that conducts real estate activities, encompassing
      scope of practice, engagement agreements, compensation, supervision, advertising, risk
      management, and trust funds.
    source: REP Ref. Brokerage Practice
    quoted_text: the operation of a real estate brokerage — scope of practice, engagement agreements,
      compensation, antitrust in practice
    related_terms: []
    items:
      - DE-2901-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: change form
    definition: A completed form that a licensee must submit to the Commission, signed by their former
      broker, when transferring to a new office or opening their own office.
    source: 24 Del. Admin. Code § 2900
    quoted_text: All Licensees who transfer to another office, or Brokers who open their own offices,
      but who were associated previously with another Broker, shall submit a completed Change Form
      to the Commission signed by the individual Broker with whom they were formerly associated,
      before the license will be transferred.
    related_terms: []
    items:
      - DE-2901-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: commission
    definition: A commission is the payment a broker or salesperson receives for performing real estate
      brokerage services, which they may only collect from their sponsoring broker.
    source: REP Ref. Brokerage Practice
    quoted_text: a salesperson (or associate broker) may perform brokerage acts only under a sponsoring
      broker and may be compensated only by that broker.
    related_terms: []
    items:
      - DE-2901-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: continuing education
    definition: The Commission may perform random audits of continuing education credits submitted by
      licensees for license renewal.
    source: Del. Code Ann. tit. 24, ch. 29
    quoted_text: (7) Perform random audits of continuing education credits submitted by licensees for
      license renewal.
    related_terms: []
    items:
      - DE-2901-0022
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: evaluation
    definition: An evaluation is a written assessment of a property's value or condition that may be
      required even when a licensed appraiser is not needed.
    source: REP Ref. Valuation & Appraisal
    quoted_text: Below the threshold the institution must still obtain a written "evaluation," which
      need not be done by a licensed appraiser.
    related_terms: []
    items:
      - DE-2901-0023
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: forms
    definition: Forms are standardized, pre-printed or attorney-prepared contract forms that licensees
      may complete by filling in the negotiated terms such as name, price, dates, and contingencies.
    source: REP Ref. Brokerage Practice
    quoted_text: Licensees may complete standardized, pre-printed or attorney-prepared contract forms by
      filling in the factual terms the parties have negotiated
    related_terms: []
    items:
      - DE-2901-0021
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: good cause
    definition: A justification that permits the Commission to waive the requirement of submitting a
      signed Change Form when a licensee transfers offices.
    source: 24 Del. Admin. Code § 2900
    quoted_text: The Commission reserves the right to waive the requirement of subsection 7.1 upon a
      determination of good cause.
    related_terms: []
    items:
      - DE-2901-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: licensure
    definition: Licensure is the state-issued license that authorizes a person to practice real estate
      services; no person may engage in such practice without being duly licensed.
    source: "[Del. Code Ann. tit. 24, ch. 29 — § 2901. License requirements; exemptions.]"
    quoted_text: No person shall engage in the practice of providing real estate services in this State
      unless such person has been duly licensed under this chapter
    related_terms: []
    items:
      - DE-2901-0024
    status: draft
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: phone
    definition: The phone number refers to the brokerage organization's telephone number registered with
      the state commission for that office location, which must be displayed in any real estate
      advertisement.
    source: 24 Del. Admin. Code § 2900
    quoted_text: Brokerage Organization phone number registered by the Broker with the Commission for
      that office location.
    related_terms: []
    items:
      - DE-2901-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: prelicensing
    definition: Prelicensing refers to the education or course required before obtaining a license, for
      which the Commission establishes standards.
    source: Del. Code Ann. tit. 24, ch. 29
    quoted_text: Establish by rule and regulation prelicensing and continuing education standards
      required for licensure and license renewal
    related_terms: []
    items:
      - DE-2901-0024
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: promotion
    definition: Personal promotion refers to advertising that markets an individual licensee’s name and
      contact information, which must also include the brokerage’s name and phone number.
    source: 24 Del. Admin. Code § 2900
    quoted_text: All advertisements for personal promotion of Licensees shall include the complete
      Brokerage Organization name
    related_terms: []
    items:
      - DE-2901-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: records
    definition: Records are accurate documentation of funds and documents that an agent must keep
      separate and account for.
    source: REP Ref. Agency
    quoted_text: keep accurate records, and turn over or account for all funds and documents received in
      the course of the agency
    related_terms: []
