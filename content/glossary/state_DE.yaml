  - term: address
    definition: The licensee's mailing or physical address on file with the Division of Professional
      Regulation, which must be updated and reported within thirty days of any change.
    source: 24 Del. Admin. Code § 2900
    quoted_text: Any change in address must be reported to the Division within thirty days of such change.
    related_terms: []
