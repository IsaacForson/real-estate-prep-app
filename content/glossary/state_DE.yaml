  - term: brokerage organization
    definition: A brokerage organization is a business entity that cannot be licensed directly under
      Delaware law but may provide real estate services through a licensed broker who is responsible
      for those services.
    source: Del. Code Ann. tit. 24, ch. 29
    quoted_text: No brokerage organization, corporation, partnership or other business entity shall be
      licensed under this chapter. Nothing in this chapter, however, shall prevent such brokerage
      organization from providing real estate services provided the individual or business entity
      has a broker who is responsible for providing real estate services
