    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: audit
    definition: The Commission may perform random audits of continuing education credits submitted by
      licensees to verify compliance with continuing education requirements.
    source: 24 Del. Admin. Code § 2900
    quoted_text: Random audits shall be performed by the Commission to ensure compliance with the CE
      requirements.
    related_terms: []
    items:
