  - term: dual agent
    definition: A dual agent is a licensee who represents both the buyer and seller in the same
      transaction with their informed written consent, but may not advocate on price or disclose
      confidential information of one party to the other.
    source: REP Ref. Agency
    quoted_text: "A single brokerage (and, in the classic form, a single licensee) represents both the
      buyer and the seller in the same transaction. Because full loyalty to two parties with
      opposing interests on price is impossible, dual agency is permitted only with the informed
      written consent of both parties in states that allow it at all, and the dual agent's duties
      are necessarily limited: the agent may not advocate on price or terms for either side, and may
      not disclose confidential information of one party to the other"
    related_terms: []
