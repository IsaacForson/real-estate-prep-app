  - term: representation agreement
    definition: A representation agreement is a contract between a client and a brokerage that creates
      an agency relationship, outlining the broker’s duties, compensation, term, and scope. It may
      be exclusive or nonexclusive and must be in writing under Idaho law.
    source: REP Ref. Brokerage Practice
    quoted_text: "The contract that creates buyer agency (REP Ref. Agency § 2.3). It parallels the
      listing: exclusive or nonexclusive;"
