  - term: sales associate
    definition: A licensee who works under a designated broker and must provide a true and legible copy
      of any signed brokerage representation agreement to the broker or broker’s office by the end
      of the next business day.
    source: Idaho Code § 54-2050
    quoted_text: A sales associate who obtains a signed brokerage representation agreement of any kind
      shall provide a true and legible copy of such representation agreement to the designated
      broker or broker’s office prior to the end of the next business day.
