  - term: responsible broker
    definition: The responsible broker is the designated broker in a regulated real estate transaction
      who handles the accounting and transaction files as required by Idaho Code § 54-2048.
    source: "[Idaho Code § 54-2004]"
    quoted_text: '"Responsible broker" means the designated broker in the regulated real estate
      transaction who is responsible for the accounting and transaction files for the transaction,
      in the manner described in section 54-2048, Idaho Code.'
