  - term: trust account
    definition: A trust account is a separate account where a broker holds clients' money such as
      earnest money, security deposits, or rents, keeping it apart from the brokerage's own funds.
    source: "[REP Ref. Brokerage Practice — § 10.1 Trust (escrow) accounts]"
    quoted_text: money belonging to others — earnest money, tenant security deposits, rents collected
