  - term: acting principal broker
    definition: An acting principal broker is a person temporarily designated to manage a brokerage when
      the principal broker dies or is incapacitated, limited to closing existing transactions and
      not taking on new clients.
    source: Utah Admin. Code R162-2f (Real Estate Licensing and Practices Rules)
