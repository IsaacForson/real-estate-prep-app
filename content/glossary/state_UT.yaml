  - term: adverse possession
    definition: Adverse possession allows someone who openly, exclusively, and continuously occupies
      another's land without permission for the statutory period to gain legal title.
    source: REP Ref. Ownership, Title & Transfer
    quoted_text: Adverse possession lets a person who occupies another's land for the statutory period
      acquire title. The possession must be actual (physical use as an owner would), open and
      notorious (visible), exclusive (not shared with the owner or the public), hostile or adverse
      (without permission, under a claim of right), and continuous
