  - term: license revocation
    definition: License revocation is the cancellation of a broker's license, which can result from
      conversion of trust funds or fraudulent misrepresentation.
    source: REP Ref. Agency
    quoted_text: '**Conversion** is using money belonging to others for a purpose not authorized —
      paying the office payroll from earnest money, "borrowing" a security deposit. Conversion is
      theft in substance and typically results in license revocation and criminal exposure.'
    related_terms: []
