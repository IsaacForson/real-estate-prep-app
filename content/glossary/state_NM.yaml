  - term: associate broker
    definition: An associate broker (or salesperson) may perform brokerage acts only under a sponsoring
      broker and may be compensated only by that broker.
    source: REP Ref. Brokerage Practice
    quoted_text: A **broker** may operate a brokerage and employ or sponsor licensees; a **salesperson**
      (or associate broker) may perform brokerage acts only under a sponsoring broker and may be
      compensated only by that broker.
