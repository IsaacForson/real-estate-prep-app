  - term: licensure
    definition: Licensure is the process of obtaining a real estate license, which requires applicants
      to submit fingerprints for federal and state criminal history background checks.
    source: N.M. Stat. Ann. § 61-29
    quoted_text: "A. All applicants for licensure as provided for in Chapter 61, Article 29 NMSA 1978
      shall: (1) Be required to provide fingerprints on two fingerprint cards for submission to the
      federal bureau of investigation"
