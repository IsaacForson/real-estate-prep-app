  - term: definitions
    definition: Definitions refer to the section that explains key terms such as agency, agent, and
      principal, describing agency as a relationship where an agent acts on behalf of a principal
      under the principal's control.
    source: REP Ref. Agency
    quoted_text: >-
      ## § 1 Agency law basics


      ### § 1.1 Definitions


      **Agency** is a relationship in which one person (the **agent**) is authorized to act on
      behalf of another (the **principal**) in dealings with third parties, and agrees to do so
      subject to the principal's control.
