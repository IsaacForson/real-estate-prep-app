  - term: trade name
    definition: A trade name is the registered business name under which a broker operates, which must
      be registered with the commission via a trade name registration form and fee.
    source: 16.61 NMAC
    quoted_text: Applicants with current licenses who can document that they were New Mexico qualifying
      brokers on or before December 31, 2005 are not subject to those requirements and may regain
      qualifying broker status by filling a trade name registration form and paying the trade name
      registration fee to the commission.
    related_terms: []
