  - term: brokerage relationships
    definition: A brokerage relationship is a written agreement between a buyer, seller, landlord or
      tenant and a brokerage that creates an agency relationship; without such written agreement, no
      agency relationship exists.
    source: N.M. Stat. Ann. § 61-29
    quoted_text: For all regulated real estate transactions first executed on or after January 1, 2000,
      no agency relationship between a buyer, seller, landlord or tenant and a brokerage shall exist
      unless the buyer, seller, landlord or tenant and the brokerage agree, in writing, to the
      agency relationship.
