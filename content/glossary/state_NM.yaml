    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: discipline
    definition: Discipline refers to sanctions imposed by regulators for license law violations, such as
      loss of commission or rescission of a transaction.
    source: REP Ref. Agency
    quoted_text: "**Undisclosed dual agency** — representing both sides without both parties' knowledge
      and consent — is a serious license law violation and a breach of fiduciary duty that can
      result in loss of commission, rescission of the transaction, and discipline."
    related_terms: []
