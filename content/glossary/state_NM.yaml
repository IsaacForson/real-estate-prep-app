  - term: dual agency
    definition: Dual agency is an express written agreement that modifies existing exclusive agency
      agreements so the brokerage acts as a facilitator for both buyer and seller rather than as an
      exclusive agent for either party.
    source: 16.61 NMAC
    quoted_text: "U. “Dual agency”: an express written agreement that modifies existing exclusive agency
      agreements to provide that the brokerage agrees to act as a facilitator in a real estate
      transaction rather than as an exclusive agent for either part y to the transaction."
    related_terms: []
    items:
      - NM-1-0020
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: facilitator
    definition: A facilitator is a broker who acts as a neutral intermediary in a dual agency
      relationship, assisting both buyer and seller without representing either exclusively.
    source: 16.61 NMAC
    quoted_text: "V. “Dual agent”: the brokerage in a dual agency relationship working as a facilitator
      in a single transaction for both a buyer client and a seller client who have modified existing
      exclusive agency agreements with the brokerage."
    related_terms: []
    items:
      - NM-1-0020
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: guilty knowledge
    definition: Guilty knowledge refers to the qualifying broker's actual awareness or conscious
      knowledge of a licensee's violation of the Real Estate License Act.
    source: 16.61 NMAC
    quoted_text: B. Any violation of the provisions of the New Mexico Real Estate License Act by any
      licensee associated with qualifying broker shall not be cause for suspension or revocation of
      a qualifying broker license unless the qualifying broker had guilty knowledge of the act or
      rule violation.
