  - term: brokerage relationships
    definition: A brokerage relationship is a written agreement between a buyer, seller, landlord or
      tenant and a brokerage that creates an agency relationship; without such written agreement, no
      agency relationship exists.
    source: N.M. Stat. Ann. § 61-29
    quoted_text: For all regulated real estate transactions first executed on or after January 1, 2000,
      no agency relationship between a buyer, seller, landlord or tenant and a brokerage shall exist
      unless the buyer, seller, landlord or tenant and the brokerage agree, in writing, to the
      agency relationship.
    related_terms: []
    items:
      - NM-1-0012
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: client
    definition: A client is a person who has entered into an express written agreement with a brokerage
      for real estate services, such as a seller, buyer, landlord, or tenant.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
    items:
      - NM-1-0011
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: commingling
    definition: Commingling is mixing client trust funds with the brokerage's own operating funds.
    source: REP Ref. Agency
    quoted_text: Mixing client funds with brokerage operating funds is **commingling**; spending client
      funds for any unauthorized purpose is **conversion** (§ 8).
    related_terms: []
    items:
      - NM-1-0017
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: customer
    definition: A customer is a person who uses real estate services without entering into an express
      written agreement with a brokerage subject to the jurisdiction of the commission.
    source: N.M. Stat. Ann. § 61-29
    quoted_text: ‘‘Customer’’ means a person who uses real estate services without entering into an
      express written agreement with a brokerage subject to the jurisdiction of the commission
