  - term: transaction broker
    definition: A transaction broker is a qualifying broker, associate broker, or brokerage that
      provides real estate services without entering into an agency relationship with the parties,
      resulting in a non-fiduciary relationship.
    source: 16.61 NMAC
    quoted_text: "EEE. “Transaction broker” :  a qualifying broker, associate broker or brokerage that
      provides real estate services without entering into an agency relationship. The transaction
      broker relationship is a non-fiduciary relationship."
    related_terms: []
