entries:
  - term: actual knowledge
    definition: Actual knowledge means the seller's personal awareness of facts, which is what the
      seller must rely on when completing the disclosure form.
    source: REP Ref. Property Condition & Environmental
    quoted_text: Sellers answer to actual knowledge; the form is not a warranty and does not replace an
      inspection.
    related_terms: []
    items:
      - RI-5-0078
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: appointment
    definition: An appointment is the act of naming someone to a position, such as a member of the Rhode
      Island real estate commission, by the governor.
    source: R.I. Gen. Laws ch. 5-20.5 (Real Estate Brokers and Salespersons)
    quoted_text: Within the department of business regulation there is created the Rhode Island real
      estate commission, subsequently referred to as “commission,” to consist of nine (9) persons at
      least one from each county to be appointed by the governor
    related_terms: []
    items:
      - RI-5-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: attorney
    definition: An attorney is a person licensed to practice law who may be exempt from certain real
      estate licensing requirements when acting within their legal practice.
    source: REP Ref. Brokerage Practice
    quoted_text: Owners dealing with their own property, attorneys acting within their practice,
      court-appointed fiduciaries, and (in many states) resident managers performing limited leasing
      tasks are common exemptions;
    related_terms: []
    items:
      - RI-5-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker
    definition: In real estate brokerage, the broker is the agent who acts for the client (the seller,
      buyer, landlord, or tenant) under the client's control.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
    items:
      - RI-5-0051
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: commission
    definition: The Rhode Island real estate commission is a nine‑member body appointed by the governor
      to regulate real estate brokers and salespersons.
    source: R.I. Gen. Laws ch. 5-20.5 (Real Estate Brokers and Salespersons)
    quoted_text: Within the department of business regulation there is created the Rhode Island real
      estate commission, subsequently referred to as “commission,” to consist of nine (9) persons at
      least one from each county to be appointed by the governor
    related_terms: []
    items:
      - RI-5-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: continuing
    definition: Continuing refers to the ongoing education that licensees must complete to maintain
      their real estate license.
    source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons)
    quoted_text: B. A licensee who fraudulently certifies to the Department completion of the continuing
      education requirement described in § 2.30 of this Part may be subject to the suspension of his
      or her license
    related_terms: []
    items:
      - RI-5-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: continuing education
    definition: Continuing education refers to the required coursework that licensees must complete to
      renew their real estate license.
    source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons)
    quoted_text: A licensee who fraudulently certifies to the Department completion of the continuing
      education requirement described in § 2.30 of this Part may be subject to the suspension of his
      or her license following notice and an opportunity for a hearing until such time that the
      requirements of § 2.30 of this Part are satisfied.
    related_terms: []
    items:
      - RI-5-0085
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: deficient conditions
    definition: Deficient conditions are any land restrictions, defects, malfunctions, breakages, or
      unsound conditions on the real estate that the seller knows about.
    source: R.I. Gen. Laws ch. 5-20.8 (Real Estate Sales Disclosures)
    quoted_text: “Deficient conditions” means any land restrictions, defect, malfunction, breakage, or
      unsound condition existing on, in, across, or under the real estate of which the seller has
      knowledge.
    related_terms: []
    items:
      - RI-5-0078
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disclosure
    definition: A seller's written disclosure must state all deficient conditions of which the seller
      has actual knowledge.
    source: R.I. Gen. Laws ch. 5-20.8 (Real Estate Sales Disclosures)
    quoted_text: The written disclosure shall comply with the requirements set forth in subsection (b)
      and shall state all deficient conditions of which the seller has actual knowledge.
    related_terms: []
    items:
      - RI-5-0078
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: education
    definition: Education in this context means the required coursework that licensees must complete for
      license renewal, i.e., continuing education.
    source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons)
    quoted_text: B. A licensee who fraudulently certifies to the Department completion of the continuing
      education requirement described in § 2.30 of this Part may be subject to the suspension of his
      or her license
    related_terms: []
    items:
      - RI-5-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: exemption
    definition: An exemption is a situation where certain individuals, such as attorneys acting within
      their practice, are excused from real estate licensing requirements.
    source: REP Ref. Brokerage Practice
    quoted_text: Owners dealing with their own property, attorneys acting within their practice,
      court-appointed fiduciaries, and (in many states) resident managers performing limited leasing
      tasks are common exemptions;
    related_terms: []
    items:
      - RI-5-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: fair housing
    definition: Fair housing refers to federal laws that prohibit discrimination in housing, such as
      refusing to show properties to families with children.
    source: REP Ref. Agency
    quoted_text: Instructions to break the law — to refuse to show the property to families with
      children (a violation of the cached Fair Housing Act), to conceal a known defect, to misstate
      square footage — must be refused;
    related_terms: []
    items:
      - RI-5-0085
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: fee
    definition: A fee is a charge required for licensing, such as the license renewal fee referenced in
      Rhode Island law.
    source: R.I. Gen. Laws ch. 5-20.5 (Real Estate Brokers and Salespersons)
    quoted_text: shall pay, in addition to his or her license renewal fee, a fee of twenty-five dollars
      ($25.00) for deposit in the real estate recovery account
    related_terms: []
    items:
      - RI-5-0051
      - RI-5-0053
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: joint expenses
    definition: Joint expenses are shared costs such as rent, utilities, and unlicensed administrative
      staff that team members may collectively pay.
    source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons)
    quoted_text: common joint expenses, such as unlicensed administrative staff, rent, utilities and
      other common expenses
    related_terms: []
    items:
      - RI-5-0033
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: license
    definition: A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage, such as listing, selling, buying,
      exchanging, leasing, renting, managing, negotiating, advertising, and offering to do any of
      these with respect to real property.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage: listing, selling, buying, exchanging,
      leasing, renting, managing, negotiating, advertising, and offering to do any of these with
      respect to real property."
    related_terms: []
    items:
      - RI-5-0051
      - RI-5-0074
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: LLC
    definition: An LLC is a legal entity that holds property in severalty, treating the company as a
      single owner even if it has many members.
    source: REP Ref. Ownership, Title & Transfer
    quoted_text: A corporation or LLC holding title holds in severalty even though it has many owners,
      because the entity is a single legal person.
    related_terms: []
    items:
      - RI-5-0033
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: preservation
    definition: Preservation refers to the safekeeping of transaction and escrow account records when a
      principal broker leaves office until a new principal broker is designated.
    source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons)
    quoted_text: The preservation and safekeeping of the transaction and escrow account records upon
      termination of his or her status as principal broker until a new principal broker has been
      designated;
    related_terms: []
    items:
      - RI-5-0025
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: probation
    definition: Probation is a disciplinary measure that allows a licensee to remain licensed but under
      supervision, for a period not to exceed one year for certain violations.
    source: R.I. Gen. Laws ch. 5-20.5 (Real Estate Brokers and Salespersons)
    quoted_text: place a licensee on probation for a period not to exceed one year
    related_terms: []
    items:
      - RI-5-0074
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: receipt
    definition: A written receipt is the buyer's signed acknowledgment that they have received a copy of
      the seller's written disclosure.
    source: R.I. Gen. Laws ch. 5-20.8 (Real Estate Sales Disclosures)
    quoted_text: The agent shall not communicate the offer of the buyer until the buyer has received a
      copy of the written disclosure and signed a written receipt of the disclosure.
    related_terms: []
    items:
      - RI-5-0080
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: records
    definition: Records are the transaction files and related documents that a brokerage must retain and
      maintain for its office.
    source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons)
    quoted_text: The proper retention and maintenance of records relating to transactions conducted by
      or on behalf of the brokerage at such office;
    related_terms: []
    items:
      - RI-5-0025
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: refusal
    definition: A refusal occurs when the buyer declines to sign the written receipt for the seller's
      disclosure.
    source: R.I. Gen. Laws ch. 5-20.8 (Real Estate Sales Disclosures)
    quoted_text: If the buyer refuses to sign a receipt pursuant to this section, the seller or agent
      shall immediately sign and date a written account of the refusal.
    related_terms: []
    items:
      - RI-5-0080
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: regulation
    definition: A regulation is a government rule, such as those governing zoning or eminent domain,
      that imposes requirements on individuals and businesses.
    source: REP Ref. Ownership, Title & Transfer
    quoted_text: and government regulation such as zoning and eminent domain.
    related_terms: []
    items:
      - RI-5-0056
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: renewal
    definition: Renewal refers to the process of extending a license, during which a broker must pay any
      required fees, such as the license renewal fee, to maintain licensure.
    source: 230-RICR-30-20-2 (Real Estate Brokers and Salespersons)
    quoted_text: The verification that each licensee affiliated with the brokerage has a license in good
      standing with the Department at the beginning of each renewal term;
    related_terms: []
    items:
      - RI-5-0053
      - RI-5-0060
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: seller
    definition: In real estate brokerage, the seller is the client who has engaged the brokerage to
      represent them.
    source: REP Ref. Agency
    quoted_text: the principal is the client (a seller, buyer, landlord, or tenant who has engaged the
      brokerage)
    related_terms: []
    items:
      - RI-5-0080
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: team leader
    definition: A team leader heads a group of licensees within a brokerage but remains under the
      broker’s supervision and cannot replace the broker unless also licensed as one.
    source: REP Ref. Brokerage Practice
    quoted_text: A team of licensees within a brokerage remains under the broker's supervision; the team
      leader is not a substitute for the broker unless licensed as one and the state permits
      delegation.
    related_terms: []
    items:
      - RI-5-0033
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: term
    definition: A term is a fixed period of time specified in an agreement, after which it expires
      unless renewed.
    source: REP Ref. Agency
    quoted_text: Expiration of the term stated in the agreement. Most states require listing and buyer
      agreements to have a definite termination date
    related_terms: []
    items:
      - RI-5-0028
