  - term: pending closings
    definition: Pending closings are real estate transactions awaiting finalization that a broker with
      an expired, suspended, deactivated or revoked license cannot complete; responsibility must be
      transferred to another broker, attorney, financial institution or escrow company.
    source: Kan. Stat. Ann. § 58-3084
    quoted_text: (a) A supervising broker or branch broker whose license is expired or is suspended,
      deactivated or revoked may not personally finalize any pending closings. This responsibility
      must be given to another broker, an attorney, a financial institution or an escrow company.
    related_terms: []
