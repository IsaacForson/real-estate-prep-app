  - term: incomplete application
    definition: An incomplete application is a license application that lacks required information or
      fees, prompting the commission to notify the applicant of the deficiency and give them a
      chance to correct it.
    source: Kan. Stat. Ann. § 58-3044
    quoted_text: (b) If an incomplete application is filed with the commission or the proper fees are
