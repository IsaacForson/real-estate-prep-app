  - term: Kansas judicial review act
    definition: The Kansas judicial review act is the law that permits a person to appeal a real estate
      commission's order to a court for appellate relief.
    source: Kan. Stat. Ann. § 58-3058
    quoted_text: Any person aggrieved by an order of the commission may appeal the order in accordance
