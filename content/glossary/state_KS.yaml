  - term: inactive status
    definition: Inactive status is the condition placed on a license by the commission when the
      associated office closes or the broker’s license expires, is deactivated, suspended or
      revoked, unless the licensee transfers to another office.
    source: Kan. Stat. Ann. § 58-3060
    quoted_text: The commission shall place each license that is still affiliated with the closed
