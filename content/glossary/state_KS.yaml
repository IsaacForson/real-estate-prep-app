  - term: interest
    definition: Having an interest in real estate means either owning the property or being an officer,
      member, partner, or shareholder of an entity that owns it, except that owning less than 5% of
      a publicly traded entity does not count as an interest.
    source: Kan. Stat. Ann. § 58-3035
    quoted_text: '(i) "Interest" means: (1) Having any type of ownership in the real estate involved in
      the transaction; or (2) an officer, member, partner or shareholder of any entity that owns
      such real estate excluding an ownership interest of less than 5% in a publicly traded entity.'
    related_terms: []
