entries:
  - term: administrative procedure act
    definition: The Kansas administrative procedure act requires the commission to give notice and an
      opportunity to be heard before taking certain actions, unless a license application is denied
      solely because the applicant failed the required examination.
    source: Kan. Stat. Ann. § 58-3044
    quoted_text: Such notice and an opportunity to be heard shall be given in accordance with the
      provisions of the Kansas administrative procedure act, unless the application for a license is
      denied solely because of the applicant's failure to pass a required examination.
    related_terms: []
    items:
      - KS-3034-0013
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: age
