  - term: aggravating circumstances
    definition: Aggravating circumstances are factors (such as fraud causing substantial financial loss)
      that increase the severity of a violation and can lead to higher civil fines under Kansas real
      estate law.
    source: Kan. Stat. Ann. § 58-3050
    quoted_text: 58-3050. Refusal to grant or renew; revocation, suspension or restriction of license;
      censure of licensee; disciplinary actions; civil fines; aggravating circumstances; procedures;
      recovery of actual costs and attorney fees.
