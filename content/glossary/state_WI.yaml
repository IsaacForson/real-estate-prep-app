  - term: implied
    definition: In the context of contracts, a term or obligation that arises from the conduct of the
      parties rather than from stated words, as opposed to an express contract where terms are
      stated orally or in writing.
    source: REP Ref. Contracts
    quoted_text: An **implied** contract (sometimes called implied-in-fact) arises from the conduct of
      the parties rather than from stated words.
