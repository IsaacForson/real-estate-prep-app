  - term: income approach
    definition: The income approach estimates property value by converting expected future income
      (usually one year's net operating income) into present value using a capitalization rate.
    source: REP Ref. Valuation & Appraisal
    quoted_text: The income (income capitalization) approach converts expected future income into a
      present value estimate; it rests on anticipation (§ 4.5).
