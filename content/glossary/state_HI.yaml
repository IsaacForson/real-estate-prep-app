  - term: agency
    definition: Agency is a relationship where an agent is authorized to act on behalf of a principal,
      owes fiduciary duties, and in real estate the principal is the client (seller, buyer,
      landlord, or tenant) and the agent is the broker.
    source: "[REP Ref. Agency — § 1.1 Definitions]"
    quoted_text: An agent is a person authorized to act on behalf of another (the principal) in dealings
      with third parties, and agrees to do so subject to the principal's control. The agent owes the
      principal fiduciary duties — duties of the highest trust and loyalty — because the agent is
      handling the principal's affairs. In real estate brokerage the principal is the client (a
      seller, buyer, landlord, or tenant who has engaged the brokerage), and the agent is the
      broker.
    related_terms: []
