  - term: undisclosed dual agency
    definition: Representing both the buyer and seller in a transaction without the informed written
      consent of both parties, which is a serious license law violation and breach of fiduciary
      duty.
    source: REP Ref. Agency
    quoted_text: Undisclosed dual agency — representing both sides without both parties' knowledge and
      consent — is a serious license law violation and a breach of fiduciary duty
