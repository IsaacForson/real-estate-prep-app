  - term: relationship disclosure
    definition: The requirement that a real estate brokerage agency provide buyers and sellers of
      residential real property with a meaningful, written relationship disclosure form before
      entering into a brokerage agreement.
    source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act)
    quoted_text: A real estate brokerage agency shall provide in a timely manner to buyers and sellers
      of residential real property a meaningful, written real estate brokerage relationship
      disclosure form
    related_terms: []
