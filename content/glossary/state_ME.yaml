  - term: residential real property
    definition: Real estate that consists of at least one and no more than four residential dwelling units.
    source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act)
    quoted_text: For purposes of this section, "residential real property" means real estate consisting
      of not less than one nor more than 4 residential dwelling units.
    related_terms: []
