  - term: interpretation
    definition: In this subchapter, 'interpretation' refers to the rule that the provisions supersede
      common-law duties, including fiduciary responsibilities of an agent to a client, except for
      vicarious liability and as otherwise set forth.
    source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act)
    quoted_text: The provisions of this subchapter supersede the duties and responsibilities of the
      parties under the common law, including fiduciary responsibilities
    related_terms: []
