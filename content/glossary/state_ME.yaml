    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: license renewal
    definition: The process by which an agency license is extended for another biennial period, expiring
      on December 31 unless the Commissioner sets a different date.
    source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act)
    quoted_text: §13182. Agency license renewal Agency licenses expire on December 31st, or at such
      times as the Commissioner of Professional and Financial Regulation may designate, of each
      biennial period for which it was issued.
    related_terms: []
    items:
      - ME-114-0023
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: license required
    definition: The prohibition against performing real estate brokerage activities without holding a
      current agency license or a license authorizing brokerage on behalf of an agency.
    source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act)
    quoted_text: §13003. License required It is unlawful for any person or entity to engage in real
      estate brokerage without a current real estate brokerage agency license issued under this
      chapter or a license authorizing the person to engage in brokerage activity on behalf of a
      brokerage agency.
    related_terms: []
    items:
      - ME-114-0024
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: ministerial acts
    definition: Ministerial acts are informative or clerical tasks—like providing forms, scheduling
      showings, transmitting offers, or explaining a form’s content without advice—that a brokerage
      performs for a non‑client and that do not create an agency relationship.
    source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act)
    quoted_text: '"Ministerial acts" means those acts that a real estate brokerage agency performs for a
      person who is not a client and that are informative or clerical in nature'
    related_terms: []
    items:
      - ME-114-0031
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: presumption
    definition: Under the statute, if a brokerage agency provides services without a written agreement
      to represent a client, the law presumes the agency is acting as a transaction broker rather
      than as an agent for any party.
    source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act)
    quoted_text: presumed to be acting as a transaction broker unless
