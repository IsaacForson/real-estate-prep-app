  - term: disclosed dual agent
    definition: A disclosed dual agent is a real estate brokerage agency that represents two or more
      clients with adverse interests in the same transaction, acting with the clients' knowledge and
      informed consent.
    source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act)
    quoted_text: "'Disclosed dual agent' means a real estate brokerage agency representing 2 or more
      clients whose interests are adverse in the same transaction with the knowledge and informed
      consent of the clients."
    related_terms: []
    items:
      - ME-114-0034
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: informed consent
    definition: Informed consent is the clients' knowledge and agreement to a brokerage representing
      both parties in a transaction where their interests are adverse.
    source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act)
    quoted_text: Disclosed dual agent. "Disclosed dual agent" means a real estate brokerage agency
      representing 2 or more clients whose interests are adverse in the same transaction with the
      knowledge and informed consent of the clients.
    related_terms: []
    items:
