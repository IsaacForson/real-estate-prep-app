  - term: supervision
    definition: Supervision is the duty of a broker (or designated managing broker) to oversee the
      activities of all licensees and unlicensed persons in the firm, including reviewing contracts
      and providing training.
    source: REP Ref. Brokerage Practice
    quoted_text: State license laws make the broker (or a designated managing broker) responsible for
      supervising the brokerage activities of every licensee and every unlicensed person working in
      the firm.
    related_terms: []
    items:
      - ME-114-0025
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
