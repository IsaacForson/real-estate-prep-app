  - term: transaction broker
    definition: A transaction broker is a brokerage that assists parties in a transaction without
      representing any of them as a fiduciary agent.
    source: 32 M.R.S. §§ 13001–13283 (Real Estate Brokerage License Act)
    quoted_text: '"Transaction broker" means a real estate brokerage agency that provides real estate
      brokerage services to one or more parties in a real estate transaction without a fiduciary
      relationship as a buyer agent, a seller agent, a subagent or a disclosed dual agent.'
