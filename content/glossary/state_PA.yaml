entries:
  - term: actual knowledge
    definition: Actual knowledge is information that a licensee actually knows and must disclose, such
      as material defects of which the licensee has actual knowledge.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: of which the licensee has actual knowledge.
    related_terms: []
    items:
      - PA-9-0084
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: advertisement
    definition: An advertisement is any promotional communication — such as print, sign, website, social
      media post, or email — placed by a licensee that must identify the brokerage by its licensed
      name so the public knows whom the licensee represents.
    source: REP Ref. Brokerage Practice
    quoted_text: Most states require that every advertisement placed by a licensee — print, sign,
      website, social media post, email — identify the brokerage by its licensed name
    related_terms: []
    items:
      - PA-9-0077
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: advertising
    definition: Advertising means undertaking to promote the sale, exchange, purchase or rental of real estate.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: Undertakes to promote the sale, exchange, purchase or rental of real estate.
    related_terms: []
    items:
      - PA-9-0078
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: advice
    definition: Advice refers to guidance or recommendations given to a customer that should be reserved
      for a client, such as legal or negotiation advice.
    source: REP Ref. Agency
    quoted_text: Implied agency is the main reason licensees are trained to disclose whom they represent
      early and to avoid giving advice to customers that only a client should receive.
    related_terms: []
    items:
      - PA-9-0071
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: agent
    definition: An agent is a person authorized to act on behalf of another (the principal) in dealings
      with third parties, subject to the principal's control and owing fiduciary duties.
    source: REP Ref. Agency
    quoted_text: one person (the **agent**) is authorized to act on behalf of another (the
      **principal**) in dealings with third parties
    related_terms: []
    items:
      - PA-9-0084
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: authority
    definition: Authority refers to the scope of power or permission granted by a principal to an agent
      to act on their behalf.
    source: REP Ref. Agency
    quoted_text: Agency is classified by the scope of authority the principal has conferred.
    related_terms: []
    items:
      - PA-9-0072
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: bankruptcy
    definition: Bankruptcy is a legal condition in which control of the principal's property is
      transferred to a trustee (or the broker).
    source: REP Ref. Agency
    quoted_text: "- **Bankruptcy** of the principal, when it transfers control of the property to a
      trustee, or of the broker."
    related_terms: []
    items:
      - PA-9-0040
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: buyer's broker
    definition: A buyer's broker is a licensee who acts as an agent for the buyer in a real‑estate
      transaction, obligated to be loyal, to make a good‑faith effort to find property, and to
      disclose at first contact that they are engaged as the buyer's agent.
    source: 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act)
    quoted_text: to disclose to the listing broker, at first contact, that the broker has been engaged
      as a buyer's agent.
    related_terms: []
    items:
      - PA-9-0053
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: court order
    definition: A court order is a legal directive issued by a court that authorizes someone to act, for
      example, allowing a trustee in bankruptcy to administer property under the Act's exclusion
      provisions.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: acting under authority of a court order, will or trust instrument.
    related_terms: []
    items:
      - PA-9-0040
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disciplinary action
    definition: Disciplinary action is a penalty imposed by the Commission on a licensee for violating
      rules, such as providing false information on an application.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: will be grounds for disciplinary action against the licensee.
    related_terms: []
    items:
      - PA-9-0075
      - PA-9-0076
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: employee
    definition: Employee refers to a worker who is directly hired by a broker, subject to tax
      withholdings and benefits, as opposed to an independent contractor.
    source: REP Ref. Brokerage Practice
    quoted_text: Most salespersons are engaged by their brokers as independent contractors rather than
      employees. The classification affects federal income tax withholding, Social Security and
      Medicare taxes, unemployment insurance, workers' compensation, overtime, and benefits.
    related_terms: []
    items:
      - PA-9-0072
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: escrow
    definition: Escrow refers to a separate account where a broker holds money belonging to others, such
      as earnest money or security deposits, until the transaction is completed.
    source: REP Ref. Brokerage Practice
    quoted_text: Money a brokerage receives that belongs to others — earnest money, tenant security
      deposits, rents collected for owners, advance fees — is trust money and must be held in a
      designated trust or escrow account separate from the firm's operating funds.
    related_terms: []
    items:
      - PA-9-0072
      - PA-9-0073
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: exclusion
    definition: An exclusion refers to a person or entity that is not subject to the Real Estate
      Licensing and Registration Act, such as an attorney providing legal services, a trustee acting
      under a court order, or certain bank officers dealing only with their institution's real
      estate.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: (5) An attorney-at-law who receives a fee from his client for rendering services within
      the scope of the attorney-client relationship and does not hold himself out as a real estate
      broker.
    related_terms: []
    items:
      - PA-9-0040
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: fee
    definition: A fee is a charge for services, such as a retainer, flat fee, or percentage of the
      price, that compensates the broker for brokerage acts.
    source: REP Ref. Brokerage Practice
    quoted_text: how the broker will be compensated (a retainer, a flat fee, a percentage of the price,
      or the amount offered through the listing broker
    related_terms: []
    items:
      - PA-9-0045
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: first contact
    definition: First contact is the initial communication or meeting between a buyer's broker and the
      listing broker (or the seller if there is no listing broker) at which the buyer's broker must
      disclose their agency relationship.
    source: 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act)
    quoted_text: to disclose to the listing broker, at first contact, that the broker has been engaged
      as a buyer's agent.
    related_terms: []
    items:
      - PA-9-0053
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: illness
    definition: Illness is a medical condition that can excuse a commission member from attending
      meetings, preventing forfeiture of their seat if approved.
    source: 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act)
    quoted_text: A commission member who fails to attend three consecutive meetings shall forfeit his
      seat unless the Commissioner of Professional and Occupational Affairs, upon written request
      from the member, finds that the member should be excused from a meeting because of illness or
      the death of a family member.
    related_terms: []
    items:
      - PA-9-0032
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: incorrect
    definition: Incorrect means not accurate or false, such as a statement that is not true.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: when salesperson knew or should have known that representation to be incorrect was
      conduct imputable to the salesperson’s principal broker thereby, constituting a violation of
      this section.
    related_terms: []
    items:
      - PA-9-0071
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: jurisdiction
    definition: Jurisdiction refers to the state or area whose real estate licensing authority issued a
      license.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: the real estate licensing authority of the jurisdiction in which the candidate is licensed
    related_terms: []
    items:
      - PA-9-0075
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: liability
    definition: Liability is the legal responsibility of a principal for the acts of an authorized
      subagent performed within the scope of the agency.
    source: REP Ref. Agency
    quoted_text: A principal is generally liable for the acts of an authorized subagent within the scope
      of the agency.
    related_terms: []
    items:
      - PA-9-0084
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: licensure
    definition: Licensure is the process of obtaining a real estate license from the state commission.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: C. LICENSURE … 35.221
    related_terms: []
    items:
      - PA-9-0074
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: member
    definition: A member of the State Real Estate Commission is an individual appointed to serve on the
      commission, other than the Commissioner of Professional and Occupational Affairs.
    source: 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act)
    quoted_text: Each member of the commission other than the Commissioner of Professional and
      Occupational Affairs shall receive reimbursement
    related_terms: []
    items:
      - PA-9-0030
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: money
    definition: Money in this context refers to funds, such as an earnest money check, that are
      deposited into an escrow account.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: deposit money into an escrow account
    related_terms: []
    items:
      - PA-9-0073
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: odds
    definition: Odds refers to the probability or chances of winning a prize that must be disclosed in
      advertisements of prizes, gifts, or similar offerings.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: (5) The odds of winning or receiving each prize, certificate, gift or lot offered.
    related_terms: []
    items:
      - PA-9-0066
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: office
    definition: An office is a physical location where a brokerage conducts its business, such as the
      place whose rent is paid by the firm.
    source: REP Ref. Agency
    quoted_text: "Example: a property manager collects rents into the firm's general account and pays
      office rent from it."
    related_terms: []
    items:
      - PA-9-0044
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: party
    definition: A party is one of the two or more competent individuals or entities that enter into a contract.
    source: REP Ref. Contracts
    quoted_text: between two or more competent parties
    related_terms: []
    items:
      - PA-9-0073
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: place of business
    definition: Principal place of business is the fixed location of the broker in the state where the
      licensee holds the equivalent of a standard license.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: Principal place of business —The fixed location of the broker or cemetery broker in the
      state where the licensee holds the equivalent of a standard license.
    related_terms: []
    items:
      - PA-9-0044
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: prize
    definition: A prize is an item (such as a free weekend getaway) offered in an advertisement to
      attract prospective buyers, which must be accompanied by a statement of its fair market value
      and the odds of winning.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: (1) A description of each prize, certificate, gift or lot offered.
    related_terms: []
    items:
      - PA-9-0066
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: quorum
    definition: A quorum is the minimum number of commission members required to be present to conduct
      official business, defined as a majority of those currently serving.
    source: 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act)
    quoted_text: A majority of the members currently serving on the commission shall constitute a quorum.
    related_terms: []
    items:
      - PA-9-0030
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: records
    definition: Records are the documents and information that a real estate agent must keep accurate
      and preserve, such as earnest money, contracts, and other transaction-related papers.
    source: REP Ref. Agency
    quoted_text: The agent must keep the principal's money and property separate from the agent's own,
      keep accurate records, and turn over or account for all funds and documents received in the
      course of the agency — earnest money, rents, security deposits, keys, documents.
    related_terms: []
    items:
      - PA-9-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: relicensure
    definition: Relicensure is the process of obtaining a real estate license again after it has been revoked.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: 35.251. Relicensure following revocation.
    related_terms: []
    items:
      - PA-9-0074
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: rental
    definition: Rental refers to the leasing of real estate for occupancy, which is one of the
      activities a licensee may undertake when promoting the sale, exchange, purchase or rental of
      real estate.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: Undertakes to promote the sale, exchange, purchase or rental of real estate.
    related_terms: []
    items:
      - PA-9-0086
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: salesperson
    definition: A salesperson (or associate broker) may perform brokerage acts only under a sponsoring
      broker and may be compensated only by that broker.
    source: REP Ref. Brokerage Practice
    quoted_text: a **salesperson** (or associate broker) may perform brokerage acts only under a
      sponsoring broker and may be compensated only by that broker.
    related_terms: []
    items:
      - PA-9-0045
      - PA-9-0049
      - PA-9-0059
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: short title
    definition: The short title is the official name given to a chapter or part of a statute, such as
      'Short title of chapter' for the Real Estate Seller Disclosure Law.
    source: 68 Pa.C.S. §§ 7301–7315 (Real Estate Seller Disclosure Law)
    quoted_text: Section 7301. Short title of chapter.
    related_terms: []
    items:
      - PA-9-0068
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: subagent
    definition: A subagent is a licensee who, with the principal's authorization, assists the listing
      broker in serving the seller and owes the seller fiduciary duties, even if working directly
      with the buyer.
    source: REP Ref. Agency
    quoted_text: "A **subagent** is an agent of an agent: a licensee who, with the principal's
      authorization, assists the listing broker in serving the seller and thereby owes the seller"
    related_terms: []
    items:
      - PA-9-0034
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: suspension
    definition: Suspension is the temporary withdrawal of a broker's license by the Commission, during
      which the licensee may not engage in licensed real‑estate activities.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: A branch office license terminates automatically with the suspension, revocation or
      discontinuance, for whatever reason, of the license of the broker or cemetery broker to whom
      the branch office license was issued.
    related_terms: []
    items:
      - PA-9-0062
      - PA-9-0076
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: time-share salesperson
    definition: A time-share salesperson is a licensee authorized to sell or offer to sell time‑share
      interests under the Real Estate Licensing and Registration Act, requiring a separate
      time‑share salesperson license.
    source: 63 P.S. §§ 455.101–455.902 (Real Estate Licensing and Registration Act)
    quoted_text: Subchapter J. Time-Share Salesperson's License
    related_terms: []
    items:
      - PA-9-0049
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: transaction
    definition: A transaction is the real estate deal between parties, where anyone not represented by
      the brokerage is considered a customer or third party.
    source: REP Ref. Agency
    quoted_text: A person in the transaction who is *not* represented by the brokerage is a **customer**
      (or third party).
    related_terms: []
    items:
      - PA-9-0028
      - PA-9-0067
      - PA-9-0071
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: trustee
    definition: A trustee is a person who receives control of property, such as when bankruptcy
      transfers control of the principal's property to a trustee.
    source: REP Ref. Agency
    quoted_text: Bankruptcy of the principal, when it transfers control of the property to a trustee, or
      of the broker.
    related_terms: []
    items:
      - PA-9-0040
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: verification
    definition: Verification means checking that a fact is correct before stating it as true.
    source: REP Ref. Brokerage Practice
    quoted_text: verification of facts before repeating them
    related_terms: []
    items:
      - PA-9-0086
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: withdraw
    definition: Withdraw means to take money out of an escrow account, which a licensed employee may do
      only with the broker's written authority.
    source: 49 Pa. Code ch. 35 (State Real Estate Commission)
    quoted_text: may give a licensed employee written authority to withdraw funds from the escrow account
    related_terms: []
    items:
      - PA-9-0072
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
