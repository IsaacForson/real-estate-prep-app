  - term: branch
    definition: A branch office is a secondary location of a brokerage where a branch manager or
      managing broker supervises licensees, as states may set limits on supervision or require a
      managing broker at each branch.
    source: REP Ref. Brokerage Practice
    quoted_text: Some states impose numerical limits on how many licensees a branch manager may
      supervise, or require a managing broker at each branch office
    related_terms: []
