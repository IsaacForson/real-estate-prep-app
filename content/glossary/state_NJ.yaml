  - term: application fee
    definition: A non-refundable fee of $50 that must accompany an application for a real estate broker,
      broker‑salesperson, or salesperson license in New Jersey.
    source: N.J. Stat. Ann. tit. 45, ch. 15
    quoted_text: Application for a license, whether as a real estate broker, broker-salesperson, or
      salesperson, shall be made to the commission upon forms prescribed by it and shall be
      accompanied by an application fee of $50 which fee shall not be refundable.
    related_terms: []
