    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: bars
    definition: Bars are disqualifications that prevent the issuance of a real estate license, such as
      certain criminal convictions within the past five years.
    source: N.J. Stat. Ann. tit. 45, ch. 15
    quoted_text: No license shall be issued by the commission to any person known by it to have been,
      within five years theretofore, convicted of forgery, burglary, robbery, any theft offense
      other than shoplifting, criminal conspiracy to defraud, or other like offense or offenses
