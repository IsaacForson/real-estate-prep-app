entries:
  - term: advertise
    definition: To advertise means to engage in any form of representation, promotion, or solicitation
      related to real estate brokerage activity, disseminated by any means of communication.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: As used in this section, the terms "advertise", "advertising", and "advertisement"
      include all forms of representation, promotion, and solicitation disseminated in any manner
    related_terms: []
