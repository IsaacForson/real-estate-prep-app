  - term: advertisement
    definition: An advertisement is any representation, promotion, or solicitation related to real
      estate brokerage activity that is disseminated in any manner.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: As used in this section, the terms "advertise", "advertising", and "advertisement"
      include all forms of representation, promotion, and solicitation disseminated in any manner
    related_terms: []
    items:
      - ND-23-0049
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: advertising
    definition: Advertising encompasses all forms of representation, promotion, and solicitation
      disseminated in any manner for any purpose related to real estate brokerage activity.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: As used in this section, the terms "advertise", "advertising", and "advertisement"
      include all forms of representation, promotion, and solicitation disseminated in any manner
    related_terms: []
    items:
      - ND-23-0049
      - ND-23-0050
      - ND-23-0057
      - ND-23-0065
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: appointed agent
    definition: An appointed agent is a licensee appointed by a designated broker to act solely for a
      client of that brokerage firm, to the exclusion of other licensees of the firm.
    source: N.D. Cent. Code ch. 43-23
    quoted_text: "'Appointed agent' means a licensee appointed by a designated broker of the licensee's
      real estate brokerage firm to act solely for a client of that brokerage firm to the exclusion
      of other licensees of that brokerage firm."
    related_terms: []
    items:
      - ND-23-0063
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: background check
    definition: A background check is a statewide and nationwide criminal history record check that an
      applicant or licensee may be required to submit to as part of a licensure investigation, with
      all associated costs borne by the applicant or licensee.
    source: N.D. Cent. Code ch. 43-23
    quoted_text: All costs associated with obtaining a background check are the responsibility of the
      applicant or licensee.
    related_terms: []
    items:
      - ND-23-0080
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: brokerage agreement
    definition: A brokerage agreement is the contract entered into between a client and an appointed
      agent (or brokerage) for representation, which must be preceded by a written disclosure of the
      appointment.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: An appointed agent shall disclose in writing such appointment to the client before
      entering into a brokerage agreement
    related_terms: []
    items:
      - ND-23-0063
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: closing
    definition: Closing is the point in a real estate transaction when the deed is delivered and the
      price is paid, after which the purchase agreement is considered executed.
    source: REP Ref. Contracts
    quoted_text: After closing, when the deed has been delivered and the price paid, the purchase
      agreement is executed.
    related_terms: []
    items:
      - ND-23-0076
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: counsel
    definition: Counsel refers to legal counsel, i.e., advice from an attorney that a licensee should
      recommend when a party's interests require it.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: should recommend that title be examined and legal counsel be obtained when the interest
      of either party requires it
    related_terms: []
    items:
      - ND-23-0058
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: criminal history
    definition: A criminal history record check is a statewide and nationwide background check that the
      commission may require for licensure applicants or licensees under investigation.
    source: N.D. Cent. Code ch. 43-23
    quoted_text: 43-23-08.4. Criminal history record checks. The commission may require an applicant for
      licensure or a licensee whose licensure is subject to investigation by the commission to
      submit to a statewide and nationwide criminal history record check.
    related_terms: []
    items:
      - ND-23-0080
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: deception
    definition: Deception involves any false or misleading statement or omission in advertising that
      could mislead a party about the property or transaction.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: Deception and misrepresentation prohibited. Advertising and promotion must be free from
      deception
    related_terms: []
    items:
      - ND-23-0057
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: expiration date
    definition: An expiration date is the definite date by which a listing agreement must expire,
      required to be set before the property is advertised or offered for sale.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: definite expiration date prior to the time that the property is advertised or offered for sale.
    related_terms: []
    items:
      - ND-23-0065
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: legal advice
    definition: Legal advice consists of giving guidance about the meaning or effect of a document,
      advising how to take title, or interpreting how a law applies to a client's situation.
    source: REP Ref. Brokerage Practice
    quoted_text: give legal advice about the meaning or effect of a document, advise how to take title,
      or interpret how a law applies to a client's situation
    related_terms: []
    items:
      - ND-23-0058
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: listing agreement
    definition: A listing agreement is the employment contract between a seller (or landlord) and a
      brokerage that creates seller agency, is a personal service contract with the broker, and must
      be written, signed by the seller, and include a definite expiration date.
    source: REP Ref. Brokerage Practice
    quoted_text: A listing agreement is the employment contract between a seller (or landlord) and a
      brokerage, creating seller agency
    related_terms: []
    items:
      - ND-23-0065
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: materials
    definition: Materials refer to marketing materials such as brochures, flyers, or other promotional
      items used in real estate brokerage activities.
    source: REP Ref. Brokerage Practice
    quoted_text: preparing marketing materials and assembling files under a licensee's direction
    related_terms: []
    items:
      - ND-23-0054
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: misrepresentation
    definition: Misrepresentation is a false statement of fact that another party relies upon, whether
      intentional, negligent, or innocent.
    source: REP Ref. Agency
    quoted_text: A **misrepresentation** is a false statement of fact on which another party relies.
    related_terms: []
    items:
      - ND-23-0057
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: offer to purchase
    definition: An offer to purchase is a written proposal by a buyer to buy property, also known as the
      purchase agreement or sales contract.
    source: REP Ref. Contracts
    quoted_text: The purchase agreement (also called a sales contract, purchase and sale agreement, or
      offer to purchase) is the bilateral, executory contract that governs the transaction from
      acceptance to closing
    related_terms: []
    items:
      - ND-23-0059
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: personal funds
    definition: Personal funds are the broker's own money that may be deposited in a trust account, up
      to $500 to cover service charges, and must be kept separate from trust funds.
    source: N.D. Admin. Code ch. 70-02-01
    quoted_text: a broker may deposit and keep a sum not to exceed five hundred dollars in the account
      from the broker's personal funds which sum shall be specifically identified and deposited to
      cover service charges relating to the trust account.
    related_terms: []
    items:
      - ND-23-0064
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: promptly tender
    definition: Promptly tender means to quickly deliver a written offer to purchase to the seller
      without unnecessary delay.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: A licensee shall promptly tender to the seller every written offer to purchase obtained
      on the property involved
    related_terms: []
    items:
      - ND-23-0059
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: renewal
    definition: Renewal of a license is the process by which a real estate licensee extends their
      license for another period, typically annually.
    source: N.D. Admin. Code ch. 70-02-01
    quoted_text: 70-02-01-04 Renewal of License
    related_terms: []
    items:
      - ND-23-0066
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: salesperson
    definition: A salesperson (or associate broker) may perform brokerage acts only under a sponsoring
      broker and may be compensated only by that broker.
    source: REP Ref. Brokerage Practice
    quoted_text: A **salesperson** (or associate broker) may perform brokerage acts only under a
      sponsoring broker and may be compensated only by that broker.
    related_terms: []
    items:
      - ND-23-0076
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: service charges
    definition: Service charges are fees related to maintaining a trust account that may be paid using
      up to $500 of the broker's personal funds.
    source: N.D. Admin. Code ch. 70-02-01
    quoted_text: to cover service charges relating to the trust account.
    related_terms: []
    items:
      - ND-23-0064
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: signed
    definition: A signed listing agreement is a written contract between a seller and a brokerage that
      has been signed by the seller, as required in most states.
    source: REP Ref. Brokerage Practice
    quoted_text: Most states require listings to be written, signed by the seller, with a definite
      expiration date, and prohibit automatic extension clauses.
    related_terms: []
    items:
      - ND-23-0065
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: trade name
    definition: A trade name is the licensed name under which a real estate brokerage operates and must
      be used in advertising, at least as large and visible as any salesperson's name.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: Trade name. Advertising must be done in the real estate brokerage agency's trade name
      as licensed with the commission and the trade name must be equal to or greater than, in size
      and visibility, the name of any salesperson, associate broker, or team on the advertising.
    related_terms: []
    items:
      - ND-23-0050
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: written disclosure
    definition: A written disclosure is a separate written document in which the licensee affirms which
      party they represent in a transaction, made at the first substantive contact with that party.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: the licensee must make an affirmative written disclosure identifying which party that
      person represents in the transaction.
    related_terms: []
    items:
      - ND-23-0063
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: written offer
    definition: A written offer is a buyer's written proposal to purchase real property that a licensee
      must promptly tender to the seller.
    source: N.D. Admin. Code ch. 70-02-03
    quoted_text: A licensee shall promptly tender to the seller every written offer to purchase obtained
      on the property involved
    related_terms: []
    items:
      - ND-23-0059
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
