  - term: sign
    definition: A sign is a placard placed on property to indicate it is for sale or rent.
    source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166
    quoted_text: 12. Placed a sign on any property offering it for sale or for rent without the written
