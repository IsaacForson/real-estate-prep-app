entries:
  - term: access
    definition: Legal access is the right to enter or use a property; without it, a parcel has little
      utility and value.
    source: REP Ref. Valuation & Appraisal
    quoted_text: A landlocked parcel without legal access, or land zoned so that no practical use is
      allowed, has little utility and therefore little value.
    related_terms: []
    items:
      - AZ-20-0050
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: acting in concert
    definition: Acting in concert means there is evidence of collaborating to pursue a concerted plan.
    source: Ariz. Rev. Stat. §§ 32-2101 to 32-2109
    quoted_text: '"Acting in concert" means evidence of collaborating to pursue a concerted plan.'
    related_terms: []
    items:
      - AZ-20-0031
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: address of record
    definition: An address of record is the address where a licensee practices, their residential
      address, or their statutory agent's address, as defined by Arizona law.
    source: Ariz. Rev. Stat. §§ 32-2101 to 32-2109
    quoted_text: "'Address of record' means any of the following: (a) The address where a licensee
      practices or is otherwise employed. (b) A licensee's residential address."
    related_terms: []
