  - term: infraction
    definition: An infraction is a violation of the chapter for which the commissioner may assess a
      civil penalty.
    source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166
    quoted_text: may be assessed a civil penalty by the commissioner, after a hearing, in an amount not
      to exceed one thousand dollars for each infraction.
    related_terms: []
    items:
      - AZ-20-0041
