  - term: class 6 felony
    definition: A class 6 felony is a criminal offense for knowingly violating the commissioner's orders
      or requirements under this chapter.
    source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166
    quoted_text: is guilty of a class 6 felony and, if a licensee, shall be tried before the
