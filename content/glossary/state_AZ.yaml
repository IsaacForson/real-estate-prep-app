    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: consent
    definition: Consent is the informed written permission or agreement of a party, such as a property
      owner, to allow an action.
    source: REP Ref. Agency
    quoted_text: dual agency is permitted only with the informed written consent of both parties
    related_terms: []
    items:
      - AZ-20-0026
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: deposit
    definition: A deposit is money given by a buyer or other party—such as earnest money, a security
      deposit, or rent—that a licensee receives and must hold in a trust account, not commingle with
      the brokerage's own funds.
    source: REP Ref. Agency
    quoted_text: "**Commingling** is mixing money belonging to others (earnest money, rents, security
      deposits, tenant funds) with the licensee's or brokerage's own funds — depositing a buyer's
      deposit into the firm's operating account"
    related_terms: []
    items:
      - AZ-20-0045
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disclosure
    definition: Disclosure is the act of making known relevant information to parties involved in a real
      estate transaction, such as revealing affiliated services, so that the parties can give
      informed consent.
    source: REP Ref. Brokerage Practice
    quoted_text: Merely offering affiliated services is lawful with appropriate disclosure (and, for
      settlement services, subject to the cached RESPA statute); requiring them is a tie-in.
    related_terms: []
    items:
      - AZ-20-0044
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: duty
    definition: A duty is the obligation of an agent to act with the highest trust and loyalty toward
      the principal because the agent handles the principal's affairs.
    source: REP Ref. Agency
    quoted_text: The agent owes the principal fiduciary duties — duties of the highest trust and loyalty
      — because the agent is handling the principal's affairs.
    related_terms: []
    items:
      - AZ-20-0048
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: escrow
    definition: An escrow account is a designated account where a brokerage holds money belonging to
      others—such as earnest money, security deposits, or rent—separate from the firm's own
      operating funds.
    source: REP Ref. Brokerage Practice
    quoted_text: Money a brokerage receives that belongs to others — earnest money, tenant security
      deposits, rents collected for owners, advance fees — is **trust money** and must be held in a
      designated trust or escrow account separate from the firm's operating funds.
    related_terms: []
    items:
      - AZ-20-0045
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: false statement
    definition: A false statement is a false statement of fact on which another party relies, i.e., a
      misrepresentation.
    source: REP Ref. Agency
    quoted_text: A **misrepresentation** is a false statement of fact on which another party relies.
    related_terms: []
