  - term: speculation
    definition: Speculation, in this context, means selling cemetery property under a promise that it
      may be resold at a profit.
    source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166
    quoted_text: It is unlawful for any person to sell or offer for sale cemetery property under any
      promise that the cemetery property sold or offered for sale may be resold at a profit.
