  - term: authorization
    definition: Authorization is the permission given by a client (such as a property owner) that allows
      a licensee to perform specific actions on the client's behalf, like showing the property or
      placing advertising.
    source: REP Ref. Brokerage Practice
    quoted_text: authorization to place a sign, use a lockbox, advertise, and cooperate with and
      compensate other brokers
    related_terms: []
