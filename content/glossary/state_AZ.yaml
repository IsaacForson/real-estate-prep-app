  - term: licensee
    definition: A licensee is a person who holds a real estate license and acts as an agent, such as
      showing property to buyers.
    source: REP Ref. Agency
    quoted_text: most buyers wrongly believed the licensee showing them property was "their" agent when,
      under traditional subagency, that licensee actually represented the seller.
    related_terms: []
