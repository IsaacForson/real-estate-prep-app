  - term: compensation
    definition: Compensation is payment, such as a commission, that a licensee receives for performing
      real estate services like facilitating a sale, and must be properly authorized and documented.
    source: REP Ref. Agency
    quoted_text: Many states require these to be in writing for the licensee to be entitled to a
      commission or as a matter of license law; general agency law does not always require a
      writing.
    related_terms: []
    items:
      - AZ-20-0046
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: concerted plan
    definition: A concerted plan is a plan pursued jointly by parties.
    source: Ariz. Rev. Stat. §§ 32-2101 to 32-2109
    quoted_text: '"Acting in concert" means evidence of collaborating to pursue a concerted plan.'
    related_terms: []
    items:
      - AZ-20-0031
