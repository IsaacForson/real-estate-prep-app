    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: ledger
    definition: A ledger is a separate record for each transaction or owner that tracks receipts and
      disbursements in a trust account.
    source: REP Ref. Brokerage Practice
    quoted_text: the broker keeps a journal of receipts and disbursements and a separate ledger for each
      transaction or owner
    related_terms: []
    items:
      - AZ-20-0052
