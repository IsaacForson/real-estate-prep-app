  - term: broker
    definition: A broker is the licensed agent who acts on behalf of clients in real estate transactions.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
    items:
      - AZ-20-0033
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: buyer
    definition: Buyer refers to the individual who is purchasing real estate and who engages a brokerage
      as their client in the transaction.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the **client** (a seller, buyer, landlord, or
      tenant who has engaged the brokerage)
    related_terms: []
    items:
