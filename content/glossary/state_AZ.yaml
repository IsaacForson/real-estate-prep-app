  - term: subdivider
    definition: A subdivider is a person who divides land into lots or parcels for sale or development.
    source: Ariz. Rev. Stat. §§ 32-2101 to 32-2109
    quoted_text: (ii) An agreement that affects more than one lot or parcel by which the subdivider
