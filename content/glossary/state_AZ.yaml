  - term: cemetery property
    definition: Cemetery property means a burial park, mausoleum, crematory, or similar property
      dedicated for cemetery purposes.
    source: Ariz. Rev. Stat. §§ 32-2101 to 32-2109
    quoted_text: '12. "Cemetery" or "cemetery property" means any one, or a combination of more than
