  - term: advertising
    definition: Advertising is any effort to persuade someone to take on an obligation or acquire an
      interest in real estate through published, spoken, or broadcast means.
    source: Ariz. Rev. Stat. §§ 32-2101 to 32-2109
    quoted_text: "'Advertising' means attempting by publication, dissemination, exhibition, solicitation
      or circulation, oral or written, or for broadcast on radio or television to induce directly or
      indirectly any person to enter into any obligation or acquire any title or interest in lands"
    related_terms: []
