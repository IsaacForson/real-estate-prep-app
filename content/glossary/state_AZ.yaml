  - term: game of chance
    definition: A game of chance is an activity whose outcome is determined by luck rather than skill,
      often used in promotions to attract interest in real estate.
    source: Ariz. Admin. Code tit. 4, ch. 28 (R4-28-101 to R4-28-1310)
    quoted_text: conducting a lottery contest, drawing, or game of chance.
    related_terms: []
    items:
      - AZ-20-0038
