  - term: civil penalty
    definition: A civil penalty is a financial penalty that the commissioner may assess against a
      licensee for violating licensing statutes or rules.
    source: Ariz. Rev. Stat. §§ 32-2151 to 32-2166
    quoted_text: Assess a civil penalty pursuant to section 32-2160.01.
