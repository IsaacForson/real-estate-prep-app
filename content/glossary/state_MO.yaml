  - term: work permit
    definition: A temporary work permit is a permit issued by the Missouri Real Estate Commission
      allowing an applicant to practice while awaiting final printing of the salesperson license.
    source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules)
