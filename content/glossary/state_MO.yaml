  - term: reasonable cause
    definition: Reasonable cause is a valid justification or contractual relationship that must exist
      before a commission or consideration may be paid.
    source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules)
    quoted_text: 339.151 No commission or consideration unless reasonable cause for payment or
      contractual relationship exists
    related_terms: []
    items:
      - MO-339-0096
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: reasonable time
    definition: Reasonable time is a period considered appropriate when no specific date is set, after
      which an offer may lapse or a duty to act must be fulfilled.
    source: REP Ref. Contracts
    quoted_text: "An offer terminates without acceptance by: (a) its own expiration date passing; (b)
      lapse of a reasonable time where no date is stated; (c) rejection by the offeree; (d)
      counteroffer (§ 3.2); (e) revocation (§ 3.4); (f) death or incapacity of either party before
      acceptance; or (g) destruction of the subject property or supervening illegality before
      acceptance."
    related_terms: []
    items:
      - MO-339-0105
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: remit
