  - term: commingling
    definition: Commingling is mixing client or trust funds with the broker's own operating funds, which
      is prohibited.
    source: REP Ref. Agency
    quoted_text: Mixing client funds with brokerage operating funds is **commingling**; spending client
      funds for any unauthorized purpose is **conversion** (§ 8).
    related_terms: []
    items:
      - MO-339-0104
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: commission
    definition: The commission is the Missouri Real Estate Commission, the licensing authority that can
      issue permits, withdraw them, and waive requirements.
    source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules)
    quoted_text: The commission may issue a temporary work permit pending final review and printing of
      the license
    related_terms: []
