  - term: trust account
    definition: A trust account is a designated account where a broker holds money belonging to others
      (such as earnest money or security deposits) separate from the broker's own funds.
    source: REP Ref. Brokerage Practice
    quoted_text: the account is in a federally insured depository, titled as a trust account, with the
      broker as signatory; deposits are made within a short statutory period after receipt or
      contract acceptance;
