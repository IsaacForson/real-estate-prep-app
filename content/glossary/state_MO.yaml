  - term: compensation
    definition: Compensation is the payment (such as a commission) that a licensee receives for
      performing real estate brokerage services, which must be provable and typically requires a
      written agreement to be enforceable.
    source: REP Ref. Agency
    quoted_text: to be entitled to a commission or as a matter of license law; general agency law does
      not always require a writing.
    related_terms: []
