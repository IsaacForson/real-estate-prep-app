  - term: salesperson
    definition: A salesperson is a licensee who may perform brokerage acts only under a sponsoring
      broker and is compensated only by that broker.
    source: REP Ref. Brokerage Practice
    quoted_text: a **salesperson** (or associate broker) may perform brokerage acts only under a
      sponsoring broker and may be compensated only by that broker.
    related_terms: []
