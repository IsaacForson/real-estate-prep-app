    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: discretion
    definition: Discretion refers to the commission's authority to make decisions based on judgment,
      such as withdrawing a temporary work permit at any time.
    source: Mo. Rev. Stat. ch. 339; 20 CSR 2250 (MREC Statutes and Rules)
    quoted_text: The commission may, at its discretion, withdraw the work permit
    related_terms: []
