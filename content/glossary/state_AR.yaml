  - term: duty
    definition: A duty is an obligation a licensee owes to a client, such as the duty to present all
      offers to the seller promptly.
    source: REP Ref. Contracts
    quoted_text: A listing licensee has a duty to present all offers to the seller promptly
    related_terms: []
