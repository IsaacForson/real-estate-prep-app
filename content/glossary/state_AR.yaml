entries:
  - term: agency relationship
    definition: An agency relationship is a fiduciary relationship where a licensee acts on behalf of a
      client, which may be created expressly or impliedly through the licensee's conduct.
    source: REP Ref. Contracts
    quoted_text: a licensee's conduct can create an agency relationship the licensee never intended.
    related_terms: []
