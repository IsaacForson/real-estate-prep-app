  - term: commission
    definition: The commission is the Arkansas Real Estate Commission, which establishes procedures for
      licensees participating in real estate auctions and has sole jurisdiction over their actions
      in auctions.
    source: Ark. Code Ann. § 17-42-101 et seq.
    quoted_text: The commission may establish reasonable procedures that shall be used by licensees
      participating in real estate auctions.
