    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: cancellation
    definition: Cancellation of a contract means ending the agreement and returning both parties to
      their original positions before the contract was made.
    source: REP Ref. Contracts
    quoted_text: Cancellation of the contract and restoration of the parties to their pre-contract
      positions (each returns what it received).
    related_terms: []
    items:
      - AR-42-0038
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: citation
    definition: A citation is a formal notice issued by the executive director that imposes a monetary
      penalty (up to $100 for certain education violations or up to $250 for other violations) as an
      alternative to formal disciplinary proceedings.
    source: Ark. Code Ann. § 17-42-101 et seq.
    quoted_text: "(d)(1) In lieu of the procedure contained in subdivisions (a)(1)-(3) of this section,
      the executive director may issue a citation imposing:"
