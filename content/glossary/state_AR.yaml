  - term: expired
    definition: An expired license is a real estate license that is no longer valid because it has not
      been renewed, and may be subject to a renewal fee as specified by law.
    source: Ark. Code Ann. § 17-42-101 et seq.
    quoted_text: (6) A broker's expired license fee not to exceed one hundred ten dollars ($110) per
      year or fraction thereof;
