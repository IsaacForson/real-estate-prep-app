  - term: penalty
    definition: A penalty is a fee charged for early payoff of a loan, often calculated as a percentage
      of the balance or a set number of months' interest.
    source: REP Ref. Financing & Closing
    quoted_text: A prepayment penalty is a fee for early payoff, usually a percentage of the balance or
      a stated number of months' interest
