  - term: disclosure
    definition: Disclosure is the act of making information known, such as revealing an agency
      relationship to another party.
    source: REP Ref. Brokerage Practice
    quoted_text: Merely offering affiliated services is lawful with appropriate disclosure
    related_terms: []
