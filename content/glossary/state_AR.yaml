  - term: criminal background check
    definition: A criminal background check is a review of an applicant's criminal history conducted
      before issuing a real estate license.
    source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15)
    quoted_text: 4.6 Pre-Licensure Criminal Background Check and Waiver Request
    related_terms: []
