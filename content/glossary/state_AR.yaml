  - term: license
    definition: A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage, such as listing, selling, buying,
      exchanging, leasing, renting, managing, negotiating, advertising, and offering to do any of
      these with respect to real property.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage: listing, selling, buying, exchanging,
      leasing, renting, managing, negotiating"
