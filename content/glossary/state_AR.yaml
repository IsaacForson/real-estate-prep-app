  - term: contract
    definition: A contract is an agreement, such as a real estate purchase agreement, that is governed
      by contract law.
    source: REP Ref. Contracts
    quoted_text: "Reference note: contract law as applied to real estate purchase agreements, options,
      land contracts, and leases."
