  - term: licensing board
    definition: The Auctioneer's Licensing Board licenses licensees who participate in real estate auctions.
    source: Ark. Code Ann. § 17-42-101 et seq.
    quoted_text: licensees who participate in real estate auctions also shall be required to be licensed
