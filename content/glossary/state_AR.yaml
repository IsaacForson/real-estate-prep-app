  - term: auction
    definition: Participating in a real estate auction means performing any act for compensation or
      expectation of compensation intended to influence the bidding or outcome.
    source: Ark. Code Ann. § 17-42-101 et seq.
    quoted_text: “Participate in a real estate auction” means to do any act or conduct for compensation
      or the expectation of compensation
    related_terms: []
