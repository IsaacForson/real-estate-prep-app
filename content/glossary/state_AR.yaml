  - term: dual agency
    definition: Dual agency occurs when a real estate licensee represents both the buyer and the seller
      in the same transaction.
    source: REP Ref. Agency
    quoted_text: The forms below are the common vocabulary of representation. Not every state permits
      every form; several states have abolished subagency in practice, some prohibit dual agency,
      some define non-agency
    related_terms: []
