    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: buyer's agent
    definition: A buyer's agent is a licensee who represents the buyer in a transaction, owes fiduciary
      duties, and seeks the lowest price and best terms for the buyer.
    source: REP Ref. Agency
    quoted_text: The brokerage represents the buyer under a buyer representation agreement and owes the
      buyer fiduciary duties.
    related_terms: []
    items:
