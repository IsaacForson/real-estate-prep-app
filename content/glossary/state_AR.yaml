  - term: principal broker
    definition: A principal broker is a licensed broker who employs or supervises associate brokers.
    source: Ark. Code Ann. § 17-42-101 et seq.
    quoted_text: employed by a principal broker, or is associated with a principal broker as an
      independent contractor
