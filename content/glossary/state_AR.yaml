  - term: timely manner
    definition: Timely manner means performing an action promptly and without unnecessary delay, taking
      into account the specific circumstances of the transaction.
    source: Arkansas Real Estate Commission Rules (Rule 1 – Rule 15)
    quoted_text: Such disclosure shall be made in a timely manner under the particular circumstances so
