entries:
  - term: broker
    definition: A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage, including listing, selling, buying,
      exchanging, leasing, renting, managing, negotiating, advertising, and offering to do any of
      these with respect to real property.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage:"
    related_terms: []
    items:
      - GA-1-0021
      - GA-1-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: closing statement
    definition: A closing statement records the price of a real estate transaction.
    source: REP Ref. Valuation & Appraisal
    quoted_text: An appraiser estimates value, a closing statement records price, and a builder's
      invoice records cost.
    related_terms: []
    items:
      - GA-1-0029
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disclosure
    definition: Disclosure is the act of making known commissions, fees, rebates, or other valuable
      consideration to a principal, which must be done in advance according to pre‑established
      terms.
    source: Ga. Comp. R. & Regs. ch. 520-1
    quoted_text: The disclosures required by O.C.G.A. § 43-40-25(b)(6) from a licensee to a principal
      may be made in advance of the payment or receipt of a commission, fee, rebate or thing of
      value
    related_terms: []
    items:
      - GA-1-0029
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: documents
    definition: Documents include sales contracts, brokerage engagements, closing statements, leases,
      and other papers related to a real estate transaction.
    source: Ga. Comp. R. & Regs. ch. 520-1
    quoted_text: any broker identified in a sales contract, brokerage engagement, closing statement,
      lease, or other document related to a real estate transaction
    related_terms: []
    items:
      - GA-1-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: license number
    definition: A license number is the six‑digit identifier issued by the Georgia Real Estate
      Commission that a licensee must include on any brokerage engagement or offer to purchase,
      sell, lease, or exchange real property for each firm and each licensee participating in the
      transaction.
    source: Ga. Comp. R. & Regs. ch. 520-1
    quoted_text: License Numbers in Offers. A licensee preparing or signing a brokerage engagement or an
      offer to purchase, sell, lease, or exchange real property shall include the license number
      issued by the Commission
    related_terms: []
    items:
      - GA-1-0022
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: ministerial duties
    definition: Ministerial duties are tasks that do not require discretion or the exercise of judgment,
      which support personnel may perform.
    source: Ga. Comp. R. & Regs. ch. 520-1
    quoted_text: may perform only ministerial duties, those that do not require discretion or the
      exercise of the support personnel's own judgment
    related_terms: []
    items:
      - GA-1-0026
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: notification
    definition: The requirement for a licensee to inform the Commission in writing of the final
      disposition of any administrative, civil, or criminal action that involves the subject matter
      of the offenses cited in O.C.G.A.
    source: Ga. Comp. R. & Regs. ch. 520-1
    quoted_text: Every licensee shall notify the Commission in writing of the final disposition of any
      administrative, civil, or criminal action
    related_terms: []
    items:
      - GA-1-0021
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: rebate
    definition: A rebate is a return of part of a commission to the principal, permissible only when
      disclosed in advance based on pre‑established terms in a written agreement.
    source: Ga. Comp. R. & Regs. ch. 520-1
    quoted_text: may be made in advance of the payment or receipt of a commission, fee, rebate or thing
      of value to a licensee based upon pre-established terms
    related_terms: []
    items:
      - GA-1-0029
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: release
    definition: A release is an agreement that frees a party from an obligation, such as when a novation
      substitutes a new party and releases the original party entirely.
    source: REP Ref. Contracts
    quoted_text: "ent: it is a new contract substituted for the old one, with the consent of all
      parties, that releases the original party entirely."
    related_terms: []
    items:
      - GA-1-0025
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: retention
    definition: Brokers must retain copies of certain real estate transaction documents for three years,
      as required by law.
    source: Ga. Comp. R. & Regs. ch. 520-1
    quoted_text: required by law to be maintained in a broker's file for three years shall be made
      available to authorized agents of the Commission
    related_terms: []
    items:
      - GA-1-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: support personnel
    definition: Support personnel are unlicensed individuals engaged by a firm or licensee to assist in
      the conduct of the real estate brokerage business.
    source: Ga. Comp. R. & Regs. ch. 520-1
    quoted_text: Whenever a firm or a licensee who is affiliated with a firm engages support personnel
      to assist the firm or the affiliated licensee in the conduct of the real estate brokerage
      business
    related_terms: []
    items:
      - GA-1-0026
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: transfer
    definition: In risk management, transfer means shifting a brokerage’s risk to another party, usually
      by using insurance policies or contract provisions that place the risk elsewhere.
    source: REP Ref. Brokerage Practice
    quoted_text: transfer it through insurance and contract terms (E&O coverage, recommended
      inspections, "as is" clauses where lawful)
    related_terms: []
    items:
      - GA-1-0025
    status: quote_verified
    model: groq/openai/gpt-oss-120b
  - term: violation
    definition: A breach of license law, such as undisclosed dual agency or engaging in the unauthorized
      practice of law, which can result in discipline, loss of commission, or criminal charges.
    source: REP Ref. Agency
    quoted_text: Undisclosed dual agency — representing both sides without both parties' knowledge and
      consent — is a serious license law violation
    related_terms: []
    items:
      - GA-1-0021
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: wall certificate
    definition: A wall certificate is the official license document that a licensee must surrender to
      the Commission upon license surrender, suspension, or revocation, and that a broker must have
      received before a salesperson may commence brokerage activities.
    source: Ga. Comp. R. & Regs. ch. 520-1
    quoted_text: (b) After making an original application for licensure to the Commission, a salesperson
      or a community association manager shall not commence work in real estate brokerage activities
      until the broker has received the licensee's wall certificate of licensure.
    related_terms: []
    items:
      - GA-1-0025
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
