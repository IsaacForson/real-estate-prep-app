    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: protective list
    definition: A protective list is the written list of names and addresses of prospective buyers whom
      a licensee has shown properties to before the listing agreement expires.
    source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons)
    quoted_text: '"Protective list" means: (1) the written list of names and addresses of prospective
      buyers with whom a licensee has negotiated the sale or rental of the property or to whom a
      licensee has exhibited the property before the expiration of the listing agreement.'
    related_terms: []
    items:
      - MN-82-0037
    status: approved
