  - term: receipt
    definition: A receipt is a document issued to the buyer confirming the value of a nondepositable
      item received as earnest money.
    source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons)
    quoted_text: A receipt shall be issued to the buyer for the value of the nondepositable item.
