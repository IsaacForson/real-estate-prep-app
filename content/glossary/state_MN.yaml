  - term: subject hours
    definition: Subject hours are the specific hourly requirements for each topic that make up the
      broker course.
    source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons)
    quoted_text: The required course for real estate brokers must consist of the subject hours in
      paragraphs (a) to (j).
