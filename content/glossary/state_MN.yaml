  - term: unlicensed
    definition: An unlicensed person is someone who performs real estate activities for compensation
      without holding the required license, which is unlawful in every state.
    source: REP Ref. Brokerage Practice
    quoted_text: Acting for others for compensation without a license is unlawful in every state, and an
      unlicensed person generally cannot sue to collect a commission.
    related_terms: []
    items:
      - MN-82-0048
    status: approved
