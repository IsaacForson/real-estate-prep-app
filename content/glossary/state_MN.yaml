      - MN-82-0055
      - MN-82-0060
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: earnest money
    definition: Earnest money is money received from a buyer that the broker must keep separate from its
      own funds and account for.
    source: REP Ref. Agency
    quoted_text: The agent must keep the principal's money and property separate from the agent's own,
      keep accurate records, and turn over or account for all funds and documents received in the
      course of the agency — earnest money, rents, security deposits, keys, documents.
    related_terms: []
    items:
      - MN-82-0042
      - MN-82-0043
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: escrow agent
    definition: An escrow agent is a neutral third party authorized to hold nondepositable earnest money
      and issue a receipt for its value.
    source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons)
    quoted_text: shall be deposited immediately with an authorized escrow agent, whose authority is
      evidenced by a written agreement executed by the offeror and the escrow agent.
    related_terms: []
    items:
      - MN-82-0043
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: inspection
    definition: An inspection is a due‑diligence contingency that gives the buyer a period to have the
      property examined, and depending on the contract form, may allow termination for any reason,
      termination only for defects above a threshold, or a request for repairs.
    source: REP Ref. Contracts
    quoted_text: Gives the buyer a period to have the property inspected and, depending on the form,
      either to terminate for any reason, to terminate only for defects above a stated threshold, or
      to request repairs which the seller may accept or refuse.
    related_terms: []
    items:
      - MN-82-0055
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: intent
    definition: Intent, in the context of an offer, is the present intent to be bound — i.e., the
      party’s intention to be legally obligated by the offer.
    source: REP Ref. Contracts
    quoted_text: An offer must be definite enough that a court could enforce it, must show a present
      intent to be bound, and must be communicated to the offeree.
    related_terms: []
    items:
      - MN-82-0060
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: interest
    definition: Interest is the earnings on a pooled trust account that, after deducting reasonable
      transaction costs, must be paid to the Minnesota Housing Finance Agency unless the parties
      agree otherwise.
    source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons)
    quoted_text: The interest accruing on the trust account, less reasonable transaction costs, must be
      paid to the Minnesota Housing Finance Agency for deposit in the housing trust fund account
    related_terms: []
