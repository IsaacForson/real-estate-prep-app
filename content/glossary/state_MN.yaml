  - term: license
    definition: A real estate license authorizes its holder to perform brokerage activities for
      compensation on behalf of others, such as listing, selling, buying, leasing, managing,
      negotiating, and advertising property.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage: listing, selling, buying, exchanging,
      leasing, renting, managing"
    related_terms: []
    items:
      - MN-82-0048
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: listing agreement
    definition: A listing agreement is the employment contract between a seller (or landlord) and a
      brokerage that creates seller agency.
    source: REP Ref. Brokerage Practice
    quoted_text: A listing agreement is the employment contract between a seller (or landlord) and a
      brokerage, creating seller agency (REP Ref. Agency § 2.2).
    related_terms: []
    items:
      - MN-82-0037
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: listing broker
    definition: A listing broker is a special agent engaged to find a ready, willing, and able buyer for
      the seller but lacking authority to sign a purchase agreement unless separately authorized.
    source: REP Ref. Agency
    quoted_text: "A listing broker is a special agent: the broker is engaged to find a ready, willing,
      and able buyer, but cannot sign a purchase agreement for the seller or accept an offer on the
      seller's behalf unless separately authorized."
    related_terms: []
    items:
      - MN-82-0042
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: Minnesota Housing Finance Agency
    definition: The Minnesota Housing Finance Agency is the state entity that receives the interest from
      pooled trust accounts (after costs) for deposit in the housing trust fund, unless parties
      agree otherwise.
    source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons)
    quoted_text: must be paid to the Minnesota Housing Finance Agency for deposit in the housing trust
      fund account created under section 462A.201
