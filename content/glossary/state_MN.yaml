  - term: primary broker
    definition: For a corporation licensed as a broker, the primary broker means each officer of the
      corporation who is individually licensed to act as broker for the corporation.
    source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons)
    quoted_text: In the case of a corporation licensed as a broker, "primary broker" means each officer
      of the corporation who is individually licensed to act as broker for the corporation.
    related_terms: []
