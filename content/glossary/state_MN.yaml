  - term: trust account
    definition: A trust account is a designated account separate from a broker’s operating funds where
      client money such as earnest money and security deposits is held.
    source: "[REP Ref. Brokerage Practice — § 10.1 Trust (escrow) accounts]"
    quoted_text: money belonging to others — earnest money, tenant security deposits, rents collected
      for owners, advance fees — is trust money and must be held in a designated trust or escrow
      account separate from the firm's operating funds.
