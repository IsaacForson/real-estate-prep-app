    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: written agreement
    definition: A written agreement is a document signed by the parties that sets out their mutual
      understanding or terms, such as an agreement stating how trust account interest should be
      handled.
    source: REP Ref. Contracts
    quoted_text: When buyer and seller disagree about who is entitled to the deposit after a failed
      transaction, a broker generally may not simply decide; typical state procedures involve
      holding the funds pending a written agreement of the parties
