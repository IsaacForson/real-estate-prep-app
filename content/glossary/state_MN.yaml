entries:
  - term: authorization
    definition: Authorization is the permission or authority given by a principal to an agent to act on
      their behalf.
    source: REP Ref. Agency
    quoted_text: "A subagent is an agent of an agent: a licensee who, with the principal's
      authorization, assists the listing broker in serving the seller and thereby owes the seller
      fiduciary duties even though the subagent may be the only licensee the buyer is working with."
    related_terms: []
    items:
      - MN-82-0048
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker
    definition: A broker is the agent who acts on behalf of a client in a real estate transaction, owing
      fiduciary duties to that client.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
    items:
      - MN-82-0048
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker course
    definition: The broker course is the prelicense education required for a real estate broker under
      Minn. Stat. § 82.60.
    source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons)
    quoted_text: Prelicense education for a real estate broker must consist of the broker course as
      described in this section.
    related_terms: []
    items:
      - MN-82-0030
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disclosure
    definition: Disclosure is the act of revealing information about a property or transaction to the
      other party, unless exempted by a qualified third‑party report.
    source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons)
    quoted_text: A licensee is not required to disclose, except as otherwise provided in paragraph (f),
      information relating to the physical condition of the property or any other information
      relating to the real estate transaction, if a written report that discloses the information
      has been prepared by a qualified third party
    related_terms: []
    items:
