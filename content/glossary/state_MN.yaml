  - term: nonperformance
    definition: Nonperformance occurs when a party to a real estate transaction fails to fulfill their
      obligations under a purchase agreement or similar written contract, which the licensee must
      disclose upon notice.
    source: Minn. Stat. ch. 82 (Real Estate Brokers and Salespersons)
    quoted_text: If a licensee is put on notice by a party to a real estate transaction that the party
      will not perform according to the terms of a purchase agreement or other similar written
      agreement
    related_terms: []
