    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: improper influence
    definition: Improper influence occurs when a licensee attempts to affect an appraiser's development,
      reporting, result, or review of a real estate appraisal in an improper manner.
    source: Cal. Code Regs. tit. 10, §§ 2705–3109
    quoted_text: real estate licensees engaged in a real estate transaction involving an appraisal shall
      not improperly influence or attempt to improperly influence the development, reporting,
      result, or review of a real estate appraisal
    related_terms: []
