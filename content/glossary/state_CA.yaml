  - term: material fact
    definition: A material fact is information that a reasonable person would consider important when
      deciding to buy, sell, or lease a property.
    source: REP Ref. Agency
    quoted_text: A material fact is one that a reasonable person would consider important in deciding
      whether, or on what terms, to buy, sell, or lease.
