  - term: limitation
    definition: A limitation period is the time allowed to file a lawsuit, which varies by state and
      often starts when the defect is discovered.
    source: REP Ref. Property Condition & Environmental
    quoted_text: Limitation periods vary by state and often run from discovery of the defect.
