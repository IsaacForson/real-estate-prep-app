  - term: special agent
    definition: A special agent is authorized to perform one specific act or transaction and usually
      lacks the power to bind the principal to a contract.
    source: Cal. Civ. Code §§ 2295–2300
    quoted_text: 2297.   An agent for a particular act or transaction is called a special agent. All
      others are general agents.
