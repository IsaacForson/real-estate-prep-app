  - term: disclosure
    definition: Disclosure is the act of revealing information, and the exact duties and consent
      requirements for disclosure vary by state.
    source: REP Ref. Agency
    quoted_text: The exact duties of the broker and the disclosure and consent required vary by state.
    related_terms: []
    items:
      - CA-4-0032
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: duty
    definition: A duty is a legal obligation, and breach of fiduciary duty can occur when undisclosed
      dual agency occurs, leading to loss of commission, rescission, or discipline.
    source: REP Ref. Agency
    quoted_text: Undisclosed dual agency — representing both sides without both parties' knowledge and
      consent — is a serious license law violation and a breach of fiduciary duty that can result in
      loss of commission, rescission of the transaction, and discipline.
    related_terms: []
    items:
      - CA-4-0033
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: fiduciary duty
    definition: A fiduciary duty requires brokers to uphold agency relationships and not limit their
      duty to borrowers, lenders, and purchasers of notes or interests in transactions.
    source: Cal. Bus. & Prof. Code §§ 10160–10249.93
    quoted_text: Nothing in this article shall be construed to change the agency relationships between
      the parties where they exist or limit in any manner the fiduciary duty of brokers to
      borrowers, lenders, and purchasers of notes or interests in transactions subject to this
      article.
    related_terms: []
    items:
      - CA-4-0042
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: foreclosure prevention
    definition: A foreclosure prevention alternative is a first lien loan modification or another
      available loss mitigation option.
    source: Cal. Civ. Code §§ 2920–2944.10
    quoted_text: '"Foreclosure prevention alternative" means a first lien loan modification or another
      available loss mitigation option.'
    related_terms: []
    items:
      - CA-4-0043
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: general agent
    definition: A general agent may act for the principal in a range of matters within a continuing
      business or activity and may bind the principal to contracts within that scope; for example, a
      property manager or a salesperson.
    source: REP Ref. Agency
    quoted_text: "- A **general agent** may act for the principal in a range of matters within a
      continuing business or activity and may bind the principal to contracts within that scope."
    related_terms: []
    items:
