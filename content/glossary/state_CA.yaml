entries:
  - term: agency
    definition: Agency is a relationship in which one person (the agent) is authorized to act on behalf
      of another (the principal) in dealings with third parties, subject to the principal's control.
    source: REP Ref. Agency
    quoted_text: "**Agency** is a relationship in which one person (the **agent**) is authorized to act
      on behalf of another (the **principal**) in dealings with third parties, and agrees to do so
      subject to the principal's control."
