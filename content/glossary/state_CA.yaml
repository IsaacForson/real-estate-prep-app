    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: appraisal report
    definition: An appraisal report is a written appraisal that communicates the value opinion and
      details of a property, and may be either a full report or a restricted report for the sole
      intended user.
    source: REP Ref. Valuation & Appraisal
    quoted_text: A written appraisal is communicated as either an appraisal report or a restricted
      appraisal report; the latter is allowed only when the client is the sole intended user.
    related_terms: []
    items:
      - CA-4-0030
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: appraiser
    definition: An appraiser is a professional whose opinions a real estate licensee is not qualified to
      render.
    source: REP Ref. Property Condition & Environmental
    quoted_text: A real estate licensee is neither an environmental engineer, home inspector, appraiser,
      surveyor, nor attorney, and the license does not qualify the holder to render opinions in
      those fields.
    related_terms: []
    items:
