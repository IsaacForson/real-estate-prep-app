  - term: inspection
    definition: An inspection contingency gives the buyer a period to have the property inspected and to
      terminate or request repairs based on the findings.
    source: REP Ref. Contracts
    quoted_text: Gives the buyer a period to have the property inspected and, depending on the form,
      either to terminate for any reason, to terminate only for defects above a stated threshold, or
      to request repairs which the seller may accept or refuse.
    related_terms: []
    items:
      - CA-4-0032
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: liability
    definition: Liability refers to being legally responsible for acts, such as a seller being liable
      for the acts of licensees they never met.
    source: REP Ref. Agency
    quoted_text: exposed sellers to liability for the acts of licensees they had never met.
