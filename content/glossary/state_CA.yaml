      - CA-4-0033
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: capacity
    definition: Capacity is the legal ability to enter into a contract, which is generally lacking for
      minors, persons adjudicated mentally incompetent, and persons so intoxicated they cannot
      understand the transaction.
    source: REP Ref. Contracts
    quoted_text: Each party must have the legal capacity to contract. Capacity is generally lacking for
      minors (persons under the age of majority set by state law), persons adjudicated mentally
      incompetent, and persons so intoxicated that they cannot understand the transaction.
    related_terms: []
    items:
      - CA-4-0047
      - CA-4-0048
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: contract
    definition: A valid contract requires competent parties, mutual assent shown by an offer and
      acceptance, consideration, a lawful object, and for most real estate contracts, a writing
      signed by the party to be charged.
    source: REP Ref. Contracts
    quoted_text: "A valid contract requires: (1) competent parties; (2) mutual assent, shown by an offer
      and an acceptance; (3) consideration; (4) a lawful object; and, for most real estate
      contracts, (5) a writing signed by the party to be charged."
    related_terms: []
    items:
      - CA-4-0047
      - CA-4-0048
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: correct errors
    definition: To correct errors means to fix mistakes in an appraisal report.
    source: Cal. Code Regs. tit. 10, §§ 2705–3109
    quoted_text: (3) Correct errors in the appraisal report.
    related_terms: []
    items:
