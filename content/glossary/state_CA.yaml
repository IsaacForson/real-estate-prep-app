  - term: licensing
    definition: Licensing is the portion of the Real Estate Law that governs the licensing of persons.
    source: Cal. Bus. & Prof. Code §§ 10000–10036
    quoted_text: PART 1. LICENSING OF PERSONS [10000 - 10580]
    related_terms: []
