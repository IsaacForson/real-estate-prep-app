  - term: borrower
    definition: A borrower is the person who signs a promissory note, promising to repay a loan with
      interest according to the agreed terms.
    source: REP Ref. Financing & Closing
    quoted_text: The promissory note is the borrower's written, unconditional promise to repay a
      definite sum with interest on stated terms.
