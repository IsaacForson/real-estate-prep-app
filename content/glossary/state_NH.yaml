  - term: broker
    definition: The agent who acts for the client in real estate brokerage, such as a seller, buyer,
      landlord, or tenant who has engaged the brokerage.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
    items:
      - NH-331-0046
      - NH-331-0041
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker examination
    definition: The qualifying exam that must be passed to obtain a broker license, as indicated by the
      fee structure for examinations.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: (f) The applicant for each qualifying examination shall pay a fee of $155 for a
      salesperson examination and $170 for a broker examination.
    related_terms: []
    items:
      - NH-331-0038
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: commission
    definition: A commission is the fee paid to a real estate broker or salesperson for services
      rendered in a transaction.
    source: REP Ref. Brokerage Practice
    quoted_text: Acting for others for compensation without a license is unlawful in every state, and an
      unlicensed person generally cannot sue to collect a commission.
    related_terms: []
    items:
      - NH-331-0024
      - NH-331-0046
      - NH-331-0041
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: comparative market analysis
    definition: A comparative market analysis is a broker price opinion that may be offered only where
      state law allows and must be labeled as such, never as an appraisal.
    source: REP Ref. Brokerage Practice
    quoted_text: may offer a broker price opinion or comparative market analysis only where state law
      allows and only labeled as such, never as an appraisal.
    related_terms: []
    items:
      - NH-331-0022
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: concealment
    definition: Concealment is actively hiding a fact, which, where a duty to disclose exists, is
      treated as misrepresentation.
    source: REP Ref. Agency
    quoted_text: "**Concealment** (actively hiding a fact) and, where a duty to disclose exists,
      **nondisclosure** are treated as misrepresentation."
    related_terms: []
    items:
      - NH-331-0021
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: conclusions
    definition: Conclusions of law are the commission's legal determinations drawn from the findings of fact.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: An order shall include findings of fact and conclusions of law, and shall be based upon
      the preponderance of evidence presented at the disciplinary hearing or contained in the
      record.
    related_terms: []
    items:
