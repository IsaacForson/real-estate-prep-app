  - term: contact phone number
    definition: The contact phone number(s) is the telephone number(s) that a licensee must keep the
      commission informed of at all times.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: contact phone number(s), work location address
    related_terms: []
