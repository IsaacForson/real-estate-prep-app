  - term: notification
    definition: Notification is the written notice that a principal broker must provide to the
      commission when a licensee changes affiliation, to be sent no later than five days after the
      change.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: the principal broker shall notify the commission, in writing, no later than 5 days
      after the change along with the appropriate form described in (b) above.
    related_terms: []
    items:
      - NH-331-0060
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: offer
    definition: An offer is a buyer's proposal to purchase property that a broker may transmit but
      cannot accept unless specifically authorized to do so.
    source: REP Ref. Agency
    quoted_text: Candidates often assume a listing broker can 'accept' an offer for the seller. Under
      ordinary special agency the broker only transmits offers; acceptance is the principal's act.
    related_terms: []
    items:
      - NH-331-0054
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: order
    definition: An order is the commission's written decision after a hearing, which must include
      findings of fact and conclusions of law.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: An order shall include findings of fact and conclusions of law, and shall be based upon
      the preponderance of evidence presented at the disciplinary hearing or contained in the
      record.
    related_terms: []
    items:
      - NH-331-0029
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: principal broker
    definition: A principal broker is a licensed real estate broker who employs or sponsors salespersons
      and associate brokers to perform brokerage activities.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: e. A signed statement from the employing broker, listing the principal broker’s license
      number, certifying that the applicant was employed by him or her as a real estate salesperson,
      listing the dates and the number of hours per week of that employ and whether the applicant
      was employed full time or part time.
    related_terms: []
    items:
      - NH-331-0026
      - NH-331-0060
    status: approved
