  - term: prior disciplinary record
    definition: A past record of discipline against a licensee, including the number, type, and timing
      of prior misconduct, which is considered an aggravating circumstance.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: (1) Any prior disciplinary record of the licensee, accredited individual, institution,
      or organization, or person charged with practicing unlawful brokerage activity, including
      number, type, and timing of prior instances of misconduct;
    related_terms: []
    items:
      - NH-331-0030
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: resident address
    definition: The resident address is the licensee’s current place of residence that must be kept
      current with the New Hampshire Real Estate Commission at all times.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: Each licensee and firm shall at all times keep the commission informed of the
      licensee’s or firm’s current resident address
    related_terms: []
    items:
      - NH-331-0067
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: revocation
    definition: The cancellation or withdrawal of a license, such as when a license is obtained through
      the mistake or inadvertence of the executive director.
    source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act)
    quoted_text: Any license obtained through the mistake or inadvertence of the executive director
      shall be subject to revocation.
    related_terms: []
    items:
      - NH-331-0044
      - NH-331-0052
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: salesperson
    definition: A licensee who may perform brokerage acts only under a sponsoring broker and is
      compensated solely by that broker.
    source: REP Ref. Brokerage Practice
    quoted_text: A salesperson (or associate broker) may perform brokerage acts only under a sponsoring
      broker and may be compensated only by that broker.
    related_terms: []
    items:
      - NH-331-0046
      - NH-331-0041
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: temporary license
    definition: A temporary license is issued to continue a brokerage business after the death or
      incapacity of a principal broker, and may not exceed one year from the date of death or
      incapacitation.
    source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act)
    quoted_text: issue without examination a temporary license to such legal representative or to an
      individual designated by the legal representative and approved by the commission, and by the
      payment of the prescribed fee, which shall authorize such temporary licensee to continue to
      transact real estate business for a period not to exceed one year from the date of death or
      incapacitation.
    related_terms: []
    items:
      - NH-331-0026
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: transaction
    definition: A transaction is the real estate deal in which parties participate, and a person in the
      transaction who is not represented by the brokerage is considered a customer (or third party).
    source: REP Ref. Agency
    quoted_text: A person in the transaction who is *not* represented by the brokerage is a **customer**
      (or third party).
    related_terms: []
    items:
      - NH-331-0054
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: vacancy
    definition: A managing broker vacancy occurs when the managing broker of a branch office dies,
      becomes disabled, or changes affiliation, allowing the principal broker to appoint a temporary
      manager.
    source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act)
    quoted_text: In the event of the death, disability or change of affiliation of the managing broker
      of a real estate branch office, the principal broker may designate as a manager a person
      currently licensed with the New Hampshire real estate commission for a period not to exceed
      one year from the date of such vacancy.
    related_terms: []
    items:
      - NH-331-0064
    status: approved
    reviewer: auto-publish
