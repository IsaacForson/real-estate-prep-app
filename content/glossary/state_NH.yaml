  - term: fraud
    definition: Fraud is an intentional misrepresentation—a knowingly false statement of fact made to
      induce reliance—that can lead to punitive damages and license discipline.
    source: REP Ref. Agency
    quoted_text: fraud can support punitive damages and license discipline.
    related_terms: []
    items:
      - NH-331-0021
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: inactive status
    definition: Inactive status is a status where a licensee surrenders their license to preserve it
      while not engaging in any brokerage activities, though they may still be compensated for prior
      activities.
    source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act)
    quoted_text: perform as a broker or salesperson as defined in RSA 331-A:2, and who wants to preserve
      his or her license while not engaged in any brokerage activities
    related_terms: []
    items:
      - NH-331-0040
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: interest
    definition: An interest in property is the buyer's equitable title—a right to enforce the property
      in equity even though legal title remains with the seller until the deed is delivered.
    source: REP Ref. Contracts
    quoted_text: "the buyer holds equitable title: an interest in the property that the buyer can
      enforce in equity even though legal title remains with the seller until the deed is delivered
      at closing."
    related_terms: []
    items:
      - NH-331-0022
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: license
    definition: A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage, such as listing, selling, buying,
      exchanging, leasing, renting, managing, negotiating, advertising, and offering to do any of
      these with respect to real property.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage:"
    related_terms: []
    items:
      - NH-331-0021
      - NH-331-0044
      - NH-331-0052
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: licensee
    definition: A licensee is the individual who shows property to a buyer and may act as that buyer's
      agent in a real estate transaction.
    source: REP Ref. Agency
    quoted_text: the licensee showing them property was 'their' agent when, under traditional subagency,
      that licensee actually represented the seller.
    related_terms: []
    items:
      - NH-331-0041
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: mailing address
    definition: The mailing address is the address where mail is sent that a licensee must keep the
      commission informed of at all times.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: mailing address, email address, contact phone number(s), work location address
    related_terms: []
    items:
      - NH-331-0067
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: managing broker
    definition: A managing broker is a broker who manages a branch office.
    source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act)
    quoted_text: VI. 'Managing broker' means a broker who manages a branch office.
    related_terms: []
    items:
      - NH-331-0064
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: minimum score
    definition: The minimum score is the lowest score a candidate must achieve on the broker or
      salesperson licensing examination, which is set at 70 points.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: (h) Candidates for the broker or salesperson exam shall attain a minimum score of 70.
    related_terms: []
    items:
      - NH-331-0048
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: misdemeanor
    definition: A misdemeanor is a violation of the law for which a person is considered guilty for each
      day the violation continues, as stated in New Hampshire statute.
    source: N.H. Rev. Stat. Ann. ch. 130-A
    quoted_text: Any person who violates any provision of this chapter shall be guilty of a misdemeanor
      for each day that a violation exists.
    related_terms: []
    items:
      - NH-331-0039
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: misrepresentation
    definition: A misrepresentation is a false statement of fact on which another party relies; it may
      be intentional (fraud), negligent, or innocent.
    source: REP Ref. Agency
    quoted_text: A misrepresentation is a false statement of fact on which another party relies.
    related_terms: []
    items:
      - NH-331-0021
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: mistake
    definition: An error or inadvertence by the executive director that results in a license being
      issued, making the license subject to revocation.
    source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act)
    quoted_text: Any license obtained through the mistake or inadvertence of the executive director
      shall be subject to revocation.
    related_terms: []
    items:
      - NH-331-0044
      - NH-331-0052
    status: approved
    reviewer: auto-publish
