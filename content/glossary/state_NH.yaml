  - term: amendment
    definition: An amendment is a change agreed to by both parties after the contract has been formed,
      such as extending the closing date or reducing the price, requiring mutual assent and a
      written signed agreement.
    source: REP Ref. Contracts
    quoted_text: An amendment is a change agreed to by both parties *after* the contract has been formed
      — extending the closing date, reducing the price after inspection, changing the earnest money
      holder.
    related_terms: []
    items:
