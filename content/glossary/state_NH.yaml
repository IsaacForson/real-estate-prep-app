  - term: confidentiality
    definition: Confidentiality is the duty to keep certain client information private and not disclose
      it without authorization.
    source: REP Ref. Agency
    quoted_text: and confidentiality of certain information.
    related_terms: []
    items:
      - NH-331-0077
    status: approved
