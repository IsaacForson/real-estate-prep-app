  - term: deadline
    definition: A deadline is the time by which a required action (e.g., submitting an offer or
      reporting a change) must be completed; failing to meet it may result in liability.
    source: REP Ref. Agency
    quoted_text: An agent who fails to submit an offer before the deadline, misstates the acreage from
      memory, or advises a client on a tax consequence the agent is not qualified to assess may be
      liable for negligence.
    related_terms: []
    items:
      - NH-331-0058
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: death
    definition: Death refers to the cessation of life of a principal broker, which terminates the
      brokerage relationship and may trigger provisions such as temporary licensing.
    source: REP Ref. Agency
    quoted_text: "- **Death or incapacity** of either the principal or the agent (broker). Because the
      relationship is personal, the death of a sole-proprietor broker terminates the firm's
      listings;"
    related_terms: []
    items:
      - NH-331-0026
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: document
    definition: A document is a written record, such as a signed memorandum, that contains essential
      information like the parties, property, price, and the terms of a transaction.
    source: REP Ref. Contracts
    quoted_text: The writing need not be a single formal document; a signed memorandum that identifies
      the parties, the property, the price, and the essential terms usually suffices.
    related_terms: []
    items:
      - NH-331-0073
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: email address
    definition: The email address is the electronic mail address that a licensee must keep the
      commission informed of at all times.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: (4) Email address;
    related_terms: []
