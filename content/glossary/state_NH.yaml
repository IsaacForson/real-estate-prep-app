entries:
  - term: affiliation
    definition: Affiliation is the relationship between a licensee and a principal broker; changing
      affiliation means moving from one principal broker to another, which triggers a notification
      requirement.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: (c) Whenever a licensee changes his or her affiliation from one principal broker to
      another, or ceases to represent a principal broker, the principal broker shall notify the
      commission, in writing, no later than 5 days after the change along with the appropriate form
      described in (b) above.
    related_terms: []
