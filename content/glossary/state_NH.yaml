  - term: fiduciary duty
    definition: Fiduciary duty is the legal obligation to act in the best interest of a client, and
      breaching it can lead to loss of commission, transaction rescission, or disciplinary action.
    source: REP Ref. Agency
    quoted_text: breach of fiduciary duty that can result in loss of commission, rescission of the
      transaction, and discipline.
    related_terms: []
    items:
      - NH-331-0077
    status: approved
