  - term: continuing education
    definition: Continuing education refers to courses that real estate applicants and licensees submit
      to the commission for evaluation to receive credit toward license renewal.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: Real estate applicants and licensees shall pay a fee of $10 for each course submitted
      to the commission to be evaluated for pre-licensing education credit or continuing education
      credit.
    related_terms: []
    items:
      - NH-331-0040
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: criminal record report
    definition: A criminal record report is a document from another jurisdiction that shows any
      misdemeanor or felony convictions of the applicant, which must be submitted to the commission
      before licensure eligibility can be determined.
    source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act)
    quoted_text: applicant shall submit to the commission a criminal record report from any other
      jurisdiction in which the applicant has been convicted of a misdemeanor or felony offense.
    related_terms: []
    items:
      - NH-331-0039
    status: approved
