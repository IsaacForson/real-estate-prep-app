    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: appointment
    definition: Appointment to the New Hampshire real estate commission means being selected to serve as
      a member of that commission.
    source: N.H. Rev. Stat. Ann. ch. 331-A (New Hampshire Real Estate Practice Act)
    quoted_text: Each member of the commission shall be a resident of this state for at least 6 years
      prior to appointment.
    related_terms: []
    items:
      - NH-331-0024
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: approved study
    definition: The required pre‑licensing education hours an applicant must complete to be eligible to
      take the broker examination, specifically 60 hours under New Hampshire rules.
    source: N.H. Code Admin. R. Rea 100–799 (Real Estate Commission rules)
    quoted_text: (k) Candidates for the broker examination shall show proof of completion of 60 hours of
      approved study, pursuant to RSA 331-A:10, II,
    related_terms: []
