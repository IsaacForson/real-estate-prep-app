entries:
  - term: agency agreement
    definition: An agency agreement is a written agreement between a broker and a client that creates a
      fiduciary relationship.
    source: S.D. Codified Laws § 36-21A (Real Estate Licensing)
    quoted_text: '"Agency agreement," a written agreement between a broker and a client that creates a
      fiduciary relationship between the broker and client'
    related_terms: []
