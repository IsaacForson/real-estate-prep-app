  - term: substantive contact
    definition: Substantive contact is any interaction beyond initial greetings that includes discussing
      a buyer's specific financial qualifications or the parties' motives, which could reveal
      confidential information.
    source: S.D. Codified Laws § 36-21A (Real Estate Licensing)
    quoted_text: "Substantive contact defined. For the purposes of this chapter, substantive contact is
      any performance beyond initial acts described in § 36-21A-128 and includes discussion of: (1)
      Any specific financial qualifications of the buyer; or (2) The selling or buying motives or
      objectives of the seller or buyer"
