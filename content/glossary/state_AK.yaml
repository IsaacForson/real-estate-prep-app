  - term: broker
    definition: In real estate brokerage, the broker is the agent who acts for the client (the buyer,
      seller, landlord, or tenant) under the brokerage.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
    items:
      - AK-88-0007
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker license
    definition: A broker license authorizes a person to act as a real estate broker, requiring passage
      of the broker exam, completion of education, and sufficient experience.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: A natural person qualifies for a real estate broker license if the person passes the
      brokers examination, applies for a license within six months after passing the examination
    related_terms: []
    items:
      - AK-88-0009
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: commingle
    definition: Commingling is mixing money belonging to others with the licensee’s or brokerage’s own
      funds, such as depositing a client’s deposit into the firm’s operating account.
    source: REP Ref. Agency
    quoted_text: Commingling is mixing money belonging to others (earnest money, rents, security
      deposits, tenant funds) with the licensee's or brokerage's own funds
    related_terms: []
    items:
      - AK-88-0010
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: commission
    definition: A commission is the compensation earned when a real estate broker fulfills the terms of
      a written personal services contract.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: A commission is earned when the real estate broker fulfills the terms of a written
      personal services contract.
    related_terms: []
    items:
      - AK-88-0020
      - AK-88-0024
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: contact hour
    definition: A contact hour is a unit of measurement for real estate education, defined as a minimum
      of 50 minutes of instruction.
    source: 12 Alaska Admin. Code § 64.010 et seq.
    quoted_text: (1) one contact hour equals a minimum of 50 minutes of instruction;
    related_terms: []
    items:
      - AK-88-0007
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: eligibility
    definition: Eligibility means meeting the statutory requirements to qualify for a real estate broker
      license.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: has had at least 36 months of active and continuous experience as a real estate
      licensee within the 60 months immediately preceding application for the broker license
    related_terms: []
    items:
      - AK-88-0009
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: exemption
    definition: An exemption from the real estate licensing requirement includes a lawyer performing
      duties as a lawyer, among other categories listed in Alaska Statute § 08.88.900(a).
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: (3) a lawyer performing duties as a lawyer; (4) a public official in the conduct of
      official duties;
    related_terms: []
    items:
      - AK-88-0008
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: experience
    definition: Experience refers to active and continuous work as a licensed real estate licensee.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: has had at least 36 months of active and continuous experience as a real estate
      licensee within the 60 months immediately preceding application for the broker license
    related_terms: []
    items:
      - AK-88-0009
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: fee agreement
    definition: A fee agreement is an agreement between a broker and a client (seller, buyer, lessor, or
      lessee) whereby the broker agrees to perform a real estate duty for an agreed fee or
      commission.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: a fee agreement between brokers and sellers, buyers, lessors, or lessees
    related_terms: []
    items:
      - AK-88-0022
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: hearing
    definition: A hearing is a proceeding in which a person is given reasonable notice and an
      opportunity to be heard before the department may issue an order affecting them.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: after reasonable notice of and an opportunity for a hearing is given to the person,
      issue an order directing the person to stop the act or practice
    related_terms: []
    items:
      - AK-88-0003
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: lawyer
    definition: A lawyer performing duties as a lawyer is exempt from the real estate licensing
      requirement under Alaska Statute § 08.88.900(a)(3).
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: (3) a lawyer performing duties as a lawyer;
    related_terms: []
    items:
      - AK-88-0008
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: legal advice
    definition: Legal advice is guidance provided by a licensee concerning the legal meaning or effect
      of documents, how to take title, or how laws apply to a client's situation, which is
      prohibited unless performed by an attorney.
    source: REP Ref. Brokerage Practice
    quoted_text: give legal advice about the meaning or effect of a document, advise how to take title,
      or interpret how a law applies to a client's situation.
    related_terms: []
    items:
      - AK-88-0008
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: licensee relationship
    definition: A licensee relationship is the role or capacity in which a real estate licensee provides
      services to a party in a transaction.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: A real estate licensee may provide real estate services to a party in separate real
      estate transactions under different licensee relationships
    related_terms: []
    items:
      - AK-88-0021
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: listing
    definition: A listing is the broker's engagement to find a ready, willing, and able buyer for a
      seller's property.
    source: REP Ref. Agency
    quoted_text: "A listing broker is a special agent: the broker is engaged to find a ready, willing,
      and able buyer"
    related_terms: []
    items:
      - AK-88-0022
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: listing agreement
    definition: A listing agreement is the employment contract between a seller (or landlord) and a
      brokerage that creates seller agency.
    source: REP Ref. Brokerage Practice
    quoted_text: A listing agreement is the employment contract between a seller (or landlord) and a
      brokerage, creating seller agency (REP Ref. Agency § 2.2).
    related_terms: []
    items:
      - AK-88-0019
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: management contract
    definition: A management contract is an agreement between a broker and a property owner whereby the
      broker agrees to perform property management duties for an agreed fee or commission.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: a management contract with property owners, or any other agreement by which a broker
      agrees to perform a duty with respect to real estate for an agreed upon fee or commission
    related_terms: []
    items:
      - AK-88-0023
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: period
    definition: The length of time for which a property management contract is effective.
    source: REP Ref. Brokerage Practice
    quoted_text: the listing period;
    related_terms: []
    items:
      - AK-88-0025
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: personal services contract
    definition: A personal services contract is an agreement where a licensee agrees to find, locate,
      secure, or promote obtaining a buyer or tenant for a specific property at a certain price and
      terms.
    source: 12 Alaska Admin. Code § 64.010 et seq.
    quoted_text: '"listing" means a personal services contract or agreement, in which the listing
      licensee agrees to find, locate, secure, or promote obtaining a buyer or tenant for a specific
      property at a certain price and terms;'
    related_terms: []
    items:
      - AK-88-0019
      - AK-88-0020
      - AK-88-0022
      - AK-88-0024
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: property management contract
    definition: An agreement between a property owner and a property manager that outlines the manager's
      specific responsibilities, the authority and powers granted, the duration of the agreement,
      and the management fee.
    source: 12 Alaska Admin. Code § 64.010 et seq.
    quoted_text: specific responsibilities of the property manager;
    related_terms: []
    items:
      - AK-88-0025
      - AK-88-0026
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: recovery fund fee
    definition: The recovery fund fee is a payment that a real estate licensee must make to the
      commission when applying for or renewing a license, in addition to the license fee, as an
      alternative to posting a corporate surety bond, and it may not exceed $125.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: A real estate licensee, when applying for or renewing a real estate license, in lieu of
      obtaining a corporate surety bond, shall pay to the commission, in addition to the license
      fee, a recovery fund fee not to exceed $125.
    related_terms: []
    items:
      - AK-88-0002
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: responsibilities
    definition: The specific duties assigned to the property manager in a property management contract.
    source: 12 Alaska Admin. Code § 64.010 et seq.
    quoted_text: specific responsibilities of the property manager;
    related_terms: []
    items:
      - AK-88-0025
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: security deposit
    definition: Tenant money held to secure performance of the lease, covering unpaid rent, damage
      beyond normal wear and tear, and cleaning costs.
    source: REP Ref. Brokerage Practice
    quoted_text: A security deposit is tenant money held to secure performance of the lease — unpaid
      rent, damage beyond normal wear and tear, and cleaning.
    related_terms: []
    items:
      - AK-88-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: specific assistance
    definition: Specific assistance is the act of helping a party locate or acquire real estate.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: at the time that the licensee begins to provide specific assistance to locate or
      acquire real estate for the buyer or lessee
    related_terms: []
    items:
      - AK-88-0021
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: supervision
    definition: Broker supervision requirements and record keeping refer to the mandated training that
      an applicant for a broker license must complete, specifically four contact hours of
      instruction on supervising agents and maintaining records.
    source: 12 Alaska Admin. Code § 64.010 et seq.
    quoted_text: (1) broker supervision requirements and record keeping - four contact hours;
    related_terms: []
    items:
      - AK-88-0007
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: temporary order
    definition: A temporary order is an order issued by the department before a hearing is held that
      remains in effect until a final order is issued or until 15 days pass after the person
      receives notice and does not request a hearing, after which it becomes final.
    source: Alaska Stat. § 08.88.011 et seq.
    quoted_text: the department may issue a temporary order before a hearing is held; a temporary order
      remains in effect until a final order affirming, modifying, or reversing the temporary order
      is issued or until 15 days have elapsed after the person receives the notice and has not
      requested a hearing
    related_terms: []
    items:
      - AK-88-0003
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: trust account
    definition: A trust account is a separate account where funds belonging to others—such as earnest
      money, security deposits, rents, and advance fees—must be held apart from the brokerage’s
      operating funds.
    source: "[REP Ref. Brokerage Practice — § 10.1 Trust (escrow) accounts]"
    quoted_text: money belonging to others — earnest money, tenant security deposits, rents collected
      for owners, advance fees — is **trust money** and must be held in a designated trust or escrow
      account separate from the firm's operating funds.
    related_terms: []
    items:
      - AK-88-0010
      - AK-88-0027
    status: draft
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: written
    definition: A contract must be in writing to be enforceable for property management activities.
    source: REP Ref. Brokerage Practice
    quoted_text: require listings to be written, signed by the seller,
    related_terms: []
    items:
      - AK-88-0026
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: written agreement
    definition: A written agreement is a document that memorializes the terms of a management contract,
      which most states require for property management activities.
    source: REP Ref. Brokerage Practice
    quoted_text: Because the manager handles the owner's money and binds the owner to leases, most
      states require a written agreement and treat management as brokerage activity requiring a
      license.
    related_terms: []
    items:
      - AK-88-0023
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: written authorization
    definition: Permission from the property owner, in writing, allowing the property manager to
      transfer funds between accounts for the same property.
    source: 12 Alaska Admin. Code § 64.010 et seq.
    quoted_text: (c) A licensee acting as a property manager may transfer funds between two or more
      accounts maintained for the same property owner if the licensee has written authorization from
      the property owner.
    related_terms: []
    items:
      - AK-88-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
