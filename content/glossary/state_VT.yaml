  - term: buyer default
    definition: Buyer default occurs when the buyer fails to perform contractual obligations, allowing
      the seller to retain the earnest money as liquidated damages or to pursue other remedies.
    source: REP Ref. Contracts
    quoted_text: Many forms make forfeiture of the deposit the seller's *sole* remedy for buyer default;
