  - term: exemption
    definition: An exemption permits a nonlicensed employee of a licensee to respond to public inquiries
      without a license, provided they disclose their unlicensed status and note that information
      must be verified by a licensed person.
    source: 26 V.S.A. ch. 41
    quoted_text: a nonlicensed employee of a licensee shall be allowed to respond to inquiries from
      members of the public, so long as the employee makes it clear that he or she is not licensed
      and that any information provided should be confirmed by a licensed person.
    related_terms: []
