  - term: banking days
    definition: Banking days are the days on which banks are open for business, used to calculate
      statutory deadlines such as the five‑day period for depositing earnest money into a trust
      account.
    source: 26 V.S.A. ch. 41
    quoted_text: (a) Every real estate broker, within five banking days, shall deposit in a trust or
      escrow account in a bank or other financial institution licensed to do business in this State
    related_terms: []
