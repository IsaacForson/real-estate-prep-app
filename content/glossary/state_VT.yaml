  - term: trust account
    definition: A trust account is a designated bank account, separate from a brokerage’s operating
      funds, where money belonging to others—such as earnest money, security deposits, and
      rents—must be held.
    source: REP Ref. Brokerage Practice
    quoted_text: to others — earnest money, tenant security deposits, rents collected for owners,
      advance fees — is **trust money** and must be held in a designated trust or escrow account
      separate from the firm's operating funds.
