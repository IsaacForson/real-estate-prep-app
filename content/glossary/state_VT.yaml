  - term: employee
    definition: An employee is a worker whose classification affects federal income tax withholding,
      Social Security and Medicare taxes, unemployment insurance, workers' compensation, overtime,
      and benefits, as distinguished from an independent contractor.
    source: REP Ref. Brokerage Practice
    quoted_text: Most salespersons are engaged by their brokers as independent contractors rather than
      employees. The classification affects federal income tax withholding, Social Security and
      Medicare taxes, unemployment insurance, workers' compensation, overtime, and benefits.
    related_terms: []
