  - term: disclosure
    definition: Where a duty to disclose exists, failing to disclose (nondisclosure) is treated as
      misrepresentation.
    source: REP Ref. Agency
    quoted_text: Concealment (actively hiding a fact) and, where a duty to disclose exists,
      nondisclosure are treated as misrepresentation.
