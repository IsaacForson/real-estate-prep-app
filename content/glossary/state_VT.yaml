  - term: broker
    definition: A broker is a licensed real estate professional who acts as an agent for clients and is
      authorized to perform brokerage activities such as listing, selling, buying, exchanging,
      leasing, renting, managing, negotiating, advertising, and offering to do any of these with
      respect to real property.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage: listing, selling, buying, exchanging,
      leasing, renting, managing, negotiating, advertising, and offering to do any of these with
      respect to real property."
    related_terms: []
    items:
