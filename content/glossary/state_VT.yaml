  - term: insurer
    definition: An insurer is the party that agrees to defend the insured's title and pay losses for
      covered defects under a title insurance contract.
    source: REP Ref. Ownership, Title & Transfer
    quoted_text: Title insurance is an indemnity contract in which the insurer agrees to defend the
      insured's title and pay losses caused by covered defects existing on the policy date, for a
      one-time premium paid at closing.
