  - term: salaried employee
    definition: A regularly salaried employee who performs customary on-site management duties for an
      apartment owner is exempt from needing a real estate broker license.
    source: Colo. Rev. Stat. § 12-10-201 et seq.
    quoted_text: (XII) A regularly salaried employee of an owner of an apartment building or complex who
      acts as an on-site manager of such an apartment building or complex. This exemption applies
      only in respect to the customary duties of an on-site manager performed for his or her
      employer.
