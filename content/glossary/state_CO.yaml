  - term: power of attorney
    definition: A power of attorney is a legal document that grants someone authority to act on
      another's behalf; a broad power of attorney creates a universal agent who can perform any
      lawful act for the principal.
    source: REP Ref. Agency
    quoted_text: A universal agent may do anything the principal could lawfully do. This is created by a
      broad power of attorney and is rare in brokerage.
