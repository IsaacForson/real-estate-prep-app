  - term: broker license
    definition: A broker license is the credential that authorizes an individual to act as a real estate
      broker, with levels such as independent or employing broker, based on experience and
      education.
    source: 4 Colo. Code Regs. § 725-1 (4 CCR 725-1)
    quoted_text: Pursuant to section 12-10-203(5)(c)(I), C.R.S., each Applicant for a Colorado
      Independent Broker level license must have held an Associate Broker level license on Active
      status for at least two (2) years preceding the date of application.
