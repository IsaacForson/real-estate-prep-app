  - term: preliminary advisory opinion
    definition: A preliminary advisory opinion is a request to the Commission for an opinion on how
      previous professional conduct, criminal convictions, or other violations may affect a future
      formal license application.
    source: 4 Colo. Code Regs. § 725-1 (4 CCR 725-1)
    quoted_text: Prior to an application for licensure, a person may request that the Commission issue a
