  - term: on-site manager
    definition: An on-site manager is an unlicensed employee who performs routine leasing and collection
      duties for an apartment owner, such as showing units, quoting rent, arranging maintenance, and
      collecting payments.
    source: 4 Colo. Code Regs. § 725-1 (4 CCR 725-1)
    quoted_text: "Unlicensed On-Site Manager: An unlicensed person who fills in blanks, as a scrivener,
      on lease forms, shows prospective tenants available units, quotes rental prices established by
      the owner or Broker, arranges for maintenance, and collects monies, including security
      deposits and rents."
