  - term: commission records
    definition: Commission records are the records maintained by the real estate commission that show a
      broker’s license status (such as active or inactive) and employment relationships, and that
      must be notified when employment ends.
    source: 4 Colo. Code Regs. § 725-1 (4 CCR 725-1)
    quoted_text: A. A Broker may request that the Commission records show their License as Inactive
      until proper request for reactivation has been made. B. It is the joint duty of both the
      Employing Broker and the Associate Broker to immediately notify the Commission when the
      employment of the Associate Broker terminates with the Brokerage Firm.
