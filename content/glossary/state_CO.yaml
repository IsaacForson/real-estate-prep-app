  - term: license
    definition: A real estate license is the state-granted authorization that allows the holder to
      perform brokerage activities such as listing, selling, buying, leasing, managing, and
      negotiating real property for compensation.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage:"
