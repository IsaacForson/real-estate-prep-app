entries:
  - term: agency disclosure
    definition: Agency disclosure is the written notice that a broker or salesperson must provide to a
      client early in the relationship, stating whom the licensee represents and what that
      representation entails.
    source: REP Ref. Agency
    quoted_text: Because parties often misunderstand whom a licensee represents, most states require
      licensees to disclose, in writing, at a defined early point (first substantive contact, before
      showing property, or before an offer is written — the timing varies by state), whom they
      represent and what that means.
    related_terms: []
