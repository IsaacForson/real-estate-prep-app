  - term: reserve
    definition: A reserve is money set aside by the property owner to cover future expenses, as required
      in a property management agreement. It is listed among the owner's obligations alongside
      carrying insurance and disclosing known defects.
    source: REP Ref. Brokerage Practice
    quoted_text: funding a reserve, carrying insurance, disclosing known defects
    related_terms: []
