  - term: referral fee
    definition: A referral fee is a payment made to a licensee for directing a client to another
      broker's listing. If undisclosed, it is considered a secret profit under the Act.
    source: REP Ref. Agency
    quoted_text: secret profits, such as a referral fee
    related_terms: []
