  - term: disclosure
    definition: Disclosure is the act of revealing required information, such as when affiliated
      services are offered or when a lead‑based paint disclosure addendum is included.
    source: REP Ref. Brokerage Practice
    quoted_text: Merely offering affiliated services is lawful with appropriate disclosure
    related_terms: []
    items:
