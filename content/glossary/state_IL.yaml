  - term: license
    definition: A real estate license authorizes the holder to perform brokerage activities such as
      listing, selling, leasing, and negotiating on behalf of others for compensation.
    source: REP Ref. Brokerage Practice
    quoted_text: A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage
    related_terms: []
    items:
      - IL-2000-0056
