  - term: continuing education
    definition: Continuing education refers to courses required by the Illinois Real Estate License Act
      that licensees must take after obtaining their license to maintain it.
    source: 225 ILCS 454
    quoted_text: '"Education provider" means a school licensed by the Department offering courses in
      pre-license, post-license, or continuing education required by this Act.'
