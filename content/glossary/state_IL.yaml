  - term: security deposit
    definition: A security deposit is tenant money held to secure performance of the lease, covering
      unpaid rent, damage beyond normal wear and tear, and cleaning.
    source: REP Ref. Brokerage Practice
    quoted_text: A security deposit is tenant money held to secure performance of the lease — unpaid
      rent, damage beyond normal wear and tear, and cleaning.
    related_terms: []
    items:
      - IL-2000-0073
    status: approved
