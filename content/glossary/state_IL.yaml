  - term: confidential information
    definition: Confidential information is information obtained from a client during a brokerage
      agreement that the client has designated as confidential, relates to the client's negotiating
      position, or whose disclosure could materially harm the client.
    source: 225 ILCS 454
    quoted_text: '"Confidential information" means information obtained by a licensee from a client
      during the term of a brokerage agreement'
