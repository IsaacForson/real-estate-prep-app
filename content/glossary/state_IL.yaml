  - term: designated agent
    definition: A designated agent is a licensee whom a sponsoring broker names to act as the legal
      representative of a client, as authorized under Section 15-50 of the Real Estate License Act
      of 2000.
    source: 225 ILCS 454
    quoted_text: '"Designated agent" means a sponsored licensee named by a sponsoring broker as the
      legal agent of a client, as provided for in Section 15-50 of this Act.'
