  - term: broker price opinion
    definition: A broker price opinion is a written opinion of a property’s probable selling price
      prepared by a broker or salesperson, typically for loan modification, short sale, or
      foreclosure evaluations, and must not be represented as an appraisal.
    source: REP Ref. Valuation & Appraisal
    quoted_text: A BPO is a written opinion of probable selling price prepared by a broker or
      salesperson, typically for a lender or servicer evaluating a loan modification, short sale, or
      foreclosure disposition, as a drive-by (exterior) or interior report listing recent sales and
      active listings.
