    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: brokerage agreement
    definition: A brokerage agreement is an agreement between a sponsoring broker and a consumer for
      licensed activities (or future licensed activities) provided to the consumer for compensation
      or the right to receive compensation.
    source: 225 ILCS 454
    quoted_text: '"Brokerage agreement" means an agreement between a sponsoring broker and a consumer
      for licensed activities, or the performance of future licensed activities, to be provided to a
      consumer in return for compensation or the right to receive compensation from another.'
    related_terms: []
