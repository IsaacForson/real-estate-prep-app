  - term: dual agency
    definition: Dual agency is when a licensee represents both the buyer and seller (or landlord and
      tenant) in the same transaction.
    source: 225 ILCS 454
    quoted_text: '"Dual agency" means an agency relationship in which a licensee is representing both
      buyer and seller or both landlord and tenant in the same transaction.'
    related_terms: []
    items:
      - IL-2000-0069
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: dual role
    definition: Dual role occurs when an agent represents both parties in the same transaction,
      requiring informed written consent before it begins.
    source: REP Ref. Agency
    quoted_text: Where dual or designated agency is permitted, the law almost always requires informed
      written consent of both parties, obtained before the dual role begins or as soon as it arises.
    related_terms: []
    items:
      - IL-2000-0017
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: escrow account
    definition: An escrow account is a special account separate from personal or business accounts where
      a sponsoring broker holds escrow money entrusted to them.
    source: 68 Ill. Adm. Code 1450
    quoted_text: sponsoring brokers who accept escrow moneys shall maintain and deposit in a special
      account (hereinafter referred to as an escrow account), separate and apart from personal or
      other business accounts
    related_terms: []
    items:
      - IL-2000-0073
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: exclusive brokerage agreement
    definition: An exclusive brokerage agreement is a written brokerage agreement giving the sponsoring
      broker the sole right to act as the exclusive agent for the client, per Section 15-75.
    source: 225 ILCS 454
    quoted_text: '"Exclusive brokerage agreement" means a written brokerage agreement that provides that
      the sponsoring broker has the sole right, through one or more sponsored licensees, to act as
      the exclusive agent or representative of the client and that meets the requirements of Section
      15-75 of this Act.'
    related_terms: []
    items:
      - IL-2000-0020
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: fiduciary duty
    definition: Fiduciary duty is the licensee’s obligation to act loyally and in the client’s best
      interest, which is breached by undisclosed dual agency.
    source: REP Ref. Agency
    quoted_text: Undisclosed dual agency — representing both sides without both parties' knowledge and
      consent — is a serious license law violation and a breach of fiduciary duty
    related_terms: []
    items:
      - IL-2000-0001
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: HIV
    definition: HIV refers to Human Immunodeficiency Virus, a medical condition that, if present in an
      occupant, does not require disclosure under the Illinois Real Estate License Act.
    source: 225 ILCS 454
    quoted_text: Human Immunodeficiency Virus (HIV)
    related_terms: []
