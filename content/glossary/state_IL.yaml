  - term: managing broker
    definition: A managing broker is a licensee who acts as a general agent for a property owner under a
      property management agreement, with authority to lease, set or approve rents, collect rents,
      hire and pay vendors, evict, and spend up to a stated amount without owner approval.
    source: "[REP Ref. Brokerage Practice — § 3.2 Property management agreement]"
    quoted_text: The contract creating a general agency between a property owner and a managing broker
    related_terms: []
    items:
      - IL-2000-0055
