entries:
  - term: auction
    definition: An auction is a public sale where real estate is offered for sale or lease to the
      highest bidder.
    source: 225 ILCS 454
    quoted_text: Sells, rents, leases, or offers for sale or lease real estate at auction.
    related_terms: []
    items:
      - IL-2000-0006
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker price opinion
    definition: A broker price opinion is a written opinion of a property’s probable selling price
      prepared by a broker or salesperson, typically for loan modification, short sale, or
      foreclosure evaluations, and must not be represented as an appraisal.
    source: REP Ref. Valuation & Appraisal
    quoted_text: A BPO is a written opinion of probable selling price prepared by a broker or
      salesperson, typically for a lender or servicer evaluating a loan modification, short sale, or
      foreclosure disposition, as a drive-by (exterior) or interior report listing recent sales and
      active listings.
    related_terms: []
    items:
      - IL-2000-0013
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: brokerage agreement
    definition: A brokerage agreement is an agreement between a sponsoring broker and a consumer for
      licensed activities (or future licensed activities) provided to the consumer for compensation
      or the right to receive compensation.
    source: 225 ILCS 454
    quoted_text: '"Brokerage agreement" means an agreement between a sponsoring broker and a consumer
      for licensed activities, or the performance of future licensed activities, to be provided to a
      consumer in return for compensation or the right to receive compensation from another.'
    related_terms: []
    items:
      - IL-2000-0019
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: client information
    definition: Client information refers to any details a licensee receives from a client during a
      transaction that must be kept confidential.
    source: 225 ILCS 454
    quoted_text: (3) confidentiality of client information;
    related_terms: []
    items:
      - IL-2000-0004
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: commission split
    definition: A commission split is the division of a commission between brokers or agents that may be
      negotiated or agreed to on behalf of a licensee.
    source: 68 Ill. Adm. Code 1450
    quoted_text: Negotiating or agreeing to any commission, commission split, management fee or referral
      fee on behalf of a licensee.
    related_terms: []
    items:
      - IL-2000-0007
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: comparative market analysis
    definition: A comparative market analysis is a written opinion of property value that a licensee may
      provide, labeled as such, and not presented as an appraisal.
    source: REP Ref. Brokerage Practice
    quoted_text: may offer a broker price opinion or comparative market analysis only where state law
      allows and only labeled as such, never as an appraisal.
    related_terms: []
    items:
      - IL-2000-0014
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: compensation
    definition: Compensation is the payment (such as a commission) a licensee receives for performing
      real estate services.
    source: REP Ref. Agency
    quoted_text: Many states require these to be in writing for the licensee to be entitled to a
      commission or as a matter of license law;
    related_terms: []
    items:
      - IL-2000-0007
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: confidential information
    definition: Confidential information is information obtained from a client during a brokerage
      agreement that the client has designated as confidential, relates to the client's negotiating
      position, or whose disclosure could materially harm the client.
    source: 225 ILCS 454
    quoted_text: '"Confidential information" means information obtained by a licensee from a client
      during the term of a brokerage agreement'
    related_terms: []
    items:
      - IL-2000-0001
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: confidentiality
    definition: Confidentiality requires a licensee to keep certain information received from a client
      private and not disclose it without permission.
    source: REP Ref. Agency
    quoted_text: confidentiality of certain information
    related_terms: []
    items:
      - IL-2000-0004
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: customer
    definition: A customer is a consumer who is not being represented by the licensee in a real estate
      transaction.
    source: 225 ILCS 454
    quoted_text: '"Customer" means a consumer who is not being represented by the licensee.'
    related_terms: []
    items:
      - IL-2000-0003
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disclosure
    definition: Disclosure is the act of revealing required information, such as when affiliated
      services are offered or when a lead‑based paint disclosure addendum is included.
    source: REP Ref. Brokerage Practice
    quoted_text: Merely offering affiliated services is lawful with appropriate disclosure
    related_terms: []
    items:
      - IL-2000-0002
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: dual role
    definition: Dual role occurs when an agent represents both parties in the same transaction,
      requiring informed written consent before it begins.
    source: REP Ref. Agency
    quoted_text: Where dual or designated agency is permitted, the law almost always requires informed
      written consent of both parties, obtained before the dual role begins or as soon as it arises.
    related_terms: []
    items:
      - IL-2000-0017
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: exclusive brokerage agreement
    definition: An exclusive brokerage agreement is a written brokerage agreement giving the sponsoring
      broker the sole right to act as the exclusive agent for the client, per Section 15-75.
    source: 225 ILCS 454
    quoted_text: '"Exclusive brokerage agreement" means a written brokerage agreement that provides that
      the sponsoring broker has the sole right, through one or more sponsored licensees, to act as
      the exclusive agent or representative of the client and that meets the requirements of Section
      15-75 of this Act.'
    related_terms: []
    items:
      - IL-2000-0020
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: fiduciary duty
    definition: Fiduciary duty is the licensee’s obligation to act loyally and in the client’s best
      interest, which is breached by undisclosed dual agency.
    source: REP Ref. Agency
    quoted_text: Undisclosed dual agency — representing both sides without both parties' knowledge and
      consent — is a serious license law violation and a breach of fiduciary duty
    related_terms: []
    items:
      - IL-2000-0001
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: HIV
    definition: HIV refers to Human Immunodeficiency Virus, a medical condition that, if present in an
      occupant, does not require disclosure under the Illinois Real Estate License Act.
    source: 225 ILCS 454
    quoted_text: Human Immunodeficiency Virus (HIV)
    related_terms: []
    items:
      - IL-2000-0002
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: inactive status
    definition: Inactive status is the condition of a license after sponsorship ends, during which the
      licensee may not engage in any licensed activities until a new sponsorship is established.
    source: 68 Ill. Adm. Code 1450
    quoted_text: the license is automatically changed to inactive status and the licensee is prohibited
      from engaging in licensed activities
    related_terms: []
    items:
      - IL-2000-0009
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: material facts
    definition: A material fact is any fact a reasonable person would consider important in deciding
      whether to buy, sell, or lease a property, or on what terms, including physical condition,
      legal matters, or transaction-related issues.
    source: REP Ref. Property Condition & Environmental
    quoted_text: A material fact is any fact a reasonable person would consider important in deciding
      whether to buy, sell, or lease a property, or on what terms.
    related_terms: []
    items:
      - IL-2000-0001
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: mortgage loan origination
    definition: Mortgage loan origination is the process by which a financial institution creates a
      mortgage loan secured by real estate.
    source: 225 ILCS 454
    quoted_text: for the purpose of a mortgage loan origination by a financial institution secured by
      such real estate.
    related_terms: []
    items:
      - IL-2000-0013
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: non-agency
    definition: A non-agent (such as a transaction broker or facilitator) does not represent either
      party and owes no fiduciary loyalty, but must still act honestly, disclose known material
      facts, account for funds, exercise reasonable skill and care, and keep certain information
      confidential.
    source: REP Ref. Agency
    quoted_text: A non-agent owes no fiduciary loyalty but is still bound by statutory duties that
      commonly include honesty, disclosure of known material facts about the property
    related_terms: []
    items:
      - IL-2000-0003
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: pattern of business
    definition: A pattern of business involves regularly buying, selling, offering to buy or sell,
      marketing, exchanging, or otherwise dealing in real estate contracts (including assignable
      contracts or options) as part of one's business.
    source: 225 ILCS 454
    quoted_text: (5) Whether for another or themselves, engages in a pattern of business of buying,
      selling, offering to buy or sell, marketing for sale, exchanging, or otherwise dealing in
      contracts, including assignable contracts for the purchase or sale of, or options on real
      estate or improvements thereon.
    related_terms: []
    items:
      - IL-2000-0011
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: required disclosure
    definition: A required disclosure is a statement of the intended purpose of a broker price opinion
      or comparative market analysis.
    source: 225 ILCS 454
    quoted_text: (1) a statement of the intended purpose of the broker price opinion or comparative
      market analysis;
    related_terms: []
    items:
      - IL-2000-0014
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: reserve
    definition: A reserve is money set aside by the property owner to cover future expenses, as required
      in a property management agreement. It is listed among the owner's obligations alongside
      carrying insurance and disclosing known defects.
    source: REP Ref. Brokerage Practice
    quoted_text: funding a reserve, carrying insurance, disclosing known defects
    related_terms: []
    items:
      - IL-2000-0006
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: solicitation
    definition: In the context of Illinois real estate licensing rules, solicitation refers to an offer
      or request to provide licensed brokerage services (such as discussing a future brokerage
      agreement) in connection with marketing or identifying real property for sale or lease.
    source: 68 Ill. Adm. Code 1450
    quoted_text: '"Advertising" or "Marketing of Licensed Activities" means a website, digital platform,
      or any form of social media that includes an offer or solicitation to provide licensed
      activities in connection with marketing or identifying real property for sale or lease.'
    related_terms: []
    items:
      - IL-2000-0020
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: sponsoring broker
    definition: A sponsoring broker is the broker who employs or sponsors a salesperson, under whom the
      salesperson must perform all brokerage activities and receive compensation.
    source: REP Ref. Brokerage Practice
    quoted_text: A **broker** may operate a brokerage and employ or sponsor licensees; a **salesperson**
      (or associate broker) may perform brokerage acts only under a sponsoring broker and may be
      compensated only by that broker.
    related_terms: []
    items:
      - IL-2000-0007
      - IL-2000-0008
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: sponsorship
    definition: Sponsorship means that a sponsoring broker has certified to the Department that a
      managing broker, broker, or residential leasing agent is employed by or associated by written
      agreement with the sponsoring broker and the Department has registered the sponsorship.
    source: 225 ILCS 454
    quoted_text: '"Sponsorship" means that a sponsoring broker has certified to the Department that a
      managing broker, broker, or residential leasing agent is employed by or associated by written
      agreement with the sponsoring broker and the Department has registered the sponsorship,'
    related_terms: []
    items:
      - IL-2000-0008
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: stigmatized property
    definition: A stigmatized property is one that buyers may avoid for psychological reasons unrelated
      to physical condition, such as a death or violent crime on the premises, a reputation for
      being haunted, or a prior occupant's illness.
    source: REP Ref. Property Condition & Environmental
    quoted_text: "A stigmatized property is one buyers may shun for psychological reasons unrelated to
      physical condition: a death or violent crime on the premises, a reputation for being haunted,
      a prior occupant's illness."
    related_terms: []
    items:
      - IL-2000-0002
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: supervision
    definition: Supervision is the oversight provided by a sponsoring broker that allows a person to
      perform licensed activities (such as residential leasing) without holding a license, provided
      the broker has notified the Department and the person meets education requirements.
    source: 225 ILCS 454
    quoted_text: a person may engage in residential leasing activities for which a license is required
      under this Act, for a period of 120 consecutive days without being licensed, so long as the
      person is acting under the supervision of a sponsoring broker
    related_terms: []
    items:
      - IL-2000-0010
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: termination of sponsorship
    definition: Termination of sponsorship is the ending of the relationship between a licensee and
      sponsoring broker, after which the license becomes inactive and the licensee may not conduct
      licensed activities until a new sponsorship is established.
    source: 68 Ill. Adm. Code 1450
    quoted_text: Once the sponsorship has been terminated, the license is automatically changed to
      inactive status and the licensee is prohibited from engaging in licensed activities until the
      licensee has established a valid sponsorship with a new sponsoring broker.
    related_terms: []
    items:
      - IL-2000-0009
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
