  - term: inactive status
    definition: Inactive status is the condition of a license after sponsorship ends, during which the
      licensee may not engage in any licensed activities until a new sponsorship is established.
    source: 68 Ill. Adm. Code 1450
    quoted_text: the license is automatically changed to inactive status and the licensee is prohibited
