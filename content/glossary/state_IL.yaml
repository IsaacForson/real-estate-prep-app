    definition: Unprofessional conduct is conduct that is dishonorable, unethical, or likely to deceive,
      defraud, or harm the public.
    source: 225 ILCS 454
    quoted_text: Engaging in dishonorable, unethical, or unprofessional conduct of a character likely to
      deceive, defraud, or harm the public
    related_terms: []
