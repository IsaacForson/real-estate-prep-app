    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: clients’ trust account
    definition: A clients’ trust account is an account holding funds belonging to others that a
      principal real estate broker or property manager must maintain information for, as required by
      ORS 696.245.
    source: Or. Rev. Stat. ch. 696 (Real Estate and Escrow Activities)
    quoted_text: Maintaining the information described in ORS 696.245 for each clients’ trust account
      opened, closed or transferred by a principal real estate broker
    related_terms: []
    items:
      - OR-696-0040
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: compliance review
    definition: A compliance review is an Agency examination of an authorized principal broker’s records
      and procedures intended to educate the broker on applicable statutes and rules.
    source: Or. Admin. R. ch. 863 (Real Estate Agency)
    quoted_text: (15) “Compliance review” means an Agency review of an authorized principal broker’s
      records and procedures for the purpose of educating the authorized principal broker on
      statutes and rules.
    related_terms: []
    items:
      - OR-696-0038
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: deposit
    definition: A deposit is money given by a buyer with an offer to show good faith, such as earnest
      money, which is held in trust until the transaction closes or is otherwise disposed.
    source: REP Ref. Contracts
    quoted_text: Earnest money (a good-faith deposit) is a sum the buyer delivers with an offer to show
      serious intent.
    related_terms: []
    items:
      - OR-696-0081
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disbursement
    definition: Disbursement is the payment of money, such as a broker's earned commission, from a trust
      account as part of a closing transaction.
    source: REP Ref. Brokerage Practice
    quoted_text: The commission portion of a closing disbursement becomes the broker's money only when
      it is earned and disbursed to the broker under the closing statement
    related_terms: []
    items:
