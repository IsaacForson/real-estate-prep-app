    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: endorsement
    definition: An endorsement is the approval or support from an authorized principal broker that must
      accompany a written request to convert a limited license to an unrestricted license.
    source: Or. Admin. R. ch. 863 (Real Estate Agency)
    quoted_text: The request must include the endorsement of the licensee's authorized principal broker,
      if applicable.
    related_terms: []
    items:
      - OR-696-0036
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: first contact
    definition: First contact is the initial contact by a licensee with a prospective party, whether in
      person, by telephone, over the Internet, or by electronic mail.
    source: Or. Admin. R. ch. 863 (Real Estate Agency)
    quoted_text: '"First contact with a represented party" means the initial contact by a licensee,
      whether in person, by telephone, over the Internet, or by electronic mail'
