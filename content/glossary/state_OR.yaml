  - term: disclosure
    definition: Disclosure means revealing known material facts about a property to the other party.
    source: REP Ref. Agency
    quoted_text: disclosure of known material facts about the property
    related_terms: []
    items:
      - OR-696-0053
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disposition
    definition: Disposition refers to what happens to the funds after a transaction is completed or an
      offer fails, such as being returned to the party or applied to a purchase.
    source: Or. Admin. R. ch. 863 (Real Estate Agency)
    quoted_text: When the transaction has been completed or the offer has failed, the final disposition
      of the funds.
    related_terms: []
    items:
      - OR-696-0081
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: earnest money
    definition: Earnest money is a deposit given by a buyer with an offer that the agent must keep
      separate from personal funds and account for.
    source: REP Ref. Agency
    quoted_text: The agent must keep the principal's money and property separate from the agent's own,
      keep accurate records, and turn over or account for all funds and documents received in the
      course of the agency — earnest money, rents, security deposits, keys, documents.
    related_terms: []
    items:
