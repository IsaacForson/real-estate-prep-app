  - term: material facts
    definition: A material fact is any fact a reasonable person would consider important in deciding
      whether to buy, sell, or lease a property, or on what terms, including physical condition,
      legal matters, or transaction-related issues.
    source: REP Ref. Property Condition & Environmental
    quoted_text: A material fact is any fact a reasonable person would consider important in deciding
      whether to buy, sell, or lease a property, or on what terms.
