  - term: agency disclosure pamphlet
    definition: The initial agency disclosure pamphlet is an informational document that outlines agency
      relationships and must be provided at first contact with each party to a real property
      transaction.
    source: Or. Rev. Stat. ch. 696 (Real Estate and Escrow Activities)
    quoted_text: An agent shall provide a copy of the initial agency disclosure pamphlet at the first
      contact with each party to a real property transaction
    related_terms: []
    items:
      - OR-696-0055
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: agreement
    definition: An agreement is a legally enforceable arrangement between parties to perform or refrain
      from a lawful act in exchange for consideration.
    source: REP Ref. Contracts
    quoted_text: A contract is a legally enforceable agreement between two or more competent parties to
      do, or to refrain from doing, some lawful act in exchange for consideration.
    related_terms: []
    items:
      - OR-696-0057
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: authorization
    definition: Authorization is the permission given by a principal allowing a licensee to act on their
      behalf, such as assisting the listing broker in serving the seller.
    source: REP Ref. Agency
    quoted_text: "A **subagent** is an agent of an agent: a licensee who, with the principal's
      authorization, assists the listing broker in serving the seller"
    related_terms: []
    items:
