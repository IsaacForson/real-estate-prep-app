  - term: records
    definition: Records are the documents and information—such as reconciliation worksheets, bank
      statements, and other files—that a broker must keep accurate and retain to account for trust
      funds and other client money.
    source: REP Ref. Agency
    quoted_text: The agent must keep the principal's money and property separate from the agent's own,
