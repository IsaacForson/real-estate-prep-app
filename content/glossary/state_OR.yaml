    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: ledger
    definition: A ledger account is a record that shows who provided the funds, when they were received
      and deposited, where they were deposited, and what happened to them after the transaction
      ends.
    source: Or. Admin. R. ch. 863 (Real Estate Agency)
    quoted_text: Authorized principal brokers must maintain a complete ledger account and record all
      funds received in their professional real estate activity.
    related_terms: []
    items:
      - OR-696-0081
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: limited license
    definition: A limited license is a real estate broker license issued under ORS 696.130 that is
      subject to a time limitation; after the period ends, the licensee may request an unrestricted
      license.
    source: Or. Admin. R. ch. 863 (Real Estate Agency)
    quoted_text: If the Commissioner issues an individual a limited license under ORS 696.130, the
