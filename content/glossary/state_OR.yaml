  - term: refund
    definition: Refund is the return of the full face amount of a credit card payment to the buyer when
      required, without deducting merchant discounts or processing fees.
    source: Or. Admin. R. ch. 863 (Real Estate Agency)
    quoted_text: (a) The face amount of the credit card payment, without reducing the face amount by any
      merchant's discount and processing fee charged to the principal broker, is the amount he or
      she must maintain, use, and refund as necessary;
