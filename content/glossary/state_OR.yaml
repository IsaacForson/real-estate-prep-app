entries:
  - term: affirmative duty
    definition: An affirmative duty is a legal obligation that a licensee must fulfill and cannot waive.
    source: Or. Rev. Stat. ch. 696 (Real Estate and Escrow Activities)
    quoted_text: an affirmative duty may not be waived.
    related_terms: []
    items:
      - OR-696-0053
    status: quote_verified
