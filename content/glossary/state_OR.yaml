  - term: fund
    definition: A fund refers to money held in a client’s trust account, such as earnest money or escrow
      funds, that must be tracked and accounted for separately.
    source: Or. Admin. R. ch. 863 (Real Estate Agency)
    quoted_text: a listing of each individual clients’ trust fund account with a balance as of the
      reconciliation date
    related_terms: []
    items:
