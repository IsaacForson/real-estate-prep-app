  - term: processing fee
    definition: A processing fee is a charge imposed by a merchant for handling a credit card payment,
      which cannot be deducted from the trust amount unless there is a separate written agreement.
    source: Or. Admin. R. ch. 863 (Real Estate Agency)
    quoted_text: The face amount of the credit card payment, without reducing the face amount by any
      merchant's discount and processing fee charged to the principal broker, is the amount he or
      she must maintain, use, and refund as necessary
