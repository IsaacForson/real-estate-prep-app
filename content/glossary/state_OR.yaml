  - term: seller's agent
    definition: A seller's agent is the broker who represents the seller under a listing agreement, owes
      the seller fiduciary duties, and must act to obtain the highest price and best terms for the
      seller without disclosing to the buyer that the seller will accept less than the list price
      without permission.
    source: REP Ref. Agency
    quoted_text: A seller's agent must, for example, try to obtain the highest price and best terms for
      the seller, and may not reveal to a buyer that the seller will accept less than the list price
      without the seller's permission.
    related_terms: []
    items:
      - OR-696-0053
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: written authorization
    definition: Written authorization is a document in which a managing principal broker grants another
      managing principal broker the authority to supervise their real estate activity during their
      absence.
    source: Or. Admin. R. ch. 863 (Real Estate Agency)
    quoted_text: "A managing principal broker may authorize another managing principal broker to control
      and supervise their professional real estate activity and use their registered business name
      during their absence only if:"
