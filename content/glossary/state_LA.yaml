entries:
  - term: bankruptcy
    definition: Bankruptcy is a legal proceeding in which a debtor's property may be placed under the
      control of a trustee, triggering a duty for licensees holding client funds to report the
      filing to the commission.
    source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law)
    quoted_text: It shall be the duty of every licensee, registrant, and certificate holder who is the
      custodian of client funds to report the institution of bankruptcy proceedings to the
      commission, in writing and by registered or certified mail
    related_terms: []
