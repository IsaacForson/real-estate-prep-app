  - term: timeshare
    definition: A timeshare divides the right to use a unit into periods, typically weeks, sold to
      different purchasers. In a fee (interval-ownership) timeshare each purchaser receives a deeded
      fractional interest that can be sold or willed. In a right-to-use timeshare the purchaser
      holds only a contract right, license, or lease for a term of years, and title stays with the
      developer.
    source: REP Ref. Ownership, Title & Transfer
    quoted_text: A timeshare divides the right to use a unit into periods, typically weeks, sold to
