  - term: net listing agreement
    definition: A net listing agreement is a listing contract that allows the broker to keep as
      commission any amount the sale price exceeds a predetermined net price the seller wants to
      receive.
    source: La. R.S. 37:1430–1470 (Louisiana Real Estate License Law)
    quoted_text: “Net listing agreement” means a listing agreement that authorizes a broker to take as
      his commission the difference between the higher sale price at which the real estate property
      is sold and the stipulated net price agreed upon to be received by the seller.
    related_terms: []
