  - term: duty
    definition: A duty of a licensee under a service provision agreement includes presenting all offers
      to the seller promptly and not disclosing offer terms to other buyers without the seller's
      permission.
    source: REP Ref. Contracts
    quoted_text: A listing licensee has a duty to present all offers to the seller promptly (until
      closing, unless the seller has waived it in writing, in many states), and generally may not
      disclose the terms of one buyer's offer to another buyer without the seller's authorization.
    related_terms: []
    items:
      - MI-25-0089
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: escrow account
    definition: An escrow account is a separate trust account where a brokerage holds clients' money,
      such as earnest money or security deposits, apart from its own operating funds.
    source: REP Ref. Brokerage Practice
    quoted_text: Money a brokerage receives that belongs to others — earnest money, tenant security
      deposits, rents collected for owners, advance fees — is trust money and must be held in a
      designated trust or escrow account separate from the firm's operating funds.
    related_terms: []
    items:
      - MI-25-0090
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: good moral character
    definition: Good moral character is the standard defined and determined under 1974 PA 381, MCL
      338.41‑338.47, used to assess an applicant's suitability for licensure.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: (8) 'Good moral character' means that term as defined in, and determined under, 1974 PA
      381, MCL 338.41 to 338.47.
    related_terms: []
    items:
      - MI-25-0037
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: hearing report
    definition: The hearing report is the administrative law hearings examiner's submission of findings
      of fact and conclusions of law after a hearing.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: at the conclusion of a hearing conducted under section 511, the administrative law
      hearings examiner shall submit a determination of findings of fact and conclusions of law
    related_terms: []
    items:
      - MI-25-0033
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: interest rate
    definition: Interest rate is the percentage charged on borrowed money per year; under Michigan's
      usury statute the legal rate is 5% per $100 per year.
    source: Mich. Comp. Laws §§ 438.31–438.32
    quoted_text: The interest of money shall be at the rate of $5.00 upon $100.00 for a year, and at the
      same rate for a greater or less sum
    related_terms: []
    items:
      - MI-25-0096
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: land division
    definition: Land division is the legal process of splitting a parcel of land into smaller lots,
      regulated to ensure public health, safety, adequate drainage, and proper access.
    source: Mich. Comp. Laws §§ 560.101–560.293
    quoted_text: AN ACT to regulate the division of land; to promote the public health, safety, and
      general welfare;
    related_terms: []
    items:
      - MI-25-0101
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: license
    definition: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage: listing, selling, buying, exchanging,
      leasing, renting, managing, negotiating, advertising, and offering to do any of these with
      respect to real property."
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage: listing, selling, buying, exchanging,
      leasing, renting, managing, negotiating, advertising, and offering to do any of these with
      respect to real property."
    related_terms: []
    items:
      - MI-25-0028
      - MI-25-0038
      - MI-25-0047
      - MI-25-0044
      - MI-25-0065
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: license cycle
    definition: A license cycle is the term of a license issued under the article.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: (f) "License cycle" means the term of a license issued under this article.
    related_terms: []
    items:
      - MI-25-0053
      - MI-25-0069
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: limited service agreement
    definition: A limited service agreement is a written contract between a real estate broker and a
      client that creates an agency relationship while allowing the client to waive certain broker
      services, such as property showings, knowingly and in whole or in part.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: (j) "Limited service agreement" means a written service provision agreement by which a
      real estate broker and client establish an agency relationship in which certain enumerated
      services, as set forth in section 2512d(3)(b), (c), and (d), are knowingly waived in whole or
      part by the client.
    related_terms: []
    items:
      - MI-25-0082
      - MI-25-0087
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: loyalty
    definition: Loyalty is a fiduciary duty where an agent must act with the highest trust and
      faithfulness toward the principal.
    source: REP Ref. Agency
    quoted_text: The agent owes the principal fiduciary duties — duties of the highest trust and loyalty
      — because the agent is handling the principal's affairs.
    related_terms: []
    items:
      - MI-25-0089
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: owner
    definition: An owner is the person who holds title to property and for whom an agent (such as a
      property manager) acts.
    source: REP Ref. Agency
    quoted_text: A property manager who leases units, hires contractors, and collects rents under a
      management agreement is a general agent of the owner.
    related_terms: []
    items:
      - MI-25-0040
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: pocket card
    definition: Pocket card means the card issued by the department that contains a licensee's license
      information and must be carried while acting as a broker, associate broker, or salesperson.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: "\"Pocket card\" means the card that contains information about a licensee's license
      that the department provides under section 2506 when it issues a license under this article."
    related_terms: []
    items:
      - MI-25-0044
      - MI-25-0048
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: preliminary
    definition: A preliminary determination is a procedure that allows an individual to obtain a
      determination from the department concerning whether any court judgments against them would
      likely result in a denial of a license or registration for failing to meet good moral
      character.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: The department shall establish a procedure that allows an individual to obtain a
      preliminary determination from the department concerning whether any court judgments against
      him or her would likely result in a denial of a license or registration for failing to meet
      the good moral character
    related_terms: []
    items:
      - MI-25-0029
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: preliminary determination
    definition: A preliminary determination is the department's procedure that lets an individual find
      out whether any court judgments would likely cause a license denial due to insufficient good
      moral character.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: The department shall establish a procedure that allows an individual to obtain a
      preliminary determination from the department concerning whether any court judgments against
      him or her would likely result in a denial of a license or registration
    related_terms: []
    items:
      - MI-25-0037
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: principal vocation
    definition: Principal vocation refers to a person's main occupation or business, specifically
      engaging in the sale of real estate as their primary activity.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: or that, as owner or otherwise, engages in the sale of real estate as a principal vocation.
    related_terms: []
    items:
      - MI-25-0040
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: prospective buyer
    definition: A prospective buyer is a person who is considering purchasing property and may be shown
      properties by a licensee.
    source: Mich. Comp. Laws §§ 565.951–565.966
    quoted_text: The seller authorizes its agent(s) to provide a copy of this statement to any
      prospective buyer in connection with any actual or anticipated sale of property.
    related_terms: []
    items:
      - MI-25-0095
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: reinstatement
    definition: Reinstatement means the granting of a license or registration, with or without
      limitations or conditions, to a person whose license or registration has been revoked.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: (b) 'Reinstatement' means the granting of a license or registration, with or without
      limitations or conditions, to a person whose license or registration has been revoked.
    related_terms: []
    items:
      - MI-25-0038
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: relicensure
    definition: Relicensure is the granting of a license to someone whose license has lapsed because
      they failed to renew it within 60 days after the expiration date.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: '"Relicensure" means the granting of a license to a person whose license has lapsed for
      failure to renew the license within 60 days after the expiration date.'
    related_terms: []
    items:
      - MI-25-0041
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: right-to-list
    definition: An agreement between an owner of residential real estate and a real estate broker that
      obligates the owner to list the property for sale with that broker at a future date in
      exchange for consideration.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: (w) "Right-to-list home sale agreement" means an agreement between an owner of
      residential real estate and a real estate broker that obligates the owner to list the
      residential real estate for sale with the real estate broker at a future date in exchange for
      consideration.
    related_terms: []
    items:
      - MI-25-0078
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: salesperson
    definition: A salesperson is an individual who works under a sponsoring broker to perform brokerage
      activities and is generally treated as a general agent of that broker.
    source: REP Ref. Agency
    quoted_text: A salesperson is generally treated as a general agent of the sponsoring broker.
    related_terms: []
    items:
      - MI-25-0041
      - MI-25-0091
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: service provision agreement
    definition: A service provision agreement is a written contract between a real estate broker and a
      client that establishes an agency relationship, possibly with certain services waived.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: a written service provision agreement by which a real estate broker and client
      establish an agency relationship
    related_terms: []
    items:
      - MI-25-0082
      - MI-25-0089
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: termination
    definition: The ending of an agency relationship through completion of purpose, expiration of the
      term, mutual agreement, or revocation or renunciation by either party.
    source: REP Ref. Agency
    quoted_text: "- **Completion (performance)** of the purpose — the listed property closes; the
      buyer-client purchases a home. - **Expiration** of the term stated in the agreement. Most
      states require listing and buyer agreements to have a definite termination date; automatic
      renewal clauses are prohibited in many states."
    related_terms: []
    items:
      - MI-25-0079
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: unenforceable
    definition: A contract or restriction that cannot be enforced by law, such as one that violates
      public policy or statute, even if it appears in a document.
    source: REP Ref. Property & Land Use
    quoted_text: A restriction that violates public policy or statute, such as one excluding owners by
      race, religion, or another protected class, is void and unenforceable even if it still appears
      in an old document.
    related_terms: []
    items:
      - MI-25-0078
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: usury
    definition: Usury is charging interest above the legal maximum allowed by law; the permissible limit
      varies by state.
    source: REP Ref. Financing & Closing
    quoted_text: Charging interest above a legal maximum is usury; limits vary by state and the state
      portion governs.
    related_terms: []
    items:
      - MI-25-0096
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: writing
    definition: A written document that satisfies state law requiring certain real estate agreements to
      be in writing for the licensee to be entitled to a commission or as a matter of license law.
    source: REP Ref. Agency
    quoted_text: Many states require these to be in writing for the licensee to be entitled to a
      commission or as a matter of license law; general agency law does not always require a
      writing.
    related_terms: []
    items:
      - MI-25-0078
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
