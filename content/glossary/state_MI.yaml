entries:
  - term: affiliated licensee
    definition: An affiliated licensee is a licensee whose broker and supervisory broker share the same
      agency relationship as another licensee's.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: Only the licensee's broker and a named supervisory broker have the same agency
      relationship as the licensee named below.
    related_terms: []
    items:
      - MI-25-0091
      - MI-25-0093
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: agency disclosure
    definition: Agency disclosure is a written statement informing the customer whom the licensee
      represents and what that means, provided at an early point in the transaction.
    source: "[REP Ref. Agency — § 7.1 Agency disclosure]"
    quoted_text: most states require licensees to disclose, in writing, at a defined early point, whom
      they represent and what that means.
    related_terms: []
    items:
      - MI-25-0095
    status: draft
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: agency relationship
    definition: An agency relationship is the fiduciary relationship where an agent (the broker) acts on
      behalf of a principal (the client) with loyalty and trust.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
    items:
      - MI-25-0092
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: board
    definition: The board is the entity that approves continuing education courses when no statewide
      real estate association with over 18,000 licensees exists.
    source: Mich. Admin. Code R 339.22101–339.22667
    quoted_text: If a statewide real estate association that has a membership representing more than
      18,000 licensees does not exist, then continuing education courses must be approved by the
      board.
    related_terms: []
    items:
      - MI-25-0021
      - MI-25-0032
      - MI-25-0033
      - MI-25-0035
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker license
    definition: A broker license is the state authorization that allows an individual to act as a real
      estate broker after meeting requirements such as completing 90 hours of approved prelicensure
      classroom courses in real estate (including 9 hours on civil rights).
    source: Mich. Admin. Code R 339.22101–339.22667
    quoted_text: An applicant for a real estate broker’s license shall satisfy all requirements of the
      code including completing 90 hours of approved prelicensure classroom courses in real estate
    related_terms: []
    items:
      - MI-25-0040
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: client
    definition: A client is the principal who engages a brokerage to act on their behalf in a real
      estate transaction.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
    items:
      - MI-25-0093
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: clock hours
    definition: A clock hour is a unit of time used to measure a portion of the required prelicensure
      education, as shown by the requirement of 9 clock hours on civil rights and fair housing law
      within the 90‑hour total.
    source: Mich. Admin. Code R 339.22101–339.22667
    quoted_text: An applicant for a real estate broker’s license shall satisfy all requirements of the
      code including completing 90 hours of approved prelicensure classroom courses in real estate
      of which 9 clock hours must be on civil rights and fair housing law.
    related_terms: []
    items:
      - MI-25-0049
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: complaint
    definition: A complaint is an oral or written grievance.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: '"Complaint" means an oral or written grievance.'
    related_terms: []
    items:
      - MI-25-0022
      - MI-25-0027
      - MI-25-0031
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: continuing education
    definition: Continuing education is the ongoing education that licensees must complete, such as 18
      hours each license cycle with at least 2 hours of legal education on statutes, rules, and
      court cases.
    source: Mich. Admin. Code R 339.22101–339.22667
    quoted_text: "A licensee shall complete 18 hours of continuing education in each license cycle as follows:"
    related_terms: []
