  - term: designated agency agreement
    definition: A designated agency agreement is an agreement between a broker and a client that
      authorizes designated agents to act on behalf of the client.
    source: Mich. Comp. Laws §§ 339.101–339.2919 (Occupational Code, Act 299 of 1980)
    quoted_text: A broker and a client may enter into a designated agency agreement.
    related_terms: []
    items:
      - MI-25-0093
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: director
    definition: The director is the head of the Department of Licensing and Regulatory Affairs who may
      determine penalties and issue a final order if the board fails to act within the required
      time.
    source: Mich. Admin. Code R 339.1701–339.1771
    quoted_text: By authority conferred on the director of the department of licensing and regulatory affairs
    related_terms: []
    items:
      - MI-25-0035
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disclosure
    definition: Disclosure is informing the customer, in writing, whom the licensee represents and what
      that means.
    source: "[REP Ref. Agency — § 7.1 Agency disclosure]"
    quoted_text: most states require licensees to disclose, in writing, at a defined early point, whom
      they represent and what that means.
