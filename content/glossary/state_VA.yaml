  - term: earnest money
    definition: Earnest money is a deposit held in trust by a neutral party (e.g., listing broker, title
      company, or attorney) while a purchase contract is pending, belonging to neither buyer nor
      seller alone.
    source: REP Ref. Contracts
    quoted_text: Earnest money belongs to neither the buyer nor the seller alone while the contract is
      pending; it is held in trust by a neutral party — commonly the listing broker, a title or
      escrow company, or an attorney — under the terms of the contract.
