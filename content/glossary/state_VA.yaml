  - term: independent contractor
    definition: An independent contractor is a licensee who acts for or represents a client under a
      written contract, rather than as a standard agent, with duties governed by that contract.
    source: 18 VAC 135-20-10 et seq.
    quoted_text: '"Independent contractor" means a licensee who acts for or represents a client other
      than as a standard agent and whose duties and obligations are governed by a written contract
