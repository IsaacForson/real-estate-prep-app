  - term: escrow
    definition: An escrow account is a designated trust account where a broker holds money that belongs
      to others—such as earnest money, security deposits, or rents—separate from the brokerage’s own
      operating funds.
    source: REP Ref. Brokerage Practice
    quoted_text: Money a brokerage receives that belongs to others — earnest money, tenant security
      deposits, rents collected for owners, advance fees — is trust money and must be held in a
      designated trust or escrow account separate from the firm's operating funds.
