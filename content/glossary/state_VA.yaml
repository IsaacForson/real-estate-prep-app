  - term: lease
    definition: A lease is an agreement that gives a tenant the right to possess and enjoy a property
      for a specified term, subject to conditions such as habitability and notice requirements.
    source: REP Ref. Brokerage Practice
    quoted_text: Tenants have the right to possession and quiet enjoyment for the term, to habitable
      premises (under an implied warranty of habitability recognized in most states for residential
      leases), to advance notice before the landlord enters except in emergencies, and to return of
      the deposit as § 12.8 describes.
