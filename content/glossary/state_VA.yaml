  - term: brokerage relationship
    definition: A brokerage relationship exists when a licensee acts for or represents a person as an
      agent by the person's express authority in a commercial or residential real estate
      transaction, unless a different legal relationship is intended and agreed to as part of the
      brokerage agreement.
    source: 18 VAC 135-20-10 et seq.
    quoted_text: '"Brokerage relationship" means the same as the term is defined in § 54.1-2130 of the
      Code of Virginia.'
    related_terms: []
