  - term: licensed name
    definition: The licensed name is the official name under which a brokerage firm is authorized to
      operate, and it must be used as the title for any escrow account the firm maintains.
    source: 18 VAC 135-20-10 et seq.
    quoted_text: The escrow account must be in the name by which the firm or sole proprietorship is licensed.
