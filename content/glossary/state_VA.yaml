  - term: limited service agent
    definition: A limited service agent is a real estate licensee who represents a client in a
      residential real estate transaction but provides only certain agreed‑upon services rather than
      the full range of standard agent duties.
    source: Va. Code Ann. § 54.1-2100 et seq.
    quoted_text: Any real estate licensee who acts for or represents a client in an agency relationship
