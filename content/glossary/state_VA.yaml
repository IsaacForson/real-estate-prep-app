  - term: foreclosure
    definition: Foreclosure is the legal process where a lender sells the property at a foreclosure sale
      to satisfy outstanding liens, with liens paid in order of priority.
    source: REP Ref. Ownership, Title & Transfer
    quoted_text: At a foreclosure sale liens are paid in order of priority; a junior lien receives
      nothing until every senior lien is satisfied.
