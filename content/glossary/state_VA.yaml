  - term: improper or dishonest conduct
    definition: Improper or dishonest conduct includes only the wrongful and fraudulent taking or
      conversion of money, property, or other things of value, or material misrepresentation or
      deceit.
    source: Va. Code Ann. § 54.1-2100 et seq.
    quoted_text: '"Improper or dishonest conduct" includes only the wrongful and fraudulent taking or
