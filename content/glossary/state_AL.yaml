      must complete 15 clock hours of approved continuing education coursework.
    source: Ala. Admin. Code ch. 790-X-1 to 790-X-5
    quoted_text: A total of 15 clock hours of approved continuing education coursework shall be
      completed to activate an inactive license when the license is activated for the first time in
      a license period.
