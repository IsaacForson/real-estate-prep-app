  - term: co-brokerage
    definition: Co‑brokerage is an agreement between a licensed Alabama qualifying broker and a broker
      from another state to cooperate on a real‑estate transaction, requiring a written agreement
      and a listing or joint listing of the property.
    source: "[Ala. Admin. Code ch. 790-X-1 to 790-X-5]"
    quoted_text: A licensed Alabama qualifying broker may enter into a co-brokerage agreement with a
      broker of another state, subject to the provisions of Code of Ala. 1975, § 34-27-3.
    related_terms: []
