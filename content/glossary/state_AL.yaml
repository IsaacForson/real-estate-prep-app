  - term: false statement
    definition: A false statement is a misrepresentation—an untrue statement of fact that another party
      relies on, which may be intentional, negligent, or innocent.
    source: REP Ref. Agency
    quoted_text: A **misrepresentation** is a false statement of fact on which another party relies.
