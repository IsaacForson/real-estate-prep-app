  - term: reciprocal license
    definition: A reciprocal license allows a real estate professional who is currently licensed in
      another state to obtain an Alabama license without retaking the full examination, provided
      they meet specific education and experience requirements.
    source: Ala. Admin. Code ch. 790-X-1 to 790-X-5
    quoted_text: Applicants for a reciprocal license shall have a current license in a qualifying state
