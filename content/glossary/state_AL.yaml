    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: licensee
    definition: A licensee is a real estate professional who shows property to clients and may act as
      their agent, though under traditional subagency the licensee actually represents the seller.
    source: REP Ref. Agency
    quoted_text: the licensee showing them property was 'their' agent when, under traditional subagency,
