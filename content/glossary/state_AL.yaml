  - term: qualifying broker
    definition: A qualifying broker is a licensed Alabama real estate broker who is authorized to enter
      into co‑brokerage agreements with brokers from other states and must secure a listing or joint
      listing of the property involved.
    source: Ala. Admin. Code ch. 790-X-1 to 790-X-5
    quoted_text: (1) A licensed Alabama qualifying broker may enter into a co-brokerage agreement with a
