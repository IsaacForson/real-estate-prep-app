  - term: earnest money
    definition: Earnest money is a good‑faith deposit given by a buyer to show intent to purchase, held
      in trust by a neutral party while the purchase contract is pending.
    source: REP Ref. Contracts
    quoted_text: Earnest money belongs to neither the buyer nor the seller alone while the contract is
      pending; it is held in trust by a neutral party — commonly the listing broker, a title or
      escrow company, or an attorney — under the terms of the contract.
    related_terms: []
    items:
      - AL-27-0015
      - AL-27-0030
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: escrow
    definition: Escrow is a designated trust account where a brokerage holds money belonging to
      others—such as earnest money—separate from its own operating funds.
    source: REP Ref. Brokerage Practice
    quoted_text: Money a brokerage receives that belongs to others — earnest money, tenant security
      deposits, rents collected for owners, advance fees — is **trust money** and must be held in a
      designated trust or escrow account separate from the firm's operating funds.
    related_terms: []
    items:
      - AL-27-0015
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: exemption
    definition: An exemption is an exception that allows certain housing to be marketed without
      violating fair‑housing rules, such as the housing‑for‑older‑persons exemption.
    source: REP Ref. Brokerage Practice
