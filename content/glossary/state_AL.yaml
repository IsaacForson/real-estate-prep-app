    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: lease
    definition: A lease is a contract for the rental of real property, whereby a tenant obtains the
      right to possess and use the property from a landlord in exchange for rent.
    source: REP Ref. Contracts
    quoted_text: In real estate, the most common contracts a licensee encounters are the purchase
      agreement (sales contract), the listing agreement, the buyer representation agreement, the
      lease, the option, and the land contract.
