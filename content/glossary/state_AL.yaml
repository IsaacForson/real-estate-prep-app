  - term: inactive
    definition: An inactive license is a license held by the commission office that is not currently
      valid because it is not renewed, or is held by law, order, or at the licensee's request.
    source: Ala. Code § 34-27-1 et seq.
    quoted_text: (8) INACTIVE LICENSE. A license which is being held by the commission office by law,
      order of the commission, at the request of the licensee, or which is renewable but is not
      currently valid because of failure to renew.
    related_terms: []
    items:
      - AL-27-0010
