  - term: license
    definition: A real estate license permits the holder, for compensation and on behalf of others, to
      perform brokerage activities such as listing, selling, leasing, renting, managing,
      negotiating, advertising, and offering to do any of these acts with respect to real property,
      as defined by state law.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage:"
    related_terms: []
