  - term: original license
    definition: An original license is the initial application for a broker or salesperson license, for
      which the applicant must pay a $30 recovery fund fee in addition to other fees.
    source: Ala. Code § 34-27-1 et seq.
    quoted_text: (c)(1) When any person makes application for an original license as a broker or
      salesperson, he or she shall pay, in addition to all other fees, a fee of thirty dollars ($30)
