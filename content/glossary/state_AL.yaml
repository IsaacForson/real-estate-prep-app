  - term: termination
    definition: Agency can be terminated by completion of the purpose, expiration of the term, mutual
      agreement, or revocation by the principal or renunciation by the agent.
    source: REP Ref. Agency
    quoted_text: "- **Completion (performance)** of the purpose — the listed property closes; the
      buyer-client purchases a home. - **Expiration** of the term stated in the agreement. Most
      states require listing and buyer agreements to have a definite termination date; automatic
      renewal clauses are prohibited in many states. - **Mutual agreement** to end the relationship
      before the term or purpose is complete."
