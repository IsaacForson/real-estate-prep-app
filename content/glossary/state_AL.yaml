  - term: formal complaint
    definition: A formal complaint is a written allegation filed by the Commission after finding
      probable cause, which triggers a hearing on possible license discipline or penalties.
    source: Ala. Code § 34-27-1 et seq.
    quoted_text: If probable cause is found, a formal complaint shall be filed and the commission shall
      hold a hearing on the formal complaint.
