  - term: associate
    definition: A salesperson or associate broker who is licensed under a broker and acts for the broker
      and, through the broker, for the broker's clients.
    source: REP Ref. Agency
    quoted_text: Salespersons and associate brokers licensed under a broker act for the broker and,
      through the broker, for the broker's clients;
