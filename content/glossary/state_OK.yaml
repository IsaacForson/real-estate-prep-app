  - term: citizenship
    definition: Citizenship refers to being a U.S. citizen, and documentation verifying citizenship is
      required for compliance with licensing rules.
    source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules)
    quoted_text: Documentation required for compliance necessary to verify citizenship, qualiﬁed alien
      status, and eligibility under the Personal Responsibility and Work Opportunity Reconciliation
      Act of 1996.
