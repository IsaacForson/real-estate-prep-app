  - term: complaint
    definition: A complaint is a written filing by any person that triggers the Oklahoma Real Estate
      Commission’s investigation of a licensee’s business transactions.
    source: "[Okla. Stat. tit. 59 (Oklahoma Real Estate License Code, §§ 858-101 to 858-605)]"
    quoted_text: The Oklahoma Real Estate Commission may, upon its own motion, and shall, upon written
      complaint filed by any person, investigate the business transactions of any real estate
      licensee
    related_terms: []
    items:
      - OK-605-0065
    status: draft
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disclosure
    definition: The act of revealing known material facts in writing before the buyer becomes bound in a
      real estate transaction.
    source: REP Ref. Property Condition & Environmental
    quoted_text: Written disclosure of every known material fact before the buyer is bound.
    related_terms: []
