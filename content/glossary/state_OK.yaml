  - term: disclosure statement
    definition: The Commission is responsible for developing and amending the Residential Property
      Condition Disclosure Statement and Disclaimer Statement forms and making them available to the
      public upon request.
    source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules)
    quoted_text: 605:10-15-4. Residential Property Condition Disclosure Act forms (a) Development and
      amendment of forms. In accordance with Oklahoma Statutes, Title 60, Section 833 the Commission
      shall develop and amend by rule the forms for the Residential Property Condition Disclosure
      Statement and Residential Property Condition Disclaimer Statement.
    related_terms: []
    items:
      - OK-605-0062
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: form
    definition: A form is a standardized, pre-printed or attorney-prepared document that licensees fill
      in with negotiated terms such as names, price, dates, and contingencies.
    source: REP Ref. Brokerage Practice
    quoted_text: Licensees may complete standardized, pre-printed or attorney-prepared contract forms by
      filling in the factual terms the parties have negotiated — names, price, dates, contingencies
      chosen from the form's menu — because that is incidental to the brokerage service.
    related_terms: []
    items:
      - OK-605-0053
      - OK-605-0092
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: forms
    definition: Forms are the standardized disclosure documents, such as the Residential Property
      Condition Disclosure Statement and Disclaimer Statement, that the Commission makes available
      to the public.
    source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules)
    quoted_text: (b) Availability of forms. The forms shall be available to the public upon request.
    related_terms: []
    items:
      - OK-605-0062
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: governor
    definition: The Governor appoints members to the Oklahoma Real Estate Commission, filling vacancies
      with the advice and consent of the Senate.
    source: Okla. Stat. tit. 59 (Oklahoma Real Estate License Code, §§ 858-101 to 858-605)
    quoted_text: Members of the Oklahoma Real Estate Commission shall be appointed by the Governor with
      the advice and consent of the Senate.
    related_terms: []
    items:
      - OK-605-0037
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: material fact
    definition: A material fact is one that a reasonable person would consider important in deciding
      whether, or on what terms, to buy, sell, or lease.
    source: REP Ref. Agency
    quoted_text: A material fact is one that a reasonable person would consider important in deciding
      whether, or on what terms, to buy, sell, or lease.
    related_terms: []
    items:
      - OK-605-0089
    status: approved
