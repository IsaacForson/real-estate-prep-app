  - term: public
    definition: The public refers to the general audience that sees licensee advertisements and needs to
      know which brokerage the licensee represents and who is accountable.
    source: REP Ref. Brokerage Practice
    quoted_text: so the public knows whom the licensee represents and who is accountable.
