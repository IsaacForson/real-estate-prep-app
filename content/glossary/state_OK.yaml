  - term: appointment
    definition: The act of being appointed to a position, such as a member of the Oklahoma Real Estate
      Commission, entitling the individual to perform its duties.
    source: Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules)
    quoted_text: Each member of the committee shall be entitled to receive travel expenses essential to
      the performance of the duties of his appointment.
