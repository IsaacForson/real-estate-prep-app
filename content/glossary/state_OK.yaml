  - term: violation
    definition: A violation is a serious license law breach, such as undisclosed dual agency, that can
      result in loss of commission, rescission, or discipline.
    source: REP Ref. Agency
    quoted_text: Undisclosed dual agency — representing both sides without both parties' knowledge and
      consent — is a serious license law violation
    related_terms: []
    items:
