  - term: transient lodging facility
    definition: A transient lodging facility is a furnished room or suite rented daily to guests who do
      not use it as their principal residence, for stays shorter than 30 days.
    source: Okla. Stat. tit. 59 (Oklahoma Real Estate License Code, §§ 858-101 to 858-605)
    quoted_text: '"transient lodging facility" means a furnished room or furnished suite of rooms which
      is rented to a person on a daily basis, not as a principal residence, for a period less than
      thirty (30) days'
    related_terms: []
    items:
      - OK-605-0083
    status: approved
