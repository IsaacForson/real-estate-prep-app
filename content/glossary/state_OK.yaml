  - term: residency
    definition: Being a resident of the State of Oklahoma for at least three years prior to appointment
      to the Oklahoma Real Estate Commission.
    source: Okla. Stat. tit. 59 (Oklahoma Real Estate License Code, §§ 858-101 to 858-605)
    quoted_text: All members of the Commission shall be citizens of the United States and shall have
      been residents of the State of Oklahoma for at least three (3) years prior to their
      appointment.
    related_terms: []
    items:
      - OK-605-0038
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: resident manager
    definition: A resident manager is a person who manages an apartment building or similar property for
      the owner, lives on the premises, and performs leasing activities as part of their employment.
    source: Okla. Stat. tit. 59 (Oklahoma Real Estate License Code, §§ 858-101 to 858-605)
    quoted_text: 4. Apply to any person acting as the resident manager for the owner or an employee
      acting as the resident manager for a licensed real estate broker managing an apartment
      building, duplex, apartment complex or court, when such resident manager resides on the
      premises and is engaged in the leasing of property
    related_terms: []
    items:
      - OK-605-0084
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: sanction
    definition: A sanction is a disciplinary action the Commission may impose, such as suspending or
      revoking a license or imposing an administrative fine.
    source: "[Okla. Stat. tit. 59 (Oklahoma Real Estate License Code, §§ 858-101 to 858-605)]"
    quoted_text: (d) suspending real estate licenses and approvals for specified periods of time, (e)
      revoking real estate licenses and approvals, (f) imposing administrative fines pursuant to
      Section 858-402 of this title
    related_terms: []
    items:
