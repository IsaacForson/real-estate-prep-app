  - term: authorization
    definition: Permission granted to a licensee to perform specific brokerage activities, such as
      placing a sign, using a lockbox, advertising, and cooperating with other brokers.
    source: REP Ref. Brokerage Practice
    quoted_text: authorization to place a sign, use a lockbox, advertise, and cooperate with and
      compensate other brokers
