    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: notice
    definition: Notice is a communication that becomes effective when it is delivered, such as to the
      listing licensee or by electronic transmission, as specified in real estate forms.
    source: REP Ref. Contracts
    quoted_text: Real estate forms commonly specify how and when notice is effective — for example, on
      delivery to the listing licensee, or on electronic transmission — and the form controls.
    related_terms: []
    items:
      - OK-605-0036
      - OK-605-0065
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: period
    definition: A period is a specified length of time during which something remains open or effective,
      such as an offer that may be revoked before the period ends.
    source: REP Ref. Contracts
    quoted_text: even if the offer stated it would remain open for a specified period.
    related_terms: []
    items:
      - OK-605-0036
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: psychological factors
    definition: Psychological factors are circumstances, suspicions, or facts about a property that may
      cause emotional or psychological concern to a prospective buyer or tenant and influence their
      decision to buy or lease.
    source: "[Okla. Admin. Code tit. 605 (Oklahoma Real Estate Commission rules)]"
    quoted_text: Psychologically impacted property is any property where the existence of certain
      circumstances, suspicions or facts may create emotional or psychological disturbance or
      concerns to a prospective purchaser/lessee, with the potential of influencing a buying/leasing
      decision.
    related_terms: []
    items:
