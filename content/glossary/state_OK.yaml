  - term: rent
    definition: Rent is the payment a tenant makes to a landlord or property manager for the use and
      occupancy of real property.
    source: REP Ref. Agency
    quoted_text: and documents received in the course of the agency — earnest money, rents, security
      deposits, keys, documents.
