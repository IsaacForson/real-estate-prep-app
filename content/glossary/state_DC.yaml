entries:
  - term: board
    definition: The D.C. Board of Real Estate, the regulatory body established to oversee real estate
      licensing and protect the public from incompetence, fraud, and deception.
    source: 17 DCMR ch. 26, §§ 2600–2699
    quoted_text: The Board of Real Estate (hereinafter referred to as the "Board"), established by the
      Second Omnibus Regulatory Reform Act of 1998
    related_terms: []
    items:
      - DC-198-0021
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker
    definition: In real estate brokerage, the broker is the agent who acts on behalf of the client (the
      seller, buyer, landlord, or tenant) and is licensed to perform brokerage activities.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
    items:
      - DC-198-0022
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: examination
    definition: An examination approved by the Board that an applicant must pass to demonstrate
      qualification for licensure as a property manager.
    source: 17 DCMR ch. 26, §§ 2600–2699
    quoted_text: Furnish evidence of having satisfactorily completed an examination approved by the Board;
    related_terms: []
    items:
      - DC-198-0023
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: license
    definition: A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage, including listing, selling, buying,
      exchanging, leasing, renting, managing, negotiating, advertising, and offering to do any of
      these with respect to real property.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage: listing, selling, buying, exchanging,
      leasing, renting, managing, negotiating, advertising, and offering to do any of these with
      respect to real property."
    related_terms: []
    items:
      - DC-198-0022
      - DC-198-0023
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: members
    definition: Individuals appointed to serve on the Board of Real Estate who participate in its
      decisions and actions.
    source: 17 DCMR ch. 26, §§ 2600–2699
    quoted_text: Five (5) members of the Board shall constitute a quorum.
    related_terms: []
    items:
      - DC-198-0021
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: property manager
    definition: A property manager is the owner's general agent charged with achieving the owner's
      objectives—usually maximizing net income while preserving value—through leasing, rent
      collection, maintenance, tenant relations, financial reporting, and regulatory compliance.
    source: REP Ref. Brokerage Practice
    quoted_text: A property manager is the owner's general agent (REP Ref. Agency § 1.2) charged with
      achieving the owner's objectives — usually maximizing net income while preserving value —
      through leasing, rent collection, maintenance, tenant relations, financial reporting, and
      regulatory compliance.
    related_terms: []
    items:
      - DC-198-0022
      - DC-198-0023
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: quorum
    definition: The minimum number of Board members required to conduct official business, which is five
      members for the D.C. Board of Real Estate.
    source: 17 DCMR ch. 26, §§ 2600–2699
    quoted_text: Five (5) members of the Board shall constitute a quorum.
    related_terms: []
    items:
      - DC-198-0021
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
