entries:
  - term: account
    definition: To account for money means to keep a full record of funds received and to provide a
      complete accounting of those funds.
    source: REP Ref. Agency
    quoted_text: the duty to account for money already received continues until the accounting is complete.
    related_terms: []
    items:
      - NC-93A-0056
    status: approved
    reviewer: auto-publish
    model: groq/openai/gpt-oss-120b
  - term: agreement
    definition: An agreement for brokerage services is an arrangement between a broker and the owner of
      the property that is the subject of a transaction, which must be in writing and signed by both
      parties at the time of its formation.
    source: 21 NCAC 58A 0101–0120
    quoted_text: Every agreement for brokerage services between a broker and an owner of the property to
      be the subject of a transaction shall be in writing and signed by the parties at the time of
      its formation.
    related_terms: []
    items:
      - NC-93A-0102
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: authority
    definition: Authority is the scope of power that a principal confers on an agent, classifying agency
      as universal, general, or special.
    source: REP Ref. Agency
    quoted_text: Agency is classified by the scope of authority the principal has conferred.
    related_terms: []
    items:
      - NC-93A-0045
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker-in-charge
    definition: The broker‑in‑charge is the licensed broker designated for a particular office, whose
      license must be displayed in that office.
    source: "[21 NCAC 58A 0101–0120]"
    quoted_text: A broker‑in‑charge shall also display his or her license certificate in the office
      where he or she is broker‑in‑charge.
    related_terms: []
    items:
      - NC-93A-0057
    status: draft
    model: groq/openai/gpt-oss-120b
  - term: business days
    definition: A business day is a day counted in the three‑day limit for a broker to deliver or return
      a check after an option or sales contract is accepted.
    source: 21 NCAC 58A 0101–0120
    quoted_text: A broker shall not retain an instrument for more than three business days after the
      acceptance of the option or other sales contract.
    related_terms: []
    items:
      - NC-93A-0047
    status: approved
    reviewer: auto-publish
    model: groq/openai/gpt-oss-120b
  - term: commission
    definition: A commission is the compensation promised to, or paid to, a broker for successfully
      bringing a buyer that results in a sale.
    source: "[REP Ref. Brokerage Practice — § 1.1 What a license authorizes]"
    quoted_text: a salesperson ... may be compensated only by that broker.
    related_terms: []
    items:
      - NC-93A-0057
    status: draft
    model: groq/openai/gpt-oss-120b
  - term: disciplinary
    definition: A disciplinary offense is a violation of licensing rules, such as misrepresentation,
      that can lead to sanctions like fines, suspension, or revocation of a license.
    source: REP Ref. Agency
    quoted_text: Most state license laws make misrepresentation to any party a disciplinary offense
      regardless of agency.
    related_terms: []
    items:
      - NC-93A-0057
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disclosure
    definition: Disclosure is making information known, such as revealing affiliated services, so that
      the action is lawful only with appropriate disclosure.
    source: REP Ref. Brokerage Practice
    quoted_text: Merely offering affiliated services is lawful with appropriate disclosure
    related_terms: []
    items:
      - NC-93A-0045
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: instrument
    definition: An instrument is a negotiable document, such as a promissory note, that can be sold or
      assigned.
    source: REP Ref. Financing & Closing
    quoted_text: A note is a negotiable instrument the lender can sell or assign
    related_terms: []
    items:
      - NC-93A-0047
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: license
    definition: A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage, including listing, selling, buying,
      leasing, and managing property.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage:"
    related_terms: []
    items:
      - NC-93A-0067
      - NC-93A-0068
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: licensure
    definition: Licensure is the status of being licensed to practice real estate, evidenced by the
      pocket card issued annually by the Commission.
    source: 21 NCAC 58A 0101–0120
    quoted_text: The pocket card issued by the Commission annually to each broker shall be retained by
      the broker as evidence of licensure.
    related_terms: []
    items:
      - NC-93A-0075
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: misdemeanor
    definition: A misdemeanor is a crime punishable by a fine of at least $100 and up to $5,000 and
      imprisonment from three months to twelve months.
    source: 15 U.S.C. §§ 1–7 (Sherman Act)
    quoted_text: shall be fined in a sum not less than $100 and not exceeding $5,000
    related_terms: []
    items:
      - NC-93A-0040
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: offer
    definition: An offer is a proposal that shows mutual assent when combined with acceptance, forming
      part of a valid contract.
    source: REP Ref. Contracts
    quoted_text: mutual assent, shown by an offer and an acceptance
    related_terms: []
    items:
      - NC-93A-0045
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: pocket card
    definition: The pocket card is the annual proof of licensure that a broker must retain and present
      when requested while engaging in real estate brokerage.
    source: 21 NCAC 58A 0101–0120
    quoted_text: The pocket card issued by the Commission annually to each broker shall be retained by
      the broker as evidence of licensure.
    related_terms: []
    items:
      - NC-93A-0075
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: proof
    definition: Proof, in this context, means evidence such as the pocket card that shows a broker is
      currently licensed to engage in real estate brokerage.
    source: 21 NCAC 58A 0101–0120
    quoted_text: Each broker shall produce a legible form of the card as proof of licensure whenever
      requested while engaging in real estate brokerage.
    related_terms: []
    items:
      - NC-93A-0075
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: provisional
    definition: A provisional broker is a newly licensed broker who holds a provisional license and may
      not serve as a qualifying broker for a brokerage entity.
    source: 21 NCAC 58A 0501–0616
    quoted_text: A provisional broker may not serve as a qualifying broker.
    related_terms: []
    items:
      - NC-93A-0057
    status: approved
    reviewer: auto-publish
    model: groq/openai/gpt-oss-120b
  - term: renewal fee
    definition: The renewal fee is the amount, such as fifty dollars, that a broker must pay to the
      North Carolina Real Estate Commission to renew an active real estate license.
    source: 21 NCAC 58A 0501–0616
    quoted_text: shall submit a renewal fee of fifty dollars ($50.00).
    related_terms: []
    items:
      - NC-93A-0067
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: retention
    definition: Retention means keeping records of transactions for three years after all related funds
      have been disbursed.
    source: 21 NCAC 58A 0101–0120
    quoted_text: Brokers shall retain records of all sales, rental, and other transactions conducted in
      such capacity
    related_terms: []
    items:
      - NC-93A-0047
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: signature
    definition: A signature is a mark or electronic indication that shows assent to a contract and
      satisfies legal requirements when a law mandates one.
    source: REP Ref. Contracts
    quoted_text: Federal law provides that a signature, contract, or other record relating to a
      transaction may not be denied legal effect solely because it is in electronic form, and that
      if a law requires a signature, an electronic signature satisfies the requirement.
    related_terms: []
    items:
      - NC-93A-0077
      - NC-93A-0102
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: written agreement
    definition: A written agreement is an agreement that is in writing, which many state license laws
      require for enforceability of brokerage contracts such as listing or buyer agreements.
    source: REP Ref. Contracts
    quoted_text: The Statute of Frauds does not usually require the *listing agreement* to be in writing
      as a matter of general contract law, but many state license laws independently require written
      listing and buyer agreements.
    related_terms: []
    items:
      - NC-93A-0077
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
