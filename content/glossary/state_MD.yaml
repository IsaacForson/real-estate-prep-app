  - term: written instructions
    definition: Written instructions are directions from the parties involved in a transaction that
      dictate how trust money should be handled; in their absence, the money must be placed in a
      non‑interest‑bearing escrow account.
    source: COMAR 09.11.01–09.11.09 (Real Estate Commission regulations)
    quoted_text: in the absence of proper written instructions from the parties involved in the
      transaction to the contrary, they shall be deposited and retained in a non-interest-bearing
      escrow account
