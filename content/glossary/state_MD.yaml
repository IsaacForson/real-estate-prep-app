  - term: sponsor
    definition: A sponsor is an entity that sponsors a continuing education course; its name may appear
      in advertising but not in a larger font or format than the approved course provider, and its
      role regarding the course must be disclosed in the advertising.
    source: COMAR 09.11.01–09.11.09 (Real Estate Commission regulations)
    quoted_text: The name of a course sponsor may appear in the advertising, but may not be in a font
      size or format that exceeds that of the approved course provider.
