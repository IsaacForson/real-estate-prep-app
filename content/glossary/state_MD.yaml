  - term: trust money
    definition: Trust money is money a brokerage receives that belongs to others—such as earnest money,
      tenant security deposits, rents collected for owners, or advance fees—and must be held in a
      designated trust or escrow account separate from the firm's operating funds.
    source: REP Ref. Brokerage Practice
    quoted_text: Money a brokerage receives that belongs to others — earnest money, tenant security
      deposits, rents collected for owners, advance fees — is trust money
    related_terms: []
