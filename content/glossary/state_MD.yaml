  - term: material fact
    definition: A material fact is any information that a reasonable person would consider important
      when deciding whether to buy, sell, or lease property, or on what terms to do so.
    source: REP Ref. Agency
    quoted_text: A **material fact** is one that a reasonable person would consider important in
