  - term: code of ethics
    definition: The code of ethics is a set of standards of conduct adopted by the Real Estate
      Commission for all licensed individuals, which the Commission must provide to each licensee at
      least every two years and make available upon request.
    source: "[Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act) —
      §17–207.]"
    quoted_text: (a) To protect the interests of the public, the Commission shall adopt, by regulation,
      a code of ethics to set standards of conduct for all individuals licensed under this title.
