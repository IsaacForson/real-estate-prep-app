  - term: disclosure form
    definition: A disclosure form is a document that informs the customer the licensee is not the
      customer's agent and confirms the recipient has been informed, without creating an agency
      relationship.
    source: REP Ref. Agency
    quoted_text: The agency disclosure form is a disclosure, not a contract — signing it does not create
      agency; it confirms that the recipient has been informed.
