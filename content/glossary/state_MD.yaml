  - term: broker
    definition: A broker is the licensed agent who represents clients in real estate transactions and
      under whose supervision salespersons and associate brokers act.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
