  - term: civil penalty
    definition: A civil penalty is a fine of up to $5,000 that the Real Estate Commission may impose for
      each violation of the Real Estate Brokers Act.
    source: Md. Code Ann., Bus. Occ. & Prof. §§ 17-101–17-702 (Maryland Real Estate Brokers Act)
    quoted_text: (a) The Commission may impose on a person who violates this title a civil penalty not
      exceeding $5,000 for each violation, whether or not the person is licensed or holds a
      certificate under this title.
    related_terms: []
    items:
      - MD-17-0108
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: closing
    definition: Closing is the point in a real estate transaction when the deed has been delivered and
      the price paid, after which the purchase agreement is considered executed.
    source: REP Ref. Contracts
    quoted_text: After closing, when the deed has been delivered and the price paid, the purchase
      agreement is executed.
