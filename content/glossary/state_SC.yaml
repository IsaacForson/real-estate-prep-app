  - term: customer
    definition: A customer is a buyer, seller, landlord, or tenant who uses a real estate licensee's
      services without having a written agency agreement with the licensee's brokerage firm.
    source: S.C. Code Ann. § 40-57 (Title 40, ch. 57 — Real Estate Brokers, Brokers-in-Charge,
      Associates, and Property Managers)
    quoted_text: (13) "Customer" means a buyer, seller, landlord, or tenant who uses the services of a
      real estate licensee but does not establish an agency relationship through a written agency
      agreement with the licensee's real estate brokerage firm.
