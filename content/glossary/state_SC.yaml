  - term: loyalty
    definition: Loyalty is the fiduciary duty of a real estate agent to act with the highest trust and
      faithfulness toward the client.
    source: REP Ref. Agency
    quoted_text: The agent owes the principal fiduciary duties — duties of the highest trust and loyalty
      — because the agent is handling the principal's affairs.
    related_terms: []
    items:
      - SC-57-0057
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: material fact
    definition: A material fact is a detail about a property that a reasonable person would consider
      important when deciding whether to buy, sell, or lease it, and what terms to accept.
    source: REP Ref. Agency
    quoted_text: A **material fact** is one that a reasonable person would consider important in
      deciding whether, or on what terms, to buy, sell, or lease.
    related_terms: []
    items:
      - SC-57-0043
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: obedience
    definition: Obedience is the duty of a real estate brokerage firm to follow the client's lawful
      instructions within the scope of the agency agreement.
    source: S.C. Code Ann. § 40-57 (Title 40, ch. 57 — Real Estate Brokers, Brokers-in-Charge,
      Associates, and Property Managers)
    quoted_text: (A) A real estate brokerage firm that provides services through an agency agreement for
      a client is bound by the duties of loyalty, obedience, disclosure, confidentiality, reasonable
      care, diligence, and accounting as set forth in this chapter.
