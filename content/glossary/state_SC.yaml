  - term: licensure
    definition: licensure is the process of obtaining a real estate license from the commission.
    source: S.C. Code Ann. Regs. ch. 105 (Real Estate Commission)
    quoted_text: Pre-licensing courses must provide students with information on licensing requirements,
      familiarization with the Commission’s statutes and regulations, and how to apply for licensure
