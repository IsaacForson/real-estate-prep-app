entries:
  - term: accreditation
    definition: Accreditation is the commission’s approval for a real estate school to operate, which
      requires the school to apply and show it can meet the state’s minimum curriculum and
      standards.
    source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954)
    quoted_text: (1) An institution or organization desiring to conduct a school or offer a course of
      instruction to prepare persons to be licensed under this chapter, or to offer post-licensure
      courses, shall apply to the commission for accreditation, and shall submit evidence that it is
      prepared to carry out a prescribed minimum curriculum in real estate principles and practices
      as set forth in this chapter.
    related_terms: []
    items:
      - MS-1954-0046
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: agency relationship
    definition: An agency relationship is a legal connection where a licensee acts on behalf of a
      principal, which can be created by the licensee's conduct even if the licensee did not intend
      to create it.
    source: "[REP Ref. Contracts — § 1.2 Express versus implied]"
    quoted_text: In real estate, implied contracts matter mostly in the agency context, because a
      licensee's conduct can create an agency relationship
    related_terms: []
    items:
      - MS-1954-0060
    status: draft
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: civil action
    definition: A civil action is a lawsuit filed in a court to resolve a dispute, such as a
      disagreement over funds, where parties seek legal remedy.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: Deposit of the funds with a court of competent jurisdiction in which a civil action
      regarding the funds has been filed
    related_terms: []
