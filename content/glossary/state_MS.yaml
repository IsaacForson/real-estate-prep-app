    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: damages
    definition: Monetary compensation awarded for loss or injury resulting from a breach of duty.
    source: REP Ref. Agency
    quoted_text: may be liable to the other for damages — a seller who cancels an exclusive listing
      early to sell privately may owe the broker the commission or expenses
    related_terms: []
