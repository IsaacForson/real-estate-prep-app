  - term: compliance
    definition: Compliance means fulfilling the duties owed by an agent to a principal—such as
      obedience, loyalty, disclosure, confidentiality, accounting, and reasonable care—with each
      duty illustrated by examples of when it is met or breached.
    source: REP Ref. Agency
    quoted_text: Each duty is discussed below with an example of compliance and breach.
    related_terms: []
    items:
      - MS-1954-0068
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: consent
    definition: Consent is the informed written agreement of all parties required before certain
      actions, such as dual agency, can be undertaken.
    source: REP Ref. Agency
    quoted_text: dual agency is permitted only with the **informed written consent of both parties**
    related_terms: []
    items:
      - MS-1954-0080
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: contracts
    definition: A contract is an agreement that may be express (stated in words) or implied (arising
      from the parties' conduct); in real estate, purchase contracts are almost always express and
      written.
    source: REP Ref. Contracts
    quoted_text: Purchase contracts for real property are almost always express and, because of the
      Statute of Frauds (§ 2.6), almost always written.
    related_terms: []
    items:
      - MS-1954-0060
    status: approved
