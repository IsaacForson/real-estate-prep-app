    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: listing
    definition: A listing broker is a special agent hired to find a ready, willing, and able buyer for a
      property but cannot bind the seller to a purchase agreement without separate authorization.
    source: REP Ref. Agency
    quoted_text: "A listing broker is a special agent: the broker is engaged to find a ready, willing,
      and able buyer, but cannot sign a purchase agreement for the seller or accept an offer on the
      seller's behalf unless separately authorized."
    related_terms: []
    items:
      - MS-1954-0081
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: loyalty
    definition: Loyalty is the fiduciary duty requiring the agent to put the principal's interests above
      their own or any third party's interests.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: (1) 'Loyalty' - the agent must put the interests of the principal above the interests
      of the agent or any third party.
    related_terms: []
    items:
      - MS-1954-0058
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: members
    definition: Individuals appointed to the Mississippi Real Estate Commission who may be reappointed
      by the Governor and from whom a Chairman is selected.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: Any member of the Commission may be reappointed by the Governor.
    related_terms: []
    items:
      - MS-1954-0021
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: nonresident broker
    definition: A nonresident broker is a real estate broker licensed in another state who does not hold
      an active Mississippi broker license but may cooperate with a Mississippi broker under a
      cooperative agreement.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: A responsible (principal) nonresident broker described herein is defined as an active,
      licensed responsible real estate broker of another state who does not possess an active
      responsible nonresident real estate broker's license issued by the Mississippi Real Estate
      Commission (MREC).
    related_terms: []
    items:
      - MS-1954-0071
      - MS-1954-0085
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: notification
    definition: Notification is a written notice to a licensee requiring them to appear before the
      Commission or an Administrative Hearing Officer for a hearing at a scheduled time.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: "U. Notice of Hearing: A written notification to a licensee to appear before the Commission,"
    related_terms: []
    items:
      - MS-1954-0079
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: obedience
    definition: Obedience is the fiduciary duty requiring the agent to obey any lawful instruction from
      the principal regarding the transaction.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: (2) 'Obedience' - the agent agrees to obey any lawful instruction from the principal in
      the execution of the transaction that is the subject of the agency.
    related_terms: []
    items:
      - MS-1954-0058
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: pass rate
    definition: The pass rate is the percentage of test‑takers who pass a licensing exam; Mississippi
      requires schools to keep an annual average pass rate of at least 65% on both broker and
      salesperson exams.
    source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954)
    quoted_text: (b) The school or pre-license education provider must maintain an annual average pass
      rate of at least sixty-five percent (65%) on each of the real estate broker’s license
      examination and the real estate salesperson’s license examination.
    related_terms: []
    items:
      - MS-1954-0046
      - MS-1954-0049
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: postpone
    definition: To postpone means to delay the presentation of offers until a later time, as instructed
      by the owner in writing.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: to postpone the presentation of other offers.
    related_terms: []
    items:
      - MS-1954-0069
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: promulgate
    definition: To issue or enact regulations.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: promulgate rules and regulations.
    related_terms: []
    items:
      - MS-1954-0026
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: ratification
    definition: Ratification occurs when a principal approves an unauthorized act after the fact,
      treating it as if it had been authorized from the beginning.
    source: "[REP Ref. Agency — § 3.4]"
    quoted_text: Agency by ratification arises when a person acts without authority and the principal,
      with knowledge of the facts, afterward accepts the benefit of the act.
    related_terms: []
    items:
      - MS-1954-0060
    status: draft
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: rules
    definition: Regulations that the Mississippi Real Estate Commission may issue or enact.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: may do all things necessary and convenient to promulgate rules and regulations.
    related_terms: []
    items:
      - MS-1954-0026
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: salesperson
    definition: A salesperson is a licensee who may perform brokerage activities only under a sponsoring
      broker and may receive compensation solely from that broker.
    source: REP Ref. Brokerage Practice
    quoted_text: A salesperson (or associate broker) may perform brokerage acts only under a sponsoring
      broker and may be compensated only by that broker.
    related_terms: []
    items:
      - MS-1954-0042
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: source
    definition: The origin of information that should be disclosed when the information is unverified.
    source: REP Ref. Agency
    quoted_text: should attribute unverified information to its source (
    related_terms: []
    items:
      - MS-1954-0025
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: specific written instructions
    definition: Specific written instructions are explicit, written directions from the property owner
      that authorize the broker to delay presenting other offers.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: specific, written instructions from the owner to postpone the presentation of other offers.
    related_terms: []
    items:
      - MS-1954-0069
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: supervision
    definition: Supervision is the duty of a responsible broker to oversee the real estate activities of
      licensees under them, ensuring they follow fundamentals of practice, ethics, and license law.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: to exercise supervision of their real estate activities for which a license is required.
    related_terms: []
    items:
      - MS-1954-0079
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: temporary license
    definition: A temporary license is issued to an applicant who has passed the Mississippi broker’s or
      salesperson’s examination and met all other licensure conditions; it is valid for one year
      following the first day of the month after issuance.
    source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954)
    quoted_text: A temporary license shall be valid for a period of one (1) year following the first day
      of the month after its issuance.
    related_terms: []
    items:
      - MS-1954-0047
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: unlawful
    definition: It is unlawful to engage in or advertise as a real estate broker or salesperson without
      first obtaining a license.
    source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954)
    quoted_text: it shall be unlawful for any person, partnership, association or corporation to engage
      in or carry on, directly or indirectly, or to advertise or to hold himself, itself or
      themselves out as engaging in or carrying on the business, or act in the capacity of, a real
      estate broker, or a real estate salesperson, within this state, without first obtaining a
      license.
    related_terms: []
    items:
      - MS-1954-0083
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: written offer
    definition: A written offer is a purchase offer that is documented in writing and must be presented
      to the owner unless the broker has specific written instructions to postpone presenting other
      offers.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: any other written offer received by the listing broker, whether from a prospective
      purchaser or from another licensee cooperating in a sale, shall be presented to the owner
    related_terms: []
