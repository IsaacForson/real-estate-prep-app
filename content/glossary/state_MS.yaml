  - term: duration
    definition: Duration refers to the length of time that something lasts; in real estate, it is the
      period of a person's interest in property, as part of an estate’s degree, quantity, and
      duration.
    source: REP Ref. Ownership, Title & Transfer
    quoted_text: An estate is the degree, quantity, and duration of a person's interest in real property.
    related_terms: []
    items:
      - MS-1954-0047
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: examination
    definition: In this context, the examination is the state licensing test that brokers and
      salespersons must pass to obtain their Mississippi real estate license.
    source: REP Ref. Property Condition & Environmental
    quoted_text: Where a rule varies by state, the state portion of the examination governs.
    related_terms: []
    items:
      - MS-1954-0046
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: fiduciary
    definition: A fiduciary duty is an obligation of the highest trust and loyalty that an agent owes to
      a principal when handling the principal's affairs.
    source: REP Ref. Agency
    quoted_text: The agent owes the principal fiduciary duties — duties of the highest trust and loyalty
      — because the agent is handling the principal's affairs.
    related_terms: []
    items:
      - MS-1954-0058
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: hire
    definition: To hire means to employ or engage a real estate salesperson to work under the broker’s
      sponsorship.
    source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954)
    quoted_text: (h) sign a form under penalty of perjury stating that the applicant will not hire any
      real estate salespersons for thirty-six (36) months from the date of approval of his or her
      active real estate salesperson’s license.
    related_terms: []
    items:
      - MS-1954-0042
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: joint listing
    definition: A joint listing is a property listing that involves cooperation between brokers, which
      the Mississippi broker must require before working with an out-of-state broker.
    source: Miss. Code Ann. §§ 73-35-1 et seq. (Real Estate Brokers License Law of 1954)
    quoted_text: The Mississippi broker shall require a listing or joint listing of the property involved.
    related_terms: []
    items:
      - MS-1954-0081
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: knowingly
    definition: Acting with awareness or intention, as when a licensee knows a fact but fails to disclose it.
    source: 30 Miss. Admin. Code Pt. 1601 (MREC Rules and Regulations)
    quoted_text: No licensee shall knowingly pay a commission, or other compensation to a licensed
      person knowing that licensee will in turn pay a portion or all of that which is received
    related_terms: []
    items:
      - MS-1954-0025
    status: approved
