  - term: supervising broker
    definition: A supervising broker is a licensed broker with whom a licensed salesperson is associated
      to sell, purchase, or negotiate for the sale, purchase, exchange, or renting of real estate.
    source: Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons)
    quoted_text: (24) "Supervising broker" means a licensed broker with whom a licensed salesperson is
      associated, directly, indirectly, regularly, or occasionally, to sell, purchase, or negotiate
      for the sale, purchase, exchange, or renting of real estate.
