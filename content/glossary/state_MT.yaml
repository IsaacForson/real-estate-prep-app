entries:
  - term: agent
    definition: An agent is a person authorized to act on behalf of another (the principal) and owes
      fiduciary duties of trust and loyalty to that principal.
    source: REP Ref. Agency
    quoted_text: "**Agency** is a relationship in which one person (the **agent**) is authorized to act
      on behalf of another (the **principal**) in dealings with third parties, and agrees to do so
      subject to the principal's control. The agent owes the principal **fiduciary** duties — duties
      of the highest trust and loyalty — because the agent is handling the principal's affairs."
    related_terms: []
