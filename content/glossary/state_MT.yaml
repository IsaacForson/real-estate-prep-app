  - term: vicarious liability
    definition: Vicarious liability means that a broker can be held responsible for a salesperson's
      actions within the scope of the license, unless the broker had no knowledge of the
      misrepresentation and the salesperson is not repeating the broker's own misrepresentation.
    source: Mont. Code Ann. §§ 37-51-101–37-51-607 (Real Estate Brokers and Salespersons)
    quoted_text: "(1) A party to a real estate transaction is not liable for a misrepresentation made by
      the party's agent or subagent unless: (a) the party has actual knowledge of the
      misrepresentation; or (b) the agent or subagent is repeating a misrepresentation made by the
      party."
    related_terms: []
    items:
      - MT-51-0037
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
