entries:
  - term: appointment
    definition: Appointment refers to the Governor's act of selecting individuals to serve as members of
      the Connecticut Real Estate Commission.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: (b) The commission shall consist of eight persons, electors of the state, appointed by
      the Governor.
    related_terms: []
    items:
      - CT-311-0024
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: associate
    definition: An associate broker is a licensed real estate professional who may conduct brokerage
      acts only while sponsored by a broker and may receive compensation solely from that broker.
    source: REP Ref. Brokerage Practice
    quoted_text: a salesperson (or associate broker) may perform brokerage acts only under a sponsoring
      broker and may be compensated only by that broker.
    related_terms: []
    items:
      - CT-311-0026
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: attachment
    definition: Attachment refers to the act of affixing or joining the residential condition report to
      the purchase agreement, binder, or contract as required by law.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: adding provisions re description of repairs, disclosure of areas repaired and
      attachment of report in Subdiv. (2)(H)(vi)
    related_terms: []
    items:
      - CT-311-0036
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: binder
    definition: A binder is a preliminary contract (such as a contract to purchase) that the buyer signs
      before the final agreement, and the residential condition report must be provided before this
      binder is executed.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: at any time prior to the prospective purchaser's execution of any binder, contract to purchase
    related_terms: []
    items:
      - CT-311-0035
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker
    definition: A real estate broker is a licensed person who may operate a brokerage and employ or
      sponsor licensees, performing brokerage acts for compensation on behalf of others.
    source: REP Ref. Brokerage Practice
    quoted_text: "**broker** may operate a brokerage and employ or sponsor licensees; a **salesperson**
      (or associate broker) may perform brokerage acts only under a sponsoring broker and may be
      compensated only by that broker."
    related_terms: []
    items:
      - CT-311-0024
      - CT-311-0026
      - CT-311-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: certification
    definition: In Connecticut real estate law, certification is an official credential (e.g., general
      or residential certification) that indicates an individual meets state‑established standards
      for appraisal or related regulated activities.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: inserted new Subdivs. (10) to (14), inclusive, defining “appraisal foundation”,
      “certification”, “federally related transaction”, “general certification” and “residential
      certification”
    related_terms: []
    items:
      - CT-311-0025
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: commission
    definition: The Connecticut Real Estate Commission is the state agency that oversees real estate
      licensing, consisting of licensed brokers, salespersons, and public members, with restrictions
      on political party representation.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: Not more than a bare majority of the commission shall be members of the same political
      party and there shall be at least one member from each congressional district.
    related_terms: []
    items:
      - CT-311-0024
      - CT-311-0029
      - CT-311-0030
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: condition report
    definition: A written residential condition report is a document describing the property's condition
      that must be given to a prospective buyer before they sign any binder, purchase contract,
      option, or lease with a purchase option.
    source: "[Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329 — Sec. 20-327b]"
    quoted_text: provide a written residential condition report ... to the prospective purchaser at any
      time prior to the prospective purchaser's execution of any binder, contract to purchase,
      option or lease containing a purchase option
    related_terms: []
    items:
      - CT-311-0035
      - CT-311-0036
    status: draft
    model: groq/openai/gpt-oss-120b
  - term: disclosure
    definition: Disclosure is the act of revealing information such as testing methods, inspection
      results, or repaired areas.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: disclosure of testing or inspection method, areas tested or inspected and testing or
      inspection results
    related_terms: []
    items:
      - CT-311-0035
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: governor
    definition: The Governor is the state official who appoints members to the Connecticut Real Estate
      Commission and fills vacancies by appointing successors.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: (b) The commission shall consist of eight persons, electors of the state, appointed by
      the Governor.
    related_terms: []
    items:
      - CT-311-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: license
    definition: A real estate license authorizes the holder to perform brokerage activities—such as
      listing, selling, buying, leasing, and managing property—for compensation on behalf of others,
      as defined by state law.
    source: REP Ref. Brokerage Practice
    quoted_text: "A real estate license authorizes the holder, for compensation and on behalf of others,
      to perform the acts state law defines as brokerage:"
    related_terms: []
    items:
      - CT-311-0025
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: majority
    definition: A majority means more than half of the members of the Connecticut Real Estate Commission.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: A majority of the members of the commission shall constitute a quorum for the exercise
      of the powers or authority conferred upon it.
    related_terms: []
    items:
      - CT-311-0029
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: political party
    definition: Connecticut law limits the Real Estate Commission’s political party makeup so that no
      more than a bare majority of its members may belong to the same party, and each congressional
      district must be represented by at least one member.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: Not more than a bare majority of the commission shall be members of the same political
      party and there shall be at least one member from each congressional district.
    related_terms: []
    items:
      - CT-311-0030
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: quorum
    definition: A quorum is the minimum number of commission members required to conduct business,
      defined as a majority of the members.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: A majority of the members of the commission shall constitute a quorum for the exercise
      of the powers or authority conferred upon it.
    related_terms: []
    items:
      - CT-311-0029
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: records
    definition: Records in a real estate agency are all documents and funds—such as earnest money,
      rents, security deposits, keys, and paperwork—that an agent must keep separate, maintain
      accurately, and turn over to the principal upon termination of the agency.
    source: REP Ref. Agency
    quoted_text: The agent must keep the principal's money and property separate from the agent's own,
      keep accurate records, and turn over or account for all funds and documents received in the
      course of the agency — earnest money, rents, security deposits, keys, documents.
    related_terms: []
    items:
      - CT-311-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: signature
    definition: A signature is a mark (including an electronic mark) that indicates a party's assent to
      a contract, and if a law requires a signature, an electronic signature satisfies that
      requirement.
    source: REP Ref. Contracts
    quoted_text: if a law requires a signature, an electronic signature satisfies the requirement
    related_terms: []
    items:
      - CT-311-0036
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: successor
    definition: A successor is a person appointed by the Governor to fill the unexpired term of a
      Connecticut Real Estate Commission member who has died, resigned, or been removed.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: the Governor shall appoint a successor to serve for the unexpired portion of the
      vacated term and until such member's successor is appointed and qualifies.
    related_terms: []
    items:
      - CT-311-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: termination
    definition: Termination of an agency relationship occurs when the purpose is fulfilled, the agreed
      term expires, the parties mutually agree to end it, or either party revokes or renounces the
      agency.
    source: REP Ref. Agency
    quoted_text: Completion (performance) of the purpose — the listed property closes; the buyer-client
      purchases a home.
    related_terms: []
    items:
      - CT-311-0026
      - CT-311-0027
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: vacancy
    definition: A vacancy occurs when a member of the Connecticut Real Estate Commission dies, resigns,
      or is removed, requiring the Governor to appoint a successor for the unexpired term.
    source: Conn. Gen. Stat. ch. 392, §§ 20-311 to 20-329
    quoted_text: Upon the death, resignation or removal of a member, the Governor shall appoint a
      successor to serve for the unexpired portion of the vacated term and until such member's
      successor is appointed and qualifies.
    related_terms: []
    items:
      - CT-311-0028
    status: quote_verified
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
