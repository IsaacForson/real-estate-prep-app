entries:
  - term: affordable housing
    definition: Affordable housing refers to housing opportunities intended for low‑ or moderate‑income
      households that meet specific governmental or charitable criteria, such as IRS 501(c)(3)
      status.
    source: 876 Ind. Admin. Code 8
    quoted_text: to a fund established for the sole purpose of providing affordable housing
      opportunities in Indiana that meets the requirements of Internal Revenue Code 501(c)(3)
    related_terms: []
