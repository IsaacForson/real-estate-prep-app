      - IN-1-0069
      - IN-1-0084
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: beneficiary
    definition: In an escrow or trust account, the beneficiary is the party whose written agreement is
      required before the broker may transfer earned interest to another fund.
    source: 876 Ind. Admin. Code 8
    quoted_text: If the beneficiary agrees in writing, the listing or selling broker holding the earnest
      money may voluntarily transfer any interest earned on the broker's escrow/trust account
    related_terms: []
    items:
      - IN-1-0084
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: broker
    definition: A broker is a licensed real estate agent who acts on behalf of a client (buyer, seller,
      landlord, or tenant) to perform brokerage activities such as listing, selling, or leasing
      property.
    source: REP Ref. Agency
    quoted_text: In real estate brokerage the principal is the client (a seller, buyer, landlord, or
      tenant who has engaged the brokerage), and the agent is the broker.
    related_terms: []
    items:
      - IN-1-0069
      - IN-1-0076
      - IN-1-0087
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: communication
    definition: Communication of acceptance means that an acceptance is effective only when it is
      communicated to the offeror or the offeror's agent, forming the contract at that moment.
    source: REP Ref. Contracts
    quoted_text: An acceptance is generally effective only when it is communicated to the offeror (or
      the offeror's agent). The contract is formed at that moment, not when the offeree signs.
    related_terms: []
    items:
      - IN-1-0099
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: disclosure
    definition: Disclosure is the seller's duty to reveal known facts about the property's condition on
      the residential sales disclosure form before settlement.
    source: 876 Ind. Admin. Code 9
    quoted_text: At or before settlement, the owner is required to disclose any material change in the
      physical condition of the property
    related_terms: []
    items:
      - IN-1-0066
      - IN-1-0067
      - IN-1-0068
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: earnest money
    definition: Earnest money is a buyer's deposit that demonstrates good faith in a real estate
      purchase; the broker must keep it separate from personal funds and account for it.
    source: REP Ref. Agency
    quoted_text: The agent must keep the principal's money and property separate from the agent's own,
      keep accurate records, and turn over or account for all funds and documents received in the
      course of the agency — earnest money, rents, security deposits, keys, documents.
    related_terms: []
    items:
      - IN-1-0060
      - IN-1-0069
      - IN-1-0087
      - IN-1-0099
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: escrow
    definition: An escrow account is a separate trust account where a brokerage holds money that belongs
      to others, such as earnest money, keeping it apart from the firm's own operating funds.
    source: REP Ref. Brokerage Practice
    quoted_text: Money a brokerage receives that belongs to others — earnest money, tenant security
      deposits, rents collected for owners, advance fees — is trust money and must be held in a
      designated trust or escrow account separate from the firm's operating funds.
    related_terms: []
    items:
      - IN-1-0091
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: interest
    definition: Interest is the money earned on funds held in an account, such as an escrow or trust account.
    source: REP Ref. Brokerage Practice
    quoted_text: requires it to be held in a trust account (sometimes with interest to the tenant)
    related_terms: []
    items:
      - IN-1-0069
      - IN-1-0084
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: knowledge
    definition: Knowledge, in the context of real estate disclosure, means actual notice — information a
      person truly possesses.
    source: REP Ref. Ownership, Title & Transfer
    quoted_text: Actual notice is knowledge a person in fact has.
    related_terms: []
    items:
      - IN-1-0067
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: listing
    definition: A listing agreement is a contract between a seller and a broker in which the broker is
      hired to market and sell the seller's property.
    source: REP Ref. Contracts
    quoted_text: In real estate, the most common contracts a licensee encounters are the purchase
      agreement (sales contract), the listing agreement, the buyer representation agreement, the
      lease, the option, and the land contract.
    related_terms: []
    items:
      - IN-1-0076
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: material change
    definition: A material change is any alteration in the property's physical condition that the seller
      must disclose to the buyer before settlement.
    source: 876 Ind. Admin. Code 9
    quoted_text: At or before settlement, the owner is required to disclose any material change in the
      physical condition of the property
    related_terms: []
    items:
      - IN-1-0066
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: reassignment application
    definition: A reassignment application is a form that a broker must have signed by themselves and
      the new broker company's managing broker when they wish to be assigned to a different broker
      company.
    source: 876 Ind. Admin. Code 8
    quoted_text: (c) If an unassigned broker subsequently wishes to be assigned, it shall be the
      responsibility of the broker to have a reassignment application signed by the broker and the
      new broker company's managing broker described in section 1(a) of this rule and to pay the
      reassignment fee established in 876 IAC 5-3-1.
    related_terms: []
    items:
      - IN-1-0090
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: registration form
    definition: A Branch Office Registration Form is the document that a broker company must submit to
      the Indiana Real Estate Commission before opening any branch office.
    source: 876 Ind. Admin. Code 8
    quoted_text: The broker company shall submit to the commission a Branch Office Registration Form
      prior to opening any branch office.
    related_terms: []
    items:
      - IN-1-0086
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: responsibility
    definition: Responsibility for earnest money means the duty to hold and safeguard the funds in an
      escrow or trust account until they are properly disbursed.
    source: 876 Ind. Admin. Code 8
    quoted_text: (c) All money shall be retained in the escrow/trust account so designated until
      disbursement of the money is properly authorized.
    related_terms: []
    items:
      - IN-1-0087
      - IN-1-0091
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: retention
    definition: Retention refers to the required period during which brokers must preserve certain
      records, such as advertising copies, to comply with record‑keeping rules.
    source: REP Ref. Brokerage Practice
    quoted_text: Licensees should keep copies of online advertising for the record-retention period (§ 10).
    related_terms: []
    items:
      - IN-1-0076
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: settlement
    definition: Settlement is the closing of a real estate transaction, the point at or before which the
      seller must disclose any material change in the property's physical condition.
    source: 876 Ind. Admin. Code 9
    quoted_text: At or before settlement, the owner is required to disclose any material change in the
      physical condition of the property
    related_terms: []
    items:
      - IN-1-0066
    status: approved
    reviewer: auto-publish
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
  - term: termination
    definition: Termination of an agency or listing occurs when the purpose is completed, the term
      expires, the parties mutually agree to end it, or the principal revokes or the agent renounces
      the relationship.
    source: "[REP Ref. Agency — § 4.1 Acts of the parties]"
    quoted_text: "- **Completion (performance)** of the purpose — the listed property closes; the
      buyer-client purchases a home. - **Expiration** of the term stated in the agreement. -
      **Mutual agreement** to end the relationship before the term or purpose is complete. -
      **Revocation** by the principal or **renunciation** by the agent."
    related_terms: []
    items:
      - IN-1-0090
    status: draft
    model: nvidia/nvidia/nemotron-3-super-120b-a12b
